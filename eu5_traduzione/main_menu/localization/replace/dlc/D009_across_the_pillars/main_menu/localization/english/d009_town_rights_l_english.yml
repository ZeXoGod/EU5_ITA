l_english:
 andalusi_refugee_town_rights: "Carta dei Rifugiati Andalusi"
 andalusi_refugee_town_rights_desc: "A questo insediamento sono state concesse carte speciali per attirare e stabilire gli artigiani, gli studiosi e i mercanti cacciati da al-'Andalus dalle pressioni esterne e dagli sconvolgimenti di un'epoca precedente. Questi rifugiati portano con sé i loro mestieri e la loro cultura, arricchendo le nostre città e migliorando l'efficienza della produzione locale. Accogliamo loro e le loro competenze nella speranza che mettano radici salde nelle nostre terre."
 andalusi_resettlement_town_rights: "Reinsediamento Andalusi"
 andalusi_resettlement_town_rights_desc: "Questo insediamento è stato aperto agli artigiani e ai contadini di al-'Andalus, reinsediati qui con carte che garantiscono le loro case, le loro botteghe e i diritti sull'acqua dei loro frutteti. Non arrivano come profughi incalzati da un esercito, ma come coloni invitati a restare, portando con sé i telai da seta, i canali d'irrigazione e le arti mercantili del sud. Notizie di simili condizioni viaggiano in fretta, e dove le prime famiglie hanno prosperato altre le seguono."
 andalusi_resettlement_golden_age_town_rights: "Reinsediamento dell'Età dell'Oro"
 andalusi_resettlement_golden_age_town_rights_desc: "Il nostro dominio dello stretto ha fatto di questo insediamento la destinazione prediletta dei talenti sradicati di al-'Andalus. Tessitori di seta e medici, matematici e maestri muratori arrivano a bordo di intere navi, e le carte che concediamo loro sono le più generose della penisola. Quello che era iniziato come un rivolo di coloni è diventato la fortuna di un'epoca, e le botteghe di qui lavorano a un ritmo che nessun porto rivale può eguagliare."
 iberian_aljama_charter: "Carta dell'Aljama"
 iberian_aljama_charter_desc: "La carta dell'#italic aljama#! formalizza lo status giuridico della comunità autonoma $muslim_ADJ$ di questa località, riconoscendole il diritto di amministrare i propri affari, riscuotere imposte interne e praticare la propria fede. Permettiamo alla comunità di mantenere le sue moschee, i suoi mercati e le sue istituzioni sociali in cambio di una proficua integrazione nella nostra economia. Questo assetto ha radici profonde nelle città di $iberia_region$ e riflette la realtà pratica di governare terre in cui la comunità $muslim_ADJ$ e quella $christian_ADJ$ condividono da tempo gli stessi spazi."
 mozarab_charter_town_rights: "Carta Mozarabica"
 mozarab_charter_town_rights_desc: "Abbiamo confermato l'antico patto con i #italic musta'ribun#! di questo insediamento, i cristiani arabizzati che per generazioni, sotto il nostro dominio, hanno conservato la loro liturgia e i loro libri latini. Il loro clero risponde al proprio vescovo e le loro dispute ai propri giudici, e in cambio essi versano la #italic jizya#! senza lamentarsi e non alzano mano contro di noi. L'insediamento ne è più quieto, e le voci di scrollarsi di dosso la nostra autorità trovano poco ascolto in strade che hanno già ottenuto ciò che si ribellerebbero per conquistare. Una comunità tanto sicura dei propri riti, tuttavia, ha ben poche ragioni per abbandonarli."
 medina_charter_town_rights: "Carta della Medina"
 medina_charter_town_rights_desc: "Abbiamo esteso a questo insediamento gli statuti della #italic medina#!, il quartiere urbano cinto da mura governato da un #italic qāyid#! e regolato da un #italic muḥtasib#! la cui autorità abbraccia mercati, strade e pubblica morale. Con queste carte, ricaviamo maggiori entrate dal tessuto urbano così strettamente organizzato. L'antico impianto stradale rallenta la costruzione di nuovi edifici, ma l'ordine che impone fa di questo insediamento una pietra angolare dell'amministrazione Magrebina."
 mzab_pentapolis_town_rights: "Pentapoli del Mzab"
 mzab_pentapolis_town_rights_desc: "A questo insediamento sono state concesse le carte comunitarie della valle del Mzab, dove le città Ibadite si governano sotto l'austero consiglio degli #italic 'azzāba#! — gli studiosi giuridico-religiosi che tengono nelle proprie mani tanto la legge quanto il commercio. Il patto comunitario apre il mercato al commercio regolato e vincola la comunità al suo posto, facendo dell'insediamento un'enclave stabile e autosufficiente. I borghesi di qui sono più saldi e più soddisfatti nella loro prosperità regolata."
 tribal_souk_town_rights: "Carta del Suq Tribale"
 tribal_souk_town_rights_desc: "Questo insediamento è stato designato come città di mercato tribale periodico — un #italic sūq#! dove le tribù dell'entroterra si incontrano per commerciare, comporre le dispute e rinnovare i patti reciproci. Le tribù traggono grande beneficio da questo riconoscimento e presidiano il mercato con notevole autonomia, riducendo il nostro controllo diretto sull'insediamento. Il volume di merci che transita di qui attira carovane dalle campagne circostanti."
 taifa_al_rais_town_rights: "Taifa dei Reïs"
 taifa_al_rais_town_rights_desc: "Questo porto risponde alla #italic ṭāʾifat al-ruyūs#!, la corporazione permanente dei capitani corsari le cui navi armate battono l'intera costa barbaresca da Salé a Tripoli. I capitani tengono il proprio consiglio sul porto, e la loro reputazione attira sulle banchine marinai esperti. I marinai non scarseggiano mai dove i reïs attraccano."
 sale_arsenal_town_rights: "Arsenale di Salé"
 sale_arsenal_town_rights_desc: "Il regio #italic dār al-ṣināʿa#! di Salé sorge alla foce del Bou Regreg, dove i carpentieri navali Merinidi pongono le chiglie e allestiscono le navi che portano la nostra bandiera sull'Atlantico. I cantieri tengono a portata di mano un corpo stabile di calafati e di piloti esperti, così che un equipaggio si trova in fretta ogni volta che uno scafo è pronto per l'acqua. Nessun altro porto di questa costa arma una flotta con tanta facilità."
 guich_charter_town_rights: "Carta del Guich"
 guich_charter_town_rights_desc: "Abbiamo stanziato una delle tribù #italic jayš#! su queste terre, concedendole campi e pascoli esenti dalle imposte del sultano in cambio delle spade che deve al trono. I suoi cavalieri si radunano alla prima chiamata alle armi, e le sue famiglie allevano i figli alla sella anziché all'aratro. Ciò che il tesoro rinuncia in entrate, l'esercito lo guadagna in uomini pronti."
