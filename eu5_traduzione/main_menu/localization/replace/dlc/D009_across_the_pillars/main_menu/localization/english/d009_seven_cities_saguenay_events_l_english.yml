l_english:

 seven_cities_saguenay.1.title: "Donnacona Raccontava Storie"
 seven_cities_saguenay.1.desc: "Dopo tre mesi risalendo il Saguenay la colonna ha raggiunto il paese che Donnacona descrisse a Cartier sessant'anni fa: un paese, disse il capo di Stadacona, di uomini dalla pelle chiara in mantelli di pelliccia, di montagne cariche d'oro e di fiumi che scorrono argento. Il paese reale è roccioso, boscoso e freddo. Non ci sono uomini dalla pelle chiara. Non c'è oro nei torrenti. I cacciatori Innu che la colonna incontra sono disposti a barattare pellicce e non offrono alcuna teoria su regni più oltre. [target_leader.GetName] è costretto a concludere che Donnacona raccontò a Cartier una storia che Cartier voleva sentire, nella speranza che Cartier portasse Donnacona in Francia e lo lasciasse tornare a casa vivo."
 seven_cities_saguenay.1.a: "Leviamo il campo. Il regno era un'invenzione. Restano le pellicce."
 seven_cities_saguenay.1.historical_info: "Donnacona, il capo di Stadacona alla testa del San Lorenzo, nutrì Cartier di un flusso costante di storie su un ricco regno chiamato Saguenay nell'interno della Nuova Francia durante l'inverno che Cartier trascorse a Stadacona nel 1535-36. Cartier portò Donnacona in Francia come ospite della corona; Donnacona morì in Francia senza aver mai più rivisto la sua casa. La leggenda del Saguenay persistette nell'esplorazione Francese dell'interno fino alla fine del Seicento, quando ormai la reale geografia del paese, laghi, fiumi e il commercio di pellicce che ne proveniva, era stata cartografata a sufficienza da mandare in pensione la leggenda."

 seven_cities_saguenay.2.title: "Una Confederazione Nativa, Qualche Pelliccia"
 seven_cities_saguenay.2.desc: "Il paese che abbiamo raggiunto non è il Saguenay della leggenda, ma è un paese che vale la pena conoscere. Gli Innu hanno una lasca confederazione di villaggi lungo l'alto fiume e i laghi oltre, con diritti di caccia che si estendono nella foresta boreale fin dove la colonna riesce a vedere. Commerciano in pellicce, pesce essiccato, canoe di corteccia di betulla e una piccola quantità di rame nativo proveniente da fonti più a nord. Sono disposti a ricevere un'ambasciata Francese. Non c'è oro, non c'è argento, non c'è alcun re dalla pelle chiara. C'è un'economia delle pellicce funzionante. [target_leader.GetName] ordina di costruire un emporio alla confluenza."
 seven_cities_saguenay.2.a: "Costruiamo l'emporio. Il commercio di pellicce pagherà il viaggio."
 seven_cities_saguenay.2.historical_info: "I bacini del San Lorenzo e del Saguenay furono i punti d'ingresso del commercio Francese di pellicce che, nel corso del Seicento e del primo Settecento, attirò mercanti, missionari e coloni nel profondo dell'interno del Nord America. Il commercio si reggeva su intermediari indigeni, principalmente gli Uroni-Wendat e gli Algonchini, e su una rete di empori che si estese gradualmente a ovest attraverso i Grandi Laghi e nel bacino del Mississippi. La leggenda del Saguenay fu, in questo senso, una profezia che si autoavverò: il paese della leggenda non era d'oro ma di pellicce, e i Francesi alla fine si arricchirono con quel commercio."

 seven_cities_saguenay.3.title: "Il Regno del Nord Ritrovato"
 seven_cities_saguenay.3.desc: "Il paese descritto dalla leggenda è reale, e la colonna lo ha raggiunto. Oltre il secondo grande lago, nel paese che gli Innu chiamano soltanto la terra fredda, c'è un insediamento di forse tremila persone dalla pelle chiara in lunghi mantelli di pelliccia, che parlano una lingua mai sentita da nessun membro della colonna ma con parole che il latinista del seguito identifica come norreno. Hanno una sala del consiglio con il tetto di rame e una piccola camera cerimoniale in cui sono esposti lavori in oro di evidente fattura nordeuropea. Sapevano del nostro arrivo sulla costa da due generazioni e ci aspettavano perché li trovassimo. Il cronista scrive per tutta la notte. [target_leader.GetName] manda a chiedere rinforzi all'alba."
 seven_cities_saguenay.3.a: "Firmiamo il trattato. Un regno cristiano perduto è finalmente ritrovato."
 seven_cities_saguenay.3.historical_info: "La leggenda di una popolazione Norrena sopravvissuta nell'interno del Canada non è mai stata comprovata, nonostante occasionali affermazioni contrarie. Gli insediamenti Norreni in Groenlandia furono abbandonati nel Quattrocento; nessuna prova archeologica sostiene alcuna continuità Norrena nel Nord America continentale oltre brevi contatti uno o due secoli prima. La persistenza della leggenda nell'esplorazione Francese del paese si spiega al meglio come una versione trapiantata delle storie di Norumbega e del Vinland, che a loro volta discendevano da un unico insieme di saghe medievali Islandesi la cui geografia reale era stata dimenticata quando la leggenda raggiunse la corte Francese."

 seven_cities_saguenay.10.title: "Il Re oltre le Rapide"
 seven_cities_saguenay.10.desc: "Il giovane ha svernato alla nostra corte da quando un viaggio di ritorno lo ha portato oltre l'oceano, e ha imparato abbastanza della nostra lingua da essere pericoloso con essa. Interrogato sul paese oltre le grandi rapide, [target_character.GetName] descrive il regno del Saguenay: oro e pietre rosse nella roccia, uomini dalla pelle pallida come la nostra che si vestono di panno di lana e, quando il suo uditorio sembra volerli, uomini con una gamba sola e uomini che volano. Gli scrivani notano che il regno si arricchisce di una nuova provincia per ogni dubbio sollevato contro di esso. Si trova, si preoccupa di aggiungere, molto lontano a monte, e nessuno lo troverà senza di lui."
 seven_cities_saguenay.10.a: "Diamogli il passaggio di ritorno, e con esso l'orecchio del comandante."
 seven_cities_saguenay.10.b: "Teniamolo a corte. Il racconto vale più del narratore."
 saguenay_chiefs_son_sails_tt: "[target_character.GetName] torna oltre l'oceano come nostra guida e interprete"
 seven_cities_saguenay.10.historical_info: "Jacques Cartier portò in Francia i figli del capo di Stadacona Donnacona nel 1534 e li riportò a casa l'anno seguente; nel 1536 portò Donnacona stesso, che trascorse i suoi ultimi anni a raccontare alla corte Francese del regno del Saguenay, del suo oro, dei suoi uomini bianchi in panno di lana e, man mano che gli uditori si facevano più illustri, dei suoi uomini con una gamba sola e di quelli che volavano come pipistrelli. Lo schema era costante: il regno acquisiva qualunque cosa i suoi ascoltatori desiderassero di più che avesse, e si trovava sempre un fiume più in là di dove chiunque fosse arrivato. Donnacona morì in Francia intorno al 1539 senza rivedere Stadacona. Le storie gli sopravvissero per un secolo e mezzo."

 seven_cities_saguenay.11.title: "Il Male Bianco"
 seven_cities_saguenay.11.desc: "Comincia dalle gengive. Il chirurgo lo chiama il male di terra e non ha rimedi. Le gambe degli uomini si anneriscono e si gonfiano, vecchie cicatrici si riaprono come fossero nuove, i denti si allentano nelle loro sedi, e le mani più forti cedono per prime, cosa che nessuno sa spiegare. Otto sono morti e un quarto della ciurma non regge più una guardia. Il paese freddo è da qualche parte sottovento, e la domanda sul cassero è se ciò che ci attende a terra possa essere più crudele di ciò che è già a bordo."
 seven_cities_saguenay.11.a: "Dirigiamoci verso la costa, e chiediamo aiuto alla sua gente."
 seven_cities_saguenay.11.b: "Salassiamo i malati e manteniamo la rotta."
 saguenay_annedda_cure: "#Y I parenti della nostra guida ci mostrano l'albero la cui corteccia e i cui aghi, bolliti, rimettono in piedi gli uomini in punto di morte nel giro di pochi giorni#!"
 saguenay_strangers_mercy: "#Y La pietà degli sconosciuti giunge lentamente, ma giunge#!"
 seven_cities_saguenay.11.historical_info: "Lo scorbuto uccise un quarto degli uomini di Cartier nell'inverno del 1535-36 a Stadacona, finché Domagaya, uno dei figli del capo che era stato in Francia, mostrò loro come far bollire la corteccia e gli aghi di un albero che gli Irochesi chiamavano annedda in una bevanda. Uomini che non riuscivano a stare in piedi camminavano nel giro di una settimana, e Cartier scrisse che tutti i dottori di Lovanio e Montpellier insieme non avrebbero potuto fare con tutte le loro medicine ciò che l'albero fece in otto giorni. L'identità dell'annedda andò poi perduta, la cura fu dimenticata dall'Europa per duecento anni, e lo scorbuto continuò a uccidere più marinai di tutte le battaglie navali dell'età della vela messe insieme."

 seven_cities_saguenay.12.title: "Diamanti al Capo"
 seven_cities_saguenay.12.desc: "Sotto il capo grigio alla svolta del fiume, la riva stessa scintilla. La parete rocciosa è solcata da pietre bianche che lampeggiano come gemme tagliate, e tra di esse corre un metallo giallo che prende una bella lucentezza se strofinato con un pollice bagnato. A mezzogiorno metà delle guardie è a terra con i barili, e le parole per descrivere ciò che i barili contengono sono già in corso di scelta per il dispaccio in patria. Il capocannoniere, figlio di un minatore, rigira a lungo tra le dita un grumo giallo e chiede il permesso di parlare chiaramente prima che venga scritto alcunché."
 seven_cities_saguenay.12.a: "Riempiamo ogni barile. Finalmente una prova per gli scettici in patria."
 seven_cities_saguenay.12.b: "Lasciamo che il figlio del minatore saggi la roccia prima che qualcuno si vanti."
 saguenay_barrels_ring_true: "#Y Contro ogni precedente, il saggio regge: nel capo c'è vero metallo#!"
 saguenay_glitter_and_air: "#Y Quarzo e oro degli sciocchi, una stiva piena, e la storia arriverà in patria prima di noi#!"
 seven_cities_saguenay.12.historical_info: "L'ultima spedizione di Cartier caricò undici barili di minerale d'oro e una grande quantità di diamanti a Cap Rouge nel 1542 e li portò trionfalmente in patria, abbandonando Roberval e la colonia per farlo. Saggiati in Francia, l'oro si rivelò pirite di ferro e i diamanti quarzo, e la delusione entrò nella lingua: #italic faux comme un diamant du Canada#!, falso come un diamante del Canada, divenne proverbiale nel giro di una generazione. Il capo mantenne comunque il nome di Cap Diamant, e la città di Québec sorge oggi sopra lo scherzo."

 seven_cities_saguenay.13.title: "Il Raduno a Tadoussac"
 seven_cities_saguenay.13.desc: "Le canoe cominciano ad arrivare la mattina dopo che abbiamo gettato l'ancora, da monte e dalla riva opposta, basse sull'acqua sotto balle di pellicce invernali. È un raduno, spiega l'interprete: i popoli del paese freddo si incontrano ogni anno a questa foce per commerciare prima dell'arrivo del ghiaccio, e hanno scambiato le nostre vele per la più grande canoa commerciale mai costruita. Lo scrivano rigira una pelle di castoro, poi un'altra, poi posa la penna per un'aritmetica di tutt'altro genere. Il regno dell'oro può essere una diceria, dice. I castori no."
 seven_cities_saguenay.13.a: "Apriamo le stive e commerciamo. Le leggende si conservano; le pellicce si vendono."
 seven_cities_saguenay.13.b: "Non abbiamo attraversato un oceano per inseguire castori. Risaliamo il fiume!"
 seven_cities_saguenay.13.historical_info: "Tadoussac, alla foce del Saguenay, era un luogo di raduno commerciale ben prima che vi sorgesse un qualsiasi emporio Europeo: le bande Innu e Algonchine si incontravano alla foce del fiume ogni stagione per scambiare pellicce e rame, e le prime navi Francesi si ormeggiarono semplicemente in un mercato già esistente. Pierre de Chauvin costruì lì il primo emporio permanente della Francia nel 1600, anni prima della fondazione di Québec. Il regno del Saguenay non fu mai trovato risalendo il fiume, ma le pellicce che scesero lungo di esso finanziarono la Nuova Francia per due secoli, il che è più di quanto siano riusciti a fare la maggior parte dei regni reali."

