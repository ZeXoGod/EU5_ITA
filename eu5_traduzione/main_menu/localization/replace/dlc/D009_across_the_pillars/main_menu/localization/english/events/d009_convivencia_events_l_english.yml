l_english:
 d009_convivencia.1.title: "Le Tre Comunità"
 d009_convivencia.1.entry: "$d009_convivencia.1.title$"
 d009_convivencia.1.desc: "Nelle nostre città le campane delle chiese, il richiamo del mu'aḏḏin e la candela del Sabato scandiscono le stesse ore nelle stesse strade, e lo fanno da generazioni. Artigiani Mudéjar, prestatori e medici di fede [ShowReligionAdjective('judaism')] e borghesi di fede [ShowReligionGroupAdjective('christian')] condividono mercati, botteghe, cortili e spesso aspre dispute, tutti tenuti insieme da una fragile #italic convivencia#! più antica dei nostri nonni, sopravvissuta a guerre, pestilenze e agli umori mutevoli dei re che ci hanno preceduto. I consiglieri ci sollecitano ogni giorno a una mano più ferma; le aljama ci sollecitano con altrettanta forza a fare l'opposto. Quanto da vicino la corona dovrebbe vigilare sui termini con cui le tre comunità possono vivere fianco a fianco?"
 d009_convivencia.1.a: "Lasciamo che le aljama si governino da sole."
 d009_convivencia.1.a.tt: "Le comunità di fede [ShowReligionGroupAdjective('muslim')] ed [ShowReligionAdjectiveWithNoTooltip('judaism')] di [target_location.GetName] si fanno più stabili sotto il nostro governo"
 d009_convivencia.1.b: "Favoriamo i nostri sudditi di fede [ShowReligionGroupAdjectiveWithNoTooltip('christian')]."
 d009_convivencia.1.b.tt: "Le comunità di fede [ShowReligionGroupAdjective('muslim')] ed [ShowReligionAdjectiveWithNoTooltip('judaism')] di [target_location.GetName] si fanno inquiete sotto il nostro governo"
 d009_convivencia.1.historical_info: "#italic Convivencia#!, ovvero coesistenza, è il termine con cui gli storici indicano i secoli in cui Cristiani, Musulmani ed Ebrei vissero fianco a fianco nell'Iberia medievale con vari gradi di tolleranza, in particolare in città come Toledo, Siviglia e Saragozza. Non fu mai piena uguaglianza: i non Cristiani pagavano tasse speciali e subivano restrizioni reali, ma essa permise un livello di scambio culturale e intellettuale che produsse, tra l'altro, le grandi scuole di traduzione di Toledo."

 d009_convivencia.2.title: "La Sinagoga del Tránsito"
 d009_convivencia.2.entry: "$d009_convivencia.2.title$"
 d009_convivencia.2.desc: "[target_character.GetName], nostro tesoriere e più stretto confidente tra i membri dell'aljama, desidera erigere una nuova sinagoga nel quartiere di fede [ShowReligionAdjective('judaism')] nel cuore di [ShowLocationName('toledo')], con le pareti scolpite con i salmi di Davide accanto allo stemma di [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip] e i soffitti dorati in uno stile che, giura [target_character.GetSheHe], rivaleggerà con qualunque cosa il capitolo della cattedrale abbia commissionato in una generazione. Sarebbe una delle più belle case di preghiera mai costruite da mani di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] sul nostro suolo, un monumento alla sua ascesa quanto alla sua fede, e un segno molto pubblico, per chi voglia leggerlo, di quanto lontano i consigli di [target_character.GetHerHis] lo abbiano portato alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 d009_convivencia.2.a: "Concediamo a [target_character.GetHimHer] il permesso di costruire e accogliamo [target_character.GetHimHer] alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 d009_convivencia.2.a.entry: "Concediamo a Samuel ha-Levi Abulafia il permesso di costruire e accogliamolo alla nostra corte."
 d009_convivencia.2.b: "Rifiutiamo: un tale splendore attira invidia e sospetto."
 d009_convivencia.2.b.tt: "La comunità di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] di [ShowLocationNameWithNoTooltip('toledo')] avverte la freddezza della corona"
 d009_convivencia.2.historical_info: "La Sinagoga del Tránsito a Toledo fu costruita intorno al 1356 da Samuel ha-Levi Abulafia, tesoriere del re Pietro I di Castiglia, e rimane uno dei migliori esempi sopravvissuti di architettura sinagogale Mudéjar, con le pareti scolpite di salmi ebraici accanto allo stemma reale di Castiglia. La straordinaria ascesa di ha-Levi a corte finì male: arrestato in seguito, morì sotto tortura per ordine del re, accusato di appropriazione indebita, a ricordare quanto precaria potesse essere la posizione anche dei cortigiani Ebrei più fidati."
 d009_convivencia_2_judaism_population_tt: "Toledo ha una popolazione Ebraica"

 d009_convivencia.3.title: "Hasdai Crescas e la Questione della Fede"
 d009_convivencia.3.entry: "$d009_convivencia.3.title$"
 d009_convivencia.3.desc: "[target_character.GetName], rabbino e [ShowArtistTypeName('philosopher')] di notevole fama tra la propria gente e non poca notorietà tra la nostra, chiede udienza alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetSheHe|U] spera di sostenere davanti a noi che ragione e rivelazione non debbano essere in contrasto, che i filosofi tanto ammirati dai nostri studiosi non furono mai così favorevoli alla dottrina di fede [ShowReligionGroupAdjective('christian')] come fingono, e che le dispute pubbliche regolarmente imposte alla sua gente poggiano su una logica aristotelica presa in prestito e del tutto inadatta alle questioni di fede. Qualunque cosa pensino della missione i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], e ne pensano moltissimo, la dottrina di [target_character.GetShortNameWithNoTooltip] è autentica, e si dice che i suoi argomenti siano scomodamente difficili da confutare."
 d009_convivencia.3.a: "Riceviamo [target_character.GetHimHer] e ascoltiamo i suoi argomenti."
 d009_convivencia.3.a.entry: "Riceviamo Hasdai Crescas e ascoltiamo i suoi argomenti."
 d009_convivencia.3.a.tt: "Le comunità di fede [ShowReligionAdjective('judaism')] del regno si rincuorano per il gesto"
 d009_convivencia.3.b: "Congediamo [target_character.GetHimHer]."
 d009_convivencia.3.b.entry: "Congediamo Hasdai Crescas."
 d009_convivencia.3.historical_info: "Hasdai Crescas fu un importante rabbino e filosofo dell'ebraismo aragonese, attivo soprattutto a Barcellona e Saragozza. La sua opera maggiore, #italic Or Adonai#! (Luce del Signore), fu una critica serrata al predominio della filosofia aristotelica sulla teologia ebraica, sostenendo che fede e volontà divina non potessero essere del tutto subordinate alla logica aristotelica. Visse i devastanti pogrom del 1391, in cui perse la vita anche suo figlio, e gran parte dei suoi scritti successivi risponde direttamente a quella catastrofe."
 d009_convivencia_3_judaism_population_tt: "Il regno ha una popolazione Ebraica"

 d009_convivencia.4.title: "Gli Artigiani Mudéjar"
 d009_convivencia.4.entry: "$d009_convivencia.4.title$"
 d009_convivencia.4.desc: "Da quando i nostri sudditi Mudéjar hanno ottenuto il diritto di governare la propria aljama, la comunità autogovernata che conserva mercati, tribunali e mestieri propri, per carta e privilegio, i loro capomastri, piastrellisti e stuccatori si sono fatti più audaci nel mostrare ciò che sanno fare, fondendo archi a ferro di cavallo e stucchi scolpiti con le forme predilette dai nostri muratori. Commissionare loro l'ala di un palazzo o un padiglione da giardino annuncerebbe, in pietra e stucco, che la carta da noi concessa non era un gesto vuoto. Non ogni vescovo o barone la vedrà così, e i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] raramente perdono l'occasione di lamentarsene."
 d009_convivencia.4.a: "Commissioniamo un'ala di palazzo in stile Mudéjar."
 d009_convivencia.4.b: "Limitiamo le nostre commissioni ad artigiani di fede [ShowReligionGroupAdjectiveWithNoTooltip('christian')]."
 d009_convivencia.4.historical_info: "L'arte e l'architettura Mudéjar, lo stile prodotto da artigiani Musulmani al servizio di sovrani Cristiani, che fonde archi a ferro di cavallo, piastrelle geometriche e stucchi scolpiti con forme gotiche e romaniche, fiorì in tutta la Castiglia e l'Aragona proprio perché i monarchi Cristiani lo commissionavano attivamente. L'Alcázar di Siviglia, costruito per re Pietro I negli anni 1360 in gran parte da artigiani Mudéjar di Granada e Toledo, resta l'esempio più celebre di questo mecenatismo regio."

 d009_convivencia.5.title: "I Finanzieri di Fede [ShowReligionAdjectiveWithNoTooltip('judaism')] e la Corona"
 d009_convivencia.5.entry: "$d009_convivencia.5.title$"
 d009_convivencia.5.desc: "Il tesoro [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] si assottiglia più spesso di quanto vorremmo ammettere: guerre, cantieri e il mantenimento di una [ROOT.GetCountry.GetGovernment.GetCourtTitle] degna di questo nome richiedono più di quanto le ordinarie imposte possano fornire in tempo utile.\n\nI prestatori e gli appaltatori fiscali delle aljama sono pronti con un credito che i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], vincolati dal diritto canonico e da semplice orgoglio, raramente concedono, e le loro condizioni, qualunque cosa ne dica il pulpito, sono di solito le più eque disponibili [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetNameWithNoTooltip].\n\nI nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] mormorano senza sosta di usura e di indebita influenza alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], e non senza ragione, ma il denaro tratto dall'aljama vale esattamente quanto quello tratto da qualunque borsa di fede [ShowReligionGroupAdjective('christian')]."
 d009_convivencia.5.a: "Appoggiamoci ai finanzieri di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] per riempire il tesoro."
 d009_convivencia.5.b: "Limitiamo il loro prestito di denaro e soddisfiamo il [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]."
 d009_convivencia.5.b.entry: "Limitiamo il loro prestito di denaro e soddisfiamo il clero."
 d009_convivencia.5.historical_info: "Finanzieri, appaltatori fiscali e medici di corte Ebrei furono una presenza costante nelle corti Cristiane iberiche per tutto il Medioevo, poiché il divieto canonico dell'usura per i Cristiani lasciava gran parte del mercato del credito ai prestatori Ebrei. Figure come Yehuda de la Cavalleria, che nel XIII secolo gestì le finanze reali dei re d'Aragona, raggiunsero un'influenza reale ai massimi livelli della corte, sebbene la loro prominenza ne facesse anche parafulmini del risentimento ogni volta che le tasse salivano o le guerre andavano male."

 d009_convivencia.6.title: "Un Caso davanti ai Tribunali dell'Aljama"
 d009_convivencia.6.entry: "$d009_convivencia.6.title$"
 d009_convivencia.6.desc: "Anni dopo aver stabilito quanto da vicino la corona dovesse vigilare sui tribunali dell'aljama, è giunto finalmente da noi un caso che mostrerà se quella politica regge nella pratica. Un mercante di lana di fede [ShowReligionGroupAdjective('christian')] e un conciatore di fede [ShowReligionGroupAdjective('muslim')] si contendono un contratto andato male, e il giudice stesso dell'aljama ha già pronunciato la sentenza, appellandosi a una legge più antica dei nostri nonni. Il mercante ora ricorre direttamente a noi, chiedendo che la giustizia regia annulli un verdetto al quale non aveva mai accettato di sottoporsi."
 d009_convivencia.6.a: "Confermiamo la sentenza del tribunale dell'aljama."
 d009_convivencia.6.a.tt: "Le comunità di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] ed [ShowReligionAdjective('judaism')] considerano la sentenza una prova che ci si può fidare della parola della corona"
 d009_convivencia.6.b: "Annulliamo la sentenza e portiamo il caso sotto la legge della corona."
 d009_convivencia.6.b.tt: "Le comunità di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] ed [ShowReligionAdjective('judaism')] vedono svanire in silenzio l'autorità dei tribunali dell'aljama"
 d009_convivencia.6.historical_info: "Le aljama, le comunità Musulmane ed Ebraiche autogovernate dell'Iberia Cristiana, godevano in genere di autonomia giudiziaria, compresi tribunali propri che applicavano la legge Musulmana o Ebraica alle dispute interne, in base a carte concesse dalla corona. Questo caso è inventato, ma la tensione che drammatizza era costante: la giustizia regia e quella dell'aljama si sovrapponevano con disagio, e quanto una corona fosse disposta a lasciare l'ultima parola ai tribunali comunitari variava enormemente da regno a regno e da secolo a secolo."

 d009_convivencia.7.title: "Un Visir di Fede [ShowReligionAdjectiveWithNoTooltip('judaism')] per [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_convivencia.7.entry: "Un Visir Ebreo"
 d009_convivencia.7.desc: "Tra le famiglie di fede [ShowReligionAdjective('judaism')] stabilitesi entro le mura di [ShowLocationName('granada')], [target_character.GetName] ha acquisito una padronanza di tributi, imposte e trattati, e una evidente disinvoltura in compagnia di emissari di fede [ShowReligionGroupAdjective('christian')] e [ShowReligionGroupAdjective('muslim')] ugualmente, che ha attirato più di una volta quest'anno lo sguardo del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle].\n\nNominare [target_character.GetHimHer] a un alto incarico porrebbe saldamente una mano di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] sugli ingranaggi di una [ROOT.GetCountry.GetGovernment.GetCourtTitle] di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')], un assetto con un vero precedente nella lunga storia di al-'Andalus, dai califfi omayyadi in poi, ma che i devoti tra i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], e la popolazione in generale, non accoglieranno in silenzio, qualunque servizio [target_character.GetSheHe] possa rendere al tesoro."
 d009_convivencia.7.a: "Nominiamo [target_character.GetHimHer] visir."
 d009_convivencia.7.a.entry: "Nominiamolo visir."
 d009_convivencia.7.b: "Passiamo oltre [target_character.GetHimHer] a favore di un candidato di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]."
 d009_convivencia.7.b.entry: "Passiamo oltre a favore di un candidato Musulmano."
 d009_convivencia.7.historical_info: "Il più celebre precedente reale di un visir Ebreo nell'Iberia Musulmana è Samuel ibn Naghrilla, che nell'XI secolo divenne visir del regno di taifa di Granada, seguito dal figlio Giuseppe, che mantenne la stessa carica finché non fu ucciso in un massacro della comunità Ebraica di Granada nel 1066. L'emirato nasride che governò Granada dal XIII secolo in poi ereditò una cultura di corte in cui simili nomine, pur mai prive di polemiche, avevano un fondamento storico."
 d009_convivencia_7_judaism_population_tt: "Il regno ha una popolazione Ebraica"
