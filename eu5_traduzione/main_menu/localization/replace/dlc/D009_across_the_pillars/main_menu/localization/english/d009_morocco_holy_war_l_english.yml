l_english:
 summon_volunteers_of_the_faith: "Convoca i Volontari della Fede"
 summon_volunteers_of_the_faith_desc: "Chiama le tribù di fede [ShowReligionGroupAdjective('muslim')] a inviare guerrieri santi alla [jihad|e]. Una delle tribù Berbere forma un reggimento mercenario secondo il proprio stile di combattimento, che si tratti di cavalieri rapidi, fanti velati o di una schiera equilibrata, e ravviva il fervore religioso della [jihad]. Un regno che ha organizzato i suoi guerrieri santi in un corpo permanente, o i cui ceti hanno promesso i propri volontari alla causa, mette in campo una schiera più potente. Ogni tribù può rispondere una sola volta alla volta, e ascolta di nuovo la chiamata solo quando il suo reggimento viene sciolto."
 summon_volunteers_of_the_faith_effect_tt: "Aumenta lo #Y zelo religioso#! della [jihad|e] di #G 5#!"
 summon_volunteers_cavalry_tier2_tt: "Recluta 10 unità di Cavalleria Leggera, 4 di Fanteria Leggera e 2 di Cavalleria Pesante"
 summon_volunteers_cavalry_tier1_tt: "Recluta 8 unità di Cavalleria Leggera e 4 di Fanteria Leggera"
 summon_volunteers_cavalry_tier0_tt: "Recluta 6 unità di Cavalleria Leggera e 3 di Fanteria Leggera"
 summon_volunteers_infantry_tier2_tt: "Recluta 8 unità di Fanteria Pesante, 4 di Fanteria Leggera e 1 di Cavalleria Pesante"
 summon_volunteers_infantry_tier1_tt: "Recluta 6 unità di Fanteria Pesante e 4 di Fanteria Leggera"
 summon_volunteers_infantry_tier0_tt: "Recluta 4 unità di Fanteria Pesante e 4 di Fanteria Leggera"
 summon_volunteers_mixed_tier2_tt: "Recluta 7 unità di Cavalleria Leggera, 5 di Fanteria Leggera e 2 di Fanteria Pesante"
 summon_volunteers_mixed_tier1_tt: "Recluta 6 unità di Cavalleria Leggera e 5 di Fanteria Leggera"
 summon_volunteers_mixed_tier0_tt: "Recluta 4 unità di Cavalleria Leggera e 4 di Fanteria Leggera"
 choose_tribe_for_volunteers: "Scegli una Tribù"
 summon_volunteers_no_tribes: "@trigger_no! Nessuna tribù è libera di rispondere alla chiamata."
 ghuzat_regiment_name: "Volontari della Fede"
 summon_volunteers_bureaucracy_bonus_tt: "Il nostro corpo permanente di volontari ghazi ingrossa il reggimento con guerrieri più numerosi e migliori."
 proclaim_the_ghazw: "Proclama il Ḡazw"
 proclaim_the_ghazw_desc: "Proclama un'incursione di frontiera, oltre lo Stretto, in una delle province di confine del nemico di fede [ShowReligionGroupAdjective('christian')]. Ogni località indifesa, priva di forte e di esercito, viene saccheggiata delle sue ricchezze e lasciata più povera, spingendo il suo signore a radunare le forze contro di noi."
 proclaim_the_ghazw_tt: "Riduce lo zelo religioso della [jihad|e] di #R 10#! e fa regredire la sua preparazione di #R 10#!"
 proclaim_the_ghazw_loot_tt: "Saccheggia ogni località indifesa della provincia, priva di forte e di esercito, per un valore stimato di [actor.MakeScope.ScriptValue('ghazw_estimated_total')|0+=][gold_i], e ne riduce lo sviluppo"
 choose_province_for_ghazw: "Scegli una Provincia da Saccheggiare"
 proclaim_the_ghazw_no_provinces: "@trigger_no! Il nemico non possiede alcuna provincia di confine indifesa esposta a un'incursione."
 cross_the_strait: "Cavalca i Mari"
 cross_the_strait_desc: "Noleggia una flotta mercenaria di trasporti in uno dei nostri porti, così che gli eserciti del Magreb possano attraversare il [ShowLocationName('strait_of_gibraltar')] verso al-'Andalus. Vengono reclutati trasporti sufficienti a traghettare circa un quarto del nostro esercito, e la traversata può essere ripetuta in qualsiasi momento della guerra santa."
 cross_the_strait_effect_tt: "Recluta trasporti per traghettare circa un quarto del nostro esercito a un costo in [gold|e] che cresce con la flotta, e consuma #R 10#! dello zelo religioso della [jihad|e]"
 cross_the_strait_fleet_name: "Flotta della Traversata"
 cross_the_strait_hire_tt: "Noleggia la flotta per traghettare le nostre truppe oltre lo Stretto"
 choose_port_for_crossing: "Scegli un Porto"
 cross_the_strait_no_ports: "@trigger_no! Non possediamo alcun porto da cui far partire la traversata."
 raid_the_shores: "Saccheggia le Coste"
 raid_the_shores_desc: "Scatena un'incursione corsara sulla costa di una delle province del nemico di fede [ShowReligionGroupAdjective('christian')] già razziate dai nostri corsari. Ogni località costiera indifesa, priva di forte e di esercito, viene saccheggiata, e un contadino su cento, di fede [ShowReligionAdjective('catholic')], viene deportato in schiavitù nella nostra capitale."
 raid_the_shores_tt: "Riduce lo zelo religioso della [jihad|e] di #R 10#! e fa regredire la sua preparazione di #R 10#!"
 raid_the_shores_loot_tt: "Saccheggia ogni località costiera indifesa della provincia selezionata, e deporta in schiavitù un contadino su cento di fede [ShowReligionAdjective('catholic')]"
 choose_province_for_shore_raid: "Scegli una Costa da Saccheggiare"
 raid_the_shores_no_provinces: "@trigger_no! Il nemico non possiede alcuna costa affacciata su una zona marittima in cui siano attivi i nostri [privateers|e]."
