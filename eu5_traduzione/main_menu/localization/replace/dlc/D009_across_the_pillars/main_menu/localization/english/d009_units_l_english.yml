l_english:
 a_ahl_tinmal_spearmen: "Lancieri Ahl Tīnmal"
 a_ahl_tinmal_spearmen_desc: "I $a_ahl_tinmal_spearmen$ sono i lancieri montanari dell'Atlante di Tīnmal: il rifugio di Ibn Tūmart nell'Alto Atlante, e il santuario che il suo movimento custodì presso la sua tomba finché i Merinidi non lo rasero al suolo. Furono reclutati dapprima tra gli Harga, il suo stesso popolo, e in seguito dalle più ampie confederazioni masmuda. Portano la pesante lancia e lo scudo rotondo e combattono in ordine serrato. Ciò che il loro movimento rovesciò non fu una specie minore di soldato, ma uno Stato: già negli anni 1120 l'amministrazione almoravide emanava ordini contraddittori, e i suoi eserciti non erano più composti in gran parte da Almoravidi. Questo è il corpo su cui fu costruito il califfato, e il nostro Stato masmuda lo arruola ancora, carico dell'orgoglio istituzionale di un impero che un tempo unificò l'intero mondo musulmano occidentale."
 a_caballeria_de_cuantia: "Caballería de Cuantía"
 a_caballeria_de_cuantia_desc: "La $a_caballeria_de_cuantia$ è composta dai cavalieri castigliani qualificati per censo: uomini abbastanza ricchi da mantenere cavallo e armi, ma al di sotto del rango dell'alta nobiltà. Cavalcando nel leggero stile #italic jinete#!, questi cavalieri di medio rango colmano lo spazio tra i seguiti dei grandi signori e le leve a piedi delle città, offrendo alla corona castigliana un'ampia base di forza montata in cambio dell'esenzione dal tributo comune: un privilegio più ristretto di quello di un hidalgo, ma sufficiente a permettersi un cavallo."
 a_coronelias: "Coronelías"
 a_coronelias_desc: "Le $a_coronelias$ sono la fanteria plasmata da Gonzalo Fernández de Córdoba nelle guerre d'Italia: più compagnie tenute insieme come un unico corpo sotto un colonnello laddove prima comandava un capitano, con picca, spada e archibugio ciascuno al proprio posto nella linea anziché gettati alla rinfusa. Il #italic tercio#! non ha ancora un nome; quello attende un'ordinanza proveniente da Genova. Ma questa è la formazione che ne prenderà il nome, e gli uomini che qui imparano il mestiere sono quelli che lo riempiranno."
 a_granadan_crossbowmen: "Balestrieri Granadini"
 a_granadan_crossbowmen_desc: "I $a_granadan_crossbowmen$ portano un'arma che Granada ha preso in prestito anziché ereditato: Ibn Huḏayl, scrivendo per lo stesso Muḥammad V, la chiama #italic qaḍīb afranjī#! — l'arco dei Franchi. L'abbiamo adottata dalla frontiera su cui combattiamo, e le nostre officine ne producono ormai noci e calci su un modello standard in quantità. Schierato davanti alla linea principale, un balestriere richiede una stagione di addestramento dove un arciere richiede una vita, e il suo dardo trapassa armature che fermerebbero una freccia."
 a_granadan_jinetes: "Jinetes Granadini"
 a_granadan_jinetes_2: "Jinetes Granadini Tardi"
 a_granadan_jinetes_2_desc: "Secoli di perfezionamento dei $a_granadan_jinetes$ producono ora un cavaliere più disciplinato e meglio equipaggiato. Cotte di maglia e lance più lunghe affiancano il tradizionale giavellotto, ma la dottrina di fondo di velocità, molestia e finta ritirata resta il marchio della cavalleria leggera granadina."
 a_granadan_jinetes_desc: "Nati dalle guerre di frontiera andaluse, i jinetes cavalcano cavalli leggeri e privi di armatura e combattono con giavellotti, spade corte e la #italic adarga#! di cuoio a forma di cuore. Le loro scaramucce mordi e fuggi, derivate dalle tattiche berbere portate attraverso lo Stretto, dettano il ritmo della guerra nella penisola iberica, e i regni vicini li imitano a loro volta in breve tempo."
 a_guich_cavalry: "Cavalleria Guich"
 a_guich_cavalry_desc: "La $a_guich_cavalry$ è la cavalleria permanente del Maḵzan marocchino: tribù #italic jīš#!, di norma di origine araba, insediate su #italic arḍ al-jayš#! e che detengono i loro appezzamenti esenti da tasse finché cavalcano. Sono soldati-coltivatori e non nobili, senza un lignaggio proprio su cui ripiegare, ed è proprio per questo che il sultano si fida di loro: un corpo la cui posizione dipende interamente dalla corona. Montati e pagati in terra, portano l'autorità del sultano in zone dove un semplice esattore non sarebbe ascoltato, e costano al tesoro meno di qualsiasi forza che debba essere pagata in moneta."
 a_hermandad_infantry: "Fanteria della Hermandad"
 a_hermandad_infantry_desc: "La $a_hermandad_infantry$ è formata dalle compagnie di milizia organizzate della Santa Hermandad: la Santa Fratellanza istituita per dotare la Castiglia di una forza interna permanente in grado di mantenere l'ordine sulla vasta meseta. A differenza delle vecchie leve feudali, questi uomini sono arruolati e pagati dalle città ma rispondono ai magistrati regi anziché ai signori locali, e la loro disciplina li rende uno strumento molto più affidabile del nuovo Stato centralizzato rispetto a qualsiasi esercito baronale."
 a_hilali_bedouin_cavalry: "Cavalleria Beduina Hilālī"
 a_hilali_bedouin_cavalry_desc: "La $a_hilali_bedouin_cavalry$ è la cavalleria leggera tribale araba dei Banū Hilāl e dei Banū Sulaym: pastori giunti a occidente dall'Alto Egitto nell'arco di generazioni anziché in un'unica ondata, il cui lento insediamento nella steppa ne ha rifatto per sempre la lingua e l'ordine rurale. Ai giorni nostri i Riyāḥ e i Dawāwida fanno e disfano re, e i sultani tra Tunisi e Tlemcen li corteggiano con matrimoni, appalti fiscali e concessioni di terre e rendite ai loro capi. Cavalcano per noi sotto i propri capitani e sulle proprie cavalcature, e non si faranno dire dove accamparsi. Questa tradizione arabo-beduina offre ai nostri eserciti un braccio d'attacco la cui mobilità e il cui numero tribale integrano le confederazioni berbere senza competere per lo stesso bacino di reclutamento basato sulla parentela."
 a_infanteria_de_marina: "Infantería de Marina"
 a_infanteria_de_marina_desc: "La $a_infanteria_de_marina$ è formata dai fanti di marina della flotta castigliana: i soldati che salgono a bordo delle nostre navi da guerra per assaltare i ponti nemici, tenere posizioni costiere e guidare gli sbarchi anfibi. Organizzati in compagnie permanenti nella grande tradizione del #italic tercio#!, questi marinai-combattenti sono ugualmente a proprio agio sulla gremita passerella di una galea e nella breccia di una fortezza costiera, e costituiscono il filo tagliente della nostra proiezione di potenza oltremare."
 a_kabyle_skirmishers: "Scaramuccianti Cabili"
 a_kabyle_skirmishers_desc: "Gli $a_kabyle_skirmishers$ sono i combattenti montanari del Djurdjura e del Babor, a est di Algeri: gli Zwāwa dei geografi arabi, annoverati tra i sudditi del sultano hafside a Béjaïa senza pagargli nulla. I loro parenti hanno già fondato imperi: i Kutāma delle colline orientali furono l'esercito che portò i Fatimidi in Ifrīqiya, e i Ṣanhāja della stessa stirpe fondarono dopo di loro le dinastie ziride e hammadide. Molestano una colonna in marcia con lance da getto e svaniscono in terreni che nessuna formazione può seguire. Questa tradizione di guerra di montagna offre agli eserciti maghrebini un braccio di fiancheggiamento per le zone collinari e boscose in cui la fanteria da battaglia campale non può manovrare."
 a_masmuda_atlas_infantry: "Fanteria dell'Atlante Masmuda"
 a_masmuda_atlas_infantry_desc: "La $a_masmuda_atlas_infantry$ è composta dai pesanti lancieri delle confederazioni berbere masmuda dei monti dell'Atlante: contadini delle alte valli che si radunano per una stagione e tornano ai loro terrazzamenti, come facevano molto prima del califfato almohade e molto dopo la sua caduta. I loro antenati marciarono negli eserciti che spazzarono il Maghreb e la penisola iberica nel XII secolo, e ne portano il ricordo nelle formazioni serrate insegnate loro dalle montagne, adatte al terreno accidentato e a ricevere la pesante cavalleria cristiana. Questa tradizione masmuda offre a ogni Stato maghrebino un corpo di fanteria pesante che nessun rivale puramente di cavalleria può spezzare facilmente nel combattimento ravvicinato."
 a_mesnaderos: "Mesnaderos"
 a_mesnaderos_desc: "I $a_mesnaderos$ sono la cavalleria del seguito regio delle corone pirenaiche: i cavalieri corazzati della casa reale che cavalcano al servizio diretto del re di Navarra o d'Aragona. Organizzati secondo l'antico obbligo della #italic mesnada#!, questi guerrieri sono legati al loro sovrano da lealtà personale e da contratto, formando un nucleo affidabile di cavalleria pesante esperta che può essere inviata dove la leva feudale sarebbe troppo lenta o inaffidabile."
 a_milicia_concejil: "Milicia Concejil"
 a_milicia_concejil_desc: "La $a_milicia_concejil$ è la leva cittadina dei municipi castigliani e leonesi: i #italic concejos#! della Meseta obbligati per carta regia a fornire uomini per la difesa locale e il servizio di frontiera. Reclutata tra i borghesi e gli artigiani delle città murate, è una forza economica e facilmente disponibile, la cui maggiore forza è la familiarità con il terreno che ha giurato di proteggere."
 a_milicia_irmandinha: "Milicia Irmandinha"
 a_milicia_irmandinha_desc: "La $a_milicia_irmandinha$ è formata dalle forze di milizia levate dalle confraternite galiziane: le #italic Irmandades#! della metà del XV secolo che unirono le città della Galizia contro la tirannia delle grandi casate nobiliari. Armati alla leggera ma ferocemente motivati, questi cittadini-soldati riflettono la solidarietà comunitaria delle corporazioni urbane e dei piccoli proprietari galiziani che scelsero l'azione collettiva anziché la sottomissione al giogo signorile."
 a_miquelets: "Miquelets"
 a_miquelets_desc: "I $a_miquelets$ sono la fanteria leggera irregolare delle montagne catalane: bande di duri montanari che hanno servito signori catalani e re castigliani nei passi dei Pirenei e nelle forre della costa orientale. Più veloci delle truppe regolari e capaci di svanire prima che un inseguimento possa essere organizzato, questi soldati di guerriglia eccellono nell'imboscata e nell'incursione, trasformando il terreno impervio della loro patria nella loro arma più grande."
 a_mulaththamun_spearmen: "Lancieri Mulaṯṯamūn"
 a_mulaththamun_spearmen_desc: "I $a_mulaththamun_spearmen$ sono i guerrieri ṣanhāja del Sahara occidentale, così chiamati per il #italic liṯām#! che non depongono mai: i clan lamtūna le cui formazioni di lancieri schierati portarono la rigida dottrina riformatrice malikita di Ibn Yāsīn, e in seguito le armi di Yūsuf ibn Tāšfīn, dall'erg sahariano alla valle dell'Ebro. La prima fila imbraccia la lunga picca e le file dietro scagliano il giavellotto, ciascun uomo al riparo di uno scudo #italic lamt#! di pelle di orice, velato in modo che si vedano solo le orbite degli occhi. Il loro alto morale deriva da un impegno religioso che nessuna tradizione militare puramente secolare può eguagliare. L'impero che quei lancieri costruirono è caduto da tempo, ma il Maghreb non ha mai dimenticato come combattevano, e il nostro Stato ṣanhāja ne schiera ancora il corpo di fanteria pesante."
 a_mutatawwia: "Mutaṭawwi'a"
 a_mutatawwia_desc: "I #italic mutaṭawwi'a#! sono i volontari della frontiera granadina: uomini devoti che cavalcano per la stagione delle incursioni per la promessa del paradiso e una parte del bottino anziché per un salario, molti dei quali raccolti attorno a qualche #italic morabito#! locale la cui fama di santità li attira. Leggeri e veloci, colpiscono le marche cristiane con giavellotto e spada prima di sciogliersi di nuovo nella sierra. Non sono i cavalieri di frontiera stipendiati del sultano e non fingono di esserlo: ciò che portano è numero e fervore, e si disperdono quando la stagione finisce."
 a_sanhaja_camel_cavalry: "Cavalleria Cammellata Ṣanhāja"
 a_sanhaja_camel_cavalry_desc: "La $a_sanhaja_camel_cavalry$ è composta dai cavalieri a dorso di cammello e di cavallo leggero dei Ṣanhāja sahariani: i Lamtūna e i Masūfa, uomini velati i cui padri costruirono un impero che si estendeva dal Senegal all'Ebro. Quel giorno è passato. Il secolo si volge contro di loro, e le dinastie che ora sorgono sono zanata e masmuda. Ciò che non è cambiato è il deserto, che essi attraversano ancora come nessun altro: i loro cammelli li portano per distanze che nessuna cavalleria a cavallo può tentare, e la loro carica con la lancia leggera è la risposta maghrebina alla pesante lancia delle potenze iberiche e saheliane. Questa tradizione di cavalleria desertica ṣanhāja offre ai nostri eserciti una portata logistica e di manovra impareggiabile lungo la frontiera meridionale."
 a_sometent: "Sometent"
 a_sometent_desc: "Il $a_sometent$ è la milizia urbana e rurale levata nelle terre catalane: il #italic sometent#! convocato a suon di campana e di corno ogni volta che la frontiera è minacciata. Armati di lancia e scudo, non sono soldati professionisti ma difensori del focolare e del villaggio, e la loro ostinata resistenza di fronte a razzie e incursioni li rende più difficili da spezzare di quanto suggerirebbe il loro numero."
 a_alabarderos: "Alabarderos"
 a_alabarderos_desc: "Gli $a_alabarderos$ sono la guardia armata di alabarda della persona del re: un'unica compagnia di poche decine di uomini, levata per stare alla porta della camera anziché nella linea di battaglia. Le loro armi in asta proteggono il monarca tanto quanto ornano la corte, e un re che si trova a fare affidamento su di loro sul campo ha già perso il campo."
 a_guardias_de_ornato: "Guardias de Ornato"
 a_guardias_de_ornato_desc: "Le $a_guardias_de_ornato$ sono la guardia cerimoniale di alabardieri della corte castigliana, riccamente abbigliati successori degli $a_alabarderos$, che scortano il sovrano con lancia e alabarda."
 a_thagri: "Ṯaḡrī"
 a_thagri_2: "Ṯaḡrī Tardi"
 a_thagri_2_desc: "Generazioni di servizio dei $a_thagri$ hanno trasformato il corpo in una classe ereditaria di guardiani di frontiera. La marcia è nelle loro ossa, i passi sono mappati nei canti dei loro nonni, l'addestramento è ereditato dalla compagnia dei loro padri. Ricevono ancora la paga di un contadino e il pane di un contadino, eppure una loro colonna può tenere la sierra per un'intera stagione di campagna mentre un seguito di cavalieri morirebbe di fame in due settimane."
 a_thagri_desc: "Reclutati dai villaggi di marca dei #italic ṯuḡūr#!, i #italic ṯaḡrī#! combattono come lancieri a piedi che conoscono ogni passo e ogni corso d'acqua della frontiera andalusa. Si addestrano a poco prezzo con razioni di villaggio, marciano per settimane con ciò che una colonna castigliana mangia in pochi giorni e rispondono alla chiamata al primo segnale di fuoco. Le loro armi sono semplici e la loro paga magra, eppure nessuna forza in Iberia eguaglia la loro resistenza lungo le marche montane."
 a_tornadizos: "Tornadizos"
 a_tornadizos_2: "Tornadizos Tardi"
 a_tornadizos_2_desc: "Generazioni di insediamento dei $a_tornadizos$ hanno costruito una classe permanente di cavalleria corazzata il cui addestramento e il cui equipaggiamento eguagliano ormai i migliori cavalieri cristiani d'Iberia. Le loro lance sono più lunghe, le loro piastre più pesanti, e il loro numero non dipende più dai capricci della frontiera. La cavalleria pesante andalusa è giunta a maturità, schierata sotto i nostri stendardi contro i regni la cui tecnica un tempo la definiva."
 a_tornadizos_desc: "Tratti dai regni cristiani al soldo nasride, questi uomini conservano la propria fede e i propri sacerdoti mentre ci servono: la frontiera li chiama comunque #italic tornadizos#!, una parola che rivolge a chiunque cambi schieramento in una direzione o nell'altra. Portano nei nostri eserciti la tecnica di lancia e armatura a piastre, e la loro carica corazzata rispecchia i #italic gendarmes#! di Castiglia e d'Aragona, eppure cavalcano accanto ai $a_granadan_jinetes$ sotto gli stendardi verdi del nostro emirato. Il reclutamento è lento, perché simili uomini sono pochi, e ciascuno di essi addestrato nell'arte della guerra cristiana rende la nostra cavalleria un nemico diverso da qualsiasi altra forza andalusa che la frontiera abbia mai visto."
 a_tuareg_camelry: "Cammellieri Tuareg"
 a_tuareg_camelry_desc: "I $a_tuareg_camelry$ sono i cavalieri #italic mahrī#! del profondo Sahara: uomini che i geografi arabi annoverano tra i Ṣanhāja e riconoscono dai loro veli, in sella a dromedari da corsa allevati per la velocità attraverso il grande erg e la hamada, con la lunga lancia e la #italic takouba#! per il lavoro ravvicinato dopo che una carica di cammelli ha disperso una colonna. Razziano le piste carovaniere e le sorvegliano anche, facendosi pagare per scortare e guidare, e tassando il traffico ovunque controllino i pozzi. Tre giorni di marcia dove la cavalleria a cavallo deve fermarsi per l'acqua li rendono padroni di corridoi che nessun esercito stanziale può presidiare. Questa tradizione cammellata offre alle nostre confederazioni un braccio da incursione e da pattugliamento a lungo raggio che nessun rivale entro mille leghe dal deserto può eguagliare."
 a_zenata_cavalry: "Cavalleria Zenata"
 a_zenata_cavalry_desc: "La $a_zenata_cavalry$ è composta dai cavalieri leggeri delle confederazioni berbere zenata — i Banū Marīn, i Banū 'Abd al-Wād e i Maghrāwa — la cui educazione pastorale li rende maestri della rapida guerra nel deserto e nella steppa. Ogni guerriero porta il proprio cavallo, il proprio equipaggiamento e il proprio seguito di parenti, senza richiedere né un arsenale regio né un addestramento prolungato per essere schierato. Questo bacino di cavalleria leggera tribale offre a ogni sultano maghrebino un braccio d'attacco veloce che la cavalleria cristiana e quella musulmana orientale, più pesanti, non possono facilmente raggiungere in campo aperto."
 n_carraca_portuguesa: "Nau Portoghese"
 n_carraca_portuguesa_desc: "La $n_carraca_portuguesa$ è la pesante caracca che alimenta il nostro impero orientale: un vascello imponente a più ponti costruito per sopravvivere alle brutali tempeste della rotta del Capo e tornare con le spezie e le sete del commercio dell'Oceano Indiano. Irte di cannoni e capaci di trasportare centinaia di soldati, queste navi sono fortezze galleggianti che hanno aperto le rotte marittime del mondo al commercio e al potere portoghese."
 n_galeota_andalusi: "Galeota Andalusa"
 n_galeota_andalusi_desc: "La $n_galeota_andalusi$ è la veloce galea da incursione dei corsari andalusi: un vascello snello, a remi, costruito per la velocità e la sorpresa anziché per la battaglia campale delle flotte di linea. Con equipaggi di marinai esperti dei porti di Granada e della costa meridionale, queste galeotte sfrecciano tra i villaggi di pescatori e le rotte mercantili cristiane, colpendo prima che una difesa possa essere organizzata e ritirandosi controvento prima che l'inseguimento possa chiudere la distanza."
 n_ghurab_maghribi: "Ghurāb Maghribī"
 n_ghurab_maghribi_desc: "Il $n_ghurab_maghribi$ è la galea da guerra dei porti maghrebini: il #italic ghurāb#!, il corvo, un lungo scafo a remi che porta un intero equipaggio da combattimento anziché una pesante batteria. Costruite nei cantieri di Salé, Bādis e Hunayn e remate da equipaggi reclutati tra le tribù costiere, queste galee operano in squadroni per dare la caccia ai mercantili e gettare squadre d'abbordaggio oltre la murata prima che una difesa possa formarsi. Questa tradizione del corsaro a remi offre a ogni sultano maghrebino una flotta in grado di contendere lo stretto e le rotte costiere senza la spesa di una marina d'artiglieria."
 n_nao_castellana: "Nao Castigliana"
 n_nao_castellana_desc: "La $n_nao_castellana$ è la grande nave da guerra mercantile della Castiglia: una #italic nao#! dalla larga trave e dai castelli alti, capace di attraversare l'oceano aperto trasportando abbastanza cannoni e soldati da respingere qualsiasi flotta rivale. Fu a bordo di navi di questo tipo che compimmo i nostri più grandi viaggi di scoperta, ed è nelle loro stive che la ricchezza dei nuovi continenti inizia il suo viaggio di ritorno verso la Castiglia."
 n_sale_rover: "Corsaro di Salé"
 n_sale_rover_desc: "Il $n_sale_rover$ è il leggero veliero corsaro della repubblica del Bou Regreg: l'incursore a basso pescaggio costruito nei cantieri di Salé e Rabat dai rifugiati Hornachero e Morisco che fondarono la loro città-Stato corsara indipendente alla foce del fiume. I nostri capitani conducono queste veloci navi nelle rotte atlantiche per intercettare il traffico costiero dell'Iberia, delle Canarie e degli accessi al Mediterraneo occidentale, distanziando qualsiasi galeone da guerra pesante inviato all'inseguimento. Questa tradizione dei Corsari di Salé offre al nostro Stato una flotta di rapidi incursori atlantici che nessuna marina corsara a galee può replicare in condizioni di mare aperto."
