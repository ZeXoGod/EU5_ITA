l_english:
 spa_seize_control_of_the_orders.title: "Impadronirsi dei Domini degli Ordini"
 spa_seize_control_of_the_orders.desc: "Gli Ordini Religiosi di [ShowRegionName('iberia_region')] hanno svolto un ruolo essenziale nel respingere la minaccia musulmana e nel ristabilire il nostro dominio sulla penisola. Tuttavia, ora che la nostra #italic Reconquista#! è compiuta, dobbiamo porre questi ordini sotto il controllo diretto del nostro governo e orientarli verso il loro ruolo futuro di statisti e amministratori, anziché di guerrieri e cavalieri."
 spa_seize_control_of_the_orders.a: "Poniamo i magisteri sotto [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 spa_seize_control_of_the_orders.a.entry: "Poniamo i magisteri sotto la $crown_estate$."
 establish_council_of_military_orders_tt: "Sblocca il [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')]"
 established_council_of_military_orders_tt: "Ha istituito il [ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] con la decisione $spa_seize_control_of_the_orders.title$."

 spa_council_of_crusade_decision.title: "Istituiamo il $spa_council_of_crusade_bureaucracy$"
 spa_council_of_crusade_decision.desc: "La difesa della nostra fede, anche su rive straniere, deve essere benedetta dalla massima autorità. Con l'approvazione del [pope], diventeremo il primo baluardo della fede [ShowReligionAdjective('catholic')]!"
 spa_council_of_crusade_decision.a: "Chiediamo l'approvazione papale."
 establish_council_of_crusade_tt: "Sblocca il [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')]"
 established_council_of_crusade_tt: "Ha istituito il [ShowBureaucracyTypeName('spa_council_of_crusade_bureaucracy')] con la decisione $spa_council_of_crusade_decision.title$."
