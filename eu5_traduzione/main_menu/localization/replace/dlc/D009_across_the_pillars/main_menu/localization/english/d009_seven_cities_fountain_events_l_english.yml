l_english:

 seven_cities_fountain.1.title: "La Sorgente è Solo una Sorgente"
 seven_cities_fountain.1.desc: "Dopo due settimane di marcia la colonna ha raggiunto il luogo che le guide Taíno descrivono come la Fonte di Bimini. Qui c'è una sorgente, in una radura, con l'acqua fredda, limpida e vagamente solforosa. Gli uomini ne bevono. Gli uomini restano esattamente vecchi come erano ieri. La guida Taíno viene interrogata di nuovo, con più cura. Ammette di non aver mai bevuto lui stesso dalla sorgente, e di essere stato un bambino quando ne sentì la storia dalla nonna, che era una bambina quando l'aveva sentita dalla sua. [target_leader.GetName] scrive il dispaccio e ordina alla colonna di tornare in patria."
 seven_cities_fountain.1.a: "Leviamo il campo. Non c'è nessuna fonte, solo una storia."
 seven_cities_fountain.1.historical_info: "Il viaggio di Ponce de León in Florida del 1513 è convenzionalmente associato alla ricerca della Fonte della Giovinezza, ma l'associazione è posteriore a Ponce de León stesso; compare per la prima volta nelle cronache Spagnole dopo la sua morte e fu consolidata da storici successivi, per i quali l'inquadramento pittoresco era utile. Il viaggio vero e proprio fu una missione di ricognizione di routine finanziata da un investitore privato che voleva stabilire un avamposto schiavista su quella che allora si supponeva fosse un'isola. La Fonte si legò al nome di Ponce de León perché egli morì ancora relativamente giovane, sulla cinquantina, per una ferita di freccia riportata in Florida, un'ironia a cui i narratori Spagnoli della generazione seguente non seppero resistere."

 seven_cities_fountain.2.title: "Una Sorgente Rinfrescante"
 seven_cities_fountain.2.desc: "La sorgente al centro della leggenda è reale, nel modesto senso che qui c'è una sorgente, in un boschetto, con acqua di una limpidezza insolita e una temperatura che non varia con le stagioni. Gli uomini riferiscono di sentirsi rinfrescati quando ne bevono; lo riferisce anche il medico. Nessuno di loro riferisce alcun ringiovanimento. Il capo locale Timucua parla della sorgente come di un luogo di guarigione, utile per febbri e dolori articolari. Il cronista lo annota; i medici a corte ne saranno interessati. La fonte non è ciò che la leggenda ne fece. Ma la sorgente è una cosa concreta. [target_leader.GetName] ordina di costruire un santuario sul sito."
 seven_cities_fountain.2.a: "Rivendichiamo la sorgente per [ROOT.GetCountry.GetNameWithNoTooltip]. Il commercio delle acque curative potrebbe rendere."
 seven_cities_fountain.2.historical_info: "La Florida è insolitamente ricca di sorgenti artesiane, molte delle quali erano usate come centri cerimoniali e di guarigione dai Timucua e da altri popoli indigeni della penisola. L'appropriazione Europea di questi siti come luoghi di cura o termali iniziò nel Settecento e continua tuttora nella forma delle località turistiche raggruppate attorno alle sorgenti maggiori. Le virtù mediche attribuite alle acque sono variate nel tempo ma raramente hanno incluso il ringiovanimento in quanto tale; quella parte della leggenda fu sempre strettamente Europea."

 seven_cities_fountain.3.title: "La Vera Fonte"
 seven_cities_fountain.3.desc: "La sorgente nel cuore del paese Timucua è ciò che la leggenda descriveva, o almeno gli è abbastanza vicina da rendere il cronista restio a scrivere il dispaccio senza aver riletto tre volte ciò che ha scritto. L'acqua è limpida, fredda e vagamente minerale. Gli uomini che vi si bagnano per una settimana riferiscono ciò che la leggenda dice che riferiranno: i capelli sono meno grigi, la schiena meno dolorante, le articolazioni meno rigide. Le loro ferite si rimarginano pulitamente. Il medico, che ha sessantun anni, dice a [target_leader.GetName] di non essersi sentito così bene da quando ne aveva venticinque. Il dispaccio viene firmato e sigillato prima del tramonto."
 seven_cities_fountain.3.a: "La nostra corte lo saprà. La sorgente della leggenda è nostra."
 seven_cities_fountain.3.historical_info: "La leggenda di acque che restituiscono la giovinezza ha un lungo pedigree Europeo, che risale almeno al racconto di Erodoto di una fonte nel paese degli Etiopi le cui acque avevano profumo di viole e conferivano una longevità insolita a chi vi si bagnava. La trasposizione Spagnola della leggenda in Florida all'inizio del Cinquecento fu insolita non per la sua esistenza ma per il peso istituzionale che vi fu brevemente attribuito; per gran parte della storia Europea la fonte è stata un motivo letterario anziché un obiettivo di spesa statale."

