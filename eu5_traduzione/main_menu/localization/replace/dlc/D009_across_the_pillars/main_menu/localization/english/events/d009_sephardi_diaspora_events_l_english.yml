l_english:
 d009_crypto_jewish_exodus_tt: "I convertiti di fede [ShowReligionAdjective('catholic')] discendenti dalla comunità crypto-Ebraica tornano in silenzio alla loro antica fede e partono per [d009_exodus_destination.Custom('IT_La')][d009_exodus_destination.GetName]"
 d009_sephardi_diaspora.1.title: "Arrivano gli Esuli"
 d009_sephardi_diaspora.1.entry: "$d009_sephardi_diaspora.1.title$"
 d009_sephardi_diaspora.1.desc: "Giunge al nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] la notizia che [origin_country.Custom('IT_La')][origin_country.GetNameWithNoTooltip] ha scacciato dalle proprie coste i suoi sudditi di fede [ShowReligionAdjective('judaism')], e che moltissimi di loro attendono ora ai nostri porti con nient'altro che ciò che sono riusciti a portare. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vedono nel loro arrivo una fortuna di braccia esperte e capitali pronti, mentre i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] vedono una massa di stranieri della cui lealtà e fede non possiamo ancora rispondere. Qualunque cosa decideremo sarà ricordata da ogni esule che ne verrà a sapere."
 d009_sephardi_diaspora.1.a: "Diamo loro un benvenuto ufficiale."
 d009_sephardi_diaspora.1.b: "Limitiamoli a determinate città."
 d009_sephardi_diaspora.1.historical_info: "Si dice che il sultano Bayezid II abbia osservato che Ferdinando d'Aragona aveva impoverito il proprio paese e arricchito gli Ottomani espellendo gli Ebrei, e ordinò ai suoi governatori provinciali di accogliere gli esuli e di non respingerli. Decine di migliaia si stabilirono nei Balcani e in Anatolia ottomani nei decenni successivi, portando torchi da stampa, tecniche tessili e reti commerciali che arricchirono in modo misurabile le città Ottomane, soprattutto Salonicco e Costantinopoli."

 d009_sephardi_diaspora.2.title: "[ShowLocationNameWithNoTooltip('thessaloniki')] Diventa di Fede [ShowReligionAdjectiveWithNoTooltip('judaism')]"
 d009_sephardi_diaspora.2.entry: "$d009_sephardi_diaspora.2.title$"
 d009_sephardi_diaspora.2.desc: "Negli anni trascorsi da quando gli esuli sbarcarono per la prima volta, [ShowLocationName('thessaloniki')] si è trasformata. I suoi moli, le sue botteghe e i suoi mercati seguono ormai il ritmo del Sabato più di qualunque altro calendario, e la sua popolazione di fede [ShowReligionAdjective('judaism')] è cresciuta fino a superare tutte le altre comunità della città messe insieme. I nostri stessi funzionari hanno cominciato a tenere i conti secondo lo stesso ritmo, se non altro perché tanta parte del commercio cittadino ne dipende ormai."
 d009_sephardi_diaspora.2.a: "Lasciamo che il carattere della città parli da sé."
 d009_sephardi_diaspora.2.historical_info: "A metà del XVI secolo gli Ebrei Sefarditi costituivano la maggioranza della popolazione di Salonicco, e la città divenne nota alle comunità Ebraiche di tutta Europa e del Mediterraneo come centro di studio, stampa e produzione tessile Sefardita, in particolare di panni di lana tessuti per le uniformi militari Ottomane. Il giudeo-spagnolo (ladino) rimase una lingua importante delle strade e dei mercati della città fino al XX secolo inoltrato."
 d009_thessaloniki_has_sephardi_pops_tt: "[ShowLocationNameWithNoTooltip('thessaloniki')] ospita [pops|e] di cultura [ShowCultureNameWithNoTooltip('sephardi')]"

 d009_sephardi_diaspora.3.title: "Il Ghetto [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_sephardi_diaspora.3.entry: "Il Ghetto"
 d009_sephardi_diaspora.3.desc: "Il nostro Senato propone di confinare la comunità di fede [ShowReligionAdjective('judaism')] di [ROOT.GetCountry.GetCapital.GetName] in una sola isola cinta da mura, con le porte chiuse a chiave di notte e sorvegliate di giorno, e i residenti autorizzati a uscire solo a condizioni rigorose. I sostenitori la definiscono una sensata via di mezzo tra l'espulsione e l'insediamento senza restrizioni; i mercanti e prestatori di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] dal cui credito [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] dipende da tempo la definiscono con un termine decisamente meno lusinghiero."
 d009_sephardi_diaspora.3.a: "Istituiamo il Ghetto."
 d009_sephardi_diaspora.3.b: "Resistiamo alla pressione di confinarli."
 d009_sephardi_diaspora.3.historical_info: "Venezia istituì il proprio ghetto Ebraico nel 1516, confinando la comunità nel Ghetto Nuovo del sestiere di Cannaregio, chiuso da porte e sorvegliato di notte. La parola #italic ghetto#! stessa ha origine da questo quartiere veneziano, probabilmente dalla parola veneziana per la fonderia di rame (#italic geto#!) che vi sorgeva in precedenza, e il modello dei quartieri Ebraici chiusi e imposti dallo stato si diffuse ad altre città italiane nel secolo successivo."
 d009_venice_has_jewish_pops_tt: "[ShowLocationNameWithNoTooltip('venice')] ospita [pops|e] di fede [ShowReligionAdjectiveWithNoTooltip('judaism')]"

 d009_sephardi_diaspora.4.title: "[target_character.GetNameWithNoTooltip] e la Bibbia di Ferrara"
 d009_sephardi_diaspora.4.entry: "Doña Gracia Mendes e la Bibbia di Ferrara"
 d009_sephardi_diaspora.4.desc: "[target_character.GetName], una vedova [GetCountry('POR').Custom('IT_ADJ_FS')] di considerevole fortuna e non poco ardire, si è stabilita a [ShowLocationNameWithNoTooltip('ferrara')] e ha iniziato a vivere apertamente come ciò che era sempre stata in segreto, un'Ebrea di cospicui mezzi e ancor più salda convinzione. [target_character.GetSheHe|U] finanzia una traduzione in ladino delle Scritture per i conversos che non hanno mai imparato l'ebraico, e mantiene in silenzio una rete di agenti e rifugi sicuri che si estende fin dentro [GetCountry('POR').Custom('IT_La')][GetCountry('POR').GetNameWithNoTooltip], pronta a far uscire chiunque desideri seguire il suo esempio."
 d009_sephardi_diaspora.4.a: "Sosteniamo la sua opera."
 d009_sephardi_diaspora.4.b: "Limitiamo le sue attività."
 d009_sephardi_diaspora.4.historical_info: "Doña Gracia Mendes Nasi (nata Beatriz de Luna a Lisbona, c. 1510) costruì una delle grandi fortune commerciali di conversos del XVI secolo e, dopo essersi stabilita apertamente come Ebrea, prima ad Anversa e poi a Ferrara, usò sia la sua ricchezza sia le sue conoscenze per finanziare la Bibbia di Ferrara del 1553, una traduzione in ladino destinata ai conversos che avevano perso la fluidità in ebraico, e per contribuire a finanziare vie di fuga per i Nuovi Cristiani portoghesi in fuga dall'Inquisizione."

 d009_sephardi_diaspora.5.title: "[target_character.GetNameWithNoTooltip] e il Ripopolamento di [ShowLocationNameWithNoTooltip('safed')]"
 d009_sephardi_diaspora.5.entry: "Don Joseph Nasi e il Ripopolamento di Safed"
 d009_sephardi_diaspora.5.desc: "[target_character.GetName], finanziere di origine [GetCountry('POR').Custom('IT_ADJ_FS')] che ha reso al nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] notevoli servigi nelle corti d'Europa, chiede ora una concessione su [ShowLocationName('safed')] e sul suo territorio circostante, sperando di popolarla fittamente di altri esuli e di costruirvi un centro di sapere e di tessitura della seta di fede [ShowReligionAdjective('judaism')] che non risponda ad alcuna corona se non alla nostra. Le ambizioni di [target_character.GetHerHis] sono inconfondibilmente grandiose, e lo è, nota il nostro tesoro, anche la fortuna di [target_character.GetHerHis]."
 d009_sephardi_diaspora.5.a: "Concediamo a [target_character.GetHimHer] il ripopolamento."
 d009_sephardi_diaspora.5.a.entry: "Concediamo a Don Joseph Nasi il ripopolamento."
 d009_sephardi_diaspora.5.b: "Rifiutiamo."
 d009_sephardi_diaspora.5.historical_info: "Don Joseph Nasi, nipote e genero di Doña Gracia, divenne uno dei più fidati consiglieri del sultano Solimano il Magnifico e ricevette la signoria su Tiberiade e i villaggi circostanti intorno agli anni 1560, con l'obiettivo di ricostruirla come centro di insediamento Ebraico e di produzione della seta. Il progetto ottenne solo un modesto successo in vita sua, ma è spesso ricordato come un precursore dei successivi sforzi di reinsediamento Ebraico nella regione."

 d009_sephardi_diaspora.6.title: "La Livornina"
 d009_sephardi_diaspora.6.entry: "$d009_sephardi_diaspora.6.title$"
 d009_sephardi_diaspora.6.desc: "Il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] sta redigendo una carta, la Livornina, che aprirebbe [ShowLocationName('livorno')] ai mercanti di fede [ShowReligionAdjective('judaism')] e ai conversos a condizioni generose quanto quelle di qualunque stato della Cristianità finora, libertà di culto, esenzione dal distintivo e diritto di commerciare alla pari con i nostri sudditi. Le più antiche famiglie mercantili del porto non sono del tutto liete all'idea della concorrenza che una simile generosità inviterà."
 d009_sephardi_diaspora.6.a: "Emaniamo la Livornina."
 d009_sephardi_diaspora.6.b: "Limitiamo l'insediamento di persone di fede [ShowReligionAdjectiveWithNoTooltip('judaism')]."
 d009_sephardi_diaspora.6.historical_info: "Ferdinando I de' Medici emanò la Livornina nel 1593, offrendo ai mercanti Ebrei e conversos condizioni eccezionalmente generose, esenzione dall'obbligo di portare un segno distintivo, libertà di culto e pari posizione giuridica con i mercanti Cristiani, specificamente per sviluppare Livorno come porto commerciale. La carta ebbe un successo notevole, e la comunità Ebraica di Livorno crebbe fino a diventare una delle più prospere e meno limitate dell'Italia della prima età moderna."
 variable_d009_sephardi_diaspora_6_fired_tt: "La Livornina è stata Emanata"
 d009_country_has_sephardi_pops_tt: "Le nostre terre ospitano [pops|e] di cultura [ShowCultureNameWithNoTooltip('sephardi')]"

 d009_sephardi_diaspora.7.title: "La Nazione [GetCountry('POR').Custom('IT_ADJ_FS')] di [ShowLocationNameWithNoTooltip('amsterdam')]"
 d009_sephardi_diaspora.7.entry: "$d009_sephardi_diaspora.7.title$"
 d009_sephardi_diaspora.7.desc: "Da anni ormai mercanti provenienti [GetCountry('POR').Custom('IT_Dalla')][GetCountry('POR').GetNameWithNoTooltip] e autodefinitisi semplicemente la Nazione Portoghese si sono stabiliti in silenzio ad [ShowLocationName('amsterdam')], tenendo per sé i propri consigli e le proprie usanze a porte chiuse. È diventato un segreto di Pulcinella tra i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] che moltissimi di questi mercanti sono, e sono sempre stati, Ebrei praticanti, e che la fortuna che portano con sé è considerevole."
 d009_sephardi_diaspora.7.a: "Concediamo loro la libertà di culto."
 d009_sephardi_diaspora.7.b: "Manteniamo le vecchie restrizioni."
 d009_sephardi_diaspora.7.historical_info: "I conversos portoghesi, che si definivano la Nazione Portoghese, cominciarono a stabilirsi ad Amsterdam intorno al 1590, tornando apertamente all'ebraismo una volta che le autorità olandesi estesero una tolleranza di fatto, benché il pieno riconoscimento giuridico arrivasse gradualmente. A metà del XVII secolo la comunità Sefardita di Amsterdam era diventata una delle più ricche e influenti d'Europa, sede della Sinagoga Portoghese e di un'industria tipografica che fece della città un grande centro di pubblicazioni in ebraico e in ladino."
 variable_d009_amsterdam_jewish_nation_tt: "La Nazione Ebraica Portoghese ha Ottenuto Riconoscimento a [ShowLocationName('amsterdam')]"

 d009_sephardi_diaspora.8.title: "I Brasiliani [ShowCultureNameWithNoTooltip('sephardi')] Fuggono a Nuova Amsterdam"
 d009_sephardi_diaspora.8.entry: "$d009_sephardi_diaspora.8.title$"
 d009_sephardi_diaspora.8.desc: "Ci è giunta notizia che forze [GetCountry('POR').Custom('IT_ADJ_FP')] stanno premendo duramente contro le nostre colonie oltreoceano, e le famiglie mercantili [ShowCultureName('sephardi')] che vi hanno costruito la propria vita sotto la nostra bandiera non hanno più dove rivolgersi se non verso altre nostre colonie. Un certo numero di loro ha già fatto vela verso il nostro insediamento alla foce del fiume Nord, sperando che le libertà concesse qui ad [ShowLocationName('amsterdam')] li seguano attraverso l'acqua."
 d009_sephardi_diaspora.8.a: "Diamo loro il benvenuto nella colonia."
 d009_sephardi_diaspora.8.b: "Limitiamo l'immigrazione alla sola Europa."
 d009_sephardi_diaspora.8.historical_info: "Dopo che il Portogallo riconquistò il Brasile olandese nel 1654, un gruppo di ventitré profughi Ebrei Sefarditi fece vela verso nord e approdò a Nuova Amsterdam, diventando i primi coloni Ebrei noti di quella che sarebbe poi diventata New York. Il governatore Peter Stuyvesant tentò inizialmente di espellerli, ma fu sconfessato dalla Compagnia Olandese delle Indie Occidentali, il cui consiglio comprendeva azionisti Ebrei, una decisione che permise a quella piccola comunità di diventare il seme di quella che è oggi una delle più grandi popolazioni Ebraiche del mondo."
