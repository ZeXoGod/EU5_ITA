l_english:
 ahl_al_hall_wal_aqd_parliament: "Ahl al-Ḥall wa-l-'Aqd"
 ahl_al_hall_wal_aqd_parliament_desc: "Gli #italic Ahl al-Ḥall wa-l-'Aqd#! — coloro che sciolgono e legano — sono il corpo di giuristi, studiosi e notabili di rango elevato il cui consenso collettivo ha tradizionalmente conferito legittimità ai sovrani islamici, con il loro parere che rappresenta l'avallo della comunità alla sovranità. Convochiamo questo consiglio come istituzione deliberativa formale del nostro reame, offrendo agli #italic 'ulamā'#! e alle casate principali una voce strutturata negli affari di stato. Un consiglio ben sostenuto traduce l'autorità degli studiosi in una legittimità duratura; senza le risorse per mantenerlo, le sue sentenze pesano meno, e il consenso che sostiene la nostra autorità diventa più difficile da evocare."

 tribal_jamaa_parliament: "Jamā'a"
 tribal_jamaa_parliament_desc: "La #italic Jamā'a#! è l'antica istituzione Amazigh del governo collettivo, in cui gli uomini liberi della tribù — e i capi che parlano per loro — deliberano in assemblea aperta su questioni di guerra, giustizia e uso delle risorse. Riconosciamo la #italic Jamā'a#! come organo parlamentare formale del nostro reame, ancorando la nostra autorità al consenso delle comunità tribali che ne costituiscono la spina dorsale. Un'assemblea funzionante coinvolge quelle comunità nella vita politica dello stato e offre alle loro rimostranze un canale pacifico; senza le risorse per sostenerla, l'assemblea perde la propria autorità di convocazione e le tribù si ritirano in un'azione autonoma."
