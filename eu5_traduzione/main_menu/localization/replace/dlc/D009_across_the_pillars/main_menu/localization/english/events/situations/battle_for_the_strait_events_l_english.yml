l_english:
 battle_for_the_strait_events.1.title: "La Battaglia per lo Stretto"

 battle_for_the_strait_events.1.desc_cas: "Le parias [target_gra_country.Custom('IT_Della')][target_gra_country.GetName] giungono a nord puntuali. Così pure gli ambasciatori, con rimostranze tanto lunghe da sfiancare il ciambellano della nostra [target_cas_country.GetGovernment.GetCourtTitle]. Eppure a sud della Sierra Morena il trono è ancora in piedi, e la Reconquista iniziata a Covadonga resta incompiuta finché [target_gra_ruler.GetName] tiene corte nell'[ShowBuildingTypeName('alhambra')].\n\nQuest'ultimo tratto non sarà opera di una sola campagna. I vescovi vogliono una crociata da due generazioni. Le grandi casate, più prosaicamente, vogliono la possibilità di ottenere le terre conquistate che ne seguiranno. Il nostro compito è far sì che entrambi spingano nella stessa direzione abbastanza a lungo da far crollare il trono [target_gra_country.Custom('IT_Di')][target_gra_country.GetNameWithNoTooltip]."

 bfts_intro_tt: "Abilita la meccanica #Y $influence_over_granada$#! con #Y 4#! soglie che concedono bonus all'una o all'altra parte"

 battle_for_the_strait_events.1.desc_mor: "Oltre lo stretto, [target_cas_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_cas_country.GetGovernment.GetRulerTitle] [target_cas_country.Custom('IT_Di')][target_cas_country.GetName] stringe la vite [target_gra_country.Custom('IT_Sulla')][target_gra_country.GetName] un pagamento di parias alla volta. Le lettere della [target_gra_country.GetGovernment.GetCourtTitle] arrivano ormai ogni mese, a volte ogni settimana. Chiedono oro, ma ciò di cui hanno bisogno è che [target_mor_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_mor_country.GetGovernment.GetRulerTitle] porti la guerra alla sua origine.\n\nQuesta è l'opera di più di un regno. [target_mor_country.Custom('IT_CLERGY_IL')][target_mor_country.GetGovernment.GetEstateName('clergy_estate')] delle nostre città sostiene la causa del #italic jihād#! fin dalla perdita dell'ultimo califfo almohade. Se lasciamo la guerra ai nostri eredi, la lasciamo a tombe lontane dalla nostra."

 battle_for_the_strait_events.1.desc_gra: "Siamo tra due martelli, ed entrambi sorridono. Da nord, [target_cas_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_cas_country.GetGovernment.GetRulerTitle] [target_cas_country.Custom('IT_Di')][target_cas_country.GetName] riscuote parias anno dopo anno e attende che la fede [target_gra_country.Custom('IT_Di')][target_gra_country.GetName] ceda da sola. [target_mor_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')|U][target_mor_country.GetGovernment.GetRulerTitle] [target_mor_country.Custom('IT_Di')][target_mor_country.GetName] manda oltre lo stretto offerte avvolte nel linguaggio del #italic jihād#!, e il prezzo scritto sotto ogni dono è sempre lo stesso: l'eventuale resa del nostro trono al suo.\n\nÈ così che cade una #italic ṭā'ifa#!. Non in un colpo, non sotto un solo esercito, ma a poco a poco, mentre la [target_gra_country.GetGovernment.GetCourtTitle] perde l'abitudine di rifiutare. Abbiamo resistito più a lungo della maggior parte. Il nostro compito negli anni a venire è sopravvivere alla pazienza di un vicino e all'ambizione dell'altro, e far sì che le cronache [target_gra_country.Custom('IT_Di')][target_gra_country.GetNameWithNoTooltip] si leggano più a lungo di quelle di ogni #italic ṭā'ifa#! che ha ceduto."

 bfts_explain_granadan_sovereignty_tt: "Abilita la [granadan_sovereignty|e] tramite il pannello della [situation|e]"

 battle_for_the_strait_events.1.desc_christian: "Giunge notizia che [target_cas_country.Custom('IT_La')][target_cas_country.GetName] sta volgendo l'intero apparato [target_cas_country.Custom('IT_DEL_RANGO')][target_cas_country.GetFlavorRank] contro [target_gra_country.Custom('IT_La')][target_gra_country.GetName], ultimo trono [ShowReligionGroupAdjective('muslim')] della penisola. Non vedevamo una pressione di tale peso diretta a sud dai tempi delle campagne di Ferdinando III.\n\nL'esito andrà oltre i nostri confini. Una vittoria [target_cas_country.Custom('IT_ADJ_FS')] chiuderebbe la Reconquista alle condizioni fissate a [ShowLocationName('toledo')], con le province meridionali sotto un'unica corona. Se [target_mor_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_mor_country.GetGovernment.GetRulerTitle] [target_mor_country.Custom('IT_Di')][target_mor_country.GetName] rispondesse sul serio dall'altra sponda dello stretto, potremmo ritrovare galee [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] nelle nostre rotte commerciali per la prima volta in un secolo. In entrambi i casi, la mappa di [ShowRegionName('iberia_region')] che uscirà da questo scontro non sarà quella che conosciamo."

 battle_for_the_strait_events.1.desc_muslim: "[target_mor_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')|U][target_mor_country.GetGovernment.GetRulerTitle] [target_mor_country.Custom('IT_Di')][target_mor_country.GetName] ha rivolto lo sguardo a nord. [target_gra_country.Custom('IT_La')|U][target_gra_country.GetName], ultimo trono [ShowReligionGroupAdjective('muslim')] di [ShowFormableCountryName('ADU_f')], viene strangolata a forza di parias da [target_cas_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_cas_country.GetGovernment.GetRulerTitle] [target_cas_country.Custom('IT_Di')][target_cas_country.GetName], e ogni sermone del venerdì in [ShowRegionName('maghreb_region')] ne indica la causa.\n\nLa contesa spetta a noi seguirla, quali che siano i nostri confini. Se [target_mor_country.Custom('IT_La')][target_mor_country.GetNameWithNoTooltip] sosterrà il trono [target_gra_country.Custom('IT_Di')][target_gra_country.GetNameWithNoTooltip], la #italic khuṭba#! potrebbe essere letta in nome di [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] fino a [ShowLocationNameWithNoTooltip('cordoba')] entro la nostra vita. Se invece [target_cas_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_cas_country.GetGovernment.GetRulerTitle] [target_cas_country.Custom('IT_ADJ_MS')] riuscirà a piegare [target_gra_country.Custom('IT_ART_RANGO')][target_gra_country.GetFlavorRank] sotto la propria croce, l'ultimo avamposto di [ShowFormableCountryNameWithNoTooltip('ADU_f')] si chiuderà, e un capitolo iniziato ai giorni di Ṭāriq ibn Ziyād terminerà nella nostra generazione."

 battle_for_the_strait_events.1.option_cas: "[ShowRegionNameWithNoTooltip('iberia_region')] risponderà a una corona [ShowReligionGroupAdjectiveWithNoTooltip('christian')]."
 battle_for_the_strait_events.1.option_mor: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] tornerà al Califfato."
 battle_for_the_strait_events.1.option_gra: "Sopravvivremo a entrambe le ambizioni."
 battle_for_the_strait_events.1.option_christian: "Il destino di [ShowRegionNameWithNoTooltip('iberia_region')] è legato a questa contesa."
 battle_for_the_strait_events.1.option_muslim: "Il destino di [ShowFormableCountryNameWithNoTooltip('ADU_f')] dipende da questa contesa."

 battle_for_the_strait_events.2.title: "La Reconquista è Compiuta"
 battle_for_the_strait_events.2.desc: "L'ultima preghiera del venerdì viene recitata a [ShowLocationName('granada')] senza che nessuna campana risponda. Entro un'ora, la parete orientale dell'edificio viene misurata per ricavarne un'abside. [target_ruler.GetName] ha vissuto abbastanza da vedere compiuta l'opera iniziata dai re delle Asturie. La Reconquista è completa.\n\nÈ il genere di epilogo che divide le cronache. Da quest'anno in poi, il tempo iberico si misurerà come #italic prima di Granada#! e #italic dopo#!. La nostra corona detiene la data che chiude il computo, e questo è l'unico onore che non ha bisogno di spiegazioni."
 battle_for_the_strait_events.2.a: "La croce si erge sopra lo stretto."

 battle_for_the_strait_events.3.title: "[ShowFormableCountryNameWithNoTooltip('ADU_f')] Torna ai Fedeli"
 battle_for_the_strait_events.3.desc: "La causa di [ShowFormableCountryName('ADU_f')] è stata esaudita. La pressione [target_cas_country.Custom('IT_Della')][target_cas_country.GetName] su [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetFlavorRank] si è spezzata, e le parias raccolte per generazioni vengono ripagate per intero. [target_ruler.GetName] si erge a protettore riconosciuto dell'ultimo trono [ShowReligionGroupAdjective('muslim')] della penisola, e il suo nome risuona nelle preghiere del venerdì in tutto [ShowRegionName('maghreb_region')] e fin dentro [ShowLocationName('granada')].\n\nIl Califfato Marinide viene proclamato di nuovo sotto la nostra corona. La #italic bay'ah#! [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ha designato la nostra casata patrona di [ShowFormableCountryNameWithNoTooltip('ADU_f')], il che comporta un'aspettativa oltre che un titolo: le comunità non musulmane che ora si rifugiano sotto la nostra protezione sono pupille del nostro trono, e il nostro regno sarà giudicato da come se la passeranno. L'opera che i grandi Almohadi lasciarono a metà riprende per mano nostra."
 battle_for_the_strait_events.3.a: "Il nostro stendardo sventola su entrambe le sponde dello stretto."
 bfts_andalus_formation_eased_tt: "Possiamo ora formare [ShowFormableCountryNameWithNoTooltip('ADU_f')] controllando #G meno#! territori di [ShowRegionNameWithNoTooltip('iberia_region')]"

 battle_for_the_strait_events.4.title: "Il Trono [GetCountry('GRA').Custom('IT_Di')][GetCountry('GRA').GetNameWithNoTooltip] Resiste"
 battle_for_the_strait_events.4.desc: "La corona [target_cas_country.Custom('IT_ADJ_FS')] ha smesso di inviare richieste. Dopo che la flotta dell'estate scorsa non è riuscita a traversare dai porti [target_mor_country.Custom('IT_ADJ_MP')], non è stata tentata alcuna seconda chiamata alle armi. Il trono di [target_gra_country.GetCapital.GetName] ha ancora lo stesso occupante con cui era iniziata. [target_ruler.GetName] ha fatto ciò che nessuno nella nostra [target_gra_country.GetGovernment.GetCourtTitle] riteneva possibile in due generazioni: ha sopravvissuto all'intera contesa.\n\nQuesto è il finale più duro. La conquista chiude un capitolo in modo netto, ma la resistenza si limita a tenere il libro aperto. La lezione per i nostri successori non è la vittoria ma la tenacia, e le cronache mostreranno che [target_gra_country.Custom('IT_La')][target_gra_country.GetName] fu l'emirato che rifiutò di cadere secondo il calendario."
 battle_for_the_strait_events.4.a: "Granada resta libera."
 bfts_reconquest_cb_unlocked_tt: "Possiamo ora fabbricare il [ShowCasusBelliName('cb_reconquer_iberia')] per rivendicare le terre di [ShowRegionName('iberia_region')] a costo ridotto"
 bfts_iberia_fully_integrated_tt: "Ogni [location|e] che possediamo in [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] e [ShowAreaName('murcia_area')] viene elevata allo stato di [integration|e] [core|e]"
 bfts_taifa_annexation_boosted_tt: "Ogni [ShowSubjectTypeName('taifa')] che stiamo attualmente annettendo ottiene #G 25%#! di progresso di [annexation|e]"

 battle_for_the_strait_events.5.title: "La $battle_for_the_strait$ Si Conclude"

 battle_for_the_strait_events.5.desc_cas: "Gli anni sono passati. Generazioni di ambasciatori sono venute e andate dalla nostra [target_cas_country.GetGovernment.GetCourtTitle], e per due volte i carri delle parias sono arrivati in ritardo e scarichi, con scuse che ripetono le stesse frasi di una generazione fa. [target_ruler.GetName] non vedrà [ShowLocationName('granada')] sotto la nostra croce.\n\nAbbiamo costruito la grande macchina per una guerra che non abbiamo finito. I forti di frontiera sono caduti. Molti degli [ShowCultureName('andalusi')] che abbiamo accolto nella nostra cancelleria hanno ormai nipoti dietro scrivanie proprie. Né i vescovi né le grandi casate hanno rinunciato. Vogliono una crociata o nuove concessioni di terre. Per la maggior parte, a dire il vero, vogliono entrambe. Gli anni per chiudere la partita sono finiti, e ciò che lasciamo ai nostri eredi è una disputa a metà e una penisola ancora divisa."

 battle_for_the_strait_events.5.desc_mor: "Sorge un'altra età, e il richiamo che arriva dall'altra sponda dello stretto è lo stesso che trovarono i nostri nonni: un richiamo, e nulla più. Le nostre flotte sono tornate in patria illese una dozzina di volte. [target_mor_country.Custom('IT_CLERGY_IL')][target_mor_country.GetGovernment.GetEstateName('clergy_estate')] che sostiene il #italic jihād#! ogni venerdì da due generazioni è ormai troppo vecchio per discutere. [target_ruler.GetName] non sarà colui che porterà lo stendardo oltre.\n\nNon è stata la corona [target_cas_country.Custom('IT_ADJ_FS')] a batterci. La Reconquista non è più vicina alla propria fine di quanto la restaurazione almohade lo sia alla propria rinascita. Abbiamo lavorato lo stretto in ogni modo che una volta funzionava, e la maggior parte di quei modi ha funzionato davvero. I pezzi si sono mossi. La scacchiera non si è rotta. Ciò che i nostri antenati iniziarono sotto i grandi Almohadi passa ai nostri successori non più vicino alla conclusione."

 battle_for_the_strait_events.5.desc_gra: "Sono passate due epoche, e [target_gra_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_gra_country.GetGovernment.GetRulerTitle] [target_gra_country.Custom('IT_Di')][target_gra_country.GetName] siede ancora su un trono. È la più piccola vittoria possibile e il più grande miracolo possibile, a seconda delle cronache che si leggono. [target_ruler.GetName] non ha fatto né ciò che [target_cas_country.Custom('IT_La')][target_cas_country.GetName] temeva né ciò che [target_mor_country.Custom('IT_La')][target_mor_country.GetName] sperava, ma soltanto ciò che era necessario.\n\nCiò che abbiamo costruito per sopravvivere era sempre destinato a durare più di entrambi i martelli. L'[ShowBuildingTypeName('alhambra')] è cresciuta in ogni stagione della contesa, e i #italic jinetes#! sono ancora in sella. Il gioco di due patroni l'uno contro l'altro li ha logorati entrambi prima di logorare noi. Non abbiamo chiuso la contesa. Abbiamo aspettato che si esaurisse. La prossima età metterà alla prova ciò che stavamo aspettando."

 battle_for_the_strait_events.5.option_cas: "L'opera è lasciata a chi verrà dopo di noi."
 battle_for_the_strait_events.5.option_mor: "Il richiamo si leverà di nuovo, a tempo debito."
 battle_for_the_strait_events.5.option_gra: "Resistiamo."

 battle_for_the_strait_concludes_tt: "Conclude la [ShowSituationName('battle_for_the_strait')]"
 enable_extra_modifier_crown_castile_reform_tt: "Questo rafforzerà la nostra [government_reform|e] [ShowGovernmentReformName('crown_castile_reform')]"

 bfts_dominate_iberia_golden_century_tt: "Abilita la [decision|e] $gc_decision.title$ che attiva la [situation|e] [ShowSituationName('golden_century')]"


 # ===== Battle for the Strait (migrated from battle_for_the_strait_l_english.yml) =====
 battle_for_the_strait_events.21.title: "Gli [ShowCultureNameWithNoTooltip('andalusi')] Tornano a Casa"
 battle_for_the_strait_events.21.desc: "La notizia raggiunge le famiglie mudéjar di [ShowRegionName('iberia_region')] lungo le vie commerciali e i legami di parentela. [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')|U]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] offre rifugio a chi desidera vivere sotto la nostra legge. Da [target_province_origin.GetName], dove le famiglie [ShowCultureName('andalusi')] hanno sopportato una generazione sotto il dominio [ShowReligionGroupAdjective('christian')], le carovane si radunano alla frontiera.\n\nAttraversano il confine portando libri di preghiera, le chiavi di case che forse non rivedranno mai più e lettere di presentazione per i mercanti dei nostri mercati. Nel giro di pochi mesi si stabiliranno a [target_province_destination.GetName], ricostruendo le vite che la Reconquista ha interrotto."
 battle_for_the_strait_events.21.a: "Diamo loro il benvenuto."
 battle_for_the_strait_events.21.historical_info: "Il termine #italic mudajjan#! ('autorizzato a restare') diede alle cancellerie castigliane e aragonesi la parola 'Mudéjar' per indicare le comunità musulmane rimaste sul posto dopo le grandi conquiste del XIII secolo. Dal Tago all'Ebro, intere cittadine di contadini, artigiani e studiosi continuarono a coltivare i vecchi campi e a pregare nelle vecchie moschee anche dopo che la croce era stata issata sopra le porte delle cattedrali.\n\nLa loro posizione fu sempre precaria. Espulsioni periodiche, tasse rovinose e la costante pressione delle conversioni forzate spinsero ondate successive verso sud, verso l'ultimo regno andalusi, dove gli emiri nasridi li accolsero con concessioni di terre e la promessa di una vita sotto la legge islamica. Ogni arrivo approfondì la memoria culturale di Granada delle #italic taifas#! perdute e rinnovò la pretesa del regno di essere erede di al-Andalus."
 battle_for_the_strait_events.22.title: "Arriva l'Ordine Shadhili"
 battle_for_the_strait_events.22.desc: "Una delegazione di šayḵ shadhili giunge alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], inviata dalle grandi #italic zawiyas#! di [ShowLocationName('sale')] e [ShowLocationName('tetouan')] con lettere di presentazione dalla camera di [GetCountry('MOR').GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][GetCountry('MOR').GetGovernment.GetRulerTitle] della dinastia [GetCountry('MOR').GetGovernment.GetRulerOrRegent.GetDynasty.GetName]. Sono studiosi raffinati, non mistici del deserto, uomini istruiti nella legge e negli #italic Hikam#! di Ibn Ata Allah, a proprio agio sia alle tavole dei mercanti sia alle porte dei palazzi.\n\nPortano una proposta. Con il nostro patrocinio, fonderanno una #italic zawiya#! [ROOT.GetCountry.Custom('IT_NEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] e metteranno la loro rete oltre lo Stretto al servizio dei nostri affari. La loro presenza alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] sposterà l'equilibrio delle voci verso la scuola [ROOT.GetCountry.GetReligiousSchool.GetName] di [ShowSocietyDirectionName('jurisprudence')], e l'autorità di santità che portano è una delle poche monete che ancora possiamo spendere e che i regni [ShowReligionGroupAdjective('christian')] non possono eguagliare. La decisione di finanziarli, quando e come, resterà nostra."
 battle_for_the_strait_events.22.a: "Diamo loro il benvenuto alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 battle_for_the_strait_events.22.a.entry: "Diamo loro il benvenuto alla nostra corte."
 battle_for_the_strait_events.22.entry: "$battle_for_the_strait_events.22.title$"
 dmc_arrival_intro: "[converted_character.GetName] giunge alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], consegnat[converted_character.Custom('IT_ART_O_A')] a noi [GetCountry('GRA').Custom('IT_Dalla')][GetCountry('GRA').GetName] sotto il peso della nostra richiesta. Le acque del battesimo vengono somministrate davanti al nostro capitolo della cattedrale, e il suo nuovo nome [ShowReligionGroupAdjective('christian')] viene iscritto nei registri del nostro servizio."
 battle_for_the_strait_events.30.title: "Un Convertito alla Nostra [actor.GetGovernment.GetCourtTitle]"
 battle_for_the_strait_events.30.desc_centralization: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] si rivela un servitore utile in cancelleria. Il resoconto del convertito su come gli uffici [GetCountry('GRA').Custom('IT_ADJ_MP')] gestiscono imposte e tributi raggiunge i nostri ministri, e la mano della corona pesa di più sulle grandi casate che non avrebbero ceduto spontaneamente a tali misure."
 battle_for_the_strait_events.30.desc_innovative: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] porta nelle bisacce lettere, trattati e tavole di calcolo, eredità delle biblioteche di [ShowLocationName('cordoba')]. I nostri studiosi vedono aprirsi nuove linee di ricerca grazie a quella che un tempo era una lingua chiusa."
 battle_for_the_strait_events.30.desc_estate_nobles: "$dmc_arrival_intro$\n\nIl lignaggio di [converted_character.GetNameWithNoTooltip] gli vale un posto tra [actor.Custom('IT_NOBLES_IL')][actor.GetGovernment.GetEstateName('nobles_estate')], i cui anziani accolgono una nuova casata legata ai loro interessi dai vincoli della conversione."
 battle_for_the_strait_events.30.desc_estate_clergy: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] entra nei ranghi [actor.Custom('IT_CLERGY_DEL')][actor.GetGovernment.GetEstateName('clergy_estate')] come voce dotta, e la sua conoscenza della #italic Sharī'ah#! conferisce un peso inatteso ai dibattiti del capitolo della cattedrale."
 battle_for_the_strait_events.30.desc_estate_burghers: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] entra tra [actor.Custom('IT_BURGHERS_IL')][actor.GetGovernment.GetEstateName('burghers_estate')] delle nostre città commerciali, dove registri e magazzini si aprono a un nuovo convertito che conosce le rotte verso sud, fino a [ShowRegionName('maghreb_region')]."
 battle_for_the_strait_events.30.desc_estate_peasants: "$dmc_arrival_intro$\n\nLa nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] non ha posto per il rango che [converted_character.GetSheHe] deteneva a sud della frontiera, e [converted_character.GetNameWithNoTooltip] viene sistemat[converted_character.Custom('IT_ART_O_A')] tra [actor.Custom('IT_PEASANTS_IL')][actor.GetGovernment.GetEstateName('peasants_estate')] delle nostre terre d'origine."
 battle_for_the_strait_events.30.desc_child_tutor: "$dmc_arrival_intro$\n\nLa [ROOT.GetCountry.GetGovernment.GetCourtTitle] nomina [converted_character.GetNameWithNoTooltip] tutore del nostro erede, [actor.GetGovernment.GetHeir.GetName]. Gli insegnamenti dei suoi antichi maestri a [GetCountry('GRA').Custom('IT_In')][GetCountry('GRA').GetNameWithNoTooltip] passano a un bambino [ShowReligionGroupAdjective('christian')], che assorbe astronomia, contabilità e arte di governo da un maestro che le conosce tutte e tre."
 battle_for_the_strait_events.30.desc_administrators: "$dmc_arrival_intro$\n\n[converted_character.GetNameWithNoTooltip] prende posto nella nostra cancelleria, e la sua padronanza dei registri contabili [ShowCultureGroupName('arabic_group')] e delle rotte commerciali di [ShowRegionName('maghreb_region')] passa ai nostri mercanti. Le casate delle nostre città trovano nuovi soci, e nuovi debitori, oltre lo stretto."
 battle_for_the_strait_events.30.a: "Un'anima utile conquistata alla fede."
 battle_for_the_strait_events.31.title: "[actor.GetNameWithNoTooltip] Impone il Vassallaggio a [GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.31.desc: "La questione è chiusa. Abbiamo legato [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] alla nostra sfera come vassallo, e ora che i sigilli sono asciutti nessuna protesta da parte loro disferà la pergamena.\n\nOltre lo stretto il significato è fin troppo chiaro. [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetFlavorRank] non traccia più la propria rotta, e le figure di facciata [GetCountry('GRA').Custom('IT_Di')][GetCountry('GRA').GetNameWithNoTooltip] devono imparare a inginocchiarsi dove un tempo regnavano. Alcuni ingoieranno il vincolo e ci serviranno fedelmente; altri coltiveranno la tacita speranza di liberarsi un giorno. In ogni caso, la lotta per lo stretto si è inclinata molto a nostro favore, e intendiamo incalzare il vantaggio."
 battle_for_the_strait_events.31.a: "Così è sigillato."
 battle_for_the_strait_events.32.title: "[GetCountry('MOR').GetNameWithNoTooltip] Impone il Tributo a [GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.32.desc: "Abbiamo costretto con successo [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] al tributo, e i termini sono stabiliti prima che i suoi diplomatici riescano a protestare. Le casse [GetCountry('GRA').Custom('IT_DEL_RANGO')][GetCountry('GRA').GetFlavorRank] sono aperte ai nostri ispettori, e il peso del prelievo si propaga oltre lo stretto.\n\n[GetCountry('GRA').Custom('IT_NOBLES_IL')][GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] [GetCountry('GRA').Custom('IT_Di')][GetCountry('GRA').GetNameWithNoTooltip] calcola l'oro che salperà verso sud a ogni stagione e ne conta il costo in silenzio. Che [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetFlavorRank] resti legat[GetCountry('GRA').Custom('IT_OA_RANGO')] alla nostra sfera o spezzi il giogo, la lunga contesa per lo stretto si piega ormai verso la resa dei conti."
 battle_for_the_strait_events.32.a: "Si contino le casse."

 battle_for_the_strait_events.61.title: "[GetCountry('CAS').GetNameWithNoTooltip] Rinnova le Parias [GetCountry('GRA').Custom('IT_Di')][GetCountry('GRA').GetNameWithNoTooltip]"
 battle_for_the_strait_events.61.desc: "Il tributo è ripristinato senza sguainare una lama. I nostri emissari hanno perorato la causa a [GetCountry('GRA').GetName] finché i termini non sono stati firmati, e le antiche parias sono di nuovo iscritte nei registri [GetCountry('GRA').Custom('IT_DEL_RANGO')][GetCountry('GRA').GetFlavorRank].\n\nOgni stagione l'oro viaggerà verso nord, alla nostra tesoreria, e con esso la tacita intesa che [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetFlavorRank] mantiene il trono per nostra concessione. [GetCountry('GRA').Custom('IT_NOBLES_IL')][GetCountry('GRA').GetGovernment.GetEstateName('nobles_estate')] [GetCountry('GRA').Custom('IT_Di')][GetCountry('GRA').GetNameWithNoTooltip] contano la somma e non dicono nulla. Che ne sopportino il peso o lo scuotano via, la contesa per lo stretto si avvicina alla sua fine."
 battle_for_the_strait_events.61.a: "Si compilino i registri."

 # ===== STUBS - generic recurring events =====
 battle_for_the_strait_events.40.title: "Catene Imposte"
 battle_for_the_strait_events.40.desc_cas: "È un destino sfortunato il nostro, vivere sotto lo stendardo [target_cas_country.Custom('IT_Della')][target_cas_country.GetName] e le grazie di [target_cas_ruler_regent.GetName]. I recenti sviluppi e i conflitti di confine hanno spinto [target_cas_country.Custom('IT_ART_RANGO')][target_cas_country.GetFlavorRank] a pretendere nuove rassicurazioni sul nostro status, messe nero su bianco davanti a tutti. I loro ambasciatori parlano di amicizia, ma le monete e le concessioni che si aspettano raccontano un'altra storia. Piegarsi significa cedere un altro po' della nostra posizione, e rifiutare significa invitare ancora una volta i loro cavalieri nei nostri campi."
 battle_for_the_strait_events.40.desc_mor: "È un destino sfortunato che [target_mor_country.Custom('IT_ART_RANGO')][target_mor_country.GetFlavorRank] ci consideri un socio minore. Le lettere di [target_mor_ruler_regent.GetName] [target_mor_country.Custom('IT_Di')][target_mor_country.GetName] parlano di fratellanza nella fede, eppure chiedono ciò che chiede l'altro nostro vicino: rassicurazioni della nostra deferenza, travestite da ordine naturale tra forti e deboli. Le loro flotte e il loro oro ci hanno protetti in passato, e non ce lo lasceranno dimenticare. Accettare i loro termini significa scivolare ancora di più nella loro ombra, e negarli significa chiedersi se la prossima flotta arriverà davvero da amica."
 battle_for_the_strait_events.40.a: "Diamo rassicurazioni a spese della nostra sovranità..."
 battle_for_the_strait_events.40.b: "Paghiamo i loro diplomatici."
 battle_for_the_strait_events.40.c: "Le loro minacce vuote cadono nel vuoto!"

 battle_for_the_strait_events.41.title: "Le Ambizioni di [target_character_1.GetNameWithNoTooltip]"
 battle_for_the_strait_events.41.desc: "Da parecchio tempo [target_character_1.GetName] esercita un'influenza senza precedenti nella nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. I recenti sviluppi hanno messo ancora più autorità nelle sue mani, e persino [target_character_2.GetName] teme di perdere potere. Simili ambizioni covano anche nelle menti più brillanti e gentili, e un servitore diventato così potente non si mette da parte facilmente. Se lasciato libero, [target_character_1.GetShortNameWithNoTooltip] potrebbe finire per governare in tutto fuorché nel nome, ma se frenato con troppa durezza rischiamo di trasformare un ministro capace in un amaro nemico."
 battle_for_the_strait_events.41.a: "[target_character_1.GetSheHe|U] sta facendo un ottimo lavoro!"
 battle_for_the_strait_events.41.b: "[target_character_1.GetShortNameWithNoTooltip], sei licenziat[target_character_1.Custom('IT_ART_O_A')]!"

 battle_for_the_strait_events.42.title: "Traffico Mercantile"
 battle_for_the_strait_events.42.desc: "Per secoli [target_country.Custom('IT_La')][target_country.GetName] è stata una tappa vitale per i mercanti che viaggiano dalle coste di [ShowRegionName('italy_region')] fino ai mercati del [ShowRegionName('sahel_region')]. Di recente gli affari vanno bene, e un sano afflusso di monete è segnato nei nostri registri! [ShowGoodsName('silk')], [ShowGoodsName('sugar')] e [ShowGoodsName('fruit')] scorrono nei nostri magazzini più in fretta di quanto gli scrivani riescano a contarli, e ogni fazione della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha una propria idea di dove debba andare il surplus. Ora dobbiamo decidere dove sia meglio spenderlo."
 battle_for_the_strait_events.42.a: "Investiamo l'eccesso di monete nelle nostre infrastrutture."
 battle_for_the_strait_events.42.b: "Patrociniamo artisti e scienza."
 battle_for_the_strait_events.42.c: "Diamo il denaro al popolo."
 battle_for_the_strait_events.42.d: "Arricchiamo il tesoro."
 battle_for_the_strait_events.42.e: "Usiamo le monete per proiettare il nostro splendore e la nostra sovranità!"

 battle_for_the_strait_events.43.title: "La Nostra Influenza su [target_gra_country.Custom('IT_Sulla')][target_gra_country.GetNameWithNoTooltip]"
 battle_for_the_strait_events.43.desc: "La lotta in corso oltre lo stretto ha collocato [target_gra_country.Custom('IT_La')][target_gra_country.GetName] nel mezzo di combattimenti feroci e brutali. È magra consolazione che [target_gra_country.Custom('IT_ART_RANGO')][target_gra_country.GetFlavorRank] sia ricc[target_gra_country.Custom('IT_OA_RANGO')] e piena di gente istruita, poiché ciò la rende solo un premio più ambito. I nostri rivali corteggiano [target_gra_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_gra_country.GetGovernment.GetRulerTitle] con oro e belle parole mentre i loro eserciti marciano, e un trono che si inclina dalla parte sbagliata potrebbe chiuderci il passaggio per una generazione. Dobbiamo far valere ora la nostra influenza, anche a scapito delle buone relazioni, per non rischiare che cada più a fondo nelle mani dei nostri nemici."
 battle_for_the_strait_events.43.a: "Dobbiamo mostrare forza."
 battle_for_the_strait_events.43.b: "Non agitiamo le acque."

 battle_for_the_strait_events.44.title: "Emerge un Poligrafo"
 battle_for_the_strait_events.44.desc: "È noto a tutti che [target_gra_country.GetLongName] ospita grandi opere di sapere e menti illuminate. L'ultimo esempio non è altri che [target_polymath.GetName], un dotto del clero il cui nome è pronunciato da [target_location.GetName] fino alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Una mente simile vale più di qualsiasi fortezza. Eppure i suoi talenti sono offerti [target_root_country.Custom('IT_AL_NOSTRO_RANGO')]nostr[target_root_country.Custom('IT_OA_RANGO')] [target_root_country.GetFlavorRank] a una sola condizione: che riconosciamo [target_gra_country.Custom('IT_La')][target_gra_country.GetNameWithNoTooltip] come nostra pari sovrana..."
 battle_for_the_strait_events.44.a: "Vale la diplomazia!"
 battle_for_the_strait_events.44.b: "Facciamo leva sulla nostra influenza politica!"
 battle_for_the_strait_events.44.c: "Faremo affidamento sulle nostre menti [target_root_country.Custom('IT_ADJ_FP')], superiori!"
 target_polymath_resides_in_target_gra_country: "[target_polymath.GetName] manterrà la propria residenza a [target_location.GetName]"

 battle_for_the_strait_events.45.title: "Curiosità Religiose"
 battle_for_the_strait_events.45.desc: "Come sono belle le cerimonie [ShowReligionGroupAdjective('christian')], la loro iconografia e i vividi paramenti dei sacerdoti. Quale potrebbe essere il significato dei loro versi, dei loro testi, e la comprensione più profonda della loro versione del divino?\n\nDomande simili occupano la mente di [target_root_ruler.GetName]. [target_root_ruler.GetSheHe|U] ha preso l'abitudine di ricevere chierici stranieri in privato e di indugiare sui loro libri fino a notte fonda. Ciò è malvisto [target_root_country.Custom('IT_NEL_NOSTRO_RANGO')]nostr[target_root_country.Custom('IT_OA_RANGO')] [target_root_country.GetFlavorRank], e [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ha cominciato a sussurrare dove una simile curiosità potrebbe condurre."
 battle_for_the_strait_events.45.a: "La curiosità è solo un'espressione di umanità!"
 battle_for_the_strait_events.45.b: "Distogliamo il suo sguardo verso altre questioni!"

 battle_for_the_strait_events.46.title: "Imprese Scientifiche"
 battle_for_the_strait_events.46.desc: "Fin dall'infanzia [target_character.GetName] ha mostrato attitudine per le scienze. La forma dei fiori, le api, i colori e i vari fenomeni della natura sono solo alcuni degli argomenti che [target_character.GetSheHe] ha cercato di decifrare con impegno. Una simile inclinazione rende [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] un naturale patrono di #italic madrase#! e biblioteche, sempre a inseguire il sapere tra gli scaffali. Astronomi e medici hanno raramente trovato un patrono tanto disponibile, sebbene ogni ora dedicata al loro lavoro sia un'ora sottratta agli affari di governo."
 battle_for_the_strait_events.46.a: "Patrociniamo l'istituzione di [target_university_location.GetNameWithNoTooltip]!"
 battle_for_the_strait_events.46.b: "I testi sacri!"
 battle_for_the_strait_events.46.c: "[target_character.GetShortNameWithNoTooltip] non è più un bambino!"
 ruler_will_study_tt: "[target_character.GetShortName] studierà questioni di..."
 target_character_studies_admin: "...amministrazione"
 target_character_studies_diplomacy: "...diplomazia"
 target_character_studies_war: "...guerra"

 battle_for_the_strait_events.47.title: "L'Influenza di [target_character_1.GetNameWithNoTooltip]"
 battle_for_the_strait_events.47.desc_a: "Nonostante la posizione turbolenta e instabile [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank], le recenti decisioni e la condotta di [target_character_1.GetName] sono un esempio luminoso delle nostre politiche prudenti e una promessa che la nostra sovranità è rispettata. Dove altri vedono un trono accerchiato in attesa di cadere, [target_character_1.GetShortNameWithNoTooltip] ha mostrato una mano ferma, e la notizia giunge ad amici e rivali. Un gabinetto guidato così bene è esso stesso un argomento a favore del fatto che non siamo di nessuno da comandare."
 battle_for_the_strait_events.47.desc_b: "Si potrebbe supporre che servire nel proprio governo sia un incarico legato a rettitudine e onore, e che servire il popolo dovrebbe essere la vocazione più alta di una carica prestigiosa come quella di [target_character_1.GetName].\nLa realtà, però, è tutt'altra! [target_character_1.GetShortNameWithNoTooltip] è una spina nel fianco di [target_character_2.GetName], e spesso fa di tutto per arricchire [target_character_1.GetHerselfHimself] a nostre spese. Le cariche vengono vendute, i favori scambiati, e i postulanti che non possono pagare restano ad aspettare alla porta. Non possiamo permetterci un ministro che riempie la propria borsa prima del tesoro."
 battle_for_the_strait_events.47.a: "Un esempio luminoso!"
 battle_for_the_strait_events.47.b: "Solo un verme che striscia sul mucchio..."

 # ===== STUBS - unique / DHE one-shots =====
 battle_for_the_strait_events.50.entry: "La Storia Ammonitrice di Abu Abdallah ibn al-Hakim al-Rundi"
 battle_for_the_strait_events.50.title: "La Storia Ammonitrice di [target_dead_guy.GetShortNameWithNoTooltip]"
 battle_for_the_strait_events.50.desc: "I cronisti raccontano ancora di [target_dead_guy.GetName], il [ROOT.GetCountry.Custom('GetHeadOfCabinetName')] che un tempo detenne i due sigilli di stato e governò i nostri avi in tutto fuorché nel nome, finché la città non si sollevò contro di lui. Una folla inferocita assaltò il suo palazzo, lo abbatté e profanò il suo corpo così che nessuna tomba lo accolse mai. Quella stessa ombra cade ora sulla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetName] ha riunito le cariche di governo in un'unica presa, e [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] mormora che nessun servitore dovrebbe stare tanto vicino al trono. Possiamo appoggiarci a [target_character.GetShortNameWithNoTooltip] e all'ordine che una simile mano porta, oppure spezzare il consiglio prima che impari a governare senza di noi."
 battle_for_the_strait_events.50.a: "Abbiamo bisogno di più uomini come [target_character.GetShortNameWithNoTooltip]."
 battle_for_the_strait_events.50.a.entry: "Abbiamo bisogno di più uomini come lui."
 battle_for_the_strait_events.50.b: "Una folla? Pazzi? Meglio di no."
 battle_for_the_strait_events.50.c: "Lasciamo le cose come stanno."
 status_quo_preserved_tt: "#italic Lo status quo sarà preservato#!"
 battle_for_the_strait_events.50.historical_info: "Abu Abdallah ibn al-Hakim al-Rundi, nato a Ronda nel 1261, salì attraverso la cancelleria nasride fino a diventare il visir dominante del sultano Muhammad III, detenendo dal 1303 il raro titolo di #italic dhū al-wizāratayn#!, signore dei due visirati. Negoziò il Trattato di Córdoba, diresse la presa di Ceuta nel 1306 e, alla fine del regno, era ritenuto da molti il vero governante dell'emirato.\n\nNon durò. Nel colpo di palazzo del marzo 1309 il comandante Atiq ibn al-Mawl lo abbatté, e il suo corpo fu gettato via e perduto. La sua ascesa e la sua caduta divennero proverbiali per il pericolo di un ministro che diventa più grande del suo re."

 battle_for_the_strait_events.51.entry: "$battle_for_the_strait_events.51.title$"
 battle_for_the_strait_events.51.title: "Una Casa del Sapere"
 battle_for_the_strait_events.51.desc: "I nostri studiosi premono da tempo per un collegio degno di [target_location.GetName], una [ShowBuildingTypeName('great_madrasa')] in cui la legge possa essere insegnata sotto un unico tetto come nelle grandi città d'oriente. [target_character.GetName] ha i mezzi per erigerla accanto alla grande moschea, dove i fedeli già si radunano. Una simile fondazione attirerebbe studenti e giuristi da oltre lo stretto, e legherebbe il sapere delle nostre città al servizio di [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 battle_for_the_strait_events.51.a: "Fondiamo la [ShowBuildingTypeNameWithNoTooltip('great_madrasa')] accanto alla grande moschea."
 battle_for_the_strait_events.51.b: "Il tesoro non può permetterselo ora."
 battle_for_the_strait_events.51.historical_info: "Nel 1349 il sultano Yusuf I fondò la Madrasa di Granada, la #italic Madrasa Yusufiyya#!, accanto alla grande moschea, nel luogo in cui oggi sorge la cattedrale. Vi si insegnava la scuola giuridica #italic malikita#! ed era il principale collegio dell'emirato, pari alle scuole più antiche di Fez e del Cairo.\n\nDalle sue aule uscirono molti dei giuristi e dei segretari che popolavano la cancelleria nasride. Sopravvive solo la sua sala di preghiera, un unico frammento di ciò che un tempo fu il cuore intellettuale del regno."
 wont_have_another_chance_to_build_tt: "#italic Non avremo un'altra occasione di ottenere questi benefici#!"

 battle_for_the_strait_events.52.entry: "$battle_for_the_strait_events.52.title$"
 battle_for_the_strait_events.52.title: "La Sala degli Ambasciatori"
 battle_for_the_strait_events.52.desc: "All'interno della grande #italic qalahurra#! del nostro palazzo, [target_character.GetName] vorrebbe erigere una sala del trono degna di ricevere gli inviati dei re. Il suo soffitto di cedro dovrà essere scolpito con i sette cieli, migliaia di pezzi disposti sopra il trono affinché ogni ambasciata possa cogliere l'ordine sotto il quale si trova. Una sala simile parla per [target_location.GetName] più chiaramente di qualsiasi lettera, e a un costo non trascurabile."
 battle_for_the_strait_events.52.a: "Erigiamo la sala e collochiamo il nostro trono sotto di essa."
 battle_for_the_strait_events.52.b: "I nostri inviati sanno parlare abbastanza bene anche senza."
 battle_for_the_strait_events.52.historical_info: "La Sala degli Ambasciatori, la sala del trono del Palazzo di Comares, fu eretta sotto Yusuf I a metà del XIV secolo e rimane la più grande sala dell'Alhambra. Dal suo trono i sultani nasridi ricevevano le ambascerie straniere con deliberato sfarzo.\n\nIl suo soffitto a cupola in cedro, assemblato da migliaia di pezzi incastrati, rappresenta i sette cieli della cosmologia islamica, con il trono collocato direttamente sotto l'apice divino. Era una dichiarazione in legno e stucco che l'emiro regnava per ordine del cielo stesso."

 battle_for_the_strait_events.53.entry: "$battle_for_the_strait_events.53.title$"
 battle_for_the_strait_events.53.title: "Il Nuovo Caravanserraglio"
 battle_for_the_strait_events.53.desc: "I mercanti che affollano i nostri mercati sentono la mancanza di un vero [ShowBuildingTypeName('funduq')], una locanda murata dove le merci possano essere custodite sotto chiave e i commercianti alloggiati sotto sorveglianza. [target_character.GetName] ha destinato il terreno accanto al mercato della [ShowGoodsName('silk')] di [target_location.GetName]. I mercanti [ShowCultureGroupName('italian_group')] hanno insistito più di tutti, perché gestiscono la maggior parte dei nostri traffici, e una casa solida per le loro merci è una casa solida per le nostre dogane."
 battle_for_the_strait_events.53.a: "Costruiamolo, e lasciamo che il commercio scorra attraverso le nostre porte."
 battle_for_the_strait_events.53.historical_info: "L'#italic al-Funduq al-Jadida#!, noto ai castigliani come Corral del Carbón, è l'unico caravanserraglio nasride ancora in piedi in Iberia. Documentato fin dall'inizio del XIV secolo e posseduto dalle mogli dei sultani nasridi, serviva come magazzino di grano e alloggio per mercanti accanto all'#italic alcaicería#!, il mercato recintato della seta di Granada.\n\nBuona parte di quel commercio era in mani straniere. Mercanti e banchieri genovesi dominavano il commercio granadino, attratti dalla seta e dall'oro delle rotte transahariane, e un mercato della città era noto semplicemente come l'Alhóndiga dei Genovesi."

 battle_for_the_strait_events.54.entry: "$battle_for_the_strait_events.54.title$"
 battle_for_the_strait_events.54.title: "Un Trattato sul Contagio"
 battle_for_the_strait_events.54.desc: "[target_character.GetName], la mente più dotta al nostro servizio, ci porta un trattato diverso da qualsiasi altro i nostri medici abbiano mai visto. Contro l'opinione consolidata dell'epoca, [target_character.GetShortNameWithNoTooltip] sostiene che la grande mortalità passi dai malati ai sani, trasportata da abiti, recipienti e navi affollate, e che una città possa proteggersi con isolamento e cura. I chierici lo chiameranno insolenza contro la volontà del cielo, eppure il consiglio potrebbe risparmiarci la prossima visitazione."
 battle_for_the_strait_events.54.a: "Sosteniamo l'opera e mettiamone in pratica i consigli."
 battle_for_the_strait_events.54.b: "Nulla di cui preoccuparsi, è solo un po' di tosse!"
 hospitals_benefit_tt: "Se avessimo qualche [buildings|e] [ShowBuildingTypeName('hospital')], le loro [locations|e] di origine beneficerebbero del [modifier|e] [ShowModifier('contagion_practices_modifier')]"
 battle_for_the_strait_events.54.historical_info: "Intorno al 1362 il visir e poligrafo granadino Ibn al-Khatib scrisse #italic Muqni'at al-Sa'il#!, un trattato sulla grande peste che aveva investito il Mediterraneo un decennio prima. Vi sosteneva che la malattia si diffondesse per contagio, stabilito dall'esperienza attraverso abiti, recipienti e porti infetti, e che l'isolamento potesse arginarla.\n\nCiò andava contro la dottrina prevalente, secondo cui ammettere il contagio equivaleva a negare che la malattia venisse per volontà di Dio. Il suo manoscritto sopravvive nella biblioteca dell'Escorial, una rara voce medievale in favore di ciò che le epoche successive avrebbero chiamato quarantena."

 battle_for_the_strait_events.55.entry: "Un'Ambasciata al Cairo"
 battle_for_the_strait_events.55.title: "Un'Ambasciata a [target_location.GetNameWithNoTooltip]"
 battle_for_the_strait_events.55.desc: "Incalzato duramente alla nostra frontiera, [target_gra_ruler.GetName] guarda a oriente, all'unico trono che potrebbe ancora levare eserciti in nome della fede. A [target_location.GetName] siede [target_mam_country.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_mam_country.GetGovernment.GetRulerTitle] [target_mam_country.Custom('IT_Di')][target_mam_country.GetName], custode delle città sante e ospite del califfo, la maggiore potenza dell'[ShowReligionName('sunni')]. Un'ambasciata attraverso tutta la lunghezza del mare è una scommessa costosa, e la risposta potrebbe essere soldati, oro o nient'altro che preghiere. Eppure una supplica non fatta è un aiuto mai cercato."
 battle_for_the_strait_events.55.a: "Inviamo un emissario oltre il mare, a [target_location.GetNameWithNoTooltip]."
 battle_for_the_strait_events.55.a.entry: "Inviamo un emissario oltre il mare, al Cairo."
 battle_for_the_strait_events.55.b: "Raduneremo i fedeli e ci reggeremo da soli."
 battle_for_the_strait_events.55.historical_info: "Mentre la Castiglia premeva su Granada a metà del XIV secolo, la corte nasride inviò ambascerie attraverso il Mediterraneo fino al Cairo, sede del sultanato mamelucco, custodi della Mecca e di Medina e ospiti del califfo abbaside d'ombra. Erano il destinatario naturale di qualsiasi appello fatto in nome dell'Islam sunnita.\n\nI Mamelucchi, stretti dalle proprie frontiere e a un oceano di distanza, non inviarono eserciti. Risposero con preghiere per la vittoria e calde parole di fratellanza. Ibn al-Khatib conservò questa corrispondenza tra Granada e il Cairo nella sua raccolta di lettere, la #italic Rayḥānat al-Kuttāb#!."
 battle_for_the_strait_events.56.title: "Una Supplica dall'Occidente"
 battle_for_the_strait_events.56.desc: "Un'ambasciata [target_gra_country.Custom('IT_Della')][target_gra_country.GetName] è giunta alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], provata dalla lunga traversata. Parlano a nome dell'ultimo trono [ShowReligionGroupAdjective('muslim')] dell'estremo occidente, duramente incalzato dalle corone [ShowReligionGroupAdjectiveWithNoTooltip('christian')], e chiedono quale aiuto invierà il custode delle città sante. Un oceano ci separa dalla loro guerra, e i nostri confini non sono mai tranquilli a lungo. Eppure gli occhi dei fedeli sono su di noi, e il modo in cui risponderemo a [target_gra_ruler.GetName] non sarà dimenticato presto."
 battle_for_the_strait_events.56.a: "Leghiamoci alla loro causa come fratelli nella fede."
 battle_for_the_strait_events.56.b: "Inviamo gli uomini e le monete che possiamo risparmiare, e nulla più."
 battle_for_the_strait_events.56.c: "Offriamo le nostre preghiere e teniamo gli eserciti in patria."
 gra_gets_nothing_tt: "I diplomatici [target_gra_country.Custom('IT_Della')][target_gra_country.GetName] tornano a casa con pensieri, preghiere e auguri"
 may_give_alliance_military_eco_or_no_help: "[target_mam_country.Custom('IT_La')|U][target_mam_country.GetLongName] potrebbe inviarci aiuto o no"
 alliance_better_chance_at_good_results_tt: "La nostra [alliance|e] già esistente indica una maggiore probabilità che ascoltino la nostra supplica"
 battle_for_the_strait_events.60.title: "La Spada e la Croce"
 battle_for_the_strait_events.60.entry: "$battle_for_the_strait_events.60.title$"
 battle_for_the_strait_events.60.desc: "La guerra per lo stretto continua a logorare, e [target_ruler.GetName] guarda ai frati-cavalieri degli ordini militari, le cui commende costellano la frontiera proprio per questo scopo. Convocarli al completo significa consumare la loro pazienza e il loro denaro per la guerra [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], sebbene ne infiammi lo zelo per il combattimento. Una richiesta più contenuta spende meno della loro benevolenza. Oppure [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] può lasciarli stare e combattere questa guerra solo con le proprie armi."
 battle_for_the_strait_events.60.a: "Convochiamo gli ordini sul campo al completo."
 battle_for_the_strait_events.60.b: "Chiediamo solo un contributo simbolico."
 battle_for_the_strait_events.60.c: "Lasciamo gli ordini alle loro terre e signorie."

 battle_for_the_strait_events.6.title: "La Frontiera è Scomparsa"
 battle_for_the_strait_events.6.entry: "$battle_for_the_strait_events.6.title$"
 battle_for_the_strait_events.6.desc: "La guerra è finita, e in [ShowRegionName('iberia_region')] non resta alcun Moro da combattere.\n\nÈ una difficoltà che nessuno aveva previsto. I nostri ordini militari tengono castelli lungo una frontiera che ha cessato di esistere, presidiano passi in terre ormai nostre e riscuotono le rendite di province che demmo loro da difendere. Sono i migliori soldati che abbiamo e sono, da quest'anno, soldati senza una guerra.\n\nI Maestri lo sanno prima di noi. Stanno già scrivendo per chiedere cosa intendiamo fare."
 battle_for_the_strait_events.6.a: "Poniamoli al servizio [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 battle_for_the_strait_events.6.b: "Mandiamoli oltremare."
 battle_for_the_strait_events.6.c: "Lasciamo che trovino da soli il proprio scopo."
 bfts_orders_sent_overseas_tt: "Eventi successivi ricorderanno che abbiamo mandato i nostri [religious_orders|e] oltremare"
 bfts_orders_given_new_purpose_tt: "Ogni $iberian_military_order_type$ nel nostro paese è permanentemente $zeal_imperial_purpose$, aumentando il proprio [zeal|e] obiettivo"

 battle_for_the_strait_events.8.title: "I Fratelli che Non Tornarono"
 battle_for_the_strait_events.8.entry: "$battle_for_the_strait_events.8.title$"
 battle_for_the_strait_events.8.desc: "Una colonna dell'[target_order.GetName] è stata sorpresa in territorio impervio da una forza che aveva ogni vantaggio di terreno e di numero, e non ha ceduto finché non è rimasto ben poco da spezzare.\n\nI sopravvissuti sono in mano nemica ed è stato fissato un riscatto. È alto, perché il nemico sa esattamente chi ha preso: non coscritti, ma fratelli professi di un ordine che non ha mai lasciato i suoi uomini a marcire.\n\nIl Maestro non ci ha chiesto il denaro. Ha avuto cura di non chiederlo. Questa è già la richiesta."
 battle_for_the_strait_events.8.a: "Paghiamo il riscatto. Non saranno abbandonati."
 battle_for_the_strait_events.8.b: "Hanno preso i voti sapendo il rischio."
 battle_for_the_strait_events.8.c: "Nessun riscatto, ma possono reclutare tra le nostre leve."
 bfts_orders_left_to_decline_tt: "Ogni $iberian_military_order_type$ nel nostro paese mantiene il proprio [zeal|e] obiettivo ridotto di $zeal_no_heathen_threat$"

