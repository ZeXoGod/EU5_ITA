l_english:
 expand_the_alhambra.title: "Ampliamo l'$alhambra$"
 expand_the_alhambra.desc: "Un'altra ala sorge sulla collina di Sabīka. Dove i regni precedenti innalzarono le prime corti e le prime torri, noi aggiungiamo sale nostre, con le volte lavorate in #italic muqarnaṣ#! e le pareti incise di versi, così che ogni inviato che sale al palazzo legga nella pietra la permanenza della nostra casa.\n\nIl costo non sta nel solo marmo, ma nel messaggio che esso porta: un trono che costruisce per secoli non si aspetta di cadere. Ogni livello che completiamo accresce la guarnigione della cittadella e allarga i suoi giardini, e dice tanto [GetCountry('CAS').Custom('IT_Alla')][GetCountry('CAS').GetName] quanto [GetCountry('MOR').Custom('IT_Alla')][GetCountry('MOR').GetName] che intendiamo restare padroni della nostra riva."
 expand_the_alhambra.a: "Gettiamo le fondamenta."
 expand_the_alhambra_construct_tt: "Avvia l'ampliamento dell'[ShowBuildingTypeName('alhambra')]"
