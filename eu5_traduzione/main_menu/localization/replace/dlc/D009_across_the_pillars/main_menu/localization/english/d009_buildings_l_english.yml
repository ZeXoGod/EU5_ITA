l_english:
 tali_a_watchtower: "Torre di Guardia Ṭalī'a"
 tali_a_watchtower_desc: "Una torre in muratura del sistema di vigilanza costiera andalusa, che funge al tempo stesso da posto di osservazione e da piccola opera avanzata presidiata. Torri simili si ergono in catene lungo la costa meridionale, avvistando i predoni ben prima dello sbarco e tenendo la costa mentre i fuochi d'allarme chiamano a raccolta le leve dell'entroterra."
thagr_fort: "Forte Ṯaḡr"
 thagr_fort_desc: "Il #italic ṯaḡr#! è la frontiera in cui il nostro emirato tocca le terre dei re Cristiani. Costruito in cima a una collina o a cavallo di una strada, il forte e i suoi posti di guardia impongono un pedaggio a ogni colonna che voglia attraversare il nostro confine, rallentando l'avanzata Cristiana, negando ai loro eserciti foraggio e acqua e offrendo ai nostri cavalieri un luogo dove radunarsi e rifornirsi mentre scorrazzano contro il nemico."
 saqaliba_barracks: "Caserma Ṣaqāliba"
 saqaliba_barracks_desc: "L'arsenale e il piazzale d'adunata dei #italic Ṣaqāliba#!, dove i soldati-schiavi della casa reale ritirano le armi, custodiscono polvere e acciaio e si radunano per addestrarsi. Dai suoi cancelli il corpo marcia verso la frontiera, e qui tornano le squadre di reclutamento con nuove braccia per i ranghi."
 saqaliba_barracks_maintenance: "Mantenimento della Caserma Ṣaqāliba"
 EFFECTIVE_SAQALIBA_BARRACKS: "Caserma Ṣaqāliba"
 EFFECTIVE_ROYAL_COURT_BUILDINGS: "Edifici [ShowBuildingTypeName('royal_court')] Effettivi"
 qadi_office: "Ufficio del Qāḍī"
 qadi_office_desc: "Il #italic qāḍī#! è il giudice della legge sacra, il cui tribunale è la sede della giustizia in ogni città dei fedeli. Istituito nelle capitali dei nostri reami soggetti, il #italic qāḍī#! compone le dispute, registra i contratti e soppesa ogni lagnanza alla luce della #italic sharī'ah#!. Dove egli siede, l'ordine della nostra casa è mantenuto, i riottosi sono ricondotti all'obbedienza e la lealtà di un suddito si lega sempre più strettamente al suo signore."
 qadi_office_maintenance: "Mantenimento dell'Ufficio del Qāḍī"
 can_only_be_built_via_qadi_gc_action_tt: "Questo [building|e] non può essere eretto tramite la costruzione ordinaria. Viene fondato nella [capital|e] di uno [subject|e] solo tramite l'[action|e] [ShowGenericActionName('adu_build_qadi_office')], disponibile durante la [situation|e] [GetSituationByKey('golden_century').GetName] quando raggiungiamo #Y 75#! di [gc_colonial_dominance|e]"
 madinat_al_zahra: "Madīna az-Zahrā'"
 madinat_al_zahra_desc: "Conosciuta come 'la Città Radiosa', $madinat_al_zahra$ ci permetterà di accrescere ulteriormente il nostro prestigio in [ShowRegionName('iberia_region')]."
 palazzo_ajutamicristo: "Palazzo Ajutamicristo"
 palazzo_ajutamicristo_desc: "Per ornare la corte secondaria in [ShowRegionName('italy_region')], il $palazzo_ajutamicristo$ fu commissionato sia dallo stato sia dalle famiglie di mercanti, fungendo da vetrina di prestigio e ricchezza."
 italian_court_building: "Corte del Gruppo [ShowCultureGroupNameWithNoTooltip('italian_group')]"
 italian_court_building_desc: "Mantenendo corti sia nel nostro reame principale sia in [ShowRegionName('italy_region')], possiamo gestire entrambe le nobiltà in modo più efficace."
