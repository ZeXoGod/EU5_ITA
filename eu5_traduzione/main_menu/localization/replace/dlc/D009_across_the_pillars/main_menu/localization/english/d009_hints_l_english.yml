l_english:
 hint_battle_for_the_strait: "Suggerimenti: [GetSituationByKey('battle_for_the_strait').GetNameWithNoTooltip]"
 hint_battle_for_the_strait_hint_text: "$hint_battle_for_the_strait_hint_text_1$\n\n$hint_battle_for_the_strait_hint_text_2$\n\n$hint_battle_for_the_strait_hint_text_3$\n\n$hint_battle_for_the_strait_hint_text_4$\n\n$hint_battle_for_the_strait_hint_text_5$"
 hint_battle_for_the_strait_hint_text_1: "La [GetSituationByKey('battle_for_the_strait').GetName] è una [situation_with_icon|e] in cui [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetName] e [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetName] si contendono le strette acque tra l'[ShowRegionName('iberia_region')] e il [ShowRegionName('maghreb_region')], mentre [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] lotta per sopravvivere tra le due. Due indicatori misurano la contesa. L'influenza [GetCountry('GRA').Custom('IT_Sulla')][GetCountry('GRA').GetNameWithNoTooltip] oscilla tra le due grandi potenze e torna lentamente verso il centro, mentre la [granadan_sovereignty|e] mostra quanto liberamente [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] si governi da sé. Se nessuno avrà prevalso entro l'[ShowAgeName('age_3_discovery')], la lotta si concluderà in una situazione di stallo."
 hint_battle_for_the_strait_hint_text_2: "#T Come Vince Ciascuna Potenza:#!\n@arrow_bonus_tier_2! [GetCountry('CAS').Custom('IT_La')|U][GetCountry('CAS').GetNameWithNoTooltip] deve cacciare [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetNameWithNoTooltip] dall'[ShowRegionNameWithNoTooltip('iberia_region')] e controllare l'area di [ShowAreaName('granada_area')], direttamente o tramite [subjects_with_icon|e]. Deve poi fare di [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] il proprio [ShowSubjectTypeName('vassal')], con l'influenza interamente dalla propria parte, oppure conquistarla del tutto. Averla come [ShowSubjectTypeName('tributary')] non è sufficiente.\n@arrow_bonus_tier_2! [GetCountry('MOR').Custom('IT_La')|U][GetCountry('MOR').GetNameWithNoTooltip] deve controllare le aree di [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] e [ShowAreaName('murcia_area')], direttamente o tramite [subjects]. Deve poi vincolare a sé [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] come [ShowSubjectTypeName('vassal')] o [ShowSubjectTypeName('taifa')], con l'influenza interamente dalla propria parte, oppure conquistarla del tutto.\n@arrow_bonus_tier_2! [GetCountry('GRA').Custom('IT_La')|U][GetCountry('GRA').GetNameWithNoTooltip] deve restare libera da qualsiasi sovrano e controllare le stesse tre aree. Deve inoltre mantenere l'influenza entro #Y 50#! dal centro e la propria [granadan_sovereignty] sopra #Y 50#!.\n@arrow_bonus_tier_1! Se [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetNameWithNoTooltip] o [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetNameWithNoTooltip] dovesse cadere, la lotta termina subito e la potenza che controlla queste terre proclama la vittoria."
 hint_battle_for_the_strait_hint_text_3: "#T Azioni Consigliate per [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Incarichiamo il nostro [cabinet_with_icon|e] di eseguire l'azione [ShowCabinetActionName('cas_pressure_andalusi_court')], che attira ogni mese l'influenza verso di noi.\n@arrow_bonus_tier_2! Quando l'influenza pende a nostro favore di #Y 25#!, l'azione [ShowGenericActionName('cas_force_tribute')] può vincolare a noi [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] indebolita. A #Y 100#!, l'azione [ShowGenericActionName('vassalize_granada')] completa l'opera.\n@arrow_bonus_tier_1! Le azioni [ShowGenericActionName('cas_reduce_granadan_sovereignty')] e [ShowGenericActionName('cas_dismantle_fortifications')] impediscono a [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip], una volta sottomessa, di reggersi mai più da sola."
 hint_battle_for_the_strait_hint_text_4: "#T Azioni Consigliate per [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Incarichiamo il nostro [cabinet] di eseguire l'azione [ShowCabinetActionName('mor_cultivate_andalusi_influence')] e manteniamo una forte [navy_with_icon|e] nello stretto. Le flotte nelle sue acque attirano l'influenza verso il proprio possessore.\n@arrow_bonus_tier_2! L'azione [ShowGenericActionName('claim_andalusi_inheritance')] ci offre un [casus_belli_with_icon|e] contro un paese dell'[ShowRegionNameWithNoTooltip('iberia_region')], la nostra strada verso le tre aree di cui abbiamo bisogno.\n@arrow_bonus_tier_1! Quando l'influenza pende a nostro favore di #Y 25#!, l'azione [ShowGenericActionName('mor_force_tribute')] può vincolare a noi [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] indebolita, ma solo un [ShowSubjectTypeName('vassal')] o una [ShowSubjectTypeName('taifa')] conta ai fini della vittoria."
 hint_battle_for_the_strait_hint_text_5: "#T Azioni Consigliate per [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip]:#!\n@arrow_bonus_tier_3! Usiamo le azioni [ShowGenericActionName('gra_reduce_castilian_influence')] e [ShowGenericActionName('gra_reduce_moroccan_influence')] per tenere l'influenza vicina al centro, e incarichiamo il nostro [cabinet] di eseguire l'azione [ShowCabinetActionName('gra_promote_sovereignty')].\n@arrow_bonus_tier_2! La nostra [granadan_sovereignty] cresce finché restiamo indipendenti e in pace, e il nostro [prestige_with_icon|e] e il nostro [crown_power_with_icon|e] la fanno salire ulteriormente. Anche l'azione [ShowGenericActionName('gra_enforce_sovereignty')] e ogni ampliamento dell'[ShowBuildingTypeName('alhambra')] contribuiscono ad accrescerla.\n@arrow_bonus_tier_1! Ogni anno trascorso come [subject_with_icon|e] ci costa più [granadan_sovereignty] di quello precedente, e anche la guerra la erode. Più sale oltre #Y 50#!, più in fretta ridiscende, perciò va curata con attenzione.\n@hint! Un [disaster_with_icon|e] [GetCountry('CAS').Custom('IT_In')][GetCountry('CAS').GetNameWithNoTooltip] o [GetCountry('MOR').Custom('IT_In')][GetCountry('MOR').GetNameWithNoTooltip] aumenta la nostra [granadan_sovereignty] finché dura."
 hint_battle_for_the_strait_diplomatic: "\"[GetCountry('GRA').Custom('IT_La')|U][GetCountry('GRA').GetName] tende verso i propri amici. Chiunque le offra un'alleanza o una garanzia se la avvicina, e una fede condivisa se la avvicina ancora di più.\""
 hint_battle_for_the_strait_administrative: "\"L'influenza [GetCountry('GRA').Custom('IT_Sulla')][GetCountry('GRA').GetName] ritorna verso il centro a ogni mese che passa. Ogni vantaggio va coltivato, altrimenti svanirà.\""
 hint_battle_for_the_strait_military: "\"Chi comanda lo stretto comanda la lotta. Flotte nelle sue acque e guarnigioni nei suoi porti gravano [GetCountry('GRA').Custom('IT_Sulla')][GetCountry('GRA').GetName] quanto qualsiasi esercito.\""
 hint_golden_century: "Suggerimenti: [GetSituationByKey('golden_century').GetNameWithNoTooltip]"
 hint_golden_century_hint_text: "$hint_golden_century_hint_text_1$\n\n$hint_golden_century_hint_text_2$"
 hint_golden_century_hint_text_1: "Il [GetSituationByKey('golden_century').GetName] è una [situation_with_icon|e] che segue la [GetSituationByKey('battle_for_the_strait').GetName] e concede al suo vincitore un secolo di dominio sull'Europa e sul Nuovo Mondo. Quel vincitore diventa il Colosso dell'epoca, mentre rivali e vicini osservano la sua ascesa con crescente inquietudine."
 hint_golden_century_hint_text_2: "#T Come si Vince l'Epoca:#!\n@arrow_bonus_tier_2! Due indicatori misurano la portata del Colosso. Il [gc_european_dominance|e] cresce con le vittorie nelle guerre continentali e con il primato dinastico e religioso in patria, mentre il [gc_colonial_dominance|e] cresce con la colonizzazione, le flotte del tesoro e le conversioni oltremare. Entrambi salgono a scatti, e ogni soglia da #Y 25#! a #Y 100#! concede al Colosso una ricompensa duratura.\n@arrow_bonus_tier_1! Il dominio genera pericolo. Un indicatore di [flashpoint|e] sale con il peso del debito e dell'inflazione, alimentato ulteriormente dall'autorità eccessiva e dall'invidia che un grande prestigio attira. Quando si riempie, un evento decisivo colpisce il Colosso nel bene o nel male, e la [GetInternationalOrganizationType('grand_alliance').GetName] si raduna per abbatterlo. Una sconfitta in guerra può togliere #Y 25#! a ciascuno dei due indicatori, e se il Colosso perde un quarto del regno con cui aveva iniziato, il suo secolo d'oro termina prima del tempo."
 hint_golden_century_diplomatic: "\"Che siamo il Colosso o tra coloro che lo temono, sono le alleanze a plasmare quest'epoca. La potenza dominante si appoggia ai propri amici per tenere a bada la coalizione, mentre chi vorrebbe umiliarla si unisce alla [GetInternationalOrganizationType('grand_alliance').GetName] per condividere il costo della resa dei conti.\""
 hint_golden_century_administrative: "\"Un secolo d'oro si costruisce in patria tanto quanto all'estero. Curiamo il nostro [control_with_icon|e] e la lealtà dei nostri [subjects_with_icon|e], e non lasciamo che debito e disordini si aggravino, perché alimentano il prossimo [flashpoint|e].\""
 hint_golden_century_military: "\"Il dominio si conquista con la spada e con la spada si perde. Il Colosso deve difendere il regno che detiene per portare a termine il secolo, mentre i suoi nemici devono spezzare un quarto di quel regno per porre fine all'età dell'oro prima del tempo.\""
