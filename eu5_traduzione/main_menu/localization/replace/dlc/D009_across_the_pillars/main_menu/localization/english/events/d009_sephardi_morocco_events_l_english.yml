l_english:
 d009_sephardi_morocco.1.title: "Arrivano i #italic Megorashim#!"
 d009_sephardi_morocco.1.entry: "$d009_sephardi_morocco.1.title$"
 d009_sephardi_morocco.1.desc: "Da mesi ormai profughi [origin_country.Custom('IT_Dalla')][origin_country.GetNameWithNoTooltip] giungono ai nostri porti atlantici, chiamandosi #italic Megorashim#!, gli espulsi, e non chiedendo altro che un quartiere in cui stabilirsi e una sinagoga in cui pregare. [ShowLocationName('fez')] ha già una propria comunità di fede [ShowReligionAdjective('judaism')], antica e radicata, i Toshavim, che non sono del tutto certi di voler condividere la loro città, i loro tribunali o le loro usanze con nuovi arrivati che parlano un'altra lingua e seguono altri riti."
 d009_sephardi_morocco.1.a: "Diamo loro il benvenuto a [ShowLocationNameWithNoTooltip('fez')]."
 d009_sephardi_morocco.1.b: "Limitiamoli a [ShowLocationNameWithNoTooltip('tetouan')] soltanto."
 d009_sephardi_morocco.1.historical_info: "L'Editto dell'Alhambra e il suo equivalente portoghese mandarono decine di migliaia di Ebrei Sefarditi nel Maghreb. Quelli che raggiunsero il Marocco si chiamarono #italic Megorashim#!, in ebraico gli espulsi, per distinguersi dai #italic Toshavim#!, le comunità Ebraiche native del Marocco che vi vivevano da ben prima del 1492. I due gruppi si stabilirono in gran parte a Fez e Tetouan e mantennero per generazioni identità distinte, e spesso usanze giuridiche distinte."

 d009_sephardi_morocco.2.title: "#italic Megorashim#! contro #italic Toshavim#!"
 d009_sephardi_morocco.2.entry: "$d009_sephardi_morocco.2.title$"
 d009_sephardi_morocco.2.desc: "I due tribunali di fede [ShowReligionAdjective('judaism')] di [ShowLocationName('fez')] si sono infine scontrati apertamente. I rabbini dei #italic Megorashim#! sostengono che le loro usanze giuridiche [GetCountry('CAS').Custom('IT_ADJ_FP')], affinate nei secoli [GetCountry('CAS').Custom('IT_In')][GetCountry('CAS').GetNameWithNoTooltip], siano semplicemente più adatte al commercio e ai contratti dell'antico rito dei #italic Toshavim#!. I #italic Toshavim#!, com'è comprensibile, non sono d'accordo, ed entrambe le comunità si sono appellate a noi perché risolviamo la questione, o almeno perché smettiamo di fingere che la disputa si risolverà da sé."
 d009_sephardi_morocco.2.a: "Imponiamo le #italic Takkanot#! di [ShowLocationNameWithNoTooltip('fez')]."
 d009_sephardi_morocco.2.b: "Sosteniamo il rito dei #italic Toshavim#!."
 d009_sephardi_morocco.2.c: "Insistiamo sulla coesistenza."
 d009_sephardi_morocco.2.historical_info: "Le vere #italic Takkanot de Fes#! furono un corpo di ordinanze comunitarie emanate dai rabbini #italic Megorashim#! a partire dal 1494, che stabilirono gradualmente la consuetudine giuridica di influenza castigliana come rito dominante a Fez. I #italic Toshavim#! non scomparvero semplicemente: le due comunità mantennero per generazioni sinagoghe, tribunali e cimiteri in gran parte separati, e ci volle ben più di un secolo perché la distinzione si dissolvesse in un'unica comunità Ebraica di Fez."

 d009_sephardi_morocco.3.title: "La Città degli Esuli"
 d009_sephardi_morocco.3.entry: "$d009_sephardi_morocco.3.title$"
 d009_sephardi_morocco.3.desc: "[ShowLocationName('tetouan')] giacque in rovina per decenni prima che esuli [ShowCultureName('andalusi')] e [ShowCultureName('sephardi')] provenienti da [ShowRegionName('iberia_region')] la ricostruissero insieme, e il segno che hanno lasciato non è svanito. Le sue strade, i suoi mestieri e la sua parlata portano un inconfondibile sapore di [ShowRegionNameWithNoTooltip('iberia_region')], raro altrove su questa costa. Se investire ulteriormente in quell'identità o trattare semplicemente [ShowLocationNameWithNoTooltip('tetouan')] come qualunque altro porto sotto il nostro dominio è una scelta interamente nostra."
 d009_sephardi_morocco.3.a: "Investiamo nel carattere [ShowCultureNameWithNoTooltip('sephardi')] di [ShowLocationNameWithNoTooltip('tetouan')]."
 d009_sephardi_morocco.3.b: "Trattiamola come qualunque altra città."
 d009_sephardi_morocco.3.historical_info: "Tetouan era stata distrutta dalle forze castigliane nel XV secolo e giaceva in gran parte abbandonata finché profughi Musulmani andalusi ed Ebrei Sefarditi la ripopolarono intorno all'epoca delle espulsioni del 1492. La città sviluppò l'#italic Haketia#!, un distinto dialetto giudeo-spagnolo, e rimase per secoli una delle città del Marocco più visibilmente influenzate dall'Iberia, un carattere che la sua comunità Ebraica in particolare preservò fino all'epoca moderna."

 d009_sephardi_morocco.4.title: "Gli Ebrei della Corte Sa'dī"
 d009_sephardi_morocco.4.entry: "$d009_sephardi_morocco.4.title$"
 d009_sephardi_morocco.4.desc: "[target_character.GetName], medico e studioso di fede [ShowReligionAdjective('judaism')] di notevole dottrina, è giunto a [ShowLocationName('marrakesh')] in cerca di un posto alla [ROOT.GetCountry.GetGovernment.GetCourtTitle]. I predecessori del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] si sono a lungo affidati a finanzieri e intermediari di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] per trattare con le potenze di fede [ShowReligionGroupAdjective('christian')] dell'Atlantico, e non c'è alcuna ragione evidente per rompere ora con questa pratica, anche se non ogni ministro della [ROOT.GetCountry.GetGovernment.GetCourtTitle] è d'accordo."
 d009_sephardi_morocco.4.a: "Nominiamo [target_character.GetHimHer] alla [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 d009_sephardi_morocco.4.a.entry: "Nominiamolo a corte."
 d009_sephardi_morocco.4.b: "Affidiamoci soltanto a mercanti di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]."
 d009_sephardi_morocco.4.historical_info: "I sultani Sa'dī, il più famoso dei quali fu Aḥmad al-Manṣūr, si appoggiarono pesantemente a cortigiani, finanzieri e intermediari diplomatici Ebrei per gestire il commercio e i negoziati con l'Inghilterra, l'Olanda e altre potenze atlantiche, rapporti costruiti in parte sui commerci di zucchero e salnitro che finanziavano lo stato Sa'dī."

 d009_sephardi_morocco.5.title: "Il Riscatto dei Prigionieri"
 d009_sephardi_morocco.5.entry: "$d009_sephardi_morocco.5.title$"
 d009_sephardi_morocco.5.desc: "La pace con [GetCountry('POR').Custom('IT_La')][GetCountry('POR').GetNameWithNoTooltip] è stata firmata, ma ha lasciato [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] con moltissimi prigionieri [GetCountry('POR').Custom('IT_ADJ_MP')], e i nostri mercanti di fede [ShowReligionAdjective('judaism')], che mantengono contatti commerciali oltre lo stretto che pochi dei nostri funzionari possono eguagliare, si sono offerti di mediare il loro riscatto. È, in ogni caso, un affare lucroso da affidare a uomini della cui lealtà alcuni alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] dubitano ancora in silenzio."
 d009_sephardi_morocco.5.a: "Autorizziamo il riscatto tramite intermediari di fede [ShowReligionAdjectiveWithNoTooltip('judaism')]."
 d009_sephardi_morocco.5.b: "Gestiamolo soltanto tramite intermediari di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]."
 d009_sephardi_morocco.5.historical_info: "Dopo la vittoria Sa'dī su una forza d'invasione portoghese nella battaglia di El-Qaṣr al-Kabir (Alcácer-Quibir) nel 1578, i mercanti Ebrei del Marocco ebbero un ruolo documentato nel mediare il riscatto di nobili e soldati portoghesi catturati, restituiti all'Iberia: un affare lucroso e diplomaticamente delicato, date le loro reti commerciali su entrambe le sponde dello stretto."
 d009_morocco_has_jewish_pops_tt: "Le nostre terre ospitano [pops|e] di fede [ShowReligionAdjectiveWithNoTooltip('judaism')]"

 d009_sephardi_morocco.6.title: "Il Mallāḥ di [ShowLocationNameWithNoTooltip('meknes')]"
 d009_sephardi_morocco.6.entry: "$d009_sephardi_morocco.6.title$"
 d009_sephardi_morocco.6.desc: "[target_character.GetName], finanziere di una certa fama, propone che il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] formalizzi un vero quartiere di fede [ShowReligionAdjective('judaism')] all'interno di [ShowLocationName('meknes')] stessa, completo di carta propria, diritti di mercato e tribunali. Fare di [ShowLocationNameWithNoTooltip('meknes')] un luogo in cui i mercanti di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] vogliano stabilirsi, sostiene [target_character.GetSheHe], si ripagherà molte volte in sole tasse e commerci."
 d009_sephardi_morocco.6.a: "Concediamo la carta."
 d009_sephardi_morocco.6.b: "Escludiamo gli Ebrei da [ShowLocationNameWithNoTooltip('meknes')]."
 d009_sephardi_morocco.6.historical_info: "Il sultano Moulay Ismail fece di Meknes la propria capitale imperiale e, come altri sovrani alawiti, si affidò a finanzieri Ebrei per gestire il tesoro e il commercio atlantico, il più famoso dei quali fu Joseph Maimaran, ricordato nella tradizione Ebraica marocchina come figura chiave delle finanze di corte di Meknes. Un quartiere Ebraico formale, o mallāḥ, fu istituito in città nell'ambito del suo sviluppo a capitale imperiale."

 d009_sephardi_morocco.7.title: "Samuel Pallache, il Corsaro Diplomatico"
 d009_sephardi_morocco.7.entry: "$d009_sephardi_morocco.7.title$"
 d009_sephardi_morocco.7.desc: "[target_character.GetName] conduce una curiosa doppia vita: un giorno negozia privilegi commerciali per nostro conto con [GetCountry('HOL').Custom('IT_La')][GetCountry('HOL').GetNameWithNoTooltip], il giorno dopo comanda navi corsare che assaltano il naviglio Spagnolo e [GetCountry('POR').Custom('IT_ADJ_MS')] senza alcuna commissione da noi mai firmata. [target_character.GetSheHe|U] insiste che entrambe le attività servano allo stesso fine, ed è difficile sostenere che i risultati di [target_character.GetHerHis] siano stati altro che eccellenti per il nostro tesoro."
 d009_sephardi_morocco.7.a: "Conferiamo un incarico formale."
 d009_sephardi_morocco.7.b: "Manteniamo l'accordo non ufficiale."
 d009_sephardi_morocco.7.historical_info: "Samuel Pallache fu un vero diplomatico Ebreo marocchino che servì la corte Sa'dī come inviato in Olanda all'inizio del Seicento, contribuendo a negoziare uno dei primi trattati del Marocco con una potenza atlantica europea, pur detenendo al contempo lettere di corsa che gli permettevano di assaltare il naviglio Spagnolo come corsaro. Questa combinazione di arte di governo e pirateria scandalizzò più di una corte europea da lui visitata."

 d009_sephardi_morocco.8.title: "[ShowLocationNameWithNoTooltip('tangier')] sotto il Dominio [ROOT.GetCountry.Custom('IT_ADJ_MS')]"
 d009_sephardi_morocco.8.entry: "Tangeri sotto un Nuovo Dominio"
 d009_sephardi_morocco.8.desc: "Comunque [ShowLocationName('tangier')] sia finita nelle mani della nostra corona, ci ritroviamo ora improbabili governanti di una comunità stabile di fede [ShowReligionAdjective('judaism')], l'unica sotto la nostra bandiera. È una posizione imbarazzante per un regno che per generazioni ha tenuto le proprie coste chiuse agli insediamenti di fede [ShowReligionAdjectiveWithNoTooltip('judaism')], e il nostro consiglio non è unanime su cosa, se qualcosa, debba cambiare a causa di ciò."
 d009_sephardi_morocco.8.a: "Tolleriamo la comunità."
 d009_sephardi_morocco.8.b: "Imponiamo severe restrizioni."
 d009_sephardi_morocco.8.b.tt: "La comunità di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] di [ShowLocationNameWithNoTooltip('tangier')] diventa profondamente insoddisfatta del nostro dominio"
 d009_sephardi_morocco.8.historical_info: "Tangeri passò alla Corona inglese nel 1661 come parte della dote nuziale di Caterina di Braganza a Carlo II, portando con sé una piccola comunità Ebraica stabile, tra l'altro l'unica comunità Ebraica che viveva sotto dominio inglese in tutto il mondo all'epoca, poiché gli Ebrei erano stati formalmente espulsi dall'Inghilterra stessa nel 1290 e non vi furono riammessi fino al 1656."

 d009_sephardi_morocco.9.title: "[ShowLocationNameWithNoTooltip('mogador')], i Mercanti del Sultano"
 d009_sephardi_morocco.9.entry: "$d009_sephardi_morocco.9.title$"
 d009_sephardi_morocco.9.desc: "Il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] ha commissionato un porto del tutto nuovo a [ShowLocationName('mogador')], pianificato dal nulla su un tratto di costa vuoto, e propone di concedere a una cerchia ristretta di case mercantili di fede [ShowReligionAdjective('judaism')] un monopolio di fatto sul suo commercio atlantico in cambio della loro lealtà e dei loro capitali. Ogni mercante rimasto fuori da questo accordo ha già fatto sapere esattamente come la pensa."
 d009_sephardi_morocco.9.a: "Concediamo il monopolio."
 d009_sephardi_morocco.9.b: "Dividiamo il commercio tra tutti i mercanti."
 d009_sephardi_morocco.9.historical_info: "Il sultano Mohammed III fondò Mogador negli anni 1760 come porto deliberatamente pianificato e concesse a un gruppo scelto di famiglie mercantili Ebraiche, ricordate come #italic Tujjar as-Sultān#! (i Mercanti del Sultano), uno status privilegiato ed esenzioni fiscali per gestirne il commercio atlantico ed europeo. L'accordo fece di Mogador una delle comunità mercantili Ebraiche più prospere della storia moderna del Marocco."

 d009_sephardi_morocco.10.title: "Il Mallāḥ di [ShowLocationNameWithNoTooltip('fez')]"
 d009_sephardi_morocco.10.entry: "$d009_sephardi_morocco.10.title$"
 d009_sephardi_morocco.10.desc: "Per generazioni i nostri sudditi di fede [ShowReligionAdjective('judaism')] di [ShowLocationName('fez')] hanno vissuto sparsi per [ShowLocationNameWithNoTooltip('fez')] come qualunque altra comunità. I ministri del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] propongono ora di formalizzare per loro un unico quartiere cinto da mura, con carta propria, mercato proprio e porte proprie, una misura che i suoi sostenitori chiamano protezione e i suoi critici chiamano qualcosa di considerevolmente meno generoso."
 d009_sephardi_morocco.10.a: "Istituiamo il Mallāḥ."
 d009_sephardi_morocco.10.a.tt: "La comunità di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] di [ShowLocationNameWithNoTooltip('fez')] viene confinata in un unico quartiere cinto da mura"
 d009_sephardi_morocco.10.b: "Permettiamo loro di vivere liberamente."
 d009_sephardi_morocco.10.historical_info: "Il Mallāḥ di Fez, istituito nel 1438, fu il primo quartiere Ebraico costruito appositamente in Marocco e divenne il modello per analoghi mallāḥ in tutto il paese nei secoli successivi. I resoconti della sua fondazione divergono sul fatto che fosse principalmente una misura protettiva, che allontanava la comunità Ebraica da una turbolenta guarnigione della cittadella, o una misura segregante: in pratica, fu probabilmente un po' entrambe le cose."
