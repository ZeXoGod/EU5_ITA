l_english:
 game_concept_granadan_sovereignty: "Sovranità Granadina"
 game_concept_granadan_sovereignty_desc: "Una misura di quanto liberamente [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] si governa durante la [ShowSituationName('battle_for_the_strait')], stretta tra [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetName] e [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetName]."

 game_concept_gc_colonial_dominance: "Dominio Coloniale"
 game_concept_gc_colonial_dominance_desc: "Una misura del potere che il [country|e] protagonista della [ShowSituationName('golden_century')] detiene nel Nuovo Mondo, aumentata a scatti dalla colonizzazione, dalle flotte del tesoro e dalla conversione d'oltremare. Man mano che sale, sblocca contenuti unici e bonus di status finché la situazione rimane attiva."

 game_concept_gc_european_dominance: "Dominio Europeo"
 game_concept_gc_european_dominance_desc: "Una misura del potere che il [country|e] protagonista della [ShowSituationName('golden_century')] detiene sull'Europa, aumentata a scatti dalla vittoria nelle guerre continentali, dai possedimenti chiave e dal primato dinastico e religioso. Man mano che sale, sblocca contenuti unici e bonus di status finché la situazione rimane attiva."

 game_concept_flashpoint: "Punto Critico"
 game_concept_flashpoint_desc: "Un momento decisivo che si attiva quando la [ShowSituationName('golden_century')] raggiunge una fase critica. Un Punto Critico fa scattare un evento che scuote l'intero paese, nel bene o nel male: un potente bonus, una guerra civile o un altro sconvolgimento che ridisegna il reame."
