l_english:
 goods_camels.1.title: "La Grande Carovana del Deserto"
 goods_camels.1.desc: "Un consorzio di mercanti con base a [ROOT.GetCountry.GetCapital.GetName] ha proposto di organizzare una grande carovana del deserto per collegare i nostri mercati a lontani partner commerciali attraverso gli aridi entroterra.\n\nL'impresa promette profitti considerevoli in [ShowGoodsName('camels')] e beni correlati, ma garantire la rotta e fornire le guardie richiederà un notevole sostegno [ROOT.GetCountry.GetGovernment.GetAdjective]. I mercanti sono impazienti e attendono la nostra risposta."
 goods_camels.1.a: "Sosteniamo questa impresa."
 goods_camels.1.b: "Possono procedere, ma a un prezzo."

 goods_camels.2.title: "Razze di Pregio"
 goods_camels.2.desc: "I nostri allevatori del deserto a [target_location.GetName] riferiscono che anni di attenta selezione hanno prodotto una varietà di cammello notevole per forza, resistenza e capacità di portare carichi più pesanti senza richiedere più acqua.\n\nChiedono il patrocinio [ROOT.GetCountry.GetGovernment.GetAdjective] per ampliare il programma e istituire pascoli dedicati. I nostri comandanti di cavalleria, nel frattempo, hanno una proposta concorrente: che gli animali migliori siano invece distribuiti alla cavalleria del deserto."
 goods_camels.2.a: "Finanziamo il programma di allevamento."
 goods_camels.2.b: "Distribuiamo gli animali migliori alla nostra cavalleria."

 goods_camels.3.title: "Quando i Pozzi si Prosciugano"
 goods_camels.3.desc: "Una grave siccità ha colpito i nostri territori desertici. I pozzi si stanno esaurendo, i raccolti avvizziscono e la popolazione soffre.\n\nIn queste condizioni disperate, i cammelli sono diventati l'unico mezzo affidabile per trasportare merci, acqua e persone attraverso la landa desolata. La questione che si pone a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] è se riservare le mandrie ai soccorsi interni o cogliere l'occasione e vendere a disperati acquirenti stranieri a prezzi elevati."
 goods_camels.3.a: "Diamo la priorità prima di tutto al nostro popolo."
 goods_camels.3.b: "Esportiamo a prezzi elevati finché la domanda è alta."

 goods_camels.4.title: "La Via dei Pellegrini"
 goods_camels.4.desc: "Un gran numero di pellegrini sta attraversando [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] diretto a lontani luoghi santi, ed è affamato di cammelli per trasportare le provviste attraverso il deserto.\n\nI pellegrini parlano di una benedizione divina per chi aiuta il loro passaggio. I nostri mercanti, tuttavia, vedono un'occasione per farsi pagare lautamente il servizio."
 goods_camels.4.a: "Assistiamo i pellegrini gratuitamente."
 goods_camels.4.b: "Facciamoli pagare per il privilegio."

 goods_camels.5.title: "Razziatori sulla Via delle Carovane"
 goods_camels.5.desc: "Razziatori nomadi hanno iniziato a depredare le carovane di cammelli che attraversano il nostro territorio, uccidendo mercanti, rubando animali e interrompendo i commerci.\n\nI capi delle carovane chiedono un intervento, o devieranno i loro convogli attraverso terre più sicure, portando altrove il loro denaro. Dobbiamo scegliere tra una costosa soluzione militare e un accordo più pragmatico con i razziatori stessi."
 goods_camels.5.a: "Inviamo scorte militari lungo le vie delle carovane."
 goods_camels.5.b: "Negoziamo un passaggio sicuro con i razziatori."

 goods_camels.6.title: "La Proposta del Generale"
 goods_camels.6.desc: "Il comandante del deserto più esperto di [ROOT.GetCountry.GetGovernment.GetRuler.GetName] ha presentato una proposta formale per integrare unità di cavalleria cammellata in tutto l'esercito.\n\nI cammelli, sostiene, possono manovrare meglio dei cavalli in terreno arido, trasportare carichi di rifornimenti maggiori e sopportare condizioni che lasciano esausti i destrieri da guerra. La proposta è valida, ma non tutti nel corpo ufficiali sono pronti ad abbandonare il prestigio della cavalleria."
 goods_camels.6.a: "Adottiamo la dottrina cammellata in tutto l'esercito."
 goods_camels.6.b: "La nostra cavalleria ci ha serviti bene. Teniamo i cavalli."

 goods_camels.7.title: "La Domanda Straniera"
 goods_camels.7.desc: "Mercanti stranieri sono giunti ai nostri mercati con una quantità considerevole di argento, desiderosi di acquistare un gran numero di cammelli da impiegare in eserciti lontani e in spedizioni commerciali. Le loro offerte sono generose.\n\nTuttavia, esportare così tanti animali indebolirebbe inevitabilmente la nostra produzione e le nostre scorte, e alcuni consiglieri avvertono che eserciti stranieri ben montati potrebbero un giorno essere usati contro di noi."
 goods_camels.7.a: "Apriamo il commercio. Che l'argento fluisca."
 goods_camels.7.b: "Limitiamo l'esportazione di cammelli."

 goods_camels.8.title: "L'Eccesso delle Mandrie"
 goods_camels.8.desc: "Anni di crescente allevamento di cammelli hanno infine prodotto un problema inatteso: ci sono semplicemente troppi cammelli.\n\nI mercati sono saturi, i prezzi sono crollati e gli animali consumano foraggio più in fretta di quanto il deserto riesca a ricostituirlo. Bisogna fare qualcosa. Possiamo abbattere le mandrie in eccedenza per ripristinare l'equilibrio, oppure cercare nuovi mercati all'estero che assorbano il surplus, a un certo costo e con notevole impegno diplomatico."
 goods_camels.8.a: "Abbattiamo l'eccedenza. Meglio una mandria più piccola che la rovina."
 goods_camels.8.b: "Inviamo emissari a cercare nuovi acquirenti all'estero."

 goods_camels.9.title: "Un Incidente Diplomatico"
 goods_camels.9.desc: "Durante un ricevimento formale a corte, il pregiato cammello da esposizione di [ROOT.GetCountry.GetGovernment.GetRuler.GetName], portato per impressionare gli ospiti riuniti, ha preso una profonda e apparentemente personale antipatia per [target_character.GetName] [offended_country.Custom('IT_Della')][offended_country.GetLongName]. Senza alcun preavviso, ha scaricato l'intero contenuto del suo stomaco direttamente sul [target_character.GetHerHis] abito cerimoniale.\n\n[target_character.GetSheHe|U] è incandescente di furia, e il [target_character.GetHerHis] seguito ha già iniziato a redigere una lettera di protesta formale."
 goods_camels.9.a: "Le nostre più profonde scuse. E, a quanto pare, il nostro tesoro."
 goods_camels.9.b: "La bestia è semplicemente un acuto giudice del carattere."

 goods_camels.10.title: "Il Grande Concorso di Bellezza dei Cammelli"
 goods_camels.10.desc: "La nobiltà di [ROOT.GetCountry.GetCapital.GetName] ha organizzato quello che insiste essere un concorso di bellezza dei cammelli perfettamente legittimo e culturalmente significativo. Sono state scommesse somme consistenti.\n\nDue potenti famiglie nobili sono ora sull'orlo di una faida su quale sia l'attributo superiore in un cammello da premio: un collo lungo o una gobba ben formata. È stato richiesto il giudizio personale di [ROOT.GetCountry.GetGovernment.GetRuler.GetName] come spareggio decisivo. I concorrenti, e i loro cammelli, sono riuniti e in attesa."
 goods_camels.10.a: "Un governante deve servire il proprio popolo in ogni cosa."
 goods_camels.10.b: "Ho questioni ben più urgenti di cui occuparmi."
