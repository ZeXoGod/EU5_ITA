l_english:
 muqni_at_al_sa_il: "Muqni'at as-Sā'il 'an al-Maraḍ al-Hā'il"
 muqni_at_al_sa_il_desc: "Mentre la Peste Nera svuotava le strade di Granada, il visir e medico Lisan al-Din ibn al-Khatib rifiutò la comoda dottrina secondo cui la peste si diffondeva per solo decreto divino. Osservò il morbo passare dai malati ai sani attraverso il respiro, gli abiti e le stanze condivise, e mise per iscritto ciò che vide.\n\nLa sua insistenza sul fatto che la malattia si trasmettesse per contatto lo pose in contrasto con i giuristi, che ritenevano una simile affermazione ai limiti dell'empietà. L'argomentazione sopravvisse comunque, copiata dai medici da Fez al Cairo molto tempo dopo che il peggio della peste era passato."
