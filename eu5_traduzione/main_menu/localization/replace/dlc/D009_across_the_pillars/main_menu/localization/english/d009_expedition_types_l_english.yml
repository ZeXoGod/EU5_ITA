l_english:
 gold_caravan_expedition: "La Carovana dell'Oro"
 gold_caravan_expedition_desc: "Inviamo una carovana verso sud attraverso il Sahara, fino ai mercati dorati del #italic Bilād as-Sūdān#!, scambiando sale e stoffe con le ricchezze del Sahel. La strada è lunga e il deserto perigliosa, ma una carovana che farà ritorno verserà l'oro del Sahel nel mercato della vostra capitale."
 gold_caravan_expedition_haul_tt: "#G [ROOT.GetVariable('gold_caravan_last_haul').GetValue|V0]#! [ShowGoodsName('goods_gold')] aggiunti all'offerta del nostro mercato di [ROOT.GetCountry.GetCapital.GetName]"
 gold_caravan_outcome_windfall: "I mercanti accorrono per il successo della carovana"
 gold_caravan_outcome_nickname: "Il capo della carovana si guadagna una fama dorata"
 gold_caravan_outcome_midas: "Il governante è toccato dalle ricchezze della carovana"
 gold_caravan_outcome_leader_skills: "Il capo della carovana acquisisce un'esperienza duramente conquistata"
 cibola_expedition: "Alla Ricerca delle Sette Città di Cibola"
 cibola_expedition_desc: "Equipaggiamo una colonna che si spinga a nord dalla costa di Sonora verso la regione che i frati e gli schiavi fuggiaschi descrivono come la terra dei sette pueblos d'oro. Il percorso è duro e i nativi dicono che sia inospitale, ma gli stessi frati sostengono che ciò che attende alla fine sia più grande di qualunque cosa mai vista."
 quivira_expedition: "Alla Ricerca del Regno di Quivira"
 quivira_expedition_desc: "Spingiamoci oltre la terra dei Pueblos, nella prateria aperta che corre a est senza fine, sulla parola di una guida prigioniera che afferma che un regno ricco si trovi a un mese di marcia nelle pianure. Il mare d'erba è deserto e i fiumi scorrono pigri, ma il premio, se il premio è reale, eguaglierebbe la conquista del Perù."
 sierra_de_la_plata_expedition: "Alla Ricerca della Sierra de la Plata"
 sierra_de_la_plata_expedition_desc: "Spingiamoci a ovest e a nord dal Plata fin sulle pendici delle Ande all'inseguimento della Sierra de la Plata, la montagna d'argento descritta dalle guide Guaraní e che i sopravvissuti della spedizione di Solís giurarono essere reale. Se la montagna verrà trovata, non sarà la scoperta di una sola miniera, ma di un'intera economia del metallo prezioso in attesa di essere aperta."
 norumbega_expedition: "Alla Ricerca di Norumbega"
 norumbega_expedition_desc: "Risaliamo il Penobscot dalla costa della Nuova Inghilterra in cerca di Norumbega, la città fortificata del grande fiume di cui hanno riferito tanto i piloti di Verrazzano quanto i pescatori di Bristol. La regione è fittamente boscosa, il fiume è lungo e i nativi sono riservati, ma la città, se esiste, sarebbe il primo insediamento di stampo Europeo nel Nuovo Mondo e il secondo non costruito da noi."
 saguenay_expedition: "Alla Ricerca del Regno di Saguenay"
 saguenay_expedition_desc: "Risaliamo il Saguenay dal San Lorenzo verso l'interno della Nuova Francia in cerca del regno che Donnacona descrisse a Cartier a Stadacona: una terra, disse il capo, di uomini dalla pelle chiara in mantelli di pelliccia, di montagne d'oro e fiumi d'argento, situata da qualche parte a nord del grande fiume Canadese. Cartier non vi giunse mai. Noi forse sì."
 city_of_caesars_expedition: "Alla Ricerca della Città dei Cesari"
 city_of_caesars_expedition_desc: "Inviamo una spedizione via terra da [ShowRegionName('la_plata_region')] verso sud, nell'interno della Patagonia, sulla scorta del racconto di sopravvissuti di un galeone perduto, che affermano di aver visto una città costruita tra due montagne, i cui abitanti parlano uno spagnolo Castigliano che nessuna corte vivente riconoscerebbe. L'inverno Patagonico è aspro e i sopravvissuti sono testimoni inattendibili, ma nessuna indagine è mai stata compiuta."
 city_of_caesars_expedition_historical_info: "La leggenda della Città dei Cesari, un insediamento ispanofono fondato dai sopravvissuti di un naufragio del XVI secolo sulla costa Patagonica e che si diceva nascosto nell'interno della regione, fu ritenuta credibile dalla corona spagnola fino al XVIII secolo inoltrato. Almeno sette spedizioni furono inviate alla sua ricerca tra il 1530 e il 1750. Nessuna trovò nulla. La leggenda persistette in parte perché la Patagonia era davvero difficile da rilevare all'epoca, in parte perché i sopravvissuti ai naufragi ricomparivano di tanto in tanto con storie elaborate per spiegare la loro lunga assenza, e in parte perché la tendenza istituzionale delle burocrazie coloniali era sempre quella di agire su una voce credibile anziché ignorarla."
 city_of_caesars_expedition_outcome_overview: "$BULLET$La ricerca stessa concede un flusso costante di [prestige|e] finché dura.\n$BULLET$L'esito dipende poi da quante piste vengono trovate:\n$BULLET_WITH_TAB$Nessuna: #R -5#! [prestige].\n$BULLET_WITH_TAB$Una o più: #G +10#! [prestige], [gold|e] e il [location_modifier|e] permanente [ShowModifier('city_of_caesars_discovered')] sul sito della città.\n$BULLET_WITH_TAB$Quattro o più: #G +20#! [prestige] e molti più [gold].\n$BULLET$Ogni ricchezza raccolta lungo il cammino viene consegnata al nostro [market|e], e i reperti più pregiati diventano un'[work_of_art|e]."
 el_dorado_expedition: "Alla Ricerca di El Dorado"
 el_dorado_expedition_desc: "Addentriamoci nell'entroterra dal delta dell'Orinoco all'inseguimento del re dorato che i Muisca ricordano: un capo unto ogni anno con polvere d'oro nel cuore di un regno che nessuno stivale spagnolo ha ancora raggiunto. La giungla è fitta, i fiumi sono tortuosi, i nativi sono cauti, e l'oro, se l'oro è reale, si trova da qualche parte oltre tutti e tre."
 el_dorado_expedition_historical_info: "Guatavita è un lago di cratere sacro negli altopiani dell'attuale Colombia, centro di culto della confederazione Muisca che dominò la savana di Bogotà fino all'arrivo degli Spagnoli negli anni Trenta del Cinquecento. La cerimonia al cuore della leggenda di El Dorado, l'unzione periodica di un nuovo capo con polvere d'oro prima che fosse condotto in barca sul lago e la polvere venisse lavata via nelle acque, era reale e fu celebrata a Guatavita fino ai primi tempi del periodo coloniale. Il regno che la celebrava, tuttavia, era già in pieno collasso quando la prima spedizione Europea raggiunse la savana, devastato dal vaiolo e dalla crisi politica che l'arrivo delle malattie europee produsse quasi ovunque."
 el_dorado_expedition_outcome_overview: "$BULLET$La ricerca stessa concede un flusso costante di [prestige|e] finché dura.\n$BULLET$L'esito dipende poi da quante piste vengono trovate:\n$BULLET_WITH_TAB$Nessuna: #R -10#! [prestige].\n$BULLET_WITH_TAB$Una o più: #G +10#! [prestige], [gold|e] e il [location_modifier|e] permanente [ShowModifier('el_dorado_discovered')] sul sito della città.\n$BULLET_WITH_TAB$Cinque o più: #G +20#! [prestige] e molti più [gold].\n$BULLET$Ogni ricchezza, bene esotico e reperto raccolto lungo il cammino viene consegnato al nostro [market|e], e i più pregiati diventano un'[work_of_art|e]."
 fountain_of_youth_expedition: "Alla Ricerca della Fonte della Giovinezza"
 fountain_of_youth_expedition_desc: "Equipaggiamo una piccola spedizione verso la penisola della Florida in cerca della sorgente che i Taino chiamano Fonte di Bimini: un'acqua, dicono gli anziani, che restituisce a un uomo il vigore e a una donna la bellezza dei vent'anni. I soldati spagnoli ridono di questa idea. I vecchi delle isole no."
 fountain_of_youth_expedition_historical_info: "Il viaggio di Ponce de León in Florida nel 1513 è convenzionalmente associato alla ricerca della Fonte della Giovinezza, ma l'associazione è posteriore a Ponce de León stesso: compare per la prima volta nelle cronache spagnole dopo la sua morte e fu consolidata da storici successivi, per i quali quella cornice pittoresca era utile. Il viaggio vero e proprio fu una routinaria missione di ricognizione finanziata da un investitore privato che voleva stabilire un avamposto per la tratta di schiavi su quella che allora si credeva un'isola. La Fonte finì legata al nome di Ponce de León perché egli morì ancora relativamente giovane, sulla cinquantina, per una ferita di freccia riportata in Florida, un'ironia a cui i narratori spagnoli della generazione successiva non seppero resistere."
 fountain_of_youth_expedition_outcome_overview: "$BULLET$La ricerca stessa concede un flusso costante di [prestige|e] finché dura.\n$BULLET$L'esito dipende poi da quante piste vengono trovate:\n$BULLET_WITH_TAB$Nessuna: #R -5#! [prestige].\n$BULLET_WITH_TAB$Una o più: #G +10#! [prestige] e il [location_modifier|e] permanente [ShowModifier('fountain_of_youth_discovered')].\n$BULLET_WITH_TAB$Cinque o più: #G +20#! [prestige].\n$BULLET$Ogni acqua recuperata prolunga la vita sia del nostro [ruler|e] sia del nostro [heir|e] tramite [ShowModifier('rejuvenating_waters_modifier')], e un guaritore nativo può unirsi alla nostra corte come nuovo [character|e]."
 gold_fleet_tierra_firme_expedition: "Galeones de Tierra Firme"
 gold_fleet_tierra_firme_expedition_desc: "Inviamo un convoglio di galeoni dal nostro miglior porto di origine verso i nostri possedimenti della Nuova Granada e dell'Istmo, raccogliendo argento, gemme e pellami. La flotta di Tierra Firme è l'arteria dell'impero coloniale spagnolo, e porta la ricchezza delle Indie ai mercati di Siviglia."
 gold_fleet_tierra_firme_expedition_historical_info: "I #italic Galeones de Tierra Firme#! erano uno dei due convogli che componevano la #italic Carrera de Indias#! spagnola. La flotta di Tierra Firme serviva i viceregni sudamericani, raccogliendo l'argento delle miniere di Potosí nell'Alto Perù e altre entrate coloniali attraverso i porti di Portobelo e Cartagena. L'argento veniva trasportato via terra dalla costa del Pacifico attraverso l'istmo di Panama prima di essere imbarcato. Filippo II formalizzò il sistema dei convogli nel 1566, imponendo che tutto il commercio viaggiasse in flotte armate e transitasse per la #italic Casa de Contratación#! di Siviglia, che riscuoteva il #italic quinto real#! della corona, un quinto di tutti i metalli preziosi estratti dal Nuovo Mondo."
 gold_fleet_tierra_firme_expedition_outcome_overview: "Il convoglio carica il nostro [ShowGoodsName('silver')] e il nostro [ShowGoodsName('goods_gold')] coloniali e li consegna in patria come [gold|e], con #G +10#! [prestige|e] all'arrivo. Imbarcare [ShowGoodsName('gems')], [ShowGoodsName('pearls')] o una carovana di muli accresce ulteriormente il carico ma attira più attenzione, mentre l'incontro con la $gold_fleet_nueva_espana_expedition$ a [ShowScriptedGeographyName('island_of_cuba_geography')] concede #G +10#! [prestige] e rende la traversata più sicura. Tempeste e predoni possono sottrarre una parte del carico o, nel peggiore dei casi, tutto."
 gold_fleet_nueva_espana_expedition: "Flota de Nueva España"
 gold_fleet_nueva_espana_expedition_desc: "Inviamo il convoglio della Nuova Spagna dal nostro miglior porto di origine verso i nostri possedimenti mesoamericani, raccogliendo argento e coloranti preziosi. La flotta passa per il Passaggio della Mona nei Caraibi prima di riunirsi all'Avana per la traversata atlantica."
 gold_fleet_nueva_espana_expedition_historical_info: "La #italic Flota de Nueva España#! era uno dei due convogli che componevano la #italic Carrera de Indias#! spagnola. Serviva il Viceregno della Nuova Spagna, raccogliendo l'argento delle miniere di Zacatecas, Guanajuato e altri giacimenti messicani attraverso il porto di San Juan de Ulúa presso Veracruz, insieme a merci di alto valore tra cui la cocciniglia di Oaxaca, l'indaco, la vaniglia e il cacao. La #italic flota#! partiva di norma dalla Spagna in primavera e tornava in autunno, unendosi ai galeoni di Tierra Firme all'Avana per la traversata atlantica combinata. La rotta attraverso il Passaggio della Mona, tra Hispaniola e Porto Rico, era il consueto punto d'ingresso nei Caraibi orientali."
 gold_fleet_nueva_espana_expedition_outcome_overview: "Il convoglio carica il nostro [ShowGoodsName('silver')] e il nostro [ShowGoodsName('goods_gold')] coloniali e li consegna in patria come [gold|e], con #G +10#! [prestige|e] all'arrivo. Scortare un convoglio d'argento o imbarcare [ShowGoodsName('lumber')] accresce ulteriormente il carico ma attira più attenzione, mentre l'incontro con i $gold_fleet_tierra_firme_expedition$ a [ShowScriptedGeographyName('island_of_cuba_geography')] concede #G +10#! [prestige] e rende la traversata più sicura. Tempeste e predoni possono sottrarre una parte del carico o, nel peggiore dei casi, tutto."
 gold_fleet_tierra_firme_expedition_expedition_special: "Carico a bordo: [EXPEDITION.GetVariable('gold_fleet_cargo')|0] ducati"
 gold_fleet_nueva_espana_expedition_expedition_special: "Carico a bordo: [EXPEDITION.GetVariable('gold_fleet_cargo')|0] ducati"
 gold_fleet_tierra_firme_cooldown: "Riallestimento dei Galeones de Tierra Firme dopo l'ultima traversata"
 gold_fleet_nueva_espana_cooldown: "Riallestimento della Flota de Nueva España dopo la sua ultima traversata"
 gold_fleet_cargo: "Carico di Tesori"
 gold_fleet_cargo_desc: "Argento e oro caricati a bordo durante il viaggio, consegnati al tesoro al sicuro ritorno della flotta."
 gold_fleet_danger: "Livello di Pericolo"
 gold_fleet_danger_desc: "Il rischio di attacchi pirata e di altre sventure lungo la rotta. Aumenta e diminuisce con le scelte compiute durante il viaggio."
