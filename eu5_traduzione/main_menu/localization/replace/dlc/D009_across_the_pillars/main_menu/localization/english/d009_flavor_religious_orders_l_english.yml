l_english:

 d009_flavor_religious_orders.1.title: "Un Cambio al Vertice"
 d009_flavor_religious_orders.1.entry: "$d009_flavor_religious_orders.1.title$"
 d009_flavor_religious_orders.1.desc: "[old_head_of_order.GetName], che ha servito lealmente la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] come capo dell'[target_order.GetName], si è improvvisamente ammalat[old_head_of_order.Custom('IT_ART_O_A')] e ha rassegnato le dimissioni dal proprio incarico.\n\nSebbene molti illustri cavalieri e nobili desiderino ascendere a tale carica, è chiaro che [target_ruler.GetShortName] ha già in mente qualcuno per il compito. [target_character.GetShortName], favorit[target_character.Custom('IT_ART_O_A')] di [target_ruler.GetHimHerFormal], sarebbe un Gran Maestro assai obbediente dell'[target_order.GetNameWithNoTooltip], qualora negassimo ai confratelli la loro scelta."
 d009_flavor_religious_orders.1.a: "[target_character.GetShortName] sarà il nuovo Gran Maestro."
 d009_flavor_religious_orders.1.a.entry: "Il nostro favorito sarà il nuovo Gran Maestro."
 d009_flavor_religious_orders.1.b: "I confratelli dell'[target_order.GetNameWithNoTooltip] sceglieranno da sé il proprio Gran Maestro."
 d009_flavor_religious_orders.1.b.entry: "I confratelli sceglieranno da sé il proprio Gran Maestro."

 d009_flavor_religious_orders.2.title: "La Crescente Influenza di [target_character.GetNameWithNoTooltip]"
 d009_flavor_religious_orders.2.entry: "La Crescente Influenza del Gran Maestro"
 d009_flavor_religious_orders.2.desc: "Negli ultimi anni, la ricchezza e il potere di [target_character.GetName] sono cresciuti in modo considerevole. Se un simile aumento dei beni personali non è insolito per un Gran Maestro dell'[target_order.GetName], [target_character.GetSheHe] sembra anche aver preso gusto alla politica della capitale. Un tempo favorit[target_character.Custom('IT_ART_O_A')] di [target_ruler.GetNameWithNoTooltip], ora è un'abitudine comune vedere [target_character.GetNameWithNoTooltip] criticare il nostro governo e la nostra guida, spingendo molti membri [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a chiederne la destituzione da Gran Maestro."
 d009_flavor_religious_orders.2.a: "[target_character.GetSheHe|U] fa ciò che è meglio per [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.2.a.entry: "Fa ciò che è meglio per il nostro paese."
 d009_flavor_religious_orders.2.b: "[target_character.GetSheHe|U] sta oltrepassando i propri limiti."
 d009_flavor_religious_orders.2.b.entry: "Sta oltrepassando i propri limiti."

 d009_flavor_religious_orders.3.title: "Il Favorito Caduto in Disgrazia"
 d009_flavor_religious_orders.3.entry: "$d009_flavor_religious_orders.3.title$"
 d009_flavor_religious_orders.3.desc: "Le pose politiche di [target_character.GetName] continuano a generare animosità tra [target_character.GetHerHim] e la [ROOT.GetCountry.GetGovernment.GetCourtTitle]. In particolare, la sua critica del tutto pubblica nei confronti di [target_ruler.GetName] e della sua relazione ha reciso ogni legame tra quello che un tempo era il favorito [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] e i suoi sostenitori. Avendo suscitato inimicizie tra [ROOT.GetCountry.Custom('IT_NOBLES_IL_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a causa della sua rapida ascesa di rango, non è più possibile per [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] fare affidamento su un tale personaggio come Gran Maestro dell'[target_order.GetName]."
 d009_flavor_religious_orders.3.a: "[target_character.GetSheHe|U] sarà giustiziat[target_character.Custom('IT_ART_O_A')] per tradimento!"
 d009_flavor_religious_orders.3.a.entry: "Sarà giustiziato per tradimento!"
 d009_flavor_religious_orders.3.b: "Esiliamo [target_character.GetHerHim] e nominiamo un nuovo capo per l'[target_order.GetNameWithNoTooltip]."
 d009_flavor_religious_orders.3.b.entry: "Esiliamolo e nominiamo un nuovo capo per l'Ordine."
