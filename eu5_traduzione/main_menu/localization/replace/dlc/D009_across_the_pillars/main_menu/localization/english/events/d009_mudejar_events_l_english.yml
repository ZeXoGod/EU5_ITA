l_english:
 d009_mudejar.1.title: "La Carta dell'Aljama"
 d009_mudejar.1.entry: "$d009_mudejar.1.title$"
 d009_mudejar.1.desc: "In tutte le nostre città le comunità di fede [ShowReligionGroupAdjective('muslim')] restano organizzate più o meno come prima della riconquista: sotto il proprio qāḍī, vincolate alle proprie usanze e rispondenti collettivamente [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] anziché singolarmente a un signore che pretenda di possederle. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] premono per una carta formale che riconosca questo autogoverno come diritto permanente anziché come usanza tollerata, sostenendo senza giri di parole che un'aljama sicura paga le tasse con più regolarità di una risentita. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] vedono lo stesso assetto in modo ben diverso, come un'anomalia che [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] dovrebbe correggere anziché sancire per legge. Ci troviamo ora davanti alla grave decisione se l'autonomia di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] in questo regno poggi su una carta o soltanto sulla pazienza [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_mudejar.1.a: "Concediamo la carta."
 d009_mudejar.1.b: "Neghiamo l'autogoverno."
 d009_mudejar.1.b.tt: "I nostri sudditi di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] soffrono la più stretta supervisione [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]"
 d009_mudejar.1.historical_info: "Le comunità Mudéjar dell'Iberia Cristiana vivevano in genere sotto carte, talvolta chiamate #italic cartas de población#! o privilegi dell'aljama, che garantivano una certa autonomia su tribunali, moschee e affari interni in cambio di tasse e lealtà alla corona. Queste carte variavano enormemente in generosità da regno a regno e si ridussero costantemente nel corso del XV e XVI secolo, man mano che la tolleranza regia verso l'Islam in territorio Cristiano si erodeva."

 d009_mudejar.2.title: "Il Quartiere Mudéjar si Espande"
 d009_mudejar.2.entry: "$d009_mudejar.2.title$"
 d009_mudejar.2.desc: "Il quartiere di fede [ShowReligionGroupAdjective('muslim')] di [target_location.GetName] è cresciuto oltre i confini che gli furono assegnati generazioni fa. Nuove botteghe affollano i vecchi vicoli, e le famiglie chiedono terra oltre il limite tradizionale del quartiere, sostenendo che un mestiere troppo stretto per crescere è un mestiere che muore lentamente. I nostri funzionari sul posto sono divisi: alcuni vedono una base fiscale fiorente da incoraggiare, altri un precedente che sarà tanto più difficile da invertire quanto più a lungo verrà lasciato in piedi."
 d009_mudejar.2.a: "Incoraggiamo l'espansione del quartiere."
 d009_mudejar.2.b: "Costringiamolo entro i confini attuali."

 d009_mudejar.3.title: "Le Capitolazioni di [ShowLocationNameWithNoTooltip('granada')]"
 d009_mudejar.3.entry: "$d009_mudejar.3.title$"
 d009_mudejar.3.desc: "[ShowLocationName('granada')] è caduta, e le condizioni che il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] ha giurato alla sua popolazione di fede [ShowReligionGroupAdjective('muslim')] erano generose per gli standard di qualunque conquista: libertà di culto, tribunali propri e usanze proprie, tutto garantito per iscritto. Se quelle garanzie sopravviveranno al contatto con una corte ansiosa di portare a termine ciò che la conquista ha iniziato è ora l'unica questione che conti per le decine di migliaia di Musulmani che si sono arresi sulla fede della nostra parola."
 d009_mudejar.3.a: "Onoriamo le capitolazioni."
 d009_mudejar.3.b: "Esercitiamo subito pressione per la conversione."
 d009_mudejar.3.b.tt: "La popolazione di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] di [ShowLocationNameWithNoTooltip('granada')] vacilla davanti alla promessa infranta"
 d009_mudejar.3.historical_info: "Le Capitolazioni di Granada, firmate nel novembre 1491 come parte della resa dell'emirato, garantivano ai Musulmani di Granada libertà di culto, uso della propria lingua e delle proprie usanze e la continua applicazione della legge Musulmana sotto i propri giudici. In pratica, i termini cominciarono a erodersi quasi subito dopo la conquista del 1492 e furono in gran parte abbandonati nel giro di un decennio, fino alle conversioni forzate del 1499–1502."
 variable_d009_gra_capitulations_honored_tt: "Le Capitolazioni di Granada furono Onorate"

 d009_mudejar.4.title: "Cisneros a [ShowLocationNameWithNoTooltip('granada')]"
 d009_mudejar.4.entry: "$d009_mudejar.4.title$"
 d009_mudejar.4.desc: "Il cardinale [target_character.GetName] è arrivato a [ShowLocationNameWithNoTooltip('granada')] con poca pazienza per le capitolazioni che la nostra corona aveva giurato di rispettare. Dove il precedente arcivescovo predicava una lenta conversione per persuasione, lo strumento preferito di [target_character.GetHerHis] è il battesimo di massa: interi quartieri condotti al fonte in un solo pomeriggio, di buon grado o no. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] considerano lo zelo di [target_character.GetHerHis] da tempo dovuto; i termini della resa, sostiene [target_character.GetSheHe], furono un espediente di guerra, non un obbligo permanente."
 d009_mudejar.4.a: "Permettiamo a Cisneros di procedere."
 d009_mudejar.4.b: "Frenamo Cisneros."
 d009_mudejar.4.historical_info: "Il cardinale Francisco Jiménez de Cisneros, arcivescovo di Toledo e confessore della regina Isabella, giunse a Granada nel 1499 e, frustrato dalla lentezza delle conversioni volontarie sotto il suo predecessore Hernando de Talavera, avviò battesimi forzati di massa che provocarono direttamente la Prima Rivolta delle Alpujarras. I suoi atti sono generalmente considerati dagli storici la rottura decisiva con le promesse delle Capitolazioni di Granada."

 d009_mudejar.5.title: "I Mudéjar [ROOT.GetCountry.Custom('IT_ADJ_MP')]"
 d009_mudejar.5.entry: "I Mudéjar"
 d009_mudejar.5.desc: "Alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] è giunta notizia che i regni vicini di fede [ShowReligionGroupAdjective('christian')] stanno portando a termine le proprie campagne di conversione forzata contro i sudditi di fede [ShowReligionGroupAdjective('muslim')], e la pressione perché si faccia lo stesso con le comunità Mudéjar [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip], che praticano ancora apertamente la loro fede nelle città di [ShowAreaName('aragon_area')] e [ShowAreaName('valencia_area')], è solo cresciuta da allora. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] chiedono lo stesso battesimo di massa già imposto altrove, mentre i nostri sudditi di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] additano carte vecchie di secoli che promettevano il contrario. A questo [ROOT.GetCountry.GetGovernment.GetRulerTitle] resta ormai ben poco margine per non fare semplicemente nulla."
 d009_mudejar.5.a: "Ordiniamo il battesimo di massa."
 d009_mudejar.5.a.tt: "Le nostre comunità di fede [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] in [ShowAreaName('aragon_area')] e [ShowAreaName('valencia_area')] vengono convertite con la forza"
 d009_mudejar.5.b: "Esentiamole dall'editto."
 d009_mudejar.5.historical_info: "Carlo V ordinò la conversione forzata dei Mudéjar rimasti in Aragona nel 1526, decenni dopo le conversioni forzate della Castiglia del 1500–1502, in seguito a una rivolta delle Germanie di Valencia che aveva già battezzato con la forza molti Musulmani di propria iniziativa. La nobiltà aragonese, che dipendeva fortemente dal lavoro agricolo Musulmano, resistette all'editto per anni prima che fosse applicato per intero."

 d009_mudejar.6.title: "I Moriscos e gli Agenti [GetCountry('TUR').Custom('IT_ADJ_MP')]"
 d009_mudejar.6.entry: "$d009_mudejar.6.title$"
 d009_mudejar.6.desc: "Alla nostra corte giungono notizie di comunità Moriscas che si scambiano lettere con agenti del sultano [GetCountry('TUR').Custom('IT_Di')][GetCountry('TUR').GetNameWithNoTooltip], che non ha mai fatto mistero della sua simpatia per il popolo crypto-[ShowReligionGroupAdjective('muslim')] di [ShowRegionName('iberia_region')]. Se questi contatti equivalgano a una cospirazione o siano soltanto la corrispondenza silenziosa di persone aggrappate a una fede che non possono più praticare apertamente è impossibile dire con certezza, ma il solo sospetto basta a dividere il nostro consiglio."
 d009_mudejar.6.a: "Reprimiamo i contatti."
 d009_mudejar.6.a.tt: "Il controllo sulle nostre comunità crypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] si intensifica e viene rinnovato"
 d009_mudejar.6.b: "Ignoriamo la cosa."
 d009_mudejar.6.historical_info: "Le autorità spagnole temettero davvero i contatti dei Moriscos con gli Ottomani e i corsari barbareschi per tutto il XVI secolo, e a ragione: lettere intercettate e una manciata di cospirazioni documentate, in particolare intorno agli anni 1560, suggerivano che almeno alcune comunità Moresche sperassero in un intervento Ottomano contro la Spagna. Questo sospetto alimentò direttamente le politiche più dure che culminarono nella ribellione delle Alpujarras del 1568 e, infine, nel decreto di espulsione del 1609."

 d009_mudejar.7.title: "La Vita Crypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] sotto l'Inquisizione"
 d009_mudejar.7.entry: "$d009_mudejar.7.title$"
 d009_mudejar.7.desc: "Un nuovo ciclo di processi si è aperto sotto la nostra [ShowPolicyName('local_courts')] contro le famiglie di fede [ShowReligionGroupAdjective('christian')] recente di [target_location.GetName], le cui devozioni private sono denunciate da vicini ansiosi di provare al di là di ogni dubbio la propria ortodossia. Se ciò estirpi una vera eresia o si limiti a terrorizzare famiglie che non praticano la fede [ShowReligionGroupName('muslim')] da una generazione è una domanda che il tribunale non mostra alcun interesse a porsi."
 d009_mudejar.7.a: "Lasciamo che il lavoro del tribunale continui."
 d009_mudejar.7.a.tt: "La popolazione di [target_location.GetNameWithNoTooltip] si stanca del costante controllo del tribunale"
 d009_mudejar.7.b: "Mettiamo in guardia in silenzio la comunità."
 d009_mudejar.7.b.tt: "La popolazione di [target_location.GetNameWithNoTooltip] trova un silenzioso sollievo nell'avvertimento"
 d009_mudejar.7.historical_info: "Le comunità Moresche che si erano convertite solo all'apparenza continuarono spesso a praticare l'Islam in privato per generazioni, un fenomeno ben documentato negli atti dei processi dell'Inquisizione, che registrano ogni infrazione, dalla preghiera nascosta alle pratiche alimentari fino al mantenimento segreto dell'alfabetizzazione in arabo. La persecuzione di queste comunità da parte dell'Inquisizione si intensificò costantemente nel corso del XVI secolo e fu una delle giustificazioni dichiarate del successivo decreto di espulsione del 1609."

 d009_mudejar.8.title: "La Questione Finale: Espulsione o Assimilazione?"
 d009_mudejar.8.entry: "$d009_mudejar.8.title$"
 d009_mudejar.8.desc: "Generazioni di conversioni forzate hanno lasciato [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] con comunità di fede [ShowReligionGroupAdjective('christian')] di nome ma, insistono i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], di fede [ShowReligionGroupAdjective('muslim')] in tutto ciò che conta. Ogni trono vicino ha già risolto la questione in un modo o nell'altro, e il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] non può più rimandare la decisione se questi Nuovi Cristiani di fede [ShowReligionGroupAdjectiveWithNoTooltip('christian')] siano un pericolo permanente da espellere, una popolazione da assorbire con pazienza, o qualcosa che richiede una risposta a metà strada tra le due."
 d009_mudejar.8.a: "Emaniamo l'editto di espulsione."
 d009_mudejar.8.a.tt: "Le nostre comunità crypto-[ShowReligionGroupAdjectiveWithNoTooltip('muslim')] vengono espulse verso i porti del Maghreb"
 d009_mudejar.8.b: "Perseguiamo un programma di integrazione."
 d009_mudejar.8.c: "Ordiniamo un'espulsione selettiva."
 d009_mudejar.8.historical_info: "Il decreto di espulsione di Filippo III, emanato nel 1609 e applicato per fasi fino al 1614, scacciò dalla Spagna circa 300.000 Moriscos verso il Marocco, Tunisi, Algeri e altre parti del mondo Ottomano. Rimane uno dei più grandi spostamenti forzati di popolazione dell'Europa della prima età moderna, e le sue conseguenze economiche, soprattutto la perdita di manodopera agricola specializzata a Valencia e in Aragona, si fecero sentire in parti della Spagna per generazioni."

 d009_mudejar.9.title: "L'Ultimo Morisco"
 d009_mudejar.9.entry: "$d009_mudejar.9.title$"
 d009_mudejar.9.desc: "La generazione che ricordava ancora le preghiere in [ShowLanguageName('arabic_language')] pronunciate dietro finestre chiuse non c'è più, e con essa l'ultima traccia distinguibile di una comunità che trascorse un secolo e mezzo né del tutto di fede [ShowReligionGroupAdjective('muslim')] né del tutto di fede [ShowReligionGroupAdjective('christian')] agli occhi dei vicini. Restano cognomi sparsi, qualche ostinata ricetta e la quieta chiusura di un capitolo che pochi [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] rimpiangeranno e ancor meno ricorderanno con esattezza."
 d009_mudejar.9.a: "Prendiamo atto della fine di un'epoca."
 d009_mudejar.9.historical_info: "Gli storici dibattono ancora quanto a fondo l'identità Morisca sia davvero scomparsa dopo la conversione o l'espulsione: molte famiglie rimaste e assimilate lasciarono tracce in cognomi, toponimi e usanze popolari che persistettero per secoli, mentre quelle espulse in Nordafrica mantennero per generazioni un'identità andalusa distinta all'estero, visibile ancora oggi nell'architettura, nella cucina e nella musica di città come Tetouan, Rabat e Tunisi."
