l_english:

 d009_fountain_of_youth_events.1.title: "La Sorgente Curativa"
 d009_fountain_of_youth_events.1.desc: "Le guide ci portano fuori dalla pista fino a una pozza che sgorga fredda e limpida sotto un gruppo di palme, e non ci lasceranno passare senza che abbiamo bevuto. Una vecchia tra loro mima una schiena curva che si raddrizza e una testa grigia che torna scura. Uno dei nostri, un picchiere azzoppato dalla febbre fin dalla costa, si inginocchia e beve a sazietà, e a sera giura che il dolore ha lasciato le sue gambe. Il chirurgo borbotta che un uomo che desidera abbastanza ardentemente stare bene si sentirà bene per un giorno o due a prescindere da ciò che beve. Eppure l'acqua è dolce e la storia più antica di tutti noi. Abbiamo attraversato oceani su promesse più fragili di questa."
 d009_fountain_of_youth_events.1.a: "Imbottigliamo le acque e ricompensiamo le guide che ci hanno condotti qui."
 d009_fountain_of_youth_events.1.b: "Una pozzanghera è una pozzanghera. Avanti."
 d009_fountain_of_youth_events.1.b.tt: "#italic Lasciamo la pozza non messa alla prova e proseguiamo con le borracce ancora vuote#!"
 the_spring_runs_potent: "#Y La sorgente si rivela potente, e gli uomini riempiono ogni borraccia che hanno#!"
 the_spring_is_ordinary: "#Y L'acqua è dolce ma palesemente ordinaria#!"
 the_waters_may_restore_vigor_tt: "Le acque che portiamo a casa potrebbero ancora restituire il vigore dell'età"

 d009_fountain_of_youth_events.2.title: "Il Prezzo del Guaritore"
 d009_fountain_of_youth_events.2.desc: "Un guaritore scende dal villaggio, un anziano ornato di conchiglie e ossa che la gente tiene palesemente in soggezione. Tramite l'interprete comprendiamo che costui conosce il paese di cui chiediamo: le sorgenti dove si portano i malati e i luoghi che il popolo ritiene sacri. Una simile conoscenza non viene semplicemente consegnata a stranieri armati. C'è un prezzo, e non è l'oro. È il rispetto, o una sua convincente rappresentazione, con i doni giusti offerti nel modo giusto e le antiche cortesie osservate alla lettera. Il nostro cappellano si irrita per la cerimonia pagana. Il nostro quartiermastro osserva che una guida che sa dove sgorga l'acqua vale molto più del conforto del cappellano."
 d009_fountain_of_youth_events.2.a: "Onoriamo i loro costumi e guadagniamoci la fiducia del guaritore."
 d009_fountain_of_youth_events.2.b: "Paghiamoli generosamente per una guida."
 d009_fountain_of_youth_events.2.c: "Catturiamo una guida e non pensiamoci più."
 the_healer_will_accompany_us_tt: "Il guaritore accompagnerà la [expedition|e] e si unirà alla nostra corte al suo ritorno"
 coerced_guide_breeds_resentment_tt: "La nostra [cultural_opinion|e] verso gli abitanti [target_location.GetDominantCulture.Custom('IT_CUL_MP')] peggiorerà"

 d009_fountain_of_youth_events.3.title: "Una Febbre tra i Ranghi"
 d009_fountain_of_youth_events.3.desc: "Comincia con due uomini che rabbrividiscono al fuoco nel caldo del pomeriggio, e al terzo mattino una dozzina è a terra, con gli occhi gialli e deliranti. Le paludi in cui abbiamo guadato generano qualcosa che i corpi Europei non furono mai fatti per sopportare. Il chirurgo ha le sue coppette e le sue lancette, e una scorta calante di medicine. Gli abitanti hanno i loro rimedi, tisane amare e impiastri di foglie che nessuno speziale di Siviglia riconoscerebbe. Nessuna delle due parti si fida della medicina dell'altra, e alla febbre non importa granché quale le venga offerta."
 d009_fountain_of_youth_events.3.a: "Convochiamo i medici di bordo, a qualunque costo."
 d009_fountain_of_youth_events.3.b: "Fidiamoci dei guaritori locali e dei loro rimedi."
 d009_fountain_of_youth_events.3.c: "Avanti, e lasciamo che la febbre si esaurisca da sola."
 the_fever_passes: "#Y La febbre passa, e i ranghi recuperano le forze#!"
 the_fever_claims_our_progress: "#Y La febbre persiste, e giorni di progressi faticosamente guadagnati vanno perduti#!"
 the_remedies_take_hold: "#Y Le tisane amare fanno il loro effetto, e i guaritori si guadagnano la fiducia degli uomini#!"
 the_remedies_fail: "#Y I rimedi non fanno nulla, e la febbre segue il suo corso fino in fondo#!"

 d009_fountain_of_youth_events.4.title: "La Speranza del Vecchio"
 d009_fountain_of_youth_events.4.desc: "[target_leader.GetName] non è più giovane, e ultimamente gli anni pesano. C'è una nuova fame nel modo in cui le mappe vengono studiate fino a notte fonda, una asprezza quando il passo rallenta. Gli uomini hanno cominciato a mormorare che il comandante cerchi queste acque meno per la corona e per la patria che per il volto nello specchio da barba. È una storia antica, più antica di tutti noi: il conquistatore che ha preso tutto tranne altro tempo, e che marcia in una palude dietro all'unico premio che nessuna spada abbia mai vinto. Che quella fame ci conduca alla gloria o a una tomba precoce, ci spinge con forza."
 d009_fountain_of_youth_events.4.a: "Lasciamo che la speranza del vecchio ci porti avanti."
 d009_fountain_of_youth_events.4.b: "Consigliamo pazienza prima che il suo zelo spezzi gli uomini."

 d009_fountain_of_youth_events.5.title: "L'Isola di Bimini"
 d009_fountain_of_youth_events.5.desc: "I marinai hanno ormai un nome in bocca, e non smettono di sussurrarlo: Bimini, un'isola vicino a questa costa dove sgorga una sorgente che restituisce agli anziani gli anni che il mare ha tolto. Ogni pilota dice di averlo sentito da un uomo che lo aveva sentito da un altro uomo. La carta mostra una manciata di basse isole verdi a pochi giorni di navigazione, ognuna delle quali potrebbe essere il luogo... o nessuna. Allontanarsi dalla terraferma significa scommettere settimane di provviste sul racconto di un pescatore — che è, a ben pensarci, precisamente il racconto che ha portato l'intera spedizione oltre l'oceano."
 d009_fountain_of_youth_events.5.a: "Facciamo vela verso l'isola che i marinai non smettono di nominare."
 d009_fountain_of_youth_events.5.b: "Restiamo sulla terraferma. Le isole sono per gli annegati."
 d009_fountain_of_youth_events.5.b.tt: "#italic Restiamo sulla terraferma e lasciamo che l'isola di Bimini custodisca il suo segreto#!"
 the_island_rewards_the_crossing: "#Y L'isola ricompensa la traversata con acqua dolce e rilevamenti migliori#!"
 the_island_is_barren: "#Y L'isola è una striscia di sabbia sterile, e la traversata fa sprecare giorni preziosi#!"

 d009_fountain_of_youth_events.fountain_desc: "Juan Ponce de León, conquistador e primo governatore di Porto Rico, navigò verso nord nel 1513 e approdò su una costa che chiamò La Florida per la stagione pasquale della scoperta. Rilevò la penisola e la potente corrente della Corrente del Golfo; ebbe scaramucce con i Calusa e commerciò con i Timucua, ma non trovò, e secondo i suoi stessi resoconti non cercò, alcuna sorgente miracolosa. La storia secondo cui avrebbe attraversato il mare alla ricerca di acque che restituivano la giovinezza fu appiccicata alla sua memoria solo dopo la sua morte, da cronisti come Gonzalo Fernández de Oviedo e Antonio de Herrera y Tordesillas, e dal prigioniero Hernando de Escalante Fontaneda, che derise il fatto che molti erano annegati mettendo alla prova tali acque. Le voci di una sorgente rigenerante sull'isola di Bimini erano abbastanza reali tra marinai e nativi; il loro legame con un governatore invecchiato fu in gran parte un ricamo successivo, in parte scherno e in parte mito. Ponce de León tornò nel 1521 per fondare una colonia, prese una freccia Calusa nella coscia e morì per la ferita all'Avana, senza aver trovato né giovinezza né riposo."
