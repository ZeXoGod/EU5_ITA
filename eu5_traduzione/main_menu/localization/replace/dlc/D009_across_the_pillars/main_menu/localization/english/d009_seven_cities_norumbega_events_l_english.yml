l_english:

 seven_cities_norumbega.1.title: "Un Fiume, ma Nessuna Città"
 seven_cities_norumbega.1.desc: "Tre mesi risalendo il fiume dalla costa della Nuova Inghilterra, e la colonna ha raggiunto il limite della navigabilità. Qui non c'è nessuna città fortificata. Non c'è alcuna città in tutto il Penobscot, per quanto le squadre di rilevamento hanno potuto stabilire. Le rive sono fittamente boscose; ci sono villaggi Abenaki nei prati dove il fiume si piega; la gente è disposta a barattare pellicce e chiede, tramite l'interprete, che cosa ci aspettassimo di trovare. Il cronista non ha una buona risposta. [target_leader.GetName] scrive il dispaccio in un piccolo forte di tronchi presso la foce del fiume e attende il disgelo primaverile per mettersi sulla via del ritorno."
 seven_cities_norumbega.1.a: "Ammainiamo lo stendardo. La leggenda era una storia da pescatori."
 seven_cities_norumbega.1.historical_info: "Norumbega compare per la prima volta sulle carte Europee negli anni 1530, associata a una regione imprecisata sulla costa atlantica dell'odierno Maine. All'epoca della vera esplorazione Europea della valle del Penobscot, un secolo dopo, la leggenda era cresciuta fino a comprendere una città fortificata di bella pietra sul corso superiore del fiume. Il fondamento di fatto di tutto ciò sembra essere stato il resoconto gonfiato di un'unica spedizione Francese che nel 1525 commerciò brevemente con gli Abenaki del basso Penobscot e descrisse le loro case lunghe rivestite di corteccia, nel linguaggio familiare agli abitanti più ricchi di Saint-Malo, come qualcosa di simile a una cittadina Europea cinta da mura di pietra."

 seven_cities_norumbega.2.title: "Un Paese Popolato"
 seven_cities_norumbega.2.desc: "Il paese in cui siamo entrati non è una città nel senso della leggenda, ma è un paese popolato. La riva del Penobscot, tra la foce e le cascate, è punteggiata di villaggi dalle pareti di corteccia, orti recintati, tumuli cerimoniali e canoe di corteccia ben costruite. Il sachem Abenaki del villaggio più grande riceve [target_leader.GetName] con formale cortesia ed è disposto a concedere l'uso di un appezzamento sulla riva per un emporio Francese o Inglese. Il commercio di pellicce è reale. La città fortificata no. Il paese potrebbe comunque valere la pena di essere tenuto."
 seven_cities_norumbega.2.a: "Fondiamo l'emporio. Il commercio di pellicce giustifica una presenza."
 seven_cities_norumbega.2.historical_info: "La struttura sociopolitica Abenaki nel primo periodo di contatto si basava su villaggi di famiglie allargate organizzati sotto sagamore ereditari, con spostamenti stagionali tra i siti di coltivazione sul fondovalle e le zone di pesca costiere. I mercanti Europei trovarono il sistema congeniale: produceva partner commerciali prevedibili, un flusso costante di pellicce e mais, e una frammentazione politica che impediva a qualsiasi singola entità Abenaki di imporre condizioni al commercio. Norumbega come città fortificata era una fantasia, ma il commercio di pellicce del Penobscot a cui la leggenda rimandava si rivelò duraturo per più di due secoli."

 seven_cities_norumbega.3.title: "Una Città Fortificata sul Fiume"
 seven_cities_norumbega.3.desc: "Il paese in cui siamo entrati è il paese descritto dalle carte. Il fiume scorre profondo e limpido per quaranta leghe nell'entroterra. Al limite della navigabilità, sulla riva occidentale, la colonna ha trovato una città fortificata: cortine di pietra in stile Europeo, una piazza centrale, una grande casa di pietra con il tetto d'ardesia, una piazza del mercato. La popolazione è mista: la maggior parte è Abenaki, ma il capo parla un norreno corrotto che il latinista del seguito riesce in parte a seguire, e in un santuario di pietra nella piazza centrale c'è una spada di ferro di chiara fattura Scandinava. Sono qui, dice il capo, dai tempi del bisnonno di suo nonno. [target_leader.GetName] prende appunti più in fretta del cronista."
 seven_cities_norumbega.3.a: "Firmiamo il trattato. Abbiamo trovato il paese, e l'oro."
 seven_cities_norumbega.3.historical_info: "Le fantasie Europee di una colonia Norrena scomparsa e sopravvissuta nell'interno del Nord America circolarono per secoli e furono occasionalmente avvalorate da ritrovamenti archeologici isolati, la Torre di Newport, la Pietra Runica di Kensington, la Moneta del Maine, la Mappa del Vinland, che si sono rivelati senza eccezione di provenienza dubbia o falsi veri e propri. Le reali prove archeologiche di una presenza Norrena in Nord America si limitano a L'Anse aux Meadows, a Terranova, e a un piccolo manipolo di ritrovamenti isolati compatibili con brevi incursioni Norrene più a sud. Una città fortificata di pietra di discendenza Scandinava sul Penobscot non è mai esistita."

 seven_cities_norumbega.10.title: "L'Uomo che Camminò"
 seven_cities_norumbega.10.desc: "Ci aspetta sulla banchina prima che vengano stivati gli ultimi barili d'acqua: a piedi nudi, bruciato dal sole, vestito con ciò che tre diversi porti hanno voluto cedergli. [target_character.GetName] racconta la sua storia con l'aria di chi l'ha raccontata spesso. Naufrago anni fa sulla sponda lontana dell'oceano occidentale, camminò per un anno o più lungo la sua costa finché un equipaggio di pescatori lo recuperò da un promontorio settentrionale. Da qualche parte a metà di quel viaggio attraversò Norumbega, e parla dei pilastri di cristallo e d'argento che vi si trovano, di signori trasportati in lettighe adorne di perle. I piloti gli chiedono di indicare il luogo su una carta, ma egli risponde soltanto che nessuna carta è mai stata esatta su nulla."
 seven_cities_norumbega.10.a: "Imbarchiamolo. Ha percorso a piedi la strada che intendiamo percorrere per mare."
 seven_cities_norumbega.10.b: "Mettiamo per iscritto la sua testimonianza e lasciamolo sulla banchina."
 norumbega_walker_signs_aboard_tt: "[target_character.GetName] si imbarca come guida"
 seven_cities_norumbega.10.historical_info: "Nel 1568 il marinaio Inglese David Ingram e un centinaio di compagni furono sbarcati presso Tampico dopo che lo scontro di San Juan de Ulúa lasciò John Hawkins senza provviste per riportarli a casa. Undici mesi dopo una nave Francese raccolse Ingram sulla costa della Nuova Scozia, il che, se vero, significa che aveva percorso a piedi circa tremila miglia di piste commerciali native. Quando la cerchia di Sir Francis Walsingham lo interrogò nel 1582, la camminata aveva acquisito una città chiamata Norumbega, con pilastri d'argento e di cristallo e re portati su sedie tempestate di rubini. Richard Hakluyt pubblicò il resoconto nel 1589 e lo omise dall'edizione successiva perché ormai inverosimile. La camminata in sé potrebbe benissimo essere avvenuta. La città crebbe nel racconto, estorta a un pover'uomo da uomini potenti che ponevano esattamente le domande a cui volevano una risposta."

 seven_cities_norumbega.11.title: "La Cosmografia del Pilota"
 seven_cities_norumbega.11.desc: "Da un mese in mare, il pilota ha preso l'abitudine di leggere al tavolo da carteggio dopo la guardia serale. Il suo libro è una vecchia cosmografia, copiata e ricopiata fino a sfumare le coste, eppure le sue parole conservano una sicurezza assoluta. Dietro un certo promontorio della costa verso cui stiamo governando, il libro promette un grande fiume, e risalendo quel fiume una città fortificata di gente ingegnosa che usa parole dal suono simile al [ShowLanguageName('latin_language')] di chiesa. Il sacerdote ha cominciato a parlare di un paese [ShowReligionGroupAdjective('christian')] perduto a occidente. Il nostro interprete osserva che l'autore ha sentito il [ShowLanguageNameWithNoTooltip('latin_language')] da un uomo che lo aveva sentito da un altro uomo, e che è così che si fanno i libri."
 seven_cities_norumbega.11.a: "Segniamo il fiume esattamente come lo indica il libro."
 seven_cities_norumbega.11.b: "Riponiamo il libro. Navighiamo con il solcometro e lo scandaglio."
 seven_cities_norumbega.11.b.tt: "#italic La cosmografia torna nel suo baule, e il viaggio si affida alla rotta stimata del pilota#!"
 seven_cities_norumbega.11.historical_info: "Jean Alfonse, il pilota che nel 1542 condusse i coloni di Roberval in Canada, scrisse nella sua #italic Cosmographie#! di essere entrato in un grande fiume a Norumbega e di aver trovato una città di gente intelligente che parlava una lingua simile al latino. Il suo resoconto si fuse con un nome che Verrazzano aveva annotato su quella costa nel 1524, e i cartografi fecero il resto. Il planisfero di Mercatore del 1569 mostra Norumbega come una città turrita su un ampio fiume, e i cartografi se la copiarono fedelmente l'un l'altro per buona parte di un secolo. Eppure la città non è mai esistita da nessuna parte se non nel copiarla."

 seven_cities_norumbega.12.title: "Fumo sul Fiume"
 seven_cities_norumbega.12.desc: "L'ancoraggio di sosta è alle nostre spalle e il grande fiume si apre davanti a noi, ampio e scuro tra rive boscose. Le canoe vengono a commerciare prima ancora che abbiamo ridotto la vela, e il nostro interprete è sollecitato a chiedere: dov'è la città fortificata? Indicano a monte la loro cittadina, capanne di corteccia sopra uno sbarramento per i pesci, con il fumo che si disperde nell'aria fredda. La domanda viene ripetuta, con dei doni, e una terza volta con doni migliori, ma la risposta non cambia mai. [target_leader.GetName] ordina di reimballare le merci di scambio e cade in silenzio."
 seven_cities_norumbega.12.desc_walker: "L'uomo che camminò è rimasto al parapetto da quando siamo entrati nel fiume, e ormai gli uomini osservano lui più da vicino delle rive. Condotto infine davanti agli ufficiali, studia a lungo la riva e dice che la città si trova più avanti. È sempre più avanti, oltre questa cittadina, oltre dove qualcuno di questa gente sia mai arrivato. Gli uomini scelgono di credergli, perché stanotte credere non costa nulla, e l'alternativa costerebbe l'intero viaggio."
 seven_cities_norumbega.12.a: "Le carte non sono capovolte. Risaliamo il fiume!"
 seven_cities_norumbega.12.b: "Rileviamo il fiume com'è, non come lo si è voluto."
 seven_cities_norumbega.12.c: "Il nostro comandante ha dato la caccia a cose peggiori del fumo. Avanti."
 seven_cities_norumbega.12.historical_info: "Quando l'esplorazione seria raggiunse finalmente il Penobscot, la leggenda non sopravvisse all'incontro. Samuel de Champlain risalì il fiume nel 1604 espressamente per risolvere la questione di Norumbega e trovò villaggi Abenaki e nessuna traccia di alcuna città, fortificata o meno; annotò con ironia di non aver visto nulla delle meraviglie che erano state riferite. Il nome rimase sulle carte per altre due generazioni, spostandosi lungo la costa e rimpicciolendosi nel frattempo, prima di scomparire del tutto dalle mappe. Poche leggende sono state uccise in modo così netto da un singolo viaggio."

 seven_cities_norumbega.13.title: "L'Isola dei Demoni"
 seven_cities_norumbega.13.desc: "L'isola emerge dalla nebbia esattamente dove le carte ne stampano l'avvertimento, e il vento che la attraversa produce un suono che gli uomini si rifiutano di descrivere gli uni agli altri. Poi la vedetta chiama di nuovo, e il cannocchiale passa di mano in mano in silenzio. Sulla riva, sotto le rocce, arde un fuoco di legno portato dal mare, accudito e protetto dal vento, e accanto ad esso c'è una figura negli stracci di quelli che un tempo furono begli abiti, che agita verso di noi un tizzone ardente con entrambe le braccia. I demoni, osserva il nostromo, di solito non hanno bisogno di legna da ardere."
 seven_cities_norumbega.13.a: "Mandiamo una barca a terra. Chi tiene quel fuoco se l'è guadagnato."
 seven_cities_norumbega.13.b: "Manteniamo la rotta. Certi fuochi sono accesi come esca."
 seven_cities_norumbega.13.b.tt: "#italic L'isola scompare a poppa, e il fuoco continua ad ardere sulla riva finché la nebbia non lo inghiotte#!"
 norumbega_survivor_joins_tt: "[target_character.GetName] lascia l'isola e si unisce alla nostra corte"
 seven_cities_norumbega.13.historical_info: "Nel 1542 il nobile Roberval, in viaggio per colonizzare il Canada con Jean Alfonse come pilota, scoprì che la sua giovane parente Marguerite de La Rocque aveva preso un amante a bordo, e la abbandonò sull'Isola dei Demoni al largo della costa di Terranova insieme all'amante e a una cameriera. L'amante, la serva e un bambino nato sull'isola vi morirono tutti. Marguerite sopravvisse da sola per più di due anni, abbattendo orsi con gli archibugi del gruppo, finché dei pescatori Baschi la raccolsero. Tornata in Francia raccontò la sua storia alla Regina di Navarra, che la mise in un libro, ed è l'unico motivo per cui la conosciamo. L'isola stessa è stata da allora dimenticata; oggi nessuno sa con certezza quale fosse."

