l_english:
 taifa: "Ṭā'ifa"
 taifa_desc: "Quando il Califfato di Córdoba cadde, al-'Andalus si frantumò in un mosaico di piccoli emirati, chiamati #italic ṭawā'if#!, ciascuno una corte a sé. Brillanti nel sapere ma gelosi l'uno dell'altro, non poterono mai reggersi da soli contro il nord Cristiano. Legata ora a una potenza restaurata in $iberia_region$, una $taifa$ conserva il proprio carattere pur piegandosi all'autorità di un unico sovrano."
 LEAD_taifa: "$LIST$ è una [SUBJECT_TYPE.GetName]"
 AM_taifa: "[SUBJECT_TYPE.GetName] di $LIST$."
 OFFER_taifa_TOOLTIP_HEADER: "Richiedi che [TARGET_COUNTRY.Custom('IT_La')][TARGET_COUNTRY.GetName] diventi una $taifa$"
