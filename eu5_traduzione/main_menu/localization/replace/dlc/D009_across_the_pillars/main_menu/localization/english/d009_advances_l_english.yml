 mor_central_makhzen: "Il Maḵzan"
 mor_central_makhzen_desc: "La debole autorità del primo sultanato deve cedere il passo a un vero #italic maḵzan#!, un apparato permanente di esattori, segretari e governatori nominati che porti la volontà del trono dal cuore obbediente del paese fino alle terre della dissidenza. Con esso, lo Stato centrale cessa di essere una questione del sovrano come individuo e diventa un'istituzione che perdura."
