l_english:
 gra_frontier_warriors: "Guerrieri di Frontiera"
 gra_frontier_warriors_desc: "Lungo i #italic ṯuḡūr#!, ogni villaggio di marca deve i propri figli alla linea dei fuochi di segnalazione, e il #italic ṯaḡrī#! che risponde a quella chiamata conosce i passi, i pozzi e le incursioni stagionali dei re Cristiani come un pastore conosce le proprie colline. Lo armiamo a basso costo, lo sfamiamo con le scorte del suo stesso villaggio e lasciamo che sia la frontiera stessa a istruirlo nell'unica guerra che conti. Questa fanteria leggera costa poco al nostro tesoro, ma presidia le strade della sierra contro forze che avrebbero bisogno dei rifornimenti di un'intera stagione per eguagliare la sua conoscenza del terreno."
 gra_jamaa: "La Jamā'a"
 gra_jamaa_desc: "La Jamā'a, letteralmente 'la Comunità', è l'organo consultivo permanente del nostro emirato, che riunisce il #italic qāḍī al-jamā'a#!, il #italic wazīr#!, l'#italic ḥājib#! e lo #italic šayḵ al-ḡuzāt#!, che comanda i volontari del jihād Merinidi accanto alla nostra stessa corte. Convochiamo questo organo nella sua veste straordinaria di incarnazione della Comunità dei credenti, trasformando le nostre decisioni di guerra, tributo e successione da decreto emirale in consenso dell'intera comunità politica. Questo consiglio chiude la porta alle concessioni unilaterali strappate a un emirato diviso e fa sì che nessuna fazione — re Cristiano, sultano del Maghreb o capo di frontiera — possa trattare con una qualsiasi singola voce nostra come se parlasse per tutti."
 gra_jinetes: "$a_granadan_jinetes$"
 gra_jinetes_desc: "Il cavaliere leggero che chiamiamo #italic jinete#! prende il nome dai Berberi Zanāta che attraversarono lo stretto per combattere sotto le insegne Andaluse nel XIII secolo, in sella a un piccolo cavallo ispano-arabo e vivendo secondo la dottrina della carica, del lancio e della finta ritirata. Codifichiamo questa scuola Zanātī in un braccio permanente del nostro esercito e, dai #italic ṯuḡūr#! alla pianura costiera, i $a_granadan_jinetes$ diventano la cortina dietro cui manovra ogni altra nostra formazione. Questo corpo di cavalleria leggera costa una frazione dei cavalieri in cotta di maglia e ci offre una cortina che nessuna colonna Cristiana può spezzare facilmente senza spezzare essa stessa la propria formazione."
 unlocked_jinetes_via_decision_tt: "Abbiamo scelto #italic $demand_conversion_of_granada.b$#! nella [decision|e] [ShowDecisionName('demand_conversion_of_granada')] durante la [situation|e] [ShowSituationName('battle_for_the_strait')]"
 gra_mailed_jinetes: "Jinetes in Cotta di Maglia"
 gra_mailed_jinetes_desc: "Due secoli di guerra di frontiera hanno temprato i nostri #italic jinetes#! facendone un corpo più disciplinato, e ora li dotiamo di cotte di maglia contro le balestre Cristiane e allunghiamo le loro lance per raggiungere oltre la guardia di un avversario corazzato. La dottrina della carica, del lancio e della finta ritirata rimane, ma ora serve un cavaliere in grado di tenere la posizione in una mischia se il primo assalto fallisce. Questa cavalleria leggera corazzata estende la portata dei $a_granadan_jinetes_2$ a scontri che i nostri cavalieri prima dovevano interrompere ed eludere."
 gra_renegade_warriors: "Guerrieri Rinnegati"
 gra_renegade_warriors_desc: "La frontiera tra al-'Andalus e i regni Cristiani genera un tipo particolare di soldato, l'#italic elche#! che ha abbandonato una fede per un'altra e ora serve sotto le nostre insegne con la tecnica dei suoi antichi padroni. Codifichiamo il reclutamento di questi rinnegati in una classe permanente di cavalleria pesante, concedendo loro terre, cariche di corte e il diritto di cavalcare sotto i nostri colori. Questo corpo di cavalieri con lancia e armatura, addestrati nella dottrina corazzata Cristiana, dona al nostro esercito un braccio di cavalleria pesante che la nostra stessa tradizione non aveva mai prodotto."
 gra_taifa_subjects: "$taifa$"
 gra_taifa_subjects_desc: "$taifa_desc$"
 gra_tali_a_coastal_watch: "Ṭalā'i' Costieri"
 gra_tali_a_coastal_watch_desc: "Innalziamo #italic ṭalā'i'#! di pietra su ogni capo e promontorio della nostra costa, ciascuna torre dotata di un fuoco di segnalazione la notte e di uno stendardo il giorno, collegata alle vicine a vista e a riparo di una schiera di balestrieri e di un #italic faqīh#! che guida la preghiera dell'allarme. Nessuna galea doppia un promontorio senza essere annunciata, e ogni #italic vega#! costiera può radunare la propria leva ore prima che una chiglia ostile si areni sulla spiaggia. Questa rete di vedette priva qualsiasi flotta di razziatori dell'effetto sorpresa e mantiene difesa la nostra costa senza il costo di guarnigioni costiere permanenti."
 gra_thughur: "I Ṯuḡūr"
 gra_thughur_desc: "I #italic ṯuḡūr#! sono le marche di frontiera di al-'Andalus, le zone selvagge tra l'Iberia Cristiana stanziale e il nostro emirato, che nominiamo, presidiamo e leghiamo alla nostra corte mediante concessioni di terre e privilegi per le famiglie guerriere. Edifichiamo le fortezze #italic ṯaḡr#! a cavallo di ogni passo e guado, collegandole in una spina dorsale continua di resistenza che rallenta ogni avanzata Cristiana e offre ai nostri cavalieri un luogo dove radunarsi e rifornirsi. Questa frontiera organizzata trasforma i clan di confine da bande di razziatori autonome in difensori con un interesse formale alla sopravvivenza dell'emirato."
 gra_veteran_thagri: "Ṯaḡrī Veterani"
 gra_veteran_thagri_desc: "Quattro generazioni di servizio di frontiera hanno temprato i #italic ṯaḡrī#! delle nostre marche in una classe guerriera permanente, con famiglie radicate negli stessi passi che i loro nonni difesero e che si tramandano il comando da padre in figlio. Paghiamo i $a_thagri_2$ non più di un salario di villaggio, eppure essi marciano sotto le nostre insegne con razioni che fermerebbero qualsiasi colonna Cristiana mandata contro di loro. Questa fanteria veterana ci offre la difesa più economica che la nostra frontiera sappia produrre, presidiando territori che altrimenti richiederebbero costosi mercenari di guarnigione."
 gra_veteran_tornadizos: "Tornadizos Veterani"
 gra_veteran_tornadizos_desc: "Ciò che era iniziato come reclutamento improvvisato di #italic elches#! Cristiani si è temprato, nel corso di quattro generazioni, in una casta guerriera stabile che la nostra frontiera ha fatto propria — famiglie di rinnegati che ora si sposano all'interno dei propri ranghi, tramandano la tecnica di lancia e armatura da padre in figlio e si equipaggiano secondo uno standard che gli avventurieri originari non raggiunsero mai. Riconosciamo questa classe stabile con concessioni di terre e commissioni da ufficiale, legando alla nostra causa un braccio di cavalleria pesante la cui lealtà non è più sospetta. Questa formazione veterana ci offre la più pesante forza d'urto a cavallo che la nostra tradizione possa produrre, cavalcando come i $a_tornadizos_2$ al centro del nostro schieramento."
 saqaliba_barracks_advance: "Dār aṣ-Ṣaqāliba"
 saqaliba_barracks_advance_desc: "Gli antichi califfi di Cordova mantenevano una guardia di #italic Ṣaqāliba#!, soldati-schiavi addestrati a rispondere al solo trono. Facciamo rivivere quell'istituzione fondando il #italic Dār aṣ-Ṣaqāliba#!, la Casa degli Schiavi, dove tali uomini vengono acquistati, armati e addestrati. I suoi arsenali rivaleggiano con qualsiasi armeria del regno, pur attingendo a una risorsa del tutto diversa, e dalle sue rassegne la casa reale ottiene un corpo permanente leale a noi prima che a qualsiasi clan o città."
 a_saqaliba_mutaqaddimun_advance: "Aṣ-Ṣaqāliba al-Mutaqaddimūn"
 a_saqaliba_mutaqaddimun_advance_desc: "Formiamo la prima generazione del corpo rinato, i #italic mutaqaddimūn#! che vennero per primi. Li chiamiamo #italic aṣ-Ṣaqāliba al-Judud#!, i Nuovi Ṣaqāliba, per distinguerli dagli #italic al-Qudamā'#! dell'età dell'oro perduta di Cordova. Legati al #italic dār#! e alla casa reale, non devono nulla ai clan di frontiera né alle antiche famiglie arabe."
 a_saqaliba_mutaakhkhirun_advance: "Aṣ-Ṣaqāliba al-Muta'aḵḵirūn"
 a_saqaliba_mutaakhkhirun_advance_desc: "Una mano riformatrice riorganizza il corpo per la sua seconda età. L'addestramento viene standardizzato, il moschetto sostituisce le armi più antiche e i ruoli del #italic dār#! crescono oltre tutto ciò che conobbero gli $a_saqaliba_mutaqaddimun$. I Ṣaqāliba più tardi, i #italic muta'aḵḵirūn#!, diventano un pilastro permanente dell'esercito anziché una rinascita ancora in cerca di conferme."
 a_saqaliba_nizam_jadid_advance: "An-Niẓām al-Jadīd"
 a_saqaliba_nizam_jadid_advance_desc: "Una radicale riorganizzazione rimodella il corpo in un #italic niẓām jadīd#!, un Nuovo Ordine sul modello dei grandi eserciti a polvere da sparo dell'epoca. Compagnie uniformi, esercitazioni con i depositi di munizioni e una catena di ufficiali-schiavi saliti dai ranghi offrono alla casa reale una fanteria moderna che risponde al trono e a nessun altro. Il loro stesso nome proclama la rottura con tutto ciò che è venuto prima."
