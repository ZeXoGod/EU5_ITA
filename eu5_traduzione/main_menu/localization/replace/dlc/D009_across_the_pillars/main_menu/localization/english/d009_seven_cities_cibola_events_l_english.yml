l_english:

 seven_cities_cibola.1.title: "Il Pueblo è Solo un Villaggio"
 seven_cities_cibola.1.desc: "Dopo mesi sul campo, la colonna ha raggiunto il luogo che i frati e le guide chiamavano Cíbola. Qui ci sono sette insediamenti, come descritto. Sono pueblos di adobe e pietra, ben costruiti e antichi, ma sono villaggi di agricoltori e tessitori, non città dorate. Le mura non sono rivestite d'oro, le porte non sono tempestate di turchesi, i magazzini contengono mais e fagioli secchi e poco altro. [target_leader.GetName] scrive il dispaccio per la patria con la porta della tenda del capitano chiusa. Fuori, gli uomini siedono in silenzio sui propri fagotti."
 seven_cities_cibola.1.a: "Beh, almeno è stato un viaggio memorabile..."
 seven_cities_cibola.1.historical_info: "Nel luglio del 1540 la colonna di Coronado raggiunse Hawikuh, il primo dei pueblos di Cíbola, e trovò una comunità di agricoltori Zuni in una città di adobe fortificata. Lo scontro che seguì fu breve: Coronado fu ferito, il pueblo fu preso, e non c'era oro. Fray Marcos de Niza, che l'anno prima era tornato a Città del Messico con la notizia di aver visto la città da lontano e di strade lastricate di gioielli, fu rimandato a casa in disgrazia. Le entradas Spagnole nel sud-ovest non produssero alcun metallo prezioso, alcuna economia di encomienda e nessuna presenza permanente per altri cinquant'anni."

 seven_cities_cibola.2.title: "Di Turchese e Adobe"
 seven_cities_cibola.2.desc: "Il pueblo che abbiamo raggiunto è il luogo di cui parlavano i frati, anche se non è come lo descrivevano. Le mura non sono dorate, ma alte e intonacate di bianco, con mosaici di turchese attorno alle porte delle kiva. I magazzini contengono mais, fagioli, peperoncini secchi, cotone tessuto e una discreta quantità di turchesi lavorati e perline di conchiglia. I capi sono disposti a parlare, e anzi alcuni di loro hanno visto le terre più a nord e sanno descrivere ciò che si trova lungo l'alto fiume. Qui non c'è nessuna leggenda, ma c'è un luogo. [target_leader.GetName] negozia le condizioni con gli anziani."
 seven_cities_cibola.2.a: "Non eccezionale, ma nemmeno terribile."
 seven_cities_cibola.2.historical_info: "Le culture Pueblo dell'attuale Nuovo Messico e Arizona erano partner commerciali di notevole portata. Il turchese delle colline di Cerrillos viaggiava a sud fino alla Mesoamerica e a nord fino alle Pianure, le piume di ara arrivavano dallo Yucatán, e l'ossidiana circolava tra i mercanti Pueblo e quelli delle Pianure. Hawikuh, Acoma e le città del Rio Grande erano prospere per gli standard della regione, anche se non per quelli Spagnoli dopo Tenochtitlan. Lo scontro tra le ambizioni Spagnole e la realtà dei Pueblo si risolse in quello che gli Spagnoli vissero come un fallimento e che per i Pueblo fu un quasi-disastro. Ciononostante, la maggior parte delle culture coinvolte si preservò."

 seven_cities_cibola.3.title: "La Leggenda delle Sette Città"
 seven_cities_cibola.3.desc: "Questo paese è tutto ciò che i frati descrivevano e anche di più. Qui ci sono sette grandi pueblos, ciascuno con il proprio dialetto e il proprio capo, e oltre di essi una rete di piste commerciali che arriva fino al golfo e al grande fiume a oriente. Le porte sono tempestate di turchesi, i capi indossano mantelli di piume e camminano scortati, e i magazzini contengono lavori in oro di una qualità che non si vedeva da generazioni. Il trattato viene firmato prima della prossima neve, e [target_leader.GetName] manda due cavalieri alla costa con dei campioni e una richiesta di rinforzi."
 seven_cities_cibola.3.a: "Facciamo di questo la nostra sede nel nord. Un secondo Messico è trovata."
 seven_cities_cibola.3.historical_info: "La speranza Spagnola, mai realizzata, era che una seconda Mesoamerica si trovasse da qualche parte nei deserti a nord dell'altopiano Messicano, una regione di fitte popolazioni urbane con metalli preziosi estraibili e un'autorità politica centralizzata che si potesse cooptare come Cortés aveva cooptato i Mexica. La realtà era una costellazione di città agricole con una ricca cultura materiale ma poco oro e nessuna autorità centrale con cui negoziare. La fantasia persistette più di quanto avrebbe dovuto perché gli incentivi istituzionali Spagnoli premiavano molto più il resoconto di città dorate che quello della loro assenza."

 seven_cities_cibola.10.title: "Il Rapporto Giurato del Frate"
 seven_cities_cibola.10.desc: "Un frate tornato dalle coste lontane si trova sulla banchina con un rapporto giurato davanti a Dio e al notaio. Ha visto la città, dice [target_character.GetName]: da una collina al crepuscolo, a una distanza che rifiuta di precisare; una città più grande e più bella di qualsiasi altra nelle Indie, con le porte lavorate in turchese. Non vi è entrato, spiegando che farlo sarebbe stato imprudente per un uomo solo. Gli uomini trovano il rapporto entusiasmante. Gli ufficiali, tuttavia, considerano in privato quanta parte di esso poggi su una sola collina e un solo tramonto."
 seven_cities_cibola.10.a: "Imbarchiamo il frate. La sua città vorrà un testimone."
 seven_cities_cibola.10.b: "Basteranno alcuni soldati e guide."
 cibola_friar_sails_tt: "[target_character.GetName] salpa con la spedizione"
 seven_cities_cibola.10.historical_info: "Fray Marcos de Niza partì verso nord da Culiacán nel 1539 con l'ordine di osservare e riferire, e tornò giurando di aver visto da lontano una città chiamata Cíbola più grande di Messico-Tenochtitlan. Si era saggiamente guardato dall'avvicinarsi. Il rapporto elettrizzò la Nuova Spagna, e il viceré allestì la più grande spedizione terrestre mai organizzata nelle Americhe sulla base di questo solo rapporto. Quando i soldati di Coronado si trovarono finalmente davanti alle mura di adobe di Hawikuh un anno dopo, il generale scrisse che il frate non aveva detto la verità su una sola delle cose che aveva riferito. Se Marcos abbia mentito apertamente, abbia frainteso il bagliore del sole al tramonto sull'adobe intonacato o abbia semplicemente riferito ciò che una colonia ansiosa pretendeva da lui è stato oggetto di dibattito da allora."

 seven_cities_cibola.11.title: "Croci sulla Pista"
 seven_cities_cibola.11.desc: "Il nostro esploratore d'avanguardia ha di nuovo distanziato la colonna. È un uomo che ha già attraversato questi paesi una volta, naufrago e a piedi nudi, e i villaggi lo ricordano: cammina avanti con due guide e un sonaglio di zucca, e manda indietro una croce di legno ogni volta che la strada si rivela buona. La prima croce era grande quanto una mano. Quella portata al campo stamattina è alta quanto un uomo. Gli ufficiali discutono se le croci misurino il paese che ci attende o l'uomo mandato ad esplorarlo."
 seven_cities_cibola.11.a: "Lasciamolo andare avanti. Le croci parlano abbastanza chiaramente."
 seven_cities_cibola.11.b: "Richiamiamolo. La colonna si muove come un solo corpo o non si muove affatto."
 seven_cities_cibola.11.historical_info: "Estevanico, uno schiavo Marocchino sopravvissuto al disastro di Narváez e che aveva camminato otto anni attraverso il continente con Cabeza de Vaca, precedette Fray Marcos nel 1539 come apripista della spedizione. L'accordo era che avrebbe rimandato indietro una croce grande quanto le sue notizie: una piccola per un paese bello, una più grande per un paese ricco. Le croci crebbero fino a quando i corrieri riuscivano a stento a portarle, e il frate si affrettò dietro a un uomo che era ormai di diversi paesi più avanti e si godeva ogni passo. Che cosa misurassero davvero le croci è stato oggetto di dibattito da allora."

 seven_cities_cibola.12.title: "Il Despoblado"
 seven_cities_cibola.12.desc: "Tra gli ultimi villaggi amichevoli e la città della leggenda si estende il paese che le guide chiamano despoblado: un deserto di rovi e letti di fiume secchi, quindici giorni di traversata nel migliore dei casi, senza nulla che una colonna possa mangiare. Ogni carico di mais trasportato deve essere portato da una schiena o da uno zoccolo che ha a sua volta bisogno di essere nutrito. Il quartiermastro ha contato i carichi tre volte e non dice assolutamente nulla. La città è vicina, ormai. Come lo è la fame."
 seven_cities_cibola.12.desc_friar: "Il frate ha preso a predicare ai fuochi serali, e il suo testo non varia: la città si trova appena oltre il deserto, l'ha vista con i propri occhi, e Dio non mostra una cosa a un uomo per lasciarlo morire di fame prima di raggiungerla. Il quartiermastro, che ha fatto due volte i conti sul despoblado, osserva che il cielo non ha mai nutrito questa colonna se non con le sue stesse provviste. [target_leader.GetName] deve ora scegliere tra il sermone e i conti."
 seven_cities_cibola.12.a: "Un'avanguardia cavalca avanti, e cavalca leggera."
 seven_cities_cibola.12.b: "Tutta la colonna e le mandrie di rifornimento. Chi va piano resta vivo."
 seven_cities_cibola.12.historical_info: "Coronado risolse il despoblado, il paese disabitato tra la valle del Sonora e le città Zuni, dividendo la spedizione: un'avanguardia di cavalieri cavalcò avanti con lui mentre il grosso seguiva per tappe con le mandrie. L'avanguardia che raggiunse Hawikuh nel luglio del 1540 era talmente affamata che la battaglia per il pueblo fu combattuta, come ammise un cronista, principalmente per il mais che conteneva. Il despoblado fece di più per forgiare il temperamento della spedizione di quanto non fece alcuna leggenda; gli uomini che videro finalmente Cíbola avevano mangiato per una settimana il foraggio dei propri cavalli, e si vide in ciò che fecero poi."

 seven_cities_cibola.13.title: "Una Croce Alta Quanto un Uomo"
 seven_cities_cibola.13.desc: "I corrieri non portano più le croci; le trascinano. L'ultima è alta quanto un uomo, tagliata verde e pesante, e le guide che l'hanno trascinata al campo dicono che l'esploratore ha smesso del tutto di mandare parole insieme al legno, come se nulla di ciò che potesse dire avrebbe aggiunto qualcosa. Ora è vicino. Cammina un giorno avanti rispetto alla sua scorta, agitando il sonaglio di zucca, e le città si svuotano per vederlo passare. La sua ultima richiesta, trasmessa insieme alla croce, è il permesso di entrare nella città stessa e salutarne i signori prima dell'arrivo della colonna."
 seven_cities_cibola.13.a: "Lasciamolo salutare la città. Si è guadagnato la prima occhiata."
 seven_cities_cibola.13.a.tt: "#italic Il permesso all'esploratore è concesso, e da qualche parte molto più avanti egli prosegue verso le porte#!"
 seven_cities_cibola.13.b: "Richiamiamolo subito, insieme ai suoi appunti."
 seven_cities_cibola.13.historical_info: "Estevanico viaggiò attraverso le valli settentrionali come qualcosa a metà tra un esploratore e una figura sacra: precedeva i frati con una scorta di ammiratori, portava un sonaglio cerimoniale di zucca ornato di campanelli e piume, e veniva sommerso di doni di turchesi in ogni città. La sua esibizione era il prodotto dei suoi anni tra i popoli dell'interno, e funzionò finché non funzionò più. Il sonaglio di zucca che mandò avanti per annunciarsi a Cíbola fu, secondo un resoconto, riconosciuto al pueblo come appartenente a un popolo nemico, e la sua ambasciata fu respinta prima che raggiungesse le mura."

 seven_cities_cibola.14.title: "Ucciso alle Porte"
 seven_cities_cibola.14.desc: "Gli uomini della sua scorta tornano magri e silenziosi, a due o tre per volta, nell'arco di una settimana. I loro racconti differiscono nei dettagli e concordano nella sostanza. L'esploratore ha raggiunto la città. Si erge, dicono, pietra su pietra sopra una pianura, esattamente dove indicavano le croci. I suoi signori lo hanno respinto alle porte, lo hanno trattenuto una notte fuori dalle mura e lo hanno ucciso al mattino quando non ha voluto tornare indietro. La colonna ha la sua conferma, e il prezzo l'ha camminato davanti a noi per tutta la strada, agitando un sonaglio di zucca."
 seven_cities_cibola.14.a: "L'ha trovata. Intitoliamo l'adunata a suo nome e marciamo."
 seven_cities_cibola.14.historical_info: "Estevanico fu ucciso a Hawikuh nel maggio del 1539, il primo uomo del Vecchio Mondo a raggiungere le Sette Città e il primo a morire per esse. I sopravvissuti della sua scorta fuggirono a sud e incontrarono Fray Marcos che risaliva la pista; il frate, secondo il suo stesso racconto, si spinse avanti quanto bastava per scorgere la città da lontano prima di tornare in Messico con la notizia. La morte fu letta come una prova anziché come un monito, poiché una città che uccideva gli ambasciatori era evidentemente una città con qualcosa da custodire. L'esercito che marciò la primavera seguente fu, in questo senso, il monumento di Estevanico."

