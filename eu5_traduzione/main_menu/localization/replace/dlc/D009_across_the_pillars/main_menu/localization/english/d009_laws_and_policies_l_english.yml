l_english:
 anr_manual_digest_policy: "Manual Digest"
 anr_manual_digest_policy_desc: "Un manuale sistematico compilato dai giuristi del co-principato codifica il diritto consuetudinario Andorrano, fornendo precedenti chiari ai tribunali delle valli e rafforzando le durature tradizioni giuridiche del paese."
 anr_pareatges: "Pareatges"
 anr_pareatges_desc: "La carta fondativa del co-principato divide la sovranità tra due signori, definendo la base giuridica del governo Andorrano e gli obblighi che ciascun suzerano ha verso la terra e la sua gente."
 anr_pareatges_honored_policy: "Carta Rispettata"
 anr_pareatges_honored_policy_desc: "I Pareatges sono onorati per intero, con entrambi i suzerani riconosciuti e i rispettivi diritti rispettati — un equilibrio accurato che preserva l'autonomia Andorrana e mantiene stabili le relazioni esterne del paese."
 anr_pareatges_reinforced_policy: "Carta Consolidata"
 anr_pareatges_reinforced_policy_desc: "Il quadro costituzionale del co-principato è ulteriormente consolidato, con strutture giuridiche approfondite e un governo locale dotato di radici più salde — la portata dei suzerani è limitata, ma l'ordine interno del paese ne risulta più forte."
 bayaa_shura_council_policy: "Consiglio della Shūrā"
 bayaa_shura_council_policy_desc: "La #italic bay'a#! è amministrata da un consiglio consultivo formale di giuristi e nobili, il cui processo deliberativo conferisce alla successione il peso del consenso dei sapienti islamici. La loro approvazione collettiva ancora la legittimità del sovrano alle tradizioni religiose e aristocratiche del paese."
 bayaa_succession_law: "Successione per Bay'a"
 bayaa_succession_law_desc: "La #italic bay'a#! è il giuramento di fedeltà con cui gli uomini di spicco del paese — i nobili, i sapienti e i capi tribali che costituiscono l'#italic ahl al-ḥall wa'l-'aqd#! — affermano il diritto di un nuovo sovrano a governare. Questa legge definisce il modo in cui tale affermazione è organizzata e di chi sia la voce che pesa di più nel consiglio di successione."
 bayaa_tribal_assembly_policy: "Assemblea Tribale"
 bayaa_tribal_assembly_policy_desc: "La #italic bay'a#! è confermata da una grande assemblea di capi tribali, il cui giuramento collettivo lega i clan principali all'autorità del nuovo sovrano e ne assicura la cooperazione nelle lontane regioni del paese. Questa conferma tribale distribuisce ampiamente la legittimità politica, ma rafforza anche il potere della confederazione a scapito dello Stato centrale."
 bled_makhzen_siba_law: "Bled el-Maḵzan e Bled es-Siba"
 bled_makhzen_siba_law_desc: "Il sultanato Marocchino non ha mai governato l'intera estensione del proprio territorio con un'amministrazione diretta. Il #italic bled el-maḵzan#! — la terra del governo — è la zona stanziale in cui i funzionari regi riscuotono le tasse e fanno rispettare l'ordine, mentre il #italic bled es-siba#! — la terra della dissidenza — è l'entroterra tribale che accetta l'autorità spirituale del sultano ma resiste alla sua portata fiscale. Questa legge determina dove cada l'equilibrio."
 cas_alcabala_policy: "Alcabala"
 cas_alcabala_policy_desc: "L'imposta regia sulle vendite, applicata a tutte le transazioni commerciali, riempie il tesoro a costo del risentimento dei mercanti — un prelievo esteso che tocca ogni affare concluso al mercato e ogni carico venduto al molo."
 unlocks_cas_alcabala_tax: "Sblocca la [government_reform|e] [ShowGovernmentReformName('cas_alcabala_tax')]"
 cas_encabezamiento_policy: "Encabezamiento"
 cas_encabezamiento_policy_desc: "Borghi e città negoziano somme annuali fisse in sostituzione dell'intera #italic alcabala#!, offrendo ai mercanti maggiore prevedibilità e permettendo alle assemblee locali di gestire i propri affari fiscali entro il limite concordato."
 cas_fiscal_law: "Sistema Fiscale Castigliano"
 cas_fiscal_law_desc: "Il quadro con cui la Corona preleva entrate dai propri sudditi determina l'equilibrio tra le casse regie e la prosperità di mercanti e possidenti dei ceti."
 cat_constitucions_de_catalunya_policy: "Constitucions de Catalunya"
 cat_constitucions_de_catalunya_policy_desc: "Il quadro costituzionale della Catalogna vincola la corona a rispettare le leggi e le libertà dei suoi sudditi — nessuna nuova legge può essere promulgata senza il consenso delle #italic Corts#!, e la voce del parlamento ha il peso di secoli di precedenti."
 centralized_makhzen_policy: "Maḵzan Centralizzato"
 centralized_makhzen_policy_desc: "Il sultano estende l'amministrazione regia diretta, inviando quwwād ed esattori nel profondo dell'entroterra tribale e subordinando le usanze locali all'autorità del trono. Il tesoro si arricchisce, ma le confederazioni tribali mal sopportano imposizioni che considerano una violazione dell'autonomia tradizionale."
 dhimmi_persecution_policy: "Limita i Dhimmi"
 dhimmi_persecution_policy_desc: "Si esercita pressione sulle comunità non musulmane affinché si convertano o se ne vadano, liberando il paese dai sudditi eterodossi e rafforzando la presa della fede sulla terra."
 dhimmi_regulations_law: "Status dei Dhimmi"
 dhimmi_regulations_law_desc: "La posizione giuridica dei sudditi non musulmani sotto il governo islamico determina il modo in cui le comunità convivono e il modo in cui i diversi popoli del paese contribuiscono alla sua prosperità."
 dhimmi_status_policy: "Comunità Dhimmi Protette"
 dhimmi_status_policy_desc: "Ai sudditi non musulmani è concessa una protezione formale secondo la legge islamica, in cambio del pagamento della #italic jizya#! e della libertà di culto. Il loro commercio arricchisce i mercati del paese, ma rallenta il ritmo delle conversioni religiose."
 fuero_juzgo_policy: "Fuero Juzgo"
 fuero_juzgo_policy_desc: "L'antico codice di leggi Visigoto, preservato e adattato attraverso secoli di Reconquista, resta il fondamento della giustizia nel nostro regno — vincola i nobili ai suoi precedenti e legittima il nostro dominio agli occhi della Chiesa e del popolo."
 limpieza_de_sangre_law: "Limpieza de Sangre"
 limpieza_de_sangre_law_desc: "Gli statuti di purezza del sangue stabiliscono chi possa ricoprire cariche, entrare negli ordini religiosi o rivendicare lo status nobiliare, tracciando una linea giuridica tra i Cristiani Vecchi e coloro di origine Ebraica, Moresca o altra."
 limpieza_mainstream_enforcement_policy: "Applicazione Ordinaria"
 limpieza_mainstream_enforcement_policy_desc: "I requisiti della #italic limpieza#! sono applicati tramite le istituzioni consolidate, con indagini genealogiche richieste per l'avanzamento — abbastanza efficaci da mantenere il sistema senza il peso di un'interpretazione rigorosa."
 limpieza_relaxed_enforcement_policy: "Applicazione Allentata"
 limpieza_relaxed_enforcement_policy_desc: "La crescente pressione dei riformatori e le esigenze pratiche del commercio portano a un allentamento dell'applicazione della purezza del sangue, lasciando che talento e ricchezza contino più dell'esame genealogico."
 limpieza_strict_enforcement_policy: "Applicazione Rigorosa"
 limpieza_strict_enforcement_policy_desc: "Le indagini sulla purezza del sangue sono condotte con rigore, escludendo conversos e moriscos dalle cariche pubbliche, dalla Chiesa e dagli ordini militari. Gli statuti vincolano strettamente le istituzioni del paese a queste pretese di fede ancestrale."
 mll_dret_civil_policy: "Dret Civil de Mallorca"
 mll_dret_civil_policy_desc: "La tradizione di diritto civile Maiorchina, radicata nella pratica romana e nella carta Catalana, disciplina proprietà, contratti ed eredità con una precisione che favorisce il commercio e preserva l'identità distinta dei nostri sudditi."
 nav_fueros_policy: "Fueros Navarresi"
 nav_fueros_policy_desc: "Le antiche carte della Navarra garantiscono i diritti e le consuetudini del suo popolo contro le ingerenze regie, e ogni nuovo monarca giura di rispettare i #italic fueros#! prima che le leggi del regno si applichino a lui."
 negotiated_authority_policy: "Autorità Negoziata"
 negotiated_authority_policy_desc: "Il sultano governa tramite trattative e riconoscimenti anziché con la coercizione diretta, riconoscendo l'autonomia delle confederazioni tribali in cambio di una sottomissione nominale e di una cooperazione militare informale. Le entrate affluiscono più lentamente al trono, ma il paese resta unito senza il costante attrito dell'obbedienza forzata."
 gra_learning_haven: "Rifugio del Sapere per Tutti"
 gra_learning_haven_desc: "Anziché limitare l'istruzione ad affiliazioni religiose, opinioni culturali o simili, incoraggeremo uno Stato davvero accademico, per favorire nuove scoperte scientifiche."
 ara_italian_dual_court: "Doppia Corte nell'[ShowRegionNameWithNoTooltip('italy_region')]"
 ara_italian_dual_court_desc: "Stabilendo due corti all'interno del nostro regno, possiamo gestire entrambe le parti senza dover fare affidamento sulla nobiltà locale."
 unlock_italian_court_tt: "Sblocca l'[building|e] [ShowBuildingTypeName('italian_court_building')]"
