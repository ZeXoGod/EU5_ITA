l_english:
 petition_for_the_bula_de_cruzada: "Richiedi la Bula de Cruzada"
 petition_for_the_bula_de_cruzada_desc: "In qualità di Leader Temporale della [crusade|e], chiedi al Papa la bolla della [crusade]. Per tre anni la [tithe|e] di ogni paese di fede [ShowReligionAdjective('catholic')] affluisce alla nostra corona anziché al Papa o alla cassa di guerra della [crusade]."
 petition_for_the_bula_de_cruzada_tt: "Per #G 3#! anni, la [tithe|e] di ogni paese di fede [ShowReligionAdjective('catholic')] viene versata alla corona anziché al Papa o alla [crusade|e]"
 summon_iberian_military_orders_crusade: "Convoca gli Ordini Militari Iberici"
 summon_iberian_military_orders_crusade_desc: "Chiama uno degli ordini militari dell'Iberia alla [crusade|e], come intendevano i suoi fondatori, e lascia che i suoi confratelli scendano in campo contro i nemici della fede."
 summon_iberian_military_orders_effect_tt: "Assolda dall'ordine da 7 a 15 reggimenti di Fanteria Pesante e Cavalleria Pesante, in proporzione al suo zelo religioso, e aumenta lo #Y zelo religioso#! della [crusade|e] di #G 5#!"
 summon_iberian_military_orders_no_target_tt: "Assolda dall'ordine militare selezionato da 7 a 15 reggimenti di Fanteria Pesante e Cavalleria Pesante, in proporzione al suo zelo religioso, e aumenta lo #Y zelo religioso#! della [crusade|e] di #G 5#!"
 summon_iberian_military_orders_order_tt: "L'ordine militare selezionato ottiene #G 10#! di [zeal|e]"
 summon_iberian_military_orders_event_tt: "Ci capita l'[event|e] '$d009_holy_war.1.title$'"
 choose_military_order_to_summon: "Scegli un Ordine Militare"
 summon_iberian_military_orders_no_orders: "@trigger_no! Nessun ordine militare è disponibile per la convocazione."
 launch_a_cabalgada: "Lancia una Cabalgada"
 launch_a_cabalgada_desc: "Fai razzia in una delle province confinanti del nemico. Ogni località indifesa, priva di forte e di esercito, viene saccheggiata e perde sviluppo, e il suo proprietario è spinto a radunare le forze in risposta."
 launch_a_cabalgada_tt: "Costa un anno di [manpower|e], riduce lo zelo religioso della [crusade|e] di #R 10#! e fa regredire la sua preparazione di #R 10#!"
 launch_a_cabalgada_loot_tt: "Saccheggia ogni località indifesa della provincia, priva di forte e di esercito, per un valore stimato di [actor.MakeScope.ScriptValue('cabalgada_estimated_total')|0+=][gold_i], e ne riduce lo sviluppo"
 choose_province_for_cabalgada: "Scegli una Provincia da Saccheggiare"
 launch_a_cabalgada_no_provinces: "@trigger_no! Il nemico non possiede alcuna provincia di confine indifesa esposta a una razzia."
 demand_parias: "Esigi un Tributo"
 demand_parias_desc: "In qualità di Leader Temporale della [crusade|e], esigi un tributo dal reame nemico durante la sua preparazione. Possono pagare, ritardando la mobilitazione della [crusade], oppure rifiutare e aumentarne lo zelo religioso."
