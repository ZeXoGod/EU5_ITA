 STATIC_MODIFIER_NAME_searching_for_cibola: "Alla Ricerca di Cibola"
 STATIC_MODIFIER_DESC_searching_for_cibola: "Una spedizione è sul campo, da qualche parte tra la costa del Sonora e il paese dei Pueblos, alla ricerca delle Sette Città di Cibola. Il prestigio della corona è sul campo insieme a loro."
 STATIC_MODIFIER_NAME_searching_for_quivira: "Alla Ricerca di Quivira"
 STATIC_MODIFIER_DESC_searching_for_quivira: "Una spedizione è sul campo, da qualche parte nel mare d'erba a nord del Nuovo Messico, alla ricerca del Regno di Quivira."
 STATIC_MODIFIER_NAME_searching_for_sierra_de_la_plata: "Alla Ricerca della Sierra de la Plata"
 STATIC_MODIFIER_DESC_searching_for_sierra_de_la_plata: "Una spedizione è sul campo, sulle pendici andine a ovest del Plata, alla ricerca della montagna d'argento descritta dai Guaraní."
 STATIC_MODIFIER_NAME_searching_for_norumbega: "Alla Ricerca di Norumbega"
 STATIC_MODIFIER_DESC_searching_for_norumbega: "Una spedizione è sul campo, sul fiume Penobscot nella Nuova Inghilterra, alla ricerca della città fortificata riferita dai pescatori francesi e dai piloti di Verrazzano."
 STATIC_MODIFIER_NAME_searching_for_saguenay: "Alla Ricerca di Saguenay"
 STATIC_MODIFIER_DESC_searching_for_saguenay: "Una spedizione è sul campo, nelle foreste boreali a nord del San Lorenzo, alla ricerca del regno che Donnacona descrisse a Cartier a Stadacona."
 STATIC_MODIFIER_NAME_searching_for_city_of_caesars: "Alla Ricerca della Città dei Cesari"
 STATIC_MODIFIER_DESC_searching_for_city_of_caesars: "Una spedizione è sul campo, da qualche parte in Patagonia, alla ricerca della città perduta costruita tra due montagne."
 STATIC_MODIFIER_NAME_cibola_discovered: "Cibola Scoperta"
 STATIC_MODIFIER_DESC_cibola_discovered: "Le Sette Città di Cibola sono state trovate e i loro commerci aperti: il turchese, i tessuti di cotone, il giaietto lavorato delle botteghe dei Pueblos e il paese del mais che le circonda. Il paese è incorporato nel sistema commerciale dell'impero a condizioni più o meno di partenariato."
 STATIC_MODIFIER_NAME_quivira_discovered: "Quivira Scoperta"
 STATIC_MODIFIER_DESC_quivira_discovered: "Il Regno di Quivira è stato trovato, nel mare d'erba a est dei Pueblos. Il paese è fertile, le mandrie di bisonti sono immense, e gli agricoltori e mercanti Wichita gestiscono un commercio regionale considerevole a cui la corona è ora collegata."
 STATIC_MODIFIER_NAME_sierra_plata_discovered: "Sierra de la Plata Scoperta"
 STATIC_MODIFIER_DESC_sierra_plata_discovered: "La montagna d'argento al centro della leggenda è stata trovata e aperta. Il tenore del minerale è eccezionale, i signori Chicha che controllano le pendici sono partner commerciali disponibili, e il metallo prezioso che fluisce dalle miniere rivaleggia con quanto producono le miniere più antiche della cordigliera nelle loro stagioni migliori."
 STATIC_MODIFIER_NAME_norumbega_discovered: "Norumbega Scoperta"
 STATIC_MODIFIER_DESC_norumbega_discovered: "Norumbega è stata trovata sul corso superiore del Penobscot: una città di pietra fortificata, con una popolazione mista di Abenaki e (come insiste il latinista dello stato maggiore) di antichi Norreni, con una miniera d'oro in funzione nelle colline a monte. Il flusso di coloni e il commercio coloniale della Nuova Inghilterra mutano di conseguenza."
 STATIC_MODIFIER_NAME_saguenay_discovered: "Saguenay Scoperto"
 STATIC_MODIFIER_DESC_saguenay_discovered: "Il regno settentrionale che Donnacona descrisse a Cartier è stato trovato, nel freddo paese oltre il secondo grande lago del bacino del San Lorenzo. L'insediamento è ricco, la popolazione dalla pelle chiara e di lingua norrena, e il commercio di pellicce e oro che la regione sostiene è il più ricco che la corona francese abbia finora aperto nel Nuovo Mondo."
 STATIC_MODIFIER_NAME_city_of_caesars_discovered: "Città dei Cesari Scoperta"
 STATIC_MODIFIER_DESC_city_of_caesars_discovered: "La città perduta dei Cesari è stata trovata in una valle nascosta delle Ande patagoniche, con una popolazione discendente dai sopravvissuti di un naufragio del XVI secolo. L'autorità della corona si estende nuovamente sui sudditi a lungo perduti e sul paese dell'argento che essi hanno silenziosamente aperto nelle generazioni del loro isolamento."
 STATIC_MODIFIER_NAME_searching_for_el_dorado: "Alla Ricerca di El Dorado"
 STATIC_MODIFIER_DESC_searching_for_el_dorado: "Una spedizione è sul campo, da qualche parte nel bacino dell'Orinoco, alla ricerca del re dorato che i Muisca ricordano."
 STATIC_MODIFIER_NAME_searching_for_fountain_of_youth: "Alla Ricerca della Fonte della Giovinezza"
 STATIC_MODIFIER_DESC_searching_for_fountain_of_youth: "Una spedizione è in Florida, da qualche parte nel paese dei Timucua, alla ricerca della sorgente che i Taino chiamano la Fonte di Bimini."
 STATIC_MODIFIER_NAME_el_dorado_discovered: "El Dorado Scoperto"
 STATIC_MODIFIER_DESC_el_dorado_discovered: "Il paese dorato dei Muisca è stato aperto al commercio spagnolo. Le oreficerie delle botteghe degli altopiani, eseguite in uno stile e su una scala che nessun argentiere europeo può eguagliare, fluiscono verso l'esterno attraverso il nuovo emporio ai piedi del lago sacro."
 STATIC_MODIFIER_NAME_fountain_of_youth_discovered: "Fonte della Giovinezza Scoperta"
 STATIC_MODIFIER_DESC_fountain_of_youth_discovered: "La sorgente nel cuore del paese dei Timucua è stata trovata e le sue proprietà rigeneranti verificate. Le acque fanno ciò che la leggenda diceva che avrebbero fatto. Sul luogo è stata costruita una cappella, e il flusso di pellegrini sta già cominciando a svilupparsi."
 STATIC_MODIFIER_NAME_camelry_doctrine_modifier: "Dottrina della Cavalleria Cammellata"
 STATIC_MODIFIER_DESC_camelry_doctrine_modifier: "La proposta del generale è stata adottata. Si stanno levando squadroni di cammelli accanto ai cavalli, si stanno istituendo depositi di rimonta lungo le vie carovaniere e si stanno riscrivendo i manuali di addestramento per le campagne nel deserto. L'esercito va più lontano con meno acqua di prima, e il corpo ufficiali sta lentamente facendo pace con l'odore."
 STATIC_MODIFIER_NAME_gra_old_capital_of_the_caliphate: "Capitale dell'Antico Califfato"
