 d009_sephardi_catastrophe.1.title: "La Predicazione di Fernando Martínez"
 d009_sephardi_catastrophe.1.entry: "$d009_sephardi_catastrophe.1.title$"
 d009_sephardi_catastrophe.1.desc: "Un arcidiacono di nome [target_character.GetName] predica ormai da anni per le città dell'[ShowAreaName('andalusia_area')], ogni sermone più infiammato del precedente, e quest'anno le folle che [target_character.GetSheHe] ha sollevato hanno smesso di limitarsi ad ascoltare. Torme si radunano davanti ai quartieri di fede [ShowReligionAdjective('judaism')] delle nostre città, armate di ben più che parole, e i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] non fanno mistero di quale parte preferiscano. Ciò che accadrà nelle strade nelle prossime settimane non resterà confinato ad esse."
 d009_sephardi_catastrophe.1.a: "Mandiamo la guardia a reprimere le torme."
 d009_sephardi_catastrophe.1.b: "Lasciamo che la folla faccia a modo suo, entro limiti ragionevoli."
 d009_sephardi_catastrophe.1.c: "Rivolgiamo la benedizione della corona alla causa delle torme."
 d009_sephardi_catastrophe.1.historical_info: "Fernando Martínez, arcidiacono di Écija, trascorse anni a predicare contro la comunità Ebraica di Siviglia nonostante i ripetuti ordini regi di smettere. Quando infine incitò una folla nel giugno 1391, la violenza uccise migliaia di persone e si diffuse nel giro di poche settimane a Córdoba, Toledo, Valencia, Barcellona e oltre. Fu la più distruttiva ondata di violenza antiebraica dell'Iberia medievale e l'inizio delle conversioni di massa che avrebbero prodotto, un secolo dopo, la popolazione di conversos bersaglio dell'Inquisizione."

 d009_sephardi_catastrophe.2.title: "I Pogrom si Diffondono"
 d009_sephardi_catastrophe.2.entry: "$d009_sephardi_catastrophe.2.title$"
 d009_sephardi_catastrophe.2.desc: "La notizia della furia scoppiata per prima nell'[ShowAreaName('andalusia_area')] non è rimasta confinata lì. In città dopo città del regno circolano le stesse voci, vengono pronunciati gli stessi sermoni e si radunano le stesse folle davanti ai quartieri di fede [ShowReligionAdjective('judaism')] che una stagione fa non conoscevano nulla di questa violenza. Qualunque calma esistesse qui si sta già spezzando, e nessun ordine della nostra corte raggiungerà ogni strada in tempo."
 d009_sephardi_catastrophe.2.a: "Ormai non c'è altro da fare che guardare."
 d009_sephardi_catastrophe.2.historical_info: "I pogrom del 1391 si diffusero con sorprendente rapidità da Siviglia nel corso dell'estate, raggiungendo Córdoba, Toledo, Valencia, Palma e Barcellona nel giro di poche settimane, in gran parte perché predicatori e folle locali di ciascuna città considerarono i tumulti di Siviglia una licenza anziché un monito. Stime dell'epoca indicano che decine di migliaia di Ebrei furono uccisi o convertiti con la forza solo in quell'anno, rimodellando in modo permanente la mappa demografica e religiosa dell'Iberia."

 d009_sephardi_catastrophe.3.title: "La Disputa di [ShowLocationNameWithNoTooltip('tortosa')]"
 d009_sephardi_catastrophe.3.entry: "$d009_sephardi_catastrophe.3.title$"
 d009_sephardi_catastrophe.3.desc: "Per convocazione dello stesso Papa, i rabbini [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] sono stati costretti a sopportare mese dopo mese una disputa pubblica a [ShowLocationName('tortosa')], rispondendo della propria fede punto per punto davanti a una sala di studiosi di fede [ShowReligionGroupAdjective('christian')] e a un convertito di origine [ShowReligionAdjective('judaism')] ansioso di dimostrare l'errore della sua antica comunità. Molti non hanno retto la prova con le proprie convinzioni intatte, e più di un'aljama si ritrova ora con il proprio rabbino passato dall'altra parte."
 d009_sephardi_catastrophe.3.a: "Lasciamo che la disputa faccia il suo corso."
 d009_sephardi_catastrophe.3.b: "Proteggiamo i nostri rabbini dal peggio."
 d009_sephardi_catastrophe.3.b.tt: "La comunità di fede [ShowReligionAdjective('judaism')] di [ShowLocationNameWithNoTooltip('tortosa')] trova un certo conforto nel gesto"
 d009_sephardi_catastrophe.3.historical_info: "La Disputa di Tortosa (1413–1414) fu convocata dall'antipapa Benedetto XIII e durò oltre sessanta sessioni, costringendo rabbini di tutta l'Aragona a discutere le Scritture con Jerónimo de Santa Fe, ex medico Ebreo convertito al Cristianesimo, che sosteneva che lo stesso Talmud provasse che Gesù era il messia. La disputa fu seguita da un'ondata di conversioni e di legislazione antiebraica in tutta la corona d'Aragona."

 d009_sephardi_catastrophe.4.title: "Il Nuovo Bersaglio dell'Inquisizione"
 d009_sephardi_catastrophe.4.entry: "$d009_sephardi_catastrophe.4.title$"
 d009_sephardi_catastrophe.4.desc: "Il tribunale istituito per estirpare l'eresia si è finora occupato di questioni ben lontane dalle aljama. Sta cambiando. Ogni giorno giungono al consiglio del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] voci di famiglie di Nuovi Cristiani di fede [ShowReligionGroupAdjective('christian')] nelle nostre città che si fanno il segno della croce in pubblico e accendono candele dietro finestre chiuse, e gli inquisitori del tribunale sono ansiosi di ottenere un mandato per guardare più da vicino ciò che quelle famiglie fanno quando la strada fuori si fa silenziosa."
 d009_sephardi_catastrophe.4.a: "Indirizziamo il tribunale verso i conversos."
 d009_sephardi_catastrophe.4.b: "Teniamo il tribunale concentrato sulla sola eresia."
 d009_sephardi_catastrophe.4.historical_info: "L'Inquisizione spagnola fu istituita con bolla papale nel 1478 specificamente per indagare sui conversos sospettati di continuare in segreto le pratiche Ebraiche. Il suo scopo fondativo, a differenza delle inquisizioni medievali precedenti, era quasi interamente sorvegliare la popolazione convertita anziché combattere l'eresia tra Cristiani di nascita. Tomás de Torquemada, il più famigerato dei primi Inquisitori Generali, sovrintese a una drammatica espansione proprio di questo tipo di indagini negli anni 1480."
 variable_iberian_union_active_tt: "L'Unione Iberica è Stabilita"

 d009_sephardi_catastrophe.5.title: "L'Espulsione [ROOT.GetCountry.Custom('IT_Dalla')][ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_sephardi_catastrophe.5.entry: "L'Espulsione"
 d009_sephardi_catastrophe.5.desc: "Ogni trono intorno a noi che ancora tollerava una comunità di fede [ShowReligionAdjective('judaism')] ha scelto, in questi ultimi anni, di porre fine a quella tolleranza, e la pressione per fare altrettanto qui è diventata impossibile da ignorare ancora. Quali che fossero i meriti del vecchio assetto, non possiamo più permetterci di essere l'unica corona iberica rimasta in piedi a concedere a persone di fede [ShowReligionAdjective('judaism')] di considerare [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] la propria patria."
 d009_sephardi_catastrophe.5.a: "Emaniamo l'editto di espulsione."
 d009_sephardi_catastrophe.5.historical_info: "La Navarra espulse la sua popolazione Ebraica nel 1498, diversi anni dopo la Castiglia e l'Aragona (1492) e più o meno nello stesso periodo del Portogallo (1497), in gran parte sotto la pressione di Ferdinando e Isabella una volta che la Navarra cadde sotto la loro influenza. Fu una delle ultime espulsioni indipendenti nell'Iberia, chiudendo quasi ogni via all'interno della penisola che le comunità Ebraiche cacciate dalla Spagna e dal Portogallo avrebbero altrimenti potuto usare per ricollocarsi anziché partire del tutto."

 d009_sephardi_catastrophe.6.title: "Il Massacro di [ShowLocationNameWithNoTooltip('lisbon')]"
 d009_sephardi_catastrophe.6.entry: "$d009_sephardi_catastrophe.6.title$"
 d009_sephardi_catastrophe.6.desc: "Una folla nella nostra stessa capitale, aizzata fino alla frenesia da frati vagabondi che predicano che la peste che affligge [ShowLocationName('lisbon')] sia il giudizio di Dio sui Nuovi Cristiani in mezzo a essa, ha trasformato le strade di [ShowLocationNameWithNoTooltip('lisbon')] in un mattatoio. Centinaia di uomini, donne e bambini conversos giacciono morti nelle piazze e sulle soglie, e i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sono silenziosamente divisi sull'opportunità di condannare l'uccisione o di benedirla."
 d009_sephardi_catastrophe.6.a: "Mandiamo la guardia a sedare i rivoltosi."
 d009_sephardi_catastrophe.6.b: "Lasciamo che la furia della città si consumi da sé."
 d009_sephardi_catastrophe.6.historical_info: "Il massacro di Lisbona dell'aprile 1506 ebbe inizio quando frati domenicani incolparono i Nuovi Cristiani della siccità e della peste che affliggevano la città, e durò tre giorni prima che le truppe regie intervenissero. Le stime dei morti vanno da meno di duemila a ben oltre tremila, e il massacro allarmò a tal punto re Manuele I che questi emanò in seguito editti a protezione formale dei Nuovi Cristiani da ulteriori violenze di folla, benché il sospetto di fondo nei loro confronti non si placasse mai del tutto."

 d009_sephardi_catastrophe.7.title: "L'Inquisizione [ROOT.GetCountry.Custom('IT_ADJ_FS')] si Volge contro i Conversos"
 d009_sephardi_catastrophe.7.entry: "L'Inquisizione si Volge contro i Conversos"
 d009_sephardi_catastrophe.7.desc: "Il tribunale istituito sotto la nostra [ShowPolicyName('local_courts')] ha dedicato i suoi primi anni a ordinarie questioni di dottrina, ma i suoi inquisitori si sono fatti inquieti nel vedere le famiglie di Nuovi Cristiani di fede [ShowReligionGroupAdjective('christian')] di [ShowLocationName('lisbon')], [ShowLocationName('porto')] ed [ShowLocationName('evora')] restare senza esame generazione dopo generazione. Un mandato per indagare sulle loro devozioni private è loro per la richiesta, ed essi hanno chiarito che lo stanno chiedendo."
 d009_sephardi_catastrophe.7.a: "Concediamo al tribunale il suo mandato sui conversos."
 d009_sephardi_catastrophe.7.b: "Confiniamo il tribunale alle questioni di eresia aperta."
 d009_sephardi_catastrophe.7.historical_info: "L'Inquisizione portoghese fu istituita formalmente nel 1536, decenni dopo quella spagnola, e inizialmente procedette con cautela contro la popolazione di conversos per timore del danno economico che un'ulteriore persecuzione avrebbe potuto causare. Quella cautela non durò: a metà del XVI secolo i tribunali portoghesi di Lisbona, Coimbra ed Évora conducevano processi su vasta scala contro Nuovi Cristiani sospettati di crypto-giudaismo, spingendo ulteriori ondate di emigrazione verso Amsterdam, l'Italia e l'Impero Ottomano."

 d009_sephardi_catastrophe.8.title: "Auto-da-fé"
 d009_sephardi_catastrophe.8.entry: "$d009_sephardi_catastrophe.8.title$"
 d009_sephardi_catastrophe.8.desc: "Un altro auto-da-fé è stato allestito nella piazza pubblica, con penitenti in sanbenito giallo condotti in processione davanti a una folla che si aspetta lo spettacolo quanto un giorno di festa. Se questo rituale estirpi una vera eresia o si limiti a terrorizzare famiglie che hanno rinunciato alla loro antica fede generazioni fa è una domanda che pochi tra la folla pensano di porsi."
 d009_sephardi_catastrophe.8.a: "Lasciamo che il lavoro del tribunale continui."
 d009_sephardi_catastrophe.8.historical_info: "L'auto-da-fé, in portoghese e spagnolo atto di fede, era la cerimonia pubblica di condanna dell'Inquisizione, in cui i penitenti condannati, spesso vestiti del sanbenito giallo che segnalava la loro colpa, venivano condotti in processione davanti a una folla prima di ricevere la pena, che andava dalla penitenza all'esecuzione sul rogo. Questi eventi attiravano enormi folle e divennero una presenza fissa della vita civica iberica per secoli, fondendo rituale religioso e spettacolo pubblico."

 d009_sephardi_catastrophe.9.title: "La Rete di Fuga dei Marrani"
 d009_sephardi_catastrophe.9.entry: "$d009_sephardi_catastrophe.9.title$"
 d009_sephardi_catastrophe.9.desc: "Al tribunale è giunta voce di una rete di mercanti e marinai Nuovi Cristiani di fede [ShowReligionGroupAdjective('christian')] che organizza in silenzio il passaggio all'estero per famiglie che non possono più sopportare di vivere sotto sospetto, con le loro navi che scivolano fuori dal porto sotto copertura di normali commerci. Non ogni famiglia che desidera partire troverà posto a bordo, ma alcune sì, e nessun ordine della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] raggiunge ogni nave prima che superi la barra."
 d009_sephardi_catastrophe.9.a: "Non si possono fermare tutte le navi che lasciano il porto."
 d009_sephardi_catastrophe.9.historical_info: "Le reti di emigrazione dei conversos operarono per generazioni dopo le conversioni forzate, instradando in genere le famiglie attraverso Bordeaux, Anversa o Ferrara prima del passaggio verso rifugi più sicuri come l'Impero Ottomano o, più tardi, Amsterdam. Queste reti si fondavano in larga misura su legami familiari e d'affari tra mercanti già emigrati, e la corona portoghese tentò periodicamente, senza riuscirci, di chiuderle del tutto, poiché le stesse reti mercantili erano spesso essenziali per il suo stesso commercio d'oltremare."
