l_english:

 d009_flavor_iberian_union.1.title: "Proclamare la Monarchia Spagnola"
 d009_flavor_iberian_union.1.desc: "Le corone della nostra unione si sono legate così strettamente da formare un unico regno in tutto fuorché nel nome. La nostra amministrazione governa il tutto, le nostre leggi e la nostra moneta corrono da un capo all'altro della penisola, e i regni minori sono diventati province di un insieme più grande.\n\nÈ giunta l'ora di accantonare gli antichi titoli e di proclamare davanti al mondo intero un'unica monarchia sovrana: la Spagna."
 d009_flavor_iberian_union.1.a: "Che la Monarchia Spagnola sia proclamata!"
