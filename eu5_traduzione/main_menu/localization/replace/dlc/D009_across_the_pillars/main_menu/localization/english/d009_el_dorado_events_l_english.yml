l_english:

 d009_el_dorado_events.1.title: "Una Mappa di Dubbia Provenienza"
 d009_el_dorado_events.1.desc: "Due uomini si presentano al nostro fuoco con la disinvolta sicurezza di bugiardi esperti: disertori, o giocatori d'azzardo, o forzati evasi, perché la loro storia cambia a ogni racconto. Ciò che non cambia è la mappa che portano, un unto quadrato di pelle affollato di laghi d'oro, montagne d'argento massiccio e città disegnate più grandiose di quanto possano davvero esistere. Giurano sulla propria vita per ogni punto di riferimento, cosa che il nostro sergente osserva non valere una grande scommessa. Eppure è l'unica mappa che abbiamo, e una pista falsa percorsa con audacia ha portato molte spedizioni più lontano di una onesta rifiutata per paura."
 d009_el_dorado_events.el_dorado_desc: "El Dorado, il Dorato, nacque come una vera cerimonia tra i Muisca degli altopiani Colombiani, in cui un nuovo sovrano veniva ricoperto di polvere d'oro e portato a remi sul lago Guatavita per gettare nelle sue acque offerte d'oro e smeraldi. Nel racconto degli avventurieri Spagnoli e poi Inglesi, l'uomo dorato si gonfiò in una città d'oro, poi in un regno nascosto e infine in un intero impero perduto, la cui presunta ubicazione si ritirava sempre più in profondità nell'interno, dalle Ande all'Orinoco alle foreste della Guiana. La ricerca consumò una generazione di entradas: Jiménez de Quesada, Belalcázar e la rovinosa impresa di Gonzalo Pizarro e Francisco de Orellana, che non trovò oro ma produsse la prima navigazione Europea dell'Amazzonia. Spedizioni successive degenerarono in ammutinamenti, il più famigerato sotto Lope de Aguirre, mentre altre si affannarono a drenare il lago Guatavita stesso, recuperando un poco di tesoro a un costo enorme. Nessun regno fu mai trovato, perché nessuno era mai esistito, eppure la leggenda sopravvisse a ogni uomo che morì inseguendola."
 d009_el_dorado_events.1.a: "È la migliore mappa che abbiamo. Seguiamola."
 d009_el_dorado_events.1.b: "Mandiamo via i furfanti."
 d009_el_dorado_events.1.b.tt: "#italic Mandiamo via i furfanti e proseguiamo senza la loro unta mappa#!"
 new_location_grants_clue_for_el_dorado: "#Y [target_new_waypoint.GetName] fornisce un indizio su El Dorado#!"
 cartographer_cannot_read: "#Y Le scarse capacità di lettura del Cartografo bloccano la [expedition|e]#!"
 gasp_its_a_trap: "#Y La [expedition|e] perisce in un'imboscata: era una trappola!#!"
 will_reduce_our_chances_to_uncovering_goal_tt: "Questo ridurrà le nostre possibilità di scoprire ciò che cerchiamo"

 d009_el_dorado_events.2.title: "I Punti di Riferimento Non Concordano"
 d009_el_dorado_events.2.desc: "Per una volta la mappa e il paese concordano quasi. L'idolo scolpito sorge sul crinale esattamente dove la pergamena prometteva, fino alla sporgenza della sua mascella di pietra. Ma la grande cascata che dovrebbe tuonare a oriente si getta invece a occidente, e le due vette gemelle oltre si ergono in un ordine del tutto sbagliato. O il cartografo è stato trascurato, o ha disegnato un luogo di cui aveva solo sentito parlare, o la terra stessa ci è stata descritta da persone che sarebbero liete di vederci perduti in essa. [target_leader.GetName] rigira la pergamena più e più volte, come se la verità potesse essere scritta sul retro."
 d009_el_dorado_events.2.a: "La mappa è abbastanza precisa. Avanti."
 d009_el_dorado_events.2.b: "Non marceremo alla cieca su una mappa di bugiardi."
 d009_el_dorado_events.2.b.tt: "#italic Gettiamo via la falsa mappa e affidiamo ai nostri occhi il paese che ci attende#!"
 the_expedition_doublebacks: "#Y La [expedition|e] torna sui propri passi su terreno già percorso, e giorni preziosi vanno persi#!"
 press_on_regardless: "#Y Proseguiamo a ogni costo, fidandoci della pergamena più che dei nostri occhi#!"
 extort_locals: "#Y Strappiamo con la forza provviste e indicazioni agli abitanti#!"
 d009_el_dorado_events.3.title: "Esattamente Ciò che Volevamo Sentire"
 d009_el_dorado_events.3.desc: "Il prigioniero viene condotto davanti a [target_leader.GetName] tremante, e ci dice tutto ciò che speravamo di sentire: sì, il signore dorato è reale; sì, la sua corte si trova a pochi giorni di risalita del fiume; sì, i tetti stessi sono rivestiti d'oro che viene strappato e rifuso a ogni nuova primavera. È un resoconto magnifico, offerto con gli occhi spalancati e ansiosi di chi ha capito esattamente cosa i suoi interlocutori hanno attraversato un continente per trovare. Il nostro interprete prende in disparte [target_leader.GetName] e mormora un avvertimento: un uomo spaventato giurerà che il cielo è verde se crede che ciò allontanerà da casa sua degli stranieri armati. La difficoltà è che ogni parola di tutto ciò è anche esattamente ciò che desideravamo sentirci dire."
 d009_el_dorado_events.3.a: "Incalziamolo per ogni dettaglio."
 d009_el_dorado_events.3.b: "Premiamo l'onestà, non l'adulazione."
 d009_el_dorado_events.3.c: "Strappiamogli la verità."
 guide_told_us_what_we_wished: "#Y La guida ci ha detto solo ciò che volevamo sentire, e la pista non porta da nessuna parte#!"
 fear_loosens_the_guides_tongue: "#Y La paura scioglie la lingua della guida, e il suo racconto suona vero#!"
 forced_confession_breeds_hatred_tt: "La nostra [cultural_opinion|e] verso gli abitanti [target_location.GetDominantCulture.Custom('IT_CUL_MP')] peggiorerà"

 d009_el_dorado_events.4.title: "Un Premio che Vale il Ritardo"
 d009_el_dorado_events.4.desc: "Gli esploratori tornano senza fiato: a una giornata di marcia dalla nostra rotta, in una valle in cui non avremmo mai dovuto entrare, sorge una cittadina più ricca di qualunque cosa abbiamo visto dalla costa. Campi terrazzati, magazzini pieni, oro lavorato che scintilla al collo della sua gente. Non è la città che eravamo stati mandati a trovare, e deviare per essa ci costerà settimane che la stagione non può permettersi. Eppure gli uomini hanno già visto il bagliore, e una colonna che marcia oltre l'oro che vede, inseguendo l'oro di cui ha solo sentito parlare, è una colonna che comincia a porre domande dure all'uomo che la guida."
 d009_el_dorado_events.4.a: "Deviamo verso l'insediamento ricco."
 d009_el_dorado_events.4.b: "Prendiamo solo ciò che offrono liberamente."
 d009_el_dorado_events.4.c: "Manteniamo la rotta."
 d009_el_dorado_events.4.c.tt: "#italic Marciamo oltre l'oro che vediamo, restando fedeli all'oro che ci è stato promesso#!"
 a_modest_haul: "#Y L'insediamento fornisce un modesto bottino per le nostre casse#!"
 a_peaceful_exchange: "Uno scambio pacifico si aggiunge a ciò che porteremo a casa"

 d009_el_dorado_events.5.title: "Un Tesoro Ben Custodito"
 d009_el_dorado_events.5.desc: "Oltre il limite degli alberi sorge un luogo a cui le guide non vogliono avvicinarsi: un santuario fortificato, con l'ingresso carico di oro lavorato, i parapetti allineati di uomini silenziosi e vigili. Qualunque cosa sia custodita all'interno vale chiaramente la pena di uccidere per difenderla, il che, nei calcoli dei nostri ufficiali, la rende chiaramente degna di essere presa. [target_leader.GetName] soppesa le file di lancieri contro il peso di quelle porte e trova l'aritmetica cupa. Qui c'è oro da prendere, se siamo disposti a pagarlo in una moneta diversa dall'argento."
 d009_el_dorado_events.5.a: "Impadroniamoci del tesoro con la forza."
 d009_el_dorado_events.5.b: "Contrattiamo con cautela una parte."
 d009_el_dorado_events.5.c: "È troppo ben custodito. Lasciamolo."
 d009_el_dorado_events.5.c.tt: "#italic Soppesiamo le mura contro il bottino e lasciamo il tesoro ai suoi custodi#!"
 the_hoard_is_seized: "#Y Il tesoro è confiscato, e il suo oro accresce ciò che porteremo a casa#!"
 a_wary_bargain: "Un cauto accordo ci garantisce una parte del tesoro"