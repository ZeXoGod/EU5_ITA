l_english:
 holy_war.11.title: "Predoni alla Frontiera"
 holy_war.11.desc: "Una #italic cabalgada#! proveniente [cabalgada_raider.Custom('IT_Dalla')][cabalgada_raider.GetName] si è riversata sulle nostre terre di confine, incendiando villaggi e portando via tutto ciò che poteva prima di ripassare la frontiera. Le nostre terre indifese sono state devastate. Mobilitiamo le leve per presidiare le marche, o lasciamo passare l'affronto?"
 holy_war.11.a: "Mandiamo le nostre leve verso la frontiera!"
 holy_war.11.b: "Non c'è nulla che possiamo fare."

 holy_war.12.title: "Richiesta di Tributo"
 holy_war.12.desc: "Emissari [parias_demander.Custom('IT_Della')][parias_demander.GetName] giungono alla nostra corte con un messaggio inequivocabile: la [threatening_crusade.GetName] sta per essere bandita contro di noi e, a meno che non paghiamo un tributo, i suoi eserciti marceranno sulle nostre terre. I nostri consiglieri ci avvertono che il nostro oro non farà che guadagnare tempo, placando la loro sete di sangue senza mai estinguerla. Paghiamo per rimandare la resa dei conti, o li sfidiamo e ci prepariamo alla tempesta?"
 holy_war.12.a: "Paghiamo il tributo per guadagnare tempo."
 holy_war.12.a.tt: "Ritarda la [crusade|e], riducendone la preparazione di #G 30#! e abbassandone lo zelo religioso di #G 10#!"
 holy_war.12.b: "Non ci lasceremo intimidire. Che vengano."
 holy_war.12.b.tt: "Aumenta lo zelo religioso della [crusade|e] di #R 10#!"

 holy_war.13.title: "L'Infedele Paga"
 holy_war.13.desc: "La nostra richiesta ha dato frutto. [parias_payer.Custom('IT_La')|U][parias_payer.GetName] [parias_payer.Custom('IT_Ha')] pagato il tributo anziché affrontare la [threatening_crusade.GetName] senza preparazione. Il loro denaro gonfia le nostre casse, e la loro tregua è solo questo, una tregua. La guerra santa è semplicemente rimandata."
 holy_war.13.a: "Il loro oro serve la causa santa."
 holy_war.13.a.tt: "Hanno pagato il tributo"

 holy_war.14.title: "L'Infedele ci Sfida"
 holy_war.14.desc: "[parias_payer.Custom('IT_La')|U][parias_payer.GetName] [parias_payer.Custom('IT_Ha')] respinto la nostra richiesta di tributo e scelto la sfida. La loro insolenza ha solo rafforzato la determinazione dei fedeli, e il fervore della [threatening_crusade.GetName] arde più vivo per questo."
 holy_war.14.a: "Allora sarà la spada a rispondere."
 holy_war.14.a.tt: "Si sono rifiutati di pagare il tributo"

 holy_war.15.title: "Predoni dal Sud"
 holy_war.15.desc: "Un #italic ḡazw#! proveniente [ghazw_raider.Custom('IT_Dalla')][ghazw_raider.GetName] ha spazzato le nostre regioni di confine, incendiando villaggi e portando via tutto ciò che poteva prima di ripassare la frontiera. Le nostre terre indifese giacciono saccheggiate. Chiamiamo alle armi le nostre truppe per proteggere le marche, o lasciamo passare l'affronto?"
 holy_war.15.a: "Mandiamo le nostre leve verso la frontiera!"
 holy_war.15.b: "Non c'è nulla che possiamo fare."

 holy_war.16.title: "Predoni dal Mare"
 holy_war.16.desc: "Corsari [shore_raider.Custom('IT_Della')][shore_raider.GetName] hanno attaccato la nostra costa, saccheggiando i porti e portando via la nostra gente in catene prima che le loro vele scomparissero all'orizzonte. Le nostre coste indifese giacciono devastate. Chiamiamo alle armi le nostre truppe per proteggere il litorale, o lasciamo passare l'affronto?"
 holy_war.16.a: "Mandiamo le nostre leve verso la costa!"
 holy_war.16.b: "Non c'è nulla che possiamo fare."

 d009_holy_war.1.title: "Gli Ordini Rispondono"
 d009_holy_war.1.desc: "La convocazione è stata inviata agli ordini militari, e i frati si stanno radunando."
 d009_holy_war.1.desc_santiago: "L'[summoned_order.GetName] ha risposto, e ha risposto in forze. I suoi frati sono scesi lungo la strada in colonna, ottocento lance sotto lo stendardo della conchiglia, e hanno posto il campo senza che nessuno dicesse loro dove. L'[summoned_order.GetNameWithNoTooltip] combatte questa guerra da duecento anni, e il suo Gran Maestro non ha bisogno che gli si spieghi la campagna.\n\nHa una sola domanda, posta con cortesia e una volta sola: dove si colloca l'ordine nella linea?"
 d009_holy_war.1.desc_calatrava: "L'[summoned_order.GetName] ha risposto. I suoi frati sono arrivati in buon ordine e in silenzio, in mantelli bianchi con la croce rossa, disciplina cistercense portata su un campo di battaglia. Hanno piantato il campo un poco in disparte dall'esercito [ROOT.GetCountry.Custom('IT_ADJ_MS')], com'è loro usanza.\n\nIl Gran Maestro partecipa ai nostri consigli, parla poco ed è invariabilmente nel giusto riguardo al terreno. Chiede dove si collochi l'ordine nella linea."
 d009_holy_war.1.desc_alcantara: "L'[summoned_order.GetName] ha risposto, e ha portato con sé la frontiera. Non sono cavalieri da torneo: sono gli uomini che in un anno ordinario tengono i guadi del Tago, e sono arrivati con i propri esploratori, le proprie guide e le proprie opinioni sul nemico.\n\nIl Gran Maestro chiede dove si collochi l'ordine nella linea, con il tono di chi ha già scelto."
 d009_holy_war.1.desc_montesa: "L'[summoned_order.GetName] ha risposto, il che lo porta più lontano da casa di quanto di solito vada. I suoi frati hanno lasciato le torri costiere a una guardia ridotta e sono cavalcati a unirsi a noi, e sono ben consapevoli del complimento che ci stanno facendo.\n\nIl Gran Maestro chiede dove si collochi l'ordine nella linea, e per quanto tempo prevediamo di averne bisogno."
 d009_holy_war.1.desc_avis: "L'[summoned_order.GetName] ha risposto. I suoi frati sono tanto un corpo politico quanto uno militare, e il loro arrivo è una dichiarazione su di chi sia questa guerra.\n\nIl Gran Maestro chiede dove si collochi l'ordine nella linea. Sta osservando per vedere se la risposta li onora."
 d009_holy_war.1.desc_christ: "L'[summoned_order.GetName] ha risposto, e c'è qualcosa di incongruo in ciò. Sono i frati che finanziano le caravelle e discutono di latitudini, e sono venuti nell'entroterra in armatura a combattere una guerra d'assedio.\n\nIl Gran Maestro chiede dove si collochi l'ordine nella linea, con l'aria di chi ci ricorda che il suo ordine fu fondato proprio per questo."
 d009_holy_war.1.a: "Diamo loro l'avanguardia."
 d009_holy_war.1.b: "Terranno il fianco."

 d009_holy_war.2.title: "La Bolla è Concessa"
 d009_holy_war.2.desc: "La bolla è arrivata, sigillata e inequivocabile. La #italic Bula de Cruzada#! concede l'indulgenza a quanti contribuiscono alla guerra contro l'infedele, e indica [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')][ROOT.GetCountry.GetFlavorRank] come strumento di tale guerra.\n\nIn pratica è una licenza di raccogliere denaro da tutti i nostri fedeli, parrocchia per parrocchia, con la piena autorità [GetUniqueInternationalOrganization('catholic_church').Custom('IT_IO_DEL')][GetUniqueInternationalOrganization('catholic_church').GetName] alle spalle dei collettori. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] già chiedono, con delicatezza, chi farà la raccolta e chi terrà il conto."
 d009_holy_war.2.a: "Predichiamola in ogni parrocchia e lasciamo che i nostri uomini tengano la cassa."
 d009_holy_war.2.b: "Prendiamo solo ciò che è dato liberamente, e lasciamo che [GetUniqueInternationalOrganization('catholic_church').Custom('IT_IO_IL')][GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip] ne tenga il conto."

 d009_holy_war.3.title: "I Volontari della Fede"
 d009_holy_war.3.desc: "Arrivano da settimane: ḡāzī dalle montagne, studenti delle #italic madrase#!, confraternite di città che non abbiamo mai avuto occasione di tassare. Alcuni hanno portato cavalli. Molti non hanno portato altro che convinzione.\n\nNon sono soldati e non saranno comandati come soldati. Sono anche, se rivolti contro il nemico abbastanza presto, assai più preziosi di quanto il loro equipaggiamento lasci supporre."
 d009_holy_war.3.a: "Mandiamoli subito a nord."
 d009_holy_war.3.b: "Teniamoli, e facciamone prima dei soldati."

 d009_holy_war.4.title: "La Traversata"
 d009_holy_war.4.desc: "La flotta ha trasportato l'esercito sull'altra sponda, e gli stendardi sono sulla riva settentrionale.\n\nOgni comandante che l'ha già fatto conosce l'aritmetica: lo [ShowLocationName('strait_of_gibraltar')] è alle nostre spalle, la flotta non può restare, e ciò che terremo tra un mese è ciò che avremo. I primi giorni decidono la campagna."
 d009_holy_war.4.a: "Colpiamo nell'entroterra mentre si stanno ancora radunando."
 d009_holy_war.4.b: "Assicuriamo prima lo sbarco e i porti."

 d009_holy_war.5.title: "Dopo il Ḡazw"
 d009_holy_war.5.desc: "I predoni sono tornati oltre la frontiera, spingendo davanti a sé bestiame e prigionieri, e l'intera campagna è uscita a guardarli rientrare.\n\nCiò che è stato preso va ora diviso, e la divisione è osservata più da vicino della razzia. I ḡāzī sono partiti per [ROOT.GetCountry.GetReligion.GetGodName] e per il bottino, in un ordine che preferirebbero non specificare."
 d009_holy_war.5.a: "Il bottino appartiene agli uomini che lo hanno preso."
 d009_holy_war.5.b: "Il tesoro prende il quinto che gli è dovuto."

 d009_holy_war.6.title: "Il Premio dei Corsari"
 d009_holy_war.6.desc: "La squadra è tornata carica. [ShowGoodsName('cloth')], denaro, arredi di chiesa e duecento prigionieri da una costa che si credeva troppo a nord perché valesse il viaggio.\n\nI capitani sono a terra e spendono. Il #italic qāḍī#! ha domande sulla sorte dei prigionieri, e il tesoro ne ha su tutto il resto."
 d009_holy_war.6.a: "Riscattiamo i prigionieri e prendiamo il profitto."
 d009_holy_war.6.b: "Insediamoli, e lasciamo che la costa impari fin dove possiamo arrivare."
