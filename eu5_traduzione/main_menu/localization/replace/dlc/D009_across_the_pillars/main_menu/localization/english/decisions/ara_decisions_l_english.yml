l_english:

 ara_unite_barcelona_dynasty.title: "Unire la Dinastia"
 ara_unite_barcelona_dynasty.desc: "Con la vittoria dei Vespri Siciliani, che ha assicurato il trono alla nostra dinastia, la nostra influenza in [ShowRegionName('italy_region')] è cresciuta. Nonostante ciò, la [ShowAreaName('sicily_area')] mantiene ancora la sua sovranità, prendendo le distanze dalla nostra politica dinastica. Anziché lasciarci sfuggire questa opportunità, forse possiamo contattare i nostri parenti laggiù, stabilendo un'unione dinastica più salda e dando potenzialmente il via alle nostre ambizioni in [ShowRegionNameWithNoTooltip('italy_region')]."
 ara_unite_barcelona_dynasty.a: "Proviamo a unire entrambe le corone."
 ara_unite_barcelona_dynasty.b: "Serviranno come nostro stato cliente."
 ara_effects_only_take_place_if_sic_accepts_tt: "Gli effetti si verificheranno solo se [GetCountry('SIC').Custom('IT_La')][GetCountry('SIC').GetName] accetta"

 ara_vassalize_bosnia.title: "Esigiamo la Vassallizzazione [GetCountry('BOS').Custom('IT_Dalla')][GetCountry('BOS').GetNameWithNoTooltip]"
 ara_vassalize_bosnia.desc: "Il grande sovrano [GetCountry('BOS').Custom('IT_Della')][GetCountry('BOS').GetName] lotta da tempo per mantenere la sovranità del paese contro vicini assetati di potere. Incapaci di difendersi da soli, diversi membri [GetCountry('BOS').Custom('IT_NOBLES_DEL')][GetCountry('BOS').GetGovernment.GetEstateName('nobles_estate')] si sono rivolti al nostro sovrano e alla corte, chiedendo che li proteggiamo da qualsiasi invasione. Preferirebbero diventare nostri sudditi piuttosto che cadere in mani pagane, cosa che possiamo sfruttare a nostro vantaggio."
 ara_vassalize_bosnia.a: "È giunto il momento di chiedere la loro sottomissione."
 ara_ask_bosnia_for_vassalization: "Esigeremo la sottomissione [GetCountry('BOS').Custom('IT_Dalla')][GetCountry('BOS').GetName]"
