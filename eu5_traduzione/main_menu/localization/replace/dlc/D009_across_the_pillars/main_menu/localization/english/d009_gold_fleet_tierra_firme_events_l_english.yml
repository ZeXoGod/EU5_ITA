l_english:
 gold_fleet_tierra_firme_events.1.title: "Rotta verso Tierra Firme"
 gold_fleet_tierra_firme_events.1.desc_prefix: "La flotta è armata e pronta a [departure_port.GetName]. Acqua e provviste sono a bordo, insieme al ferro e al mercurio che le colonie non possono procurarsi da sole, e [target_leader.GetName] tiene in mano gli ordini [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')].\n\nLa stagione è propizia e il vento è favorevole alla traversata. Al di là di essa, l'[ShowGoodsName('silver')]"
 gold_fleet_tierra_firme_events.1.desc_suffix: "sta già scendendo dalle montagne verso la costa, in attesa di una flotta che lo porti in patria. Se vogliamo riportarlo in salvo a [departure_port.GetName], i galeoni devono salpare ora."
 gold_fleet_tierra_firme_events.1.desc: "$gold_fleet_tierra_firme_events.1.desc_prefix$ delle Indie $gold_fleet_tierra_firme_events.1.desc_suffix$"
 gold_fleet_tierra_firme_events.1.desc.rich: "$gold_fleet_tierra_firme_events.1.desc_prefix$ di [silver_source.GetName] $gold_fleet_tierra_firme_events.1.desc_suffix$"
 gold_fleet_tierra_firme_events.1.a: "Salpiamo. I galeoni partono con la marea del mattino."
 gold_fleet_tierra_firme_events.1.historical_info: "I #italic Galeones de Tierra Firme#! erano uno dei due convogli che componevano la #italic Carrera de Indias#! spagnola. La flotta di Tierra Firme serviva i viceregni sudamericani, raccogliendo l'argento delle miniere di Potosí nell'Alto Perù e altre entrate coloniali attraverso i porti di Portobelo e Cartagena. L'argento veniva trasportato via terra dalla costa del Pacifico attraverso l'istmo di Panama prima di essere imbarcato. Filippo II formalizzò il sistema dei convogli nel 1566, imponendo che tutto il commercio viaggiasse in flotte armate e transitasse per la #italic Casa de Contratación#! di Siviglia, che riscuoteva il #italic quinto real#! della corona, un quinto di tutti i metalli preziosi estratti dal Nuovo Mondo."

 gold_fleet_tierra_firme_events.2.title: "L'Argento della Nuova Granada"
 gold_fleet_tierra_firme_events.2.desc_prefix: "Abbiamo raggiunto [loot_port.GetName], al sicuro dietro le sue mura e la bocca del suo porto. Nei magazzini lungo il molo giace un anno di fatiche delle miniere: lingotti di [ShowGoodsName('silver')]"
 gold_fleet_tierra_firme_events.2.desc_middle: "casse di monete, pellami in fasci, barili di indaco e, qua e là, una cassa sorvegliata di [ShowGoodsName('gems')]"
 gold_fleet_tierra_firme_events.2.desc_suffix: "Le stive non sono ancora piene, e altro [ShowGoodsNameWithNoTooltip('silver')] sta ancora scendendo dall'interno. Possiamo attendere l'intero convoglio e caricare ogni stiva, oppure prendere ciò che è già stato radunato e proseguire prima che la stagione degli uragani si faccia vicina."
 gold_fleet_tierra_firme_events.2.desc: "$gold_fleet_tierra_firme_events.2.desc_prefix$, $gold_fleet_tierra_firme_events.2.desc_middle$.\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
 gold_fleet_tierra_firme_events.2.desc.rich: "$gold_fleet_tierra_firme_events.2.desc_prefix$ da [silver_source.GetName], $gold_fleet_tierra_firme_events.2.desc_middle$ da [gem_source.GetName].\n\n$gold_fleet_tierra_firme_events.2.desc_suffix$"
 gold_fleet_tierra_firme_events.2.a: "Attendiamo l'intero convoglio e riempiamo ogni stiva."
 gold_fleet_tierra_firme_events.2.b: "Prendiamo solo ciò che è già stato radunato."
 gold_fleet_tierra_firme_events.2.c: "Il rischio è troppo grande. Torniamo in patria con ciò che abbiamo."
 gold_fleet_tierra_firme_events.2.historical_info: "Cartagena de Indias, fondata nel 1533, era il principale punto di raccolta caraibico per l'argento proveniente dal Sud America. L'argento delle miniere di Potosí nell'Alto Perù, il giacimento d'argento più ricco del mondo al suo apice, veniva trasportato al porto pacifico di Callao, spedito a nord fino a Panama e portato a dorso di mulo attraverso l'istmo fino a Portobelo, dove veniva imbarcato sui galeoni di Tierra Firme durante la grande fiera commerciale. La ricchezza che transitava per Cartagena ne fece una delle città più fortificate delle Americhe e un bersaglio perenne per i corsari, in particolare Sir Francis Drake, che la saccheggiò nel 1586."

 gold_fleet_tierra_firme_events.3.title: "$gold_fleet_nueva_espana_events.3.title$"
 gold_fleet_tierra_firme_events.3.desc.together: "La flotta ha raggiunto [rendezvous_port.GetName], dove la #italic flota#! della Nuova Spagna è già all'ancora sotto i cannoni della fortezza, con le sue stive cariche di [ShowGoodsName('silver')] quanto le nostre. Da qui le due flotte compiranno insieme la traversata atlantica, a nord con la Corrente del Golfo e poi a est, oltre la costa della Florida.\n\nSi dice che vele nemiche attendano lungo quella rotta, ma un convoglio di queste dimensioni è una preda difficile da catturare. [target_leader.GetName] deve decidere come la flotta unita risponderà alla minaccia prima di salpare per la Spagna."
 gold_fleet_tierra_firme_events.3.desc.alone: "La flotta ha raggiunto [rendezvous_port.GetName] e giace all'ancora sotto i cannoni della fortezza. La #italic flota#! della Nuova Spagna non è qui ad unirsi a noi; compiremo la traversata atlantica da soli, a nord con la Corrente del Golfo e poi a est, oltre la costa della Florida.\n\nSi dice che vele nemiche attendano lungo quella rotta, e una flotta solitaria è un bersaglio allettante. [target_leader.GetName] deve decidere come rispondere alla minaccia prima di salpare per la Spagna."
 gold_fleet_tierra_firme_events.3.a: "$gold_fleet_nueva_espana_events.3.a$"
 gold_fleet_tierra_firme_events.3.b: "$gold_fleet_nueva_espana_events.3.b$"
 gold_fleet_tierra_firme_events.3.c: "$gold_fleet_nueva_espana_events.3.c$"
 gold_fleet_tierra_firme_events.3.historical_info: "L'Avana divenne il punto di raccolta obbligatorio per la flotta d'argento di ritorno dopo che Filippo II formalizzò il sistema dei convogli nel 1566. Il profondo porto naturale della città e la sua posizione affacciata sul Canale della Florida ne fecero il naturale punto d'incontro sia per i galeoni di Tierra Firme sia per la Flota de Nueva España prima della comune traversata atlantica. La costruzione del Castillo de los Tres Reyes del Morro a partire dal 1589 fu una risposta diretta alla minaccia dei corsari stranieri. Scegliere il momento della traversata era cruciale: partire troppo tardi significava rischiare la stagione degli uragani caraibici; troppo presto significava venti sfavorevoli nell'Atlantico."

 gold_fleet_tierra_firme_events.8.title: "In Attesa della Flota della Nuova Spagna"
 gold_fleet_tierra_firme_events.8.desc: "La flotta ha raggiunto [rendezvous_port.GetName], ma la #italic flota#! della Nuova Spagna non è ancora arrivata. Gli ordini [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] sono chiari: le flotte del tesoro devono attraversare l'Atlantico unite, con i cannoni concentrati contro i corsari che si aggirano nel Canale della Florida.\n\nQuindi getteremo l'ancora sotto la fortezza e la attenderemo, confidando che non tardi a giungere."
 gold_fleet_tierra_firme_events.8.a: "$gold_fleet_nueva_espana_events.8.a$"
 gold_fleet_tierra_firme_events.8.historical_info: "$gold_fleet_nueva_espana_events.8.historical_info$"
 gold_fleet_tierra_firme_events.awaiting_fleet_tt: "La flotta attenderà qui all'ancora l'arrivo della Flota de Nueva España, per quanto tempo ci voglia"

 gold_fleet_tierra_firme_events.9.title: "$gold_fleet_nueva_espana_events.9.title$"
 gold_fleet_tierra_firme_events.9.desc: "Sono passate settimane all'ancora a [rendezvous_port.GetName], e la #italic flota#! della Nuova Spagna ancora non è arrivata. Le provviste scarseggiano, gli uomini si fanno inquieti, e ogni giorno all'ancora è un giorno in cui la stagione volge ulteriormente contro una traversata sicura.\n\n[target_leader.GetName] deve decidere se resistere in attesa dell'appuntamento o tentare la sorte nell'Atlantico senza di essa."
 gold_fleet_tierra_firme_events.9.a: "$gold_fleet_nueva_espana_events.9.a$"
 gold_fleet_tierra_firme_events.9.b: "$gold_fleet_nueva_espana_events.9.b$"
 gold_fleet_tierra_firme_events.9.historical_info: "$gold_fleet_nueva_espana_events.9.historical_info$"

 gold_fleet_tierra_firme_events.10.title: "$gold_fleet_nueva_espana_events.10.title$"
 gold_fleet_tierra_firme_events.10.desc: "[target_leader.GetName] viene a sapere che anche [secondary_port.GetName] può essere indotto a cedere la propria parte, con l'[ShowGoodsName('goods_gold')] trasportato attraverso l'istmo che passa per i suoi magazzini. Si potrebbe distaccare una squadra per raccoglierlo, anche se dividere la flotta in queste acque non è un rischio da poco.\n\nPossiamo trattenere la flotta qui a [loot_port.GetNameWithNoTooltip] finché il distaccamento non farà ritorno, oppure proseguire verso [rendezvous_port.GetNameWithNoTooltip] e lasciare che ci raggiunga lì."
 gold_fleet_tierra_firme_events.10.a: "$gold_fleet_nueva_espana_events.10.a$"
 gold_fleet_tierra_firme_events.10.b: "$gold_fleet_nueva_espana_events.10.b$"
 gold_fleet_tierra_firme_events.10.c: "$gold_fleet_nueva_espana_events.10.c$"
 gold_fleet_tierra_firme_events.10.historical_info: "$gold_fleet_nueva_espana_events.10.historical_info$"
 gold_fleet_tierra_firme_events.10.danger_tt: "$gold_fleet_nueva_espana_events.10.danger_tt$"
 gold_fleet_tierra_firme_events.havana_together_danger_tt: "Navigare insieme alla Flota de Nueva España $gold_fleet_nueva_espana_events.together_danger_suffix$"

 gold_fleet_tierra_firme_events.11.title: "Il Distaccamento Fa Ritorno"
 gold_fleet_tierra_firme_events.11.desc: "La squadra inviata a [secondary_port.GetName] è tornata a [loot_port.GetName], con le stive colme di [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')] e pellami. La flotta è di nuovo unita, e più sicura per questo."
 gold_fleet_tierra_firme_events.11.a: "$gold_fleet_nueva_espana_events.11.a$"
 gold_fleet_tierra_firme_events.11.historical_info: "$gold_fleet_nueva_espana_events.11.historical_info$"

 gold_fleet_tierra_firme_events.12.title: "Il Distaccamento si Ricongiunge Presso Cuba"
 gold_fleet_tierra_firme_events.12.desc: "La squadra distaccata a [secondary_port.GetName] ha raggiunto la flotta mentre questa si avvicina a [rendezvous_port.GetNameWithNoTooltip], con le stive cariche degli ultimi [ShowGoodsName('goods_gold')], [ShowGoodsName('gems')] e pellami della stagione."
 gold_fleet_tierra_firme_events.12.a: "$gold_fleet_nueva_espana_events.12.a$"
 gold_fleet_tierra_firme_events.12.historical_info: "$gold_fleet_nueva_espana_events.12.historical_info$"

 gold_fleet_tierra_firme_events.14.title: "Un Carico di Smeraldi"
 gold_fleet_tierra_firme_events.14.desc: "Un convoglio sorvegliato è sceso fino alla banchina da [gem_source.GetName], e sotto la sua scorta giace una fortuna in [ShowGoodsName('gems')] — smeraldi grezzi della più pura acqua, che valgono più, a peso, di qualunque altra cosa nelle nostre stive. I fattori vorrebbero che li portassimo in patria, e il profitto sarebbe immenso.\n\nEppure un bottino simile è proprio ciò che attira i corsari, e la notizia di un simile carico viaggia più veloce di qualunque nave. [target_leader.GetName] deve soppesare la ricchezza contro il pericolo che essa richiama."
 gold_fleet_tierra_firme_events.14.a: "Imbarchiamo gli smeraldi. Una fortuna simile non aspetta."
 gold_fleet_tierra_firme_events.14.b: "Lasciamoli. Le nostre stive sono già abbastanza cariche."
 gold_fleet_tierra_firme_events.14.decline_tt: "Gli smeraldi vengono lasciati a una flotta successiva, e le nostre stive più leggere attenuano i pericoli del viaggio"
 gold_fleet_tierra_firme_events.14.historical_info: "Le miniere di smeraldi di Muzo e Somondoco, nella Nuova Granada, erano le più ricche del mondo, e gli smeraldi colombiani divennero uno dei beni di lusso più ambiti dell'epoca, apprezzati dalle corti d'Europa a quelle dell'India Moghul e della Persia Safavide. Le pietre erano piccole per ingombro ma straordinarie per valore, e una sola partita sorvegliata poteva rivaleggiare con un intero carico d'argento. La concentrazione di ricchezza le rendeva una calamita per furti e intercettazioni, e la corona ne sorvegliava gli spostamenti con la stessa attenzione riservata ai lingotti."

 gold_fleet_tierra_firme_events.15.title: "I Convogli di Muli dell'Istmo"
 gold_fleet_tierra_firme_events.15.desc: "L'ultima #italic recua#! della stagione è ancora sul sentiero — una lunga carovana di muli carichi di [ShowGoodsName('silver')] dal versante del Pacifico, che serpeggia attraverso l'istmo di Panama, infestato dalle febbri, verso la costa. Giunge notizia che predoni #italic cimarrón#!, fuggiti dalle piantagioni e viventi allo stato selvatico nella giungla, stanno pedinando il sentiero e intendono piombarle addosso prima che ci raggiunga.\n\nL'argento può ancora essere portato qui, ma solo se agiamo per vederlo giungere in salvo fino al mare."
 gold_fleet_tierra_firme_events.15.a: "Mandiamo una scorta armata a condurre la carovana di muli in salvo attraverso l'istmo."
 gold_fleet_tierra_firme_events.15.b: "Non possiamo attendere. Prendiamo qualunque cosa raggiunga la costa."
 gold_fleet_tierra_firme_events.15.historical_info: "L'argento del Perù raggiungeva i Caraibi solo dopo un'ardua traversata via terra dell'istmo di Panama per mezzo delle #italic recuas#!, carovane di muli che portavano il metallo prezioso da Panama City, sul Pacifico, a Nombre de Dios e più tardi a Portobelo, sull'Atlantico. Il sentiero nella giungla era preda dei #italic cimarrones#! — comunità di schiavi fuggiti che si erano stabilite nell'entroterra — e nel 1573 Francis Drake si alleò con loro, com'è noto, per tendere un'imboscata a una carovana d'argento e portarsene via una fortuna. Presidiare l'attraversamento dell'istmo fu una preoccupazione costante e costosa per la corona spagnola."

 gold_fleet_tierra_firme_events.16.title: "La Costa delle Perle"
 gold_fleet_tierra_firme_events.16.desc: "Una barca veloce si affianca con notizie da [pearl_source.GetName]: il raccolto stagionale di [ShowGoodsName('pearls')] è pronto, una piccola fortuna che occuperebbe poco spazio nelle nostre stive. Una breve deviazione a est lungo la costa basterebbe a raccoglierlo.\n\nMa quelle acque sono basse, ristrette e molto frequentate dai corsari, e una flotta che devia dalla propria rotta si attira guai. [target_leader.GetName] deve soppesare il bottino contro il rischio."
 gold_fleet_tierra_firme_events.16.a: "Deviamo verso [pearl_source.GetNameWithNoTooltip] e imbarchiamo le perle."
 gold_fleet_tierra_firme_events.16.b: "Manteniamo la rotta. Le perle possono attendere un'altra flotta."
 gold_fleet_tierra_firme_events.16.decline_tt: "La flotta mantiene la rotta e supera la costa delle perle, e le nostre stive più leggere attenuano i pericoli del viaggio"
 gold_fleet_tierra_firme_events.16.historical_info: "Le pescherie di perle dei Caraibi meridionali — al largo di Cubagua, Margarita e Río de la Hacha — furono tra le prime fonti di ricchezza sfruttate dagli spagnoli nel Nuovo Mondo, lavorate da subacquei ridotti in schiavitù in condizioni brutali finché i banchi non furono in gran parte esauriti. Le perle erano piccole, trasportabili e di immenso valore, un carico ideale che racchiudeva una fortuna in poche casse, e le partite di perle venivano regolarmente raccolte dalle flotte insieme all'argento e all'oro."

 gold_fleet_tierra_firme_events.17.title: "Passaggio per gli Uomini della Corona"
 gold_fleet_tierra_firme_events.17.desc: "Alla flotta giunge una petizione da [colony_source.GetName]: funzionari regi e le loro famiglie, bloccati nella colonia in attesa di un passaggio verso la Spagna. Portarli in salvo oltre l'oceano è un servizio che [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] non mancherà di notare — ma la flotta dovrebbe fare scalo e restare all'ancora mentre loro e i loro bagagli vengono imbarcati.\n\n[target_leader.GetName] deve decidere se il calendario della flotta possa sopportare il ritardo."
 gold_fleet_tierra_firme_events.17.a: "Facciamo scalo per i funzionari. Il loro favore vale il ritardo."
 gold_fleet_tierra_firme_events.17.b: "Non possiamo perdere giorni. Dovranno attendere una nave successiva."
 gold_fleet_tierra_firme_events.17.decline_tt: "I funzionari vengono lasciati ad attendere un altro passaggio, e la flotta rispetta il proprio calendario"
 gold_fleet_tierra_firme_events.17.historical_info: "La Casa de Contratación si aspettava che le flotte del tesoro portassero in Spagna funzionari coloniali, ecclesiastici e le loro famiglie ogni volta che il passaggio fosse richiesto, considerandolo un dovere dovuto alla Corona tanto quanto l'argento stesso. Un capitano che respingesse tali passeggeri rischiava che le lamentele giungessero al Consiglio delle Indie — sebbene ogni giorno speso a caricare loro e i loro bagagli fosse un giorno sottratto a un viaggio già in corsa contro la stagione degli uragani."
