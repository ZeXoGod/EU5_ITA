l_english:
 d009_morisco_diaspora.1.title: "Arrivano i Moriscos"
 d009_morisco_diaspora.1.entry: "$d009_morisco_diaspora.1.title$"
 d009_morisco_diaspora.1.desc: "Profughi che si definiscono Moriscos, famiglie di fede [ShowReligionGroupAdjective('muslim')] espulse da terre che i loro antenati chiamarono casa per secoli, hanno cominciato a stabilirsi a [target_location.GetName], portando con sé le usanze, i mestieri e la parlata di una [ShowRegionName('iberia_region')] che pochi di noi hanno mai visto. Alcuni tra i nostri funzionari accolgono con favore l'arrivo di braccia esperte e capitali pronti; altri vedono stranieri della cui lealtà, verso una patria a guida di fede [ShowReligionGroupAdjectiveWithNoTooltip('christian')] a cui sono sfuggiti da poco, è impossibile fidarsi del tutto."
 d009_morisco_diaspora.1.a: "Accogliamoli senza riserve."
 d009_morisco_diaspora.1.b: "Limitiamoli a questo solo quartiere."
 d009_morisco_diaspora.1.historical_info: "In seguito al decreto di espulsione del 1609–1614, circa 300.000 Moriscos lasciarono la Spagna per il Maghreb, stabilendosi soprattutto a Tetouan, Salé, Tunisi e Algeri. Molti conservarono per generazioni la parlata, l'abbigliamento e la cucina andalusi, mentre altri si assimilarono alle più ampie società Musulmane che li accolsero."
 variable_d009_morisco_community_ever_tt: "Una Comunità Morisca è Esistita ad Algeri"

 d009_morisco_diaspora.2.title: "La Repubblica di Rabat-Salé"
 d009_morisco_diaspora.2.entry: "$d009_morisco_diaspora.2.title$"
 d009_morisco_diaspora.2.desc: "La comunità Morisca di [ShowLocationName('sale')] è diventata abbastanza audace da governarsi da sola in tutto tranne che nel nome, con i suoi capitani corsari che rispondono a un consiglio di loro scelta anziché a qualunque governatore noi potessimo nominare. Se formalizzare ciò che è già accaduto nella pratica o riportare [ShowLocationNameWithNoTooltip('sale')] sotto una supervisione più stretta è una questione che la nostra corte non può più rimandare."
 d009_morisco_diaspora.2.a: "Concediamo loro autonomia."
 d009_morisco_diaspora.2.b: "Integriamoli nella marina regia."
 d009_morisco_diaspora.2.historical_info: "La Repubblica di Salé (detta anche Repubblica di Bou Regreg) emerse intorno al 1627 come entità corsara semi-indipendente governata da profughi Moriscos e dai loro discendenti, che razziava attorno all'Iberia e sul commercio atlantico in gran parte al di fuori del diretto controllo di qualunque sultano. Si sottomise infine all'autorità marocchina sotto la dinastia alawita più avanti nel XVII secolo, benché le sue caratteristiche piratesche persistessero per generazioni."

 d009_morisco_diaspora.3.title: "Il Quartiere Andaluso di [ShowLocationNameWithNoTooltip('tunis')]"
 d009_morisco_diaspora.3.entry: "$d009_morisco_diaspora.3.title$"
 d009_morisco_diaspora.3.desc: "I Moriscos stabilitisi a [ShowLocationName('tunis')] si sono costruiti un quartiere distinto, la cui architettura, i cui giardini e il cui artigianato sono riconoscibilmente di [ShowRegionNameWithNoTooltip('iberia_region')], nonostante siano ormai separati da generazioni da [ShowRegionNameWithNoTooltip('iberia_region')] stessa. Se incoraggiare quella distintività come segno del carattere cosmopolita di questa città o assorbirla discretamente nella popolazione più ampia è una scelta interamente nostra."
 d009_morisco_diaspora.3.a: "Incoraggiamo la conservazione culturale."
 d009_morisco_diaspora.3.b: "Incoraggiamo l'assimilazione."
 d009_morisco_diaspora.3.historical_info: "I Moriscos stabilitisi a Tunisi dopo le espulsioni spagnole fondarono un quartiere distinto, ancora oggi noto con varianti del nome #italic Zuqāq al-'Andalus#!, preservando per secoli l'architettura, la cucina e la tradizione musicale andalusa nota come #italic ma'luf#!."

 d009_morisco_diaspora.4.title: "La Musica [ShowCultureNameWithNoTooltip('andalusi')] Sopravvive"
 d009_morisco_diaspora.4.entry: "$d009_morisco_diaspora.4.title$"
 d009_morisco_diaspora.4.desc: "I musicisti della comunità Morisca continuano a suonare e insegnare l'intricata musica di corte che i loro antenati eseguivano nei palazzi di [ShowRegionName('iberia_region')], trasmettendola da maestro ad allievo in una catena ininterrotta fin da prima delle espulsioni. Poeti di corte e viaggiatori hanno cominciato a segnalarla come uno dei più distintivi tesori culturali di questo regno."
 d009_morisco_diaspora.4.a: "Riconosciamo la tradizione."
 d009_morisco_diaspora.4.historical_info: "La tradizione musicale andalusa della #italic nuba#!, sviluppatasi nelle corti di al-'Andalus e portata in Nordafrica da generazioni di esuli, sopravvisse e si evolse in repertori regionali distinti ancora oggi eseguiti in tutto il Maghreb, in particolare a Tetouan, Tunisi e Algeri, ciascuna delle quali conserva la propria scuola distinta della tradizione."

 d009_morisco_diaspora.5.title: "I Corsari Moriscos di [ShowLocationNameWithNoTooltip('algiers')]"
 d009_morisco_diaspora.5.entry: "$d009_morisco_diaspora.5.title$"
 d009_morisco_diaspora.5.desc: "I profughi Moriscos che un tempo pescavano e coltivavano le coste di [ShowRegionName('iberia_region')] offrono ora a questo regno qualcosa di considerevolmente più utile dei loro vecchi mestieri: una conoscenza intima dei porti, delle correnti e delle difese costiere regionali di cui i nostri capitani corsari sono del tutto privi. Se mettere quella conoscenza a frutto in mare o tenere queste famiglie nei più sicuri mestieri che già conoscono merita un'attenta riflessione."
 d009_morisco_diaspora.5.a: "Reclutiamoli come piloti."
 d009_morisco_diaspora.5.b: "Teniamoli nei mestieri artigiani."
 d009_morisco_diaspora.5.historical_info: "I Moriscos con un'intima conoscenza della geografia costiera dell'Iberia furono molto apprezzati dai corsari di Algeri per tutto il XVII secolo, servendo come piloti e predoni la cui familiarità con i porti e le correnti spagnoli diede alle flotte corsare locali un vantaggio operativo significativo sui loro bersagli Cristiani."

 d009_morisco_diaspora.6.title: "Due Generazioni dopo l'Espulsione"
 d009_morisco_diaspora.6.entry: "$d009_morisco_diaspora.6.title$"
 d009_morisco_diaspora.6.desc: "I figli e i nipoti dei primi esuli Moriscos sono cresciuti conoscendo questa terra, e solo questa, come casa. Alcuni di loro parlano di [ShowRegionName('iberia_region')] solo attraverso racconti ereditati, ormai più leggenda che ricordo; altri ancora celebrano l'anniversario dell'esilio dei nonni come se fosse accaduto ieri. Se incoraggiare questa generazione a considerarsi pienamente nostri sudditi o continuare a onorare ciò che la rende distinta, è una scelta che plasmerà il modo in cui questa comunità sarà ricordata."
 d009_morisco_diaspora.6.a: "Incoraggiamo la piena integrazione."
 d009_morisco_diaspora.6.b: "Sosteniamo il perdurare della loro memoria."
 d009_morisco_diaspora.6.historical_info: "Entro la metà o la fine del XVII secolo, i figli e i nipoti degli esuli Moriscos erano sempre più integrati nella più ampia popolazione del Maghreb, benché usanze, cognomi e una persistente identità andalusa distinti sopravvivessero in città come Tetouan e Tunisi ben oltre il XVIII secolo."

 d009_morisco_diaspora.7.title: "Le Chiavi di [ShowLocationNameWithNoTooltip('granada')]"
 d009_morisco_diaspora.7.entry: "$d009_morisco_diaspora.7.title$"
 d009_morisco_diaspora.7.desc: "Alcune famiglie della comunità Morisca conservano ancora le chiavi e gli atti delle case che i loro antenati possedevano a [ShowLocationName('granada')] e altrove in [ShowRegionName('iberia_region')]. Questi oggetti non hanno alcuna utilità pratica, ma sono stati tramandati per molte generazioni come promessa, per quanto improbabile, di un ritorno che si fa meno plausibile con ogni anno che passa."
 d009_morisco_diaspora.7.a: "Riflettiamo su ciò che è andato perduto."
 d009_morisco_diaspora.7.historical_info: "La conservazione delle chiavi delle case ancestrali in Iberia da parte di famiglie Moriscas e, separatamente, Sefardite è una tradizione ben documentata nelle comunità della diaspora del Maghreb e del mondo Ottomano, a simboleggiare una pretesa duratura, in gran parte simbolica, su una patria che si faceva sempre più lontana a ogni generazione."

 d009_morisco_diaspora.8.title: "Algeri [ROOT.GetCountry.Custom('IT_ADJ_FS')] e l'Eredità [ShowCultureNameWithNoTooltip('andalusi')]"
 d009_morisco_diaspora.8.entry: "Algeri e l'Eredità Andalusa"
 d009_morisco_diaspora.8.desc: "I nostri ingegneri e amministratori ad [ShowLocationName('algiers')] hanno sviluppato un crescente interesse per i quartieri e l'architettura [ShowCultureName('andalusi')] lasciati da generazioni di insediamento Morisco, discutendo se tale eredità meriti un'attenta conservazione o debba cedere il passo a una pianificazione più moderna e più compiutamente [ROOT.GetCountry.Custom('IT_ADJ_FS')]."
 d009_morisco_diaspora.8.a: "Preserviamo l'eredità."
 d009_morisco_diaspora.8.b: "Sostituiamola con una pianificazione moderna."
 d009_morisco_diaspora.8.historical_info: "Gli amministratori coloniali francesi che assunsero il controllo di Algeri dopo il 1830 ebbero atteggiamenti contrastanti verso l'eredità Morisca e dell'epoca Ottomana della città: alcuni funzionari e studiosi lavorarono per documentare e preservare l'architettura di influenza andalusa, mentre altri sovrintesero alla sua demolizione a favore dell'urbanistica francese, in particolare nel vecchio quartiere della cittadella Ottomana noto come Casbah."

 d009_morisco_diaspora.9.title: "Due Comunità, una Strada verso [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetNameWithNoTooltip]"
 d009_morisco_diaspora.9.entry: "Due Comunità, una Sola Strada"
 d009_morisco_diaspora.9.desc: "Nell'arco di una sola generazione, questo regno è diventato la casa di due popoli scacciati dalle stesse sponde dalla stessa catastrofe: esuli [ShowCultureName('sephardi')] in fuga dall'Editto dell'Alhambra e profughi Moriscos in fuga dalla conversione forzata o peggio. Alcuni della nostra corte vedrebbero ciascuna comunità stabilita nel proprio quartiere, con carta propria e usanze proprie; altri sostengono che un esilio condiviso debba essere accolto con un'accoglienza condivisa, sotto un solo tetto anziché due."
 d009_morisco_diaspora.9.a: "Istituiamo quartieri separati."
 d009_morisco_diaspora.9.b: "Permettiamo un insediamento misto."
 d009_morisco_diaspora.9.historical_info: "Il Marocco accolse sia popolazioni Ebraiche sia Musulmane espulse dall'Iberia tra il XV e il XVII secolo, e in città come Tetouan e Fez le due comunità vivevano spesso a stretto contatto, condividendo un'eredità comune di popoli dell'Iberia pur mantenendo istituzioni religiose e giuridiche proprie e separate."
 d009_morisco_diaspora_9_sephardi_population_tt: "Il regno ha una popolazione Sefardita"
 d009_morisco_diaspora_9_morisco_community_tt: "Il regno ha una comunità Morisca consolidata"

 d009_morisco_diaspora.10.title: "La Città che Ricorda"
 d009_morisco_diaspora.10.entry: "$d009_morisco_diaspora.10.title$"
 d009_morisco_diaspora.10.desc: "[ShowLocationName('tetouan')] porta l'impronta di due popoli esiliati allo stesso tempo: famiglie [ShowCultureName('sephardi')] e profughi Moriscos, entrambi ancora parlanti dialetti dello spagnolo che i loro nonni portarono con sé, entrambi ancora intenti a dare ai figli il nome di città di una [ShowRegionName('iberia_region')] che nessuna delle due comunità rivedrà mai. Poche città al mondo portano tanta memoria nelle proprie strade, nei propri tribunali e nelle proprie cucine tutta insieme."
 d009_morisco_diaspora.10.a: "Andiamo fieri della memoria viva della città."
 d009_morisco_diaspora.10.historical_info: "Tetouan fu ricostruita e ripopolata in gran parte da esuli Sefarditi e Musulmani andalusi dopo la loro espulsione dall'Iberia, e la città conservò perciò il proprio carattere unicamente influenzato dall'Iberia, compresi l'#italic Haketia#! e i dialetti arabo-marocchini che portano ancora tracce di spagnolo, fino al XX secolo inoltrato."
