l_english:

 d009_iberian_order_events.1.title: "Il Magistero dell'[target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.1.entry: "Il Magistero di Santiago"
 d009_iberian_order_events.1.desc: "Il Gran Maestro dell'[target_order.GetName] è morto, e i fratelli si sono riuniti in capitolo per nominare il suo successore.\n\nNessun altro ordine [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] è tanto ricco, né tanto pericoloso. Le sue commende si estendono dal Tago alla frontiera dell'[ShowAreaName('andalusia_area')], le sue lance rispondono a un Maestro che non deve obbedienza a nessuno se non al Papa, e chiunque il capitolo sceglierà terrà in mano più del nostro confine meridionale di quanto ne tenga tutta [ROOT.GetCountry.Custom('IT_NOBLES_IL_NOSTRO')][ROOT.GetCountry.Custom('IT_NOBLES_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')].\n\n[target_ruler.GetName] non ha aspettato di essere interpellato. [target_ruler.GetSheHe|U] ha già cavalcato verso la sede del capitolo, con una scorta al [target_ruler.GetHerHis] seguito e un candidato in mente."
 d009_iberian_order_events.1.a: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] nominerà il Gran Maestro."
 d009_iberian_order_events.1.a.entry: "La $crown_estate$ nominerà il Gran Maestro."
 d009_iberian_order_events.1.b: "Lasciamo che i fratelli dell'[target_order.GetNameWithNoTooltip] eleggano il proprio."
 d009_iberian_order_events.1.b.entry: "Lasciamo che i fratelli eleggano il proprio."
 d009_iberian_order_events.1.c: "Lasciamo che sia il Papa a risolvere la questione."

 d009_iberian_order_events.2.title: "Il Tesoro di [ShowLocationNameWithNoTooltip('ucles')]"
 d009_iberian_order_events.2.entry: "$d009_iberian_order_events.2.title$"
 d009_iberian_order_events.2.desc: "[ShowLocationName('ucles')] è il cuore e il forziere dell'[target_order.GetName]. Due secoli di tributi dalla frontiera, di lasciti di cavalieri in punto di morte e di rendite di un centinaio di commende riposano dietro le sue mura sotto forma di argenteria, monete e reliquiari.\n\nIl nostro tesoro non versa in condizioni altrettanto floride. Nessuna legge ci consente di aprire quella porta, poiché la ricchezza dell'ordine appartiene alla [GetUniqueInternationalOrganization('catholic_church').GetName] e i fratelli non mancheranno di ribadirlo a gran voce. Ma non c'è alcun esercito tra il nostro ordine e il forziere."
 d009_iberian_order_events.2.a: "L'ordine pagherà le nostre guerre."
 d009_iberian_order_events.2.b: "Lasciamo intatto il tesoro e dotiamo la sede di [ShowLocationNameWithNoTooltip('ucles')]."
 d009_iberian_order_events.2.c: "Inviamo dei revisori e prendiamo la quota [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.2.c.entry: "Inviamo dei revisori e prendiamo la quota della $crown_estate$."

 d009_iberian_order_events.3.title: "La Via per [ShowLocationNameWithNoTooltip('santiago_compostela')]"
 d009_iberian_order_events.3.entry: "$d009_iberian_order_events.3.title$"
 d009_iberian_order_events.3.desc: "Ogni anno ne arrivano di più dalle [ShowAreaName('flanders_area')] e da ben oltre i Pirenei, camminando verso ovest attraverso [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] in direzione del santuario dell'Apostolo. Portano con sé argento per il viaggio, e per questo vengono derubati.\n\nL'[target_order.GetName] fu fondato proprio per vigilare su questo. I suoi fratelli custodiscono gli ospedali e i ponti, e il suo Maestro ci ricorda, ogni volta che vogliamo ascoltarlo, che custodire una strada costa più di quanto la strada renda."
 d009_iberian_order_events.3.a: "Paghiamo i fratelli perché presidino la strada."
 d009_iberian_order_events.3.b: "Lasciamo che impongano invece un pedaggio ai pellegrini."
 d009_iberian_order_events.3.c: "Concediamo loro l'ospedale di [ShowLocationNameWithNoTooltip('leon')]."

 d009_iberian_order_events.11.title: "La Questione di Cîteaux"
 d009_iberian_order_events.11.entry: "$d009_iberian_order_events.11.title$"
 d009_iberian_order_events.11.desc: "L'[target_order.GetName] è una casa cistercense che si dà il caso porti la lancia. La sua regola proviene da Cîteaux, nella [ShowAreaName('burgundy_area')], i suoi abati scendono a sud per ispezionarlo, e i suoi fratelli ricevono la propria disciplina da monaci che non hanno mai visto un Moro.\n\nLa visita è di nuovo imminente, e questa volta il Maestro ha chiesto se sia davvero tenuto a riceverla. Degli abati stranieri che correggono gli uomini che presidiano la nostra frontiera sono, a seconda di chi lo si chieda, la fonte della celebre disciplina dell'ordine oppure un insulto a [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 d009_iberian_order_events.11.a: "Gli abati di Cîteaux possono mantenere la loro visita."
 d009_iberian_order_events.11.b: "L'ordine risponde a noi, non alla [ShowAreaNameWithNoTooltip('burgundy_area')]."
 d009_iberian_order_events.11.c: "Lasciamo che gli avvocati ne discutano ancora per qualche anno."

 d009_iberian_order_events.12.title: "Il Magistero dell'[target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.12.entry: "Il Magistero di Calatrava"
 d009_iberian_order_events.12.desc: "Il magistero dell'[target_order.GetName] è rimasto vacante, e il capitolo è già diviso. Una fazione ha un candidato, un'altra ha un rivale, ed entrambe hanno uomini armati a un giorno di cavallo dal castello.\n\n[target_ruler.GetName] ricorda quanto è costata a [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] l'ultima elezione contestata. Un Maestro dell'[target_order.GetNameWithNoTooltip] comanda i castelli dell'intera marca centrale; un Maestro che non ci deve nulla li comanda contro di noi con la stessa facilità con cui li comanda a nostro favore."
 d009_iberian_order_events.12.a: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] nominerà il Gran Maestro."
 d009_iberian_order_events.12.a.entry: "La $crown_estate$ nominerà il Gran Maestro."
 d009_iberian_order_events.12.b: "Lasciamo che i fratelli dell'[target_order.GetNameWithNoTooltip] eleggano il proprio."
 d009_iberian_order_events.12.b.entry: "Lasciamo che i fratelli eleggano il proprio."
 d009_iberian_order_events.12.c: "Lasciamo che Cîteaux arbitri tra le fazioni."

 d009_iberian_order_events.13.title: "Il Campo di Almagro"
 d009_iberian_order_events.13.entry: "$d009_iberian_order_events.13.title$"
 d009_iberian_order_events.13.desc: "Almagro è la commenda più ricca dell'[target_order.GetName] e sorge proprio sulle strade della Mancia. Finché [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] è in guerra, chi tiene Almagro tiene il grano, i cavalli di rimonta e il guado.\n\nIl comandante del luogo non ha inviato alcuna dichiarazione a nessuno. Attende di essere interpellato, e a interpellarlo sono più parti."
 d009_iberian_order_events.13.a: "Almagro si schiererà con [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.13.a.entry: "Almagro si schiererà con la $crown_estate$."
 d009_iberian_order_events.13.b: "Lasciamo che la commenda segua la propria coscienza."
 d009_iberian_order_events.13.c: "Non permetteremo a nessuna delle due parti di servirsi di Almagro."

 d009_iberian_order_events.21.title: "La Frontiera di [ShowLocationNameWithNoTooltip('alcantara')]"
 d009_iberian_order_events.21.entry: "$d009_iberian_order_events.21.title$"
 d009_iberian_order_events.21.desc: "Il ponte di [ShowLocationName('alcantara')] è romano, ed è la ragione per cui l'[target_order.GetName] esiste proprio lì. Con [GetCountry('POR').Custom('IT_La')][GetCountry('POR').GetName] in armi contro di noi, quel ponte è la via più breve verso [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] e la via più breve verso il loro.\n\nIl Maestro scrive di poter tenere il passaggio, bruciare la sponda opposta o negoziare una pace locale con i comandanti [GetCountry('POR').Custom('IT_ADJ_MP')] che conosce da vent'anni. Attende che gli si dica quale."
 d009_iberian_order_events.21.a: "Teniamo il ponte, a qualunque costo."
 d009_iberian_order_events.21.b: "Lasciamo che facciano razzia oltre il Tago e si tengano ciò che prendono."
 d009_iberian_order_events.21.c: "Lasciamo che compri una tregua sulla frontiera."

 d009_iberian_order_events.22.title: "L'Ultimo Gran Maestro dell'[target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.22.entry: "L'Ultimo Gran Maestro di Alcántara"
 d009_iberian_order_events.22.desc: "Il Maestro dell'[target_order.GetName] è un uomo anziano, più studioso che soldato, e l'ultimo della sua stirpe a ricoprire la carica per libera elezione dei fratelli.\n\n[target_ruler.GetName] non ha fatto mistero di ciò che accadrà alla sua morte. Resta solo da sapere se [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] attenderà fino ad allora, o se al vecchio verrà chiesto di farsi da parte subito, finché ha ancora la grazia di farlo con dignità."
 d009_iberian_order_events.22.a: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] nominerà subito il suo successore."
 d009_iberian_order_events.22.a.entry: "La $crown_estate$ nominerà subito il suo successore."
 d009_iberian_order_events.22.b: "Manterrà il magistero fino alla morte."
 d009_iberian_order_events.22.c: "Lasciamo che si ritiri con onore nella sua biblioteca."

 d009_iberian_order_events.23.title: "Il Forziere di [ShowLocationNameWithNoTooltip('brozas')]"
 d009_iberian_order_events.23.entry: "$d009_iberian_order_events.23.title$"
 d009_iberian_order_events.23.desc: "Il forziere di [ShowLocationName('brozas')] è stato aperto, e con esso sono sparite le rendite annuali di metà dell'[target_order.GetName]. Non c'è stato alcun assedio né alcuna porta forzata, il che dice ai fratelli proprio ciò che meno vorrebbero sentirsi dire sulla propria casa.\n\nIl Maestro ha chiesto il nostro aiuto, il che è già di per sé un'ammissione. Non lo chiederebbe se riuscisse a trovare da solo i ladri."
 d009_iberian_order_events.23.a: "Mandiamo gli uomini [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] a dare la caccia ai ladri."
 d009_iberian_order_events.23.a.entry: "Mandiamo gli uomini della $crown_estate$ a dare la caccia ai ladri."
 d009_iberian_order_events.23.b: "L'ordine dovrà sopportare le proprie perdite."

 d009_iberian_order_events.31.title: "Le Caravelle di [order_administrator.GetNameWithNoTooltip]"
 d009_iberian_order_events.31.entry: "Le Caravelle dell'Amministratore"
 d009_iberian_order_events.31.desc: "[order_administrator.GetName] detiene l'amministrazione dell'[target_order.GetName], e ha scoperto che cosa ciò comporti: le rendite di ogni commenda [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank], e nessuno con l'autorità di chiedere a [order_administrator.GetHerHim] come vengano spese.\n\n[order_administrator.GetSheHe|U] le spende in navi. Anno dopo anno le caravelle scendono a sud oltre [ShowLocationName('cape_bojador')] e tornano con sabbia, schiavi e storie, e anno dopo anno le entrate dell'ordine finiscono nello scafo successivo. I fratelli hanno cominciato a scriverci a questo proposito."
 d009_iberian_order_events.31.a: "Finanziamo i viaggi anche con la borsa [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 d009_iberian_order_events.31.a.entry: "Finanziamo i viaggi anche con la borsa della $crown_estate$."
 d009_iberian_order_events.31.b: "Lasciamo che [order_administrator.GetNameWithNoTooltip] abbia ciò che l'ordine può risparmiare."
 d009_iberian_order_events.31.b.entry: "Lasciamo che l'amministratore abbia ciò che l'ordine può risparmiare."
 d009_iberian_order_events.31.c: "Le rendite dell'ordine servono per la frontiera, non per l'oceano."

 d009_iberian_order_events.32.title: "L'Eredità dei Templari"
 d009_iberian_order_events.32.entry: "$d009_iberian_order_events.32.title$"
 d009_iberian_order_events.32.desc: "L'[target_order.GetName] esiste perché un tempo ci rifiutammo di lasciare che le terre del Tempio lasciassero [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName], e ribattezzammo semplicemente gli uomini che le detenevano. Fu sempre una finzione giuridica, e [GetCountry('ARA').Custom('IT_La')][GetCountry('ARA').GetName] [GetCountry('ARA').Custom('IT_Ha')] trovato un giurista disposto a dirlo ad alta voce.\n\nLa pretesa riguarda le antiche commende templari. Se verrà accolta, l'ordine perderà le tenute su cui fu fondato; se verrà contrastata, discuteremo davanti alla Curia per un decennio."
 d009_iberian_order_events.32.a: "Difendiamo l'eredità davanti alla Curia."
 d009_iberian_order_events.32.b: "Liquidiamo con denaro la pretesa [GetCountry('ARA').Custom('IT_ADJ_FS')]."
 d009_iberian_order_events.32.b.entry: "Liquidiamo con denaro la pretesa $ARA_ADJ$."

 d009_iberian_order_events.33.title: "La Croce sulle Vele"
 d009_iberian_order_events.33.entry: "$d009_iberian_order_events.33.title$"
 d009_iberian_order_events.33.desc: "Ogni caravella che parte verso sud porta sulla vela maestra la croce dell'[target_order.GetName]. L'ordine ne ha pagate parecchie, e ha cominciato a chiedersi che cosa possieda all'altro capo del viaggio.\n\nUna commenda sull'oceano è un'idea strana. Lo era anche una commenda sulla frontiera dei Mori, un tempo."
 d009_iberian_order_events.33.a: "Concediamo loro [ShowLocationNameWithNoTooltip('lagos')] e una quota dei viaggi."
 d009_iberian_order_events.33.b: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] prende la sua quota di ciò che finanziano."
 d009_iberian_order_events.33.b.entry: "La $crown_estate$ prende la sua quota di ciò che finanziano."
 d009_iberian_order_events.33.c: "L'ordine resta fuori dall'impresa oceanica."

 d009_iberian_order_events.41.title: "Il Gran Maestro dell'[target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.41.entry: "Il Gran Maestro di Avis"
 d009_iberian_order_events.41.desc: "Il trono è vuoto, la pretesa [ShowCultureName('castilian')] è forte, e [ROOT.GetCountry.Custom('IT_NOBLES_IL_NOSTRO')][ROOT.GetCountry.Custom('IT_NOBLES_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] cerca un candidato tutto nostro con cui poter convivere.\n\nContinua a volgere lo sguardo al Maestro dell'[target_order.GetName]. È di sangue [ROOT.GetCountry.GetGovernment.GetAdjective], ma nato dal lato sbagliato del letto, ha fatto voto di celibato e comanda l'unico corpo di cavalleria disciplinata di [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] che non sia già promesso a qualcuno. I fratelli dell'ordine lo seguirebbero ovunque, persino su un trono."
 d009_iberian_order_events.41.a: "Lasciamo che l'[target_order.GetNameWithNoTooltip] cavalchi per il proprio Maestro."
 d009_iberian_order_events.41.pretender_tt: "Il Maestro di Avis avanza la propria pretesa al trono"
 d009_iberian_order_events.41.a.entry: "Mettiamo il Maestro dell'Ordine sul trono."
 d009_iberian_order_events.41.b: "La pretesa [ShowCultureNameWithNoTooltip('castilian')] è quella legittima."
 d009_iberian_order_events.41.c: "Non permetteremo all'ordine di scegliere i nostri sovrani."

 d009_iberian_order_events.42.title: "Un Amministratore per l'[target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.42.entry: "Un Amministratore per Avis"
 d009_iberian_order_events.42.desc: "Il magistero dell'[target_order.GetName] è di nuovo vacante, e la [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha notato qualcosa che i fratelli avrebbero preferito le sfuggisse: nessuna legge impone a [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] di attendere la loro elezione.\n\n[target_ruler.GetName] ha un parente più giovane senza eredità e senza occupazione, e l'ordine possiede tenute sufficienti a mantenere un uomo simile nello stile cui è abituato. Non sarebbe la prima volta che un principe indossa un abito che non ha mai avuto intenzione di onorare."
 d009_iberian_order_events.42.a: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] nominerà l'amministratore."
 d009_iberian_order_events.42.a.entry: "La $crown_estate$ nominerà l'amministratore."
 d009_iberian_order_events.42.b: "Lasciamo ai fratelli la loro elezione."

 d009_iberian_order_events.43.title: "Il Collegio di [ShowLocationNameWithNoTooltip('evora')]"
 d009_iberian_order_events.43.entry: "$d009_iberian_order_events.43.title$"
 d009_iberian_order_events.43.desc: "Davanti a noi c'è la proposta di fondare un collegio a [ShowLocationName('evora')], e l'[target_order.GetName] detiene le rendite che servirebbero a finanziarlo.\n\nL'ordine fu fondato per difendere una frontiera che non esiste più. Le sue commende sono ormai fattorie, e i suoi fratelli proprietari terrieri. Un collegio darebbe all'ordine qualcosa da essere, il che è o un pensiero generoso o l'ammissione che ha esaurito il proprio scopo."
 d009_iberian_order_events.43.a: "Dotiamo il collegio con le risorse [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] e dell'ordine insieme."
 d009_iberian_order_events.43.a.entry: "Dotiamo il collegio con le risorse della $crown_estate$ e dell'ordine insieme."
 d009_iberian_order_events.43.b: "Lasciamo che l'ordine dia ciò che può risparmiare."
 d009_iberian_order_events.43.c: "[ShowLocationNameWithNoTooltip('evora')] può attendere."

 d009_iberian_order_events.51.title: "Le Terre dei Templari"
 d009_iberian_order_events.51.entry: "$d009_iberian_order_events.51.title$"
 d009_iberian_order_events.51.desc: "Il Tempio è stato soppresso, i suoi fratelli dispersi, e i suoi castelli nel Maestrat giacciono vuoti, senza nessuno che abbia il diritto legittimo di tenerli. L'[target_order.GetName] fu chiamato all'esistenza proprio perché quei castelli non abbandonassero [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank].\n\n[GetCountry('KNI').Custom('IT_La')|U][GetCountry('KNI').GetName] ci [GetCountry('KNI').Custom('IT_Ha')] scritto per ricordarci che il Concilio ha assegnato i beni del Tempio al loro ordine, in tutto il mondo [ShowReligionAdjective('catholic')]. [GetCountry('KNI').Custom('IT_La')|U][GetCountry('KNI').GetNameWithNoTooltip] hanno sede a [GetCountry('KNI').GetCapital.GetNameWithNoTooltip]. I castelli si trovano nell'area di [ShowAreaName('valencia_area')]."
 d009_iberian_order_events.51.a: "L'[target_order.GetNameWithNoTooltip] prende l'intera eredità."
 d009_iberian_order_events.51.a.entry: "Montesa prende l'intera eredità."
 d009_iberian_order_events.51.b: "Dividiamola con [GetCountry('KNI').Custom('IT_La')][GetCountry('KNI').GetNameWithNoTooltip]."
 d009_iberian_order_events.51.b.entry: "Dividiamola con i $KNI$."

 d009_iberian_order_events.52.title: "Il Magistero dell'[target_order.GetNameWithNoTooltip]"
 d009_iberian_order_events.52.entry: "Il Magistero di Montesa"
 d009_iberian_order_events.52.desc: "L'[target_order.GetName] è l'ultimo ordine militare di [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] che elegga ancora il proprio Maestro. I magisteri di cultura [ShowCultureName('castilian')] sono passati sotto [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] generazioni fa, e l'[target_order.GetNameWithNoTooltip] è andato avanti come se nessuno se ne fosse accorto.\n\n[target_ruler.GetName] se n'è accorto. Abbiamo richiesto una bolla, e arriverà; resta solo da decidere se prendere il magistero ora o lasciare che i fratelli tengano ancora un'elezione."
 d009_iberian_order_events.52.a: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] nominerà il Gran Maestro."
 d009_iberian_order_events.52.a.entry: "La $crown_estate$ nominerà il Gran Maestro."
 d009_iberian_order_events.52.b: "Lasciamo ai fratelli ancora un'elezione."

 d009_iberian_order_events.53.title: "La Costa Barbaresca"
 d009_iberian_order_events.53.entry: "$d009_iberian_order_events.53.title$"
 d009_iberian_order_events.53.desc: "Le galee arrivano in estate, portano via i pescatori dalle spiagge tra [ShowLocationName('peniscola')] e [ShowLocationName('valencia')], e sono sparite prima che si possa lanciare qualcosa all'inseguimento. L'[target_order.GetName] tiene questa costa, e i villaggi hanno preso a indirizzare le proprie suppliche all'ordine anziché a noi, il che è di per sé una specie di avvertimento.\n\nIl Maestro vuole delle torri: una catena di torri, presidiate per tutta l'estate, pagate da qualcun altro."
 d009_iberian_order_events.53.a: "Costruiamo le torri e paghiamo la guardia."
 d009_iberian_order_events.53.b: "Lasciamo che facciano ciò che possono con ciò che hanno."
 d009_iberian_order_events.53.c: "La costa deve badare a se stessa."

 d009_iberian_order_events.61.title: "Gli Ordini e [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]"
 d009_iberian_order_events.61.entry: "Gli Ordini e la $crown_estate$"
 d009_iberian_order_events.61.desc: "Agli ordini militari [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] non è mai stato chiesto, in alcuna forma ufficiale, a che cosa servano.\n\nTengono castelli, riscuotono rendite, rispondono a Maestri che rispondono al Papa, e per duecento anni nessuno ha esaminato quale sia la loro posizione rispetto a [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. [target_ruler.GetName] non è un sovrano della stessa pasta del [target_ruler.GetHerHis] predecessore, e ha fatto stendere i conti sul tavolo."
 d009_iberian_order_events.61.desc_council: "[ShowBureaucracyTypeName('spa_council_of_military_orders_bureaucracy')] è ormai in carica da qualche tempo, e i suoi scrivani hanno prodotto ciò che nessun regno precedente aveva mai avuto: un resoconto completo di ciò che gli ordini possiedono.\n\nLa lettura è sgradevole. I Maestri sono nostri nominati e i castelli sono amministrati in nome nostro, ma le rendite vanno ancora dove sono sempre andate, e i fratelli considerano ancora [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] un patrono anziché un padrone. L'amministrazione, a quanto pare, non è la stessa cosa dell'obbedienza."
 d009_iberian_order_events.61.a: "Confermiamo loro tutto ciò che detengono."
 d009_iberian_order_events.61.b: "Le loro rendite serviranno prima di tutto [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 d009_iberian_order_events.61.b.entry: "Le loro rendite serviranno prima di tutto il regno."

 d009_iberian_order_events.63.title: "L'Amministratorato"
 d009_iberian_order_events.63.entry: "$d009_iberian_order_events.63.title$"
 d009_iberian_order_events.63.desc: "È stato fatto in silenzio, un magistero alla volta, ciascuno con la propria bolla e le proprie ragioni, e solo ora la cancelleria li ha messi uno accanto all'altro e ha visto che cosa sia stato davvero costruito.\n\nI grandi ordini [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] tengono i castelli della marca, le rendite di un centinaio di commende e la miglior cavalleria pesante del mondo [ShowReligionAdjective('catholic')], e rispondono a uomini nominati da [target_ruler.GetName]. Mai prima d'ora [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] [ROOT.GetCountry.Custom('IT_Ha')] tenuto tanta parte della spada della [GetUniqueInternationalOrganization('catholic_church').GetName] in una sola mano.\n\nResta da decidere se questa sia un'istituzione o soltanto un'abitudine."
 d009_iberian_order_events.63.a: "Governiamoli tramite un unico consiglio."
 d009_iberian_order_events.63.b: "Manteniamo ogni magistero in famiglia."

