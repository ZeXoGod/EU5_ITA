l_english:
 dar_al_tiraz_bureaucracy: "Dār al-Ṭirāz"
 dar_al_tiraz_bureaucracy_desc: "Le sontuose vesti ricamate originarie della Persia sono da tempo impiegate nel mondo islamico come vesti d'onore che il sovrano concede a coloro che predilige. Un laboratorio reale #italic $dar_al_tiraz_bureaucracy$#! ben finanziato, che tessa seta, broccato e ricami, vestirà la corte di splendore e invierà preziosi tessuti a ogni mercato."
 diwan_al_mustakhlas_bureaucracy: "Dīwān al-Mustaḵlaṣ"
 diwan_al_mustakhlas_bureaucracy_desc: "Il #italic $diwan_al_mustakhlas_bureaucracy$#! amministra il dominio privato del sultano, fatto di tenute, mulini e rendite sottratte al tesoro pubblico per finanziare la corte e $alhambra$. Una gestione diligente mantiene la corona ricca e indipendente dai suoi domini, ma una sorveglianza allentata induce persino gli ufficiali incaricati della sua amministrazione a stornarne le ricchezze a proprio vantaggio."
 diwan_al_qawafil_bureaucracy: "Dīwān al-Qawāfil"
 diwan_al_qawafil_bureaucracy_desc: "Il #italic $diwan_al_qawafil_bureaucracy$#! sovrintende alle grandi carovane del commercio transahariano, le rotte che passano per Sijilmāsa e portano oro e schiavi verso nord, sale e stoffe verso sud. Un ufficio ben tenuto protegge i mercanti e le loro bestie e accresce la ricchezza che attraversa il deserto, per timore che le carovane diventino preda dei razziatori e che le tribù della sabbia si mostrino ostili verso un potere che non garantisce più la sicurezza della via."
 ghuzat_mujahidin_bureaucracy: "Al-Ḡuzāt al-Mujāhidīn"
 ghuzat_mujahidin_bureaucracy_desc: "I #italic $ghuzat_mujahidin_bureaucracy$#! sono i volontari della fede, quella cavalleria Nordafricana che attraversa lo stretto per condurre la guerra santa sulla frontiera sotto il comando del proprio $rank_county_arabic_ruler_male$. Questi ardenti guerrieri combattono con un fervore nato dalla devozione, e la loro pietà ispira il nostro popolo a seguirne l'esempio."
 makhzan_bureaucracy: "Al-Maḵzan"
 makhzan_bureaucracy_desc: "Il #italic $makhzan_bureaucracy$#! è l'apparato centrale dell'autorità del sultano, con i suoi esattori e governatori che estendono il potere del trono. Un #italic maḵzan#! forte stringe la presa della corona sulle tribù e sulle città lontane, ma quando la sua amministrazione si indebolisce, il paese diviene davvero un #italic bilād as-sība#!, la terra della dissidenza, e le province periferiche scivolano verso la ribellione e l'autonomia."
 marinid_madaris_bureaucracy: "Ri'āyat al-Madāris"
 marinid_madaris_bureaucracy_desc: "Il #italic $marinid_madaris_bureaucracy$#! è il patrocinio esercitato dalla corona sulle madrase, i collegi che formano i giuristi, gli scribi e gli ufficiali da cui lo Stato dipende. Se generosamente dotate, riempiono il gabinetto di servitori dotti e leali e radicano il diritto formale delle scuole."
 qadi_al_jamaa_bureaucracy: "Qāḍī al-Jamā'a"
 qadi_al_jamaa_bureaucracy_desc: "Il #italic $qadi_al_jamaa_bureaucracy$#! è il giudice capo della comunità, che presiede i tribunali $maliki_school$ e nomina i numerosi qāḍī locali del regno. Un sistema giudiziario rispettato compone le controversie secondo una legge riconosciuta da tutti e conferisce al trono la legittimità della giustizia, rafforzando l'attaccamento del popolo alla giurisprudenza formale."
 wulat_al_thughur_bureaucracy: "Wulāt al-Ṯuḡūr"
 wulat_al_thughur_bureaucracy_desc: "I #italic $wulat_al_thughur_bureaucracy$#! sono i custodi delle marche di frontiera. Presidiano i castelli di confine, sorvegliano i passi e gestiscono le tregue e i tributi che tengono a distanza i grandi regni Cristiani. Una marca ben tenuta irrobustisce i suoi difensori e guadagna tempo al regno con una diplomazia prudente, perché trascurare la frontiera rende audaci i nostri vicini, che potrebbero fiutarvi una debolezza e far valere le proprie pretese con maggiore insistenza."
 # Diwan al-Gharb
 diwan_al_gharb_bureaucracy: "Dīwān al-Ḡarb"
 diwan_al_gharb_bureaucracy_desc: "Il #italic $diwan_al_gharb_bureaucracy$#! — l'ufficio dell'Occidente — è l'organo amministrativo che insediamo nelle nostre province Andaluse per governare una popolazione che parla la lingua romanza arabizzata tanto volentieri quanto l'arabo, e le cui parrocchie restano più numerose delle nostre moschee. I suoi scribi riscuotono le entrate del sultano, nominano qāḍī a capo dei tribunali misti e fanno avanzare l'assimilazione che trasforma la conquista in provincia. Un ufficio ben tenuto lega queste terre occidentali alla nostra legge; lasciato in abbandono, consegna la frontiera al primo clan in grado di imporvi la propria autorità."
 # Mozabite Bureaucracy
 mozabite_azzaba_bureaucracy: "Consiglio degli 'Azzāba"
 mozabite_azzaba_bureaucracy_desc: "L'#italic ʿAzzāba#! è il consiglio segreto dei sapienti Ibaditi che costituisce la vera ossatura di governo delle comunità Mozabite della valle del Mzāb, deliberando sulla legge religiosa, arbitrando le controversie e facendo rispettare il rigido codice morale che ha preservato l'identità Ibadita attraverso secoli di pressione esterna. Manteniamo questo consiglio come supremo arbitro della nostra vita comunitaria, finanziandone i sapienti e onorandone le decisioni come espressioni della legge divina. Una ʿAzzāba ben sostenuta comanda la devozione dei fedeli ed estende la portata della giurisprudenza Ibadita fino a ogni focolare; privata di risorse, la sua autorità si frammenta, e correnti eterodosse invadono lo spazio lasciato dal suo silenzio."
 # Pre-Formation Iberian Bureaucracies
 nav_diputacion_navarra_bureaucracy: "Diputación de Navarra"
 nav_diputacion_navarra_bureaucracy_desc: "La $nav_diputacion_navarra_bureaucracy$ amministra la vita costituzionale della Navarra tra le sessioni delle Cortes, vegliando sulla riscossione del #italic donativo#! e sull'osservanza scrupolosa dei #italic fueros#! che definiscono l'autonomia Navarrese. I suoi membri provengono dai tre stati del regno, assicurando a nobiltà, clero e città una presenza istituzionale permanente nell'amministrazione del loro regno. Una Diputación ben finanziata garantisce il rispetto dei fueros; senza risorse sufficienti, non ha più la capacità di resistere alla pressione centralizzatrice che le grandi monarchie esercitano inevitabilmente sui loro territori più piccoli."
 por_desembargo_do_paco_bureaucracy: "Desembargo do Paço"
 por_desembargo_do_paco_bureaucracy_desc: "Il $por_desembargo_do_paco_bureaucracy$ è il supremo consiglio regio del Portogallo, incaricato di esaminare la legislazione, concedere le grazie e sovrintendere alle nomine giudiziarie che danno alla Corona la sua portata in ogni angolo del regno. A differenza dei giuristi formati all'università che compongono i tribunali ordinari, il Desembargo si avvale di uomini al tempo stesso esperti di diritto e di fiducia del re, unendo competenza giuridica e servizio diretto al monarca. Un Desembargo ben mantenuto accelera il ciclo amministrativo e garantisce che le decisioni regie siano applicate con precisione giuridica."
 por_mesa_da_consciencia_e_ordens_bureaucracy: "Mesa da Consciência e Ordens"
 por_mesa_da_consciencia_e_ordens_bureaucracy_desc: "La $por_mesa_da_consciencia_e_ordens_bureaucracy$ fu istituita per regolamentare gli ordini militari del Portogallo — l'Ordine di Cristo, l'Ordine di San Giacomo e l'Ordine di Aviz — di cui la Corona amministra le terre, le rendite e l'autorità spirituale in qualità di gran maestro. Il tribunale esamina le richieste di dispense religiose, gestisce l'assegnazione delle commende ai clienti regi e arbitra i rapporti tra il diritto canonico e il patronato regio. La sua creazione ha trasformato gli ordini militari, corporazioni ecclesiastiche autonome, in strumenti della politica della Corona, strettamente legati al programma religioso regio."
 # Spanish Councils - Regional
 spa_council_of_aragon_bureaucracy: "Consejo de Aragón"
 spa_council_of_aragon_bureaucracy_desc: "I territori orientali di [ShowRegionName('iberia_region')] della [ShowScriptedGeographyName('aragon_geography')] saranno governati dal #italic $spa_council_of_aragon_bureaucracy$#!. Questo ufficio è incaricato principalmente di preservare i nostri legami con il commercio mediterraneo e di rispondere alle esigenze dei fueros locali."
 spa_council_of_castile_bureaucracy: "Consejo de Castilla"
 spa_council_of_castile_bureaucracy_desc: "Il #italic $spa_council_of_castile_bureaucracy$#! è responsabile delle terre della [ShowScriptedGeographyName('castile_geography')], governando in nostro nome questi vasti territori e i loro popoli."
 spa_council_of_flanders_bureaucracy: "Consejo de Flandes"
 spa_council_of_flanders_bureaucracy_desc: "Dovendo governare terre lontane dai nostri domini tradizionali, il #italic $spa_council_of_flanders_bureaucracy$#! dovrà mantenere una salda presa su [ShowScriptedGeographyName('spanish_netherlands_geography')] per preservare l'ordine e la produttività della regione."
 spa_council_of_italy_bureaucracy: "Consejo de Italia"
 spa_council_of_italy_bureaucracy_desc: "Con la nostra presenza sempre crescente in [ShowRegionName('italy_region')], dovrebbe essere istituito un consiglio con la precisa vocazione di amministrare le nostre nuove conquiste. Governare queste terre rappresenterà per noi una sfida ben diversa da quella posta dai nostri territori in [ShowRegionName('iberia_region')]."
 spa_council_of_portugal_bureaucracy: "Conselho de Portugal"
 spa_council_of_portugal_bureaucracy_desc: "Con l'acquisizione di nuovi territori, è opportuno istituire un consiglio dedicato ai nostri possedimenti in [ShowScriptedGeographyName('portugal_geography')]. Questo ufficio amministrerà principalmente il nostro commercio atlantico e gli affari navali."
 spa_viceroy_bureaucracy: "Ufficio del Viceré"
 spa_viceroy_bureaucracy_desc: "$spa_council_of_indies_bureaucracy_desc$"
 # Spanish Councils - Statewide
 spa_council_of_crusade_bureaucracy: "Consejo de Cruzada"
 spa_council_of_crusade_bureaucracy_desc: "Istituito in conformità con la volontà di [GetUniqueInternationalOrganization('catholic_church').GetName] e del [Concept('pope','Papa')|e], il #italic $spa_council_of_crusade_bureaucracy$#! guiderà la nostra espansione e i nostri sforzi per portare la luce della fede [ShowReligionAdjective('catholic')] ai quattro angoli del mondo."
 spa_council_of_finance_bureaucracy: "Consejo de Hacienda"
 spa_council_of_finance_bureaucracy_desc: "Sostituendo i due antichi uffici dei Conti e dei Grandi Conti, il #italic $spa_council_of_finance_bureaucracy$#! eliminerà gli attriti tra i due uffici e creerà un ufficio unificato incaricato delle finanze dello Stato."
 spa_council_of_indies_bureaucracy: "Consejo de las Indias"
 spa_council_of_indies_bureaucracy_desc: "Tutto ciò che si trova oltre i mari ricadrà sotto la giurisdizione del #italic $spa_council_of_indies_bureaucracy$#!. Esso amministrerà l'intero commercio che fluisce dalle colonie verso la nostra madrepatria, nonché i nostri sudditi sulle rive straniere, assicurando un flusso costante di ricchezze verso i nostri forzieri. Le condizioni di vita e la regolamentazione dei nostri sudditi di recente acquisizione, così come la distribuzione delle terre destinate allo sfruttamento coloniale, saranno anch'esse regolate da questo Consiglio."
 spa_council_of_inquisition_bureaucracy: "Consejo de la Suprema Inquisición"
 spa_council_of_inquisition_bureaucracy_desc: "Il #italic $spa_council_of_inquisition_bureaucracy$#!, composto da diversi inquisitori apostolici e guidato dall'inquisitore generale, veglia sull'ortodossia religiosa e sui processi del nostro paese. Servirà come più alta corte d'appello, sia per le questioni ecclesiastiche sia per quelle temporali."
 spa_council_of_military_orders_bureaucracy: "Consejo de las Órdenes"
 spa_council_of_military_orders_bureaucracy_desc: "Incaricato dell'amministrazione delle loro antiche terre, il #italic $spa_council_of_military_orders_bureaucracy$#! svolgerà un ruolo essenziale nel concedere terre a fini militari, nell'ampliare il bacino di reclutamento dei nostri eserciti e nel vigilare affinché ufficiali competenti siano formati e arruolati nelle nostre forze."
 spa_council_of_state_bureaucracy: "Consejo de Estado"
 spa_council_of_state_bureaucracy_desc: "Il #italic $spa_council_of_state_bureaucracy$#! è guidato direttamente dal nostro sovrano e lo assiste negli affari esteri senza ingerenze di influenze esterne. Il consiglio è composto da membri competenti della nostra nobiltà e del nostro clero, formati alla diplomazia e alle relazioni estere, e gestirà sia le nostre ambasciate all'estero sia ci consiglierà nella conduzione delle delicate questioni internazionali."
 dawa_bureaucracy: "Dīwān al-Daʿwa"
 dawa_bureaucracy_desc: "Il #italic $dawa_bureaucracy$#! è l'ufficio attraverso cui il sovrano governa la fede oltre l'oceano, inviando qāḍī e predicatori verso le province lontane in cui il dominio ha superato la moschea. I suoi #italic duʿāt#! portano l'appello dell'Islam ai popoli di quelle rive, mentre i suoi scribi ricollegano le nuove colonie alla legge dell'umma. Ben mantenuto, trasforma la conquista lontana in una provincia consolidata e ingrossa le file dei fedeli sotto la corona. Trascurato, il gregge lontano si allontana dalla portata del sovrano, e l'appello tace là dove nessuno è pagato per lanciarlo."
