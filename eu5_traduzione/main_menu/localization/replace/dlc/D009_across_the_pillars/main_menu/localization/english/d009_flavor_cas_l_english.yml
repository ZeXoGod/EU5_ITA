l_english:

 flavor_cas.142.title: "La Leggenda Nera"
 flavor_cas.142.entry: "$flavor_cas.142.title$"
 flavor_cas.142.desc: "Ci è stato riferito che i nostri rivali coloniali non risparmiano alcuno sforzo per infangare il nome [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]. Opuscoli e racconti dipingono i nostri conquistadores come tiranni assetati di sangue e le nostre colonie come reami sorretti soltanto dalla crudeltà. Mentre le accuse si diffondono rapidamente in tutta [ShowContinentName('europe')], siamo chiamati a reagire a queste calunnie e a queste invenzioni dettate dall'invidia."
 flavor_cas.142.a: "La loro invidia è la prova della nostra grandezza."
 flavor_cas.142.b: "Raccogliamo prove e presentiamole pubblicamente."
 flavor_cas.142.b_tt: "Sebbene potremmo salvare la nostra reputazione, molti potrebbero interpretare la nostra risposta come un'ammissione di essere stati ingannati dalle loro menzogne e dalle loro invenzioni"
 flavor_cas.142.historical_info: "Dal XVI secolo in poi, i rivali coloniali della Spagna — in gran parte Protestanti — diedero il via a una campagna di diffamazione che sarebbe poi stata chiamata Leggenda Nera. Pur avendo essi stessi praticato azioni comparabili, cercarono di demonizzare la Spagna sottolineandone la brutalità nelle Americhe e ripubblicando opere Spagnole, come quelle scritte da Bartolomé de las Casas, con molte esagerazioni e passaggi estrapolati dal contesto, allo scopo di danneggiare la reputazione della corona Spagnola."

 flavor_cas.143.title: "La Strada [ROOT.GetCountry.Custom('IT_ADJ_FS')]"
 flavor_cas.143.entry: "La Strada Spagnola"
 flavor_cas.143.desc: "Con i nostri domini che si estendono dall'[ShowRegionName('italy_region')] a [target_province2.GetName], trasportare merci e soldati da un luogo all'altro è diventato un problema crescente, poiché le nostre navi corrono gravi pericoli, soprattutto quando navigano intorno alla [ShowRegionName('great_britain_region')]. È stato suggerito di investire in un sistema stradale che nel tempo colleghi per via di terra tutti i nostri possedimenti in [ShowContinentName('europe')]."
 flavor_cas.143.a: "Cominceremo a costruirlo."
 flavor_cas.143.a_tt: "Verrà costruita una [ShowRoadTypeName('paved_road')] in ogni [location|e] compresa nella [province|e] di [target_province1.GetName] e in quella di [target_province2.GetName], con un costo in [gold|e] che dipende dal terreno e dalle strade già costruite"
 flavor_cas.143.b: "Nulla può minacciare la nostra marina."
 flavor_cas.143.historical_info: "La Strada Spagnola fu un corridoio militare e logistico istituito a metà del XVI secolo che collegava i possedimenti Spagnoli in Italia ai Paesi Bassi Spagnoli attraverso territori alleati, in gran parte all'interno del Sacro Romano Impero. Fu costruita per evitare le acque pericolose della Manica, dove le marine ostili potevano intercettare con facilità le navi Spagnole."

 flavor_cas.148.title: "Empresa de China"
 flavor_cas.148.entry: "$flavor_cas.148.title$"
 flavor_cas.148.desc: "Fin dal nostro arrivo in [ShowRegionName('indonesia_region')], in molti sostengono che la conquista della Cina non sia soltanto possibile, ma sia un destino. I rapporti di mercanti e inviati descrivono nazioni appesantite dalla corruzione, che non avrebbero alcuna possibilità contro la potenza [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]. Le nostre spie hanno lavorato duramente per infiltrarsi [target_country.Custom('IT_In')][target_country.GetName], e ritengono che [target_location.GetName] sarebbe il trampolino perfetto per la nostra futura sottomissione dell'intera Cina."
 flavor_cas.148.a: "Iniziamo i preparativi per l'invasione."
 flavor_cas.148.b: "Non possiamo agire sulla base di queste voci."
 flavor_cas.148.historical_info: "Dopo la conquista Spagnola delle Filippine, numerosi funzionari e missionari Gesuiti proposero un ambizioso piano chiamato #italic Empresa de China#!, in cui la Spagna avrebbe dovuto invadere e convertire la Cina dei Ming. I missionari Gesuiti attivi in Cina riferirono che l'Impero era debole al suo interno e avrebbe potuto essere conquistato con facilità. Nel 1588 Filippo II autorizzò i preparativi per l'invasione, ma essa non fu mai tentata e rimane uno dei progetti espansionistici più ambiziosi mai realizzati dall'Impero Spagnolo."

 flavor_cas.152.title: "Un'Imposta per Tutto il Regno"
 flavor_cas.152.entry: "$flavor_cas.152.title$"
 flavor_cas.152.desc: "La nostra guerra contro i Mori ha imposto un pesante fardello al tesoro, e [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] [ROOT.GetCountry.Custom('IT_CROWN_HA')] l'obbligo di cercare nuove fonti di entrate per finanziare questa guerra. Le città del regno hanno accettato di concederci un prelievo sulle vendite, ma questa offerta spinge molti dei nostri consiglieri a suggerire che non dovrebbe trattarsi soltanto di una misura temporanea, bensì di una fonte di entrate permanente e istituzionalizzata."
 flavor_cas.152.a: "Non possiamo contare su doni temporanei."
 flavor_cas.152.b: "Non abuseremo della loro generosità."
 flavor_cas.152.historical_info: "Sotto il regno di Alfonso XI, la Castiglia incontrò difficoltà finanziarie a causa delle sue campagne contro Granada. Per finanziare l'assedio e la conquista di Algeciras, le città Castigliane concessero al re l'#italic Alcabala#!, un'imposta sulle transazioni commerciali. Concepita in origine come un contributo straordinario di guerra approvato dalle città attraverso le Cortes, l'imposta divenne rapidamente una delle fonti di entrate regie più importanti della Castiglia. I monarchi successivi la estesero e la istituzionalizzarono, trasformandola in un prelievo permanente che avrebbe fornito per secoli una parte considerevole delle entrate della Corona."
