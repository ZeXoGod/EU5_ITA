l_english:

 seven_cities_el_dorado.1.title: "Un Lago, una Barca e Niente"
 seven_cities_el_dorado.1.desc: "Dopo sei mesi negli altopiani la colonna ha raggiunto il lago che i sacerdoti Muisca descrivono come il cuore della cerimonia: un cratere circolare pieno di acqua scura, circondato da colline terrazzate, con un unico sentiero cerimoniale che scende fino alla riva. I sacerdoti non sono più qui; il paese è stato spopolato dal vaiolo una generazione prima del nostro arrivo. Il lago è stato dragato in tre punti da una squadra di tuffatori nativi disposti a farsi pagare in merci di scambio. Hanno riportato su qualche lavoro in oro, una certa quantità di ceramiche, le ossa di pesci e di un cane, e nulla che somigli a un re. [target_leader.GetName] è costretto a concludere che la cerimonia era reale, e che il regno che la sosteneva non esiste più."
 seven_cities_el_dorado.1.a: "Ammainiamo lo stendardo. Non è rimasto alcun paese con cui trattare."
 seven_cities_el_dorado.1.historical_info: "Guatavita è un lago-cratere sacro negli altopiani dell'odierna Colombia, il centro di culto della confederazione Muisca che governò la savana di Bogotá fino all'arrivo degli Spagnoli negli anni 1530. La cerimonia al centro della leggenda di El Dorado, l'unzione periodica di un nuovo capo con polvere d'oro prima che fosse portato a remi sul lago e la polvere venisse lavata via nell'acqua, era reale e fu praticata a Guatavita fino ai primi tempi coloniali. Il regno che la praticava, tuttavia, era già in collasso quando la prima spedizione Europea raggiunse la savana, devastato dal vaiolo e dalla crisi politica che l'arrivo delle malattie Europee produsse quasi ovunque."

 seven_cities_el_dorado.2.title: "Lavori in Oro e Memoria"
 seven_cities_el_dorado.2.desc: "Il paese che abbiamo raggiunto non è più il paese in cui visse El Dorado. I cacicchi degli altopiani sono frammentati e ridotti; la corte centrale è scomparsa; il lago non è più un luogo di cerimonie. Ma le botteghe ci sono ancora. Gli orafi lavorano ancora nell'antico stile. Un pettorale d'oro battuto raffigurante un uomo su una zattera viene acquistato da uno dei fabbri del villaggio al prezzo di un'ascia di ferro. Il cronista lo schizza due volte. Il commercio dell'oro lavorato può essere sostenuto. La corte della leggenda non può essere riconvocata."
 seven_cities_el_dorado.2.a: "Fondiamo un emporio per i lavori in oro."
 seven_cities_el_dorado.2.historical_info: "La metallurgia Muisca era tra le più sofisticate delle Americhe precolombiane, e lavorava non solo l'oro ma una lega di rame e oro chiamata tumbaga che permetteva una raffinata fusione a cera persa a basse temperature. La sopravvivenza frammentaria della tradizione Muisca nel periodo coloniale fece sì che lavori in oro autentici di tipo precedente la Conquista continuassero a essere prodotti nelle botteghe degli altopiani fino al Seicento inoltrato, talvolta per clienti tradizionali, talvolta per il mercato Spagnolo. La celebre figura Muisca della zattera, che raffigura la cerimonia di El Dorado, fu realizzata in questo periodo ed è oggi al Museo del Oro di Bogotá."

 seven_cities_el_dorado.3.title: "Il Re Dorato"
 seven_cities_el_dorado.3.desc: "Il paese che abbiamo raggiunto è il paese descritto dalla leggenda, trovato prima della sua caduta: una confederazione di cacicchi degli altopiani con una corte centrale, un lago sacro, una cerimonia annuale in cui il capo supremo viene unto con polvere d'oro nel cuore del suo territorio. La corte riceve [target_leader.GetName] con grazia formale. Il trattato offerto è un trattato di commercio, non di conquista; il capo non è disposto a essere un vassallo, ma è disposto a essere un partner. I soli lavori in oro valgono quanto è costata l'entrada. Il trattato, ben custodito, vale più di così."
 seven_cities_el_dorado.3.a: "Firmiamo. Un partner nel nuovo mondo, non una provincia conquistata."
 seven_cities_el_dorado.3.historical_info: "Il mito di El Dorado nella sua forma matura, il ricco regno dell'interno il cui sovrano viene unto ogni anno con polvere d'oro, mantenne in marcia le spedizioni nell'interno Sudamericano per due secoli e mezzo dopo che il vero centro di culto di Guatavita era stato documentato, spopolato e silenziosamente dimenticato. La persistenza del mito nell'immaginario Europeo, nonostante il costante accumularsi di prove che qualunque cosa fosse esistita un tempo non c'era più, è un esempio da manuale di ciò che gli economisti chiamano ragionamento sui costi irrecuperabili che opera attraverso generazioni di esplorazione finanziata dallo stato."

