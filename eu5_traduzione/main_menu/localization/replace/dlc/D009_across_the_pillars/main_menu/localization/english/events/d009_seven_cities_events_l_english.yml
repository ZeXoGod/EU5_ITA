 seven_cities.10.title: "Una Città Splendente in Lontananza"
 seven_cities.10.desc: "Le guide locali, quando il vino viene versato e le merci di scambio sono disposte per l'ispezione, si lasciano andare ai racconti. Sì, hanno sentito parlare del paese di cui [target_leader.GetName] chiede notizie. Sì, laggiù c'è una città, oltre la prossima sierra, forse a due settimane di cammino. Un uomo giura di aver visto da lontano il sole sorgere sulle sue mura, color dell'oro. Un altro dice che suo zio vi commerciò per una stagione e tornò ricco. Un terzo dice che è una favola e che i primi due direbbero qualsiasi cosa per una misura di acquavite. Il cronista annota tutto."
 seven_cities.10.a: "Acquavite per gli uomini con le storie migliori."
 seven_cities.10.b: "Congediamoli e mettiamoci in marcia."
 seven_cities.10.b.tt: "#italic Prendiamo congedo dai narratori e partiamo, fidandoci della pista piuttosto che di un altro giro di storie inverosimili#!"
 seven_cities.10.historical_info: "Le prime #italic entradas#! Spagnole, Francesi e Inglesi nelle Americhe si affidarono quasi interamente a informatori nativi per le informazioni geografiche. Le informazioni erano spesso plasmate da ciò che i nativi credevano che i loro interrogatori volessero sentirsi dire, da ciò che i nativi volevano che gli interrogatori facessero (spesso, andarsene) e dall'immagine congetturale con cui gli interrogatori erano arrivati. Il risultato fu un circolo vizioso cronico in cui le leggende europee di città dorate venivano convalidate da testimonianze native che erano state a loro volta calibrate sulle aspettative europee."
 natives_provide_crudely_drawn_map_tt: "#Y Gli abitanti ci forniscono una mappa grossolanamente tracciata dei territori circostanti#!"
 expedition_learns_of_potential_dangers: "#Y La [expedition|e] viene a conoscenza di potenziali pericoli locali#!"
 bonding_over_alcohol_locals_migrate_tt: "#Y Una comune passione per l'alcol e la buona conversazione crea legami fraterni#!"
 improve_root_culture_view_of_location_dominant_culture_tt: "La nostra [cultural_opinion|e] verso gli abitanti [target_location.GetDominantCulture.Custom('IT_CUL_MP')] migliorerà"
 expedition_observes_local_innovations: "#Y Le innovazioni locali vengono osservate e catalogate#!"
 expedition_receives_artifacts_as_gifts: "#Y Ci saranno offerti in dono oggetti culturali al nostro ritorno a [ROOT.GetCountry.GetCapital.GetName]#!"
 should_calamity_occur_chance_to_avoid_tt: "Le bande ostili e la fauna locale costituiranno una minaccia minore"
 may_bring_us_closer_to_uncovering_goal_tt: "Questo potrebbe avvicinarci alla scoperta di ciò che cerchiamo"
 expedition_brought_back_riches_tt: "La [expedition|e] ha riportato ricchezze:"
 expedition_brought_back_exotic_goods_tt: "I portatori e il carico della [expedition|e] hanno riportato merci esotiche:"
 expedition_brought_back_artifacts_tt: "La [expedition|e] ha riportato doni e manufatti:"
 expedition_healer_joins_court_tt: "Un guaritore indigeno si unisce alla nostra corte al ritorno della [expedition|e]"
 porters_guides_prevent_stalling: "I portatori e le guide che accompagnano la [expedition|e] le impediscono di arenarsi"
 warned_expedition_avoids_calamity_tt: "Avvertita dei pericoli locali, la [expedition|e] evita la catastrofe"

 seven_cities.11.title: "Un Banchetto di Benvenuto"
 seven_cities.11.desc: "La cittadina esce a incontrarci prima ancora che abbiamo piantato il campo: tamburi, una piazza spazzata e stuoie ricoperte di più cibo di quanto gli uomini ne abbiano visto in un mese di marcia. Il loro capo saluta [target_leader.GetName] con la grave cortesia di un pari, e il banchetto è già ben avviato prima che qualcuno pensi di fare una domanda. I nostri interpreti mormorano che un'accoglienza così calorosa non è mai davvero gratuita, e che ciò che viene offerto a un ospite in un attimo tende a essergli messo in conto nell'attimo successivo. Eppure, un ospite aperto e una tavola colma hanno sciolto più lingue di qualsiasi minaccia avremmo potuto fare."
 seven_cities.11.a: "Rispondiamo alla loro accoglienza a mani aperte, e con la borsa altrettanto."
 seven_cities.11.b: "Non abbiamo attraversato un oceano per sederci a mangiare."
 seven_cities.11.b.tt: "#italic Accettiamo il pasto ma teniamo chiusa la borsa, e ripartiamo prima che l'accoglienza diventi un obbligo#!"
 seven_cities.11.historical_info: "L'ospitalità cerimoniale occupava un posto centrale nella diplomazia di gran parte delle Americhe, e gli Europei in arrivo venivano spesso accolti da banchetti, doni e un'accoglienza formale prima ancora che iniziasse qualsiasi affare. La colonna di Coronado fu alloggiata e nutrita dai villaggi Pueblo lungo il Rio Grande, e quella di De Soto fu ricevuta dai cacicchi Mississippiani del sud-est, in ogni caso come un modo per gestire stranieri pericolosi anziché sottomettersi a loro. Gli Europei portavano perle di vetro, sonagli da falco, stoffe e coltelli espressamente destinati ad aprire tali scambi. I doni compravano buona volontà e informazioni, ma la transazione di fondo era quasi sempre compresa in modo molto diverso da ciascuna parte."
 expedition_receives_guides_and_porters: "#Y Guide e portatori si uniscono al viaggio#!"
 expedition_less_likely_to_stall_tt: "La [expedition|e] avrà meno probabilità di arenarsi"
 expedition_receives_exotic_goods: "#Y La [expedition|e] scambia beni esotici locali da portare in patria#!"

 seven_cities.12.title: "La Guida Sollecita"
 seven_cities.12.desc: "È lui a trovare noi, piuttosto che il contrario: un uomo magro, dal sorriso facile, che sembra portare con sé un po' di ogni lingua lungo la pista e giura, con la mano sul cuore, di essersi trovato con i propri occhi davanti alle porte della città dorata. Chiede soltanto un salario da guida e una modesta parte di gloria per condurci fin lì. [target_leader.GetName] lo ascolta con la diffidenza esercitata di chi ha già sentito la stessa promessa altrove, in altre valli, dalla bocca di altri uomini. La nostra gente, invece, ha già preso la sua decisione, e i suoi occhi brillano tanto quanto i suoi."
 seven_cities.12.a: "Fortuna e gloria!"
 seven_cities.12.b: "Non abbiamo alcun bisogno di piccoli profittatori!"
 seven_cities.12.b.tt: "#italic Cacciamo la guida sorridente e ci atteniamo alla pista che sappiamo leggere da soli#!"
 seven_cities.12.historical_info: "La guida più famigerata delle #italic entradas#! nordamericane fu il prigioniero delle Pianure che gli Spagnoli chiamavano El Turco, il quale parlò alla spedizione di Coronado di Quivira, un regno a nordest presumibilmente ricco d'oro. Condusse la colonna per settimane nelle Grandi Pianure e in seguito ammise, sotto interrogatorio, di averla guidata nell'erba nella speranza che gli uomini e i loro cavalli vi morissero. Quivira, quando fu infine raggiunta, si rivelò un insieme di villaggi Wichita di capanne d'erba, senza traccia d'oro, ed El Turco fu giustiziato. L'episodio era tipico: le guide avevano le proprie ragioni per scegliere dove condurre stranieri armati, e quelle ragioni raramente coincidevano con quelle della spedizione."
 expedition_uncovers_riches_in_new_waypoint: "#Y La strada della guida si rivela giusta e svela autentiche ricchezze#!"
 expedition_led_to_deathly_trap: "#Y La guida ci conduce in un'imboscata, e la [expedition|e] è perduta#!"
 guide_lied_waste_of_time: "#Y La guida ci ha fatto girare in tondo, e la sua città dorata non era che una menzogna#!"
 target_character_flogged_tt: "La guida bugiarda viene fustigata per il suo inganno"

 seven_cities.13.title: "Una Lingua Familiare"
 seven_cities.13.desc: "Da qualche parte lungo la strada, qualcosa è cambiato in [target_leader.GetName]. Dove un tempo [target_leader.GetSheHe] parlava solo della città che ci attendeva, ora parla della gente del luogo: della loro lingua, che ha imparato a metà, del tetto che gli è stato offerto, della vita tranquilla che lo attende se solo smettesse di vagare. Stamattina [target_leader.GetSheHe|U] ci ha detto senza giri di parole che la spedizione può proseguire, ma che [target_leader.GetSheHe] non andrà oltre. Alcuni uomini si perdono nella natura selvaggia, e altri, a quanto pare, ne vengono reclamati."
 seven_cities.13.a: "Allora lasciamo che [target_leader.GetHerHim] resti, e che il sogno si concluda qui."
 seven_cities.13.historical_info: "Gli Europei naufragati o catturati che avevano vissuto per anni tra i popoli indigeni erano molto ricercati dalle spedizioni successive come interpreti. Hernando de Soto ritrovò Juan Ortiz, sopravvissuto alla precedente spedizione di Narváez, che viveva tra gli Uzita della Florida da circa undici anni, e Ortiz gli fece da interprete fino alla morte durante la marcia. Gonzalo Guerrero, naufragato sulla costa dello Yucatán nel 1511, prese la strada opposta: sposò una donna di una comunità Maya, rifiutò di essere salvato e si dice sia morto in combattimento contro gli Spagnoli. Uomini simili erano veri ponti viventi tra due mondi, e la loro lealtà poteva pendere da una parte come dall'altra."

 seven_cities.14.title: "La Fonte della Giovinezza?"
 seven_cities.14.desc: "La storia ci giunge di terza mano e si gonfia a ogni racconto: da qualche parte nelle colline oltre si troverebbe una sorgente le cui acque richiudono le vecchie ferite, raddrizzano le schiene curve e restituiscono all'uomo gli anni che la marcia gli ha rubato. Gli autoctoni ne parlano con la riservatezza reverenziale che riservano ai luoghi sacri, il che prova qualcosa tanto quanto non prova nulla. Il nostro chirurgo alza gli occhi al cielo e borbotta di febbri palustri. Metà dell'accampamento sta già riempiendo le borracce."
 seven_cities.14.a: "Esploriamo la sorgente."
 seven_cities.14.b: "Non c'è tempo da perdere a sguazzare!"
 seven_cities.14.b.tt: "#italic Superiamo la sorgente leggendaria e lasciamo le sue acque ai creduloni#!"
 seven_cities.14.historical_info: "La fonte della giovinezza era una parte autentica delle credenze geografiche che gli Europei portarono con sé in America, e fu associata all'esplorazione della Florida da parte di Juan Ponce de León nel 1513. L'idea che egli avesse navigato specificamente alla ricerca di acque ringiovanenti è in gran parte un abbellimento tardivo, avanzato per primo dai suoi avversari politici, ma si appoggiava su antiche leggende del Vecchio Mondo riguardo a sorgenti curative e capaci di prolungare la vita, ampiamente credute all'epoca. Informatori autoctoni, attraverso i Caraibi e il sud-est, indirizzarono davvero gli Europei verso acque sacre e medicinali, elementi autentici del loro paesaggio rituale. La distanza tra ciò che veniva descritto e ciò che veniva cercato restava, ancora una volta, considerevole."
 spend_some_time_recovering: "#Y Gli uomini si riposano e prendono le acque per un po'#!"
 retrieve_some_rejuvenating_water: "#Y Fiaschi della favolosa acqua rigenerante vengono portati via#!"
 just_water_hole: "#Y È solo una normale pozza d'acqua...#!"

 seven_cities.15.title: "Un Bagliore nel Letto del Fiume"
 seven_cities.15.desc: "Uno degli uomini si accovaccia sulla riva del ruscello al crepuscolo, lavando la ghiaia nel suo setaccio come gli hanno insegnato gli anziani, e si rialza imprecando e ridendo allo stesso tempo: un unico granello luccicante di [target_material.GetName] preso nel limo. A monte, allora, ce ne deve essere dell'altro. Si tratta del tesoro che l'intera colonna insegue attraverso un continente, o di un semplice filone di scorie senza valore, buono soltanto a ingannare uomini avidi? Nessuno saprebbe dirlo stasera, e nessuno ci tiene davvero a chiederlo."
 seven_cities.15.a: "Che ogni uomo scenda al fiume con un setaccio."
 seven_cities.15.b: "Bah! Di sicuro è il re della pirite!"
 seven_cities.15.historical_info: "La #italic Sierra de la Plata#!, la montagna d'argento, era una voce che attirò spedizioni Spagnole e Portoghesi nel profondo del bacino del Rio de la Plata a partire dagli anni 1520, e diede il nome sia al fiume sia, infine, al paese. La voce non era infondata: indicava, per quanto vagamente, la reale ricchezza d'argento delle Ande, soprattutto la montagna di Potosí, la cui scoperta nel 1545 avrebbe rimodellato l'economia mondiale. Ma gli uomini che seguirono i primi resoconti lungo il fiume trovarono per lo più stenti e terre ostili anziché argento, e la leggendaria sierra si allontanò davanti a loro per una generazione. Un po' di metallo setacciato dal letto di un torrente era spesso l'unico segno tangibile che la storia non era pura invenzione."
 expedition_brings_back_valuable_materials: "#Y Del prezioso minerale viene estratto e portato fino al mercato di [ROOT.GetCountry.GetCapital.GetName]#!"
 study_their_technique: "#Y Padroneggiamo nuovi metodi minerari, riducendo il costo di espansione delle miniere e arricchendo i nostri giacimenti migliori#!"
 men_are_met_by_hunger_and_false_legends: "#Y Il letto del fiume non dà che fame e false speranze#!"
 expedition_outcome_severely_hindered_tt: "Perdiamo una delle nostre piste faticosamente guadagnate"
 hunt_for_precious_metals_target_mining_location_goes_cold_tt: "#italic Abbandoniamo la ricerca del metallo e proseguiamo la marcia#!"

 seven_cities.16.title: "L'Ospitalità di un Capo"
 seven_cities.16.desc: "Il villaggio è grande e ben tenuto, e il suo capo ci riceve con una cortesia guardinga che palesemente gli costa qualcosa. I suoi magazzini sono pieni e i suoi giovani conoscono ogni sentiero verso l'interno. Ha anche ogni motivo per volerci lontani entro il mattino. I nostri ufficiali guardano quei magazzini e quelle robuste schiene inattive e vedono portatori e guide a portata di mano. [target_leader.GetName] deve decidere se questo sia un luogo in cui stringere un accordo o un luogo in cui prendere ciò che ci serve e lasciare il conto a chi verrà dopo di noi."
 seven_cities.16.a: "Catturiamo il capo e facciamo marciare la sua gente sotto la minaccia delle lance."
 seven_cities.16.b: "Negoziamo dei portatori volontari e separiamoci in buoni termini."
 seven_cities.16.c: "Non disturbiamo nessuno. Leviamo il campo e proseguiamo."
 seven_cities.16.c.tt: "#italic Lasciamo in pace il capo e proseguiamo la marcia, senza prendere né ostaggi né portatori#!"
 the_captive_chief_yields_guides: "#Y Il capo prigioniero ci fornisce guide che conoscono i sentieri dell'interno#!"
 the_chiefs_hall_is_plundered: "#Y La sala del capo viene spogliata dei suoi ornamenti prima della nostra partenza#!"
 the_village_empties_before_us: "#Y Il villaggio si dissolve nella foresta durante la notte, guide comprese#!"
 coerced_locals_resent_us_tt: "La nostra [cultural_opinion|e] verso gli abitanti [target_location.GetDominantCulture.Custom('IT_CUL_MP')] peggiorerà"
 seven_cities.16.historical_info: "Il metodo abituale di Hernando de Soto per attraversare il sud-est era catturare il #italic cacique#! locale, o capo supremo, all'arrivo e tenerlo in ostaggio per garantire cibo, portatori e guide per la tappa successiva della marcia. Il signore prigioniero veniva rilasciato o scambiato al confine del suo territorio con il capo vicino, e il processo si ripeteva. La tattica funzionò nel breve periodo e lasciò dietro la colonna una scia di cacicchi distrutti, alleanze infrante e odio duraturo. Dipendeva inoltre dalla struttura Mississippiana di potenti capi individuali, e fallì clamorosamente ovunque l'autorità fosse più diffusa."

 seven_cities.17.title: "Notizie dalla Riva"
 seven_cities.17.desc: "La gente della riva ci viene incontro in canoa prima ancora che l'ancora abbia toccato il fondo, e già nel pomeriggio ci scambia pesce e frutta fresca, e scambia parole ancora più in fretta. Hanno chiaramente già fatto questo. Per un coltello o un pezzo di stoffa, ci diranno che cosa si trova oltre il limitare degli alberi, e lo raccontano con premura, indicando sempre l'entroterra e ancora più in là. Dalla spiaggia è impossibile sapere se ci indicano la verità o semplicemente i loro vicini."
 seven_cities.17.a: "Scambiamo merci in cambio di notizie sull'entroterra."
 seven_cities.17.b: "Annotiamo l'ancoraggio e riprendiamo la marcia."
 seven_cities.17.b.tt: "#italic Annotiamo l'ancoraggio sulle nostre carte e riprendiamo la marcia senza mercanteggiare per delle voci#!"
 the_shore_folk_point_the_way: "#Y La gente della riva ci indica una via chiara verso ciò che cerchiamo#!"
 the_shore_market_yields_goods: "#Y Un vivace commercio sulla sabbia riempie le nostre stive di merci locali#!"
 the_shore_folk_send_us_at_their_rivals: "#Y Le loro indicazioni ci fanno girare in tondo verso qualche villaggio rivale#!"
 may_bring_us_closer_and_fill_our_holds_tt: "Questo potrebbe avvicinarci a ciò che cerchiamo e riempire le nostre stive di merci locali"
 seven_cities.17.historical_info: "I popoli costieri furono generalmente i primi Americani che qualsiasi spedizione incontrava, e divennero la sua prima fonte di informazioni su tutto ciò che si trovava nell'entroterra. I contatti di Verrazzano e di Cartier lungo la costa dell'Atlantico settentrionale, i primi sbarchi Spagnoli nei Caraibi e gli incontri Portoghesi sul litorale Brasiliano seguirono tutti lo stesso schema: commercio diffidente, ispezione reciproca e diffusione di voci geografiche dalla costa verso l'interno. Le comunità costiere incoraggiavano spesso gli stranieri a spingersi oltre verso ciò che si trovava più in là, sia per liberarsene sia per deviare le loro pretese verso i rivali. Ciò che la costa riferiva sull'entroterra era dunque filtrato dagli interessi stessi della costa molto prima di giungere a un orecchio europeo."

 seven_cities.18.title: "Un Rifugio Sicuro"
 seven_cities.18.desc: "Il porto è tutto ciò che una spedizione sfinita potesse sperare. È profondo e ben riparato, con acqua dolce che scende verso una spiaggia abbastanza ampia da carenare le navi e raschiare il marciume dagli scafi. Gli equipaggi hanno bisogno di riposo quanto le ossature di riparazioni. Ma una flotta arenata su una spiaggia è una flotta che non va da nessuna parte, e uomini oziosi in terra straniera hanno un certo talento nel cacciarsi nei guai. [target_leader.GetName] soppesa i giorni che un riassetto adeguato costerà contro lo stato delle navi e l'umore degli equipaggi."
 seven_cities.18.a: "Carenare gli scafi e rifornirsi a dovere."
 seven_cities.18.b: "Riposare una sola notte e riprendere il mare."
 seven_cities.18.b.tt: "#italic Concediamo agli equipaggi una sola notte a terra e riprendiamo il mare prima che le navi mettano radici#!"
 the_refit_goes_smoothly: "#Y Il riassetto procede senza intoppi, e le navi ne rispondono solo meglio#!"
 a_wreck_yields_salvage: "#Y Gli equipaggi spogliano di tutto ciò che vale un relitto che marcisce nei bassifondi#!"
 the_crew_falls_to_brawling: "#Y Oziosi a terra, gli equipaggi vengono alle mani, e giorni vanno persi a ristabilire l'ordine#!"
 seven_cities.18.historical_info: "Un porto riparato era indispensabile a ogni spedizione che viaggiasse in parte per mare, offrendole un luogo dove carenare e riparare gli scafi, imbarcare acqua dolce e legna da ardere, e far riposare equipaggi logorati dalla traversata. La flotta di Magellano svernò cinque mesi a Puerto San Julián, sulla costa della Patagonia, dove quella sosta forzata provocò anche un ammutinamento che egli represse con grande violenza. Gli esploratori trascorrevano spesso più tempo a rifornirsi in tali ancoraggi che a navigare, e un buon porto, con una popolazione locale amichevole o indifferente, poteva decidere se una spedizione sarebbe proseguita o si sarebbe disgregata. La scelta del luogo in cui sostare era spesso tanto gravida di conseguenze quanto quella della destinazione."

 seven_cities.20.title: "La Terra Non Ci Nutrirà"
 seven_cities.20.desc: "Il paese che attraversiamo è più arido e più desolato di quanto i rapporti lasciassero credere. Le bestie da soma cominciano a indebolirsi. Gli uomini sono a mezza razione da dieci giorni. I villaggi locali hanno nascosto le loro scorte o le hanno bruciate. C'è acqua dolce solo in due valli su sei di quelle che attraversiamo. [target_leader.GetName] riunisce gli ufficiali al riparo di un cespuglio spinoso e chiede fino a quando potranno ancora resistere senza rifornimenti."
 seven_cities.20.a: "Acquistiamo viveri a qualsiasi prezzo."
 seven_cities.20.b: "Facciamo una sosta e lasciamo riposare gli uomini."
 seven_cities.20.historical_info: "Il rifornimento fu il vincolo cronico dell'esplorazione dell'entroterra nelle Americhe. L'esercito di Cortés fu nutrito in gran parte grazie al crollo politico dell'autorità Azteca che permise ai Tlaxcalteca e ad altri alleati di rifornirlo. La colonna di Coronado nel sud-ovest non aveva un sostegno equivalente e morì di fame a poco a poco mentre avanzava verso nord. Lo schema si ripeté dalla Florida alla Patagonia: un'#italic entrada#! che non potesse acquistare o sequestrare cibo dalla terra che attraversava si dissolveva lungo la pista, a prescindere da quale oro si trovasse oltre."

 seven_cities.21.title: "Imboscata nel Canyon"
 seven_cities.21.desc: "La truppa si è inoltrata in una gola stretta tra due pareti calcaree, e gli indigeni hanno richiuso la strada alle sue spalle. Frecce piovono dall'alto; guerrieri armati di mazze di pietra attendono sul fondo del canyon; il convoglio delle bestie da soma si disperde. Gli uomini fanno ciò che gli uomini hanno sempre fatto in questa situazione: formano un riccio e appoggiano le spalle alla roccia. [target_leader.GetName] si consulta con i sergenti. Occorre scegliere tra forzare il passaggio del canyon al prezzo di perdite, o tornare sui nostri passi e cercare un'altra strada."
 seven_cities.21.a: "Forziamo il canyon con l'acciaio e il piombo."
 seven_cities.21.b: "Ritiriamoci e cerchiamo un'altra strada."
 seven_cities.21.historical_info: "La guerra d'imboscata dei nativi in terreno difendibile, canyon stretti, passi montani, sentieri nella foresta, fu la forma di resistenza più efficace alle prime #italic entradas#! coloniali. L'armatura, le armi da fuoco e i cavalli Spagnoli offrivano un vantaggio decisivo in campo aperto, ma venivano sistematicamente annullati in terreno chiuso. Circa la metà delle marce di Coronado nel sud-ovest furono deviazioni forzate attorno a territori che la sua colonna non poteva attraversare in sicurezza, e lo stesso schema produsse la lunga serie di incursioni Francesi e Inglesi fallite nell'interno del Nord America prima del Settecento."

 seven_cities.22.title: "Una Rovina Antica"
 seven_cities.22.desc: "Il sentiero supera una cresta e si affaccia su quella che un tempo fu una città. Le mura sono di pietra, i tetti quasi tutti crollati, le strade soffocate dagli alberi di un secolo. Non c'è nessuno. Nessuno viene qui da molto tempo. Gli esploratori fanno il giro del perimetro a rispettosa distanza, il cronista lavora a uno schizzo, e il sacerdote esita a entrare, poiché si dice che le città morte facciano ammalare chi le profana. [target_leader.GetName] concede un'ora al disegnatore."
 seven_cities.22.a: "Catalogare la rovina prima di rimetterci in marcia."
 seven_cities.22.historical_info: "L'America precolombiana era affollata di insediamenti abbandonati: centri a tumuli Mississippiani nel sud-est, grandi case Pueblo nel sud-ovest, la stessa Chaco, il bacino di Tiwanaku nelle Ande, le città Maya dello Yucatán meridionale. Gli esploratori Europei del Cinquecento che percorrevano questi paesaggi si imbattevano di continuo in opere in pietra, terrazzamenti agricoli e centri cerimoniali abbandonati da un secolo o più. La persistente teoria europea secondo cui queste rovine dovevano essere opera di una popolazione scomparsa europea o mediterranea (Gallese, Fenici, le Tribù Perdute d'Israele), era già in circolazione negli anni 1540 e sarebbe sopravvissuta in alcuni ambienti fino al Novecento."

 seven_cities.30.title: "La Pista si Perde"
 seven_cities.30.desc: "La colonna ha raggiunto il punto di ritrovo che le guide descrivevano come la porta del paese che eravamo stati inviati a scoprire. Non c'è nessuna porta. Le guide hanno mentito, oppure hanno mentito a se stesse; l'esplorazione delle colline circostanti non rivela alcuna città, alcun fumo, alcuna strada, alcun segno che qualcuno sia mai venuto qui a memoria d'uomo. [target_leader.GetName] scrive alla corona per chiedere istruzioni, poi accartoccia la lettera, perché quando essa raggiungerà un porto la colonna avrà già preso la propria decisione. Ci si offrono due possibilità: proseguire comunque nel paese, nel caso la città si trovi una valle più in là; oppure tornare indietro e rientrare con ciò che abbiamo raccolto."
 seven_cities.30.a: "Proseguiamo comunque verso la città."
 seven_cities.30.b: "Torniamo sui nostri passi e facciamo un resoconto onesto."
 seven_cities.30.historical_info: "Lo schema tipico delle #italic entradas#! fallite non era il massacro spettacolare, ma il lento esaurirsi: una colonna a corto di rifornimenti, che perdeva esploratori per malattia e diserzione, scoprendo che ogni punto di riferimento promesso era un malinteso o una menzogna, finché gli ufficiali superstiti facevano voltare gli uomini e tornavano a casa a piedi attraverso un territorio che ormai sapevano essere vuoto. La spedizione di Coronado, quella di Cabrillo, quella di De Soto, quella di Aguirre lungo il Rio delle Amazzoni, seguirono tutte questa curva in un grado o nell'altro. Le #italic entradas#! riuscite di ambizione equivalente erano abbastanza rare da essere ricordate per secoli."
