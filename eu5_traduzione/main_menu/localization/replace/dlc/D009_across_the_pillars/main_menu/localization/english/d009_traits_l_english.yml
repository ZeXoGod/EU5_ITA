l_english:
 court_favorite: "Favorito di Corte"
 desc_court_favorite: "Questo individuo deve rango e fortuna esclusivamente alla nostra autorità, e si adopera per porre sempre più potere nelle nostre mani. Se il [cabinet_member|e] con questo [trait|e] diventa il nostro [head_of_the_cabinet|e], il nostro paese beneficia di [GetAutoModifier('court_favorite_head_of_cabinet').GetName]."
 court_favorite_die_desc: "[CHARACTER.GetSheHe|U] doveva rango e fortuna al solo nostro favore, e lo ripagò con una lealtà incrollabile. I ceti verseranno poche lacrime alla notizia."
