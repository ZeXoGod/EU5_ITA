 golden_century_events.40.title: "La Rivolta dei Ceti"
 golden_century_events.40.desc.desc_spa: "I ceti privilegiati [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] si sono sollevati contro di noi come un sol uomo. I nostri recenti tentativi di accumulare più autorità a loro spese non sono passati inosservati. I grandi, i prelati e i mercanti delle città con statuto protestano allo stesso modo che abbiamo concentrato troppo potere nelle nostre mani, e innalzano le loro bandiere e radunano i loro seguiti per costringerci a cedere."
 golden_century_events.40.desc.desc_adu: "Le grandi casate [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] hanno fatto causa comune contro di noi. Da quando ricordiamo non avevamo mai visto un rifiuto di obbedire così sfrontato da parte di coloro che noi stessi abbiamo elevato al privilegio. È insolenza e arroganza, nient'altro. Ogni piccolo signore, mercante e chierico brama ora l'autorità che è nostra di diritto, e questo non sarà tollerato!"
 golden_century_events.40.desc.historical_info_spa: "Le ambizioni centralizzatrici della corona Spagnola incontrarono una feroce resistenza da parte dei privilegiati. La Rivolta dei Comuneros del 1520-1521 vide le città di Castiglia sollevarsi contro Carlo V, e i grandi e le Cortes difesero a lungo le proprie libertà dalla portata del trono."
 golden_century_events.40.desc.historical_info_adu: "L'autorità centrale in al-'Andalus fu sempre contesa dalle sue grandi famiglie e dai signori provinciali. Le guerre civili della #italic fitna#! frantumarono il Califfato di Cordova dopo il 1009, e governatori ambiziosi si staccarono ripetutamente dal centro per governare a proprio piacimento."
 golden_century_events.40.a: "Dimenticano chi servono!"
 X_provinces_may_rise_in_revolt_tt: "#Y [ROOT.GetVariable('golden_century_events_40_display_prov_rebel_variable').GetValue|V0]#! [provinces|e] si uniranno ai [target_rebel.GetName], e ogni pop delle classi alte al loro interno si rivolterà contro di noi"
 rebellion_gains_traction_tt: "La rivolta prende slancio"
 destabilization_spreads_tt: "L'agitazione si diffonde"
 central_authority_takes_hit: "La nostra autorità è scossa"
 central_authority_tested: "La nostra autorità è messa alla prova"
