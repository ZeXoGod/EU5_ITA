 gc_surge_of_luxury_goods: "$golden_century_events.43.title$"
 saharan_trade_house_desc: "Un grande nodo del commercio transahariano, con magazzini colmi di oro, sale e tessuti. Istituita in una [urban_location|e], domina le rotte delle carovane e trasforma il commercio del deserto in un torrente di ricchezza."
 can_only_be_built_via_saharan_trade_house_action_tt: "Può essere istituita solo tramite l'[action|e] [ShowGenericActionName('adu_charter_saharan_trade_house')] durante la [situation|e] [GetSituationByKey('golden_century').GetName]"

 RECONQUER_IBERIA_WAR_NAME: "Riconquista dell'Iberia"

 golden_century_events.30.title: "Il Secolo Disfatto"
 golden_century_events.30.desc: "Il secolo d'oro che ci eravamo prefissi di costruire giace in rovina. Un quarto delle terre che tenevamo alla sua alba è sfuggito alla nostra presa, strappato dalle stesse potenze che la nostra ascesa aveva suscitato, e sotto [target_ruler.GetName] [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] non può più rivendicare il dominio che un tempo deteneva.\n\nL'epoca ricorderà la nostra ascesa, e ricorderà la nostra caduta. Resta da raccogliere la forza che ancora possediamo e sopportare gli anni che seguono."
 golden_century_events.30.a: "Così finisce la nostra età dell'oro."

 golden_century_events.31.title: "Il Colosso Spezzato"
 golden_century_events.31.desc: "Il Colosso che un tempo incombeva sull'epoca, [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName], ha subito l'umiliazione e la perdita di un quarto del proprio reame. Ciò che sovrastava [ShowContinentName('europe')] e i mari oltre è finalmente spezzato, e l'equilibrio dell'epoca si inclina di nuovo."
 golden_century_events.31.desc.destroyed: "Il Colosso che un tempo incombeva sull'epoca è stato cancellato del tutto dalla mappa. La potenza che sovrastava [ShowContinentName('europe')] e i mari oltre è abbattuta, e le sue terre sono spartite tra coloro che un tempo intimidiva. L'equilibrio dell'epoca si inclina di nuovo."
 golden_century_events.31.a: "L'opera della coalizione è compiuta."
 golden_century_events.31.b: "L'epoca cambia."
 gc_ending_defeat_member_tt: "Avendo fatto parte della coalizione contro [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName], possiamo ora fabbricare il [ShowCasusBelliName('cb_reconquer_iberia')] per impadronirci delle terre di [ShowRegionName('iberia_region')] a costo ridotto, e il più potente tra noi assume il mantello di Spezzatore di $iberia_region$"

 golden_century_events.33.title: "Un Secolo d'Oro"
 golden_century_events.33.desc: "Sono passati cent'anni dall'inizio della nostra ascesa, e ne usciamo senza essere stati spezzati. Ogni rivale sorto contro di noi è stato sopravvissuto, ogni coalizione affrontata, e sotto [target_ruler.GetName] [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] ha goduto di un'età dell'oro di cui si parlerà per secoli.\n\nCiò che abbiamo conquistato in [ShowContinentName('europe')] e oltre l'oceano è ora nostro, intessuto così profondamente nel tessuto del nostro reame che nessuna inversione potrà disfarlo del tutto."
 golden_century_events.33.a: "Il nostro secolo è vinto."

 golden_century_events.34.title: "Il Colosso Resiste"
 golden_century_events.34.desc: "[gc_hegemon.Custom('IT_La')|U][gc_hegemon.GetName] ha attraversato l'intero secolo senza crollare, e la sua età dell'oro passa alla storia con il suo predominio intatto. Il segno che lascia su [ShowContinentName('europe')] e sul mondo intero sopravvivrà a tutti noi."
 golden_century_events.34.a: "Non abbiamo potuto spezzarlo."
 golden_century_events.34.b: "Così l'epoca è ricordata."

 golden_century_events.54.title: "La Grande Alleanza Umiliata"
 golden_century_events.54.desc: "La coalizione levata per contenerci è stata battuta in guerra aperta, e i suoi membri contano ora il costo della loro presunzione. Coloro che hanno marciato contro di noi hanno abbandonato la loro grande lega, preferendo la sopravvivenza separata alla sconfitta condivisa.\n\nLe nostre armi sono riabilitate davanti a ogni corte di [ShowContinentName('europe')]. I principi che sussurravano che la nostra ascesa potesse essere fermata devono ora parlarne con un altro tono."
 golden_century_events.54.a: "Che si disperdano."
 gc_ga_humbled_tt: "Sconfiggere la Grande Alleanza in guerra aumenta il nostro [gc_european_dominance|e] di #Y 10#! e i suoi membri sconfitti abbandonano la [international_organization|e]"
 gc_salamanca_embrace_tt: "Molti [pops|e] dei nostri centri del sapere che non seguono la nostra [religion|e] o [culture|e] le abbracceranno"
