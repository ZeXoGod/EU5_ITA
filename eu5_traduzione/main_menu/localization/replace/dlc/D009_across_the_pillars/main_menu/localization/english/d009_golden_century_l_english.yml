 golden_century: "Secolo d'Oro"
 golden_century_info: "Il vincitore della [GetSituationByKey('battle_for_the_strait').GetName] si è eretto a dominatore dell'epoca. Per cent'anni fa sentire il proprio predominio su [ShowContinentName('europe')] e sul Nuovo Mondo, mentre i regni che sovrasta cercano ogni via per riportarlo alla loro misura."
 golden_century_desc: "La [GetSituationByKey('battle_for_the_strait').GetName] è conclusa e da essa è sorto un unico Colosso, più potente di qualunque rivale rimasto in piedi. Il secolo che si apre sarà definito dalla portata di quella potenza, sulle corti e sui campi di battaglia di [ShowContinentName('europe')] come sui commerci e sulle colonie del mondo intero.\n\nUna simile supremazia non è mai sopportata volentieri. Più il Colosso cresce, più grande è il timore che suscita, finché gli spaventati e gli ambiziosi fanno causa comune in una Grande Alleanza giurata per contenerlo. Se questo secolo d'oro si chiuderà con una monarchia universale o con il Colosso abbattuto dipenderà da quanto a lungo quel predominio potrà essere spinto prima che l'equilibrio dell'epoca ceda."

 golden_century_colossus_endures: "Il Colosso Resiste"
 golden_century_colossus_endures_desc: "Il Colosso conserva il proprio secolo. Ottiene [ShowModifier('gc_european_triumph_modifier')] e [ShowModifier('gc_colonial_triumph_modifier')], ciascuno proporzionato a quanto si è davvero spinta la sua portata. Dove tale portata non ha incontrato alcuna opposizione, viene incoronato con [ShowModifier('hegemon_of_europe_modifier')] o [ShowModifier('hegemon_of_new_world_modifier')]."
 golden_century_colossus_destroyed: "Il Colosso Cade"
 golden_century_colossus_destroyed_desc: "Con la scomparsa del Colosso stesso, nessun trionfo o penalità passa a nessuno: l'epoca perde semplicemente la potenza che la definiva."
 golden_century_colossus_diminished: "Il Colosso Ridimensionato"
 golden_century_colossus_diminished_desc: "Il Colosso sopravvive, ma subisce un duro colpo alla propria [stability|e] per essere stato ridimensionato."

 golden_century_lost_quarter_starting_locations_tt: "Il [country|e] protagonista di questa [situation|e] ha perso un quarto delle proprie [locations|e] iniziali"
 as_long_as_the_golden_century_is_active_desc: "finché la [situation|e] $golden_century$ rimane attiva"
