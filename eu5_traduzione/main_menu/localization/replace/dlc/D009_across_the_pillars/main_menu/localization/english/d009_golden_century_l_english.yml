 gc_flashpoint_meter: "Progresso del Punto Critico"
 gc_flashpoint_meter_desc: "Le pressioni che si accumulano sotto il nostro secolo d'oro, alimentate tanto dalla forza dell'autorità e dalla nostra posizione all'estero quanto dal peso dei debiti e dallo svilimento della nostra moneta. Quando questi fattori raggiungono il culmine, segue un [flashpoint|e], un momento decisivo che può esaltare il nostro reame o scuoterlo nel profondo."
