 ga_will_declare_war_on_target_tt: "La [GetInternationalOrganizationType('grand_alliance').GetName] dichiarerà guerra al suo bersaglio"
 ga_alliance_strength_advantage: "Gli eserciti dell'alleanza a confronto con il Colosso"
 ga_alliance_economic_advantage: "La ricchezza dell'alleanza a confronto con il Colosso"
 ga_dominance_pressure: "L'altezza del predominio del Colosso"
 diplomatic_status_grand_alliance_name: "Grande Alleanza"
 diplomatic_status_grand_alliance_tooltip: "#T Grande Alleanza#!\nQuesto paese fa parte della [GetInternationalOrganizationType('grand_alliance').GetName] schierata contro questi [countries|e]."
 grand_alliance_list_who_tt: "$WHO$ si schiera insieme a $LIST$ nella [GetInternationalOrganizationType('grand_alliance').GetName]"
 grand_alliance_leader: "Leader della $grand_alliance$"
 grand_alliance_leader_desc: "Il membro più potente della $grand_alliance$, rivalutato ogni anno. La leadership può passare a un altro membro al mutare delle fortune."

 spa_increase_capital_market_demands: "Aumenta la Domanda del Mercato della Capitale"
 spa_increase_capital_market_demands_desc: "La ricchezza della nostra epoca ha fatto della nostra capitale l'invidia del mondo. Scegli un bene commerciato nel suo mercato e proclamalo moda della corte, alimentando un'ondata di domanda che arricchirà ogni mercante che lo porti alle nostre coste."
 gc_increase_market_demand_select_good: "Scegli un Bene da Favorire"
 gc_increase_market_demand_no_good: "@trigger_no!Nessun bene adatto è commerciato nel mercato della nostra [capital|e]"
 gc_increase_market_demand_tt: "Sceglieremo un bene commerciato nel mercato della nostra [capital|e] e vi alimenteremo un'ondata duratura di domanda. La domanda aggiuntiva è proporzionale alla popolazione della nostra [capital] e dura #Y 10#! anni, e nessun altro mercato è toccato, così il prezzo del bene sale a profitto di chiunque lo porti alle nostre coste"

 golden_century_events.22.title: "La Moda della Corte"
 golden_century_events.22.desc: "Le ricchezze di un'età dell'oro hanno gonfiato gli appetiti di [ROOT.GetCountry.GetCapital.GetName]. I suoi nobili, i suoi prelati e i suoi ricchi borghesi gareggiano tra loro in sfarzo, e i loro agenti setacciano i mercati in cerca di [target_good.GetName] per adornare le loro sale e le loro tavole.\n\nSotto [target_ruler.GetName] possiamo assecondare questa fame e proclamare [target_good.GetNameWithNoTooltip] moda della corte, così che la domanda nella nostra capitale si gonfi ben oltre quanto il nostro popolo richiederebbe mai. Ogni mercante che lo porti alle nostre coste ne trarrà profitto, e grazie ai nostri dazi e ai nostri commerci ne trarremo profitto anche noi."
 golden_century_events.22.a: "Che la corte detti la moda."
 gc_increase_market_demand_result_tt: "La domanda di [target_good.GetName] nel mercato di [ROOT.GetCountry.GetCapital.GetName] aumenta per i prossimi #Y 10#! anni, facendone salire il prezzo a profitto di chiunque lo venda"

 adu_charter_saharan_trade_house: "Istituisci una Casa Commerciale Sahariana"
 adu_charter_saharan_trade_house_desc: "Le vie dell'oro del Sahara sono la linfa vitale della nostra prosperità. Scegli una [urban_location|e] del nostro reame e istituiscivi una grande Casa Commerciale Sahariana, un nodo di carovane e monete che attirerà nelle nostre mani la ricchezza del commercio del deserto."
 adu_charter_saharan_trade_house_select_market: "Scegli una [urban_location|e]"
 adu_charter_saharan_trade_house_no_market: "@trigger_no!Non possediamo alcuna [urban_location|e] adatta a ospitare una Casa Commerciale Sahariana"
 adu_charter_saharan_trade_house_tt: "Istituiremo un [ShowBuildingTypeName('saharan_trade_house')] nella [urban_location|e] scelta, un potente nodo del commercio carovaniero"

 golden_century_events.23.title: "[ShowBuildingTypeNameWithNoTooltip('saharan_trade_house')]"
 golden_century_events.23.desc: "Dove si incontrano le vie delle carovane, il denaro cambia di mano e si fanno fortune in [ShowGoodsName('salt')], [ShowGoodsName('goods_gold')] e [ShowGoodsName('cloth')]. A [target.GetName] innalzeremo una grande casa commerciale per dominare quel commercio, con magazzini e banchi di conto che attireranno la ricchezza delle rotte del deserto nei forzieri [actor.Custom('IT_Della')][actor.GetName].\n\nMercanti da tutto il [ShowRegionName('sahel_region')] e dal [ShowRegionName('maghreb_region')] si riuniranno sotto il suo tetto, e attraverso di essa le ricchezze di due sponde affluiranno a nostro vantaggio."
 golden_century_events.23.a: "Vengano le carovane."

 golden_century_events.17.title: "Gli Ordini nel [ShowSituationNameWithNoTooltip('golden_century')]"
 golden_century_events.17.desc: "Il nostro secolo è arrivato, e non assomiglia molto a quello per cui furono costruiti gli ordini militari.\n\nIl lavoro dell'epoca è in [ShowAreaName('flanders_area')], a [ShowLocationName('milano')] e oltre l'oceano: flotte, banche e #italic tercios#! pagati in argento. Gli ordini possiedono castelli rivolti a una frontiera che non esiste più a memoria d'uomo, e i loro fratelli, che sono ancora la migliore cavalleria pesante del mondo [ShowReligionAdjective('catholic')], passano le stagioni a riscuotere rendite e a disputare sulla precedenza.\n\nSono una risorsa che [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] [ROOT.GetCountry.Custom('IT_CROWN_HA')] smesso di usare."
 golden_century_events.17.a: "Diamo loro il lavoro [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 golden_century_events.17.b: "Mandiamoli in una comoda pensione."
 golden_century_events.17.c: "Lasciamoli alle loro rendite."
 gc_orders_given_new_purpose_tt: "$bfts_orders_given_new_purpose_tt$"

 golden_century_events.18.title: "Lance Inattive"
 golden_century_events.18.desc: "Due commende sono venute alle mani per un confine, un mulino e un'offesa vecchia di duecento anni, e la faccenda si è aggravata più di quanto chiunque volesse. Ci sono morti da entrambe le parti ed entrambi i Maestri ci hanno scritto per primi, ciascuno certo di essere nel giusto.\n\nÈ ciò che fa un ordine militare quando non c'è guerra. I fratelli sono ancora armati, ancora esenti dai tribunali ordinari, e ancora responsabili solo davanti a noi in tutto [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 golden_century_events.18.a: "Disciplinamoli entrambi, pubblicamente."
 golden_century_events.18.b: "Lasciamo che se la vedano tra loro."

 golden_century_events.19.title: "Gli Ordini Oltremare"
 golden_century_events.19.desc: "È giunta una petizione dai Maestri, ed è ambiziosa. Vogliono fondare commende nelle Indie, svolgervi lo stesso lavoro che un tempo svolgevano sulla frontiera Moresca, e tenere le nuove marche come tenevano le vecchie.\n\nÈ o la salvezza di un'istituzione che ha esaurito la propria frontiera, o l'esportazione di un problema che non abbiamo risolto in patria."
 golden_century_events.19.desc_expected: "Abbiamo detto loro di guardare all'oceano, ed essi l'hanno fatto. I Maestri hanno accolto l'istruzione con più entusiasmo di quanto forse intendessimo.\n\nHanno cappellani a bordo delle flotte, fratelli nei porti, e ora una petizione formale per commende nelle Indie, redatta da avvocati che chiaramente ci lavorano da tempo. Gli ordini hanno trovato la loro nuova frontiera nel momento in cui ne abbiamo indicata una."
 golden_century_events.19.a: "Istituiamoli per le Indie."
 golden_century_events.19.b: "Le Indie spettano [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], non [GetUniqueInternationalOrganization('catholic_church').Custom('IT_IO_AL')][GetUniqueInternationalOrganization('catholic_church').GetNameWithNoTooltip]."

 golden_century_events.24.title: "Presenza in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.24.desc.desc_spa: "Per troppo tempo le corti al di là dei Pirenei hanno deciso gli affari di [ShowContinentName('europe')] come se a sud di esse non giacesse nulla di rilevante. Stanno imparando di meglio. I nostri inviati, un tempo lasciati ad attendere nelle anticamere, trovano ora le porte aperte e i sedili imbottiti, e sotto [target_ruler.GetName] i matrimoni e i trattati [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sono studiati in ogni cancelleria che conosca il proprio mestiere.\n\nNon siamo ancora temuti, e appena corteggiati, ma non siamo più ignorati, ed è così che comincia ogni grande potenza. Che i vecchi troni godano della loro precedenza finché dura."
 golden_century_events.24.desc.desc_adu: "I principi [ShowReligionGroupAdjective('christian')] ci avevano da tempo iscritti nelle loro cronache come un capitolo concluso. Eppure ecco i loro inviati alle porte di [ROOT.GetCountry.GetCapital.GetName], con doni e complimenti accurati, improvvisamente curiosi di sapere cosa intenda [target_ruler.GetName]. Una potenza che avevano sepolto continua a interrompere il funerale.\n\nNon deteniamo ancora il dominio, solo un posto riconquistato a un tavolo che un tempo presiedevamo. Ma i fedeli sono tornati nei calcoli di [ShowContinentName('europe')], e stavolta non intendiamo lasciarli."
 golden_century_events.24.desc.historical_info_spa: "L'unione di Castiglia e Aragona si annunciò all'Europa meno con le armi che con le nozze. Ferdinando e Isabella sposarono i loro figli con Portogallo, Borgogna Asburgica e Inghilterra Tudor in poco più di un decennio, e i doppi matrimoni del 1496 e del 1497 legarono la Spagna alla trama dinastica di mezzo continente. Molto prima che i #italic tercios#! fossero temuti, le cancellerie d'Europa avevano imparato a contare le corone Spagnole in ogni calcolo."
 golden_century_events.24.desc.historical_info_adu: "Sotto 'Abd al-Raḥmān II nel IX secolo, l'Emirato di Cordova entrò nel computo delle grandi potenze. L'imperatore Bizantino Teofilo inviò un'ambasciata in cerca della sua amicizia contro gli Abbasidi nell'840, e la corte di Cordova rispose allo stesso modo, scambiando inviati e doni con imperi che un tempo avevano liquidato al-'Andalus come una provincia ribelle lontana."
 golden_century_events.24.a: "Siamo arrivati."
 as_long_as_we_remain_at_25_european_dominance_rising_iberian_power_modifier_tt: "Finché rimarremo a #Y 25#! di [gc_european_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('rising_iberian_power_modifier')]"
 as_long_as_we_remain_at_25_european_dominance_restoration_of_al_andalus_modifier_tt: "Finché rimarremo a #Y 25#! di [gc_european_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('restoration_of_al_andalus_modifier')]"
 enables_edict_of_expulsion_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('spa_edict_expulsion')], con cui una fede che non tolleriamo viene cacciata dalle nostre terre"
 enables_restore_caliphate_cb_taifa_tt: "Sblocca il [casus_belli|e] [ShowCasusBelliName('cb_restore_ummayad_caliphate')] e il tipo di [subject|e] Ṭā'ifa"

 golden_century_events.25.title: "Presenza Oltre l'Orizzonte"
 golden_century_events.25.desc.desc_spa: "Le prime navi sono tornate a casa immerse nell'acqua per il carico, e [ROOT.GetCountry.GetCapital.GetName] ha scoperto un nuovo appetito. Zucchero, coloranti e cose più strane passano sui banchi di conto, ogni vela di ritorno è accolta sulla banchina da uomini con contratti in mano, e sotto [target_ruler.GetName] [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] trae vera ricchezza da coste che la maggior parte dei nostri sudditi non saprebbe indicare su una mappa.\n\nÈ un rivolo a confronto di ciò che potrebbe diventare. Ma i mercanti fiutano una marea che gira prima di qualunque ammiraglio, e stanno già costruendo magazzini più grandi."
 golden_century_events.25.desc.desc_adu: "Le carovane tornano a nord. Attraverso le sabbie le antiche vie si sono riaperte, e con esse viene l'oro del [ShowRegionName('sahel_region')], con il sale che passa a sud in cambio, e i mercati [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] si fanno rumorosi per gli affari del commercio del deserto.\n\nI nostri padri conobbero questa ricchezza e se la lasciarono sfuggire tra le dita. Sotto [target_ruler.GetName] intendiamo tenerla: i pozzi presidiati, le rotte sorvegliate, e ogni oncia d'oro che attraversa il deserto a pagare il dovuto nei nostri mercati prima di andare altrove."
 golden_century_events.25.desc.historical_info_spa: "Entro un decennio dall'approdo di Colombo, la corona Spagnola si mosse per fare dell'oceano una questione amministrativa. La Casa de Contratación, fondata a Siviglia nel 1503, autorizzava ogni nave, registrava ogni carico e tassava ogni ritorno dalle Indie, trasformando imprese sparse in un'impresa reale quasi prima che le colonie stesse valessero qualcosa."
 golden_century_events.25.desc.historical_info_adu: "La ricchezza del Sudan occidentale raggiungeva il Mediterraneo attraverso porti del deserto come Sijilmasa, dove le carovane del commercio transahariano venivano equipaggiate e tassate. Quando gli Almoravidi presero Sijilmasa e Awdaghust a metà dell'XI secolo, controllarono entrambe le estremità della via dell'oro occidentale, e il metallo del Sahel fluì a nord sotto un'unica potenza."
 golden_century_events.25.a: "La fortuna giace oltre l'orizzonte."
 as_long_as_we_remain_at_25_colonial_dominance_market_dominance_modifier_tt: "Finché rimarremo a #Y 25#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('market_dominance_modifier')]"
 as_long_as_we_remain_at_25_colonial_dominance_wealth_sahel_modifier_tt: "Finché rimarremo a #Y 25#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('wealth_sahel_modifier')]"
 enables_increase_capital_market_demands_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('spa_increase_capital_market_demands')], che attira i [goods|e] scelti verso il [market|e] della nostra capitale"
 enables_charter_saharan_trade_house_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('adu_charter_saharan_trade_house')], che istituisce un grande nodo del commercio del deserto in una delle nostre [urban_locations|e]"

 golden_century_events.26.title: "Influenza Oltre l'Orizzonte"
 golden_century_events.26.desc.desc_spa: "Ciò che era iniziato come una via per avventurieri è diventato una via per famiglie. Ogni flotta porta ora coloni accanto ai soldati, e la riva lontana si riempie di fattorie, parrocchie e bambini che non poseranno mai gli occhi su [ROOT.GetCountry.GetCapital.GetName]. Sotto [target_ruler.GetName] la corona non si limita più a rivendicare le terre lontane; le popola.\n\nUna pretesa su una mappa può essere contestata. Mille famiglie no. Si redigano i decreti e si concedano i passaggi, perché ogni famiglia che mandiamo oltre l'acqua è una radice affondata troppo in profondità perché un rivale possa strapparla."
 golden_century_events.26.desc.desc_adu: "La via dell'oro è diventata un'istituzione. Le carovane partono puntuali e tornano puntuali, i giudici delle città-oasi compongono le dispute dei mercanti, e i banchi di conto di [ROOT.GetCountry.GetCapital.GetName] pianificano attorno ai convogli del deserto con la sicurezza con cui i contadini pianificano attorno ai raccolti.\n\nLa ricchezza che arriva una volta è fortuna; la ricchezza che arriva ogni stagione è potere. Sotto [target_ruler.GetName] il deserto è diventato il nostro secondo mare, e noi ne siamo l'unica flotta."
 golden_century_events.26.desc.historical_info_spa: "L'emigrazione Spagnola verso le Indie era un affare autorizzato e registrato, incanalato attraverso Siviglia e incoraggiato da concessioni reali di terra ed esenzioni per chi era disposto ad attraversare. Attraverso strumenti come le #italic cédulas de población#! la Corona trasformò la conquista in insediamento, e a metà del Cinquecento decine di migliaia di Castigliani avevano compiuto la traversata."
 golden_century_events.26.desc.historical_info_adu: "L'oro del Sahel sostenne il conio dell'Occidente Musulmano. Il dinar almoravide, coniato con oro sahariano, era così apprezzato che i regni Cristiani d'Iberia lo imitarono apertamente; il loro #italic maravedí#! prese sia il valore sia il nome dai #italic murābiṭūn#! che coniarono l'originale."
 golden_century_events.26.a: "Che la marea d'oro scorra."
 as_long_as_we_remain_at_50_colonial_dominance_migratory_waves_modifier_tt: "Finché rimarremo a #Y 50#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('migratory_waves_modifier')]"
 as_long_as_we_remain_at_50_colonial_dominance_golden_road_modifier_tt: "Finché rimarremo a #Y 50#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('golden_road_modifier')]"
 enables_issue_royal_decree_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('spa_issue_royal_decree')], che popola i nostri lontani possedimenti per carta reale"
 enables_gold_caravan_expedition_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('adu_dispatch_gold_caravan')], che invia una carovana a sud per l'oro del [ShowRegionName('sahel_region')]"

 golden_century_events.27.title: "Ascesa Oltre l'Orizzonte"
 golden_century_events.27.desc.desc_spa: "I lontani domini hanno cominciato a rispondere nella nostra lingua. Le loro città sono tracciate secondo il nostro modello, le loro corti seguono la nostra legge e i loro porti si riempiono, a comando, di flotte che portano tributi in patria. Ciò che era una frontiera sta diventando uno specchio, e sotto [target_ruler.GetName] riflette [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName].\n\nLa distanza, l'antica nemica di ogni impero, sta perdendo la sua disputa con noi. Quando la riva lontana adora, giudica e paga come noi, ha cessato di essere straniera; è semplicemente diventata lontana."
 golden_century_events.27.desc.desc_adu: "La fede viaggia con le carovane, e la legge segue la fede. In città che i nostri nonni conoscevano solo come nomi, si prega ora come preghiamo noi, i giudici siedono per nostra nomina e i sovrani delle terre lontane vengono da noi per la loro legittimità. Ciò che la spada non ha mai conquistato, il credo sta silenziosamente annettendo.\n\nSotto [target_ruler.GetName] la #italic da'wa#! è diventata un braccio dello stato tanto quanto qualsiasi esercito, e uno più economico, perché i convertiti presidiano da sé."
 golden_century_events.27.desc.historical_info_spa: "A metà del Cinquecento le Indie erano governate, non semplicemente tenute. I viceregni della Nuova Spagna e del Perù, istituiti nel 1535 e nel 1542, diedero alla corona Spagnola tribunali, consigli e vescovi a un oceano di distanza dalla Castiglia, e le flotte annuali del tesoro legavano l'intero edificio a Siviglia con una catena d'argento."
 golden_century_events.27.desc.historical_info_adu: "L'Islam attraversò il Sahara nei registri dei mercanti molto prima che qualsiasi esercito lo seguisse. La fede mise radici nelle città commerciali lungo le rotte delle carovane del Sahel. Sovrani, come quelli di Takrur, la accettarono già nell'XI secolo, e con il credo vennero i suoi studiosi e giudici, legando le terre del commercio dell'oro all'Occidente Musulmano con la legge e il sapere."
 golden_century_events.27.a: "Nostre, nella legge e nello spirito."
 as_long_as_we_remain_at_75_colonial_dominance_elevated_cultural_identity_modifier_tt: "Finché rimarremo a #Y 75#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('elevated_cultural_identity_modifier')]"
 as_long_as_we_remain_at_75_colonial_dominance_dawa_colonial_administration_modifier_tt: "Finché rimarremo a #Y 75#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], sbloccheremo la [bureaucracy|e] [ShowBureaucracyTypeName('dawa_bureaucracy')] e godremo dei benefici di [ShowModifier('dawa_colonial_administration_modifier')]"
 enables_demand_tribute_fleets_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('spa_demand_tribute_fleets')], che ordina ai nostri sudditi di mandare in patria la loro ricchezza a vele spiegate"
 enables_build_qadi_office_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('adu_build_qadi_office')], che insedia un giudice della legge sacra nella capitale di uno [subject|e]"

 golden_century_events.28.title: "Predominio Oltre l'Orizzonte"
 golden_century_events.28.desc.desc_spa: "Non esiste più un orizzonte di cui non possediamo una parte. I mari lontani sono autostrade dei nostri commerci, le colonie di altre corone esistono solo per nostra benevolenza, e quando [target_ruler.GetName] desidera possedere un porto, uno stretto o un'isola, l'unica domanda rimasta è il prezzo del suo trasferimento.\n\nI nostri nonni mendicavano mappe da piloti stranieri. I nostri nipoti troveranno il nostro nome già scritto su qualunque riva raggiungano. Tra quelle due generazioni sta questa, che ha fatto il lavoro."
 golden_century_events.28.desc.desc_adu: "Dall'altra parte del deserto fino al mare occidentale, il commercio lontano risponde a un solo padrone. Nessuna carovana si muove e nessuna vela attraversa senza che la nostra parte sia contata per prima, e i popoli delle terre lontane, un tempo stranieri, ora pregano, commerciano e si arruolano come i nostri.\n\nI re [ShowReligionGroupAdjective('christian')] tengono le loro coste per nostra concessione e lo sanno. Sotto [target_ruler.GetName], il mondo oltre l'orizzonte ha smesso del tutto di essere una frontiera; è semplicemente il resto [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 golden_century_events.28.desc.historical_info_spa: "Nella seconda metà del Cinquecento l'impero Spagnolo era una macchina globale. La montagna d'argento di Potosí, aperta nel 1545, riversava la moneta del mondo, e dal 1565 i galeoni di Manila la portavano attraverso il Pacifico per scambiarla con le sete dell'Asia. Si diceva, e non per adulazione, che il sole non tramontasse mai sui domini del Re di Spagna."
 golden_century_events.28.desc.historical_info_adu: "Al suo apice, l'impero Almohade dominava il Mediterraneo occidentale da entrambe le sponde. La sua flotta era considerata la più forte della sua epoca; quando Saladino cercò aiuto contro i Crociati nel 1189, fu al califfo Almohade che scrisse, chiedendo le navi dell'Occidente Musulmano per chiudere il mare ai Franchi."
 golden_century_events.28.a: "L'orizzonte è nostro."
 as_long_as_we_remain_at_100_colonial_dominance_global_colonial_dominance_modifier_tt: "Finché rimarremo a #Y 100#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('global_colonial_dominance_modifier')]"
 as_long_as_we_remain_at_100_colonial_dominance_mastery_of_the_sudan_modifier_tt: "Finché rimarremo a #Y 100#! di [gc_colonial_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('mastery_of_the_sudan_modifier')]"
 enables_seize_colony_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('spa_seize_colony')], con cui la colonia di un'altra potenza può essere rivendicata come nostra"
 enables_integrate_natives_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('adu_integrate_natives')], che lega i popoli delle terre lontane ai nostri"

