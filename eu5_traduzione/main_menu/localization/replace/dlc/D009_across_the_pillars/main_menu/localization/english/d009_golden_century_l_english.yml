 gc_develop_target_province_tt: "Aumenta la [prosperity|e] di ogni [location|e] in [target_province.GetName] e lo [development|e] di [target_location.GetName]"
 gc_decision_iberian_union_leader_tt: "Siamo il [senior_partner|e] di un'Unione Iberica con un [union_integration_level|e] di almeno #Y 3#!"
 gc_decision_muslim_branch_tt: "Governiamo come [ShowFormableCountryName('MOR_f')] oppure abbiamo restaurato [ShowFormableCountryName('ADU_f')]"

 gc_colonial_dominance: "Predominio Coloniale"
 gc_colonial_dominance_desc: "Quanto si estende la nostra portata nel Nuovo Mondo, in crescita mese dopo mese grazie alle nostre colonie, alle flotte del tesoro, alle tradizioni navali e alla fede che portiamo oltremare. Misura quanto il nostro secolo diventi d'oro al di là dell'oceano, e ogni soglia superata concede una ricompensa duratura. Non appena questo o il nostro [gc_european_dominance|e] raggiunge per la prima volta 25, la [GetInternationalOrganizationType('grand_alliance').GetName] si forma contro di noi."
 GC_COLONIAL_DOMINANCE_DISPLAY: "$VAL$"

 gc_european_dominance: "Predominio Europeo"
 gc_european_dominance_desc: "Quanto pesa il nostro dominio sull'Europa, in crescita mese dopo mese grazie all'estensione del nostro reame, alla sua stabilità e alle tradizioni dell'esercito, oltre che alla nostra legittimità e alla nostra presa sulla regione d'origine. Misura la nostra preminenza in patria, e ogni soglia superata concede una ricompensa duratura. Non appena questo o il nostro [gc_colonial_dominance|e] raggiunge per la prima volta 25, la [GetInternationalOrganizationType('grand_alliance').GetName] si forma contro di noi."
 GC_EUROPEAN_DOMINANCE_DISPLAY: "$VAL$"

