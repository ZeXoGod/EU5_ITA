 ga_col_75_bonus_tt: "Ogni [member|e] della $grand_alliance$ ottiene #Y +10%#! di [ShowModifierTypeName('naval_morale')] e #Y +10%#! di [ShowModifierTypeName('naval_range_modifier')]"
