 gc_flashpoint_estate_rebels_country: "Ceti in Rivolta ($ADJ$)"
 gc_flashpoint_estate_rebels_country_adjective: "Ceti in Rivolta ($ADJ$)"
 gc_regional_rebels: "Ribelli [COUNTRY.Custom('IT_ADJ_MP')] di Frontiera"
 gc_regional_rebels_country: "Ribelli di Frontiera ($ADJ$)"
 gc_regional_rebels_country_adjective: "Ribelli di Frontiera ($ADJ$)"

 golden_century_events.41.title: "Scontro tra il Vecchio & il Nuovo"
 golden_century_events.41.desc: "I ceti ci spingono a cedere una parte della nostra autorità centrale. Sostengono che i nostri recenti tentativi di appropriarci dei loro privilegi abbiano ostacolato la loro influenza, e chiedono un'inversione significativa.\n\nÈ il vecchio ordine che reagisce al nuovo: le antiche famiglie e i loro diritti ereditari contrapposti al governo centralizzato che ci siamo affaticati a costruire, con ogni nuovo decreto del centro vissuto da loro come un furto di ciò che spetta loro di diritto. Cedere farebbe pendere nettamente la bilancia a loro favore, e annuncerebbe il ritorno ai vecchi modi di una gerarchia passata."
 golden_century_events.41.desc.historical_info_spa: "La monarchia centralizzatrice che i Re Cattolici edificarono da Castiglia e Aragona incontrò a ogni passo la resistenza dei vecchi ordini privilegiati. Le Cortes difendevano il loro diritto di concedere le tasse, i #italic fueros#! Aragonesi e Catalani vincolavano la mano della corona, e i grandi e le città con statuto si aggrappavano a libertà che nessun ministro riformatore avrebbe potuto sciogliere facilmente."
 golden_century_events.41.desc.historical_info_adu: "L'autorità centrale in al-'Andalus fu perennemente osteggiata dalle province. Lo stato Omayyade di Cordova governava tramite una burocrazia stipendiata, eppure le grandi famiglie, i signori di frontiera e le città vi si opponevano, e dopo il 1031 il reame si dissolse nei regni #italic ṭā'ifa#!, ciascun sovrano legge a sé stesso."
 golden_century_events.41.a: "Cediamo alle loro richieste."
 golden_century_events.41.b: "Ogni crisi è un'opportunità."
 estates_protest_our_rejection_tt: "I ceti ribollono per il nostro rifiuto"
 golden_century_events.42.title: "Concentrazione del Potere"
 golden_century_events.42.desc: "Il momento è propizio per raccogliere le redini del potere nelle nostre mani. Gli antichi privilegi e le libertà locali che hanno così a lungo imbrigliato il centro sono maturi per essere spazzati via, e l'intera macchina dello stato piegata a un unico scopo.\n\nUna marea simile non arriva due volte. Se sfruttiamo ora il nostro vantaggio, i consigli, i tribunali e la riscossione delle nostre entrate potranno essere stretti sotto il nostro comando, e il nostro dominio fatto rispondere come un solo corpo."
 golden_century_events.42.desc.historical_info_spa: "L'unione di Castiglia e Aragona sotto Isabella e Ferdinando forgiò uno dei primi stati moderni d'Europa. Attraverso i consigli reali, i #italic corregidores#! inviati a governare le città e il domesticamento delle Cortes e degli ordini militari, la corona attrasse costantemente l'autorità nelle proprie mani nel corso del Cinquecento."
 golden_century_events.42.desc.historical_info_adu: "Al suo apice il Califfato di Cordova, consolidato da 'Abd al-Raḥmān III dopo il 929, fu tra gli stati più centralizzati della sua epoca. Un #italic dīwān#! stipendiato, un esercito permanente e una rete di governatori nominati permettevano al califfo di governare un al-'Andalus unificato da un'unica capitale, l'invidia dei reami frammentati che lo circondavano."
 golden_century_events.42.a: "Portiamo il potere al centro."
 golden_century_events.42.b: "Rafforziamo un consiglio di governo."
 golden_century_events.42.c: "Leviamo un esercito più grande."

 golden_century_events.43.title: "Un Secolo d'Oro delle Arti"
 golden_century_events.43.desc.desc_spa: "Ricchezza e fiducia hanno scatenato un'ondata di genio su [ROOT.GetCountry.GetCapital.GetName]. I teatri traboccano ogni pomeriggio, le stampe non tengono il passo dei poeti, e pittori come non ne vedremo più prendono il pennello al servizio di corona e altare.\n\nLe menti più raffinate di [ShowContinentName('europe')] guardano ora alla nostra corte, e [ROOT.GetCountry.GetGovernment.GetRuler.GetName] è sollecitato a diventare il grande mecenate dell'epoca. Ciò che l'argento ci ha guadagnato in terre può ancora guadagnarcelo in gloria, perché un secolo è ricordato tanto per ciò che crea quanto per ciò che prende. Apriamo la borsa [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] a questa abbondanza."
 golden_century_events.43.desc.desc_adu: "Nelle sale di [ROOT.GetCountry.GetCapital.GetName], l'antico sapere si risveglia ancora una volta. I poeti si scambiano versi per tutta la notte, medici e astronomi si riuniscono a corte, e i canti di al-'Andalus risuonano di nuovo in cortili da tempo silenziosi.\n\nPer secoli le nostre città sono state la lampada con cui l'Occidente leggeva, e quella luce spetta a noi riaccendere. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] è esortato a riunire le persone più dotate di ogni terra, a riempire le nostre biblioteche e a finanziare le nostre scuole, e a far dire ancora una volta che la sapienza ha casa [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName]. È la stagione in cui [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] può farsi mecenate dei talenti."
 golden_century_events.43.desc.historical_info_spa: "L'Età dell'Oro Spagnola, il #italic Siglo de Oro#!, fu la fioritura culturale che accompagnò l'impero, finanziata in buona parte dall'argento delle Indie. Diede al mondo il #italic Don Chisciotte#! di Cervantes, il teatro di Lope de Vega e Calderón, e la pittura di El Greco, Velázquez e Murillo."
 golden_century_events.43.desc.historical_info_adu: "La Cordova del X secolo era la città più colta dell'Europa Occidentale, con la biblioteca più grande del continente. I suoi studiosi, tra cui il filosofo Ibn Rushd e il chirurgo al-Zahrāwī, portarono medicina, filosofia e astronomia ben oltre il mondo Musulmano, e il suo splendore sopravvisse nell'Alhambra Nasride di Granada."
 golden_century_events.43.a: "Che sia un'età dell'oro."

 golden_century_events.44.title: "[target_character.GetNameWithNoTooltip] Entra al Nostro Servizio"
 golden_century_events.44.desc.desc_spa: "A [ROOT.GetCountry.GetGovernment.GetRuler.GetShortName] è giunta notizia di [target_character.GetName], e chi l'ha vista all'opera non parla d'altro. Che guidi le truppe sul campo o prenda la parola davanti al consiglio, porta l'inconfondibile marchio dei predestinati, il tipo di servitore che a una corona è concesso forse una sola volta in un regno.\n\nUn talento simile non resta inattivo né manca di altri padroni. Se [target_character.GetNameWithNoTooltip] deve servire [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] e nessun trono rivale, dobbiamo legare a noi [target_character.GetNameWithNoTooltip] adesso, con onori e cariche sufficienti a conservarne la lealtà."
 golden_century_events.44.desc.desc_adu: "[target_character.GetName] è stato condotto davanti a [ROOT.GetCountry.GetGovernment.GetRuler.GetName], e gli elogi che precedono [target_character.GetNameWithNoTooltip] non sono vana adulazione di cortigiani. Nella sala del consiglio come in marcia, mostra i rari doni da cui così spesso sono dipese le fortune di una dinastia.\n\nUna mente simile è un premio che qualunque corte si affretterebbe ad afferrare. Eleviamo ora [target_character.GetNameWithNoTooltip] a cariche e onori, e potrà servire [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] per una generazione; esitiamo, e un altro certamente lo farà."
 golden_century_events.44.desc.historical_info_spa: "Gonzalo Fernández de Córdoba, ricordato come #italic El Gran Capitán#!, fu il miglior soldato della sua epoca. Nelle Guerre d'Italia distrusse eserciti Francesi molto più grandi a Cerignola e al Garigliano, vittorie che conquistarono Napoli alla corona Spagnola e ne fecero il primo viceré. La sua rifondazione della fanteria, che fuse picche, spade e armi da fuoco in un unico corpo disciplinato, pose le basi dei #italic tercios#! che avrebbero dominato i campi di battaglia d'Europa per oltre un secolo."
 golden_century_events.44.desc.historical_info_adu: "Le fortune di al-'Andalus dipesero spesso da un singolo grande ministro, e nessuno più dell'#italic hajib#! al-Manṣūr, chiamato Almanzor dai Cristiani, le cui campagne umiliarono i regni del nord e lo resero padrone del califfato in tutto tranne che nel nome."
 golden_century_events.44.a: "Accogliamo [target_character.GetNameWithNoTooltip] al nostro servizio."

 golden_century_events.45.title: "Un Computo del Reame"
 golden_century_events.45.desc.desc_spa: "I nostri scrivani si presentano a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] con la proposta di un grande computo: contare ogni focolare, pesare ogni campo e mettere nero su bianco la vera ricchezza [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] in registri di cui la corona possa fidarsi. È un lavoro lento e ingrato, e chi teme il fisco maledirà i rilevatori a ogni porta.\n\nEppure un reame che conosce sé stesso è un reame che si può governare. Tassare con giustizia, levare eserciti in proporzione ai nostri mezzi e spendere sulla base di un conto reale anziché di una stima speranzosa è il potere silenzioso su cui si fondano i regni duraturi. La conoscenza è un genere di dominio a sé. Ordiniamo il rilevamento."
 golden_century_events.45.desc.desc_adu: "I nostri segretari esortano [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a rimettere in ordine i registri, a censire il popolo e i suoi beni come faceva un tempo il #italic dīwān#! da Cordova a Baghdad. Un registro tenuto con onestà, ci ricordano, è il fondamento su cui ha poggiato ogni regno forte.\n\nFu grazie a una contabilità così accurata che i nostri avi mantennero funzionari stipendiati, eserciti permanenti e un tesoro che il nord poteva solo invidiare. Far rivivere quella disciplina significa scambiare le congetture del sovrano con la certezza dello scrivano, e legare [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] a un'unica mano consapevole. Si ordini il rilevamento."
 golden_century_events.45.desc.historical_info_spa: "La corona di Castiglia ordinava periodicamente grandi rilevamenti, le #italic averiguaciones#!, che contavano focolari e ricchezze per stabilire le imposte, una pratica che gli Asburgo estesero a tutti i loro vasti domini."
 golden_century_events.45.desc.historical_info_adu: "Lo stato Omayyade di Cordova era amministrato attraverso un sofisticato #italic dīwān#! i cui registri fiscali e funzionari stipendiati rendevano le sue entrate l'invidia dell'Europa Cristiana, un'eredità di arte di governo da Damasco e Baghdad."
 golden_century_events.45.a: "Ordiniamo il rilevamento."

 golden_century_events.46.title: "Le Fiere Traboccano"
 golden_century_events.46.desc.desc_spa: "Le fiere della stagione si sono gonfiate oltre ogni memoria. I mercanti accorrono da ogni regno di [ShowContinentName('europe')], le lettere di cambio passano per somme che un tempo avrebbero comprato una guerra, e nei banchi di conto [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] il tintinnio delle monete non cessa dall'alba al tramonto.\n\nMaree simili non durano per sempre. Finché i Genovesi e le grandi case bancarie sono avidi e l'argento scorre, potremmo vincolare il loro credito alla nostra corona, attirare i loro commerci attraverso le nostre città e prendere la nostra decima da ogni affare concluso. La fortuna ha posto ai nostri piedi una stagione d'oro. Sfruttiamola al meglio."
 golden_century_events.46.desc.desc_adu: "I suq di [ROOT.GetCountry.GetCapital.GetName] non erano così affollati a memoria d'uomo. Carovane dal [ShowRegionName('maghreb_region')] e navi da oltremare riempiono le nostre banchine di seta, carta, cuoio e delle ceramiche smaltate che i nostri artigiani mandano all'estero, e i cambiavalute riescono a malapena a tenere i loro banchi.\n\nIl commercio del mare occidentale è sempre stato la linfa vitale di al-'Andalus, più ricco in un buon anno di qualunque tributo estorto a un nemico sconfitto. Se sorvegliamo le strade, agevoliamo il passaggio dei mercanti e rendiamo i nostri porti l'invidia della costa, questa ondata di commerci potrà riempire il nostro tesoro per una generazione. Cavalchiamo la marea."
 golden_century_events.46.desc.historical_info_spa: "Le fiere di Medina del Campo erano il cuore finanziario di Castiglia, dove si regolavano le lettere di cambio di buona parte d'Europa e le case bancarie Genovesi e Tedesche facevano affari con la corona."
 golden_century_events.46.desc.historical_info_adu: "Il commercio Andaluso si estendeva dal Maghreb al Levante, portando all'estero la seta, la carta, il cuoio e la ceramica a lustro di Cordova e Granada, e i mercati delle sue città erano tra i più frequentati del Mediterraneo medievale."
 golden_century_events.46.a: "Che il commercio fiorisca."

 golden_century_events.47.title: "Una Nuova Arte della Guerra"
 golden_century_events.47.desc.desc_spa: "I nostri capitani hanno addestrato la fanteria in un modo nuovo, mescolando picche e armi da fuoco in quadrati che resistono compatti contro cavalleria e colonne. Vecchi soldati che hanno visto ogni campo di [ShowContinentName('europe')] giurano di non aver mai visto una formazione tenere come queste.\n\nSostenuti dal denaro e col tempo per temprarsi, gli eserciti [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] potrebbero diventare il terrore di ogni campo che calcheranno, e il nome dei nostri reggimenti pronunciato con timore da [ShowRegionName('italy_region')] fino al nord. Le guerre le vincono coloro che padroneggiano la nuova arte prima che i rivali imparino a rispondervi. Finanziamo le riforme."
 golden_century_events.47.desc.desc_adu: "I nostri comandanti sollecitano [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a rinnovare le antiche arti marziali: la rapida cavalleria leggera che incalza e accerchia, e le nuove armi a polvere schierate a loro sostegno. La frontiera ha sempre favorito rapidità e sorpresa, e pochi le hanno usate come i nostri avi.\n\nUniamo quell'astuzia ereditata all'artiglieria dell'epoca, e le bandiere [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] saranno temute sia per mare sia per sabbia, tanto sulla frontiera Cristiana quanto sulle coste del [ShowRegionName('maghreb_region')]. Una potenza che non impara i nuovi modi di fare la guerra non conserva a lungo i propri confini. Finanziamo le riforme."
 golden_century_events.47.desc.historical_info_spa: "Sotto Gonzalo de Córdoba, gli eserciti Spagnoli furono pionieri del #italic tercio#!, una formazione che fondeva picchieri e archibugieri e dominò i campi di battaglia Europei per oltre un secolo, rendendo la Spagna la principale potenza militare dell'epoca."
 golden_century_events.47.desc.historical_info_adu: "La guerra Andalusa e Berbera apprezzava lo #italic jinete#!, il rapido cavaliere leggero armato di giavellotto e spada, e i Nasridi di Granada furono tra i primi della penisola a rivolgere l'artiglieria a polvere contro i propri nemici."
 golden_century_events.47.a: "Finanziamo le riforme."

 golden_century_events.48.title: "Un Faro del Sapere"
 golden_century_events.48.desc.desc_spa: "Le aule [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] non erano così rumorose a memoria d'uomo. I giuristi discutono se un principe possa lecitamente fare ciò che comunque ha intenzione di fare, i teologi soppesano i diritti di popoli al di là di un oceano, e metà delle corti di [ShowContinentName('europe')] scrive per implorare una copia del verdetto.\n\nNon si dica mai che abbiamo lesinato lo stipendio a uno studioso. Finanziamo ora le grandi scuole, ed eleviamo [ShowLocationNameWithNoTooltip('salamanca')] sopra tutte le altre, e [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sarà citato in aule dove i nostri eserciti non hanno mai marciato. Essere temuti è abbastanza comune; essere ascoltati è la gloria più rara. Finanziamo gli studiosi."
 golden_century_events.48.desc.desc_adu: "Le madrase [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sono di nuovo affollate, e i nostri medici, astronomi e traduttori si mettono al lavoro come uomini rimasti inattivi troppo a lungo. I vecchi libri scendono dagli scaffali; le discussioni che accendono sono ancora più antiche.\n\nFinanziamo queste case del sapere e guardiamole fiorire. E lasciamo che il ricordo della grande biblioteca di [ShowLocationNameWithNoTooltip('cordoba')], la meraviglia che un tempo fece vergognare ogni corte d'Occidente, ci spinga a ben più di un affettuoso ricordo, perché ciò che fu disperso può ancora essere raccolto di nuovo. Finanziamo gli studiosi."
 golden_century_events.48.desc.historical_info_spa: "L'Università di Salamanca, fondata nel 1218, era tra le più antiche e rinomate d'Europa. Nel Cinquecento la sua Scuola di Salamanca, guidata dal domenicano Francisco de Vitoria, fece rivivere il pensiero scolastico e dibatté i diritti dei popoli delle Americhe e i limiti legittimi della guerra, questioni considerate tra i fondamenti del diritto internazionale."
 golden_century_events.48.desc.historical_info_adu: "La biblioteca califfale di Cordova, riunita sotto al-Ḥakam II, si diceva contenesse centinaia di migliaia di volumi, la più grande collezione dell'Occidente. I suoi traduttori portarono la #italic falsafa#! di Ibn Rushd, che i Latini chiamavano Averroè, nell'Europa Cristiana, mentre il #italic bīmāristān#! di Granada insegnava medicina in un'epoca in cui buona parte del continente si affidava ancora alla sola preghiera."
 golden_century_events.48.a: "Finanziamo gli studiosi."

 golden_century_events.49.title: "Il Conto dei Debiti"
 golden_century_events.49.desc.desc_spa: "Nonostante tutto il metallo prezioso che attraversa l'oceano verso di noi, i nostri creditori ci hanno colti a corto. I banchieri detengono le nostre cambiali, gli interessi divorano la flotta successiva prima che attracchi, e ora esigono un pagamento che il tesoro [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] non può versare per intero.\n\nNon resta alcun modo onorevole di rispondere, solo modi duri. Possiamo sospendere i nostri debiti e tradire la fiducia delle case che finanziano le nostre guerre, oppure spremere il reame ancora di più per denaro che non ha."
 golden_century_events.49.desc.desc_adu: "[ROOT.GetCountry.GetCapital.GetName] non è più in grado di far fronte ai propri obblighi finanziari. I costi interminabili legati alla frontiera, la paga dovuta ai soldati del [ShowRegionName('maghreb_region')] e i tributi pretesi da vicini più forti hanno prosciugato tutte insieme le nostre entrate.\n\nI prestatori si fanno insistenti, e i tesorieri ancora di più, perché un esercito non pagato è un esercito che si dissolve o rivolge le spade verso l'interno. Il conto non può più essere rimandato: dobbiamo trovare il denaro, rinunciare al debito o perdere gli uomini stessi che tengono i nostri confini."
 golden_century_events.49.desc.historical_info_spa: "Nonostante il flusso di argento americano, la corona Spagnola dichiarò più volte bancarotta, nel 1557, nel 1575 e nel 1596, per citarne solo alcune, incapace di onorare gli enormi prestiti dovuti ai Fugger e alle case bancarie Genovesi."
 golden_century_events.49.desc.historical_info_adu: "Gli stati di al-'Andalus e del Maghreb furono perennemente gravati dal costo della guerra di frontiera, dalla paga dei mercenari Berberi e dai tributi pretesi da vicini più forti, oneri che potevano svuotare un tesoro più in fretta di quanto qualsiasi tassa potesse riempirlo."
 golden_century_events.49.a: "Svalutiamo la moneta e affrontiamo la tempesta."
 golden_century_events.49.b: "Stringiamo tutti la cinghia!"

 golden_century_events.50.title: "Malattia nel Cuore del Paese"
 golden_century_events.50.desc: "La [ShowDiseaseName('bubonic_plague')] ha preso piede nel cuore [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]. Svuota i villaggi e s'aggira per i vicoli delle città, senza risparmiare né i quartieri dei ricchi né i tuguri più poveri, e i cimiteri fuori dalle mura presto non terranno il passo dei carri. Nessuna arte medica ha ancora trovato il modo di fermarla.\n\nContro un nemico che non risponde ad alcun assedio né trattato, una corona può fare poco più che il modesto lavoro della sopravvivenza: seppellire i morti con la dignità che resta, sfamare e dare riparo ai vivi, e mantenere un certo ordine dove il panico causerebbe più morti della malattia stessa. Possiamo solo prenderci cura del nostro popolo, resistere e pregare che il peggio passi presto."
 golden_century_events.50.desc.historical_info: "A partire dalla Peste Nera del XIV secolo, ondate ricorrenti di peste si abbatterono sulla Penisola Iberica, svuotandone città e campi e frantumando il lavoro e le entrate da cui ogni stato dipendeva. La sola peste Castigliana del 1596-1602 uccise forse seicentomila persone, un colpo demografico da cui la Castiglia non si riprese mai del tutto e che gli storici annoverano tra le cause del suo lungo declino."
 golden_century_events.50.a: "Smettete di tossirvi addosso!"

 golden_century_events.51.title: "La Frontiera si Solleva"
 golden_century_events.51.desc: "In [target_area.GetName] è scoppiata una rivolta aperta, proprio nella regione che culla la nostra capitale. La sua gente ha preso le armi, cacciato i nostri funzionari e dichiarato che non risponderà più a noi.\n\nUna sollevazione così vicina al cuore [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] non può essere tollerata. Ogni distretto che vede [target_area.GetNameWithNoTooltip] sfidarci senza essere punita soppeserà le proprie possibilità, e ciò che comincia come un angolo ribelle può inghiottire un reame. Dobbiamo reprimerla prima che l'esempio si diffonda."
 golden_century_events.51.desc.historical_info: "I sovrani Iberici furono sempre perseguitati dalla rivolta delle proprie regioni. Il Califfato di Cordova si frantumò dopo il 1031 nei regni #italic ṭā'ifa#!, ciascun governatore un piccolo re; secoli dopo i Moriscos delle Alpujarras si sollevarono contro la Castiglia dal 1568 al 1571 in una brutale guerra di montagna, e i #italic fueros#! di Aragona e Catalogna ponevano limiti rigidi alla portata della corona. Su questa penisola una provincia spinta troppo oltre è sempre stata pronta a innalzare la propria bandiera."
 golden_century_events.51.a: "Rispondiamo alla loro sfida."

 golden_century_events.52.title: "Carestia e Tumulti"
 golden_century_events.52.desc: "I raccolti sono falliti e il pane costa più di quanto la gente comune possa permettersi. Le città [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] vedono folle affamate radunarsi presso i granai e sfociare nel tumulto, mentre le campagne si svuotano perché i disperati si mettono in strada in cerca di una tavola più piena.\n\nUn sovrano è giudicato negli anni di magra molto più duramente che in quelli di abbondanza, perché un popolo affamato non si cura dell'argento conquistato all'estero se in casa manca una pagnotta, ed è breve la strada da un ventre vuoto a una pietra lanciata contro i nostri funzionari. Dobbiamo trovare grano per riempire i mercati e mantenere l'ordine nelle strade, o vedere la fame fare al nostro popolo ciò che nessun esercito rivale potrebbe."
 golden_century_events.52.desc.historical_info: "Le città densamente popolate della Penisola Iberica furono sempre vulnerabili alla carestia, e un solo raccolto fallito o una via commerciale interrotta potevano portare fame e tumulti nelle loro strade nel giro di una stagione. Le carestie e lo spopolamento delle campagne dell'inizio del Seicento, ricordati come parte del declino della Castiglia, cacciarono gli affamati dalla terra e fecero dei tumulti del pane una caratteristica ricorrente della vita cittadina Spagnola."
 golden_century_events.52.a: "Affrontiamo le folle affamate."

 gc_decision.title: "Inauguriamo il Secolo d'Oro"
 gc_decision.desc: "La [GetSituationByKey('battle_for_the_strait').GetName] è finita, e la nostra è la bandiera rimasta in piedi sopra lo [ShowLocationName('strait_of_gibraltar')]. Il sud obbedisce [ROOT.GetCountry.Custom('IT_AL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] da costa a costa, e in [ShowRegionName('iberia_region')] non resta alcun rivale a contendere ciò che abbiamo vinto.\n\nQuel che segue deve essere più di una vittoria ricordata. In tutta [ShowContinentName('europe')] la nostra voce raggiunge ormai più lontano di quanto i nostri eserciti abbiano mai marciato, e oltre l'oceano giacciono coste che non hanno mai visto le nostre vele. Che l'epoca che si apre porti il nome [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]."
 gc_decision.desc.entry: "Chi tiene lo [ShowLocationName('strait_of_gibraltar')] tiene la porta tra il Mediterraneo e l'oceano, e quella porta ora è nostra. La pace nel sud libera il nostro tesoro e le nostre navi per ambizioni più grandi, in [ShowContinentName('europe')] come su coste lontane. Le guerre si vincono in una stagione, ma un secolo d'oro va costruito."
 gc_decision.a: "Molte mappe diventeranno obsolete!"

 restore_cordoba.title: "Restauriamo [ShowLocationNameWithNoTooltip('cordoba')]"
 restore_cordoba.desc: "Un tempo meraviglia dell'Occidente, [ShowLocationName('cordoba')] non ha mai riconquistato lo splendore che conobbe sotto i califfi, quando le sue biblioteche e la sua grande moschea erano l'invidia di un continente. Riversiamo la ricchezza [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] nelle sue pietre, e facciamone di nuovo il gioiello [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]."
 restore_cordoba.a: "Ricostruiamo la gemma splendente di al-'Andalus."
 enable_decision_to_restore_learning_center_in_cordoba_tt: "Sblocca la [decision|e] #Y $restore_cordoba.title$#!"

 library_cordoba: "La Biblioteca di $cordoba$"
 library_cordoba_desc: "Al suo apice, la $library_cordoba$ conteneva centinaia di migliaia di volumi, la più grande collezione dell'Occidente e l'invidia di ogni corte dal [ShowRegionName('maghreb_region')] al [ShowRegionName('crescent_region')]. Restaurata, attira studiosi, traduttori e copisti da tutto il mondo e fa di nuovo di [ShowLocationName('cordoba')] un faro del sapere."
 library_cordoba_maintenance: "$library_cordoba$"

 gc_change_colonial_dominance: "[gc_colonial_dominance|e]: $VALUE|+$"
 neg_gc_change_colonial_dominance: "[gc_colonial_dominance|e]: $VALUE|+$"
 gc_change_european_dominance: "[gc_european_dominance|e]: $VALUE|+$"
 neg_gc_change_european_dominance: "[gc_european_dominance|e]: $VALUE|+$"

 golden_century_events.1.title: "Il Secolo d'Oro [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip]"
 golden_century_events.1.desc.desc_spa: "La lunga [GetSituationByKey('battle_for_the_strait').GetName] si è decisa a nostro favore, e da essa [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] emerge come la principale potenza di [ShowRegionName('iberia_region')]. I vecchi rivali sono umiliati, la frontiera meridionale è finalmente quieta e, sotto [target_ruler.GetName], [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] passa dalla guerra santa alla fatica più dura di unire molti territori in uno.\n\nDue orizzonti si aprono davanti a noi allo stesso tempo. In tutta [ShowContinentName('europe')] la nostra parola entra ora nei consigli e sui campi dove un tempo restava inascoltata, mentre oltre l'oceano attendono terre e anime che nessuna potenza [ShowReligionGroupAdjective('christian')] ha ancora reclamato. Il secolo che ci sta davanti si misurerà da quanto di entrambi faremo nostro."
 golden_century_events.1.desc.desc_adu: "Lo [ShowLocationName('strait_of_gibraltar')] è tenuto, il rivale respinto, e per la prima volta in secoli il richiamo alla preghiera si leva su una [ShowRegionName('iberia_region')] riunita sotto un'unica bandiera. L'età dei piccoli re è finita, e ciò che la caduta di [ShowLocationName('cordoba')] aveva un tempo disperso, [target_ruler.GetName] lo ha reso di nuovo intero.\n\nI regni [ShowReligionGroupAdjective('christian')] al di là delle montagne, che ci hanno a lungo considerato una potenza esausta e in declino, devono ora fare i conti con il nostro ritorno. A sud le vie delle carovane e il mare aperto promettono oro, sapere e dominio in egual misura, mentre in tutta [ShowContinentName('europe')] il nostro nome ha un peso che non aveva a memoria d'uomo. Che gli anni a venire misurino fin dove può giungere la luce [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]."
 golden_century_events.1.desc.historical_info_spa: "L'Età dell'Oro Spagnola, il #italic Siglo de Oro#!, fu la lunga stagione di ascesa imperiale e culturale che seguì l'unione di Castiglia e Aragona sotto Isabella e Ferdinando nel 1469. Nel 1492 i Re Cattolici presero Granada, ponendo fine a quasi otto secoli di Reconquista, e nello stesso anno inviarono Colombo attraverso l'Atlantico.\n\nL'argento delle Indie, il dominio dei #italic tercios#! sui campi di battaglia d'Europa e l'eredità delle corone Asburgiche fecero della Spagna il primo vero impero globale, uno sul quale si diceva che il sole non tramontasse mai. Quella ricchezza finanziò una fioritura di arti e lettere, da Cervantes e Lope de Vega a Velázquez ed El Greco, che diede il nome all'epoca."
 golden_century_events.1.desc.historical_info_adu: "Al-'Andalus fu un tempo il cuore pulsante della civiltà Musulmana nella Penisola Iberica, fondata dopo la conquista del 711 ed elevata al suo apice sotto il Califfato di Cordova, proclamato da 'Abd al-Raḥmān III nel 929. Per un periodo Cordova fu la città più grande e più colta dell'Europa Occidentale, con biblioteche, moschee e mercati senza rivali a nord del Mediterraneo.\n\nI suoi studiosi portarono algebra, medicina, astronomia e filosofia ben oltre il mondo Latino, e le opere dell'antichità furono preservate e tramandate attraverso la traduzione Araba. Sebbene il califfato si frantumasse nei regni #italic ṭā'ifa#! dopo il 1031 e cedesse lentamente all'avanzata Cristiana, il ricordo del suo sapere e del suo splendore sopravvisse come uno dei vertici della civiltà medievale."
 golden_century_events.1.a: "Ci attende un secolo di ricchezza e consolidamento."
 explain_golden_century_dominance_tt: "Abilita il [gc_european_dominance|e] e il [gc_colonial_dominance|e]"
 explain_golden_century_antagonists_tt: "Abilita l'[international_organization|e] [GetInternationalOrganizationType('grand_alliance').GetName]. Si forma quando uno dei due valori di #Y Predominio#! raggiunge #Y 25#!, sostenuta dai nostri [rival_enemies|e], dai nostri [rivals|e] o da [countries|e] con una posizione di timore nei nostri confronti, e i suoi [members|e] si rafforzano quanto più sale il nostro predominio. Resta una lega difensiva finché uno dei due valori non supera #Y 75#!, quando i suoi membri ottengono un [casus_belli|e] unico per farci guerra e, in caso di vittoria, ridurre quel predominio attraverso i suoi [peace_treaties|e]"
 explain_golden_century_flashpoints_tt: "Durante questa [situation|e] possono verificarsi per noi degli [events|e] di [flashpoint|E]"

 golden_century_events.2.title: "Predominio in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.2.desc.desc_spa: "Nonostante gli sforzi di ogni rivale e nemico, abbiamo raggiunto il vertice assoluto del nostro [GetSituationByKey('golden_century').GetName] sul continente di [ShowContinentName('europe')]. Nessuna coalizione può resisterci, nessuna corte osa ignorare i nostri desideri, e [target_ruler.GetName] è riconosciuto, nei fatti se non nel titolo, come il primo sovrano della Cristianità.\n\nI reggimenti [ShowUnitDefinitionName('a_tercio')] dominano il campo, la dignità imperiale è alla nostra portata, e da [ShowRegionName('italy_region')] ai Paesi Bassi il destino di [ShowContinentNameWithNoTooltip('europe')] dipende dalla nostra volontà. Che i nemici cospirino quanto vogliono: quest'epoca è nostra."
 golden_century_events.2.desc.desc_adu: "All'apice del nostro [GetSituationByKey('golden_century').GetName], torniamo a essere la prima potenza di [ShowRegionName('iberia_region')]. La potenza a lungo data per spacciata come l'ultima brace di un'epoca svanita non può ora essere ignorata, e i regni [ShowReligionGroupAdjective('christian')] al di là delle montagne devono trattare con noi o voltarsi in silenzio.\n\nLe nostre flotte comandano il mare occidentale, le nostre guarnigioni tengono ogni passo, e il nome di [target_ruler.GetName] è pronunciato con il timore reverenziale un tempo riservato ai califfi di [ShowLocationName('cordoba')]. Dai Pirenei alla riva più remota di [ShowContinentName('europe')], nessuno può alzare la mano contro i fedeli senza prima rispondere a noi. La gloria [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] è restaurata, e nessuno dei viventi la vedrà sbiadire."
 golden_century_events.2.desc.historical_info_spa: "Al culmine del Cinquecento, la Spagna Asburgica era la principale potenza d'Europa. Sotto Carlo V e suo figlio Filippo II comandava l'impero più ricco della terra e l'esercito più temuto dell'epoca, i #italic tercios#!, le cui formazioni di picche e archibugi dominarono i campi di battaglia del continente per oltre un secolo.\n\nLa vittoria a Pavia nel 1525 fece del Re di Francia un prigioniero, e a Lepanto nel 1571 una flotta guidata dagli Spagnoli spezzò la potenza navale Ottomana nel Mediterraneo. Da Madrid la corona Spagnola dirigeva gli affari di Italia, Paesi Bassi e Sacro Romano Impero, un'epoca di supremazia ricordata poi come la #italic Pax Hispanica#!."
 golden_century_events.2.desc.historical_info_adu: "Al suo zenit sotto il Califfato di Cordova, al-'Andalus era la potenza dominante del Mediterraneo occidentale. 'Abd ar-Raḥmān III, che assunse il titolo di califfo nel 929, e suo figlio al-Ḥakam II presiedettero uno stato i cui eserciti, flotte e ricchezze superavano ogni regno Cristiano della penisola.\n\nDopo la morte di al-Ḥakam II, il ciambellano e reggente Abū 'Āmir Muḥammad ibn Abī 'Āmir al-Ma'āfirī, soprannominato e universalmente noto come al-Manṣūr, 'il Vittorioso', guidò gli eserciti di Cordova in campagne, le 'razzie', che terrorizzarono quasi a piacimento l'Iberia settentrionale, saccheggiando città importanti come Barcellona, León e persino Santiago de Compostela, nell'anno 997. I suoi dinar d'oro circolavano in tutto il Mediterraneo, i suoi inviati raggiunsero Bisanzio e gli imperatori del Sacro Romano Impero, e per un periodo nessuna potenza d'Occidente poté eguagliarne la ricchezza o la portata."
 golden_century_events.2.a: "Per sempre d'oro!"
 as_long_as_we_remain_at_100_european_dominance_universal_monarchy_modifier_tt: "Finché rimarremo a #Y 100#! di [gc_european_dominance|e] per il resto della [situation|e] [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('universal_monarchy_modifier')]"
 as_long_as_we_remain_at_100_european_dominance_renewed_faith_modifier_tt: "Finché rimarremo a #Y 100#! di [gc_european_dominance|e] per il resto della [situation|e] [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('renewed_faith_modifier')]"
 enables_partition_cb_tt: "Abilita il [casus_belli|e] [ShowCasusBelliName('cb_partition')] così come il [peace_treaty|e] [ShowPeaceTreatyTypeName('peace_partition')]"
 unlock_saqaliba_advances_units_building_tt: "Sblocca [ShowAdvanceName('saqaliba_barracks_advance')] e i tre periodi dei [advances|e] di fanteria #italic aṣ-Ṣaqāliba al-Judud#!, il nostro corpo permanente di schiavi-soldato, schierabile finché manteniamo #Y 100#! di [gc_european_dominance|e]"

 golden_century_events.3.title: "Ascesa in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.3.desc.desc_spa: "Le nostre bandiere sono ora annoverate tra le prime di [ShowContinentName('europe')]. Dove un tempo i nostri inviati attendevano nelle anticamere, [target_ruler.GetName] detta ora i termini, e le corti di [ShowRegionName('italy_region')] e del [GetInternationalOrganizationType('hre').GetName] piegano i propri disegni attorno ai nostri.\n\nIl vero dominio del continente è ancora davanti a noi, eppure nessun rivale dubita più che una nuova grande potenza sia sorta in Occidente. Sfruttiamo il vantaggio finché è nostro."
 golden_century_events.3.desc.desc_adu: "La marea che per secoli ha corso contro di noi si è invertita. Dallo [ShowLocationName('strait_of_gibraltar')] ai passi settentrionali, la forza [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] si fa sentire in tutta [ShowContinentName('europe')], e sotto [target_ruler.GetName] i principi [ShowReligionGroupAdjective('christian')] soppesano ogni loro mossa contro il nostro potere.\n\nLa vetta non è ancora conquistata, ma i fedeli non si ergevano così in alto in Occidente da generazioni. Portiamo avanti l'avanzata finché la fortuna favorisce gli audaci."
 golden_century_events.3.desc.historical_info_spa: "Nei primi decenni del Cinquecento, la Spagna passò con rapidità sorprendente da regno appena unito a potenza europea di primo rango. Le campagne di Gonzalo Fernández de Córdoba, #italic El Gran Capitán#!, strapparono Napoli alla Francia tra il 1503 e il 1504 e rinnovarono l'arte della guerra con una fanteria disciplinata.\n\nLa diplomazia di Ferdinando d'Aragona e il matrimonio dei Re Cattolici intrecciarono la Spagna nella trama dinastica di mezza Europa. Quando Carlo d'Asburgo ereditò le corone nel 1516, le fondamenta di un'egemonia continentale erano già state poste."
 golden_century_events.3.desc.historical_info_adu: "Dopo la caduta del Califfato di Cordova, al-'Andalus fu salvata due volte dall'avanzata dei regni Cristiani da imperi Berberi del sud. Gli Almoravidi schiacciarono Alfonso VI a Sagrajas nel 1086, fermando la Reconquista per una generazione, e gli Almohadi che seguirono sconfissero di nuovo i Castigliani ad Alarcos nel 1195.\n\nSotto queste dinastie al-'Andalus fu riunificata e le sue frontiere tennero salde, e città come Cordova e Siviglia fiorirono di nuovo come centri di sapere e commercio prima che la lunga avanzata Cristiana riprendesse."
 golden_century_events.3.a: "La vetta è alla nostra portata."
 as_long_as_we_remain_at_75_european_dominance_expanded_cabinet_jurisdiction_modifier_tt: "Finché rimarremo a #Y 75#! di [gc_european_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('expanded_cabinet_jurisdiction_modifier')]"
 enables_enforce_conformity_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('spa_enforce_conformity')], che porta [assimilation|e] e [conversion|e] nella popolazione di un'[area|e] scelta in [ShowContinentName('europe')]"
 as_long_as_we_remain_at_75_european_dominance_sword_of_the_west_modifier_tt: "Finché rimarremo a #Y 75#! di [gc_european_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('sword_of_the_west_modifier')]"
 enables_proclaim_fatwa_action_tt: "Sblocca l'[action|e] [ShowGenericActionName('adu_proclaim_a_fatwa')], con cui l'autorità della fede è conferita a un aspetto del nostro governo [ROOT.GetCountry.Custom('IT_CLERGY_DAL_NOSTRO')][ROOT.GetCountry.Custom('IT_CLERGY_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]"

 spa_enforce_conformity: "Imponi la Conformità"
 spa_enforce_conformity_select_area: "Porta un'Area alla Conformità"
 spa_enforce_conformity_no_areas: "@trigger_no!Non possediamo aree idonee"
 adu_proclaim_a_fatwa: "Proclama una Fatwā"

 golden_century_events.4.title: "Una Sola Fede & Cultura"
 golden_century_events.4.desc: "È tempo che i nostri amministratori in [target.GetName] prendano le redini e promuovano un decreto di conformità. In effetti, secondo i nostri consiglieri, una spinta verso l'uniformità è vitale se vogliamo essere una terra di una sola fede e una sola cultura. I luoghi di culto di chi non condivide la fede [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] vengono chiusi e, negli anni a venire, i loro figli saranno cresciuti come i nostri.\n\nL'opera è dura e il suo pungolo si farà sentire a lungo, ma un popolo di un solo credo e di una sola tradizione è un popolo più facile da governare."
 golden_century_events.4.a: "È per il bene della fede."
 enforce_conformity_result_tt: "Ogni [location|e] in [target.GetName] beneficerà di [ShowModifier('enforce_conformity_modifier')] per #Y 10#! anni"
 explain_enforce_conformity_tt: "Le [locations|e] dell'[area|e] selezionata beneficeranno del [modifier|e] [ShowModifier('enforce_conformity_modifier')] per #Y 10#! anni"

 golden_century_events.5.title: "Proclamare una Fatwā"
 golden_century_events.5.desc: "[ROOT.GetCountry.Custom('IT_CLERGY_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] [ROOT.GetCountry.Custom('IT_CLERGY_HA')] risposto alla convocazione di [target_ruler.GetName], pront[ROOT.GetCountry.Custom('IT_CLERGY_OAI')] a prestare l'autorità della fede all'opera del nostro governo. Su quale questione verrà emesso il responso?\n\nQualunque cosa venga decretata, i fedeli la seguiranno, perché un responso emesso in nome della fede ha un peso che nessun semplice editto può eguagliare."
 golden_century_events.5.desc.historical_info: "Una #italic fatwā#! è un parere giuridico formale emesso da un giurista Musulmano qualificato, un #italic muftī#!, in risposta a una questione di legge religiosa. Non vincola come una sentenza, eppure il responso di uno studioso rispettato aveva un grande peso morale, e i sovrani spesso ne cercavano uno per legittimare le proprie decisioni. Nel XV secolo i sultani Ottomani elevarono l'ufficio di #italic şeyhülislam#!, il capo giurista dell'impero, a una preminenza duratura, e studiosi come Molla Hüsrev e Molla Gürani diedero sanzione religiosa alle conquiste di Maometto II. Nell'Occidente Musulmano, il giurista Maghrebino Ahmad al-Wansharīsī emise il celebre responso secondo cui i Musulmani di un al-'Andalus caduta erano tenuti a emigrare piuttosto che vivere sotto il dominio Cristiano."
 golden_century_events.5.a: "Che santifichino l'opera della nostra amministrazione."
 golden_century_events.5.b: "Che benedicano i nostri rapporti con le altre potenze."
 golden_century_events.5.c: "Che proclamino la lotta contro l'infedele."

 golden_century_events.6.title: "Influenza in [ShowContinentNameWithNoTooltip('europe')]"
 golden_century_events.6.desc.desc_spa: "Ormai fuori dai margini, [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] siede tra le potenze la cui parola dà forma a [ShowContinentName('europe')]. Le nostre compagnie marciano in [ShowRegionName('italy_region')] da pari delle sue casate più orgogliose, e sotto [target_ruler.GetName] le nostre leve rispondono alla chiamata più in fretta di quanto i rivali possano schierare le proprie.\n\nResta ancora da salire, ma il tempo in cui i nostri vicini potevano trascurarci è passato. Che imparino cosa significa fare i conti con noi."
 golden_century_events.6.desc.desc_adu: "Le bandiere dei fedeli si radunano come non accadeva da generazioni. In tutta [ShowContinentName('europe')] il nostro nome è pronunciato con cauto rispetto, e da ogni frontiera i volontari della fede cavalcano per rispondere alla chiamata di [target_ruler.GetName].\n\nLa vetta è ancora lontana, ma i principi [ShowReligionGroupAdjective('christian')] non parlano più di noi come di una reliquia da spazzare via. La lotta santa ha trovato il suo secondo respiro."
 golden_century_events.6.desc.historical_info_spa: "La lunga guerra per Granada, conclusa nel 1492, forgiò Castiglia e Aragona in un'unica potenza militare. I Re Cattolici levarono compagnie permanenti e una milizia finanziata dalla corona sotto la #italic Santa Hermandad#!, sostituendo l'inaffidabile leva feudale con truppe che la corona poteva far marciare a piacimento.\n\nQuesto esercito indurito, inattivo una volta caduta Granada, fu presto rivolto verso l'esterno attraverso il Mediterraneo. Nel giro di un decennio la fanteria Spagnola era passata in Italia, ponendo le basi per le formazioni che avrebbero dominato i campi di battaglia d'Europa per un secolo."
 golden_century_events.6.desc.historical_info_adu: "I #italic ḡuzāt#! erano volontari che attraversavano dal Nord Africa per condurre la guerra santa sulla frontiera Cristiana di al-'Andalus. Organizzate sotto uno #italic shaykh al-ḡuzāt#!, queste bande armate della fede furono un pilastro della difesa della Granada Nasride, attirando combattenti da tutto il Maghreb in cerca di merito nella lotta.\n\nSebbene turbolenti e difficili da frenare per qualunque sovrano, i ḡuzāt incarnavano l'ideale del #italic jihād#! sulla frontiera Iberica, e un sultano in grado di radunarli comandava uno zelo che nessun soldato stipendiato poteva eguagliare."
 golden_century_events.6.a: "La nostra ascesa è appena iniziata."
 as_long_as_we_remain_at_50_european_dominance_european_aspirations_modifier_tt: "Finché rimarremo a #Y 50#! di [gc_european_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('european_aspirations_modifier')]"
 enables_emergency_conscription_tt: "Sblocca l'azione del [parliament|e] #Y Coscrizione d'Emergenza#!, che richiama un'ondata di [manpower|e] in tempo di guerra"
 as_long_as_we_remain_at_50_european_dominance_holy_struggle_modifier_tt: "Finché rimarremo a #Y 50#! di [gc_european_dominance|e] per il resto del [GetSituationByKey('golden_century').GetName], godremo dei benefici di [ShowModifier('holy_struggle_modifier')]"
 enables_muster_the_ghuzat_tt: "Sblocca l'[action|e] [ShowGenericActionName('adu_muster_the_ghuzat')], che convoca volontari della fede da tutto il mondo [ShowReligionGroupAdjective('muslim')] per ingrossare i nostri eserciti"

 adu_muster_the_ghuzat: "Raduna i Ḡuzāt"
 adu_proclaim_a_fatwa_desc: "Convoca i nostri studiosi religiosi perché emettano una fatwā, concedendo la sanzione della fede a un aspetto del nostro governo: la sua amministrazione, la sua diplomazia o le sue guerre."
 adu_muster_the_ghuzat_desc: "Lancia l'appello ai ḡuzāt, e i volontari della fede attraverseranno dalle terre [ShowReligionGroupAdjective('muslim')] più vicine per prendere le armi al nostro servizio."
 spa_enforce_conformity_desc: "Scegli un'area che possediamo in [ShowContinentName('europe')] e piega la sua gente a una sola fede e a una sola cultura, convertendo e assimilando chi non condivide ancora la nostra."
 golden_century_events.7.title: "I Ḡuzāt Rispondono all'Appello"
 golden_century_events.7.desc: "La notizia della nostra lotta santa si diffonde per le terre dei fedeli, e i #italic ḡuzāt#! rispondono. Dalle terre [ShowReligionGroupAdjective('muslim')] più vicine alla nostra portata, volontari zelanti si insinuano oltre la frontiera per prendere le armi sotto [target_ruler.GetName], ingrossando le nostre fila di uomini che combattono non per la paga ma per il paradiso.\n\nTremino gli infedeli. La frontiera ha ritrovato i suoi guerrieri."
 golden_century_events.7.a: "Che trovino il paradiso al nostro servizio."
 missed_reward_ghuzat_mujahidin_tt: "Se avessimo la [bureaucracy|e] [ShowBureaucracyTypeName('diwan_al_jund_bureaucracy')] abilitata, anche [target_ghazi_general.GetName] si sarebbe unito alle nostre file"

 plan_partition_campaign: "Pianifica una Campagna di Spartizione"
 plan_partition_campaign_desc: "I nostri nemici hanno consolidato troppo bene le loro terre per i nostri gusti. È evidente che i loro tentativi di assicurarsi il potere porteranno inevitabilmente a un fronte unito contro il nostro popolo, una minaccia certa alla nostra prosperità continua. Non possiamo lasciare senza risposta simili manifestazioni sfacciate di forza!"
 selected_country_target_cb_tt: "Otterremo il [casus_belli|e] [ShowCasusBelliName('cb_partition')] contro il [country|e] bersaglio. Questo [casus_belli|e] dà accesso al [peace_treaty|e] [ShowPeaceTreatyTypeName('peace_partition')]"
 plan_partition_campaign_select_rival_or_enemy: "Scegli un [rival|e] o un [enemy|e] da Spartire"
 no_neighbor_enemies_rivals_available: "@trigger_no!Non abbiamo [rival|e] o [enemy|e] confinanti da spartire"

 invoke_ummayad_legacy: "Invoca l'Eredità Omayyade"
 invoke_ummayad_legacy_desc: "Gli Omayyadi che un tempo governarono da [ShowLocationName('cordoba')] hanno lasciato un'eredità che spetta a noi reclamare. Dovremmo concentrarci su uno qualunque dei paesi insediati nelle terre del [ShowScriptedGeographyName('umayyad_caliphate_geography')], e faremo valere l'antico diritto di riportarli sotto il nostro dominio con la spada."
 selected_country_ummayad_cb_tt: "Otterremo il [casus_belli|e] [ShowCasusBelliName('cb_restore_ummayad_caliphate')] contro il [country|e] bersaglio"
 invoke_ummayad_legacy_select_country: "Scegli un [country|e] che Detiene Terre Omayyadi"
 invoke_ummayad_legacy_no_country_available: "@trigger_no!Nessun [country|e] è insediato nelle terre del [ShowScriptedGeographyName('umayyad_caliphate_geography')]"

 spa_patronize_golden_century: "Mecenatismo per il Secolo d'Oro"
 spa_patronize_golden_century_desc: "Facciamo da mecenati ai nostri artisti e spendiamo liberamente per lo sfarzo, finanziando i pittori, i poeti e gli architetti della nostra epoca. Questo investimento sviluppa la cultura dei nostri popoli e scrive il nostro nome a lettere d'oro negli annali della storia."

 golden_century_events.8.title: "Mecenati di un'Età dell'Oro"
 golden_century_events.8.desc: "La ricchezza della nostra epoca attira maestri da ogni angolo di [ShowContinentName('europe')]. A [target_location.GetName] si è formato un polo culturale per pittori e scultori, architetti e poeti, ciascuno in cerca del favore di [target_ruler.GetName] e di un posto nello splendore del nostro secolo.\n\nUna nostra parola e le botteghe si riempiono di artisti desiderosi di immortalare il nostro splendore. Ciò che sceglieremo di finanziare ora sopravvivrà a ogni trattato e a ogni guerra, perché molto dopo che i nostri eserciti saranno dimenticati, sarà questa l'opulenza con cui l'epoca ci ricorderà."
 golden_century_events.8.a: "Che l'arte sia!"
 target_character_serves_in_court_tt: "[target_character.GetName] prende posto alla nostra corte come maestro del proprio mestiere"
 artist_appears_in_court_tt: "Un [artist|e] di grande maestria prende posto alla nostra corte"
 artist_expands_royal_quarters: "Una magnifica nuova ala si innalza sulla residenza reale, e la notizia del suo splendore porta la nostra fama presso le corti di [ShowContinentNameWithNoTooltip('europe')]"
 artist_drafts_traditional_art: "I nostri maestri mettono per iscritto i motivi e le forme della nostra tradizione per le generazioni a venire, arricchendo l'eredità che lasciamo"
 artist_furthers_our_technological_understanding_tt: "[target_character.GetShortNameWithNoTooltip] trasforma il mecenatismo in scoperta, facendo avanzare il sapere [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]"

 golden_century_events.9.title: "Espulsione degli [ShowCultureNameWithNoTooltip('andalusi')] di [target.GetNameWithNoTooltip]"
 golden_century_events.9.desc: "Gli [ShowCultureName('andalusi')] di [target.GetName] sono sempre rimasti distinti da noi, legati a una fede e a una cultura che non sono le nostre. Per quanto a lungo dimorino tra noi, dubitiamo che i loro cuori saranno mai nostri.\n\nLa nostra pazienza è esaurita. Li raduneremo dalle loro case e li faremo condurre ai porti, quindi imbarcare su navi dirette a [target_province_destination.GetName], dove chi condivide il loro credo potrà accoglierli.\n\nLe case e i campi che lasceranno non resteranno vuoti a lungo. Il nostro popolo si stabilirà sulle terre che i loro padri un tempo lavoravano, e ciò che era loro passerà in mani più sicure."
 golden_century_events.9.desc.historical_info: "Tra il 1609 e il 1614, il re Filippo III di Spagna ordinò l'espulsione dei Moriscos, i discendenti dei Musulmani d'Iberia che un secolo prima erano stati costretti ad accettare il Cristianesimo. Da tempo sospettati di apostasia segreta e di intrighi con gli Ottomani e i corsari della Barberia, circa trecentomila furono cacciati dalle loro case.\n\nLa maggior parte passò nel Maghreb, ma molti viaggiarono più a est verso le terre Ottomane, stabilendosi in Anatolia, nel Levante e nelle città dei Balcani, dove il governo del Sultano li accolse. La loro partenza privò la Spagna orientale di agricoltori e artigiani esperti, e molte sue regioni non si ripresero mai del tutto."
 golden_century_events.9.a: "Il loro esodo è per il meglio."
 spa_edict_expulsion: "Emana un Editto di Espulsione"
 spa_edict_expulsion_desc: "Scegli una provincia che possediamo e manda in esilio oltremare la sua popolazione [ShowCultureName('andalusi')], aprendo le tenute che lasciano a coloni del nostro popolo."
 select_expulsion_no_province: "@trigger_no!Nessuna [province|e] disponibile con una popolazione $andalusi$ consistente"
 select_province_removes_andalusi_tt: "Nella [province|e] selezionata inizierà un'espulsione tramite [migration|e] dei [pops|e] [ShowCultureName('andalusi')]"
 select_province_to_evict_pops_from: "Seleziona una [province|e] da cui sfrattare i [pops|e]"

 spa_seize_colony: "Impadronisciti di una Colonia"
 spa_seize_colony_desc: "Le ricchezze del Nuovo Mondo non devono essere ottenute solo con la vanga. Sceglieremo una colonia sleale di una potenza rivale alla nostra portata e la tenteremo ad abbandonare i suoi lontani padroni per la nostra corona, ottenendo in un colpo un ricco dominio, e guadagnandoci la duratura inimicizia del sovrano che deruberemo."
 select_colonial_subject_to_seize: "Scegli una [colony|e] Sleale di cui Impadronirti"
 no_available_colonial_subjects_to_seize: "@trigger_no!Nessuno [subject|e] coloniale sleale di una potenza rivale si trova alla nostra portata"
 selected_subject_receives_offer_to_defect_tt: "Allo [ShowSubjectTypeName('colonial_nation')] selezionato sarà chiesto di diventare nostro [subject|e]. Se accetterà, i nostri rapporti con il suo attuale [overlord|e] peggioreranno molto e quest'ultimo otterrà un [casus_belli|e] per riprenderlo"

 golden_century_events.10.title: "Un'Offerta di Fedeltà"
 golden_century_events.10.desc: "Emissari [seizing_country.Custom('IT_Della')][seizing_country.GetName] si sono insinuati nei nostri porti con una proposta sussurrata anziché proclamata. I nostri lontani padroni [target_overlord.Custom('IT_Della')][target_overlord.GetName] sono diventati incuranti delle nostre necessità e sordi alle nostre lagnanze, mentre [seizing_country.Custom('IT_La')][seizing_country.GetNameWithNoTooltip] ci accoglierebbe come propri e ricompenserebbe la nostra lealtà in egual misura.\n\nLa scelta davanti a [target_ruler.GetName] non è da poco. Accettare significa scrollarsi di dosso un sovrano per un altro e attirare su di noi l'ira [target_overlord.Custom('IT_Della')][target_overlord.GetNameWithNoTooltip]; rifiutare significa provare la nostra fedeltà e legarci più strettamente alla corona che già serviamo."
 golden_century_events.10.a: "Leghiamo la nostra sorte a [seizing_country.Custom('IT_Alla')][seizing_country.GetNameWithNoTooltip]."
 golden_century_events.10.a.alt: "Leghiamo la nostra sorte alla loro."
 golden_century_events.10.b: "La nostra lealtà non è in vendita."

 adu_integrate_natives: "Integra la Carta Coloniale"
 adu_integrate_natives_desc: "Anziché passare i nativi a fil di spada, tratteremo con loro, impareremo la loro terra attraverso la loro guida e li intrecceremo nel tessuto del nostro dominio oltremare."
 adu_integrate_natives_tt: "Pianteremo una [colonial_charter|e] nella [province|e] scelta e insedieremo le sue [locations|e] non reclamate, poi sceglieremo come trattare i nativi che vi abitano"

 golden_century_events.11.title: "L'Orizzonte Oltre [target.GetNameWithNoTooltip]"
 golden_century_events.11.desc: "Siamo riusciti a fare pace con i nativi in [target.GetName], e grazie al loro aiuto non solo abbiamo mappato l'intera provincia, ma fondato molte colonie nei suoi territori. Ora i nostri consiglieri sono divisi su cosa debba seguire.\n\nAlcuni sostengono di espandere le colonie con nuovi migranti dalla madrepatria. Altri vedono solo profitto nei nativi stessi e li metterebbero in catene a lavorare nei nostri mercati in patria. Pochi prudenti lascerebbero in pace la gente del posto e permetterebbero al nostro nuovo avamposto di crescere coi suoi tempi."
 golden_century_events.11.a: "Decretiamo nuove ondate migratorie."
 golden_century_events.11.b: "Reinsediamoli come lavoratori in patria."
 golden_century_events.11.c: "Lasciamo che la provincia si sviluppi naturalmente."
 all_those_slaves_go_back_home: "Gli [ShowPopTypeName('slaves')] creati da questa [action|e] saranno reinsediati attorno alla nostra [capital|e] in [ROOT.GetCountry.GetCapital.GetProvince.GetName]"

 spa_demand_tribute_fleets: "Esigi Flotte di Tributo"
 spa_demand_tribute_fleets_desc: "Scegli una delle nostre colonie fedeli oltre l'oceano e richiama in patria la sua ricchezza. Carica di argento e dei frutti delle sue miniere e dei suoi campi, una flotta di tributo salperà verso i nostri porti e riempirà i nostri forzieri quando toccherà terra."
 select_colonial_subject: "Scegli una [colony|e] Fedele"
 no_loyal_colonial_subject: "@trigger_no!Non possediamo alcuno [subject|e] coloniale fedele"
 spa_demand_tribute_fleets_tt: "Lo [ShowSubjectTypeName('colonial_nation')] fedele selezionato sarà chiamato a inviare in patria nei nostri porti una flotta di tributo di [gold|e], metalli preziosi o [pops|e]"

 adu_build_qadi_office: "Costruisci un Ufficio del Qāḍī"
 adu_build_qadi_office_desc: "È il massimo onore per i nostri reami sudditi ospitare un [ShowBuildingTypeName('qadi_office')]. Il suo giudice amministrerà la legge sacra a nostro nome, comporrà le dispute del popolo e legherà più strettamente il suo sovrano ai nostri affari."
 no_available_colonial_subject: "@trigger_no!Non possediamo alcuno [subject|e] la cui capitale NON abbia un [ShowBuildingTypeNameWithNoTooltip('qadi_office')]"
 adu_build_qadi_office_tt: "Costruiremo un [ShowBuildingTypeName('qadi_office')] nella [capital|e] dello [subject|e] scelto, ponendo il suo giudice a capo della legge sacra e legando più strettamente il reame al nostro dominio"
 if_we_had_qadi_al_jamaa_bureaucracy_tt: "Se avessimo la [bureaucracy|e] [ShowBureaucracyTypeName('qadi_al_jamaa_bureaucracy')] beneficeremmo anche del [modifier|e] [ShowModifier('empowered_qadi_al_jamaa_modifier')]"

 adu_dispatch_gold_caravan: "Invia una Carovana dell'Oro"
 adu_dispatch_gold_caravan_desc: "Scegli uno dei nostri perché guidi una carovana verso sud attraverso il Sahara. Carica di [ShowGoodsName('salt')] e [ShowGoodsName('cloth')], la scambierà con l'[ShowGoodsName('goods_gold')] del [ShowRegionName('sahel_region')] e porterà quella ricchezza in patria per arricchire i nostri mercati."
 adu_dispatch_gold_caravan_select_leader: "Scegli un Capo della Carovana"
 adu_dispatch_gold_caravan_no_leader: "@trigger_no!Non abbiamo alcun [character|e] adatto a guidare la [expedition|e]"
 adu_dispatch_gold_caravan_tt: "Il [character|e] scelto guiderà una [expedition|e] verso sud attraverso il Sahara, scambiando per l'[ShowGoodsName('goods_gold')] del [ShowRegionName('sahel_region')] e portando quella ricchezza ai nostri mercati"

 nick_the_golden: "il Dorato"

 golden_century_events.12.title: "Il Tributo [target_country.Custom('IT_Della')][target_country.GetNameWithNoTooltip]"
 golden_century_events.12.desc: "La nostra colonia fedele [target_country.Custom('IT_Della')][target_country.GetName] è prosperata sotto la nostra protezione, ed è giunto il momento che ci renda quanto ci spetta. Una flotta di tributo attende pronta nei suoi porti, e una parola attende [target_ruler.GetName] su cosa dovrà portare in patria. Potremmo esigere un flusso costante di denaro per riempire il nostro tesoro, oppure l'argento e l'oro delle sue miniere per arricchire i nostri mercati. Oppure, guardando oltre le sue ricchezze al suo popolo, potremmo spingere coloni oltre l'oceano per ingrossare le province del nostro stesso reame."
 golden_century_events.12.a: "Esigiamo un tributo annuale in oro."
 golden_century_events.12.b: "Rivendichiamo l'argento e l'oro delle loro miniere."
 golden_century_events.12.c: "Spediamo la loro gente a popolare le nostre terre."

 spa_issue_royal_decree: "Emana una Cédula de Población"
 spa_issue_royal_decree_desc: "Scegli un'area del nostro dominio oltremare e spalanca i suoi porti ai coloni. Per decreto reale, famiglie di reami che condividono la nostra fede attraverseranno l'oceano per costruire nuove vite sulla nostra frontiera, e le distese vuote di quella terra si riempiranno di braccia volenterose."
 select_colonial_area_to_direct_migrants: "Scegli un'[area|e] che Riceva i Nostri Coloni"
 no_available_colonial_area: "@trigger_no!Non possediamo alcuna [area|e] adatta a ricevere nuovi coloni"
 spa_issue_royal_decree_tt: "Apriremo l'[area|e] scelta alla migrazione, attirando nelle sue [locations|e] coloni da reami che condividono la nostra fede e concedendo loro un beneficio duraturo"

 golden_century_events.13.title: "[target_area.GetNameWithNoTooltip] Accoglie Ondate di Migranti"
 golden_century_events.13.desc: "I nostri sforzi per spingere avanti la frontiera coloniale hanno dato frutti. Il decreto con cui abbiamo accolto i coloni in [target_area.GetName] si è diffuso ben oltre i nostri porti, attirando famiglie fin da [target_origin_province_1.GetName] in cerca di una nuova vita sotto la nostra bandiera.\n\nArrivano con ben più che le mani vuote. Alcuni portano le abitudini di vicini da tempo avvezzi a vivere accanto a estranei, altri gli attrezzi e i mestieri delle loro vecchie botteghe, altri ancora semplicemente il loro numero e la loro fame di costruire. Qualunque cosa portino, [target_ruler.GetName] vuole vederli ben insediati, perché una frontiera popolata è una frontiera tenuta."
 golden_century_events.13.a: "Benvenuti!"
 migrants_bring_cultural_understanding_tt: "I nuovi coloni portano con sé [ShowModifier('harmonious_understanding_modifier')] per #Y 5#! anni"
 migrants_bring_tool_expertise_tt: "Fabbricanti di attrezzi e abili artigiani benedicono le nostre colonie con [ShowModifier('new_tooling_techniques_modifier')] per #Y 5#! anni"
 shared_prosperity_event_13_tt: "[ShowModifier('shared_prosperity_modifier')] si fa sentire nelle nuove case per #Y 5#! anni"
 golden_century_events.13.desc.historical_info: "Una #italic cédula de población#! era una carta reale con cui la Corona Spagnola cercava di popolare le distese scarsamente occupate del suo impero. Ai coloni disposti ad attraversare l'oceano si promettevano concessioni di terra, esenzioni da tasse e dazi e lo status di sudditi fedeli, così che pretese lontane sulla mappa potessero diventare fattorie, città e porti in grado di mantenersi e difendersi da soli.\n\nLa più celebre fu la #italic Real Cédula de Población#! concessa da Carlo III nel 1783 per l'isola di Trinidad, da tempo rivendicata dalla Spagna ma scarsamente abitata. Accoglieva coloni Cattolici Romani dall'estero e assegnava terra in proporzione a ciascuna famiglia e al numero di schiavi che portava con sé, così che nel giro di una sola generazione un avamposto quasi vuoto divenne una affollata colonia di piantagioni. Resta l'espressione più audace dell'ambizione Borbonica di far rendere finalmente ciò che valevano i margini trascurati dell'impero."

 golden_century_events.14.title: "L'Ombra [gc_hegemon.Custom('IT_Della')][gc_hegemon.GetNameWithNoTooltip]"
 golden_century_events.14.desc: "La [GetSituationByKey('battle_for_the_strait').GetName] è conclusa e da essa emerge [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName], una potenza che ci sovrasta tutti. I suoi eserciti sono collaudati, i suoi forzieri profondi e la sua ambizione evidente, perché ora la sua portata va oltre i propri confini verso il dominio dell'epoca stessa. Siamo tra coloro che hanno motivo di temerne la forza.\n\nEppure un'egemonia in ascesa chiama a raccolta la propria risposta. Nelle corti dei timorosi comincia a formarsi una coalizione, e più [gc_hegemon.Custom('IT_La')][gc_hegemon.GetNameWithNoTooltip] estende la propria portata, più duramente quella lega lavorerà per contenerne l'ascesa. Il secolo a venire dipenderà dal fatto che quell'ascesa possa essere frenata o che inghiotta l'equilibrio dell'intero mondo."
 golden_century_events.14.a: "Non resteremo soli contro di essa."

 golden_century_events.15.title: "L'Ascesa [gc_hegemon.Custom('IT_Della')][gc_hegemon.GetNameWithNoTooltip]"
 golden_century_events.15.desc: "Alla nostra corte giunge notizia che [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName] ha trionfato nella [GetSituationByKey('battle_for_the_strait').GetName] e si trova ora in testa tra le potenze dell'epoca. Siamo legati a quella potenza, per giuramento o per obbligo, e dunque il suo trionfo è in una certa misura anche nostro, la sua ascesa una marea che può portarci con sé.\n\nEppure una fortuna condivisa è una fortuna rischiata. Man mano che [gc_hegemon.Custom('IT_La')][gc_hegemon.GetNameWithNoTooltip] sale più in alto, i timorosi e gli invidiosi si uniranno contro di essa, e chi è legato all'egemone potrebbe vedere l'ostilità destinata al suo patrono abbattersi anche su di sé. Gli anni a venire mostreranno se il nostro legame diventerà la nostra fortuna o la nostra rovina."
 golden_century_events.15.a: "Osserveremo da vicino la sua ascesa."

 golden_century_events.16.title: "Sorge una Nuova Potenza"
 golden_century_events.16.desc: "Oltre i nostri confini [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName] ha preso il sopravvento sui rivali, e dalla [GetSituationByKey('battle_for_the_strait').GetName] emerge protesa verso un dominio che non si fermerà alle proprie frontiere. Non siamo né vincolati a quella potenza né schierati contro di essa, eppure una potenza di tale ambizione getta una lunga ombra su chiunque le viva accanto.\n\nLa scelta davanti a noi non aspetterà per sempre. Se arrivassimo a temerne la portata, una coalizione dei cauti è pronta ad accoglierci; se leggessimo il vento diversamente, c'è ancora sicurezza da trovare nel suo favore. Che ci pieghiamo, resistiamo o semplicemente osserviamo, il secolo a venire non ci lascerà indenni."
 golden_century_events.16.a: "Valuteremo con cura la nostra rotta."

 gc_grand_alliance_leader_tt: "Guidiamo la [GetInternationalOrganizationType('grand_alliance').GetName] schierata contro [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName]. Man mano che il suo [gc_european_dominance|e] e il suo [gc_colonial_dominance|e] superano ciascuna soglia, i bonus ai [modifier|e] che l'[international_organization|e] concede ai suoi [members|e] si rafforzano"
 gc_grand_alliance_member_tt: "Qualunque reame che tema [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName] può unirsi alla [GetInternationalOrganizationType('grand_alliance').GetName] schierata contro quella potenza. Man mano che il suo [gc_european_dominance|e] e il suo [gc_colonial_dominance|e] superano ciascuna soglia, i bonus ai [modifier|e] che l'[international_organization|e] concede ai suoi [members|e] si rafforzano"
 gc_grand_alliance_prospect_tt: "Se arrivassimo a temere [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName], potremmo unirci alla [GetInternationalOrganizationType('grand_alliance').GetName] contro quella potenza. Più salgono il suo [gc_european_dominance|e] e il suo [gc_colonial_dominance|e], più forti sono i bonus ai [modifier|e] che l'[international_organization|e] concede ai suoi [members|e]"
 gc_curb_dominance_peace_tt: "Sconfiggendo in guerra [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName] possiamo imporre un [peace_treaty|e] che riduce il suo [gc_european_dominance|e] o il suo [gc_colonial_dominance|e] di #Y 25#!"
 gc_dominance_growth_observer_tt: "[gc_hegemon.Custom('IT_La')|U][gc_hegemon.GetName] accresce a grandi passi il proprio [gc_european_dominance|e] e il proprio [gc_colonial_dominance|e] attraverso conquista, colonizzazione e arte di governo. Ogni soglia che supera rafforza la sua presa sull'epoca"
 gc_flashpoints_observer_tt: "Durante questa [situation|e] possono verificarsi per [gc_hegemon.Custom('IT_La')][gc_hegemon.GetName] degli [events|e] di [flashpoint|E]"
 gc_hegemon_backer_tt: "Siamo legati [gc_hegemon.Custom('IT_Alla')][gc_hegemon.GetName]. I suoi trionfi possono elevarci, ma la [GetInternationalOrganizationType('grand_alliance').GetName] si raduna contro quella potenza, e le sue guerre possono diventare le nostre"

 io_opinion_grand_alliance: "Membro della stessa $grand_alliance$"
 grand_alliance: "Grande Alleanza"
 grand_alliance_desc: "Una lega di potenze unite dalla paura di un Colosso in ascesa. Più quella potenza estende il proprio predominio su [ShowContinentNameWithNoTooltip('europe')] e sul Nuovo Mondo, più questa coalizione si rafforza in risposta, finché l'equilibrio dell'epoca dipenderà dalla possibilità di contenerlo. La sua guida spetta al suo membro più potente, e qualunque reame che tema o si opponga al Colosso può unirsi."
 gc_legend_colossus: "Il Colosso"
 gc_legend_colossus_desc: "La grande potenza il cui [gc_european_dominance|e] o [gc_colonial_dominance|e] in ascesa ha unito la $grand_alliance$ contro di sé."
 gc_legend_grand_alliance: "La $grand_alliance$"
 gc_grand_alliance_european_scaling: "Il [gc_european_dominance|e] del nostro nemico nel [GetSituationByKey('golden_century').GetName]"
 gc_grand_alliance_colonial_scaling: "Il [gc_colonial_dominance|e] del nostro nemico nel [GetSituationByKey('golden_century').GetName]"
