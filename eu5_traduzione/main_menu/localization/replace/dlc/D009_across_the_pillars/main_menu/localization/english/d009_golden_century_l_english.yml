 ga_declare_war_on_hegemon: "Chiama l'Alleanza alla Guerra"
 ga_declare_war_on_hegemon_desc: "Il Colosso non sarà riportato alla modestia con le argomentazioni; ci sarà riportato con la guerra. Come leader della $grand_alliance$, possiamo chiamare alle armi ogni membro e rimettere la questione del predominio all'unico tribunale il cui verdetto è definitivo."
 ga_only_leader_may_declare_tt: "Solo il [international_organization_leader_short|e] della [GetInternationalOrganizationType('grand_alliance').GetName] può chiamarla alla guerra"
 ga_dominance_threshold_tt: "Il [gc_european_dominance|e] o il [gc_colonial_dominance|e] del Colosso è superiore a #Y 75#!"
