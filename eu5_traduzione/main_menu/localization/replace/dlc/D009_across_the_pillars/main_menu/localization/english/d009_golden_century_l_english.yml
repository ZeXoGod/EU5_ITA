 ga_eu_50_bonus_tt: "Ogni [member|e] della $grand_alliance$ ottiene #Y -0.05#! di [ShowModifierTypeName('monthly_war_exhaustion')] e #Y +0.1#! di [ShowModifierTypeName('monthly_diplomats')]"
