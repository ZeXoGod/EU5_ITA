l_english:

 seven_cities_quivira.1.title: "Un Villaggio di Adobe nell'Erba"
 seven_cities_quivira.1.desc: "Dopo due mesi nelle pianure, la colonna ha raggiunto il paese descritto da El Turco. Qui c'è un insediamento, notevole per gli standard del mare d'erba, ma è una cittadina di case rotonde con tetto di paglia, non una capitale di pietra. Il capo è un uomo alto in un mantello di bufalo. La sua gente coltiva mais e fagioli nei fondovalle e caccia il bufalo nella pianura. Non c'è oro. El Turco, incalzato, ammette di essere stato mandato dai Pueblo per condurre la colonna il più lontano possibile dal loro paese. [target_leader.GetName] ordina di impiccarlo."
 seven_cities_quivira.1.a: "Leviamo il campo. Qui non c'è altro che erba e menzogne."
 seven_cities_quivira.1.historical_info: "Coronado raggiunse Quivira, da qualche parte nell'attuale Kansas, nell'estate del 1541. Il paese era abitato da agricoltori Wichita in villaggi di case d'erba lungo l'Arkansas. Non c'era oro. L'uomo Pawnee chiamato El Turco, che aveva guidato la colonna verso est dal Nuovo Messico con la promessa di un regno ricco, fu strangolato dai soldati Spagnoli per ordine di Coronado; aveva confessato che i Pueblo gli avevano ordinato di condurre gli Spagnoli nella pianura nella speranza che non tornassero mai più. Coronado ricondusse a piedi la colonna quell'inverno e riferì a Mendoza che nulla nel paese valeva l'esercito che sarebbe servito per tenerlo."

 seven_cities_quivira.2.title: "Un Paese Fertile, ma Senza Oro"
 seven_cities_quivira.2.desc: "Il paese che abbiamo raggiunto è ricco a modo suo: fondovalle ben irrigati carichi di mais, mandrie di bufali ai margini dei boschi, gente pacifica e disposta a commerciare. Il capo dona a [target_leader.GetName] una collana di pietre verdi di fiume che il cronista dapprima scambia per giada. L'orafo Spagnolo lo corregge: non è giada. È una pietra verde tenera a lui sconosciuta, bella ma senza valore commerciale in patria. Il paese non è quello che eravamo stati mandati a trovare, ma il paese è qualcosa. Le mappe saranno ridisegnate."
 seven_cities_quivira.2.a: "Portiamo le pietre a casa come curiosità. La terra è mappata."
 seven_cities_quivira.2.historical_info: "Gli ufficiali di Coronado riferirono che il paese delle Pianure era buono per il bestiame e il grano ma povero per il tipo di commercio che avrebbe potuto giustificare una presenza coloniale Spagnola. Il giudizio resse per più di due secoli; gli Spagnoli non colonizzarono mai le Grandi Pianure, e le incursioni Francesi e Britanniche che seguirono furono operazioni di empori commerciali, non colonie stabili, fino alla fine dell'Ottocento. Le pietre verdi che i Wichita diedero a Coronado non sono mai state identificate con certezza; l'ipotesi migliore è una serpentina tenera commerciata lungo i sistemi fluviali da fonti del sud-ovest."

 seven_cities_quivira.3.title: "La Leggenda Confermata"
 seven_cities_quivira.3.desc: "El Turco diceva la verità. Il paese qui è il paese che aveva descritto: un ricco regno di cittadine con mura di pietra tra fiumi e praterie, governato da un consiglio di capi in una grande casa di travi e turchesi. Qui c'è oro, setacciato dai torrenti che scendono dalle montagne occidentali. C'è argento nelle insegne dei capi. La gente, quando vengono mostrate le merci di scambio e al sacerdote è permesso di attraversare il villaggio indisturbato, è disposta a ricevere un'ambasciata. [target_leader.GetName] scrive per chiedere rinforzi prima ancora che il primo dispaccio sia sigillato."
 seven_cities_quivira.3.a: "Piantiamo lo stendardo. Rinforziamo. Il paese è trovato."
 seven_cities_quivira.3.historical_info: "Quivira fu la grande speranza mai realizzata dell'esplorazione Spagnola a nord della Nuova Spagna: un ricco regno dell'interno che, se fosse realmente esistito, avrebbe cambiato il corso della storia Nordamericana dando alla corona Spagnola una ragione per occupare le Pianure. Il mito si dimostrò abbastanza duraturo da far comparire Quivira sulle carte Europee all'incirca nella posizione corretta fino al Settecento, quando ormai il paese reale veniva cartografato da commercianti di pellicce Francesi che operavano dal sistema del Mississippi."

 seven_cities_quivira.10.title: "Due Guide"
 seven_cities_quivira.10.desc: "Due uomini delle pianure si presentano davanti alla spedizione, portati oltre l'oceano da un viaggio precedente e da allora mantenuti a spese del porto. Interrogato sul paese chiamato Quivira, il più anziano, [target_character.GetName], descrive un re che dorme sotto un albero adorno di campanelli d'oro, canoe con prue d'oro battuto, piatti d'argento lavorato su ogni tavola. Il più giovane, [second_guide.GetName], interrogato allo stesso modo, dice che il paese è erba, cielo e buoni fiumi, e che il suo popolo costruisce con la paglia e caccia i bovini gibbosi. Non possono descrivere entrambi la propria casa. Uno dei due avrà un posto a bordo."
 seven_cities_quivira.10.a: "Imbarchiamo il più anziano. L'oro non si inventa da solo."
 seven_cities_quivira.10.b: "Imbarchiamo il più giovane. La promessa più piccola è più facile da mantenere."
 quivira_gold_guide_tt: "[target_character.GetName] si unisce al viaggio come nostra guida"
 quivira_grass_guide_tt: "[second_guide.GetName] si unisce al viaggio come nostra guida"
 seven_cities_quivira.10.historical_info: "La spedizione di Coronado portò con sé fuori dal paese Pueblo due prigionieri delle Pianure come guide: l'uomo che gli Spagnoli chiamavano El Turco, che parlava di Quivira come di un regno dove il signore dormiva sotto un albero di campanelli d'oro e mangiava in piatti d'argento, e un Wichita chiamato Ysopete, che continuava a ripetere a chiunque volesse ascoltare che a Quivira non c'era oro e che El Turco mentiva. La colonna scelse di credere a El Turco. Fu la più costosa delle due decisioni, e fu presa, come disse poi un veterano, perché un esercito che ha marciato per mille leghe ha bisogno che la storia migliore sia vera."

 seven_cities_quivira.11.title: "Le Trenta Lance"
 seven_cities_quivira.11.desc: "Il continente è davanti a noi, e la probabilità che lo attraversiamo tutti è esigua. Il paese tra questo ancoraggio e Quivira non può nutrire una colonna delle nostre dimensioni; nel migliore dei casi può nutrirne trenta. [target_leader.GetName] stende i ruoli di arruolamento su un baule di bordo e, nome per nome, sceglie chi cavalcherà a nord e chi attenderà con le navi e le scorte. Ogni uomo del campo ha un'opinione sulla lista, e la maggior parte riguarda da che parte di essa dovrebbe cadere il proprio nome."
 seven_cities_quivira.11.a: "Trenta cavalieri e la bussola. Gli altri presidiano la costa."
 seven_cities_quivira.11.b: "Tutto il convoglio e le mandrie. Arriviamo come una potenza, o non arriviamo."
 quivira_train_left_behind_tt: "Le nostre guide e i nostri portatori restano indietro con il convoglio"
 seven_cities_quivira.11.historical_info: "Al Rio Grande, dopo un inverno di cattivi rapporti con i Pueblo e una primavera di scorte in calo, Coronado rimandò indietro il grosso del suo esercito e cavalcò verso Quivira con trenta cavalieri scelti, orientandosi nella pianura priva di punti di riferimento con la bussola e contando i passi di ogni giornata. Le pianure sconfissero i metodi ordinari: i gruppi che si allontanavano dalla vista della colonna sparivano, i punti di riferimento non esistevano, e le mandrie di bufali cancellavano ogni pista nel giro di poche ore. I trenta raggiunsero Quivira, un'impresa che trecento non avrebbero potuto compiere."

 seven_cities_quivira.12.title: "Il Mare d'Erba"
 seven_cities_quivira.12.desc: "La pianura non ha margini. Da dodici giorni la colonna marcia in un'erba che si richiude alle sue spalle come l'acqua, tra mandrie di bovini gibbosi che oscurano il terreno fino all'orizzonte. Una squadra di caccia è scomparsa alla vista il quarto giorno e da allora non se ne è più saputo nulla. Gli uomini segnano la pista di ritorno con mucchi di sterco di bufalo, non essendoci né pietre né alberi. La bussola e il passo contato sono tutta la geografia che abbiamo."
 seven_cities_quivira.12.desc_false_guide: "La guida è diventata silenziosa man mano che la pianura si faceva ampia. Non indica più i giorni che restano, e non incrocia più lo sguardo dell'uomo che guida. Ai fuochi gli uomini si ripetono le sue vecchie storie con una nuova asprezza nella voce, e [target_leader.GetName] ha raddoppiato la guardia su di lui senza che nessuno glielo chiedesse. Quaggiù non c'è nessun posto dove disertare. È l'unica cosa rassicurante di lui."
 seven_cities_quivira.12.desc_true_guide: "La guida che prometteva soltanto erba è stata di parola, e gli uomini cominciano ad accorgersi che ciò copre moltissimo. Legge il paesaggio come un pilota legge l'acqua: quali fiumi piegano a nord, dove le mandrie attraverseranno, quali stelle possono guidarci quando il terreno si rivela più difficile da navigare. Ogni notte traccia la posizione della colonna nella cenere per il cronista, e ogni giorno i segni si rivelano esatti. Nel suo paese non c'è oro, dice, ma ci sono cose peggiori che a un paese possano mancare."
 seven_cities_quivira.12.a: "Seguiamo la sua guida."
 seven_cities_quivira.12.b: "Fidiamoci dell'uomo che non ci ha mentito."
 seven_cities_quivira.12.c: "A nord con l'ago, contando ogni passo."
 seven_cities_quivira.12.historical_info: "I cronisti della spedizione di Coronado scrissero delle pianure con qualcosa di simile al delirio: un paese così piatto e privo di tratti distintivi che gli uomini che si allontanavano di un tiro d'arco dalla colonna si perdevano, dove l'erba si rialzava dietro i cavalli senza lasciare traccia, e dove l'unica navigazione era la bussola, i passi contati e i mucchi di ossa e sterco eretti come punti di riferimento. La confessione di El Turco, quando infine arrivò a Quivira, fu che i Pueblo gli avevano chiesto di condurre l'esercito in quella pianura e di perderlo lì. Ci era andato molto vicino, e l'ambiente stesso aveva fatto la maggior parte del lavoro."

 seven_cities_quivira.13.title: "I Bovini Gibbosi"
 seven_cities_quivira.13.desc: "Gli esploratori la segnalano dapprima come una nebbia bruna all'orizzonte, poi come una collina che si muove, e a mezzogiorno non si può più negare: bovini, gibbosi e irsuti, in numeri per cui nessun uomo della colonna ha parole. La mandria si divide attorno alla linea di marcia come un fiume attorno a uno scoglio, si richiude dietro di essa e prosegue fino al bordo del mondo in ogni direzione. Il quartiermastro la attraversa lentamente a cavallo, senza contare nulla, senza dire nulla, con l'aspetto di chi è entrato in un magazzino grande quanto una provincia."
 seven_cities_quivira.13.a: "Fermiamo la colonna e cacciamo finché le rastrelliere non sono piene."
 seven_cities_quivira.13.b: "Attraversiamo le mandrie. Diamo la caccia a leggende, non a bestiame."
 seven_cities_quivira.13.b.tt: "#italic La colonna si fa strada tra le mandrie per giorni senza fermarsi, e gli uomini mangiano manzo salato circondati da carne fresca#!"
 quivira_hides_and_meat_tt: "#Y Pelli e carne essiccata riempiono i fagotti, e i portatori le porteranno a casa#!"
 seven_cities_quivira.13.historical_info: "I cronisti della spedizione di Coronado faticarono a descrivere i bufali: vacche gibbose barbute come capre, scrissero, in mandrie che richiedevano giorni per essere attraversate a cavallo e lasciavano la pianura calpestata e spoglia dietro di sé. La colonna e i suoi alleati vissero interamente di quelle mandrie durante la marcia nelle pianure, e i resoconti dei veterani parlano con più meraviglia del bestiame che della stessa Quivira. Diversi conclusero che le mandrie fossero l'unica ricchezza offerta dal paese, e che la Spagna avesse già bovini."

