l_english:

 catholic_monarchs_law: "I Re Cattolici"
 catholic_monarchs_law_desc: "Il matrimonio che unisce le nostre corone è il fondamento di tutto ciò che seguirà. Il modo in cui la coppia reale sceglierà di regnare, da pari o con una casata preminente, plasmerà l'unione per le generazioni a venire."
 iu_establish_iberian_wedding_succession_tt: "Stabilisce un [ShowRelationTypeName('iberian_wedding_pact')] tra le due corone e imposta la loro [heir_selection|e] su [ShowHeirSelectionName('iberian_union_succession')], vincolando la loro successione affinché un erede comune possa unire i regni"

 composite_monarchy_law: "Monarchia Composita"
 composite_monarchy_law_desc: "I nostri regni sono uniti sotto un unico sovrano, ma ciascuno conserva le proprie leggi e le proprie libertà, dette #italic fueros#!. Dobbiamo decidere se onorare questi #italic fueros#! o riunire il loro governo in un'unica mano."

 asientos_law: "Asientos"
 asientos_law_desc: "La corona concede gli #italic asientos#!, contratti esclusivi per rifornire e approvvigionare i nostri domini d'oltremare, e chiunque li detenga trae profitto da ogni carico, mentre i regni che li evadono mantengono attive le proprie botteghe. L'unione deve decidere se la corona assegni questi contratti a se stessa o li condivida tra i mercanti di tutti i suoi regni."

 religious_authority_law: "Autorità Religiosa"
 religious_authority_law_desc: "Le nostre corone unite devono decidere come esercitare l'autorità della fede. La corona può dirigere la Chiesa all'interno dei nostri regni attraverso il #italic Patronato Real#!, oppure rivolgere questo zelo verso l'esterno come spada e scudo della cristianità."

 legislative_authority_law: "Autorità Legislativa"
 legislative_authority_law_desc: "Per volontà di chi saranno governati i regni? La legge può discendere dalla mano regia tramite #italic pragmáticas#! vincolanti, oppure poggiare sul consenso delle #italic Cortes#! proprie di ciascun regno."

 crown_settlement_law: "Assetto delle Corone"
 crown_settlement_law_desc: "La forma definitiva dell'unione deve essere stabilita. Una sola legge e una sola moneta potrebbero forgiare i molti regni in un'unica monarchia unificata, oppure le corone potrebbero perdurare come una solida partnership tra pari."

 union_of_arms_law: "Union de Armas"
 union_of_arms_law_desc: "La difesa dell'unione è il dovere di ogni regno che ne fa parte. Che sia tramite una quota obbligatoria o un contributo volontario, i regni porteranno insieme il peso delle armi."

 iu_tanto_monta_policy: "Tanto Monta"
 iu_tanto_monta_policy_desc: "#italic Tanto monta, monta tanto#! — i due sovrani regnano da pari, nessuno al di sopra dell'altro. Un'unione di pari dignità lega i regni in un rispetto reciproco e in un fronte dinastico comune."
 iu_tanto_monta_no_seniority_tt: "Nessun [ShowSpecialStatusName('senior_partner')] è designato in questo modo, e per l'[union|e] non si instaurano né [ShowPolicyName('union_establish_seniority_policy')] né [ShowPolicyName('union_senior_succession_law')]"

 iu_dynastic_primacy_policy: "Primato Dinastico"
 iu_dynastic_primacy_policy_desc: "Una corona è riconosciuta come la decana dell'unione, con la sua dinastia preminente tra i regni. La casata dominante ne trae il massimo prestigio, mentre tutti i membri condividono il rango di una monarchia sicura di sé."
 iu_dynastic_primacy_senior_only_tt: "Se siamo un [senior_partner|e]:"
 iu_dynastic_primacy_seniority_tt: "Quando questa [union|e] viene formata, il membro con la [economical_base|e] più grande è designato [ShowSpecialStatusName('senior_partner')], instaurando [ShowPolicyName('union_establish_seniority_policy')] e [ShowPolicyName('union_senior_succession_law')] per l'intera unione"

 iu_respect_fueros_policy: "Rispetto dei Fueros"
 iu_respect_fueros_policy_desc: "Le antiche libertà di ciascun regno sono confermate e protette. I regni minori si governano da sé in pace, mentre la corona maggiore si guadagna il rispetto dovuto a un sovrano fedele alle tradizioni dei suoi regni."

 iu_centralized_administration_policy: "Amministrazione Centralizzata"
 iu_centralized_administration_policy_desc: "Il governo dei regni è riunito sotto un'unica amministrazione. La corona maggiore estende la propria autorità, mentre i regni minori traggono legittimità dall'ordine di uno Stato unificato."

 iu_crown_asientos_policy: "Asientos della Corona"
 iu_crown_asientos_policy_desc: "La corona assegna da sé i contratti di approvvigionamento, concentrando il commercio e il suo numerario sul regno maggiore. I regni minori traggono profitto dal rifornimento dei domini, con la loro industria stimolata dalla domanda."

 iu_shared_asientos_policy: "Asientos Condivisi"
 iu_shared_asientos_policy_desc: "I contratti sono ripartiti tra i mercanti di ogni regno. I regni minori ottengono accesso diretto al lucroso commercio di approvvigionamento, mentre la corona maggiore gode dei beni a minor costo che circolano nella rete condivisa."

 iu_patronato_real_policy: "Patronato Real"
 iu_patronato_real_policy_desc: "Attraverso il #italic Patronato Real#!, la corona dirige la Chiesa nei nostri regni, nominandone i prelati e attingendo alle sue rendite. Una fede amministrata dal trono è una fede legata al trono."

 iu_catholic_champion_policy: "Campione della Fede"
 iu_catholic_champion_policy_desc: "Le nostre corone unite innalzano lo stendardo della cristianità, difendendo la fede davanti a ogni corte d'Europa. Che i nostri regni siano conosciuti come la spada e lo scudo della Chiesa, e che i nostri devoti ne siano onorati."

 iu_pragmaticas_policy: "Pragmáticas Reales"
 iu_pragmaticas_policy_desc: "La legge deve discendere dalla volontà regia. Con un decreto vincolante, le #italic pragmáticas#!, il sovrano legifera per tutti i regni contemporaneamente, senza attendere l'approvazione di alcuna assemblea."

 iu_regional_cortes_policy: "Cortes Regionali"
 iu_regional_cortes_policy_desc: "Ciascun regno si governa con il consenso delle proprie #italic Cortes#!. Il governo tramite le antiche assemblee conferisce legittimità a ogni corona e suggella l'unione in una lealtà liberamente accordata."

 iu_una_ley_una_moneda_policy: "Una Ley, Una Moneda"
 iu_una_ley_una_moneda_policy_desc: "Una sola legge e una sola moneta per tutti i nostri regni. Unificare le corone in questo modo attenua gli antichi confini, rafforzando i legami tra i molti regni fino a formare un'unica monarchia unificata, e permettendo ai regni minori di lavorare e commerciare ovunque liberamente come in patria."

 iu_perpetual_crown_policy: "Corona Federale Perpetua"
 iu_perpetual_crown_policy_desc: "L'unione è suggellata come un patto permanente tra corone. Una partnership stabile e duratura conferisce a ogni regno legittimità e stabilità, e il legame tra i membri è il più forte di tutta l'unione."

 iu_proportional_levy_policy: "Leva Proporzionale"
 iu_proportional_levy_policy_desc: "Ogni regno fornisce la propria parte di un esercito comune. L'unione leva così un esercito più vasto e più efficace, e la corona maggiore comanda le leve che si concentrano sotto la sua autorità."

 iu_negotiated_contribution_policy: "Contributo Negoziato"
 iu_negotiated_contribution_policy_desc: "I regni contribuiscono alla difesa comune per accordo reciproco anziché per obbligo. Il fardello sembra più leggero se portato di buon grado, e portarlo in tal modo favorisce la disciplina sul campo e l'armonia tra i membri."

 proclaim_spanish_monarchy: "Proclamare la Monarchia Spagnola"
 proclaim_spanish_monarchy_desc: "Dichiarare che le molte corone della nostra unione non formano più che un'unica monarchia unificata, e assumere il nome e la dignità della Spagna."
 proclaim_spanish_monarchy_integration_tt: "La nostra unione deve aver raggiunto un livello di integrazione di almeno 5"

 diplomatic_status_iberian_wedding_pact_name: "Patto Matrimoniale Iberico"
