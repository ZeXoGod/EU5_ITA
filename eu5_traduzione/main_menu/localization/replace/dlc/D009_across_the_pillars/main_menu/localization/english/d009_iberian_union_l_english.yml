 iberian_wedding_pact_effect_text_past: "[SCOPE.sCountry('actor').Custom('IT_La')|U][SCOPE.sCountry('actor').GetName] ha formato un Patto Matrimoniale Iberico con [SCOPE.sCountry('recipient').Custom('IT_La')][SCOPE.sCountry('recipient').GetName], vincolando la successione delle loro corone."
 diplomatic_status_iberian_wedding_pact_tooltip: "#T $diplomatic_status_iberian_wedding_pact_name$#!\nQueste corone condividono un Patto Matrimoniale Iberico. Se uno dei due sovrani muore senza un erede proprio, l'altro eredita il trono del primo, formando un'[union|e] tra i due paesi."
