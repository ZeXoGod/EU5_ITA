 iberian_union_succession: "Successione dell'Unione Iberica"
 iberian_union_succession_desc: "Un tipo di [heir_selection|e] utilizzato dalle monarchie Cristiane d'[ShowRegionName('iberia_region')] legate da un [ShowRelationTypeName('iberian_wedding_pact')]. Se uno dei sovrani dovesse morire senza un erede legittimo della propria linea, l'altro sovrano erediterebbe il trono del defunto, riunendo così le corone in un'[union|e]."
 iberian_union_succession_tt: "Formare un'[union|e] nel caso in cui il nostro successore non sia l'erede del nostro precedente sovrano"
