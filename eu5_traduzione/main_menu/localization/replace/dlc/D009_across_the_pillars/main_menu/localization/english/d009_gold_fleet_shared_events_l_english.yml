l_english:
 gold_fleet_shared_events.1.title: "Corsari all'Orizzonte"
 gold_fleet_shared_events.1.desc: "Sono state avvistate delle vele sopravvento, che calano sulla flotta senza alcuna bandiera. Sono le piccole e veloci imbarcazioni dei corsari delle isole, costruite per risalire il vento e svanire tra le secche dove nessun galeone può seguirle.\n\nSono tre o quattro, e hanno scelto bene il momento. Una notte di vento debole ha sparpagliato la flotta, e la nostra nave più arretrata, carica di tesori, è rimasta indietro di mezza lega rispetto alle altre."
 gold_fleet_shared_events.1.a: "Tutti ai posti di combattimento, respingiamoli."
 gold_fleet_shared_events.1.b: "Compriamoli prima che si avvicinino."
 gold_fleet_shared_events.1.c: "Spieghiamo tutte le vele e proviamo a distanziarli."
 gold_fleet_shared_events.1.d: "Segnaliamo all'altra flotta. Insieme li daremo alla caccia!"
 gold_fleet_shared_events.1.historical_info: "Corsari e pirati tormentarono le flotte del tesoro spagnole per tutto il XVI e il XVII secolo. Operando con lettere di marca reali o per proprio conto, impararono a sfruttare la geografia dei Caraibi, usando imbarcazioni a basso pescaggio per percorrere i canali tra le isole e isolare le navi separate da un convoglio da tempeste o venti contrari. I carichi d'argento erano abbastanza preziosi che persino una cattura parziale poteva finanziare un'intera spedizione di razzia."
 gold_fleet_shared_events.pirate_fight_fail_tt: "I corsari si rivelano troppo veloci e troppo numerosi — metà del carico va perduta prima che vengano respinti"
 gold_fleet_shared_events.pirate_flee_fail_tt: "I corsari raggiungono la flotta prima che riesca ad allontanarsi — un quarto del carico va perduto"

 gold_fleet_shared_events.2.title: "Una Squadra Nemica Intercetta la Flotta"
 gold_fleet_shared_events.2.desc: "L'avvertimento della vedetta arriva troppo tardi per tranquillizzarci. Navi da guerra calano sopravvento a vele spiegate, basse sull'acqua sotto il peso di cannoni e uomini, con bandiere ostili [ROOT.GetCountry.Custom('IT_Alla')][ROOT.GetCountry.GetName]. Sono navi di linea, abbastanza veloci da raggiungere la nave più lenta della flotta prima del tramonto.\n\nIl vento è contrario a ogni tentativo di fuga, e le stive custodiscono un intero anno di [ShowGoodsName('silver')] [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. [target_leader.GetName] deve scegliere se combattere, disperdersi o rassegnarsi a perdere tutto."
 gold_fleet_shared_events.2.a: "Formiamo la linea di battaglia e combattiamo."
 gold_fleet_shared_events.2.b: "Disperdiamo la flotta. Alcune navi potrebbero fuggire, altre no."
 gold_fleet_shared_events.2.c: "Voltiamoci e fuggiamo con il vento; li distanzieremo o perderemo tutto."
 gold_fleet_shared_events.2.historical_info: "La minaccia più grave per le flotte d'argento non veniva dai corsari isolati, ma dalle spedizioni navali sponsorizzate dagli stati rivali. L'ammiraglio olandese Piet Hein catturò un'intera flotta in rotta verso casa al largo della baia di Matanzas, a Cuba, nel 1628 — l'unica cattura completa di una flotta d'argento spagnola nella storia. Quando le grandi marine entravano in forze nelle acque caraibiche, i convogli scortati che bastavano contro piccoli predoni potevano essere sopraffatti da azioni organizzate di flotta."
 gold_fleet_shared_events.warship_fight_fail_tt: "La squadra nemica ha la meglio nello scontro — tre quarti del carico vanno perduti"
 gold_fleet_shared_events.warship_flee_fail_tt: "La squadra nemica raggiunge la flotta prima che riesca ad allontanarsi — metà del carico va perduta"

 gold_fleet_shared_events.3.title: "La Nostra Marina Intercetta una Flotta del Tesoro"
 gold_fleet_shared_events.3.desc: "Dispacci giungono dai Caraibi. La nostra squadra si è imbattuta in una flotta del tesoro nemica e l'ha costretta a combattere, spezzandone la formazione; più di uno dei nostri capitani si è comportato bene nello scontro. La notizia raggiungerà presto [ROOT.GetCountry.GetCapital.GetName], e le case di conteggio del nemico ancora prima.\n\nL'[ShowGoodsName('silver')] che attraversa queste acque paga gli eserciti del nemico e le sue alleanze. Ogni carico che prendiamo è un carico che non potranno spendere contro di noi."
 gold_fleet_shared_events.3.a: "I nostri capitani ci hanno servito bene. Siano ricompensati."
 gold_fleet_shared_events.3.historical_info: "La notizia di uno scontro con una flotta del tesoro poteva viaggiare più in fretta delle navi stesse, portata da rapidi vascelli dispaccio. Un'intercettazione riuscita era un evento diplomatico e finanziario di rilievo: la cattura anche solo parziale di un convoglio d'argento poteva finanziare per anni le operazioni di una squadra, mentre il mancato arrivo del convoglio si ripercuoteva sulle finanze reali, sul credito e sulla capacità di fare guerra in Europa."

 gold_fleet_shared_events.4.title: "La Flotta [ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('IT_Della')][ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip] Carica il Nostro Carico"
 gold_fleet_shared_events.4.desc: "La flotta [ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('IT_Della')][ROOT.GetCountry.GetDiplomacy.GetOverlord.GetName] è arrivata nel nostro porto, e i suoi fattori sono già nei nostri magazzini a contare ciò che è dovuto. Lingotti di [ShowGoodsName('silver')], monete, pellami e merci coloniali — tutto viene portato fuori sotto scorta armata e caricato a bordo per la traversata verso la Spagna.\n\nI conti [ROOT.GetCountry.Custom('IT_BURGHERS_DEL_NOSTRO')][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono tenuti con cura, e si sa all'oncia ciò che lascia oggi la banchina. Ci sono voluti mesi per radunarlo, e [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] ne risentirà la mancanza fino al raccolto della prossima stagione."
 gold_fleet_shared_events.4.a: "Forniamo ciò che esige [ROOT.GetCountry.GetDiplomacy.GetOverlord.Custom('IT_La')][ROOT.GetCountry.GetDiplomacy.GetOverlord.GetNameWithNoTooltip], nulla di più."
 gold_fleet_shared_events.4.historical_info: "I porti coloniali esistevano in uno stato di dipendenza commerciale forzata dalla madrepatria. Tutto il commercio coloniale doveva passare per canali autorizzati, e i mercanti e le élite creole che producevano l'argento, i pellami e le materie coloranti vedevano la maggior parte del profitto affluire alla corona e alle case mercantili di Siviglia anziché a se stessi — una tensione strutturale che si approfondì nel corso dei secoli coloniali."

 gold_fleet_shared_events.5.title: "Il Mare si Rivolta Contro di Noi"
 gold_fleet_shared_events.5.desc: "Il cielo a est ha preso il colore di un livido, e l'onda lunga cresce rapidamente. Una grande tempesta sta calando sulla flotta, e ormai non è più possibile sfuggirle. Il vento sale fino a un urlo nel sartiame mentre [target_leader.GetName] dà l'ordine che deciderà quante navi vivranno per rivedere acque calme.\n\nPossiamo serrare la formazione e affrontare insieme la tempesta, affidandoci alla perizia marinara e alla fortuna, oppure disperdere le navi e gettare il carico in mare per tenerle a galla."
 gold_fleet_shared_events.5.a: "Serriamo la formazione e affrontiamo insieme la tempesta."
 gold_fleet_shared_events.5.b: "Disperdiamo le navi e alleggeriamo il carico."
 gold_fleet_shared_events.5.c: "Corriamo al riparo di un porto amico e riparamo i danni."
 gold_fleet_shared_events.5.unscathed_tt: "La flotta tiene unita la formazione e supera la tempesta indenne"
 gold_fleet_shared_events.5.lose_fleet_tt: "La tempesta si porta via parte della flotta, e metà del carico affonda con le navi"
 gold_fleet_shared_events.5.lose_all_tt: "La flotta viene sopraffatta e perduta con tutto l'equipaggio, e la spedizione termina qui"
 gold_fleet_shared_events.5.lose_cargo_tt: "Il carico viene gettato in mare per tenere a galla le navi, e parte del bottino va perduta"
 gold_fleet_shared_events.5.historical_info: "Gli uragani atlantici erano il nemico più mortale delle flotte del tesoro, più rovinoso di qualunque corsaro. La flotta di Tierra Firme del 1622 perse otto navi a causa di un uragano al largo delle Florida Keys, tra cui la #italic Nuestra Señora de Atocha#!, il cui relitto carico d'argento non fu recuperato per tre secoli e mezzo. Nel 1715 un'intera flotta in rotta verso casa fu spinta contro la costa della Florida da un uragano di luglio, annegando circa un migliaio di uomini. I comandanti giunsero a temere la stagione molto più di qualunque vela nemica."

 gold_fleet_shared_events.6.title: "Febbre Sottocoperta"
 gold_fleet_shared_events.6.desc: "Il calore sottocoperta è una creatura viva, e con esso è arrivata la malattia. Uomini che montavano la guardia una settimana fa ora giacciono sudati nel buio, e il chirurgo può fare ben poco se non contare i caduti e sperare che gli altri vengano risparmiati. Acqua guasta, spazi angusti e aria dei tropici hanno fatto ciò che nessun corsaro avrebbe potuto.\n\n[target_leader.GetName] deve decidere come la flotta risponderà alla febbre prima che svuoti del tutto gli equipaggi."
 gold_fleet_shared_events.6.a: "Fermiamoci e sbarchiamo i malati finché la febbre non passa."
 gold_fleet_shared_events.6.b: "Non possiamo perdere la stagione a causa della malattia. Incalziamo l'equipaggio."
 gold_fleet_shared_events.6.c: "Facciamo scalo per acqua fresca e arruoliamo uomini sani a terra."
 gold_fleet_shared_events.6.historical_info: "La malattia uccideva molti più uomini a bordo della #italic Carrera de Indias#! di tempeste e azioni nemiche messe insieme. Le lunghe traversate, l'acqua salmastra, le provviste salate e le stive affollate favorivano scorbuto, dissenteria e tifo, mentre i porti tropicali dei Caraibi erano serbatoi di malaria e di altre febbri mortali capaci di decimare un equipaggio nel giro di poche settimane dall'arrivo. Una flotta che si attardava troppo nelle Indie rischiava di tornare in patria con troppe poche braccia per governare le navi, e i capitani bilanciavano il pericolo del mare con quello più lento e più sicuro della febbre."

 gold_fleet_shared_events.7.title: "Chiacchiere in Taverna"
 gold_fleet_shared_events.7.desc: "A [target_leader.GetName] giunge notizia che uno degli ufficiali della flotta, ubriaco fradicio in una taverna del porto, ha dissertato sulla nostra data di partenza, sulla rotta di ritorno e sulla ricchezza delle nostre stive. Un porto coloniale è un nido di orecchie straniere — fattori, contrabbandieri e uomini che venderebbero un segreto a qualunque capitano corsaro con denaro da spendere.\n\nIl danno potrebbe essere già fatto, ma il modo in cui risponderemo deciderà se si diffonderà ulteriormente."
 gold_fleet_shared_events.7.a: "Trasciniamolo davanti all'albero maestro a subire l'ira [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 gold_fleet_shared_events.7.b: "Cambiamo la data di partenza e la rotta che intendiamo seguire."
 gold_fleet_shared_events.7.c: "Diffondiamo voci contrastanti e intorbidiamo le acque."
 gold_fleet_shared_events.7.rumours_worse_tt: "Le false voci non fanno che infittire le chiacchiere sul molo, e la notizia della vera rotta si diffonde più lontano che mai — il pericolo del viaggio aumenta (#G +1#! Livello di Pericolo)"
 gold_fleet_shared_events.7.rumours_better_tt: "Le false piste attecchiscono, e qualunque capitano in agguato viene mandato a inseguire ombre — il pericolo del viaggio diminuisce (#R -1#! Livello di Pericolo)"
 gold_fleet_shared_events.7.historical_info: "Le date di partenza delle flotte del tesoro erano tra le informazioni più preziose del mondo atlantico. Corsari e ammiragliati rivali mantenevano reti di informatori nei porti caraibici e a Siviglia, e una data di partenza o una rotta pianificata trapelate potevano trasformare una crociera speranzosa in un'intercettazione certa. La corona spagnola custodiva gelosamente i dettagli della #italic flota#!, ma una flotta che si radunava in un affollato porto coloniale non poteva mai davvero mantenere i propri segreti, e le chiacchiere a terra erano un pericolo ben noto ai comandanti."

 gold_fleet_shared_events.cargo_loaded_tt: "Il tesoro della stagione viene caricato nelle stive della flotta"
 gold_fleet_shared_events.cargo_gain_tt: "Il valore del carico della flotta aumenta"
 gold_fleet_shared_events.cargo_loss_tt: "Parte del carico della flotta va perduta"
 gold_fleet_shared_events.danger_up_1_tt: "Il pericolo del viaggio aumenta (#G +1#! Livello di Pericolo)"
 gold_fleet_shared_events.danger_up_2_tt: "Il pericolo del viaggio aumenta (#G +2#! Livello di Pericolo)"
 gold_fleet_shared_events.danger_down_1_tt: "Il pericolo del viaggio diminuisce (#R -1#! Livello di Pericolo)"
 gold_fleet_shared_events.cargo_damaged_on_return_tt: "Il carico consegnato riflette le perdite subite in precedenza durante il viaggio"
