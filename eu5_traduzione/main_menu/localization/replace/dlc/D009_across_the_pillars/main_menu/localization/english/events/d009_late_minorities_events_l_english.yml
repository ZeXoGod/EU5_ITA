l_english:
 d009_late_minorities.1.title: "Il Movimento Messianico Sabbatiano"
 d009_late_minorities.1.entry: "$d009_late_minorities.1.title$"
 d009_late_minorities.1.desc: "Un mistico di nome [target_character.GetName] si è dichiarato il Messia tanto atteso a [ShowLocationName('smyrna')], e la notizia ha infiammato i nostri sudditi di fede [ShowReligionAdjective('judaism')] di un entusiasmo che nessuna cautela di rabbino sembra capace di spegnere. Intere congregazioni [ShowCultureName('sephardi')] abbandonano i propri mestieri e si preparano a un ritorno a Sion che i nostri stessi funzionari non sanno né confermare né smentire. Se questo passerà come una febbre di stagione o rimodellerà la comunità per sempre non è ancora chiaro, e la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] è divisa sull'opportunità stessa di intervenire."
 d009_late_minorities.1.a: "Lasciamo che il movimento faccia il suo corso."
 d009_late_minorities.1.b: "Soffochiamo il fervore."
 d009_late_minorities.1.b.tt: "I nostri sudditi di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] si fanno risentiti per la repressione"
 d009_late_minorities.1.historical_info: "Sabbatai Zevi, nato a Smirne nel 1626, si proclamò Messia Ebraico nel 1665, accendendo un'ondata di fervore messianico che attraversò le comunità Ebraiche da Amsterdam allo Yemen, comprese ampie parti della diaspora Sefardita. Le autorità Ottomane lo arrestarono infine nel 1666, ponendolo davanti alla scelta tra la conversione all'Islam e l'esecuzione."
 variable_d009_sabbatean_movement_allowed_tt: "Il Movimento Sabbatiano è stato Lasciato Diffondere, e Sabbatai Zevi è Ancora Vivo"

 d009_late_minorities.2.title: "L'Apostasia di Sabbatai"
 d009_late_minorities.2.entry: "$d009_late_minorities.2.title$"
 d009_late_minorities.2.desc: "Alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] è giunta voce che [target_character.GetName], tenuto in custodia dal [ROOT.GetCountry.GetGovernment.GetRulerTitle], si è convertito alla fede [ShowReligionGroupName('muslim')] pur di non affrontare l'esecuzione, un tradimento agli occhi dei suoi credenti più fervidi, benché un piccolo numero insista che la conversione di facciata di [target_character.GetHerHis] celi una verità che solo i fedeli possono percepire. Ciò che resta del movimento si frantuma ora tra disperazione, apostasia silenziosa e la testarda convinzione che il cammino del Messia fosse semplicemente più complicato di quanto chiunque avesse inizialmente supposto."
 d009_late_minorities.2.a: "Costringiamo i fedeli a seguire il suo esempio."
 d009_late_minorities.2.a.entry: "Costringiamo i fedeli a seguire l'esempio di Sabbatai Zevi."
 d009_late_minorities.2.a.tt: "I nostri devoti sudditi di fede [ShowReligionAdjective('judaism')] sono turbati dalle conversioni forzate"
 d009_late_minorities.2.b: "Lasciamo che il movimento si disperda in silenzio."
 d009_late_minorities.2.historical_info: "Le autorità Ottomane che arrestarono Sabbatai Zevi gli offrirono la scelta tra l'esecuzione e la conversione all'Islam, ed egli scelse la seconda nel 1666, assumendo il nome di Mehmed Efendi. Una piccola cerchia di seguaci a Salonicco e altrove seguì il suo esempio all'esterno continuando a praticare in segreto una versione sincretica del rituale Ebraico, divenendo nota come i Dönme. La maggior parte dei credenti del più ampio movimento, tuttavia, tornò semplicemente alla normale vita Ebraica, disillusa ma non convertita."

 d009_late_minorities.3.title: "L'#italic Haskalah#!, l'Illuminismo di Fede [ShowReligionAdjectiveWithNoTooltip('judaism')]"
 d009_late_minorities.3.entry: "$d009_late_minorities.3.title$"
 d009_late_minorities.3.desc: "Ad [ShowLocationName('amsterdam')] giunge notizia di un nuovo movimento che si agita tra le comunità di fede [ShowReligionAdjective('judaism')] delle terre tedesche, uno che esorta gli Ebrei a mettere da parte l'isolamento del ghetto e ad adottare la lingua, l'abbigliamento e il sapere del mondo più ampio che li circonda. I nostri stessi mercanti e studiosi di fede [ShowReligionAdjectiveWithNoTooltip('judaism')] discutono se una simile apertura arricchirebbe questa comunità o semplicemente la dissolverebbe per intero nella popolazione circostante di fede [ShowReligionGroupAdjective('christian')]."
 d009_late_minorities.3.a: "Abbracciamo l'istruzione laica e l'integrazione civica."
 d009_late_minorities.3.b: "Difendiamo i tradizionali confini comunitari."
 d009_late_minorities.3.historical_info: "Gli scritti filosofici di Moses Mendelssohn a Berlino diedero origine all'#italic Haskalah#!, o Illuminismo Ebraico, a partire dagli anni 1770, incoraggiando le comunità Ebraiche di tutta Europa a confrontarsi con la filosofia, la letteratura e la vita civica laiche accanto allo studio religioso. Le comunità Sefardita e Ashkenazita di Amsterdam furono tra le prime al di fuori delle terre tedesche a discuterne seriamente le idee, data la cultura intellettuale Ebraica già insolitamente aperta della città."

 d009_late_minorities.4.title: "Il #italic Sanhedrin#! di Napoleone"
 d009_late_minorities.4.entry: "$d009_late_minorities.4.title$"
 d009_late_minorities.4.desc: "[target_character.GetName] ha convocato rabbini e importanti laici da [ROOT.GetCountry.Custom('IT_Dalla')][ROOT.GetCountry.GetName] e oltre a un Grande #italic Sanhedrin#!, riunito per stabilire una volta per tutte se la legge [ShowReligionAdjective('judaism')] possa essere conciliata con i doveri di un cittadino di questa repubblica. I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vedono l'occasione di attirare finalmente queste comunità nella piena vita civica; i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] vedono uno stato che si spinge in questioni che non lo riguardano."
 d009_late_minorities.4.a: "Concediamo la piena emancipazione civile."
 d009_late_minorities.4.b: "Manteniamo le vecchie restrizioni."
 d009_late_minorities.4.historical_info: "Napoleone convocò l'Assemblea dei Notabili Ebrei nel 1806 e il Grande #italic Sanhedrin#! nel 1807 per stabilire se la legge Ebraica fosse compatibile con la cittadinanza francese, concludendo infine che lo era, a condizione che le comunità Ebraiche accettassero l'autorità dello stato su questioni civili come il matrimonio e il prestito di denaro. La decisione segnò un passo importante verso l'emancipazione giuridica degli Ebrei in tutta l'Europa napoleonica, benché la piena uguaglianza rimanesse contesa e incompleta nella pratica per decenni."
 variable_our_napoleon_tt: "È Emerso un Generale Conquistatore Simile a Napoleone"
 variable_d009_jewish_emancipation_tt: "Gli Ebrei [GetCountry('FRA').GetCulture.Custom('IT_CUL_MP')] sono stati Emancipati per Legge"

 d009_late_minorities.5.title: "Il [GetCountry('MOR').Custom('GetRulerOrRegentTitle')] [GetCountry('MOR').Custom('IT_ADJ_MS')] e gli Ebrei Emancipati"
 d009_late_minorities.5.entry: "$d009_late_minorities.5.title$"
 d009_late_minorities.5.desc: "I resoconti di mercanti [ROOT.GetCountry.Custom('IT_ADJ_MP')] di ritorno [GetCountry('FRA').Custom('IT_Dalla')][GetCountry('FRA').GetName] descrivono un nuovo ordine che vi si sta affermando, in cui i sudditi di fede [ShowReligionAdjective('judaism')] stanno davanti alla legge esattamente come ogni altro cittadino. La notizia è giunta alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] stessa del [ROOT.GetCountry.GetGovernment.GetRulerTitle], e non pochi dei nostri ministri si chiedono ad alta voce se i mallāḥ [ROOT.GetCountry.Custom('IT_DEL_RANGO')][ROOT.GetCountry.GetFlavorRank] debbano attendersi qualcosa di simile, o se tali idee appartengano all'Europa e a nessun altro luogo."
 d009_late_minorities.5.a: "Riconosciamo il loro pari status."
 d009_late_minorities.5.b: "Manteniamo le vecchie restrizioni dhimmi."
 d009_late_minorities.5.historical_info: "La notizia dell'emancipazione degli Ebrei francesi raggiunse il Marocco attraverso canali diplomatici e mercantili europei negli anni successivi al 1807, provocando una discussione inconcludente alla corte marocchina sullo status giuridico dei propri sudditi Ebrei. Nessun cambiamento formale seguì in questo periodo: il tradizionale quadro dhimmi che regolava le comunità Ebraiche del Marocco persistette in gran parte intatto fino all'epoca del protettorato francese del XX secolo."

 d009_late_minorities.6.title: "Il Ricordo di al-'Andalus"
 d009_late_minorities.6.entry: "$d009_late_minorities.6.title$"
 d009_late_minorities.6.desc: "Tra le comunità esiliate da [ShowRegionName('iberia_region')] stabilitesi nel nostro regno, versi e canti che rievocano al-'Andalus, un paradiso che i loro antenati chiamarono un tempo casa e persero, circolano ancora alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] come nei ritrovi privati, mantenuti vivi ormai più dalla poesia che da qualunque memoria vivente. Alcuni di noi vorrebbero vedere quel ricordo incoraggiato come segno dell'ospitalità di questo regno; altri preferirebbero lasciare che i vecchi rancori verso [ShowRegionNameWithNoTooltip('iberia_region')] svaniscano in silenzio nella leggenda prima che si induriscano in qualcosa di più acuto."
 d009_late_minorities.6.a: "Commissioniamo un'opera che celebri quell'eredità."
 d009_late_minorities.6.b: "Consideriamola una nostalgia innocua."
 d009_late_minorities.6.historical_info: "L'idea di al-'Andalus come paradiso perduto mise radici profonde nella memoria sia Sefardita sia Musulmana andalusa in tutto il Maghreb, romanticizzata in poesia, musica e più tardi architettura molto dopo che ogni realistica speranza di ritorno era svanita. Nel XVIII e XIX secolo questa nostalgia era diventata tanto una tradizione letteraria e artistica a sé stante quanto una genuina memoria politica, una che sarebbe stata poi invocata da movimenti molto diversi per scopi molto diversi."
