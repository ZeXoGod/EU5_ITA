l_english:
 agraw_federation_reform: "Federazione Agraw"
 agraw_federation_reform_desc: "L'#italic agraw#! — l'assemblea deliberativa dei villaggi e dei clan degli altipiani cabili — governa senza un esecutivo centrale: le decisioni prese in consiglio vincolano tutti i clan partecipanti, e nessuna carica può prevalere sulla voce collettiva degli anziani riuniti. Questa struttura federale ci rende quasi impermeabili al metodo di conquista consueto — non c'è alcun trono da prendere, alcun palazzo da bruciare, alcun trattato singolo da ripudiare — e riunisce i villaggi in un'unica unità amministrativa senza imporre loro l'apparato di un sultano lontano. Accettiamo una deliberazione più lenta come prezzo di un autogoverno autentico, e constatiamo che il nostro popolo, lasciato alle proprie assemblee, ha ben poche ragioni di rivoltarsi contro di esse."
 alg_dey_regency_reform: "Reggenza di Algeri"
 alg_dey_regency_reform_desc: "La Reggenza di Algeri ha sviluppato una forma di governo distintiva: un #italic dey#! eletto dal corpo dei giannizzeri dell'esercito, un aga al comando delle forze di terra e un #italic divan#! di ufficiali superiori che insieme costituiscono sia il gabinetto sia il parlamento dello stato. Non si tratta di una dinastia — il #italic dey#! risponde al corpo che lo ha creato, e un #italic dey#! che perde la fiducia dell'#italic odjak#! raramente dura una stagione — ma è un sistema stabile nel suo genere, che produce uno stato corsaro-militare amministrativamente capace, con una proiezione navale e commerciale ben superiore alla sua popolazione. Abbiamo codificato questo assetto come forma costituzionale della Reggenza, accettando l'instabilità della successione militare in cambio di un esercito che si governa da sé e di un tesoro alimentato dal mare."
 amenokal_paramountcy_reform: "Supremazia dell'Amenokal"
 amenokal_paramountcy_reform_desc: "L'#italic amenokal#! — capo supremo della confederazione Tuareg — governa non attraverso una burocrazia, ma grazie all'autorità personale del suo titolo, alle insegne del tamburo di carica e alla lealtà della casta nobile degli #italic imashaghen#!, che impongono la sua volontà ai clan dispersi. Il suo potere è allo stesso tempo personale e confederale: abbastanza reale da mobilitare le cavalcature e le lance di ogni membro della confederazione, abbastanza diffuso da proiettarsi per centinaia di leghe di deserto senza una guarnigione a presidiare ogni oasi. Abbiamo codificato questa struttura suprema come nostra forma di governo, concentrando il coordinamento diplomatico e militare nella persona dell'amenokal e lasciando il governo quotidiano di ciascun clan alle sue consuetudini."
 amir_al_muslimin: "Amīr al-Muslimīn"
 amir_al_muslimin_desc: "Il titolo di #italic Amīr al-Muslimīn#! — Comandante dei Musulmani — fu portato dai sultani Almoravidi che attraversarono il Sahara per salvare al-'Andalus dall'invasione cristiana, e dai nostri antenati Marinidi che tornarono più volte oltre lo Stretto per la stessa causa. Aver strappato lo Stretto alle flotte di Castiglia e Aragona ci ha collocati in quella stirpe: protettori dell'ultima frontiera occidentale dell'Islam, riconosciuti nella khuṭba di ogni moschea da Fez al Guadalquivir. Questo titolo lega le comunità andaluse al nostro trono, riempie i nostri stendardi di guerrieri volenterosi della fede e porta il nostro nome a ogni corte musulmana che osserva la penisola Iberica."
 anr_coprincipality_reform: "Struttura di Co-Principato"
 anr_coprincipality_reform_desc: "La terra di Andorra è governata secondo un assetto costituzionale unico: la sovranità congiunta di due co-principi, il Vescovo di Urgell e il Conte di Foix, le cui rivendicazioni concorrenti hanno paradossalmente prodotto un equilibrio stabile. Nessuno dei due sovrani può agire senza il consenso dell'altro, e questo controllo reciproco ha preservato Andorra dall'assorbimento da parte di entrambi i vicini. Abbiamo formalizzato questa struttura di co-principato come fondamento costituzionale del nostro regno, accettando le limitazioni che essa pone all'azione unilaterale in cambio del riparo diplomatico che offre."
 ara_diputacion_general_reform: "Diputación General de Aragón"
 ara_diputacion_general_reform_desc: "La #italic Diputació General d'Aragó#! nacque come commissione permanente delle Cortes d'Aragona incaricata di sovrintendere alla riscossione dei sussidi concessi alla Corona, e da allora è divenuta un'istituzione permanente di governo. Amministrata da #italic Diputados#! eletti tra i tre Ceti, garantisce la responsabilità fiscale e difende i #italic fueros#! costituzionali dalle ingerenze regie. La Diputación si riunisce tutto l'anno, trasformando quella che un tempo era un'assemblea occasionale in un organo continuo di autogoverno Aragonese."
 basque_juntas_generales_reform: "Juntas Generales"
 basque_juntas_generales_reform_desc: "Le #italic Juntas Generales#! sono le tradizionali assemblee rappresentative delle province basche, che si riuniscono sotto l'antica quercia di Gernika per deliberare su leggi, tassazione e difesa dei diritti locali. Ogni provincia mantiene il proprio #italic fuero#!, un corpo di diritto consuetudinario che ogni signore deve giurare di rispettare prima che la sua autorità sia riconosciuta. Le Juntas rappresentano una forma di autogoverno decentrato unica nella [ShowRegionName('iberia_region')], che nessuna Corona centralizzatrice è riuscita ad abolire senza provocare una feroce resistenza."
 cas_santa_hermandad_reform: "Santa Hermandad"
 cas_santa_hermandad_reform_desc: "La #italic Santa Hermandad#! è una polizia regia permanente incaricata di sorvegliare le strade e di reprimere il brigantaggio in tutto il nostro regno. Fondata dall'autorità congiunta di Ferdinando e Isabella, sostituisce le antiche confraternite municipali con una forza centralizzata che risponde alla Corona. L'#italic Hermandad#! garantisce che la sicurezza dei viaggi e del commercio si estenda alle campagne, portando la portata della giustizia regia ben oltre le mura delle città."
 cas_santa_hermandad_unlocks_hermandad_infantry_tt: "Permette di reclutare [ShowUnitDefinitionName('a_hermandad_infantry')]"
 cas_santa_hermandad_unlocks_summon_santa_hermandad_tt: "Sblocca l'[cabinet_action|e] [ShowCabinetActionName('summon_santa_hermandad')]"
 cat_corts_catalanes_reform: "Corts Catalanes"
 cat_corts_catalanes_reform_desc: "Le #italic Corts Catalanes#! sono una delle più antiche assemblee rappresentative d'Europa, organizzate in tre bracci — il clero, la nobiltà e il #italic braç reial#! che rappresenta le città regie. Nessuna tassazione straordinaria può essere imposta senza il consenso di tutti e tre i bracci, e la Corona deve rispondere alle rimostranze dell'assemblea prima che qualunque sussidio sia concesso. Questa costituzione a tre bracci definisce la compagine Catalana come un patto tra sovrano e sudditi, in cui la sovranità non risiede nel solo monarca ma nell'insieme organico del regno."
 cat_generalitat_reform: "Generalitat de Catalunya"
 cat_generalitat_reform_desc: "La #italic Generalitat de Catalunya#! fu istituita come commissione permanente delle Corts Catalane, incaricata di amministrare i sussidi e di governare tra una sessione e l'altra dell'assemblea plenaria. Col tempo è divenuta l'incarnazione istituzionale delle libertà costituzionali Catalane, un corpo continuo di rappresentanti eletti che costringe la Corona a rispettare i propri obblighi giurati. La permanenza della Generalitat trasforma la tradizione parlamentare Catalana da assemblea occasionale a realtà quotidiana di governo."
 diwan_of_the_azzaba_reform: "Dīwān al-'Azzāba"
 diwan_of_the_azzaba_reform_desc: "Il #italic Dīwān al-'Azzāba#! — il consiglio degli studiosi religiosi ibaditi che fungono al contempo da giuristi, arbitri e governatori — è la forma politica unica della pentapoli del Mzab, e la più vicina approssimazione dell'originario ideale ibadita di una comunità governata dai più dotti anziché dai più potenti. Qui Stato e fede non sono separati: gli #italic 'Azzāba#! tengono corte nella moschea, si pronunciano sulle dispute commerciali nello stesso quadro dottrinale delle questioni teologiche, e l'autorità legittima richiede il consenso di questo consiglio clericale prima di poter agire. Abbracciamo questa austerità come principio costituzionale: il nostro regno non sarà governato come si governano i regni, ma come una comunità di credenti responsabili davanti a Dio e gli uni verso gli altri."
 glc_xunta_xeral_reform: "Xunta Xeral do Reino de Galicia"
 glc_xunta_xeral_reform_desc: "La #italic Xunta Xeral do Reino de Galicia#! è l'assemblea rappresentativa del nostro regno, che riunisce i delegati delle sette province della Galizia per deliberare su tassazione, giustizia e difesa dei diritti regionali. In quanto istituzione permanente, offre alla nobiltà, al clero e alle città galiziane un canale formale attraverso cui negoziare con la Corona e salvaguardare le consuetudini particolari di questo angolo della [ShowRegionName('iberia_region')]. L'autorità duratura della #italic Xunta#! ha reso la Galizia una delle periferie meglio governate della penisola."
 gra_hajib_reform: "Ḥājib ad-Dawla"
 gra_hajib_reform_desc: "La carica di #italic Ḥājib#! — ciambellano e primo ministro — è il perno attorno al quale ruota l'amministrazione del nostro Emirato. L'Ḥājib coordina la casa reale, sovrintende all'amministrazione finanziaria del #italic dīwān#! e funge da principale intermediario tra il sultano e l'apparato burocratico dello stato. Formalizzando e rafforzando questa carica, concentriamo il lavoro quotidiano di governo nelle mani di un unico amministratore capace, liberando il sultano per le esigenze della guerra e della diplomazia e assicurando al contempo il buon funzionamento del regno."
 jamaa_parliament: "Jamā'a"
 jamaa_parliament_desc: "L'organo consultivo permanente del nostro emirato, che riunisce sotto un unico tetto il #italic qāḍī al-jamā'a#!, il #italic wazīr#!, lo #italic šayḵ al-ḡuzāt#! e i principali clan della frontiera, così che nessuna fazione parli più forte dell'insieme."
 lon_cortes_de_leon_reform: "Cortes de León"
 lon_cortes_de_leon_reform_desc: "Le #italic Cortes de León#! — convocate per la prima volta nel 1188 sotto Alfonso IX — sono tra le più antiche assemblee rappresentative della storia europea, e precedono il Parlamento inglese di quasi un secolo. Riunendo il clero, la nobiltà e i rappresentanti delle città, stabilirono il principio secondo cui il monarca deve cercare il consiglio di tutti i ceti prima di imporre nuovi obblighi. Questa tradizione costituzionale fondativa conferisce al nostro governo una legittimità radicata non nella sola conquista, ma nel consenso formale del regno."
 mll_universitat_de_mallorca_reform: "Universitat de Mallorca"
 mll_universitat_de_mallorca_reform_desc: "L'#italic Universitat de la Ciutat i Regne de Mallorca#! è l'organo di governo del nostro regno insulare, amministrato da #italic Jurats#! eletti che sovrintendono a tassazione, opere pubbliche e interessi delle comunità borghesi e mercantili. La sua lunga tradizione di autogoverno municipale ha fatto della classe mercantile la forza dominante negli affari Maiorchini, assicurando che la politica commerciale e l'amministrazione dei porti riflettano le esigenze di chi trae profitto dal mare. La competente amministrazione civica dell'Universitat è la colonna portante della prosperità Maiorchina."
 mor_marinid_zenata_confederation_reform: "Confederazione Zenata Marinide"
 mor_marinid_zenata_confederation_reform_desc: "I #italic Banū Marīn#! uscirono a cavallo da [ShowLocationName('figuig')] come signori della cavalleria [ShowCultureName('zenati')] e presero [ShowLocationName('fez')] alla declinante dinastia [ShowDynastyName('almohad_dynasty')] grazie alla coesione tribale e a uno stendardo di ortodossia [ShowReligiousSchoolName('maliki_school')]. La nostra dinastia [ShowDynastyName('marinid_dynasty')] poggia ancora su entrambi i pilastri: i clan [ShowCultureNameWithNoTooltip('zenati')] cavalcano quando [GetCountry('MOR').GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][GetCountry('MOR').GetGovernment.GetRulerTitle|l] li convoca, i #italic fuqahā'#! benedicono il [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] governo, e il #italic jihād#! in al-'Andalus risponde a entrambi. [GetCountry('MOR').GetGovernment.GetRuler.Custom('IT_ART_TITOLO')|U][GetCountry('MOR').GetGovernment.GetRulerTitle|l] [ShowDynastyNameWithNoTooltip('marinid_dynasty')] comanda perché il [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] seguito tribale obbedisce e il [GetCountry('MOR').GetGovernment.GetRuler.GetHerHis] corpo di studiosi acconsente, e deve continuare a dimostrare entrambe le cose con la spada."
 mor_sharifian_sultanate_reform: "Sultanato Sharifiano"
 mor_sharifian_sultanate_reform_desc: "I sultani sharifiani hanno trasformato il Marocco da una confederazione dipendente dalle sue leve tribali in una monarchia centralizzata la cui autorità scaturisce sia dalla santità genealogica sia dalla disciplina militare. Le tribù di servizio #italic jīš#! si insediano sulle terre della corona, gli artiglieri andalusi si addestrano nel poligono d'artiglieria di Fez, e il grande apparato del #italic maḵzan#! sposta registri fiscali e ordinanze giudiziarie attraverso il regno con una regolarità che i Marinidi non raggiunsero mai. È la forma di stato che trasforma la nostra #italic baraka#! — il sacro carisma della discendenza dal Profeta — da pretesa di legittimità in un sistema di governo: un sultanato che è al tempo stesso una dinastia, una burocrazia e un tribunale religioso."
 nav_cortes_navarra_reform: "Cortes de Navarra"
 nav_cortes_navarra_reform_desc: "Le Cortes di Navarra riuniscono i tre ceti del regno — clero, nobiltà e città — in un organo il cui consenso è necessario per qualunque tassazione straordinaria o legislazione importante. Più antiche della maggior parte dei parlamenti iberici, le Cortes Navarresi hanno gelosamente custodito le libertà tradizionali del regno e mantenuto i codici di leggi particolari che distinguono la Navarra dai suoi vicini più grandi. Istituzionalizzando questa assemblea, riconosciamo formalmente che l'autorità della Corona fluisce attraverso e con il consenso dei ceti."
 por_estado_da_india_reform: "Estado da Índia"
 por_estado_da_india_reform_desc: "L'#italic Estado da Índia#! è il quadro amministrativo formale attraverso cui [GetCountry('POR').Custom('IT_La')][GetCountry('POR').GetName] governa la sua vasta rete di empori, fortezze e colonie in Asia. Amministrato dalla sede viceregia di Goa, coordina flotte, guarnigioni ed entrate di un impero marittimo che si estende dal Golfo Persico al Mar Cinese Meridionale. Centralizzando il governo coloniale sotto un'unica autorità viceregia, l'#italic Estado#! consente alla Corona di estrarre entrate e proiettare potenza ben oltre quanto potrebbe sostenere una qualunque impresa commerciale privata da sola."
 ribat_state_tradition_reform: "Tradizione dello Stato-Ribaṭ"
 ribat_state_tradition_reform_desc: "Il #italic ribaṭ#! — il monastero fortificato da cui il movimento almoravide organizzò la propria avanzata attraverso il Sahara e su per il Maghreb — è più di un edificio: è un modello di governo, in cui la confraternita religioso-militare occupa una rete di fortezze e moschee da cui amministra il territorio circostante grazie alla pietà della sua guarnigione anziché al libro paga di una burocrazia civile. Abbiamo ereditato questa tradizione: la nostra compagine è governata da nodi fortificati anziché da un unico palazzo, i nostri amministratori sono al tempo stesso guerrieri e uomini di religione, e la nostra legittimità poggia sulla disciplina costante della frontiera anziché sulla genealogia di una dinastia. Questa austerità di governo ci dona posizioni strenuamente difese, un clero che combatte e una forza combattente che prega."
 tun_husaynid_beylik_reform: "Beylik Husaynide"
 tun_husaynid_beylik_reform_desc: "Dove il quadro ottomano aveva insediato governatori a rotazione che rispondevano alla Porta, il #italic bey#! husaynide trasformò il #italic beylik#! di Tunisi in una dinastia ereditaria in tutto fuorché nel nome, negoziando una finzione costituzionale — sovranità ottomana nominale, governo dinastico effettivo — che durò fino all'epoca moderna. Gli Husaynidi costruirono un'amministrazione capace basata sul gabinetto, preservarono la continuità culturale ifrīqyana e gestirono l'equilibrio tra il legame ottomano sempre più nominale e le esigenze pratiche della diplomazia europea con più raffinatezza della maggior parte delle compagini comparabili. Abbiamo istituzionalizzato questo ibrido: uno stato governato dinasticamente, amministrativamente moderno nel suo apparato di gabinetto e abbastanza prestigioso da trattare come sovrano riconosciuto pur mantenendo la copertura teologica della sovranità islamica."
