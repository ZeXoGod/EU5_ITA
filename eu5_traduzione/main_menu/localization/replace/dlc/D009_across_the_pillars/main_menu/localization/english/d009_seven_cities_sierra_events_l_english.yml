l_english:

 seven_cities_sierra.1.title: "La Montagna del Re Bianco"
 seven_cities_sierra.1.desc: "Dopo otto mesi nel Chaco, la colonna ha raggiunto le pendici che le guide Guaraní descrivevano come il paese della montagna d'argento. Il paese è aspro, spezzato da saline e fiumi in secca; le pendici, una volta raggiunte, sono nuda roccia rossa; i torrenti che ne scendono non portano argento. Le guide, incalzate, dicono di essere state mandate dal consiglio Guaraní per condurre la colonna il più lontano possibile dal proprio paese, nella speranza che non facesse ritorno. [target_leader.GetName] ne fa impiccare due e congeda gli altri. La marcia di ritorno sarà affamata."
 seven_cities_sierra.1.a: "Facciamo dietrofront. La montagna d'argento è una storia dei Guaraní."
 seven_cities_sierra.1.historical_info: "La leggenda della Sierra de la Plata, la montagna d'argento al centro dell'interno Sudamericano, fu data per buona dalla corona Spagnola per gran parte del Cinquecento e fu la principale motivazione della fondazione di Asunción, concepita come base di partenza per la spedizione che avrebbe conquistato il paese dell'argento. Il vero argento delle Ande meridionali si rivelò trovarsi più a ovest, a Potosí, e vi si arrivava per tutt'altra via; il paese di fiumi e praterie tra Asunción e le Ande si dimostrò tanto povero quanto i primi esploratori avevano sperato che fosse ricco."

 seven_cities_sierra.2.title: "Argento sulle Pendici"
 seven_cities_sierra.2.desc: "Il paese che abbiamo raggiunto è un paese d'argento, anche se non nel senso cataclismatico promesso dalla leggenda. Ci sono miniere d'argento in attività in due delle valli pedemontane che abbiamo rilevato, gestite da comunità locali sotto un capo disposto a ricevere un'ambasciata Spagnola. La produzione è modesta per gli standard Andini. Ma il paese è reale, le miniere esistono, e il commercio può essere aperto a condizioni che non richiedono un'occupazione militare completa. [target_leader.GetName] negozia un accordo commerciale e il pagamento di un tributo simbolico."
 seven_cities_sierra.2.a: "Firmiamo l'accordo. Un argento modesto ma costante vale molto."
 seven_cities_sierra.2.historical_info: "I versanti orientali delle Ande centrali contengono effettivamente giacimenti d'argento sfruttabili commercialmente, anche se molto meno della cordigliera di Potosí più a ovest. Piccole attività minerarie Spagnole furono avviate nell'attuale Argentina settentrionale e Bolivia meridionale alla fine del Cinquecento, in genere sotto accordi di encomienda con le popolazioni locali Diaguita e Chicha. La Sierra de la Plata della leggenda, l'intera montagna d'argento, non fu mai trovata perché non c'era mai stata; la reale struttura geologica dell'economia argentifera Andina era una rete distribuita di giacimenti minori, dei quali Potosí fu l'unico di dimensioni sufficienti a diventare una leggenda a sé."

 seven_cities_sierra.3.title: "La Montagna d'Argento"
 seven_cities_sierra.3.desc: "Il paese descritto dalla leggenda è reale, e la colonna lo ha trovato. Qui c'è una montagna, aperta in tre punti, con il minerale d'argento in superficie in filoni spessi una mano, e il saggiatore riferisce un tenore superiore a qualsiasi cosa documentata finora nelle Indie. I signori Chicha che controllano le pendici sono disposti a ricevere un'ambasciata; il loro interesse sono gli attrezzi di ferro e i cavalli Spagnoli, non essere conquistati. Il trattato può essere negoziato. La montagna è aperta. [target_leader.GetName] manda tre cavalieri alla costa con campioni sigillati in scatole di piombo. La corona non avrà bisogno di molto per essere convinta."
 seven_cities_sierra.3.a: "Firmiamo il trattato. Costruiamo la strada. La montagna è trovata."
 seven_cities_sierra.3.historical_info: "La montagna d'argento di Potosí, la vera montagna con cui la leggenda della Sierra de la Plata fu confusa a posteriori, non fu scoperta da una spedizione Spagnola mossa dalla leggenda; fu scoperta nel 1545 da un minatore indigeno il cui nome varia nelle fonti, che ne riferì l'esistenza alle autorità Spagnole di Cuzco. La montagna produsse più argento di qualsiasi altro sito al mondo per quasi due secoli e divenne il motore monetario dell'economia globale della prima età moderna. La leggenda, in questo senso, era vera; aveva solo sbagliato leggermente la geografia."

 seven_cities_sierra.10.title: "Argento dall'Occidente"
 seven_cities_sierra.10.desc: "Era stato dato per morto anni fa, perduto con un viaggio finito sugli scogli molto più a sud, e stamattina si presenta al cancello chiedendo della spedizione per nome. Nel pugno stringe un fazzoletto annodato, e nel fazzoletto c'è argento: una fibbia e due perline appiattite di metallo lavorato, scambiate di mano in mano, dice [target_character.GetName], da un paese nel profondo dell'interno dove un Re Bianco regna su una montagna di argento. L'uomo non sa scrivere il proprio nome e non è mai stato colto in errore su una costa. Il saggiatore morde le perline, le pesa e gliele restituisce senza una parola."
 seven_cities_sierra.10.a: "Seguiamo la sua strada. Prendiamolo con noi come guida."
 seven_cities_sierra.10.b: "Compriamo ogni pezzo che porta con sé, e con esso il suo silenzio."
 plata_castaway_road_tt: "[target_character.GetName] si unisce al viaggio e segna sulle nostre carte la propria strada nell'interno"
 plata_silver_in_hand_tt: "L'argento del naufrago si aggiunge al bottino della spedizione"
 seven_cities_sierra.10.historical_info: "Aleixo Garcia, un marinaio Portoghese naufragato sull'isola di Santa Catarina con i sopravvissuti della spedizione di Solís nel 1516, sentì dire dai suoi ospiti Guaraní di un Re Bianco sulle montagne occidentali che governava un paese d'argento. Intorno al 1524 seguì quella storia nell'entroterra e divenne il primo Europeo a toccare la ricchezza delle Ande, tornando con argento razziato alla frontiera Inca anni prima che Pizarro vedesse il Perù. Garcia fu ucciso sulla via del ritorno, ma il suo argento continuò a viaggiare: alcuni pezzi raggiunsero la costa, passarono nelle mani degli equipaggi di Sebastiano Caboto e lo persuasero ad abbandonare il viaggio verso le Molucche e a risalire il fiume che avrebbe ribattezzato Río de la Plata, il fiume dell'argento, dal nome di un metallo che non aveva mai portato."

 seven_cities_sierra.11.title: "Un'Orda Senza Bandiere"
 seven_cities_sierra.11.desc: "I fuochi del consiglio ardono fino a tardi, e al mattino l'offerta giunge tramite gli interpreti: i popoli del fiume marceranno con noi contro il paese del Re Bianco. Non come guide e non come portatori, ma come un esercito, forte di migliaia di uomini, con le proprie ragioni. I loro nonni razziavano il paese di montagna prima che uno di noi avesse attraversato l'oceano, e ricordano le strade e i guadi della terra assetata che si estende nel mezzo. Gli ufficiali sono divisi. Un'orda di quelle dimensioni non può morire di fame lungo la strada, dice uno. Un'orda di quelle dimensioni, dice un altro, non può arrivare come altro che una guerra."
 seven_cities_sierra.11.a: "Accettiamo l'orda. Nessuna colonna attraversa da sola la terra assetata."
 seven_cities_sierra.11.b: "Rifiutiamo con dei doni. I piccoli gruppi passano dove gli eserciti si infrangono."
 seven_cities_sierra.11.historical_info: "Quando Aleixo Garcia andò a ovest intorno al 1524 non viaggiò come esploratore con dei portatori: marciò con un'orda di guerra Guaraní di migliaia di uomini, unendosi a una spedizione che i Guaraní stavano organizzando per i propri scopi contro la frontiera Inca. La forza congiunta attraversò il Chaco, la terra assetata che gli Spagnoli avrebbero imparato a temere, e colpì gli avamposti dell'impero con tale profondità che gli Inca fortificarono poi la frontiera. La storia Europea archivia l'incursione sotto la voce esplorazione. Dal lato dei Guaraní del registro, a un marinaio straniero con la barba era stato permesso di unirsi a una guerra che stavano combattendo comunque."

 seven_cities_sierra.12.title: "La Frontiera del Re Bianco"
 seven_cities_sierra.12.desc: "Le pendici sono finalmente davanti a noi, azzurre e immense, e i villaggi ai loro piedi ne portano la prova: argento lavorato al collo e al polso, più fine di tutto ciò che la costa ci ha mostrato. Sopra i villaggi i passi salgono verso il paese da cui l'argento proviene, e su quel paese i discorsi si fanno sommessi. I signori della montagna tengono il conto dei passi, dicono gli abitanti. Contano chi sale. Non sono noti per contare chi scende."
 seven_cities_sierra.12.desc_castaway: "I segnavia del naufrago sono finiti. Questa valle è quanto lontano sia mai arrivato, ammette, fermo dove il sentiero si piega verso i passi; l'argento che portava gli fu scambiato qui, su questo terreno, e proveniva dalle montagne soprastanti. Oltre questo punto la sua geografia è la stessa diceria di tutti gli altri, ed è abbastanza onesto da dirlo ad alta voce, cosa che gli uomini trovano più difficile da perdonare di una bugia. Ciò che resta della sua strada è la direzione che indica: in alto."
 seven_cities_sierra.12.a: "Nei passi. La montagna è abbastanza vicina da toccarla."
 seven_cities_sierra.12.b: "Commerciamo ai piedi della montagna. Anche la pazienza compra argento."
 plata_silver_seized: "#Y L'incursione nelle valli di frontiera ritorna carica di argento lavorato#!"
 plata_host_shields_the_raid: "#Y L'orda dei nostri alleati copre l'incursione, che ritorna carica di argento lavorato#!"
 plata_frontier_rises: "#Y I passi si svuotano davanti a noi, e poi le montagne rispondono in forze#!"
 seven_cities_sierra.12.historical_info: "La frontiera Inca non era una linea su una mappa ma una zona presidiata, e rispose. L'orda di Aleixo Garcia fu dispersa sulla via del ritorno intorno al 1525 e Garcia fu ucciso insieme alla maggior parte dei suoi uomini. Juan de Ayolas ripeté lo schema nel 1537: attraversò il Chaco, raggiunse il paese dell'argento, caricò la sua colonna di bottino e cadde in un'imboscata e fu annientato con tutto il suo gruppo a Candelaria durante il ritorno, dopo aver mancato l'appuntamento con le navi. L'argento era reale e la montagna era reale, ma per trent'anni ogni strada che vi conduceva passava attraverso qualcuno che la fortificava dalla prima incursione. Potosí, quando gli Spagnoli finalmente la tennero nel 1545, fu raggiunta dall'altro versante."

 seven_cities_sierra.13.title: "Il Mare Dolce"
 seven_cities_sierra.13.desc: "A un giorno dall'approdo, l'acqua cambia. Lo scandagliatore la assaggia, sputa e la assaggia di nuovo. Viene convocato il mastro botte, poi i piloti, e nel giro di un'ora la voce ha percorso tutta la nave: il mare è diventato dolce. Nessun fiume del mondo conosciuto spinge la sua acqua così lontano dalla terra. I piloti discutono su quale paese possa alimentare una simile foce, e gli uomini si sporgono dal parapetto guardando a ovest il nulla, bevendo l'oceano dal cavo delle mani perché è gratis."
 seven_cities_sierra.13.desc_castaway: "L'acqua sotto la chiglia è diventata dolce stamattina, e mentre i piloti ancora discutevano su cosa significasse, il naufrago è salito sul ponte, ne ha assaggiata una manciata e ha annuito come si annuisce davanti al proprio cancello di casa. È l'acqua del fiume, dice. Lo discese una volta con dell'argento nella camicia. Da qualche parte dietro la foschia occidentale il fiume si restringe, e comincia la strada verso il Re Bianco."
 seven_cities_sierra.13.a: "Chiamiamolo nei dispacci: il Fiume d'Argento."
 seven_cities_sierra.13.b: "Scandagliamo la foce e rileviamola prima di battezzare alcunché."
 seven_cities_sierra.13.historical_info: "Juan Díaz de Solís entrò nel grande estuario nel 1516 e lo chiamò Mar Dulce, il mare dolce, per l'acqua fresca che incontrò le sue navi molto al largo. Fu ucciso dalla gente della sponda settentrionale mentre tentava il primo sbarco. I sopravvissuti della sua spedizione, naufragati sulla via del ritorno a Santa Catarina, comprendevano Aleixo Garcia, il cui argento avrebbe poi messo in marcia verso l'interno ogni spedizione di questa parte del mondo. Sebastiano Caboto rinominò quelle acque Río de la Plata, il fiume dell'argento, verso la fine degli anni 1520 sulla scorta di quelle storie. L'argento delle Ande non scese mai lungo quel fiume durante la sua vita, ma il nome rimase, e col tempo l'intero paese alla foce del fiume lo adottò: Argentina, la terra dell'argento."

