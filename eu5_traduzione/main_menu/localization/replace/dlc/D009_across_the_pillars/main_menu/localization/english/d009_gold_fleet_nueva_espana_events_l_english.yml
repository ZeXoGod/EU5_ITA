l_english:
 gold_fleet_nueva_espana_events.1.title: "Rotta verso la Nuova Spagna"
 gold_fleet_nueva_espana_events.1.desc_prefix: "La flotta è armata e pronta a [departure_port.GetName]. Acqua e provviste sono a bordo, insieme agli attrezzi di ferro e al mercurio che le colonie non possono procurarsi da sole, e [target_leader.GetName] tiene in mano gli ordini [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')].\n\nIl viaggio è lungo, oltre le Canarie e attraverso i Caraibi fino alle coste della Nuova Spagna"
 gold_fleet_nueva_espana_events.1.desc_suffix: "attendono le nostre stive. Se vogliamo riportare in patria in sicurezza la ricchezza della stagione, la flotta deve salpare ora."
 gold_fleet_nueva_espana_events.1.desc: "$gold_fleet_nueva_espana_events.1.desc_prefix$, dove [ShowGoodsName('silver')] e [ShowGoodsName('dyes')] $gold_fleet_nueva_espana_events.1.desc_suffix$"
 gold_fleet_nueva_espana_events.1.desc.rich: "$gold_fleet_nueva_espana_events.1.desc_prefix$. [ShowGoodsName('silver')] di [silver_source.GetName] e [ShowGoodsName('dyes')] di [dye_source.GetName] $gold_fleet_nueva_espana_events.1.desc_suffix$"
 gold_fleet_nueva_espana_events.1.a: "Salpiamo. La flotta parte con la marea del mattino."
 gold_fleet_nueva_espana_events.1.historical_info: "La #italic Flota de Nueva España#! era uno dei due convogli che componevano la #italic Carrera de Indias#! spagnola. Serviva il Viceregno della Nuova Spagna, raccogliendo l'argento delle miniere di Zacatecas, Guanajuato e altri giacimenti messicani attraverso il porto di San Juan de Ulúa presso Veracruz, insieme a merci di alto valore tra cui la cocciniglia di Oaxaca, l'indaco, la vaniglia e il cacao. La #italic flota#! partiva di norma dalla Spagna in primavera e tornava in autunno, unendosi ai galeoni di Tierra Firme all'Avana per la traversata atlantica combinata. La rotta attraverso il Passaggio della Mona, tra Hispaniola e Porto Rico, era il consueto punto d'ingresso nei Caraibi orientali."

 gold_fleet_nueva_espana_events.2.title: "La Ricchezza della Nuova Spagna"
 gold_fleet_nueva_espana_events.2.desc_prefix: "Abbiamo raggiunto [loot_port.GetName], e le case di conteggio sono al lavoro da settimane. [ShowGoodsName('silver')] è giunto a dorso di mulo da"
 gold_fleet_nueva_espana_events.2.desc_middle: ", e accanto giacciono balle di [ShowGoodsName('dyes')]"
 gold_fleet_nueva_espana_events.2.desc_suffix: "che a [departure_port.GetName] si scambiano con il proprio peso in [ShowGoodsNameWithNoTooltip('silver')].\n\nL'ultimo [ShowGoodsNameWithNoTooltip('silver')] della stagione è ancora in viaggio dall'interno. Possiamo attendere l'intero convoglio e riempire ogni stiva, oppure prendere ciò che è già stato radunato e proseguire prima che la stagione delle tempeste chiuda la costa."
 gold_fleet_nueva_espana_events.2.desc: "$gold_fleet_nueva_espana_events.2.desc_prefix$ ogni miniera dell'interno$gold_fleet_nueva_espana_events.2.desc_middle$ $gold_fleet_nueva_espana_events.2.desc_suffix$"
 gold_fleet_nueva_espana_events.2.desc.rich: "$gold_fleet_nueva_espana_events.2.desc_prefix$ [silver_source.GetName]$gold_fleet_nueva_espana_events.2.desc_middle$ provenienti da [dye_source.GetName] $gold_fleet_nueva_espana_events.2.desc_suffix$"
 gold_fleet_nueva_espana_events.2.a: "Attendiamo il convoglio e riempiamo le stive di [ShowGoodsNameFlat('silver')] e [ShowGoodsNameFlat('dyes')]."
 gold_fleet_nueva_espana_events.2.b: "Prendiamo solo ciò che è già stato radunato."
 gold_fleet_nueva_espana_events.2.c: "La stagione si fa troppo pericolosa. Torniamo in patria con ciò che abbiamo."
 gold_fleet_nueva_espana_events.2.historical_info: "Veracruz, il cui ancoraggio era difeso dalla fortezza insulare di San Juan de Ulúa, era l'unico porto legale di ingresso e di partenza per il commercio atlantico della Nuova Spagna. La città sorgeva su un banco di sabbia malarico, esposto ai #italic nortes#!, violente tempeste da nord, il che rendeva pericolosa la stagione dell'imbarco. L'argento messicano veniva estratto principalmente dai grandi complessi minerari di Zacatecas (scoperta nel 1546) e Guanajuato, trasportato a dorso di mulo fino alla costa e caricato sotto scorta armata. La cocciniglia, un vivido colorante scarlatto ricavato da insetti allevati sui fichi d'India di Oaxaca, era tra le merci più preziose del Nuovo Mondo dopo l'argento; la Spagna ne mantenne gelosamente il monopolio, e questo trasformò le industrie tessili d'Europa."

 gold_fleet_nueva_espana_events.3.title: "L'Appuntamento a [rendezvous_port.GetNameWithNoTooltip]"
 gold_fleet_nueva_espana_events.3.desc.together: "La flotta ha raggiunto [rendezvous_port.GetName], dove i galeoni di Tierra Firme sono già all'ancora sotto i cannoni della fortezza, con le stive cariche di [ShowGoodsName('silver')] quanto le nostre. Da qui le due flotte compiranno insieme la traversata atlantica, a nord con la Corrente del Golfo e poi a est, oltre la costa della Florida.\n\nSi dice che vele nemiche attendano lungo quella rotta, ma un convoglio di queste dimensioni è una preda difficile da catturare. [target_leader.GetName] deve decidere come la flotta unita risponderà alla minaccia prima di salpare per la Spagna."
 gold_fleet_nueva_espana_events.3.desc.alone: "La flotta ha raggiunto [rendezvous_port.GetName] e giace all'ancora sotto i cannoni della fortezza. Nessun galeone di Tierra Firme è qui ad unirsi a noi; compiremo la traversata atlantica da soli, a nord con la Corrente del Golfo e poi a est, oltre la costa della Florida.\n\nSi dice che vele nemiche attendano lungo quella rotta, e una flotta solitaria è un bersaglio allettante. [target_leader.GetName] deve decidere come rispondere alla minaccia prima di salpare per la Spagna."
 gold_fleet_nueva_espana_events.3.a: "Assoldiamo navi da guerra aggiuntive dalla guarnigione di [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_nueva_espana_events.3.b: "La velocità ci servirà più dei cannoni. Salpiamo all'alba."
 gold_fleet_nueva_espana_events.3.c: "Il pericolo è troppo grande. Sverniamo qui e salpiamo la prossima stagione."
 gold_fleet_nueva_espana_events.3.historical_info: "L'Avana divenne il punto di raccolta obbligatorio per la flotta d'argento di ritorno dopo che Filippo II formalizzò il sistema dei convogli nel 1566. Il profondo porto naturale della città e la sua posizione affacciata sul Canale della Florida ne fecero il naturale punto d'incontro sia per i galeoni di Tierra Firme sia per la Flota de Nueva España prima della comune traversata atlantica. La costruzione del Castillo de los Tres Reyes del Morro a partire dal 1589 fu una risposta diretta alla minaccia dei corsari stranieri. L'incursione del 1628 dell'ammiraglio olandese Piet Hein, che catturò l'intera flotta di ritorno al largo della baia di Matanzas, resta il più spettacolare successo mai ottenuto da un nemico del sistema dei convogli spagnolo."

 gold_fleet_nueva_espana_events.8.title: "In Attesa della Flotta di Tierra Firme"
 gold_fleet_nueva_espana_events.8.desc: "La flotta ha raggiunto [rendezvous_port.GetName], ma i galeoni di Tierra Firme non sono ancora risaliti da sud. Gli ordini [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] sono chiari: le flotte del tesoro devono attraversare l'Atlantico unite, con i cannoni concentrati contro i corsari che si aggirano nel Canale della Florida.\n\nQuindi getteremo l'ancora sotto la fortezza e li attenderemo, confidando che non tardino a giungere."
 gold_fleet_nueva_espana_events.8.a: "Attendiamo l'altra flotta."
 gold_fleet_nueva_espana_events.8.historical_info: "I due convogli del tesoro della #italic Carrera de Indias#! — la #italic Flota de Nueva España#! e i #italic Galeones de Tierra Firme#! — dovevano riunirsi all'Avana e attraversare insieme l'Atlantico, in modo che la loro scorta combinata potesse respingere i corsari e le occasionali squadre nemiche. In pratica le flotte arrivavano spesso in ritardo, e un convoglio che mancava il proprio compagno doveva scegliere tra svernare all'Avana o sfidare da solo la traversata."

 gold_fleet_nueva_espana_events.9.title: "La Flotta Attende Ancora"
 gold_fleet_nueva_espana_events.9.desc: "Sono passate settimane all'ancora a [rendezvous_port.GetName], e i galeoni di Tierra Firme ancora non sono arrivati. Le provviste scarseggiano, gli uomini si fanno inquieti, e ogni giorno all'ancora è un giorno in cui la stagione volge ulteriormente contro una traversata sicura.\n\n[target_leader.GetName] deve decidere se resistere in attesa dell'appuntamento o tentare la sorte nell'Atlantico senza di loro."
 gold_fleet_nueva_espana_events.9.a: "Attendiamo ancora un po'. La traversata è molto più sicura insieme."
 gold_fleet_nueva_espana_events.9.b: "Abbiamo atteso abbastanza. Salpiamo per la Spagna senza di loro."
 gold_fleet_nueva_espana_events.9.historical_info: "I tempi decidevano il destino delle flotte del tesoro. Un convoglio che si attardava troppo all'Avana rischiava di essere sorpreso dalla stagione degli uragani caraibici o dalle burrasche invernali dell'Atlantico, mentre uno che salpava troppo presto perdeva la protezione del numero. I comandanti soppesavano il pericolo della traversata contro il costo dell'attesa, e non tutte le flotte scelsero di attendere la propria compagna."

 gold_fleet_nueva_espana_events.10.title: "Dividere la Flotta"
 gold_fleet_nueva_espana_events.10.desc: "[target_leader.GetName] viene a sapere che anche [secondary_port.GetName] è aperto a noi, con i magazzini colmi di [ShowGoodsName('goods_gold')] e pellami. Si potrebbe distaccare una squadra per raccogliere anche quella ricchezza, anche se ciò significherebbe dividere le nostre forze in acque pericolose.\n\nPossiamo trattenere la flotta qui a [loot_port.GetNameWithNoTooltip] finché il distaccamento non farà ritorno, oppure proseguire verso [rendezvous_port.GetNameWithNoTooltip] e lasciare che ci raggiunga lì."
 gold_fleet_nueva_espana_events.10.a: "Teniamo unita la flotta. Prendiamo ciò che abbiamo e proseguiamo."
 gold_fleet_nueva_espana_events.10.b: "Distacchiamo una squadra a [secondary_port.GetNameWithNoTooltip] e attendiamone il ritorno."
 gold_fleet_nueva_espana_events.10.c: "Distacchiamo una squadra a [secondary_port.GetNameWithNoTooltip]; proseguiamo verso [rendezvous_port.GetNameWithNoTooltip]."
 gold_fleet_nueva_espana_events.10.historical_info: "Le flotte del tesoro raramente caricavano l'intero carico da un solo porto. Squadre venivano regolarmente distaccate per raccogliere argento, pellami e materie coloranti dai porti secondari prima che il convoglio si riunisse per la traversata atlantica. Dividere la flotta aumentava il bottino, ma esponeva le squadre più piccole ai corsari che infestavano i passaggi tra le isole."
 gold_fleet_nueva_espana_events.10.danger_tt: "Dividere la flotta indebolisce entrambe le squadre, aumentando il pericolo di questo viaggio (#G +1#! Livello di Pericolo)"
 gold_fleet_nueva_espana_events.10.a.tt: "La flotta resta unita e prosegue senza il carico di [secondary_port.GetName]."
 gold_fleet_nueva_espana_events.together_danger_suffix: "riduce il pericolo di questo viaggio."
 gold_fleet_nueva_espana_events.havana_together_danger_tt: "Navigare insieme alla flotta di Tierra Firme $gold_fleet_nueva_espana_events.together_danger_suffix$"
 gold_fleet_nueva_espana_events.awaiting_fleet_tt: "La flotta attenderà qui all'ancora l'arrivo della flotta di Tierra Firme, per quanto tempo ci voglia"
 gold_fleet_nueva_espana_events.hold_longer_tt: "La flotta continua ad attendere all'ancora l'altra flotta del tesoro"

 gold_fleet_nueva_espana_events.11.title: "Il Distaccamento Fa Ritorno"
 gold_fleet_nueva_espana_events.11.desc: "La squadra inviata a [secondary_port.GetName] è tornata a [loot_port.GetName], con le stive colme di [ShowGoodsName('goods_gold')] e pellami. La flotta è di nuovo unita, e più sicura per questo."
 gold_fleet_nueva_espana_events.11.a: "Imbarchiamo il carico. La flotta prosegue unita."
 gold_fleet_nueva_espana_events.11.historical_info: "Le flotte del tesoro raramente caricavano l'intero carico da un solo porto. Le squadre distaccate per raccogliere argento, pellami e materie coloranti dai porti secondari dovevano ricongiungersi al convoglio principale prima che questo proseguisse, ripristinando la consistenza numerica della flotta e la sua sicurezza nella traversata che l'attendeva."

 gold_fleet_nueva_espana_events.12.title: "Il Distaccamento si Ricongiunge Presso Cuba"
 gold_fleet_nueva_espana_events.12.desc: "La squadra distaccata a [secondary_port.GetName] ha raggiunto la flotta mentre questa si avvicina a [rendezvous_port.GetNameWithNoTooltip], con le stive cariche degli ultimi [ShowGoodsName('goods_gold')] e pellami della stagione."
 gold_fleet_nueva_espana_events.12.a: "Imbarchiamo il carico. La flotta prosegue unita."
 gold_fleet_nueva_espana_events.12.historical_info: "Un distaccamento che non attendeva nel proprio porto poteva comunque raggiungere il convoglio principale prima che giungesse all'Avana, purché il tempo e i venti favorissero un rapido ritorno verso la flotta."

 gold_fleet_nueva_espana_events.15.title: "El Norte"
 gold_fleet_nueva_espana_events.15.desc: "Il cielo a nord si è fatto duro e grigio, e il barometro scende rapidamente. Un #italic norte#! sta piombando sul Golfo — la violenta burrasca da nord che giunge senza molto preavviso e spinge davanti a sé un mare corto e feroce. In queste acque poco profonde, con i banchi mutevoli della costa vicini sottovento, è un assassino di navi.\n\n[target_leader.GetName] deve scegliere come la flotta affronterà la burrasca prima che sia su di noi."
 gold_fleet_nueva_espana_events.15.a: "Teniamoci al largo in acque profonde e resistiamo al norte."
 gold_fleet_nueva_espana_events.15.b: "Corriamo al riparo della costa e attendiamo che la burrasca passi."
 gold_fleet_nueva_espana_events.15.deep_safe_tt: "La flotta si apre faticosamente la via verso il mare aperto e supera il norte indenne"
 gold_fleet_nueva_espana_events.15.deep_loss_tt: "Il norte disperde la flotta e spinge i vascelli sui banchi; parte del carico affonda con loro"
 gold_fleet_nueva_espana_events.15.historical_info: "I #italic nortes#! erano burrasche fredde da nord che spazzavano il Golfo del Messico tra l'autunno e la primavera, distinte dagli uragani estivi e non meno temute dagli uomini che lavoravano al commercio di Veracruz. L'ancoraggio di San Juan de Ulúa era aperto ai loro colpi, e un norte poteva inchiodare una flotta contro la costa o spingerla sui bassifondi del Banco di Campeche. L'imbarco a Veracruz era programmato tanto in funzione della stagione dei nortes quanto dell'arrivo dell'argento, e una flotta sorpresa su quella costa sottovento durante una forte burrasca poteva andare perduta in vista della terraferma."

 gold_fleet_nueva_espana_events.16.title: "La Carovana d'Argento è in Ritardo"
 gold_fleet_nueva_espana_events.16.desc: "Alla banchina giunge notizia che la grande carovana di muli della stagione proveniente da [silver_source.GetName] non è arrivata. Da qualche parte lungo la lunga strada dall'interno è stata assalita — le barre di [ShowGoodsName('silver')] giacciono sparse lungo il sentiero degli altipiani, i mulattieri sono stati messi in fuga, e la ricchezza della corona è bloccata a cento leghe dal mare.\n\nLe stive sono piene soltanto a metà, e [target_leader.GetName] deve decidere se la flotta possa permettersi di recuperare il resto."
 gold_fleet_nueva_espana_events.16.a: "Mandiamo i fanti di marina nell'entroterra a scortare l'argento fino alla costa."
 gold_fleet_nueva_espana_events.16.b: "Non possiamo attendere. Salpiamo con ciò che è già nelle stive."
 gold_fleet_nueva_espana_events.16.historical_info: "L'argento delle grandi miniere messicane — Zacatecas, Guanajuato e i campi minori del nord — veniva trasportato lungo il #italic Camino Real de Tierra Adentro#!, la strada reale che correva per centinaia di miglia attraverso territori aridi e scarsamente presidiati fino a Città del Messico, e da lì veniva portato a est fino a Veracruz. La via fu tormentata per generazioni dai popoli Chichimeca della frontiera settentrionale, e in seguito dai banditi, così che il metallo prezioso viaggiava in convogli sorvegliati i cui tempi governavano l'intera stagione dell'imbarco sulla costa. Una carovana ritardata o depredata lungo la strada poteva lasciare una flotta ad attendere all'ancora o a salpare con le stive a metà."

 gold_fleet_nueva_espana_events.17.title: "Il Verme nello Scafo"
 gold_fleet_nueva_espana_events.17.desc: "I carpentieri hanno portato a [target_leader.GetName] cupe notizie: le acque calde delle Indie hanno svolto il loro lento lavoro, e i teredini hanno scavato in profondità nel fasciame sotto la linea di galleggiamento. Se non si interviene, gli scafi diventeranno molli e le navi lente, e una flotta incapace di sfuggire a un nemico è una flotta destinata un giorno a essere raggiunta.\n\nA portata di mano c'è una secca riparata dove le navi potrebbero essere carenate — sbandate su un fianco, con i fondi sporchi raschiati, bruciati e incatramati — ma il lavoro le lascia indifese sulla sabbia per settimane."
 gold_fleet_nueva_espana_events.17.a: "Approdiamo alla secca e carenamo la flotta a dovere."
 gold_fleet_nueva_espana_events.17.b: "Non c'è tempo. Proseguiamo con i fondi sporchi e speriamo in venti favorevoli."
 gold_fleet_nueva_espana_events.17.historical_info: "Nelle acque tropicali, il teredine #italic Teredo navalis#! — in realtà un mollusco, non un verme — crivellava gli scafi non protetti nel giro di pochi mesi. Era tra le minacce più persistenti per qualsiasi flotta operante nei Caraibi. Il rimedio era la carenatura: portare la nave a secco o sbandarla su una spiaggia riparata per esporre lo scafo, quindi raschiare via le incrostazioni, carbonizzare il legname e spalmarlo di sego e pece. Il lavoro era lento e lasciava una squadra senza difese, così i comandanti spesso scommettevano sul rimandarlo, a costo di navi che governavano come chiatte e perdevano acqua da ogni commessura."

 gold_fleet_nueva_espana_events.18.title: "Intrusi sulla Costa"
 gold_fleet_nueva_espana_events.18.desc: "Gli esploratori riferiscono di tagliatori stranieri al lavoro nelle foreste di [logwood_source.GetName], intenti ad abbattere e portare via il nostro legname sotto una bandiera che non riconosciamo. Hanno costruito rozzi accampamenti lungo la riva e si sono fatti audaci, scambiando il loro contrabbando con qualunque nave faccia scalo, e sorgono proprio su un suolo che [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] rivendica come proprio.\n\n[target_leader.GetName] può risparmiare un gruppo di sbarco, e deve decidere che fare di questi ospiti sgraditi."
 gold_fleet_nueva_espana_events.18.a: "Sbarchiamo uomini, bruciamo gli accampamenti e prendiamo il legname per le nostre stive."
 gold_fleet_nueva_espana_events.18.b: "Lasciamoli stare, e acquistiamo le loro carte e le notizie sulle vele nemiche."
 gold_fleet_nueva_espana_events.18.historical_info: "Le coste scarsamente presidiate del Golfo e della Baia di Campeche attirarono intrusi stranieri per tutto il periodo coloniale, soprattutto i tagliatori di campeggio — inglesi, olandesi e francesi — che abbattevano il legno tintorio tanto bramato dall'industria tessile europea. Operando lontano da qualunque guarnigione spagnola, questi #italic baymen#! passavano con facilità dal taglio onesto al contrabbando e alla pirateria vera e propria, e gli sforzi spagnoli per scacciarli furono sporadici e raramente duraturi. Una flotta di passaggio poteva disperdere un accampamento, ma i tagliatori tornavano non appena le vele erano oltre l'orizzonte."
