l_english:
 alg_taifa_rais: "Taifa dei Reïs"
 alg_taifa_rais_desc: "I capitani corsari di Algeri si sono organizzati in una corporazione che controlla il lungomare commerciale e militare del porto, negoziando i pagamenti dei riscatti, distribuendo le quote di preda e mantenendo le infrastrutture della flotta da cui dipende la prosperità della città. Riconosciamo la loro corporazione come autorità di governo dell'economia marittima algerina, concedendole il prestigio e la posizione legale per far rispettare i contratti con i mercanti stranieri e reclutare i propri equipaggi in tutto il Maghreb. Questa associazione tra corona ed élite corsara ci dà una forza navale capace senza il costo di mantenere una flotta reale."
 anr_consell_de_la_terra: "Consell de la Terra"
 anr_consell_de_la_terra_desc: "Il Consell de la Terra è l'assemblea che rappresenta le sei parrocchie di Andorra, istituita per sovrintendere agli affari del paese e proteggere gli antichi diritti delle sue comunità dalle ingerenze di entrambi i coprincipi."
 anr_quartos: "Quartons"
 anr_quartos_desc: "Le sei parrocchie di Andorra si governano tramite consigli elettivi chiamati quartons, che amministrano gli affari locali e inviano rappresentanti al Consell de la Terra. Questo antico sistema di autogoverno comunale limita la portata diretta dei coprincipi nella vita quotidiana delle nostre comunità."
 anr_sindic_general: "Síndic General"
 anr_sindic_general_desc: "Il Síndic General è il rappresentante eletto della comunità andorrana, incaricato di difendere gli interessi collettivi delle parrocchie davanti a entrambi i coprincipi e di fungere da capo della nostra amministrazione comunale."
 basque_cofradias_marineras: "Cofradías Marineras"
 basque_cofradias_marineras_desc: "Le confraternite marinare della costa basca sono antiche associazioni di marinai e pescatori che mettono in comune le risorse, condividono il rischio e mantengono le tradizioni del nostro popolo di mare. Le loro reti organizzate di competenze accelerano la costruzione di navi e garantiscono un flusso costante di marinai esperti."
 basque_pase_foral: "Pase Foral"
 basque_pase_foral_desc: "Il Pase Foral è il diritto delle istituzioni basche di esaminare e sospendere qualsiasi ordine regio in conflitto con i fueros locali prima che entri in vigore nelle nostre terre. Obbediamo al re, ma solo nella misura in cui le antiche leggi della nostra terra lo permettono."
 basque_universidad_mercaderes_bilbao: "Universidad de Mercaderes de Bilbao"
 basque_universidad_mercaderes_bilbao_desc: "La corporazione dei mercanti di Bilbao, formalmente istituita come Universidad de Mercaderes, ottiene il diritto di giudicare le controversie commerciali, fissare gli standard di scambio e regolare il commercio di ferramenta e lana che transita per il porto. I suoi tribunali commerciali riducono l'onere amministrativo della corona producendo al contempo entrate fiscali affidabili."
 bula_de_la_santa_cruzada: "Bula de la Santa Cruzada"
 bula_de_la_santa_cruzada_desc: "Il Papa ha concesso al nostro regno una bolla di crociata permanente, che ci consente di raccogliere fondi dai fedeli per la guerra contro l'infedele e di accordare indulgenze speciali ai nostri soldati che prendono le armi in difesa della fede."
 cas_letrados: "Letrados"
 cas_letrados_desc: "La corona nomina giuristi e amministratori formati nelle università ai consigli di Stato, sostituendo la presa della nobiltà ereditaria sul governo regio con una classe burocratica professionale leale all'autorità regia. I letrados portano competenza giuridica e una cultura di efficienza amministrativa nel meccanismo di governo."
 cas_patronato_real: "Patronato Real"
 cas_patronato_real_desc: "La corona detiene il diritto di nominare vescovi e abati in tutti i nostri territori d'oltremare, subordinando la Chiesa nelle nostre colonie all'autorità regia. Questo Patronato Real trasforma il clero in uno strumento di governo coloniale e in una fonte di prestigio regio."
 cat_capitols_de_cort: "Capítols de Cort"
 cat_capitols_de_cort_desc: "I Capítols de Cort sono accordi legislativi negoziati tra la Corona e le Corts catalane, che vincolano i sovrani successivi a rispettare i diritti e le libertà dei ceti. Nessun decreto regio può scavalcare le loro disposizioni senza il consenso del regno."
 eastern_amazigh_oasis_charter: "Carta delle Oasi"
 eastern_amazigh_oasis_charter_desc: "I gruppi di oasi del pre-Sahara orientale marocchino e algerino sono governati da un sistema di diritti comunitari sull'acqua e di consuetudini fondiarie che sostiene da secoli un'agricoltura stanziale in un paesaggio altrimenti arido. Riconoscendo formalmente la carta di queste comunità di oasi e il loro diritto ereditario sui canali d'acqua e sui palmeti, garantiamo la produttività di questi insediamenti e leghiamo i loro abitanti al regno con la sicurezza giuridica del possesso. Questa carta trasforma l'aspra frontiera desertica in un retroterra agricolo funzionante ed estende la nostra portata commerciale alla rete commerciale sahariana."
 glc_archbishopric_compostela: "Arcivescovado di Compostela"
 glc_archbishopric_compostela_desc: "Come patroni dell'Arcivescovado di Santiago de Compostela, traiamo prestigio e rendite dall'interminabile flusso di pellegrini che percorrono il Cammino per venerare le reliquie dell'Apostolo, consolidando il nostro regno come centro di devozione cristiana."
 glc_foros_de_galicia: "Foros de Galicia"
 glc_foros_de_galicia_desc: "I #italic foros#! sono contratti ereditari di lunga locazione attraverso i quali i contadini della Galizia detengono in perpetuo la terra che coltivano, pagando canoni fissi anziché subire le esazioni arbitrarie dei padroni. Questo possesso stabile incoraggia gli investimenti nella terra e lega i contadini alle loro comunità attraverso le generazioni."
 gra_ulema_council: "Consiglio degli 'Ulamā'"
 gra_ulema_council_desc: "Gli studiosi della legge islamica fungono da consiglio consultivo supremo del nostro regno, interpretando la dottrina religiosa e conferendo legittimità religiosa al governo del sultano. La loro autorità in materia legale garantisce che l'amministrazione della giustizia resti radicata nella legge divina."
 gra_visirate: "Visirato"
 gra_visirate_desc: "Il visirato è una carica di alto consiglio attraverso cui gli amministratori nobili governano in nome del sultano, portando ordine negli affari di Stato e garantendo che mani capaci guidino il regno."
 gra_volunteers_of_faith: "Volontari della Fede"
 gra_volunteers_of_faith_desc: "I #italic mutaṭawwi'a#! sono volontari devoti che si uniscono alle forze del sultano in tempo di guerra contro l'infedele, spinti da convinzione religiosa anziché da obbligo feudale. Il loro numero gonfia i ranghi dei nostri eserciti, e il loro fervore in battaglia compensa ampiamente la mancanza di addestramento militare formale."
 gra_volunteers_of_faith_unlocks_mutatawwia_tt: "Ci permette di arruolare [ShowUnitDefinitionName('a_mutatawwia')]"
 kabyle_tajmaat_pact: "Patto della Tajmaat"
 kabyle_tajmaat_pact_desc: "La #italic tajmaat#! è l'assemblea di villaggio degli altopiani cabili, un'istituzione comunitaria in cui gli uomini adulti del villaggio si riuniscono per deliberare sulla giustizia locale, sull'assegnazione delle risorse collettive e sulla risposta della comunità alle richieste esterne. Riconoscendo la #italic tajmaat#! come organo rappresentativo legittimo dei contadini cabili all'interno del sistema dei ceti, ci rapportiamo con le comunità degli altopiani alle loro condizioni anziché tentare di imporre strutture amministrative a cui si opporrebbero. Questo patto ci offre un governo stabile degli altopiani senza il costo di guarnigioni permanenti, e ancora la lealtà comunitaria cabila al regno attraverso un riconoscimento reciproco."
 lon_concejos_asturianos: "Concejos Asturianos"
 lon_concejos_asturianos_desc: "I consigli autonomi delle città asturiane sono un'antica istituzione radicata nelle tradizioni del #italic fuero#! dei passi di montagna, dove uomini liberi organizzavano la difesa comune e amministravano la giustizia molto prima che qualsiasi corte regia vi esercitasse il proprio dominio. La loro persistente vitalità lega i nostri contadini al regno tramite la lealtà locale anziché la coercizione."
 lon_san_isidoro_patronage: "Patronato di San Isidoro"
 lon_san_isidoro_patronage_desc: "La nostra corona dota la Real Colegiata di San Isidoro a León come cuore spirituale del regno, mausoleo regio e centro di studi il cui scriptorium romanico ha preservato nei secoli la tradizione colta di Isidoro di Siviglia."
 maghrebi_zawiya_endowment: "Dotazione della Zāwiya"
 maghrebi_zawiya_endowment_desc: "La #italic zāwiya#! è il convento sufi che funge al tempo stesso da luogo di culto, scuola di diritto islamico, ostello per viaggiatori e centro di arbitrato locale nelle campagne maghrebine. Dotando questi conventi di riconoscimento legale e fondazioni pie, estendiamo la portata dell'autorità religiosa a territori in cui non giunge l'ordine di alcun governatore e dove lo šayḵ della #italic zāwiya#! ispira più rispetto del lontano sultano. Questo investimento nella geografia sacra del nostro regno acquista la lealtà popolare a una frazione del costo dell'amministrazione diretta."
 masmuda_atlas_pact: "Patto dei Masmuda"
 masmuda_atlas_pact_desc: "I clan masmuda dell'Alto Atlante e delle alture dell'Anti-Atlante hanno organizzato la loro difesa collettiva e il governo locale intorno a patti tribali ereditari fin dal califfato almohade, di cui fornirono il movimento fondatore. Riconosciamo l'autorità di questi consigli montani e il loro diritto di governare i passi, assicurandoci la loro feroce resistenza a qualsiasi esercito ostile che tenti di forzare le vie degli altopiani. In cambio, queste comunità restano debolmente legate al potere centrale preservando la propria autonomia e la propria tradizione di armi comuni."
 mellah_charter: "Carta del Mallāḥ"
 mellah_charter_desc: "Il #italic mallāḥ#! è il quartiere ebraico autogovernato di una città maghrebina, un'istituzione sancita dal sultano sia come garanzia dell'autonomia comunitaria ebraica sia come fonte affidabile di entrate fiscali dai mestieri artigiani e mercantili in cui le comunità ebraiche eccellono. Emanando una carta formale, regolarizziamo lo status giuridico dei nostri sudditi ebrei, attirando artigiani qualificati, finanzieri e commercianti a lunga distanza le cui reti si estendono attraverso il Mediterraneo e il Sahara. Questa integrazione del #italic mallāḥ#! nella nostra economia urbana porta produzione artigianale, credito commerciale e beni specializzati che arricchiscono l'intera città."
 mll_consolat_de_mar: "Consolat de Mar"
 mll_consolat_de_mar_desc: "Il #italic Consolat de Mar#! è il nostro tribunale marittimo, autorizzato a dirimere controversie di nolo, assicurazione e società secondo un diritto del mare codificato che vincola mercante e capitano allo stesso modo. I suoi consoli, eletti tra la stessa comunità commerciale, rafforzano la posizione dei nostri borghesi, attirano coloni nelle nostre città portuali e gonfiano le nostre entrate commerciali."
 mor_abid_al_bukhari: "'Abīd al-Buḵārī"
 mor_abid_al_bukhari_desc: "Gli #italic 'abīd#! sono una soldatesca di schiavi arruolata dal sultano e registrata sotto il nome di al-Buḵārī come finzione legale che li lega alla corona anziché a un singolo padrone. Abbiamo organizzato questo corpo in una forza professionale permanente che risponde direttamente al trono, riducendo la nostra dipendenza dalle turbolente confederazioni tribali per la manodopera militare. Questa centralizzazione delle armi in mani regie segna un passo decisivo verso un esercito sovrano indipendente dalle grandi leve dei clan."
 mor_andalusian_refugees: "Rifugiati Andalusi"
 mor_andalusian_refugees_desc: "I rifugiati andalusi e moreschi stabilitisi nelle nostre città portano con sé le tradizioni artigiane di al-Andalus: le piastrelle #italic zillij#!, le ceramiche pregiate, la tessitura della seta e gli ornamenti architettonici che un tempo distinguevano le grandi città della penisola. Riconoscendo formalmente le istituzioni comunitarie di queste comunità di rifugiati e concedendo loro i privilegi del ceto borghese, incanaliamo la loro energia produttiva nella nostra economia urbana e li leghiamo al trono tramite gratitudine e protezione legale. Le loro tradizioni di bottega e le loro connessioni mercantili conferiscono alle nostre città un carattere produttivo che le sole tradizioni artigiane locali non potrebbero raggiungere altrettanto in fretta."
 mor_gharb_war_tribes: "Tribù Guerriere del Ḡarb"
 mor_gharb_war_tribes_desc: "I Ḵlūṭ, i Sufyān, i Ṭlīq e i Riyāḥ detengono le pianure del Ḡarb, dell'Azġar e dell'Habṭ alle stesse condizioni con cui le presero i loro antenati: terra da coltivare e libertà dall'esattore, in cambio di cavalcare quando il sultano chiama. È un servizio che compriamo e non obbedienza, e la distinzione non sfugge a nessuna delle due parti: queste sono tribù con cui trattiamo anziché tribù che governiamo. Ciò che il patto ci dà è il numero, perché una convocazione portata a ogni tenda di quattro confederazioni mette in sella più uomini di qualsiasi leva delle città."
 mor_guich_tribes: "Tribù Guich"
 mor_guich_tribes_desc: "Con il Maḵzan costruito e la sua autorità spinta verso l'esterno, lo scambio di terra contro servizio può diventare un'istituzione permanente anziché un accordo rinnovato ogni stagione. Le tribù #italic jīš#! — di norma di origine araba, che coltivano in #italic arḍ al-jayš#! appezzamenti assegnati a ciascun guerriero ed esenti da tasse finché cavalcano — sono prima di tutto soldati della corona e solo poi coltivatori. Un corpo che si nutre dai propri appezzamenti costa al tesoro una frazione di ciò che costerebbero i salari, e non risponde ad alcun lignaggio se non al nostro. Ritirando la mano centralizzatrice l'accordo decade: queste tribù servono un Maḵzan che le raggiunge."
 mor_guich_tribes_makhzan_requirement_tt: "Abbiamo istituito la Burocrazia [ShowBureaucracyTypeName('makhzan_bureaucracy')]"
 mor_guich_tribes_unlocks_guich_cavalry_tt: "Ci permette di arruolare [ShowUnitDefinitionName('a_guich_cavalry')]"
 mor_makhzen_caids: "Quwwād del Maḵzan"
 mor_makhzen_caids_desc: "I #italic quwwād#! sono governatori regionali nominati dalla corona che il sultano invia per affermare l'autorità centrale sui territori amministrati direttamente dal trono, riscuotendo le tasse, amministrando la giustizia e mantenendo l'ordine per conto del trono. Formalizzando la nomina e la supervisione di questi quwwād, estendiamo la portata dell'apparato del Maḵzan in tutto il nostro regno e riduciamo l'autonomia delle grandi confederazioni tribali che altrimenti potrebbero governare per sola consuetudine. Questa integrazione di ufficiali nominati dalla corona con l'influenza locale è il cuore amministrativo dello Stato marocchino."
 mor_marabout_patronage: "Patrocinio dei Marabutti"
 mor_marabout_patronage_desc: "I marabutti sono santi uomini di riconosciuta discendenza spirituale i cui santuari costellano il paesaggio marocchino e alla cui intercessione la gente comune ricorre per guarigioni, arbitrati e protezione dalle avversità. Patrocinando queste figure e le loro #italic zāwiya#! annesse, leghiamo al Maḵzan una rete decentralizzata di autorità sacra, rendendo il sultano il protettore riconosciuto dell'Islam popolare marocchino. Questo rapporto ci dà accesso a intermediari religiosi capaci di pacificare comunità che né governatori né eserciti possono raggiungere facilmente."
 mozabite_communal_pact: "Patto Comunitario Mozabita"
 mozabite_communal_pact_desc: "Le cinque città della pentapoli del Mzab mantengono la propria prosperità commerciale attraverso una rigorosa disciplina comunitaria imposta dal consiglio degli #italic 'azzāba#!, l'istituzione clericale ibadita che combina autorità religiosa, arbitrato commerciale e regolamentazione degli scambi sulle rotte sahariane. Riconoscendo questo autogoverno comunitario come espressione formale dell'autorità del ceto borghese nel Mzab, integriamo la rete commerciale della pentapoli nel nostro regno senza tentare di imporre strutture amministrative che genererebbero solo resistenza. La reputazione dei Mozabiti per l'austera onestà negli affari fa della loro parola una moneta di fiducia in tutto il Sahara."
 mudejar_aljamas: "Aljamas Mudéjar"
 mudejar_aljamas_desc: "Riconosciamo il diritto delle comunità musulmane di mantenere le proprie #italic aljamas#! autogovernate, permettendo loro di praticare la propria fede, dirimere le controversie interne secondo la propria legge e proseguire i propri mestieri e le proprie arti. Il loro contributo economico è indispensabile al nostro regno, e la loro lealtà si garantisce meglio con l'accomodamento che con la coercizione."
 nav_buenas_villas: "Buenas Villas"
 nav_buenas_villas_desc: "Alle città privilegiate del regno — le #italic buenas villas#! — sono concesse carte regie che conferiscono libertà di commercio e di autogoverno in cambio di lealtà diretta alla corona. I loro consigli borghesi fungono da contrappeso al potere nobiliare e da fonte affidabile di entrate per la tesoreria regia."
 nav_mesnadero: "Mesnaderos"
 nav_mesnadero_desc: "I #italic mesnaderos#! sono la cavalleria della casa reale, guerrieri nobili legati da servizio personale alla corona e rinomati per le loro cariche devastanti. La loro posizione privilegiata di seguito personale del re garantisce lealtà incrollabile e capacità militare d'élite."
 nav_mesnadero_unlocks_mesnaderos_tt: "Ci permette di reclutare [ShowUnitDefinitionName('a_mesnaderos')]"
 nav_palacio_cabo_armeria: "Palacios Cabo de Armería"
 nav_palacio_cabo_armeria_desc: "I #italic palacios cabo de armería#! sono le casate nobili ereditarie di Navarra i cui lignaggi armigeri sono iscritti nei registri regi, conferendo ai loro signori una posizione riconosciuta a corte e voce nel consiglio della corona."
 spa_grandes_de_espana: "Grandi di Spagna"
 spa_grandes_de_espana_desc: "I Grandi di Spagna sono la nobiltà di più alto rango del regno, a cui è concesso lo straordinario privilegio di restare coperti davanti al monarca e che sono elevati ai consigli di Stato. Il loro prestigio e la loro lealtà sono il fondamento su cui poggia l'autorità della corona."
 tle_mashwar_court: "Corte del Mashwar"
 tle_mashwar_court_desc: "Il #italic mashwar#! è la corte di udienza interna del sultanato di Tlemcen, dove il sultano riceve consiglio dai grandi nobili e giuristi del regno in un contesto cerimoniale che li lega al trono attraverso il riconoscimento formale. Il suo carattere deliberativo conferisce allo Stato zayyanide una legittimità consultiva che lo distingue dal governo puramente coercitivo, dando alle decisioni del sultano il peso dell'approvazione collettiva della nobiltà. Formalizziamo i lavori di questa corte, rendendola il canale riconosciuto attraverso cui si discute la politica e il ceto nobiliare esercita la propria influenza nell'ordine costituzionale."
 tuareg_caravan_guild: "Corporazione Carovaniera Tuareg"
 tuareg_caravan_guild_desc: "La confederazione tuareg controlla le rotte carovaniere transahariane lungo le quali oro, sale e persone ridotte in schiavitù si spostano tra il Sahel e i porti maghrebini, e le sue guide, i suoi allevatori di cammelli e le sue scorte armate sono un elemento insostituibile dell'economia del deserto. Riconoscendo la struttura corporativa dei capi carovana tuareg e dandole un posto formale nel ceto borghese, otteniamo un accesso affidabile all'intelligence commerciale, alla conoscenza delle rotte e alle garanzie di salvacondotto senza le quali nessun commercio sahariano è possibile. Questa associazione tra il sultanato e i mercanti del deserto lega i grandi flussi di merci sahariane al nostro sistema fiscale e commerciale."
 tuareg_imghad_vassalage: "Vassallaggio Imghad"
 tuareg_imghad_vassalage_desc: "Gli #italic imghad#! sono i clan di casta vassalla della confederazione tuareg, vincolati da obbligo ereditario a servire i lignaggi nobili #italic imajeghen#! in cambio di protezione e dell'accesso alle rotte di pascolo transahariane. Formalizzando l'autorità di queste gerarchie claniche sotto il riconoscimento del sultano, leghiamo la struttura tribale sahariana al nostro dominio senza imporre un'amministrazione diretta a un deserto ingovernabile. Questo patto #italic imghad#! ci dà una leva di cavalieri del deserto disciplinati a costo minimo per il tesoro centrale."
 tun_hafsid_caliphal_claim: "Pretesa Califfale Hafside"
 tun_hafsid_caliphal_claim_desc: "I sultani hafsidi derivano la loro pretesa di governo dalla discendenza e dal riconoscimento come successori del califfato almohade, presentandosi al mondo musulmano come legittimi eredi dell'autorità universale del Comandante dei Credenti. Coltiviamo questa dignità califfale attraverso la cerimonia, la corrispondenza con governanti musulmani lontani e il patrocinio di studiosi che articolano le basi teologiche della nostra pretesa. Questa autorità spirituale eleva il nostro prestigio oltre quello di un semplice sultanato regionale e assicura la devozione dei nostri sudditi e alleati musulmani."
 tun_taifa_of_rais: "Taifa dei Reïs"
 tun_taifa_of_rais_desc: "La #italic tā'ifa#! tunisina dei reïs è una corporazione formalmente costituita di capitani corsari i cui statuti regolano la condotta delle operazioni di corsa, la distribuzione delle quote di preda e il riscatto dei prigionieri dai mercati degli schiavi della città. Concediamo alla taifa il riconoscimento legale come corporazione autorizzata del ceto borghese, legando alla nostra causa i più capaci imprenditori marittimi del regno in cambio di diritti formali sul porto. Questo accordo dà a Tunisi una delle istituzioni corsare più organizzate del Mediterraneo occidentale e una fonte affidabile di marinai disponibili per il servizio regio in tempo di guerra."
 unlocks_proclaim_pase_foral_tt: "Sblocca l'[cabinet_action|e] [ShowCabinetActionName('proclaim_pase_foral')]"
 val_tribunal_de_les_aigues: "Tribunal de les Aigües"
 val_tribunal_de_les_aigues_desc: "Il Tribunale delle Acque di Valencia è il più antico tribunale ancora in funzione in Europa, che si riunisce ogni giovedì alla porta della cattedrale per dirimere le controversie sui diritti di irrigazione tra gli agricoltori della pianura. Le sue sentenze consuetudinarie non scritte, applicate per consenso comunitario, mantengono produttivo il cuore agricolo del regno e ordinati i suoi contadini."
 zenati_mounted_levy: "Leva Montata Zenata"
 zenati_mounted_levy_desc: "La confederazione zenata è composta da tribù berbere rinomate per la maestria nella cavalleria leggera, che combattono con la staffa corta e il giavellotto nella tradizione della #italic furūsiyya zanātiyya#! che influenzò la pratica equestre su entrambe le sponde del Mediterraneo. Leviamo questi guerrieri a cavallo come forza d'attacco rapida capace di schermare i nostri eserciti, razziare le linee di rifornimento ostili e coprire grandi distanze attraverso gli altipiani con un supporto logistico minimo. La loro lealtà al sultano è assicurata dalla struttura tradizionale di tributo e patronato anziché da una gerarchia militare formale."
