l_english:


#### TRACK NAMES AND FLAVOUR TEXT ####

#MOROCCO
 musicplayer_sol_moroccan_berma_lalla: "Moroccan - Berma Lalla"
 musicplayer_sol_moroccan_berma_lalla_flavour: "Un canto di invocazione a Lalla, una delle mlouk femminili del pantheon di spiriti Gnawa. Eseguito da Asmaa Hamzaoui, prima interprete gnawa donna del Marocco, e dal suo gruppo Bnat Timbouktou."
 musicplayer_sol_moroccan_boulila: "Moroccan - Boulila"
 musicplayer_sol_moroccan_boulila_flavour: "Un pilastro del repertorio Gnawa, eseguito durante la lila, un rituale di guarigione che dura tutta la notte, in cui i canti invocano i mlouk, spiriti associati a colori, incenso e cerimonia."
 musicplayer_sol_moroccan_soyo_soyo: "Moroccan - Soyo Soyo"
 musicplayer_sol_moroccan_soyo_soyo_flavour: "Un brano tramandato attraverso generazioni di maestri gnawa, da Mahmoud Guinia a Bnat Timbouktou, radicato nella diaspora dell'Africa occidentale che ha plasmato il patrimonio musicale del Marocco a partire dal XVI secolo."

 #CASTILE
 musicplayer_sol_castilian_ay_triste_que_vengo: "Castilian - Ay triste que vengo"
 musicplayer_sol_castilian_ay_triste_que_vengo_flavour: "Musicato a partire da una poesia contenuta nel Cancionero dello stesso Encina (1496), questo villancico rivela il confine fluido tra poesia e canto nella corte rinascimentale del Duca d'Alba."
 musicplayer_sol_castilian_con_amores_la_mi_madre: "Castilian - Con amores la mi madre"
 musicplayer_sol_castilian_con_amores_la_mi_madre_flavour: "Scritto alla corte dei Re Cattolici, questo villancico oscilla tra il canto d'amore di una figlia e un dialogo mistico tra l'anima e la Vergine Maria."
 musicplayer_sol_castilian_conde_claros: "Castilian - Conde Claros"
 musicplayer_sol_castilian_conde_claros_flavour: "La storia del conte Claros e della principessa Claraniña, una delle ballate più amate della Spagna del XVI secolo, qui conservata nelle diferencias per vihuela di Narváez, dalle quali un tempo cantavano i ciegos (cantori di strada)."
 musicplayer_sol_castilian_falai_minha_amor: "Castilian - Falai minha amor"
 musicplayer_sol_castilian_falai_minha_amor_flavour: "Tratto da El Maestro (1536), la prima raccolta stampata per vihuela della storia, il testo Portoghese di questo canto riflette i legami dinastici tra Valencia e Lisbona, rendendo omaggio al mecenate di Milán, re Giovanni III."
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani: "Castilian - Recercada I sopra i tenori italiani"
 musicplayer_sol_castilian_recercada_i_sopra_i_tenori_italiani_flavour: "Dal primo manuale dedicato all'insegnamento dell'ornamentazione per viola da gamba, questa Recercada mostra come glosar sul passamezzo antico, una delle progressioni armoniche Italiane più comuni dell'epoca."
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna: "Castilian - Recercada II sobre l'Espagna"
 musicplayer_sol_castilian_recercada_ii_sobre_l_espagna_flavour: "Basata su La Spagna, una delle melodie più elaborate del Rinascimento, la Recercada di Ortiz mette in mostra il glosar, l'arte di improvvisare divisioni su un basso celebre, nel suo Trattado de Glosas (Roma, 1553)."


