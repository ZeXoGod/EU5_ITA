l_english:
 cb_partition: "Spartizione"
 cb_partition_desc: "La nostra supremazia sull'[ShowContinentName('europe')] è fuori discussione, e i regni ipertrofici che ci sfidano non hanno alcun diritto alle terre che detengono. Spezzeremo i nostri nemici, restituendo a ogni nazione calpestata il diritto sul proprio suolo."

 cb_restore_ummayad_caliphate: "Ripristinare i Confini del Califfato Omayyade"
 cb_restore_ummayad_caliphate_desc: "Un tempo gli Omayyadi regnavano su tutta al-'Andalus da $cordoba.arabic_language$, una corte il cui splendore e la cui cultura erano l'invidia del mondo. Quella gloria giace ora in frantumi, le sue terre spartite tra piccoli emiri indegni di una così grande eredità. Riuniremo i fedeli sotto un unico Califfo e innalzeremo di nuovo lo stendardo degli Omayyadi su $cordoba.arabic_language$."
 war_goal_restore_ummayad_caliphate: "$cb_restore_ummayad_caliphate$"
 war_goal_restore_ummayad_caliphate_desc: "L'[war_goal|e] è riconquistare le terre dell'antico Califfato. I partecipanti otterranno un [war_score|e] maggiore vincendo le battaglie. Accumulando più del $THRESHOLD|Y%$ del [war_score|e] dalle battaglie vinte ci garantiremo un [war_score|e] crescente. Nella pace potremo rivendicare solo le [locations|e] che si trovano entro i confini storici del Califfato Omayyade."
 RESTORE_UMMAYAD_CALIPHATE_WAR_NAME: "La $NUM$$ORDER$ Guerra per Restaurare il Califfato Omayyade contro $SECONDNAME$"

 cb_reconquer_iberia: "Riconquista dell'$iberia_region$"
 cb_reconquer_iberia_desc: "Il regno che un tempo dominava l'[ShowRegionName('iberia_region')] è caduto, la sua presa spezzata e le sue terre mature per essere prese. Coloro che si schierarono nella coalizione contro di esso possono ora spartirsi la penisola, impadronendosi a costo ridotto di ciò che il Colosso caduto non è più in grado di tenere."
 war_goal_reconquer_iberia: "$generic_war_goal_superiority$"
 war_goal_reconquer_iberia_desc: "$generic_war_goal_superiority_desc$"

 PARTITION_WAR_NAME: "La $NUM$$ORDER$ Spartizione di $SECONDNAME$"
 war_goal_partition_superiority: "$generic_war_goal_superiority$"
 war_goal_partition_superiority_desc: "$generic_war_goal_superiority_desc$"

 peace_partition: "Spartizione"
 peace_partition_desc: "Smembreremo il nostro nemico sconfitto, restituendo l'indipendenza a ogni nazione che vanti ancora una rivendicazione entro i suoi confini."
 peace_partition_entry: "Spartizione [TARGET_COUNTRY.Custom('IT_Della')][TARGET_COUNTRY.GetNameWithFlag]"
 peace_partition_entry_short: "Spartizione [TARGET_COUNTRY.Custom('IT_Della')][TARGET_COUNTRY.GetNameWithFlagWithNoTooltip]"
 peace_partition_tt: "Libera ogni nazione che detiene territori centrali entro le terre del paese sconfitto"

 cb_grand_alliance: "Grande Alleanza"
 cb_grand_alliance_desc: "Nel timore dell'ascesa incontrollata di un singolo regno, le potenze del mondo si uniscono per umiliarlo e ristabilire l'equilibrio."
 war_goal_grand_alliance_superiority: "$generic_war_goal_superiority$"
 war_goal_grand_alliance_superiority_desc: "$generic_war_goal_superiority_desc$"
 GRAND_ALLIANCE_WAR_NAME: "La Grande Alleanza contro $SECONDNAME$"
 AI_CURB_DOMINANCE: "Il dominio del Colosso deve essere ridimensionato"

 pt_curb_european_dominance: "Frenare il Dominio Europeo"
 pt_curb_european_dominance_desc: "L'ascendente che il nostro nemico ha conquistato sull'[ShowContinentName('europe')] sarà spezzato. Secondo i termini di questa pace, il dominio che ha accumulato viene tolto e l'equilibrio del continente ripristinato."
 pt_curb_european_dominance_entry: "Frenare il Dominio Europeo"
 pt_curb_european_dominance_entry_short: "Frenare il Dominio Europeo"
 pt_curb_european_dominance_tt: "Riduce di #Y 25#! il [gc_european_dominance|e] del Colosso sconfitto"

 pt_curb_colonial_dominance: "Frenare il Dominio Coloniale"
 pt_curb_colonial_dominance_desc: "Le ricchezze che il nostro nemico ha strappato d'oltreoceano, per non parlare della sua immensa portata, saranno ridimensionate. Secondo i termini di questa pace, il suo dominio coloniale viene tolto e la sua presa sul Nuovo Mondo allentata."
 pt_curb_colonial_dominance_entry: "Frenare il Dominio Coloniale"
 pt_curb_colonial_dominance_entry_short: "Frenare il Dominio Coloniale"
 pt_curb_colonial_dominance_tt: "Riduce di #Y 25#! il [gc_colonial_dominance|e] del Colosso sconfitto"
 cb_free_the_mudejar: "Liberare i Mudéjar"
 cb_free_the_mudejar_desc: "I nostri fratelli [ShowReligionAdjective('sunni')] dell'[ShowRegionName('iberia_region')] sono costretti a praticare la #italic Taqiyya#!. Non dobbiamo permettere al diavolo [ShowReligionGroupAdjective('christian')] di maltrattare ancora il nostro popolo."
 cb_claim_throne_of_naples: "Rivendicare il Trono di $naples$"
 cb_claim_throne_of_naples_desc: "Non permetteremo che il regno di $naples$ resti diviso."
 claim_throne_of_naples: "Unione con [GetCountry('NAP').Custom('IT_La')][GetCountry('NAP').GetNameWithNoTooltip]"
 claim_throne_of_naples_entry: "Rivendica il Trono [GetCountry('NAP').Custom('IT_Di')][GetCountry('NAP').GetNameWithNoTooltip]"
 claim_throne_of_naples_entry_short: "$claim_throne_of_naples_entry$"
 claim_throne_of_naples_desc: "Il nostro controllo su parti [GetCountry('NAP').Custom('IT_Della')][GetCountry('NAP').GetLongName] ci offre una giustificazione sufficiente per muovere guerra e rivendicare il resto per noi."
 war_goal_take_province_free_the_mudejar: "$generic_war_goal_take_province$"
 war_goal_take_province_free_the_mudejar_desc: "$generic_war_goal_take_province_desc$"

 cb_demand_andalusi_submission: "Esigere la Sottomissione [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetNameWithNoTooltip]"
 cb_demand_andalusi_submission_desc: "I governanti [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName] hanno comprato la propria indipendenza mettendoci contro il nostro rivale, e si sono adagiati nell'affare. I loro eserciti non reggono più il confronto con i nostri. Riconoscano chi comanda [ShowLocationName('strait_of_gibraltar')] e paghino per la pace di cui godono."
 war_goal_demand_andalusi_submission: "$generic_war_goal_superiority$"
 war_goal_demand_andalusi_submission_desc: "$generic_war_goal_superiority_desc$\n\nNella pace, impadronirsi di [locations|e] costa #R il doppio#! del solito [war_score|e], mentre costringere [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] alla sottomissione costa solo #G un quarto#! di esso. Questa guerra si combatte per portare i suoi governanti sotto la nostra autorità anziché per spartirne le terre."
 DEMAND_ANDALUSI_SUBMISSION_WAR_NAME: "La $NUM$$ORDER$ Guerra per la Sottomissione di $SECONDNAME$"

 peace_andalusi_submission: "Imporre la Sottomissione [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetNameWithNoTooltip]"
 peace_andalusi_submission_desc: "I governanti [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName] metteranno da parte la propria indipendenza e prenderanno posto sotto il nostro stendardo, legati a noi come [ShowSubjectTypeName('taifa')] se ne condividiamo la fede e come [ShowSubjectTypeName('tributary')] in caso contrario."
 peace_andalusi_submission_entry: "$peace_andalusi_submission$"
 peace_andalusi_submission_entry_short: "$peace_andalusi_submission$"
 cb_conquer_province: "Rivendicazioni sulla Provincia"
 cb_parliament_conquer_province: "Rivendicazioni sulla Provincia Approvate dal Parlamento"
 cb_fabricated_conquer_province: "Rivendicazioni Dubbie sulla Provincia"
 cb_fabricated_conquer_province_desc: "Le terre sotto la giurisdizione dei nostri vicini dovrebbero \"legittimamente\" appartenere a noi, sulla base di una rivendicazione solida e \"legittima\"!"
 cb_claim_throne: "Rivendicare il Trono"
