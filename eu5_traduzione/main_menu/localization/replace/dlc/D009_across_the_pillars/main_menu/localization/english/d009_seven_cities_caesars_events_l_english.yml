 seven_cities_caesars.1.title: "Pirite e Quarzo"
 seven_cities_caesars.1.desc: "Cinque mesi nella Patagonia, la colonna ha raggiunto la valle che i sopravvissuti del galeone perduto descrissero al magistrato di Buenos Aires. Qui non c'è nessuna città. Ci sono alcune capanne abbandonate, opera di pastori o cacciatori, forse vecchie di una generazione. Il letto del torrente scintilla in modo convincente, ma il saggiatore dà un'occhiata ai campioni e li identifica come oro degli sciocchi e quarzo bianco. La valle produce una discreta quantità di guanachi e poco altro. [target_leader.GetName] scrive il dispaccio al riparo di una scogliera di basalto, in un vento che soffia da tre giorni."
 seven_cities_caesars.1.a: "Ingannati, o ingannatori. Ammainiamo lo stendardo, torniamo indietro."
 seven_cities_caesars.1.historical_info: "La leggenda della Città dei Cesari, un insediamento di lingua Spagnola fondato dai sopravvissuti di un naufragio cinquecentesco sulla costa Patagonica e presumibilmente nascosto nell'interno del paese, fu data per credibile dalla corona Spagnola fino al Settecento inoltrato. Almeno sette spedizioni furono inviate alla sua ricerca tra il 1530 e il 1750. Nessuna trovò nulla. La leggenda persistette in parte perché la Patagonia era davvero difficile da rilevare all'epoca, in parte perché i sopravvissuti ai naufragi riapparivano periodicamente con storie elaborate per spiegare la loro lunga assenza, e in parte perché il pregiudizio istituzionale delle burocrazie coloniali era sempre quello di agire su una voce credibile anziché ignorarla."

 seven_cities_caesars.2.title: "Un Filo d'Argento in un Paese Freddo"
 seven_cities_caesars.2.desc: "Il paese in cui siamo entrati è più duro di come lo descrivevano i sopravvissuti e più povero di quanto promettessero, ma non è nulla. Ci sono torrenti argentiferi in due delle valli che abbiamo attraversato. I mercanti Mapuche con cui la colonna ha preso contatto la settimana scorsa portavano piccoli pezzi finiti d'argento che dicono provenire dalle pendici più a ovest. Il paese, se non la città, è reale. Il commercio può essere aperto. Qui non ci sarà una seconda Potosí, ma ci sarà qualcosa. [target_leader.GetName] ordina di costruire un emporio fortificato dove la colonna è giunta."
 seven_cities_caesars.2.a: "Costruiamo l'emporio. Il modesto argento Patagonico lo ripagherà."
 seven_cities_caesars.2.historical_info: "La Patagonia produsse argento in quantità commerciali modeste da un certo numero di piccole attività aperte nel tardo periodo coloniale, principalmente nell'attuale provincia Argentina di Río Negro e lungo il versante orientale delle Ande. L'importanza economica di queste attività fu sempre limitata rispetto alla grande economia argentifera Andina più a nord, ma bastò ad ancorare una rete di empori Spagnoli e poi Argentini che gradualmente soppiantò la rete commerciale Mapuche attraverso cui operava il periodo successivo alla scoperta."

 seven_cities_caesars.3.title: "I Cesari Ritrovati"
 seven_cities_caesars.3.desc: "Il paese descritto dai sopravvissuti è reale, e la città che descrissero è al suo interno. Tra due montagne, sul fondo di una valle nascosta, c'è un insediamento di forse duemila anime: Spagnole nell'abbigliamento, Spagnole nella lingua anche se con strani slittamenti vocalici di due generazioni, Spagnole nella religione anche se il loro sacerdote è un vecchio senza successore. Vivono qui da sessant'anni del mais che le loro donne piantano sul fondovalle e dell'argento che setacciano dai torrenti. Non si aspettavano di essere trovati. Il cronista resta sveglio tutta la notte a scrivere. [target_leader.GetName] manda a chiedere rinforzi all'alba."
 seven_cities_caesars.3.a: "I sudditi perduti della corona sono ritrovati. La valle è nostra."
 seven_cities_caesars.3.historical_info: "Popolazioni nascoste di lingua Spagnola discendenti da sopravvissuti a naufragi compaiono effettivamente di tanto in tanto nella documentazione storica, il caso più famoso essendo quello di Gonzalo Guerrero tra i Maya, ma i loro numeri sono sempre esigui e i loro insediamenti non sono le città perdute della leggenda. La versione Patagonica della leggenda, la Città dei Cesari vera e propria, non è mai stata comprovata. La valle in cui era presumibilmente nascosta è stata mappata molte volte dalla fine dell'Ottocento e non contiene, per consenso generale dei cartografi e dei cercatori coinvolti, nulla."

