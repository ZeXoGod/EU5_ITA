l_english:
 por_assumed_grandmastership_of_military_orders_tt: "Sblocca la [decision|e] [ShowDecisionName('por_mesa_da_consciencia_e_ordens_decision')]"
 por_assumed_grandmastership_of_military_orders_requirement_tt: "Il paese deve aver assunto il Gran Magistero degli ordini militari"
 por_mesa_da_consciencia_e_ordens_decision.title: "Istituiamo la $por_mesa_da_consciencia_e_ordens_bureaucracy$"
 por_mesa_da_consciencia_e_ordens_decision.desc: "I nostri ordini militari detengono vaste commende e rendite che sfuggono all'amministrazione ordinaria, e i loro affari vengono sbrigati a pezzi e bocconi da qualunque chierico o capitano insista di più per ottenere il favore regio. Erigiamo un tribunale permanente — la Mesa da Consciência e Ordens — che esamini le loro suppliche, assegni le loro commende e leghi sempre più strettamente la loro autorità spirituale ai fini della Corona."
 por_mesa_da_consciencia_e_ordens_decision.a: "Istituiamo il tribunale."
 establish_mesa_da_consciencia_e_ordens_tt: "Sblocca la [ShowBureaucracyTypeName('por_mesa_da_consciencia_e_ordens_bureaucracy')]"
 established_mesa_da_consciencia_e_ordens_tt: "Ha istituito la [ShowBureaucracyTypeName('por_mesa_da_consciencia_e_ordens_bureaucracy')] con la decisione $por_mesa_da_consciencia_e_ordens_decision.title$."
 por_estado_da_india_decision.title: "Estado da Índia"
 por_estado_da_india_decision.desc: "La #italic Casa da Índia#! risponde del nostro commercio, ma le nostre fortezze e le nostre stazioni commerciali da $india$ al Mar Cinese Meridionale non rispondono ancora a un'unica autorità. È stato suggerito di elevare Goa a sede di un viceregno formale — un #italic Estado#! — sotto il quale ogni guarnigione, flotta e banco commerciale a est del Capo faccia capo a un'unica autorità regia."
 por_estado_da_india_decision.desc.entry: "La Casa da Índia tiene i nostri registri contabili, ma le nostre guarnigioni, flotte e stazioni commerciali a est del Capo non rispondono ancora a un'unica autorità. Un viceré insediato a Goa le legherebbe tutte sotto un solo Estado."
 por_estado_da_india_decision.a: "Che Goa governi l'Oriente."
 por_estado_da_india_decision.a.tt: "Sblocca la [government_reform|e] [ShowGovernmentReformName('por_estado_da_india_reform')]"
