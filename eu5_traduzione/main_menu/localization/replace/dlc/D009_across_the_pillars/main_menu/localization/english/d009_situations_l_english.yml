 claim_andalusi_inheritance_desc: "Le terre di [ShowFormableCountryName('ADU_f')] un tempo obbedivano al richiamo dei califfi e pregavano nelle grandi moschee di [ShowLocationName('cordoba')]. Finché il dominio [ShowReligionGroupAdjective('christian')] regge quelle coste, non possiamo riposare.\n\nAvanziamo la nostra pretesa sull'erede Iberico scelto, e i nostri eserciti sono pronti a rispondere se si rifiuterà di cedere. Se colpiamo ora, i fedeli dell'[ShowRegionName('iberia_region')] guarderanno a noi come ai legittimi pretendenti dell'eredità perduta, e la nostra posizione nel mondo [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] crescerà con l'impresa."
 claim_andalusi_inheritance_no_target_tt: "Otterremo un [casus_belli|e] per riprendere [ShowFormableCountryName('ADU_f')] dal regno [ShowReligionGroupAdjective('christian')] Iberico scelto, della durata di 5 anni"
 has_won_bfts_situation_tt: "Dobbiamo aver vinto la [situation|e] [ShowSituationName('battle_for_the_strait')]"
 as_long_as_the_situation_is_active_desc: "finché la [situation|e] $battle_for_the_strait$ resta attiva"
 demand_conversion_of_granada.title: "Affrontare la Fede di $GRA$"
 demand_conversion_of_granada.desc: "[GetCountry('GRA').Custom('IT_La')|U][GetCountry('GRA').GetName] si inginocchia davanti al nostro trono, eppure le sue moschee chiamano ancora i fedeli alla preghiera. La Corona è a un bivio. Possiamo portare a termine ciò che la reconquista aveva iniziato e legare [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetFlavorRank] alla nostra fede con la forza, oppure risparmiare agli abitanti di cultura [ShowCultureName('andalusi')] i loro riti e trarre invece il massimo da ciò che offrono la loro maestria, il loro sapere e i loro cavalieri."
 demand_conversion_of_granada.a: "Convertiamoli. Fede e corona devono rispondere a un unico signore."
 demand_conversion_of_granada.b: "Risparmiamo la loro fede."
 cas_found_the_santa_hermandad_decision.title: "Fondare la [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]"
 cas_found_the_santa_hermandad_decision.desc: "Le confraternite delle nostre città sorvegliano da tempo le strade, ciascuna rispondendo al proprio consiglio e ai propri sindaci. Una singola [ShowGovernmentReformName('cas_santa_hermandad_reform')], costituita dalle città ma comandata dalla Corona, porterebbe la pace del re in ogni villaggio e porrebbe fine al banditismo che i nobili non hanno mai voluto fermare."
 cas_found_the_santa_hermandad_decision.a: "Istituiamo la [ShowGovernmentReformNameWithNoTooltip('cas_santa_hermandad_reform')]."
 gra_pops_becomes_root_religion_tt: "Molti [pops|e] che non seguono il [religion_group|e] [ROOT.GetCountry.GetReligion.GetGroup.GetName] si convertiranno a [ROOT.GetCountry.GetReligion.GetName]"
 unlock_jinetes_variable_tt: "Sblocca l'accesso ai [advances|e] [ShowAdvanceName('gra_jinetes')] e [ShowAdvanceName('gra_mailed_jinetes')]"
 mor_cultivate_andalusi_influence: "Coltiva l'Influenza $andalusi$"
 mor_cultivate_andalusi_influence_desc: "I nostri emissari e i nostri studiosi attraversano lo Stretto settimana dopo settimana, perorando la nostra causa presso la [GetCountry('GRA').GetGovernment.GetCourtTitle] [GetCountry('GRA').GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][GetCountry('GRA').GetGovernment.GetRulerTitle]. Il lento peso del patronato, delle offerte di matrimonio e delle guarnigioni di frontiera lega le élite [GetCountry('GRA').Custom('IT_DEL_RANGO')][GetCountry('GRA').GetFlavorRank] sempre più strettamente alla nostra causa a ogni mese che passa."
 mor_cultivate_andalusi_influence_action: "Coltiva l'Influenza $andalusi$"
 mor_cultivate_andalusi_influence_active: "Coltivazione dell'Influenza $andalusi$"
 mor_cultivate_andalusi_influence_action_progress: "[Abs_CFixedPoint(GetSituationByKey('battle_for_the_strait').MakeScope.GetVariable('influence_over_granada').GetValue)|2]"
 mor_cultivate_andalusi_influence_action_progress_wordier: "#explanation_link $MODIFIER_TYPE_NAME_monthly_influence_over_granada$#!: $mor_cultivate_andalusi_influence_action_progress$"
 mor_cultivate_andalusi_influence_action_progress_long_wordier: "@diplomacy! $mor_cultivate_andalusi_influence_action_progress$"
 mor_cultivate_andalusi_influence_action_progress_tooltip: "$MODIFIER_TYPE_DESC_monthly_influence_over_granada$"
 cas_pressure_andalusi_court: "Fai Pressione sulla Corte $andalusi$"
 cas_pressure_andalusi_court_desc: "Facciamo sentire il nostro peso sulla [GetCountry('GRA').GetGovernment.GetCourtTitle] [GetCountry('GRA').Custom('IT_ADJ_FS')] attraverso ogni canale disponibile, dall'accordo sulle parias alla minaccia di incursioni di cabalgada lungo la frontiera. Ogni mese la nostra presa [GetCountry('GRA').Custom('IT_SUL_RANGO')][GetCountry('GRA').GetFlavorRank] si stringe e l'influenza [GetCountry('MOR').Custom('IT_ADJ_FS')] si affievolisce un po' di più."
 cas_pressure_andalusi_court_action: "Fai Pressione sulla Corte $andalusi$"
 cas_pressure_andalusi_court_active: "Pressione sulla Corte $andalusi$ in Corso"
 cas_pressure_andalusi_court_action_progress: "[Abs_CFixedPoint(GetSituationByKey('battle_for_the_strait').MakeScope.GetVariable('influence_over_granada').GetValue)|2]"
 cas_pressure_andalusi_court_action_progress_wordier: "#explanation_link $MODIFIER_TYPE_NAME_monthly_influence_over_granada$#!: $cas_pressure_andalusi_court_action_progress$"
 cas_pressure_andalusi_court_action_progress_long_wordier: "@diplomacy! $cas_pressure_andalusi_court_action_progress$"
 cas_pressure_andalusi_court_action_progress_tooltip: "$MODIFIER_TYPE_DESC_monthly_influence_over_granada$"
 gra_promote_sovereignty: "Promuovi la Nostra Sovranità"
 gra_promote_sovereignty_desc: "La nostra cancelleria e [GetCountry('GRA').Custom('IT_CLERGY_IL_NOSTRO')][GetCountry('GRA').GetGovernment.GetEstateName('clergy_estate')] si adoperano per ricordare a ogni principe, a ogni mercante e a ogni villaggio che [GetCountry('GRA').Custom('IT_ART_NOSTRO_RANGO')]nostr[GetCountry('GRA').Custom('IT_OA_RANGO')] [GetCountry('GRA').GetFlavorRank] è padrone di sé. Patronato, opere pubbliche e un'attenta messa in scena delle cerimonie della [GetCountry('GRA').GetGovernment.GetCourtTitle] rafforzano la dignità del nostro governo indipendente."
 gra_promote_sovereignty_action: "Promuovi la Nostra Sovranità"
 gra_promote_sovereignty_active: "Promozione della Nostra Sovranità"
 gra_promote_sovereignty_action_progress: "[SCOPE.sCountry('actor').GetModifierValue('monthly_granadan_sovereignty')]"
 gra_promote_sovereignty_action_progress_wordier: "#explanation_link $MODIFIER_TYPE_NAME_monthly_granadan_sovereignty$#!: $gra_promote_sovereignty_action_progress$"
 gra_promote_sovereignty_action_progress_long_wordier: "@legitimacy! $gra_promote_sovereignty_action_progress$"
 gra_promote_sovereignty_action_progress_tooltip: "$MODIFIER_TYPE_DESC_monthly_granadan_sovereignty$"

