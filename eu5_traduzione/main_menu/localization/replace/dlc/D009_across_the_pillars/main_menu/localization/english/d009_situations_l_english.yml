l_english:
 #
 # The Battle for the Strait
 #
 battle_for_the_strait: "Battaglia per lo Stretto"
 battle_for_the_strait_info: "Una lotta per lo [ShowLocationName('strait_of_gibraltar')] tra [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetName], [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetName] e [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName]. Chi detiene lo stretto controlla la porta tra l'Atlantico e il Mediterraneo."
 owner_christian_or_castile_tt: "Il proprietario è [ShowReligionGroupAdjective('christian')] oppure è [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetName]"
 cas_integrated_granada_lands_tt: "[GetCountry('CAS').Custom('IT_La')|U][GetCountry('CAS').GetName] possiede direttamente e detiene lo status di [core|e] su ogni località che [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] deteneva all'inizio"
 battle_for_the_strait_desc: "Le acque strette tra l'[ShowRegionName('iberia_region')] e l'[ShowContinentName('africa')] formano uno dei punti di passaggio più strategici del mondo. [GetCountry('CAS').Custom('IT_ART_RANGO')|U][GetCountry('CAS').GetLongName] guarda a sud per assicurare l'[ShowRegionNameWithNoTooltip('iberia_region')] sotto il vessillo [ShowReligionGroupAdjective('christian')]. [GetCountry('MOR').Custom('IT_ART_RANGO')|U][GetCountry('MOR').GetLongName] guarda a nord per difendere [ShowFormableCountryName('ADU_f')] e mantenere aperti i passaggi dei fedeli. [GetCountry('GRA').Custom('IT_ART_RANGO')|U][GetCountry('GRA').GetLongName], pressato da ogni lato, combatte per restare padrone della propria costa. Chi prevarrà terrà le chiavi di due mari."

 battle_for_the_strait_castilian_supremacy: "Supremazia [GetCountry('CAS').Custom('IT_ADJ_FS')]"
 battle_for_the_strait_castilian_supremacy_desc: "$BULLET$Il [modifier|e] [ShowModifier('crown_of_the_reconquista_modifier')] della durata di #Y 100 anni#!\n$BULLET$Un modificatore aggiuntivo alla [government_reform|e] [ShowGovernmentReformName('crown_castile_reform')]\n$BULLET$Accesso alla [decision|e] [ShowDecisionName('gc_decision')], che avvia la [situation|e] [ShowSituationName('golden_century')]"
 battle_for_the_strait_moroccan_supremacy: "Supremazia [GetCountry('MOR').Custom('IT_ADJ_FS')]"
 battle_for_the_strait_moroccan_supremacy_desc: "$BULLET$Il [modifier|e] [ShowModifier('protector_of_andalus_modifier')] della durata di #Y 100 anni#!\n$BULLET$Promozione a [ShowCountryRankName('rank_empire')], se non lo si è già\n$BULLET$Piena [integration|e] come [core|e] di ogni [location|e] detenuta in [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] e [ShowAreaName('murcia_area')]\n$BULLET$Progresso di [annexation|e] del #G 25%#! verso ogni [ShowSubjectTypeName('taifa')] in corso di annessione\n$BULLET$Formazione più facile di [ShowFormableCountryName('ADU_f')]\n$BULLET$Accesso alla [decision|e] [ShowDecisionName('gc_decision')], che avvia la [situation|e] [ShowSituationName('golden_century')]"
 battle_for_the_strait_granadan_sovereignty_preserved: "Sovranità Granadina Preservata"
 battle_for_the_strait_granadan_sovereignty_preserved_desc: "$BULLET$Il [modifier|e] [ShowModifier('gra_consolidated_governance_modifier')] della durata di #Y 100 anni#!\n$BULLET$Il [ShowCasusBelliName('cb_reconquer_iberia')] per riconquistare l'[ShowRegionName('iberia_region')] a costo ridotto\n$BULLET$Piena [integration|e] come [core|e] di ogni [location|e] detenuta in [ShowAreaName('granada_area')], [ShowAreaName('andalusia_area')] e [ShowAreaName('murcia_area')]\n$BULLET$Progresso di [annexation|e] del #G 25%#! verso ogni [ShowSubjectTypeName('taifa')] in corso di annessione\n$BULLET$Formazione più facile di [ShowFormableCountryName('ADU_f')]\n$BULLET$Accesso alla [decision|e] [ShowDecisionName('gc_decision')], che avvia la [situation|e] [ShowSituationName('golden_century')]"
 battle_for_the_strait_neutral_outcome: "Esito Neutrale"

 BFTS_NEUTRAL_OUTCOMES_HEADER: "Esiti Neutrali"
 BFTS_OUTCOME_CONDITIONS_TITLE: "Condizioni di Vittoria"
 BFTS_OUTCOME_REWARD_TITLE: "Ricompensa"

 this_is_castile_tt: "Questo è [GetCountry('CAS').Custom('IT_ART_RANGO')][GetCountry('CAS').GetLongName]"
 this_is_morocco_tt: "Questo è [GetCountry('MOR').Custom('IT_ART_RANGO')][GetCountry('MOR').GetLongName]"
 this_is_granada_tt: "Questo è [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetLongName]"
 this_is_a_subject_of_castile_tt: "Questo è uno [subject|e] [GetCountry('CAS').Custom('IT_Della')][GetCountry('CAS').GetName]"
 this_is_a_subject_of_morocco_tt: "Questo è uno [subject|e] [GetCountry('MOR').Custom('IT_Della')][GetCountry('MOR').GetName]"
 this_is_a_subject_of_granada_tt: "Questo è uno [subject|e] [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName]"

 #Battle for the Strait — Granadan Sovereignty tracker + Influence over Granada signed axis
 BFTS_CASTILIAN_INFLUENCE_LABEL: "Influenza Iberica"
 BFTS_MOROCCAN_INFLUENCE_LABEL:  "Influenza Maghrebina"
 BFTS_GRA_SOVEREIGNTY_LABEL:     "Sovranità Granadina"
 BFTS_GRA_SOVEREIGNTY_TITLE:     "$game_concept_granadan_sovereignty$ [Country.Custom('IT_Della')][Country.GetNameWithNoTooltip]"
 BFTS_INFLUENCE_BAR_TITLE:       "$influence_over_granada$"
 BFTS_INFLUENCE_BAR_TOOLTIP_TT:  "La corte [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName] oscilla su un asse con segno da $bfts_axis_min$ ([GetCountry('CAS').GetNameWithNoTooltip]) a $bfts_axis_max$ ([GetCountry('MOR').GetNameWithNoTooltip])"
 BFTS_INFLUENCE_MONTHLY_DRIFT_LABEL: "Deriva mensile sull'asse $influence_over_granada$"



 # ===== Battle for the Strait (migrated from battle_for_the_strait_l_english.yml) =====
 cas_appoint_adelantado_mayor: "Nomina l'Adelantado Mayor de la Frontera"
 cas_appoint_adelantado_mayor_desc: "Nominato per la prima volta nel 1253 per governare le marche conquistate ai Mori, l'Adelantado Mayor de la Frontera porta tre cariche su un'unica coppia di spalle: giudice d'appello delle terre meridionali, esecutore regio delle ordinanze emanate [GetCountry('CAS').GetGovernment.GetRuler.Custom('IT_DAL_TITOLO')][GetCountry('CAS').GetGovernment.GetRulerTitle] e comandante permanente di ogni cabalgada che attraversa il confine verso [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName]. Il ceto del nominato decide quale blocco di potere prospera presso la [GetCountry('CAS').GetGovernment.GetCourtTitle], e ogni provincia [GetCountry('CAS').Custom('IT_ADJ_FS')] al confine [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetNameWithNoTooltip] o [GetCountry('MOR').Custom('IT_Della')][GetCountry('MOR').GetName] ottiene un potenziamento permanente della guarnigione finché la Carica resta in vigore."
 cas_appoint_adelantado_mayor_act: "$cas_appoint_adelantado_mayor$"
 cas_appoint_adelantado_mayor_concept: "[character_interaction|e]"
 cas_appoint_adelantado_mayor_past: "[SCOPE.sCharacter('recipient').GetName] è il nuovo Adelantado Mayor!"
 cas_appoint_adelantado_mayor_act_past: "[SCOPE.sCountry('actor').Custom('IT_La')|U][SCOPE.sCountry('actor').GetName] ha nominato [SCOPE.sCharacter('recipient').GetName] nuovo Adelantado Mayor de la Frontera."
 cas_appoint_adelantado_mayor_desc_specific: "[SCOPE.sCharacter('recipient').GetName] diventerà il nuovo Adelantado Mayor de la Frontera."
 cas_appoint_adelantado_mayor_price: "Prezzo della Nomina dell'Adelantado Mayor"
 every_province_murcia_granada_andalusia_adelantado_mayor_tt: "Ogni [province|e] che possediamo in [ShowAreaName('murcia_area')], [ShowAreaName('granada_area')] e [ShowAreaName('andalusia_area')] beneficerà del [modifier|e] [ShowModifier('guarded_by_adelantado_mayor')], con effetto che alla fine scala con le [abilities|e] di [recipient.GetName] per #G 10#! anni"
 choose_adelantado_candidate: "Scegli un candidato"
 scales_with_character_tt: "[abilities|e] di [GetCountry('CAS').MakeScope.GetVariable('cas_adelantado_mayor_character').GetCharacter.GetName]"
 gra_reduce_castilian_influence: "Riduci l'Influenza [GetCountry('CAS').Custom('IT_ADJ_FS')]"
 gra_reduce_castilian_influence_desc: "Mobilitiamo i nostri cadì, i nostri studiosi e le famiglie delle marche contro l'ingerenza [GetCountry('CAS').Custom('IT_Della')][GetCountry('CAS').GetName] nella nostra corte e nei nostri mercati. Una pressione costante fa arretrare la presa che i [GetCountry('CAS').Custom('IT_ADJ_MP')] hanno costruito sugli affari [GetCountry('GRA').Custom('IT_DEL_NOSTRO_RANGO')]nostr[GetCountry('GRA').Custom('IT_OA_RANGO')] [GetCountry('GRA').GetFlavorRank]."
 gra_reduce_moroccan_influence: "Riduci l'Influenza [GetCountry('MOR').Custom('IT_ADJ_FS')]"
 gra_reduce_moroccan_influence_desc: "Inviamo emissari, doni d'oro e discreti avvertimenti al di là dello Stretto, affievolendo il richiamo [GetCountry('MOR').Custom('IT_Della')][GetCountry('MOR').GetName] tra le tribù e i porti che guardano alla sua corte. Senza quei volontari e quel patronato, la presa [GetCountry('MOR').Custom('IT_ADJ_FS')] [GetCountry('GRA').Custom('IT_SUL_NOSTRO_RANGO')]nostr[GetCountry('GRA').Custom('IT_OA_RANGO')] [GetCountry('GRA').GetFlavorRank] si allenta."
 gra_construct_alhambra: "Avvia l'Ampliamento dell'$alhambra$"
 gra_construct_alhambra_desc: "Convochiamo i muratori, i calligrafi e gli intagliatori di #italic muqarnaṣ#! Nasridi per avviare i lavori di una nuova ala della cittadella reale sopra la [GetCountry('GRA').GetGovernment.GetCourtTitle] di [GetCountry('GRA').GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip]. Ogni ampliamento lega la dinastia alla propria capitale e aggiunge un livello di splendore palaziale, cortili e spazio per la guarnigione sulla collina della Sabīka."
 gra_construct_alhambra_max_tt: "[ShowBuildingTypeName('alhambra')] non ha ancora raggiunto il quarto livello"
 gra_construct_alhambra_increment_tt: "Aggiunge #G +1#! al livello massimo di [ShowBuildingTypeName('alhambra')]"
 gra_alhambra_extension_desc: "Ampliamenti di [ShowBuildingTypeName('alhambra')] decretati nell'ambito della [situation|e] [ShowSituationName('battle_for_the_strait')]"
 unlock_upgrade_alhambra_decision_tt: "Sblocca la [decision|e] [ShowDecisionName('expand_the_alhambra')] "
 until_we_cease_our_projection_efforts_tt: "Finché manteniamo attivo questo [modifier|e]"
 adu_proclaim_crown_al_andalus: "Proclama $crown_of_al_andalus$"
 adu_proclaim_crown_al_andalus_desc: "Con il nostro dominio sull'[ShowContinentName('europe')] ormai completo, proclamiamo $crown_of_al_andalus$ e riuniamo i ṭā'ifa dell'[ShowRegionName('iberia_region')] sotto un unico governo, restituendo a [ShowLocationName('cordoba')] la gloria di un tempo nel nome oltre che nei fatti."
 gra_enforce_sovereignty: "Imposizione della Sovranità"
 gra_enforce_sovereignty_desc: "[GetCountry('GRA').Custom('IT_ART_NOSTRO_RANGO')|U]nostr[GetCountry('GRA').Custom('IT_OA_RANGO')] [GetCountry('GRA').GetFlavorRank] può presentarsi come potenza sovrana davanti [GetCountry('CAS').Custom('IT_Alla')][GetCountry('CAS').GetName] e [GetCountry('MOR').Custom('IT_Alla')][GetCountry('MOR').GetName], rifiutando le pretese di sovranità che vincolerebbero la nostra corona all'una o all'altra corte. Tale sfida rafforza la nostra posizione in patria ma irrigidisce ogni negoziato all'estero. Possiamo alzare o abbassare quella bandiera a seconda di ciò che la nostra posizione consente."
 attract_andalusi_refugees: "Invita i Mudéjar"
 attract_andalusi_refugees_desc: "La parola #italic mudajjan#! significa «autorizzato a restare», e da essa i regni Cristiani hanno ricavato «Mudéjar» per le famiglie Musulmane che hanno conquistato ma lasciato al loro posto sotto il proprio dominio. Inviamo emissari con salvacondotto e la promessa di una dimora, attirando coloro che preferiscono vivere sotto la nostra legge piuttosto che sotto un re Cristiano. Ogni gesto di accoglienza porta un'ondata di questi coloni da un regno Cristiano prescelto in una delle nostre province."
 bfts_attract_andalusi_refugees_tt: "Inviteremo profughi Mudéjar da una [province|e] dell'[ShowRegionName('iberia_region')] a stabilirsi nelle nostre terre"
 attract_refugees_choose_source: "Scegli la Provincia di Origine"
 attract_refugees_choose_destination: "Scegli la Provincia di Destinazione"
 gra_invite_shadhili_order_effect_tt: "Abilita l'azione [ShowGenericActionName('gra_patronize_shadhili_order')], un interruttore che aumenta il nostro progresso verso [ShowSocietyDirectionName('jurisprudence')], la nostra [legitimacy|e] mensile e la nostra [cabinet_efficiency|e] a scapito della nostra [tax_efficiency|e]"
 gra_patronize_shadhili_order: "Patrocinio dell'Ordine Shadhili"
 gra_patronize_shadhili_order_desc: "La #italic ṭarīqa#! Shadhili stabilita alla nostra corte dipende dal favore della corona. La dotazione reale delle sue #italic zāwiya#! e dei suoi studiosi ha un duplice effetto: innalza la voce dei santi nei nostri consigli e devia ricchezze che altrimenti potrebbero raggiungere il nostro tesoro. Possiamo aprire o chiudere quella borsa a seconda delle esigenze dei tempi."
 start_patronizing_shadhili_order_tt: "Estenderemo il nostro patrocinio all'Ordine Shadhili, applicando i seguenti effetti:\n [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
 stop_patronizing_shadhili_order_tt: "Porremo fine al nostro patrocinio dell'Ordine Shadhili, rimuovendo i seguenti effetti: [ShowModifierEffect('patronizing_shadhili_order_modifier')]"
 until_we_cease_our_patronship_tt: "$until_we_cease_our_projection_efforts_tt$"
 action_active: "L'[action|e] è attiva"
 unlock_patronize_shadhili_order_tt: "Sblocca l'[action|e] [ShowGenericActionName('gra_patronize_shadhili_order')] nella [situation|e] [ShowSituationName('battle_for_the_strait')]"
 hire_granadan_jinetes: "Assolda Jinetes [GetCountry('GRA').Custom('IT_ADJ_MP')]"
 hire_granadan_jinetes_desc: "I nobili di cultura [ShowCultureName('andalusi')], uomini di frontiera #italic campo#! i cui giavellotti e le cui spade corte hanno plasmato la cavalleria di ogni regno vicino, sono irrequieti sotto la tensione della [ShowSituationName('battle_for_the_strait')]. Con borse d'argento e la promessa di una paga, attiriamo una compagnia nella nostra capitale, cavalieri che conoscono ogni burrone e ogni torre di guardia da [ShowLocationName('cordoba')] ad [ShowLocationName('almeria')]."
 hire_granadan_jinetes_traditional_tt: "Recluteremo 2 [ShowUnitDefinitionName('a_granadan_jinetes')] nella nostra [capital|e]"
 hire_granadan_jinetes_modern_tt: "Recluteremo 2 [ShowUnitDefinitionName('a_granadan_jinetes_2')] nella nostra [capital|e]"
 cas_demand_muslim_converts: "Pretendi Convertiti Musulmani"
 cas_demand_muslim_converts_desc: "Costringi [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] a consegnare un suddito [ShowReligionGroupAdjective('muslim')] di rango che, una volta giunto alla nostra corte, sarà battezzato e riceverà un nuovo nome [GetCountry('CAS').GetReligion.GetGroup.GetAdjective]. I suoi doni e i suoi limiti passano a noi insieme, e non possiamo sapere in anticipo quali la cancelleria troverà utili."
 cas_demand_muslim_converts_select_title: "Scegli un Suddito Musulmano"
 cas_demand_muslim_converts_no_characters: "@trigger_no! Nessun suddito Musulmano idoneo disponibile alla corte Granadina"
 cas_demand_muslim_converts_price_abilities: "Abilità del personaggio"
 cas_demand_muslim_converts_effect_tt: "Il [character|e] scelto sarà trasferito alla nostra corte, battezzato e inserito al nostro servizio tramite un [event|e] il cui esito dipende dalle sue [abilities|e]"
 cas_dismantle_fortifications: "Smantella le Fortificazioni"
 cas_dismantle_fortifications_desc: "Ordina al nostro [ShowSubjectTypeName('vassal')] [GetCountry('GRA').GetAdjective] di abbattere le fortificazioni di una località scelta. La pietra, il legname e la muratura lavorata recuperati confluiscono nei nostri mercati Iberici, e [GetCountry('GRA').Custom('IT_ART_RANGO')][GetCountry('GRA').GetFlavorRank] resta un po' più scoperto di fronte alle nostre guarnigioni."
 cas_dismantle_fortifications_select_title: "Scegli una Località Granadina da Spogliare"
 cas_dismantle_fortifications_no_locations: "@trigger_no! Nessuna località Granadina fortificata disponibile"
 cas_dismantle_fortifications_effect_tt: "Ogni [building|e] di classe forte nella [location|e] scelta sarà distrutto. I beni recuperati confluiranno nei nostri [markets|e] a spese del [liberty_desire|e] e di una penalità duratura all'opinione del nostro stato cliente"
 cas_dismantle_fortifications_salvage_tt: "Nei nostri [markets|e], la [goods_demand|e] di [goods|e] da costruzione cala per #G 2#! anni tramite il [ShowGoodsDemandName('cas_dismantled_forts_salvage')], abbassando il costo dei nostri [buildings|e]"
 cas_dismantled_forts_salvage: "Fortificazioni [GetCountry('GRA').Custom('IT_ADJ_FP')] Recuperate"
 opinion_dismantled_our_forts: "Ha Smantellato le Nostre Fortificazioni"
 cas_reduce_granadan_sovereignty: "Riduci la Sovranità [GetCountry('GRA').Custom('IT_ADJ_FS')]"
 cas_reduce_granadan_sovereignty_desc: "Fai leva su [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] con tutto il peso della nostra posizione e priva le sue istituzioni indipendenti di un livello, legando più strettamente gli ufficiali [GetCountry('GRA').Custom('IT_DEL_RANGO')][GetCountry('GRA').GetFlavorRank] alla nostra catena di comando. Il legame tra noi si fa fragile nell'affare, e la [GetCountry('GRA').GetGovernment.GetCourtTitle] [GetCountry('GRA').Custom('IT_In')][GetCountry('GRA').GetNameWithNoTooltip] perde una parte di prestigio che non recupererà presto.\n\nQuando il nostro dominio sullo stretto sarà fuori discussione, le stesse richieste incideranno più a fondo e potranno essere rinnovate molto prima. A quel punto la [GetCountry('GRA').GetGovernment.GetCourtTitle] non ha più altri patroni a cui rivolgersi, e protesta soltanto la metà."
 BFTS_REDUCE_SOVEREIGNTY_REQUIRES_HOLD: "[GetCountry('GRA').Custom('IT_La')|U][GetCountry('GRA').GetName] deve essere un nostro [subject|e], oppure il nostro predominio sullo stretto deve aver raggiunto l'#Y Egemonia#!"
 opinion_pressured_our_sovereignty: "Ha Fatto Pressione sulla Nostra Sovranità"
 battle_for_the_strait_sovereignty_consolidated: "La sovranità su [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] è stata consolidata."
 mor_force_tribute: "Imponi Tributo"
 mor_force_tribute_desc: "Costringi [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] a entrare nei nostri ruoli di tributari. L'oro [GetCountry('GRA').Custom('IT_DEL_RANGO')][GetCountry('GRA').GetFlavorRank] fluirà a sud attraverso lo stretto, e la sua bandiera si piegherà alla nostra tanto in materia di guerra quanto di dazi."
 cas_force_tribute: "Pretendi le Parias"
 cas_force_tribute_desc: "Ripristina l'antico tributo delle parias e iscrivi di nuovo [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] nei nostri ruoli. L'oro [GetCountry('GRA').Custom('IT_DEL_RANGO')][GetCountry('GRA').GetFlavorRank] viaggerà a nord verso il nostro tesoro, e la sua corte risponderà alla nostra tanto in materia di guerra quanto di dazi."
 mor_invite_granadan_scholars: "Invita Studiosi [GetCountry('GRA').Custom('IT_ADJ_MP')]"
 mor_invite_granadan_scholars_desc: "Attira i membri del [ShowEstateTypeName('clergy_estate')] e i #italic fuqahā'#! delle #italic madrase#! di cultura [ShowCultureName('andalusi')] al di là dello stretto perché insegnino nelle nostre. Le scuole [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName] non hanno rivali nella [ShowSocietyDirectionName('jurisprudence')] [GetCountry('GRA').GetReligiousSchool.GetName], e la dottrina che portano guiderà tanto la legge quanto l'alfabetizzazione del nostro regno."
 mor_invite_granadan_advisor: "Invita un Consigliere [GetCountry('GRA').GetAdjective]"
 mor_invite_granadan_advisor_desc: "Invitiamo un dotto ecclesiastico di cultura [ShowCultureName('andalusi')] al di là dello stretto perché prenda posto alla nostra corte. I suoi scritti uniscono il rigore delle #italic madrase#! [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName] all'autorità santa dei mistici Sufi occidentali, e il gesto stesso scalderà i rapporti tra le nostre due corti."
 mor_invite_granadan_advisor_traits_tt: "Il [character|e] ottiene due [traits|e] positivi casuali adatti a servire nel nostro [cabinet|e]"
 opinion_andalusi_scholarly_exchange: "Scambio Accademico della Cultura $andalusi$"
 forced_influence: "Influenza Forzata"
 soft_diplomacy: "Diplomazia Morbida"
 defected_colony_opinion: "Colonia Disertrice"
 stole_colonial_subject: "Colonia Sottratta"
 trust_d009_diplomatic_support: "Sostegno Diplomatico"
 mor_garrison_granadan_strongholds: "Presidia le Roccaforti [GetCountry('GRA').Custom('IT_ADJ_FP')]"
 mor_garrison_granadan_strongholds_desc: "Acquartieriamo un reggimento dei nostri soldati in una provincia scelta [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName], gonfiandone la guarnigione, rallentando con il logoramento qualsiasi esercito invasore e innalzando il limite di ciò che i suoi ufficiali possono mantenere sotto controllo."
 mor_garrison_granadan_strongholds_select_title: "Scegli una Provincia Granadina da Presidiare"
 mor_garrison_granadan_strongholds_no_provinces: "@trigger_no! Nessuna provincia Granadina idonea"
 mor_garrison_granadan_strongholds_effect_tt: "La [province|e] scelta ottiene [ShowModifier('mor_garrisoned_stronghold_modifier')] per #Y 10 anni#!"
 mor_attract_andalusi_craftsmen: "Attira Artigiani di Cultura $andalusi$"
 mor_attract_andalusi_craftsmen_desc: "Inviamo reclutatori al di là dello stretto per allettare gli artigiani di una provincia [GetCountry('GRA').Custom('IT_ADJ_FS')] scelta a stabilirsi in una delle nostre. I tessitori di seta, i conciatori e i metallurgisti [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetNameWithNoTooltip] portano le loro botteghe e il loro mestiere nelle nostre città, e la provincia di destinazione gode di un ritmo di sviluppo accelerato e di un rafforzamento del ceto [ShowEstateTypeName('burghers_estate')] per tre anni."
 mor_attract_andalusi_craftsmen_choose_source: "Scegli la Provincia Granadina di Origine"
 mor_attract_andalusi_craftsmen_no_source: "@trigger_no! Nessuna provincia Granadina ha abbastanza abitanti di cultura $andalusi$"
 mor_attract_andalusi_craftsmen_choose_destination: "Scegli la Provincia di Destinazione"
 mor_attract_andalusi_craftsmen_no_destination: "@trigger_no! Nessuna provincia di destinazione disponibile"
