 BFTS_ACTION_GRANADA_NOT_RECENTLY_VICTORIOUS: "[GetCountry('GRA').Custom('IT_La')|U][GetCountry('GRA').GetName] non ci ha sconfitti in guerra negli ultimi 10 anni"

 BFTS_THRESHOLD_CAS_25_TITLE: "Punto d'Appoggio [GetCountry('CAS').GetAdjective] su $GRA$"
 BFTS_THRESHOLD_CAS_25_DESC: "[GetCountry('CAS').Custom('IT_La')|U][GetCountry('CAS').GetName] può ricorrere a [ShowCharacterInteractionName('cas_appoint_adelantado_mayor')], potenziando le guarnigioni delle proprie province al confine con [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName]. La carica decade se la sua presa sulla corte si allenta."
 BFTS_THRESHOLD_MOR_25_TITLE: "Punto d'Appoggio [GetCountry('MOR').GetAdjective] su $GRA$"
 BFTS_THRESHOLD_MOR_25_DESC: "[GetCountry('MOR').Custom('IT_La')|U][GetCountry('MOR').GetName] può ricorrere a [ShowGenericActionName('mor_force_tribute')] nei confronti [GetCountry('GRA').Custom('IT_Della')][GetCountry('GRA').GetName], purché questa non sia già uno [subject|e] ed entrambe siano in pace."
 BFTS_THRESHOLD_CAS_50_TITLE: "Predominio [GetCountry('CAS').GetAdjective] su $GRA$"
 BFTS_THRESHOLD_CAS_50_DESC: "[GetCountry('CAS').Custom('IT_La')|U][GetCountry('CAS').GetName] può ricorrere a [ShowCountryInteractionName('cas_demand_war_entry')], chiamando [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] nelle proprie guerre contro [GetCountry('MOR').Custom('IT_La')][GetCountry('MOR').GetName]. Finché la sua presa resta così salda, [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] non può più porre fine alla [situation|e] come potenza indipendente."
 BFTS_THRESHOLD_MOR_50_TITLE: "Predominio [GetCountry('MOR').GetAdjective] su $GRA$"
 BFTS_THRESHOLD_MOR_50_DESC: "[GetCountry('MOR').Custom('IT_La')|U][GetCountry('MOR').GetName] può ricorrere a [ShowCountryInteractionName('cas_demand_war_entry')], chiamando [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] nelle proprie guerre contro [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetName]. Finché la sua presa resta così salda, [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetNameWithNoTooltip] non può più porre fine alla [situation|e] come potenza indipendente."
 BFTS_THRESHOLD_CAS_75_TITLE: "Egemonia [GetCountry('CAS').Custom('IT_ADJ_FS')] su $GRA$"
 BFTS_THRESHOLD_CAS_75_DESC: "[GetCountry('CAS').Custom('IT_La')|U][GetCountry('CAS').GetName] può ricorrere a [ShowGenericActionName('cas_reduce_granadan_sovereignty')] anche mentre [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] resta indipendente. A questo livello la richiesta incide più a fondo sulla $game_concept_granadan_sovereignty$ e può essere ripetuta dopo cinque anni anziché dieci, e il risentimento che lascia è dimezzato."
 BFTS_THRESHOLD_MOR_75_TITLE: "Egemonia [GetCountry('MOR').Custom('IT_ADJ_FS')] su $GRA$"
 BFTS_THRESHOLD_MOR_75_DESC: "[GetCountry('MOR').Custom('IT_La')|U][GetCountry('MOR').GetName] può ricorrere a [ShowGenericActionName('cas_reduce_granadan_sovereignty')] anche mentre [GetCountry('GRA').Custom('IT_La')][GetCountry('GRA').GetName] resta indipendente. A questo livello la richiesta incide più a fondo sulla $game_concept_granadan_sovereignty$ e può essere ripetuta dopo cinque anni anziché dieci, e il risentimento che lascia è dimezzato."
 BFTS_THRESHOLD_CAS_100_TITLE: "Supremazia [GetCountry('CAS').Custom('IT_ADJ_FS')] su $GRA$"
 BFTS_THRESHOLD_CAS_100_DESC: "[GetCountry('CAS').Custom('IT_La')|U][GetCountry('CAS').GetName] domina lo stretto in modo assoluto. Può ricorrere a [ShowGenericActionName('vassalize_granada')] o a [ShowDecisionName('demand_conversion_of_granada')] e, una volta che l'Iberia sottostà a un dominio [ShowReligionGroupAdjective('christian')] o [GetCountry('CAS').GetAdjective], vincere la [situation|e] a proprio favore."
 BFTS_THRESHOLD_MOR_100_TITLE: "Supremazia [GetCountry('MOR').Custom('IT_ADJ_FS')] su $GRA$"
 BFTS_THRESHOLD_MOR_100_DESC: "[GetCountry('MOR').Custom('IT_La')|U][GetCountry('MOR').GetName] domina lo stretto in modo assoluto. Può ricorrere a [ShowGenericActionName('mor_vassalize_granada')] e, detenendo almeno un quinto dell'Iberia, vincere la [situation|e] a proprio favore."
