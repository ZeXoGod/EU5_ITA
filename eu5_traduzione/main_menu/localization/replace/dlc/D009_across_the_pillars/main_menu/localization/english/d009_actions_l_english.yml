l_english:
 proclaim_pase_foral: "Proclama il Pase Foral"
 proclaim_pase_foral_desc: "Invochiamo il diritto Basco del #italic pase foral#! — l'antica prerogativa per cui le signorie Basche possono riesaminare e sospendere i decreti regi ritenuti contrari ai loro fueros. La proclamazione soddisfa le aspettative della nobiltà e rafforza la stabilità, sebbene limiti temporaneamente la portata della corona."

 summon_santa_hermandad: "Convoca la Santa Hermandad"
 summon_santa_hermandad_desc: "Attiviamo la Santa Hermandad — la confraternita finanziata dalla corona, composta da guardie rurali e miliziani, che la Castiglia schierava per reprimere il banditismo e far rispettare l'ordine regio in tutto il regno. La sua mobilitazione rafforza le #Y riserve militari#! e tempra il #Y morale#! dei nostri eserciti."

 proclaim_pase_foral_action: "$proclaim_pase_foral$"
 proclaim_pase_foral_active: "Proclamazione del Pase Foral"
 proclaim_pase_foral_action_progress: "$proclaim_pase_foral$ in vigore"
 proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
 proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"

 summon_santa_hermandad_action: "$summon_santa_hermandad$"
 summon_santa_hermandad_active: "Convocazione della Santa Hermandad"
 summon_santa_hermandad_action_progress: "Riserve / Morale dell'Esercito"
 summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_long_wordier: "@manpower! $summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_tooltip: "Aumenta il recupero mensile delle riserve e il morale dell'esercito."
