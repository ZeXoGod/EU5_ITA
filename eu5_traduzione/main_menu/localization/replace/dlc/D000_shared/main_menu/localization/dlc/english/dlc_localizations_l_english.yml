 ancient_monuments_pack_key: "#italic Monumental Bonus#!"
 ancient_monuments_pack_desc: "Il [GameDLC.GetCategoryKey] [GameDLC.GetName] aggiunge nuova grafica a un insieme di otto edifici di #italic Europa Universalis V#!, permettendoti di arricchire la tua partita con antichi monumenti storici."
