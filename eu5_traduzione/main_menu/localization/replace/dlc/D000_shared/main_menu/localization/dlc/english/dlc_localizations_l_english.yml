 sacred_sites_pack_activate_desc: "Acquista la Premium Edition per attivarlo!"

 fate_of_the_phoenix_key: "#italic Fate of the Phoenix#!"
 fate_of_the_phoenix_dlc_desc: "Rivivi o fai rivivere le glorie declinanti dell'Impero Romano d'Oriente con [GameDLC.GetName], un [GameDLC.GetCategoryKey] per #italic Europa Universalis V#!.\n\nQuesto DLC aggiunge nuovi contenuti e atmosfere storiche all'Impero Bizantino, con meccaniche uniche, opzioni storiche e percorsi storici alternativi da intraprendere."
 fate_of_the_phoenix_dlc_features: "#T Nuovi contenuti per l'Impero Bizantino:#!\n$BULLET$#L Il Destino della Fenice#!: un disastro in cui Bisanzio deve porre fine alle lotte intestine e ripristinare l'autorità della corona\n$BULLET$#L Latinitas contro Rōmanismós#!: un valore sociale tra l'Occidente latino e l'eredità romana, con eventi propri\n$BULLET$#L Burocrazia Bizantina#!: 11 nuove burocrazie dell'amministrazione imperiale\n$BULLET$#L Pentarchia#!: nuove azioni ortodosse, dal sanare lo scisma al restaurare il primato di Roma\n$BULLET$#L Ellenismo#!: ristabilisci l'antica fede, con nuovi aspetti religiosi e presagi per i suoi dèi\n$BULLET$#L Successione bizantina#!, il tipo di suddito Prónoia e il casus belli Restaurare i Confini Romani\n$BULLET$#L Legionari#!, #L catafratti#! e #L fanteria e galee del fuoco greco#!\n$BULLET$#L Nuova arte bizantina#!, un monumento di Santa Sofia e inni bizantini"
 fate_of_the_phoenix_activate_desc: "Acquista la Premium Edition oppure compralo separatamente dallo store per attivarlo!"

 across_the_pillars_key: "#italic Across the Pillars#!"
 across_the_pillars_dlc_desc: "Lotta per la supremazia sull'Iberia con [GameDLC.GetName], un [GameDLC.GetCategoryKey] per #italic Europa Universalis V#!: completa la Reconquista o ristabilisci la gloria di Al-Andalus.\n\nQuesto DLC aggiunge nuovi contenuti e atmosfere storiche a Castiglia, Marocco e Granada, con meccaniche uniche, opzioni storiche e percorsi storici alternativi da intraprendere."
 across_the_pillars_dlc_features: "#T Nuovi contenuti per i paesi iberici e maghrebini:#!\n$BULLET$#L Battaglia per lo Stretto#!: Castiglia, Marocco e Granada si contendono il destino della Granada nasride\n$BULLET$#L Secolo d'Oro#!: una situazione successiva per il vincitore, con percorsi distinti per la Castiglia e per Granada o il Marocco\n$BULLET$#L Unione Iberica#!: un Matrimonio Iberico rielaborato con nuove leggi e politiche, che porta a una Spagna centralizzata o a una Monarchia Ispanica federale\n$BULLET$#L Ordini Militari Iberici#!: Santiago, Calatrava, Alcántara, Avis, Montesa e l'Ordine di Cristo\n$BULLET$Azioni di crociata e jihad iberiche\n$BULLET$#L Spedizioni uniche#!: le flotte del tesoro spagnole e la ricerca di El Dorado e di altre città leggendarie\n$BULLET$Catene di eventi #L sefardite#! e #L mudéjar#!\n$BULLET$#L Nuove burocrazie#!, riforme di governo, privilegi dei ceti, leggi, unità e leve per l'Iberia e il Maghreb\n$BULLET$Nuova #L arte#! e #L musica#! castigliana e marocchina"
 across_the_pillars_activate_desc: "Acquista la Premium Edition oppure compralo separatamente dallo store per attivarlo!"
