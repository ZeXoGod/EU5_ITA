#### TRACK NAMES AND FLAVOUR TEXT ####

 musicplayer_sol_byzantine_hymn_melodies: "Byzantine - Hymn Melodies"
 musicplayer_sol_byzantine_hymn_melodies_flavour: "Un inno basato sulla tradizione melodica del canto piano Bizantino, plasmato dal sistema modale degli otto echoi che per secoli ha guidato la musica liturgica Ortodossa."
 musicplayer_sol_byzantine_hymn_no_136: "Byzantine - Hymn No. 136"
 musicplayer_sol_byzantine_hymn_no_136_flavour: "Un'intonazione del Salmo 136 Bizantino, che si apre con la preghiera 'Padre Nostro' e con il ritornello 'Exomologiste to Kyrio, oti agathos' (Lodate il Signore, perché è buono) cantato nel tradizionale stile a domanda e risposta del canto Ortodosso."
 musicplayer_sol_byzantine_o_virgin_pure: "Byzantine - O Virgin Pure"
 musicplayer_sol_byzantine_o_virgin_pure_flavour: "Agni Parthene (O Vergine Pura) è un inno mariano Greco composto da San Nectario di Egina alla fine del XIX secolo, pubblicato per la prima volta nel suo Theotokarion nel 1905."
 musicplayer_sol_byzantine_overture_ii_odyssey: "Byzantine - Overture II Odyssey"
 musicplayer_sol_byzantine_overture_ii_odyssey_flavour: "Un'interpretazione dell'ouverture della colonna sonora principale, ispirata al suono del canto piano Bizantino che un tempo risuonava nelle chiese di Costantinopoli. Un arrangiamento che evoca la tradizione musicale dell'Impero Romano d'Oriente."


