 HINT_SORT_BY_PRIORITY: "Ordina per Priorità"
 
 hint_advisor_salute_diplomatic: "\n\"Saluti, Vostra Altezza. Sono [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('diplomatic').GetName], il vostro consigliere diplomatico e umilissimo servitore.\""
 hint_advisor_salute_administrative: "\n\"Chi vi parla porta il nome di [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('administrative').GetName], leale consigliere di Vostra Eccellenza su tutte le questioni economiche e amministrative.\""
 hint_advisor_salute_military: "\n\"Mi chiamo [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('military').GetName], il vostro esperto in questioni militari. Al vostro servizio.\""

 # Hints
 HINTS_AND_SUGGESTIONS: "Suggerimenti e consigli"
 MANPOWER_HINT: "Riserve Basse!"
 manpower_topbar_hint: "Guadagniamo [manpower_with_icon|e] principalmente costruendo certi tipi di [building_with_icon|e]." 
 MANPOWER_HINT_EXTRA: "Potremmo costruire i seguenti edifici per ottenere più [manpower_with_icon|e]:" 
 MANPOWER_HINT_NONE: "Purtroppo, non ci sono edifici che potremmo costruire per ottenere Riserve."
 MANPOWER_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 
 SAILORS_HINT: "Pochi Marinai!"
 sailors_topbar_hint: "Guadagniamo [sailors_with_icon|e] principalmente costruendo specifici tipi di [buildings_with_icon|e] in [locations_with_icon|e] costiere." 
 SAILOR_HINT_EXTRA: "Potremmo costruire i seguenti edifici per ottenere più Marinai:"
 SAILOR_HINT_NONE: "Purtroppo, non ci sono edifici che potremmo costruire per ottenereMarinai."
 SAILOR_HINT_BUILDING: "$BULLET_WITH_TAB$[BUILDING_TYPE.GetName]"
 INVALID_MODIFIER_TYPE: "Ricerca di tipo di modificatore non valido!"
 EMPTY_RESEARCH_HINT: "Possiamo selezionare una ricerca!"
 empty_research_topbar_hint: "@trigger_no! Non c'è alcuno svantaggio nell'avere una [research_with_icon|e] attiva e attualmente perdiamo progressi che altrimenti potrebbero essere realizzati." 
 NO_BUILDINGS_WITH_MODIFIER: "Nessuno"
 
 GOLD_HINT: "Siamo in deficit!"
 gold_topbar_hint: "Se siamo in deficit, possiamo ridurre le nostre [expenses_with_icon|e], aumentare le [taxes_with_icon|e], o [mint_with_icon|e] più monete. Se esauriamo i [gold_with_icon|e], saremo costretti a prendere [loans_with_icon|e] e alla fine potremmo andare in [bankrupt_with_icon|e]." 
 
 STABILITY_HINT: "Il nostro paese è instabile!"
 stability_topbar_hint: "Le azioni che possiamo intraprendere per aumentare la stabilità includono:\n$BULLET_WITH_TAB$Aumentare il numero di [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')].\n$BULLET_WITH_TAB$Investire più [budget_with_icon|e] sulla stabilità.\n$BULLET_WITH_TAB$Chiedere al [cabinet_with_icon|e] di [ShowCabinetActionName('stabilize_country')]." 
 
 LEGITIMACY_HINT: "[Localize( GetPlayer.GetGovernment.GetGovernmentType.GetPowerKey )] bassa!"
 legitimacy_topbar_hint: "Ci sono diversi modi per affrontare questo problema:\n$BULLET_WITH_TAB$Aumentare il [budget_with_icon|e] destinato al [court_maintenance_with_icon|e].\n$BULLET_WITH_TAB$Chiedere al [cabinet_with_icon|e] di [ShowCabinetActionName('strengthen_government')]." 
 devotion_topbar_hint: "$legitimacy_topbar_hint$"
 republican_tradition_topbar_hint: "$legitimacy_topbar_hint$"
 horde_unity_topbar_hint: "$legitimacy_topbar_hint$"
 tribal_cohesion_topbar_hint: "$legitimacy_topbar_hint$"
 GOLD_VIEW_HINT: "Visualizza consigli sul deficit"
 ###
 hint_in_deficit: "Bilancio Negativo"
 hint_in_deficit_hint_text: "$hint_in_deficit_hint_text_1$\n\n$hint_in_deficit_hint_text_2$\n\n$hint_in_deficit_hint_text_3$"
 hint_in_deficit_hint_text_1: "Abbiamo un bilancio negativo. Se non stiamo attenti, ciò potrebbe portare a debiti o persino alla bancarotta."
 hint_in_deficit_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Vai al @economy_panel![Link('economy', '', 'lateralview_economy_entry_name')] per vedere le [income_with_icon|e] e le [expenses]. Puoi muovere i cursori per aumentare le [taxes_with_icon|e] o abbassare i costi.\n@arrow_bonus_tier_2! Assicurati che tutti gli [buildings_with_icon|E] siano redditizi, oppure costruiscine di nuovi se possiamo sostenerli. Puoi farlo nel @production_panel![Link('production', '', 'lateralview_production_entry_name')].\n@arrow_bonus_tier_2! Gestire o sfruttare i [estates_with_icon|E] può anche fornire guadagni significativi a breve o a lungo termine. Bisogna essere consapevoli che i ceti possono anche detenere un significativo potere politico e fare troppo affidamento su di esse può essere rischioso. Lo trovi nel @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]\n@arrow_bonus_tier_1! Stabilire [trades_with_icon|E] redditizi è anche un'ottima fonte di entrate. Esamina le rotte commerciali esistenti o potenziale nel @economy_panel![Link('trade', '', 'lateralview_trade_entry_name')]" 
 hint_in_deficit_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! [laws_with_icon|E], [reforms_with_icon|E], [diplomacy_with_icon|E] e altro ancora possono anche fornire opzioni per risolvere un bilancio negativo." 
 hint_in_deficit_military: "\"La guerra può essere costosa nel breve termine, ma se avremo successo potremo farla pagare ai nostri nemici. Conquistare territori potrebbe darci guadagni a lungo termine, ed estorcere i nostri nemici può fornire un afflusso di ricchezza a breve termine.\""
 hint_in_deficit_explorer: "\"Il grande ignoto sarà di certo pieno di ricchezze, maturo per lo sviluppo e il saccheggio.\""
 hint_in_deficit_administrative: "\"Stabilire il dominio nei nostri mercati interni sarebbe un ottimo modo per sviluppare la nostra ricchezza. Se ci sentiamo ancora più ambiziosi, stabilire punti d'appoggio nei mercati esteri può guidare la crescita ancora di più.\""
 hint_in_deficit_diplomatic: "\"Come dice il proverbio, dobbiamo spendere denaro per fare denaro! Assicurarsi che i nostri edifici e pop siano redditizi è il modo migliore per invertire la rotta.\""
 ###
 hint_cultural_capacity: "Superamento della Capacità Culturale"
 hint_cultural_capacity_hint_text: "$hint_cultural_capacity_hint_text_1$\n\n$hint_cultural_capacity_hint_text_2$\n\n$hint_cultural_capacity_hint_text_3$"
 hint_cultural_capacity_hint_text_1: "Sebbene il multiculturalismo possa offrire molti benefici, le nazioni impreparate per gli oneri amministrativi e prive di [cultural_capacity_with_icon|E] subiranno penalità. Il [pops_with_icon|E] appartenente a [cultures_with_icon|E] diverse dalla [primary_culture_with_icon|E] sarà di norma considerati come [non_accepted_culture_short_with_icon|E], ma potrà diventare [tolerated_culture_short_with_icon|E] o [accepted_culture_short_with_icon|E] a un certo costo." 
 hint_cultural_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considera la possibilità di declassare una cultura meno importante strategicamente per ridurne i costi.\n@arrow_bonus_tier_2! Ci sono fonti di [ShowModifierTypeName('cultures_capacity')], che si trovano comunemente nelle [government_reforms_with_icon|E] e nei [advances_with_icon|E]." 
 hint_cultural_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! L'[assimilation_with_icon|e] può anche aiutare a ridurre il numero di culture in un paese." 
 hint_cultural_capacity_military: "\"Sfruttare al massimo le nostre culture è vitale per generare tradizione culturale e influenza — dandoci un vantaggio in caso di conflitto culturale. Aumentare i diritti delle culture straniere ci concederà anche leve e soldati aggiuntivi.\""
 hint_cultural_capacity_administrative: "\"La nostra cultura si esprime anche attraverso le meravigliose opere d'arte prodotte dagli artisti della nostra nazione. Dopotutto, cos'è una nazione se non la somma della sua influenza sul mondo?\""
 hint_cultural_capacity_diplomatic: "\"Con il tempo, le culture straniere potrebbero assimilarsi per avvicinarsi alla nostra cultura primaria in [GetPlayer.GetNameWithNoTooltip]! Chi non vorrebbe essere [GetPlayer.GetCulture.GetNameWithNoTooltip]?\""
 ###
 hint_unhappy_estates: "Ceti Scontenti"
 hint_unhappy_estates_hint_text: "$hint_unhappy_estates_hint_text_1$\n\n$hint_unhappy_estates_hint_text_2$\n\n$hint_unhappy_estates_hint_text_3$"
 hint_unhappy_estates_hint_text_1: "Mantenere soddisfatti i [estates_with_icon|e] è una parte importante e quotidiana della gestione di un Paese. Insieme, essi rappresentano una quota significativa della potenza economica e militare del paese.\n\nOgni [estate] sleale infliggerà penalità al [country] e renderà i [pops_with_icon|e] che lo costituiscono molto propensi a unirsi alle [rebellions_with_icon|e]."
 hint_unhappy_estates_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! La loro produzione e la [estate_satisfaction_short_with_icon|E] possono essere gestite concedendo o revocando privilegi nel @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Anche aumentare e abbassare le tasse nel @economy_panel![Link('economy', '', 'lateralview_economy_entry_name')] influenzerà il loro grado di soddisfazione." 
 hint_unhappy_estates_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il [parliament_with_icon|e] può anche essere usato per aiutare a gestire la [estate_satisfaction_with_icon|e].\n@hint! Impara di più sui [rebel_movements_with_icon] nel [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." 
 hint_unhappy_estates_administrative: "\"I ceti sono assolutamente vitali per un sano impero commerciale. Sì, potremmo dover rinunciare a una certa autorità nel lungo periodo, ma pensate all'economia!\""
 hint_unhappy_estates_diplomatic: "\"I nostri ceti possono persino avere opinioni su questioni diplomatiche. Potrebbe valere la pena considerare la loro valutazione di una potenza straniera quando si valutano alleanze o patti.\""
 hint_unhappy_estates_military: "\"I nostri ceti forniscono leve importantissime per alimentare l'espansione. Se non le manteniamo dalla nostra parte, potremmo trovarci con un deficit di reclute proprio quando ne avremo bisogno.\""
 ESTATE_CONTEXT_TEXT: "Nel tuo Paese, i seguenti ceti sono scontenti: $LIST$\n\n$TEXT$"
 HINT_UNHAPPY_ESTATE: "[ESTATE.GetName]"
 ###
 hint_manpower: "Riserve"
 hint_manpower_hint_text: "$hint_manpower_hint_text_1$\n\n$hint_manpower_hint_text_2$\n\n$hint_manpower_hint_text_3$"
 hint_manpower_hint_text_1: "Le nostre [manpower_with_icon|e] rappresentano gli uomini pronti a essere reclutati come [regulars_with_icon|e] per i nostri [armies_with_icon|e]. I Regolari sono nettamente superiori alle [levies_with_icon|e] in [battle_with_icon|e], ma sono costosi, quindi non tutti i [country_with_icon|e] possono permetterseli all'inizio del gioco." 
 hint_manpower_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Se facciamo affidamento sui [regulars] per condurre una guerra, avere poche [manpower] limita severamente la nostra capacità di rifornire i nostri [armies_with_icon|e], per cui non è saggio dichiarare [war_with_icon|E] in queste circostanze.\n@arrow_bonus_tier_2! Se stiamo esaurendo le Riserve durante una guerra, è possibile fare maggior uso delle [levies_with_icon|E], ingaggiare [mercenaries_with_icon|E], o persino considerare di chiedere la [peace_with_icon|E]." 
 hint_manpower_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo aumentare le Riserve massime della nostra nazione e la capacità di reclutare un esercito permanente con vari [buildings_with_icon|E].\n@hint! Anche i [estate_privileges_with_icon|E] e le [laws_with_icon|E] possono influenzare il nostro potenziale di Riserve." 
 hint_manpower_diplomatic: "\"Un esercito permanente d'élite, composto da bravi uomini e ragazzi [GetPlayer.Custom('IT_ADJ_MP')], è probabilmente la forza combattente più efficace, uomo per uomo.\""
 hint_manpower_military: "\"La conquista dovrebbe utilizzare ogni strumento a nostra disposizione. Un esercito di vasta portata dovrebbe utilizzare mercenari, contingenti e truppe regolari allo stesso modo.\""
 hint_manpower_administrative: "\"Ricordate solo che ogni soldato che muore sul campo di battaglia è un bracciante in meno a faticare nei campi. La guerra è costosa.\""
 ###
 hint_low_stability: "Stabilità Bassa"
 hint_low_stability_hint_text: "$hint_low_stability_hint_text_1$\n\n$hint_low_stability_hint_text_2$\n\n$hint_low_stability_hint_text_3$"
 hint_low_stability_hint_text_1: "Se la nostra [stability_with_icon|E] è bassa, corriamo un rischio crescente che i [pops_with_icon|E] si uniscano a una [rebellion_with_icon|E], che l'insoddisfazione dei [estate_with_icon|E] conduca a una [civil_war_with_icon|E] e che si verifichi uno stato generale di disordini nella nostra nazione." 
 stability_raise_actions: "@arrow_bonus_tier_3! Investire più [budget_with_icon|e] nella stabilità.\n@arrow_bonus_tier_2! Chiedere al [cabinet_with_icon|e] di [ShowCabinetActionName('stabilize_country')]\n@arrow_bonus_tier_1! Aumentare il numero di [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')]." 
 hint_low_stability_hint_text_2: "#T Azioni Raccomandate:#!\n$stability_raise_actions$"
 hint_low_stability_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ci sono alcune altre fonti di stabilità, come i [advances_with_icon|e] o le [policies_with_icon|e].\n@hint! Ricorda che la stabilità è anche consumata da alcune azioni importanti come dichiarare [wars_with_icon|E] senza un appropriato [casus_belli_with_icon|e] o cambiare una [law_with_icon|e]." 
 hint_low_stability_administrative: "\"Una nazione con alta stabilità è, ovviamente, una nazione in stato di prosperità! Quando i raccolti sono abbondanti, anche il flusso di ricchezza nelle nostre casse lo è.\""
 hint_low_stability_military: "\"Una nazione non può esercitare in sicurezza il dominio senza prima assicurarsi la pacificazione della sua popolazione. La gente comune ama tanto i suoi forconi...\""
 hint_low_stability_diplomatic: "\"I nostri vicini cominceranno a guardarci con aria di superiorità se facciamo precipitare il nostro paese nella rovina. Potremmo forse fare qualcosa al riguardo?\""
 ###
 hint_very_low_stability: "Stabilità Estremamente Bassa"
 hint_very_low_stability_hint_text: "$hint_very_low_stability_hint_text_1$\n\n$hint_very_low_stability_hint_text_2$\n\n$hint_very_low_stability_hint_text_3$"
 hint_very_low_stability_hint_text_1: "La nostra [stability_with_icon|E] è estremamente bassa e corriamo il grave rischio che i [pops_with_icon|E] si uniscano a una [rebellion_with_icon|E], che l'insoddisfazione dei [estate_with_icon|E] conduca a una [civil_war_with_icon|E] e che i nostri nemici colgano l'opportunità di colpire mentre siamo deboli." 
 hint_very_low_stability_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dovremmo aumentare la stabilità il prima possibile ed evitare di dichiarare altre [wars_with_icon|E] o di intraprendere ulteriori azioni che riducano la stabilità.\n$stability_raise_actions$" 
 hint_very_low_stability_hint_text_3: "$hint_low_stability_hint_text_3$"
 hint_very_low_stability_administrative: "\"Come ci si può aspettare che qualcuno faccia affari in un'economia come questa? Qualcuno ci aiuti a mettere in ordine il bilancio, il nostro bestiame sta morendo di fame.\""
 hint_very_low_stability_military: "\"Qualsiasi nemico [GetPlayer.Custom('IT_Della')][GetPlayer.GetNameWithNoTooltip] sarebbe assolutamente entusiasta di quanto siamo deboli in questo momento. Dovremmo aspettarci che i nostri rivali e nemici stiano iniziando a tramare contro di noi.\""
 hint_very_low_stability_diplomatic: "\"Mentre una nazione in un periodo di alta stabilità sperimenta un'eccellente mobilità sociale, noi sembriamo aver inventato una sorta di demobilitazione sociale.\""
 ###
 hint_low_legitimacy: "Bassa Legittimità"
 hint_low_legitimacy_hint_text: "$hint_low_legitimacy_hint_text_1$\n\n$hint_low_legitimacy_hint_text_2$\n\n$hint_low_legitimacy_hint_text_3$"
 hint_low_legitimacy_hint_text_1: "La [legitimacy_with_icon|E] rappresenta la visione che il mondo ha del diritto a governare del nostro [GetPlayer.GetGovernment.GetRulerTitle]. Se scende troppo, non solo rinunceremo a qualsiasi beneficio al [crown_power_with_icon|E] e alla ridotta probabilità di [rebellion_with_icon|E], ma inizieremo a subire penalità alla soddisfazione dei [estate_with_icon|E] e alla [righteousness_with_icon|E]." 
 hint_low_legitimacy_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dovremmo mirare a mantenere la nostra legittimità più alta possibile, per minimizzare qualsiasi potenziale penalità.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance_with_icon|e] aiuterà a mantenere alta la [legitimacy_with_icon|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [legitimacy_with_icon|e] come i [advances_with_icon|e] o le [policies_with_icon|e].\n@arrow_bonus_tier_1! Seleziona l'[cabinet_action_with_icon|e] denominata [ShowCabinetActionName('strengthen_government')]." 
 hint_low_legitimacy_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come la maggior parte dei valori importanti, ci vorrà tempo per creare una visione favorevole della tua [dynasty_with_icon|E], quindi assicurati di pensare a lungo termine." 
 hint_low_legitimacy_administrative: "\"Chiunque controlli i registri della nostra ascendenza e la magnificenza della nostra corte non potrà negare il nostro diritto a governare.\""
 hint_low_legitimacy_military: "\"Come possiamo aspettarci che le nostre armate siano temute se i nostri stessi soldati dubitano della nostra leadership?\""
 hint_low_legitimacy_diplomatic: "\"A volte, la forza interiore può derivare da come gli altri ci percepiscono e i nostri alleati possono anche aiutarci nei momenti difficili.\""
 ###
 hint_low_republican_tradition: "Bassa Tradizione Repubblicana"
 hint_low_republican_tradition_hint_text: "$hint_low_republican_tradition_hint_text_1$\n\n$hint_low_republican_tradition_hint_text_2$\n\n$hint_low_republican_tradition_hint_text_3$"
 hint_low_republican_tradition_hint_text_1: "La [republican_tradition_with_icon|E] rappresenta il punto d'appoggio del Repubblicanesimo all'interno della nostra [GetPlayer.GetGovernment.GetGovernmentType.GetName]. Se scende troppo, non solo perderemo i benefici per l'[legislative_efficiency_with_icon|E] e la ridotta probabilità di [rebellion_with_icon|E], ma inizieremo a subire gravi penalità al costo per aumentare la [stability_with_icon|E]." 
 hint_low_republican_tradition_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dobbiamo mirare a mantenere la nostra tradizione più alta possibile per minimizzare qualsiasi potenziale penalità.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance_with_icon|e] aiuterà a mantenere alta la [republican_tradition_with_icon|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [republican_tradition_with_icon|e] come i [advances_with_icon|e] o le [policies_with_icon|e].\n@arrow_bonus_tier_1! Anche cambiare [ruler_with_icon|e] durante un'[election_with_icon|e] aiuterà a mantenere alta la [republican_tradition_with_icon|e]." 
 hint_low_republican_tradition_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come la maggior parte dei valori importanti, insegnare alla popolazione i valori del Repubblicanesimo è un'impresa a lungo termine, quindi pensa in anticipo."
 hint_low_republican_tradition_administrative: "\"Le elezioni sono un processo naturale di ogni repubblica sana.\""
 hint_low_republican_tradition_military: "\"Anche i mercenari non saranno disposti a combattere per noi se sembreremo dei tiranni.\""
 hint_low_republican_tradition_diplomatic: "\"Nessuna nazione che si vanti della propria forza si allineerà volontariamente a un Paese che ignora palesemente i principi della sua fondazione.\""
 ###
 hint_low_devotion: "Bassa Devozione"
 hint_low_devotion_hint_text: "$hint_low_devotion_hint_text_1$\n\n$hint_low_devotion_hint_text_2$\n\n$hint_low_devotion_hint_text_3$"
 hint_low_devotion_hint_text_1: "$game_concept_devotion_desc$ Se scende troppo, non solo perderemo i benefici per l'[religious_influence_with_icon|E] e la ridotta probabilità di [rebellion_with_icon|E], ma inizieremo a subire penalità alla soddisfazione dei [estate_with_icon|E]." 
 hint_low_devotion_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dobbiamo mirare a mantenere la nostra devozione più alta possibile per minimizzare qualsiasi potenziale penalità.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance_with_icon|e] aiuterà a mantenere alta la [devotion_with_icon|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [devotion_with_icon|e] come i [advances_with_icon|e] o le [policies_with_icon|e]." 
 hint_low_devotion_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come la maggior parte dei valori importanti, promuovere lo zelo religioso non è un affare che si risolve in una notte, quindi assicurati di pensare a lungo termine."
 hint_low_devotion_administrative: "\"Non è sufficiente per noi rappresentare la fede e posare come suoi difensori, dobbiamo anche sembrare tali.\""
 hint_low_devotion_military: "\"Se i nostri eserciti devono rappresentare la spada e lo scudo dei fedeli, dobbiamo essere il faro per cui combattono.\""
 hint_low_devotion_diplomatic: "\"Dovrebbe essere nostro obiettivo diffondere la nostra fede il più lontano possibile, ma nessuno sarà disposto a credere alle nostre parole se non sembriamo pii.\""
 ###
 hint_low_horde_unity: "Bassa Unità dell'Orda"
 hint_low_horde_unity_hint_text: "$hint_low_horde_unity_hint_text_1$\n\n$hint_low_horde_unity_hint_text_2$\n\n$hint_low_horde_unity_hint_text_3$"
 hint_low_horde_unity_hint_text_1: "$game_concept_horde_unity_desc$"
 hint_low_horde_unity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Scacciare i nostri nemici davanti a noi è di gran lunga il metodo più efficace per unificare un'Orda.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance_with_icon|e] aiuterà a mantenere alta l'[horde_unity_with_icon|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [horde_unity_with_icon|e] come i [advances_with_icon|e] o le [policies_with_icon|e]." 
 hint_low_horde_unity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ci potrebbero essere conseguenze devastanti se la nostra unità è troppo bassa, quindi faremmo meglio a mantenerla alta."
 hint_low_horde_unity_administrative: "\"Dividere e conquistare è una strategia ben nota. Se non saremo uniti, saremo noi a essere conquistati.\""
 hint_low_horde_unity_military: "\"Come dice il nostro proverbio: le cose buone arrivano a coloro che le strappano ai deboli. Il potere ci unisce e con il potere saremo uniti!\""
 hint_low_horde_unity_diplomatic: "\"La forza della nostra abilità di combattimento è direttamente influenzata da quanto siamo uniti come tribù. Il successo in guerra e nella conquista è una profezia che si autoavvera.\""
 ###
 hint_low_tribal_cohesion: "Bassa Coesione Tribale"
 hint_low_tribal_cohesion_hint_text: "$hint_low_tribal_cohesion_hint_text_1$\n\n$hint_low_tribal_cohesion_hint_text_2$\n\n$hint_low_tribal_cohesion_hint_text_3$"
 hint_low_tribal_cohesion_hint_text_1: "$game_concept_tribal_cohesion_desc$ A differenza di altri [government_types_with_icon|E], quelli tribali beneficiano di dimensioni delle leve significativamente maggiori man mano che la coesione aumenta. Se vogliamo prendere decisioni militari efficaci, dovremo mantenere il sostegno delle tribù." 
 hint_low_tribal_cohesion_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_2! Aumentare il [court_maintenance_with_icon|e] aiuterà a mantenere alta la [tribal_cohesion_with_icon|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [tribal_cohesion_with_icon|e] come i [advances_with_icon|e] o le [policies_with_icon|e]." 
 hint_low_tribal_cohesion_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ci potrebbero essere conseguenze devastanti se la nostra coesione è troppo bassa, quindi faremmo meglio a mantenerla alta."
 hint_low_tribal_cohesion_administrative: "\"Se la ignoriamo, la nostra coesione crollerà. Gestire un Paese richiede attenzione ai dettagli.\""
 hint_low_tribal_cohesion_military: "\"La scarsa coesione tribale ci rende deboli. La debolezza ci frattura ulteriormente. Non proseguiamo su quella strada, o potremmo ritrovarci conquistati e ridotti in schiavitù.\""
 hint_low_tribal_cohesion_diplomatic: "\"I ceti sono radicati in così tanti aspetti di un Paese che quasi ogni azione che intraprendiamo può avere conseguenze a lungo termine. La strategia richiede una pianificazione a lungo termine.\""
 ###
 hint_war_exhaustion: "Alta Stanchezza da Guerra"
 hint_war_exhaustion_hint_text: "$hint_war_exhaustion_hint_text_1$\n\n$hint_war_exhaustion_hint_text_2$\n\n$hint_war_exhaustion_hint_text_3$"
 hint_war_exhaustion_hint_text_1: "La [war_exhaustion_with_icon|E] è un valore che rappresenta la stanchezza generale che la nostra popolazione prova a causa dell'essere in guerra. Alti livelli possono essere estremamente pericolosi per qualsiasi paese. Man mano che la stanchezza da guerra aumenta, ridurrà l'efficacia in combattimento del nostro [army_with_icon|E] e delle [levies_with_icon|E], la crescita dei nostri [pops_with_icon|E] e rovinerà la nostra economia." 
 hint_war_exhaustion_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il metodo più efficace e garantito è la pace.\n@arrow_bonus_tier_2! Alcune [laws_with_icon|E] e [estate_privileges_with_icon|E] possono aiutare a ridurre la stanchezza da guerra nel tempo." 
 hint_war_exhaustion_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Dovremmo misurare le nostre conquiste e non dichiarare [wars_with_icon|E] se abbiamo già un alta stanchezza da guerra." 
 hint_war_exhaustion_administrative: "\"Le guerre decisive possono portare benefici, ma una popolazione stanca della guerra può solo essere una cosa negativa. La produzione diminuisce, il consumo diminuisce, francamente - tutto diminuisce!\""
 hint_war_exhaustion_military: "\"La stanchezza da guerra può essere pericolosa, ma è principalmente il risultato di tattiche scadenti. Perdite ingenti e sconfitte significative rivolteranno rapidamente il nostro popolo contro di noi.\""
 hint_war_exhaustion_diplomatic: "\"Perdere una guerra non è mai una cosa buona, ma subire un'amara sconfitta può anche mettere il nostro popolo in uno stato d'animo di vendetta. Il Revanscismo è un potente oppiaceo.\""
 ###
 hint_low_sailors: "Marinai"
 hint_low_sailors_hint_text: "$hint_low_sailors_hint_text_1$\n\n$hint_low_sailors_hint_text_2$\n\n$hint_low_sailors_hint_text_3$"
 hint_low_sailors_hint_text_1: "$game_concept_sailors_desc$"
 hint_low_sailors_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Se facciamo affidamento sulle [ships_with_icon|e] per condurre una guerra, avere pochi Marinai limita severamente la nostra capacità di rifornire le nostre [navies_with_icon|e], pertanto non è saggio dichiarare [war_with_icon|E] con pochi marinai.\n@arrow_bonus_tier_2! Anche le [explorations_with_icon|e] richiedono marinai, quindi dovremmo pianificarle di conseguenza." 
 hint_low_sailors_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo ampliare la produzione di marinai della nostra nazione con vari [buildings_with_icon|E].\n@hint! Anche i [estate_privileges_with_icon|E] e le [laws_with_icon|E] possono influenzare il nostro potenziale di marinai." 
 hint_low_sailors_administrative: "\"Chi controlla il mare, controlla la ricchezza del mondo. Una forte tradizione navale e marinara va di pari passo con il dominio commerciale.\""
 hint_low_sailors_military: "\"Una marina forte con marinai per equipaggiarla consente lo sfruttamento sia di terre lontane sia di quelle interne. Persino i soldati che operano oltreoceano possono beneficiare di linee di rifornimento protette.\""
 hint_low_sailors_diplomatic: "\"Gli edifici navali spesso hanno benefici diretti sul nostro potenziale commerciale. Vale la pena considerare le sinergie tra questi ambiti.\""
 ###
 hint_low_diplomats: "Pochi Diplomatici"
 hint_low_diplomats_hint_text: "$hint_low_diplomats_hint_text_1$\n\n$hint_low_diplomats_hint_text_2$\n\n$hint_low_diplomats_hint_text_3$"
 hint_low_diplomats_hint_text_1: "I [diplomats_with_icon|E] sono necessari per gestire le relazioni diplomatiche con altri paesi. Molte azioni, come il Miglioramento delle Relazioni, ci costeranno diplomatici nel tempo, mentre svolgere azioni una tantum richiede di solito un costo fisso." 
 hint_low_diplomats_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Annullare il miglioramento delle relazioni con alcuni paesi libererà alcuni dei nostri diplomatici se non ne abbiamo abbastanza.\n@arrow_bonus_tier_2! Possiamo anche ottenere più diplomatici da altre fonti come i [advances_with_icon|e]." 
 hint_low_diplomats_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Sebbene sia utile mantenere una riserva di diplomatici per azioni opportunistiche, l'organizzazione dei nostri diplomatici per piani a lungo termine è altrettanto vitale per il successo."
 hint_low_diplomats_administrative: "\"Mantenere buone relazioni è la chiave per un impero redditizio! L'accesso a mercati maggiori e più numerosi è destinato a seguire un'amicizia con i nostri vicini.\""
 hint_low_diplomats_military: "\"I diplomatici possono anche essere usati per affermare il nostro dominio sui paesi più deboli. Per mezzo dell'amicizia o della minaccia, più siamo forti, più è probabile che gli altri si sottomettano.\""
 hint_low_diplomats_diplomatic: "\"Riformare e far progredire il nostro governo è un modo sicuro per migliorare la nostra capacità di diplomazia aggiuntiva. Naturalmente, alcune culture sono semplicemente più in sintonia con l'arte della persuasione di altre.\""
 LOW_DIPLOMATS_HINT: "Pochi Diplomatici!"
 

 ### Low Food in Market
 hint_low_food_in_market: "Cibo Insufficiente sul Mercato"
 hint_low_food_in_market_hint_text: "$hint_low_food_in_market_hint_text_1$\n\n$hint_low_food_in_market_hint_text_2$\n\n$hint_low_food_in_market_hint_text_3$"
 hint_low_food_in_market_hint_text_1: "I Mercati richiedono una quantità sufficiente di [food_with_icon|E] immagazzinato per rifornire le [provinces_with_icon|E] che lo richiedono. Senza questo, le località appartenenti a tali province potrebbero finire per soffrire di [starving_with_icon|E]." 
 hint_low_food_in_market_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Migliorare le [rgo_with_icon|e] che producono cibo ne aumenterà l'offerta.\n@arrow_bonus_tier_2! Possiamo [import_with_icon|e] cibo stabilendo [trades_with_icon|e] di [goods_with_icon|e] che producono cibo." 
 hint_low_food_in_market_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ridurre la quantità di [buildings_with_icon|e] in una [location_with_icon|e] farà sì che anche i [pops_with_icon|e] tornino all'[subsistence_agriculture_with_icon|e]." 
 HINT_MARKET_ENTRY: "[MARKET.GetName]"
 HINT_BUILDING_ENTRY: "[BUILDING_TYPE.GetName]"
 LOW_FOOD_CAP_TEXT: "[SelectLocalization( StringIsEmpty( GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building') ), Localize('LOW_FOOD_NO'), Localize( 'LOW_FOOD_YES' ) )]"
 LOW_FOOD_YES: "\n@arrow_bonus_tier_1! Se abbiamo [merchant_capacity_with_icon|E], potremmo creare un'importazione di cibo da un altro mercato che ha un surplus.\n\nSe non abbiamo capacità, costruire un edificio come [GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building')] può aumentare il nostro potenziale commerciale." 
 LOW_FOOD_NO: "\n\nSe abbiamo [merchant_capacity_with_icon|E], potremmo creare un'importazione di cibo da un altro mercato che ha un surplus." 
 LOW_MARKET_FOOD_TEXT: "La riserva di [food_with_icon|E] in $LIST$ ha raggiunto livelli critici.$LOW_FOOD_CAP_TEXT$" 
 LOW_MARKET_FOOD_TEXT_BUILDINGS: "La riserva di [food_with_icon|E] in: $LIST$ ha raggiunto livelli critici.\n\nCi sono diversi approcci per gestire la carenza di cibo in un mercato. Più cibo produce una località, minore sarà il carico che eserciterà sulla provincia e sul mercato a cui appartiene, aiutando potenzialmente anche altre località se genera un surplus.\n\n\n@arrow_bonus_tier_3! Le [rgo_with_icon|e] sono la fonte principale di [food], specialmente nelle località con alta [food_productivity_with_icon|e]. Dovremmo cercare di espandere queste per prime, soprattutto se il nostro [market] è a corto di [food].\n@arrow_bonus_tier_2! [buildings_with_icon|E] come $BUILDING_LIST$ potrebbero anche aumentare la produzione di cibo se la produzione di [goods_with_icon|E] corrisponde.$LOW_FOOD_CAP_TEXT$" 
 hint_low_food_in_market_administrative: "\"I Mercati con località specializzate nella produzione di cibo offriranno sia sicurezza sia un potenziale estremo di profitto. Se altri devono venire da noi per sopravvivere, noi deteniamo una leva quasi illimitata.\""
 hint_low_food_in_market_military: "\"Mentre la nostra capacità di commercio è limitata dalle infrastrutture, un'economia di importazione deve di solito essere supportata da una forte presenza navale. Senza di essa, ci mettiamo alla mercé di chiunque osi sfidare le nostre rotte commerciali.\""
 hint_low_food_in_market_diplomatic: "\"Un'economia autosufficiente di commestibili è un bell'obiettivo, ma gestire un'economia di importazione per sfamare il popolo [GetPlayer.GetAdjectiveWithNoTooltip] potrebbe darci la forza di concentrarci su produzioni più remunerative finanziariamente.\""

 ###
 hint_over_diplo_capacity: "Capacità Diplomatica Superata"
 hint_over_diplo_capacity_hint_text: "$hint_over_diplo_capacity_hint_text_1$\n\n$hint_over_diplo_capacity_hint_text_2$\n\n$hint_over_diplo_capacity_hint_text_3$"
 hint_over_diplo_capacity_hint_text_1: "Un'alleanza con tutti e un'alleanza con nessuno. Un [country_with_icon|e] che mantiene più relazioni della sua $game_concept_diplomatic_capacity$ subirà una penalità alla sua [diplomatic_reputation_with_icon|e] e al suo [prestige_with_icon|e]. Alcuni [subject_types_with_icon|e] possiedono anche un $game_concept_diplomatic_upkeep$, che riduce la capacità disponibile.\n\nL'appartenenza ad alcune [international_organizations_with_icon|e] costerà una parte della $game_concept_diplomatic_capacity$, e la potenza del tuo [ally_with_icon|e] determina il costo di un'[alliance_with_icon|e]." 
 hint_over_diplo_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Fermare i nostri [diplomats_with_icon|E] dal migliorare le relazioni libererà la nostra capacità.\n@arrow_bonus_tier_2! Valutare se si desidera porre fine ad alcune delle nostre [alliances_with_icon|E] o [treaties_with_icon|E].\n@arrow_bonus_tier_1! Lasciare qualsiasi [international_organizations_with_icon|E] di cui non abbiamo più bisogno è anche un altro modo per liberare capacità." 
 hint_over_diplo_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [estate_privileges_with_icon|E], le [laws_with_icon|E] e i [advances_with_icon|E] possono talvolta concedere capacità diplomatica aggiuntiva." 
 hint_over_diplo_capacity_military: "\"Forse dovremmo considerare le alleanze come un mezzo per un fine, non come un'amicizia permanente. Dopotutto, i nostri stessi alleati ci guarderebbero con avidità se mostrassimo debolezza...\""
 hint_over_diplo_capacity_administrative: "\"Sottoporre i nostri diplomatici a un carico di lavoro eccessivo ha lo sfortunato effetto collaterale di ridurne l'efficacia in quasi tutti i loro compiti. Sebbene possa essere allettante lasciarli sovraccaricati, non è una buona soluzione a lungo termine.\""
 hint_over_diplo_capacity_diplomatic: "\"Se dobbiamo dare priorità al nostro sviluppo interno, alleanze forti compenseranno ampiamente qualsiasi percepita debolezza militare. Forse dovremmo interrompere prima altre relazioni?\""

 ###
 hint_rebels_growing: "$game_concept_rebel_movements$"
 hint_rebels_growing_hint_text: "$hint_rebels_growing_hint_text_1$\n\n$hint_rebels_growing_hint_text_2$\n\n$hint_rebels_growing_hint_text_3$"
 hint_rebels_growing_hint_text_1: "I [pops_with_icon|e] si uniscono ai [rebel_movements_with_icon|e] quando la loro [pop_satisfaction_with_icon|e] scende al di sotto della [ShowModifierTypeName('pop_join_rebel_threshold')].\n\nI [rebel_movements] guadagneranno progressi verso la rivolta ogni mese a seconda del loro sostegno. Al raggiungimento del #W 100%#! di sostegno, daranno inizio a una [revolt_with_icon|e] o a una [civil_war_with_icon|e].\n\nLe ragioni più frequenti di sostegno ai ribelli sono la bassa [stability_with_icon|e], le [cultures_with_icon|e], le [religions_with_icon|e] discriminate e i [estates_with_icon|e] irritati."
 
 hint_rebels_growing_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Mantenete la [stability_with_icon|e] e la [legitimacy_with_icon|e] più alte possibile.\n@arrow_bonus_tier_2! Usa l'[ShowCabinetActionName('rebel_crackdown')] [cabinet_action_with_icon|e] per fermare il progresso di una [rebellion] imminente.\n@arrow_bonus_tier_1! Sposta un [army_with_icon|e] in una [province_with_icon|e] con [pops] insoddisfatti. La presenza delle truppe li renderà più... #italic comprensivi#!.\n\nIn ultima analisi, aumentare la [pop_satisfaction_icon] Soddisfazione dei [pops] ribelli è ciò che conta di più:\n@arrow_bonus_tier_2! Assicurati che ogni [cultures] più numerosa nel tuo [country] sia [accepted_culture_short_with_icon|e] o [tolerated_culture_short_with_icon|e].\n@arrow_bonus_tier_1! Assicurati che i [pops] ribelli possano acquistare il maggior numero possibile dei loro [pop_needs_with_icon|e] dal loro [market_with_icon|e].\n@arrow_bonus_tier_3! Mantieni alta la [estate_icon] [estate_satisfaction_with_icon|e], poiché essa influisce molto sulla soddisfazione di tutti i suoi [pops] costituenti:\n$TAB$@arrow_bonus_tier_2! Concedi un [privilege_with_icon|e]\n$TAB$@arrow_bonus_tier_2! Corrompi i [estate]\n$TAB$@arrow_bonus_tier_2! Abbassa le [taxes_with_icon|e]" 
 
 hint_rebels_growing_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Anche i [societal_values_with_icon|E] come [ShowSocietyDirectionName('communalism')] e [ShowSocietyDirectionName('decentralization')] possono influenzare la probabilità di crescita della ribellione.\n@hint! I [pops] ribelli si uniranno a [rebel_movements] diversi a seconda di vari fattori. Ad esempio, i [pops] di una [culture] discriminata tenderanno a unirsi ai [nationalist_rebels_with_icon|e]." 
 
 hint_rebels_growing_military: "\"Potranno sembrare coriacei, ma con la gente comune l'abbaiare è di solito peggio del morso. Tuttavia, ciò che spesso manca loro in disciplina, lo compensano ampiamente con i numeri.\""
 hint_rebels_growing_administrative: "\"Sebbene i ribelli siano certamente un male per gli affari, di solito sono reazionari; se risolverete la causa della loro agitazione, non solo riuscirete a pacificarli, ma anche a migliorare il nostro Paese.\""
 hint_rebels_growing_diplomatic: "\"La nostra popolazione detiene ogni sorta di identità e fedeltà diverse. I popoli conquistati sono molto più propensi a volersi separare e formare il proprio governo o persino a unirsi a una potenza straniera.\""

 ###
 hint_call_for_peace: "Richiesta di Pace"
 hint_call_for_peace_hint_text: "$hint_call_for_peace_hint_text_1$\n\n$hint_call_for_peace_hint_text_2$\n\n$hint_call_for_peace_hint_text_3$"
 hint_call_for_peace_hint_text_1: "Questo stato può essere riscontrato se una particolare [war_with_icon|E] si protrae abbastanza a lungo, o se rifiutiamo di firmare un [peace_treaty_with_icon|E] nonostante una vittoria o una sconfitta totale." 
 hint_call_for_peace_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dovremmo limitare le nostre perdite e firmare un trattato prima che la nostra [war_exhaustion_with_icon|E] raggiunga livelli critici.\n@arrow_bonus_tier_2! Ciò potrebbe significare accettare meno di quanto inizialmente intendevamo richiedere, o persino perdere la [war_with_icon|e]." 
 hint_call_for_peace_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Qualsiasi cosa persa a causa della firma di un [peace_treaty_with_icon|e] prematuro può essere recuperata in futuro in un'altra [war_with_icon|e]." 
 hint_call_for_peace_diplomatic: "\"Violare le regole della guerra può avere conseguenze davvero devastanti per la nostra stabilità interna e per la nostra reputazione all'estero. Perché qualcuno dovrebbe ascoltare ciò che abbiamo da dire se dimostriamo di essere irragionevoli?\""
 hint_call_for_peace_military: "\"La guerra non è che la continuazione della politica con altri mezzi. Forse dovremmo scriverlo prima che lo faccia qualcun altro?\""
 hint_call_for_peace_administrative: "\"Una richiesta di pace peggiorerà sempre di più con il passare del tempo. Il popolo può essere placato, ma non ignorato per sempre.\""
 ###
 hint_unprofitable_buildings: "Edifici Non Redditizi"
 hint_unprofitable_buildings_hint_text: "$hint_unprofitable_buildings_hint_text_1$\n\n$hint_unprofitable_buildings_hint_text_2$\n\n$hint_unprofitable_buildings_hint_text_3$"
 hint_unprofitable_buildings_hint_text_1: "Gli Edifici diventano non redditizi se il costo combinato dei loro [goods_with_icon|E] in ingresso supera il valore dei [produced_goods_with_icon|E]." 
 hint_unprofitable_buildings_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicurati che i beni in ingresso siano più economici producendo o [importing_with_icon|E] di più per garantirne un offerta abbondante.\n@arrow_bonus_tier_3! Creare o assicurare una domanda aggiuntiva di beni ne farà aumentare il prezzo.\n@arrow_bonus_tier_3! Gli [buildings_with_icon|E] possono essere chiusi @building_open! o persino distrutti, se il loro scopo non è più in linea con i nostri obiettivi.\n@arrow_bonus_tier_3! Un [market_owner_with_icon|E] potrebbe imporre un embargo ai Paesi che esportano i beni che egli produce per far salire il prezzo delle proprie esportazioni." 
 hint_unprofitable_buildings_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Alcuni edifici possono essere [subsidized_with_icon|E]. Questo può essere utile, per esempio, se i costi di [import_with_icon|E] dei beni necessari ai [pop_needs_with_icon|E] o al mantenimento di un esercito sono elevati." 
 hint_unprofitable_buildings_diplomatic: "\"Gestire la redditività dell'industria di un intero paese può essere un compito difficile. Puoi richiedere l'assistenza della burocrazia del paese se non desideri occuparti dei dettagli!\""
 hint_unprofitable_buildings_military: "\"Più siamo forti, maggiore è la nostra capacità di impegnarci in un sano grado di protezionismo. Embargo e controversie commerciali sono sempre più efficaci se supportati dai cannoni.\""
 hint_unprofitable_buildings_administrative: "\"La strategia di manipolazione dei prezzi ha molti strati. Con abbastanza astuzia, possiamo non solo creare una domanda in un mercato, ma anche essere coloro che la soddisfano.\""
 NO_HINTS_AVAILABLE: "Nessun suggerimento disponibile!"
 hint_trade: "Commercio"
 hint_trade_hint_text: "$hint_trade_hint_text_1$\n\n$hint_trade_hint_text_2$\n\n$hint_trade_hint_text_3$"
 hint_trade_hint_text_1: "Il [trade_with_icon|E] comporta lo spostamento di [goods_with_icon|E] tra [markets_with_icon|E] e la vendita e l'acquisto in questi [markets_with_icon|E]." 
 hint_trade_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Stabilite nuove Rotte di [trade_with_icon|E] per acquisire [goods_with_icon|e].\n@arrow_bonus_tier_2! Aumentate la produzione di [goods_with_icon|e] per averne di più a disposizione per il commercio." 
 hint_trade_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Una Rotta di [trade_with_icon|E] può essere redditizia o non redditizia a seconda della differenza di prezzo tra i [export_with_icon|E] di [import_with_icon|E] e [markets_with_icon|E].\n@hint! Ogni [country_with_icon|E] presente in un [market_with_icon|E] ha una [merchant_capacity_with_icon|E] massima che può utilizzare per creare Rotte di [trade_with_icon|E] e un [merchant_power_with_icon|E] che determina la priorità che ha nell'esportare [goods_with_icon|E] lungo le sue Rotte di [trade_with_icon|E] quando c'è una carenza.\n@hint! Il Commercio può essere automatizzato in ogni singolo [market_with_icon|E] per impostazione predefinita cliccando sul relativo ingranaggio." 
 hint_trade_military: "\"Il commercio è per i deboli. Tuttavia, saremo in grado di imporre il flusso di merci dominando la terra e il mare.\""
 hint_trade_administrative: "\"Elemento centrale della nostra strategia: Prevedere la prossima ondata di prezzi attraverso il lancio dei dadi e l'allineamento celeste delle stelle.\""
 hint_trade_diplomatic: "\"Uno dei pilastri indispensabili di un impero pienamente sviluppato, il commercio ha il potenziale di riempire le nostre casse a un ritmo più veloce di qualsiasi altra cosa.\""

 ### Unused Trade Capacity
 hint_unused_trade_capacity: "Capacità Commerciale Inutilizzata"
 hint_unused_trade_capacity_hint_text: "$hint_unused_trade_capacity_hint_text_1$\n\n$hint_unused_trade_capacity_hint_text_2$\n\n$hint_unused_trade_capacity_hint_text_3$"
 hint_unused_trade_capacity_hint_text_1: "La [merchant_capacity_with_icon|e] è utilizzata per spostare [goods_with_icon|e] tra [markets_with_icon|e], generando possibilmente un profitto nel processo. Dovremmo sempre utilizzare tutta la nostra [merchant_capacity]."
 hint_unused_trade_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! Cliccate sull'Avviso per vedere il Mercato interessato nel @economy_panel![Link('trade', 'subtab = markets', 'Markets Panel')]. Da lì potete allocare la Capacità Commerciale alle Rotte suggerite.\n@arrow_bonus_tier_1! Potete anche cliccare sull'Intestazione del Mercato per andare al Pannello Mercato, dove vedrete l'elenco dei [goods_with_icon|e] pertinenti a quel Mercato. Cliccate sui pulsanti Esporta/Importa per ogni [good] per avviare una Rotta Commerciale.\n@automation! Si raccomanda di automatizzare il Commercio in tutti i vostri Mercati, premendo il pulsante dell'ingranaggio nella Scheda Mercato. Potete sempre creare e bloccare manualmente Rotte Commerciali, anche quando il Commercio è automatizzato." 
 hint_unused_trade_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il profitto derivante dal [trade] è diviso tra i [estates_with_icon|e], inclusa la [ShowEstateTypeName('crown_estate')], in base al [estate_power_with_icon|e]."
 
 hint_unused_trade_capacity_military: "\"Riguardo la possibilità di un utilizzo ottuso delle nostre risorse, sono assolutamente contrario.\""
 hint_unused_trade_capacity_administrative: "\"Dobbiamo tornare alla frontiera efficiente il prima possibile.\""
 hint_unused_trade_capacity_diplomatic: "\"Si potrebbe paragonare la capacità commerciale inutilizzata a un campo a riposo da troppo tempo per il prossimo seme.\""
 
 ### Unprofitable Trade Route
 hint_unprofitable_trade_route: "Rotta Commerciale Non Redditizia"
 hint_unprofitable_trade_route_hint_text: "$hint_unprofitable_trade_route_hint_text_1$\n\n$hint_unprofitable_trade_route_hint_text_2$\n\n$hint_unprofitable_trade_route_hint_text_3$"
 hint_unprofitable_trade_route_hint_text_1: "Nella maggior parte dei casi, quando avete una Rotta di [trade_with_icon|E] non redditizia dovrete annullarla e sostituirla con una rotta redditizia, oppure attivare l'automazione per quel [market_with_icon|E]." 
 hint_unprofitable_trade_route_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! Talvolta, ha senso perdere denaro su una Rotta di [trade_with_icon|E] se i [goods_with_icon|E] scambiati sono di importanza strategica.\n@arrow_bonus_tier_1! Un esempio sarebbe l'acquisizione di Legname per essere in grado di completare un [building_with_icon|E]. Un altro sarebbe assicurare che i nostri [pops_with_icon|E] siano sfamati." 
 hint_unprofitable_trade_route_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potete influenzare indirettamente la redditività di una Rotta di [trade_with_icon|E] esistente influenzando i prezzi (e quindi la differenza di prezzo per il [good_with_icon|E] scambiato) dei [markets_with_icon|E] coinvolti. Potete farlo alterando l'[supply_with_icon|E] e la [demand_with_icon|E] per il [good_with_icon|E]." 
 hint_unprofitable_trade_route_military: "\"Forse dovremmo prendere le loro merci invece di pagarle?\""
 hint_unprofitable_trade_route_administrative: "\"Tagliate le perdite il più velocemente possibile. Il commercio non è carità.\""
 hint_unprofitable_trade_route_diplomatic: "\"L'imperfezione sorge nell'ordine della natura e sta a noi eliminarla.\""


 hint_market_out_of_supply: "Mercato senza Rifornimenti"
 hint_market_out_of_supply_hint_text: "$hint_market_out_of_supply_hint_text_1$\n\n$hint_market_out_of_supply_hint_text_2$\n\n$hint_market_out_of_supply_hint_text_3$"
 hint_market_out_of_supply_hint_text_1: "Se un [market_with_icon|e] ha una [demand_with_icon|E] totale troppo alta rispetto all'[supply_with_icon|E] finita, potremmo non ricevere i [goods_with_icon|E] che stiamo cercando di [export_with_icon|E] o [import_with_icon|E], con conseguente mancanza di merci." 
 hint_market_out_of_supply_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo immediatamente annullare le Rotte di [trade_with_icon|E] non redditizie e utilizzare quella [merchant_capacity_with_icon|E] per altri tipi di [goods_with_icon|E].\n@arrow_bonus_tier_1! Aumentare il nostro [merchant_power_with_icon|E] nel [market_with_icon|E] interessato può garantirci maggiore accesso alle sue merci." 
 hint_market_out_of_supply_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo ottenere [merchant_power_with_icon|e] da una varietà di fonti come [advances_with_icon|e], [privileges_with_icon|e], [policies_with_icon|e], ecc.\n@hint! Potremmo anche tentare di aumentare la [supply_with_icon|E], ma ciò può essere difficile da fare con breve preavviso ed è di solito soggetto ad attenzione strategica a lungo termine." 
 hint_market_out_of_supply_military: "\"Di tanto in tanto non ci saranno merci sufficienti disponibili per l'esportazione per alimentare la nostra macchina da guerra. Bisogna affrontarlo rapidamente.\""
 hint_market_out_of_supply_administrative: "\"Considerate di aumentare il nostro vantaggio commerciale totalmente equo con qualsiasi mezzo spendibile.\""
 hint_market_out_of_supply_diplomatic: "\"Forse dobbiamo adottare misure per diversificare le nostre operazioni commerciali, allontanandoci dalla monocoltura.\""
 hint_increasing_trade_capacity: "Aumento della Capacità Commerciale"
 hint_increasing_trade_capacity_hint_text: "$hint_increasing_trade_capacity_hint_text_1$\n\n$hint_increasing_trade_capacity_hint_text_2$\n\n$hint_increasing_trade_capacity_hint_text_3$"
 hint_increasing_trade_capacity_hint_text_1: "La [merchant_capacity_with_icon|e] determina la quantità di [trade_with_icon|e] che un [country_with_icon|e] può effettuare." 
 hint_increasing_trade_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Costruite più [buildings_with_icon|e] che aumentano la capacità, ad esempio un [ShowBuildingTypeName('marketplace')] o un [ShowBuildingTypeName('market_village')].\n@arrow_bonus_tier_2! Alcuni [advances_with_icon|e] o [laws_with_icon|e] possono anche aumentare la nostra [merchant_capacity_with_icon|e]." 
 hint_increasing_trade_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Avere più [merchant_capacity_with_icon|e] consente di scambiare più merci, con conseguente [income_with_icon|e] più alto." 
 hint_increasing_trade_capacity_military: "\"Più grande diventa il nostro impero, maggiore sarà la capacità di commercio che avremo. È quasi tautologico.\""
 hint_increasing_trade_capacity_administrative: "\"La soluzione alla capacità commerciale, proprio come tutti i problemi dell'umanità, è avere più mercati.\""
 hint_increasing_trade_capacity_diplomatic: "\"Garantite un flusso crescente di commercio gettando le fondamenta per lo scambio mercantile ovunque sia possibile.\""
 
 hint_increasing_trade_advantage: "$game_concept_merchant_power$"
 hint_increasing_trade_advantage_hint_text: "$hint_increasing_trade_advantage_hint_text_1$\n\n$hint_increasing_trade_advantage_hint_text_2$\n\n$hint_increasing_trade_advantage_hint_text_3$"
 hint_increasing_trade_advantage_hint_text_1: "Il [merchant_power_with_icon|e] determina quale [country_with_icon|e] ha accesso per primo ai [goods_with_icon|e] di un [market_with_icon|e] ai fini del [trade_with_icon|e].\n\nSe due [countries] che commerciano stanno cercando di acquistare un [good] e non ce n'è abbastanza per entrambi, quello con il [merchant_power] più alto in quel [market] lo acquisterà per primo.\n\nSi noti che il [merchant_power] si applica solo al [trade]. Le [locations_with_icon|e] seguono invece l'[market_access_with_icon|e] quando acquistano [goods] per le [constructions_with_icon|e] o i [pop_needs_with_icon|e]." 
 hint_increasing_trade_advantage_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possedete più [locations_with_icon|e] appartenenti a quel [market].\n@arrow_bonus_tier_2! Aumentate la [maritime_presence_with_icon|e] sulle acque costiere di un [market].\n@arrow_bonus_tier_1! Alcuni [buildings_with_icon|e], come il [ShowBuildingTypeName('marketplace')], aumentano anche il [merchant_power]."
 hint_increasing_trade_advantage_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! #italic Per saperne di più potete consultare i Suggerimenti [Link('hints', 'selected_hint = hint_trade', '$hint_trade$')] e [Link('hints', 'selected_hint = hint_maritime', '$hint_maritime$')]#!"
 hint_increasing_trade_advantage_military: "\"Poiché il commercio è un'impresa competitiva piuttosto che cooperativa, stabilire un vantaggio commerciale è l'ordine naturale delle cose.\""
 hint_increasing_trade_advantage_administrative: "\"Elemento centrale della nostra strategia: Prevedere la prossima ondata di prezzi attraverso il lancio dei dadi e l'allineamento celeste delle stelle.\""
 hint_increasing_trade_advantage_diplomatic: "\"Uno dei pilastri indispensabili di un impero pienamente sviluppato, il commercio ha il potenziale di riempire le nostre casse a un ritmo più veloce di qualsiasi altra cosa.\""

 ######## ALERT HINTS ########
 
 ### Pops demanding Goods
 hint_pops_with_needs_yellow: "Popolazioni che Richiedono Merci"
 hint_pops_with_needs_yellow_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_yellow_hint_text_2$\n\n$hint_pops_with_needs_yellow_hint_text_3$"
 hint_pops_with_needs_yellow_hint_text_1: "I [pops_with_icon|e] cercheranno di acquistare i [goods_with_icon|e] necessari per la loro vita quotidiana dal [market_with_icon|e] della loro [location_with_icon|e]. Se i [pops] non sono in grado di acquistare tutti i [goods] che richiedono, la loro [pop_satisfaction_with_icon|e] diminuirà di conseguenza. Se la loro [pop_satisfaction] scende al di sotto della [ShowModifierTypeName('pop_join_rebel_threshold')], sia per mancanza di [goods] o altro, i [pops] potrebbero iniziare a sostenere una [rebellion_with_icon|e] contro il [government]." 
 hint_pops_with_needs_yellow_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Mantenete alte [stability_with_icon|e], [legitimacy_with_icon|e] e [estate_satisfaction_with_icon|e] per prevenire le [rebellions].\n@arrow_bonus_tier_1! Espandete la vostra produzione dei [goods_with_icon|e] richiesti costruendo [rgo_with_icon|e] e [buildings_with_icon|e] dal @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Importate i [goods] da altri [markets] spendendo [merchant_capacity_with_icon|e]." 
 hint_pops_with_needs_yellow_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Avere richieste insoddisfatte delle Popolazioni non è necessariamente preoccupante, purché i [pops] non si ribellino. Tuttavia, fornisce una panoramica dello stato di salute di un [market].\n@hint! Le richieste delle Popolazioni sono solo uno dei fattori che influenzano la [pop_satisfaction]. Anche se tutti i loro bisogni fossero soddisfatti, le persone potrebbero comunque ribellarsi per altre ragioni.\n@hint! Maggiori informazioni sui [rebel_movements_with_icon] sono disponibili nel Suggerimento [Link('hints', 'selected_hint = hint_rebels_growing', '$hint_rebels_growing$')]."
 
 hint_pops_with_needs_yellow_military: "\"Un sovrano potente non dovrebbe preoccuparsi dei capricci degli umili.\""
 hint_pops_with_needs_yellow_administrative: "\"Dove l'occhio poco attento vede una popolazione privata, io vedo una meravigliosa occasione di profitto.\""
 hint_pops_with_needs_yellow_diplomatic: "\"Gli uomini chiederanno sempre più di quanto spetta loro. Ma fate attenzione. Le carenze, se lasciate incontrollate, potrebbero incitare i vostri sudditi alla ribellione.\""


 ### Rebelling Pops demanding Goods
 hint_pops_with_needs_red: "Popolazioni Ribelli che Richiedono Merci"
 hint_pops_with_needs_red_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_2$\n\n$hint_pops_with_needs_red_hint_text_3$"
 hint_pops_with_needs_red_hint_text_1: "Alcuni dei nostri [pops] si stanno attualmente unendo a [rebel_movements]. Aumentare l'offerta di [goods] richiesti potrebbe convincere alcuni di loro a lasciare le [rebellions]."
 hint_pops_with_needs_red_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Aumentate [stability_with_icon|e], [legitimacy_with_icon|e] e [estate_satisfaction_with_icon|e].\n@arrow_bonus_tier_1! Espandete la produzione dei [goods_with_icon|e] richiesti costruendo [rgo_with_icon|e] e [buildings_with_icon|e] dal @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Importate i [goods] da altri [markets] spendendo [merchant_capacity_with_icon|e]\n@arrow_bonus_tier_1! Se tutto il resto fallisce, tenete i nostri [armies_with_icon|e] pronti a gestire gli insorti." 
 hint_pops_with_needs_red_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le richieste delle Popolazioni sono solo uno dei fattori che influenzano la [pop_satisfaction]. Anche se tutti i loro bisogni fossero soddisfatti, le persone potrebbero comunque ribellarsi per altre ragioni.\n@hint! Maggiori informazioni sui [rebel_movements_with_icon] sono disponibili nel Suggerimento [Link('hints', 'selected_hint = hint_rebels_growing', '$hint_rebels_growing$')]."
 
 hint_pops_with_needs_red_diplomatic: "\"Garantire l'offerta di merci critiche può essere sufficiente per placare le voci discordanti tra il nostro popolo.\""
 hint_pops_with_needs_red_administrative: "\"Una Ribellione porterebbe rovina ai nostri mercanti. Aumentiamo la nostra produzione prima che il nostro popolo decida di prendere le armi contro di noi!\""
 hint_pops_with_needs_red_military: "\"Una folla affamata? Il nostro Esercito si occuperà di questa minaccia.\""


 ### Possible Reforms
 hint_has_possible_reform: "Possibili Riforme"
 hint_has_possible_reform_hint_text: "$hint_has_possible_reform_hint_text_1$\n\n$hint_has_possible_reform_hint_text_2$\n\n$hint_has_possible_reform_hint_text_3$"
 hint_has_possible_reform_hint_text_1: "Le [government_reforms_with_icon|e] sono una delle caratteristiche più distintive del nostro [country_with_icon|e]. Dovremmo sempre attuare tutte le [reforms] possibili."
 hint_has_possible_reform_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Premete il pulsante (+) sotto la scheda [ShowEstateTypeName('crown_estate')] nel @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')] per emanare una nuova [reform]." 
 hint_has_possible_reform_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Man mano che il gioco procede, altre [government_reforms] diventeranno disponibili tramite [advances_with_icon|e] ed [events_with_icon|e].\n@hint! Revocare le [government_reforms] costa [stability_with_icon|e] e richiede molto tempo per attuarle. Sceglietele con cura.\n@hint! Alcune [government_reforms] richiedono che il vostro [country] si orienti verso uno specifico [societal_value_with_icon|e]. Potete controllare le [government_reforms] sbloccate da ogni [societal_value] facendo @leftclick! #W clic#! sulle loro icone in [Link('societal_values', '', '@government_panel! Government Panel > Values Tab')]." 
 
 hint_has_possible_reform_diplomatic: "\"Un governo ben definito è un simbolo di un'amministrazione sana.\""
 hint_has_possible_reform_administrative: "\"Dobbiamo essere chiari nella definizione del nostro governo, affinché i Paesi stranieri possano imparare come riferirsi a noi.\""
 hint_has_possible_reform_military: "\"Come possiamo aspettarci di essere in grado di difenderci dai nostri nemici se non sappiamo nemmeno chi siamo?\""


 ### Non-integrated Provinces
 hint_has_conquered_provinces: "Province Non Integrate"
 hint_has_conquered_provinces_hint_text: "$hint_has_conquered_provinces_hint_text_1$\n\n$hint_has_conquered_provinces_hint_text_2$\n\n$hint_has_conquered_provinces_hint_text_3$"
 hint_has_conquered_provinces_hint_text_1: "Le [conquered_with_icon|e] [locations_with_icon|e] devono essere [integrated_with_icon|e] nella nostra amministrazione per contribuire alla ricchezza del nostro reame. Dovremmo sforzarci di [integrate] tutte le nostre [locations_with_icon|e] il prima possibile." 
 hint_has_conquered_provinces_hint_text_2: "#T Azioni Raccomandate #!:\n@arrow_bonus_tier_3! Istruite il [cabinet_with_icon|e] a [ShowCabinetActionName('integrate_province')] dal @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_1! Se il nostro [cabinet] non riesce a tenere il passo con le nostre conquiste, considerate di creare un [subject_with_icon|e] per governare la terra al vostro posto. Potete farlo dal @diplomacy_panel![Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')]." 
 hint_has_conquered_provinces_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! L'Integrazione è solitamente una delle principali responsabilità del [cabinet_with_icon|e] nei [countries_with_icon|e] espansionisti.\n@hint! La [pop_satisfaction_with_icon|e] sarà molto più bassa nelle [conquered] [locations], potendo innescare [rebellions_with_icon|e].\n@hint! Potete aumentare la velocità di integrazione nominando [characters_with_icon|e] più talentuosi ai [cabinet_members_with_icon|e] e anche aumentando l'[cabinet_efficiency_with_icon|e] globale del nostro [country].\n@hint! L'Integrazione sarà molto più veloce se la nostra [primary_culture_with_icon|e] è la [dominant_culture_with_icon|e] della Località, o se la nostra [cultural_influence_with_icon|e] è superiore alla [cultural_tradition_with_icon|e] della [dominant_culture] della Località." 
 
 hint_has_conquered_provinces_diplomatic: "\"I sudditi di recente... #italic acquisizione #! non si sottometteranno immediatamente al nostro dominio. L'Integrazione è un processo lungo e arduo, ma essenziale per la stabilità del reame.\""
 hint_has_conquered_provinces_administrative: "\"Gli affari non possono prosperare quando la terra è in subbuglio. Lo stato di diritto è fondamentale per la prosperità.\""
 hint_has_conquered_provinces_military: "\"I burocrati non sono sempre inutili. Non potremmo assolutamente arruolare la popolazione senza i quadri amministrativi adeguati in posizione.\""


 ### Possible Cabinet Actions
 hint_has_possible_cabinet_action: "Possibili Azioni di Gabinetto"
 hint_has_possible_cabinet_action_hint_text: "$hint_has_possible_cabinet_action_hint_text_1$\n\n$hint_has_possible_cabinet_action_hint_text_2$\n\n$hint_has_possible_cabinet_action_hint_text_3$"
 hint_has_possible_cabinet_action_hint_text_1: "Le [cabinet_actions_with_icon|e] sono tra gli strumenti più potenti che abbiamo per governare la nostra nazione. Dovremmo utilizzare tutti i nostri [cabinet_seats_with_icon|e] disponibili in ogni momento."
 hint_has_possible_cabinet_action_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] per vedere le Azioni di Gabinetto disponibili per noi.\n@arrow_bonus_tier_3! [ShowCabinetActionName('integrate_province')] se abbiamo un territorio appena [conquered_with_icon|e].\n@arrow_bonus_tier_2! [ShowCabinetActionName('stabilize_country')] se la [stability_with_icon|e] è bassa.\n@arrow_bonus_tier_2! [ShowCabinetActionName('strengthen_government')] se la [legitimacy_with_icon|e] è bassa.\n@arrow_bonus_tier_2! [ShowCabinetActionName('diplomatic_endeavors')] per facilitare la [diplomacy_with_icon|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('change_societal_values')] se c'è un particolare [societal_value_with_icon|e] che volete perseguire.\n@arrow_bonus_tier_1! [ShowCabinetActionName('develop_province')] per aumentare lo [development_with_icon|e] nelle nostre [provinces_with_icon|e] più preziose.\n@arrow_bonus_tier_1! Le [cabinet_actions] possono anche essere usate per [convert_with_icon|e] altre [religions_with_icon|e] o [assimilate_with_icon|e] altre [cultures_with_icon|e].\n@automation! Potete anche automatizzare il Gabinetto dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." 
 hint_has_possible_cabinet_action_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [characters_with_icon|e] nominati nel [cabinet_with_icon|e] aumenteranno l'[estate_power_with_icon|e] del loro [estate_with_icon|e].\n@hint! Nuove [cabinet_actions] si sbloccheranno nelle [ages_with_icon|e] successive." 
 
 hint_has_possible_cabinet_action_diplomatic: "\"La burocrazia è la linfa vitale di ogni Paese... se usata con saggezza.\""
 hint_has_possible_cabinet_action_administrative: "\"Attraverso il Gabinetto, lo Stato ha il potere di trasformare deserti brulli in metropoli fiorenti.\""
 hint_has_possible_cabinet_action_military: "\"Un Gabinetto potente può essere usato per domare i membri più discordanti della nostra società.\nDate gli ordini e sarà fatto.\""
 
 
 ### Laws not codified
 hint_has_possible_law: "Leggi Non Codificate"
 hint_has_possible_law_hint_text: "$hint_has_possible_law_hint_text_1$\n\n$hint_has_possible_law_hint_text_2$\n\n$hint_has_possible_law_hint_text_3$"
 hint_has_possible_law_hint_text_1: "È consigliabile avere sempre una [policy_with_icon|e] attiva per tutte le nostre [laws_with_icon|e]. Altrimenti il nostro [country_with_icon|e] potrebbe perdere alcuni utili benefici." 
 hint_has_possible_law_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'Avviso per scorrere le nostre [laws] senza una [policy] emanata e scegliete con cura.\n@arrow_bonus_tier_3! Potete andare al @government_panel![Link('government', 'tabcontent = politics', 'lateralview_government_entry_name')] per vedere le nostre attuali [laws].\n@automation! Potete anche automatizzare le nostre Leggi dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." 
 hint_has_possible_law_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le [policies] hanno un tempo di attuazione che dipende dalla nostra [legislative_efficiency_with_icon|e]. I loro effetti completi non saranno attivi immediatamente.\n@hint! Potete sempre cambiare una [policy] in seguito spendendo un po' di [gold_with_icon|e] e [stability_with_icon|e]. Il costo dipenderà dal nostro [crown_power_with_icon|e].\n@hint! Molte nuove [laws] e [policies] si sbloccheranno nelle [ages_with_icon|e] successive." 
 
 hint_has_possible_law_diplomatic: "\"Uno Stato senza Leggi è un edificio senza pilastri, un corpo senza arti. Meglio troppe, che troppo poche.\""
 hint_has_possible_law_administrative: "\"Le Leggi del nostro Paese dovrebbero assicurare la crescita delle nostre città, la protezione dei nostri mercanti e l'ordinata esazione delle nostre tasse.\""
 hint_has_possible_law_military: "\"Emanare Leggi è importante; farle rispettare è cruciale.\""
 
 
 ### Lack of commander
 hint_has_army_without_leader: "Mancanza di Comandante"
 hint_has_army_without_leader_hint_text: "$hint_has_army_without_leader_hint_text_1$\n\n$hint_has_army_without_leader_hint_text_2$\n\n$hint_has_army_without_leader_hint_text_3$"
 hint_has_army_without_leader_hint_text_1: "Le nostre [units_with_icon|e] devono avere un [commander_with_icon|e] nominato per funzionare adeguatamente in [battle_with_icon|e]. I [generals_with_icon|e] guidano gli [armies], gli [admirals] guidano le [navies]." 
 hint_has_army_without_leader_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'#W Avviso#! per selezionare un [character_with_icon|e] adatto per la vostra [unit]. In generale dovreste scegliere quelli con [abilities_with_icon|e] più alte.\n@arrow_bonus_tier_2! Potete anche selezionare la vostra [unit] dalla mappa o dall'#W Outliner#!.\n@arrow_bonus_tier_2! Se non abbiamo alcun [character] valido disponibile, provate ad addestrarne uno dal @military_panel![Link('unit_overview', '', 'lateralview_unit_overview_entry_name')].\n@automation! Potete automatizzare la nomina di [generals] e [admirals] dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." 
 hint_has_army_without_leader_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Non iniziate una [battle] senza un [commander_with_icon|e] capace al comando!\n@hint! Alcuni [characters_with_icon|e] hanno [traits_with_icon|e] che li rendono ancora più adatti a un compito specifico.\n@hint! Alcune [laws_with_icon|e] potrebbero imporre restrizioni su quali [characters_with_icon|e] sono idonei al comando." 
 
 hint_has_army_without_leader_diplomatic: "\"Un esercito dovrebbe sempre avere un capo. Ma dovremmo esercitare cautela, poiché i comandanti useranno la loro influenza per aumentare il potere della loro Tenuta.\""
 hint_has_army_without_leader_administrative: "\"Per carità non chiedetelo a me. Affido le questioni brutali della guerra ai vostri consiglieri meno... #italic sofisticati#!.\""
 hint_has_army_without_leader_military: "\"Ingaggiare il nemico senza una leadership adeguata è un suicidio.\nNon fatelo in nessuna circostanza.\""


 ### Underage Heir
 hint_is_heir_underage: "Erede Minorenne"
 hint_is_heir_underage_hint_text: "$hint_is_heir_underage_hint_text_1$\n\n$hint_is_heir_underage_hint_text_2$"
 hint_is_heir_underage_hint_text_1: "Se il nostro [ruler_with_icon|e] dovesse morire prima che il nostro [heir_with_icon|e] raggiunga la maggiore età, ci ritroveremmo sotto una [regency_with_icon|e]. A seconda delle circostanze, un membro del [estate_with_icon|e] più potente assumerà le redini del Governo, aumentando significativamente il [estate_power_with_icon|e] per la durata dell'interregno." 
 hint_is_heir_underage_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! C'è poco che potete fare se non lasciare che il tempo passi, ed evitare forse di rischiare la vita del nostro [ruler] in inutili imprese. A meno che, ovviamente, il nostro [ruler] non fosse particolarmente incompetente..."
 hint_is_heir_underage_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Una [regency_with_icon|e] potrebbe non essere così negativa se abbiamo un [character_with_icon|e] particolarmente valido che può essere il reggente." 
 
 hint_is_heir_underage_diplomatic: "\"Assicurare la successione significa garantire il futuro del reame.\""
 hint_is_heir_underage_administrative: "\"I matrimoni e i legami dinastici sono il modo migliore per unire due Paesi.\""
 hint_is_heir_underage_military: "\"È quando sono giovani che gli eredi possono essere forgiati nei migliori sovrani.\""


 ### Unmarried Ruler
 hint_has_unmarried_adult_ruler: "Sovrano Non Sposato"
 hint_has_unmarried_adult_ruler_hint_text: "$hint_has_unmarried_adult_ruler_hint_text_1$\n\n$hint_has_unmarried_adult_ruler_hint_text_2$\n\n$hint_has_unmarried_adult_ruler_hint_text_3$"
 hint_has_unmarried_adult_ruler_hint_text_1: "Dovremmo cercare di far sposare il nostro [ruler_with_icon|e] con un candidato adatto, al fine di aumentare le dimensioni e il potere della nostra [dynasty_with_icon|e]. Non solo una prole reale prolifica aiuta a garantire una successione pacifica e stabile, ma i principi possono anche costituire una preziosa riserva di [characters_with_icon|e] disponibili per le cariche di Governo." 
 hint_has_unmarried_adult_ruler_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'Avviso per cercare candidati per un [royal_marriage_with_icon|e]. Le Monarchie possono formare Matrimoni Reali tra loro per cementare la loro [opinion], ponendo le basi per un'[alliance_with_icon|e]. I [royal_marriages_with_icon|e] possono anche aprire la porta a una potenziale [personal_union_with_icon|e].\n@arrow_bonus_tier_2! Potete sposare il vostro [ruler] o [heir] con un [character_with_icon|e] adatto nella vostra Corte tramite l'interazione del personaggio [ShowCharacterInteractionName('marry_noble')], facendo clic destro sul ritratto del personaggio.\n@arrow_bonus_tier_1! In assenza di alternative migliori, [ShowCharacterInteractionName('marry_lowborn')] è sempre un'opzione, per quanto impopolare possa essere." 
 hint_has_unmarried_adult_ruler_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [characters] della [dynasty] regnante appartengono alla [ShowEstateTypeName('crown_estate')], quindi non conferiscono potere alle altre [estates_with_icon|e] del nostro reame quando sono nominati in [roles_with_icon|e] influenti." 
 
 hint_has_unmarried_adult_ruler_diplomatic: "\"Assicurare la successione significa garantire il futuro del reame.\""
 hint_has_unmarried_adult_ruler_administrative: "\"I matrimoni e i legami dinastici sono il modo migliore per unire due Paesi.\""
 hint_has_unmarried_adult_ruler_military: "\"Ogni spada ha bisogno di un fodero.\""


 ### No current Research
 hint_can_do_more_research: "Ricerca"
 hint_can_do_more_research_hint_text: "$hint_can_do_more_research_hint_text_1$\n\n$hint_can_do_more_research_hint_text_2$\n\n$hint_can_do_more_research_hint_text_3$"
 hint_can_do_more_research_hint_text_1: "Dovremmo assicurarci che il nostro [country_with_icon|e] stia ricercando nuovi [advances_with_icon|e] in ogni momento." 
 hint_can_do_more_research_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @advances_panel![Link('advances', 'subtab = research', 'lateralview_advances_entry_name')] e scegliete l'Avanzamento che soddisfa le vostre esigenze.\n@arrow_bonus_tier_2! Potete anche cliccare sull'icona della fiaschetta vuota in alto a destra per aprire l'intero @advances_panel![Link('technology_view', '', 'lateralview_technology_view_entry_name')].\n@automation! Se non vi sentite ancora preparati ad immergervi nelle profondità dei [advances], potete automatizzare la Ricerca dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]. Sarete comunque debitamente informati quando il nostro Paese avrà scoperto un nuovo [advance_with_icon|e]." 
 hint_can_do_more_research_hint_text_3: "#T Suggerimenti Aggiuntivi: #!\n@hint! I punti Ricerca non utilizzati verranno immagazzinati fino a un certo punto, dopo di che andranno sprecati.\n@hint! Potete aumentare la velocità dei [research_progress_with_icon|e] aumentando la nostra [literacy_with_icon|e] media e l'[estate_satisfaction_with_icon|e] della nostra [ShowEstateTypeName('clergy_estate')]." 
 
 hint_can_do_more_research_diplomatic: "\"La tecnologia offre ampie opportunità per facilitare la gestione dei nostri domini.\""
 hint_can_do_more_research_administrative: "\"Con i dovuti investimenti potremmo migliorare notevolmente l'efficienza della nostra economia.\""
 hint_can_do_more_research_military: "\"Il costante miglioramento dei nostri eserciti professionali è di fondamentale importanza, affinché la nostra potenza non rimanga indietro rispetto a quella dei nostri nemici.\""
 
 
 ### Cabinet lacks member
 hint_lack_cabinet_for_cabinet_action: "Mancanza di Membro del Gabinetto"
 hint_lack_cabinet_for_cabinet_action_hint_text: "$hint_lack_cabinet_for_cabinet_action_hint_text_1$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_2$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_3$"
 hint_lack_cabinet_for_cabinet_action_hint_text_1: "Una [cabinet_action_with_icon|e] non sarà molto efficiente senza un [character_with_icon|e] capace assegnato ad essa. Assegnate sempre [characters] a tutti i nostri [cabinet_seats_with_icon|e]." 
 hint_lack_cabinet_for_cabinet_action_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'#W Avviso#! per andare al @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] e nominate il [character_with_icon|e] con l'[ability_with_icon|e] correlata più alta al [cabinet_seat] vuoto.\n@arrow_bonus_tier_1! Considerate di assumere un nuovo [courtier_with_icon|e] se non abbiamo [characters] validi disponibili.\n@automation! Potete automatizzare il Gabinetto dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." 
 hint_lack_cabinet_for_cabinet_action_hint_text_3: "#T Suggerimenti Aggiuntivi: #!\n@hint! Ogni [cabinet_action_with_icon|e] utilizza una delle tre [abilities_with_icon|e] del personaggio, quindi dovete scegliere attentamente i vostri membri a seconda del compito che intendete assegnare loro.\n@hint! I [cabinet_members_with_icon|e] aumenteranno l'[estate_power_with_icon|e] della [estate_with_icon|e] a cui appartengono." 
 
 hint_lack_cabinet_for_cabinet_action_diplomatic: "\"La migliore amministrazione utilizzerà sempre le persone migliori.\""
 hint_lack_cabinet_for_cabinet_action_administrative: "\"Quanto meglio funziona il nostro Paese, tanto migliore sarà l'immagine esterna che presenteremo.\""
 hint_lack_cabinet_for_cabinet_action_military: "\"Solo con un'amministrazione efficiente saremo in grado di proiettare chiaramente la nostra forza.\""


 ### Inflation
 hint_inflation: "Inflazione"
 hint_inflation_hint_text: "$hint_inflation_hint_text_1$\n\n$hint_inflation_hint_text_2$"
 hint_inflation_hint_text_1: "L'Inflazione aumenta semplicemente tutte le spese per il nostro [country_with_icon|e], quindi andrebbe sempre evitata. Cresce abbastanza rapidamente a causa della [minting_with_icon|e], ma può essere ingannevolmente difficile da ridurre." 
 hint_inflation_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Se l'inflazione sta crescendo, regola il cursore di [minting] nel @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] per impedire che [inflation] aumenti.\n@arrow_bonus_tier_2! Se abbiamo già inflazione, impostare il cursore al minimo la farà diminuire." 
 hint_inflation_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo ottenere altre fonti di riduzione dell'inflazione, ad esempio dagli [advances_with_icon|e]." 
 
 hint_inflation_diplomatic: "\"Possiamo essere risparmiati da questa invisibile malattia dell'economia.\""
 hint_inflation_administrative: "\"Il Conio può essere un rimedio allettante per un bilancio in difficoltà, ma anche la fonte di prolungate sventure.\""
 hint_inflation_military: "\"L'inflazione è un assassino lento e insidioso.\""
 
 
 ### Disloyal Subjects
 hint_has_disloyal_subjects: "Sudditi Sleali"
 hint_has_disloyal_subjects_hint_text: "$hint_has_disloyal_subjects_hint_text_1$\n\n$hint_has_disloyal_subjects_hint_text_2$\n\n$hint_has_disloyal_subjects_hint_text_3$"
 hint_has_disloyal_subjects_hint_text_1: "I nostri [subjects_with_icon|e] sono [countries_with_icon|e] subordinati a noi in un modo o nell'altro. Di solito ci pagano la [subject_taxation_with_icon|e] e sono chiamati alle nostre [wars_with_icon|e].\n\nSe la [subject_loyalty_with_icon|e] scende sotto #W 50#!, saranno considerati sleali e non ci aiuteranno nelle nostre [wars]. I nostri Sudditi sleali possono unirsi per formare un [GetInternationalOrganizationType('independence_movement').GetName], potendo iniziare una [war] contro di noi se si sentono abbastanza forti." 
 hint_has_disloyal_subjects_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicuratevi che l'[opinion_with_icon|e] dei nostri Sudditi nei nostri confronti rimanga alta. Potete aumentarla usando l'[diplomatic_action_with_icon|e] $IMPROVE_RELATIONTITLE$.\n@arrow_bonus_tier_1! Potete considerare di [annexing_with_icon|e] altri Sudditi leali. Aumentare il nostro potere relativo rispetto a tutti i nostri Sudditi ne aumenterà la lealtà.\n@arrow_bonus_tier_1! Aumentare le dimensioni dei nostri [armies_with_icon|e] intimidirà i nostri Sudditi, aumentando la loro lealtà." 
 hint_has_disloyal_subjects_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potete ottenere una panoramica dei nostri Sudditi nel pannello Sudditi, all'interno del @diplomacy_panel![Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')].\n@hint! Più [subjects] abbiamo e più sono potenti in relazione al nostro potere, più difficile diventerà mantenere alta la loro [subject_loyalty].\n@hint! Diversi tipi di [subjects] hanno diverse caratteristiche e limitazioni." 
 hint_has_disloyal_subjects_diplomatic: "\"Dovremmo coltivare buone relazioni con i nostri Sudditi in ogni momento, per timore che inizino a considerarsi padroni del proprio destino.\""
 hint_has_disloyal_subjects_administrative: "\"I Sudditi sono un'aggiunta redditizia al nostro Tesoro.\nNon lasciate che se ne accorgano.\""
 hint_has_disloyal_subjects_military: "\"La pecora si allontanerà alla prima opportunità. Faremmo meglio a essere pronti a scatenare i cani della guerra!\""
 hint_has_imminent_independence_war: "Guerra d'Indipendenza Imminente" 
 hint_has_imminent_independence_war_hint_text: "$hint_has_imminent_independence_war_hint_text_1$\n\n$hint_has_imminent_independence_war_hint_text_2$" 
 hint_has_imminent_independence_war_hint_text_1: "Uno o più dei nostri [subjects_with_icon|e] guidano una [GetInternationalOrganizationType('independence_movement').GetName] le cui possibilità stimate di vincere una [war|e] contro di noi hanno raggiunto la soglia alla quale l'[AI] può decidere di dichiarare una guerra d'indipendenza in qualsiasi momento." 
 hint_has_imminent_independence_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Recluta [armies_with_icon|e] aggiuntive per ridurre le loro possibilità stimate di vittoria sotto la soglia.\n@arrow_bonus_tier_3! Valuta di colpire per primo con il [casus_belli_with_icon|e] [ShowCasusBelliName('cb_disloyal_subject')] per smantellare il movimento prima che inizi la guerra.\n@arrow_bonus_tier_1! Migliora la [subject_loyalty_with_icon|e] dei membri del movimento, cosi che lascino l'[international_organization_with_icon|e]." 

 ### Buildings missing inputs
 hint_has_buildings_missing_input: "Edifici con Input Mancanti"
 hint_has_buildings_missing_input_hint_text: "$hint_has_buildings_missing_input_hint_text_1$\n\n$hint_has_buildings_missing_input_hint_text_2$\n\n$hint_has_buildings_missing_input_hint_text_3$"
 hint_has_buildings_missing_input_hint_text_1: "Gli [buildings_with_icon|e] necessitano di accedere ai [goods_with_icon|e] dai loro [markets] per funzionare correttamente. Se non riescono ad acquistare tutti i [goods] di cui hanno bisogno, la loro produzione sarà ridotta di conseguenza." 
 hint_has_buildings_missing_input_hint_text_2: "#T Azioni Raccomandate:#!\n$hint_address_shortage_text$"
 hint_has_buildings_missing_input_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Non tutte le carenze degli Edifici pongono un problema critico al nostro Paese. Tuttavia, potremmo volerci assicurare il corretto funzionamento di alcune catene di produzione particolarmente strategiche.\n@hint! Ad esempio, potremmo non essere in grado di reclutare [ShowUnitDefinitionName('a_footmen')] se la nostra [ShowBuildingTypeName('weapon_guild')] non può acquistare abbastanza [ShowGoodsName('lumber')] dal suo [market]."
 
 hint_has_buildings_missing_input_diplomatic: "\"Alcuni Edifici sono particolarmente necessari al corretto funzionamento del nostro reame.\""
 hint_has_buildings_missing_input_administrative: "\"I nostri mercanti dovrebbero cercare di affrontare qualsiasi carenza nei nostri Mercati. Ma a volte la mano invisibile del Mercato richiede... una piccola spinta.\""
 hint_has_buildings_missing_input_military: "\"Dovremmo garantire una fornitura costante di armi e rifornimenti militari prima di impegnarci in qualsiasi operazione militare.\""
 
 hint_address_shortage_text: "Cliccare sull'#W Avviso#! vi condurrà al @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')] filtrato con i [goods] mancanti nel [market] interessato.\nPotete aumentare la [supply_with_icon|e] di un [good_with_icon|e] nei nostri [markets_with_icon|e] in tre modi chiave:\n\n@arrow_bonus_tier_3! Cliccate sul pulsante @rgo! [rgo|e] per vedere un elenco delle nostre [locations] in quel [market] con l'[rgo] pertinente. Ricordate che solo le [raw_materials_with_icon|e] possono essere prodotte in [rgo].\n@arrow_bonus_tier_2! Cliccate sul pulsante @building! [building|e] per vedere un elenco di tutti gli [buildings] disponibili che possono produrre quel [good] specifico.\n@arrow_bonus_tier_2! Cliccate sul pulsante @import! [import|e] per importare il [good] da un altro Mercato utilizzando [merchant_capacity_with_icon|e].\n@automation! Potete automatizzare la costruzione dei nostri [buildings] e [rgo], così come il nostro [trade_with_icon|e], dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." 
 
 ### Construction missing input
 hint_has_constructions_missing_input: "Input di Costruzione Mancante"
 hint_has_constructions_missing_input_hint_text: "$hint_has_constructions_missing_input_hint_text_1$\n\n$hint_has_constructions_missing_input_hint_text_2$\n\n$hint_has_constructions_missing_input_hint_text_3$"
 hint_has_constructions_missing_input_hint_text_1: "Tutte le [constructions_with_icon|e] necessitano di accedere a determinati [goods_with_icon|e] dal [market_with_icon|e] della [location_with_icon|e]. Se non ci sono abbastanza [goods] disponibili, la [construction] si bloccherà." 
 hint_has_constructions_missing_input_hint_text_2: "#T Azioni Raccomandate:#!\n$hint_address_shortage_text$"
 hint_has_constructions_missing_input_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Tutte le [locations] in un [market] accedono ai [goods] di cui hanno bisogno per tutti gli scopi in ordine di [market_access_with_icon|e], indipendentemente da chi abbia originariamente prodotto il bene.\n@hint! Ciò significa che le [locations] più vicine ai [market_centers_with_icon|e] avranno più facilità ad accedere ai beni di cui hanno bisogno." 
 
 hint_has_constructions_missing_input_diplomatic: "\"Un controllo accurato di tutte le risorse e i bisogni è cruciale per qualsiasi impresa.\""
 hint_has_constructions_missing_input_administrative: "\"La diplomazia e il commercio saranno in grado di fornirci tutto ciò che non possiamo produrre da soli.\""
 hint_has_constructions_missing_input_military: "\"Dobbiamo essere in grado di soddisfare tutte le nostre esigenze di fornitura e richieste se vogliamo evitare che altri sfruttino le nostre debolezze.\""

 ### Construction missing input
 hint_lack_pop_promotion_to_fill_buildings: "Edifici o [rgo] con dipendenti mancanti"
 hint_lack_pop_promotion_to_fill_buildings_hint_text: "$hint_lack_pop_promotion_to_fill_buildings_hint_text_1$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_2$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_3$"
 hint_lack_pop_promotion_to_fill_buildings_hint_text_1: "Diversi [buildings_with_icon|e] impiegano diverse [pop_types_with_icon|e]. Se non ci sono abbastanza [pops_with_icon|e] liberi della [pop_type] richiesta al termine della costruzione del nuovo [building], i [ShowPopTypeName('peasants')] inizieranno la [promote_with_icon|e] di personale idoneo a ricoprirne l'incarico, in base alla [ShowModifierTypeName('local_pop_promotion_speed')] della [location_with_icon|e].\n\nGli Edifici possono anche perdere dipendenti quando i [pops] muoiono a causa di [diseases_with_icon|e], [sieges_with_icon|e] o [starvation_with_icon|e]." 
 hint_lack_pop_promotion_to_fill_buildings_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Non costruite in [locations] in cui mancano già troppi dipendenti.\n@arrow_bonus_tier_2! Aumentate le fonti importanti di velocità di promozione per la [location]: [stability_with_icon|e], [literacy_with_icon|e] e [control_with_icon|e].\n@arrow_bonus_tier_1! Costruite una [ShowBuildingTypeName('library')] e un [ShowBuildingTypeName('university')] nelle nostre [locations] più importanti.\n@arrow_bonus_tier_1! Considerate di distruggere gli [buildings] meno utili per liberare forza lavoro." 
 hint_lack_pop_promotion_to_fill_buildings_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le [urban_locations_with_icon|e] hanno una quantità base maggiore di [upper_class_with_icon|e] [pops] disponibili.\n@hint! Ricordate che una [location] deve avere almeno alcuni [available_with_icon|e] [ShowPopTypeName('peasants')] affinché la [promotion] avvenga.\n@hint! Potete controllare la [ShowModifierTypeName('local_pop_promotion_speed')] di una [location] nella #W Scheda Demografia#! del #W Pannello Località#!." 
 
 hint_lack_pop_promotion_to_fill_buildings_diplomatic: "\"Cos'è un'industria senza le persone che ci lavorano?\""
 hint_lack_pop_promotion_to_fill_buildings_administrative: "\"Se il nostro popolo non lavora, altri Paesi potrebbero chiamarci pigri.\""
 hint_lack_pop_promotion_to_fill_buildings_military: "\"È dovere della popolazione lavorare e produrre ciò di cui il Paese ha bisogno.\""
 
 ### Casus Belli
 hint_casus_belli: "Casus Belli"
 hint_casus_belli_hint_text: "$hint_casus_belli_hint_text_1$\n\n$hint_casus_belli_hint_text_2$\n\n$hint_casus_belli_hint_text_3$"
 hint_casus_belli_hint_text_1: "Un [casus_belli_with_icon|e] è una ragione legittima per iniziare una [war_with_icon|e]. Andare in guerra senza un Casus Belli appropriato è comunque possibile, ma far rispettare le nostre richieste in un [peace_treaty_with_icon|e] sarà più difficile e i nostri vicini reagiranno con maggiore ostilità alle nostre azioni." 
 hint_casus_belli_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il modo migliore per ottenere un Casus Belli e richiederne uno al nostro [parliament_with_icon|e]. Puoi convocare una sessione del Parlamento dal @government_panel! [Link('government', 'tabcontent = parliament', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Creare una [spy_network_with_icon|e] nei [countries] stranieri ci permetterà di fabbricare un Casus Belli contro di loro, se abbiamo [cores_with_icon|e] nelle loro terre o se sono nostri [rivals_with_icon|e]." 
 hint_casus_belli_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ricordate che non tutte le [wars] sono giuste e possiamo andare in guerra senza un Casus Belli. Un buon Casus Belli è una risorsa utile, ma il più delle volte, la forza fa il diritto.\n@hint! Ogni Casus Belli ha un [war_goal_with_icon|e] specifico. Soddisfare il [war_goal] durante la [war] ci garantirà [war_score_with_icon|e], che è essenziale per la vittoria.\n@hint! [events_with_icon|e] e [situations_with_icon|e] possono concedere speciali Casus Belli." 
 
 hint_casus_belli_diplomatic: "\"Anche in guerra ci sono regole che devono essere rispettate.\""
 hint_casus_belli_administrative: "\"Un buon Casus Belli ci permetterebbe di dichiarare una guerra senza incorrere nell'ira dei nostri vicini.\""
 hint_casus_belli_military: "\"Il miglior Casus Belli, mio Signore, è nessun Casus Belli.\""

 ### Levies
 hint_has_unraised_levies_in_war: "Leve"
 hint_has_unraised_levies_in_war_hint_text: "$hint_has_unraised_levies_in_war_hint_text_1$\n\n$hint_has_unraised_levies_in_war_hint_text_2$\n\n$hint_has_unraised_levies_in_war_hint_text_3$"
 hint_has_unraised_levies_in_war_hint_text_1: "Le [levies_with_icon|e] costituiscono il grosso dell'esercito di qualsiasi [country_with_icon|e] nei primi secoli del gioco, prima che vengano sostituite da soldati professionisti, noti come [regulars_with_icon|e]. Fino ad allora, è consigliabile arruolare sempre le nostre [levies] durante una [war_with_icon|e]."
 hint_has_unraised_levies_in_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Quando inizia la guerra, cliccate sull'#W Avviso#! per andare a #W Arruola Milizia#! nel @military_panel![Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]. Da lì potete arruolare tutte le [levies] in una volta, o selezionare le [provinces_with_icon|e] specifiche che desiderate arruolare.\n@arrow_bonus_tier_2! È una buona idea ridurre la nostra dipendenza dalle [levies] con i [regular_regiments] superiori ma costosi. Per questo dovrete costruire una [ShowBuildingTypeName('sergeantry')].\n@arrow_bonus_tier_1! In tempi di necessità, i [mercenaries_with_icon|e] possono essere un buon complemento, o persino un sostituto, delle nostre [levies], se abbiamo monete da spendere. Potete assoldare [mercenaries] dal @military_panel![Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]." 
 hint_has_unraised_levies_in_war_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le [levies] provengono principalmente dai [pops_with_icon|e] della vostra [primary_culture_with_icon|e] e delle [accepted_cultures_with_icon|e], ma la quantità che potete arruolare da ogni [location] dipenderà dal suo [control_with_icon|e].\n@hint! Tenete a mente che la produzione di [food_with_icon|e] e [rgo_with_icon|e] diminuirà nelle [locations] arruolate fino a quando gli uomini non torneranno a casa.\n@hint! Fate attenzione: ogni contadino che muore in battaglia è un contadino in meno per lavorare nei campi."
 
 hint_has_unraised_levies_in_war_diplomatic: "\"Le persone devono lavorare, ma devono anche difendere le loro case se attaccate.\""
 hint_has_unraised_levies_in_war_administrative: "\"Se le persone si fidano di noi, verranno in nostro aiuto se chiamate.\""
 hint_has_unraised_levies_in_war_military: "\"Avere un campo da arare non è una scusa quando c'è una guerra da vincere.\""
 
 
 ### No allies
 hint_no_allies: "Nessun Alleato"
 hint_no_allies_hint_text: "$hint_no_allies_hint_text_1$\n\n$hint_no_allies_hint_text_2$\n\n$hint_no_allies_hint_text_3$"
 hint_no_allies_hint_text_1: "Un'[alliance_with_icon|e] è un [treaty_with_icon|e] tra due [countries_with_icon|e] che consente loro di entrare nelle [wars_with_icon|e] reciproche. Se siamo attaccati, i nostri [allies] riceveranno una [call_to_arms_with_icon|e] per entrare in guerra dalla nostra parte. Al contrario, dovremmo sempre tenere conto degli alleati del nostro nemico quando dichiariamo una [war] noi stessi, poiché è probabile che si schierino contro di noi." 
 hint_no_allies_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @diplomacy_panel![Link('diplomacy_macrobuilder', '', 'lateralview_diplomacy_macrobuilder_entry_name')] e cliccate su $offer_alliance$, sotto #W $CATEGORY_FRIENDLY_ACTIONS$#!. Vedrete un elenco di tutti i [countries] disposti a firmare un'[alliance_with_icon|e] con noi.\n@arrow_bonus_tier_2! Alcuni [countries] potrebbero aver bisogno di essere convinti. Usare l'[diplomatic_action_with_icon|e] #W $IMPROVE_RELATIONTITLE$#! li farà lentamente propendere dalla nostra parte." 
 hint_no_allies_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Attenzione: i nostri Alleati potrebbero anche chiamarci nelle loro guerre. Non alleatevi con Paesi che sembrano troppo vulnerabili, o potremmo ritrovarci dalla parte perdente di una guerra straniera.\n@hint! Potete sempre respingere una [call_to_arms] dal nostro alleato. Ma farlo segnerà la fine della nostra amicizia e rovinerà la nostra reputazione diplomatica per anni a venire."
 
 hint_no_allies_diplomatic: "\"Nessuno può sopravvivere da solo in questo mondo.\""
 hint_no_allies_administrative: "\"Anche se non abbiamo intenzione di attaccare, entrare in un'alleanza con uno dei nostri vicini potrebbe dissuadere i nostri nemici dall'attaccarci.\""
 hint_no_allies_military: "\"Un alleato forte coprirebbe le nostre spalle quando passiamo all'offensiva.\""

 ##### Situation Hints #####
 ### The Black Death
 hint_black_death: "La Morte Nera"
 hint_black_death_hint_text: "$hint_black_death_hint_text_1$\n\n$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$"
 hint_black_death_hint_text_1: "La Morte Nera è una [situation_with_icon|e] che devasterà il Vecchio Mondo, seguendo le rotte del commercio e della civiltà. Sarà più letale nelle nostre [locations_with_icon|e] densamente popolate e svanirà una volta che un numero sufficiente di sopravvissuti avrà sviluppato [disease_resistance_with_icon|e] ad essa.\n\nPersone di ogni [pop_type_with_icon|e] moriranno a causa della malattia, lasciando i nostri [buildings_with_icon|E] vuoti fino a quando nuovi [ShowPopTypeName('peasants')] non verranno [promote_with_icon|e]. Ciò significa che la nostra [tax_base_with_icon|e] si ridurrà probabilmente, poiché la produzione dei nostri [buildings] crolla e la [ShowModifierTypeName('local_pop_promotion_speed')] sarà molto importante per recuperare l'[employment_with_icon|e] perso." 
 hint_black_death_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Costruire [ShowBuildingTypeName('hospital')] come l'[buildings] nelle nostre [urban_locations_with_icon|e] più grandi, prima che la malattia raggiunga il nostro [country_with_icon|e].\n@arrow_bonus_tier_2! Cliccate sul banner della [situation] per dare un'occhiata alle interazioni speciali a nostra disposizione. Forse aiutano a mitigare la catastrofe?\n@arrow_bonus_tier_2! Mantenete alta la nostra [stability_with_icon|e]. Non solo aiuta con le [rebellions_with_icon|e], ma è anche essenziale per la [ShowModifierTypeName('local_pop_promotion_speed')].\n@arrow_bonus_tier_1! Non costruite nuovi edifici in [locations] in via di spopolamento, poiché avranno difficoltà ad assumere nuovi lavoratori.\n@arrow_bonus_tier_1! Tenete d'occhio la nostra [ShowModifierTypeName('local_pop_promotion_speed')], poiché la maggior parte dei nostri [buildings] e [rgo_with_icon|e] avrnno bisogno che i [ShowPopTypeName('peasants')] vengano [promote_with_icon|e] nelle [pop_types] superiori." 
 hint_black_death_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potrebbero volerci anni, ma finché ci sono abbastanza contadini nelle nostre [locations], le persone alla fine si [promote_with_icon|e] per coprire i posti vacanti lasciati dalla malattia.\n@hint! Potete utilizzare gli insegnamenti di questo disastro per affrontare altre calamità durante la vostra campagna: [starvation_with_icon|e], [diseases_with_icon|e] e [loot_with_icon|e] avranno effetti simili sulle nostre località." 
 
 hint_black_death_diplomatic: "\"La Morte avanza. Seguono rovina e tumulto.\""
 hint_black_death_administrative: "\"La Morte Pallida bussa con passo imparziale alle torri dei re e alle capanne dei poveri.\""
 hint_black_death_military: "\"Il quarto Cavaliere è su di noi. Nessun Suggerimento ci salverà ora.\""
 
 
 ###Fall of Delhi
 hint_fall_of_delhi: "[GetSituationByKey('fall_of_delhi').GetNameWithNoTooltip]"
 hint_fall_of_delhi_hint_text: "$hint_fall_of_delhi_hint_text_1$\n\n$hint_fall_of_delhi_hint_text_2$\n\n$hint_fall_of_delhi_hint_text_3$\n\n$hint_fall_of_delhi_hint_text_4$"
 hint_fall_of_delhi_hint_text_1: "La [GetSituationByKey('fall_of_delhi').GetName] è una [situation_with_icon|e] che può portare alla distruzione di un [GetCountry('DLH').GetFlavorRank] un tempo grande. Intorno a loro, avvoltoi e potenziali conquistatori si radunano attorno a un confine indebolito, mentre l'autorità di [GetCountry('DLH').GetGovernment.GetRulerOrRegent.GetName] decade..." 
 hint_fall_of_delhi_hint_text_2: "#T Azioni Raccomandate come Delhi:#!\n@arrow_bonus_tier_3! Come [GetCountry('DLH').GetName], considerate di utilizzare le molte nuove [actions_with_icon|e] come [ShowGenericActionName('strengthen_neighbor_relations')] o [ShowGenericActionName('fall_of_delhi_appoint_governors')].\n@arrow_bonus_tier_2! Durante vari [events_with_icon|e] associati a questa [situation_with_icon|e] dobbiamo cercare di aumentare la nostra [share_of_power_gc_with_icon|e] a scapito dei nostri nemici, affinché il nostro popolo non incontri la sua fine." 
 hint_fall_of_delhi_hint_text_3: "#T Suggerimenti Aggiuntivi per Delhi:#!\n@hint! Un chiaro vantaggio sui nostri nemici è il nostro potente [army_with_icon|e] permanente. A differenza delle [levies_with_icon|e], i nostri soldati stipendiati reintegrano i loro ranghi e sono notevolmente più potenti. Una base di potere, che aiuta a mantenere il nostro regime sotto controllo." 
 hint_fall_of_delhi_hint_text_4: "#T Azioni Raccomandate come Oppositore:#!\n@arrow_bonus_tier_3! Il [country_with_icon|e] più forte in $india$ sarà il principale Oppositore all'inizio della [situation_with_icon|e], ma possiamo guadagnare tale posizione dichiarando guerra e rivendicando il primato. Possiamo farlo sia essendo il [country_with_icon|e] più forte in $india$ all'inizio della [situation_with_icon|e] sia sconfiggendo l'attuale leader e prendendo il primato attraverso il [ShowPeaceTreatyTypeNameWithNoTooltip('peace_seize_opposition_leadership')] [peace_treaty_with_icon|e]." 
 
 hint_fall_of_delhi_diplomatic: "\"Sia che si difenda il trono di [GetCountry('DLH').GetName] o ci si erga come suo rivale, è saggio mantenere relazioni attente con i vicini. L'amicizia può far guadagnare tempo, mentre l'ostilità può giustificare nuove conquiste.\""
 hint_fall_of_delhi_administrative: "\"Le terre guadagnate nel caos sono premi fragili. Considerate di concedere [subjects_with_icon|e] o migliorare il [control_with_icon|e] ove possibile, affinché i territori appena acquisiti non sfuggano via velocemente come sono stati presi.\"" 
 hint_fall_of_delhi_military: "\"La spada decide molto in questa lotta. Un [army_with_icon|e] forte può difendere Delhi dal collasso o consentire agli Oppositori di abbattere il gigante. Eppure, anche la vittoria comporta dei rischi! Attenzione alle ribellioni e alle linee troppo allungate.\"" 


 ###Rise of the Turks
 hint_rise_of_the_ottomans: "Suggerimenti [GetSituationByKey('rise_of_the_ottomans').GetNameWithNoTooltip]"
 hint_rise_of_the_ottomans_hint_text: "$hint_rise_of_the_ottomans_hint_text_1$\n\n$hint_rise_of_the_ottomans_hint_text_2$"
 hint_rise_of_the_ottomans_hint_text_1: "Questa [situation_with_icon|e] segna l'ascesa del #italic Beilicato più Forte#!, destinato a forgiare uno dei più grandi imperi della storia. Attraverso [events_with_icon|e] e [actions_with_icon|e] unici, dobbiamo assicurarci il dominio sugli altri Beylik, attraversare il [ShowProvinceDefinitionName('marmara_sea_province')] e rivendicare le ricchezze di [ShowLocationName('constantinople')]. La gloria eterna ci attende!" 
 hint_rise_of_the_ottomans_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_2! Il nostro tempo di ascensione è arrivato. Brandendo potenti [actions_with_icon|e] come [ShowGenericActionName('press_claims')] e beneficiando di [events_with_icon|e] che accelerano l'[integration_with_icon|e], la nostra ascesa sarà scritta tra le ere.\n@arrow_bonus_tier_1! Se possediamo #Y 120#! [locations_with_icon|e] e ci assicuriamo una posizione nel [ShowRegionName('balkan_region')], possiamo estendere l'[ShowGenericActionNameWithNoTooltip('press_claims')] [action_with_icon|e] anche a quella [region_with_icon|e]." 
 
 hint_rise_of_the_ottomans_diplomatic: "\"All'inizio della [situation_with_icon|e], il #italic Beylik più Forte#! può sfruttare le [actions_with_icon|e] uniche disponibili, come [ShowGenericActionName('seek_relations_with_the_byzantines')], usando il prestigio dell'ultimo baluardo di $ROM$ per costruire la propria eredità.\"" 
 hint_rise_of_the_ottomans_administrative: "\"Anche se eccelleremo certamente nella conquista, dobbiamo essere consapevoli del nostro interno e del nucleo del nostro regno. Non trascuriamo i nostri affari interni nella ricerca della gloria all'estero!\""
 hint_rise_of_the_ottomans_military: "\"Dobbiamo cercare di conquistare le [towns_and_cities_with_icon|e] dei nostri nemici. Queste campagne saranno il fondamento del potere generazionale.\"" 
 
 ####Council of Trent
 hint_council_of_trent: "[GetSituationByKey('council_of_trent').GetNameWithNoTooltip]"
 hint_council_of_trent_hint_text: "$hint_council_of_trent_hint_text_1$\n\n$hint_council_of_trent_hint_text_2$"
 hint_council_of_trent_hint_text_1: "Durante il [ShowSituationName('council_of_trent')], la [GetUniqueInternationalOrganization('catholic_church').GetName] è in grado di cambiare le sue attuali [laws_with_icon|e] e introdurre nuove [policies_with_icon|e] per l'[international_organization_with_icon|e]." 
 hint_council_of_trent_hint_text_2: "#T Possibili Interazioni:#!\n@arrow_bonus_tier_3! Come [member_with_icon|e] della [GetUniqueInternationalOrganization('catholic_church').GetName], potete proporre un [ShowResolutionName('policy_vote')] utilizzando l'elenco delle [laws] sottostante o il Pannello Dottrine nella [GetUniqueInternationalOrganization('catholic_church').GetName]\n@arrow_bonus_tier_2! Come [member_with_icon|e] della [GetUniqueInternationalOrganization('catholic_church').GetName], potete votare su un [ShowResolutionName('policy_vote')] proposto." 
 hint_council_of_trent_diplomatic: "$hint_advisor_salute_diplomatic$" 
 hint_council_of_trent_administrative: "$hint_advisor_salute_administrative$" 
 hint_council_of_trent_military: "$hint_advisor_salute_military$" 
 
 ###Golden Age of Piracy
 hint_golden_age_of_piracy: "[GetSituationByKey('golden_age_of_piracy').GetNameWithNoTooltip]"
 hint_golden_age_of_piracy_hint_text: "$hint_golden_age_of_piracy_hint_text_1$\n\n$hint_golden_age_of_piracy_hint_text_2$\n\n$hint_golden_age_of_piracy_hint_text_3$\n\n$hint_golden_age_of_piracy_hint_text_4$"
 hint_golden_age_of_piracy_hint_text_1: "L'[GetSituationByKey('golden_age_of_piracy').GetName] è una [situation_with_icon|e] che può dare origine a nuovi pirati. Uomini liberi, marinai scontenti e coloro che sfidano l'autorità centralizzata, danno forza alle vele nere sotto le quali conducono ora le loro attività illecite." 
 hint_golden_age_of_piracy_hint_text_2: "#T Azioni Raccomandate per combattere i Pirati:#!\n@arrow_bonus_tier_3! Considerate di sradicare tutti i Pirati vicino alle nostre coste, non possiamo permetterci che vaghino per i nostri mari.\n@arrow_bonus_tier_2! Ogni [event_with_icon|e] associato a questa [situation_with_icon|e] può annunciare l'ascesa di una nuova repubblica pirata." 
 hint_golden_age_of_piracy_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potremmo essere in grado di utilizzare nuove [actions_with_icon|e] nella [situation_with_icon|e] sia che issiamo la bandiera nera o meno." 
 hint_golden_age_of_piracy_hint_text_4: "#T Azioni Raccomandate come Pirata:#!\n@arrow_bonus_tier_3! È saggio mettere in sicurezza la costa e costruire una potente [navy_with_icon|e]. Utilizzando [actions_with_icon|e] come [ShowGenericActionName('attract_sailors')] o [ShowGenericActionName('migrate_to_new_waters')], possiamo mantenere una flotta e una presenza versatili." 
 
 hint_golden_age_of_piracy_diplomatic: "\"Sorrisi e rum funzionano meglio delle minacce, almeno finché i cannoni non iniziano a parlare. Forse sarebbe saggio mantenere rapporti stabili con i furfanti. Non tutti i tesori sono argento e oro, signore.\""
 hint_golden_age_of_piracy_administrative: "\"Gestire i nostri possedimenti marittimi è un affare delicato nell'era della pirateria. Sia che ci si difenda da loro o dalla concorrenza canaglia, mantenere una stretta amministrazione è fondamentale!\""
 hint_golden_age_of_piracy_military: "\"I pirati non riconoscono nessun Paese, avendo venduto il proprio. E poiché sono sicuri di essere impiccati se catturati, non avranno scrupoli nell'assassinare e distruggere se le loro richieste non saranno esaudite.\""

 ###Hundred Years War
 hint_hundred_years_war: "[GetSituationByKey('hundred_years_war').GetNameWithNoTooltip]"
 hint_hundred_years_war_hint_text: "$hint_hundred_years_war_hint_text_1$\n\n$hint_hundred_years_war_hint_text_2$\n\n$hint_hundred_years_war_hint_text_3$\n\n$hint_hundred_years_war_hint_text_4$\n\n$hint_hundred_years_war_hint_text_5$" 
 hint_hundred_years_war_hint_text_1: "La [GetSituationByKey('hundred_years_war').GetName] getta [ShowSubContinentName('western_europe')] nel tumulto! Questo periodo metterà alla prova le alleanze e nuove potenze emergeranno certamente dalle macerie."
 hint_hundred_years_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Sia [GetCountry('FRA').GetName] che [GetCountry('ENG').GetName] hanno accesso a [ShowGenericActionName('request_war_entry')], [ShowGenericActionName('hyw_sign_truce')] e [ShowGenericActionName('request_papal_delegates')]. Questi sono modi unici per manipolare lo status quo del conflitto o addirittura inclinarlo a favore dell'uno o dell'altro Paese."
 hint_hundred_years_war_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come partecipanti al conflitto, potremmo essere in grado di guadagnare terre o potenti alleanze."
 hint_hundred_years_war_hint_text_4: "#T Azioni Raccomandate come [subject_with_icon|e] di [GetCountry('FRA').GetName]:#!\n@arrow_bonus_tier_3! Sarebbe saggio assicurarsi [ShowGenericActionName('demand_autonomy')]. Ogni [ShowSubjectTypeName('appanage')] può richiedere un certo grado di autonomia e trarne grande beneficio, sfruttando la sua importanza come difensore della corona [GetCountry('FRA').GetAdjectiveWithNoTooltip]." 
 hint_hundred_years_war_hint_text_5: "#T Defezione dei Vassalli#!\n@hint! I sudditi sleali di [GetCountry('FRA').GetName] o [GetCountry('ENG').GetName] possono abbandonare il loro signore e unirsi alla corona avversaria, ridisegnando la guerra. Le defezioni diventano molto più probabili durante una guerra attiva tra le due corone; in tempo di pace, solo i sudditi profondamente sleali cambieranno parte. Un suddito che condivide la dinastia del suo signore non può disertare, per quanto sleale diventi.\n@hint! Come signore, tieni d'occhio la [subject_loyalty_with_icon|e] dei sudditi senza la nostra dinastia. Usa [ShowGenericActionName('fra_diplomacy_with_subjects')] per sostenere i vassalli esitanti, oppure rafforza la lealtà con doni d'opinione prima che scoppi la guerra. Come rivale, prendi di mira i sudditi governati da una dinastia diversa ed erodi la loro lealtà nel tempo." 
 
 hint_hundred_years_war_diplomatic: "\"Date una possibilità alla guerra!\""
 hint_hundred_years_war_administrative: "\"I territori d'oltremare soffriranno probabilmente in termini di [control_with_icon|e]. Fate attenzione alla [proximity_with_icon|e] di ogni località appena conquistata alla nostra [capital_with_icon|e].\"" 
 hint_hundred_years_war_military: "\"Mentre [GetCountry('FRA').GetName] e [GetCountry('ENG').GetName] si dissanguano a vicenda, chi ha visione può ottenere molto. Tieni pronti gli eserciti e vicini gli alleati.\"" 
 
 ###Hussite Wars
 hint_hussite_wars: "[GetSituationByKey('hussite_wars').GetNameWithNoTooltip]"
 hint_hussite_wars_hint_text: "$hint_hussite_wars_hint_text_1$\n\n$hint_hussite_wars_hint_text_2$\n\n$hint_hussite_wars_hint_text_3$\n\n$hint_hussite_wars_hint_text_4$"
 hint_hussite_wars_hint_text_1: "Le [GetSituationByKey('hussite_wars').GetName] portano a una profonda frattura nella [GetReligionByKey('catholic').GetName]. Dalla loro parte, molti monarchi [GetReligionByKey('catholic').GetAdjectiveWithNoTooltip] temono che se questa eresia non verrà estinta rapidamente, potrebbe inghiottire parti consistenti dell'[ShowContinentName('europe')] e minacciare l'autorità spirituale del [GetCountry('PAP').GetGovernment.GetRulerTitle]."
 hint_hussite_wars_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il [GetCountry('PAP').GetGovernment.GetRulerTitle] cercherà di muovere [war_with_icon|e] contro [GetCountry('BOH').GetName]. I Paesi [ShowReligionGroupAdjective('christian')] vicini possono scegliere di unirsi all'una o all'altra parte, decidendo di fatto il destino di un intero [continent_with_icon|e]." 
 hint_hussite_wars_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! [GetCountry('BOH').GetName] ha accesso a numerose [actions_with_icon|e] uniche come [ShowGenericActionName('convert_heretics_hw_action')] e [ShowGenericActionName('prepare_defenses_hw_action')], tra le altre." 
 hint_hussite_wars_hint_text_4: "#T Azioni Raccomandate come [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Buone relazioni con altri paesi [GetReligionByKey('catholic').GetAdjective] possono permetterci di chiamarli nella nostra lotta. Durante la [situation_with_icon|e] e disponibile l'esclusivo [peace_treaty_with_icon|e] [ShowPeaceTreatyTypeName('supress_hussite_faith')]. Ridurra il costo del [peace_treaty_with_icon|e] #Y Conversione Forzata#!.\n@arrow_bonus_tier_2! I [countries_with_icon|e] [GetReligionByKey('catholic').GetAdjective] in [war_with_icon|e] con [GetCountry('BOH').GetName] ottengono accesso a una [action_with_icon|e] [unit_with_icon|e] unica, [ShowUnitAbilityName('hussite_tribunal')]. Permetterà loro di [convert_with_icon|e] con la forza i [pops_with_icon|e] [GetReligionByKey('hussite').GetAdjective] e uccidere chi resiste nelle [province_capitals_with_icon|e] che controllano durante la guerra." 
 
 hint_hussite_wars_diplomatic: "\"La fede dovrebbe motivarci a cercare alleati che la pensano allo stesso modo e a perseverare in questo periodo difficile.\""
 hint_hussite_wars_administrative: "\"Dovremmo occuparci di mantenere l'[religious_unity_with_icon|e].\"" 
 hint_hussite_wars_military: "\"È probabile che dovremo difendere la nostra fede con mezzi violenti.\""

 ###Italian Wars
 hint_italian_wars: "[GetSituationByKey('italian_wars').GetNameWithNoTooltip]"
 hint_italian_wars_hint_text: "$hint_italian_wars_hint_text_1$\n\n$hint_italian_wars_hint_text_2$\n\n$hint_italian_wars_hint_text_3$\n\n$hint_italian_wars_hint_text_4$"
 hint_italian_wars_hint_text_1: "Le [GetSituationByKey('italian_wars').GetName] esplodono quando una [great_power_with_icon|e] entra in guerra in [ShowRegionName('italy_region')] dopo il 1450, o automaticamente dal 1496 in poi. Le #italic Leghe Straniere#!, sostenute dalle grandi potenze di [ShowContinentName('europe')], si scontrano con gli stati italiani che difendono la propria sovranita attraverso le loro #italic Leghe Italiane#!. Con l'aggravarsi del conflitto, la [situation_tension|e] aumenta, sbloccando nuove [actions_with_icon|e] a quattro soglie chiave. Ogni lega combatte per un esito distinto: le leghe italiane difendono la penisola, mentre ogni Lega Straniera persegue le proprie ambizioni, con ricompense durature uniche per la parte vincitrice." 
 hint_italian_wars_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Gli stati italiani dovrebbero [ShowGenericActionName('join_a_league')] o [ShowGenericActionName('create_italian_league')] per unire le risorse e difendersi collettivamente. L'appartenenza concede accesso militare condiviso, la capacità di reclutare truppe nelle terre degli altri membri e un bonus al mantenimento dei mercenari. I leader delle Leghe Italiane, le grandi potenze e i nemici giurati degli invasori possono usare [ShowGenericActionName('iw_send_aid')] per inviare oro o uomini a un leader di Lega Italiana in difficoltà.\n@arrow_bonus_tier_3! I leader delle Leghe Straniere dovrebbero [ShowGenericActionName('plan_campaign_in_italy')] per ottenere [casus_belli_with_icon|e] contro gli stati italiani, poi usare [ShowGenericActionName('iw_intervene_in_war')] per entrare nelle guerre in corso al fianco dei propri membri. I membri delle leghe straniere ottengono un bonus all'efficienza del punteggio di guerra.\n@arrow_bonus_tier_3! Ogni membro di una lega può usare il [casus_belli_with_icon|e] #italic Mettere al sicuro l'Italia#! per rivendicare province in [ShowRegionName('italy_region')] dagli stati avversari. La disponibilità a usarlo scala con la [situation_tension|e] attuale." 
 hint_italian_wars_hint_text_3: "#T Soglie di Tensione della Situazione:#!\n@hint! #Y 25#!: le [actions_with_icon|e] di fortificazione si sbloccano per ogni membro di Lega o stato italiano, mentre la corruzione diventa disponibile per i leader di Lega.\n@hint! #Y 50#!: la mobilitazione militare tramite parlamento diventa disponibile e la domanda di armi aumenta nei mercati della capitale dei leader delle Leghe Italiane.\n@hint! #Y 75#!: le Leghe Italiane chiamano automaticamente i membri che non sono sudditi ne sponsor a difendere qualsiasi leader attaccato da una Lega Straniera. Le [actions_with_icon|e] di intervento e violazione della sovranita si sbloccano per le potenze idonee.\n@hint! #Y 100#!: tutte le tregue tra leader di Lega sono annullate. Le Leghe Straniere ottengono il diritto di chiamare i membri nelle guerre offensive." 
 hint_italian_wars_hint_text_4: "#T Suggerimenti Aggiuntivi:#!\n@hint! I leader di Lega possono [ShowGenericActionName('expel_league_member')] per rimuovere membri inaffidabili. I membri abbastanza potenti possono [ShowGenericActionName('challenge_league_leadership')] per prendere il controllo dall'interno, anche se ciò richiede di vincere una guerra contro il leader attuale.\n@hint! Le grandi potenze possono agire come #italic Sponsor#!, contribuendo oro e uomini a una Lega Italiana senza aderirvi formalmente. Alla fine della guerra, il leader della lega vincitrice, insieme a ogni membro di una Lega Straniera vittoriosa, può [ShowGenericActionName('establish_italian_administration_center')] in una città in [ShowRegionName('italy_region')] per cementare la propria influenza.\n@hint! La parte che controlla almeno #Y 200#! località in [ShowRegionName('italy_region')] quando la situazione termina ottiene un vantaggio decisivo nell'esito finale.\n@hint! [ShowGenericActionName('dissolve_italian_league')] riduce notevolmente la [situation_tension|e], rendendola un potente strumento diplomatico, pur al costo della Lega stessa." 
 
 hint_italian_wars_diplomatic: "\"Reclutate i volenterosi, corrompete gli indecisi e non lasciate nessuna città italiana sola davanti alla marea straniera.\"" 
 hint_italian_wars_administrative: "\"La tensione e un'arma: lasciatela crescere quando ci serve, e moderatela prima che ci bruci.\"" 
 hint_italian_wars_military: "\"Dobbiamo schiacciare la concorrenza, c'è troppa ricchezza e potere in gioco.\"" 
 
 ###Little Ice Age
 hint_little_ice_age: "[GetSituationByKey('little_ice_age').GetNameWithNoTooltip]"
 hint_little_ice_age_hint_text: "$hint_little_ice_age_hint_text_1$\n\n$hint_little_ice_age_hint_text_2$\n\n$hint_little_ice_age_hint_text_3$"
 hint_little_ice_age_hint_text_1: "La [GetSituationByKey('little_ice_age').GetName] è su di noi! Il gelo copre le terre. Dobbiamo fare del nostro meglio per proteggere i raccolti, gli animali e assicurare la sopravvivenza del nostro popolo!"
 hint_little_ice_age_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considerate di espandere gli [buildings_with_icon|e] che producono o migliorano la produzione di [food_with_icon|e]." 
 hint_little_ice_age_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo utilizzare molte [actions_with_icon|e] uniche per aiutare a rafforzare e ridistribuire [food_with_icon|e] attraverso le nostre [provinces_with_icon|e]." 
 
 hint_little_ice_age_diplomatic: "\"L'inverno sta arrivando.\""
 hint_little_ice_age_administrative: "\"La corretta produzione e distribuzione di [food_with_icon|e] salverà i nostri [pops_with_icon|e] dall'incontrare prematuramente la morte.\"" 
 hint_little_ice_age_military: "\"Gli specchi d'acqua ghiacciati possono essere brevemente attraversabili, ma gli [armies_with_icon|e] intrappolati nelle montagne invernali rischiano di rimanere bloccati molto più a lungo.\"" 
 
 ###Revolution
 hint_the_revolution: "[GetSituationByKey('the_revolution').GetNameWithNoTooltip]"
 hint_the_revolution_hint_text: "$hint_the_revolution_hint_text_1$\n\n$hint_the_revolution_hint_text_2$\n\n$hint_the_revolution_hint_text_3$"
 hint_the_revolution_hint_text_1: "La [GetSituationByKey('the_revolution').GetName] è scoppiata! Le monarchie tremano mentre le idee di libertà, uguaglianza e fratellanza si diffondono a macchia d'olio. Abbracceremo le fiamme del cambiamento o difenderemo il vecchio ordine?"
 hint_the_revolution_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo diventare [revolutionary_with_icon|e] schierandoci con i ribelli [revolutionary_with_icon|e] durante il [ShowDisasterName('revolution_disaster')] [disaster_with_icon|e].\n@arrow_bonus_tier_2! La [situation|e] abilita #Y 2#! [peace_treaties_with_icon|e] unici: [ShowPeaceTreatyTypeName('reinstate_the_monarchy')] e [ShowPeaceTreatyTypeNameWithNoTooltip('force_revolution')].\n@arrow_bonus_tier_1! La [situation|e] offre accesso a nuove [actions_with_icon|e] come [ShowGenericActionName('suppress_foreign_revolutionaries')] e [ShowGenericActionName('assist_foreign_revolutionaries')]." 
 hint_the_revolution_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il Paese rivoluzionario più forte può rivendicare il titolo di [revolutionary_target_with_icon|e] avendo il [great_power_score_with_icon|e] più alto." 
 
 hint_the_revolution_diplomatic: "\"Nel panorama politico, sembra che molti monarchi abbiano perso la testa nel tentativo di schiacciare queste rivoluzioni.\""
 hint_the_revolution_administrative: "\"Faremo bene a scegliere una parte e in fretta. La sopravvivenza del nostro regno dipende da decisioni rapide. Se la rivoluzione dovesse bussare alla nostra porta, saremo preparati.\""
 hint_the_revolution_military: "\"Sia che schiacciamo o sosteniamo il sentimento rivoluzionario, la nostra influenza deve estendersi oltre i nostri confini.\""

 ###Western Schism
 hint_western_schism: "[GetSituationByKey('western_schism').GetNameWithNoTooltip]"
 hint_western_schism_hint_text: "$hint_western_schism_text_1$\n\n$hint_western_schism_text_2$\n\n$hint_western_schism_text_3$\n\n$hint_western_schism_text_4$"
 hint_western_schism_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('western_schism')], l'[international_organization_with_icon|e] [GetUniqueInternationalOrganization('catholic_church').GetName] è divisa tra due candidati al Papato, impedendo ogni interazione con la Curia.\n\nPer influenzare l'esito della [situation] si possono intraprendere i seguenti passi a seconda del vostro ruolo all'interno della Chiesa:"
 hint_western_schism_text_2: "#T [countries] in possesso di un [cardinal_with_icon|e]:#!\n@arrow_bonus_tier_3! Votate per uno dei candidati"
 hint_western_schism_text_3: "#T [countries] senza un [cardinal_with_icon|e]:#!\n@arrow_bonus_tier_3! Usate l'[action|e] della [situation] #V $schism_show_support_for_one_pope$#! per concedere progressi a un candidato scelto\n@arrow_bonus_tier_2! Usate l'[action] religiosa $request_cardinal_seat$ per ottenere un [cardinal]\n@arrow_bonus_tier_1! Usate l'[action] della [situation] #V $schism_demand_support_from_one_pope$#! per trarre profitto dalla [situation]"
 hint_western_schism_text_4: "Durante la [situation] le eresie si diffonderanno in tutto il mondo cattolico.\n\n#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considerate di usare l'[situation|e] della [action] #V $schism_show_unity_of_faith$#! per mantenere alta la vostra [religious_unity_with_icon|e]" 
 
 ###Reformation
 hint_reformation: "[GetSituationByKey('reformation').GetNameWithNoTooltip]"
 hint_reformation_hint_text: "$hint_reformation_hint_text_1$\n\n$hint_reformation_hint_text_2$\n\n$hint_reformation_hint_text_3$"
 hint_reformation_hint_text_1: "Durante la [ShowSituationNameWithNoTooltip('reformation')] [situation|e], i [ShowBuildingTypeName('lutheran_preachers')] e i [ShowBuildingTypeName('calvinist_preachers')] diffonderanno le loro nuove [religions_with_icon|e] in tutto il mondo [ShowReligionGroupAdjective('christian')]." 
 hint_reformation_hint_text_2: "#T Combattere i Riformatori:#!\n@arrow_bonus_tier_3! Una volta selezionata [ShowPolicyName('jesuits_allowed')], rimuovi gli [buildings_with_icon|e] [ShowBuildingTypeName('lutheran_preachers')] e [ShowBuildingTypeName('calvinist_preachers')], al costo di [stability_with_icon|e]\n@arrow_bonus_tier_3! Una volta abilitato, costruisci e mantieni [ShowBuildingTypeName('jesuit_college')] per combattere la diffusione di [ShowReligionName('lutheran')] e [ShowReligionName('calvinist')]" 
 hint_reformation_hint_text_3: "#T Unirsi ai Riformatori:#!\n@arrow_bonus_tier_3! Una volta che una delle nuove fedi si è diffusa nel vostro Paese, abbracciatela e convertitevi ad essa con l'azione #V $embrace_the_reformation$#!\n@arrow_bonus_tier_2! Usate il @religion_panel![Link('country_religion', '', '@society_panel! Religion Tab')] per convertirvi a una nuova [religion]" 
 hint_reformation_diplomatic: "$hint_advisor_salute_diplomatic$" 
 hint_reformation_administrative: "$hint_advisor_salute_administrative$" 
 hint_reformation_military: "$hint_advisor_salute_military$" 
 
 ###Treaty of Tordesillas
 hint_treaty_of_tordesillas: "[GetSituationByKey('treaty_of_tordesillas').GetNameWithNoTooltip]"
 hint_treaty_of_tordesillas_hint_text: "$hint_treaty_of_tordesillas_hint_text_1$\n\n$hint_treaty_of_tordesillas_hint_text_2$"
 hint_treaty_of_tordesillas_hint_text_1: "Il [GetSituationByKey('treaty_of_tordesillas').GetName] è iniziato! [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_west_country').GetCountry.GetName] e [GetSituationByKey('treaty_of_tordesillas').MakeScope.GetVariable('var_east_country').GetCountry.GetName] cercano di spartirsi il Nuovo Mondo tra loro!"
 hint_treaty_of_tordesillas_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo utilizzare una qualsiasi delle [actions_with_icon|e] uniche attraverso il pannello della [situation|e] per plasmare le nostre ambizioni coloniali.\n@arrow_bonus_tier_2! La [situation|e] entrerà alla fine in una #Y Seconda#! fase, una volta ratificata. Una volta fatto, più [countries_with_icon|e] potranno parteciparvi e avanzare le loro rivendicazioni." 
 
 hint_treaty_of_tordesillas_diplomatic: "\"Questa è una buona opportunità per ritagliarci un pezzo di terre appena scoperte, sotto la parvenza di autorità religiosa e superiore.\""
 hint_treaty_of_tordesillas_administrative: "\"Il nuovo mondo offre molte opportunità commerciali. Approfittiamone.\""
 hint_treaty_of_tordesillas_military: "\"Non possiamo permettere ai nostri nemici di impadronirsi di quella terra prima di noi!\""

 ###Great Pestilence
 hint_great_pestilence: "[GetSituationByKey('great_pestilence').GetNameWithNoTooltip]"
 hint_great_pestilence_hint_text: "$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$"
 
 hint_great_pestilence_diplomatic: "\"I nostri alleati ci hanno abbandonato. La leadership ci ha tradito. Abbandonate i vostri posti! Fuggite, fuggite per le vostre vite!\""
 hint_great_pestilence_administrative: "\"Non perdete la speranza, ci sono molte misure che possiamo prendere per mitigare le morti, per quanto misere e inefficaci possano essere...\""
 hint_great_pestilence_military: "\"Fate attenzione a muovere i nostri [armies_with_icon|e] intorno alle [locations_with_icon|e] con la malattia. Non possiamo permetterci di perdere soldati.\"" 
 
 ###Columbian Exchange
 hint_columbian_exchange: "[GetSituationByKey('columbian_exchange').GetNameWithNoTooltip]"
 hint_columbian_exchange_hint_text: "$hint_columbian_exchange_hint_text_1$\n\n$hint_columbian_exchange_hint_text_2$"
 hint_columbian_exchange_hint_text_1: "Lo [GetSituationByKey('columbian_exchange').GetName] è iniziato! [trade_with_icon|e] e [goods_with_icon|e] fluiranno d'ora in poi tra il Vecchio e il Nuovo Mondo!" 
 hint_columbian_exchange_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo utilizzare una qualsiasi delle [actions_with_icon|e] uniche attraverso il pannello della [situation_with_icon|e] per rafforzare i nostri profitti introducendo nuove merci nel nostro [market_with_icon|e]." 
 
 hint_columbian_exchange_diplomatic: "\"Il profitto commerciale fa girare il mondo!\""
 hint_columbian_exchange_administrative: "$hint_treaty_of_tordesillas_administrative$"
 hint_columbian_exchange_military: "\"Dobbiamo fare del nostro meglio per assicurarci fonti redditizie e nuove merci, prima dei nostri concorrenti!\""
 
 ###War of Religions
 hint_war_of_religions: "[GetSituationByKey('war_of_religions').GetNameWithNoTooltip]"
 hint_war_of_religions_hint_text: "$hint_war_of_religions_hint_text_1$\n\n$hint_war_of_religions_hint_text_2$\n\n$hint_war_of_religions_hint_text_3$\n\n$hint_war_of_religions_hint_text_4$"
 hint_war_of_religions_hint_text_1: "Durante la [ShowSituationNameWithNoTooltip('war_of_religions')] [situation|e], due [international_organizations_with_icon|e] cercano di assicurare la sopravvivenza delle loro [religions_with_icon|e] all'interno del [GetUniqueInternationalOrganization('hre').GetName]. L'[GetUniqueInternationalOrganization('protestant_union').GetName] e la [GetUniqueInternationalOrganization('catholic_league').GetName] offriranno protezione ai [countries_with_icon|e] dell'impero. Con l'aumento delle tensioni, entrambe potranno cercare di stabilire la supremazia religiosa, alterando le [laws_with_icon|e] del [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] a loro preferenza." 
 hint_war_of_religions_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Unitevi all'[international_organization] che desiderate sostenere\n@arrow_bonus_tier_2! Cercate nuove [alliances_with_icon|e] con Paesi esterni\n@arrow_bonus_tier_2! Come [country] non membro del [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip], cercate un'[alliance] con il leader della lega religiosa preferita" 
 hint_war_of_religions_hint_text_3: "#T Se siete un Leader di una Lega Religiosa:#!\n@arrow_bonus_tier_3! Usate l'[action|e] della [situation] #V $prepare_military_escalation$#! per ottenere il [ShowCasusBelliName('cb_religious_superiority')]\n@hint! Una volta usata, potete imporre il [ShowPeaceTreatyTypeName('religious_supremacy')] per far rispettare le richieste della vostra fazione\n@arrow_bonus_tier_2! Usate l'[action] della [situation] #V $demand_member_removal$#! per rimuovere i Paesi pericolosi dall'altra [international_organization] prima che scoppi la [war]"
 hint_war_of_religions_hint_text_4: "#T Suggerimenti Aggiuntivi:#!\n@hint! Durante la [war] di [ShowCasusBelliName('cb_religious_superiority')] i [countries] acquisiranno [war_exhaustion]\n@hint! Se l'#Y 80%#! di tutti i partecipanti desidera la [peace_with_icon|e] si raggiunge invece la #Y Pace di Vestfalia#!\n@hint! Questo costringerà la [war] a terminare e raggiungerà la pace religiosa all'interno del [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]" 
 hint_war_of_religions_diplomatic: "$hint_advisor_salute_diplomatic$" 
 hint_war_of_religions_administrative: "$hint_advisor_salute_administrative$" 
 hint_war_of_religions_military: "$hint_advisor_salute_military$" 
 
 ###Guelphs and Ghibellines
 hint_guelphs_and_ghibellines: "[GetSituationByKey('guelphs_and_ghibellines').GetNameWithNoTooltip]"
 hint_guelphs_and_ghibellines_hint_text: "$hint_guelphs_and_ghibellines_hint_text_1$\n\n$hint_guelphs_and_ghibellines_hint_text_2$\n\n$hint_guelphs_and_ghibellines_hint_text_3$" 
 hint_guelphs_and_ghibellines_hint_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('guelphs_and_ghibellines')], le [international_organizations_with_icon|e] [GetUniqueInternationalOrganization('guelphs_io').GetName] e [GetUniqueInternationalOrganization('ghibellines_io').GetName] competono per l'influenza sulla [region|e] di [ShowRegionName('italy_region')] in nome del [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] ([GetUniqueInternationalOrganization('guelphs_io').GetName]) o del [GetUniqueInternationalOrganization('hre').GetLeaderTitle] ([GetUniqueInternationalOrganization('ghibellines_io').GetName]). I leader di entrambe le [international_organizationss] saranno il paese con la propria [capital|e] in [ShowRegionNameWithNoTooltip('italy_region')] e il [great_power_score|e] più alto." 
 hint_guelphs_and_ghibellines_hint_text_2: "#T Se sei membro di una delle due parti:#!\n@arrow_bonus_tier_3! Costringi un [country_with_icon|e] a entrare nella tua fazione con l'aiuto del [casus_belli_with_icon|e] [ShowCasusBelliName('cb_gag_force_country_into_faction')]\n@arrow_bonus_tier_2! Costringere un paese a cambiare fazione con questo trattato di pace aggiungera punteggio alla tua fazione. Attaccare membri della tua stessa fazione, invece, sottrarra punteggio alla tua fazione.\n@arrow_bonus_tier_1! Aiuta i membri della tua fazione a mantenere la loro [tax_base_with_icon|e] con relazioni diplomatiche come [alliances_with_icon|e] o [guarantee_with_icon|e]\n@arrow_bonus_tier_1! Aumenta la [tax_base_with_icon|e] del tuo [country]" 
 hint_guelphs_and_ghibellines_hint_text_3: "#T Possibili Esiti della Situazione:#!\n@hint! In caso di vittoria di [GetUniqueInternationalOrganization('guelphs_io').GetName], tutti i paesi entro la [ShowRegionName('italy_region')] imperiale saranno costretti a lasciare [GetUniqueInternationalOrganization('hre').GetName] e non potranno rientrarvi per 50 anni.\nInoltre, il leader di [GetUniqueInternationalOrganization('guelphs_io').GetName] potra formare $ITA_f$ senza il requisito di possedere specifiche [locations] per 200 anni.\n@hint! In caso di vittoria di [GetUniqueInternationalOrganization('ghibellines_io').GetName], tutti i paesi entro la [ShowRegionName('italy_region')] imperiale saranno costretti a entrare in [GetUniqueInternationalOrganization('hre').GetName].\nInoltre, il leader di [GetUniqueInternationalOrganization('ghibellines_io').GetName] potra richiedere il Titolo del Regno d'Italia all'[hre_emperor] con requisiti molto ridotti per 200 anni, ottenendo un avanzamento al [country_rank|e] di regno." 
 hint_guelphs_and_ghibellines_diplomatic: "$hint_advisor_salute_diplomatic$" 
 hint_guelphs_and_ghibellines_administrative: "$hint_advisor_salute_administrative$" 
 hint_guelphs_and_ghibellines_military: "$hint_advisor_salute_military$" 
 
 ###Colonial Revolution
 hint_colonial_revolution: "[GetSituationByKey('colonial_revolution').GetNameWithNoTooltip]"
 hint_colonial_revolution_hint_text: "$hint_colonial_revolution_hint_text_1$\n\n$hint_colonial_revolution_text_2$\n\n$hint_colonial_revolution_text_3$"
 hint_colonial_revolution_hint_text_1: "Durante la [ShowSituationNameWithNoTooltip('colonial_revolution')] [situation|e], i [subjects_with_icon|e] coloniali del mondo lottano per la loro indipendenza contro i loro [overlords_with_icon|e]." 
 hint_colonial_revolution_text_2: "#T Se siete una nazione coloniale :#!\n@arrow_bonus_tier_3! Create una [international_organization|e]\n@arrow_bonus_tier_2! Usate l'[situation] della [action|e] #V $seek_alliance_with_overlord_rival$#! per ricevere aiuto da altri [countries_with_icon|e]\n@arrow_bonus_tier_1! Se esiste una federazione coloniale, considerate di unirvi ad essa" 
 hint_colonial_revolution_text_3: "#T Se siete un [overlord] :#!\n@arrow_bonus_tier_3! Usate l'[action] della [situation] #V $establish_goods_act$#! per ottenere fondi aggiuntivi\n@arrow_bonus_tier_2! Considerate di usare l'[action] della [situation] #V $give_colony_representation$#!, se una colonia diventa sleale"
 hint_colonial_revolution_diplomatic: "$hint_advisor_salute_diplomatic$" 
 hint_colonial_revolution_administrative: "$hint_advisor_salute_administrative$" 
 hint_colonial_revolution_military: "$hint_advisor_salute_military$" 

 ###Red Turban Rebellion
 hint_red_turban_rebellions: "[GetSituationByKey('red_turban_rebellions').GetNameWithNoTooltip]"
 hint_red_turban_rebellions_hint_text: "$hint_red_turban_rebellions_hint_text_1$\n\n$hint_red_turban_rebellions_hint_text_2$\n\n$hint_red_turban_rebellions_hint_text_3$"
 hint_red_turban_rebellions_hint_text_1: "Le [GetSituationByKey('red_turban_rebellions').GetName] sono scoppiate in tutta $china$! [GetCountry('CHI').GetName] ha perso il favore dei cieli, l'instabilità ora governa il suo [GetCountry('CHI').GetFlavorRank]!"
 hint_red_turban_rebellions_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! [GetCountry('CHI').GetName] deve cercare di imporre [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')] su coloro che cercano di rompere il loro dominio.\n@arrow_bonus_tier_2! Il [GetInternationalOrganizationType('red_turban_rebels').GetName] può [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')] contro [GetCountry('CHI').GetNameWithNoTooltip].\n@arrow_bonus_tier_1! Il [GetCountry('CHI').GetLongName] subirà molti [events_with_icon|e] unici mentre la sua terra viene usurpata da aspiranti conquistatori." 
 hint_red_turban_rebellions_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo usare molte [actions_with_icon|e] uniche nel pannello della [situation_with_icon|e] per aiutare a [integrate_with_icon|e] le conquiste e mantenere alto il [control_with_icon|e].\n@hint! Se vinciamo la situazione e formiamo [GetFormableCountry('CHI').GetName], otterremo automaticamente [cores|e] in tutta $china$." 
 
 hint_red_turban_rebellions_diplomatic: "\"Una guerra incessante lascia poco spazio per chiacchiere e diplomazia...\""
 hint_red_turban_rebellions_administrative: "\"Sarebbe saggio utilizzare correttamente le azioni della situazione. Sono strumenti preziosi che ci aiuteranno a uscirne vittoriosi.\""
 hint_red_turban_rebellions_military: "\"Ora tutta $china$ sa che siamo qui!\""
 
 ###Rise of Timur
 hint_rise_of_timur: "[GetSituationByKey('rise_of_timur').GetNameWithNoTooltip]"
 hint_rise_of_timur_hint_text: "$hint_rise_of_timur_hint_text_1$\n\n$hint_rise_of_timur_hint_text_2$\n\n$hint_rise_of_timur_hint_text_3$"
 hint_rise_of_timur_hint_text_1: "Dalle profondità dell'[ShowSubContinentName('central_asia')] arriva il pallido volto della morte sotto forma di [GetCharacter('chg_timur_lame_borjigin').GetName] e del suo [GetCountry('TIM').GetFlavorRank]. Guai a coloro che resistono alle sue conquiste!"
 hint_rise_of_timur_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Finche [GetCharacter('chg_timur_lame_borjigin').GetName] vive, [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank] beneficera del [modifier_with_icon|e] [ShowModifier('timmy_wants_to_play')].\n@arrow_bonus_tier_2! Il suddetto [modifier_with_icon|e] permetterà a [GetCharacter('chg_timur_lame_borjigin').GetShortNameWithNoTooltip] di annettere automaticamente le [locations_with_icon|e] assediate.\n@arrow_bonus_tier_1! [GetCountry('TIM').GetLongName] ottiene accesso a [casus_belli_with_icon|e] unici." 
 hint_rise_of_timur_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! [GetCountry('TIM').GetName] può utilizzare molte potenti [actions_with_icon|e] nel pannello della [situation_with_icon|e]." 
 
 hint_rise_of_timur_diplomatic: "\"Forse si può ragionare con l'orda?\""
 hint_rise_of_timur_administrative: "\"Consideriamo di costruire fortificazioni per proteggere i nostri confini.\""
 hint_rise_of_timur_military: "\"[GetCountry('TIM').GetName] dipende da un potente esercito di cavalieri infernali, una storia di conquista e una fame di spalancare le loro mascelle e inghiottire tutta l'[ShowContinentName('asia')]!\""
 
 ### Nanbokuchou
 hint_nanbokuchou: "[GetSituationByKey('nanbokuchou').GetNameWithNoTooltip]"
 hint_nanbokuchou_hint_text: "$hint_nanbokuchou_hint_text_1$\n\n$hint_nanbokuchou_hint_text_2$\n\n$hint_nanbokuchou_hint_text_3$"
 hint_nanbokuchou_hint_text_1: "Il [GetSituationByKey('nanbokuchou').GetName] è una [situation_with_icon|e] che divide [ShowRegionName('japan_region')] in Corti Imperiali in competizione, le linee del Nord e del Sud, ognuna in cerca di legittimità. I Clan devono scegliere da che parte stare, poiché questo conflitto rimodellerà l'intera nazione insulare." 
 hint_nanbokuchou_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Usa il [casus_belli_with_icon|e] unico [ShowCasusBelliName('cb_nanbokuchou')] per muovere guerra a favore del pretendente imperiale che hai scelto.\n@arrow_bonus_tier_2! Puoi costringere la corte rivale ad abdicare usando il [peace_treaty|e] [ShowPeaceTreatyTypeName('peace_nanbokuchou_force_imperial_abdication')] e assicurare la supremazia al tuo Imperatore preferito.\n@arrow_bonus_tier_2! Usa le [unit_abilities|e] [ShowUnitAbilityName('raid_clan_holdings')] e [ShowUnitAbilityName('raid_imperial_family_holdings')] per ottenere [war_score|e]\n@arrow_bonus_tier_1! Espandi la tua influenza di Clan con [ShowPeaceTreatyTypeName('peace_expand_clan_influence')] per impadronirti di [locations_with_icon|e] nemiche." 
 hint_nanbokuchou_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il tempismo è cruciale. I Clan più piccoli possono usare il conflitto per ottenere influenza sui rivali.\n@hint! Considerate l'equilibrio di potere prima di schierarvi."
 
 hint_nanbokuchou_diplomatic: "\"Questa è più di una guerra di spade. La nostra scelta di pretendente definirà la nostra eredità.\""
 hint_nanbokuchou_administrative: "\"Mantenere l'ordine schierandosi con una corte o l'altra è una sfida, ma potrebbe garantirci un'influenza ineguagliabile sull'istituzione Imperiale.\""
 hint_nanbokuchou_military: "\"Colpite con decisione e rivendicate il manto della legittimità prima che i nostri rivali possano consolidare il loro potere.\""

 ### Sengoku
 hint_sengoku: "[GetSituationByKey('sengoku').GetNameWithNoTooltip]"
 hint_sengoku_hint_text: "$hint_sengoku_hint_text_1$\n\n$hint_sengoku_hint_text_2$\n\n$hint_sengoku_hint_text_3$"
 hint_sengoku_hint_text_1: "Il [GetSituationByKey('sengoku').GetName] è una [situation_with_icon|e] che inghiotte [ShowRegionName('japan_region')] in una guerra quasi costante. I Clan lottano per la supremazia mentre il $JAPANESE_SHOGUNATE_LEADER_MALE$ lotta per mantenere il controllo sul Paese." 
 hint_sengoku_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Muovete guerra con il [ShowCasusBelliName('cb_sengoku')] unico [casus_belli_with_icon|e] per espandere il vostro Clan.\n@arrow_bonus_tier_2! Come $JAPANESE_SHOGUNATE_LEADER_MALE$, usate [ShowGenericActionName('sengoku_revoke_clans_land')] per indebolire i Clan troppo cresciuti e [ShowGenericActionName('sengoku_limit_clans_autonomy')] per trasformarli in un [building_based_with_icon|e].\n@arrow_bonus_tier_1! Se siete un [building_based_with_icon|e], potete proclamare l'indipendenza e diventare un [location_based_with_icon|e] con [ShowGenericActionName('sengoku_proclaim_clan_independence')]." 
 hint_sengoku_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! L'equilibrio di potere si sposta costantemente. Cercate opportunità per colpire i Clan indeboliti.\n@hint! Come $JAPANESE_SHOGUNATE_LEADER_MALE$, consolidare il controllo precocemente renderà molto più facile l'unificazione di [ShowRegionName('japan_region')].\n@hint! I Clan più piccoli possono trarre beneficio mettendo i rivali più grandi l'uno contro l'altro fino al momento giusto per liberarsi."
 
 hint_sengoku_diplomatic: "\"Le alleanze cambieranno rapidamente. Scegliete gli amici con attenzione, poiché potrebbero essere i nemici di domani.\""
 hint_sengoku_administrative: "\"È necessaria una forte governance per impedire che il regno crolli nel caos.\""
 hint_sengoku_military: "\"Questa è l'era della spada. Colpite rapidamente e colpite duro o sarete consumati dagli altri.\""
 
 
 
 ##### Disaster Hints #####
 swift_end_string: "Come per ogni disastro, una rapida conclusione è spesso la più desiderabile, poiché le questioni in sospeso possono portare a esiti sfortunati."
 disaster_war_hint: "È meglio tenere a mente che alcuni dei nostri vicini non desiderano una tregua o un'alleanza durante i nostri tempi turbolenti, poiché cercano opportunità espansionistiche a nostre spese."
 
 ###Coup
 hint_coup_attempt: "Suggerimenti $coup_attempt$"
 hint_coup_attempt_hint_text: "$hint_coup_attempt_hint_text_1$\n\n$hint_coup_attempt_hint_text_2$\n\n$hint_coup_attempt_hint_text_3$"
 hint_coup_attempt_hint_text_1: "All'interno della nostra [court_with_icon|e], uomini e donne ambiziosi cercano potere oltre i loro mezzi, utilizzando metodi illeciti per piazzare burattini sul nostro trono, dettare [laws_with_icon|e] e assicurare [privileges_with_icon|e] per sé stessi. Questo [disaster_with_icon|e] persisterà finché i cospiratori non se ne andranno, il loro leader non si impadronirà del trono, o non otterremo sufficiente [legitimacy_with_icon|e]. $swift_end_string$" 
 hint_coup_attempt_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo scegliere [ShowGenericActionName('conduct_investigation')]. Potrebbe richiedere tempo, ma scoprirà alcuni cospiratori, avvicinandoci all'epurazione dei loro ranghi.\n@arrow_bonus_tier_2! Mantieni alta la nostra [stability_with_icon|e]. Più e alta, più bassa sarà la soglia di [legitimacy_with_icon|e] necessaria per concludere questo [disaster_with_icon|e].\n@arrow_bonus_tier_1! Se i tempi si faranno più disperati, potremo scegliere [ShowGenericActionName('call_private_council')] o [ShowGenericActionName('execute_court_member')]. La prima ci permetterà di affidarci ai nostri [estates_with_icon|e] per stanare i cospiratori in cambio di [privileges_with_icon|e] o [gold_with_icon|e]. La seconda [action_with_icon|e] ci permetterà di giustiziare qualsiasi [character_with_icon|e] nella nostra [court_with_icon|e] se sospettiamo che sia membro della cospirazione." 
 hint_coup_attempt_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potremmo ricevere [events_with_icon|e] casuali durante questo [disaster_with_icon|e] che indicheranno potenziali cospiratori. Sarebbe saggio esaminare ciascuno di essi e prendere una decisione informata. Sarebbe subottimale che il nostro miglior [cabinet_member_with_icon|e] perdesse la testa senza motivo." 
 
 hint_coup_attempt_diplomatic: "\"Ora e il momento di riaffermare le nostre relazioni con i [countries_with_icon|e] vicini e stabilire un confine forte. L'ultima cosa di cui abbiamo bisogno e un pericolo all'esterno, oltre che all'interno.\"" 
 hint_coup_attempt_administrative: "\"Uno degli altri consiglieri potrebbe essere un cospiratore. Non lo sapremo mai!\""
 hint_coup_attempt_military: "\"$disaster_war_hint$ Ricordate, un attacco preventivo è solo un #italic trattato di pace a sorpresa#! consegnato con molta forza.\""

 ###Crisis of the Chinese Dynasty
 hint_crisis_of_the_chinese_dynasty: "Suggerimenti $crisis_of_the_chinese_dynasty$"
 hint_crisis_of_the_chinese_dynasty_hint_text: "$hint_crisis_of_the_chinese_dynasty_hint_text_1$\n\n$hint_crisis_of_the_chinese_dynasty_hint_text_2$"
 hint_crisis_of_the_chinese_dynasty_hint_text_1: "I cieli un tempo Ci hanno graziato con luce e prosperità. Tuttavia, eventi recenti, carestie e devastazioni hanno portato all'introduzione di un'era oscura per il nostro regno su $china$. Questo [disaster_with_icon|e] persisterà finché non lo supereremo attraverso una riforma persistente della nostra amministrazione o perderemo il nostro seggio a capo del [GetUniqueInternationalOrganization('middle_kingdom').GetName]. $swift_end_string$" 
 hint_crisis_of_the_chinese_dynasty_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo scegliere di [ShowCabinetActionName('reform_taxation_system')] attraverso il nostro [cabinet_with_icon|e]. Ciò potrebbe richiedere del tempo ma ci indirizzerà sulla giusta via per porre fine a questo [disaster_with_icon|e].\n@arrow_bonus_tier_2! Mantenete alta la nostra [celestial_authority_gc_with_icon|e]. Se dovesse raggiungere un valore di #G 90#! o superiore, il [disaster_with_icon|e] si concluderà pacificamente.\n@arrow_bonus_tier_1! Il [disaster_with_icon|e] abilita molte nuove [actions_with_icon|e] come [ShowGenericActionName('cmd_reform_the_cabinet')], [ShowGenericActionName('cmd_restore_stability')] e [ShowGenericActionName('cmd_strengthen_crown')]. Tutte queste offrono un modo alternativo per concludere positivamente questo periodo turbolento, nel caso in cui non riusciamo a innalzare sufficientemente la nostra [celestial_authority_gc_with_icon|e]." 
 
 hint_crisis_of_the_chinese_dynasty_diplomatic: "\"Ora è il momento di riaffermare le nostre relazioni con i [countries_with_icon|e] che fanno parte del [GetUniqueInternationalOrganization('middle_kingdom').GetName], in modo da assicurare la sopravvivenza di questa grande istituzione.\n\nSenza sentimenti di rispetto, cosa c'è per distinguere gli uomini dalle bestie?\"" 
 hint_crisis_of_the_chinese_dynasty_administrative: "\"Se decidiamo di porre fine a questo [disaster_with_icon|e] riformando la nostra amministrazione, è saggio assegnare questi compiti monumentali a [cabinet_members_with_icon|e] capaci.\n\nChi non risparmierà dovrà agonizzare.\"" 
 hint_crisis_of_the_chinese_dynasty_military: "\"$disaster_war_hint$\n\nNel mezzo del caos, c'è anche opportunità!\""
 hint_turmoil_in_brandenburg: "$turmoil_in_brandenburg$" 
 hint_turmoil_in_brandenburg_hint_text: "$hint_turmoil_in_brandenburg_hint_text_1$\n\n$hint_turmoil_in_brandenburg_hint_text_2$\n\n$hint_turmoil_in_brandenburg_hint_text_3$\n\n$hint_turmoil_in_brandenburg_hint_text_4$" 
 hint_turmoil_in_brandenburg_hint_text_1: "Il Disastro $turmoil_in_brandenburg$ ci pone due problemi da affrontare. Innanzitutto, dobbiamo consolidare la nostra dinastia regnante aumentando il punteggio degli investimenti a 100 oppure chiedere all'Imperatore del Sacro Romano Impero di insediare una nuova dinastia sul nostro trono, nel caso in cui raggiungiamo un punteggio di -100 in Negligenza. Dopo il 1365, i Baroni Ladri appariranno più frequentemente nelle nostre [provinces|e] e devasteranno il territorio. Una volta che una parte sufficiente del nostro Paese (il 75% delle [provinces] di nostra proprietà) è stato liberato dal terrore dei Baroni Ladri attraverso l'[cabinet_action|e] $pru_deal_with_robber_barons$, il disastro potrà finire." 
 hint_turmoil_in_brandenburg_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! Aumenta il tuo punteggio in Investimenti o Negligenza attraverso gli eventi legati al disastro\n@arrow_bonus_tier_1! Espandi con cautela il tuo territorio per non concedere ai Baroni Ladri nuove terre in cui espandersi." 
 hint_turmoil_in_brandenburg_hint_text_3: "#T Suggerimenti Extra:#!Ritrova il [control] perduto con l'[cabinet_action] adeguata\n@hint! Trova [alliances|e] che sono in grado di aiutarti in un potenziale [civil_war|e]" 
 hint_turmoil_in_brandenburg_hint_text_4: "#T Come ottenere risultati dinastici diversi:#!\n@hint!Manterrai l'attuale dinastia regnante realizzando un $bra_wittelsbacher_investment_var$ di 100\n@hint! Potrai ottenere la dinastia degli Hohenzollern con $bra_wittelsbacher_neglect_var$ di -100 quando l'Imperatore ha un erede adulto. Una volta che quel personaggio governerà entrambi i paesi come Imperatore del Sacro Romano Impero, potrà mettere un membro della dinastia degli Hohenzollern sul tuo trono." 
 
 
 ### Construction missing input
 hint_war: "Guerra"
 hint_war_hint_text: "$hint_war_hint_text_1$\n\n$hint_war_hint_text_2$\n\n$hint_war_hint_text_3$"
 hint_war_hint_text_1: "La [war_with_icon|e] inizia quando un [country_with_icon|e] emette una dichiarazione di guerra e termina quando le due parti concordano un [peace_treaty_with_icon|e]. Ogni [war] ha due [war_leaders_with_icon|e], ma ci possono essere anche gli [war_allies_with_icon|e]. La [war] terminerà quando i due [war_leaders] firmeranno un [peace_treaty], ma i partecipanti secondari possono firmare [peace_treaties] separati con il [war_leader] nemico." 
 hint_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considerate di ottenere un [casus_belli_with_icon|e] prima di dichiarare una [war]. Possiamo chiederne uno durante il [parliament_with_icon|e], o fabbricarne uno contro i nostri [rivals_with_icon|e].\n@arrow_bonus_tier_3! Una volta iniziata una [war], prestate attenzione al [casus_belli] e al suo [war_goal_with_icon|e], poiché è essenziale per guadagnare [war_score_with_icon|e] e assicurarsi un [peace_treaty_with_icon|e] favorevole.\n@arrow_bonus_tier_3! A seconda del Casus Belli, guadagneremo [war_score_with_icon|e] in modi diversi. Ecco le fonti più comuni di [war_score]:\n @arrow_bonus_tier_1! Occupate la [capital_with_icon|e] nemica.\n @arrow_bonus_tier_1! Controllate le [locations_with_icon] rivendicate.\n @arrow_bonus_tier_1! Occupate i [forts_with_icon|e] nemici.\n @arrow_bonus_tier_1! Sconfiggete gli [armies_with_icon|e] nemici in [battle].\n @arrow_bonus_tier_1! [blockade_with_icon|e] dei [ports_with_icon|e] nemici.\n@arrow_bonus_tier_3! Tenete d'occhio la nostra [war_exhaustion_with_icon|e], poiché può davvero ostacolare sia la nostra economia che la nostra capacità di condurre la guerra." 
 hint_war_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Durante la [war], entrambe le parti possono [occupy_with_icon|e] [locations_with_icon|e] nemiche, ma il territorio non cambia realmente di mano finché un [peace_treaty_with_icon|e] non ratifica la conquista.\n@hint! Più a lungo si trascina una guerra, più le parti coinvolte saranno disposte ad accettare un'offerta di pace." 
 
 hint_war_diplomatic: "\"La guerra può essere un'impresa molto redditizia, ma anche una rapida via per il disastro.\""
 hint_war_administrative: "\"Quando il commercio non può garantire la fornitura di risorse vitali, la guerra diventa inevitabile.\""
 hint_war_military: "\"L'unico modo per garantire la nostra sicurezza è superare i nostri vicini.\""
 
 
 ### Construction missing input
 hint_battle: "Battaglie"
 hint_battle_hint_text: "$hint_battle_hint_text_1$\n\n$hint_battle_hint_text_2$\n\n$hint_battle_hint_text_3$"
 hint_battle_hint_text_1: "Quando un [army_with_icon|e] si trova nella stessa [location_with_icon|e] di un [army] nemico, inizierà una [battle_with_icon|e]. Qualunque [army] sia arrivato per primo nella [location] sarà il [defender_with_icon|e] e come tale beneficerà dei modificatori del terreno. La battaglia termina quando una parte perde tutto il suo [morale_with_icon|e] o tutti i suoi [regiments_with_icon|e], a seconda di quale evento si verifichi per primo." 
 hint_battle_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Potete portare gli eserciti vicini a rinforzare le battaglie in corso. Se arrivano in tempo, si uniranno alla lotta come riserve fresche.\n@arrow_bonus_tier_2! Assicuratevi che i nostri [armies_with_icon|e] abbiano un buon [commander_with_icon|e] prima di impegnarli in [battle].\n@arrow_bonus_tier_2! Prestate sempre attenzione al terreno della [location]. L'[attacker_with_icon|e] subirà penalità ai suoi tiri di dado a seconda della topografia e della vegetazione della località. Scegliete attentamente i vostri campi di battaglia!\n@arrow_bonus_tier_1! A volte è saggio ordinare una [retreat_with_icon|e] tempestiva prima che le nostre truppe vengano annientate da una forza nemica schiacciante." 
 hint_battle_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Perdere una battaglia non significa necessariamente la fine della [war_with_icon|e]. Dopo una sconfitta, potete battere in [retreat] in sicurezza, recuperare morale, magari assoldare mercenari e riprovare in condizioni più favorevoli (e così può fare il vostro nemico! Non siate troppo precipitosi nel celebrare la vittoria)\n@hint! Se la [location] ha un [fort_with_icon|e], il controllore del forte sarà sempre il [defender] in quella località, indipendentemente da chi arriva per primo." 
 
 hint_battle_diplomatic: "\"Lasciate che i nostri nemici periscano per logoramento e carestia prima di ingaggiarli.\""
 hint_battle_administrative: "\"Una rapida vittoria sul campo di battaglia Ci permetterebbe di passare all'offensiva senza esporre le nostre città alla devastazione nemica.\""
 hint_battle_military: "\"Un buon generale può determinare l'esito di una battaglia.\""


 ### Construction missing input
 hint_siege_and_occupation: "Occupazione e Assedi"
 hint_siege_and_occupation_hint_text: "$hint_siege_and_occupation_hint_text_1$\n\n$hint_siege_and_occupation_hint_text_2$\n\n$hint_siege_and_occupation_hint_text_3$"
 hint_siege_and_occupation_hint_text_1: "Quando un [army_with_icon|e] mette piede in una [enemy_with_icon|e] [location_with_icon|e], cercherà di [occupy_with_icon|e]. Se la [location] non ha un [fort_with_icon|e], sarà occupata in pochi giorni. Tuttavia, in presenza di un forte, inizierà un [siege_with_icon|e].\n\nGli assedi possono durare mesi, o anche anni, a seconda di molti fattori, come il livello delle fortificazioni, la presenza di artiglieria, l'[ability_with_icon|e] del [general_with_icon|e] assediante e altro ancora.\n\nQuando la guarnigione si arrende, la [location] diventerà [occupied] e il [fort] rimarrà sotto il controllo del vincitore.\n\nLe località occupate sono mostrate sulla mappa con barre incrociate e non sono di proprietà dell'occupante finché la conquista non viene ratificata in un trattato di pace." 
 hint_siege_and_occupation_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicuratevi che un [army_with_icon|e] possa sopravvivere a un assedio prima di iniziarlo.\n@arrow_bonus_tier_1! Non abbiate paura di ritirarvi da un assedio se si sta avvicinando un pericoloso esercito nemico." 
 hint_siege_and_occupation_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Tenete d'occhio i vostri eserciti durante un assedio, anche se al momento non ci sono eserciti nemici in giro."
 
 hint_siege_and_occupation_diplomatic: "\"Un assedio prolungato può rivelarsi fatale per la popolazione e la prosperità locali.\""
 hint_siege_and_occupation_administrative: "\"Dovremmo disporre i nostri forti in modo tale che le nostre città principali siano difese dagli invasori e possano essere rapidamente liberate in caso di assedio nemico.\""
 hint_siege_and_occupation_military: "\"Assediare e difendere posizioni chiave, come i colli montani, può essere decisivo per vincere una guerra.\""
 
 
 ### Construction missing input
 hint_lacks_of_rivals: "Possibili Rivali"
 hint_lacks_of_rivals_hint_text: "$hint_lacks_of_rivals_hint_text_1$\n\n$hint_lacks_of_rivals_hint_text_2$\n\n$hint_lacks_of_rivals_hint_text_3$"
 hint_lacks_of_rivals_hint_text_1: "I [rivals_with_icon|e] sono [countries_with_icon|e] che dichiariamo pubblicamente ostili ai nostri interessi. Lo scopo dei Rivali è duplice: come strumento diplomatico, dichiarare rivali ci aiuta a fare amicizia con i loro nemici. Come strumento offensivo, possiamo fabbricare [casus_belli_with_icon|e] contro i nostri [rivals] e intervenire in [war_with_icon|e] contro di loro." 
 hint_lacks_of_rivals_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Osservate le Rivalità e le [alliances_with_icon|e] dei nostri vicini e scegliete gli stessi rivali del Paese con cui volete allearvi. Ma fate attenzione a non creare nemici troppo potenti nel processo.\n@arrow_bonus_tier_2! Potete aspettare che altri [countries] abbiano dichiarato i loro [rivals] prima di fare la vostra mossa. In questo modo eviterete di far arrabbiare i [countries] sbagliati.\n@arrow_bonus_tier_2! Costruite una [spy_network_with_icon|e] nei nostri [rivals] per fabbricare un [casus_belli_with_icon|e] contro di loro." 
 hint_lacks_of_rivals_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Non è necessario dichiarare tutti i nostri rivali disponibili. Ricordate che potete fare clic destro sull'#W Alert#! per ignorarlo.\n@hint! Avere Rivali vi permetterà anche di essere chiamato nelle loro guerre dalla parte opposta. Ma siate cauti: i nostri [rival_enemies_with_icon|e] potranno intervenire anche nelle nostre." 
 
 hint_lacks_of_rivals_diplomatic: "\"Creare nemici non necessari non è mai consigliabile, ma dichiarare gli stessi Rivali dei nostri vicini potrebbe aiutarci ad assicurarci un'alleanza con loro.\""
 hint_lacks_of_rivals_administrative: "\"I nemici dei nostri rivali dovrebbero essere i nostri amici.\""
 hint_lacks_of_rivals_military: "\"Avere i Rivali appropriati offre abbondanti opportunità per coloro che sono abbastanza audaci da coglierle.\""
 
 
 ### Construction missing input
 hint_control: "Prossimità e Controllo"
 hint_control_hint_text: "$hint_control_hint_text_1$\n\n$hint_control_hint_text_2$\n\n$hint_control_hint_text_3$"
 hint_control_hint_text_1: "Il [control_with_icon|e] è uno degli attributi più importanti delle nostre [locations_with_icon|e]. Rappresenta la portata del governo centrale e determina la parte della [wealth_with_icon|e] in una [location] che può essere influenzata dalle tue [taxes_with_icon|e]. Qualsiasi [wealth] fuori dalla portata del tuo [control] finisce direttamente nelle tasche dei tuoi [estates_with_icon|e], del tutto libera da [taxes]. Il [control] determina anche quante [levies_with_icon|e] puoi radunare dalla [location].\n\nIl Controllo di una Località cambia mensilmente verso il [max_control_with_icon|e]. Un [siege_with_icon|e] o altri eventi possono ridurlo temporaneamente, ma la Località tornerà infine al suo valore massimo.\n\nLa principale fonte di [max_control] e [proximity_icon] [proximity|e]. La nostra [capital_icon] [capital|e] avrà sempre #W 100%#! di Prossimità, e tutte le altre Località calcolano la loro prossimità in base alla distanza dalla Capitale. La Prossimità può propagarsi per terra e per mare, e lo fa in modo più efficiente lungo [road_icon] [roads_with_icon|e], terreno aperto e [seazones_icon] [seazones|e] con alta [maritime_presence_icon] [maritime_presence|e]; e meno efficientemente attraverso montagne, foreste e [seazones] infestate da [pirates_with_icon|e]. Ci sono altri fattori che influenzano il Controllo Massimo, come la [pop_satisfaction_with_icon|e], l'[integration_status_with_icon|e] o alcuni [buildings] speciali.\n\nOltre alla tua [capital], puoi anche irradiare [proximity] da un [building|e] [ShowBuildingTypeName('local_governor')]." 
 hint_control_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Concentra gli sforzi edilizi nella nostra [capital] e nelle [locations] circostanti, poiché godranno naturalmente del [control] più alto fin dall'inizio della partita.\n@arrow_bonus_tier_2! Costruisci [road_icon] [roads|e] dal #W Pannello Località#! per collegare la nostra [capital] alle nostre città più ricche.\n@arrow_bonus_tier_2! Valuta la costruzione di un [ShowBuildingTypeName('local_governor')] in aree con alta [wealth] e basso [control]. Devono essere costruiti in una [ShowLocationRankName('city')] collegata alla tua [capital] da una [road], e agiranno come [capital] secondaria. Sono piuttosto costosi da mantenere, quindi assicurati che i benefici giustifichino l'investimento!\n@arrow_bonus_tier_2! Le Località con un [port_icon] [port|e] potrebbero raggiungere la [capital] più facilmente via mare, soprattutto se hanno alta [harbor_capacity_with_icon|e]. Puoi aumentarla nelle nostre [locations] costiere chiave con [buildings] come un [ShowBuildingTypeName('wharf')] o un [ShowBuildingTypeName('dock')].\n@arrow_bonus_tier_1! Le [locations] appena [conquered_with_icon|e] partiranno da #W 0%#! di [control], e potrebbero impiegare molto tempo per raggiungere il Massimo. Puoi accelerare il processo piazzando un [army_with_icon|e] nella [location], oppure usando una [cabinet_action_icon] [cabinet_action|e] [ShowCabinetActionName('increase_control_province')]." 
 hint_control_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il Controllo Medio del tuo [country] ha un effetto molto importante sul tuo [crown_power_with_icon|e]. Un grande [country] con basso [control] avrà difficoltà a gestire efficacemente i propri [estates] e le proprie risorse, mentre uno Stato piccolo ma centralizzato può colpire al di sopra del proprio peso. Ricorda sempre che un'espansione sconsiderata può portare rovina a un [country]! Scopri di più sul [crown_power] nel [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n@hint! Tieni presente che una [location] con #W 0%#! di [control] non genererà [taxes], ma gli [estates] ne raccoglieranno comunque i benefici. [estates] ricchi e soddisfatti possono aiutare a costruire la nostra economia da soli.\n@hint! Pianifica con cura la nostra rete di [road]: una singola [road] ben piazzata attraverso una catena montuosa può migliorare la [proximity] di molte [locations] dall'altra parte.\n@hint! Alcune [government_reforms_with_icon|e], come [ShowGovernmentReformName('harbor_administration')], permettono di costruire un [ShowBuildingTypeName('naval_governor')] oltremare. I governatori agiscono come [capitals] secondarie e aiutano a irradiare [proximity] su terre lontane. I Governatori Navali possono essere costruiti solo in una [ShowLocationRankName('city')] costiera non collegata via terra alla tua [capital]\n@hint! Per saperne di più sulla [proximity] da [maritime_presence_with_icon|e], puoi consultare il suggerimento [Link('hints', 'selected_hint = hint_maritime', 'Maritime Presence')]#!" 
 
 hint_control_diplomatic: "\"Un Controllo elevato aiuta a convertire e assimilare i membri più... #italic disordinati#! della nostra società.\""
 hint_control_administrative: "\"Una Località al di fuori del nostro controllo difficilmente fornirà tasse.\""
 hint_control_military: "\"Dobbiamo controllare la nostra terra se vogliamo imporre la leva sulla nostra popolazione.\""


 ### Crown Power
 hint_crown_power: "Potere della Corona"
 hint_crown_power_hint_text: "$hint_crown_power_hint_text_1$\n\n$hint_crown_power_hint_text_2$\n\n$hint_crown_power_hint_text_3$"
 hint_crown_power_hint_text_1: "Il [crown_power_with_icon|e] rappresenta l'influenza del nostro Governo all'interno dei nostri confini. Come [ShowEstateTypeName('crown_estate')], condividiamo le risorse del nostro Paese con i nostri [estates_with_icon|e], i cui interessi potrebbero non sempre coincidere con i nostri.\n\nUn Potere della Corona più elevato renderà più facile l'emanazione di nuove [laws_with_icon|e], migliorerà l'efficienza del nostro [cabinet_with_icon|e] e aumenterà il nostro supporto di base nel [parliament_with_icon|e]. Forse ancora più importante, il Potere della Corona determina in che misura lo Stato condivide i profitti e i costi di [trade_with_icon|e] e [food_with_icon|e] con i [estates].\n\nIl nostro Potere della Corona dipenderà principalmente dalla quantità di [privileges_with_icon|e] concessi ai [estates] e dal [control_with_icon|e] delle nostre [locations_with_icon|e] più popolate."
 hint_crown_power_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Aumentate il Controllo nelle nostre [locations] costruendo [roads_with_icon|e] dalla [capital_with_icon|e]. \n@arrow_bonus_tier_2! Revocate i [privileges] dai nostri [estates] più potenti quando abbiamo [stability_with_icon|e] elevata, ma tenete d'occhio la loro [estate_satisfaction|e]. Un [estate] arrabbiato potrebbe annunciare problemi all'orizzonte.\n@arrow_bonus_tier_1! Aumentate la [Localize(Player.GetGovernment.GetGovernmentType.GetPowerConcept)] con l'[cabinet_action_with_icon|e] [ShowCabinetActionName('strengthen_government')].\n@arrow_bonus_tier_1! Costruite una [ShowBuildingTypeName('royal_court')] o una [ShowBuildingTypeName('sergeantry')] nella [capital]."
 hint_crown_power_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Al 50% di Potere della Corona, metà delle spese e dei profitti per [trade] e [food] andranno direttamente nel [treasury_with_icon|e], mentre l'altra metà sarà distribuita tra i [estates], in base al loro rispettivo [estate_power_with_icon|e].\n@hint! Il Potere della Corona è solitamente molto basso all'inizio del gioco, specialmente per i [countries] più grandi.\n@hint! I futuri [advances_with_icon|e] sbloccheranno [buildings] aggiuntivi e altri bonus al vostro [crown_power]."
 
 hint_crown_power_diplomatic: "\"Finché il nostro Potere della Corona è basso, restiamo in balia dei nostri Ceti.\""
 hint_crown_power_administrative: "\"Aumentare il nostro Potere della Corona ci aiuterebbe a raccogliere i benefici del Commercio.\""
 hint_crown_power_military: "\"Uno Stato centralizzato può colpire ben al di sopra del suo peso.\""
 
 
 ### Estates
 hint_estates: "Ceti"
 hint_estates_hint_text: "$hint_estates_hint_text_1$\n\n$hint_estates_hint_text_2$\n\n$hint_estates_hint_text_3$"
 hint_estates_hint_text_1: "I Ceti sono una rappresentazione di interessi particolari all'interno dei nostri confini. Ogni Ceto ha una percentuale di [estate_power_with_icon|e] che misura il suo potere rispetto agli altri Ceti e alla [ShowEstateTypeName('crown_estate')] in una distribuzione a somma zero.\n\nIl potere dei Ceti deriva principalmente dalla [population_with_icon|e], con ogni [pop_type_with_icon|e] che supporta uno specifico [estate]. Il Potere del Ceto è ulteriormente modificato dalle [laws_with_icon|e] e dai [privileges_with_icon|e] esistenti.\n\nIl Potere del Ceto determina la loro forza nel [parliament_with_icon|e], influenza il valore delle [tax_with_icon|e] e detta come vengono distribuiti i profitti e i costi da [trade_with_icon|e] e [food_with_icon|e].\n\nI Ceti hanno anche un livello di [estate_satisfaction_with_icon|e] che misura la loro conformità con il nostro Governo. Ogni Ceto fornisce un diverso modificatore positivo quando la loro soddisfazione è alta e una penalità quando è inferiore a #W 50%#!. Quando la [estate_satisfaction] è troppo bassa, la loro componente [pops_with_icon|e] potrebbe iniziare ad alimentare [rebellions_with_icon|e]. Cosa più preoccupante, un Ceto con una Soddisfazione inferiore a #W 25%#! smetterà di fornire [levies_with_icon|e]." 
 hint_estates_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Le [taxes_with_icon|e] riscosse dai [estates] sono la principale fonte di [income_with_icon|e] per la maggior parte dei [countries]. Potete impostare o automatizzare le tasse dal @economy_panel! #W Pannello Bilancio#!.\n@arrow_bonus_tier_2! Qualsiasi potere detenuto dai Ceti avviene a spese del nostro [crown_power_with_icon|e]. Potete erodere il loro potere revocando i loro [privileges_with_icon|e] dalla @government_panel! #W Scheda Ceti#!.\n@arrow_bonus_tier_1! Potete placare un Ceto ribelle abbassando le [taxes], concedendo un [privilege] o corrompendoli dalla @government_panel! #W Scheda Ceti#!." 
 hint_estates_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I Ceti raccolgono tutta la [tax_base_with_icon|e] dalle nostre [locations_with_icon|e] e noi ne otteniamo da loro soltanto una parte delle [tax].\n@hint! I [countries] nel gioco iniziale fanno molto affidamento sulle [levies_with_icon|e] fornite dai [estates] per condurre le loro [wars_with_icon|e], finché non iniziano a essere sostituite da [regular_regiments_with_icon|e] più moderni." 
 
 hint_estates_diplomatic: "\"Un Clero forte migliora la stabilità del regno.\""
 hint_estates_administrative: "\"Un forte Ceto Borghese aggiunge ricchezza alla nostra nazione e volume al nostro commercio.\""
 hint_estates_military: "\"Una forte Nobiltà aumenta la dimensione e la potenza dei nostri eserciti.\""
 
 
 ### Markets
 hint_markets: "Mercati"
 hint_markets_hint_text: "$hint_markets_hint_text_1$\n\n$hint_markets_hint_text_2$\n\n$hint_markets_hint_text_3$"
 hint_markets_hint_text_1: "I [markets_with_icon|e] sono il cuore dell'economia in #italic Europa Universalis V#!. Tutte le Località appartengono a un Mercato dove vendono e acquistano i beni necessari per i [pop_needs_with_icon|e], [buildings_with_icon|e] e [constructions_with_icon|e]. Vendendo beni al loro Mercato, le Località generano [tax_base_with_icon|e] per i [estates_with_icon|e], che a loro volta possono essere raccolti dal Governo sotto forma di [taxes_with_icon|e]." 
 hint_markets_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @economy_panel![Link('trade', 'subtab = markets', 'Markets Panel')] per vedere i nostri Mercati rilevanti. I Mercati con una colorazione #G Verde#! contengono i nostri [owned_with_icon|e], mentre i Mercati con intestazioni Blu sono Mercati in cui abbiamo [merchant_capacity_with_icon|e], ma non [own] alcuna [location].\n@arrow_bonus_tier_3! vi consigliamo di automatizzare ogni singolo [market] cliccando sull'Icona Ingranaggio #W Cog Icon#! @automation!. Ciò manterrà tutta la nostra [merchant_capacity_with_icon|e] utilizzata sui [merchants_with_icon|e] più interessanti in ogni momento.\n@arrow_bonus_tier_2! Costruite [buildings_with_icon|e] come [ShowBuildingTypeName('marketplace')] e [ShowBuildingTypeName('trade_office')] per aumentare la nostra [merchant_capacity_with_icon|e] in un Mercato." 
 hint_markets_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I confini dei Mercati sono dinamici: le [locations] rientreranno nel [market] con la [market_attraction_with_icon|e] più alta nel loro territorio, anche se si tratta di un Mercato straniero. La [market_attraction] dei Mercati stranieri può essere annullata dal [protectionism_with_icon|e]."
 
 hint_markets_diplomatic: "\"La Mano Invisibile è un saggio maestro, ma a volte richiede un po' di guida.\""
 hint_markets_administrative: "\"È l'economia, stolto!\""
 hint_markets_military: "\"Far crescere i nostri Mercati è una cosa buona.\nConquistare i Mercati vicini è anche meglio.\""


 ### Food
 hint_food: "Cibo"
 hint_food_hint_text: "$hint_food_hint_text_1$\n\n$hint_food_hint_text_2$\n\n$hint_food_hint_text_3$"
 hint_food_hint_text_1: "I [pops_with_icon|e] hanno bisogno di [food_with_icon|e] per vivere e gli [armies_with_icon|e] hanno bisogno di [food] per marciare. Entrambi ottengono il [food] di cui hanno bisogno dalla Scorta della [province_with_icon|e] in cui si trovano (e non dalla [location]!). Se non c'è abbastanza [food], i [pops] soffriranno l'[starvation_with_icon|e] e gli [armies] soffriranno l'[attrition_with_icon|e].\n\nCi sono 3 livelli coinvolti nella produzione e distribuzione di $game_concept_food$:\n\n@location! [local_food_with_icon|e]:\nIl $game_concept_food$ è prodotto principalmente in quelle [locations_with_icon|e] con [food_raw_materials_with_icon|e] come loro [rgo_with_icon|e], come il [ShowGoodsName('livestock')]. Qualsiasi eccedenza o deficit che la [location] possa avere viene aggiunta al $game_concept_provincial_food$.\n\n@province! [provincial_food|e]:\nIl $game_concept_provincial_food$ è lo strato più importante. Se una [province_with_icon|e] non produce abbastanza $game_concept_food$ per sostenere il consumo di tutte le sue $game_concept_locations$, la scorta provinciale diminuirà. Quando si esaurisce, tutte le $game_concept_locations$ all'interno di una $game_concept_province$ soffriranno l'[starvation_with_icon|e]. Ma prima che ciò accada, la $game_concept_province$ cercherà di [buy_food_with_icon|e] dal suo $game_concept_market$.\n\n@market! [market_food|e]:\nTutte le $game_concept_provinces$ in un [market_with_icon|e] procederanno alla [sell_food_with_icon|e] quando la loro scorta è piena e cercheranno l'[buy_food] quando è bassa. Finché c'è abbastanza $game_concept_food$ all'interno di un $game_concept_market$, nessuno morirà di fame." 
 hint_food_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @economy_panel![Link('trade', 'subtab = markets', 'Markets Panel')] per vedere i nostri Mercati rilevanti. I Mercati con un'intestazione #G Verde#! contengono le nostre [owned_with_icon|e] [locations], quindi dobbiamo assicurarci che il loro bilancio [food] rimanga positivo. Se il [food] sta diminuendo rapidamente in uno qualsiasi dei nostri Mercati, vedrete un Banner Giallo. Se ci sono [locations] che stanno morendo di fame, vedrete un Banner Rosso.\n@arrow_bonus_tier_3! Per aumentare la produzione di cibo in uno qualsiasi dei nostri Mercati, cliccate sul pulsante Cibo per andare al @production_panel![Link('food_production', '', 'lateralview_food_production_entry_name')]. Da lì potete vedere quale delle nostre [provinces] è in pericolo di [starvation] ed espandere la loro [rgo].\n@arrow_bonus_tier_3! Espandete [rgo_with_icon|e] nelle Località con le migliori [food_raw_materials], come [ShowGoodsName('rice')] o [ShowGoodsName('wheat')] e un'elevata [food_productivity_with_icon|e].\n@arrow_bonus_tier_1! Possiamo anche usare [merchant_capacity_with_icon|e] per importare [food_raw_materials_with_icon|e] da altri [markets], il che sposterà anche una quantità equivalente di [food]. Potete farlo dal @economy_panel![Link('trade', 'subtab = trades', 'lateralview_trade_entry_name')]." 
 hint_food_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! La produzione di cibo diminuisce durante l'[winter_with_icon|e]. Non fatevi prendere dal panico se vedete tutti i nostri Mercati andare in negativo per alcuni mesi.\n@hint! Le [provinces|U] in deficit compreranno l'eccedenza delle vostre Province più produttive, purché appartengano allo stesso Mercato, quindi di solito è meglio espandere i beni alimentari nelle [locations] con la [food_productivity] più alta.\n@hint! Le [town_or_city_with_icon|e] sono di solito meno efficienti delle [rural_locations_with_icon|e] nella produzione di [food]." 
 
 hint_food_diplomatic: "\"Una fame prolungata può significare la distruzione della nostra popolazione e la rovina della nostra nazione.\""
 hint_food_administrative: "\"La fame è principalmente una questione di prospettiva. Non è poi così male se siete Voi a vendere il cibo.\""
 hint_food_military: "\"Un esercito marcia sul suo stomaco.\""
 
 ### Maritime Presence
 hint_maritime: "Presenza Marittima"
 hint_maritime_hint_text: "$hint_maritime_hint_text_1$\n\n$hint_maritime_hint_text_2$\n\n$hint_maritime_hint_text_3$"
 hint_maritime_hint_text_1: "La [maritime_presence_with_icon|e] è una metrica molto importante per le [seazones_with_icon|e] costiere. Ha la capacità di aiutare a esercitare [proximity_with_icon|e] lungo le nostre coste o isole.\n\nInoltre, fornisce [merchant_power_with_icon|e] al [market_with_icon|e] a cui appartengolo le [seazones].\n\nLa [maritime_presence] è ottenuta passivamente tramite [buildings] e tramite la presenza della [navy_with_icon|e], ha un effetto di decadimento ma può anche essere persa a causa di [privateers_with_icon|e] o in caso di [blockade_with_icon|e]."
 hint_maritime_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Crea [navies] specializzate con navi che hanno alto guadagno di [maritime_presence]. Puoi poi metterle in una delle tue [seazones] costiere e diffonderanno la loro [maritime_presence] in modo uguale a tutte le [seazones] che appartengono alla stessa [province_with_icon|e].\n@arrow_bonus_tier_3! In alternativa, puoi assegnarle all'[military_objective_with_icon|e] #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#!, che farà la stessa cosa ma attracchera automaticamente le navi per ripararle se necessario.\n@arrow_bonus_tier_2! Spingi il [societal_value|e] [ShowSocietyDirectionName('naval')].\n@arrow_bonus_tier_1! [ShowBuildingTypeName('coastal_fort')] e un edificio molto valido da usare!" 
 hint_maritime_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! La [maritime_presence] si diffonde solo alla [province] in cui si trova, anche se l'obiettivo è impostato su più di una [province]. #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! sposterà la [navy] quando la località di [seazone] avrà raggiunto #W 100%#! di [maritime_presence].\n@hint! I [privateers] rubano ricchezza ad altri [countries] abbassando al tempo stesso la loro [maritime_presence]. A differenza della [maritime_presence], i [privateers] operano a livello di [area_with_icon|e], il che significa che tutte le [provinces] entro un'[area] subiranno gli effetti dei [privateers].\n@hint! Alcune [government_reforms_with_icon|e], come [ShowGovernmentReformName('harbor_administration')], permettono di costruire un [ShowBuildingTypeName('naval_governor')] oltremare. I governatori agiscono come [capitals] secondarie e aiutano a irradiare [proximity] su terre lontane. I Governatori Navali possono essere costruiti solo in una [ShowLocationRankName('city')] costiera non collegata via terra alla tua [capital]." 
 
 hint_maritime_diplomatic: "\"Dobbiamo approfittare della nostra costa per migliorare i nostri commerci.\""
 hint_maritime_administrative: "\"Più sicura è la navigazione marittima, migliore è la comunicazione con la nostra popolazione.\""
 hint_maritime_military: "\"Con una forte presenza navale, i pirati non oseranno toccare le nostre rotte commerciali.\""
 
 hint_slaves: "Schiavi"
 hint_slaves_hint_text: "$hint_slaves_hint_text_1$\n\n$hint_slaves_hint_text_2$\n\n$hint_slaves_hint_text_3$"
 hint_slaves_hint_text_1: "@slaves_goods! [ShowGoodsName('slaves_goods')] sono un tipo molto speciale di [good_with_icon|e]. Come ogni altro [good], vengono comprati e venduti nei [markets_with_icon|e], e il loro prezzo dipende da [supply_with_icon|e] e [demand_with_icon|e]. A differenza di qualsiasi altro [good], rappresentano veri [pops_with_icon|e], che vengono spostati quando il [good] viene commerciato.\n\nCome [pop_type_with_icon|e], @slaves! [ShowPopTypeName('slaves')] possono essere usati come forza lavoro negli [rgo_with_icon|e] e negli [buildings_with_icon|e] schiavili, come [ShowBuildingTypeName('sugar_plantation')].\n\n[buildings] come [ShowBuildingTypeName('slave_market')] possono trasformare @slaves! [ShowPopTypeName('slaves')] esistenti in [goods] @slaves_goods! [ShowGoodsName('slaves_goods')], che vengono poi venduti nel [market]. Il [good] viene quindi commerciato come ogni altro [good], e gli [buildings] possono richiederlo come input. Quando ciò avviene, @slaves! [ShowPopTypeName('slaves')] saranno spostati nella [location] per lavorare nel [building].\n\n@trigger_no! [ShowPopTypeName('slaves')] vengono spostati in una [location] solo se questa non ha ancora raggiunto il suo limite massimo di [pop_with_icon|e] #T schiavi#!. Costruisci prima il [building] che richiede schiavi, altrimenti gli [ShowGoodsName('slaves_goods')] importati non si convertiranno in [pops]." 
 hint_slaves_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! [ShowBuildingTypeName('slave_center')] è un [building_with_icon|e] straniero costruito nell'Africa occidentale o centrale. Consuma @firearms! [ShowGoodsName('firearms')], @paper! [ShowGoodsName('paper')], @stone! [ShowGoodsName('stone')] e @tools! [ShowGoodsName('tools')] per produrre @slaves_goods! [ShowGoodsName('slaves_goods')]. Esporta quei [goods] verso il tuo [market] africano per mantenere attivo [ShowBuildingTypeName('slave_center')].\n@arrow_bonus_tier_3! Quando stabilisci [colonies_with_icon|e] nel [continent_with_icon|e] delle Americhe, costruisci prima [rgo_with_icon|e] che richiedono schiavi come [ShowBuildingTypeName('sugar_plantation')]: generano [demand_with_icon|e] per @slaves_goods! [ShowGoodsName('slaves_goods')]. Poi crea una rotta di [trade_with_icon|e] dal tuo [market] africano al tuo [market] coloniale per rifornirli.\n@arrow_bonus_tier_2! Questo e il classico [trade_with_icon|e] Triangolare: esporta [ShowGoodsName('firearms')] e [ShowGoodsName('paper')] in Africa, importa [ShowGoodsName('slaves_goods')] dall'Africa alle tue colonie e riscuoti [income_with_icon|e] dalla [production_with_icon|e] delle piantagioni in cambio." 
 hint_slaves_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [pops_with_icon|e] sono solitamente ridotti in schiavitù da [buildings] come il [ShowBuildingTypeName('slave_market')], anche se alcuni [countries] hanno meccaniche speciali che consentono la riduzione in schiavitù dei [pops] durante la [war_with_icon|e].\n@hint! [ShowReligionGroupName('christian')] consente Schiavi solo negli [buildings] Piantagione, che sono sbloccati nell'#V Età della Scoperta#! e possono essere costruiti solo oltreoceano." 
 
 hint_slaves_diplomatic: "\"Tutti gli uomini sono creati uguali, eccetto alcuni.\""
 hint_slaves_administrative: "\"Nulla di notevole è mai stato raggiunto senza il sacrificio di molti.\""
 hint_slaves_military: "\"Se la manodopera libera scarseggia, i pagani possono provvedere.\""

#### ECO tutorial
hint_eco: "Consigli Economici Avanzati"
hint_eco_hint_text: "$hint_eco_hint_text_1$\n\n$hint_eco_hint_text_2$\n\n$hint_eco_hint_text_3$"
hint_eco_hint_text_1: "Anche se potete automatizzare molti aspetti della vostra economia, ci sono ancora alcune azioni che dovete eseguire direttamente per far progredire il vostro [country]."
hint_eco_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il miglior consiglio è sempre quello di cercare di ridurre le vostre [expenses_with_icon|e].\n\n@arrow_bonus_tier_3! Come giocatore, dovreste concentrarvi sulla pianificazione delle [towns_and_cities_with_icon|e] e delle [roads_with_icon|e]\n     Poiché le [towns_and_cities_with_icon|e] riducono la quantità di [rgo_with_icon|e] che potete costruire, dovreste urbanizzare le vostre [rural_locations] meno preziose. Queste di solito sono:\n@sand![ShowGoodsName('sand')] @clay![ShowGoodsName('clay')] @horses![ShowGoodsName('horses')] @medicaments![ShowGoodsName('medicaments')] @wine![ShowGoodsName('wine')] @olives![ShowGoodsName('olives')] @millet![ShowGoodsName('millet')] @legumes![ShowGoodsName('legumes')] @fruit![ShowGoodsName('fruit')] @wild_game![ShowGoodsName('wild_game')] @beeswax![ShowGoodsName('beeswax')] \n\n@arrow_bonus_tier_3! Rilasciate [subjects_with_icon|e] su terre con basso [control_with_icon|e], poiché propagheranno il loro $game_concept_control$.\n     [annex_with_icon|e] i vostri sudditi una volta che avrete costruito la vostra infrastruttura nell'area.\n     La velocità di [annexation_with_icon|e] è scalata in base alle dimensioni relative del $game_concept_country$ e all'[cultural_influence_with_icon|e].\n\n@arrow_bonus_tier_2! Le [rgo_with_icon|e] preziose sono un ottimo investimento, specialmente se aumentate anche la vostra [merchant_capacity_with_icon|e] per [export_with_icon|e].\n@goods_gold![ShowGoodsName('goods_gold')] @silver![ShowGoodsName('silver')] @gems![ShowGoodsName('gems')] @pearls![ShowGoodsName('pearls')] @amber![ShowGoodsName('amber')] @ivory![ShowGoodsName('ivory')] @pepper![ShowGoodsName('pepper')] @saffron![ShowGoodsName('saffron')] @chili![ShowGoodsName('chili')]\n\n@arrow_bonus_tier_2! Le [trade_income_with_icon|e] si adattano al [Link('hints', 'selected_hint = hint_crown_power', '@hint! Crown Power')] ed è sempre bene aumentarlo insieme all' [Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Trade Capacity')], che a differenza della [tax_base] non si riduce con il [control]\n\n@arrow_bonus_tier_1! Mantenete bassi i $game_concept_goods$ dei $game_concept_prices$ industriali! Aumenteranno la redditività delle $game_concept_towns_or_cities$ e renderanno gli [buildings_with_icon|e] più economici da mantenere.\n@lumber![ShowGoodsName('lumber')] @masonry![ShowGoodsName('masonry')] @glass![ShowGoodsName('glass')] @iron![ShowGoodsName('iron')] @mercury![ShowGoodsName('mercury')] @steel![ShowGoodsName('steel')]\n\n@arrow_bonus_tier_1! Gli $game_concept_buildings$ che non hanno [production_method_with_icon|e] avranno un costo di [maintenance_with_icon|e]. Fluttuerà in base al $game_concept_price$ dei $game_concept_goods$ in ingresso. Ricordate che la [demand_with_icon|e] da parte dei [buildings] stimolerà anche la crescita della vostra economia!" 
hint_eco_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n[Link('hints', 'selected_hint = hint_inflation', '@hint! $hint_inflation$')]\n[Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! $hint_increasing_trade_capacity$')]\n[Link('hints', 'selected_hint = hint_control', '@hint! $hint_control$')]"
hint_eco_diplomatic: "\"A volte le monete offrono la leva migliore.\""
hint_eco_administrative: "\"L'oro è il sangue delle nazioni.\""
hint_eco_military: "\"Il reddito preso dagli altri è il miglior tipo di reddito.\""

#### POL tutorial
hint_pol: "Consigli Politici Avanzati"
hint_pol_hint_text: "$hint_pol_hint_text_1$\n\n$hint_pol_hint_text_2$\n\n$hint_pol_hint_text_3$"
hint_pol_hint_text_1: "Tutti i [countries_with_icon|e] iniziano con alcuni svantaggi. Assicuratevi di controllare il [Link('government', 'tabcontent = estates', '@government_panel! $lateralview_government_entry_name$')] per [privileges_with_icon|e] e [laws_with_icon|e]. Questi macro-cambiamenti possono essere estremamente utili nel lungo termine.\n\nNon abbiate paura di cambiare le cose!"
hint_pol_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicuratevi che l'[estate_satisfaction_equilibrium_with_icon|e] sia a una percentuale tale da garantire che l'[tax_with_icon|e] della [ShowEstateTypeName('burghers_estate')] e [ShowEstateTypeName('peasants_estate')] non scenda sotto il #W 50%#!.\n\n@arrow_bonus_tier_3! Controllate il [Link('societal_values', '', '@government_panel! Government Panel > Values')] per scoprire quali [societal_values_with_icon|e] vale la pena perseguire. In generale, i più vantaggiosi sono:\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('capital_economy')]\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('centralization')]\n\n@arrow_bonus_tier_3! Esaminate le [laws_with_icon|e] per verificare cosa dovrebbe essere cambiato.\n     Il [parliament_with_icon|e] consentirà facili cambiamenti alle $game_concept_law$ e dovrebbe essere una delle priorità all'inizio del gioco\n     $game_concept_laws$ da tenere d'occhio all'inizio del gioco:\n     $BULLET_WITH_TAB$[ShowLawName('mining_law')]\n     $BULLET_WITH_TAB$[ShowLawName('precious_metal_distribution_law')]\n     $BULLET_WITH_TAB$[ShowLawName('distribution_of_power_law')]\n     $BULLET_WITH_TAB$[ShowLawName('administrative_system')]\n\n@arrow_bonus_tier_3! Esaminate i [privileges_with_icon|e] assegnati e disponibili per ogni [estate_with_icon|e]. Sono uno strumento per modificare la $game_concept_estate_satisfaction_equilibrium$ e la tendenza dei $game_concept_societal_values$.\n    Alla [ShowEstateTypeName('nobles_estate')] dovrebbero essere concessi solo i privilegi sufficienti per essere leali. Sottrarre $game_concept_estate_power$ a loro è vantaggioso nel lungo termine.\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobles_land_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobility_council')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_serfdom_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_sponsored_navy')]\n\n    Al [ShowEstateTypeName('clergy_estate')] dovrebbero essere concessi tutti i $game_concept_privilege$ positivi anche se non possono essere tassati - ogni punto della loro $game_concept_estate_satisfaction$ oltre il #W 50%#! fornisce un bonus ai [research_progress_with_icon|e]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('embellish_great_works_of_faith')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_in_administration')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_religious_state')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clerical_advisory_council')]\n\n    Alla [ShowEstateTypeName('burghers_estate')] dovrebbero essere concessi attivamente quanti più $game_concept_privileges$ positivi possibile. Sono per lo più positivi, nel frattempo aumentare il [estate_power_with_icon|e] della Borghesia abbasserà quello degli altri $game_concept_estates$. Inoltre, ogni punto di $game_concept_estate_satisfaction$ aumenterà l'[production_efficiency_with_icon|e]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_roads_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('market_fairs')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_trade_center_sponsorship')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('commercial_advisory_council')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('control_over_the_coinage')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('guild_investments')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('land_of_commerce')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('urban_development_grants')]\n\n    I $game_concept_privileges$ dei [ShowEstateTypeName('peasants_estate')] dovrebbero fornire abbastanza $game_concept_estate_satisfaction_equilibrium$ per consentire la $game_concept_tax$ massima. È importante tenere a mente la loro tendenza verso la [ShowSocietyDirectionName('decentralization')] in quanto non è l'ideale. Tuttavia, i Contadini avranno un basso $game_concept_estate_power$ durante tutto il gioco, quindi il costo per la revoca sarà basso rispetto agli altri $game_concept_estates$\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_allowed_weapons_privilege')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_hunting')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('no_labor_sunday')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_represented_in_parliament')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_fewer_levies')]\n\n@arrow_bonus_tier_2! Cercate [government_reforms_with_icon|e] che si adattino ai $game_concept_societal_values$ che cercate. Tenete a mente che alcuni bonus, come la [diplomatic_capacity_with_icon|e], potrebbero consentire di abbassare la [diplomatic_maintenance_with_icon|e].\n\n@arrow_bonus_tier_2! Alcune [cabinet_actions_with_icon|e] come [ShowCabinetActionName('stabilize_country')] o [ShowCabinetActionName('strengthen_government')] possono consentire di abbassare le spese, lasciandovi più $game_concept_income$ residuo!" 
hint_pol_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n[Link('hints', 'selected_hint = hint_crown_power', '@hint! $hint_crown_power$')]\n[Link('hints', 'selected_hint = hint_estates', '@hint! $hint_estates$')]"
hint_pol_diplomatic: "\"Un sovrano astuto può trarre il massimo vantaggio da ogni imprevisto.\""
hint_pol_administrative: "\"Politiche prospere significano affari prosperi.\""
hint_pol_military: "\"I nostri Ceti sono spesso peggio dei nostri nemici.\""

#### MIL tutorial
hint_mil: "Consigli Avanzati sull'Espansione"
hint_mil_hint_text: "$hint_mil_hint_text_1$\n\n$hint_mil_hint_text_2$\n\n$hint_mil_hint_text_3$"
hint_mil_hint_text_1: "Due consigli generali: gli [armies_with_icon|e] professionali (compresi i [mercenaries_with_icon|e]) batteranno sempre [levies_with_icon|e] di dimensioni simili e il modo migliore per far crescere il vostro $game_concept_army$ è far crescere l'economia." 
hint_mil_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Ottieni [ShowInstitutionName('professional_armies')] [institution|e] il prima possibile: ottenere rapidamente [ShowAdvanceName('armory_advance')] permetterà di vincere [wars_with_icon|e] prima impossibili.\n\n@arrow_bonus_tier_3! Il [war_score_with_icon|e] dalle [battles_with_icon|e] diminuisce con le [ages_with_icon|e]. All'inizio arriva fino a #W 50%#!, rendendo facile vincere [wars_with_icon|e] solo con $game_concept_battles$!\n\n@arrow_bonus_tier_3! Assicurati di avere accesso a [goods_with_icon|e] strategici. Non servono in grandi quantità, ma sono necessari per costruire il tuo [army_with_icon|e] e la tua [navy_with_icon|e]: @tin! [ShowGoodsName('tin')] @lead! [ShowGoodsName('lead')] @copper! [ShowGoodsName('copper')]\n\n@arrow_bonus_tier_3! Gli $game_concept_armies$ [reinforce_with_icon|e] solo in territorio alleato.\n\n@arrow_bonus_tier_3! [ShowUnitCategoryName('army_heavy_infantry')] è la principale linea di [battle_with_icon|e]. È economica ed efficace nell'assorbire [damage_taken|e], mentre [ShowUnitCategoryName('army_artillery')] causa gravi danni alla prima linea: è importante che la prima linea sopravviva alla [bombard_phase_with_icon|e]\n\n@arrow_bonus_tier_2! Tracciare una chiara linea logistica per i tuoi $game_concept_armies$ in territorio [enemy_with_icon|e] è cruciale. Se la linea viene tagliata, l'intero $game_concept_army$ potrebbe sparire per [attrition|e]. Puoi usare unità [ShowUnitCategoryName('army_auxiliary')] per trasportare [food_with_icon|e] al fronte, o piazzare [supply_depots_with_icon|e] per aiutare la logistica.\n\n@arrow_bonus_tier_1! Gli [buildings|e] di [manpower_with_icon|e] hanno il costo di [maintenance_with_icon|e] più alto nel gioco, quindi è meglio costruirli in [locations_with_icon|e] con alto [control_with_icon|e].\n\n@arrow_bonus_tier_1! Le $game_concept_battles$ durano di solito solo pochi giorni, quindi prima di spingerti lontano assicurati di poter sempre $game_concept_reinforce$ in tempo." 
hint_mil_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n[Link('hints', 'selected_hint = hint_manpower', '@hint! $hint_manpower$')]\n[Link('hints', 'selected_hint = hint_sailors', '@hint! $hint_sailors$')]\n[Link('hints', 'selected_hint = hint_war', '@hint! $hint_war$')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! $hint_battle$')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! $hint_siege_and_occupation$')]"
hint_mil_diplomatic: "\"Fate in modo che altri Paesi vincano le vostre guerre.\""
hint_mil_administrative: "\"Il logoramento potrebbe portare alla decimazione di qualsiasi esercito.\""
hint_mil_military: "\"Non portate un coltello a una sparatoria.\""

#### ECO tutorial
hint_holland: "Consigli Iniziali per l'Olanda"
hint_holland_hint_text: "Le [locations] altamente urbanizzate dei Paesi Bassi rendono il [Player.GetLongName] un candidato ideale per diventare una potenza commerciale nel Nord Europa.\n\n@hint! #T Costruite edifici [ShowBuildingTypeName('marketplace')] in ogni [ShowLocationRankName('town')]#!\nL'Automazione Commerciale utilizzerà la loro [merchant_capacity_with_icon|e] per [import_with_icon|e] le [raw_materials_with_icon|e] che il [market_icon][Player.GetCapital.GetMarket.GetName] manca, oltre che per [export_with_icon|e] l'eccedenza di [produced_goods_with_icon|e] dalle nostre Città.\n\n@hint! #T Espandete l'industria tessile#!\nC'è molto profitto da ricavare dall'esportazione di [ShowGoodsName('fine_cloth')]. Costruite gli edifici [ShowBuildingTypeName('cloth_guild')] e [ShowBuildingTypeName('fine_cloth_guild')] e considerate di importare [ShowGoodsName('wool')] dal Mercato di [ShowLocationName('london')] se necessario.\n\n@hint! #T Aumentate il nostro [crown_power]#!\nIl [trade_income_with_icon|e] è diviso tra il [ShowEstateTypeName('crown_estate')] e i [estates_with_icon|e] in base al loro potere relativo. Mantenere alto il nostro [crown_power_with_icon|e] assicurerà un flusso costante di [trade_income] nel [treasury_with_icon|e]. Potete saperne di più sul [crown_power] nel Suggerimento [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n\n@hint! #T Prestate attenzione alla fornitura di [food]#!\nLe [urban_locations_with_icon|e] producono meno [food_with_icon|e] delle [rural_locations_with_icon|e]. Tenete d'occhio la [food_stockpile_with_icon|e] del [Player.GetCapital.GetMarket.GetName] ed espandete le nostre [ShowGoodsName('fish')] di [ShowGoodsName('livestock')] e [rgo_with_icon|e] se necessario. Il nostro [budget] soffrirà se il [food] diventa troppo costoso.\n\n@hint! #T Placate i nostri vicini#!\nPotremmo essere ricchi, ma le nostre modeste dimensioni ci rendono vulnerabili all'aggressione straniera. Usate l'azione diplomatica [diplomatic_action_with_icon|e] $IMPROVE_RELATIONTITLE$ (Migliora Relazioni) con i nostri vicini più minacciosi, in particolare [GetCountry('FRA').GetName] e [GetCountry('ENG').GetName]." 

hint_holland_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_holland_administrative: "$hint_advisor_salute_administrative$"
hint_holland_military: "$hint_advisor_salute_military$"


hint_hungary: "Consigli Iniziali per l'Ungheria"
hint_hungary_hint_text: "[Player.GetLongName] inizia in una posizione privilegiata come una delle principali potenze nella [region|e]. Abbiamo un'[alliance_with_icon|e] con #W Polonia#!, #W Bosnia#! e nostro [subject_with_icon|e], e #W Croazia#! è in [personal_union_with_icon|e] sotto il nostro [ruler_with_icon|e] [Player.GetGovernment.GetRuler.GetName]. Questo significa che possiamo concentrarci sullo sviluppo del nostro [country_with_icon|e] senza preoccuparci di minacce esterne... almeno per il momento.\n\n@hint! #T Costruisci [roads] verso le tue miniere#!\nCi sono ricchi giacimenti di [ShowGoodsName('goods_gold')] e [ShowGoodsName('silver')] a nord di [capital_icon] [Player.GetCapital.GetName]. Tuttavia sono sottosviluppati e in [locations] con basso [control_with_icon|e]. Dovremmo cercare di costruire [roads_with_icon|e] da [Player.GetCapital.GetNameWithNoTooltip] a quelle preziose miniere, per aumentare la nostra [proximity_with_icon|e] e quindi il nostro [control].\n\n@hint!  #T Costruisci Gilde di Gioiellieri intorno alla tua [capital]#!\nA causa dell'alta offerta, il prezzo di [ShowGoodsNameWithNoTooltip('goods_gold')] e [ShowGoodsNameWithNoTooltip('silver')] nel [market_icon] [Player.GetCapital.GetMarket.GetName] è estremamente basso. Una [ShowBuildingTypeName('jewelry_guild')] userà [ShowGoodsNameWithNoTooltip('goods_gold')] e [ShowGoodsNameWithNoTooltip('silver')] per produrre [ShowGoodsName('jewelry')], un bene lavorato molto redditizio, aggiungendo ancora più valore alle nostre miniere.\n\n@hint! #T Costruisci [ShowBuildingTypeName('marketplace')] per esportare il surplus#!\nIl [trade_with_icon|e] Automatizzato [export_with_icon|e] qualsiasi surplus di [goods_with_icon|e], come [ShowGoodsNameWithNoTooltip('jewelry')], verso altri [markets_with_icon|e], creando [trade_income_with_icon|e] e mantenendo redditizia l'intera catena produttiva.\n\n@hint! #T Revoca [ShowPolicyName('gold_export_ban')]#!\nL'Europa brama il nostro [ShowGoodsNameWithNoTooltip('goods_gold')], ed esportarlo direttamente sarebbe molto redditizio, ma la nostra attuale [ShowLawName('precious_metal_distribution_law')] [law_with_icon|e] lo proibisce. Valuta di cambiare [policy] durante il prossimo [parliament_with_icon|e].\n\n@hint! #T Installa un [ShowBuildingTypeName('local_governor')]#!\nL'est del nostro [country] è ricco, ma abbiamo poco [control] sulle sue risorse. Nel lungo periodo dovremmo puntare a costruire li una [ShowLocationRankName('city')] per collocarvi un [ShowBuildingTypeName('local_governor')]. Agirà come [capital] secondaria, irradiando [proximity] alle [locations] vicine. Tieni presente che i Governatori Locali possono essere costruiti solo in una [ShowLocationRankName('city')], sono costosi da mantenere e richiedono un collegamento diretto tramite [road] alla nostra [capital]." 

hint_hungary_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_hungary_administrative: "$hint_advisor_salute_administrative$"
hint_hungary_military: "$hint_advisor_salute_military$"


hint_norway: "Consigli Iniziali per la Norvegia"
hint_norway_hint_text: "Il [Player.GetLongName] è un [country_with_icon|e] vasto, ma il nostro [control_with_icon|e] al di fuori della nostra [capital_with_icon|e] è al massimo nominale. Dovremmo espandere la nostra infrastruttura, sia marittima che terrestre, per aumentare la nostra [proximity_with_icon|e] e sfruttare le risorse del nord.\n\n@hint! #T Costruite [roads] dalla nostra [capital] #!\nDovremmo mirare a costruire [roads_with_icon|e] da [capital_icon] [Player.GetCapital.GetName] verso ogni [ShowLocationRankName('town')] e [rgo_with_icon|e] preziose vicino, al fine di aumentare la nostra [proximity_with_icon|e] e [control_with_icon|e]. Le miniere di [ShowGoodsName('silver')] a ovest di [Player.GetCapital.GetNameWithNoTooltip] dovrebbero essere particolarmente redditizie, con i dovuti investimenti. Controllate spesso la Mappa di [proximity]!\n\n@hint! #T Aumentate la [maritime_presence] #!\nAprire [roads] attraverso il nostro cuore montuoso può diventare una ricerca vana e costosa. Con una buona [maritime_presence_with_icon|e] lungo la nostra costa, la [proximity] potrebbe propagarsi in modo molto più efficiente via mare. Costruite [ShowBuildingTypeName('wharf')] e [ShowBuildingTypeName('dock')] nelle nostre Città e fate pattugliare le nostre coste da flotte di [ShowUnitCategoryName('navy_light_ship')], una volta che avremo ricercato l'[advance_with_icon|e] appropriato.\n\n@hint! #T Fondate Città nei buoni porti vicino alla nostra [capital]#!\nLa [proximity] delle [locations] costiere è notevolmente migliorata dalla [natural_harbor_suitability_with_icon|e]. Controllate la Mappa $mapmode_natural_harbor_suitability_name$ (Idoneità Portuale Naturale) per cercare i nostri migliori porti naturali.\n\n@hint! #T Espandete le nostre industrie#!\nCostruite [ShowBuildingTypeName('fine_cloth_guild')], [ShowBuildingTypeName('furniture_guild')] e [ShowBuildingTypeName('scriptorium')] nelle nostre Città per processare le nostre risorse naturali e costruite [ShowBuildingTypeName('marketplace')] per [export_with_icon|e] verso altri [markets_with_icon|e].\n\n@hint! #T Rafforzate l'Unione con la Svezia #!\nLa nostra [personal_union_with_icon|e] con [GetCountry('SWE').GetName] garantisce la pace nei nostri confini. Potremmo sforzarci per una più profonda integrazione con il loro Paese emanando [laws] comuni nel Pannello [international_organization|e]." 

hint_norway_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_norway_administrative: "$hint_advisor_salute_administrative$"
hint_norway_military: "$hint_advisor_salute_military$"


hint_naples: "Consigli Iniziali per Napoli"
hint_naples_hint_text: "Come la più grande potenza nella [region_with_icon|e], il [Player.GetLongName] è pronto a dominare il commercio e la politica italiani, mentre i nostri [subjects_with_icon|e] in Grecia costituiscono un conveniente punto d'appoggio per l'espansione esterna.\n\n@hint! #T Costruite [roads] dalla nostra [capital] #!\nDovremmo mirare a costruire [roads_with_icon|e] da [capital_icon] [Player.GetCapital.GetName] verso ogni [ShowLocationRankName('town')] e [rgo_with_icon|e] preziose vicino, al fine di aumentare la nostra [proximity_with_icon|e] e quindi il nostro [control_with_icon|e].\n\n@hint! #T Espandete la nostra estrazione di [raw_materials]#!\nIl nostro [country] contiene in abbondanza [raw_materials_with_icon|e] preziose. [ShowGoodsName('wool')], [ShowGoodsName('fiber_crops')] e [ShowGoodsName('silk')] non sono solo molto preziose di per sé, ma possono anche essere utilizzate dalle nostre industrie tessili nelle [urban_locations_with_icon|e]. Espandete queste [rgo_with_icon|e] il prima possibile e date la priorità all'aumento del [control] lì.\n\n@hint! #T Sviluppate l'industria tessile #!\nCostruite [ShowBuildingTypeName('cloth_guild')] [ShowBuildingTypeName('fine_cloth_guild')] e [buildings] nelle nostre [urban_locations]. Useranno le nostre [raw_materials] per produrre [produced_goods_with_icon|e] costosi, mentre la maggiore domanda renderà le nostre [rgo] ancora più redditizie.\n\n@hint! #T Costruite un [ShowBuildingTypeName('marketplace')] per esportare le nostre eccedenze#!\nIl [trade_with_icon|e] automatizzato [export_with_icon|e] qualsiasi eccedenza di [goods_with_icon|e], come [ShowGoodsNameWithNoTooltip('fine_cloth')], verso altri [markets_with_icon|e], il che creerà [trade_income_with_icon|e] e manterrà redditizia l'intera catena di produzione." 

hint_naples_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_naples_administrative: "$hint_advisor_salute_administrative$"
hint_naples_military: "$hint_advisor_salute_military$"


hint_castile: "Consigli Iniziali per la Castiglia"
hint_castile_hint_text: "Come potenza dominante della [region_with_icon|e], [Player.GetLongName] si trova in una posizione privilegiata per unificare l'Iberia sotto un unico trono. Tuttavia, la nostra amministrazione è già sotto pressione, e il nostro [control] nel sud e cosi basso da contribuire appena al nostro [budget_with_icon|e]. Sarebbe saggio consolidare il nostro [control] sul territorio attuale prima di intraprendere ulteriori conquiste.\n\n@hint! #T Costruisci [roads] dalla nostra [capital] #!\nLe [locations] senza [control_with_icon|e] sono praticamente inutili per la nostra amministrazione. Costruisci [roads_with_icon|e] e [ShowBuildingTypeName('bridge_infrastructure')] [buildings] dalla nostra [capital_with_icon|e] per aumentare la nostra [proximity_with_icon|e], e quindi il nostro [control]. Controlla spesso la Modalità Mappa [proximity]!\n\n@hint! #T Installa un [ShowBuildingTypeName('local_governor')]#!\nIl sud del nostro [country] è ricco e urbanizzato, ma abbiamo poco [control] sulla sua popolazione. Valuta di costruire un [ShowBuildingTypeName('local_governor')] a [ShowLocationName('sevilla')]. Agirà come [capital] secondaria, irradiando [proximity] alle [locations] vicine. Tieni presente che i Governatori Locali possono essere costruiti solo in una [ShowLocationRankName('city')], sono costosi da mantenere e richiedono un collegamento diretto tramite [road] alla nostra [capital].\n\n@hint! #T Soggioga [GetCountry('GRA').GetName]#!\nAnche se non siamo in grado di [own_with_icon|e] le loro terre in modo molto efficace, potremmo rendere [GetCountry('GRA').GetName] nostro [subject_with_icon|e]. Governerebbero la terra per nostro conto e pagherebbero un tributo mensile nel nostro [treasury]. Potremo considerare di [annexing_with_icon|e] quando infrastrutture e tecnologia saranno abbastanza sviluppate da permetterci di possedere direttamente la terra. Per [annex] un [subject] dovremo averlo governato per più di #Y 10#! anni e avere buone relazioni con lui.\n\n@hint! #T Plus Ultra#!\nGli [explorers_with_icon|e] riportano dalle loro spedizioni in India racconti di ricchezze smisurate. Tuttavia, imbarcarsi in tali imprese senza gli [advances_with_icon|e] più moderni può rivelarsi un'impresa assurdamente costosa." 

hint_castile_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_castile_administrative: "$hint_advisor_salute_administrative$"
hint_castile_military: "$hint_advisor_salute_military$"


hint_ottomans: "Consigli Iniziali per gli Ottomani"
hint_ottomans_hint_text: "L'imminente Ascesa dei Turchi [situation_with_icon|e] offrirà un'opportunità unica per una rapida espansione in Grecia e Anatolia. Usa le [actions_with_icon|e] della Situazione per ottenere un [casus_belli_with_icon|e] sui nostri vicini e scatenare la nostra potenza contro di loro.\n\n@hint! #T Integra le nostre conquiste #!\nLe [locations] appena [conquered_with_icon|e] devono essere [integrated_with_icon|e] nella nostra amministrazione tramite il [cabinet_with_icon|e] prima che possiamo raccogliere i frutti delle nostre conquiste.\n\n@hint! #T Costruisci [roads] dalla nostra [capital] #!\nLe [locations] senza [control_with_icon|e] sono praticamente inutili per la nostra amministrazione. Traccia [roads_with_icon|e] dalla nostra [capital_with_icon|e] per aumentare la nostra [proximity_with_icon|e], e quindi il nostro [control]. Controlla spesso la Modalità Mappa [proximity]!\n\n@hint! #T Crea [subjects] per governare la terra conquistata#!\nEspandendoti, conquisterai territori ben oltre la portata della nostra [proximity]. Si consiglia di creare [subjects_with_icon|e] per governare la terra per nostro conto finche non potremo permetterci di amministrarla direttamente.\n\n@hint! #T Annetti i nostri [subjects] quando la [proximity] migliora #!\nMentre sviluppiamo le infrastrutture e accresciamo la nostra [proximity], terre un tempo sterili per noi diventano degne di possesso diretto. Per [annex_with_icon|e] un [subject] dovremo averlo governato per più di #Y 10#! anni e avere buone relazioni con lui.\n\n@hint! #T Aumenta la [maritime_presence] #!\nIl terreno accidentato di Grecia e Anatolia rende difficile proiettare [proximity] via terra. Con una buona [maritime_presence_with_icon|e] lungo la nostra costa, la [proximity] potrebbe propagarsi molto più efficientemente via mare. Costruisci [ShowBuildingTypeName('wharf')] e [ShowBuildingTypeName('dock')] nelle nostre Città e fai pattugliare le nostre coste dalle [navies_with_icon|e]. Sarebbe particolarmente importante se spostassimo la nostra [capital] a [ShowLocationName('constantinople')]...\n\n@hint! #T Installa un [ShowBuildingTypeName('local_governor')]#!\nSe intendiamo governare direttamente terre lontane dalla nostra [capital], dovremmo considerare di collocarvi un [ShowBuildingTypeName('local_governor')]. Agirà come [capital] secondaria, irradiando [proximity] alle [locations] vicine. Tieni presente che i Governatori Locali possono essere costruiti solo in una [ShowLocationRankName('city')], sono costosi da mantenere e richiedono un collegamento diretto tramite [road] alla nostra [capital]." 

hint_ottomans_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_ottomans_administrative: "$hint_advisor_salute_administrative$"
hint_ottomans_military: "$hint_advisor_salute_military$"
hint_hre: "Consigli per il Sacro Romano Impero" 
hint_hre_hint_text: "$hint_hre_hint_text_1$\n\n$hint_hre_hint_text_2$\n\n$hint_hre_hint_text_3$\n\n$hint_hre_hint_text_4$\n\n$hint_hre_hint_text_5$\n\n$hint_hre_hint_text_6$" 
hint_hre_hint_text_1: "[GetInternationalOrganizationType('hre').GetName] e una grande [international_organization_with_icon|e] dell'Europa centrale. L'appartenenza all'[international_organization] influenzera l'esperienza di gioco di qualsiasi paese." 
hint_hre_hint_text_2: "[hre_emperor_icon] #T L'Imperatore:#!\n[GetInternationalOrganization('hre').GetNameWithNoTooltip] è guidato dall'[hre_emperor_with_icon|e]. È dovere di [ShowSpecialStatusNameWithNoTooltip('emperor')] proteggere i membri dell'Impero dalle minacce straniere, mantenere pace e stabilità interne e garantire l'unità religiosa nell'Impero.\n@arrow_bonus_tier_3! [ShowSpecialStatusNameWithNoTooltip('emperor')] può usare #Y $imperial_authority$#! per proporre [policies_with_icon|e] e [parliament_issues_with_icon|e].\n@arrow_bonus_tier_2! Usa le varie [diplomatic_actions_with_icon|e] per guidare gli altri membri verso una situazione politica favorevole nell'Impero.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_landfriede')] - Impone una [white_peace|e] a un membro.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_religious_unity')] - Impone la Religione Imperiale a un membro.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('demand_unlawful_territory')] - Richiede la restituzione di una [location|e] conquistata al suo proprietario precedente. Se la richiesta viene respinta, sarà concesso un [casus_belli|e] per imporla.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('ask_to_vote_for_me_as_emperor')] - Al costo di [favors|e], puoi chiedere a un [country] di votare per te come imperatore. Questo persistera fino alla prossima elezione.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('bolster_imperial_army')] - Chiede a un [country] di unirsi a una delle tue guerre. Ricevera un pagamento dal tesoro imperiale.\n@arrow_bonus_tier_1! Conferisci uno [special_status|e] - Ogni [special_status], escluso [ShowSpecialStatusName('imperial_peasant_republic')], può essere concesso a un membro dell'Impero.\n@arrow_bonus_tier_1! Revoca uno [special_status|e] - Ogni [special_status], escluso [ShowSpecialStatusName('imperial_peasant_republic')], può essere revocato a un membro dell'Impero." 
hint_hre_hint_text_3: "[elector_icon] #T Gli Elettori:#!\nL'[hre_electoral_college_with_icon|e] è composto da [ShowSpecialStatusNamePlural('elector')] e [ShowSpecialStatusNamePlural('archbishop_elector')]. Il loro voto determinerà il prossimo [ShowSpecialStatusName('emperor')], quando il [ruler] del [country] leader attuale morirà.\n@arrow_bonus_tier_1! L'Elezione può riuscire solo se almeno il 50% degli Elettori attuali vota per lo stesso [country]. Se non si raggiunge alcuna maggioranza, l'Impero entrerà in una Lotta di Potere.\n$BULLET_WITH_TAB$ La Lotta di Potere è un periodo senza un [ShowSpecialStatusName('emperor')] eletto, in cui Privilegi e Doveri dell'Imperatore non possono essere esercitati da alcun [country]. L'[hre_electoral_college] tenterà di risolvere la Lotta di Potere consolidando i voti. Dopo 10 anni, la Lotta di Potere sarà costretta a terminare, e il [country] con il [great_power_score_with_icon|e] più alto diventera [ShowSpecialStatusName('emperor')]." 
hint_hre_hint_text_4: "[hre_law_level_icon] #T Le Leggi Imperiali:#!\nLa Costituzione Imperiale determina le regole che l'Impero e i suoi membri seguiranno. La tassazione dei membri in [gold|e] e [manpower|e], il numero di Elettori e l'unificazione dell'Impero saranno dettati dalle [policies] attualmente attive.\n@arrow_bonus_tier_3! L'Impero inizia senza la [policy] [ShowPolicyName('golden_bull_policy')]. Prima che qualsiasi altra [policy] possa essere attuata, la [policy] [ShowPolicyName('golden_bull_policy')] dovrà essere proposta e approvata.\n@arrow_bonus_tier_3! Una volta promulgata la [policy] [ShowPolicyName('golden_bull_policy')], l'Impero viene impostato sulle politiche di base in tutte le categorie. Poi sarà privilegio di [ShowSpecialStatusName('emperor')] scegliere qualsiasi [policy] da mettere ai voti nella Dieta Imperiale, se [ShowSpecialStatusName('emperor')] può pagare #Y $imperial_authority$#! per cambiare la [policy].\n@arrow_bonus_tier_2! Ogni [policy] contrassegnata come 'Emperor Comfort Policy' avvicinerà l'Impero all'unificazione in un unico [country] sotto [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! L'unificazione non è l'unico Obiettivo Finale dell'Impero. Molte [policies] possono beneficiare [ShowSpecialStatusName('emperor')] o specifici membri dell'Impero senza procedere verso l'unificazione." 
hint_hre_hint_text_5: "[parliament_icon] #T La Dieta Imperiale:#!\n La Dieta Imperiale si attiverà in due occasioni:\n$TAB$@arrow_bonus_tier_1! Quando [ShowSpecialStatusName('emperor')] propone una nuova [policy].\n$TAB$@arrow_bonus_tier_1! Quando [ShowSpecialStatusName('emperor')] propone una [parliament_issue] che riguarda tutti i membri dell'Impero.\n@arrow_bonus_tier_3! Quando la Dieta Imperiale è in sessione, ogni membro può votare sulla Proposta attuale. La forza del voto di ogni singolo [country] è determinata dallo [special_status_power] del suo [special_status]. Per aumentare il tuo potere di voto, puoi richiedere un nuovo [special_status] a [ShowSpecialStatusName('emperor')].\n$BULLET_WITH_TAB$ In generale, i [countries] con lo [special_status] dell'[hre_electoral_college] avranno il più alto [special_status_power], seguiti dai [countries] di [country_rank] [ShowCountryRankName('rank_kingdom')] senza seggio nell'[hre_electoral_college].\n$BULLET_WITH_TAB$ Lo [special_status_power] e determinato anche da specifiche [policies] nell'Impero.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')] può usare le [parliament_agendas] per spingere paesi di uno specifico [special_status] dalla propria parte.\n@arrow_bonus_tier_2! [ShowSpecialStatusName('emperor')] può usare la [diplomatic_action] [ShowCountryInteractionName('bribe_voter_for_policy')] per corrompere qualsiasi votante." 
hint_hre_hint_text_6: "[hre_icon] #T I Membri:#!\nOgni [country] nell'[international_organization] è considerato membro, se al momento non e [ShowSpecialStatusName('emperor')]. Tuttavia, la sua importanza nell'Impero è determinata dal suo [special_status_power].\n@arrow_bonus_tier_3! Richiedi uno [special_status] a [ShowSpecialStatusName('emperor')] - Ogni Membro può richiedere uno [special_status], purché soddisfi le condizioni per quello status.\n@arrow_bonus_tier_3! [ShowCountryInteractionName('ask_for_dukedom')] - Ogni Membro può richiedere un avanzamento al [country_rank|e] [ShowCountryRankName('rank_duchy')], purché soddisfi le condizioni. I membri non possono aumentare il proprio [country_rank] senza la conferma di [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! [ShowCountryInteractionName('request_county_privileges')] - Può essere usato per ottenere accesso alle [government_reforms|e] [ShowGovernmentReformName('margraviate')] e [ShowGovernmentReformName('landgraviate')]." 
