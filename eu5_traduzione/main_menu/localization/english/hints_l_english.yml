 ###Hussite Wars
 hint_hussite_wars: "[GetSituationByKey('hussite_wars').GetNameWithNoTooltip]"
 hint_hussite_wars_hint_text: "$hint_hussite_wars_hint_text_1$\n\n$hint_hussite_wars_hint_text_2$\n\n$hint_hussite_wars_hint_text_3$\n\n$hint_hussite_wars_hint_text_4$"
 hint_hussite_wars_hint_text_1: "Le [GetSituationByKey('hussite_wars').GetName] portano a una profonda frattura nella [GetReligionByKey('catholic').GetName]. Dalla loro parte, molti monarchi [GetReligionByKey('catholic').GetAdjectiveWithNoTooltip] temono che se questa eresia non verrà estinta rapidamente, potrebbe inghiottire parti consistenti dell'[ShowContinentName('europe')] e minacciare l'autorità spirituale del [GetCountry('PAP').GetGovernment.GetRulerTitle]."
# hint_hussite_wars_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il [GetCountry('PAP').GetGovernment.GetRulerTitle] cercherà di muovere [war|e] contro [GetCountry('BOH').GetName]. I Paesi [ShowReligionGroupAdjective('christian')] vicini possono scegliere di unirsi all'una o all'altra parte, decidendo di fatto il destino di un intero [continent|e]." #OLD
 hint_hussite_wars_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! The [GetCountry('PAP').GetGovernment.GetRulerTitle] will seek to wage [war_with_icon|e] against [GetCountry('BOH').GetName]. Neighboring [ShowReligionGroupAdjective('christian')] countries may opt to join either side, effectively deciding the fate of an entire [continent_with_icon|e]." #NEW
# hint_hussite_wars_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! [GetCountry('BOH').GetName] ha accesso a numerose [actions|e] uniche come [ShowGenericActionName('convert_heretics_hw_action')] e [ShowGenericActionName('prepare_defenses_hw_action')], tra le altre." #OLD
 hint_hussite_wars_hint_text_3: "#T Extra Hints:#!\n@hint! [GetCountry('BOH').GetName] has access to numerous unique [actions_with_icon|e] such as [ShowGenericActionName('convert_heretics_hw_action')] and [ShowGenericActionName('prepare_defenses_hw_action')], among others." #NEW
 #hint_hussite_wars_hint_text_4: "#T Azioni Raccomandate come [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Buone relazioni con i Paesi [GetReligionByKey('catholic').GetAdjective] affini possono consentirci di chiamarli nella nostra lotta. Il [peace_treaty|e] unico [ShowPeaceTreatyTypeName('supress_hussite_faith')] è disponibile durante la [situation|e]. Esso ridurrà il costo dell'utilizzo del [peace_treaty|e] #Y Conversione Forzata#!.\n@arrow_bonus_tier_2! i [countries|e] di fede [GetReligionByKey('catholic').GetAdjective] in [war|e] con la [GetCountry('BOH').GetName] ottengono l'accesso a un'[action|e] [unit|e] unica, [ShowUnitAbilityName('hussite_tribunal')]. Questo permetterà loro di [convert|e] con la forza i [pops|e] di fede [GetReligionByKey('hussite').GetAdjective] e uccidere coloro che resistono nelle [province_capitals|e] che controllano durante la guerra." #OLD ITA
# hint_hussite_wars_hint_text_4: "#T Recommended Actions as the [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Good relations with fellow [GetReligionByKey('catholic').GetAdjective] countries may enable us to call them in our struggle. The unique [ShowPeaceTreatyTypeName('supress_hussite_faith')] [peace_treaty|e] is available during the [situation|e]. It will reduce the cost of using the #Y Force Convert#! [peace_treaty|e].\n@arrow_bonus_tier_2! [GetReligionByKey('catholic').GetAdjective] [countries|e] at [war|e] with [GetCountry('BOH').GetName] gain access to a unique [unit|e] [action|e], [ShowUnitAbilityName('hussite_tribunal')]. This will allow them to forcefully [convert|e] [GetReligionByKey('hussite').GetAdjective] [pops|e] and kill those who resist in [province_capitals|e] they control during the war." #OLD
 hint_hussite_wars_hint_text_4: "#T Recommended Actions as the [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Good relations with fellow [GetReligionByKey('catholic').GetAdjective] countries may enable us to call them in our struggle. The unique [ShowPeaceTreatyTypeName('supress_hussite_faith')] [peace_treaty_with_icon|e] is available during the [situation_with_icon|e]. It will reduce the cost of using the #Y Force Convert#! [peace_treaty_with_icon|e].\n@arrow_bonus_tier_2! [GetReligionByKey('catholic').GetAdjective] [countries_with_icon|e] at [war_with_icon|e] with [GetCountry('BOH').GetName] gain access to a unique [unit_with_icon|e] [action_with_icon|e], [ShowUnitAbilityName('hussite_tribunal')]. This will allow them to forcefully [convert_with_icon|e] [GetReligionByKey('hussite').GetAdjective] [pops_with_icon|e] and kill those who resist in [province_capitals_with_icon|e] they control during the war." #NEW
 #hint_hussite_wars_hint_text_4: "#T Recommended Actions as the [GetCountry('PAP').GetName]:#!\n@arrow_bonus_tier_3! Good relations with fellow [GetReligionByKey('catholic').GetAdjective] countries may enable us to call them in our struggle. The unique [ShowPeaceTreatyTypeName('supress_hussite_faith')] [peace_treaty|e] is available during the [situation|e]. It will reduce the cost of using the #Y Force Convert#! [peace_treaty|e]." #OLD ENG
 
 hint_hussite_wars_diplomatic: "\"La fede dovrebbe motivarci a cercare alleati che la pensano allo stesso modo e a perseverare in questo periodo difficile.\""
# hint_hussite_wars_administrative: "\"Dovremmo occuparci di mantenere l'[religious_unity|e].\"" #OLD
 hint_hussite_wars_administrative: "\"We should look into maintaining [religious_unity_with_icon|e].\"" #NEW
 hint_hussite_wars_military: "\"È probabile che dovremo difendere la nostra fede con mezzi violenti.\""

