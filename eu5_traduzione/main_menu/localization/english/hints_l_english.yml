 ###Little Ice Age
 hint_little_ice_age: "[GetSituationByKey('little_ice_age').GetNameWithNoTooltip]"
 hint_little_ice_age_hint_text: "$hint_little_ice_age_hint_text_1$\n\n$hint_little_ice_age_hint_text_2$\n\n$hint_little_ice_age_hint_text_3$"
 hint_little_ice_age_hint_text_1: "La [GetSituationByKey('little_ice_age').GetName] è su di noi! Il gelo copre le terre. Dobbiamo fare del nostro meglio per proteggere i raccolti, gli animali e assicurare la sopravvivenza del nostro popolo!"
# hint_little_ice_age_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considerate di espandere gli [buildings|e] che producono o migliorano la produzione di [food|e]." #OLD
 hint_little_ice_age_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Consider expanding [buildings_with_icon|e] that produce or enhance the production of [food_with_icon|e]." #NEW
# hint_little_ice_age_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo utilizzare molte [actions|e] uniche per aiutare a rafforzare e ridistribuire [food|e] attraverso le nostre [provinces|e]." #OLD
 hint_little_ice_age_hint_text_3: "#T Extra Hints:#!\n@hint! We may utilize many unique [actions_with_icon|e] to help bolster and redistribute [food_with_icon|e] across our [provinces_with_icon|e]." #NEW
 
 hint_little_ice_age_diplomatic: "\"L'inverno sta arrivando.\""
# hint_little_ice_age_administrative: "\"La corretta produzione e distribuzione di [food|e] salverà i nostri [pops|e] dall'incontrare prematuramente la morte.\"" #OLD
 hint_little_ice_age_administrative: "\"Proper production and distribution of [food_with_icon|e] will safeguard our [pops_with_icon|e] from prematurely greeting the reaper.\"" #NEW
# hint_little_ice_age_military: "\"Gli specchi d'acqua ghiacciati possono essere brevemente attraversabili, ma gli [armies|e] intrappolati nelle montagne invernali rischiano di rimanere bloccati molto più a lungo.\"" #OLD
 hint_little_ice_age_military: "\"Frozen bodies of water may be briefly passable, but [armies_with_icon|e] trapped in winter mountains risk being stranded far longer.\"" #NEW
 
 ###Revolution
 hint_the_revolution: "[GetSituationByKey('the_revolution').GetNameWithNoTooltip]"
 hint_the_revolution_hint_text: "$hint_the_revolution_hint_text_1$\n\n$hint_the_revolution_hint_text_2$\n\n$hint_the_revolution_hint_text_3$"
 hint_the_revolution_hint_text_1: "La [GetSituationByKey('the_revolution').GetName] è scoppiata! Le monarchie tremano mentre le idee di libertà, uguaglianza e fratellanza si diffondono a macchia d'olio. Abbracceremo le fiamme del cambiamento o difenderemo il vecchio ordine?"
# hint_the_revolution_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo diventare [revolutionary|e] schierandoci con i ribelli [revolutionary|e] durante il [disaster|e] [ShowDisasterName('revolution_disaster')].\n@arrow_bonus_tier_2! La [situation|e] abilita #Y 2#! [peace_treaties|e] unici: [ShowPeaceTreatyTypeName('reinstate_the_monarchy')] e [ShowPeaceTreatyTypeNameWithNoTooltip('force_revolution')].\n@arrow_bonus_tier_1! La [situation|e] offre accesso a nuove [actions|e] come [ShowGenericActionName('suppress_foreign_revolutionaries')] e [ShowGenericActionName('assist_foreign_revolutionaries')]." #OLD
 hint_the_revolution_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We can become [revolutionary_with_icon|e] by siding with the [revolutionary_with_icon|e] rebels during the [ShowDisasterName('revolution_disaster')] [disaster_with_icon|e].\n@arrow_bonus_tier_2! The [situation|e] enables #Y 2#! unique [peace_treaties_with_icon|e]: [ShowPeaceTreatyTypeName('reinstate_the_monarchy')] and [ShowPeaceTreatyTypeNameWithNoTooltip('force_revolution')].\n@arrow_bonus_tier_1! The [situation|e] offers access to new [actions_with_icon|e] such as [ShowGenericActionName('suppress_foreign_revolutionaries')] and [ShowGenericActionName('assist_foreign_revolutionaries')]." #NEW
# hint_the_revolution_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il Paese rivoluzionario più forte può rivendicare il titolo di [revolutionary_target|e] avendo il [great_power_score|e] più alto." #OLD
 hint_the_revolution_hint_text_3: "#T Extra Hints:#!\n@hint! The strongest revolutionary country may claim the mantle of [revolutionary_target_with_icon|e] by having the highest [great_power_score_with_icon|e]." #NEW
 
 hint_the_revolution_diplomatic: "\"Nel panorama politico, sembra che molti monarchi abbiano perso la testa nel tentativo di schiacciare queste rivoluzioni.\""
 hint_the_revolution_administrative: "\"Faremo bene a scegliere una parte e in fretta. La sopravvivenza del nostro regno dipende da decisioni rapide. Se la rivoluzione dovesse bussare alla nostra porta, saremo preparati.\""
 hint_the_revolution_military: "\"Sia che schiacciamo o sosteniamo il sentimento rivoluzionario, la nostra influenza deve estendersi oltre i nostri confini.\""

 ###Western Schism
 hint_western_schism: "[GetSituationByKey('western_schism').GetNameWithNoTooltip]"
 hint_western_schism_hint_text: "$hint_western_schism_text_1$\n\n$hint_western_schism_text_2$\n\n$hint_western_schism_text_3$\n\n$hint_western_schism_text_4$"
 hint_western_schism_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('western_schism')], l'[international_organization_with_icon|e] [GetUniqueInternationalOrganization('catholic_church').GetName] è divisa tra due candidati al Papato, impedendo ogni interazione con la Curia.\n\nPer influenzare l'esito della [situation] si possono intraprendere i seguenti passi a seconda del vostro ruolo all'interno della Chiesa:"
 hint_western_schism_text_2: "#T [countries] in possesso di un [cardinal_with_icon|e]:#!\n@arrow_bonus_tier_3! Votate per uno dei candidati"
 hint_western_schism_text_3: "#T [countries] senza un [cardinal_with_icon|e]:#!\n@arrow_bonus_tier_3! Usate l'[action|e] della [situation] #V $schism_show_support_for_one_pope$#! per concedere progressi a un candidato scelto\n@arrow_bonus_tier_2! Usate l'[action] religiosa $request_cardinal_seat$ per ottenere un [cardinal]\n@arrow_bonus_tier_1! Usate l'[action] della [situation] #V $schism_demand_support_from_one_pope$#! per trarre profitto dalla [situation]"
# hint_western_schism_text_4: "Durante la [situation] le eresie si diffonderanno in tutto il mondo cattolico.\n\n#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considerate di usare l'[action] della [situation|e] #V $schism_show_unity_of_faith$#! per mantenere alta la vostra [religious_unity|e]" #OLD
 hint_western_schism_text_4: "During the [situation] heresies will spread throughout the Catholic world.\n\n#T Recommended Actions:#!\n@arrow_bonus_tier_3! Consider using the [situation|e] [action] #V $schism_show_unity_of_faith$#! to keep your [religious_unity_with_icon|e] high" #NEW
 
 ###Reformation
 hint_reformation: "[GetSituationByKey('reformation').GetNameWithNoTooltip]"
 hint_reformation_hint_text: "$hint_reformation_hint_text_1$\n\n$hint_reformation_hint_text_2$\n\n$hint_reformation_hint_text_3$"
# hint_reformation_hint_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('reformation')], i [ShowBuildingTypeName('lutheran_preachers')] e i [ShowBuildingTypeName('calvinist_preachers')] diffonderanno le loro nuove [religions|e] in tutto il mondo [ShowReligionGroupAdjective('christian')]." #OLD
