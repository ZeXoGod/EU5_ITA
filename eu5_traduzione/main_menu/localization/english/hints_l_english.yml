 hint_columbian_exchange_hint_text_1: "The [GetSituationByKey('columbian_exchange').GetName] has commenced! [trade_with_icon|e] and [goods_with_icon|e] will henceforth flow between the Old and the New World!" #NEW
# hint_columbian_exchange_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo utilizzare una qualsiasi delle [actions|e] uniche attraverso il pannello della [situation|e] per rafforzare i nostri profitti introducendo nuove merci nel nostro [market|e]." #OLD
 hint_columbian_exchange_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We may utilize any of the unique [actions_with_icon|e] through the [situation_with_icon|e] panel to bolster our profit by introducing new goods in our [market_with_icon|e]." #NEW
 
 hint_columbian_exchange_diplomatic: "\"Il profitto commerciale fa girare il mondo!\""
 hint_columbian_exchange_administrative: "$hint_treaty_of_tordesillas_administrative$"
 hint_columbian_exchange_military: "\"Dobbiamo fare del nostro meglio per assicurarci fonti redditizie e nuove merci, prima dei nostri concorrenti!\""
 
 ###War of Religions
 hint_war_of_religions: "[GetSituationByKey('war_of_religions').GetNameWithNoTooltip]"
 hint_war_of_religions_hint_text: "$hint_war_of_religions_hint_text_1$\n\n$hint_war_of_religions_hint_text_2$\n\n$hint_war_of_religions_hint_text_3$\n\n$hint_war_of_religions_hint_text_4$"
# hint_war_of_religions_hint_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('war_of_religions')], due [international_organizations_with_icon|e] cercano di assicurare la sopravvivenza delle loro [religions|e] all'interno del [GetUniqueInternationalOrganization('hre').GetName]. L'[GetUniqueInternationalOrganization('protestant_union').GetName] e la [GetUniqueInternationalOrganization('catholic_league').GetName] offriranno protezione ai [countries|e] dell'impero. Con l'aumento delle tensioni, entrambe potranno cercare di stabilire la supremazia religiosa, alterando le [laws|e] del [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] a loro preferenza." #OLD
 hint_war_of_religions_hint_text_1: "During the [ShowSituationNameWithNoTooltip('war_of_religions')] [situation|e], two [international_organizations_with_icon|e] try to ensure the survival of their [religions_with_icon|e] within the [GetUniqueInternationalOrganization('hre').GetName]. The [GetUniqueInternationalOrganization('protestant_union').GetName] and the [GetUniqueInternationalOrganization('catholic_league').GetName] will offer protection to [countries_with_icon|e] of the empire. With rising tensions, both will be able to try establishing religious supremacy, altering the [laws_with_icon|e] of the [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] to their preference." #NEW
# hint_war_of_religions_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Unitevi all'[international_organization] che desiderate sostenere\n@arrow_bonus_tier_2! Cercate nuove [alliances|e] con Paesi esterni\n@arrow_bonus_tier_2! Come [country] non membro del [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip], cercate un'[alliance] con il leader della lega religiosa preferita" #OLD
 hint_war_of_religions_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Join the [international_organization] you want to support\n@arrow_bonus_tier_2! Seek new [alliances_with_icon|e] with outside countries\n@arrow_bonus_tier_2! As a non-member [country] of the [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip], seek an [alliance] with the leader of the prefered religious league" #NEW
 hint_war_of_religions_hint_text_3: "#T Se siete un Leader di una Lega Religiosa:#!\n@arrow_bonus_tier_3! Usate l'[action|e] della [situation] #V $prepare_military_escalation$#! per ottenere il [ShowCasusBelliName('cb_religious_superiority')]\n@hint! Una volta usata, potete imporre il [ShowPeaceTreatyTypeName('religious_supremacy')] per far rispettare le richieste della vostra fazione\n@arrow_bonus_tier_2! Usate l'[action] della [situation] #V $demand_member_removal$#! per rimuovere i Paesi pericolosi dall'altra [international_organization] prima che scoppi la [war]"
# hint_war_of_religions_hint_text_4: "#T Suggerimenti Aggiuntivi:#!\n@hint! Durante la [war] di [ShowCasusBelliName('cb_religious_superiority')] i [countries] acquisiranno [war_exhaustion]\n@hint! Se l'#Y 80%#! di tutti i partecipanti desidera la [peace|e] si raggiunge invece la #Y Pace di Vestfalia#!\n@hint! Questo costringerà la [war] a terminare e raggiungerà la pace religiosa all'interno del [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]" #OLD
 hint_war_of_religions_hint_text_4: "#T Extra Hints:#!\n@hint! During the [war] of [ShowCasusBelliName('cb_religious_superiority')] [countries] will acquire [war_exhaustion]\n@hint! If #Y 80%#! of all participants desire [peace_with_icon|e] the #Y Peace of Westphalia#! is achieved instead\n@hint! This will force the [war] to an end and achieve religious peace within the [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]" #NEW
 
 ###Guelphs and Ghibellines
 hint_guelphs_and_ghibellines: "[GetSituationByKey('guelphs_and_ghibellines').GetNameWithNoTooltip]"
 hint_guelphs_and_ghibellines_hint_text: "$hint_guelphs_and_ghibellines_hint_text_1$\n\n$hint_guelphs_and_ghibellines_hint_text_2$"
 hint_guelphs_and_ghibellines_hint_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('guelphs_and_ghibellines')], le [international_organizations_with_icon|e] [GetUniqueInternationalOrganization('guelphs_io').GetName] e [GetUniqueInternationalOrganization('ghibellines_io').GetName] competono per l'influenza sulla [region|e] [ShowRegionName('italy_region')] in nome del [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle] ([GetUniqueInternationalOrganization('guelphs_io').GetName]) o del [GetUniqueInternationalOrganization('hre').GetLeaderTitle] ([GetUniqueInternationalOrganization('ghibellines_io').GetName])."
# hint_guelphs_and_ghibellines_hint_text_2: "#T Se siete membri di una delle due parti:#!\n@arrow_bonus_tier_3! Costringete un [country|e] nella vostra fazione con l'aiuto del [casus_belli_with_icon|e] [ShowCasusBelliName('cb_gag_force_country_into_faction')]\n@arrow_bonus_tier_2! Assistete i membri della vostra fazione a mantenere il controllo della loro [tax_base|e] con relazioni diplomatiche come [alliances_with_icon|e] o [guarantee_with_icon|e]\n@arrow_bonus_tier_2! Aumentate la [tax_base_with_icon|e] del vostro [country]" #OLD
 hint_guelphs_and_ghibellines_hint_text_2: "#T If you are a member of either side:#!\n@arrow_bonus_tier_3! Force a [country_with_icon|e] into your faction with the help of the [ShowCasusBelliName('cb_gag_force_country_into_faction')] [casus_belli_with_icon|e]\n@arrow_bonus_tier_2! Assist the members of your faction to keep hold of their [tax_base_with_icon|e] with diplomatic relations like [alliances_with_icon|e] or [guarantee_with_icon|e]\n@arrow_bonus_tier_2! Increase the [tax_base_with_icon|e] of your [country]" #NEW
 
 ###Colonial Revolution
 hint_colonial_revolution: "[GetSituationByKey('colonial_revolution').GetNameWithNoTooltip]"
 hint_colonial_revolution_hint_text: "$hint_colonial_revolution_hint_text_1$\n\n$hint_colonial_revolution_text_2$\n\n$hint_colonial_revolution_text_3$"
# hint_colonial_revolution_hint_text_1: "Durante la [situation|e] [ShowSituationNameWithNoTooltip('colonial_revolution')], i [subjects|e] coloniali del mondo lottano per la loro indipendenza contro i loro [overlords|e]." #OLD
 hint_colonial_revolution_hint_text_1: "During the [ShowSituationNameWithNoTooltip('colonial_revolution')] [situation|e], colonial [subjects_with_icon|e] of the world struggle for their independence against their [overlords_with_icon|e]." #NEW
# hint_colonial_revolution_text_2: "#T Se siete una nazione coloniale :#!\n@arrow_bonus_tier_3! Create una [international_organization|e]\n@arrow_bonus_tier_2! Usate l'[action|e] della [situation] #V $seek_alliance_with_overlord_rival$#! per ricevere aiuto da altri [countries|e]\n@arrow_bonus_tier_1! Se esiste una federazione coloniale, considerate di unirvi ad essa" #OLD
 hint_colonial_revolution_text_2: "#T If you are a colonial nation :#!\n@arrow_bonus_tier_3! Create a colonial federation [international_organization|e]\n@arrow_bonus_tier_2! Use the [situation] [action|e] #V $seek_alliance_with_overlord_rival$#! to receive help from other [countries_with_icon|e]\n@arrow_bonus_tier_1! If a colonial federation exists, consider joining it" #NEW
 hint_colonial_revolution_text_3: "#T Se siete un [overlord] :#!\n@arrow_bonus_tier_3! Usate l'[action] della [situation] #V $establish_goods_act$#! per ottenere fondi aggiuntivi\n@arrow_bonus_tier_2! Considerate di usare l'[action] della [situation] #V $give_colony_representation$#!, se una colonia diventa sleale"

 ###Red Turban Rebellion
 hint_red_turban_rebellions: "[GetSituationByKey('red_turban_rebellions').GetNameWithNoTooltip]"
 hint_red_turban_rebellions_hint_text: "$hint_red_turban_rebellions_hint_text_1$\n\n$hint_red_turban_rebellions_hint_text_2$\n\n$hint_red_turban_rebellions_hint_text_3$"
 hint_red_turban_rebellions_hint_text_1: "Le [GetSituationByKey('red_turban_rebellions').GetName] sono scoppiate in tutta $china$! [GetCountry('CHI').GetName] ha perso il favore dei cieli, l'instabilità ora governa il suo [GetCountry('CHI').GetFlavorRank]!"
# hint_red_turban_rebellions_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! [GetCountry('CHI').GetName] deve cercare di imporre [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')] su coloro che cercano di rompere il loro dominio.\n@arrow_bonus_tier_2! Il [GetInternationalOrganizationType('red_turban_rebels').GetName] può [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')] contro [GetCountry('CHI').GetNameWithNoTooltip].\n@arrow_bonus_tier_1! Il [GetCountry('CHI').GetLongName] subirà molti [events|e] unici mentre la sua terra viene usurpata da aspiranti conquistatori." #OLD
 hint_red_turban_rebellions_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! [GetCountry('CHI').GetName] must look to force [ShowPeaceTreatyTypeName('rtr_rein_in_rebellion')] upon those who seek to break away from their rule.\n@arrow_bonus_tier_2! The [GetInternationalOrganizationType('red_turban_rebels').GetName] can [ShowPeaceTreatyTypeName('rtr_demand_occupied_territories')] against [GetCountry('CHI').GetNameWithNoTooltip].\n@arrow_bonus_tier_1! The [GetCountry('CHI').GetLongName] will suffer many unique [events_with_icon|e] as their land is usurped by prospecting conquerors." #NEW
# hint_red_turban_rebellions_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo utilizzare molte [actions|e] uniche nel pannello della [situation|e] per aiutare a [integrate|e] le conquiste e mantenere un [control|e] elevato." #OLD
 hint_red_turban_rebellions_hint_text_3: "#T Extra Hints:#!\n@hint! We may utilize many unique [actions_with_icon|e] in the [situation_with_icon|e] panel to help [integrate_with_icon|e] conquests and maintain high [control_with_icon|e].\n@hint! If we win the situation and form [GetFormableCountry('CHI').GetName], we will automatically get [cores|e] in all of $china$." #NEW
 
 hint_red_turban_rebellions_diplomatic: "\"Una guerra incessante lascia poco spazio per chiacchiere e diplomazia...\""
 hint_red_turban_rebellions_administrative: "\"Sarebbe saggio utilizzare correttamente le azioni della situazione. Sono strumenti preziosi che ci aiuteranno a uscirne vittoriosi.\""
 hint_red_turban_rebellions_military: "\"Ora tutta $china$ sa che siamo qui!\""
 
 ###Rise of Timur
 hint_rise_of_timur: "[GetSituationByKey('rise_of_timur').GetNameWithNoTooltip]"
 hint_rise_of_timur_hint_text: "$hint_rise_of_timur_hint_text_1$\n\n$hint_rise_of_timur_hint_text_2$\n\n$hint_rise_of_timur_hint_text_3$"
 hint_rise_of_timur_hint_text_1: "Dalle profondità dell'[ShowSubContinentName('central_asia')] arriva il pallido volto della morte sotto forma di [GetCharacter('chg_timur_lame_borjigin').GetName] e del suo [GetCountry('TIM').GetFlavorRank]. Guai a coloro che resistono alle sue conquiste!"
# hint_rise_of_timur_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Finché [GetCharacter('chg_timur_lame_borjigin').GetName] è in vita, il suo [GetCountry('TIM').GetFlavorRank] beneficerà del [modifier|e] [ShowModifier('timmy_wants_to_play')].\n@arrow_bonus_tier_2! Il suddetto [modifier|e] permetterà a [GetCharacter('chg_timur_lame_borjigin').GetShortNameWithNoTooltip] di annettere automaticamente le [locations|e] assediate.\n@arrow_bonus_tier_1! Il [GetCountry('TIM').GetLongName] ottiene accesso a [casus_belli|e] unici." #OLD
 hint_rise_of_timur_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! As long as [GetCharacter('chg_timur_lame_borjigin').GetName] lives, [GetCharacter('chg_timur_lame_borjigin').GetHerHis] [GetCountry('TIM').GetFlavorRank] will benefit from the [ShowModifier('timmy_wants_to_play')] [modifier_with_icon|e].\n@arrow_bonus_tier_2! The aforementioned [modifier_with_icon|e] will allow [GetCharacter('chg_timur_lame_borjigin').GetShortNameWithNoTooltip] to automatically annex besieged [locations_with_icon|e].\n@arrow_bonus_tier_1! The [GetCountry('TIM').GetLongName] gains access to unique [casus_belli_with_icon|e]." #NEW
# hint_rise_of_timur_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! [GetCountry('TIM').GetName] può utilizzare molte potenti [actions|e] nel pannello della [situation|e]." #OLD
 hint_rise_of_timur_hint_text_3: "#T Extra Hints:#!\n@hint! [GetCountry('TIM').GetName] may utilize many powerful [actions_with_icon|e] in the [situation_with_icon|e] panel." #NEW
 
 hint_rise_of_timur_diplomatic: "\"Forse si può ragionare con l'orda?\""
 hint_rise_of_timur_administrative: "\"Consideriamo di costruire fortificazioni per proteggere i nostri confini.\""
 hint_rise_of_timur_military: "\"[GetCountry('TIM').GetName] dipende da un potente esercito di cavalieri infernali, una storia di conquista e una fame di spalancare le loro mascelle e inghiottire tutta l'[ShowContinentName('asia')]!\""
 
 ### Nanbokuchou
 hint_nanbokuchou: "[GetSituationByKey('nanbokuchou').GetNameWithNoTooltip]"
 hint_nanbokuchou_hint_text: "$hint_nanbokuchou_hint_text_1$\n\n$hint_nanbokuchou_hint_text_2$\n\n$hint_nanbokuchou_hint_text_3$"
# hint_nanbokuchou_hint_text_1: "Il [GetSituationByKey('nanbokuchou').GetName] è una [situation|e] che divide [ShowRegionName('japan_region')] in Corti Imperiali in competizione, le linee del Nord e del Sud, ognuna in cerca di legittimità. I Clan devono scegliere da che parte stare, poiché questo conflitto rimodellerà l'intera nazione insulare." #OLD
 hint_nanbokuchou_hint_text_1: "The [GetSituationByKey('nanbokuchou').GetName] is a [situation_with_icon|e] that divides [ShowRegionName('japan_region')] into competing Imperial Courts, the Northern and Southern lines, each seeking legitimacy. Clans must choose sides, as this conflict will reshape the entire island nation." #NEW
# hint_nanbokuchou_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Usate il [casus_belli|e] unico [ShowCasusBelliName('cb_nanbokuchou')] per muovere guerra per il vostro pretendente Imperiale scelto.\n@arrow_bonus_tier_2! Espandete la vostra influenza di Clan con [ShowPeaceTreatyTypeName('peace_expand_clan_influence')] per prendere [locations|e] nemiche.\n@arrow_bonus_tier_1! Se vittoriosi, costringete la corte rivale ad abdicare usando [ShowPeaceTreatyTypeNameWithNoTooltip('peace_nanbokuchou_force_imperial_abdication')] e assicurate la supremazia al vostro Imperatore preferito." #OLD
 hint_nanbokuchou_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Use the unique [ShowCasusBelliName('cb_nanbokuchou')] [casus_belli_with_icon|e] to wage war for your chosen Imperial claimant.\n@arrow_bonus_tier_2! You can force the rival court to abdicate by using the [ShowPeaceTreatyTypeName('peace_nanbokuchou_force_imperial_abdication')] [peace_treaty|e] and secure supremacy for your preferred Emperor.\n@arrow_bonus_tier_2! Use the [ShowUnitAbilityName('raid_clan_holdings')] and [ShowUnitAbilityName('raid_imperial_family_holdings')] [unit_abilities|e] to gain [war_score|e]\n@arrow_bonus_tier_1! Expand your Clan influence with [ShowPeaceTreatyTypeName('peace_expand_clan_influence')] to seize enemy [locations_with_icon|e]." #NEW
 hint_nanbokuchou_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il tempismo è cruciale. I Clan più piccoli possono usare il conflitto per ottenere influenza sui rivali.\n@hint! Considerate l'equilibrio di potere prima di schierarvi."
 
 hint_nanbokuchou_diplomatic: "\"Questa è più di una guerra di spade. La nostra scelta di pretendente definirà la nostra eredità.\""
 hint_nanbokuchou_administrative: "\"Mantenere l'ordine schierandosi con una corte o l'altra è una sfida, ma potrebbe garantirci un'influenza ineguagliabile sull'istituzione Imperiale.\""
 hint_nanbokuchou_military: "\"Colpite con decisione e rivendicate il manto della legittimità prima che i nostri rivali possano consolidare il loro potere.\""

 ### Sengoku
 hint_sengoku: "[GetSituationByKey('sengoku').GetNameWithNoTooltip]"
 hint_sengoku_hint_text: "$hint_sengoku_hint_text_1$\n\n$hint_sengoku_hint_text_2$\n\n$hint_sengoku_hint_text_3$"
# hint_sengoku_hint_text_1: "Il [GetSituationByKey('sengoku').GetName] è una [situation|e] che inghiotte [ShowRegionName('japan_region')] in una guerra quasi costante. I Clan lottano per la supremazia mentre il $JAPANESE_SHOGUNATE_LEADER_MALE$ lotta per mantenere il controllo sul Paese." #OLD
 hint_sengoku_hint_text_1: "The [GetSituationByKey('sengoku').GetName] is a [situation_with_icon|e] that engulfs [ShowRegionName('japan_region')] in near constant war. Clans fight for supremacy while the $JAPANESE_SHOGUNATE_LEADER_MALE$ struggles to maintain control over the country." #NEW
# hint_sengoku_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Muovete guerra con il [casus_belli|e] unico [ShowCasusBelliName('cb_sengoku')] per espandere il vostro Clan.\n@arrow_bonus_tier_2! Come $JAPANESE_SHOGUNATE_LEADER_MALE$, usate [ShowGenericActionName('sengoku_revoke_clans_land')] per indebolire i Clan troppo cresciuti e [ShowGenericActionName('sengoku_limit_clans_autonomy')] per trasformarli in un [building_based|e].\n@arrow_bonus_tier_1! Se siete un [building_based|e], potete proclamare l'indipendenza e diventare un [location_based|e] con [ShowGenericActionName('sengoku_proclaim_clan_independence')]." #OLD
 hint_sengoku_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Wage war with the unique [ShowCasusBelliName('cb_sengoku')] [casus_belli_with_icon|e] to expand your Clan.\n@arrow_bonus_tier_2! As $JAPANESE_SHOGUNATE_LEADER_MALE$, use [ShowGenericActionName('sengoku_revoke_clans_land')] to weaken overgrown Clans and [ShowGenericActionName('sengoku_limit_clans_autonomy')] to turn them into a [building_based_with_icon|e].\n@arrow_bonus_tier_1! If you are a [building_based_with_icon|e], you may proclaim independence and become a [location_based_with_icon|e] with [ShowGenericActionName('sengoku_proclaim_clan_independence')]." #NEW
 hint_sengoku_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! L'equilibrio di potere si sposta costantemente. Cercate opportunità per colpire i Clan indeboliti.\n@hint! Come $JAPANESE_SHOGUNATE_LEADER_MALE$, consolidare il controllo precocemente renderà molto più facile l'unificazione di [ShowRegionName('japan_region')].\n@hint! I Clan più piccoli possono trarre beneficio mettendo i rivali più grandi l'uno contro l'altro fino al momento giusto per liberarsi."
 
 hint_sengoku_diplomatic: "\"Le alleanze cambieranno rapidamente. Scegliete gli amici con attenzione, poiché potrebbero essere i nemici di domani.\""
 hint_sengoku_administrative: "\"È necessaria una forte governance per impedire che il regno crolli nel caos.\""
 hint_sengoku_military: "\"Questa è l'era della spada. Colpite rapidamente e colpite duro o sarete consumati dagli altri.\""
 
 
 
 ##### Disaster Hints #####
 swift_end_string: "Come per ogni disastro, una rapida conclusione è spesso la più desiderabile, poiché le questioni in sospeso possono portare a esiti sfortunati."
 disaster_war_hint: "È meglio tenere a mente che alcuni dei nostri vicini non desiderano una tregua o un'alleanza durante i nostri tempi turbolenti, poiché cercano opportunità espansionistiche a nostre spese."
 
 ###Coup
 hint_coup_attempt: "Suggerimenti $coup_attempt$"
 hint_coup_attempt_hint_text: "$hint_coup_attempt_hint_text_1$\n\n$hint_coup_attempt_hint_text_2$\n\n$hint_coup_attempt_hint_text_3$"
# hint_coup_attempt_hint_text_1: "All'interno della nostra [court|e], uomini e donne ambiziosi cercano potere oltre i loro mezzi, utilizzando metodi illeciti per piazzare burattini sul nostro trono, dettare [laws|e] e assicurare [privileges|e] per sé stessi. Questo [disaster|e] persisterà finché i cospiratori non se ne andranno, il loro leader non si impadronirà del trono, o non otterremo sufficiente [legitimacy|e]. $swift_end_string$" #OLD
 hint_coup_attempt_hint_text_1: "Within our [court_with_icon|e], ambitious men and women seek power beyond their means, using illicit methods to place puppets on our throne, dictate [laws_with_icon|e], and secure [privileges_with_icon|e] for themselves. This [disaster_with_icon|e] will persist until the conspirators are gone, their leader seizes the throne, or we attain sufficient [legitimacy_with_icon|e]. $swift_end_string$" #NEW
# hint_coup_attempt_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo scegliere di [ShowGenericActionName('conduct_investigation')]. Ciò potrebbe richiedere del tempo, ma smaschererà alcuni dei cospiratori, portandoVici vicini a epurare i loro ranghi.\n@arrow_bonus_tier_2! Mantenete alta la nostra [stability|e]. Più è alta, più bassa sarà la soglia di [legitimacy|e] necessaria per la conclusione di questo [disaster|e].\n@arrow_bonus_tier_1! Se i tempi dovessero diventare più disperati, possiamo scegliere di [ShowGenericActionName('call_private_council')] o [ShowGenericActionName('execute_court_member')]. La prima [action|e] ci permetterà di fare affidamento sui nostri [estates|e] per stanare i cospiratori in cambio di [privileges|e] o [gold|e]. La seconda [action|e] ci permetterà di giustiziare qualsiasi [character|e] nella nostra [court|e] se li sospettiamo di far parte della cospirazione." #OLD
 hint_coup_attempt_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We may opt to [ShowGenericActionName('conduct_investigation')]. This may take some time but it will uncover some of the conspirators, leading us close to purging their ranks.\n@arrow_bonus_tier_2!Keep our [stability_with_icon|e] high. The higher it is, the lower the threshold of necessary [legitimacy_with_icon|e] will be, for the conclusion of this [disaster_with_icon|e].\n@arrow_bonus_tier_1! Should times become more desperate, we may choose to either [ShowGenericActionName('call_private_council')] or [ShowGenericActionName('execute_court_member')]. The former will allow us to depend on our [estates_with_icon|e] to flush out the conspirators in exchange for [privileges_with_icon|e] or [gold_with_icon|e]. The latter [action_with_icon|e] will allow us to execute any [character_with_icon|e] in our [court_with_icon|e] should we suspect them of being a member of the conspiracy." #NEW
# hint_coup_attempt_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potremmo ricevere [events|e] casuali durante questo [disaster|e] che indicheranno potenziali cospiratori. Sarebbe saggio esaminare ciascuno di essi e prendere una decisione informata. Sarebbe subottimale che il nostro miglior [cabinet_member|e] perdesse la testa senza motivo." #OLD
 hint_coup_attempt_hint_text_3: "#T Extra Hints:#!\n@hint! We may receive random [events_with_icon|e] during this [disaster_with_icon|e] that will point towards potential conspirators. It would be wise to examine each one and make an informed decision. It would be suboptimal for our best [cabinet_member_with_icon|e] to lose their head for no reason." #NEW
 
# hint_coup_attempt_diplomatic: "\"Ora è il momento di riaffermare le nostre relazioni con i Paesi vicini e stabilire un confine forte. L'ultima cosa di cui abbiamo bisogno è un pericolo all'esterno, oltre che all'interno.\"" #OLD
 hint_coup_attempt_diplomatic: "\"Now is the time to reaffirm our relations with our neighbor [countries_with_icon|e] and establish a strong border. The last thing we need is danger on the exterior, as well as the interior.\"" #NEW
 hint_coup_attempt_administrative: "\"Uno degli altri consiglieri potrebbe essere un cospiratore. Non lo sapremo mai!\""
 hint_coup_attempt_military: "\"$disaster_war_hint$ Ricordate, un attacco preventivo è solo un #italic trattato di pace a sorpresa#! consegnato con molta forza.\""

 ###Crisis of the Chinese Dynasty
 hint_crisis_of_the_chinese_dynasty: "Suggerimenti $crisis_of_the_chinese_dynasty$"
 hint_crisis_of_the_chinese_dynasty_hint_text: "$hint_crisis_of_the_chinese_dynasty_hint_text_1$\n\n$hint_crisis_of_the_chinese_dynasty_hint_text_2$"
# hint_crisis_of_the_chinese_dynasty_hint_text_1: "I cieli un tempo Ci hanno graziato con luce e prosperità. Tuttavia, eventi recenti, carestie e devastazioni hanno portato all'introduzione di un'era oscura per il nostro regno su $china$. Questo [disaster|e] persisterà finché non lo supereremo attraverso una riforma persistente della nostra amministrazione o perderemo il nostro seggio a capo del [GetUniqueInternationalOrganization('middle_kingdom').GetName]. $swift_end_string$" #OLD
 hint_crisis_of_the_chinese_dynasty_hint_text_1: "The heavens once graced us with light and prosperity. However, recent events, famines, and devastation have led to the introduction of a dark era for our reign over $china$. This [disaster_with_icon|e] will persist until we either rise above it through persistent reformation of our administration or we lose our seat at the head of the [GetUniqueInternationalOrganization('middle_kingdom').GetName]. $swift_end_string$" #NEW
# hint_crisis_of_the_chinese_dynasty_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo scegliere di [ShowCabinetActionName('reform_taxation_system')] attraverso il nostro [cabinet|e]. Ciò potrebbe richiedere del tempo ma ci indirizzerà sulla giusta via per porre fine a questo [disaster|e].\n@arrow_bonus_tier_2! Mantenete alta la nostra [celestial_authority_gc|e]. Se dovesse raggiungere un valore di #G 90#! o superiore, il [disaster|e] si concluderà pacificamente.\n@arrow_bonus_tier_1! Il [disaster|e] abilita molte nuove [actions|e] come [ShowGenericActionName('cmd_reform_the_cabinet')], [ShowGenericActionName('cmd_restore_stability')] e [ShowGenericActionName('cmd_strengthen_crown')]. Tutte queste offrono un modo alternativo per concludere positivamente questo periodo turbolento, nel caso in cui non riusciamo a innalzare sufficientemente la nostra [celestial_authority_gc|e]." #OLD
 hint_crisis_of_the_chinese_dynasty_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We may opt to [ShowCabinetActionName('reform_taxation_system')] through our [cabinet_with_icon|e]. This may take some time but it will set us on a good path to ending this [disaster_with_icon|e].\n@arrow_bonus_tier_2!Keep our [celestial_authority_gc_with_icon|e] high. Should it reach a value of #G 90#! or higher, the [disaster_with_icon|e] will conclude peacefully.\n@arrow_bonus_tier_1! The [disaster_with_icon|e] enables many new [actions_with_icon|e] such as [ShowGenericActionName('cmd_reform_the_cabinet')], [ShowGenericActionName('cmd_restore_stability')], and [ShowGenericActionName('cmd_strengthen_crown')]. All of these offer an alternative way to positively end this turbulent period, in case we cannot raise our [celestial_authority_gc_with_icon|e] high enough." #NEW
 
# hint_crisis_of_the_chinese_dynasty_diplomatic: "\"Ora è il momento di riaffermare le nostre relazioni con i [countries|e] che fanno parte del [GetUniqueInternationalOrganization('middle_kingdom').GetName], in modo da assicurare la sopravvivenza di questa grande istituzione.\n\nSenza sentimenti di rispetto, cosa c'è per distinguere gli uomini dalle bestie?\"" #OLD
 hint_crisis_of_the_chinese_dynasty_diplomatic: "\"Now is the time to reaffirm our relations with [countries_with_icon|e] that are part of the [GetUniqueInternationalOrganization('middle_kingdom').GetName], so as to ensure the survival of this great institution.\n\nWithout feelings of respect, what is there to distinguish men from beasts?\"" #NEW
# hint_crisis_of_the_chinese_dynasty_administrative: "\"Se decidiamo di porre fine a questo [disaster|e] riformando la nostra amministrazione, è saggio assegnare questi compiti monumentali a [cabinet_members|e] capaci.\n\nChi non risparmierà dovrà agonizzare.\"" #OLD
 hint_crisis_of_the_chinese_dynasty_administrative: "\"Should we decide to end this [disaster_with_icon|e] through reforming our administration, it is wise to assign these monumental tasks to capable [cabinet_members_with_icon|e].\n\nHe who will not economize will have to agonize.\"" #NEW
 hint_crisis_of_the_chinese_dynasty_military: "\"$disaster_war_hint$\n\nNel mezzo del caos, c'è anche opportunità!\""
 hint_turmoil_in_brandenburg: "$turmoil_in_brandenburg$" 
 hint_turmoil_in_brandenburg_hint_text: "$hint_turmoil_in_brandenburg_hint_text_1$\n\n$hint_turmoil_in_brandenburg_hint_text_2$\n\n$hint_turmoil_in_brandenburg_hint_text_3$\n\n$hint_turmoil_in_brandenburg_hint_text_4$" 
 hint_turmoil_in_brandenburg_hint_text_1: "Il Disastro $turmoil_in_brandenburg$ ci pone due problemi da affrontare. Innanzitutto, dobbiamo consolidare la nostra dinastia regnante aumentando il punteggio degli investimenti a 100 oppure chiedere all'Imperatore del Sacro Romano Impero di insediare una nuova dinastia sul nostro trono, nel caso in cui raggiungiamo un punteggio di -100 in Negligenza. Dopo il 1365, i Baroni Ladri appariranno più frequentemente nelle nostre [provinces|e] e devasteranno il territorio. Una volta che una parte sufficiente del nostro Paese (il 75% delle [provinces] di nostra proprietà) è stato liberato dal terrore dei Baroni Ladri attraverso l'[cabinet_action|e] $pru_deal_with_robber_barons$, il disastro potrà finire." 
 hint_turmoil_in_brandenburg_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! Aumenta il tuo punteggio in Investimenti o Negligenza attraverso gli eventi legati al disastro\n@arrow_bonus_tier_1! Espandi con cautela il tuo territorio per non concedere ai Baroni Ladri nuove terre in cui espandersi." 
 hint_turmoil_in_brandenburg_hint_text_3: "#T Suggerimenti Extra:#!Ritrova il [control] perduto con l'[cabinet_action] adeguata\n@hint! Trova [alliances|e] che sono in grado di aiutarti in un potenziale [civil_war|e]" 
 hint_turmoil_in_brandenburg_hint_text_4: "#T Come ottenere risultati dinastici diversi:#!\n@hint!Manterrai l'attuale dinastia regnante realizzando un $bra_wittelsbacher_investment_var$ di 100\n@hint! Potrai ottenere la dinastia degli Hohenzollern con $bra_wittelsbacher_neglect_var$ di -100 quando l'Imperatore ha un erede adulto. Una volta che quel personaggio governerà entrambi i paesi come Imperatore del Sacro Romano Impero, potrà mettere un membro della dinastia degli Hohenzollern sul tuo trono." 
 
 
