 tribal_cohesion_topbar_hint: "$legitimacy_topbar_hint$"
 GOLD_VIEW_HINT: "Visualizza consigli sul deficit"
 ###
 hint_in_deficit: "Bilancio Negativo"
 hint_in_deficit_hint_text: "$hint_in_deficit_hint_text_1$\n\n$hint_in_deficit_hint_text_2$\n\n$hint_in_deficit_hint_text_3$"
 hint_in_deficit_hint_text_1: "Abbiamo un bilancio negativo. Se non stiamo attenti, ciò potrebbe portare a debiti o persino alla bancarotta."
# hint_in_deficit_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Vai al @economy_panel![Link('economy', '', 'lateralview_economy_entry_name')] per vedere le [income|e] e le [expenses|e]. Puoi muovere i cursori per aumentare le [taxes|e] o abbassare i costi.\n@arrow_bonus_tier_2! Assicurati che tutti gli [buildings|E] siano redditizi, oppure costruiscine di nuovi se possiamo sostenerli. Puoi farlo nel @production_panel![Link('production', '', 'lateralview_production_entry_name')].\n@arrow_bonus_tier_2! Gestire o sfruttare i [estates|E] può anche fornire guadagni significativi a breve o a lungo termine. Bisogna essere consapevoli che i ceti possono anche detenere un significativo potere politico e fare troppo affidamento su di esse può essere rischioso. Lo trovi nel @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]\n@arrow_bonus_tier_1! Stabilire [trades|E] redditizi è anche un'ottima fonte di entrate. Esamina le rotte commerciali esistenti o potenziale nel @economy_panel![Link('trade', '', 'lateralview_trade_entry_name')]" #OLD
 hint_in_deficit_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Go to the @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] to see our [income_with_icon|e] and [expenses]. You can move the sliders to raise [taxes_with_icon|e] or lower costs.\n@arrow_bonus_tier_2! Ensure that all our [buildings_with_icon|E] are profitable, or build more if we can support them. You can do this in the @production_panel! [Link('production', '', 'lateralview_production_entry_name')].\n@arrow_bonus_tier_2! Managing or leveraging your [estates_with_icon|E] can also provide significant gains in the short or long term. Be aware that the estates can also hold significant political might, and relying too heavily on them may be risky. You will find them in the @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')]\n@arrow_bonus_tier_1! Setting up profitable [trades_with_icon|E] is also a great source of income. Browse existing or potential trade routes in the @economy_panel! [Link('trade', '', 'lateralview_trade_entry_name')]" #NEW
# hint_in_deficit_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! [laws|E], [reforms|E], [diplomacy|E] e altro ancora possono anche fornire opzioni per risolvere un bilancio negativo." #OLD
 hint_in_deficit_hint_text_3: "#T Extra Hints:#!\n@hint! [laws_with_icon|E], [reforms_with_icon|E], [diplomacy_with_icon|E], and more can also give you options to solve a negative balance." #NEW
 hint_in_deficit_military: "\"La guerra può essere costosa nel breve termine, ma se avremo successo potremo farla pagare ai nostri nemici. Conquistare territori potrebbe darci guadagni a lungo termine, ed estorcere i nostri nemici può fornire un afflusso di ricchezza a breve termine.\""
 hint_in_deficit_explorer: "\"Il grande ignoto sarà di certo pieno di ricchezze, maturo per lo sviluppo e il saccheggio.\""
 hint_in_deficit_administrative: "\"Stabilire il dominio nei nostri mercati interni sarebbe un ottimo modo per sviluppare la nostra ricchezza. Se ci sentiamo ancora più ambiziosi, stabilire punti d'appoggio nei mercati esteri può guidare la crescita ancora di più.\""
 hint_in_deficit_diplomatic: "\"Come dice il proverbio, dobbiamo spendere denaro per fare denaro! Assicurarsi che i nostri edifici e pop siano redditizi è il modo migliore per invertire la rotta.\""
 ###
 hint_cultural_capacity: "Superamento della Capacità Culturale"
 hint_cultural_capacity_hint_text: "$hint_cultural_capacity_hint_text_1$\n\n$hint_cultural_capacity_hint_text_2$\n\n$hint_cultural_capacity_hint_text_3$"
# hint_cultural_capacity_hint_text_1: "Sebbene il multiculturalismo possa offrire molti benefici, le nazioni impreparate per gli oneri amministrativi e prive di [cultural_capacity|E] subiranno penalità. Il [pops|E] appartenente a [cultures|E] diverse dalla [primary_culture|E] sarà di norma considerati come [non_accepted_culture_short|E], ma potrà diventare [tolerated_culture_short|E] o [accepted_culture_short|E] a un certo costo." #OLD
 hint_cultural_capacity_hint_text_1: "While multiculturalism can offer many benefits, nations that are unready for the administrative burdens and lack [cultural_capacity_with_icon|E] will suffer penalties. [pops_with_icon|E] belonging to [cultures_with_icon|E] other than our [primary_culture_with_icon|E] will ordinarily begin as [non_accepted_culture_short_with_icon|E], but can be [tolerated_culture_short_with_icon|E] or [accepted_culture_short_with_icon|E] for a cost." #NEW
# hint_cultural_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considera la possibilità di declassare una cultura meno importante strategicamente per ridurne i costi.\n@arrow_bonus_tier_2! Ci sono fonti di [ShowModifierTypeName('cultures_capacity')], che si trovano comunemente nelle [government_reforms|E] e nei [advances|E]." #OLD
 hint_cultural_capacity_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Consider demoting a less strategically important culture to reduce the costs.\n@arrow_bonus_tier_2! There are sources of [ShowModifierTypeName('cultures_capacity')], commonly found in [government_reforms_with_icon|E] and [advances_with_icon|E]." #NEW
# hint_cultural_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! L'[assimilation|e] può anche aiutare a ridurre il numero di culture in un paese." #OLD
 hint_cultural_capacity_hint_text_3: "#T Extra Hints:#!\n@hint! [assimilation_with_icon|e] can also help reduce the amount of cultures in a country." #NEW
 hint_cultural_capacity_military: "\"Sfruttare al massimo le nostre culture è vitale per generare tradizione culturale e influenza — dandoci un vantaggio in caso di conflitto culturale. Aumentare i diritti delle culture straniere ci concederà anche leve e soldati aggiuntivi.\""
 hint_cultural_capacity_administrative: "\"La nostra cultura si esprime anche attraverso le meravigliose opere d'arte prodotte dagli artisti della nostra nazione. Dopotutto, cos'è una nazione se non la somma della sua influenza sul mondo?\""
 hint_cultural_capacity_diplomatic: "\"Con il tempo, le culture straniere potrebbero assimilarsi per avvicinarsi alla nostra cultura primaria in [GetPlayer.GetNameWithNoTooltip]! Chi non vorrebbe essere [GetPlayer.GetCulture.GetNameWithNoTooltip]?\""
 ###
 hint_unhappy_estates: "Ceti Scontenti"
 hint_unhappy_estates_hint_text: "$hint_unhappy_estates_hint_text_1$\n\n$hint_unhappy_estates_hint_text_2$\n\n$hint_unhappy_estates_hint_text_3$"
 hint_unhappy_estates_hint_text_1: "Mantenere soddisfatti i [estates_with_icon|e] è una parte importante e quotidiana della gestione di un Paese. Insieme, essi rappresentano una quota significativa della potenza economica e militare del paese.\n\nOgni [estate] sleale infliggerà penalità al [country] e renderà i [pops_with_icon|e] che lo costituiscono molto propensi a unirsi alle [rebellions_with_icon|e]."
# hint_unhappy_estates_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! La loro produzione e la [estate_satisfaction_short|E] possono essere gestite concedendo o revocando privilegi nel @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Anche aumentare e abbassare le tasse nel @economy_panel![Link('economy', '', 'lateralview_economy_entry_name')] influenzerà il loro grado di soddisfazione." #OLD
 hint_unhappy_estates_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Their output and [estate_satisfaction_short_with_icon|E] can be managed by granting or revoking privileges in the @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Raising and lowering taxes in the @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] will also affect their satisfaction." #NEW
# hint_unhappy_estates_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il [parliament|e] può anche essere usato per aiutare a gestire la [estate_satisfaction|e].\n@hint! Impara di più sui [rebel_movements_with_icon] nel [Link('hints', 'selected_hint = hint_rebels_growing', '$hint_rebels_growing$')]." #OLD
 hint_unhappy_estates_hint_text_3: "#T Extra Hints:#!\n@hint! The [parliament_with_icon|e] can also be used to help manage [estate_satisfaction_with_icon|e].\n@hint! Learn more about [rebel_movements_with_icon] in the [Link('hints', 'selected_hint = hint_rebels_growing', 'Rebels Hint')]." #NEW
 hint_unhappy_estates_administrative: "\"I ceti sono assolutamente vitali per un sano impero commerciale. Sì, potremmo dover rinunciare a una certa autorità nel lungo periodo, ma pensate all'economia!\""
 hint_unhappy_estates_diplomatic: "\"I nostri ceti possono persino avere opinioni su questioni diplomatiche. Potrebbe valere la pena considerare la loro valutazione di una potenza straniera quando si valutano alleanze o patti.\""
 hint_unhappy_estates_military: "\"I nostri ceti forniscono leve importantissime per alimentare l'espansione. Se non le manteniamo dalla nostra parte, potremmo trovarci con un deficit di reclute proprio quando ne avremo bisogno.\""
 ESTATE_CONTEXT_TEXT: "Nel tuo Paese, i seguenti ceti sono scontenti: $LIST$\n\n$TEXT$"
 HINT_UNHAPPY_ESTATE: "[ESTATE.GetName]"
 ###
 hint_manpower: "Riserve"
 hint_manpower_hint_text: "$hint_manpower_hint_text_1$\n\n$hint_manpower_hint_text_2$\n\n$hint_manpower_hint_text_3$"
# hint_manpower_hint_text_1: "Le nostre [manpower|e] rappresentano gli uomini pronti a essere reclutati come [regulars|e] per i nostri [armies|e]. I Regolari sono nettamente superiori alle [levies|e] in [battle|e], ma sono costosi, quindi non tutti i [country|e] possono permetterseli all'inizio del gioco." #OLD
 hint_manpower_hint_text_1: "Our [manpower_with_icon|e] is our reserve of men ready to be recruited as [regulars_with_icon|e] for our [armies_with_icon|e]. Regulars are vastly superior to [levies_with_icon|e] in [battle_with_icon|e], but they are expensive, so not every [country_with_icon|e] can afford them at the beginning of the game." #NEW
# hint_manpower_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Se facciamo affidamento sui [regulars] per condurre una guerra, avere poche [manpower] limita severamente la nostra capacità di rifornire i nostri [armies|e], per cui non è saggio dichiarare [war|E] in queste circostanze.\n@arrow_bonus_tier_2! Se stiamo esaurendo le Riserve durante una guerra, è possibile fare maggior uso delle [levies|E], ingaggiare [mercenaries|E], o persino considerare di chiedere la [peace|E]." #OLD
 hint_manpower_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! If we are relying on [regulars] to wage war, having low [manpower] severely limits our ability to replenish our [armies_with_icon|e], so it is not wise to declare [war_with_icon|E] while we have low manpower\n@arrow_bonus_tier_2! If we are running out of manpower while at war, think about making greater use of [levies_with_icon|E], hiring [mercenaries_with_icon|E], or even consider suing for [peace_with_icon|E]." #NEW
# hint_manpower_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo aumentare le Riserve massime della nostra nazione e la capacità di reclutare un esercito permanente con vari [buildings|E].\n@hint! Anche i [estate_privileges|E] e le [laws|E] possono influenzare il nostro potenziale di Riserve." #OLD
 hint_manpower_hint_text_3: "#T Extra Hints:#!\n@hint! We can develop our nation's maximum manpower and ability to recruit a standing army with various [buildings_with_icon|E].\n@hint! [estate_privileges_with_icon|E] and [laws_with_icon|E] can also impact our manpower potential." #NEW
 hint_manpower_diplomatic: "\"Un esercito permanente d'élite, composto da bravi uomini e ragazzi [GetPlayer.Custom('IT_ADJ_MP')], è probabilmente la forza combattente più efficace, uomo per uomo.\""
 hint_manpower_military: "\"La conquista dovrebbe utilizzare ogni strumento a nostra disposizione. Un esercito di vasta portata dovrebbe utilizzare mercenari, contingenti e truppe regolari allo stesso modo.\""
 hint_manpower_administrative: "\"Ricordate solo che ogni soldato che muore sul campo di battaglia è un bracciante in meno a faticare nei campi. La guerra è costosa.\""
 ###
 hint_low_stability: "Stabilità Bassa"
 hint_low_stability_hint_text: "$hint_low_stability_hint_text_1$\n\n$hint_low_stability_hint_text_2$\n\n$hint_low_stability_hint_text_3$"
# hint_low_stability_hint_text_1: "Se la nostra [stability|E] è bassa, corriamo un rischio crescente che i [pops|E] si uniscano a una [rebellion|E], che l'insoddisfazione dei [estates|E] conduca a una [civil_war|E] e che si verifichi uno stato generale di disordini nella nostra nazione." #OLD
 hint_low_stability_hint_text_1: "If our [stability_with_icon|E] is low, we run an increasing risk of [pops_with_icon|E] joining a [rebellion_with_icon|E], [estate_with_icon|E] dissatisfaction leading to [civil_war_with_icon|E], and a general state of turmoil in our nation." #NEW
# stability_raise_actions: "@arrow_bonus_tier_3! Investire più [budget|e] nella stabilità.\n@arrow_bonus_tier_2! Chiedere al [cabinet|e] di [ShowCabinetActionName('stabilize_country')]\n@arrow_bonus_tier_1! Aumentare il numero di [ShowPopTypeName('clergy')] [GetPlayer.GetReligion.Custom('IT_REL_MP')]." #OLD
 stability_raise_actions: "@arrow_bonus_tier_3! Investing more of the [budget_with_icon|e] on stability.\n@arrow_bonus_tier_2! Instructing the [cabinet_with_icon|e] to [ShowCabinetActionName('stabilize_country')]\n@arrow_bonus_tier_1! Increasing the amount of [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')]." #NEW
 hint_low_stability_hint_text_2: "#T Azioni Raccomandate:#!\n$stability_raise_actions$"
# hint_low_stability_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ci sono alcune altre fonti di stabilità, come i [advances|e] o le [policies|e].\n@hint! Ricorda che la stabilità è anche consumata da alcune azioni importanti come dichiarare [wars|E] senza un appropriato [casus_belli|e] o cambiare una [law|e]." #OLD
 hint_low_stability_hint_text_3: "#T Extra Hints:#!\n@hint! There are some other sources of stability, like [advances_with_icon|e] or [policies_with_icon|e].\n@hint! Remember that stability is also consumed by some important actions such as declaring [wars_with_icon|E] without a proper [casus_belli_with_icon|e] or changing a [law_with_icon|e]." #NEW
 hint_low_stability_administrative: "\"Una nazione con alta stabilità è, ovviamente, una nazione in stato di prosperità! Quando i raccolti sono abbondanti, anche il flusso di ricchezza nelle nostre casse lo è.\""
 hint_low_stability_military: "\"Una nazione non può esercitare in sicurezza il dominio senza prima assicurarsi la pacificazione della sua popolazione. La gente comune ama tanto i suoi forconi...\""
 hint_low_stability_diplomatic: "\"I nostri vicini cominceranno a guardarci con aria di superiorità se facciamo precipitare il nostro paese nella rovina. Potremmo forse fare qualcosa al riguardo?\""
 ###
 hint_very_low_stability: "Stabilità Estremamente Bassa"
 hint_very_low_stability_hint_text: "$hint_very_low_stability_hint_text_1$\n\n$hint_very_low_stability_hint_text_2$\n\n$hint_very_low_stability_hint_text_3$"
# hint_very_low_stability_hint_text_1: "La nostra [stability|E] è estremamente bassa e corriamo il grave rischio che i [pops|E] si uniscano a una [rebellion|E], che l'insoddisfazione dei [estates|E] conduca a una [civil_war|E] e che i nostri nemici colgano l'opportunità di colpire mentre siamo deboli." #OLD
 hint_very_low_stability_hint_text_1: "Our [stability_with_icon|E] is extremely low, and we run a dire risk of [pops_with_icon|E] joining a [rebellion_with_icon|E], [estate_with_icon|E] dissatisfaction leading to [civil_war_with_icon|E], and our enemies seizing the opportunity to strike while we are weak." #NEW
# hint_very_low_stability_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dovremmo aumentare la stabilità il prima possibile ed evitare di dichiarare altre [wars|E] o di intraprendere ulteriori azioni che riducano la stabilità.\n$stability_raise_actions$" #OLD
 hint_very_low_stability_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We should increase stability as soon as possible, and avoid declaring any more [wars_with_icon|E] or taking further actions that reduce stability.\n$stability_raise_actions$" #NEW
 hint_very_low_stability_hint_text_3: "$hint_low_stability_hint_text_3$"
 hint_very_low_stability_administrative: "\"Come ci si può aspettare che qualcuno faccia affari in un'economia come questa? Qualcuno ci aiuti a mettere in ordine il bilancio, il nostro bestiame sta morendo di fame.\""
 hint_very_low_stability_military: "\"Qualsiasi nemico [GetPlayer.Custom('IT_Della')][GetPlayer.GetNameWithNoTooltip] sarebbe assolutamente entusiasta di quanto siamo deboli in questo momento. Dovremmo aspettarci che i nostri rivali e nemici stiano iniziando a tramare contro di noi.\""
 hint_very_low_stability_diplomatic: "\"Mentre una nazione in un periodo di alta stabilità sperimenta un'eccellente mobilità sociale, noi sembriamo aver inventato una sorta di demobilitazione sociale.\""
 ###
 hint_low_legitimacy: "Bassa Legittimità"
 hint_low_legitimacy_hint_text: "$hint_low_legitimacy_hint_text_1$\n\n$hint_low_legitimacy_hint_text_2$\n\n$hint_low_legitimacy_hint_text_3$"
# hint_low_legitimacy_hint_text_1: "La [legitimacy|E] rappresenta la visione che il mondo ha del diritto a governare del nostro [GetPlayer.GetGovernment.GetRulerTitle]. Se scende troppo, non solo rinunceremo a qualsiasi beneficio al [crown_power|E] e alla ridotta probabilità di [rebellion|E], ma inizieremo a subire penalità alla soddisfazione dei [estates|E] e alla [righteousness|E]." #OLD
 hint_low_legitimacy_hint_text_1: "[legitimacy_with_icon|E] represents the world's view of our [GetPlayer.GetGovernment.GetRulerTitle]'s entitlement to rule. If it falls too low, not only will we forgo any benefits to [crown_power_with_icon|E] and reduced chance of [rebellion_with_icon|E], but we will start receiving penalties to [estate_with_icon|E] satisfaction and [righteousness_with_icon|E]." #NEW
# hint_low_legitimacy_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dovremmo mirare a mantenere la nostra legittimità più alta possibile, per minimizzare qualsiasi potenziale penalità.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance|e] aiuterà a mantenere alta la [legitimacy|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [legitimacy|e] come i [advances|e] o le [policies|e].\n@arrow_bonus_tier_1! Seleziona l'[cabinet_action_with_icon|e] denominata [ShowCabinetActionName('strengthen_government')]." #OLD
 hint_low_legitimacy_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We should aim to keep our legitimacy as high as possible, to minimize any potential penalties.\n@arrow_bonus_tier_2! Increasing our [court_maintenance_with_icon|e] will help keep the [legitimacy_with_icon|e] high.\n@arrow_bonus_tier_2! We can also get other sources of [legitimacy_with_icon|e] like [advances_with_icon|e] or [policies_with_icon|e].\n@arrow_bonus_tier_1! Pick the [cabinet_action_with_icon|e] named [ShowCabinetActionName('strengthen_government')]." #NEW
# hint_low_legitimacy_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come la maggior parte dei valori importanti, ci vorrà tempo per creare una visione favorevole della tua [dynasty|E], quindi assicurati di pensare a lungo termine." #OLD
 hint_low_legitimacy_hint_text_3: "#T Extra Hints:#!\n@hint! Like most important values, it will take time to create a favorable view of your [dynasty_with_icon|E], so make sure to think long term." #NEW
 hint_low_legitimacy_administrative: "\"Chiunque controlli i registri della nostra ascendenza e la magnificenza della nostra corte non potrà negare il nostro diritto a governare.\""
 hint_low_legitimacy_military: "\"Come possiamo aspettarci che le nostre armate siano temute se i nostri stessi soldati dubitano della nostra leadership?\""
 hint_low_legitimacy_diplomatic: "\"A volte, la forza interiore può derivare da come gli altri ci percepiscono e i nostri alleati possono anche aiutarci nei momenti difficili.\""
 ###
 hint_low_republican_tradition: "Bassa Tradizione Repubblicana"
 hint_low_republican_tradition_hint_text: "$hint_low_republican_tradition_hint_text_1$\n\n$hint_low_republican_tradition_hint_text_2$\n\n$hint_low_republican_tradition_hint_text_3$"
# hint_low_republican_tradition_hint_text_1: "La [republican_tradition|E] rappresenta il punto d'appoggio del Repubblicanesimo all'interno della nostra [GetPlayer.GetGovernment.GetGovernmentType.GetName]. Se scende troppo, non solo perderemo i benefici per l'[legislative_efficiency|E] e la ridotta probabilità di [rebellion|E], ma inizieremo a subire gravi penalità al costo per aumentare la [stability|E]." #OLD
 hint_low_republican_tradition_hint_text_1: "[republican_tradition_with_icon|E] represents the foothold of Republicanism within our [GetPlayer.GetGovernment.GetGovernmentType.GetName]. If it falls too low, not only will we forgo any benefits to [legislative_efficiency_with_icon|E] and reduced chance of [rebellion_with_icon|E], but we will start receiving severe penalties to the cost of increasing [stability_with_icon|E]." #NEW
# hint_low_republican_tradition_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dobbiamo mirare a mantenere la nostra tradizione più alta possibile per minimizzare qualsiasi potenziale penalità.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance|e] aiuterà a mantenere alta la [republican_tradition|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [republican_tradition|e] come i [advances|e] o le [policies|e].\n@arrow_bonus_tier_1! Anche cambiare [ruler|e] durante un'[election|e] aiuterà a mantenere alta la [republican_tradition|e]." #OLD
 hint_low_republican_tradition_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We should aim to keep our tradition as high as possible to minimize any potential penalties.\n@arrow_bonus_tier_2! Increasing our [court_maintenance_with_icon|e] will help keep the [republican_tradition_with_icon|e] high.\n@arrow_bonus_tier_2! We can also get other sources of [republican_tradition_with_icon|e] like [advances_with_icon|e] or [policies_with_icon|e].\n@arrow_bonus_tier_1! Changing [ruler_with_icon|e] during an [election_with_icon|e] will also hep keep the [republican_tradition_with_icon|e] high." #NEW
 hint_low_republican_tradition_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come la maggior parte dei valori importanti, insegnare alla popolazione i valori del Repubblicanesimo è un'impresa a lungo termine, quindi pensa in anticipo."
 hint_low_republican_tradition_administrative: "\"Le elezioni sono un processo naturale di ogni repubblica sana.\""
 hint_low_republican_tradition_military: "\"Anche i mercenari non saranno disposti a combattere per noi se sembreremo dei tiranni.\""
 hint_low_republican_tradition_diplomatic: "\"Nessuna nazione che si vanti della propria forza si allineerà volontariamente a un Paese che ignora palesemente i principi della sua fondazione.\""
 ###
 hint_low_devotion: "Bassa Devozione"
 hint_low_devotion_hint_text: "$hint_low_devotion_hint_text_1$\n\n$hint_low_devotion_hint_text_2$\n\n$hint_low_devotion_hint_text_3$"
# hint_low_devotion_hint_text_1: "$game_concept_devotion_desc$ Se scende troppo, non solo perderemo i benefici per l'[religious_influence|E] e la ridotta probabilità di [rebellion|E], ma inizieremo a subire penalità alla soddisfazione dei [estates|E]." #OLD
 hint_low_devotion_hint_text_1: "$game_concept_devotion_desc$ If it falls too low, not only will we forgo any benefits to [religious_influence_with_icon|E] and reduced chance of [rebellion_with_icon|E], but we will start receiving penalties to [estate_with_icon|E] satisfaction." #NEW
# hint_low_devotion_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dobbiamo mirare a mantenere la nostra devozione più alta possibile per minimizzare qualsiasi potenziale penalità.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance|e] aiuterà a mantenere alta la [devotion|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [devotion|e] come i [advances|e] o le [policies|e]." #OLD
 hint_low_devotion_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We should aim to keep our devotion as high as possible in order to minimize any potential penalties.\n@arrow_bonus_tier_2! Increasing our [court_maintenance_with_icon|e] will help keep the [devotion_with_icon|e] high.\n@arrow_bonus_tier_2! We can also get other sources of [devotion_with_icon|e] like [advances_with_icon|e] or [policies_with_icon|e]." #NEW
 hint_low_devotion_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come la maggior parte dei valori importanti, promuovere lo zelo religioso non è un affare che si risolve in una notte, quindi assicurati di pensare a lungo termine."
 hint_low_devotion_administrative: "\"Non è sufficiente per noi rappresentare la fede e posare come suoi difensori, dobbiamo anche sembrare tali.\""
 hint_low_devotion_military: "\"Se i nostri eserciti devono rappresentare la spada e lo scudo dei fedeli, dobbiamo essere il faro per cui combattono.\""
 hint_low_devotion_diplomatic: "\"Dovrebbe essere nostro obiettivo diffondere la nostra fede il più lontano possibile, ma nessuno sarà disposto a credere alle nostre parole se non sembriamo pii.\""
 ###
 hint_low_horde_unity: "Bassa Unità dell'Orda"
 hint_low_horde_unity_hint_text: "$hint_low_horde_unity_hint_text_1$\n\n$hint_low_horde_unity_hint_text_2$\n\n$hint_low_horde_unity_hint_text_3$"
 hint_low_horde_unity_hint_text_1: "$game_concept_horde_unity_desc$"
# hint_low_horde_unity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Scacciare i nostri nemici davanti a noi è di gran lunga il metodo più efficace per unificare un'Orda.\n@arrow_bonus_tier_2! Aumentare il [court_maintenance|e] aiuterà a mantenere alta l'[horde_unity|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [horde_unity|e] come i [advances|e] o le [policies|e]." #OLD
 hint_low_horde_unity_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Driving our enemies before us is by far the most effective method of unifying a horde\n@arrow_bonus_tier_2! Increasing our [court_maintenance_with_icon|e] will help keep the [horde_unity_with_icon|e] high.\n@arrow_bonus_tier_2! We can also get other sources of [horde_unity_with_icon|e] like [advances_with_icon|e] or [policies_with_icon|e]." #NEW
 hint_low_horde_unity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ci potrebbero essere conseguenze devastanti se la nostra unità è troppo bassa, quindi faremmo meglio a mantenerla alta."
 hint_low_horde_unity_administrative: "\"Dividere e conquistare è una strategia ben nota. Se non saremo uniti, saremo noi a essere conquistati.\""
 hint_low_horde_unity_military: "\"Come dice il nostro proverbio: le cose buone arrivano a coloro che le strappano ai deboli. Il potere ci unisce e con il potere saremo uniti!\""
 hint_low_horde_unity_diplomatic: "\"La forza della nostra abilità di combattimento è direttamente influenzata da quanto siamo uniti come tribù. Il successo in guerra e nella conquista è una profezia che si autoavvera.\""
 ###
 hint_low_tribal_cohesion: "Bassa Coesione Tribale"
 hint_low_tribal_cohesion_hint_text: "$hint_low_tribal_cohesion_hint_text_1$\n\n$hint_low_tribal_cohesion_hint_text_2$\n\n$hint_low_tribal_cohesion_hint_text_3$"
# hint_low_tribal_cohesion_hint_text_1: "$game_concept_tribal_cohesion_desc$ A differenza di altri [government_types|E], quelli tribali beneficiano di dimensioni delle leve significativamente maggiori man mano che la coesione aumenta. Se vogliamo prendere decisioni militari efficaci, dovremo mantenere il sostegno delle tribù." #OLD
 hint_low_tribal_cohesion_hint_text_1: "$game_concept_tribal_cohesion_desc$ Unlike other [government_types_with_icon|E], tribal governments benefit from significantly increased levy sizes as cohesion increases. If we want to make effective military decisions, we will need to keep the tribes on board." #NEW
# hint_low_tribal_cohesion_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_2! Aumentare il [court_maintenance|e] aiuterà a mantenere alta la [tribal_cohesion|e].\n@arrow_bonus_tier_2! Possiamo anche ottenere altre fonti di [tribal_cohesion|e] come i [advances|e] o le [policies|e]." #OLD
 hint_low_tribal_cohesion_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_2! Increasing our [court_maintenance_with_icon|e] will help keep the [tribal_cohesion_with_icon|e] high.\n@arrow_bonus_tier_2! We can also get other sources of [tribal_cohesion_with_icon|e] like [advances_with_icon|e] or [policies_with_icon|e]." #NEW
 hint_low_tribal_cohesion_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ci potrebbero essere conseguenze devastanti se la nostra coesione è troppo bassa, quindi faremmo meglio a mantenerla alta."
 hint_low_tribal_cohesion_administrative: "\"Se la ignoriamo, la nostra coesione crollerà. Gestire un Paese richiede attenzione ai dettagli.\""
 hint_low_tribal_cohesion_military: "\"La scarsa coesione tribale ci rende deboli. La debolezza ci frattura ulteriormente. Non proseguiamo su quella strada, o potremmo ritrovarci conquistati e ridotti in schiavitù.\""
 hint_low_tribal_cohesion_diplomatic: "\"I ceti sono radicati in così tanti aspetti di un Paese che quasi ogni azione che intraprendiamo può avere conseguenze a lungo termine. La strategia richiede una pianificazione a lungo termine.\""
 ###
 hint_war_exhaustion: "Alta Stanchezza da Guerra"
 hint_war_exhaustion_hint_text: "$hint_war_exhaustion_hint_text_1$\n\n$hint_war_exhaustion_hint_text_2$\n\n$hint_war_exhaustion_hint_text_3$"
# hint_war_exhaustion_hint_text_1: "La [war_exhaustion|E] è un valore che rappresenta la stanchezza generale che la nostra popolazione prova a causa dell'essere in guerra. Alti livelli possono essere estremamente pericolosi per qualsiasi paese. Man mano che la stanchezza da guerra aumenta, ridurrà l'efficacia in combattimento del nostro [army|E] e delle [levies|E], la crescita dei nostri [pops|E] e rovinerà la nostra economia." #OLD
 hint_war_exhaustion_hint_text_1: "[war_exhaustion_with_icon|E] is a value that represents the overall weariness our population is feeling from being at war. High levels of war exhaustion can be extremely dangerous to any country. As war exhaustion increases, it will reduce the combat efficacy of our [army_with_icon|E] and [levies_with_icon|E], the growth of our [pops_with_icon|E], and ruin our economy." #NEW
# hint_war_exhaustion_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il metodo più efficace e garantito è la pace.\n@arrow_bonus_tier_2! Alcune [laws|E] e [estate_privileges|E] possono aiutare a ridurre la stanchezza da guerra nel tempo." #OLD
 hint_war_exhaustion_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! The most effective and guaranteed method is being at peace.\n@arrow_bonus_tier_2! Some [laws_with_icon|E] and [estate_privileges_with_icon|E] can help reduce war exhaustion over time." #NEW
# hint_war_exhaustion_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Dovremmo misurare le nostre conquiste e non dichiarare [wars|E] se abbiamo già un alta stanchezza da guerra." #OLD
 hint_war_exhaustion_hint_text_3: "#T Extra Hints:#!\n@hint! We should pace our conquests and not declare [wars_with_icon|E] if we are already at high war exhaustion." #NEW
 hint_war_exhaustion_administrative: "\"Le guerre decisive possono portare benefici, ma una popolazione stanca della guerra può solo essere una cosa negativa. La produzione diminuisce, il consumo diminuisce, francamente - tutto diminuisce!\""
 hint_war_exhaustion_military: "\"La stanchezza da guerra può essere pericolosa, ma è principalmente il risultato di tattiche scadenti. Perdite ingenti e sconfitte significative rivolteranno rapidamente il nostro popolo contro di noi.\""
 hint_war_exhaustion_diplomatic: "\"Perdere una guerra non è mai una cosa buona, ma subire un'amara sconfitta può anche mettere il nostro popolo in uno stato d'animo di vendetta. Il Revanscismo è un potente oppiaceo.\""
 ###
 hint_low_sailors: "Marinai"
 hint_low_sailors_hint_text: "$hint_low_sailors_hint_text_1$\n\n$hint_low_sailors_hint_text_2$\n\n$hint_low_sailors_hint_text_3$"
 hint_low_sailors_hint_text_1: "$game_concept_sailors_desc$"
# hint_low_sailors_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Se facciamo affidamento sulle [ships|e] per condurre una guerra, avere pochi Marinai limita severamente la nostra capacità di rifornire le nostre [navies|e], pertanto non è saggio dichiarare [war|E] con pochi marinai.\n@arrow_bonus_tier_2! Anche le [explorations|e] richiedono marinai, quindi dovremmo pianificarle di conseguenza." #OLD
 hint_low_sailors_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! If we are relying on [ships_with_icon|e] to wage war, having low Sailors severely limits our ability to replenish our [navies_with_icon|e], so it is not wise to declare [war_with_icon|E] while we have low sailors\n@arrow_bonus_tier_2! [explorations_with_icon|e] also require sailors, so we should plan them accordingly." #NEW
# hint_low_sailors_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo ampliare la produzione di marinai della nostra nazione con vari [buildings|E].\n@hint! Anche i [estate_privileges|E] e le [laws|E] possono influenzare il nostro potenziale di marinai." #OLD
 hint_low_sailors_hint_text_3: "#T Extra Hints:#!\n@hint! We can develop our nation's sailor production with various [buildings_with_icon|E].\n@hint! [estate_privileges_with_icon|E] and [laws_with_icon|E] can also impact our sailor potential." #NEW
 hint_low_sailors_administrative: "\"Chi controlla il mare, controlla la ricchezza del mondo. Una forte tradizione navale e marinara va di pari passo con il dominio commerciale.\""
 hint_low_sailors_military: "\"Una marina forte con marinai per equipaggiarla consente lo sfruttamento sia di terre lontane sia di quelle interne. Persino i soldati che operano oltreoceano possono beneficiare di linee di rifornimento protette.\""
 hint_low_sailors_diplomatic: "\"Gli edifici navali spesso hanno benefici diretti sul nostro potenziale commerciale. Vale la pena considerare le sinergie tra questi ambiti.\""
 ###
 hint_low_diplomats: "Pochi Diplomatici"
 hint_low_diplomats_hint_text: "$hint_low_diplomats_hint_text_1$\n\n$hint_low_diplomats_hint_text_2$\n\n$hint_low_diplomats_hint_text_3$"
# hint_low_diplomats_hint_text_1: "I [diplomats|E] sono necessari per gestire le relazioni diplomatiche con altri paesi. Molte azioni, come il Miglioramento delle Relazioni, ci costeranno diplomatici nel tempo, mentre svolgere azioni una tantum richiede di solito un costo fisso." #OLD
 hint_low_diplomats_hint_text_1: "[diplomats_with_icon|E] are required to manage your diplomatic relations with other countries. Many actions such as Improving Relations will cost us diplomats over time, whereas sending one-off actions is more likely to have a fixed cost." #NEW
# hint_low_diplomats_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Annullare il miglioramento delle relazioni con alcuni paesi libererà alcuni dei nostri diplomatici se non ne abbiamo abbastanza.\n@arrow_bonus_tier_2! Possiamo anche ottenere più diplomatici da altre fonti come i [advances|e]." #OLD
 hint_low_diplomats_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Cancelling improving relations with some countries will free some of our diplomats if we do not have enough.\n@arrow_bonus_tier_2! We can also get more diplomats from other sources like [advances_with_icon|e]." #NEW
 hint_low_diplomats_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Sebbene sia utile mantenere una riserva di diplomatici per azioni opportunistiche, l'organizzazione dei nostri diplomatici per piani a lungo termine è altrettanto vitale per il successo."
 hint_low_diplomats_administrative: "\"Mantenere buone relazioni è la chiave per un impero redditizio! L'accesso a mercati maggiori e più numerosi è destinato a seguire un'amicizia con i nostri vicini.\""
 hint_low_diplomats_military: "\"I diplomatici possono anche essere usati per affermare il nostro dominio sui paesi più deboli. Per mezzo dell'amicizia o della minaccia, più siamo forti, più è probabile che gli altri si sottomettano.\""
 hint_low_diplomats_diplomatic: "\"Riformare e far progredire il nostro governo è un modo sicuro per migliorare la nostra capacità di diplomazia aggiuntiva. Naturalmente, alcune culture sono semplicemente più in sintonia con l'arte della persuasione di altre.\""
 LOW_DIPLOMATS_HINT: "Pochi Diplomatici!"
 

 ### Low Food in Market
 hint_low_food_in_market: "Cibo Insufficiente sul Mercato"
 hint_low_food_in_market_hint_text: "$hint_low_food_in_market_hint_text_1$\n\n$hint_low_food_in_market_hint_text_2$\n\n$hint_low_food_in_market_hint_text_3$"
# hint_low_food_in_market_hint_text_1: "I Mercati richiedono una quantità sufficiente di [food|E] immagazzinato per rifornire le [provinces|E] che lo richiedono. Senza questo, le località appartenenti a tali province potrebbero finire per soffrire di [starvation|E]." #OLD
 hint_low_food_in_market_hint_text_1: "Markets require enough stored [food_with_icon|E] to provide for their constituent [provinces_with_icon|E] that demand it. Without this, locations belonging to those provinces may end up [starving_with_icon|E]." #NEW
# hint_low_food_in_market_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Migliorare le [rgo|e] che producono cibo ne aumenterà l'offerta.\n@arrow_bonus_tier_2! Possiamo [Concept('import', 'Importare')|e] cibo stabilendo [trades|e] di [goods|e] che producono cibo." #OLD
 hint_low_food_in_market_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Improving the [rgo_with_icon|e] that produce food will increase its supply.\n@arrow_bonus_tier_2! We can [import_with_icon|e] food by establishing [trades_with_icon|e] of [goods_with_icon|e] that produce food." #NEW
# hint_low_food_in_market_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ridurre la quantità di [buildings|e] in una [location|e] farà sì che anche i [pops|e] tornino all'[subsistence_agriculture|e]." #OLD
 hint_low_food_in_market_hint_text_3: "#T Extra Hints:#!\n@hint! Reducing the amount of [buildings_with_icon|e] in a [location_with_icon|e] will also make the [pops_with_icon|e] go back to [subsistence_agriculture_with_icon|e]." #NEW
 HINT_MARKET_ENTRY: "[MARKET.GetName]"
 HINT_BUILDING_ENTRY: "[BUILDING_TYPE.GetName]"
 LOW_FOOD_CAP_TEXT: "[SelectLocalization( StringIsEmpty( GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building') ), Localize('LOW_FOOD_NO'), Localize( 'LOW_FOOD_YES' ) )]"
# LOW_FOOD_YES: "\n@arrow_bonus_tier_1! Se abbiamo [merchant_capacity|E], potremmo creare un'importazione di cibo da un altro mercato che ha un surplus.\n\nSe non abbiamo capacità, costruire un edificio come [GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building')] può aumentare il nostro potenziale commerciale." #OLD
 LOW_FOOD_YES: "\n@arrow_bonus_tier_1! If we have [merchant_capacity_with_icon|E], we could create an import of food from another market that has a surplus.\n\nIf we have no capacity, constructing a building such as the [GetListOfAvailableBuildingsWithModifier('merchant_capacity_from_building')] can increase our trade potential." #NEW
# LOW_FOOD_NO: "\n\nSe abbiamo [merchant_capacity|E], potremmo creare un'importazione di cibo da un altro mercato che ha un surplus." #OLD
 LOW_FOOD_NO: "\n\nIf we have [merchant_capacity_with_icon|E], we could create an import of food from another market that has a surplus." #NEW
# LOW_MARKET_FOOD_TEXT: "La riserva di [food|E] in $LIST$ ha raggiunto livelli critici.$LOW_FOOD_CAP_TEXT$" #OLD
 LOW_MARKET_FOOD_TEXT: "The stockpile of [food_with_icon|E] in $LIST$ has reached critical levels.$LOW_FOOD_CAP_TEXT$" #NEW
# LOW_MARKET_FOOD_TEXT_BUILDINGS: "La riserva di [food|E] in: $LIST$ ha raggiunto livelli critici.\n\nCi sono diversi approcci per gestire la carenza di cibo in un mercato. Più cibo produce una località, minore sarà il carico che eserciterà sulla provincia e sul mercato a cui appartiene, aiutando potenzialmente anche altre località se genera un surplus.\n\n\n@arrow_bonus_tier_3! Le [rgo|e] sono la fonte principale di [food], specialmente nelle località con alta [food_productivity|e]. Dovremmo cercare di espandere queste per prime, soprattutto se il nostro [market] è a corto di [food].\n@arrow_bonus_tier_2! [buildings|E] come $BUILDING_LIST$ potrebbero anche aumentare la produzione di cibo se la produzione di [goods|E] corrisponde.$LOW_FOOD_CAP_TEXT$" #OLD
 LOW_MARKET_FOOD_TEXT_BUILDINGS: "The stockpile of [food_with_icon|E] in the $LIST$ has reached critical levels.\n\nThere are several layers to handling low food in a market. The more food a location produces, the less of a drain it will exert on the province and market it belongs to, potentially even helping other locations if it generates a surplus.\n\n\n@arrow_bonus_tier_3! [rgo_with_icon|e] are the main source of [food], especially in locations with high [food_productivity_with_icon|e]. We should seek to expand those first and foremost if our [market] is short on [food].\n@arrow_bonus_tier_2! [buildings_with_icon|E] such as $BUILDING_LIST$ could also boost food production if the [goods_with_icon|E] production matches.$LOW_FOOD_CAP_TEXT$" #NEW
 hint_low_food_in_market_administrative: "\"I Mercati con località specializzate nella produzione di cibo offriranno sia sicurezza sia un potenziale estremo di profitto. Se altri devono venire da noi per sopravvivere, noi deteniamo una leva quasi illimitata.\""
 hint_low_food_in_market_military: "\"Mentre la nostra capacità di commercio è limitata dalle infrastrutture, un'economia di importazione deve di solito essere supportata da una forte presenza navale. Senza di essa, ci mettiamo alla mercé di chiunque osi sfidare le nostre rotte commerciali.\""
 hint_low_food_in_market_diplomatic: "\"Un'economia autosufficiente di commestibili è un bell'obiettivo, ma gestire un'economia di importazione per sfamare il popolo [GetPlayer.GetAdjectiveWithNoTooltip] potrebbe darci la forza di concentrarci su produzioni più remunerative finanziariamente.\""

 ###
 hint_over_diplo_capacity: "Capacità Diplomatica Superata"
 hint_over_diplo_capacity_hint_text: "$hint_over_diplo_capacity_hint_text_1$\n\n$hint_over_diplo_capacity_hint_text_2$\n\n$hint_over_diplo_capacity_hint_text_3$"
# hint_over_diplo_capacity_hint_text_1: "$game_concept_diplomatic_capacity_desc$" #OLD
 hint_over_diplo_capacity_hint_text_1: "An alliance with everyone is an alliance with no one. A [country_with_icon|e] that maintains more relations than its $game_concept_diplomatic_capacity$ will suffer a penalty to their [diplomatic_reputation_with_icon|e] and [prestige_with_icon|e]. Certain [subject_types_with_icon|e] possess a $game_concept_diplomatic_upkeep$ which reduces the available capacity too.\n\nMembership in some [international_organizations_with_icon|e] will cost some $game_concept_diplomatic_capacity$, and the power of your [ally_with_icon|e] determines the cost of an [alliance_with_icon|e]." #NEW
# hint_over_diplo_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Fermare i nostri [diplomats|E] dal migliorare le relazioni libererà la nostra capacità.\n@arrow_bonus_tier_2! Valutare se si desidera porre fine ad alcune delle nostre [alliances|E] o [treaties|E].\n@arrow_bonus_tier_1! Lasciare qualsiasi [international_organizations|E] di cui non abbiamo più bisogno è anche un altro modo per liberare capacità." #OLD
 hint_over_diplo_capacity_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Stopping our [diplomats_with_icon|E] from improving relations will free our capacity\n@arrow_bonus_tier_2! Evaluating whether we may want to end some of our [alliances_with_icon|E] or [treaties_with_icon|E]\n@arrow_bonus_tier_1! Leaving any [international_organizations_with_icon|E] we no longer need to be part of is also another way of freeing capacity." #NEW
# hint_over_diplo_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [estate_privileges|E], le [laws|E] e i [advances|E] possono talvolta concedere capacità diplomatica aggiuntiva." #OLD
 hint_over_diplo_capacity_hint_text_3: "#T Extra Hints:#!\n@hint! [estate_privileges_with_icon|E], [laws_with_icon|E], and [advances_with_icon|E] can sometimes grant additional diplomatic capacity." #NEW
 hint_over_diplo_capacity_military: "\"Forse dovremmo considerare le alleanze come un mezzo per un fine, non come un'amicizia permanente. Dopotutto, i nostri stessi alleati ci guarderebbero con avidità se mostrassimo debolezza...\""
 hint_over_diplo_capacity_administrative: "\"Sottoporre i nostri diplomatici a un carico di lavoro eccessivo ha lo sfortunato effetto collaterale di ridurne l'efficacia in quasi tutti i loro compiti. Sebbene possa essere allettante lasciarli sovraccaricati, non è una buona soluzione a lungo termine.\""
 hint_over_diplo_capacity_diplomatic: "\"Se dobbiamo dare priorità al nostro sviluppo interno, alleanze forti compenseranno ampiamente qualsiasi percepita debolezza militare. Forse dovremmo interrompere prima altre relazioni?\""

 ###
 hint_rebels_growing: "$game_concept_rebel_movements$"
 hint_rebels_growing_hint_text: "$hint_rebels_growing_hint_text_1$\n\n$hint_rebels_growing_hint_text_2$\n\n$hint_rebels_growing_hint_text_3$"
 hint_rebels_growing_hint_text_1: "I [pops_with_icon|e] si uniscono ai [rebel_movements_with_icon|e] quando la loro [pop_satisfaction_with_icon|e] scende al di sotto della [ShowModifierTypeName('pop_join_rebel_threshold')].\n\nI [rebel_movements] guadagneranno progressi verso la rivolta ogni mese a seconda del loro sostegno. Al raggiungimento del #W 100%#! di sostegno, daranno inizio a una [revolt_with_icon|e] o a una [civil_war_with_icon|e].\n\nLe ragioni più frequenti di sostegno ai ribelli sono la bassa [stability_with_icon|e], le [cultures_with_icon|e], le [religions_with_icon|e] discriminate e i [estates_with_icon|e] irritati."
 
# hint_rebels_growing_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Mantenete la [stability_with_icon|e] e la [legitimacy_with_icon|e] più alte possibile.\n@arrow_bonus_tier_2! Usa l'[cabinet_action_with_icon|e] [ShowCabinetActionName('rebel_crackdown')] per fermare il progresso di una [rebellion] imminente.\n@arrow_bonus_tier_1! Sposta un [army_with_icon|e] in una [province_with_icon|e] con [pops] insoddisfatti. La presenza delle truppe li renderà più... #italic comprensivi#!.\n\nIn ultima analisi, aumentare la [pop_satisfaction_icon] Soddisfazione dei [pops] ribelli è ciò che conta di più:\n@arrow_bonus_tier_2! Assicurati che ogni [culture] più numerosa nel tuo [country] sia [accepted_culture_short_with_icon|e] o [tolerated_culture_short|e].\n@arrow_bonus_tier_1! Assicurati che i [pops] ribelli possano acquistare il maggior numero possibile dei loro [Concept('pop_needs_with_icon', 'Bisogni')|e] dal loro [market_with_icon|e].\n@arrow_bonus_tier_3! Mantieni alta la [estate_icon] [estate_satisfaction|e], poiché essa influisce molto sulla soddisfazione di tutti i suoi [pops] costituenti:\n$TAB$@arrow_bonus_tier_2! Concedi un [privilege_with_icon|e]\n$TAB$@arrow_bonus_tier_2! Corrompi i [estates|e]\n$TAB$@arrow_bonus_tier_2! Abbassa le [taxes_with_icon|e]" #OLD
 hint_rebels_growing_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Keep [stability_with_icon|e] and [legitimacy_with_icon|e] as high as possible.\n@arrow_bonus_tier_2! Use the [ShowCabinetActionName('rebel_crackdown')] [cabinet_action_with_icon|e] to stop the progress of an impending [rebellion].\n@arrow_bonus_tier_1! Move an [army_with_icon|e] to a [province_with_icon|e] with unhappy [pops]. The presence of your troops will make them more... #italic understanding#!.\n\nUltimately, increasing the [pop_satisfaction_icon] Satisfaction of rebellious [pops] is what matter most:\n@arrow_bonus_tier_2! Make sure the most numerous [cultures] in your [country] are [accepted_culture_short_with_icon|e] or [tolerated_culture_short_with_icon|e].\n@arrow_bonus_tier_1! Ensure the rebelling [pops] are able to buy as many of their [pop_needs_with_icon|e] as possible from their [market_with_icon|e].\n@arrow_bonus_tier_3! Keep [estate_icon] [estate_satisfaction_with_icon|e] high, since it severely impacts the satisfaction of all its constituent [pops]:\n$TAB$@arrow_bonus_tier_2! Grant a [privilege_with_icon|e]\n$TAB$@arrow_bonus_tier_2! Bribe the [estate]\n$TAB$@arrow_bonus_tier_2! Lower [taxes_with_icon|e]" #NEW
 
# hint_rebels_growing_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Anche i [societal_values|E] come [ShowSocietyDirectionName('communalism')] e [ShowSocietyDirectionName('decentralization')] possono influenzare la probabilità di crescita della ribellione.\n@hint! I [pops] ribelli si uniranno a [rebel_movements] diversi a seconda di vari fattori. Ad esempio, i [pops] di una [culture] discriminata tenderanno a unirsi ai [nationalist_rebels_with_icon|e]." #OLD
 hint_rebels_growing_hint_text_3: "#T Extra Hints:#!\n@hint! [societal_values_with_icon|E] such as [ShowSocietyDirectionName('communalism')] and [ShowSocietyDirectionName('decentralization')] can also influence likelihood of rebellion growth.\n@hint! Rebellious [pops] will join to different [rebel_movements] depending on various factors. For instance, [pops] of a discriminated [culture] will tend to join [nationalist_rebels_with_icon|e]." #NEW
 
 hint_rebels_growing_military: "\"Potranno sembrare coriacei, ma con la gente comune l'abbaiare è di solito peggio del morso. Tuttavia, ciò che spesso manca loro in disciplina, lo compensano ampiamente con i numeri.\""
 hint_rebels_growing_administrative: "\"Sebbene i ribelli siano certamente un male per gli affari, di solito sono reazionari; se risolverete la causa della loro agitazione, non solo riuscirete a pacificarli, ma anche a migliorare il nostro Paese.\""
 hint_rebels_growing_diplomatic: "\"La nostra popolazione detiene ogni sorta di identità e fedeltà diverse. I popoli conquistati sono molto più propensi a volersi separare e formare il proprio governo o persino a unirsi a una potenza straniera.\""

 ###
 hint_call_for_peace: "Richiesta di Pace"
 hint_call_for_peace_hint_text: "$hint_call_for_peace_hint_text_1$\n\n$hint_call_for_peace_hint_text_2$\n\n$hint_call_for_peace_hint_text_3$"
# hint_call_for_peace_hint_text_1: "Questo stato può essere riscontrato se una particolare [war|E] si protrae abbastanza a lungo, o se rifiutiamo di firmare un [peace_treaty|E] nonostante una vittoria o una sconfitta totale." #OLD
 hint_call_for_peace_hint_text_1: "This status can be encountered if a particular [war_with_icon|E] drags on for long enough, or if we refuse to sign a [peace_treaty_with_icon|E] despite a total victory or defeat." #NEW
# hint_call_for_peace_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Dovremmo limitare le nostre perdite e firmare un trattato prima che la nostra [war_exhaustion|E] raggiunga livelli critici.\n@arrow_bonus_tier_2! Ciò potrebbe significare accettare meno di quanto inizialmente intendevamo richiedere, o persino perdere la [war|e]." #OLD
 hint_call_for_peace_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We should cut our losses and sign a treaty before our [war_exhaustion_with_icon|E] reaches critical levels.\n@arrow_bonus_tier_2! It may mean accepting less than we initially intended to demand, or even losing the [war_with_icon|e]." #NEW
# hint_call_for_peace_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Qualsiasi cosa persa a causa della firma di un [peace_treaty|e] prematuro può essere recuperata in futuro in un'altra [war|e]." #OLD
 hint_call_for_peace_hint_text_3: "#T Extra Hints:#!\n@hint! Anything lost due to having to sing a premature [peace_treaty_with_icon|e] can be regained in the future in another [war_with_icon|e]." #NEW
 hint_call_for_peace_diplomatic: "\"Violare le regole della guerra può avere conseguenze davvero devastanti per la nostra stabilità interna e per la nostra reputazione all'estero. Perché qualcuno dovrebbe ascoltare ciò che abbiamo da dire se dimostriamo di essere irragionevoli?\""
 hint_call_for_peace_military: "\"La guerra non è che la continuazione della politica con altri mezzi. Forse dovremmo scriverlo prima che lo faccia qualcun altro?\""
 hint_call_for_peace_administrative: "\"Una richiesta di pace peggiorerà sempre di più con il passare del tempo. Il popolo può essere placato, ma non ignorato per sempre.\""
 ###
 hint_unprofitable_buildings: "Edifici Non Redditizi"
 hint_unprofitable_buildings_hint_text: "$hint_unprofitable_buildings_hint_text_1$\n\n$hint_unprofitable_buildings_hint_text_2$\n\n$hint_unprofitable_buildings_hint_text_3$"
# hint_unprofitable_buildings_hint_text_1: "Gli Edifici diventano non redditizi se il costo combinato dei loro [goods|E] in ingresso supera il valore dei [produced_goods|E]." #OLD
 hint_unprofitable_buildings_hint_text_1: "Buildings will become unprofitable if the cost of their combined input [goods_with_icon|E] exceeds the value of their [produced_goods_with_icon|E]." #NEW
# hint_unprofitable_buildings_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicurati che i beni in ingresso siano più economici producendo o [Concept('importing', 'Importandone')|e] di più per garantirne un offerta abbondante.\n@arrow_bonus_tier_3! Creare o assicurare una domanda aggiuntiva di beni ne farà aumentare il prezzo.\n@arrow_bonus_tier_3! Gli [buildings|E] possono essere chiusi @building_open! o persino distrutti, se il loro scopo non è più in linea con i nostri obiettivi.\n@arrow_bonus_tier_3! Un [market_owner|E] potrebbe imporre un embargo ai Paesi che esportano i beni che egli produce per far salire il prezzo delle proprie esportazioni." #OLD
 hint_unprofitable_buildings_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Make sure that input goods are cheaper by producing or [importing_with_icon|E] more to ensure their abundant supply.\n@arrow_bonus_tier_3! Creating or securing additional demand for goods will raise their price.\n@arrow_bonus_tier_3! [buildings_with_icon|E] can be closed @building_open! or even destroyed, if their purpose no longer fits our aims.\n@arrow_bonus_tier_3! A [market_owner_with_icon|E] could embargo countries exporting goods that they produce in order to drive up the price of their own exports." #NEW
# hint_unprofitable_buildings_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Alcuni edifici possono essere [Concept('subsidized', 'Sovvenzionati')|e]@subsidy!. Questo può essere utile se i costi di [import|E] dei beni richiesti per i [pop_needs|E] o per il mantenimento di un esercito sono alti, per esempio." #OLD
 hint_unprofitable_buildings_hint_text_3: "#T Extra Hints:#!\n@hint! Some buildings can be [subsidized_with_icon|E]. This can be useful if the [import_with_icon|E] costs of goods required for [pop_needs_with_icon|E] or maintaining an army are high, for example." #NEW
 hint_unprofitable_buildings_diplomatic: "\"Gestire la redditività dell'industria di un intero paese può essere un compito difficile. Puoi richiedere l'assistenza della burocrazia del paese se non desideri occuparti dei dettagli!\""
 hint_unprofitable_buildings_military: "\"Più siamo forti, maggiore è la nostra capacità di impegnarci in un sano grado di protezionismo. Embargo e controversie commerciali sono sempre più efficaci se supportati dai cannoni.\""
 hint_unprofitable_buildings_administrative: "\"La strategia di manipolazione dei prezzi ha molti strati. Con abbastanza astuzia, possiamo non solo creare una domanda in un mercato, ma anche essere coloro che la soddisfano.\""
 NO_HINTS_AVAILABLE: "Nessun suggerimento disponibile!"
 hint_trade: "Commercio"
 hint_trade_hint_text: "$hint_trade_hint_text_1$\n\n$hint_trade_hint_text_2$\n\n$hint_trade_hint_text_3$"
# hint_trade_hint_text_1: "Il [trade|E] comporta lo spostamento di [goods|E] tra [markets|E] e la vendita e l'acquisto in questi [markets|E]." #OLD
 hint_trade_hint_text_1: "[trade_with_icon|E] involves moving [goods_with_icon|E] between [markets_with_icon|E], and selling and buying at those [markets_with_icon|E]." #NEW
# hint_trade_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Stabilite nuove Rotte di [trade|E] per acquisire [goods|e].\n@arrow_bonus_tier_2! Aumentate la produzione di [goods|e] per averne di più a disposizione per il commercio." #OLD
 hint_trade_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Establish new [trade_with_icon|E] Routes to acquire [goods_with_icon|e].\n@arrow_bonus_tier_2! Increase the production of [goods_with_icon|e] to have more of them available for trade." #NEW
# hint_trade_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Una Rotta di [trade|E] può essere redditizia o non redditizia a seconda della differenza di prezzo tra i [markets|E] di [export|E] e [import|E].\n@hint! Ogni [country|E] presente in un [market|E] ha una [merchant_capacity|E] massima che può utilizzare per creare Rotte di [trade|E] e un [merchant_power|E] che determina la priorità che ha nell'esportare [goods|E] lungo le sue Rotte di [trade|E] quando c'è una carenza.\n@hint! Il Commercio può essere automatizzato in ogni singolo [market|E] per impostazione predefinita cliccando sul relativo ingranaggio." #OLD
 hint_trade_hint_text_3: "#T Extra Hints:#!\n@hint! A [trade_with_icon|E] Route may be profitable or unprofitable depending on the price difference between the [export_with_icon|E] (source) and [import_with_icon|E] (destination) [markets_with_icon|E].\n@hint! Each [country_with_icon|E] present in a [market_with_icon|E] has a maximum [merchant_capacity_with_icon|E] it can use up to create [trade_with_icon|E] Routes, and a [merchant_power_with_icon|E] that determines the priority it has to export [goods_with_icon|E] along its [trade_with_icon|E] Routes when there is a shortage.\n@hint! Trade can be automated in each individual [market_with_icon|E] by default by clicking its related Cog wheel." #NEW
 hint_trade_military: "\"Il commercio è per i deboli. Tuttavia, saremo in grado di imporre il flusso di merci dominando la terra e il mare.\""
 hint_trade_administrative: "\"Elemento centrale della nostra strategia: Prevedere la prossima ondata di prezzi attraverso il lancio dei dadi e l'allineamento celeste delle stelle.\""
 hint_trade_diplomatic: "\"Uno dei pilastri indispensabili di un impero pienamente sviluppato, il commercio ha il potenziale di riempire le nostre casse a un ritmo più veloce di qualsiasi altra cosa.\""

 ### Unused Trade Capacity
 hint_unused_trade_capacity: "Capacità Commerciale Inutilizzata"
 hint_unused_trade_capacity_hint_text: "$hint_unused_trade_capacity_hint_text_1$\n\n$hint_unused_trade_capacity_hint_text_2$\n\n$hint_unused_trade_capacity_hint_text_3$"
 hint_unused_trade_capacity_hint_text_1: "La [merchant_capacity_with_icon|e] è utilizzata per spostare [goods_with_icon|e] tra [markets_with_icon|e], generando possibilmente un profitto nel processo. Dovremmo sempre utilizzare tutta la nostra [merchant_capacity]."
# hint_unused_trade_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! Cliccate sull'Avviso per vedere il Mercato interessato nel @economy_panel![Link('trade', 'subtab = markets', 'Pannello Mercati')]. Da lì potete allocare la Capacità Commerciale alle Rotte suggerite.\n@arrow_bonus_tier_1! Potete anche cliccare sull'Intestazione del Mercato per andare al Pannello Mercato, dove vedrete l'elenco dei [goods|e] pertinenti a quel Mercato. Cliccate sui pulsanti Esporta/Importa per ogni [good] per avviare una Rotta Commerciale.\n@automation! Si raccomanda di automatizzare il Commercio in tutti i vostri Mercati, premendo il pulsante dell'ingranaggio nella Scheda Mercato. Potete sempre creare e bloccare manualmente Rotte Commerciali, anche quando il Commercio è automatizzato." #OLD
 hint_unused_trade_capacity_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_1! Click on the Alert to see the affected Market in the @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')]. From there you can allocate Trade Capacity to suggested Trades.\n@arrow_bonus_tier_1! You can also click on the Market Header to go to the Market Panel, where you will see the list of [goods_with_icon|e] relevant to that Market. Click the Export/Import buttons for each [good] to start a Trade.\n@automation! It is recommended that you Automate Trade in all your Markets, by pressing the cog button in the Market Card. You can always manually create and lock Trades, even when Trade is automated." #NEW
 hint_unused_trade_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Il profitto derivante dal [trade] è diviso tra i [estates_with_icon|e], inclusa la [ShowEstateTypeName('crown_estate')], in base al [estate_power_with_icon|e]."
 
 hint_unused_trade_capacity_military: "\"Riguardo la possibilità di un utilizzo ottuso delle nostre risorse, sono assolutamente contrario.\""
 hint_unused_trade_capacity_administrative: "\"Dobbiamo tornare alla frontiera efficiente il prima possibile.\""
 hint_unused_trade_capacity_diplomatic: "\"Si potrebbe paragonare la capacità commerciale inutilizzata a un campo a riposo da troppo tempo per il prossimo seme.\""
 
 ### Unprofitable Trade Route
 hint_unprofitable_trade_route: "Rotta Commerciale Non Redditizia"
 hint_unprofitable_trade_route_hint_text: "$hint_unprofitable_trade_route_hint_text_1$\n\n$hint_unprofitable_trade_route_hint_text_2$\n\n$hint_unprofitable_trade_route_hint_text_3$"
# hint_unprofitable_trade_route_hint_text_1: "Nella maggior parte dei casi, quando avete una Rotta di [trade|E] non redditizia dovrete annullarla e sostituirla con una rotta redditizia, oppure attivare l'automazione per quel [market|E]." #OLD
 hint_unprofitable_trade_route_hint_text_1: "In most cases, when you have an unprofitable [trade_with_icon|E] Route you will want to cancel it and replace it with a profitable route, or turn on automation for that [market_with_icon|E]." #NEW
# hint_unprofitable_trade_route_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! Talvolta, ha senso perdere denaro su una Rotta di [trade|E] se i [goods|E] scambiati sono di importanza strategica.\n@arrow_bonus_tier_1! Un esempio sarebbe l'acquisizione di Legname per essere in grado di completare un [building|E]. Un altro sarebbe assicurare che i nostri [pops|E] siano sfamati." #OLD
 hint_unprofitable_trade_route_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_1! Sometimes, it makes sense to lose money on a [trade_with_icon|E] Route if the [goods_with_icon|E] moved are of strategic importance.\n@arrow_bonus_tier_1! An example would be acquiring Lumber to be able to finalize a [building_with_icon|E]. Another would be ensuring that our [pops_with_icon|E] are fed." #NEW
# hint_unprofitable_trade_route_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potete influenzare indirettamente la redditività di una Rotta di [trade|E] esistente influenzando i prezzi (e quindi la differenza di prezzo per il [good|E] scambiato) dei [markets|E] coinvolti. Potete farlo alterando l'[supply|E] e la [demand|E] per il [good|E]." #OLD
 hint_unprofitable_trade_route_hint_text_3: "#T Extra Hints:#!\n@hint! You can indirectly impact the profitability of an existing [trade_with_icon|E] Route by impacting the prices (and hence the price difference for the traded [good_with_icon|E]) of the involved [markets_with_icon|E]. You can do this by altering [supply_with_icon|E] and [demand_with_icon|E] for the [good_with_icon|E]. " #NEW
 hint_unprofitable_trade_route_military: "\"Forse dovremmo prendere le loro merci invece di pagarle?\""
 hint_unprofitable_trade_route_administrative: "\"Tagliate le perdite il più velocemente possibile. Il commercio non è carità.\""
 hint_unprofitable_trade_route_diplomatic: "\"L'imperfezione sorge nell'ordine della natura e sta a noi eliminarla.\""


 hint_market_out_of_supply: "Mercato senza Rifornimenti"
 hint_market_out_of_supply_hint_text: "$hint_market_out_of_supply_hint_text_1$\n\n$hint_market_out_of_supply_hint_text_2$\n\n$hint_market_out_of_supply_hint_text_3$"
# hint_market_out_of_supply_hint_text_1: "Se un [market|e] ha una [demand|E] totale troppo alta rispetto all'[supply|E] finita, potremmo non ricevere i [goods|E] che stiamo cercando di [export|E] o [import|E], con conseguente mancanza di merci." #OLD
 hint_market_out_of_supply_hint_text_1: "If a [market_with_icon|e] has too high total [demand_with_icon|E] compared to the finite [supply_with_icon|E], we may not receive the [goods_with_icon|E] that we are attempting to [export_with_icon|E] or [import_with_icon|E], resulting in a lack of goods." #NEW
# hint_market_out_of_supply_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possiamo immediatamente annullare le Rotte di [trade|E] non redditizie e utilizzare quella [merchant_capacity|E] per altri tipi di [goods|E].\n@arrow_bonus_tier_1! Aumentare il nostro [merchant_power|E] nel [market|E] interessato può garantirci maggiore accesso alle sue merci." #OLD
 hint_market_out_of_supply_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! We can immediately cancel the unprofitable [trade_with_icon|E] Routes and use that [merchant_capacity_with_icon|E] for other types of [goods_with_icon|E].\n@arrow_bonus_tier_1! Increase our [merchant_power_with_icon|E] in the affected [market_with_icon|E] may allow us more access to its goods." #NEW
# hint_market_out_of_supply_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo ottenere [merchant_power|e] da una varietà di fonti come [advances|e], [privileges|e], [policies|e], ecc.\n@hint! Potremmo anche tentare di aumentare la [supply|E], ma ciò può essere difficile da fare con breve preavviso ed è di solito soggetto ad attenzione strategica a lungo termine." #OLD
 hint_market_out_of_supply_hint_text_3: "#T Extra Hints:#!\n@hint! We can get [merchant_power_with_icon|e] from a variety of sources like [advances_with_icon|e], [privileges_with_icon|e], [policies_with_icon|e], etc.\n@hint! We may also attempt to increase [supply_with_icon|E], but this can be hard to do with short notice and is usually subject to long term strategic attention." #NEW
 hint_market_out_of_supply_military: "\"Di tanto in tanto non ci saranno merci sufficienti disponibili per l'esportazione per alimentare la nostra macchina da guerra. Bisogna affrontarlo rapidamente.\""
 hint_market_out_of_supply_administrative: "\"Considerate di aumentare il nostro vantaggio commerciale totalmente equo con qualsiasi mezzo spendibile.\""
 hint_market_out_of_supply_diplomatic: "\"Forse dobbiamo adottare misure per diversificare le nostre operazioni commerciali, allontanandoci dalla monocoltura.\""
 hint_increasing_trade_capacity: "Aumento della Capacità Commerciale"
 hint_increasing_trade_capacity_hint_text: "$hint_increasing_trade_capacity_hint_text_1$\n\n$hint_increasing_trade_capacity_hint_text_2$\n\n$hint_increasing_trade_capacity_hint_text_3$"
# hint_increasing_trade_capacity_hint_text_1: "La [merchant_capacity|e] determina la quantità di [trade|e] che un [country|e] può effettuare." #OLD
 hint_increasing_trade_capacity_hint_text_1: "[merchant_capacity_with_icon|e] determines the amount of [trade_with_icon|e] that a [country_with_icon|e] can perform." #NEW
# hint_increasing_trade_capacity_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Costruite più [buildings|e] che aumentano la capacità, ad esempio un [ShowBuildingTypeName('marketplace')] o un [ShowBuildingTypeName('market_village')].\n@arrow_bonus_tier_2! Alcuni [advances|e] o [laws|e] possono anche aumentare la nostra [merchant_capacity|e]." #OLD
 hint_increasing_trade_capacity_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Build more [buildings_with_icon|e] increasing capacity, for example a [ShowBuildingTypeName('marketplace')] or a [ShowBuildingTypeName('market_village')].\n@arrow_bonus_tier_2! Some [advances_with_icon|e] or [laws_with_icon|e] can also increase our [merchant_capacity_with_icon|e]." #NEW
# hint_increasing_trade_capacity_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Avere più [merchant_capacity|e] consente di scambiare più merci, con conseguente [income|e] più alto." #OLD
 hint_increasing_trade_capacity_hint_text_3: "#T Extra Hints:#!\n@hint! Having more [merchant_capacity_with_icon|e] allows for more items being traded, resulting in a higher [income_with_icon|e]." #NEW
 hint_increasing_trade_capacity_military: "\"Più grande diventa il nostro impero, maggiore sarà la capacità di commercio che avremo. È quasi tautologico.\""
 hint_increasing_trade_capacity_administrative: "\"La soluzione alla capacità commerciale, proprio come tutti i problemi dell'umanità, è avere più mercati.\""
 hint_increasing_trade_capacity_diplomatic: "\"Garantite un flusso crescente di commercio gettando le fondamenta per lo scambio mercantile ovunque sia possibile.\""
 
 hint_increasing_trade_advantage: "$game_concept_merchant_power$"
 hint_increasing_trade_advantage_hint_text: "$hint_increasing_trade_advantage_hint_text_1$\n\n$hint_increasing_trade_advantage_hint_text_2$\n\n$hint_increasing_trade_advantage_hint_text_3$"
# hint_increasing_trade_advantage_hint_text_1: "Il [merchant_power_with_icon|e] determina quale [country_with_icon|e] ha accesso per primo ai [goods_with_icon|e] di un [market_with_icon|e] ai fini del [trade_with_icon|e].\n\nSe due [countries] che commerciano stanno cercando di acquistare un [good] e non ce n'è abbastanza per entrambi, quello con il [merchant_power] più alto in quel [market] lo acquisterà per primo.\n\nSi noti che il [merchant_power] si applica solo al [trade]. Le [locations|e] seguono invece l'[market_access|e] quando acquistano [goods] per le [constructions|e] o i [pop_needs|e]." #OLD
 hint_increasing_trade_advantage_hint_text_1: "[merchant_power_with_icon|e] determines what [country_with_icon|e] has access to the [goods_with_icon|e] of a [market_with_icon|e] first for the purposes of [trade_with_icon|e].\n\nIf two trading [countries] are trying to buy a [good] and there is not enough for both, the one with the highest [merchant_power] in that [market] will buy it first.\n\nNote that [merchant_power] only applies to [trade]. Instead, [locations_with_icon|e] follow [market_access_with_icon|e] order when buying [goods] for [constructions_with_icon|e] or [pop_needs_with_icon|e]." #NEW
 hint_increasing_trade_advantage_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Possedete più [locations_with_icon|e] appartenenti a quel [market].\n@arrow_bonus_tier_2! Aumentate la [maritime_presence_with_icon|e] sulle acque costiere di un [market].\n@arrow_bonus_tier_1! Alcuni [buildings_with_icon|e], come il [ShowBuildingTypeName('marketplace')], aumentano anche il [merchant_power]."
 hint_increasing_trade_advantage_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! #italic Per saperne di più potete consultare i Suggerimenti [Link('hints', 'selected_hint = hint_trade', '$hint_trade$')] e [Link('hints', 'selected_hint = hint_maritime', '$hint_maritime$')]#!"
 hint_increasing_trade_advantage_military: "\"Poiché il commercio è un'impresa competitiva piuttosto che cooperativa, stabilire un vantaggio commerciale è l'ordine naturale delle cose.\""
 hint_increasing_trade_advantage_administrative: "\"Elemento centrale della nostra strategia: Prevedere la prossima ondata di prezzi attraverso il lancio dei dadi e l'allineamento celeste delle stelle.\""
 hint_increasing_trade_advantage_diplomatic: "\"Uno dei pilastri indispensabili di un impero pienamente sviluppato, il commercio ha il potenziale di riempire le nostre casse a un ritmo più veloce di qualsiasi altra cosa.\""

 ######## ALERT HINTS ########
 
 ### Pops demanding Goods
 hint_pops_with_needs_yellow: "Popolazioni che Richiedono Merci"
 hint_pops_with_needs_yellow_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_yellow_hint_text_2$\n\n$hint_pops_with_needs_yellow_hint_text_3$"
# hint_pops_with_needs_yellow_hint_text_1: "I [pops_with_icon|e] cercheranno di acquistare i [goods_with_icon|e] necessari per la loro vita quotidiana dal [market_with_icon|e] della loro [location_with_icon|e]. Se i [pops|e] non sono in grado di acquistare tutti i [goods] che richiedono, la loro [Concept('pop_satisfaction', 'Soddisfazione')|e] diminuirà di conseguenza. Se la loro [Concept('pop_satisfaction', 'Soddisfazione')] scende al di sotto della [ShowModifierTypeName('pop_join_rebel_threshold')], sia per mancanza di [goods] o altro, i [pops] potrebbero iniziare a sostenere una [rebellion_with_icon|e] contro il [government]." #OLD
 hint_pops_with_needs_yellow_hint_text_1: "[pops_with_icon|e] will try to buy the [goods_with_icon|e] they need for their daily life from the [market_with_icon|e] of their [location_with_icon|e]. If [pops] are not able to buy all the [goods] they demand, their [pop_satisfaction_with_icon|e] will decrease accordingly. If their [pop_satisfaction] falls below their [ShowModifierTypeName('pop_join_rebel_threshold')], be it for want of [goods] or else, [pops] might start to support a [rebellion_with_icon|e] against the [government]." #NEW
# hint_pops_with_needs_yellow_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Mantenete alte [stability_with_icon|e], [legitimacy_with_icon|e] e [estate_satisfaction|e] per prevenire le [rebellions].\n@arrow_bonus_tier_1! Espandete la vostra produzione dei [goods|e] richiesti costruendo [rgo_with_icon|e] e [buildings_with_icon|e] dal @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Importate i [goods] da altri [markets] spendendo [merchant_capacity_with_icon|e]." #OLD
 hint_pops_with_needs_yellow_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Keep [stability_with_icon|e], [legitimacy_with_icon|e], and [estate_satisfaction_with_icon|e] high to prevent [rebellions].\n@arrow_bonus_tier_1! Expand your production of the demanded [goods_with_icon|e] by building [rgo_with_icon|e] and [buildings_with_icon|e] from the @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Import the [goods] from other [markets] spending [merchant_capacity_with_icon|e]." #NEW
 hint_pops_with_needs_yellow_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Avere richieste insoddisfatte delle Popolazioni non è necessariamente preoccupante, purché i [pops] non si ribellino. Tuttavia, fornisce una panoramica dello stato di salute di un [market].\n@hint! Le richieste delle Popolazioni sono solo uno dei fattori che influenzano la [pop_satisfaction]. Anche se tutti i loro bisogni fossero soddisfatti, le persone potrebbero comunque ribellarsi per altre ragioni.\n@hint! Maggiori informazioni sui [rebel_movements_with_icon] sono disponibili nel Suggerimento [Link('hints', 'selected_hint = hint_rebels_growing', '$hint_rebels_growing$')]."
 
 hint_pops_with_needs_yellow_military: "\"Un sovrano potente non dovrebbe preoccuparsi dei capricci degli umili.\""
 hint_pops_with_needs_yellow_administrative: "\"Dove l'occhio poco attento vede una popolazione privata, io vedo una meravigliosa occasione di profitto.\""
 hint_pops_with_needs_yellow_diplomatic: "\"Gli uomini chiederanno sempre più di quanto spetta loro. Ma fate attenzione. Le carenze, se lasciate incontrollate, potrebbero incitare i vostri sudditi alla ribellione.\""


 ### Rebelling Pops demanding Goods
 hint_pops_with_needs_red: "Popolazioni Ribelli che Richiedono Merci"
 hint_pops_with_needs_red_hint_text: "$hint_pops_with_needs_yellow_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_1$\n\n$hint_pops_with_needs_red_hint_text_2$\n\n$hint_pops_with_needs_red_hint_text_3$"
 hint_pops_with_needs_red_hint_text_1: "Alcuni dei nostri [pops] si stanno attualmente unendo a [rebel_movements]. Aumentare l'offerta di [goods] richiesti potrebbe convincere alcuni di loro a lasciare le [rebellions]."
# hint_pops_with_needs_red_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Aumentate [stability|e], [legitimacy|e] e [estate_satisfaction|e].\n@arrow_bonus_tier_1! Espandete la produzione dei [goods|e] richiesti costruendo [rgo|e] e [buildings|e] dal @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Importate i [goods] da altri [markets] spendendo [merchant_capacity|e]\n@arrow_bonus_tier_1! Se tutto il resto fallisce, tenete i nostri [armies|e] pronti a gestire gli insorti." #OLD
 hint_pops_with_needs_red_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Increase [stability_with_icon|e], [legitimacy_with_icon|e], and [estate_satisfaction_with_icon|e].\n@arrow_bonus_tier_1! Expand the production of the demanded [goods_with_icon|e] by building [rgo_with_icon|e] and [buildings_with_icon|e] from the @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')].\n@arrow_bonus_tier_1! Import the [goods] from other [markets] spending [merchant_capacity_with_icon|e]\n@arrow_bonus_tier_1! If all else fails, have our [armies_with_icon|e] ready to deal with the insurgents." #NEW
 hint_pops_with_needs_red_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le richieste delle Popolazioni sono solo uno dei fattori che influenzano la [pop_satisfaction]. Anche se tutti i loro bisogni fossero soddisfatti, le persone potrebbero comunque ribellarsi per altre ragioni.\n@hint! Maggiori informazioni sui [rebel_movements_with_icon] sono disponibili nel Suggerimento [Link('hints', 'selected_hint = hint_rebels_growing', '$hint_rebels_growing$')]."
 
 hint_pops_with_needs_red_diplomatic: "\"Garantire l'offerta di merci critiche può essere sufficiente per placare le voci discordanti tra il nostro popolo.\""
 hint_pops_with_needs_red_administrative: "\"Una Ribellione porterebbe rovina ai nostri mercanti. Aumentiamo la nostra produzione prima che il nostro popolo decida di prendere le armi contro di noi!\""
 hint_pops_with_needs_red_military: "\"Una folla affamata? Il nostro Esercito si occuperà di questa minaccia.\""


 ### Possible Reforms
 hint_has_possible_reform: "Possibili Riforme"
 hint_has_possible_reform_hint_text: "$hint_has_possible_reform_hint_text_1$\n\n$hint_has_possible_reform_hint_text_2$\n\n$hint_has_possible_reform_hint_text_3$"
 hint_has_possible_reform_hint_text_1: "Le [government_reforms_with_icon|e] sono una delle caratteristiche più distintive del nostro [country_with_icon|e]. Dovremmo sempre attuare tutte le [reforms] possibili."
# hint_has_possible_reform_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Premete il pulsante (+) sotto la scheda [ShowEstateTypeName('crown_estate')] nel @government_panel![Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')] per emanare una nuova [reform]." #OLD
 hint_has_possible_reform_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Press the plus button under the [ShowEstateTypeName('crown_estate')] card in the @government_panel! [Link('government', 'tabcontent = estates', 'lateralview_government_entry_name')] to enact a new [reform]." #NEW
# hint_has_possible_reform_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Man mano che il gioco progredisce, più [government_reforms] diventeranno disponibili tramite [advances_with_icon|e] ed [events|e].\n@hint! Le [government_reforms] costano [stability_with_icon|e] per essere revocate e richiedono molto tempo per essere attuate. Sceglietele con cura.\n@hint! Alcune [government_reforms] richiedono che il vostro [country] si orienti verso un particolare [societal_value_with_icon|e]." #OLD
 hint_has_possible_reform_hint_text_3: "#T Extra Hints:#!\n@hint! As the game progresses, more [government_reforms] will become available via [advances_with_icon|e] and [events_with_icon|e].\n@hint! [government_reforms] cost [stability_with_icon|e] to revoke, and take a long time to implement. Choose them with care.\n@hint! Some [government_reforms] require your [country] to tilt towards one particular [societal_value_with_icon|e]." #NEW
 
 hint_has_possible_reform_diplomatic: "\"Un governo ben definito è un simbolo di un'amministrazione sana.\""
 hint_has_possible_reform_administrative: "\"Dobbiamo essere chiari nella definizione del nostro governo, affinché i Paesi stranieri possano imparare come riferirsi a noi.\""
 hint_has_possible_reform_military: "\"Come possiamo aspettarci di essere in grado di difenderci dai nostri nemici se non sappiamo nemmeno chi siamo?\""


 ### Non-integrated Provinces
 hint_has_conquered_provinces: "Province Non Integrate"
 hint_has_conquered_provinces_hint_text: "$hint_has_conquered_provinces_hint_text_1$\n\n$hint_has_conquered_provinces_hint_text_2$\n\n$hint_has_conquered_provinces_hint_text_3$"
# hint_has_conquered_provinces_hint_text_1: "Le [locations_with_icon|e] [conquered_with_icon|e] devono essere [integrated|e] nella nostra amministrazione per contribuire alla ricchezza del nostro reame. Dovremmo sforzarci di [integrate] tutte le nostre [locations|e] il prima possibile." #OLD
 hint_has_conquered_provinces_hint_text_1: "[conquered_with_icon|e] [locations_with_icon|e] need to be [integrated_with_icon|e] into our administration in order to contribute to the wealth of our realm. We should strive to [integrate] all our [locations_with_icon|e] as soon as possible." #NEW
# hint_has_conquered_provinces_hint_text_2: "#T Azioni Raccomandate #!:\n@arrow_bonus_tier_3! Istruite il [cabinet_with_icon|e] a [ShowCabinetActionName('integrate_province')] dal @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_1! Se il nostro [cabinet] non riesce a tenere il passo con le nostre conquiste, considerate di creare un [subject_with_icon|e] per governare la terra al vostro posto. Potete farlo dal @diplomacy_panel![Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')]." #OLD
 hint_has_conquered_provinces_hint_text_2: "#T Recommended Actions #!:\n@arrow_bonus_tier_3! Instruct the [cabinet_with_icon|e] to [ShowCabinetActionName('integrate_province')] from the @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_1! If our [cabinet] cannot keep up with our conquests, consider creating a [subject_with_icon|e] to rule the land in your stead. You do that from the @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')]." #NEW
# hint_has_conquered_provinces_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! L'Integrazione è solitamente una delle principali responsabilità del [cabinet|e] nei [countries|e] espansionisti.\n@hint! La [pop_satisfaction|e] sarà molto più bassa nelle [locations] [conquered], potendo innescare [rebellions_with_icon|e].\n@hint! Potete aumentare la velocità di integrazione nominando [characters|e] più talentuosi ai [cabinet_members|e] e anche aumentando l'[cabinet_efficiency|e] globale del nostro [country].\n@hint! L'Integrazione sarà molto più veloce se la nostra [primary_culture|e] è la [dominant_culture|e] della Località, o se la nostra [cultural_influence|e] è superiore alla [cultural_tradition|e] della [dominant_culture] della Località." #OLD
 hint_has_conquered_provinces_hint_text_3: "#T Extra Hints:#!\n@hint! Integration is usually one of the main responsibilities of the [cabinet_with_icon|e] in expansionist [countries_with_icon|e].\n@hint! [pop_satisfaction_with_icon|e] will be much lower in [conquered] [locations], potentially triggering [rebellions_with_icon|e].\n@hint! You can increase the speed of the integration by appointing more talented [characters_with_icon|e] to the [cabinet_members_with_icon|e], and also by increasing the global [cabinet_efficiency_with_icon|e] of our [country].\n@hint! Integration will be much faster if our [primary_culture_with_icon|e] is the [dominant_culture_with_icon|e] of the Location, or if our [cultural_influence_with_icon|e] is higher than the [cultural_tradition_with_icon|e] of the [dominant_culture]." #NEW
 
 hint_has_conquered_provinces_diplomatic: "\"I sudditi di recente... #italic acquisizione #! non si sottometteranno immediatamente al nostro dominio. L'Integrazione è un processo lungo e arduo, ma essenziale per la stabilità del reame.\""
 hint_has_conquered_provinces_administrative: "\"Gli affari non possono prosperare quando la terra è in subbuglio. Lo stato di diritto è fondamentale per la prosperità.\""
 hint_has_conquered_provinces_military: "\"I burocrati non sono sempre inutili. Non potremmo assolutamente arruolare la popolazione senza i quadri amministrativi adeguati in posizione.\""


 ### Possible Cabinet Actions
 hint_has_possible_cabinet_action: "Possibili Azioni di Gabinetto"
 hint_has_possible_cabinet_action_hint_text: "$hint_has_possible_cabinet_action_hint_text_1$\n\n$hint_has_possible_cabinet_action_hint_text_2$\n\n$hint_has_possible_cabinet_action_hint_text_3$"
 hint_has_possible_cabinet_action_hint_text_1: "Le [cabinet_actions_with_icon|e] sono tra gli strumenti più potenti che abbiamo per governare la nostra nazione. Dovremmo utilizzare tutti i nostri [cabinet_seats_with_icon|e] disponibili in ogni momento."
# hint_has_possible_cabinet_action_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] per vedere le Azioni di Gabinetto disponibili per noi.\n@arrow_bonus_tier_3! [ShowCabinetActionName('integrate_province')] se abbiamo un territorio appena [Concept('conquered', 'Conquistato')|e].\n@arrow_bonus_tier_2! [ShowCabinetActionName('stabilize_country')] se la [stability|e] è bassa.\n@arrow_bonus_tier_2! [ShowCabinetActionName('strengthen_government')] se la [legitimacy_with_icon|e] è bassa.\n@arrow_bonus_tier_2! [ShowCabinetActionName('diplomatic_endeavors')] per facilitare la [diplomacy|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('change_societal_values')] se c'è un particolare [societal_value|e] che volete perseguire.\n@arrow_bonus_tier_1! [ShowCabinetActionName('develop_province')] per aumentare lo [development_with_icon|e] nelle nostre [provinces_with_icon|e] più preziose.\n@arrow_bonus_tier_1! Le [cabinet_actions] possono anche essere usate per [convert_with_icon|e] altre [religions_with_icon|e] o [assimilate_with_icon|e] altre [cultures_with_icon|e].\n@automation! Potete anche automatizzare il Gabinetto dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." #OLD
 hint_has_possible_cabinet_action_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Go to the @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] to see the Cabinet Actions available to us.\n@arrow_bonus_tier_3! [ShowCabinetActionName('integrate_province')] if we have newly [conquered_with_icon|e] territory.\n@arrow_bonus_tier_2! [ShowCabinetActionName('stabilize_country')] if [stability_with_icon|e] is low.\n@arrow_bonus_tier_2! [ShowCabinetActionName('strengthen_government')] if [legitimacy_with_icon|e] is low.\n@arrow_bonus_tier_2! [ShowCabinetActionName('diplomatic_endeavors')] for easier [diplomacy_with_icon|e].\n@arrow_bonus_tier_1! [ShowCabinetActionName('change_societal_values')] if there is a particular [societal_value_with_icon|e] you want to pursue.\n@arrow_bonus_tier_1! [ShowCabinetActionName('develop_province')] to increase [development_with_icon|e] in our most valuable [provinces_with_icon|e].\n@arrow_bonus_tier_1! [cabinet_actions] can also be used to [convert_with_icon|e] other [religions_with_icon|e] or [assimilate_with_icon|e] other [cultures_with_icon|e].\n@automation! You can also Automate the Cabinet from the @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." #NEW
# hint_has_possible_cabinet_action_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [characters|e] nominati nel [cabinet|e] aumenteranno il [estate_power|e] al quale appartengono.\n@hint! Nuove [cabinet_actions] si sbloccheranno nelle [ages|e] successive." #OLD
 hint_has_possible_cabinet_action_hint_text_3: "#T Extra Hints:#!\n@hint! [characters_with_icon|e] appointed to the [cabinet_with_icon|e] will increase the [estate_power_with_icon|e] of their [estate_with_icon|e].\n@hint! New [cabinet_actions] will unlock in later [ages_with_icon|e]." #NEW
 
 hint_has_possible_cabinet_action_diplomatic: "\"La burocrazia è la linfa vitale di ogni Paese... se usata con saggezza.\""
 hint_has_possible_cabinet_action_administrative: "\"Attraverso il Gabinetto, lo Stato ha il potere di trasformare deserti brulli in metropoli fiorenti.\""
 hint_has_possible_cabinet_action_military: "\"Un Gabinetto potente può essere usato per domare i membri più discordanti della nostra società.\nDate gli ordini e sarà fatto.\""
 
 
 ### Laws not codified
 hint_has_possible_law: "Leggi Non Codificate"
 hint_has_possible_law_hint_text: "$hint_has_possible_law_hint_text_1$\n\n$hint_has_possible_law_hint_text_2$\n\n$hint_has_possible_law_hint_text_3$"
# hint_has_possible_law_hint_text_1: "È consigliabile avere sempre una [policy|e] attiva per tutte le nostre [laws|e]. Altrimenti il nostro [country|e] potrebbe perdere alcuni utili benefici." #OLD
 hint_has_possible_law_hint_text_1: "It is advisable to always have a [policy_with_icon|e] active for all our [laws_with_icon|e]. Otherwise our [country_with_icon|e] might be missing out on some useful benefits." #NEW
# hint_has_possible_law_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'Avviso per scorrere le nostre [laws] senza una [policy] emanata e scegliete con cura.\n@arrow_bonus_tier_3! Potete andare al @government_panel![Link('government', 'tabcontent = politics', 'lateralview_government_entry_name')] per vedere le nostre attuali [laws].\n@automation! Potete anche automatizzare le nostre Leggi dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." #OLD
 hint_has_possible_law_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Click on the Alert to cycle through our [laws] without an enacted [policy], and choose carefully.\n@arrow_bonus_tier_3! You can go to the @government_panel! [Link('government', 'tabcontent = politics', 'lateralview_government_entry_name')] to see our current [laws].\n@automation! You can also Automate our Laws from the @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." #NEW
# hint_has_possible_law_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le [policies] hanno un tempo di attuazione che dipende dalla nostra [legislative_efficiency|e]. I loro effetti completi non saranno attivi immediatamente.\n@hint! Potete sempre cambiare una [policy] in seguito spendendo un po' di [gold|e] e [stability|e]. Il costo dipenderà dal nostro [crown_power|e].\n@hint! Molte nuove [laws] e [policies] si sbloccheranno nelle [ages|e] successive." #OLD
 hint_has_possible_law_hint_text_3: "#T Extra Hints:#!\n@hint! [policies] have an implementation time depending on our [legislative_efficiency_with_icon|e]. Their full effects will not be active immediately.\n@hint! You can always change a [policy] later spending some [gold_with_icon|e] and [stability_with_icon|e]. The cost will depend on our [crown_power_with_icon|e].\n@hint! Many new [laws] and [policies] will unlock in later [ages_with_icon|e]." #NEW
 
 hint_has_possible_law_diplomatic: "\"Uno Stato senza Leggi è un edificio senza pilastri, un corpo senza arti. Meglio troppe, che troppo poche.\""
 hint_has_possible_law_administrative: "\"Le Leggi del nostro Paese dovrebbero assicurare la crescita delle nostre città, la protezione dei nostri mercanti e l'ordinata esazione delle nostre tasse.\""
 hint_has_possible_law_military: "\"Emanare Leggi è importante; farle rispettare è cruciale.\""
 
 
 ### Lack of commander
 hint_has_army_without_leader: "Mancanza di Comandante"
 hint_has_army_without_leader_hint_text: "$hint_has_army_without_leader_hint_text_1$\n\n$hint_has_army_without_leader_hint_text_2$\n\n$hint_has_army_without_leader_hint_text_3$"
# hint_has_army_without_leader_hint_text_1: "Le nostre [units|e] devono avere un [commander|e] nominato per funzionare adeguatamente in [battle|e]. I [generals|e] guidano gli [armies], gli [admirals|e] guidano le [navies]." #OLD
 hint_has_army_without_leader_hint_text_1: "Our [units_with_icon|e] need to have a [commander_with_icon|e] appointed in order to perform adequately in [battle_with_icon|e]. [generals_with_icon|e] lead [armies], [admirals] lead [navies]." #NEW
# hint_has_army_without_leader_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'#W Avviso#! per selezionare un [character|e] adatto per la vostra [unit]. In generale dovreste scegliere quelli con [abilities|e] più alte.\n@arrow_bonus_tier_2! Potete anche selezionare la vostra [unit] dalla mappa o dall'#W Outliner#!.\n@arrow_bonus_tier_2! Se non abbiamo alcun [character] valido disponibile, provate ad addestrarne uno dal @military_panel![Link('unit_overview', '', 'lateralview_unit_overview_entry_name')].\n@automation! Potete automatizzare la nomina di [generals] e [admirals] dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." #OLD
 hint_has_army_without_leader_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Click on the #W Alert#! to select a suitable [character_with_icon|e] for your [unit]. You should generally pick the ones with higher [abilities_with_icon|e].\n@arrow_bonus_tier_2! You can also select your [unit] from the map, or from the #W Outliner#!.\n@arrow_bonus_tier_2! If we do not have any good [character] available, try training one from the @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')].\n@automation! You can automate the appointment of [generals] and [admirals] from the @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." #NEW
# hint_has_army_without_leader_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Non iniziate una [battle] senza un [commander|e] capace al comando!\n@hint! Alcuni [characters|e] hanno [traits|e] che li rendono ancora più adatti a un compito specifico.\n@hint! Alcune [laws|e] potrebbero imporre restrizioni su quali [characters|e] sono idonei al comando." #OLD
 hint_has_army_without_leader_hint_text_3: "#T Extra Hints:#!\n@hint! Do not start a [battle] without a capable [commander_with_icon|e] in charge!\n@hint! Some [characters_with_icon|e] have [traits_with_icon|e] that make them even more suitable for a specific task.\n@hint! Some [laws_with_icon|e] might put restrictions on which [characters_with_icon|e] are eligible for command." #NEW
 
 hint_has_army_without_leader_diplomatic: "\"Un esercito dovrebbe sempre avere un capo. Ma dovremmo esercitare cautela, poiché i comandanti useranno la loro influenza per aumentare il potere della loro Tenuta.\""
 hint_has_army_without_leader_administrative: "\"Per carità non chiedetelo a me. Affido le questioni brutali della guerra ai vostri consiglieri meno... #italic sofisticati#!.\""
 hint_has_army_without_leader_military: "\"Ingaggiare il nemico senza una leadership adeguata è un suicidio.\nNon fatelo in nessuna circostanza.\""


 ### Underage Heir
 hint_is_heir_underage: "Erede Minorenne"
 hint_is_heir_underage_hint_text: "$hint_is_heir_underage_hint_text_1$\n\n$hint_is_heir_underage_hint_text_2$"
# hint_is_heir_underage_hint_text_1: "Se il nostro [ruler|e] dovesse morire prima che il nostro [heir|e] raggiunga la maggiore età, ci ritroveremmo sotto una [regency|e]. A seconda delle circostanze, un membro del [estate|e] più potente assumerà le redini del Governo, aumentando significativamente il [estate_power|e] per la durata dell'interregno." #OLD
 hint_is_heir_underage_hint_text_1: "If our [ruler_with_icon|e] were to die before our [heir_with_icon|e] comes of age, we would find ourselves under a [regency_with_icon|e]. Depending on circumstances, a member of the most powerful [estate_with_icon|e] will assume the reins of the Government, significantly increasing their [estate_power_with_icon|e] for the duration of the interregnum." #NEW
 hint_is_heir_underage_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_1! C'è poco che potete fare se non lasciare che il tempo passi, ed evitare forse di rischiare la vita del nostro [ruler] in inutili imprese. A meno che, ovviamente, il nostro [ruler] non fosse particolarmente incompetente..."
# hint_is_heir_underage_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Una [regency|e] potrebbe non essere così negativa se abbiamo un [character|e] particolarmente valido che può essere il reggente." #OLD
 hint_is_heir_underage_hint_text_3: "#T Extra Hints:#!\n@hint! A [regency_with_icon|e] may not be that bad if we have a particularly good [character_with_icon|e] that can be the regent." #NEW
 
 hint_is_heir_underage_diplomatic: "\"Assicurare la successione significa garantire il futuro del reame.\""
 hint_is_heir_underage_administrative: "\"I matrimoni e i legami dinastici sono il modo migliore per unire due Paesi.\""
 hint_is_heir_underage_military: "\"È quando sono giovani che gli eredi possono essere forgiati nei migliori sovrani.\""


 ### Unmarried Ruler
 hint_has_unmarried_adult_ruler: "Sovrano Non Sposato"
 hint_has_unmarried_adult_ruler_hint_text: "$hint_has_unmarried_adult_ruler_hint_text_1$\n\n$hint_has_unmarried_adult_ruler_hint_text_2$\n\n$hint_has_unmarried_adult_ruler_hint_text_3$"
# hint_has_unmarried_adult_ruler_hint_text_1: "Dovremmo cercare di far sposare il nostro [ruler|e] con un candidato adatto, al fine di aumentare le dimensioni e il potere della nostra [dynasty|e]. Non solo una prole reale prolifica aiuta a garantire una successione pacifica e stabile, ma i principi possono anche costituire una preziosa riserva di [characters|e] disponibili per le cariche di Governo." #OLD
 hint_has_unmarried_adult_ruler_hint_text_1: "We should try to marry off our [ruler_with_icon|e] to a suitable candidate, in order to grow the size and power of our [dynasty_with_icon|e]. Not only does a prolific royal offspring help ensure a peaceful and stable succession, but princes can also constitute a valuable reserve of available [characters_with_icon|e] for the offices of Government." #NEW
# hint_has_unmarried_adult_ruler_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'Avviso per cercare candidati per un [royal_marriage|e]. Le Monarchie possono formare Matrimoni Reali tra loro per cementare la loro [opinion], ponendo le basi per un'[alliance|e]. I [royal_marriages|e] possono anche aprire la porta a una potenziale [personal_union|e].\n@arrow_bonus_tier_2! Potete sposare il vostro [ruler] o [heir] con un [character|e] adatto nella vostra Corte tramite l'interazione del personaggio [ShowCharacterInteractionName('marry_noble')], facendo clic destro sul ritratto del personaggio.\n@arrow_bonus_tier_1! In assenza di alternative migliori, [ShowCharacterInteractionName('marry_lowborn')] è sempre un'opzione, per quanto impopolare possa essere." #OLD
 hint_has_unmarried_adult_ruler_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Click on the Alert to search for candidates for a [royal_marriage_with_icon|e]. Monarchies can form Royal Marriages between them to cement their [opinion], laying the groundwork for an [alliance_with_icon|e]. [royal_marriages_with_icon|e] can also open the door to a potential [personal_union_with_icon|e].\n@arrow_bonus_tier_2! You can wed your [ruler] or [heir] to a suitable [character_with_icon|e] in your Court via the [ShowCharacterInteractionName('marry_noble')] character interaction, by right-clicking on the character's portrait.\n@arrow_bonus_tier_1! In absence of better alternatives, [ShowCharacterInteractionName('marry_lowborn')] is always an option, unpopular as it may be." #NEW
# hint_has_unmarried_adult_ruler_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [characters] della [dynasty] regnante appartengono alla [ShowEstateTypeName('crown_estate')], quindi non conferiscono potere alle altre [estates|e] del nostro reame quando sono nominati in [roles|e] influenti." #OLD
 hint_has_unmarried_adult_ruler_hint_text_3: "#T Extra Hints:#!\n@hint! [characters] of the ruling [dynasty] belong to the [ShowEstateTypeName('crown_estate')], so they do not empower the other [estates_with_icon|e] of our realm when appointed to influential [roles_with_icon|e]." #NEW
 
 hint_has_unmarried_adult_ruler_diplomatic: "\"Assicurare la successione significa garantire il futuro del reame.\""
 hint_has_unmarried_adult_ruler_administrative: "\"I matrimoni e i legami dinastici sono il modo migliore per unire due Paesi.\""
 hint_has_unmarried_adult_ruler_military: "\"Ogni spada ha bisogno di un fodero.\""


 ### No current Research
 hint_can_do_more_research: "Ricerca"
 hint_can_do_more_research_hint_text: "$hint_can_do_more_research_hint_text_1$\n\n$hint_can_do_more_research_hint_text_2$\n\n$hint_can_do_more_research_hint_text_3$"
# hint_can_do_more_research_hint_text_1: "Dovremmo assicurarci che il nostro [country|e] stia ricercando nuovi [advances|e] in ogni momento." #OLD
 hint_can_do_more_research_hint_text_1: "We should make sure our [country_with_icon|e] is researching new [advances_with_icon|e] at all times." #NEW
# hint_can_do_more_research_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @advances_panel![Link('advances', 'subtab = research', 'lateralview_advances_entry_name')] e scegliete l'Avanzamento che soddisfa le vostre esigenze.\n@arrow_bonus_tier_2! Potete anche cliccare sull'icona della fiaschetta vuota in alto a destra per aprire l'intero @advances_panel![Link('technology_view', '', 'lateralview_technology_view_entry_name')].\n@automation! Se non vi sentite ancora preparati ad immergervi nelle profondità dei [advances], potete automatizzare la Ricerca dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]. Sarete comunque debitamente informati quando il nostro Paese avrà scoperto un nuovo [advance|e]." #OLD
 hint_can_do_more_research_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Go to the @advances_panel! [Link('advances', 'subtab = research', 'lateralview_advances_entry_name')], and choose the Advance that suits your needs.\n@arrow_bonus_tier_2! You can also click on the empty flask icon to the top right to open the whole @advances_panel! [Link('technology_view', '', 'lateralview_technology_view_entry_name')].\n@automation! If you do not feel prepared to dive into the depths of the [advances] just yet, you can automate our Research from the @automation! [Link('automation', '', 'lateralview_automation_entry_name')]. You will still be duly notified when our Country has discovered a new [advance_with_icon|e]." #NEW
# hint_can_do_more_research_hint_text_3: "#T Suggerimenti Aggiuntivi: #!\n@hint! I punti Ricerca non utilizzati verranno immagazzinati fino a un certo punto, dopo di che andranno sprecati.\n@hint! Potete aumentare la velocità dei [research_progress|e] aumentando la nostra [literacy|e] media e l'[estate_satisfaction|e] della nostra [ShowEstateTypeName('clergy_estate')]." #OLD
 hint_can_do_more_research_hint_text_3: "#T Extra Hints: #!\n@hint! Unused Research points will be stored up to a point, after which they will go to waste.\n@hint! You can increase our [research_progress_with_icon|e] speed by increasing our average [literacy_with_icon|e], and the [estate_satisfaction_with_icon|e] of our [ShowEstateTypeName('clergy_estate')]." #NEW
 
 hint_can_do_more_research_diplomatic: "\"La tecnologia offre ampie opportunità per facilitare la gestione dei nostri domini.\""
 hint_can_do_more_research_administrative: "\"Con i dovuti investimenti potremmo migliorare notevolmente l'efficienza della nostra economia.\""
 hint_can_do_more_research_military: "\"Il costante miglioramento dei nostri eserciti professionali è di fondamentale importanza, affinché la nostra potenza non rimanga indietro rispetto a quella dei nostri nemici.\""
 
 
 ### Cabinet lacks member
 hint_lack_cabinet_for_cabinet_action: "Mancanza di Membro del Gabinetto"
 hint_lack_cabinet_for_cabinet_action_hint_text: "$hint_lack_cabinet_for_cabinet_action_hint_text_1$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_2$\n\n$hint_lack_cabinet_for_cabinet_action_hint_text_3$"
# hint_lack_cabinet_for_cabinet_action_hint_text_1: "Una [cabinet_action|e] non sarà molto efficiente senza un [character|e] capace assegnato ad essa. Assegnate sempre [characters] a tutti i nostri [cabinet_seats|e]." #OLD
 hint_lack_cabinet_for_cabinet_action_hint_text_1: "A [cabinet_action_with_icon|e] will not be very efficient without a capable [character_with_icon|e] assigned to it. Always assign [characters] to all our [cabinet_seats_with_icon|e]." #NEW
# hint_lack_cabinet_for_cabinet_action_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Cliccate sull'#W Avviso#! per andare al @government_panel![Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')] e nominate il [character|e] con l'[ability|e] correlata più alta al [cabinet_seat] vuoto.\n@arrow_bonus_tier_1! Considerate di assumere un nuovo [courtier|e] se non abbiamo [characters] validi disponibili.\n@automation! Potete automatizzare il Gabinetto dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." #OLD
 hint_lack_cabinet_for_cabinet_action_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Click on the #W Alert#! to go to the @government_panel! [Link('government', 'tabcontent = cabinet', 'lateralview_government_entry_name')], and appoint the [character_with_icon|e] with the highest related [ability_with_icon|e] to the empty [cabinet_seat].\n@arrow_bonus_tier_1! Consider hiring a new [courtier_with_icon|e] if we do not have good [characters] available.\n@automation! You can Automate the Cabinet from the @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." #NEW
# hint_lack_cabinet_for_cabinet_action_hint_text_3: "#T Suggerimenti Aggiuntivi: #!\n@hint! Ogni [cabinet_action|e] utilizza una delle tre [abilities|e] del personaggio, quindi dovete scegliere attentamente i vostri membri a seconda del compito che intendete assegnare loro.\n@hint! I [cabinet_members|e] aumenteranno l'[estate_power|e] della [estate|e] a cui appartengono." #OLD
 hint_lack_cabinet_for_cabinet_action_hint_text_3: "#T Extra Hints: #!\n@hint! Each [cabinet_action_with_icon|e] uses one of the three character [abilities_with_icon|e], so you need to choose your members carefully depending on the task you plan to assign to them.\n@hint! [cabinet_members_with_icon|e] will increase the [estate_power_with_icon|e] of the [estate_with_icon|e] they belong to." #NEW
 
 hint_lack_cabinet_for_cabinet_action_diplomatic: "\"La migliore amministrazione utilizzerà sempre le persone migliori.\""
 hint_lack_cabinet_for_cabinet_action_administrative: "\"Quanto meglio funziona il nostro Paese, tanto migliore sarà l'immagine esterna che presenteremo.\""
 hint_lack_cabinet_for_cabinet_action_military: "\"Solo con un'amministrazione efficiente saremo in grado di proiettare chiaramente la nostra forza.\""


 ### Inflation
 hint_inflation: "Inflazione"
 hint_inflation_hint_text: "$hint_inflation_hint_text_1$\n\n$hint_inflation_hint_text_2$"
# hint_inflation_hint_text_1: "L'Inflazione aumenta semplicemente tutte le spese per il nostro [country|e], quindi andrebbe sempre evitata. Cresce abbastanza rapidamente a causa della [minting|e], ma può essere ingannevolmente difficile da ridurre." #OLD
 hint_inflation_hint_text_1: "Inflation simply increases all expenses for our [country_with_icon|e], so it should always be avoided. It grows fairly quickly from [minting_with_icon|e], but it can be deceptively difficult to reduce." #NEW
# hint_inflation_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Se l'Inflazione sta crescendo, regolate il cursore di [minting] nel @economy_panel![Link('economy', '', 'lateralview_economy_entry_name')] per impedirle di aumentare.\n@arrow_bonus_tier_2! Se abbiamo già una certa inflazione, impostare il cursore al minimo ne favorirà la diminuzione." #OLD
 hint_inflation_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! If Inflation is growing, adjust the [minting] slider in the @economy_panel! [Link('economy', '', 'lateralview_economy_entry_name')] to keep [inflation] from growing.\n@arrow_bonus_tier_2! If we have some inflation already, setting the slider to the minimum will prompt it to decrease." #NEW
# hint_inflation_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Possiamo ottenere altre fonti di riduzione dell'inflazione, ad esempio dagli [advances|e]." #OLD
 hint_inflation_hint_text_3: "#T Extra Hints:#!\n@hint! We can get other sources of inflation reduction, for example from [advances_with_icon|e]." #NEW
 
 hint_inflation_diplomatic: "\"Possiamo essere risparmiati da questa invisibile malattia dell'economia.\""
 hint_inflation_administrative: "\"Il Conio può essere un rimedio allettante per un bilancio in difficoltà, ma anche la fonte di prolungate sventure.\""
 hint_inflation_military: "\"L'inflazione è un assassino lento e insidioso.\""
 
 
 ### Disloyal Subjects
 hint_has_disloyal_subjects: "Sudditi Sleali"
 hint_has_disloyal_subjects_hint_text: "$hint_has_disloyal_subjects_hint_text_1$\n\n$hint_has_disloyal_subjects_hint_text_2$\n\n$hint_has_disloyal_subjects_hint_text_3$"
# hint_has_disloyal_subjects_hint_text_1: "I nostri [subjects|e] sono [countries|e] subordinati a noi in un modo o nell'altro. Di solito ci pagano la [subject_taxation|e] e sono chiamati alle nostre [wars|e].\n\nSe la [subject_loyalty|e] scende sotto #W 50#!, saranno considerati sleali e non ci aiuteranno nelle nostre [wars]. I nostri Sudditi sleali possono unirsi per formare un [GetInternationalOrganizationType('independence_movement').GetName], potendo iniziare una [war] contro di noi se si sentono abbastanza forti." #OLD
 hint_has_disloyal_subjects_hint_text_1: "Our [subjects_with_icon|e] are [countries_with_icon|e] that are subordinated to us in one way or another. They usually pay [subject_taxation_with_icon|e] to us, and are called to our [wars_with_icon|e].\n\nIf their [subject_loyalty_with_icon|e] drops below #W 50#!, they will be considered disloyal and will not help us in our [wars]. Our disloyal Subjects may band together to form an [GetInternationalOrganizationType('independence_movement').GetName], potentially starting a [war] against us if they feel strong enough." #NEW
# hint_has_disloyal_subjects_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicuratevi che l'[opinion|e] dei nostri Sudditi nei nostri confronti rimanga alta. Potete aumentarla usando l'[diplomatic_action|e] $IMPROVE_RELATIONTITLE$.\n@arrow_bonus_tier_1! Potete considerare di [annex|e] altri Sudditi leali. Aumentare il nostro potere relativo rispetto a tutti i nostri Sudditi ne aumenterà la lealtà.\n@arrow_bonus_tier_1! Aumentare le dimensioni dei nostri [armies|e] intimidirà i nostri Sudditi, aumentando la loro lealtà." #OLD
 hint_has_disloyal_subjects_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Make sure our Subject's [opinion_with_icon|e] of us remains high. You can increase it using the $IMPROVE_RELATIONTITLE$ [diplomatic_action_with_icon|e].\n@arrow_bonus_tier_1! You can consider [annexing_with_icon|e] other loyal Subjects. Increasing our relative power compared to all our Subjects will increase their loyalty.\n@arrow_bonus_tier_1! Increasing the size of our [armies_with_icon|e] will intimidate our Subjects, raising their loyalty." #NEW
# hint_has_disloyal_subjects_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potete ottenere una panoramica dei nostri Sudditi nel pannello Sudditi, all'interno del @diplomacy_panel![Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')].\n@hint! Più [subjects] abbiamo e più sono potenti in relazione al nostro potere, più difficile diventerà mantenere alta la loro [subject_loyalty].\n@hint! Diversi tipi di [subjects] hanno diverse caratteristiche e limitazioni." #OLD
 hint_has_disloyal_subjects_hint_text_3: "#T Extra Hints:#!\n@hint! You can get an overview of our Subjects in the Subject panel, inside the @diplomacy_panel! [Link('diplomacy', 'relations_tab = current_relations', 'lateralview_diplomacy_entry_name')].\n@hint! The more and more powerful [subjects] we have in relation with our own power, the harder it will become to keep their [subject_loyalty] high.\n@hint! Different types of [subjects] have different characteristics and limitations." #NEW
 hint_has_disloyal_subjects_diplomatic: "\"Dovremmo coltivare buone relazioni con i nostri Sudditi in ogni momento, per timore che inizino a considerarsi padroni del proprio destino.\""
 hint_has_disloyal_subjects_administrative: "\"I Sudditi sono un'aggiunta redditizia al nostro Tesoro.\nNon lasciate che se ne accorgano.\""
 hint_has_disloyal_subjects_military: "\"La pecora si allontanerà alla prima opportunità. Faremmo meglio a essere pronti a scatenare i cani della guerra!\""

 ### Buildings missing inputs
 hint_has_buildings_missing_input: "Edifici con Input Mancanti"
 hint_has_buildings_missing_input_hint_text: "$hint_has_buildings_missing_input_hint_text_1$\n\n$hint_has_buildings_missing_input_hint_text_2$\n\n$hint_has_buildings_missing_input_hint_text_3$"
# hint_has_buildings_missing_input_hint_text_1: "Gli [buildings|e] necessitano di accedere ai [goods|e] dai loro [markets] per funzionare correttamente. Se non riescono ad acquistare tutti i [goods] di cui hanno bisogno, la loro produzione sarà ridotta di conseguenza." #OLD
 hint_has_buildings_missing_input_hint_text_1: "[buildings_with_icon|e] need access to [goods_with_icon|e] from their [markets] to work properly. If they cannot buy all the [goods] they need, their output will be appropriately reduced." #NEW
 hint_has_buildings_missing_input_hint_text_2: "#T Azioni Raccomandate:#!\n$hint_address_shortage_text$"
 hint_has_buildings_missing_input_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Non tutte le carenze degli Edifici pongono un problema critico al nostro Paese. Tuttavia, potremmo volerci assicurare il corretto funzionamento di alcune catene di produzione particolarmente strategiche.\n@hint! Ad esempio, potremmo non essere in grado di reclutare [ShowUnitDefinitionName('a_footmen')] se la nostra [ShowBuildingTypeName('weapon_guild')] non può acquistare abbastanza [ShowGoodsName('lumber')] dal suo [market]."
 
 hint_has_buildings_missing_input_diplomatic: "\"Alcuni Edifici sono particolarmente necessari al corretto funzionamento del nostro reame.\""
 hint_has_buildings_missing_input_administrative: "\"I nostri mercanti dovrebbero cercare di affrontare qualsiasi carenza nei nostri Mercati. Ma a volte la mano invisibile del Mercato richiede... una piccola spinta.\""
 hint_has_buildings_missing_input_military: "\"Dovremmo garantire una fornitura costante di armi e rifornimenti militari prima di impegnarci in qualsiasi operazione militare.\""
 
# hint_address_shortage_text: "Cliccare sull'#W Avviso#! vi condurrà al @production_panel![Link('goods_production', '', 'lateralview_goods_production_entry_name')] filtrato con i [goods] mancanti nel [market] interessato.\nPotete aumentare la [supply|e] di un [good|e] nei nostri [markets|e] in tre modi chiave:\n\n@arrow_bonus_tier_3! Cliccate sul pulsante @rgo! [rgo|e] per vedere un elenco delle nostre [locations] in quel [market] con l'[rgo] pertinente. Ricordate che solo le [raw_materials|e] possono essere prodotte in [rgo].\n@arrow_bonus_tier_2! Cliccate sul pulsante @building! [building|e] per vedere un elenco di tutti gli [buildings] disponibili che possono produrre quel [good] specifico.\n@arrow_bonus_tier_2! Cliccate sul pulsante @import! [import|e] per importare il [good] da un altro Mercato utilizzando [merchant_capacity|e].\n@automation! Potete automatizzare la costruzione dei nostri [buildings] e [rgo], così come il nostro [trade|e], dal @automation![Link('automation', '', 'lateralview_automation_entry_name')]." #OLD
 hint_address_shortage_text: "Clicking on the #W Alert#! will take you to the @production_panel! [Link('goods_production', '', 'lateralview_goods_production_entry_name')] filtered with the missing [goods] in the affected [market].\nYou can increase the [supply_with_icon|e] of a [good_with_icon|e] in our [markets_with_icon|e] in three key ways:\n\n@arrow_bonus_tier_3! Click on the @rgo! [rgo|e] button to see a list of our [locations] in this [market] with the relevant [rgo]. Remember only [raw_materials_with_icon|e] can be produced in [rgo]\n@arrow_bonus_tier_2! Click on the @building! [building|e] button to see a list of all available [buildings] that can produce that specific [good].\n@arrow_bonus_tier_2! Click on the @import! [import|e] button to import the [good] from another Market using [merchant_capacity_with_icon|e].\n@automation! You can automate our [buildings] and [rgo] construction, as well as our [trade_with_icon|e], from the @automation! [Link('automation', '', 'lateralview_automation_entry_name')]." #NEW
 
 ### Construction missing input
 hint_has_constructions_missing_input: "Input di Costruzione Mancante"
 hint_has_constructions_missing_input_hint_text: "$hint_has_constructions_missing_input_hint_text_1$\n\n$hint_has_constructions_missing_input_hint_text_2$\n\n$hint_has_constructions_missing_input_hint_text_3$"
# hint_has_constructions_missing_input_hint_text_1: "Tutte le [constructions|e] necessitano di accedere a determinati [goods|e] dal [market|e] della [location|e]. Se non ci sono abbastanza [goods] disponibili, la [construction] si bloccherà." #OLD
 hint_has_constructions_missing_input_hint_text_1: "All [constructions_with_icon|e] need access to certain [goods_with_icon|e] from the [market_with_icon|e] of the [location_with_icon|e]. If there are not enough [goods] available, [construction] will stall." #NEW
 hint_has_constructions_missing_input_hint_text_2: "#T Azioni Raccomandate:#!\n$hint_address_shortage_text$"
# hint_has_constructions_missing_input_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Tutte le [locations] in un [market] accedono ai [goods] di cui hanno bisogno per tutti gli scopi in ordine di [market_access|e], indipendentemente da chi abbia originariamente prodotto il bene.\n@hint! Ciò significa che le [locations] più vicine ai [market_centers|e] avranno più facilità ad accedere ai beni di cui hanno bisogno." #OLD
 hint_has_constructions_missing_input_hint_text_3: "#T Extra Hints:#!\n@hint! All [locations] in a [market] access the [goods] they need for all purposes in order of their [market_access_with_icon|e], regardless of who produced the good originally.\n@hint! This means that [locations] that are closer to [market_centers_with_icon|e] will have an easier time accessing the goods they need." #NEW
 
 hint_has_constructions_missing_input_diplomatic: "\"Un controllo accurato di tutte le risorse e i bisogni è cruciale per qualsiasi impresa.\""
 hint_has_constructions_missing_input_administrative: "\"La diplomazia e il commercio saranno in grado di fornirci tutto ciò che non possiamo produrre da soli.\""
 hint_has_constructions_missing_input_military: "\"Dobbiamo essere in grado di soddisfare tutte le nostre esigenze di fornitura e richieste se vogliamo evitare che altri sfruttino le nostre debolezze.\""

 ### Construction missing input
 hint_lack_pop_promotion_to_fill_buildings: "Edifici o [rgo] con dipendenti mancanti"
 hint_lack_pop_promotion_to_fill_buildings_hint_text: "$hint_lack_pop_promotion_to_fill_buildings_hint_text_1$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_2$\n\n$hint_lack_pop_promotion_to_fill_buildings_hint_text_3$"
# hint_lack_pop_promotion_to_fill_buildings_hint_text_1: "Diversi [buildings|e] impiegano diverse [pop_types|e]. Se non ci sono abbastanza [pops|e] liberi della [pop_type] richiesta al termine della costruzione del nuovo [building], i [ShowPopTypeName('peasants')] inizieranno la [promotion|e] di personale idoneo a ricoprirne l'incarico, in base alla [ShowModifierTypeName('local_pop_promotion_speed')] della [location|e].\n\nGli Edifici possono anche perdere dipendenti quando i [pops] muoiono a causa di [diseases|e], [sieges|e] o [starvation|e]." #OLD
 hint_lack_pop_promotion_to_fill_buildings_hint_text_1: "Different [buildings_with_icon|e] employ different [pop_types_with_icon|e]. If there are not enough free [pops_with_icon|e] available of the required [pop_type] when a new [building] is finished, [ShowPopTypeName('peasants')] will start to [promote_with_icon|e] according to the [ShowModifierTypeName('local_pop_promotion_speed')] of the [location_with_icon|e].\n\nBuildings can also lose employees when [pops] die due to [diseases_with_icon|e], [sieges_with_icon|e], or [starvation_with_icon|e]." #NEW
# hint_lack_pop_promotion_to_fill_buildings_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Non costruite in [locations] in cui mancano già troppi dipendenti.\n@arrow_bonus_tier_2! Aumentate le fonti importanti di velocità di promozione per la [location]: [stability|e], [literacy|e] e [control|e].\n@arrow_bonus_tier_1! Costruite una [ShowBuildingTypeName('library')] e un [ShowBuildingTypeName('university')] nelle nostre [locations] più importanti.\n@arrow_bonus_tier_1! Considerate di distruggere gli [buildings] meno utili per liberare forza lavoro." #OLD
 hint_lack_pop_promotion_to_fill_buildings_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Do not build in [locations] that are already missing too many employees.\n@arrow_bonus_tier_2! Increase important sources of promotion speed for the [location]: [stability_with_icon|e], [literacy_with_icon|e], and [control_with_icon|e].\n@arrow_bonus_tier_1! Build a [ShowBuildingTypeName('library')] and a [ShowBuildingTypeName('university')] in our most important [locations].\n@arrow_bonus_tier_1! Consider destroying the less useful [buildings] to free up some workforce." #NEW
# hint_lack_pop_promotion_to_fill_buildings_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le [urban_locations|e] hanno una quantità base maggiore di [pops] [upper_class|e] disponibili.\n@hint! Ricordate che una [location] deve avere almeno alcuni [ShowPopTypeName('peasants')] [available|e] affinché la [promotion] avvenga.\n@hint! Potete controllare la [ShowModifierTypeName('local_pop_promotion_speed')] di una [location] nella #W Scheda Demografia#! del #W Pannello Località#!." #OLD
 hint_lack_pop_promotion_to_fill_buildings_hint_text_3: "#T Extra Hints:#!\n@hint! [urban_locations_with_icon|e] have a higher base amount of available [upper_class_with_icon|e] [pops].\n@hint! Remember a [location] needs to have at least some [available_with_icon|e] [ShowPopTypeName('peasants')] for [promotion] to occur.\n@hint! You can check the [ShowModifierTypeName('local_pop_promotion_speed')] of a [location] in the #W Demography Tab#! of the #W Location Panel#!." #NEW
 
 hint_lack_pop_promotion_to_fill_buildings_diplomatic: "\"Cos'è un'industria senza le persone che ci lavorano?\""
 hint_lack_pop_promotion_to_fill_buildings_administrative: "\"Se il nostro popolo non lavora, altri Paesi potrebbero chiamarci pigri.\""
 hint_lack_pop_promotion_to_fill_buildings_military: "\"È dovere della popolazione lavorare e produrre ciò di cui il Paese ha bisogno.\""
 
 ### Casus Belli
 hint_casus_belli: "Casus Belli"
 hint_casus_belli_hint_text: "$hint_casus_belli_hint_text_1$\n\n$hint_casus_belli_hint_text_2$\n\n$hint_casus_belli_hint_text_3$"
# hint_casus_belli_hint_text_1: "Un [casus_belli|e] è una ragione legittima per iniziare una [war|e]. Andare in guerra senza un Casus Belli appropriato è comunque possibile, ma far rispettare le nostre richieste in un [peace_treaty|e] sarà più difficile e i nostri vicini reagiranno con maggiore ostilità alle nostre azioni." #OLD
 hint_casus_belli_hint_text_1: "A [casus_belli_with_icon|e] is a legitimate reason to start a [war_with_icon|e]. Going to war without a proper Casus Belli is still possible, but enforcing our demands in a [peace_treaty_with_icon|e] will be harder, and our neighbors will react with increased hostility to our actions." #NEW
# hint_casus_belli_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il modo migliore per ottenere un Casus Belli è richiederne uno dal nostro [parliament|e]. Potete convocare una sessione del Parlamento dal @government_panel![Link('government', 'tabcontent = parliament', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Creare una [spy_network|e] in [countries] stranieri ci permetterà di fabbricare un Casus Belli contro di loro, se abbiamo [location|e] [cores|e] nella loro terra, o se sono i nostri [rivals|e]." #OLD
 hint_casus_belli_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! The best way to obtain a Casus Belli is requesting one from our [parliament_with_icon|e]. You can call a Parliament session from the @government_panel! [Link('government', 'tabcontent = parliament', 'lateralview_government_entry_name')].\n@arrow_bonus_tier_2! Creating a [spy_network_with_icon|e] in foreign [countries] will allow us to fabricate a Casus Belli against them, if we have [cores_with_icon|e] in their land, or if they are our [rivals_with_icon|e]." #NEW
# hint_casus_belli_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ricordate che non tutte le [wars] sono giuste e possiamo andare in guerra senza un Casus Belli. Un buon Casus Belli è una risorsa utile, ma il più delle volte, la forza fa il diritto.\n@hint! Ogni Casus Belli ha un [war_goal|e] specifico. Soddisfare il [war_goal] durante la [war] ci garantirà [war_score|e], che è essenziale per la vittoria.\n@hint! [events|e] e [situations|e] possono concedere speciali Casus Belli." #OLD
 hint_casus_belli_hint_text_3: "#T Extra Hints:#!\n@hint! Remember not all [wars] are just, and we can go to war without a Casus Belli. A good Casus Belli is a useful asset, but more often than not, might makes right.\n@hint! Every Casus Belli has a specific [war_goal_with_icon|e]. Fulfilling the [war_goal] during the [war] will grant us [war_score_with_icon|e], which is essential to victory.\n@hint! [events_with_icon|e] and [situations_with_icon|e] can grant special Casus Belli." #NEW
 
 hint_casus_belli_diplomatic: "\"Anche in guerra ci sono regole che devono essere rispettate.\""
 hint_casus_belli_administrative: "\"Un buon Casus Belli ci permetterebbe di dichiarare una guerra senza incorrere nell'ira dei nostri vicini.\""
 hint_casus_belli_military: "\"Il miglior Casus Belli, mio Signore, è nessun Casus Belli.\""

 ### Levies
 hint_has_unraised_levies_in_war: "Leve"
 hint_has_unraised_levies_in_war_hint_text: "$hint_has_unraised_levies_in_war_hint_text_1$\n\n$hint_has_unraised_levies_in_war_hint_text_2$\n\n$hint_has_unraised_levies_in_war_hint_text_3$"
 hint_has_unraised_levies_in_war_hint_text_1: "Le [levies_with_icon|e] costituiscono il grosso dell'esercito di qualsiasi [country_with_icon|e] nei primi secoli del gioco, prima che vengano sostituite da soldati professionisti, noti come [regulars_with_icon|e]. Fino ad allora, è consigliabile arruolare sempre le nostre [levies] durante una [war_with_icon|e]."
# hint_has_unraised_levies_in_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Quando inizia la guerra, cliccate sull'#W Avviso#! per andare a #W Arruola Milizia#! nel @military_panel![Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]. Da lì potete arruolare tutte le [levies] in una volta, o selezionare le [provinces_with_icon|e] specifiche che desiderate arruolare.\n@arrow_bonus_tier_2! È una buona idea ridurre la nostra dipendenza dalle [levies] con i [regular_regiments] superiori ma costosi. Per questo dovrete costruire una [ShowBuildingTypeName('sergeantry')].\n@arrow_bonus_tier_1! In tempi di necessità, i [mercenaries_with_icon|e] possono essere un buon complemento, o persino un sostituto, delle nostre [levies], se abbiamo monete da spendere. Potete assoldare [mercenaries] dal @military_panel![Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]." #OLD
 hint_has_unraised_levies_in_war_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! When war starts, click on the #W Alert#! to go to #W Raise Levy#! in the @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]. From there you can raise all [levies] at once, or select the specific [provinces_with_icon|e] you wish to draft.\n@arrow_bonus_tier_2! It is a good idea to reduce our reliance on [levies] with the superior but expensive [regular_regiments]. For that you will need to buid a [ShowBuildingTypeName('sergeantry')].\n@arrow_bonus_tier_1! In times of need, [mercenaries_with_icon|e] can be a good complement, or even substitute, to our [levies], if we have the coin to spare. You can hire [mercenaries] from the @military_panel! [Link('unit_overview', '', 'lateralview_unit_overview_entry_name')]." #NEW
 hint_has_unraised_levies_in_war_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Le [levies] provengono principalmente dai [pops_with_icon|e] della vostra [primary_culture_with_icon|e] e delle [accepted_cultures_with_icon|e], ma la quantità che potete arruolare da ogni [location] dipenderà dal suo [control_with_icon|e].\n@hint! Tenete a mente che la produzione di [food_with_icon|e] e [rgo_with_icon|e] diminuirà nelle [locations] arruolate fino a quando gli uomini non torneranno a casa.\n@hint! Fate attenzione: ogni contadino che muore in battaglia è un contadino in meno per lavorare nei campi."
 
 hint_has_unraised_levies_in_war_diplomatic: "\"Le persone devono lavorare, ma devono anche difendere le loro case se attaccate.\""
 hint_has_unraised_levies_in_war_administrative: "\"Se le persone si fidano di noi, verranno in nostro aiuto se chiamate.\""
 hint_has_unraised_levies_in_war_military: "\"Avere un campo da arare non è una scusa quando c'è una guerra da vincere.\""
 
 
 ### No allies
 hint_no_allies: "Nessun Alleato"
 hint_no_allies_hint_text: "$hint_no_allies_hint_text_1$\n\n$hint_no_allies_hint_text_2$\n\n$hint_no_allies_hint_text_3$"
# hint_no_allies_hint_text_1: "Un'[alliance|e] è un [treaty|e] tra due [countries|e] che consente loro di entrare nelle [wars|e] reciproche. Se siamo attaccati, i nostri [allies] riceveranno una [call_to_arms|e] per entrare in guerra dalla nostra parte. Al contrario, dovremmo sempre tenere conto degli alleati del nostro nemico quando dichiariamo una [war] noi stessi, poiché è probabile che si schierino contro di noi." #OLD
 hint_no_allies_hint_text_1: "An [alliance_with_icon|e] is a [treaty_with_icon|e] between two [countries_with_icon|e] that allows them to enter each other's [wars_with_icon|e]. If we are attacked, our [allies] will receive a [call_to_arms_with_icon|e] to enter the war on our side. Conversely, we should always take our enemy's allies into account when declaring a [war] ourselves, as they will likely get involved against us." #NEW
# hint_no_allies_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @diplomacy_panel![Link('diplomacy_macrobuilder', '', 'lateralview_diplomacy_macrobuilder_entry_name')] e cliccate su $offer_alliance$, sotto #W $CATEGORY_FRIENDLY_ACTIONS$#!. Vedrete un elenco di tutti i [countries] disposti a firmare un'[alliance|e] con noi.\n@arrow_bonus_tier_2! Alcuni [countries] potrebbero aver bisogno di essere convinti. Usare l'[diplomatic_action|e] #W $IMPROVE_RELATIONTITLE$#! li farà lentamente propendere dalla nostra parte." #OLD
 hint_no_allies_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Go to the @diplomacy_panel! [Link('diplomacy_macrobuilder', '', 'lateralview_diplomacy_macrobuilder_entry_name')], and click on $offer_alliance$, under #W $CATEGORY_FRIENDLY_ACTIONS$#!. You will see a list of all [countries] willing to sign an [alliance_with_icon|e] with us.\n@arrow_bonus_tier_2! Some [countries] might need some convincing. Using the #W $IMPROVE_RELATIONTITLE$#! [diplomatic_action_with_icon|e] will slowly gain them over." #NEW
 hint_no_allies_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Attenzione: i nostri Alleati potrebbero anche chiamarci nelle loro guerre. Non alleatevi con Paesi che sembrano troppo vulnerabili, o potremmo ritrovarci dalla parte perdente di una guerra straniera.\n@hint! Potete sempre respingere una [call_to_arms] dal nostro alleato. Ma farlo segnerà la fine della nostra amicizia e rovinerà la nostra reputazione diplomatica per anni a venire."
 
 hint_no_allies_diplomatic: "\"Nessuno può sopravvivere da solo in questo mondo.\""
 hint_no_allies_administrative: "\"Anche se non abbiamo intenzione di attaccare, entrare in un'alleanza con uno dei nostri vicini potrebbe dissuadere i nostri nemici dall'attaccarci.\""
 hint_no_allies_military: "\"Un alleato forte coprirebbe le nostre spalle quando passiamo all'offensiva.\""

 ##### Situation Hints #####
 ### The Black Death
 hint_black_death: "La Morte Nera"
 hint_black_death_hint_text: "$hint_black_death_hint_text_1$\n\n$hint_black_death_hint_text_2$\n\n$hint_black_death_hint_text_3$"
# hint_black_death_hint_text_1: "La Morte Nera è una [situation|e] che devasterà il Vecchio Mondo, seguendo le rotte del commercio e della civiltà. Sarà più letale nelle nostre [locations|e] densamente popolate e svanirà una volta che un numero sufficiente di sopravvissuti avrà sviluppato [disease_resistance|e] ad essa.\n\nPersone di ogni [pop_type|e] moriranno a causa della malattia, lasciando i nostri [buildings|E] vuoti fino a quando nuovi [ShowPopTypeName('peasants')] non verranno [Concept('promote', 'Promossi')|e]. Ciò significa che la nostra [tax_base|e] si ridurrà probabilmente, poiché la produzione dei nostri [buildings] crolla e la [ShowModifierTypeName('local_pop_promotion_speed')] sarà molto importante per recuperare l'[employment|e] perso." #OLD
 hint_black_death_hint_text_1: "The Black Death is a [situation_with_icon|e] that will ravage the Old World, following the trails of trade and civilization. It will be most deadly in our densely populated [locations_with_icon|e], and will fade away once enough survivors have built up [disease_resistance_with_icon|e] to it.\n\nPeople of every [pop_type_with_icon|e] will die of the disease, leaving our [buildings_with_icon|E] empty until new [ShowPopTypeName('peasants')] [promote_with_icon|e]. This means our [tax_base_with_icon|e] will likely shrink, as the output of our [buildings] collapses, and [ShowModifierTypeName('local_pop_promotion_speed')] will be very important to recover the lost [employment_with_icon|e]." #NEW
# hint_black_death_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Costruire [buildings] come l'[ShowBuildingTypeName('hospital')] nelle nostre [urban_locations|e] più grandi, prima che la malattia raggiunga il nostro [country|e].\n@arrow_bonus_tier_2! Cliccate sul banner della [situation] per dare un'occhiata alle interazioni speciali a nostra disposizione. Forse aiutano a mitigare la catastrofe?\n@arrow_bonus_tier_2! Mantenete alta la nostra [stability|e]. Non solo aiuta con le [rebellions|e], ma è anche essenziale per la [ShowModifierTypeName('local_pop_promotion_speed')].\n@arrow_bonus_tier_1! Non costruite nuovi edifici in [locations] in via di spopolamento, poiché avranno difficoltà ad assumere nuovi lavoratori.\n@arrow_bonus_tier_1! Tenete d'occhio la nostra [ShowModifierTypeName('local_pop_promotion_speed')], poiché la maggior parte dei nostri [buildings] e [rgo|e] avrnno bisogno che i [ShowPopTypeName('peasants')] vengano [Concept('promote', 'Promossi')|e] nelle [pop_types] superiori." #OLD
 hint_black_death_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Build [ShowBuildingTypeName('hospital')] [buildings] in our biggest [urban_locations_with_icon|e], before the disease reaches our [country_with_icon|e].\n@arrow_bonus_tier_2! Click on the [situation] banner to have a look at the special interactions at our disposal. Perhaps they help mitigate the catastrophe?\n@arrow_bonus_tier_2! Keep our [stability_with_icon|e] high. Not only does it help with [rebellions_with_icon|e], but it is also essential to [ShowModifierTypeName('local_pop_promotion_speed')].\n@arrow_bonus_tier_1! Do not build new buildings in depopulating [locations], since they will struggle to hire new workers.\n@arrow_bonus_tier_1! Keep an eye on our [ShowModifierTypeName('local_pop_promotion_speed')], as most of our [buildings] and [rgo_with_icon|e] will need [ShowPopTypeName('peasants')] to [promote_with_icon|e] to the upper [pop_types]." #NEW
# hint_black_death_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potrebbero volerci anni, ma finché ci sono abbastanza contadini nelle nostre [locations], le persone alla fine si [promote|e] per coprire i posti vacanti lasciati dalla malattia.\n@hint! Potete utilizzare gli insegnamenti di questo disastro per affrontare altre calamità durante la vostra campagna: [starvation|e], [diseases|e] e [loot|e] avranno effetti simili sulle nostre località." #OLD
 hint_black_death_hint_text_3: "#T Extra Hints:#!\n@hint! It might take years, but as long as there are enough peasants in our [locations], people will eventually [promote_with_icon|e] to fill the vacancies left by the disease.\n@hint! You can use the lessons from this disaster to address other calamities during your campaign: [starvation_with_icon|e], [diseases_with_icon|e] and [loot_with_icon|e] will have similar effects on our locations." #NEW
 
 hint_black_death_diplomatic: "\"La Morte avanza. Seguono rovina e tumulto.\""
 hint_black_death_administrative: "\"La Morte Pallida bussa con passo imparziale alle torri dei re e alle capanne dei poveri.\""
 hint_black_death_military: "\"Il quarto Cavaliere è su di noi. Nessun Suggerimento ci salverà ora.\""
 
 
 ###Fall of Delhi
 hint_fall_of_delhi: "[GetSituationByKey('fall_of_delhi').GetNameWithNoTooltip]"
 hint_fall_of_delhi_hint_text: "$hint_fall_of_delhi_hint_text_1$\n\n$hint_fall_of_delhi_hint_text_2$\n\n$hint_fall_of_delhi_hint_text_3$\n\n$hint_fall_of_delhi_hint_text_4$"
# hint_fall_of_delhi_hint_text_1: "La [GetSituationByKey('fall_of_delhi').GetName] è una [situation|e] che può portare alla distruzione di un [GetCountry('DLH').GetFlavorRank] un tempo grande. Intorno a loro, avvoltoi e potenziali conquistatori si radunano attorno a un confine indebolito, mentre l'autorità di [GetCountry('DLH').GetGovernment.GetRulerOrRegent.GetName] decade..." #OLD
 hint_fall_of_delhi_hint_text_1: "The [GetSituationByKey('fall_of_delhi').GetName] is a [situation_with_icon|e] that may bring about the destruction of a once-great [GetCountry('DLH').GetFlavorRank]. Around them, vultures and potential conquerors gather around a weakened border, as the authority of [GetCountry('DLH').GetGovernment.GetRulerOrRegent.GetName] decays..." #NEW
# hint_fall_of_delhi_hint_text_2: "#T Azioni Raccomandate come Delhi:#!\n@arrow_bonus_tier_3! Come [GetCountry('DLH').GetName], considerate di utilizzare le molte nuove [actions|e] come [ShowGenericActionName('strengthen_neighbor_relations')] o [ShowGenericActionName('fall_of_delhi_appoint_governors')].\n@arrow_bonus_tier_2! Durante vari [events|e] associati a questa [situation|e] dobbiamo cercare di aumentare la nostra [share_of_power_gc|e] a scapito dei nostri nemici, affinché il nostro popolo non incontri la sua fine." #OLD
 hint_fall_of_delhi_hint_text_2: "#T Recommended Actions as Delhi:#!\n@arrow_bonus_tier_3! As [GetCountry('DLH').GetName], consider utilizing the many new [actions_with_icon|e] such as [ShowGenericActionName('strengthen_neighbor_relations')] or [ShowGenericActionName('fall_of_delhi_appoint_governors')]. \n@arrow_bonus_tier_2! During various [events_with_icon|e] associated with this [situation_with_icon|e] we must seek to increase our [share_of_power_gc_with_icon|e] at the expense of our foes, lest our people meet their demise." #NEW
# hint_fall_of_delhi_hint_text_3: "#T Suggerimenti Aggiuntivi per Delhi:#!\n@hint! Un chiaro vantaggio sui nostri nemici è il nostro potente [army|e] permanente. A differenza delle [levies|e], i nostri soldati stipendiati reintegrano i loro ranghi e sono notevolmente più potenti. Una base di potere, che aiuta a mantenere il nostro regime sotto controllo." #OLD
 hint_fall_of_delhi_hint_text_3: "#T Extra Hints for Delhi:#!\n@hint! One clear advantage over our foes is our mighty standing [army_with_icon|e]. Unlike [levies_with_icon|e], our salaried soldiers replenish their ranks and are considerably more powerful. A bedrock of power, helping to keep our regime in control." #NEW
# hint_fall_of_delhi_hint_text_4: "#T Azioni Raccomandate come Oppositore:#!\n@arrow_bonus_tier_3! Il [country|e] più forte in $india$ sarà il principale Oppositore all'inizio della [situation|e], ma possiamo guadagnare tale posizione dichiarando guerra e rivendicando il primato. Possiamo farlo sia essendo il [country|e] più forte in $india$ all'inizio della [situation|e] sia sconfiggendo l'attuale leader e prendendo il primato attraverso il [peace_treaty|e] [ShowPeaceTreatyTypeNameWithNoTooltip('peace_seize_opposition_leadership')]." #OLD
 hint_fall_of_delhi_hint_text_4: "#T Recommended Actions as Opposer:#!\n@arrow_bonus_tier_3! The strongest [country_with_icon|e] in $india$ will be the premier Opposer at the start of the [situation_with_icon|e], but we may gain that position by declaring war and claiming primacy. We can do so either by being the strongest [country_with_icon|e] in $india$ at the start of the [situation_with_icon|e] or by defeating the current leader and seizing primacy through the [ShowPeaceTreatyTypeNameWithNoTooltip('peace_seize_opposition_leadership')] [peace_treaty_with_icon|e]." #NEW
 
 hint_fall_of_delhi_diplomatic: "\"Sia che si difenda il trono di [GetCountry('DLH').GetName] o ci si erga come suo rivale, è saggio mantenere relazioni attente con i vicini. L'amicizia può far guadagnare tempo, mentre l'ostilità può giustificare nuove conquiste.\""
# hint_fall_of_delhi_administrative: "\"Le terre guadagnate nel caos sono premi fragili. Considerate di concedere [subjects|e] o migliorare il [control|e] ove possibile, affinché i territori appena acquisiti non sfuggano via velocemente come sono stati presi.\"" #OLD
 hint_fall_of_delhi_administrative: "\"Lands gained in chaos are fragile prizes. Consider granting [subjects_with_icon|e] or improving [control_with_icon|e] where possible, so that newly acquired territories do not slip away as quickly as they were taken.\"" #NEW
# hint_fall_of_delhi_military: "\"La spada decide molto in questa lotta. Un [army|e] forte può difendere Delhi dal collasso o consentire agli Oppositori di abbattere il gigante. Eppure, anche la vittoria comporta dei rischi! Attenzione alle ribellioni e alle linee troppo allungate.\"" #OLD
 hint_fall_of_delhi_military: "\"The sword decides much in this struggle. A strong [army_with_icon|e] can defend Delhi from collapse or allow Opposers to strike down the giant. Yet even victory brings risks! Beware rebellions and overstretched lines.\"" #NEW


 ###Rise of the Turks
 hint_rise_of_the_ottomans: "Suggerimenti [GetSituationByKey('rise_of_the_ottomans').GetNameWithNoTooltip]"
 hint_rise_of_the_ottomans_hint_text: "$hint_rise_of_the_ottomans_hint_text_1$\n\n$hint_rise_of_the_ottomans_hint_text_2$"
# hint_rise_of_the_ottomans_hint_text_1: "Questa [situation|e] segna l'ascesa del #italic Beilicato più Forte#!, destinato a forgiare uno dei più grandi imperi della storia. Attraverso [events|e] e [actions|e] unici, dobbiamo assicurarci il dominio sugli altri Beylik, attraversare il [ShowProvinceDefinitionName('marmara_sea_province')] e rivendicare le ricchezze di [ShowLocationName('constantinople')]. La gloria eterna ci attende!" #OLD
 hint_rise_of_the_ottomans_hint_text_1: "This [situation_with_icon|e] marks the rise of the #italic Strongest Beylik#!, destined to forge one of history's greatest empires. Through unique [events_with_icon|e] and [actions_with_icon|e], we must secure dominance over the other Beyliks, cross the [ShowProvinceDefinitionName('marmara_sea_province')], and claim the riches of [ShowLocationName('constantinople')]. Eternal glory awaits!" #NEW
# hint_rise_of_the_ottomans_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_2! Il nostro tempo di ascensione è arrivato. Brandendo potenti [actions|e] come [ShowGenericActionName('press_claims')] e beneficiando di [events|e] che accelerano l'[integration|e], la nostra ascesa sarà scritta tra le ere.\n@arrow_bonus_tier_1! Se possediamo #Y 120#! [locations|e] e ci assicuriamo una posizione nel [ShowRegionName('balkan_region')], possiamo estendere l'[action|e] [ShowGenericActionNameWithNoTooltip('press_claims')] anche a quella [region|e]." #OLD
 hint_rise_of_the_ottomans_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_2! Our time of ascension has arrived. By wielding powerful [actions_with_icon|e] like [ShowGenericActionName('press_claims')] and benefiting from [events_with_icon|e] that hasten [integration_with_icon|e], our rise will be written among the ages.\n@arrow_bonus_tier_1! If we hold #Y 120#! [locations_with_icon|e] and secure a foothold in the [ShowRegionName('balkan_region')], we may extend the [ShowGenericActionNameWithNoTooltip('press_claims')] [action_with_icon|e] to that [region_with_icon|e] as well." #NEW
 
# hint_rise_of_the_ottomans_diplomatic: "\"All'inizio della [situation|e] è saggio usare le [actions|e] fornite, come [ShowGenericActionName('seek_relations_with_the_byzantines')]. Usando il loro prestigio in declino come ultimo baluardo di $ROM$, costruiremo sulla nostra eredità.\"" #OLD
 hint_rise_of_the_ottomans_diplomatic: "\"Early on in the [situation_with_icon|e] the #italic Strongest Beylik#! may utilize the unique [actions_with_icon|e] provided, such as [ShowGenericActionName('seek_relations_with_the_byzantines')]. Using the prestige of the last bastion of $ROM$ as a way to build their legacy.\"" #NEW
 hint_rise_of_the_ottomans_administrative: "\"Anche se eccelleremo certamente nella conquista, dobbiamo essere consapevoli del nostro interno e del nucleo del nostro regno. Non trascuriamo i nostri affari interni nella ricerca della gloria all'estero!\""
# hint_rise_of_the_ottomans_military: "\"Dobbiamo cercare di conquistare le [towns_and_cities|e] dei nostri nemici. Queste campagne saranno il fondamento del potere generazionale.\"" #OLD
 hint_rise_of_the_ottomans_military: "\"We must seek to conquer the [towns_and_cities_with_icon|e] of our foes. These campaigns will be the foundation of generational power.\"" #NEW
 
 ####Council of Trent
 hint_council_of_trent: "[GetSituationByKey('council_of_trent').GetNameWithNoTooltip]"
 hint_council_of_trent_hint_text: "$hint_council_of_trent_hint_text_1$\n\n$hint_council_of_trent_hint_text_2$"
# hint_council_of_trent_hint_text_1: "Durante il [ShowSituationName('council_of_trent')], la [GetUniqueInternationalOrganization('catholic_church').GetName] è in grado di cambiare le sue attuali [laws|e] e introdurre nuove [policies|e] per l'[international_organization|e]." #OLD
 hint_council_of_trent_hint_text_1: "During the [ShowSituationName('council_of_trent')], the [GetUniqueInternationalOrganization('catholic_church').GetName] is able to change its current [laws_with_icon|e] and introduce new [policies_with_icon|e] to the [international_organization_with_icon|e]." #NEW
# hint_council_of_trent_hint_text_2: "#T Possibili Interazioni:#!\n@arrow_bonus_tier_3! Come [member|e] della [GetUniqueInternationalOrganization('catholic_church').GetName], potete proporre un [ShowResolutionName('policy_vote')] utilizzando l'elenco delle [laws] sottostante o il Pannello Dottrine nella [GetUniqueInternationalOrganization('catholic_church').GetName]\n@arrow_bonus_tier_2! Come [member|e] della [GetUniqueInternationalOrganization('catholic_church').GetName], potete votare su un [ShowResolutionName('policy_vote')] proposto." #OLD
 hint_council_of_trent_hint_text_2: "#T Possible Interactions:#!\n@arrow_bonus_tier_3! As a [member_with_icon|e] of the [GetUniqueInternationalOrganization('catholic_church').GetName], you may propose a [ShowResolutionName('policy_vote')] using the list of [laws] below or the Doctrines Panel in the [GetUniqueInternationalOrganization('catholic_church').GetName]\n@arrow_bonus_tier_2! As a [member_with_icon|e] of the [GetUniqueInternationalOrganization('catholic_church').GetName], you may vote on a proposed [ShowResolutionName('policy_vote')]" #NEW
 
 ###Golden Age of Piracy
 hint_golden_age_of_piracy: "[GetSituationByKey('golden_age_of_piracy').GetNameWithNoTooltip]"
 hint_golden_age_of_piracy_hint_text: "$hint_golden_age_of_piracy_hint_text_1$\n\n$hint_golden_age_of_piracy_hint_text_2$\n\n$hint_golden_age_of_piracy_hint_text_3$\n\n$hint_golden_age_of_piracy_hint_text_4$"
# hint_golden_age_of_piracy_hint_text_1: "L'[GetSituationByKey('golden_age_of_piracy').GetName] è una [situation|e] che può dare origine a nuovi pirati. Uomini liberi, marinai scontenti e coloro che sfidano l'autorità centralizzata, danno forza alle vele nere sotto le quali conducono ora le loro attività illecite." #OLD
 hint_golden_age_of_piracy_hint_text_1: "The [GetSituationByKey('golden_age_of_piracy').GetName] is a [situation_with_icon|e] that may give rise to new pirates. Free men, disgruntled sailors and those who defy centralized authority, empower the black sails under which they now conduct their illicit activities." #NEW
# hint_golden_age_of_piracy_hint_text_2: "#T Azioni Raccomandate per combattere i Pirati:#!\n@arrow_bonus_tier_3! Considerate di sradicare tutti i Pirati vicino alle nostre coste, non possiamo permetterci che vaghino per i nostri mari.\n@arrow_bonus_tier_2! Ogni [event|e] associato a questa [situation|e] può annunciare l'ascesa di una nuova repubblica pirata." #OLD
 hint_golden_age_of_piracy_hint_text_2: "#T Recommended Actions to combat Pirates:#!\n@arrow_bonus_tier_3! Consider eradicating any Pirates near our coasts, we cannot afford to have them roam our seas. \n@arrow_bonus_tier_2! Each [event_with_icon|e] associated with this [situation_with_icon|e] may herald  the rise of a new pirate republic." #NEW
# hint_golden_age_of_piracy_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Potremmo essere in grado di utilizzare nuove [actions|e] nella [situation|e] sia che issiamo la bandiera nera o meno." #OLD
 hint_golden_age_of_piracy_hint_text_3: "#T Extra Hints:#!\n@hint! We may be able to utilize new [actions_with_icon|e] in the [situation_with_icon|e] whether we sail the black flag or not." #NEW
# hint_golden_age_of_piracy_hint_text_4: "#T Azioni Raccomandate come Pirata:#!\n@arrow_bonus_tier_3! È saggio mettere in sicurezza la costa e costruire una potente [navy|e]. Utilizzando [actions|e] come [ShowGenericActionName('attract_sailors')] o [ShowGenericActionName('migrate_to_new_waters')], possiamo mantenere una flotta e una presenza versatili." #OLD
 hint_golden_age_of_piracy_hint_text_4: "#T Recommended Actions as a Pirate:#!\n@arrow_bonus_tier_3! It is wise to secure the coast and build a mighty [navy_with_icon|e]. By utilizing [actions_with_icon|e] such as [ShowGenericActionName('attract_sailors')] or [ShowGenericActionName('migrate_to_new_waters')], we can maintain a versatile fleet and presence." #NEW
 
 hint_golden_age_of_piracy_diplomatic: "\"Sorrisi e rum funzionano meglio delle minacce, almeno finché i cannoni non iniziano a parlare. Forse sarebbe saggio mantenere rapporti stabili con i furfanti. Non tutti i tesori sono argento e oro, signore.\""
 hint_golden_age_of_piracy_administrative: "\"Gestire i nostri possedimenti marittimi è un affare delicato nell'era della pirateria. Sia che ci si difenda da loro o dalla concorrenza canaglia, mantenere una stretta amministrazione è fondamentale!\""
 hint_golden_age_of_piracy_military: "\"I pirati non riconoscono nessun Paese, avendo venduto il proprio. E poiché sono sicuri di essere impiccati se catturati, non avranno scrupoli nell'assassinare e distruggere se le loro richieste non saranno esaudite.\""

 ###Hundred Years War
 hint_hundred_years_war: "[GetSituationByKey('hundred_years_war').GetNameWithNoTooltip]"
 hint_hundred_years_war_hint_text: "$hint_hundred_years_war_hint_text_1$\n\n$hint_hundred_years_war_hint_text_2$\n\n$hint_hundred_years_war_hint_text_3$\n\n$hint_hundred_years_war_hint_text_4$"
 hint_hundred_years_war_hint_text_1: "La [GetSituationByKey('hundred_years_war').GetName] getta [ShowSubContinentName('western_europe')] nel tumulto! Questo periodo metterà alla prova le alleanze e nuove potenze emergeranno certamente dalle macerie."
 hint_hundred_years_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Sia [GetCountry('FRA').GetName] che [GetCountry('ENG').GetName] hanno accesso a [ShowGenericActionName('request_war_entry')], [ShowGenericActionName('hyw_sign_truce')] e [ShowGenericActionName('request_papal_delegates')]. Questi sono modi unici per manipolare lo status quo del conflitto o addirittura inclinarlo a favore dell'uno o dell'altro Paese."
 hint_hundred_years_war_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Come partecipanti al conflitto, potremmo essere in grado di guadagnare terre o potenti alleanze."
# hint_hundred_years_war_hint_text_4: "#T Azioni Raccomandate come [subject|e] di [GetCountry('FRA').GetName]:#!\n@arrow_bonus_tier_3! Sarebbe saggio assicurarsi [ShowGenericActionName('demand_autonomy')]. Ogni [ShowSubjectTypeName('appanage')] può richiedere un certo grado di autonomia e trarne grande beneficio, sfruttando la sua importanza come difensore della corona [GetCountry('FRA').GetAdjectiveWithNoTooltip]." #OLD
 hint_hundred_years_war_hint_text_4: "#T Recommended Actions as [subject_with_icon|e] of [GetCountry('FRA').GetName]:#!\n@arrow_bonus_tier_3! It would be wise to secure [ShowGenericActionName('demand_autonomy')]. Each [ShowSubjectTypeName('appanage')] may demand a certain degree of autonomy and greatly benefit, by leveraging its importance as a defender of the [GetCountry('FRA').GetAdjectiveWithNoTooltip] crown." #NEW
 
