 GOLD_HINT: "Siamo in deficit!"
# gold_topbar_hint: "Se siamo in deficit, possiamo ridurre le nostre [expenses|e], aumentare le [taxes|e], o [Concept('mint', 'Coniare')|e] più monete. Se esauriamo i [gold|e], saremo costretti a prendere [loans|e] e alla fine potremmo andare in [bankrupt|e]." #OLD
 gold_topbar_hint: "If we are running a deficit, we can reduce our [expenses_with_icon|e], increase [taxes_with_icon|e], or [mint_with_icon|e] more coins. If we run out of [gold_with_icon|e], we will be forced to take [loans_with_icon|e], and eventually may become [bankrupt_with_icon|e]." #NEW
 
 STABILITY_HINT: "Il nostro paese è instabile!"
# stability_topbar_hint: "Le azioni che possiamo intraprendere per aumentare la stabilità includono:\n$BULLET_WITH_TAB$Aumentare il numero di [ShowPopTypeName('clergy')] [GetPlayer.GetReligion.Custom('IT_REL_MP')].\n$BULLET_WITH_TAB$Investire più [budget|e] sulla stabilità.\n$BULLET_WITH_TAB$Chiedere al [cabinet|e] di [ShowCabinetActionName('stabilize_country')]." #OLD
 stability_topbar_hint: "Actions we can take to increase stability include:\n$BULLET_WITH_TAB$Increasing the amount of [GetPlayer.GetReligion.GetAdjective] [ShowPopTypeName('clergy')].\n$BULLET_WITH_TAB$Investing more of the [budget_with_icon|e] on stability.\n$BULLET_WITH_TAB$Instructing the [cabinet_with_icon|e] to [ShowCabinetActionName('stabilize_country')]." #NEW
 
 LEGITIMACY_HINT: "[Localize( GetPlayer.GetGovernment.GetGovernmentType.GetPowerKey )] bassa!"
# legitimacy_topbar_hint: "Ci sono diversi modi per affrontare questo problema:\n$BULLET_WITH_TAB$Aumentare il [budget|e] destinato al [court_maintenance|e].\n$BULLET_WITH_TAB$Chiedere al [cabinet|e] di [ShowCabinetActionName('strengthen_government')]." #OLD
 legitimacy_topbar_hint: "There are several ways we can address this:\n$BULLET_WITH_TAB$Increase the [budget_with_icon|e] on [court_maintenance_with_icon|e].\n$BULLET_WITH_TAB$Instruct the [cabinet_with_icon|e] to [ShowCabinetActionName('strengthen_government')]." #NEW
 devotion_topbar_hint: "$legitimacy_topbar_hint$"
