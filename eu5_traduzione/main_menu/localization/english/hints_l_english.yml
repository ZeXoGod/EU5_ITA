hint_eastern_roman_empire: "Consigli iniziali per [Player.GetLongName]" 
hint_eastern_roman_empire_hint_text: "$hint_eastern_roman_empire_text_1$\n\n$hint_eastern_roman_empire_text_2$\n\n$hint_eastern_roman_empire_text_3$\n\n$hint_eastern_roman_empire_text_4$" 
hint_eastern_roman_empire_text_1: "[Player.GetLongName] è stato nel caos, e la situazione sta per peggiorare.\nIn [ShowRegionName('anatolia_region')], i beilicati anatolici si sono rafforzati, con [GetCountry('TUR').GetName] che ha recentemente conquistato le nostre terre a [ShowLocationName('bursa')] e [ShowLocationName('izmit')].\nNella [ShowScriptedGeographyName('greece_geography')] continentale siamo riusciti a riprendere il controllo di [ShowProvinceDefinitionName('thessaly_province')] e dell'area intorno alla catena del Pindo, ma gli stati franchi sono ancora al comando.\nA nord, [GetCountry('SER').GetName] e [GetCountry('BUL').GetName] attendono come avvoltoi le nostre terre.\n#italic Forse agitare la libertà in [GetCountry('SMC').GetName] potrebbe procurarci un nuovo alleato#!." 
hint_eastern_roman_empire_text_2: "@hint! #T Gestione dei Ceti#!\nAll'interno, i nostri ceti sono diventati molto corrotti, con i loro 4 privilegi [ShowEstatePrivilegeName('consolidated_corruption_of_the_nobles')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_clergy')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_burghers')] e [ShowEstatePrivilegeName('consolidated_corruption_of_the_peasants')] che rovinano la nostra nazione. È di vitale importanza liberarcene al più presto.\n\nSpingere per il [societal_value|e] [ShowSocietyDirectionName('communalism')] è un ottimo inizio per questo sforzo.\nConcedere [estate_privileges_with_icon|E] potrebbe aiutarci a tenerli sotto controllo quando inizieranno ad arrabbiarsi con noi. Ma ricorda che la nostra [legitimacy_with_icon|E] ha grande importanza per la nostra nazione." 
hint_eastern_roman_empire_text_3: "@hint! #T Vie Economiche#!\nLe nostre province di [ShowProvinceDefinitionName('constantinople_province')] e [ShowProvinceDefinitionName('edirne_province')] sono ottimi punti di partenza per la nostra restaurazione economica. [Player.GetLongName] può beneficiare molto da un'industria di [ShowGoodsName('fine_cloth')] espandendo anche [ShowGoodsName('silk')]. [ShowProvinceDefinitionName('edirne_province')] potrebbe essere la nostra provincia cardine per [ShowGoodsName('tools')] e [ShowGoodsName('firearms')].\n\n[ShowProvinceDefinitionName('chalkidiki_province')] è anche ricca di risorse naturali, con la [ShowLocationRankName('city')] di [ShowLocationName('thessaloniki')] come candidata ideale per la nostra produzione di [ShowGoodsName('jewelry')]. Forse creare un [market_with_icon|e] e un [ShowBuildingTypeName('local_governor')] li potrebbe restituirci molte entrate.\n\nLe nostre recenti conquiste in [ShowProvinceDefinitionName('thessaly_province')] e [ShowAreaName('morea_area')] richiederanno parecchio tempo per diventare parti integranti dell'impero e quindi redditizie.\n#italic Forse sarebbe saggio istituire alcune [ShowSubjectTypeName('pronoia')] in quelle province#!." 
hint_eastern_roman_empire_text_4: "@hint! #T Questioni Esterne#!\nNulla conta se non riusciamo a sopravvivere contro le forze straniere che cercano la nostra rovina. Dovremmo stabilizzare la situazione interna, risolvere ogni questione di [ShowDisasterName('byzantine_succession_crisis')] che possa presentarsi e creare un'economia sana capace di finanziare il nostro esercito. Poi potremo reclamare le nostre terre e persino l'intera [ShowScriptedGeographyName('roman_borders_geography')].\n\nIn alternativa, potremmo passare subito all'offensiva, riconquistando [ShowLocationName('bursa')] e [ShowLocationName('izmit')] da [GetCountry('TUR').GetName] e poi il resto della [ShowScriptedGeographyName('byzantine_aegean_coastline')]. Questo percorso sarà più difficile, perché richiedera di affrontare problemi interni ed esterni allo stesso tempo, incidendo pesantemente sulla nostra stabilità e ripresa economica.\n\nTuttavia, ogni azione ad alto rischio offre grandi ricompense. Dobbiamo essere ambiziosi e dettare il nostro destino invece di attenderlo." 
hint_eastern_roman_empire_diplomatic: "$hint_advisor_salute_diplomatic$" 
hint_eastern_roman_empire_administrative: "$hint_advisor_salute_administrative$" 
hint_eastern_roman_empire_militrary: "$hint_advisor_salute_military$" 
hint_town_rights: "$game_concept_town_rights$" 
hint_town_rights_hint_text: "$hint_town_rights_hint_text_1$" 
hint_town_rights_hint_text_1: "$game_concept_town_rights_desc$" 
hint_town_rights_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Alcuni Diritti storici possono essere positivi, altri negativi. I Diritti possono essere revocati, ma ricorda che farlo costa [stability_with_icon|e] e fa infuriare molto i [pops_with_icon|e] locali.\n@hint! I Diritti di specializzazione che arrivano con [advance_icon][ShowAdvanceName('town_rights_enable')] possono diventare un potente impulso all'efficienza dei tuoi centri urbani e possono essere usati per modellare il tessuto economico del nostro [country] nel lungo periodo.\n@hint! I Diritti di produttività sono impiegati al meglio in luoghi che godono naturalmente di alta [production_efficiency_with_icon|e] in una data industria. Per esempio, [ShowBuildingTypeName('cloth_guild')] è più efficiente nel trasformare [ShowGoodsName('wool')] in [ShowGoodsName('cloth')] se la Lana è prodotta in uno degli [rgo_with_icon|e] della sua [province_with_icon|e]. Potrebbe essere un candidato perfetto per concedere [ShowTownRightsName('royal_textile_rights')]."                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
hint_town_rights_diplomatic: "$hint_advisor_salute_diplomatic$" 
hint_town_rights_administrative: "$hint_advisor_salute_administrative$" 
