 OPEN_HINTS: "Apri Suggerimenti"
 OPEN_HINT: "Apri Suggerimento"
 EXPAND_HINT: "Clicca per espandere il suggerimento"
 COLLAPSE_HINT: "Clicca per comprimere il suggerimento"
 EMPTY_HINT_SCREEN_TEXT: "La nostra nazione sta procedendo senza problemi e non abbiamo consigli da dare!"
 OPEN_HINT_TEXT: "Mostra Suggerimento @hint!"
 ALERT_HINT: "Apri con Suggerimento"
 ALERT_ADVANCES_HINT: "Apri Pannello Progressi con Suggerimento"
 HINT_TITLE: "Suggerimento @hint!"
 RECOMMENDED_ACTIONS_TITLE: "Azioni Consigliate @hint!"
 SCRIPTABLE_HINT_DEFINITION_TEXT: "$MAIN_HINT$ $CONTEXT_HINT$"
