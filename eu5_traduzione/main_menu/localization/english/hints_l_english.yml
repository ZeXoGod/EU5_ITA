# hint_war_hint_text_1: "La [war|e] inizia quando un [country|e] emette una dichiarazione di guerra e termina quando le due parti concordano un [peace_treaty|e]. Ogni [war] ha due [war_leaders|e], ma ci possono essere anche gli [war_allies|e]. La [war] terminerà quando i due [war_leaders] firmeranno un [peace_treaty], ma i partecipanti secondari possono firmare [peace_treaties] separati con il [war_leader] nemico." #OLD
 hint_war_hint_text_1: "[war_with_icon|e] starts when a [country_with_icon|e] issues a declaration of war, and ends when the two sides agree to a [peace_treaty_with_icon|e]. Every [war] has two [war_leaders_with_icon|e], but there can also be other [war_allies_with_icon|e]. The [war] will end when the two [war_leaders] sign a [peace_treaty], but secondary participants can sign separate [peace_treaties] with the enemy [war_leader]." #NEW
# hint_war_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Considerate di ottenere un [casus_belli_with_icon|e] prima di dichiarare una [war]. Possiamo chiederne uno durante il [parliament|e], o fabbricarne uno contro i nostri [rivals|e].\n@arrow_bonus_tier_3! Una volta iniziata una [war], prestate attenzione al [casus_belli] e al suo [war_goal|e], poiché è essenziale per guadagnare [war_score_with_icon|e] e assicurarsi un [peace_treaty_with_icon|e] favorevole.\n@arrow_bonus_tier_3! A seconda del Casus Belli, guadagneremo [war_score_with_icon|e] in modi diversi. Ecco le fonti più comuni di [war_score]:\n @arrow_bonus_tier_1! Occupate la [capital_with_icon|e] nemica.\n @arrow_bonus_tier_1! Controllate le [locations_with_icon] rivendicate.\n @arrow_bonus_tier_1! Occupate i [forts_with_icon|e] nemici.\n @arrow_bonus_tier_1! Sconfiggete gli [armies|e] nemici in [battle].\n @arrow_bonus_tier_1! [blockade|e] dei [ports|e] nemici.\n@arrow_bonus_tier_3! Tenete d'occhio la nostra [war_exhaustion_with_icon|e], poiché può davvero ostacolare sia la nostra economia che la nostra capacità di condurre la guerra." #OLD
 hint_war_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Consider getting a [casus_belli_with_icon|e] before declaring a [war]. We can ask for one during [parliament_with_icon|e], or fabricate one against our [rivals_with_icon|e].\n@arrow_bonus_tier_3! Once a [war] starts, pay attention to the [casus_belli] and its [war_goal_with_icon|e], as it is essential for earning [war_score_with_icon|e] and securing a favorable [peace_treaty_with_icon|e].\n@arrow_bonus_tier_3! Depending on the Casus belli, we will earn [war_score_with_icon|e] in different ways. Here are the most common sources of [war_score]:\n @arrow_bonus_tier_1! Occupy the enemy [capital_with_icon|e].\n @arrow_bonus_tier_1! Control claimed [locations_with_icon].\n @arrow_bonus_tier_1! Occupy the enemy's [forts_with_icon|e].\n @arrow_bonus_tier_1! Defeat enemy [armies_with_icon|e] in [battle].\n @arrow_bonus_tier_1! [blockade_with_icon|e] enemy [ports_with_icon|e].\n@arrow_bonus_tier_3! Keep an eye on our [war_exhaustion_with_icon|e], as it can really hinder both our economy and our ability to wage war." #NEW
# hint_war_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Durante la [war], entrambe le parti possono [occupy|e] [locations|e] nemiche, ma il territorio non cambia realmente di mano finché un [peace_treaty|e] non ratifica la conquista.\n@hint! Più a lungo si trascina una guerra, più le parti coinvolte saranno disposte ad accettare un'offerta di pace." #OLD
 hint_war_hint_text_3: "#T Extra Hints:#!\n@hint! During [war], both sides may [occupy_with_icon|e] enemy [locations_with_icon|e], but territory does not really change hands until a [peace_treaty_with_icon|e] ratifies the conquest.\n@hint! The longer a war drags on, the more willing the parties involved will be to accept a peace offer." #NEW
 
 hint_war_diplomatic: "\"La guerra può essere un'impresa molto redditizia, ma anche una rapida via per il disastro.\""
 hint_war_administrative: "\"Quando il commercio non può garantire la fornitura di risorse vitali, la guerra diventa inevitabile.\""
 hint_war_military: "\"L'unico modo per garantire la nostra sicurezza è superare i nostri vicini.\""
 
 
