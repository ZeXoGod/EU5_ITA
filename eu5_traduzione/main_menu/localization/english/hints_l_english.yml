hint_societal_values: "$game_concept_societal_values$" 
hint_societal_values_hint_text: "$hint_societal_values_hint_text_1$\n\n$hint_societal_values_hint_text_2$\n\n$hint_societal_values_hint_text_3$" 
hint_societal_values_hint_text_1: "I nostri [societal_values_with_icon|e] definiscono la struttura sociale e politica del nostro [country_with_icon|e], le usanze del nostro popolo e le caratteristiche del nostro ordinamento giuridico. I loro effetti possono avere un profondo impatto sul modo in cui un paese viene giocato, in particolare tramite lo sblocco di [government_reforms_with_icon|e] specifiche.\n\nOgni Valore Sociale è un asse con due poli opposti che può arrivare fino a 100. La posizione di un Paese sull'asse è influenzata principalmente da [laws|e], [estate_privileges|e] e [cabinet_actions|e], e si sposta lentamente nel tempo verso uno dei due poli. Tuttavia, il progresso verso un polo si arrestera a un massimo determinato dalla quantità totale di fattori che lo spingono in quella direzione. Più alto e un Valore Sociale, più fattori servono per spingerlo oltre." 
hint_societal_values_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Controlla [societal_values] e la loro tendenza attuale in [Link('societal_values', '', '@government_panel! Government Panel > Values Tab')]. Da li puoi anche controllare le [government_reforms] sbloccate da ogni Valore Sociale facendo @leftclick! #W clic#! sulla sua icona.\n@arrow_bonus_tier_2! I principali fattori che influenzano i [societal_values] sono [laws_with_icon|e] ed [estate_privileges_with_icon|e]. Tienili d'occhio.\n@arrow_bonus_tier_1! Se vuoi concentrarti su uno specifico Valore Sociale, puoi anche istruire il [cabinet_with_icon|e] a [ShowCabinetActionName('change_societal_values')]." 
hint_societal_values_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Ricorda che un Valore Sociale può tendere solo verso un massimo pari a 100 volte la sua spinta attuale. Per esempio, una spinta mensile di #W 0.10#! significa che il Valore si fermerà a #W 10.00#!.\n@hint! I Valori Sociali hanno anche un ruolo importante nella [diplomacy|e], poiché i [countries] con Valori Sociali affini tenderanno ad avere una [opinion|e] più alta l'uno dell'altro.\n@hint! Alcune delle [government_reforms] più uniche nelle [ages|e] successive richiedono uno o più [societal_values]. Per esempio, [ShowGovernmentReformName('naval_infrastructure_act')] richiede almeno #W 50#! in [ShowSocietyDirectionName('naval')]." 
hint_societal_values_diplomatic: "\"La benevolenza dei nostri vicini vale più di qualsiasi trattato. I valori che condividono con noi la guadagneranno liberamente.\"" 
hint_societal_values_administrative: "\"Una nazione ricca può sopravvivere a qualunque nemico. I valori che favoriscono il commercio meritano la prima considerazione.\"" 
hint_societal_values_military: "\"I nostri rivali diventano più audaci a ogni anno che passa. I valori marziali terranno il pericolo lontano dalla nostra porta.\"" 



