hint_eastern_roman_empire: "Starting advice for [Player.GetLongName]" #NEW
hint_eastern_roman_empire_hint_text: "$hint_eastern_roman_empire_text_1$\n\n$hint_eastern_roman_empire_text_2$\n\n$hint_eastern_roman_empire_text_3$\n\n$hint_eastern_roman_empire_text_4$" #NEW
hint_eastern_roman_empire_text_1: "The [Player.GetLongName] has been in turmoil and it is about to get worse.\nIn [ShowRegionName('anatolia_region')], the anatolian beyliks have grown stronger, with [GetCountry('TUR').GetName] recently conquering our lands in [ShowLocationName('bursa')] and [ShowLocationName('izmit')].\nIn mainland [ShowScriptedGeographyName('greece_geography')], we managed to regain control of [ShowProvinceDefinitionName('thessaly_province')] and around Pindos mountain range but the Frankish states are still in control.\nTo the north, [GetCountry('SER').GetName] and [GetCountry('BUL').GetName] are preying like vultures for our lands.\n#italic Maybe agitating liberty in [GetCountry('SMC').GetName] might see us getting a new ally#!." #NEW
hint_eastern_roman_empire_text_2: "@hint! #T Estate managment#!\nInternally, our estates have grown quite corrupt, with their 4 privileges [ShowEstatePrivilegeName('consolidated_corruption_of_the_nobles')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_clergy')], [ShowEstatePrivilegeName('consolidated_corruption_of_the_burghers')], and [ShowEstatePrivilegeName('consolidated_corruption_of_the_peasants')] ruining our nation. It is of vital importance that we get rid of them as soon as possible.\n\nPushing for [ShowSocietyDirectionName('communalism')] [societal_value|e] is a great start for this endeavor.\nHanding out [estate_privileges_with_icon|E] might help us keep them in line when they start getting angry at us. But be aware our [legitimacy_with_icon|E] has great importance for our nation." #NEW
hint_eastern_roman_empire_text_3: "@hint! #T Economic Avenues#!\nOur provinces of [ShowProvinceDefinitionName('constantinople_province')] and [ShowProvinceDefinitionName('edirne_province')] are great kickstarters for our economic restoration. The [Player.GetLongName] can greatly benefit from a [ShowGoodsName('fine_cloth')] industry while also expanding [ShowGoodsName('silk')]. [ShowProvinceDefinitionName('edirne_province')] could be our cornerstone province for [ShowGoodsName('tools')] and [ShowGoodsName('firearms')].\n\n[ShowProvinceDefinitionName('chalkidiki_province')] is also a rich in natural resources, with the [ShowLocationRankName('city')] of [ShowLocationName('thessaloniki')] being a prime candidate for our [ShowGoodsName('jewelry')] production. Maybe setting up a [market_with_icon|e] and a [ShowBuildingTypeName('local_governor')] there could yield back a lot of revenue for us.\n\nOur recent conquests in [ShowProvinceDefinitionName('thessaly_province')] and [ShowAreaName('morea_area')] will take quite a bit of time to become integral parts of the empire and thus become profitable.\n#italic Maybe it would be wise to set up a few [ShowSubjectTypeName('pronoia')] in those provinces#!." #NEW
hint_eastern_roman_empire_text_4: "@hint! #T External Matters#!\nNothing else matters if we cannot manage to survive against the foreign forces that are looking for our downfall. We should look to stabilize our internal situation, resolve any matter of [ShowDisasterName('byzantine_succession_crisis')] that might occur and create a healthy economy that can fund our army. Then we can reclaim our lands and even the whole of our [ShowScriptedGeographyName('roman_borders_geography')].\n\nAlternatively, we could go into the offensive immediately, reclaiming [ShowLocationName('bursa')] and [ShowLocationName('izmit')] from [GetCountry('TUR').GetName] and then the rest of the [ShowScriptedGeographyName('byzantine_aegean_coastline')]. This path will be harder since it will require us to handle both internal and external problems at the same time, heavily impacting our stability and economic recovery.\n\nHowever, every high risk action yields great rewards. We should be ambitious and dictate our fate rather than wait for it." #NEW
hint_eastern_roman_empire_diplomatic: "$hint_advisor_salute_diplomatic$" #NEW
hint_eastern_roman_empire_administrative: "$hint_advisor_salute_administrative$" #NEW
