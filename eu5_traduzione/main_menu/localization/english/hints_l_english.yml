# hint_battle_hint_text_1: "Quando un [army|e] si trova nella stessa [location|e] di un [army] nemico, inizierà una [battle|e]. Qualunque [army] sia arrivato per primo nella [location] sarà il [defender|e] e come tale beneficerà dei modificatori del terreno. La battaglia termina quando una parte perde tutto il suo [morale|e] o tutti i suoi [regiments|e], a seconda di quale evento si verifichi per primo." #OLD
 hint_battle_hint_text_1: "When an [army_with_icon|e] finds itself in the same [location_with_icon|e] as an enemy [army], a [battle_with_icon|e] will start. Whichever [army] was first in the [location] will be the [defender_with_icon|e], and as such will benefit from terrain modifiers. The battle ends one side loses all of their [morale_with_icon|e] or all of their [regiments_with_icon|e], whatever happens first." #NEW
# hint_battle_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Potete portare gli eserciti vicini a rinforzare le battaglie in corso. Se arrivano in tempo, si uniranno alla lotta come riserve fresche.\n@arrow_bonus_tier_2! Assicuratevi che i nostri [armies|e] abbiano un buon [commander|e] prima di impegnarli in [battle].\n@arrow_bonus_tier_2! Prestate sempre attenzione al terreno della [location]. L'[attacker|e] subirà penalità ai suoi tiri di dado a seconda della topografia e della vegetazione della località. Scegliete attentamente i vostri campi di battaglia!\n@arrow_bonus_tier_1! A volte è saggio ordinare una [retreat|e] tempestiva prima che le nostre truppe vengano annientate da una forza nemica schiacciante." #OLD
 hint_battle_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! You can bring neighboring armies to reinforce ongoing battles. If they arrive in time, they will join the fight as fresh reserves.\n@arrow_bonus_tier_2! Make sure our [armies_with_icon|e] have a good [commander_with_icon|e] before committing them to [battle].\n@arrow_bonus_tier_2! Always pay heed to the terrain of the [location]. The [attacker_with_icon|e] will suffer penalties to their dice rolls depending on the topography and vegetation of the location. Choose your battlegrounds carefully!\n@arrow_bonus_tier_1! Sometimes it is wise to order a timely [retreat_with_icon|e] before our troops are annihilated by an overwhelming enemy force." #NEW
# hint_battle_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Perdere una battaglia non significa necessariamente la fine della [war|e]. Dopo una sconfitta, potete battere in [retreat] in sicurezza, recuperare morale, magari assoldare mercenari e riprovare in condizioni più favorevoli (e così può fare il vostro nemico! Non siate troppo precipitosi nel celebrare la vittoria)\n@hint! Se la [location] ha un [fort|e], il controllore del forte sarà sempre il [defender] in quella località, indipendentemente da chi arriva per primo." #OLD
 hint_battle_hint_text_3: "#T Extra Hints:#!\n@hint! Losing a battle does not necessarily spell the end of the [war_with_icon|e]. After a defeat, you can [retreat] to safety, regain morale, perhaps hire mercenaries, and try again in more favorable conditions (and so can your enemy! Do not be too soon to celebrate victory)\n@hint! If the [location] has a [fort_with_icon|e], the fort controller will always be the [defender] in that location, regardless of who arrives first." #NEW
 
 hint_battle_diplomatic: "\"Lasciate che i nostri nemici periscano per logoramento e carestia prima di ingaggiarli.\""
 hint_battle_administrative: "\"Una rapida vittoria sul campo di battaglia Ci permetterebbe di passare all'offensiva senza esporre le nostre città alla devastazione nemica.\""
 hint_battle_military: "\"Un buon generale può determinare l'esito di una battaglia.\""


