hint_town_rights: "$game_concept_town_rights$" #NEW
hint_town_rights_hint_text: "$hint_town_rights_hint_text_1$" #NEW
hint_town_rights_hint_text_1: "$game_concept_town_rights_desc$" #NEW
hint_town_rights_hint_text_3: "#T Extra Hints:#!\n@hint! Some historical Rights might be positive, some may be negative. Rights can be revoked, but keep in mind that doing so costs [stability_with_icon|e], and greatly angers the local [pops_with_icon|e].\n@hint! The specialization Rights that come with [advance_icon][ShowAdvanceName('town_rights_enable')] can become a powerful boost to the efficiency of your urban centers, and can be used to shape the economic fabric of our [country] in the long run.\n@hint! Productivity Rights are best employed in places that naturally enjoy a high [production_efficiency_with_icon|e] in a given industry. For instance, a [ShowBuildingTypeName('cloth_guild')] is more efficient at turning [ShowGoodsName('wool')] into [ShowGoodsName('cloth')] if Wool is produced in one of the [rgo_with_icon|e] of its [province_with_icon|e]. That might be a perfect candidate for granting [ShowTownRightsName('royal_textile_rights')]." #NEW                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                     
hint_town_rights_diplomatic: "$hint_advisor_salute_diplomatic$" #NEW
