# hint_siege_and_occupation_hint_text_1: "Quando un [army|e] mette piede in una [location|e] [enemy|e], cercherà di [occupy|e]. Se la [location] non ha un [fort|e], sarà occupata in pochi giorni. Tuttavia, in presenza di un forte, inizierà un [siege|e].\n\nGli assedi possono durare mesi, o anche anni, a seconda di molti fattori, come il livello delle fortificazioni, la presenza di artiglieria, l'[ability|e] del [general|e] assediante e altro ancora.\n\nQuando la guarnigione si arrende, la [location] diventerà [occupied] e il [fort] rimarrà sotto il controllo del vincitore.\n\nLe località occupate sono mostrate sulla mappa con barre incrociate e non sono di proprietà dell'occupante finché la conquista non viene ratificata in un trattato di pace." #OLD
 hint_siege_and_occupation_hint_text_1: "When an [army_with_icon|e] sets foot in an [enemy_with_icon|e] [location_with_icon|e], it will try to [occupy_with_icon|e] it. If the [location] does not have a [fort_with_icon|e], it will be occupied in a matter of days. However, in the presence of a fort, a [siege_with_icon|e] will begin.\n\nSieges can last months, or even years, depending on many factors, such as the level of the fortifications, the presence of artillery, the [ability_with_icon|e] of the besieging [general_with_icon|e], and more.\n\nWhen the garrison surrenders, the [location] will become [occupied], and the [fort] will stay under the control of the victor.\n\nOccupied locations are shown on the map with crossing bars, and are not owned by the occupier until the conquest has been ratified in a peace treaty." #NEW
# hint_siege_and_occupation_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicuratevi che un [army|e] possa sopravvivere a un assedio prima di iniziarlo.\n@arrow_bonus_tier_1! Non abbiate paura di ritirarvi da un assedio se si sta avvicinando un pericoloso esercito nemico." #OLD
