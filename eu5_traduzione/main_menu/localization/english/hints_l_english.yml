 hint_advisor_salute_diplomatic: "\n\"Saluti, Vostra Altezza. Sono [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('diplomatic').GetName], il vostro consigliere diplomatico e umilissimo servitore.\""
 hint_advisor_salute_administrative: "\n\"Chi vi parla porta il nome di [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('administrative').GetName], leale consigliere di Vostra Eccellenza su tutte le questioni economiche e amministrative.\""
 hint_advisor_salute_military: "\n\"Mi chiamo [Player.GetGovernment.CalcBestRepresentativeForPlaystyle('military').GetName], il vostro esperto in questioni militari. Al vostro servizio.\""

