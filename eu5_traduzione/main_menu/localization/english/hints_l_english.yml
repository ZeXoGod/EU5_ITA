# hint_reformation_hint_text_2: "#T Combattere i Riformatori:#!\n@arrow_bonus_tier_3! Rimuovete gli [buildings|e] [ShowBuildingTypeName('lutheran_preachers')] e [ShowBuildingTypeName('calvinist_preachers')], il che vi costerà [stability|e]\n@arrow_bonus_tier_3! Una volta abilitato, costruite e mantenete [ShowBuildingTypeName('jesuit_college')] per combattere la diffusione di [ShowReligionName('lutheran')] e [ShowReligionName('calvinist')]" #OLD
 hint_reformation_hint_text_2: "#T Combat the Reformers:#!\n@arrow_bonus_tier_3!Once you have the [ShowPolicyName('jesuits_allowed')] selected, remove the [ShowBuildingTypeName('lutheran_preachers')] and [ShowBuildingTypeName('calvinist_preachers')] [buildings_with_icon|e] which will cost you [stability_with_icon|e]\n@arrow_bonus_tier_3! Once enabled, construct and maintain [ShowBuildingTypeName('jesuit_college')] to combat the spread of [ShowReligionName('lutheran')] and [ShowReligionName('calvinist')]" #NEW
