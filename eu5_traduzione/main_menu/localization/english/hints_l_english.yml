# hint_lacks_of_rivals_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Osservate le Rivalità e le [alliances|e] dei nostri vicini e scegliete gli stessi rivali del Paese con cui volete allearvi. Ma fate attenzione a non creare nemici troppo potenti nel processo.\n@arrow_bonus_tier_2! Potete aspettare che altri [countries] abbiano dichiarato i loro [rivals] prima di fare la vostra mossa. In questo modo eviterete di far arrabbiare i [countries] sbagliati.\n@arrow_bonus_tier_2! Costruite una [spy_network|e] nei nostri [rivals] per fabbricare un [casus_belli|e] contro di loro." #OLD
 hint_lacks_of_rivals_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Observe the Rivalries and [alliances_with_icon|e] of our neighbors, and pick the same rivals as the country you want to ally. But beware of making too powerful enemies in the process.\n@arrow_bonus_tier_2! You can wait until other [countries] have declared their [rivals] before making your move. That way you will avoid angering the wrong [countries].\n@arrow_bonus_tier_2! Build a [spy_network_with_icon|e] in our [rivals] in order to fabricate a [casus_belli_with_icon|e] against them." #NEW
# hint_lacks_of_rivals_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Non è necessario dichiarare tutti i nostri rivali disponibili. Ricordate che potete fare clic destro sull'#W Alert#! per ignorarlo.\n@hint! Avere Rivali vi permetterà anche di essere chiamato nelle loro guerre dalla parte opposta. Ma siate cauti: i nostri [rival_enemies|e] potranno intervenire anche nelle nostre." #OLD
 hint_lacks_of_rivals_hint_text_3: "#T Extra Hints:#!\n@hint! You do not need to declare all our available rivals. Remember you can right-click the #W Alert#! to discard it.\n@hint! Having Rivals will also allow you to be called to their wars in the opposite side. But be cautious: our [rival_enemies_with_icon|e] will be able to intervene in ours as well." #NEW
 
 hint_lacks_of_rivals_diplomatic: "\"Creare nemici non necessari non è mai consigliabile, ma dichiarare gli stessi Rivali dei nostri vicini potrebbe aiutarci ad assicurarci un'alleanza con loro.\""
 hint_lacks_of_rivals_administrative: "\"I nemici dei nostri rivali dovrebbero essere i nostri amici.\""
 hint_lacks_of_rivals_military: "\"Avere i Rivali appropriati offre abbondanti opportunità per coloro che sono abbastanza audaci da coglierle.\""
 
 
 ### Construction missing input
 hint_control: "Prossimità e Controllo"
 hint_control_hint_text: "$hint_control_hint_text_1$\n\n$hint_control_hint_text_2$\n\n$hint_control_hint_text_3$"
# hint_control_hint_text_1: "[control_icon] Il [control|e] è uno degli attributi più importanti delle nostre [locations_with_icon]. Determina la percentuale di [wealth_with_icon] e [levies_icon] [levies|e] che è effettivamente utilizzabile da noi. Una [location] può avere molti [building_icon] [buildings|e] e [population_icon] [population|e] elevata, ma il governo non otterrà [taxes_with_icon|e] o [levies] a meno che non vi sia un certo [control] nella [location].\n\nIl Controllo di una Località cambia mensilmente verso il [max_control|e]. Un [siege|e] o altri eventi possono abbassarlo temporaneamente, ma la Località alla fine tornerà al suo valore massimo.\n\nLa principale fonte di [max_control] è la [proximity_icon] [proximity|e]. La nostra [capital_icon] [capital|e] avrà sempre #W 100%#! di Prossimità e tutte le altre Località calcolano la loro prossimità in base alla distanza dalla Capitale. La Prossimità può propagarsi via terra e via mare e lo fa in modo più efficiente lungo le [road_icon] [roads|e], il terreno aperto e le [seazones_icon] [seazones|e] con alta [maritime_presence_icon] [maritime_presence|e]; e meno efficacemente attraverso montagne, foreste e [seazones] infestate da [pirates|e]. Ci sono altri fattori che influenzano anche il Controllo Massimo, come [pop_satisfaction|e], [integration_status|e], o alcuni [buildings] speciali." #OLD
 hint_control_hint_text_1: "[control_with_icon|e] is one of the most important attributes of our [locations_with_icon|e]. It represents the reach of the central government, and it determines the portion of the [wealth_with_icon|e] in a [location] that can be affected by your [taxes_with_icon|e]. Any [wealth] outside the reach of your [control] goes directly to the pocket of your [estates_with_icon|e], completely free of [taxes]. [control] also determines how many [levies_with_icon|e] you can muster from the [location].\n\nThe Control of a Location changes monthly towards the [max_control_with_icon|e]. A [siege_with_icon|e] or other events may lower it temporarily, but the Location will eventually return to its max value.\n\nThe main source of [max_control] is [proximity_icon] [proximity|e]. Our [capital_icon] [capital|e] will always have #W 100%#! Proximity, and all other Locations calculate their proximity depending on the distance to the Capital. Proximity can propagate through land and sea, and it does so more efficiently along [road_icon] [roads_with_icon|e], open terrain and [seazones_icon] [seazones|e] with high [maritime_presence_icon] [maritime_presence|e]; and less efficiently through mountains, forests and [seazones] infested with [pirates_with_icon|e]. There are other factors that also affect Max Control, like [pop_satisfaction_with_icon|e], [integration_status_with_icon|e], or some special [buildings].\n\nOn top of your [capital], you can also radiate [proximity] from a [ShowBuildingTypeName('local_governor')] [building|e]." #NEW
# hint_control_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Concentrate i vostri sforzi di costruzione nella nostra [capital] e nelle [locations] circostanti, poiché godranno naturalmente del [control] più alto fin dall'inizio del gioco.\n@arrow_bonus_tier_2! Costruite [road_icon] [roads|e] dal #W Pannello Località#! per collegare la nostra [capital] alle nostre città più ricche.\n@arrow_bonus_tier_2! Le Località con un [port_icon] [port|e] potrebbero avere più facile accesso alla [capital] via mare, soprattutto se hanno un'[harbor_capacity|e] elevata. Potete aumentarla nelle nostre [locations] costiere chiave con [buildings] come un [ShowBuildingTypeName('wharf')] o una [ShowBuildingTypeName('dock')].\n@arrow_bonus_tier_1! La [locations] appena [conquered|e] inizierà con #W 0%#! [control] e potrebbe impiegare molto tempo per raggiungere il Massimo. Potete accelerare il processo posizionando un [army|e] nella [location], o utilizzando un'[cabinet_action_icon] [cabinet_action|e] [ShowCabinetActionName('increase_control_province')]." #OLD
 hint_control_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Concentrate your building efforts in our [capital] and surrounding [locations], as they will naturally enjoy the highest [control] from the beginning of the game.\n@arrow_bonus_tier_2! Build [road_icon] [roads|e] from the #W Location Panel#! in order to connect our [capital] to our wealthiest cities.\n@arrow_bonus_tier_2! Consider building a [ShowBuildingTypeName('local_governor')] in areas with high [wealth] and low [control]. They need to be buit in a [ShowLocationRankName('city')] connected to your [capital] by a [road], and they will act as a secondary [capital]. They are quite expensive to maintain, so make sure the benefits justify the investment!\n@arrow_bonus_tier_2! Locations with a [port_icon] [port|e] might have an easier time reaching the [capital] through sea, especially if they have high [harbor_capacity_with_icon|e]. You can increase it in our key coastal [locations] with [buildings] like a [ShowBuildingTypeName('wharf')] or a [ShowBuildingTypeName('dock')].\n@arrow_bonus_tier_1! Newly [conquered_with_icon|e] [locations] will start at #W 0%#! [control], and might take a long time to reach their Maximum. You can speed up the process by placing an [army_with_icon|e] in the [location], or using a [ShowCabinetActionName('increase_control_province')] [cabinet_action_icon] [cabinet_action|e]." #NEW
# hint_control_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Una [location] con #W 0%#! [control] non genererà [income_with_icon] attraverso le [taxes], ma i [goods|e] che produce raggiungeranno comunque il [market_icon] [market|e], quindi potremmo comunque voler costruire importanti risorse lì per garantire una [supply|e] sufficiente.\n@hint! I [ShowPopTypeName('peasants')] si possono [promote|e] molto più velocemente nelle [locations] con [control] elevato e quindi i nuovi [buildings] soddisferanno prima il loro [employment|e].\n@hint! Pianificate attentamente la nostra rete di [roads]: una singola [road] ben posizionata che attraversa una catena montuosa può migliorare la [proximity] di molte [locations] dall'altra parte.\n@hint! Per saperne di più sulla [proximity] da [maritime_presence_with_icon|e] potete consultare il Suggerimento [Link('hints', 'selected_hint = hint_maritime', '$hint_maritime$')] #!" #OLD
 hint_control_hint_text_3: "#T Extra Hints:#!\n@hint! The Average Control of your [country] has a very important effect on your [crown_power_with_icon|e]. A big [country] with low [control] will have a hard time managing its [estates] and resources effectively, whereas a small but centralized State can punch above its weight. Always remember that mindless expansion can bring ruin to a [country]! Learn more about [crown_power] in the [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n@hint! Keep in mind that a [location] with #W 0%#! [control] will not generate any [taxes], but the [estates] will still reap the benefits. Rich and happy [estates] can help build up our economy on their own.\n@hint! Plan our [road] network carefully: A single, well-placed [road] crossing a mountain chain can improve the [proximity] of many [locations] on the other side.\n@hint! Some [government_reforms_with_icon|e], like [ShowGovernmentReformName('harbor_administration')], allow you to build a [ShowBuildingTypeName('naval_governor')] overseas. Governors act as secondary [capitals] and help radiate [proximity] onto distant lands. Naval Governors can only be built in a coastal [ShowLocationRankName('city')] that is not connected by land to your [capital]\n@hint! To learn more about [proximity] from [maritime_presence_with_icon|e] you can check the [Link('hints', 'selected_hint = hint_maritime', 'Maritime Presence')] Hint#!" #NEW
 
 hint_control_diplomatic: "\"Un Controllo elevato aiuta a convertire e assimilare i membri più... #italic disordinati#! della nostra società.\""
 hint_control_administrative: "\"Una Località al di fuori del nostro controllo difficilmente fornirà tasse.\""
 hint_control_military: "\"Dobbiamo controllare la nostra terra se vogliamo imporre la leva sulla nostra popolazione.\""


 ### Crown Power
 hint_crown_power: "Potere della Corona"
 hint_crown_power_hint_text: "$hint_crown_power_hint_text_1$\n\n$hint_crown_power_hint_text_2$\n\n$hint_crown_power_hint_text_3$"
 hint_crown_power_hint_text_1: "Il [crown_power_with_icon|e] rappresenta l'influenza del nostro Governo all'interno dei nostri confini. Come [ShowEstateTypeName('crown_estate')], condividiamo le risorse del nostro Paese con i nostri [estates_with_icon|e], i cui interessi potrebbero non sempre coincidere con i nostri.\n\nUn Potere della Corona più elevato renderà più facile l'emanazione di nuove [laws_with_icon|e], migliorerà l'efficienza del nostro [cabinet_with_icon|e] e aumenterà il nostro supporto di base nel [parliament_with_icon|e]. Forse ancora più importante, il Potere della Corona determina in che misura lo Stato condivide i profitti e i costi di [trade_with_icon|e] e [food_with_icon|e] con i [estates].\n\nIl nostro Potere della Corona dipenderà principalmente dalla quantità di [privileges_with_icon|e] concessi ai [estates] e dal [control_with_icon|e] delle nostre [locations_with_icon|e] più popolate."
 hint_crown_power_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Aumentate il Controllo nelle nostre [locations] costruendo [roads_with_icon|e] dalla [capital_with_icon|e]. \n@arrow_bonus_tier_2! Revocate i [privileges] dai nostri [estates] più potenti quando abbiamo [stability_with_icon|e] elevata, ma tenete d'occhio la loro [estate_satisfaction|e]. Un [estate] arrabbiato potrebbe annunciare problemi all'orizzonte.\n@arrow_bonus_tier_1! Aumentate la [Localize(Player.GetGovernment.GetGovernmentType.GetPowerConcept)] con l'[cabinet_action_with_icon|e] [ShowCabinetActionName('strengthen_government')].\n@arrow_bonus_tier_1! Costruite una [ShowBuildingTypeName('royal_court')] o una [ShowBuildingTypeName('sergeantry')] nella [capital]."
 hint_crown_power_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! Al 50% di Potere della Corona, metà delle spese e dei profitti per [trade] e [food] andranno direttamente nel [treasury_with_icon|e], mentre l'altra metà sarà distribuita tra i [estates], in base al loro rispettivo [estate_power_with_icon|e].\n@hint! Il Potere della Corona è solitamente molto basso all'inizio del gioco, specialmente per i [countries] più grandi.\n@hint! I futuri [advances_with_icon|e] sbloccheranno [buildings] aggiuntivi e altri bonus al vostro [crown_power]."
 
 hint_crown_power_diplomatic: "\"Finché il nostro Potere della Corona è basso, restiamo in balia dei nostri Ceti.\""
 hint_crown_power_administrative: "\"Aumentare il nostro Potere della Corona ci aiuterebbe a raccogliere i benefici del Commercio.\""
 hint_crown_power_military: "\"Uno Stato centralizzato può colpire ben al di sopra del suo peso.\""
 
 
 ### Estates
 hint_estates: "Ceti"
 hint_estates_hint_text: "$hint_estates_hint_text_1$\n\n$hint_estates_hint_text_2$\n\n$hint_estates_hint_text_3$"
# hint_estates_hint_text_1: "I Ceti sono una rappresentazione di interessi particolari all'interno dei nostri confini. Ogni Ceto ha una percentuale di [estate_power_with_icon|e] che misura il suo potere rispetto agli altri Ceti e alla [ShowEstateTypeName('crown_estate')] in una distribuzione a somma zero.\n\nIl potere dei Ceti deriva principalmente dalla [population_with_icon|e], con ogni [pop_type|e] che supporta uno specifico [estate]. Il Potere del Ceto è ulteriormente modificato dalle [laws_with_icon|e] e dai [privileges_with_icon|e] esistenti.\n\nIl Potere del Ceto determina la loro forza nel [parliament_with_icon|e], influenza il valore delle [taxes|e] e detta come vengono distribuiti i profitti e i costi da [trade_with_icon|e] e [food_with_icon|e].\n\nI Ceti hanno anche un livello di [estate_satisfaction_with_icon|e] che misura la loro conformità con il nostro Governo. Ogni Ceto fornisce un diverso modificatore positivo quando la loro soddisfazione è alta e una penalità quando è inferiore a #W 50%#!. Quando la [estate_satisfaction] è troppo bassa, la loro componente [pops|e] potrebbe iniziare ad alimentare [rebellions_with_icon|e]. Cosa più preoccupante, un Ceto con una Soddisfazione inferiore a #W 25%#! smetterà di fornire [levies_with_icon|e]." #OLD
 hint_estates_hint_text_1: "Estates are a representation of particular interests within our borders. Each Estate has a percentage of [estate_power_with_icon|e] that measures their power compared to other Estates and the [ShowEstateTypeName('crown_estate')] in a zero-sum distribution.\n\nEstates derive their power primarily from [population_with_icon|e], with each [pop_type_with_icon|e] supporting one specific [estate]. Estate Power is further modified by existing [laws_with_icon|e] and [privileges_with_icon|e].\n\nEstate Power determines their power in [parliament_with_icon|e], it influences how much you can [tax_with_icon|e] them, and it dictates how profits and costs from [trade_with_icon|e] and [food_with_icon|e] are distributed.\n\nEstates also have a level of [estate_satisfaction_with_icon|e] that measures their compliance with our Government. Each Estate provides a different positive modifier when their satisfaction is high, and a penalty when under #W 50%#!. When the [estate_satisfaction] of a Estate is too low, their constituent [pops_with_icon|e] might start fuelling [rebellions_with_icon|e]. Most worryingly, a Estate under #W 25%#! Satisfaction will stop providing [levies_with_icon|e]." #NEW
# hint_estates_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Le [taxes|e] riscosse dai [estates] sono la principale fonte di [income|e] per la maggior parte dei [countries]. Potete impostare o automatizzare le tasse dal @economy_panel! #W Pannello Bilancio#!.\n@arrow_bonus_tier_2! Qualsiasi potere detenuto dai Ceti avviene a spese del nostro [crown_power_with_icon|e]. Potete erodere il loro potere revocando i loro [privileges_with_icon|e] dalla @government_panel! #W Scheda Ceti#!.\n@arrow_bonus_tier_1! Potete placare un Ceto ribelle abbassando le [taxes], concedendo un [privilege] o corrompendoli dalla @government_panel! #W Scheda Ceti#!." #OLD
 hint_estates_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! [taxes_with_icon|e] collected from the [estates] are the main source of [income_with_icon|e] for most [countries]. You can set or automate taxes from the @economy_panel! #W Budget panel#!.\n@arrow_bonus_tier_2! Any power the Estates hold comes at the expense of our [crown_power_with_icon|e]. You can erode their power by revoking their [privileges_with_icon|e] from the @government_panel! #W Estates Tab#!.\n@arrow_bonus_tier_1! You can placate a rebellious Estate by lowering [taxes], granting a [privilege], or bribing them from the @government_panel! #W Estates Tab#!." #NEW
# hint_estates_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I Ceti raccolgono tutta la [tax_base_with_icon|e] dalle nostre [locations|e] e noi ne otteniamo da loro soltanto una parte delle [taxes].\n@hint! I [countries] nel gioco iniziale fanno molto affidamento sulle [levies_with_icon|e] fornite dai [estates] per condurre le loro [wars_with_icon|e], finché non iniziano a essere sostituite da [regular_regiments_with_icon|e] più moderni." #OLD
 hint_estates_hint_text_3: "#T Extra Hints:#!\n@hint! The Estates collect all the [tax_base_with_icon|e] from our [locations_with_icon|e], and we only get as much as we [tax] out of them.\n@hint! [countries] in the early game are very reliant on [levies_with_icon|e] provided by the [estates] to wage their [wars_with_icon|e], until they start to be replaced by more modern [regular_regiments_with_icon|e]." #NEW
 
 hint_estates_diplomatic: "\"Un Clero forte migliora la stabilità del regno.\""
 hint_estates_administrative: "\"Un forte Ceto Borghese aggiunge ricchezza alla nostra nazione e volume al nostro commercio.\""
 hint_estates_military: "\"Una forte Nobiltà aumenta la dimensione e la potenza dei nostri eserciti.\""
 
 
 ### Markets
 hint_markets: "Mercati"
 hint_markets_hint_text: "$hint_markets_hint_text_1$\n\n$hint_markets_hint_text_2$\n\n$hint_markets_hint_text_3$"
# hint_markets_hint_text_1: "I [markets_with_icon|e] sono il cuore dell'economia in #italic Europa Universalis V#!. Tutte le Località appartengono a un Mercato dove vendono e acquistano i beni necessari per i [pop_needs|e], [buildings|e] e [constructions|e]. Vendendo beni al loro Mercato, le Località generano [tax_base_with_icon|e] per i [estates|e], che a loro volta possono essere raccolti dal Governo sotto forma di [taxes|e]." #OLD
 hint_markets_hint_text_1: "[markets_with_icon|e] are the heart of the economy in #italic Europa Universalis V#!. All Locations belong to a Market where they sell and buy the goods needed for [pop_needs_with_icon|e], [buildings_with_icon|e], and [constructions_with_icon|e]. By selling goods to their Market, Location generate [tax_base_with_icon|e] for the [estates_with_icon|e], which can in turn be collected by the Government in the form of [taxes_with_icon|e]." #NEW
# hint_markets_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @economy_panel![Link('trade', 'subtab = markets', 'Pannello Mercati')] per vedere i nostri Mercati rilevanti. I Mercati con una colorazione #G Verde#! contengono i nostri [owned|e], mentre i Mercati con intestazioni Blu sono Mercati in cui abbiamo [merchant_capacity|e], ma non [own] alcuna [location].\n@arrow_bonus_tier_3! vi consigliamo di automatizzare ogni singolo [market] cliccando sull'Icona Ingranaggio #W Cog Icon#! @automation!. Ciò manterrà tutta la nostra [merchant_capacity_with_icon|e] utilizzata sui [merchants_with_icon|e] più interessanti in ogni momento.\n@arrow_bonus_tier_2! Costruite [buildings_with_icon|e] come [ShowBuildingTypeName('marketplace')] e [ShowBuildingTypeName('trade_office')] per aumentare la nostra [merchant_capacity_with_icon|e] in un Mercato." #OLD
 hint_markets_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Go to the @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')] to see our relevant Markets. Markets with a #G Green#! header contain our [owned_with_icon|e], whereas Markets with Blue headers are Markets where we have [merchant_capacity_with_icon|e], but do not [own] any [location].\n@arrow_bonus_tier_3! You are advised to automate each individual [market] by clicking on the @automation! #W Cog Icon#!. This will keep all our [merchant_capacity_with_icon|e] used up on the most interesting [merchants_with_icon|e] at all times.\n@arrow_bonus_tier_2! Construct [buildings_with_icon|e] like [ShowBuildingTypeName('marketplace')] and [ShowBuildingTypeName('trade_office')] to increase our [merchant_capacity_with_icon|e] in a Market." #NEW
 hint_markets_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I confini dei Mercati sono dinamici: le [locations] rientreranno nel [market] con la [market_attraction_with_icon|e] più alta nel loro territorio, anche se si tratta di un Mercato straniero. La [market_attraction] dei Mercati stranieri può essere annullata dal [protectionism_with_icon|e]."
 
 hint_markets_diplomatic: "\"La Mano Invisibile è un saggio maestro, ma a volte richiede un po' di guida.\""
 hint_markets_administrative: "\"È l'economia, stolto!\""
 hint_markets_military: "\"Far crescere i nostri Mercati è una cosa buona.\nConquistare i Mercati vicini è anche meglio.\""


 ### Food
 hint_food: "Cibo"
 hint_food_hint_text: "$hint_food_hint_text_1$\n\n$hint_food_hint_text_2$\n\n$hint_food_hint_text_3$"
# hint_food_hint_text_1: "I [pops|e] hanno bisogno di [food_with_icon|e] per vivere e gli [armies|e] hanno bisogno di [food] per marciare. Entrambi ottengono il [food] di cui hanno bisogno dalla Scorta della [province_with_icon|e] in cui si trovano (e non dalla [location]!). Se non c'è abbastanza [food], i [pops] soffriranno l'[starvation|e] e gli [armies] soffriranno l'[attrition|e].\n\nCi sono 3 livelli coinvolti nella produzione e distribuzione di $game_concept_food$:\n\n@location! [local_food|e]:\nIl $game_concept_food$ è prodotto principalmente in quelle [locations|e] con [food_raw_materials|e] come loro [rgo_with_icon|e], come il [ShowGoodsName('livestock')]. Qualsiasi eccedenza o deficit che la [location] possa avere viene aggiunta al $game_concept_provincial_food$.\n\n@province! [provincial_food|e]:\nIl $game_concept_provincial_food$ è lo strato più importante. Se una [province|e] non produce abbastanza $game_concept_food$ per sostenere il consumo di tutte le sue $game_concept_locations$, la scorta provinciale diminuirà. Quando si esaurisce, tutte le $game_concept_locations$ all'interno di una $game_concept_province$ soffriranno l'[starvation|e]. Ma prima che ciò accada, la $game_concept_province$ cercherà di [buy_food|e] dal suo $game_concept_market$.\n\n@market! [market_food|e]:\nTutte le $game_concept_provinces$ in un [market|e] procederanno alla [sell_food|e] quando la loro scorta è piena e cercheranno l'[buy_food|e] quando è bassa. Finché c'è abbastanza $game_concept_food$ all'interno di un $game_concept_market$, nessuno morirà di fame." #OLD
 hint_food_hint_text_1: "[pops_with_icon|e] need [food_with_icon|e] to live, and [armies_with_icon|e] need [food] to march. They both get the [food] they need from the Stockpile of the [province_with_icon|e] they are in (and not from the [location]!). If there is not enough [food], [pops] will suffer [starvation_with_icon|e], and [armies] will suffer [attrition_with_icon|e].\n\nThere are 3 layers involved in the production and distribution of $game_concept_food$:\n\n@location! [local_food_with_icon|e]:\n$game_concept_food$ is produced primarily in those [locations_with_icon|e] with [food_raw_materials_with_icon|e] as their [rgo_with_icon|e], like [ShowGoodsName('livestock')]. Any surplus or deficit the [location] may have is added to the $game_concept_provincial_food$.\n\n@province! [provincial_food|e]:\nThe $game_concept_provincial_food$ is the most important layer. If a [province_with_icon|e] does not produce enough $game_concept_food$ to sustain the consumption of all its $game_concept_locations$, the Provincial storage will decrease. When it depletes, all $game_concept_locations$ inside a $game_concept_province$ will suffer [starvation_with_icon|e]. But before that happens, the $game_concept_province$ will try to [buy_food_with_icon|e] from its $game_concept_market$.\n\n@market! [market_food|e]:\nAll $game_concept_provinces$ in a [market_with_icon|e] will try to [sell_food_with_icon|e] when their storage is full, and try to [buy_food] when it is low. As long as there is enough $game_concept_food$ inside a $game_concept_market$, no one will starve." #NEW
# hint_food_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Andate al @economy_panel![Link('trade', 'subtab = markets', 'Pannello Mercati')] per vedere i nostri Mercati rilevanti. I Mercati con un'intestazione #G Verde#! contengono le nostre [locations] [owned|e], quindi dobbiamo assicurarci che il loro bilancio [food] rimanga positivo. Se il [food] sta diminuendo rapidamente in uno qualsiasi dei nostri Mercati, vedrete un Banner Giallo. Se ci sono [locations] che stanno morendo di fame, vedrete un Banner Rosso.\n@arrow_bonus_tier_3! Per aumentare la produzione di cibo in uno qualsiasi dei nostri Mercati, cliccate sul pulsante Cibo per andare al @production_panel![Link('food_production', '', 'lateralview_food_production_entry_name')]. Da lì potete vedere quale delle nostre [provinces] è in pericolo di [starvation] ed espandere la loro [rgo].\n@arrow_bonus_tier_3! Espandete [rgo_with_icon|e] nelle Località con le migliori [food_raw_materials], come [ShowGoodsName('rice')] o [ShowGoodsName('wheat')] e un'elevata [food_productivity_with_icon|e].\n@arrow_bonus_tier_1! Possiamo anche usare [merchant_capacity_with_icon|e] per importare [food_raw_materials|e] da altri [markets], il che sposterà anche una quantità equivalente di [food]. Potete farlo dal @economy_panel![Link('trade', 'subtab = trades', 'lateralview_trade_entry_name')]." #OLD
 hint_food_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Go to the @economy_panel! [Link('trade', 'subtab = markets', 'Markets Panel')] to see our relevant Markets. Markets with a #G Green#! header contain our [owned_with_icon|e] [locations], so we need to make sure their [food] balance stays positive. If [food] is decreasing rapidly in any of our Markets, you will see a Yellow Banner. If there are starving [locations], you will see a Red banner.\n@arrow_bonus_tier_3! In order to increase food production in any of our Markets, click on the Food button to go to the @production_panel! [Link('food_production', '', 'lateralview_food_production_entry_name')]. From there you can see which of our [provinces] is in danger of [starvation], and expand their [rgo].\n@arrow_bonus_tier_3! Expand [rgo_with_icon|e] in Locations with the best [food_raw_materials], like [ShowGoodsName('rice')] or [ShowGoodsName('wheat')], and high [food_productivity_with_icon|e].\n@arrow_bonus_tier_1! We can also use [merchant_capacity_with_icon|e] to import [food_raw_materials_with_icon|e] from other [markets], which will also move an equivalent amount of [food]. You can do that from the @economy_panel! [Link('trade', 'subtab = trades', 'lateralview_trade_entry_name')]." #NEW
# hint_food_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! La produzione di cibo diminuisce durante l'[winter_with_icon|e]. Non fatevi prendere dal panico se vedete tutti i nostri Mercati andare in negativo per alcuni mesi.\n@hint! Le [provinces|U] in deficit compreranno l'eccedenza delle vostre Province più produttive, purché appartengano allo stesso Mercato, quindi di solito è meglio espandere i beni alimentari nelle [locations] con la [food_productivity] più alta.\n@hint! Le [town_or_city|e] sono di solito meno efficienti delle [rural_locations|e] nella produzione di [food]." #OLD
 hint_food_hint_text_3: "#T Extra Hints:#!\n@hint! Food production decreases during [winter_with_icon|e]. Do not panic if you see all our Markets go in the negative for some months.\n@hint! [provinces|U] in deficit will buy the surplus of your most productive Provinces, as long as they belong to the same Market, so it is usually best to expand food goods in [locations] with the highest [food_productivity].\n@hint! [town_or_city_with_icon|e] are usually less efficient than [rural_locations_with_icon|e] at producing [food]." #NEW
 
 hint_food_diplomatic: "\"Una fame prolungata può significare la distruzione della nostra popolazione e la rovina della nostra nazione.\""
 hint_food_administrative: "\"La fame è principalmente una questione di prospettiva. Non è poi così male se siete Voi a vendere il cibo.\""
 hint_food_military: "\"Un esercito marcia sul suo stomaco.\""
 
 ### Maritime Presence
 hint_maritime: "Presenza Marittima"
 hint_maritime_hint_text: "$hint_maritime_hint_text_1$\n\n$hint_maritime_hint_text_2$\n\n$hint_maritime_hint_text_3$"
 hint_maritime_hint_text_1: "La [maritime_presence_with_icon|e] è una metrica molto importante per le [seazones_with_icon|e] costiere. Ha la capacità di aiutare a esercitare [proximity_with_icon|e] lungo le nostre coste o isole.\n\nInoltre, fornisce [merchant_power_with_icon|e] al [market_with_icon|e] a cui appartengolo le [seazones].\n\nLa [maritime_presence] è ottenuta passivamente tramite [buildings] e tramite la presenza della [navy_with_icon|e], ha un effetto di decadimento ma può anche essere persa a causa di [privateers_with_icon|e] o in caso di [blockade_with_icon|e]."
# hint_maritime_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Create [navies] specializzate con navi che hanno un elevato guadagno di [maritime_presence]. Potete quindi posizionarle in una delle vostre [seazones] costiere ed esse diffonderanno la loro [maritime_presence] equamente a tutte le [seazones] che appartengono a quella stessa [province_with_icon|e].\n@arrow_bonus_tier_3! In alternativa, potete impostarle sull'[military_objective_with_icon|e] #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! (pattugliare i mari), che farà la stessa cosa ma attraccherà automaticamente le navi per essere riparate se necessario.\n@arrow_bonus_tier_1! Il [ShowBuildingTypeName('coastal_fort')] è un ottimo edificio da usare!" #OLD
 hint_maritime_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Create specialized [navies] with ships that have high [maritime_presence] gain. You can then put them at one of your coastal [seazones] and they will spread their [maritime_presence] equally to all [seazones] that belong to that same [province_with_icon|e].\n@arrow_bonus_tier_3! Alternatively, you can set them on [military_objective_with_icon|e] #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#!, which will do the same thing but will also automatically dock the ships to be repaired if needed.\n@arrow_bonus_tier_2! Push the [ShowSocietyDirectionName('naval')] [societal_value|e].\n@arrow_bonus_tier_1! [ShowBuildingTypeName('coastal_fort')] is a very good building to use!" #NEW
# hint_maritime_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! La [maritime_presence] viene diffusa solo alla [province] su cui si trovano, anche se l'obiettivo è impostato su più [provinces]. #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! sposterà la [navy] una volta che la località [seazone] ha raggiunto 100 [maritime_presence].\n@hint! I [privateers] agiscono a livello di [area_with_icon|e] rispetto alla [maritime_presence]." #OLD
 hint_maritime_hint_text_3: "#T Extra Hints:#!\n@hint! [maritime_presence] is only spread to the [province] they are on, even if the objective is set to more than one [province]. #V $MILITARY_OBJECTIVE_TYPE_NAME_patrol_the_seas$#! will move the [navy] once the [seazone] location has reached #W 100%#! [maritime_presence].\n@hint! [privateers] steal wealth from other [countries] while lowering their [maritime_presence]. Unlike [maritime_presence], [privateers] operate on the [area_with_icon|e] level, meaning that all [provinces] within an [area] will suffer the effects of [privateers].\n@hint! Some [government_reforms_with_icon|e], like [ShowGovernmentReformName('harbor_administration')], allow you to build a [ShowBuildingTypeName('naval_governor')] overseas. Governors act as secondary [capitals], and help radiate [proximity] onto distant lands. Naval Governors can only be built in a coastal [ShowLocationRankName('city')] that is not connected by land to your [capital]." #NEW
 
 hint_maritime_diplomatic: "\"Dobbiamo approfittare della nostra costa per migliorare i nostri commerci.\""
 hint_maritime_administrative: "\"Più sicura è la navigazione marittima, migliore è la comunicazione con la nostra popolazione.\""
 hint_maritime_military: "\"Con una forte presenza navale, i pirati non oseranno toccare le nostre rotte commerciali.\""
 
 hint_slaves: "Schiavi"
 hint_slaves_hint_text: "$hint_slaves_hint_text_1$\n\n$hint_slaves_hint_text_2$\n\n$hint_slaves_hint_text_3$"
# hint_slaves_hint_text_1: "Gli @slaves_goods! [ShowGoodsName('slaves_goods')] sono un tipo molto speciale di [good_with_icon|e]. Come ogni altro [good], vengono comprati e venduti nei [markets_with_icon|e] e il loro prezzo dipende da [supply|e] e [demand|e]. A differenza di qualsiasi altro [good], rappresentano [pops_with_icon|e] effettivi, che vengono spostati ogni volta che il [good] viene scambiato.\n\nCome [pop_type_with_icon|e], gli @slaves! [ShowPopTypeName('slaves')] possono essere usati come forza lavoro nelle [rgo_with_icon|e] e in [buildings_with_icon|e] per Schiavi, come la [ShowBuildingTypeName('sugar_plantation')].\n\n[buildings] come il [ShowBuildingTypeName('slave_market')] possono trasformare @slaves! [ShowPopTypeName('slaves')] esistenti in [goods] @slaves_goods![ShowGoodsName('slaves_goods')], che a loro volta vengono venduti nel [market]. Il [good] viene quindi scambiata come qualsiasi altro [good] e gli [buildings] possono richiederli come input. Quando ciò accade, gli @slaves! [ShowPopTypeName('slaves')] verranno spostati nella [location] per lavorare nell'[building]." #OLD
 hint_slaves_hint_text_1: "@slaves_goods! [ShowGoodsName('slaves_goods')] are a most special kind of [good_with_icon|e]. Like any other [good], they are bought and sold in [markets_with_icon|e], and their price depends on [supply_with_icon|e] and [demand_with_icon|e]. Unlike any other [good], it represents actual [pops_with_icon|e], who are moved along whenever the [good] is traded.\n\nAs a [pop_type_with_icon|e], @slaves! [ShowPopTypeName('slaves')] can be used as workforce in [rgo_with_icon|e] and Slave [buildings_with_icon|e], such as the [ShowBuildingTypeName('sugar_plantation')].\n\n[buildings] like the [ShowBuildingTypeName('slave_market')] can transform existing @slaves! [ShowPopTypeName('slaves')] into @slaves_goods! [ShowGoodsName('slaves_goods')] [goods], which are in turn sold in the [market]. The [good] is then traded away like any other [good], and [buildings] can demand it as input. When that happens, @slaves! [ShowPopTypeName('slaves')] will be moved to the [location] to work in the [building]." #NEW
# hint_slaves_hint_text_2: "#T Azioni Raccomandate:#! \n@arrow_bonus_tier_3! Quando stabilite [colonies_with_icon|e] in un altro [continent|e], potete [trade_with_icon|e] Schiavi nei vostri [markets] coloniali per farli lavorare nelle vostre piantagioni.\n@arrow_bonus_tier_2! Potete costruire [buildings] [ShowBuildingTypeName('slave_center')] in [locations] straniere all'interno del vostro [trade_range_with_icon|e] per assicurare una fornitura costante di Schiavi da scambiare." #OLD
 hint_slaves_hint_text_2: "#T Recommended Actions:#! \n@arrow_bonus_tier_3! When establishing [colonies_with_icon|e] in another [continent_with_icon|e], you can [trade_with_icon|e] Slaves into your colonial [markets] to work in your plantations.\n@arrow_bonus_tier_2! You can build [ShowBuildingTypeName('slave_center')] [buildings] in foreign [locations] within your [trade_range_with_icon|e] to ensure a steady supply of Slaves to trade away." #NEW
# hint_slaves_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n@hint! I [pops|e] sono solitamente ridotti in schiavitù da [buildings] come il [ShowBuildingTypeName('slave_market')], anche se alcuni [countries] hanno meccaniche speciali che consentono la riduzione in schiavitù dei [pops] durante la [war_with_icon|e].\n@hint! [ShowReligionGroupName('christian')] consente Schiavi solo negli [buildings] Piantagione, che sono sbloccati nell'#V Età della Scoperta#! e possono essere costruiti solo oltreoceano." #OLD
 hint_slaves_hint_text_3: "#T Extra Hints:#!\n@hint! [pops_with_icon|e] are usually enslaved by [buildings] like the [ShowBuildingTypeName('slave_market')], although some [countries] have special mechanics that allow the enslavement of [pops] during [war_with_icon|e].\n@hint! [ShowReligionGroupName('christian')] only allows Slaves in Plantation [buildings], which are unlocked in the #V Age of Discovery#! and can only be built overseas." #NEW
 
 hint_slaves_diplomatic: "\"Tutti gli uomini sono creati uguali, eccetto alcuni.\""
 hint_slaves_administrative: "\"Nulla di notevole è mai stato raggiunto senza il sacrificio di molti.\""
 hint_slaves_military: "\"Se la manodopera libera scarseggia, i pagani possono provvedere.\""

#### ECO tutorial
hint_eco: "Consigli Economici Avanzati"
hint_eco_hint_text: "$hint_eco_hint_text_1$\n\n$hint_eco_hint_text_2$\n\n$hint_eco_hint_text_3$"
hint_eco_hint_text_1: "Anche se potete automatizzare molti aspetti della vostra economia, ci sono ancora alcune azioni che dovete eseguire direttamente per far progredire il vostro [country]."
#hint_eco_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Il miglior consiglio è sempre quello di cercare di ridurre le vostre [expenses_with_icon|e].\n\n@arrow_bonus_tier_3! Come giocatore, dovreste concentrarvi sulla pianificazione delle [towns_and_cities_with_icon|e] e delle [roads_with_icon|e]\n     Poiché le [towns_and_cities_with_icon|e] riducono la quantità di [rgo_with_icon|e] che potete costruire, dovreste urbanizzare le vostre [rural_locations] meno preziose. Queste di solito sono:\n@sand![ShowGoodsName('sand')] @clay![ShowGoodsName('clay')] @horses![ShowGoodsName('horses')] @medicaments![ShowGoodsName('medicaments')] @wine![ShowGoodsName('wine')] @olives![ShowGoodsName('olives')] @millet![ShowGoodsName('millet')] @legumes![ShowGoodsName('legumes')] @fruit![ShowGoodsName('fruit')] @wild_game![ShowGoodsName('wild_game')] @beeswax![ShowGoodsName('beeswax')] \n\n@arrow_bonus_tier_3! Rilasciate [subjects_with_icon|e] su terre con basso [control_with_icon|e], poiché propagheranno il loro $game_concept_control$.\n     [annex_with_icon|e] i vostri sudditi una volta che avrete costruito la vostra infrastruttura nell'area.\n     La velocità di [annexation_with_icon|e] è scalata in base alle dimensioni relative del $game_concept_country$ e all'[cultural_influence|e].\n\n@arrow_bonus_tier_2! Le [rgo_with_icon|e] preziose sono un ottimo investimento, specialmente se aumentate anche la vostra [merchant_capacity_with_icon|e] per [export_with_icon|e].\n@goods_gold![ShowGoodsName('goods_gold')] @silver![ShowGoodsName('silver')] @gems![ShowGoodsName('gems')] @pearls![ShowGoodsName('pearls')] @amber![ShowGoodsName('amber')] @ivory![ShowGoodsName('ivory')] @pepper![ShowGoodsName('pepper')] @saffron![ShowGoodsName('saffron')] @chili![ShowGoodsName('chili')]\n\n@arrow_bonus_tier_2! Le [trade_income_with_icon|e] si adattano al [Link('hints', 'selected_hint = hint_crown_power', '@hint! $hint_crown_power$')] ed è sempre bene aumentarlo insieme all' [Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! $hint_increasing_trade_capacity$')], che a differenza della [tax_base] non si riduce con il [control]\n\n@arrow_bonus_tier_1! Mantenete bassi i $game_concept_prices$ dei $game_concept_goods$ industriali! Aumenteranno la redditività delle $game_concept_towns_or_cities$ e renderanno gli [buildings_with_icon|e] più economici da mantenere.\n@lumber![ShowGoodsName('lumber')] @masonry![ShowGoodsName('masonry')] @glass![ShowGoodsName('glass')] @iron![ShowGoodsName('iron')] @mercury![ShowGoodsName('mercury')] @steel![ShowGoodsName('steel')]\n\n@arrow_bonus_tier_1! Gli $game_concept_buildings$ che non hanno [production_method_with_icon|e] avranno un costo di [maintenance_with_icon|e]. Fluttuerà in base al $game_concept_price$ dei $game_concept_goods$ in ingresso. Ricordate che la [demand|e] da parte dei [buildings] stimolerà anche la crescita della vostra economia!" #OLD
hint_eco_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! The best advice is always to try and reduce your [expenses_with_icon|e].\n\n@arrow_bonus_tier_3! As the player, you should concentrate on planning [towns_and_cities_with_icon|e] and [roads_with_icon|e]\n    Since [towns_and_cities_with_icon|e] reduce the amount of [rgo_with_icon|e] you can build, you want to urbanize the least valuable of your [rural_locations]. Those usually are:\n@sand! [ShowGoodsName('sand')] @clay! [ShowGoodsName('clay')] @horses! [ShowGoodsName('horses')] @medicaments! [ShowGoodsName('medicaments')] @wine! [ShowGoodsName('wine')] @olives! [ShowGoodsName('olives')] @millet! [ShowGoodsName('millet')] @legumes! [ShowGoodsName('legumes')] @fruit! [ShowGoodsName('fruit')] @wild_game! [ShowGoodsName('wild_game')] @beeswax! [ShowGoodsName('beeswax')] \n\n@arrow_bonus_tier_3! Release [subjects_with_icon|e] on lands with low [control_with_icon|e], as they will propagate their own $game_concept_control$.\n    [annex_with_icon|e] your subjects once you have built up your infrastructure in the area.\n    [annexation_with_icon|e] speed is scaled by relative $game_concept_country$ size and [cultural_influence_with_icon|e].\n\n@arrow_bonus_tier_2! Valuable [rgo_with_icon|e] are very good investment, especially if you also build up your [merchant_capacity_with_icon|e] to [export_with_icon|e] them.\n@goods_gold! [ShowGoodsName('goods_gold')] @silver! [ShowGoodsName('silver')] @gems! [ShowGoodsName('gems')] @pearls! [ShowGoodsName('pearls')] @amber! [ShowGoodsName('amber')] @ivory! [ShowGoodsName('ivory')] @pepper! [ShowGoodsName('pepper')] @saffron! [ShowGoodsName('saffron')] @chili! [ShowGoodsName('chili')]\n\n@arrow_bonus_tier_2! [trade_income_with_icon|e] scales with [Link('hints', 'selected_hint = hint_crown_power', '@hint! Crown Power')] and is always good to increase by expanding [Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! Trade Capacity')], which contrary to [tax_base] does not scale down with [control]\n\n@arrow_bonus_tier_1! Keep industrial $game_concept_goods$ $game_concept_prices$ low! They will boost the profitability of $game_concept_towns_or_cities$ and make [buildings_with_icon|e] cheaper to maintain.\n@lumber! [ShowGoodsName('lumber')] @masonry! [ShowGoodsName('masonry')] @glass! [ShowGoodsName('glass')] @iron! [ShowGoodsName('iron')] @mercury! [ShowGoodsName('mercury')] @steel! [ShowGoodsName('steel')]\n\n@arrow_bonus_tier_1! $game_concept_buildings$ that do not have [production_method_with_icon|e] will have a[maintenance_with_icon|e] cost. It will fluctuate based on the $game_concept_price$ of the input $game_concept_goods$. Remember that [demand_with_icon|e] from [buildings] will also stimulate the growth of your economy!" #NEW
hint_eco_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n[Link('hints', 'selected_hint = hint_inflation', '@hint! $hint_inflation$')]\n[Link('hints', 'selected_hint = hint_increasing_trade_capacity', '@hint! $hint_increasing_trade_capacity$')]\n[Link('hints', 'selected_hint = hint_control', '@hint! $hint_control$')]"
hint_eco_diplomatic: "\"A volte le monete offrono la leva migliore.\""
hint_eco_administrative: "\"L'oro è il sangue delle nazioni.\""
hint_eco_military: "\"Il reddito preso dagli altri è il miglior tipo di reddito.\""

#### POL tutorial
hint_pol: "Consigli Politici Avanzati"
hint_pol_hint_text: "$hint_pol_hint_text_1$\n\n$hint_pol_hint_text_2$\n\n$hint_pol_hint_text_3$"
hint_pol_hint_text_1: "Tutti i [countries_with_icon|e] iniziano con alcuni svantaggi. Assicuratevi di controllare il [Link('government', 'tabcontent = estates', '@government_panel! $lateralview_government_entry_name$')] per [privileges_with_icon|e] e [laws_with_icon|e]. Questi macro-cambiamenti possono essere estremamente utili nel lungo termine.\n\nNon abbiate paura di cambiare le cose!"
#hint_pol_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Assicuratevi che l'[tax|e] sia a una percentuale tale da garantire che l'[estate_satisfaction_equilibrium_with_icon|e] della [ShowEstateTypeName('burghers_estate')] e [ShowEstateTypeName('peasants_estate')] non scenda sotto il #W 50%#!.\n\n@arrow_bonus_tier_3! Controllate il [Link('societal_values', '', '@government_panel! Pannello Governo > Valori')] per scoprire quali [societal_values_with_icon|e] vale la pena perseguire. In generale, i più vantaggiosi sono:\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('capital_economy')]\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('centralization')]\n\n@arrow_bonus_tier_3! Esaminate le [laws_with_icon|e] per verificare cosa dovrebbe essere cambiato.\n     Il [parliament_with_icon|e] consentirà facili cambiamenti alle $game_concept_law$ e dovrebbe essere una delle priorità all'inizio del gioco\n     $game_concept_laws$ da tenere d'occhio all'inizio del gioco:\n     $BULLET_WITH_TAB$[ShowLawName('mining_law')]\n     $BULLET_WITH_TAB$[ShowLawName('precious_metal_distribution_law')]\n     $BULLET_WITH_TAB$[ShowLawName('distribution_of_power_law')]\n     $BULLET_WITH_TAB$[ShowLawName('administrative_system')]\n\n@arrow_bonus_tier_3! Esaminate i [privileges_with_icon|e] assegnati e disponibili per ogni [estate_with_icon|e]. Sono uno strumento per modificare la $game_concept_estate_satisfaction_equilibrium$ e la tendenza dei $game_concept_societal_values$.\n    Alla [ShowEstateTypeName('nobles_estate')] dovrebbero essere concessi solo i privilegi sufficienti per essere leali. Sottrarre $game_concept_estate_power$ a loro è vantaggioso nel lungo termine.\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobles_land_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobility_council')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_serfdom_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_sponsored_navy')]\n\n    Al [ShowEstateTypeName('clergy_estate')] dovrebbero essere concessi tutti i $game_concept_privilege$ positivi anche se non possono essere tassati - ogni punto della loro $game_concept_estate_satisfaction$ oltre il #W 50%#! fornisce un bonus ai [research_progress_with_icon|e]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('embellish_great_works_of_faith')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_in_administration')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_religious_state')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clerical_advisory_council')]\n\n    Alla [ShowEstateTypeName('burghers_estate')] dovrebbero essere concessi attivamente quanti più $game_concept_privileges$ positivi possibile. Sono per lo più positivi, nel frattempo aumentare il [estate_power_with_icon|e] della Borghesia abbasserà quello degli altri $game_concept_estates$. Inoltre, ogni punto di $game_concept_estate_satisfaction$ aumenterà l'[production_efficiency_with_icon|e]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_roads_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('market_fairs')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_rights')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_trade_center_sponsorship')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('commercial_advisory_council')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('control_over_the_coinage')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('guild_investments')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('land_of_commerce')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('urban_development_grants')]\n\n    I $game_concept_privileges$ dei [ShowEstateTypeName('peasants_estate')] dovrebbero fornire abbastanza $game_concept_estate_satisfaction_equilibrium$ per consentire la $game_concept_tax$ massima. È importante tenere a mente la loro tendenza verso la [ShowSocietyDirectionName('decentralization')] in quanto non è l'ideale. Tuttavia, i Contadini avranno un basso $game_concept_estate_power$ durante tutto il gioco, quindi il costo per la revoca sarà basso rispetto agli altri $game_concept_estates$\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_allowed_weapons_privilege')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_hunting')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('no_labor_sunday')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_represented_in_parliament')]\n     $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_fewer_levies')]\n\n@arrow_bonus_tier_2! Cercate [government_reforms_with_icon|e] che si adattino ai $game_concept_societal_values$ che cercate. Tenete a mente che alcuni bonus, come la [diplomatic_capacity|e], potrebbero consentire di abbassare la [diplomatic_maintenance|e].\n\n@arrow_bonus_tier_2! Alcune [cabinet_actions_with_icon|e] come [ShowCabinetActionName('stabilize_country')] o [ShowCabinetActionName('strengthen_government')] possono consentire di abbassare le spese, lasciandovi più $game_concept_income$ residuo!" #OLD
hint_pol_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Make sure that [estate_satisfaction_equilibrium_with_icon|e] is enough to [tax_with_icon|e] [ShowEstateTypeName('burghers_estate')] and [ShowEstateTypeName('peasants_estate')] at max level without it going below #W 50%#!.\n\n@arrow_bonus_tier_3! Check [Link('societal_values', '', '@government_panel! Government Panel > Values')] to find out what [societal_values_with_icon|e] are worth pursuing. In general most advantegous are:\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('capital_economy')]\n$BULLET_WITH_TAB$[ShowSocietyDirectionName('centralization')]\n\n@arrow_bonus_tier_3! Go through [laws_with_icon|e] to check what should be changed.\n    [parliament_with_icon|e] will allow for easy $game_concept_law$ changes and should be one of priorities early game\n    $game_concept_laws$ to watch out for at game start:\n    $BULLET_WITH_TAB$[ShowLawName('mining_law')]\n    $BULLET_WITH_TAB$[ShowLawName('precious_metal_distribution_law')]\n    $BULLET_WITH_TAB$[ShowLawName('distribution_of_power_law')]\n    $BULLET_WITH_TAB$[ShowLawName('administrative_system')]\n\n@arrow_bonus_tier_3! Go through assigned and available [privileges_with_icon|e] for every [estate_with_icon|e]. They are a tool to modify $game_concept_estate_satisfaction_equilibrium$ and $game_concept_societal_values$ drift.\n   [ShowEstateTypeName('nobles_estate')] should be given only enough to be loyal. Taking away $game_concept_estate_power$ from them is beneficial in the long term.\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobles_land_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('nobility_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_serfdom_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('noble_sponsored_navy')]\n\n   [ShowEstateTypeName('clergy_estate')] should be given every positive $game_concept_privilege$ even if they cannot be taxed - each point of their $game_concept_estate_satisfaction$ beyond #W 50%#! provides bonus to [research_progress_with_icon|e]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('embellish_great_works_of_faith')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_in_administration')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clergy_religious_state')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('clerical_advisory_council')]\n\n   [ShowEstateTypeName('burghers_estate')] should be actively given as much positive $game_concept_privileges$ as possible. They are mostly positive, meanwhile increasing burghers [estate_power_with_icon|e] will lower it for other $game_concept_estates$. Furthermore each point of $game_concept_estate_satisfaction$ will raise [production_efficiency_with_icon|e]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_roads_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('market_fairs')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('building_rights')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_trade_center_sponsorship')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('commercial_advisory_council')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('control_over_the_coinage')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('guild_investments')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('land_of_commerce')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('urban_development_grants')]\n\n   [ShowEstateTypeName('peasants_estate')] $game_concept_privileges$ should give enough $game_concept_estate_satisfaction_equilibrium$ to allow for maximum $game_concept_tax$. It is important to keep in mind their drift towards [ShowSocietyDirectionName('decentralization')] as it is not ideal. Nevertheless Commoners will have low $game_concept_estate_power$ throughout the game, so cost for revocation will be low compared to other $game_concept_estates$\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_allowed_weapons_privilege')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('allow_hunting')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('no_labor_sunday')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_represented_in_parliament')]\n    $BULLET_WITH_TAB$[ShowEstatePrivilegeName('peasants_fewer_levies')]\n\n@arrow_bonus_tier_2! Look for [government_reforms_with_icon|e] that would fit the $game_concept_societal_values$ you seek. Keep in mind that some bonuses, like [diplomatic_capacity_with_icon|e], could allow to lower [diplomatic_maintenance_with_icon|e].\n\n@arrow_bonus_tier_2! Some [cabinet_actions_with_icon|e] like [ShowCabinetActionName('stabilize_country')] or [ShowCabinetActionName('strengthen_government')] can allow lowering expenses, leaving you with more $game_concept_income$ leftover!" #NEW
hint_pol_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n[Link('hints', 'selected_hint = hint_crown_power', '@hint! $hint_crown_power$')]\n[Link('hints', 'selected_hint = hint_estates', '@hint! $hint_estates$')]"
hint_pol_diplomatic: "\"Un sovrano astuto può trarre il massimo vantaggio da ogni imprevisto.\""
hint_pol_administrative: "\"Politiche prospere significano affari prosperi.\""
hint_pol_military: "\"I nostri Ceti sono spesso peggio dei nostri nemici.\""

#### MIL tutorial
hint_mil: "Consigli Avanzati sull'Espansione"
hint_mil_hint_text: "$hint_mil_hint_text_1$\n\n$hint_mil_hint_text_2$\n\n$hint_mil_hint_text_3$"
#hint_mil_hint_text_1: "Due consigli generali: gli [armies_with_icon|e] professionali (compresi i [mercenaries|e]) batteranno sempre [levies_with_icon|e] di dimensioni simili e il modo migliore per far crescere il vostro $game_concept_army$ è far crescere l'economia." #OLD
hint_mil_hint_text_1: "Two general advices: professional [armies_with_icon|e] (including [mercenaries_with_icon|e]) will always beat similarly sized [levies_with_icon|e], and the best way to grow your $game_concept_army$ is to grow the economy." #NEW
#hint_mil_hint_text_2: "#T Azioni Raccomandate:#!\n@arrow_bonus_tier_3! Ottenete l'[institution|e] [ShowInstitutionName('professional_armies')] il prima possibile: ottenere rapidamente [ShowAdvanceName('armory_advance')] vi permetterà di vincere [wars_with_icon|e] precedentemente impossibili.\n\n@arrow_bonus_tier_3! Il [war_score_with_icon|e] dalle [battles|e] diminuisce con le [ages|e]. All'inizio è fino al #W 50%#!, rendendo facile vincere $game_concept_wars$ solo con le $game_concept_battles$!\n\n@arrow_bonus_tier_3! Assicuratevi di avere accesso a [goods_with_icon|e] strategici. Non sono necessari in grandi quantità, ma sono indispensabili per costruire il vostro [army|e] e la vostra [navy|e]: @tin![ShowGoodsName('tin')] @lead![ShowGoodsName('lead')] @copper![ShowGoodsName('copper')]\n\n@arrow_bonus_tier_3! Gli $game_concept_armies$ si possono [reinforce_with_icon|e] solo in territorio alleato.\n\n@arrow_bonus_tier_3! La [ShowUnitCategoryName('army_infantry')] è la principale linea di [battle|e]. È economica ed efficace nell'assorbire i [damage_taken|e], mentre l'[ShowUnitCategoryName('army_artillery')] causa ingenti danni alla prima linea - è importante che la prima linea sopravviva alla [bombard_phase_with_icon|e] \n\n@arrow_bonus_tier_2! Tracciare una chiara linea logistica per i vostri $game_concept_armies$ in territorio [enemy_with_icon|e] è cruciale. Se la vostra linea viene tagliata, l'intero $game_concept_army$ potrebbe scomparire a causa di [attrition|e]. Potete usare le unità [ShowUnitCategoryName('army_auxiliary')] per trasportare [food|e] al fronte, o posizionare [supply_depots|e] per aiutare con la logistica.\n\n@arrow_bonus_tier_1! Gli [buildings|e] per [manpower_with_icon|e] hanno il costo di [maintenance_with_icon|e] più alto nel gioco, quindi è meglio costruirli in [locations|e] con [control] elevato.\n\n@arrow_bonus_tier_1! Le $game_concept_battles$ durano tipicamente solo pochi giorni, quindi prima di spingervi lontano assicuratevi di potervi sempre $game_concept_reinforce$ in tempo." #OLD
hint_mil_hint_text_2: "#T Recommended Actions:#!\n@arrow_bonus_tier_3! Get the [ShowInstitutionName('professional_armies')] [institution|e] as soon as possible: getting [ShowAdvanceName('armory_advance')] quickly will allow to win previously impossible [wars_with_icon|e].\n\n@arrow_bonus_tier_3! [war_score_with_icon|e] from [battles_with_icon|e] scales down with [ages_with_icon|e]. At the beginning it is up to #W 50%#! making it easy to win [wars_with_icon|e] with $game_concept_battles$ alone!\n\n@arrow_bonus_tier_3! Make sure to have access to strategic [goods_with_icon|e]. They are not needed in big amounts, but they are necessary to build up your [army_with_icon|e] and [navy_with_icon|e]: @tin! [ShowGoodsName('tin')] @lead! [ShowGoodsName('lead')] @copper! [ShowGoodsName('copper')]\n\n@arrow_bonus_tier_3! $game_concept_armies$ only [reinforce_with_icon|e] in ally territory.\n\n@arrow_bonus_tier_3! [ShowUnitCategoryName('army_heavy_infantry')] is the main [battle_with_icon|e] line. It is cheap and effective at absorbing [damage_taken|e], meanwhile [ShowUnitCategoryName('army_artillery')] cause vast damage to the frontline -  it is important that the frontline survives [bombard_phase_with_icon|e]\n\n@arrow_bonus_tier_2! Tracing a clear logistic line for your $game_concept_armies$ in [enemy_with_icon|e] territory is crucial. If your line gets cut the whole $game_concept_army$ could disappear due to [attrition|e]. You can use [ShowUnitCategoryName('army_auxiliary')] units to transport [food_with_icon|e] to the frontline, or place [supply_depots_with_icon|e] to help with logistics.\n\n@arrow_bonus_tier_1! [manpower_with_icon|e] [buildings|e] have the highest [maintenance_with_icon|e] cost in the game, so it is best to build those in [locations_with_icon|e] with high [control_with_icon|e].\n\n@arrow_bonus_tier_1! $game_concept_battles$ tipically last only a few days, so before pushing far be sure you can always $game_concept_reinforce$ in time." #NEW
hint_mil_hint_text_3: "#T Suggerimenti Aggiuntivi:#!\n[Link('hints', 'selected_hint = hint_manpower', '@hint! $hint_manpower$')]\n[Link('hints', 'selected_hint = hint_sailors', '@hint! $hint_sailors$')]\n[Link('hints', 'selected_hint = hint_war', '@hint! $hint_war$')]\n[Link('hints', 'selected_hint = hint_battle', '@hint! $hint_battle$')]\n[Link('hints', 'selected_hint = hint_siege_and_occupation', '@hint! $hint_siege_and_occupation$')]"
hint_mil_diplomatic: "\"Fate in modo che altri Paesi vincano le vostre guerre.\""
hint_mil_administrative: "\"Il logoramento potrebbe portare alla decimazione di qualsiasi esercito.\""
hint_mil_military: "\"Non portate un coltello a una sparatoria.\""

#### ECO tutorial
hint_holland: "Consigli Iniziali per l'Olanda"
#hint_holland_hint_text: "Le [locations] altamente urbanizzate dei Paesi Bassi rendono il [Player.GetLongName] un candidato ideale per diventare una potenza commerciale nel Nord Europa.\n\n@hint! #T Costruite edifici [ShowBuildingTypeName('marketplace')] in ogni [ShowLocationRankName('town')]#!\nL'Automazione Commerciale utilizzerà la loro [merchant_capacity_with_icon|e] per [import_with_icon|e] le [raw_materials_with_icon|e] che il [market_icon][Player.GetCapital.GetMarket.GetName] manca, oltre che per [export_with_icon|e] l'eccedenza di [produced_goods_with_icon|e] dalle nostre Città.\n\n@hint! #T Espandete l'industria tessile#!\nC'è molto profitto da ricavare dall'esportazione di [ShowGoodsName('fine_cloth')]. Costruite gli edifici [ShowBuildingTypeName('cloth_guild')] e [ShowBuildingTypeName('fine_cloth_guild')] e considerate di importare [ShowGoodsName('wool')] dal Mercato di [ShowLocationName('london')] se necessario.\n\n@hint! #T Aumentate il nostro [crown_power]#!\nIl [trade_income_with_icon|e] è diviso tra il [ShowEstateTypeName('crown_estate')] e i [estates_with_icon|e] in base al loro potere relativo. Mantenere alto il nostro [crown_power_with_icon|e] assicurerà un flusso costante di [trade_income] nel [treasury|e]. Potete saperne di più sul [crown_power] nel Suggerimento [Link('hints', 'selected_hint = hint_crown_power', '$hint_crown_power$')].\n\n@hint! #T Prestate attenzione alla fornitura di [food]#!\nLe [urban_locations|e] producono meno [food_with_icon|e] delle [rural_locations|e]. Tenete d'occhio la [food_stockpile_with_icon|e] del [Player.GetCapital.GetMarket.GetName] ed espandete le nostre [rgo_with_icon|e] di [ShowGoodsName('fish')] e [ShowGoodsName('livestock')] se necessario. Il nostro [budget] soffrirà se il [food] diventa troppo costoso.\n\n@hint! #T Placate i nostri vicini#!\nPotremmo essere ricchi, ma le nostre modeste dimensioni ci rendono vulnerabili all'aggressione straniera. Usate l'azione diplomatica [diplomatic_action_with_icon|e] $IMPROVE_RELATIONTITLE$ (Migliora Relazioni) con i nostri vicini più minacciosi, in particolare [GetCountry('FRA').GetName] e [GetCountry('ENG').GetName]." #OLD
hint_holland_hint_text: "The highly urbanized [locations] of the Low Countries make the [Player.GetLongName] a prime candidate to become a commercial powerhouse in Northern Europe.\n\n@hint! #T Build [ShowBuildingTypeName('marketplace')] buildings in every [ShowLocationRankName('town')]#!\nThe Trade Automation will use their [merchant_capacity_with_icon|e] to [import_with_icon|e] the [raw_materials_with_icon|e] that the [market_icon][Player.GetCapital.GetMarket.GetName] lacks, as well as to [export_with_icon|e] the surplus of [produced_goods_with_icon|e] from our Towns.\n\n@hint! #T Expand the textile industry#!\nThere is much profit to be made from exporting [ShowGoodsName('fine_cloth')]. Build the [ShowBuildingTypeName('cloth_guild')] and [ShowBuildingTypeName('fine_cloth_guild')] buildings, and consider importing [ShowGoodsName('wool')] from the [ShowLocationName('london')] Market if need be.\n\n@hint! #T Increase our [crown_power]#!\n[trade_income_with_icon|e] is divided among the [ShowEstateTypeName('crown_estate')] and the [estates_with_icon|e] according to their relative power. Keeping our [crown_power_with_icon|e] high will ensure a steady flow of [trade_income] into the [treasury_with_icon|e]. You can learn more about [crown_power] in the [Link('hints', 'selected_hint = hint_crown_power', 'Crown Power Hint')].\n\n@hint! #T Mind the [food] supply#!\n[urban_locations_with_icon|e] produce less [food_with_icon|e] than [rural_locations_with_icon|e]. Keep an eye on the [food_stockpile_with_icon|e] of the [Player.GetCapital.GetMarket.GetName], and expand our [ShowGoodsName('fish')] and [ShowGoodsName('livestock')] [rgo_with_icon|e] if necessary. Our [budget] will suffer if [food] becomes too expensive.\n\n@hint! #T Placate our neighbors#!\nWe may be rich, but our modest size renders us vulnerable to foreign aggression. Use the $IMPROVE_RELATIONTITLE$ [diplomatic_action_with_icon|e] with our most threatening neighbors, especially [GetCountry('FRA').GetName] and [GetCountry('ENG').GetName]." #NEW

hint_holland_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_holland_administrative: "$hint_advisor_salute_administrative$"
hint_holland_military: "$hint_advisor_salute_military$"


hint_hungary: "Consigli Iniziali per l'Ungheria"
#hint_hungary_hint_text: "Il [Player.GetLongName] inizia in una posizione privilegiata come una delle principali potenze nella [region|e]. Abbiamo un'[alliance_with_icon|e] con #W Polonia#!, #W Bosnia#! è il nostro [subject_with_icon|e] e #W Croazia#! è in un'[personal_union_with_icon|e] sotto il nostro [ruler_with_icon|e] [Player.GetGovernment.GetRuler.GetName]. Ciò significa che possiamo concentrarci sullo sviluppo del nostro [country|e] senza preoccuparci di minacce esterne... almeno per il momento.\n\n@hint! #T Costruite [roads] verso le vostre miniere#!\nCi sono ricchi giacimenti di [ShowGoodsName('goods_gold')] e [ShowGoodsName('silver')] a nord di [capital_icon] [Player.GetCapital.GetName]. Tuttavia, sono sottosviluppati e in [locations] con [control_with_icon|e] basso. Dovremmo cercare di costruire [roads_with_icon|e] da [Player.GetCapital.GetNameWithNoTooltip] a quelle preziose miniere, al fine di aumentare la nostra [proximity_with_icon|e] e quindi il nostro [control].\n\n@hint!  #T Costruite Gilde di Gioiellieri intorno alla vostra [capital]#!\nA causa dell'alta offerta, il prezzo di [ShowGoodsNameWithNoTooltip('goods_gold')] e [ShowGoodsNameWithNoTooltip('silver')] all'interno del [market_icon] [Player.GetCapital.GetMarket.GetName] è estremamente basso. Una [ShowBuildingTypeName('jewelry_guild')] utilizzerà [ShowGoodsNameWithNoTooltip('goods_gold')] e [ShowGoodsNameWithNoTooltip('silver')] per produrre [ShowGoodsName('jewelry')], un bene artigianale molto redditizio, aggiungendo ancora più valore alle nostre miniere nel processo.\n\n@hint! #T Costruite un [ShowBuildingTypeName('marketplace')] per esportare le vostre eccedenze#!\nIl [trade_with_icon|e] automatizzato [Concept('export_with_icon', 'Esporta')|e] qualsiasi eccedenza di [goods_with_icon|e], come [ShowGoodsNameWithNoTooltip('jewelry')], verso altri [markets_with_icon|e], il che creerà [trade_income_with_icon|e] e manterrà redditizia l'intera catena di produzione.\n\n@hint! #T Revocate il [ShowPolicyName('gold_export_ban')]#!\nL'Europa brama il nostro [ShowGoodsNameWithNoTooltip('goods_gold')], ed esportarlo direttamente sarebbe un'impresa molto redditizia, ma la nostra attuale [law|e] [ShowLawName('precious_metal_distribution_law')] lo proibisce. Considerate di cambiare la [policy] durante il prossimo [parliament_with_icon|e]." #OLD
hint_hungary_hint_text: "The [Player.GetLongName] starts in a privileged position as one of the main powers in the [region|e]. We have an [alliance_with_icon|e] with #W Poland#!, #W Bosnia#! is our [subject_with_icon|e], and #W Croatia#! is in a [personal_union_with_icon|e] under our [ruler_with_icon|e] [Player.GetGovernment.GetRuler.GetName]. That means we can focus on developing our [country_with_icon|e] without worrying about external threats... at least for the time being.\n\n@hint! #T Build [roads] towards your mines#!\nThere are rich deposits of [ShowGoodsName('goods_gold')] and [ShowGoodsName('silver')] to the north of [capital_icon] [Player.GetCapital.GetName]. However, they are underbuilt, and in [locations] with low [control_with_icon|e]. We should seek to build [roads_with_icon|e] from [Player.GetCapital.GetNameWithNoTooltip] to those valuable mines, in order to increase our [proximity_with_icon|e], and therefore our [control].\n\n@hint!  #T Build Jewelry Guilds around your [capital]#!\nDue to the high supply, the price of [ShowGoodsNameWithNoTooltip('goods_gold')] and [ShowGoodsNameWithNoTooltip('silver')] inside the [market_icon] [Player.GetCapital.GetMarket.GetName] is extremely low. A [ShowBuildingTypeName('jewelry_guild')] will use [ShowGoodsNameWithNoTooltip('goods_gold')] and [ShowGoodsNameWithNoTooltip('silver')] to produce [ShowGoodsName('jewelry')], a very profitable crafted good, adding even more value to our mines in the process.\n\n@hint! #T Build [ShowBuildingTypeName('marketplace')] to export your surplus#!\nThe Automated [trade_with_icon|e] will [export_with_icon|e] any surplus of [goods_with_icon|e], such as [ShowGoodsNameWithNoTooltip('jewelry')], to other [markets_with_icon|e], which will create [trade_income_with_icon|e] and keep the entire production chain profitable.\n\n@hint! #T Revoke the [ShowPolicyName('gold_export_ban')]#!\nEurope craves our [ShowGoodsNameWithNoTooltip('goods_gold')], and exporting it directly would be a very profitable endeavor, but our current [ShowLawName('precious_metal_distribution_law')] [law_with_icon|e] forbids it. Consider changing the [policy] during the next [parliament_with_icon|e].\n\n@hint! #T Install a [ShowBuildingTypeName('local_governor')]#!\nThe east of our [country] is rich, yet we hold little [control] over its resources. In the long term we should aim to build a [ShowLocationRankName('city')] there in order to place a [ShowBuildingTypeName('local_governor')]. It will act as a secondary [capital], radiating [proximity] to nearby [locations]. Keep in mind Local Governors can only be built in a [ShowLocationRankName('city')], they are expensive to maintain, and require a direct [road] connection to our [capital]." #NEW

hint_hungary_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_hungary_administrative: "$hint_advisor_salute_administrative$"
hint_hungary_military: "$hint_advisor_salute_military$"


hint_norway: "Consigli Iniziali per la Norvegia"
#hint_norway_hint_text: "Il [Player.GetLongName] è un [country|e] vasto, ma il nostro [control|e] al di fuori della nostra [capital|e] è al massimo nominale. Dovremmo espandere la nostra infrastruttura, sia marittima che terrestre, per aumentare la nostra [proximity|e] e sfruttare le risorse del nord.\n\n@hint! #T Costruite [roads] dalla nostra [capital] #!\nDovremmo mirare a costruire [roads_with_icon|e] da [capital_icon] [Player.GetCapital.GetName] verso ogni [ShowLocationRankName('town')] e [rgo_with_icon|e] preziose vicino, al fine di aumentare la nostra [proximity_with_icon|e] e [control_with_icon|e]. Le miniere di [ShowGoodsName('silver')] a ovest di [Player.GetCapital.GetNameWithNoTooltip] dovrebbero essere particolarmente redditizie, con i dovuti investimenti. Controllate spesso la Mappa di [proximity]!\n\n@hint! #T Aumentate la [maritime_presence] #!\nAprire [roads] attraverso il nostro cuore montuoso può diventare una ricerca vana e costosa. Con una buona [maritime_presence_with_icon|e] lungo la nostra costa, la [proximity] potrebbe propagarsi in modo molto più efficiente via mare. Costruite [ShowBuildingTypeName('wharf')] e [ShowBuildingTypeName('dock')] nelle nostre Città e fate pattugliare le nostre coste da flotte di [ShowUnitCategoryName('navy_light_ship')], una volta che avremo ricercato l'[advance_with_icon|e] appropriato.\n\n@hint! #T Fondate Città nei buoni porti vicino alla nostra [capital]#!\nLa [proximity] delle [locations] costiere è notevolmente migliorata dalla [natural_harbor_suitability_with_icon|e]. Controllate la Mappa $mapmode_natural_harbor_suitability_name$ (Idoneità Portuale Naturale) per cercare i nostri migliori porti naturali.\n\n@hint! #T Espandete le nostre industrie#!\nCostruite [ShowBuildingTypeName('fine_cloth_guild')], [ShowBuildingTypeName('furniture_guild')] e [ShowBuildingTypeName('scriptorium')] nelle nostre Città per processare le nostre risorse naturali e costruite [ShowBuildingTypeName('marketplace')] per [export_with_icon|e] verso altri [markets_with_icon|e].\n\n@hint! #T Rafforzate l'Unione con la Svezia #!\nLa nostra [personal_union_with_icon|e] con [GetCountry('SWE').GetName] garantisce la pace nei nostri confini. Potremmo sforzarci per una più profonda integrazione con il loro Paese emanando [laws] comuni nel Pannello [international_organization|e]." #OLD
hint_norway_hint_text: "The [Player.GetLongName] is a vast [country_with_icon|e], but our [control_with_icon|e] outside our [capital_with_icon|e] is nominal at best. We should expand our infrastructure, both maritime and landborne, to increase our [proximity_with_icon|e] and harness the resources of the north.\n\n@hint! #T Build [roads] from our [capital] #!\nWe should aim to lay [roads_with_icon|e] from [capital_icon] [Player.GetCapital.GetName] to every nearby [ShowLocationRankName('town')] and valuable [rgo_with_icon|e], in order to increase our [proximity_with_icon|e] and [control_with_icon|e]. The [ShowGoodsName('silver')] mines west of [Player.GetCapital.GetNameWithNoTooltip] should be particularly profitable, with due investment. Check the [proximity] Map Mode frequently!\n\n@hint! #T Increase [maritime_presence] #!\nCarving [roads] through our mountainous hearthland can become a vain and expensive pursuit. With good [maritime_presence_with_icon|e] along our coastline, [proximity] could propagate much more efficiently by sea. Build [ShowBuildingTypeName('wharf')] and [ShowBuildingTypeName('dock')] in our Towns, and have fleets of [ShowUnitCategoryName('navy_light_ship')] patrolling our coasts, once we have researched the appropriate [advance_with_icon|e].\n\n@hint! #T Found Towns in good harbors close to our [capital]#!\nThe [proximity] of coastal [locations] is much improved by [natural_harbor_suitability_with_icon|e]. Check the $mapmode_natural_harbor_suitability_name$ Mapmode to look for our best natural ports.\n\n@hint! #T Expand our industries#!\nBuild [ShowBuildingTypeName('fine_cloth_guild')], [ShowBuildingTypeName('furniture_guild')], and [ShowBuildingTypeName('scriptorium')] in our Towns to process our natural resources, and build [ShowBuildingTypeName('marketplace')] to [export_with_icon|e] them to other [markets_with_icon|e].\n\n@hint! #T Strengthen the Union with Sweden #!\nOur [personal_union_with_icon|e] with [GetCountry('SWE').GetName] guarantees peace in our borders. We could strive for deeper integration with their country by enacting common [laws] in the [international_organization|e] Panel." #NEW

hint_norway_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_norway_administrative: "$hint_advisor_salute_administrative$"
hint_norway_military: "$hint_advisor_salute_military$"


hint_naples: "Consigli Iniziali per Napoli"
#hint_naples_hint_text: "Come la più grande potenza nella [region|e], il [Player.GetLongName] è pronto a dominare il commercio e la politica italiani, mentre i nostri [subjects|e] in Grecia costituiscono un conveniente punto d'appoggio per l'espansione esterna.\n\n@hint! #T Costruite [roads] dalla nostra [capital] #!\nDovremmo mirare a costruire [roads_with_icon|e] da [capital_icon] [Player.GetCapital.GetName] verso ogni [ShowLocationRankName('town')] e [rgo_with_icon|e] preziose vicino, al fine di aumentare la nostra [proximity_with_icon|e] e quindi il nostro [control_with_icon|e].\n\n@hint! #T Espandete la nostra estrazione di [raw_materials]#!\nIl nostro [country] contiene in abbondanza [raw_materials_with_icon|e] preziose. [ShowGoodsName('wool')], [ShowGoodsName('fiber_crops')] e [ShowGoodsName('silk')] non sono solo molto preziose di per sé, ma possono anche essere utilizzate dalle nostre industrie tessili nelle [urban_locations|e]. Espandete queste [rgo_with_icon|e] il prima possibile e date la priorità all'aumento del [control] lì.\n\n@hint! #T Sviluppate l'industria tessile #!\nCostruite [buildings] [ShowBuildingTypeName('cloth_guild')] e [ShowBuildingTypeName('fine_cloth_guild')] nelle nostre [urban_locations]. Useranno le nostre [raw_materials] per produrre [produced_goods_with_icon|e] costosi, mentre la maggiore domanda renderà le nostre [rgo] ancora più redditizie.\n\n@hint! #T Costruite un [ShowBuildingTypeName('marketplace')] per esportare le nostre eccedenze#!\nIl [trade_with_icon|e] automatizzato [export_with_icon|e] qualsiasi eccedenza di [goods|e], come [ShowGoodsNameWithNoTooltip('fine_cloth')], verso altri [markets_with_icon|e], il che creerà [trade_income_with_icon|e] e manterrà redditizia l'intera catena di produzione." #OLD
hint_naples_hint_text: "As the biggest power in the [region_with_icon|e], the [Player.GetLongName] is poised to dominate Italian trade and politics, while our [subjects_with_icon|e] in Greece constitute a convenient foothold for external expansion.\n\n@hint! #T Build [roads] from our [capital] #!\nWe should aim to lay [roads_with_icon|e] from [capital_icon] [Player.GetCapital.GetName] to every nearby [ShowLocationRankName('town')] and valuable [rgo_with_icon|e], in order to increase our [proximity_with_icon|e], and therefore our [control_with_icon|e].\n\n@hint! #T Expand our extraction of [raw_materials]#!\nOur [country] contains valuable [raw_materials_with_icon|e] in abundance. [ShowGoodsName('wool')], [ShowGoodsName('fiber_crops')], and [ShowGoodsName('silk')] are not only very valuable by themselves, but they can also be used by our textile industries in [urban_locations_with_icon|e]. Expand those [rgo_with_icon|e] as soon as possible, and prioritize increasing [control] there.\n\n@hint! #T Develop the textile industry #!\nBuild [ShowBuildingTypeName('cloth_guild')] and [ShowBuildingTypeName('fine_cloth_guild')] [buildings] in our [urban_locations]. They will use our [raw_materials] to produce expensive [produced_goods_with_icon|e], while the added demand will make our [rgo] even more profitable.\n\n@hint! #T Build [ShowBuildingTypeName('marketplace')] to export our surplus#!\nThe Automated [trade_with_icon|e] will [export_with_icon|e] any surplus of [goods_with_icon|e], such as [ShowGoodsNameWithNoTooltip('fine_cloth')], to other [markets_with_icon|e], which will create [trade_income_with_icon|e] and keep the entire production chain profitable." #NEW

hint_naples_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_naples_administrative: "$hint_advisor_salute_administrative$"
hint_naples_military: "$hint_advisor_salute_military$"


hint_castile: "Consigli Iniziali per la Castiglia"
#hint_castile_hint_text: "Come potenza dominante della [region|e], il [Player.GetLongName] si trova in una posizione privilegiata per unificare l'Iberia sotto un unico trono. Tuttavia, la nostra amministrazione è già in difficoltà e il nostro [control] nel sud è così basso da contribuire a malapena al nostro [budget|e]. Sarebbe saggio consolidare il nostro [control] sul nostro attuale territorio prima di imbarcarci in ulteriori conquiste.\n\n@hint! #T Costruite [roads] dalla nostra [capital] #!\nLe [locations] senza [control_with_icon|e] sono praticamente inutili per la nostra amministrazione. Costruite [roads_with_icon|e] e [buildings] [ShowBuildingTypeName('bridge_infrastructure')] dalla nostra [capital_with_icon|e] al fine di aumentare la nostra [proximity_with_icon|e] e quindi il nostro [control]. Controllate spesso la Mappa di [proximity]!\n\n@hint! #T Soggiogate [GetCountry('GRA').GetName]#!\nAnche se non siamo nella posizione di [own|e] la loro terra in modo molto efficace, potremmo rendere [GetCountry('GRA').GetName] il nostro [subject_with_icon|e]. Governerebbero la terra per nostro conto e pagherebbero un tributo mensile al nostro [treasury]. Possiamo considerare di [annexing_with_icon|e] una volta che la nostra infrastruttura e tecnologia si saranno sviluppate abbastanza da consentire di possedere la terra direttamente. Per [annex] un [subject] dovremo aver governato su di loro per più di #Y 10#! anni e godere di buone relazioni con loro.\n\n@hint! #T Plus Ultra#!\nGli [explorers_with_icon|e] parlano di ricchezze oltre misura dalle loro spedizioni in India. Tuttavia, imbarcarSi in tali imprese senza i [advances_with_icon|e] più moderni potrebbe rivelarsi un'impresa follemente costosa." #OLD
hint_castile_hint_text: "As the dominant power of the [region_with_icon|e], the [Player.GetLongName] stands on privileged grounds for unifying Iberia under one throne. However, our administration is already stretched thin, and our [control] in the south is so low it barely contributes to our [budget_with_icon|e]. It would be wise to consolidate our [control] over our current territory before we embark on futher conquests.\n\n@hint! #T Build [roads] from our [capital] #!\n[locations] without [control_with_icon|e] are virtually useless to our administration. Build [roads_with_icon|e] and [ShowBuildingTypeName('bridge_infrastructure')] [buildings] from our [capital_with_icon|e] in order to increase our [proximity_with_icon|e], and therefore our [control]. Check the [proximity] Map Mode frequently!\n\n@hint! #T Install a [ShowBuildingTypeName('local_governor')]#!\nThe south of our [country] is rich and urbanized, yet we hold little [control] over its population. Consider building a [ShowBuildingTypeName('local_governor')] in [ShowLocationName('sevilla')]. It will act as a secondary [capital], radiating [proximity] to nearby [locations]. Keep in mind Local Governors can only be built in a [ShowLocationRankName('city')], they are expensive to maintain, and require a direct [road] connection to our [capital].\n\n@hint! #T Subjugate [GetCountry('GRA').GetName]#!\nEven if we are not in a position to [own_with_icon|e] their land very effectively, we could make [GetCountry('GRA').GetName] our [subject_with_icon|e]. They would rule the land on our behalf and pay monthly tribute into our [treasury]. We can consider [annexing_with_icon|e] them once our infrastructure and technology have develop enough to allow owning the land directly. In order to [annex] a [subject] we will need to have ruled over them for more than #Y 10#! years, and enjoy good relations with them.\n\n@hint! #T Plus Ultra#!\n[explorers_with_icon|e] bring tales of wealth beyond measure from their expeditions to India. However, embarking in such enterprises without the most modern [advances_with_icon|e] may prove a ludicrously expensive endeavor." #NEW

hint_castile_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_castile_administrative: "$hint_advisor_salute_administrative$"
hint_castile_military: "$hint_advisor_salute_military$"


hint_ottomans: "Consigli Iniziali per gli Ottomani"
#hint_ottomans_hint_text: "L'imminente Ascesa dei Turchi [situation|e] offrirà un'opportunità unica per una rapida espansione in Grecia e Anatolia. Usate le [actions|e] della Situazione per ottenere un [casus_belli_with_icon|e] sui nostri vicini e scatenate la nostra potenza su di loro.\n\n@hint! #T Integrate le nostre conquiste #!\nLe [locations] appena [conquered_with_icon|e] devono essere [integrated_with_icon|e] nella nostra amministrazione tramite il [cabinet_with_icon|e] prima di poter raccogliere qualsiasi frutto dalle nostre conquiste.\n\n@hint! #T Costruite [roads] dalla nostra [capital] #!\nLe [locations] senza [control_with_icon|e] sono praticamente inutili per la nostra amministrazione. Costruite [roads_with_icon|e] dalla nostra [capital_with_icon|e] al fine di aumentare la nostra [proximity_with_icon|e] e quindi il nostro [control]. Controllate spesso la Mappa di [proximity]!\n\n@hint! #T Create [subjects] per governare la terra conquistata#!\nMan mano che vi espandete, arriverete a conquistare territori che si trovano ben oltre la portata della nostra [proximity]. vi consigliamo di creare [subjects_with_icon|e] per governare la terra per nostro conto finché non potrete permettervi di amministrarla direttamente.\n\n@hint! #T Annettete i nostri [subjects] man mano che la [proximity] migliora #!\nMan mano che sviluppiamo la nostra infrastruttura e aumentiamo la nostra [proximity], le terre che un tempo erano sterili per noi diventano degne di essere possedute direttamente. Per [annex_with_icon|e] un [subject] dovremo aver governato su di loro per più di #Y 10#! anni e godere di buone relazioni con loro.\n\n@hint! #T Aumentate la [maritime_presence] #!\nIl terreno accidentato della Grecia e dell'Anatolia rende difficile proiettare la [proximity] via terra. Con una buona [maritime_presence_with_icon|e] lungo la nostra costa, la [proximity] potrebbe propagarsi in modo molto più efficiente via mare. Costruite [ShowBuildingTypeName('wharf')] e [ShowBuildingTypeName('dock')] nelle nostre Città e fate pattugliare le nostre coste dalle [navies_with_icon|e]. Ciò sarebbe particolarmente importante se dovessimo spostare la nostra [capital] a [ShowLocationName('constantinople')]..." #OLD
hint_ottomans_hint_text: "The impending Rise of the Turks [situation_with_icon|e] will offer a unique opportunity for rapid expansion into Greece and Anatolia. Use the Situation [actions_with_icon|e] to get a [casus_belli_with_icon|e] on our neighbors, and unleash our might upon them.\n\n@hint! #T Integrate our conquests #!\nNewly [conquered_with_icon|e] [locations] need to be [integrated_with_icon|e] into our administration via the [cabinet_with_icon|e] before we can reap any fruit from our conquests.\n\n@hint! #T Build [roads] from our [capital] #!\n[locations] without [control_with_icon|e] are virtually useless to our administration. Lay [roads_with_icon|e] from our [capital_with_icon|e] in order to increase our [proximity_with_icon|e], and therefore our [control]. Check the [proximity] Map Mode frequently!\n\n@hint! #T Create [subjects] to rule the conquered land#!\nAs you expand, you will come to conquer territories that lie far beyond the reach of our [proximity]. You are adviced to create [subjects_with_icon|e] to rule the land on our behalf until you can afford to administer it directly.\n\n@hint! #T Annex our [subjects] as [proximity] improves #!\nAs we develop our infrastructure and grow our [proximity], lands that were once barren to us become worth owning directly. In order to [annex_with_icon|e] a [subject] we will need to have ruled over them for more than #Y 10#! years, and enjoy good relations with them.\n\n@hint! #T Increase [maritime_presence] #!\nThe rough terrain of Greece and Anatolia makes projecting [proximity] by land difficult. With good [maritime_presence_with_icon|e] along our coastline, [proximity] could propagate much more efficiently by sea. Build [ShowBuildingTypeName('wharf')] and [ShowBuildingTypeName('dock')] in our Towns, and have [navies_with_icon|e] patrolling our coasts. This would be particularly important if we were to move our [capital] to [ShowLocationName('constantinople')]...\n\n@hint! #T Install a [ShowBuildingTypeName('local_governor')]#!\nIf we plan on directly ruling direclty lands that are distant from our [capital], we should consider placing a a [ShowBuildingTypeName('local_governor')]. It will act as a secondary [capital], radiating [proximity] to nearby [locations]. Keep in mind Local Governors can only be built in a [ShowLocationRankName('city')], they are expensive to maintain, and require a direct [road] connection to our [capital]." #NEW

hint_ottomans_diplomatic: "$hint_advisor_salute_diplomatic$"
hint_ottomans_administrative: "$hint_advisor_salute_administrative$"
hint_ottomans_military: "$hint_advisor_salute_military$"
hint_hre: "Advice for the Holy Roman Empire" #NEW
hint_hre_hint_text: "$hint_hre_hint_text_1$\n\n$hint_hre_hint_text_2$\n\n$hint_hre_hint_text_3$\n\n$hint_hre_hint_text_4$\n\n$hint_hre_hint_text_5$\n\n$hint_hre_hint_text_6$" #NEW
hint_hre_hint_text_1: "The [GetInternationalOrganizationType('hre').GetName] is a large [international_organization_with_icon|e] in Central Europe. Membership within the [international_organization] will impact the gameplay experience for any country." #NEW
hint_hre_hint_text_2: "[hre_emperor_icon] #T The Emperor:#!\nThe [GetInternationalOrganization('hre').GetNameWithNoTooltip] is led by the [hre_emperor_with_icon|e]. It is the duty of the [ShowSpecialStatusNameWithNoTooltip('emperor')] to protect the members of the Empire from foreign threats, maintain internal peace and stability, and ensure religious unity within the Empire.\n@arrow_bonus_tier_3!The [ShowSpecialStatusNameWithNoTooltip('emperor')] can use #Y $imperial_authority$#! to propose [policies_with_icon|e] and [parliament_issues_with_icon|e].\n@arrow_bonus_tier_2! Use the various [diplomatic_actions_with_icon|e] to guide the other members towards a favorable political situation within the Empire.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_landfriede')] - Force a [white_peace|e] upon a member.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('enforce_religious_unity')] - Force the Imperial Religion upon a member.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('demand_unlawful_territory')] - Request the return of a conquered [location|e] to its previous owner. If this is declined a [casus_belli|e] will be granted to enforce it.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('ask_to_vote_for_me_as_emperor')] - For the Cost of [favors|e] you can request a [country] to vote for you as emperor. This will persist until the next election takes place.\n@arrow_bonus_tier_1! [ShowCountryInteractionName('bolster_imperial_army')] - Request a [country] to join one of your wars. They will receive a payment from the imperial treasury.\n@arrow_bonus_tier_1! Bestow a [special_status|e] - Every [special_status], excluding [ShowSpecialStatusName('imperial_peasant_republic')] can be granted to a member of the Empire.\n@arrow_bonus_tier_1!Rescind a [special_status|e] - Every [special_status], excluding [ShowSpecialStatusName('imperial_peasant_republic')] can be granted to a member of the Empire." #NEW
hint_hre_hint_text_3: "[elector_icon] #T The Electors:#!\nThe [hre_electoral_college_with_icon|e] consist of the [ShowSpecialStatusNamePlural('elector')] and [ShowSpecialStatusNamePlural('archbishop_elector')]. Their vote will determine the next [ShowSpecialStatusName('emperor')], when the [ruler] of the current leader [country] dies.\n@arrow_bonus_tier_1! The Election can only be successful if at least 50% of the current Electors vote for the same [country]. If no majority is achieved, the Empire will enter a Power Struggle.\n$BULLET_WITH_TAB$ The Power Struggle is a period without an elected [ShowSpecialStatusName('emperor')], where the Privileges and Duties of the Emperor can not be executed by any [country]. The [hre_electoral_college] will try to resolve the Power Struggle by consolidating their votes. After 10 Years the Power Struggle will be forced to an end, and the [country] with the highest [great_power_score_with_icon|e] will be become [ShowSpecialStatusName('emperor')]." #NEW
hint_hre_hint_text_4: "[hre_law_level_icon] #T The Imperial Laws:#!\nThe Imperial Constitution determines the rules the Empire and its members will follow. Taxation of members in [gold|e] and [manpower|e], the amount of Electors, and the unification of the Empire will be dictated by what [policies] are currently active.\n@arrow_bonus_tier_3! The Empire starts without the [policy] [ShowPolicyName('golden_bull_policy')]. Before any other [policy] can be implemented, the [policy] [ShowPolicyName('golden_bull_policy')] will have to be proposed and passed.\n@arrow_bonus_tier_3! Once the [policy] [ShowPolicyName('golden_bull_policy')] is enacted, the Empire is set to the basic policies in all categories. Then it is the privilege of the [ShowSpecialStatusName('emperor')] to choose any [policy] to be voted on in the Imperial Diet, if the [ShowSpecialStatusName('emperor')] is able to pay the #Y $imperial_authority$#! to change the [policy].\n@arrow_bonus_tier_2! Any [policy] marked with 'Emperor Comfort Policy' will move the Empire closer to unification into one [country] under the [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! Unification is not the only End Goal for the Empire. Many [policies] can benefit the [ShowSpecialStatusName('emperor')], or specific members of the Empire, without moving towards unification." #NEW
hint_hre_hint_text_5: "[parliament_icon] #T The Imperial Diet:#!\n The Imperial Diet will activate on two occasions:\n$TAB$@arrow_bonus_tier_1! When the [ShowSpecialStatusName('emperor')] proposes a new [policy].\n$TAB$@arrow_bonus_tier_1! When the [ShowSpecialStatusName('emperor')] proposes a [parliament_issue] affecting all members of the Empire.\n@arrow_bonus_tier_3! When the Imperial Diet is in session, every member can vote on the current Issue. The Strength of the vote for each individual [country] is determined by the [special_status_power] of their [special_status]. To increase your voting power, you can request a new [special_status] from the [ShowSpecialStatusName('emperor')].\n$BULLET_WITH_TAB$In general [countries] with the [special_status] of the [hre_electoral_college] will have the highest [special_status_power], followed by [countries] of the [ShowCountryRankName('rank_kingdom')] [country_rank] without a seat in the [hre_electoral_college].\n$BULLET_WITH_TAB$The [special_status_power] is also determined by specific [policies] within the Empire.\n@arrow_bonus_tier_2! The [ShowSpecialStatusName('emperor')] may use the [parliament_agendas] to sway countries of a specific [special_status] to their side.\n@arrow_bonus_tier_2! The [ShowSpecialStatusName('emperor')] may use the [ShowCountryInteractionName('bribe_voter_for_policy')] [diplomatic_action] to bribe any voter." #NEW
hint_hre_hint_text_6: "[hre_icon] #T The Members:#!\nEvery [country] in the [international_organization] is considered a member, if they are currently not the [ShowSpecialStatusName('emperor')]. However, their significance within the Empire is determined by their [special_status_power].\n@arrow_bonus_tier_3! Request a [special_status] from the [ShowSpecialStatusName('emperor')] - Every Member can request a [special_status], as long as they fullfil the conditions for the status.\n@arrow_bonus_tier_3! [ShowCountryInteractionName('ask_for_dukedom')] - Every Member can request an upgrade to the [ShowCountryRankName('rank_duchy')] [country_rank|e], granted they fullfil the conditions. The members are not allowed to upgrade their [country_rank] without the confirmation of the [ShowSpecialStatusName('emperor')].\n@arrow_bonus_tier_1! [ShowCountryInteractionName('request_county_privileges')] - This can be used to gain access to the [ShowGovernmentReformName('margraviate')] and [ShowGovernmentReformName('landgraviate')] [government_reforms|e]." #NEW
