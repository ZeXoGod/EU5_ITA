 positive_modifier_effects_TT: "Positive Effects:"
 neutral_modifier_effects_TT: "Constant Effects:"
 negative_modifier_effects_TT: "Effetti negativi:" 
 board_of_revenue_bureaucracy: "Consiglio delle Entrate" 
 board_of_revenue_bureaucracy_desc: "Un organismo centralizzato responsabile della riscossione, dell'accertamento e della gestione delle entrate statali. Istituzioni come l'English Board of Treasury o il francese #italic Contrôle général des finances#! mostrarono come un Consiglio delle Entrate ben finanziato potesse aumentare drasticamente le entrate della corona, ma uno trascurato, infestato da sinecure e corruzione, diventa un peso proprio per le entrate che era stato creato per proteggere." 
 privy_council_bureaucracy: "Consiglio Privato" 
 privy_council_bureaucracy_desc: "Un consiglio interno di fidati consiglieri che funge da principale strumento del governo regio. Organismi come l'English Privy Council o lo spagnolo #italic Consejo Real#! permisero ai monarchi di governare efficacemente riunendo le grandi cariche dello stato sotto un unico organo coordinato. Senza un sostegno adeguato, tuttavia, un Consiglio Privato degenera in una sede di lotte di fazione, alienando proprio i ceti dalla cui cooperazione dipende la corona." 
 audit_bureau_bureaucracy: "Ufficio di Revisione" 
 audit_bureau_bureaucracy_desc: "Un organismo dedicato all'esame dei conti pubblici e al controllo delle pratiche corrotte di funzionari e appaltatori delle imposte. Istituzioni modellate sulla francese #italic Cour des Comptes#! o sulla olandese #italic Rekenkamer#! diedero alla corona un potente strumento per recuperare entrate perdute e chiamare gli amministratori a rispondere del proprio operato. Se lasciato sottofinanziato, tuttavia, un Ufficio di Revisione perde la propria indipendenza: interessi radicati riempiono il vuoto e l'apparato fiscale viene catturato proprio dalle parti che avrebbe dovuto sorvegliare." 
 colonial_office_bureaucracy: "Ufficio Coloniale" 
 colonial_office_bureaucracy_desc: "Un ministero responsabile di dirigere la politica verso i territori d'oltremare, gestire le nomine coloniali e supervisionare il quadro giuridico dell'impero. L'English Colonial Office mostra come una supervisione metropolitana organizzata possa accelerare l'insediamento dei possedimenti lontani. Senza risorse adeguate, tuttavia, la promozione coloniale incoraggia le persone a lasciare il nostro paese senza offrire loro migliori opportunità all'interno del nostro impero." 
 admiralty_board_bureaucracy: "Consiglio dell'Ammiragliato" 
 admiralty_board_bureaucracy_desc: "Un consiglio di commissari responsabile dell'amministrazione, dei rifornimenti e della direzione strategica della marina. L'Ammiragliato britannico e il ramo navale del #italic Consejo de Guerra#! spagnolo dimostrarono che un'amministrazione navale professionale era decisiva quanto le navi stesse. Un Ammiragliato ben mantenuto può far crescere un bacino ampio ed esperto di marinai, ma quando i finanziamenti vengono meno il reclutamento continua mentre l'addestramento no, e la tradizione navale si erode anche mentre la flotta si espande." 
 foreign_ministry_bureaucracy: "Ministero degli Esteri" 
 foreign_ministry_bureaucracy_desc: "Un ufficio permanente dedicato a condurre le relazioni esterne dello stato, mantenere un corpo di ambasciatori residenti e coordinare le informazioni provenienti dall'estero. Il #italic Ministère des Affaires Étrangères#! francese fu pioniere del servizio diplomatico professionale che altre potenze avrebbero poi copiato. Un Ministero degli Esteri dotato di risorse adeguate costruisce prestigio attraverso negoziati riusciti, ma uno sottofinanziato produce imbarazzi: inviati che non possono permettersi il proprio seguito, dispacci che restano senza risposta e una reputazione che ne soffre di conseguenza." 
 trade_commission_bureaucracy: "Commissione Commerciale" 
 trade_commission_bureaucracy_desc: "Un organismo regolatore incaricato di concedere licenze ai mercanti, dirimere dispute commerciali, fissare tariffe e combattere il contrabbando. Istituzioni come il British Board of Trade o i consigli di supervisione della olandese #italic Vereenigde Oost-Indische Compagnie#! mostrarono come un coinvolgimento statale organizzato nel commercio potesse trasformare la prosperità nazionale. Senza capacità di far rispettare le regole, tuttavia, una Commissione Commerciale diventa inefficace: i monopoli autorizzati vengono elusi, le entrate tariffarie si disperdono e l'economia commerciale più ampia ne esce peggiorata." 
 war_council_bureaucracy: "Consiglio di Guerra" 
 war_council_bureaucracy_desc: "Un supremo comitato militare responsabile della pianificazione, del coordinamento e della supervisione delle forze terrestri. L'#italic Hofkriegsrat#! asburgico e il War Office britannico rappresentano risposte diverse allo stesso problema: come imporre una direzione strategica a eserciti troppo grandi perché un singolo comandante possa controllarli da solo. Un Consiglio di Guerra finanziato produce un flusso costante di ufficiali capaci, ma quando i suoi bilanci vengono tagliati il meccanismo istituzionale che individua e promuove il talento si inceppa e la tradizione dell'esercito decade." 
 ordnance_board_bureaucracy: "Consiglio degli Armamenti" 
 ordnance_board_bureaucracy_desc: "Un dipartimento specializzato responsabile della produzione, dello stoccaggio e della fornitura di artiglieria, munizioni e ingegneria da campo. Il Board of Ordnance inglese e il #italic Corps Royal de l'Artillerie#! francese dimostrarono che la professionalizzazione della guerra d'assedio richiedeva un'istituzione burocratica permanente, non appaltatori improvvisati. Un Consiglio degli Armamenti ben finanziato migliora enormemente le capacità d'assedio, ma quando viene privato di risorse si ripiega su se stesso: le fonderie non vengono mantenute, le ispezioni dei magazzini vengono saltate e le fortezze che il Consiglio avrebbe dovuto tenere in buono stato iniziano a sgretolarsi." 
 commissariat_bureaucracy: "Commissariato" 
 commissariat_bureaucracy_desc: "Un ramo logistico dell'organizzazione militare responsabile di rifornire gli eserciti in campagna di cibo, foraggio, vestiario ed equipaggiamento. Il sistema sviluppato sotto Louvois per gli eserciti di Luigi XIV, poi perfezionato nella #italic Intendance#!, mostrò che un esercito nutrito da depositi organizzati poteva sostenere campagne di scala e durata impossibili per forze costrette a vivere di requisizioni locali. Un Commissariato adeguatamente finanziato accresce gli effettivi disponibili per le campagne; uno sottofinanziato costringe gli eserciti a compensare tramite rovinosi contratti privati, facendo salire i costi di mantenimento ben oltre il valore dell'aumento di effettivi." 
 central_secretariat_bureaucracy: "Segretariato Centrale" 
 central_secretariat_bureaucracy_desc: "Lo #italic $zhongshu_sheng$#! era il supremo organismo amministrativo civile della dinastia Yuán, che dirigeva tutto il governo dell'impero dalla capitale. Un Segretariato ben finanziato legittima l'autorità della dinastia attraverso un governo deciso e coordinato, ma quando le sue operazioni vengono trascurate, il conseguente caos amministrativo aumenta il costo di ogni decisione politica che la corona deve prendere." 
 imperial_censorate_bureaucracy: "Censorato Imperiale" 
 imperial_censorate_bureaucracy_desc: "Lo #italic Yùshǐtái#! sotto gli Yuán, poi riformato come #italic Dūcháyuàn#! sotto i Míng, era l'ispettorato incaricato di sradicare la corruzione tra i funzionari e garantire l'applicazione della legge dalla capitale alle province. Quando è adeguatamente finanziato, i suoi investigatori recuperano entrate fiscali che altrimenti si disperderebbero per cattiva condotta ufficiale, ma se lasciati senza risorse perdono la capacità di agire, e i ceti si affrettano a sfruttare il vuoto di supervisione." 
 six_boards_bureaucracy: "Sei Consigli" 
 six_boards_bureaucracy_desc: "I #italic Liùbù#! erano i sei ministeri della dinastia Míng, Personale, Entrate, Riti, Guerra, Giustizia e Lavori, che insieme amministravano l'intero apparato dello stato. Insieme rappresentano la struttura burocratica più completa al mondo; ben finanziati, forniscono un marcato aumento delle entrate fiscali, ma se trascurati i sei consigli diventano basi di potere radicate per funzionari di fazione che antepongono i propri interessi a quelli del trono." 
 six_boards_deactivate_disables_oversight_law_tt: "Rimuovere questa [bureaucracy|e] impedirà l'accesso alla legge [ShowLawName('six_ministries_overseer_law')]" 
 grand_secretariat_bureaucracy: "Gran Segretariato" 
 grand_secretariat_bureaucracy_desc: "Il #italic Nèigé#! era il consiglio consultivo interno che in pratica governava l'impero Míng, redigendo editti, mediando tra l'Imperatore e la burocrazia esterna e coordinando la politica attraverso i $six_boards_bureaucracy$. Un Gran Segretariato adeguatamente dotato di risorse costruisce prestigio imperiale tramite un governo deciso e unitario, ma uno sottofinanziato perde l'ascolto dell'Imperatore, e la legittimità che era stato creato per sostenere inizia a erodersi." 
