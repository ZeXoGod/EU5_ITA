 staple_port: "Porto Principale"
 staple_port_desc: "Questa [location|e] ha ottenuto privilegi legali che conferiscono ai [ShowEstateTypeName('burghers_estate')] maggiori diritti sul [trade|e] locale."
 granary_town: "Città Granaio"
 granary_town_desc: "Questa [location|e] ha ottenuto privilegi legali e normative volte ad aumentare la propria produzione e lo stoccaggio di [food|e]."


 
#######################################
