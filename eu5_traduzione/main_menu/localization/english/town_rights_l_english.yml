#######################################

 royal_tooling_rights: "Diritti sulle Attrezzature"
 royal_tooling_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('tools')], che conferisce un notevole vantaggio competitivo."

 royal_jewelry_rights: "Diritti sui Gioielli"
 royal_jewelry_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('jewelry')], che conferisce un notevole vantaggio competitivo."

 royal_weaponry_rights: "Diritti sulle Armi"
 royal_weaponry_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('weaponry')], [ShowGoodsName('firearms')], e [ShowGoodsName('cannons')], che conferisce un notevole vantaggio competitivo."

 royal_book_rights: "Diritti di Stampa"
 royal_book_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('paper')], [ShowGoodsName('books')], e [ShowGoodsName('dyes')], che conferisce un notevole vantaggio competitivo."
 
 royal_artisan_rights: "Diritti degli Artigiani"
 royal_artisan_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('leather')], [ShowGoodsName('pottery')], e [ShowGoodsName('furniture')], che conferisce un notevole vantaggio competitivo."

 royal_brewing_rights: "Diritti di Distillazione"
 royal_brewing_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('liquor')], [ShowGoodsName('beer')], e [ShowGoodsName('wine')], che conferisce un notevole vantaggio competitivo."
 
 royal_textile_rights: "Diritti Tessili"
 royal_textile_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('cloth')] e [ShowGoodsName('fine_cloth')], che conferisce un notevole vantaggio competitivo."
 
 royal_naval_rights: "Diritti sulle Forniture Navali"
 royal_naval_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('naval_supplies')] e [ShowGoodsName('tar')], che conferisce un notevole vantaggio competitivo."
 not_forcefully_revoked_last_10_years_tt: "Negli ultimi dieci anni i diritti urbani non sono stati revocati con la forza."
 
 royal_masonry_rights: "Diritti di Muratura"
 royal_masonry_rights_desc: "Questa [location|e] ha ottenuto l'esclusiva legale sulla produzione e la distribuzione di [ShowGoodsName('masonry')] e [ShowGoodsName('glass')], che conferisce un notevole vantaggio competitivo."
 
 
 
 
 #######################################
 #   Historic Rights    ################
 #######################################
 
 magdeburg_rights_town_rights: "$magdeburg_rights$"
 magdeburg_rights_town_rights_desc: "$magdeburg_rights_desc$"
 unlock_mageburg_town_rights_tt: "Sblocca i [town_rights] [ShowTownRightsName('magdeburg_rights_town_rights')] e [ShowTownRightsName('nuremberg_rights_town_rights')]"
 
 lubeck_town_rights: "Diritti di [ShowLocationNameWithNoTooltip('lubeck')]"
 lubeck_town_rights_desc: "Adeguare le leggi e i privilegi dei nostri insediamenti urbani a quelli della stessa [ShowLocationName('lubeck')] conferirà maggiore potere ai nostri mercanti. Sebbene i vantaggi per i nostri commercianti ne favoriscano l'attività, i membri delle corporazioni all'interno della città non vedranno di buon occhio questo trattamento preferenziale e cercheranno di ostacolarci a modo loro."

 town_rights_marketplace: "Diritti Cittadini di Mercato"
 
 nuremberg_rights_town_rights: "Diritti di [ShowLocationNameWithNoTooltip('nuremberg')]"
 nuremberg_rights_town_rights_desc: "$magdeburg_rights_town_rights_desc$"
 
 upper_bergregal: "Upper Bergregal"
 upper_bergregal_desc: "Cedere al governo della città il diritto di svolgere attività minerarie aumenterà i fondi disponibili per la prospezione di nuovi giacimenti minerari e renderà la zona più attraente per i potenziali nuovi coloni. Purtroppo, ciò comporta restrizioni più severe per i cittadini comuni del luogo e limita la loro possibilità di trarre beneficio direttamente dalle miniere."
 unlock_bergregal_rights_tt: "Sblocca i [town_rights] [ShowTownRightsName ('upper_bergregal')] e [ShowTownRightsName('lower_bergregal')]"
 
 lower_bergregal: "Lower Bergregal"
 lower_bergregal_desc: "$upper_bergregal_desc$"
 
 stapelrecht_town_rights: "Diritti Base della [ShowSpecialStatusNameWithNoTooltip('free_city')]"
 stapelrecht_town_rights_desc: "Il titolo di [ShowSpecialStatusName('free_city')] concessa dall'[ShowSpecialStatusName('emperor')] ci garantisce la libertà di istituire determinati privilegi all'interno delle nostre città, a vantaggio dei mercanti locali e costringendo un maggior numero di mercanti stranieri a commerciare attraverso i nostri territori."
 
 kulm_town_rights: "Diritti Kulm"
 kulm_town_rights_desc: "$kulm_law_desc$"
 unlock_kulm_town_rights_tt: "Sblocca i [town_rights] [ShowTownRightsName('kulm_town_rights')]"
 
 novi_fori_town_rights: "Diritti $novi_fori$"
 novi_fori_town_rights_desc: "$novi_fori_desc$"
 unlock_novi_fori_rights_tt: "Sblocca i [town_rights] [ShowTownRightsName('novi_fori_town_rights')]"
 
 royal_free_cities_town_rights: "Diritti Città Libera Reale"
 royal_free_cities_town_rights_desc: "Dichiarando i nostri centri urbani «Città Reali e Libere», possiamo evitare che la nostra [ShowEstateTypeName('nobles_estate')] accumuli potere all'interno dei loro confini."
 
 bohemian_royal_cities_town_rights: "Diritti Città Reale"
 bohemian_royal_cities_town_rights_desc: "Concedere alle città il privilegio di essere dichiarate proprietà diretta del nostro sovrano indebolirà la [ShowEstateTypeName('nobles_estate')], e potrebbe aiutare il nostro Stato a trarne direttamente un maggiore valore."
 
 swedish_city_rights: "Diritti Stadsrättigheter"
 swedish_city_rights_desc: "I commercianti di questa località godranno di privilegi ampliati che consentiranno loro di svolgere la propria attività senza concorrenza straniera."
 
 norwegian_city_rights: "Diritti Kjøpstad"
 norwegian_city_rights_desc: "Concedere privilegi ai mercanti di questa località e riservare loro un trattamento preferenziale rafforzerà le nostre rotte commerciali, mettendo invece in una posizione di svantaggio i mercanti stranieri."
 
 borough_customals: "Costumi Comunali"
 borough_customals_desc: "I territori a cui saranno concessi questi diritti potranno gestire autonomamente la propria crescita e fungere da rifugi liberi dall'oppressione nobiliare."

 manorial_customals: "Costumi Feudali"
 manorial_customals_desc: "Concedere ai proprietari terrieri feudali maggiori poteri esecutivi su questa zona aumenterà lo sfruttamento della terra e terrà a bada i contadini ribelli."
 
 foros_extensos_town_rights: "Foros Extensos"
 foros_extensos_town_rights_desc: "Fin dalla sua fondazione, il $POR$ è sempre stato una terra di confine, popolata da personaggi illustri come Geraldo sem Pavor. I suoi governanti incoraggiano questo coraggio e questa indomabilità concedendo ampie concessioni, comunemente note come $foros_extensos_town_rights$."
 
 fuero_juzgo_town_rights: "Fuero Juzgo"
 fuero_juzgo_town_rights_desc: "Il $fuero_juzgo_town_rights$ si basa sull'antico codice Visigoto, il #italic Liber Iudiciorum#!. In quanto tale, disciplina molti aspetti della vita quotidiana, rendendola particolarmente adatta alle terre di recente colonizzazione."
 
 fuero_real_town_rights: "Fuero Real"
 fuero_real_town_rights_desc: "Il $fuero_real_town_rights$ è un codice elaborato dal Re Alfonso X di Castiglia per estendere il potere reale a tutti i comuni di $CAS$."
 
 fuero_general_town_rights: "Fuero General"
 fuero_general_town_rights_desc: "Il $fuero_general_town_rights$ di $NAV$ è la raccolta delle consuetudini e delle leggi che regolano i diversi stati del territorio, d'intesa con il suo sovrano."
 
 fuero_de_aragon_town_rights: "Fueros de Aragón"
 fuero_de_aragon_town_rights_desc: "Il $fuero_de_aragon_town_rights$ ha raccolto i vari diritti comunali che si sono diffusi in tutta la regione d'$aragon_area$ nel corso della sua espansione. Pertanto, essi sono rigorosamente difesi sia dalla $nobles_estate$ che dai $peasants_estate$."
 
 usatges_de_barcelona_town_rights: "Usatges de Barcelona"
 usatges_de_barcelona_town_rights_desc: "L'$usatges_de_barcelona_town_rights$ sono le usanze e le tradizioni che regolano i territori della $catalonia_area$, promulgata e concessa originariamente dai Conti di $barcelona$."

 furs_de_valencia_town_rights: "Furs de Valencia"
 furs_de_valencia_town_rights_desc: "Il $furs_de_valencia_town_rights$ furono concessi al regno omonimo dal Re Giacomo I d'Aragona dopo la sua conquista. La loro principale differenza rispetto alle antiche usanze d'$aragon_area$ e $catalonia_area$ risiedeva nella loro attenzione alla regolamentazione della convivenza con la popolazione $muslim_ADJ$, che in alcune zone rappresenta la maggioranza."

 flemish_cloth_industries_right: "Industria Tessile Fiamminga"
 flemish_cloth_industries_right_desc: "Nel tardo Medioevo nei Paesi Bassi nacque una potente industria tessile. Realizzati con lana importata dall'$ENG$ e dalla $CAS$ questi tessuti di altissima qualità venivano esportati in tutta $europe$."

 ville_franche_town_rights: "Diritti di Ville Franche"
 ville_franche_town_rights_desc: "$villes_franches_desc$"
 unlock_ville_franche_town_rights_tt: "Sblocca i [town_rights] [ShowTownRightsName('ville_franche_town_rights')]"

 borgo_franco_town_rights: "Diritti di Borgo Franco"
 borgo_franco_town_rights_desc: "La diffusione dei comuni in tutta $italy_region$ è ormai una realtà e costituisce la spina dorsale del Paese. Questi sono spesso considerati #italic Borgo Franco#! (città libere) e godono di numerosi privilegi rispetto alla campagna."

 #######################################
 #   Scandinavian Rights    ############
 #######################################

 scandinavian_fishing_privileges: "Fiskeriprivilegier"
 scandinavian_fishing_privileges_desc: "Questa [location|e] ha ottenuto i diritti esclusivi sulle zone di pesca circostanti e sul commercio di pesce essiccato e salato. Le città costiere Norvegesi, che si svilupparono attorno a questi privilegi, rifornivano di [ShowGoodsName('fish')] tutto il Nord Europa."

 scandinavian_bergslag_privileges: "Bergslagsprivilegier"
 scandinavian_bergslag_privileges_desc: "La Corona ha riconosciuto questa [location|e] come comunità mineraria (bergslag), concedendogli diritti collettivi sull'estrazione mineraria locale, un proprio tribunale e l'esenzione dal servizio militare obbligatorio. I [ShowEstateTypeName('peasants_estate')] delle miniere godono di una posizione giuridica più solida rispetto alle città normali."

 scandinavian_tar_privileges: "Tjärprivilegier"
 scandinavian_tar_privileges_desc: "Questa [location|e] ha ottenuto i diritti di raccolta ed esportazione di [ShowGoodsName('tar')] e [ShowGoodsName('naval_supplies')] provenienti dalle foreste della Corona. Queste industrie forestali costituiscono la spina dorsale delle catene di approvvigionamento della cantieristica navale baltica."

 scandinavian_thing_rights: "Tingsrätt"
 scandinavian_thing_rights_desc: "Questa [location|e] le sono stati concessi i diritti formali di assemblaggio (tingsrätt), offrendo ai suoi abitanti un quadro giuridico riconosciuto in materia di governo e giustizia. L'autorità Reale viene limitata in cambio di una popolazione più ordinata e leale."

 #Byzantine / Greek / Roman

 imperial_breadbasket_rights: "Granaio dell'Impero"
 imperial_breadbasket_rights_granary_tt: "Ha un [ShowBuildingTypeName('granary')] di livello 5 o superiore"
 imperial_breadbasket_rights_desc: "Questa [location|e] è stata incaricata di provvedere all'approvvigionamento dell'intero regno, e i suoi granai sono stati ampliati per far fronte ai nostri ambiziosi progetti. Il grano affluisce e defluisce sotto la supervisione imperiale, garantendo abbondanza sia ai cittadini che all'esercito."

 constantinopolitan_silk_monopoly_rights: "Monopolio della Seta di [ShowLocationNameWithNoTooltip('constantinople')]"
 constantinopolitan_silk_monopoly_rights_desc: "All'interno di [ShowLocationName('constantinople')], la produzione di [ShowGoodsName('silk')] è caratterizzata da standard elevati, una lunga tradizione che attraversa le generazioni. Le botteghe artigiane prosperano sotto la supervisione imperiale, anche se l'intera produzione è soggetta al monopolio."

 scholai_literacy_rights: "Privilegi Scholai"
 scholai_literacy_rights_desc: "Questa [location|e] è riconosciuta come un centro di cultura, dove le lettere vengono promosse sotto il patrocinio delle autorità. La conoscenza si diffonde rapidamente, anche se tali attività raramente arricchiscono le casse dello Stato. La mente oziosa è il terreno fertile del diavolo."

 municipia_privilegia: "Privilegi Municipia"
 municipia_privilegia_desc: "Questa [location|e] è stata elevata al rango di municipium e ai suoi cittadini sono stati concessi i diritti previsti dalla nostra legislazione. Le élite locali esercitano una maggiore influenza, legando il territorio più strettamente alle tradizioni di [ShowSocietyDirectionName('latinization')]."