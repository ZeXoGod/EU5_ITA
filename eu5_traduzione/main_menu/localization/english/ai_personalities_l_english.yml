l_english:
 ai_balanced: "Equilibrata" 
 # AI Personality names (used as PdxDataLocalize(GetKey()) in CAiPersonality::GetName)
 ai_aggressive: "Aggressivo"
 ai_expansionist: "Espansionista"
 ai_defensive: "Difensivo"
 ai_cautious: "Cauto"
 ai_opportunistic: "Opportunistico"
 ai_isolationist: "Isolazionista"
 ai_friendly: "Amichevole"
 ai_balanced_desc: "Questa nazione non ha una predisposizione marcata. Le sue azioni sono plasmate soprattutto dal temperamento dei suoi governanti, dai valori della sua società e dalle circostanze in cui si trova." 

 # AI Personality descriptions (key + "_desc")
 ai_aggressive_desc: "Questa nazione persegue il potere con la forza. È pronta a scatenare guerre, impone condizioni di pace severe e considera le potenze vicine come ostacoli da superare piuttosto che come partner con cui instaurare rapporti."
 ai_expansionist_desc: "Questa nazione mira ad ampliare i propri confini e la propria influenza. Predilige l'espansione territoriale, persegue attivamente le proprie rivendicazioni e, quando se ne presenta l'occasione, tende alla sottomissione piuttosto che all'annessione vera e propria."
 ai_defensive_desc: "Questa nazione si preoccupa innanzitutto di proteggere ciò che possiede. Preferisce evitare conflitti inutili, rafforza la propria posizione interna e reagisce alle minacce piuttosto che crearne di nuove."
 ai_cautious_desc: "Questa nazione è avversa al rischio e paziente. Cerca innanzitutto soluzioni diplomatiche, evita le guerre che non può vincere in modo decisivo e privilegia la stabilità rispetto all'avventurismo."
 ai_opportunistic_desc: "Questa nazione è calcolatrice e pragmatica. È sempre alla ricerca dei punti deboli altrui e sa cogliere le occasioni propizie, ma evita di impegnarsi in conflitti quando l'esito è incerto."
 ai_isolationist_desc: "Questa nazione è orientata verso l'interno, dà priorità allo sviluppo interno e rifugge dai coinvolgimenti con l'estero. Mantiene una forte propensione alla neutralità e guarda con diffidenza agli obblighi diplomatici."
 ai_friendly_desc: "Questa nazione attribuisce grande importanza alle alleanze, alla buona volontà e alla correttezza nei rapporti. Investe molto nella diplomazia, accetta condizioni di pace ragionevoli e tende a stringere nel tempo partnership affidabili."

