 # AI disposition descriptions (tooltip body for each disposition)
 AI_DISPOSITION_ALARMED_DESC: "Questa [country_disposition|e] indica che ti considerano una minaccia esistenziale e che probabilmente cercheranno alleanze difensive o intraprenderanno azioni preventive contro di te." 
 AI_DISPOSITION_WARY_DESC: "Questa [country_disposition|e] significa che si mostrano cauti nei tuoi confronti e saranno riluttanti a fare concessioni o ad abbassare la guardia."
 AI_DISPOSITION_PLANNING_WAR_DESC: "Questa [country_disposition|e] significa che hanno una rivendicazione o un reclamo in corso e si stanno preparando a far valere i propri diritti con la forza."
 AI_DISPOSITION_COVETS_DESC: "Questa [country_disposition|e] significa che considerano i tuoi territori un obiettivo allettante e potrebbero cercare di conquistarti o sottometterti non appena se ne presenterà l'occasione."
 AI_DISPOSITION_DOMINEERING_DESC: "Questa [country_disposition|e] indica che sono molto più potenti di te e cercano di portarti sotto la loro influenza tramite sottomissione o vassallaggio, anche se non ambiscono a nessuna tua provincia specifica." 
 AI_DISPOSITION_RIVALS_DESC: "Questa [country_disposition|e] significa che ti considerano un rivale e si opporranno ai tuoi interessi ogni volta che potranno, arrivando persino a sostenere i tuoi nemici."
 AI_DISPOSITION_INDIFFERENT_DESC: "Questa [country_disposition|e] indica che al momento non provano sentimenti particolari nei tuoi confronti."
 AI_DISPOSITION_FRIENDLY_DESC: "Questa [country_disposition|e] indica che ti considerano un amico, grazie a un'alleanza difensiva stabile o semplicemente a relazioni favorevoli, e sono propensi a cooperare con te." 

