 game_concept_promote_industry: "Promuovi Industria"
 game_concept_industry_promotion_desc: "Una Promozione Industriale dedica un'[area|e] a un singolo ramo dell'industria. Ogni industria comprende un insieme di [goods|e]: promuoverla aumenta la [output|e] di ogni [building|e] in quell'[area] che produce quei [goods], e aumenta la domanda che i tuoi [pops|e] hanno per essi in tutto il tuo [country|e].\n\nPromuovere un'industria richiede il [advance_icon][ShowAdvanceName('industry_promotion_advance')] [advance|e]. Il numero di industrie che puoi promuovere contemporaneamente è stabilito da $MODIFIER_TYPE_NAME_possible_industry_promotions$, che aumenta con il rango del tuo [country], le tue [government_reforms|e] e i successivi [advances]. Una promozione può essere revocata in qualsiasi momento per liberare il suo slot."
