l_english:
 textiles: "Tessuti"
 textiles_desc: "Tessitura e produzione di tessuti, dalla comune lana ai tessuti di lusso più fini. Promuovere i tessuti aumenta la domanda di stoffa in tutto il regno e accelera l'insediamento di tessitori e laboratori nell'area scelta."
 crafts: "Artigianato"
 crafts_desc: "Produzione artigianale e corporativa di utensili, acciaio lavorato, pelle e opere murarie. La spina dorsale dei mestieri specializzati di una città."
 arms: "Armi"
 arms_desc: "La manifattura di armamenti e, col tempo, di armi da fuoco e cannoni. Un'industria delle armi promossa mantiene gli eserciti forniti dalle fucine nazionali."
 luxury: "Beni di Lusso"
 luxury_desc: "Manufatti di alto valore come vetro, gioielli, porcellana e lacche. Industrie di prestigio che arricchiscono i borghesi che le dominano."
 paper_goods: "Prodotti di Carta"
 paper_goods_desc: "Cartiere e stampa di libri. Alimenta l'alfabetizzazione e l'amministrazione tanto quanto il commercio."
 furnishings: "Arredamento"
 furnishings_desc: "Mobili e ceramiche per le case di ogni classe sociale."
 naval: "Forniture Navali"
 naval_desc: "Forniture navali e catrame, i materiali che costruiscono e mantengono le flotte."
 beverages: "Bevande"
 beverages_desc: "Vino, liquori e birra. Un mercato assetato che ricompensa le regioni che lo riforniscono."

