l_english:
 stockholm_desc: "Questa città fu fondata nel 1252 da Birger Jarl, in una posizione strategicamente scelta dove il Lago Mälaren incontra il Mar Baltico. Ciò permise a Stoccolma di fungere sia da fortezza che controllava l'accesso al lago, sia da snodo commerciale che collegava l'entroterra svedese alle reti commerciali anseatiche e baltiche. Entro l'inizio del XIV secolo, il ferro e il rame portati giù dalle miniere di Bergslagen, insieme all'afflusso di borghesi tedeschi che governavano secondo la Legge di Lubecca, avevano reso Stoccolma la città più importante del regno svedese."
 paris_desc: "Sulle rive della Senna, Parigi è sorta da un modesto insediamento per diventare il gioiello della corona di Francia. Con le sue cattedrali, i mercati e le scuole, è diventata uno dei centri di potere e cultura più importanti d'Europa."
 london_desc: "Ancorata sul Tamigi, Londra è cresciuta dalla romana Londinium fino a diventare la città più importante d'Inghilterra. Il suo fiorente commercio e le corti reali l'hanno resa il cuore politico ed economico del regno."
 rome_desc: "La Città Eterna sul Tevere ha governato un impero che si estendeva su continenti. Anche dopo la caduta del suo Impero, Roma ha resistito come faro di fede e autorità, sede del Papato."
 jerusalem_desc: "Punto di incontro di fede e lotta, Gerusalemme è venerata da Ebrei, Cristiani e Musulmani. Pellegrini e conquistatori ne plasmano continuamente la storia sacra ma turbolenta."
 alexandria_desc: "L'antico faro del Mediterraneo, Alessandria prospera come crocevia di commercio e sapere. Il suo faro e la biblioteca un tempo annunciavano una città in cui culture e imperi convergevano."
 constantinople_desc: "Incoronata dalla Hagia Sophia e cinta da possenti mura, Costantinopoli un tempo si ergeva come il cuore dell'Impero Romano d'Oriente. Per mille anni, la sua ricchezza e la sua grandezza l'hanno resa l'invidia del mondo."
 sitges_desc: "Nel Medioevo, un Castello fu costruito sulla collina dove ora sorge il Municipio. Il primo proprietario fu il Vescovado di Barcellona, ma nel XII secolo passò sotto la proprietà della famiglia da cui prende il nome."
 valladolid_desc: "Fondata negli ultimi decenni dell'XI secolo dai conti Pedro Ansúrez ed Eylo Alfonso, Valladolid si è sviluppata come città commerciale nel cuore della Meseta Settentrionale. Entro il XIV secolo, era diventata la città più importante della regione, insieme a Burgos, e il principale centro amministrativo durante le reggenze della Regina María de Molina e il regno del suo nipote, il Re Alfonso XI."
 penafiel_desc: "#italic Penna Fidelis#!, 'Collina Fedele', fu fondata nel X secolo sulla cima di una collina che controlla strategicamente la sezione centrale della valle del fiume Duero, rendendola un punto caldo nella guerra di confine contro il Califfato di Cordova. Il Conte Sancho García di Castiglia la fortificò e le concesse un #italic fuero#! intorno al 1013. Successivamente, è cresciuta fino a diventare una città ricca, grazie alla sua fiorente industria vinicola, finendo per essere controllata dal potente lignaggio di Don Juan Manuel."
 toro_desc: "Toro fu fondata nel X secolo come parte degli sforzi compiuti dai Re di León per fortificare il confine del regno nella valle del fiume Duero, nella loro lotta contro il Califfato di Cordova. Si sviluppò in seguito come un'importante città, grazie alla sua posizione strategica e ai Suoi ricchi campi agricoli e vigneti."
 thessaloniki_desc: "A lungo considerata la seconda città dell'Impero Bizantino dopo Costantinopoli, Salonicco deve la sua ricchezza e il suo prestigio alla sua posizione strategica nel commercio. I suoi porti vivaci convogliano merci preziose tra il resto dell'Italia e il cuore romano, fungendo da ponte vitale tra Oriente e Occidente."
 malmo_desc: "Una roccaforte chiave sull'Øresund, Malmö comanda il passaggio tra il Baltico e il Mare del Nord. Le sue mura fortificate e i Suoi difensori vigilanti la rendono un centro di potere e una città plasmata da strategia e ambizione."
 bilbao_desc: "Fondata ufficialmente nel 1300 da Diego López de Haro, Signore di Biscaglia, la città divenne presto un importante snodo nella Spagna settentrionale. Incastonata in una stretta valle e all'inizio dell'estuario del fiume Nervión, l'insediamento cinto da mura sviluppò una potente industria di cantieri navali e divenne il principale porto di esportazione verso i porti inglesi e fiamminghi della preziosa lana Merino castigliana e del minerale di ferro locale di alta qualità."
 radom_desc: "Una città ampliata dall'ultimo Re Piast Casimiro III il Grande, rimase un importante centro politico per tutto il tardo Medioevo e il Rinascimento. La città ospitò anche la firma del Patto di Vilnius e Radom nel 1401 e l'approvazione dell'atto #italic Nihil Novi#! nel 1505, durante una sessione parlamentare nel castello reale."
 krakow_desc: "Nata come borgo sulla collina di Wawel, fu menzionata per la prima volta con il suo nome nel 965, descritta come un notevole centro commerciale dell'epoca. Divenne la sede dei monarchi polacchi della dinastia Piast nel 1038, e successivamente servì come centro di amministrazione, economia e cultura per il Regno di Polonia."
 megara_desc: "Fondata e abitata fin dall'antichità, Megara fu governata da re leggendari come Nisos e Byzas. La città divenne una potenza significativa nella penisola greca, rinomata per la sua forza navale e il suo fiorente commercio. I suoi coloni arrivarono a stabilire importanti insediamenti in tutto il Mediterraneo, tra cui Byzantion, Chersonesos e Selinoûs. Col tempo, tuttavia, Megara cadde gradualmente nell'oscurità, lasciando dietro di sé solo tracce della sua antica importanza."
 grojec_desc: "Fino al XII secolo, era stata la sede della castellania locale e dell'arcidiocesi di Poznań, ma ha gradualmente perso la sua importanza a favore della vicina Czersk."
 gdansk_desc: "Il suo nome, registrato per la prima volta nell'anno 997, nacque da un insediamento che esisteva sulla costa del Mar Baltico. Divenne un importante porto di costruzione navale e commerciale, consolidando la sua posizione come una delle città più ricche e influenti dell'Europa orientale."
 athens_desc: "Considerata il centro culturale dell'Antica Grecia, Atene crebbe fino a diventare una delle città-stato più potenti del suo tempo. In costante competizione con Sparta, Tebe e altri stati prominenti dell'antichità, crebbe lentamente fino a diventare la potenza marittima dominante del Mar Egeo. Con la sua sottomissione all'Impero Macedone, e più tardi ai Romani e ai Bizantini, la città affrontò un grave declino e, dopo il 1204, divenne la capitale di uno Stato Crociato."
 wieliczka_desc: "La città di Wieliczka fu fondata nel 1290 dal Re Przemysł II di Polonia, grazie all'estrazione locale di depositi di sale. Una delle principali città minerarie, le furono concessi molti privilegi, e le miniere di sale locali divennero presto una delle principali fonti di ricchezza reale. La Miniera di Sale di Wieliczka e la sua miniera gemella a Bochnia divennero infine parte della compagnia mineraria #italic Żupy Krakowskie#!. Nei documenti formali, la città è conosciuta come #italic Wielka Sól#!, che significa #italic Grande Sale#!."
 leksand_desc: "Questo villaggio sulla costa meridionale del Lago Siljan è popolato da diversi millenni. La Chiesa fu costruita all'inizio del XII secolo ed è ora famosa soprattutto perché il suo primo ministro luterano fu un antenato di Johan."
 leipzig_desc: "Fondata nel 1165 al crocevia della #italic Via Imperii#! e della #italic Via Regia#!, Lipsia crebbe fino a diventare un ricco snodo commerciale. Successivamente dotata di importanti privilegi imperiali, Lipsia fu un importante centro sia per il commercio di pellicce che per la nascente industria editoriale."
 augsburg_desc: "Conosciuta come #italic Augusta Vindelicorum#! durante il regno dell'Imperatore Romano Traiano, la Libera Città Imperiale di Augusta fu una delle città più antiche del Sacro Romano Impero. Alla fine dell'Alto Medioevo, Augusta crebbe in importanza come sede di una vittoriosa difesa contro gli invasori Ungari nel 955. Nel 1276, questa importanza si espanse ulteriormente quando Augusta ricevette i suoi diritti di Città Imperiale dal Re Rodolfo d'Asburgo, che aprì la strada a un futuro prospero."
 warsaw_desc: "Originaria di un piccolo villaggio di pescatori in Masovia, la città divenne importante dopo che la capitale vi fu trasferita da Cracovia da Sigismondo III nel 1596. Da allora continuò a crescere, diventando la più grande città polacca nel XVIII secolo. Nello stesso secolo, vide un ampio sviluppo, contribuendo alla scena architettonica e artigianale polacca."
 tunis_desc: "Fondata come Cartagine dalla leggendaria Regina Didone, divenne la capitale della nazione Punica omonima, venendo distrutta e successivamente ricostruita dai Romani dopo tre guerre sanguinose. La moderna città di Tunisi fu fondata dagli Arabi nel 698 alla periferia di queste antiche rovine. La conquista Almohade nel XII secolo vide la sua elevazione a capitale regionale, status che fu consolidato dalla dinastia Hafsid."
 heidelberg_desc: "Nel tardo XII secolo, Heidelberg divenne la sede del Conte Palatino del Reno e vi fu costruito un rinomato castello. Heidelberg è nota per essere stata la sede della prima università tedesca e, quindi, ha una lunga tradizione di eccellenza educativa. In seguito, divenne un centro di Riforma e tolleranza, con il Palatinato che alla fine divenne il leader dell'Unione Protestante. Il castello e il suo aspetto iconico attrassero molti poeti in città nei secoli successivi, guadagnandole il soprannome di #italic Città del Romanticismo#!."
 aviles_desc: "Risalente al X secolo, Avilés si sviluppò lungo un estuario che le conferì importanza strategica come porto. Nel vicino Castello di Gauzón, il Re Alfonso III delle Asturie ordinò la realizzazione della Croce della Vittoria votiva, che fu ricoperta d'oro e pietre preziose ed è ora il simbolo dell'intero regno. Dall'XI secolo in poi, Avilés divenne una città reale, riconosciuta per il suo commercio marittimo e lo stoccaggio e la distribuzione del sale."
 pingjin_desc: "Tàiyuán, sede del sito sacro del Tempio Jìn, è stata una delle città più importanti nello Shānxī e nel nord della Cina dal V secolo a.C. Nel 979, l'Imperatore Tàizōng di Sòng ordinò che l'antica città di Jìnyáng fosse allagata e distrutta dopo la conquista dello Hàn Settentrionale, e poi la ribattezzò Contea di Píngjìn (lett. 'Pacificazione dello Shānxī'), un disastro dal quale la città impiegò molto tempo a riprendersi."
 dunstable_desc: "Originariamente una città romana, Dunstable si sviluppò in seguito attorno al suo priorato agostiniano, diventando un importante centro religioso e amministrativo. Guadagnò fama come residenza reale di Enrico I a partire dal 1109, e nel 1290 vi fu eretta una Croce di Eleonora per segnare il corteo funebre di Eleonora di Castiglia. Nel 1533, la città ospitò la formale fine del matrimonio di Enrico VIII con la sua prima moglie, Caterina d'Aragona, e nel 1624 divenne un punto di reclutamento cruciale per le forze di Cromwell durante la Guerra Civile Inglese."
 paderborn_desc: "Fondata come vescovado intorno all'800 d.C., la città acquisì importanza come luogo del primo incontro tra Carlo Magno e Papa Leone III. Il suo significato strategico e religioso la rese un obiettivo frequente durante la Guerra dei Trent'anni, quando fu assediata sedici volte. La città subì ulteriori devastazioni nel 1646, quando fu messa a ferro e fuoco dalle truppe svedesi."
 porto_desc: "Chiamata la #italic Cidade Invicta#!, o 'Città Invitta', diede il suo nome al Portogallo e rese celebre il vino Porto del Douro ben oltre le sue coste."
 jiaxing_desc: "Jiāxīng è una zona di confine tra le regioni Wú e Yuè. 'Jiā' significa bellezza e buon auspicio, mentre 'Xīng' sta per prosperità e fioritura."
 torgau_desc: "Nel 1452, l'Elettore Federico II istituì la prima fossa degli orsi a Torgau, che fu costantemente ampliata fino al 1624. Forniva spazio per un massimo di 39 orsi."
 changsha_desc: "Il centro della città di Chángshā è rimasto invariato da quando fu fondata, duemila anni fa."
 ningxiang_desc: "Il più grande #italic zūn#! (vaso da vino) di bronzo della dinastia Shāng (tremila anni fa) fu dissotterrato qui."
 wurzburg_desc: "Würzburg sorse come roccaforte della Franconia, diventando un vescovado nel 741. Fiorì intorno alla sua fortezza e alle rotte commerciali del fiume Meno nell'Alto Medioevo."
 hanover_desc: "Hannover (Hanover) sorse da un insediamento medievale a città chiave del Sacro Romano Impero, governata dai Welf e prosperando come centro di commercio, potere e cultura."
 osnabruck_desc: "Osnabrück, un nodo commerciale medievale nel Sacro Romano Impero, ottenne fama come vescovado e per aver ospitato i negoziati della Pace di Vestfalia."
 glasgow_desc: "Glesca (Glasgow), fondata come vescovado medievale, fiorì intorno alla sua grande cattedrale, ottenendo infine lo status di borgo, e ospitando un'università che avrebbe plasmato il sapere scozzese nei secoli successivi."
 neva_desc: "Il delta della Neva, un tempo parte della rotta commerciale dei Variaghi-Greci, divenne la sede di San Pietroburgo nel 1703. Questa città rimase la capitale della Russia per oltre 200 anni."
 dubno_desc: "Dubno, menzionata per la prima volta nel 1100, crebbe fino a diventare un nodo commerciale Voliniano rinomato per le sue fiere e per il suo castello costruito nel 1492. La città fu in seguito immortalata nel #italic Taras Bulba#! di Gogol'."
 baden_desc: "Inizialmente conosciuta come #italic Civitas Aurelia Aquensis#! dopo essere stata fondata dai Romani, questa città iniziò a portare il nome 'Baden-Baden' nell'Alto Medioevo, dando il suo nome ai Margravi di Baden."
 erbach_desc: "Nel tardo XVIII secolo, Erbach si sviluppò in un importante centro per l'intaglio dell'avorio dopo che il Conte Francesco I di Erbach, spinto dalla sua passione per le antichità, finanziò una corporazione locale di intagliatori d'avorio."
 manhattan_desc: "Originariamente abitata dal popolo Lenape, l'isola che essi chiamavano Manhatta fu acquistata dai coloni Olandesi per 60 fiorini in merci. Qui, gli Olandesi costruirono un forte, la sede del potere per la città di Nuova Amsterdam."
 doncaster_desc: "Un tempo forte romano di Danum, entro il 1337 Doncaster era diventata una città mercato dello Yorkshire sulla Grande Strada del Nord, dove viaggiatori e commercianti trasportavano merci tra Londra e il nord."
 kitchissippi_desc: "Chiamato come il fiume Kichi Sibi, qui i popoli Anishinaabe cacciavano e commerciavano fino a quando l'insediamento Britannico espanse il commercio del legname, e in seguito la rese la sede dell'amministrazione coloniale."
 saint_marceilin_desc: "Fondata nell'XI secolo, Saint-Marcellin fu la sede del Consiglio del Delfinato tra il 1337 e il 1340. Divenne famosa per il suo formaggio a pasta molle con crosta fiorita, servito a Luigi XI nel 1461."
 caerphilly_desc: "Sede del carbone della più alta qualità in Europa, le Valli Gallesi divennero un centro per la produzione di ferro nella seconda metà del XVIII secolo."
 grenoble_desc: "Grenoble è una città modesta ma strategica immersa nelle Alpi francesi, che funge da capitale del Delfinato. Circondata da fiumi e montagne, è protetta da mura e dominata dalla fortezza della Bastiglia. La vita si concentra attorno alla cattedrale e alle strade strette e tortuose piene di mercanti, artigiani e contadini che portano merci dalle valli circostanti."
 kinsale_desc: "Kinsale è una piccola ma vivace città portuale sulla costa meridionale dell'Irlanda, protetta dal suo profondo porto naturale. La pesca e il commercio costiero sostenevano gran parte della sua popolazione, con mercanti che scambiavano pesce salato, pelli e lana con vino, sale e beni di lusso dall'Iberia e dalla Francia. Le strade strette si raggruppavano intorno alle banchine, dove i marinai locali si mescolavano a commercianti stranieri occasionali. Sebbene di dimensioni modeste, il porto di Kinsale La rendeva strategicamente preziosa, una porta tra l'Irlanda e l'Europa continentale."
 stockton_desc: "Stockton è un insediamento anglosassone sulla riva settentrionale del fiume Tees, ed era scarsamente popolato finché il Vescovo liberò i servi dei borghi, rendendola attraente per gli artigiani. Divenne un importante mercato per l'esportazione di lana e l'importazione di vino, sebbene non sarebbe stata sede di una popolazione significativa fino alla Rivoluzione Industriale."
 kunow_desc: "Parte importante dei possedimenti del Vescovado di Cracovia, con una parrocchia esistente dal 1281, il suo nome deriva probabilmente dalla martora, o #italic kuna#! in polacco, che era abbondante nelle foreste locali."
 lublin_desc: "Lublino fu fondata come insediamento a cavallo del XII e XIII secolo e ricevette il suo statuto da Ladislao 'il Gomito Alto' nel 1317. Nei secoli successivi, la città divenne un importante centro commerciale e nel XVI secolo visse il suo Secolo d'Oro, arricchendosi grazie all'Unione di Lublino e all'esteso commercio, soprattutto con l'Oriente."
 kendal_desc: "Kendal fu fondata con un forte romano sulla riva del fiume Kent nel I secolo d.C. La città crebbe sotto il dominio Normanno, ottenendo i diritti di mercato nel 1189 dal Re Riccardo I in cambio di denaro per la sua crociata, il che portò maggiore prosperità alla città. Divenne un centro medievale per il commercio della lana e il castello principale fu di proprietà della famiglia Parr, di cui Caterina Parr, Regina consorte di Enrico VIII, è il membro più famoso."
 cairo_desc: "Fondata nel 969 dal generale fatimide Jawhar aṣ-Ṣiqillī accanto all'antica fortezza romana di Babilonia, Al-Qāhira, 'La Vittoriosa', soppiantò rapidamente Alessandria come cuore dell'Egitto. Sotto gli Ayyubidi e i Mamelucchi crebbe fino a diventare la città più popolosa del mondo islamico, i cui mercati e moschee attiravano mercanti, studiosi e pellegrini da tre continenti. Quando i Mongoli distrussero Baghdad nel 1258, Il Cairo si eresse come capitale incontestata della civiltà islamica, una città di straordinaria grandezza i cui minareti si innalzavano sopra una valle fluviale che aveva sostenuto la vita umana fin dall'alba della storia."
 dadu_desc: "Nelle pianure a sud dei Monti Tàiháng, Kublai Khan innalzò Dàdū, 'Grande Capitale', come sede della sua dinastia Yuán nel 1267, sulle rovine della Zhōngdū della dinastia Jīn. Marco Polo rimase meravigliato dalla sua grandezza, descrivendo una città di ampi viali, vasti palazzi e magazzini stracolmi della ricchezza di tutta la Cina. Anche mentre il potere mongolo declinava, la posizione della città alla porta settentrionale tra le steppe e il cuore cinese ne assicurò la persistenza come centro imperiale."
 venice_desc: "Sorta dalle barene della laguna adriatica, Venezia fu forgiata dalla necessità in ambizione. I rifugiati in fuga dalle invasioni longobarde si rifugiarono per primi sulle sue isole, e nel IX secolo la città era già cresciuta in una repubblica marittima governata dal suo Doge elettivo. Dal suo Arsenale e dai suoi banchi di cambio, i mercanti veneziani dominavano rotte commerciali che si estendevano dal Mar Nero al Levante, facendo di Venezia la città più ricca della Cristianità e l'indiscussa padrona del commercio mediterraneo."
 moscow_desc: "Fondata come modesto forte di legno da Yuri Dolgorukiy nel 1147 sulle rive del fiume Moscova, Mosca rimase a lungo nell'ombra delle più antiche città della Rus'. Ma sotto il giogo mongolo, i principi moscoviti si dimostrarono abili nella sopravvivenza e nell'espansione, raccogliendo tributi per l'Orda d'Oro mentre silenziosamente assorbivano i principati vicini. La posizione di Mosca al crocevia delle rotte fluviali settentrionali le diede il punto d'appoggio commerciale da cui crebbe costantemente, e all'inizio del XIV secolo il suo grande principe esercitava un potere maggiore di qualsiasi altro sovrano della Rus'."
 tenochtitlan_desc: "Verso il 1325, seguendo la leggenda secondo cui il loro dio Huitzilopochtli aveva loro promesso un'isola dove un'aquila si sarebbe posata su un cactus, il popolo Mexica fondò Tenōchtitlan su un'isola paludosa nel Lago Texcoco. Costruito in un luogo che offriva sia difesa naturale che accesso alle ricche risorse delle rive circostanti la valle, il giovane insediamento crebbe con notevole rapidità. Le sue strade sopraelevate, i giardini pensili e le tradizioni guerriere ne avrebbero fatto un giorno la più grande città delle Americhe e il cuore di un formidabile impero."
 delhi_desc: "Situata sulla riva occidentale dello Yamuna, Delhi è stata sede del potere per dinastie successive sin dall'antichità. La Dinastia degli Schiavi vi stabilì il Sultanato di Delhi nel 1206, e sotto sovrani come Iltutmish e Alauddin Khalji la città crebbe fino a diventare la preminente capitale islamica dell'Asia meridionale. Le sue grandi moschee, i suoi mercati e le sue fortezze attiravano studiosi e mercanti da tutto il mondo islamico, consacrando Delhi come la porta attraverso cui gran parte del subcontinente veniva governato."
 prague_desc: "Arroccata sopra un'ansa del fiume Moldava, Praga crebbe da un guado slavo fino a diventare una delle grandi città dell'Europa medievale. La dinastia dei Přemyslidi eresse il suo castello e la sua cattedrale sul promontorio roccioso di Hradčany, e ai suoi piedi attecchì una florida città mercantile. Sede dei re di Boemia e crocevia naturale tra l'Europa orientale e occidentale, Praga attirava mercanti, artigiani e studiosi tedeschi ed ebrei, diventando all'inizio del XIV secolo una delle città più popolose e prospere a nord delle Alpi."
 vienna_desc: "I Romani la chiamarono #italic Vindobona#!, insediando una fortezza legionaria sul Danubio per proteggere la frontiera settentrionale dell'impero. Dopo che il Periodo delle Migrazioni travolse l'ordine romano, essa riemerse come sede dei margravi Babenberg, che innalzarono una città degna delle loro ambizioni sullo stesso terreno strategico. Quando gli Asburgo soppiantarono i Babenberg nel 1278, Vienna divenne il perno di un impero dinastico, e la sua posizione al crocevia della valle del Danubio la rese una delle città più strategicamente contese del Sacro Romano Impero."
 baghdad_desc: "Fondata nel 762 dal califfo abbaside al-Manṣūr sulla riva occidentale del Tigri, Baghdad fu concepita fin dall'inizio per essere il centro del mondo. Il suo impianto circolare, la leggendaria Città Rotonda, poneva il palazzo del califfo e la grande moschea al suo cuore, circondati da mercati e residenze che si irradiavano verso l'esterno. All'apice del potere abbaside ospitava oltre un milione di anime, e la sua Casa della Saggezza attirava studiosi da tutto il mondo conosciuto per tradurre, discutere e scoprire. Il sacco mongolo del 1258 distrusse questa età d'oro, ma la città resistette, rimanendo la più grande metropoli del cuore della Mesopotamia."
 florence_desc: "A cavallo dell'Arno nel cuore della Toscana, Firenze crebbe da colonia romana a città di mercanti e banchieri che riformarono il commercio europeo. Le grandi case bancarie — i Bardi, i Peruzzi e gli Strozzi — estesero il loro credito attraverso i regni, e il fiorino d'oro che coniarono divenne la moneta standard del commercio internazionale. Scossa dalla rivalità tra #italic Guelfi#! e #italic Ghibellini#! e governata dalle sue potenti corporazioni, Firenze univa un fiero orgoglio civico a una straordinaria ricchezza, gettando le basi per la fioritura artistica e intellettuale che presto l'avrebbe resa l'invidia del mondo."
 samarkand_desc: "Una delle città più antiche dell'Asia Centrale, Samarcanda si ergeva a cavallo della Via della Seta, dove le carovane che portavano seta, spezie e idee passavano tra la Cina e il Mediterraneo. Sotto i Samanidi e i Karakhanidi fiorì come importante centro islamico di sapere e artigianato, i suoi artigiani rinomati in tutto il mondo conosciuto per le lavorazioni in metallo e la produzione di carta. Sebbene devastata dagli eserciti di Genghis Khan nel 1220, la posizione della città sulle grandi rotte commerciali ne assicurò la rinascita, con i suoi bazaar e le sue officine che tornarono ad attirare il commercio di mezzo mondo."
 novgorod_desc: "Signor Novgorod il Grande, come la chiamavano con orgoglio i suoi cittadini, crebbe da un emporio commerciale vichingo sul fiume Volchov fino a diventare la più potente repubblica mercantile dell'Europa settentrionale. La sua assemblea elettiva, il #italic veče#!, governava con una voce democratica raramente udita altrove nel mondo feudale, e i suoi partner commerciali anseatici portavano pellicce, cera e ambra di Novgorod sui mercati da Londra a Lubecca. Mentre altre città della Rus' cadevano sotto la devastazione mongola degli anni 1230, la posizione settentrionale di Novgorod la risparmiò, lasciandola la città più ricca e indipendente di tutta la Rus'."
 lisbon_desc: "Occupando un porto naturale dove il Tago incontra l'Atlantico, Lisbona ha accolto marinai e mercanti sin dai tempi fenici. I Romani la fortificarono come #italic Olisipo#!, e nell'VIII secolo i suoi governanti mori la trasformarono in una prospera città di moschee e palazzi. Dopo che Alfonso I la conquistò nel 1147 con l'aiuto di cavalieri crociati, Lisbona divenne la capitale del nascente Regno del Portogallo e un vitale porto atlantico, il suo porto profondo e lo sguardo verso ovest già puntati verso l'oceano inesplorato oltre."
 sevilla_desc: "A cavallo del Guadalquivir nelle fertili pianure dell'Andalusia, Siviglia fu uno dei gioielli della Spagna moresca. Sotto gli Omayyadi e poi gli Almohadi fiorì come centro di cultura, scienza e commercio, con la sua grande moschea che si innalzava lungo il fiume a testimonianza della portata della civiltà islamica in Iberia. Riconquistata da Ferdinando III di Castiglia nel 1248, la città conservò il suo carattere cosmopolita e divenne la città più ricca della Spagna cristiana, il suo porto fluviale incanalando le ricchezze dell'Andalusia verso il resto del mondo."
 hangzhou_desc: "Conosciuta nel suo periodo d'oro come #italic Kinsai#!, che significa 'capitale temporanea', Hángzhōu servì come sede della dinastia Sòng meridionale dopo che il nord cadde sotto i Jurchen Jīn nel 1127. Marco Polo, che la visitò nel tardo XIII secolo, la definì la più grande città del mondo, meravigliandosi dei suoi canali, dei mercati della seta e delle grandi piazze dove merci di ogni genere cambiavano di mano. Anche dopo la conquista mongola del 1279, la sua posizione alla testa del Gran Canale e la sua maestria nei commerci di seta e porcellana ne assicurarono la sopravvivenza come una delle principali città commerciali della Cina."
 bruges_desc: "All'apice del commercio medievale, Bruges fu il grande mercato dell'Europa settentrionale, dove galee veneziane, cocche anseatiche e caravelle iberiche scaricavano tutte le loro merci. Fondata su un'insenatura di marea che la collegava al Mare del Nord, le sue sale dei tessuti e la sua borsa, considerata la prima del mondo, ne fecero la capitale finanziaria del nord. Dalla lana inglese alle spezie levantine, la ricchezza del mondo conosciuto scorreva attraverso i suoi canali e i suoi banchi di cambio."
 cologne_desc: "Fondata come #italic Colonia Claudia Ara Agrippinensium#! dai Romani nel 50 d.C., Colonia crebbe fino a diventare la più grande città della Germania medievale e uno dei più potenti arcivescovadi del Sacro Romano Impero. La magnifica cattedrale gotica, iniziata nel 1248 per custodire le reliquie dei Re Magi, si innalzò come simbolo dell'ambizione e della fede della città. Città libera imperiale e membro fondatore della Lega Anseatica, Colonia dominava la vitale rotta commerciale del Reno e fungeva da porta tra il Mare del Nord e il cuore dell'impero."
 bursa_desc: "Annidata ai piedi delle pendici del monte Olimpo di Bitinia, Bursa era una prospera città bizantina quando il capo ottomano Orhan la conquistò nel 1326 dopo un assedio durato un decennio. Orhan ne fece la prima vera capitale dello stato ottomano, innalzando moschee, caravanserragli e un bazar coperto che avrebbero definito il carattere della città per secoli. Capolinea occidentale delle carovane della Via della Seta provenienti dall'Oriente e produttrice di alcuni dei più pregiati tessuti di seta al mondo, Bursa crebbe in una città di straordinaria ricchezza, il seme da cui sarebbe fiorito l'impero ottomano."
 kyoto_desc: "Quando l'Imperatore Kanmu trasferì qui la corte imperiale nel 794, chiamandola #italic Heian-kyō#!, che significa 'Capitale della Pace e della Tranquillità', Kyōto divenne il cuore della civiltà giapponese per secoli. La sua griglia di ampi viali, costellata di residenze aristocratiche e templi buddisti, ospitava la cultura di corte più raffinata del mondo, producendo la poesia, la pittura e la letteratura del periodo Heian. Sebbene scossa ripetutamente da guerre civili, incendi e dall'ascesa dei samurai, la città resistette come sede dell'imperatore e anima culturale del Giappone."
 timbuktu_desc: "Sorta ai margini del Sahara, in un'ansa del fiume Niger, Timbuctù crebbe da un campo stagionale tuareg fino a diventare una delle grandi città dell'Africa medievale. Sotto l'Impero del Mali divenne un crocevia del commercio transahariano, dove le carovane che portavano sale dal nord incontravano l'oro e l'avorio in viaggio dal sud. Le sue moschee e le sue #italic madrase#! attiravano studiosi islamici da tutto il continente, facendone una città di sapere le cui biblioteche custodivano decine di migliaia di manoscritti di teologia, matematica e astronomia."
 barcelona_desc: "Fondata come colonia romana di #italic Barcino#! nel I secolo a.C., Barcellona crebbe fino a diventare la capitale della Contea di Catalogna e, nel XII secolo, il motore marittimo della Corona d'Aragona. La sua flotta mercantile e i suoi consolati si estendevano dalle Baleari alla Sicilia, e dalla Sardegna ai porti crociati della Grecia, facendone la potenza navale dominante del Mediterraneo occidentale. Sui pendii sotto la sua grande cattedrale e le antiche mura romane, la città brulicava del commercio di una potenza marittima che guardava al mare per la sua ricchezza e il suo destino."
 cordoba_desc: "Nella sua epoca d'oro Cordova fu la più grande città dell'Europa occidentale, una città di mezzo milione di anime, di strade pavimentate e bagni pubblici, di biblioteche che eclissavano qualsiasi cosa la Cristianità potesse offrire. Sotto 'Abd ar-Raḥmān III, che si proclamò Califfo nel 929, divenne la capitale di un califfato rivale che sfidava gli Abbasidi a Baghdad e i Carolingi a nord. Studiosi come Averroè e Maimonide ne percorrevano le strade, e la sua Grande Moschea, la #italic Mezquita#!, si ergeva come monumento alla straordinaria civiltà che aveva attecchito sul suolo iberico. La conquista della città da parte di Ferdinando III di Castiglia nel 1236 pose fine a quest'epoca, ma la sua eredità sopravvisse nel sapere che aveva preservato e trasmesso al resto del mondo."
 damascus_desc: "Una delle città più antiche ininterrottamente abitate al mondo, Damasco domina una fertile oasi ai piedi dei monti dell'Anti-Libano, i suoi mercati alimentati dalle acque del fiume Barada. Capitale del Califfato Omayyade nel VII e VIII secolo, si trovava al centro del più grande impero che il mondo avesse mai visto, con la sua Grande Moschea che si ergeva come uno dei massimi capolavori dell'architettura islamica. Sebbene gli Abbasidi spostassero il potere a Baghdad, Damasco perdurò come una delle principali città commerciali e culturali del Levante, i suoi bazar commerciando seta, spade finissime e le profumate rose per cui era famosa."
 angkor_desc: "Nel profondo delle foreste del Sud-est asiatico continentale, i re khmer di Angkor costruirono una capitale senza pari. Iniziato sotto Suryavarman II all'inizio del XII secolo, il vasto complesso templare di Angkor Wat era dedicato a Vishnu e concepito come immagine terrena del cosmo, con i suoi fossati che rappresentavano l'oceano cosmico e le sue torri le vette del monte Meru. Al suo apice, la vasta regione di Angkor era sostenuta da un intricato sistema di bacini e canali d'irrigazione, facendone uno dei più estesi complessi urbani del mondo preindustriale."
 vijayanagar_desc: "Fondata nel 1336 sulla riva meridionale del fiume Tungabhadra dai fratelli Harihara e Bukka Raya, Vijayanagar, la 'Città della Vittoria', fu eretta come bastione della civiltà indù contro il potere espansionistico del Sultanato di Delhi. Protetta dal Tungabhadra e dal suo aspro paesaggio di massi granitici e gole rocciose, la giovane capitale dominava già le fertili pianure del Deccan centrale. Da questa roccaforte sarebbe cresciuto un impero destinato a durare più di due secoli, i suoi mercati attirando mercanti e merci da tutto il mondo dell'Oceano Indiano."
 naples_desc: "Fondata come colonia greca di Neapolis intorno al 600 a.C. sulle rive della sua spettacolare baia, la città passò per mani romane, bizantine, normanne e sveve prima che la dinastia angioina ne facesse la capitale del Regno di Napoli nel 1266. Sotto gli Angioini divenne una delle grandi corti regali dell'Europa medievale e la città più popolosa d'Italia, il suo porto incanalando le ricchezze del Mezzogiorno verso il resto del mondo. La corte di Napoli attirava studiosi, artisti e teologi, tra cui Tommaso d'Aquino, che qui insegnò e morì, facendone un centro di vita intellettuale non meno che di potere dinastico."
 milano_desc: "Elevandosi nel cuore della pianura padana, le origini di Milano come insediamento celtico furono spazzate via quando i Romani la fecero #italic Mediolanum#!, per un tempo capitale di fatto dell'impero d'occidente. Dopo che le migrazioni barbariche ridussero il suo splendore, la città rinacque come libero comune, respingendo Federico Barbarossa e i suoi eserciti imperiali nella Battaglia di Legnano nel 1176. Sotto la famiglia Visconti, che prese il potere signorile nel tardo XIII secolo, Milano divenne sede di una signoria che assorbì costantemente le città circostanti della Lombardia, rendendola la forza dominante nell'Italia settentrionale."
 genoa_desc: "Riparata dietro l'arco dell'Appennino Ligure, Genova costruì la propria grandezza interamente sul mare. I suoi mercanti e ammiragli ritagliarono un impero marittimo di empori e colonie che si estendeva dal Mar Nero all'Atlantico, e le sue flotte si scontrarono ripetutamente con quelle di Venezia per il dominio del commercio mediterraneo. Spinta dall'incessante ambizione delle sue grandi famiglie, i Doria, i Grimaldi e gli Spinola, la repubblica si guadagnò il fiero epiteto di #italic La Superba#! e dimostrò che una città quasi priva di un entroterra potesse comunque diventare una delle potenze più ricche della Cristianità."
 bologna_desc: "Fondata come città etrusca di #italic Felsina#! e più tardi come colonia romana di #italic Bononia#!, Bologna si trova ai piedi dell'Appennino, dove la Via Emilia incontra le strade che salgono verso la pianura del Po. È nota soprattutto per la sua università, fondata nel 1088 e la più antica del mondo, che attirava studenti di diritto, medicina e filosofia da ogni angolo d'Europa alle sue aule e all'ombra delle sue due torri medievali. La ricchezza dei suoi mercanti, l'autorità dei suoi vescovi e l'indipendenza del suo comune fecero di Bologna uno dei premi più contesi nella politica dell'Italia medievale."
 palermo_desc: "Culla tra due promontori sulla costa settentrionale della Sicilia, Palermo fu fondata da mercanti fenici e crebbe in una grande città sotto il dominio cartaginese e poi bizantino, prima che la conquista araba del IX secolo la trasformasse in una fiorente metropoli islamica di moschee, giardini e bazar. I re normanni che la sottrassero alle mani arabe nel 1072 costruirono su questa eredità cosmopolita con risultati straordinari, fondendo tradizioni arabe, bizantine e latine in splendide cappelle e palazzi regali che proclamavano una civiltà senza pari nella Cristianità. Capitale del Regno Normanno di Sicilia e poi dell'Impero Svevo, Palermo divenne una delle corti regali più raffinate e potenti del mondo medievale."
 verona_desc: "A cavallo dell'Adige all'estremità meridionale delle Alpi, Verona è stata un luogo di passaggio sin dall'antichità, il suo grande anfiteatro romano, uno dei più grandi e meglio conservati del mondo, ancora oggi si eleva sopra strade dove legioni e mercanti un tempo si muovevano in egual misura. Sotto la famiglia della Scala, gli Scaligeri, che presero il potere nel tardo XIII secolo, divenne una delle più forti #italic signorie#! dell'Italia settentrionale, i suoi signori dominando il Veneto e proiettando la loro influenza verso l'Adriatico. Tra coloro che trovarono rifugio alla corte scaligera vi fu Dante Alighieri, che stava completando la sua #italic Commedia#! sotto il patronato di Cangrande della Scala durante i suoi lunghi anni di esilio fiorentino."
 siena_desc: "Costruita su tre colli nel cuore della Toscana, Siena fu una delle grandi potenze dell'Italia medievale, la sua ricchezza fondata sui commerci bancari e laniero che fecero delle famiglie mercantili senesi creditrici tanto di re quanto di papi. La feroce rivalità della città con Firenze, a poco più di cinquanta chilometri a nord, forgiò la storia di entrambe per generazioni, mentre la grande piazza centrale, il Campo, fu il palcoscenico della vita civica e dei drammi politici di uno dei comuni più fieri d'Italia. I dipinti di Duccio di Buoninsegna e dei fratelli Lorenzetti fecero di Siena uno dei massimi centri dell'arte gotica in Europa."
 pisa_desc: "Alla foce dell'Arno, Pisa costruì uno dei grandi imperi marittimi del Mediterraneo medievale, le sue flotte razziando Palermo nel 1063, sconfiggendo i corsari saraceni per tutto il Tirreno e fondando colonie commerciali dalla Sardegna ad Antiochia. Arricchiti da questi commerci, i pisani innalzarono lo straordinario complesso di cattedrale, battistero e campanile sul #italic Campo dei Miracoli#!, monumenti a una città la cui ricchezza e sicurezza, al culmine del XII secolo, parevano senza limiti. Sebbene la catastrofica disfatta subita da Genova nella battaglia della Meloria del 1284 spezzasse la potenza navale pisana, la città e i suoi straordinari monumenti perdurarono."
 padova_desc: "Fondata secondo la leggenda dall'eroe troiano Antenore e florida come una delle città più ricche dell'Italia romana, Padova crebbe nel Medioevo in un prospero comune nel cuore del Veneto. La sua università, fondata nel 1222 da studiosi che si allontanarono da Bologna, divenne rapidamente uno dei principali centri di diritto e medicina d'Europa, attirando studenti da tutto il continente. All'inizio del XIV secolo il grande pittore Giotto trasformò l'interno della sua Cappella degli Scrovegni in una pietra miliare dell'arte occidentale, mentre la città stessa prosperava sotto il governo della famiglia Carrara come corte di sapere e ambizione."
 ferrara_desc: "Sorta ai margini delle paludi del delta del Po, Ferrara si sviluppò da un modesto guado fluviale in una città modellata dalle ambizioni della dinastia d'Este, che vi si stabilì come signora nel XIII secolo. Sotto il loro lungo mecenatismo la città divenne un centro di cultura cavalleresca e di raffinata vita di corte, i suoi signori ospitando poeti, giostre e dibattiti dotti mentre navigavano con cura le rivalità tra Milano, Venezia e lo Stato della Chiesa. Le ampie strade rettilinee e l'imponente castello estense che definivano il carattere di Ferrara erano emblematici di una città dove ordine ed eleganza contavano quanto mura e soldati."
 parma_desc: "Fondata dai Romani sulla Via Emilia nel 183 a.C., Parma divenne una delle grandi città della pianura lombarda, la sua posizione sulla grande strada tra Milano e Bologna e le sue fertili terre circostanti facendone un premio costantemente prospero e conteso. Come libero comune fu tra i membri più vigorosi della Lega Lombarda contro Federico Barbarossa, e dopo anni di amare lotte fazionarie tra famiglie guelfe e ghibelline passò per le mani di successivi signori. La sua cattedrale e il suo battistero, innalzati nello stile romanico del XII secolo, esprimevano una pietà civica e una ricchezza che sopravvissero alle turbolenze politiche della sua età comunale."
 mantova_desc: "Circondata su tre lati dai laghi formati dal lento fiume Mincio, Mantova occupa uno dei siti più naturalmente defendibili dell'Italia settentrionale ed è abitata sin dall'Età del Bronzo. I Romani la celebrarono come luogo di nascita di Virgilio, il più grande dei loro poeti, e il destino della città è stato a lungo plasmato dalle ambizioni artistiche e letterarie dei suoi signori. All'inizio del XIV secolo la famiglia Gonzaga stava emergendo qui, e sotto il suo lungo patronato Mantova sarebbe diventata una delle corti più coltivate e raffinate d'Italia."
 lucca_desc: "Racchiusa nel suo antico reticolo stradale romano e circondata dalla ricca campagna serica della Garfagnana, Lucca fu una delle città più ricche dell'Italia medievale. I suoi mercanti si diffusero per l'Europa, le loro case bancarie e il commercio della seta rendendo il nome #italic Lucchese#! sinonimo di tessuti pregiati sui mercati di Parigi, Londra e Bruges, mentre in patria la città accumulava ricchezza sufficiente a costruire una delle più belle collezioni di chiese romaniche della Toscana. Sebbene minacciata ripetutamente da Pisa e Firenze, Lucca si aggrappò alla propria indipendenza con notevole tenacia, le sue solide mura e la sua fiera fierezza civica mantenendola libera molto dopo che città rivali erano cadute sotto il dominio signorile."
 messina_desc: "Dominando lo stretto che separa la Sicilia dalla terraferma italiana, Messina fu fondata da coloni greci che la chiamarono #italic Zánklē#! per la forma di falce ricurva del suo porto, e la sua posizione ne fece fin dall'inizio uno dei grandi porti strategici del Mediterraneo. Fu attraverso Messina che i Normanni iniziarono la conquista della Sicilia nel 1061, e attraverso il suo porto che eserciti di ogni epoca successiva, Angioini, Hohenstaufen e crociati diretti in Terra Santa, passarono tra oriente e occidente. Sebbene scossa ripetutamente da terremoti e sconvolgimenti politici, il suo straordinario porto naturale assicurò che la città si risollevasse sempre, attirando in egual misura commercio e conflitto."
 brescia_desc: "Posta ai piedi delle prealpi, dove queste scendono verso la pianura lombarda, Brescia fu una delle grandi città industriali dell'Italia medievale, le sue fucine producendo armi e armature di rinomata qualità commerciate in tutta Europa. Come libero comune fu tra i membri più vigorosi della Lega Lombarda, e la resistenza dei suoi cittadini contro gli eserciti imperiali divenne una pietra miliare della tradizione comunale dell'Italia settentrionale. Stretta tra le grandi ambizioni di Milano e Venezia, la posizione strategica di Brescia alla porta dei passi alpini e la qualità dei suoi artigiani ne fecero un premio che nessuna delle due potenze era disposta a cedere."
 cremona_desc: "Impiantata dai Romani sulla riva meridionale del Po come colonia di frontiera nel 218 a.C., Cremona crebbe in una delle grandi città della pianura lombarda, la sua posizione sul fiume facendone un naturale snodo del commercio stradale e fluviale tra oriente e occidente. La città divenne sinonimo di lealtà ghibellina nelle amare guerre tra imperatore e papa, soffrendo per le sue alleanze ma guadagnando anche straordinario favore e ricchezza imperiali. Il suo profilo, dominato dal grande #italic Torrazzo#!, il più alto campanile medievale d'Italia, e da una selva di torri di famiglie rivali, proclamava l'orgoglio civico competitivo di una città dove il potere veniva ostentato con la stessa ferocia con cui veniva esercitato."
 pavia_desc: "Per due secoli dopo la caduta di Roma, Pavia fu la capitale del regno longobardo in Italia, sede dei suoi re guerrieri e custode della loro corona di ferro. Gli imperatori carolingi la mantennero come loro residenza italiana, e conservò il suo prestigio di città regia e di incoronazione molto dopo che il regno longobardo era stato assorbito nell'impero franco. La sua università, una delle più antiche d'Italia, fioriva già nel IX secolo, e la sua posizione sul fiume Ticino, a guardia dell'accesso occidentale alla pianura del Po, assicurò che Pavia restasse un premio conteso da ogni potenza che cercasse di dominare il nord."
 perugia_desc: "Arroccata su un colle a dominare l'alta valle del Tevere, Perugia fu una delle dodici città dell'antica Etruria e poi un prospero municipio romano, prima di emergere nel Medioevo come uno dei comuni indipendenti più formidabili e turbolenti dell'Italia centrale. Il suo grande Palazzo dei Priori e la Fontana Maggiore, completata nel 1278 con le sculture di Nicola e Giovanni Pisano, esprimevano un orgoglio civico e un'ambizione artistica che rivaleggiavano con qualsiasi cosa in Toscana. L'università fondata qui nel 1308 confermò la determinazione di Perugia di accompagnare il proprio potere militare e politico con una pari reputazione di sapere."
 ancona_desc: "Fondata come colonia greca da esuli siracusani sulla costa adriatica, Ancona prende il nome dalla parola greca per gomito, che descrive il promontorio curvo che ripara il suo porto da settentrione. Nel Medioevo crebbe fino a diventare il più importante porto dell'Adriatico centrale, i suoi mercanti commerciando con la Costantinopoli bizantina e i porti del Levante. Nonostante i ripetuti tentativi di papi e imperatori di sottometterla, Ancona mantenne una fiera indipendenza comunale, il suo porto e la sua flotta i fondamenti di una libertà gelosamente custodita per secoli."
 aquila_desc: "Una delle più giovani grandi città dell'Italia medievale, L'Aquila fu fondata attorno al 1254 dall'unione di quasi cento villaggi degli altipiani abruzzesi, ognuno dei quali avrebbe contribuito alla nuova città con una chiesa, una fontana, un quartiere e una campana. Posta in alto sugli Appennini nel cuore del regno montano, la città crebbe con sorprendente rapidità fino a diventare la capitale dell'Abruzzo, la sua posizione e le sue mura proteggendola dai signori rivali e dalle ambizioni della lontana corte napoletana. Le insolite circostanze della sua fondazione, con quasi cento comunità contribuenti che mantenevano ciascuna una quota di identità civica, diedero all'Aquila una peculiare complessità e un fiero orgoglio locale, senza pari in nessun'altra città del meridione italiano."
 ravenna_desc: "Per un secolo breve ma straordinario, Ravenna fu l'ultima capitale dell'Impero Romano d'Occidente, e quando Roma cadde nel 476 fu qui che le corti di Odoacre e poi del re ostrogoto Teodorico mantennero le forme e le tradizioni del governo romano. La riconquista bizantina del VI secolo ne fece l'avamposto occidentale di Costantinopoli, sede dell'Esarcato di Ravenna, e fu durante questa era di dominio imperiale greco che i suoi artigiani produssero gli straordinari cicli musivi che riempiono le sue chiese e i suoi mausolei. Sebbene da tempo oscurata da Bologna e dalle crescenti città della pianura del Po, Ravenna conservò nella sua straordinaria arte il ricordo di una gloria imperiale che non si trova altrove nell'Occidente latino."
 salerno_desc: "Annidata tra il mare e i monti della costiera amalfitana sul suo riparato golfo, Salerno fu scelta dal conquistatore normanno Roberto il Guiscardo come sua capitale dopo averla presa nel 1076, servendo come prima sede del potere normanno nell'Italia meridionale prima che la corte reale si trasferisse a Palermo. La città è rinomata soprattutto per la sua #italic Schola Medica Salernitana#!, la più antica scuola medica d'Europa, che fiorì dal IX secolo in avanti riunendo le tradizioni mediche greca, araba e latina che convergevano su questa cosmopolita costa meridionale. I medici formati a Salerno si diffusero per il continente, e i testi della scuola su anatomia, chirurgia e medicina erboristica modellarono la pratica della medicina in tutto il mondo medievale."
 syracuse_desc: "Fondata da coloni corinzi nel 734 a.C. su una piccola isola alla foce di un grande porto, Siracusa crebbe fino a diventare la più potente città greca del Mediterraneo occidentale, il suo potere sottolineato dalla catastrofica disfatta che inflisse alla spedizione ateniese del 415-413 a.C. Fu qui che Archimede ideò le sue leggendarie macchine da guerra con cui la città tenne a bada gli eserciti romani, e qui che conquistatori successivi, cartaginesi, romani, bizantini, arabi e normanni, riconobbero ciascuno un porto troppo prezioso per lasciarlo sguarnito. Sebbene da tempo oscurata da Palermo, Siracusa perdurò come la più grande città della Sicilia sud-orientale, il suo antico porto e le sue strade scavate nella roccia testimoniando ancora una civiltà la cui brillantezza aveva modellato l'intero mondo mediterraneo antico."
 trebizond_desc: "Arroccata su una stretta fascia costiera tra i monti Pontici e il Mar Nero, Trebisonda era una delle città più spettacolarmente situate del mondo medievale. Quando Costantinopoli cadde nella Quarta Crociata nel 1204, membri della dinastia dei Comneni vi si rifugiarono e fondarono l'Impero di Trebisonda, che perdurò come stato cristiano greco indipendente molto dopo che l'Impero latino stesso era crollato. A dominio dell'estremità orientale della rotta commerciale del Mar Nero e dei passi montani verso l'Armenia e la Persia, la città attirava mercanti genovesi e divenne un prospero capolinea occidentale della Via della Seta, i suoi mercati attirando merci dall'Asia centrale e oltre."
 smyrna_desc: "Una delle antiche città della costa egea, Smirne fu tra i siti che si contesero l'onore di aver dato i natali a Omero e divenne più tardi una delle Sette Chiese dell'Asia Minore menzionate nel Libro dell'Apocalisse. Sotto il dominio bizantino fu un porto di primo piano che collegava il ricco entroterra anatolico al commercio egeo, il suo porto frequentato da mercanti veneziani e genovesi che fondarono colonie commerciali lungo le sue banchine. Tra la fine del XIII e l'inizio del XIV secolo la città passò rapidamente di mano tra bizantini, genovesi e turchi aydinidi, la sua posizione eccezionale facendone un premio che nessuna potenza dell'Egeo poteva permettersi di ignorare."
 konya_desc: "Situata sull'alto altopiano dell'Anatolia centrale, Konya servì come capitale del Sultanato di Rum, lo stato turco che dominò l'Anatolia per gran parte del XII e XIII secolo. Sotto i sultani selgiuchidi la città fiorì come centro di arte, architettura e sapere islamici, i suoi mausolei piastrellati e le sue madrase trasformando un'antica città d'altopiano in uno dei grandi centri culturali del mondo islamico medievale. Fu qui che il poeta mistico Jalāl ad-Dīn Rūmī si stabilì e morì, e qui che i suoi seguaci fondarono l'ordine Mevlevi, i Dervisci Rotanti, la cui musica e cerimonia diffusero il nome della città ben oltre l'altopiano anatolico."
 sivas_desc: "A dominio dell'alto altopiano dove convergono le principali rotte tra l'Anatolia e la Persia, Sivas fu una delle grandi città-crocevia del Vicino Oriente medievale. Sotto il Sultanato di Rum crebbe in un'importante capitale provinciale di straordinaria ambizione architettonica, e le grandi madrase del XIII secolo, tra cui la celebre Gök Medrese e la Çifte Minareli, si annoverano tra i più pregevoli esempi di architettura selgiuchide in Anatolia. Dopo la conquista mongola la città servì come centro amministrativo chiave per le province anatoliche dell'Ilkhanato, i suoi mercati e caravanserragli incanalando il commercio a lunga distanza che scorreva tra l'Asia centrale e il Mediterraneo."
 kayseri_desc: "Conosciuta ai Romani come #italic Caesarea Mazaca#!, la principale città dell'antica Cappadocia, Kayseri servì per secoli come porta tra l'altopiano anatolico e le rotte che conducevano a est verso l'Armenia e la Mesopotamia. Uno dei primi centri del cristianesimo in Asia Minore, fu patria di San Basilio Magno, i cui scritti teologici e la cui regola monastica modellarono la chiesa d'Oriente e continuano a influenzare la pratica cristiana ancora oggi. Sotto i Selgiuchidi e i loro successori la città fu arricchita di moschee, madrase e caravanserragli, la sua duratura posizione di crocevia del commercio anatolico assicurando che passasse di mano tra bizantini, danishmendidi, selgiuchidi e mongoli, ciascun padrone riconoscendone a turno il valore."
 izmit_desc: "Fondata dal re bitinio Nicomede I nel III secolo a.C. e conosciuta ai Romani come #italic Nicomedia#!, la città servì come capitale orientale dell'Impero Romano sotto Diocleziano, che la scelse come sua residenza personale e cuore amministrativo delle province orientali. Fu da Nicomedia, nel 303, che Diocleziano lanciò la sua Grande Persecuzione dei cristiani, demolendo la chiesa principale a vista del palazzo imperiale e avviando l'ultimo e più severo assalto romano alla fede. Dopo la fondazione di Costantinopoli dall'altra parte delle acque fu gradualmente oscurata dalla sua grande vicina, ma conservò la sua importanza come porto di primo piano e centro episcopale per tutti i secoli bizantini."
 ankara_desc: "Posta su una collina rocciosa nel cuore dell'altopiano anatolico, Ankara fu un'antica città galata ben prima che i Romani ne facessero il capoluogo della loro provincia di Galazia. La sua posizione strategica, dove convergono le strade da Costantinopoli, dal Mar Nero, dal Levante e dalla Persia, le conferì una duratura importanza militare e commerciale, e il grande tempio innalzato dai suoi cittadini in onore di Augusto conservò iscrizioni che restano tra le più importanti testimonianze superstiti della storia romana. Sotto i Danishmendidi, i Selgiuchidi di Rum e i Mongoli, uno dopo l'altro, Ankara rimase lo snodo chiave dell'altopiano anatolico, una città il cui possesso significava il controllo delle strade che la attraversavano."
 amasya_desc: "Annidata in una profonda gola scavata dal fiume Yeşilırmak attraverso i monti Pontici, Amasya fu la capitale regale dell'antico regno del Ponto e la città natale del geografo Strabone, che la descrisse con amorevole dettaglio nella sua grande opera sulla geografia del mondo. Il suo scenario spettacolare, con tombe regali scavate nella roccia sulle pareti scoscese sopra il fiume, esprimeva la grandezza di un regno ellenistico che al suo apice estese il proprio dominio su gran parte dell'Asia Minore. Sotto il dominio bizantino, danishmendide, selgiuchide e mongolo la città conservò la sua importanza come centro principale delle pendici pontiche, la sua profonda gola e il suo scenario montano facendone una delle posizioni naturalmente più difendibili dell'Anatolia settentrionale."
 rodos_desc: "Per gran parte dell'antichità Rodi fu il porto più ricco e cosmopolita del Mediterraneo orientale, il suo leggendario Colosso, una delle Sette Meraviglie del mondo antico, che si ergeva un tempo all'ingresso del porto, e la sua legge marittima, la #italic Lex Rhodia#!, che regolava i commerci su tutto il mare conosciuto. Dopo secoli di influenza romana, bizantina e araba l'isola passò ai Cavalieri Ospitalieri nel 1309, che la fortificarono fino a farne una delle roccaforti cristiane più potenti del Mediterraneo orientale. Dietro le sue massicce mura, i Cavalieri trasformarono Rodi in un centro del potere crociato, le sue flotte di galee pattugliando le rotte marittime tra la Cristianità e l'Oriente islamico."
 corinth_desc: "A dominio sia dello stretto passaggio terrestre tra la Grecia continentale e il Peloponneso, sia dell'antica via di trasbordo attraverso l'Istmo, Corinto fu una delle città più ricche e strategicamente vitali del mondo greco antico. Nel suo periodo d'oro controllava il commercio tra l'Egeo e l'Adriatico, imponendo pedaggi sulle merci trascinate per via di terra tra i suoi due porti, e i suoi bronzi e le sue ceramiche decorate venivano esportati in ogni angolo del Mediterraneo. Sebbene devastata dal generale romano Lucio Mummio nel 146 a.C., fu rifondata da Giulio Cesare come colonia romana e perdurò come città di primo piano, passando per mani bizantine, latine e franche mentre potenze successive riconoscevano il valore dominante della sua posizione."
 candia_desc: "Quando la Quarta Crociata frantumò l'Impero Bizantino nel 1204, Venezia acquisì Creta e ne fece sua capitale Candia, trasformandola nel secolo successivo in uno degli avamposti veneziani più strategicamente importanti del Mediterraneo orientale. Le fertili pianure dell'isola sostentavano tanto le flotte quanto le colonie veneziane, e il porto di Candia serviva come punto di approvvigionamento critico sulle rotte marittime tra Venezia e il Levante. Sebbene la popolazione cretese si levasse in ripetute ribellioni contro i suoi signori veneziani, la città stessa fu costantemente fortificata e arricchita, le sue mura e i suoi magazzini proclamando una potenza coloniale intenzionata a tenere Creta a tempo indefinito."
 edirne_desc: "Fondata dall'imperatore romano Adriano sulle rive del fiume Marica e chiamata #italic Hadrianopolis#! in suo onore, Adrianopoli custodiva la via principale tra Costantinopoli e la frontiera danubiana e servì come centro militare e amministrativo chiave per la difesa della Tracia. Fu qui, nel 378, che la cavalleria visigota distrusse le legioni dell'imperatore Valente in una delle battaglie più fondamentali dell'antichità, una disfatta che mise in moto l'inserimento dei popoli germanici entro i confini dell'impero e contribuì al crollo finale dello stato romano d'Occidente. Sotto i Bizantini, Adrianopoli rimase la principale città della Tracia e la tradizionale prima linea di difesa di Costantinopoli contro le minacce provenienti da occidente."
 ioannina_desc: "Posta su una penisola rocciosa che si protende nel lago montano di Pamvotis, Giannina fu la principale città del Despotato d'Epiro, lo stato successore greco emerso nella Grecia nord-occidentale dopo che la Quarta Crociata frantumò il potere bizantino nel 1204. Sotto i despoti epiroti crebbe da modesta città di provincia in un importante centro di cultura e resistenza greca, le sue difese naturali rafforzate da solide mura e il suo lago fornendo al contempo sostentamento e protezione. Il paesaggio montano dell'Epiro le diede sicurezza e isolamento in egual misura, e Giannina servì come roccaforte vitale che ancorava la civiltà cristiana greca nel turbolento nord-ovest dell'antico impero."
 tarnovo_desc: "Arroccata su tre colline sopra un'ansa del fiume Jantra, Tărnovo fu scelta come sede del Secondo Impero Bulgaro quando i fratelli Asen e Petar guidarono la loro grande rivolta contro il dominio bizantino nel 1185. Sotto la dinastia degli Asen crebbe in una delle città fortificate più formidabili dei Balcani, la sua collina di Tsarevets coronata dal palazzo reale e dalla Cattedrale Patriarcale, simboli di uno stato che al suo apice nel XIII secolo si estendeva dal Danubio all'Egeo. Dopo l'affievolirsi dell'impero sotto la pressione mongola, Tărnovo perdurò come capitale di una Bulgaria ridotta ma fiera, le sue mura e la sua memoria imperiale definendo l'identità della città ben dentro il XIV secolo."
 dubrovnik_desc: "Riparata sotto le scogliere calcaree della costa dalmata, Ragusa crebbe da un rifugio di fondazione bizantina in uno dei piccoli stati più prosperi e diplomaticamente abili del Mediterraneo medievale. Come Repubblica di Ragusa, navigò le pressioni contrastanti di Venezia, Ungheria, Serbia e delle potenze emergenti oltre con straordinaria abilità, pagando tributi dove necessario mentre manteneva una rete di consolati mercantili che si estendeva dalla Fiandra al Levante. I suoi mercanti portavano merci e credito in tutto il mondo conosciuto, e l'elegante città di pietra che si ergeva dietro le sue massicce mura proclamava una civiltà che scelse il commercio e un'attenta diplomazia al posto dei costi della guerra."
 sredets_desc: "Conosciuta ai Romani come #italic Serdica#!, capoluogo della provincia della Dacia Mediterranea, la città che sarebbe diventata Sofia aveva già assistito a secoli di storia quando i Bulgari ne fecero un centro provinciale del loro impero. Fu a Serdica che l'imperatore Costantino convocò il grande Concilio del 343, uno dei principali sinodi del primo cristianesimo, e si dice che fu qui che considerò per la prima volta di fondare la sua nuova capitale imperiale prima di scegliere il sito sul Bosforo. Sotto gli imperi bizantino e bulgaro servì come crocevia chiave dove convergono le principali rotte dei Balcani, la sua posizione ai piedi del monte Vitosha assicurando che sopravvivesse a ogni conquista come premio degno di essere tenuto."
 ohrid_desc: "Posta sulle rive dell'antico lago che porta il suo nome, Ohrid acquisì importanza quando San Clemente, discepolo dei missionari Cirillo e Metodio, vi fondò la sua grande scuola di sapere slavo sul finire del IX secolo, formando migliaia di sacerdoti e studiosi nella nuova scrittura slava. Dopo la conversione della Bulgaria, Ohrid divenne sede del Patriarcato Bulgaro e poi dell'autocefalo Arcivescovado di Ohrid, uno dei più importanti centri religiosi del mondo ortodosso. Con la sua collina gremita di chiese e monasteri, la città si guadagnò il nome di Gerusalemme dei Balcani, la sua autorità spirituale modellando per secoli il cristianesimo dei popoli slavi meridionali."
 nis_desc: "Conosciuta ai Romani come #italic Naissus#!, Niš dominava la via principale tra la frontiera danubiana e Costantinopoli, nel punto dove si incontrano le valli dei fiumi Morava e Nišava, facendone una delle città più strategicamente vitali dei Balcani antichi. Fu qui, attorno al 272 d.C., che nacque l'imperatore Costantino il Grande, figlio dei Balcani occidentali che avrebbe rimodellato l'Impero Romano e l'intero corso della civiltà occidentale. Sebbene ripetutamente devastata, tra gli altri da Attila l'Unno, la posizione di crocevia della città assicurò la sua rinascita, e sotto il dominio bizantino, bulgaro e serbo rimase lo snodo chiave dei Balcani centrali."
 durres_desc: "Una delle città più antiche d'Europa, Durazzo fu fondata come colonia greca di Epidamno attorno al 627 a.C. da coloni di Corinto e Corfù, il suo eccellente porto naturale sull'Adriatico orientale conferendole un'immediata importanza commerciale. I Romani la conoscevano come #italic Dyrrachium#! e ne fecero il capolinea occidentale della Via Egnatia, la grande strada militare che attraversava i Balcani fino a Bisanzio, assicurando che per secoli ogni esercito in marcia da Roma verso oriente passasse per le sue porte. La sua posizione di porta tra l'Italia e i Balcani ne fece una delle città più contese della regione, il suo porto e le sue mura cambiando mano tra bizantini, normanni, veneziani e signori angioini nel corso dei secoli medievali."
 prizren_desc: "Annidata in una fertile valle sotto le vette dei Monti Šar, Prizren fu una città di antica fondazione che lo stato serbo medievale trasformò in uno dei suoi centri principali a partire dal XIII secolo. Sotto la dinastia dei Nemanjić crebbe in un'importante città amministrativa e commerciale, le sue chiese e i suoi monasteri ortodossi esprimendo la pietà e l'ambizione di sovrani serbi che si consideravano eredi della civiltà bizantina. All'inizio del XIV secolo era una delle città più importanti del regno serbo, i suoi mercati attirando mercanti da Ragusa, Venezia e da tutto il Levante per commerciare i metalli preziosi estratti dalle montagne circostanti."
 belgrad_desc: "Posta alla confluenza dei fiumi Sava e Danubio, dove la grande strada dall'Europa centrale scende nei Balcani, Belgrado è stata una porta fortificata sin dall'antichità, quando i Romani la chiamavano #italic Singidunum#! e vi stazionarono una legione a guardia della frontiera danubiana. Nel Medioevo la città passò tra bulgari, bizantini e ungheresi, la sua fortezza sulla collina sopra la confluenza dei fiumi facendone una delle roccaforti più contese dei Balcani. All'inizio del XIV secolo rappresentava un premio chiave nella lotta tra il Regno d'Ungheria e il nascente stato serbo, le sue mura vigilando sui fiumi che dividevano i mondi della Cristianità latina e ortodossa."
 mecca_desc: "Nel cuore dell'Arabia si ergeva la Ka'ba già prima del Profeta, un santuario di pietra verso cui le tribù della penisola compivano un pellegrinaggio annuale. Quando Muhammad nacque entro le sue mura nel 570 e qui ricevette la sua rivelazione, la Mecca divenne il centro spirituale di una fede che si diffuse attraverso tre continenti. Dopo che i Califfati sorsero e caddero, la città rimase sotto il governo degli Sharif, discendenti del Profeta, che a loro volta rispondevano al più potente sovrano musulmano dell'epoca. Dal 1269 i Mamelucchi d'Egitto ne sono i protettori, e ogni anno le loro carovane portano la nuova #italic kiswa#! attraverso il deserto per avvolgere la Ka'ba in seta nera fresca."
 aleppo_desc: "Una delle città più antiche del mondo, Aleppo era già conosciuta dagli Ittiti e dagli Accadi come crocevia del Levante settentrionale. Sotto l'emiro hamdanide Sayf ad-Dawla nel X secolo divenne una brillante corte araba di poeti e guerrieri, contendendo la frontiera bizantina tanto con versi scintillanti quanto con l'acciaio. Lo zengide Nūr ad-Dīn e il principe ayyubide aẓ-Ẓāhir Ḡāzī, figlio di Saladino, ricostruirono la sua grande cittadella in una delle fortezze più formidabili del mondo islamico. Saccheggiata dai Mongoli sotto Hulagu nel 1260, la città fu riconquistata dai Mamelucchi che la restaurarono come seconda città del loro regno siriano, i suoi mercati carovanieri incanalando seta e spezie tra l'Iraq e il Mediterraneo."
 adan_desc: "Riparata nel cratere vulcanico di un vulcano estinto, Aden ha servito da porto tra il Mar Rosso e l'Oceano Indiano fin dall'antichità, conosciuta ai marinai greci come #italic Eudaimon Arabia#!, 'Arabia Felice', per la ricchezza del suo commercio. La regina sulayhide Arwa la governò nell'XI secolo dalla sua sede di Jibla, e dopo l'ascesa degli Ayyubidi passò ai sultani rasulidi dello Yemen che la fecero motore marittimo del loro regno a partire dal 1229. Il suo porto attira mercanti egiziani diretti verso l'India e flotte indiane che portano pepe, cotone e porcellana verso occidente, e la dogana rasulide ai suoi molo è tra le più ricche del mondo islamico."
 hormuz_desc: "Per secoli il regno di Hormuz si ergeva sulla costa continentale del Golfo Persico, finché la minaccia delle incursioni mongole spinse il suo sovrano ad abbandonare la vecchia città per la piccola isola di Jarun, intorno al 1300. Lì i mercanti della nuova Hormuz innalzarono una città di case in pietra e grandi magazzini, la sua roccia priva d'acqua alimentata da cisterne e le sue fortune dal commercio di perle, cavalli e spezie indiane. Sotto il governo dei propri re, che rispondevano nominalmente ai signori di Kerman, l'isola divenne il grande emporio del Golfo, dove dhow arabi, caracche persiane e giunche indiane si riunivano ogni stagione per scambiare le merci di due oceani."
 tabriz_desc: "Situata in una fertile valle a nord del massiccio del Sahand, Tabrīz era stata una prospera città fin dai tempi sasanidi, ma si elevò ai primi ranghi quando gli Ilkhanidi di Persia la scelsero come loro capitale. Sotto Ghazan Khan, che abbracciò l'Islam nel 1295, e il suo successore Öljeitü, la città divenne il cuore di un impero che si estendeva dall'Oxus all'Eufrate, i suoi bazaar colmi di sete cinesi portate lungo le vie imperiali dello #italic yam#!. Il ministro Rašīd ad-Dīn, erudito e storico, innalzò il sobborgo di #italic Rab'-e Rašīdī#! come un vasto complesso di madrase, biblioteche e scriptoria che riuniva studiosi da tutta l'Eurasia. Quando l'Ilkhan Abū Sa'īd morì, Tabrīz era diventata una delle città più popolose e cosmopolite del mondo."
 isfahan_desc: "Irrigata dallo Zāyande-rūd e situata nel cuore dell'altopiano iraniano, Isfahan è stata una delle grandi città della Persia sin dai secoli sasanidi, quando era un insediamento gemello di Jay e del quartiere ebraico di Yahudiyya. Sotto il sultano selgiuchide Malik Shah e il suo vizir Niẓām al-Mulk nell'XI secolo divenne la capitale di un impero che si estendeva dall'Anatolia all'Asia Centrale, e la grande Moschea del Venerdì si innalzò al suo centro come uno dei massimi monumenti dell'architettura islamica. I Mongoli la saccheggiarono gravemente nel 1241, eppure i giardini, i ponti e le arti della città tornarono gradualmente a fiorire sotto il governo ilkhanide, i suoi tessitori e fabbri ancora oggi fornendo i mercati del mondo iranico."
 mosul_desc: "Dall'altra parte del Tigri rispetto alle rovine dell'antica Ninive, Mosul ha protetto il guado sulla strada tra la Siria e Baghdad sin dai primi secoli islamici. Sotto gli Hamdanidi e più tardi gli Atabeg di Zengi divenne una potente capitale di frontiera da cui 'Imād ad-Dīn Zengī lanciò la controcrociata che conquistò Edessa nel 1144 e avviò la lunga riconquista musulmana del Levante. La città è famosa per i suoi tessitori, che danno il nome al fine tessuto di cotone conosciuto in Europa come #italic mousseline#!, e i suoi fabbri e argentieri alimentano i mercati dell'alta Jazīra. Risparmiata dal peggio della catastrofe mongola grazie a una pronta sottomissione, rimase un importante centro ilkhanide sull'alto Tigri."
 samarra_desc: "Sulla riva del Tigri a nord di Baghdad, il califfo abbaside al-Mu'taṣim fondò Samarra nel 836 come vasta nuova capitale dove i suoi turbolenti reggimenti della guardia turca potessero essere acquartierati lontano dalla popolazione della vecchia città. Per quasi sessant'anni il più grande impero del mondo fu governato dai suoi ampi viali, dai suoi palazzi monumentali e dall'unico minareto a spirale della Grande Moschea, la più grande moschea mai costruita nel mondo islamico. Dopo che i califfi tornarono a Baghdad nel 892, la grande città si svuotò dei suoi cortigiani e soldati, ma il santuario del decimo e dell'undicesimo Imam la mantenne viva come centro di pellegrinaggio sciita, le sue rovine imperiali che ancora si innalzano sopra la pianura fluviale."
 bukhara_desc: "Per più di mille anni Bukhara è stata una delle grandi città dell'Asia Centrale, un centro commerciale sogdiano che gli emiri samanidi del IX e X secolo trasformarono nella brillante capitale di un Iran islamico. Il mausoleo in mattoni cotti di Esmā'īl Sāmānī si erge ancora oggi come meraviglia dell'architettura islamica delle origini, e il minareto Kalyan innalzato dai Karakhanidi nel 1127 domina da allora lo skyline. Quando Genghis Khan assalì la città nel 1220, si narra che sia entrato a cavallo nella Moschea del Venerdì e abbia ordinato che il Corano fosse gettato sotto gli zoccoli, e la distruzione che seguì fu quasi totale. Eppure sotto i khan Chagatai la città rinacque lentamente, le sue madrase tornando ad attirare gli studiosi che le avevano dato l'antico titolo di #italic Bukhara-ye Šarīf#!, 'Nobile Bukhara'."
 herat_desc: "Antica Aria degli Achemenidi, Herāt domina la fertile valle dell'Harī-rūd dove convergono le strade da Persia, Khorasan e India. Sotto i Ghaznavidi fu una brillante città di frontiera di poeti e mercanti, e i sultani Ghuridi, sorti nelle vicinanze nel XII secolo, la arricchirono di moschee e madrase prima che il loro impero si spingesse a sud verso l'Hindustan. I cavalieri mongoli di Tolui la saccheggiarono con spaventosa completezza nel 1221, ma dopo l'ascesa dei malik Kartidi nel 1245 la città fu progressivamente ricostruita come sede di un regno vassallo degli Ilkhanidi, la sua posizione sulla grande via est-ovest assicurandole prosperità duratura."
 kashgar_desc: "Situata al margine occidentale del Bacino del Tarim, dove convergono le strade da Transoxiana, Ferghana e Tibet, Kashgar è stata un'oasi della Via della Seta sin dall'antichità. Sotto i khan Karakhanidi del X e XI secolo divenne un importante centro della civiltà turco-islamica, patria del grande studioso Maḥmūd al-Kāšḡarī, il cui #italic Dīwān Luḡāt at-Turk#! raccolse le lingue dei popoli turchi per un pubblico abbaside. Dopo la conquista mongola la città passò ai khan Chagatai, le cui corti itineranti attraversavano la steppa tra il Tianshan e i Pamir, e i bazaar di Kashgar continuarono a far transitare il commercio di giada, cavalli e seta che diede alle oasi del Tarim la loro duratura ricchezza."
 lahore_desc: "Antica capitale della dinastia Hindu Shahi, Lahore fu conquistata nel 1021 da Maḥmūd di Ghazna e fatta capitale orientale del suo vasto impero, diventando la porta attraverso cui la civiltà islamica passò nella pianura indiana. Sotto i Ghaznavidi crebbe in una scintillante città di frontiera di moschee e madrase, patria del poeta persiano Mas'ūd Sa'd Salmān e dello studioso 'Alī Hujvīrī il cui santuario sufi, il #italic Data Darbar#!, attira pellegrini ancora oggi. Dopo l'ascesa del Sultanato Mamelucco di Delhi, la città servì come principale bastione musulmano contro i cavalieri mongoli che ripetutamente si abbattevano attraverso l'Indo, e sotto sultani come Balban le sue fortificazioni furono ricostruite per fronteggiare la steppa."
 varanasi_desc: "Tra le città più antiche abitate ininterrottamente al mondo, Varanasi, conosciuta ai suoi devoti come #italic Kāśī#!, la Città della Luce, si erge sulla riva occidentale del Ganges nel più sacro di tutti i luoghi induisti. I pellegrini vengono qui da ben prima della storia scritta per bagnarsi nelle acque del fiume e cercare liberazione dal ciclo delle rinascite, e i ghat che scendono verso il Ganges sono affollati di templi, asceti e le pire ardenti di coloro portati qui per morire. Gli eserciti ghuridi sotto Quṭb ad-Dīn Aybak saccheggiarono la città nel 1194 e rasero molti dei suoi templi, ma Varanasi si è sempre ripresa, i suoi tessitori di seta, lavoratori di ottone e studiosi sanscriti sostenendo una civiltà che nessun conquistatore ha ancora cancellato."
 madurai_desc: "Per più di mille anni Madurai è stata la capitale dei re Pandya del sud Tamil, una città il cui grande tempio dedicato alla dea Meenakshi coronava una civiltà di poeti, studiosi e aristocratici guerrieri. Le accademie letterarie Tamil, i #italic Sangam#!, si dice fiorissero qui nell'antichità, attirando i bardi delle corti meridionali per discutere e perfezionare la lingua. Malik Kafur, il grande generale di Alauddin Khalji di Delhi, assaltò la città nel 1311 e ne portò via il tesoro accumulato, e nel 1335 il governatore Tughluq Jalāl ad-Dīn Ḥasan proclamò l'indipendente Sultanato di Madurai, un fragile potere musulmano piantato nell'antico cuore Tamil."
 patna_desc: "Sulla riva meridionale del Ganges si ergeva un tempo l'antica #italic Pāṭaliputra#!, capitale dell'imperatore maurya Ashoka, dai cui palazzi il governo del primo stato imperiale indiano si estendeva dall'Afghanistan al Golfo del Bengala. L'ambasciatore greco Megastene rimase meravigliato dal suo palizzata di legno e dallo splendore della sua corte, e il pellegrino cinese Faxian la trovò ancora florida nel V secolo sotto i Gupta. Eppure, al tempo del Sultanato di Delhi, la grande capitale era decaduta nella modesta città di Patna, un avamposto provinciale del Bihar Tughluq dove l'eredità di una delle più grandi città dell'antichità era preservata solo nella memoria degli studiosi e nelle rovine lungo la riva del fiume."
 chittagong_desc: "Situata sugli ampi estuari dove i fiumi del Bengala orientale si versano nel Golfo del Bengala, Chittagong ha servito da porto tra l'India e il Sud-est asiatico sin dall'antichità. I geografi arabi la conoscevano come #italic Samandar#!, una città di mercanti le cui navi commerciavano fino in Cina, mentre il pellegrino tibetano Dhammapala nel X secolo descrisse i suoi monasteri. Contesa tra i re del Bengala, i sovrani di Arakan e i capi delle colline di Tripura, è passata di mano molte volte, e con la conquista del Bengala da parte del Sultanato di Delhi è passata sotto il governo musulmano, il suo porto rimanendo il principale sbocco orientale per il riso e il cotone del delta del Ganges."
 jinjiang_desc: "Conosciuta agli Arabi come #italic Zaytūn#! e a Marco Polo come uno dei due più grandi porti del mondo, Quánzhōu raggiunse una straordinaria importanza sotto le dinastie Sòng e Yuán come principale sbocco cinese verso l'Oceano Indiano. Il suo porto affollato di giunche dirette verso le Isole delle Spezie, l'India e il Golfo Persico, la città ospita interi quartieri di mercanti residenti arabi, persiani, tamil e armeni, le cui moschee, templi induisti e chiese cristiane si affiancano a monasteri buddisti e a un santuario manicheo. Marco Polo, che vi passò negli anni 1290, scrisse che per ogni nave carica di spezie che raggiungeva Alessandria, cento arrivavano a Zaytūn, e le entrate doganali del suo grande commercio ne fanno uno dei pilastri finanziari del tesoro imperiale Yuán."
 shangyuan_desc: "Sulla riva meridionale del Yangtze, dove il fiume si curva verso nord in direzione del mare, la città oggi chiamata Jiqing è stata capitale e roccaforte per più di mille anni. Gli antichi re di Wú, gli Jìn orientali e le dinastie meridionali dell'epoca post-Hàn governarono tutti tra le sue mura sotto i nomi di #italic Jianye#! e #italic Jiankang#!, facendone per secoli il cuore culturale della Cina meridionale. Quando i Jurchen conquistarono il nord nel XII secolo, la corte Sòng considerò brevemente di stabilirvi la nuova capitale, e dopo che i Mongoli travolsero l'impero, la città fu ricostruita come sede della prefettura di Jiqing, la sua posizione strategica sul basso Yangtze assicurandole duratura importanza tra le città del sud."
 wuxian_desc: "Nel cuore del delta del Yangtze, Sūzhōu, anticamente conosciuta come #italic Gusu#! e come la #italic Píngjiāng#! dell'era Sòng, fu fondata nel VI secolo a.C. come capitale del regno di Wú. Situata in un intricato reticolo di canali che le valse l'abbinamento proverbiale con Hángzhōu, 'Il Paradiso è in alto, Sūzhōu e Hángzhōu sono in basso', la città è da lungo tempo famosa per i suoi tessitori di seta, le sue ville-giardino dei letterati e la raffinatezza della sua cucina e della sua opera. Sotto i Sòng meridionali crebbe fino a diventare una delle città più ricche del sud, e sebbene la conquista mongola del 1276 abbia lasciato cicatrici, all'inizio del XIV secolo i giardini, le pagode e i mercati lungo i canali di Sūzhōu tornano ad attirare mercanti e studiosi da tutta la Cina."
 guangzhou_desc: "Alla foce del Fiume delle Perle, Guǎngzhōu accoglie navi straniere sin dalla dinastia Hàn, quando i suoi mercanti già commerciavano con le terre dei mari meridionali. Con la dinastia Táng, dhow arabi e persiani attraccavano ogni stagione ai suoi molo in tale numero che la città ospitava un quartiere straniero separato, governato da anziani mercanti musulmani, e nell'879 si narra che il rivoltoso Huang Chao abbia massacrato più di centomila residenti stranieri in un'unica, sanguinosa campagna. La conquista mongola portò una rinnovata prosperità quando Guǎngzhōu condivise il grande boom commerciale marittimo dell'era Yuán, il suo porto incanalando le merci del Lingnan verso il mondo mentre mercanti indiani e arabi tornano a riunirsi nelle sue locande e nei suoi magazzini."
 lhasa_desc: "Fondata nel VII secolo dall'imperatore tibetano Songtsen Gampo, che costruì il Tempio di Jokhang per custodire la sacra immagine del Buddha portatagli dalle sue regine nepalese e cinese, Lhasa fu per due secoli il cuore di un impero tibetano che rivaleggiò con la Cina Tang e governò dai Pamir fino al Golfo del Bengala. Dopo il collasso dell'impero nel IX secolo la città declinò, ma i templi di Jokhang e Ramoche rimasero il centro spirituale del buddismo tibetano. Quando i Mongoli travolsero l'altopiano nel 1240, nominarono gli abati del monastero di Sakya come loro viceré, e sebbene Sakya stessa resti la sede amministrativa, Lhasa sopravvive come città santa, attirando pellegrini che percorrono il Barkhor e si prostrano davanti al Jowo Śākyamuni."
 kamakura_desc: "Nel 1185 il signore della guerra Minamoto no Yoritomo strappò il potere alla corte imperiale di Kyoto e fece della città costiera di Kamakura la sede di un nuovo governo militare, il #italic bakufu#!, che da allora governa il Giappone in nome dell'imperatore. Sotto i regenti Hōjō la città è cresciuta in una capitale-fortezza di severa cultura samurai, circondata da montagne e dal mare, e il grande Buddha di bronzo fuso nel 1252 ancora medita sopra il suo recinto come monumento al nuovo buddismo di impronta zen che l'aristocrazia guerriera ha abbracciato. Fu da Kamakura che venne diretta la risposta alle invasioni mongole del 1274 e del 1281, entrambe respinte dalle case guerriere di Kyushu e dalle tempeste provvidenziali che valsero il nome di #italic kamikaze#!, i venti divini."
 hakata_desc: "Per secoli Hakata ha servito come principale finestra del Giappone sul continente, il porto attraverso cui le ambascerie della Cina Tang e Song, dei regni coreani e dei mercanti dei mari del sud raggiungevano le isole. I mercanti di Hakata nell'era Song mantenevano una Chinatown di magazzini in pietra e templi buddisti fondati da monaci cinesi, e la ricchezza che fluiva attraverso i suoi molo fece della città il porto più ricco di Kyushu. Fu sulle lunghe spiagge fuori Hakata che le flotte d'invasione mongole del 1274 e del 1281 sbarcarono, e dove i difensori del bakufu di Kamakura innalzarono il grande muro di pietra, il #italic genkō bōrui#!, i cui resti ancora tracciano la costa come memoriale della più disperata difesa nella storia giapponese."
 namgyeong_desc: "Situata in un bacino protetto da montagne dove il fiume Han si curva verso il Mar Giallo, l'area di Hanyang è abitata sin dalla preistoria ed è stata contesa nell'antichità tra i regni di Baekje e Goguryeo. Sotto la dinastia Goryeo il sito crebbe in importanza come #italic Namgyeong#!, o Capitale del Sud, una delle tre capitali secondarie che affiancavano la sede reale di Gaegyeong, e re successivi hanno considerato di trasferirvi la corte seguendo il consiglio dei geomanti che ne lodano la posizione favorevole. All'inizio del XIV secolo Hanyang era cresciuta in una sostanziale città Goryeo sotto la lasca sovranità degli Yuán mongoli, la sua posizione strategica sul fiume Han rendendola la porta naturale tra la penisola coreana e il mondo più vasto."
 pagan_desc: "Nella piana arida dell'alta Birmania, dove l'Irrawaddy si curva oltre colline brulle, il regno di Pagan fu fondato nell'XI secolo dal Re Anawrahta, che unificò i popoli di lingua birmana e abbracciò il buddismo Theravada portatogli dal monaco Shin Arahan. Per due secoli i suoi successori innalzarono migliaia di stupa, pagode e templi sulla piana attorno alla capitale, un vasto paesaggio sacro senza rivali nel mondo buddista, e la ricchezza del grande granaio di riso della Birmania nutrì studiosi e artigiani da tutta l'India e dallo Sri Lanka. Gli eserciti mongoli di Kublai Khan frantumarono il regno nel 1287, e all'inizio del XIV secolo il vero potere è passato ai capi Shan-birmani di Myinsaing e Pinya, l'antica capitale sopravvivendo come rovina sacra dove i pellegrini ancora vagano tra diecimila templi in rovina."
 sukhothai_desc: "Nei primi anni del XIII secolo i capi tailandesi dell'alto Chao Phraya si liberarono dal governo dei Khmer di Angkor e fondarono il regno di Sukhothai, il cui nome significa #italic Alba della Felicità#!. Sotto il Re Ramkhamhaeng, che regnò dal 1279 al 1298, il regno fiorì come brillante entità buddista Theravada che attirava monaci e artigiani dallo Sri Lanka, e l'iscrizione che il re eresse nel 1292 per commemorare le sue riforme è il più antico documento superstite nella scrittura tailandese che a lui stesso viene attribuita. Sebbene all'inizio del XIV secolo il potere di Sukhothai fosse già messo alla prova dai principati tailandesi emergenti del basso Chao Phraya, gli stupa dorati e le serene immagini del Buddha della città hanno stabilito lo standard per la civiltà tailandese."
 thang_long_desc: "Nel 1010 il re vietnamita Lý Công Uẩn trasferì la sua capitale dall'angusta cittadella di Hoa Lư a una nuova città sulle rive del Fiume Rosso, chiamandola #italic Thăng Long#!, il Drago Ascendente, dopo una visione avuta al suo arrivo. Sotto le dinastie Lý e Trần essa è diventata il cuore del Đại Việt, una città di pagode, sale d'esame e palazzi reali in cui la civiltà vietnamita ha riunito la propria identità distinta da influenze cinesi, cham e khmer. Tre volte gli eserciti mongoli di Kublai Khan si sono abbattuti attraverso la frontiera settentrionale per sottomettere il Đại Việt, e tre volte i soldati dei Trần, guidati dal grande generale Trần Hưng Đạo, li hanno sconfitti in battaglie ancora rievocate nella memoria vietnamita, la più famosa combattuta nel 1288 sulle acque disseminate di pali del fiume Bạch Đằng."
 trowulan_desc: "Nel 1293, dopo che la spedizione mongola a Giava era stata ingegnosamente rivolta contro l'usurpatore del regno di Singhasari, il principe giavanese Raden Wijaya fondò il nuovo regno di Majapahit e innalzò la sua capitale a Trowulan sul basso Brantas. Situata tra le ricche piane risicole di Giava orientale, la città è disposta con recinti murati in mattoni, grandi riserve d'acqua e imponenti porte i cui pannelli in terracotta celebrano le vittorie della nuova dinastia. Sotto il primo ministro Gajah Mada, giunto al potere negli anni 1320, Majapahit ha iniziato le campagne che estenderanno la sua sovranità su tutto l'arcipelago indonesiano, e Trowulan si trova sulla soglia della sua età d'oro come cuore di un grande impero delle Indie."
 palembang_desc: "Dal VII secolo fino alla fine del XIII, Palembang fu la capitale dell'impero marittimo di Śrīvijaya, le cui flotte dominavano lo Stretto di Malacca e i cui monaci fecero della città uno dei grandi centri del sapere buddista nelle Indie. Il pellegrino cinese Yijing, negli anni 670, esortò i suoi colleghi a studiare a Palembang prima di proseguire verso l'India, e i monasteri della città ospitavano migliaia di monaci impegnati in traduzioni e commentari. L'incursione Chola del 1025 spezzò il monopolio di Śrīvijaya sullo stretto, e nei secoli successivi la città decadde in un tributario dei regni giavanesi, sebbene la sua posizione sul fiume Musi ne facesse ancora un porto significativo dei signori del sud di Sumatra."
 pegu_desc: "Situata sul grande delta pianeggiante dove i fiumi Sittaung e Bago raggiungono il mare, Pegu si elevò al potere dopo che i Mongoli frantumarono Pagan nel 1287, quando il re mon Wareru fondò un nuovo regno Theravada nella bassa Birmania. Sotto i suoi successori la città, conosciuta ai Mon come #italic Hanthawaddy#!, crebbe fino a diventare il principale porto dell'alto Golfo del Bengala, attirando mercanti dal Bengala, dallo Sri Lanka e dalla costa del Coromandel per commerciare teak, rubini e la celebre laccatura degli artigiani mon. La sua grande Pagoda Shwemawdaw, che si dice custodisca reliquie del Buddha, segna la città come il nuovo cuore spirituale di una civiltà mon rinata dalle rovine di Pagan."
 chiang_mai_desc: "Nel 1296 il re tailandese Mangrai dell'alta valle del Mae Ping fondò una nuova capitale che chiamò #italic Chiang Mai#!, la Città Nuova, completando la sua unificazione del Lan Na, la Terra di un Milione di Campi di Riso, nelle valli montane del Siam settentrionale. Il sito fu scelto con l'aiuto dei re di Sukhothai e Phayao, e le sue mura e il suo fossato furono disposti attorno a una piazza centrale, un piano sacro che fonde tradizioni mon, tailandesi e khmer. Sotto Mangrai e i suoi successori la città fiorì come centro di buddismo Theravada e artigianato, i suoi monasteri patrocinando i fonditori di bronzo che realizzano le statue Lan Na apprezzate in tutto il mondo buddista."
 vijaya_desc: "Per quattro secoli il regno Cham ha governato la sua striscia costiera del Vietnam centrale dalla cittadella di Vijaya, situata dietro dune di sabbia a vista del Mar Cinese Meridionale. Le torri di mattoni che i Cham innalzarono attraverso il loro stretto regno parlano di una civiltà indianizzata e induista che commerciava seta e legni aromatici con i mercanti dei mari del sud, ma il regno fu ripetutamente battuto tra i grandi martelli dei Khmer di Angkor e del Đại Việt vietnamita. La capitale cham cadde ai Khmer nel 1145 e al Đại Việt nel 1283 e di nuovo nel 1326, recuperando ogni volta la propria indipendenza ma in forma sempre più diminuita, le torri di mattoni dei suoi re ancora in piedi come muti testimoni di una civiltà la cui lunga ritirata lungo la costa è già iniziata."
 lubeck_desc: "Fondata nel 1143 dal Conte Adolfo II di Holstein e rifondata da Enrico il Leone nel 1159 dopo un incendio, Lubecca si elevò a diventare la porta tra il Mare del Nord e il Baltico, il suo porto sul Trave attirando mercanti da Saxonia, dalle terre slave e dalla Scandinavia. Federico II le concesse lo status di Libera Città Imperiale nel 1226, e da quel momento i mercanti di Lubecca, organizzati in corporazioni autogovernate sotto le torri in mattoni rossi della città, tessero la rete di trattati che legava insieme le città mercantili del Baltico. La sua Legge di Lubecca era stata, entro il XIV secolo, copiata e adottata da più di cento città del Baltico e del Mare del Nord, stabilendo il quadro legale su cui le comunità mercantili del nord costruirono la loro vita comune."
 visby_desc: "Elevandosi dietro formidabili mura di pietra sulla costa occidentale di Gotland, Visby crebbe nel XII e XIII secolo in una delle città più ricche del Baltico, il suo porto luogo d'incontro per i mercanti di pellicce di Novgorod, i mercanti di tessuti della Fiandra e gli spedizionieri di ferro e aringhe della Hansa tedesca. La Repubblica dei Contadini di Gotland, che governò l'isola per secoli, condivideva la città con un quartiere mercantile tedesco privilegiato, e il governo parallelo delle due comunità diede alla città la sua peculiare ricchezza e complessità. Le sue chiese in calcare, di cui due dozzine si innalzavano entro le mura nel 1300, proclamavano una prosperità che fece di Visby, per una generazione, il più importante emporio del commercio baltico."
 tallinn_desc: "Sulla scogliera calcarea di Toompea, che domina la baia di Reval, il re danese Valdemaro II stabilì la sua fortezza nel 1219 durante la campagna che, secondo la leggenda, vide la bandiera Dannebrog cadere dal cielo per ispirare il suo esercito vacillante. La città che crebbe sotto il castello fu colonizzata da mercanti e artigiani tedeschi che le diedero la Legge di Lubecca e la fecero porto anseatico, i suoi molo gestendo il commercio tra le rotte fluviali russe verso Novgorod e le grandi vie di navigazione baltiche. Sotto il lasco governo della corona danese, i borghesi della Città Bassa prosperarono sul commercio di aringhe e ambra, mentre il vescovo e i vassalli dell'Ordine Teutonico si contendevano l'influenza sulla roccia sovrastante, il doppio carattere della città, come avamposto reale danese e repubblica mercantile tedesca, conferendole un vigore senza pari tra i porti baltici orientali."
 riga_desc: "Nel 1201 il Vescovo Alberto di Buxhoeveden fondò Riga come sede della sua crociata contro i pagani Livoni e Letti che abitavano le foreste oltre la Daugava. Con la benedizione papale fondò i Fratelli Livoni della Spada, l'ordine guerriero che sottomise le tribù pagane in mezzo secolo di sanguinose campagne, e la nuova città superò rapidamente le sue origini di base missionaria per diventare il principale porto anseatico del Baltico orientale. Dai suoi molo, cogge tedesche portavano pellicce, cera e ambra russe a Lubecca e oltre, mentre i mercanti di Riga stessi, organizzati in grandi corporazioni tedesche, stabilivano posti commerciali risalendo il fiume verso i principati russi. La lunga lotta tra i borghesi di Riga, il loro arcivescovo e il nuovo Ordine Livone divenne un tratto distintivo della politica della città."
 bergen_desc: "Riparata tra fiordi e montagne sulla costa occidentale della Norvegia, Bergen fu fondata intorno al 1070 dal Re Olaf Kyrre e si elevò a principale città e sede reale della Norvegia medievale. Il suo porto di Bryggen servì come grande punto di esportazione per il pescestocco delle pescherie settentrionali, e entro la fine del XIII secolo mercanti tedeschi delle città anseatiche avevano iniziato a stabilirsi in numero crescente sui molo, fondando il Kontor che dominò sempre più il commercio estero norvegese. Le incoronazioni reali, la scrittura delle saghe norvegesi e le dispute tra la corona, la chiesa e i mercanti stranieri fecero della città il cuore politico e culturale di un regno norvegese che al suo apice nel XIII secolo si estendeva dalle Fær Øer alla Groenlandia."
 hamburg_desc: "Fondata nel IX secolo quando Carlo Magno e i suoi successori costruirono una fortezza sull'Elba per convertire e contenere i Sassoni, Amburgo divenne sede di un arcivescovado che aspirava a diffondere la fede cristiana verso nord, in Scandinavia. Saccheggiata ripetutamente da Vichinghi, Slavi e persino dal re polacco Boleslao I, la città fu ricostruita costantemente, e nel 1189 Federico Barbarossa le concesse carte imperiali di commercio ed esenzione doganale che posero le fondamenta del suo futuro commerciale. Entro il XIII secolo l'alleanza di Amburgo con Lubecca contro la pirateria baltica era diventata una pietra angolare del sistema anseatico emergente, e i birrai, cordai e spedizionieri della città ne fecero il grande terminale dell'Elba per il commercio della Germania settentrionale."
 kyiv_desc: "Dal IX secolo i sovrani variaghi della Rus' fecero di Kiev la capitale di una grande confederazione slava e norrena sul medio Dnepr, e sotto Vladimiro il Grande e suo figlio Jaroslav il Saggio divenne, nell'XI secolo, una delle città più ricche e splendide dell'Europa orientale, la sua Santa Sofia e la Porta d'Oro proclamando una civiltà che commerciava tanto con Costantinopoli quanto con il Baltico. La frammentazione della Rus' in principati concorrenti indebolì lentamente la città già prima del cataclisma mongolo, e nel 1240 gli eserciti di Batu Khan la assaltarono e la rasero così completamente che i viaggiatori, una generazione dopo, trovarono l'erba crescere nelle sue strade e teschi disseminati nei suoi campi. Recuperando lentamente sotto la lasca sovranità mongola, negli anni 1320 Kiev era caduta nell'orbita del crescente Granducato di Lituania, il suo antico pedigree rurikide non all'altezza delle realtà del nuovo ordine politico."
 pskov_desc: "Situata su uno sperone roccioso sopra la confluenza dei fiumi Velikaya e Pskova, Pskov è stata una città sorella di Novgorod sin dai primi secoli della Rus', condividendone la tradizione dell'assemblea, il #italic veche#!, in cui i cittadini liberi dibattevano e decidevano gli affari di stato. Nel 1136 iniziò ad affermare la propria indipendenza da Novgorod, e dal XIII secolo la milizia di Pskov, guidata da guerrieri come il Principe Daumantas, esule lituano, difese la frontiera occidentale delle terre della Rus' contro l'incessante pressione dell'Ordine Teutonico. Risparmiata dal peggio delle invasioni mongole per la sua posizione remota, Pskov fiorì come repubblica di mercanti e guerrieri, il suo grande Cremlino di pietra e le sue chiese mercantili esprimendo una fiducia civica senza pari tra le città russe dell'epoca."
 avignon_desc: "Su una grande roccia sopra il Rodano, nel punto di attraversamento naturale tra la Provenza e la Linguadoca, Avignone fu una colonia romana e sede di conti prima che il suo destino si trasformasse completamente nel 1309. In quell'anno Papa Clemente V, incapace di tornare sicuro a Roma e in cerca della protezione reale francese, stabilì la sua corte ad Avignone, e i suoi successori iniziarono a innalzare il grande Palais des Papes che sovrasta la città come nuovo centro della Cristianità latina. Palazzi cardinalizi, ambascerie di ogni corte europea, scriptoria e cambiavalute affollavano le strade attorno al palazzo papale, e la popolazione della città raddoppiò e raddoppiò ancora mentre assumeva lo sconcertante ruolo di capitale della Chiesa universale."
 toledo_desc: "Su un ferro di cavallo di roccia sopra il Tago, Toledo servì come capitale dei re visigoti prima della conquista musulmana del 711, e sotto i suoi signori mori rimase una delle principali città dell'al-'Andalus, le sue strette strade affollate dalle sinagoghe, chiese e moschee di un mix religioso insolitamente tollerante. Alfonso VI di León-Castiglia riconquistò la città nel 1085, e la corona castigliana che vi stabilì la sua capitale ereditò un luogo dove il sapere latino, arabo ed ebraico potevano incontrarsi. La scuola di traduttori, patrocinata dall'Arcivescovo Raimondo e da Re Alfonso X il Saggio nel XIII secolo, fece di Toledo la porta attraverso cui gran parte della filosofia, della scienza e della medicina greca e araba raggiunse l'Occidente latino, riformando fondamentalmente il pensiero europeo."
 granada_desc: "Nel 1230, mentre gli eserciti cristiani avanzavano attraverso l'al-'Andalus e il grande regno Almohade crollava, Muḥammad ibn al-Aḥmar ritagliò un nuovo emirato a Granada nella Sierra Nevada, l'ultimo rifugio dell'Iberia musulmana. Sotto la dinastia Nasride che fondò, il regno di Granada divenne tributario di Castiglia, ma riuscì a fiorire come erede della civiltà andalusa, la sua frontiera montuosa e la densa #italic vega#! agricola rendendola insieme un bottino difficile per qualsiasi conquistatore. Sulla collina di Sabika sopra la città, i sultani Nasridi innalzarono il palazzo-fortezza dell'Alhambra, le cui corti e sale divennero rapidamente la suprema espressione architettonica della civiltà andalusa."
 dublin_desc: "Fondata nel IX secolo da incursori vichinghi che stabilirono un #italic long-phort#!, un accampamento navale fortificato, presso lo stagno scuro, il #italic Dubh Linn#!, dove il Liffey incontra il mare, Dublino crebbe fino a diventare la più importante città iberno-norrena d'Irlanda. I suoi mercanti commerciavano schiavi, pelli e argento attraverso il Mare d'Irlanda, e i suoi re si scontrarono ripetutamente con i sovrani supremi irlandesi finché Brian Boru ne spezzò il potere a Clontarf nel 1014. La conquista anglo-normanna del 1170, guidata da Strongbow e confermata da Enrico II, portò la città sotto la corona inglese, e Dublino divenne la capitale della Signoria d'Irlanda, le sue mura ampliate, le sue cattedrali innalzate, e la sua amministrazione della legge inglese estendendosi incerta nel Pale circostante."
 antwerp_desc: "Sul grande estuario di marea della Schelda, Anversa è stata un margraviato fortificato del Sacro Romano Impero sin dal X secolo, la sua cittadella sullo Steen proteggendo il guado fluviale dagli incursori vichinghi. I Duchi di Brabante la promossero nel XII e XIII secolo come rivale delle città fiamminghe di Bruges e Gand, e nel 1296 un Kontor anseatico fu stabilito nella città, segnalando la sua emergenza come porto serio del commercio nordeuropeo. Sebbene ancora nell'ombra di Bruges nei primi anni del XIV secolo, il porto più profondo della città e il suo accesso più facile al mare aperto attiravano le galee italiane e le caracche iberiche che segnavano l'ascesa costante del porto sulla Schelda."
 lyon_desc: "Fondata come colonia romana di #italic Lugdunum#! alla confluenza del Rodano e della Saona, Lione fu capitale delle tre Gallie e sede della zecca imperiale che forniva all'impero la sua moneta d'argento. Dopo la caduta di Roma divenne sede metropolitana di un arcivescovo che rivendicava il primato su tutta la Gallia, e attraverso il Medioevo le due valli gemelle della città crebbero in uno dei grandi crocevia dell'Europa occidentale. Sebbene nominalmente città del Sacro Romano Impero fino al 1312, quando passò sotto il governo diretto della corona francese, Lione si stava già sviluppando come città di fiere dove mercanti d'Italia, dei Paesi Bassi e del Mediterraneo si incontravano per regolare i loro conti in seta, spezie e argento."
 york_desc: "Fondata dai Romani nel 71 d.C. come fortezza legionaria di #italic Eboracum#!, York crebbe fino a diventare la capitale della loro provincia settentrionale e il luogo dove l'imperatore Costantino fu acclamato dalle sue truppe nel 306. Dopo secoli come capitale angla della Northumbria e grande centro cristiano sotto lo studioso Alcuino, la città fu conquistata dalla Grande Armata Pagana nell'866 e divenne #italic Jorvik#!, capitale di un regno vichingo i cui mercanti commerciavano fino a Samarcanda. La conquista normanna portò la costruzione di una grande cattedrale e di due castelli gemelli, e attraverso il Medioevo York resistette come sede di un arcivescovo che contendeva il primato ecclesiastico con Canterbury, e come seconda città d'Inghilterra per dimensione, ricchezza e antichità."
 canterbury_desc: "Quando Agostino di Roma sbarcò nel Kent nel 597 per convertire gli Anglosassoni, fece di Canterbury la sede della sua missione e il primo arcivescovado della Chiesa inglese, un'autorità che ha mantenuto da allora. La cattedrale che fondò fu ricostruita molte volte, in modo più fatidico dopo l'assassinio dell'Arcivescovo Thomas Becket entro le sue mura nel 1170, un atto di sacrilegio regio che trasformò Canterbury in una delle grandi destinazioni di pellegrinaggio della Cristianità medievale. La strada da Londra a Canterbury era affollata di pellegrini diretti al santuario di Becket, e la prosperità della città si costruì tanto sull'alloggio, il cibo e i souvenir venduti loro quanto sulla sua antica importanza ecclesiastica."
 edinburgh_desc: "Coronando lo sperone vulcanico di Castle Rock che si innalza a strapiombo sui dintorni, Edimburgo è stata una roccaforte sin dai giorni dei Britanni, che la conoscevano come #italic Din Eidyn#!. Divenne il principale borgo reale della Scozia sotto Davide I nel primo XII secolo, che fondò l'abbazia di Holyrood ai piedi della rocca e concesse alla città statuti che attirarono mercanti fiamminghi e inglesi nella sua via del mercato. Le Guerre d'Indipendenza, a cavallo del XIV secolo, videro il castello cambiare mano ripetutamente tra guarnigioni scozzesi e inglesi, e la famosa audace incursione di Thomas Randolph che lo riconquistò per Robert the Bruce nel 1314 è diventata una delle leggendarie gesta delle guerre scozzesi."
 kilwa_kisiwani_desc: "Su un'isola coralligena al largo della costa dell'Africa orientale, Kilwa Kisiwani sorse nell'XI secolo come insediamento swahili di origine shiraz e crebbe nel XIII e nel primo XIV secolo fino a diventare la più ricca delle città-stato della costa swahili. Sotto la dinastia Mahdali, stabilita nel 1277, i sultani di Kilwa presero il controllo del commercio dell'oro dal Grande Zimbabwe attraverso il porto meridionale di Sofala, e la ricchezza che ne derivò costruì il grande palazzo corallino di #italic Husuni Kubwa#!, con la sua piscina octagonale e la sua grande corte a terrazze, il più grande edificio premoderno dell'Africa subsahariana. Ibn Battuta, che la visitò nel 1331, la giudicò una delle città più belle e ben costruite che avesse visto in tutti i suoi viaggi."
 mogadishu_desc: "All'estremità settentrionale della costa swahili, Mogadiscio fu fondata intorno al X secolo da coloni arabi e persiani che si unirono in matrimonio con i popoli somali della costa del Banaadir, e nel XII secolo era diventata una florida città islamica di case in pietra, moschee e magazzini portuali. I suoi tessitori producevano il rinomato tessuto #italic Maqdishawi#!, commerciato attraverso l'Oceano Indiano fino in Egitto e in India, e i suoi mercanti estesero la loro portata commerciale in tutto l'Oceano Indiano occidentale. Ibn Battuta, che la visitò nel 1331, trovò una città governata dal Sultano Abu Bakr ibn Sayid 'Umar, un sovrano di origine berbera sotto il cui patrocinio le preghiere del venerdì nella grande moschea attirano folle di mercanti, giuristi e mistici sufi da tutto il mondo islamico."
 mombasa_desc: "Situata su un'isola coralligena al largo della costa dell'Africa orientale, Mombasa è stata un porto swahili almeno dal XII secolo, quando il geografo al-Idrisi la descrisse come una sostanziale città musulmana e un rifugio per i mercanti dell'Oceano Indiano occidentale. Sotto il governo dei suoi sultani di discendenza shiraz, la città crebbe fino a diventare uno dei principali luoghi commerciali della costa swahili, secondo solo a Kilwa nella metà meridionale di quella lunga fascia di città-stato, i suoi molo accogliendo dhow arabi dal nord e flotte indiane dirette verso le isole delle spezie. Il suo porto bordato di mangrovie e le sue moschee di roccia corallina testimoniavano una civiltà swahili che saldava tradizioni africane, arabe e persiane in una cultura distintamente cosmopolita del monsone."
 sofala_desc: "All'estremità meridionale della costa swahili, dove le terre dello Zambesi si aprono sull'Oceano Indiano, Sofala servì dal X secolo come grande sbocco per l'oro dell'interno africano. Il regno del Grande Zimbabwe inviava il suo oro lungo le lunghe rotte carovaniere per scambiarlo a Sofala con le sete della Cina, le ceramiche di Persia e i cotoni d'India che i dhow del monsone portavano ogni anno da Kilwa e oltre. Il geografo arabo al-Mas'udi la visitò nel X secolo, e sotto i sultani Mahdali di Kilwa la città divenne un obbediente avamposto del grande potere swahili settentrionale, la sua prosperità interamente dipendente dal commercio dell'oro e dai cicli del monsone."
 gao_desc: "Sulla grande ansa nordorientale del fiume Niger, Gao fu capitale del regno Songhai almeno dall'VIII secolo, e i suoi sovrani islamizzati commerciavano con il Nord Africa ben prima dell'ascesa del Mali. Gli eserciti conquistatori di Mansa Musa la inclusero nell'Impero del Mali all'inizio del XIV secolo, e Gao divenne una delle principali città tributarie del grande imperatore africano, i suoi dhow risalendo e scendendo il Niger per raccogliere il sale del Sahara e l'oro delle foreste meridionali per i mercati di Timbuctù. Sotto la sovranità maliana, la casa reale Songhai si preservò, e i semi di una futura rinascita imperiale furono piantati nelle moschee e nei quartieri commerciali della città."
 djenne_desc: "Alla testa del delta interno del Niger, Djenné è stata un sostanziale insediamento sin dai secoli prima di Cristo, il suo vicino antenato a Djenné-Djenno rappresentando una delle prime civiltà urbane dell'Africa subsahariana. Entro la fine del XIII secolo la città aveva abbracciato l'Islam sotto il suo re Konboro, e la grande Moschea del Venerdì in mattoni di fango che egli costruì si innalzò al centro di una florida città del delta interno, gemellata con Timbuctù nel commercio transahariano. I mercanti di Djenné raccoglievano l'oro dei campi di Bambuk e Buré e il cotone del delta interno per scambiarli con il sale del deserto, e l'architettura #italic banco#! della città, con le sue travi di legno sporgenti e le sue torri di terra, definì la firma visiva del Sudan saheliano."
 great_zimbabwe_desc: "A sud dello Zambesi, su un alto altopiano granitico sopra il fiume Save, i popoli di lingua shona innalzarono nell'XI e XII secolo una straordinaria città di pietra senza malta, le mura curve e le torri coniche che danno il nome al regno, da #italic dzimba dzemabwe#!, le case di pietra. Al suo apice nel XIV secolo la città si estendeva su centinaia di acri e poteva ospitare fino a diciottomila persone, i suoi sovrani controllando il commercio dell'oro che scendeva verso la costa swahili a Sofala e da lì a Kilwa e al più vasto Oceano Indiano. Sculture di uccelli in pietra ollare, frammenti di porcellana cinese e perle di Persia e India riempivano i suoi mercati, testimoni della portata globale di una civiltà che allora nessun europeo avrebbe potuto immaginare esistesse."
 kano_desc: "Sulla savana a sud delle grandi dune sahariane, Kano fu fondata, secondo la tradizione hausa, dai discendenti del leggendario eroe Bayajidda, che uccise il serpente del pozzo e fece dei suoi figli i re delle sette città-stato hausa. Nel XIV secolo Kano era la più potente di questi stati, la sua collina rocciosa di Dala onorata come luogo di nascita del regno, e le sue mura di fango e le sue fosse per la tintura attiravano le carovane di sale e rame del Sahara per commerciare in cambio dei tessuti tinti d'indaco e del lavoro in pelle in cui gli artigiani hausa eccellevano. I suoi re governavano secondo i riti dell'antica religione hausa, ma lungo le rotte transahariane, missionari e mercanti islamici fecero le loro prime incursioni nel regno."
 axum_desc: "Tra le città più antiche dell'Africa, Axum fu la capitale del regno aksumita che fiorì dal I secolo, commerciò con Roma e l'India attraverso il suo porto sul Mar Rosso di Adulis, e nel IV secolo, sotto il Re Ezana, abbracciò il cristianesimo come religione di stato, la prima entità subsahariana a farlo. Le grandi stele di granito che gli Aksumiti innalzarono sopra le tombe reali ancora torreggiano sopra le rovine della città, la più alta di esse pesando cinquecento tonnellate e portando l'immagine scolpita di un palazzo a più piani. Nel XIV secolo il vero potere si era spostato a sud con la nuova dinastia Salomonide restaurata da Yekuno Amlak nel 1270, ma Axum rimase la capitale spirituale del cristianesimo etiope, il luogo dove gli imperatori etiopi continuavano a essere incoronati e dove l'Arca dell'Alleanza stessa era, secondo la tradizione, custodita nella Chiesa di Nostra Signora Maria di Sion."
 mayapan_desc: "Costruita entro una grande cinta difensiva nella piana arida dello Yucatán settentrionale, Mayapan sorse alla fine del XIII secolo come successore dell'antica capitale maya di Chichén Itzá, fondata secondo le cronache maya dalla famiglia Cocom, che rivendicava discendenza dai sovrani della città più antica. Dall'interno delle mura della nuova capitale, i sovrani Cocom guidavano una lega di signori alleati provenienti da tutto lo Yucatán, richiedendo che i capi dei lignaggi vassalli risiedessero sotto l'occhio reale nella capitale affinché la loro lealtà fosse assicurata. Le sue numerose copie, più piccole e meno ambiziose, dei templi di Chichén proclamavano una civiltà che si sapeva erede di una tradizione più antica e grandiosa, eppure i successi politici della lega di Mayapan, che tenne insieme i piccoli re dello Yucatán in un'unica confederazione, sono autenticamente suoi."
 chan_chan_desc: "Sulla costa desertica del Perù settentrionale, dove le Ande scendono bruscamente verso il Pacifico e non cade una goccia di pioggia per anni, i re Chimú innalzarono tra il XII e il XIV secolo la vasta città di Chan Chan, la più grande città precolombiana del Sud America. Entro le sue mura si susseguivano grandi #italic ciudadelas#! reali, ciascuna un complesso palaziale autonomo costruito per un singolo sovrano e sigillato alla sua morte, le mura in adobe di ciascun complesso coperte dai ritmici motivi a rilievo di onde e uccelli marini che simboleggiavano le origini marittime del popolo Chimú. Da questa capitale i re di Chimor governarono il più lungo impero costiero mai emerso nelle Ande, mille chilometri di comunità di irrigazione, pesca e lavorazione dei metalli tributarie della città desertica al suo cuore."
 cholollan_desc: "Ai piedi del vulcano Popocatépetl, sul grande altopiano centrale del Messico, si ergeva la città di Cholollan, la cui straordinaria piramide del #italic Tlachihualtepetl#!, la Montagna Fatta dall'Uomo, fu la più grande singola struttura mai innalzata nel mondo precolombiano. Iniziata nei secoli prima di Cristo e successivamente ampliata da costruttori tolteca e poi altri, copriva una vasta base su cui si ergeva il tempio del serpente piumato Quetzalcōātl, la grande divinità a cui Cholollan era sacra. La città passò dai Tolteca agli Olmeca-Xicalanca e infine ai Tolteca-Chichimeca, nelle cui mani rimase il più importante centro di pellegrinaggio dell'altopiano centrale, un luogo dove i nuovi signori del bacino andavano a farsi confermare nella loro autorità dai sacerdoti di Quetzalcōātl."
 qusqu_desc: "In un'alta valle delle Ande, nel cuore di ciò che i popoli locali chiamano le quattro direzioni, la piccola città di Cuzco, anticamente #italic Qusqu#!, l'Ombelico del Mondo, fu fondata secondo la leggenda da Manco Cápac, che emerse con la sua sorella-moglie dalle acque del Lago Titicaca per piantare il suo bastone d'oro nel luogo prescelto. Attraverso il XIII e il primo XIV secolo la città fu la modesta sede di un cacicato regionale in contesa con vicini come i Chanca, i Quechua e gli Ayarmaca per il primato nelle Ande meridionali. I suoi sovrani, che un giorno avrebbero assunto il titolo di #italic Sapa Inca#!, preparavano le alleanze e i guerrieri con cui la generazione successiva della loro casa avrebbe potuto lanciare un'ambizione ben più grande sulle Ande meridionali."
 roskilde_desc: "Situata sul profondo fiordo della costa settentrionale dello Zealand, Roskilde si elevò in importanza nel X secolo come sede della dinastia di Jelling che unificò la Danimarca, e la prima chiesa in pietra qui fu costruita dallo stesso Harald Dente Blu, che riposa sepolto entro le sue mura. Come mausoleo reale della corona danese e sede di un potente vescovado, la città crebbe nel XII e XIII secolo fino a diventare la principale città del regno danese, la sua grande cattedrale in mattoni rossi innalzandosi come uno dei primi esempi di gotico in mattoni dell'Europa settentrionale. All'inizio del XIV secolo l'emergente porto dello Sound a Copenaghen aveva già iniziato ad attirare via i mercanti, ma Roskilde rimase il cuore spirituale della Danimarca, il luogo dove i suoi re venivano incoronati e sepolti per più di tre secoli."
 kobenhavn_desc: "Sulla riva orientale dello Zealand, di fronte al ristretto Sound verso la Scania, il piccolo villaggio di pescatori di #italic Havn#! fu dato dal Re Valdemaro I al suo fratello adottivo, il Vescovo Absalon, che costruì un castello fortificato sull'isola di Slotsholmen intorno al 1167 per reprimere i pirati venedi del Baltico. Sotto i suoi successori la fortezza del vescovo crebbe nella città mercantile di #italic Købmandshavn#!, il Porto dei Mercanti, controllando le ricche pescherie di aringhe del Sound, dove i grandi banchi di pesce si raccolgono ogni estate. Il possesso della città fu amaramente contestato tra i re di Danimarca e gli arcivescovi di Roskilde, ma la sua posizione dominante sul Sound attirò costantemente ai suoi molo il commercio del Baltico."
 lund_desc: "Fondata alla fine del X secolo da Sweyn Forcabarba nel cuore dei suoi possedimenti in Scania, Lund si elevò a straordinaria importanza nel 1103 quando Papa Pasquale II la elevò a sede dell'Arcivescovado di tutta la Scandinavia, separando le chiese settentrionali dalla sede di Amburgo-Brema. La grande cattedrale romanica iniziata sotto l'Arcivescovo Asser fu consacrata nel 1145 e dominava la città, la sua cripta custodendo il famoso orologio astronomico e la figura del gigante Finn. Sebbene Nidaros fosse elevata a proprio arcivescovado nel 1152 e Uppsala seguisse nel 1164, Lund mantenne il primato sulla chiesa danese e sulla Scania, il suo arcivescovo annoverato tra i più alti dignitari del regno danese."
 oslo_desc: "Fondata, secondo la tradizione, dal Re Harald Hardrada intorno al 1049 alla testa del grande fiordo che porta il suo nome, Oslo fu elevata a sede vescovile nel 1070 e crebbe attraverso i secoli medievali fino a diventare una delle principali città del regno norvegese. Re Håkon V Magnusson ne fece la sua capitale reale nel 1299, trasferendo la corte da Bergen per essere più vicino al centro politico della Scandinavia continentale, e la sua grande fortezza di Akershus, iniziata intorno al 1300, sovrasta il porto come simbolo di questa ambizione reale. Le strade in legno della città, affollate tra la roccia di Akershus e il quartiere vescovile, vedevano i suoi mercanti commerciare il legname e le pellicce dell'interno norvegese in cambio del grano e dei tessuti dei porti baltici."
 nidaros_desc: "Sulla riva del Nidelva, dove incontra il grande fiordo di Trøndelag, Nidaros fu fondata intorno al 997 dal Re Olaf Tryggvason e divenne il luogo di sepoltura del suo successore cristianizzatore, il Re Olaf Haraldsson, che cadde nella battaglia di Stiklestad nel 1030 e fu quasi immediatamente venerato come santo martire. La grande cattedrale costruita sopra il suo santuario divenne la più sacra destinazione di pellegrinaggio del mondo settentrionale, attirando fedeli dall'Islanda, dalla Groenlandia e dalle Isole Britanniche, e nel 1152 la città fu elevata a sede arcivescovile di una provincia ecclesiastica che si estendeva dalle terre norvegesi alle colonie dei mari occidentali. Anche dopo che la capitale reale si trasferì a sud, a Bergen e poi a Oslo, Nidaros rimase il cuore spirituale della Norvegia, il luogo dove i suoi re venivano incoronati e dove San Olaf, suo eterno monarca, vegliava sul regno."
 abo_desc: "Stabilita all'indomani della Seconda Crociata Svedese che sottomise i Finlandesi al governo cristiano negli anni 1240, Åbo, conosciuta ai Finlandesi come #italic Turku#!, crebbe alla foce del fiume Aura fino a diventare il principale avamposto svedese sulla costa finlandese sudoccidentale. Nel 1300 fu elevata a sede vescovile, la sua cattedrale appena consacrata diventando il centro spirituale della chiesa finlandese, e i molo della città iniziarono ad attirare il commercio baltico che collegava l'interno finlandese a Stoccolma e alle città anseatiche oltre. Sebbene ancora modesta rispetto ai grandi porti anseatici del Baltico meridionale, Åbo servì come capitale amministrativa ed ecclesiastica dei domini finlandesi del regno svedese, il suo vescovo annoverato tra i primi prelati della chiesa svedese."
 kalmar_desc: "Situata sulla costa sudorientale della Svezia, dove il canale tra la terraferma e la lunga isola di Öland si restringe, Kalmar crebbe nel corso del XII secolo attorno al suo grande castello di pietra, una delle prime e più formidabili fortezze reali del regno svedese. Il suo porto servì come principale sbocco meridionale della Svezia, incanalando l'esportazione di ferro, rame e burro verso i mercanti anseatici di Lubecca e oltre, e la città ricevette i suoi privilegi reali dal Re Magnus Ladulås nel 1276, confermandone lo status di una delle principali città del regno. All'inizio del XIV secolo la posizione strategica di Kalmar sulla frontiera danese-svedese e le sue solide mura ne fecero sia un vitale porto commerciale che una fondamentale roccaforte militare, il bastione meridionale della corona svedese contro le ambizioni della Danimarca."
 falun_desc: "Sui pendii della grande montagna rossa di Tiskasjöberget, in Dalarna, si trovava la miniera di rame di #italic Stora Kopparberget#!, la più grande e produttiva fonte di rame dell'Europa medievale e un caposaldo dell'industria svedese almeno dal IX secolo. Re Magnus III nel 1288 concesse privilegi formali alla compagnia mineraria che gestiva i lavori, la #italic Stora Kopparbergs Bergslag#!, segnandola come una delle più antiche imprese commerciali congiunte al mondo. L'insediamento minerario di Falun, situato sul lago sotto i lavori, crebbe attorno alla grande cava il cui fumo e la cui polvere rossa di ossido coloravano le case circostanti e il suolo per miglia, e il rame che fluiva dalle sue fonderie alimentava non solo il regno svedese ma i mercati di tutta l'Europa settentrionale."
 uppsala_desc: "A pochi chilometri dalla modesta città della cattedrale si trova l'antica Gamla Uppsala, il vecchio centro pagano dove Adamo di Brema descrisse un grande tempio d'oro i cui tre idoli di Thor, Odino e Freyr erano onorati con sacrifici di uomini e bestie ogni nove anni, e dove i tumuli reali dei re Yngling si innalzano ancora sulla piana. Con la conversione della Svezia al cristianesimo il sito di culto fu soppiantato, e nel 1164 Papa Alessandro III elevò Uppsala a sede dell'Arcivescovado di tutta la Svezia, separando la chiesa svedese dal primato danese di Lund. Nel 1287 la sede fu trasferita pochi chilometri a sud, nella nuova città di Östra Aros, dove iniziò la costruzione della grande cattedrale gotica in mattoni che, una volta completata, sarebbe stata la più grande di Scandinavia, e al cui altare i re di Svezia venivano incoronati dai primi prelati del regno."
 skara_desc: "Situata nelle piane di Västergötland tra i grandi laghi di Vänern e Vättern, Skara fu elevata dal Re Olof Skötkonung nel 1014 a sede del primo vescovado svedese, con il missionario tedesco Thurgot installato come primo prelato. Da questa modesta città di pianura la fede cristiana fu portata nel regno svedese ancora per metà pagano, e la grande cattedrale romanica consacrata sotto il Vescovo Bengt il Buono nel 1150 segnò Skara come capitale spirituale del Västergötland per i secoli a venire. Sebbene alla fine superata in influenza da Uppsala e Linköping, il vescovo di Skara mantenne la dignità di uno dei primi prelati del regno svedese, il suo capitolo cattedrale e la #italic Skarakrönikan#! preservando le memorie dei primi secoli cristiani del regno."
 linkoping_desc: "Situata nella pianura interna di Östergötland, dove la strada da Stoccolma ai regni meridionali incontra il fiume Stångån, Linköping fu elevata a vescovado nel primo XII secolo e da lungo tempo è uno dei principali centri ecclesiastici del regno svedese. La sua grande cattedrale, iniziata nel XII secolo nel calcare grigio chiaro locale, fiorì in una delle più ambiziose strutture gotiche di Svezia, e il vescovo di Linköping era subito dietro l'arcivescovo di Uppsala tra i prelati del regno. Nelle vicinanze, a Skänninge, il grande sinodo del 1248, convocato dal legato papale Guglielmo di Sabina, impose il celibato clericale alla chiesa svedese e la vincolò decisamente nel quadro canonico latino del più vasto mondo cristiano."
 soderkoping_desc: "Situata sul fiume Storå dove raggiunge il Baltico alla testa di un estuario riparato, Söderköping crebbe nel XII e XIII secolo in uno dei porti più importanti di Svezia, i suoi molo affollati dalle cogge di Lubecca e Visby che caricavano il ferro e il rame della Svezia interna per i mercati del sud. Città mercato reale con una sostanziale comunità di borghesi tedeschi che governavano secondo privilegi derivati dalla Legge di Lubecca, la città ospitò incoronazioni reali, negoziati di trattati e la grande fiera che attirava mercanti da tutto il Baltico ogni estate. Sebbene il lento insabbiamento del suo canale avesse già iniziato a minacciare il suo porto, Söderköping, all'inizio del XIV secolo, rimane uno dei principali luoghi commerciali della costa orientale svedese."
 lodose_desc: "Sul Göta älv, dove il grande fiume scende dal Lago Vänern verso il mare, Lödöse servì come unico sbocco della Svezia verso l'Atlantico e il commercio del Mare del Nord, un porto fluviale in legno stretto su una fascia di terra tra l'acqua e le colline occidentali scoscese. Dai suoi molo le navi svedesi salpavano verso la Norvegia, l'Inghilterra e le città dei Paesi Bassi, scambiando ferro e pelli con i tessuti e il vino dei mercati occidentali, e la zecca reale coniava moneta per i re di Svezia almeno dal XII secolo. Contesa tra le ambizioni territoriali di Danimarca, Norvegia e Svezia lungo il basso Göta älv, la proprietà di Lödöse fu una perenne questione diplomatica, il suo valore strategico come unico sbocco atlantico della Svezia senza pari altrove nel regno."
 jonkoping_desc: "Situata all'estremità meridionale del grande lago Vättern, nel punto di attraversamento naturale tra gli altipiani del Småland e le piane dell'Östergötland, Jönköping ricevette i suoi privilegi di città reale dal Re Magnus Ladulås nel 1284, la carta riconoscendo ciò che da lungo tempo era stato un importante luogo d'incontro e di commercio tra i regni del nord e del sud. La sua posizione, che dominava la via principale tra le province centrali e le marche danesi della Scania, ne fece sia una florida città mercantile che una fortezza di confine, e il castello reale che sovrastava il porto fu un costante bastione contro la perenne ambizione danese di spingere il confine verso nord. All'inizio del XIV secolo, Jönköping serviva come chiave politica e militare per l'accesso del Småland al cuore della Svezia."
 ribe_desc: "Fondata intorno al 700 come mercato vichingo sulla costa occidentale paludosa del Jylland, dove un ruscello di marea permetteva l'arenamento di navi oceaniche, Ribe è la città più antica di Scandinavia. I suoi mercanti commerciavano con le coste frisone e inglesi più di un secolo prima che i Vichinghi raggiungessero le Isole Britanniche. Adamo di Brema la descrisse come il principale mercato della Danimarca, e il missionario Ansgar vi fondò una chiesa all'inizio del IX secolo, facendo di Ribe uno dei primi avamposti del cristianesimo nel nord scandinavo. La grande cattedrale romanica, iniziata nel XII secolo in tufo portato dalla Renania, si innalzava sopra una città i cui mercanti commerciavano con i porti frisoni e fiamminghi oltre il Mare del Nord, scambiando il sale e il grano della costa danese occidentale con i tessuti e il vino del sud."
 viborg_desc: "Situata sull'altopiano centrale del Jylland tra grandi lande e laghi, Viborg fu sin dai tempi pagani sede del #italic landsting#! dello Jylland, l'assemblea regionale dove i capi della penisola si riunivano per discutere la legge e proclamare i loro re. Per tutti i secoli medievali i nuovi re di Danimarca furono prima acclamati qui a Viborg prima di cavalcare a sud, verso Lund, per l'incoronazione ecclesiastica da parte dell'arcivescovo, e le due grandi cattedrali della città, la sede vescovile e la più antica chiesa reale, attestavano l'inusuale concentrazione di autorità sacra e politica entro le sue mura. Sebbene l'ascesa di Copenaghen e lo spostamento verso est del potere danese diminuissero l'importanza quotidiana di Viborg, il primato simbolico del suo #italic landsting#! rimase un rito essenziale nella creazione di un re danese."
 odense_desc: "Nel cuore dell'isola di Funen, Odense prende il nome dal dio norreno Odino, a cui il grande sito di culto qui era sacro ben prima dell'arrivo del cristianesimo. La trasformazione della città iniziò nel 1086, quando il Re Canuto il Santo fu assassinato davanti all'altare della Chiesa di San Alban da nobili ribelli che rifiutavano la sua decima e la sua leva per la crociata, e il culto che crebbe rapidamente attorno al re martire portò alla canonizzazione papale nel 1101 e fece di Odense una delle grandi destinazioni di pellegrinaggio della Scandinavia. Il monastero benedettino fondato per custodire le reliquie del santo, istituito da monaci inglesi di Evesham, fece della città un centro di sapere, e all'inizio del XIV secolo Odense era la principale città delle isole danesi a ovest dello Zealand."
 aarhus_desc: "Fondata come insediamento dell'era vichinga sulla costa orientale del Jylland, dove il fiume Aarhus incontra il Kattegat, Aarhus è menzionata nel 948 tra i quattro vescovadi danesi istituiti sotto l'influenza missionaria tedesca all'indomani della cristianizzazione del Re Harald Dente Blu. Il suo porto riparato ne fece il principale scalo del Jylland orientale durante i secoli medievali, incanalando il bestiame e il grano delle pianure jutlandesi verso i mercati di Lubecca e Amburgo, e la grande cattedrale in mattoni iniziata nel XIII secolo sovrasta una città di mercanti e pescatori. Sebbene superata in importanza politica da Viborg e in peso commerciale da Ribe, Aarhus deteneva all'inizio del XIV secolo un posto indiscusso come principale porto della costa jutlandese sul Kattegat."
 aalborg_desc: "Sulla riva meridionale del Limfjord, dove la grande via d'acqua interna attraversa il Jylland settentrionale dal Mare del Nord al Kattegat, Aalborg dominava il principale punto di attraversamento del fiordo e il commercio che vi passava tra i due mari. Il castello reale di Aalborghus, nelle sue prime incarnazioni in legno, sorvegliava il guado almeno dall'XI secolo, e le pescherie di aringhe del fiordo rendevano i mercanti della città sufficientemente ricchi da mantenere un sostanziale commercio anseatico con Lubecca e i porti venedi. Privilegi reali, sobrie chiese in mattoni e una crescente popolazione di borghesi fecero di Aalborg, all'inizio del XIV secolo, una delle principali città della Danimarca settentrionale, la sua posizione sulla via d'acqua che attraversa il Jylland conferendole un valore strategico senza pari nella regione."
 tonsberg_desc: "Secondo le saghe di Snorri Sturluson, Tønsberg fu fondata prima della grande battaglia di Hafrsfjord che unificò la Norvegia sotto Harald Bellachioma nell'872, e rivendica perciò il titolo di città più antica della Norvegia, il suo porto riparato sul fiordo di Oslo al servizio di flotte vichinghe e corti reali attraverso il IX e il X secolo. La fortezza di Tunsberghus, sull'altura sopra il porto, divenne uno dei principali castelli reali della Norvegia medievale, e la grande abbazia premonstratense di Olavskloster, fondata nel tardo XII secolo, fece della città un centro di sapere. Trattati tra re norvegesi e pretendenti, coniazioni reali e l'ammassamento di eserciti per guerre civili e crociate fecero tutti di Tønsberg un luogo essenziale nella storia norvegese, subordinata solo a Bergen, Nidaros e Oslo tra gli altri insediamenti del regno."
 stavanger_desc: "Situata in un'insenatura riparata della costa sudoccidentale norvegese, dove i grandi fiordi del Ryfylke si aprono sul Mare del Nord, Stavanger fu elevata a vescovado dal Re Sigurd il Crociato nel 1125, che portò il vescovo inglese Reinald di Winchester a stabilire la nuova sede. La cattedrale romanica iniziata sotto la mano di Reinald, in uno stile adottato direttamente dall'Inghilterra anglo-normanna, dominava il porto come una delle chiese più distintamente di influenza inglese in Scandinavia. Come sede del vescovado di Stavanger, la città si annoverava tra i principali centri ecclesiastici del regno norvegese, il suo vescovo controllando vaste terre attraverso le diocesi di Rogaland e Agder, anche se il porto stesso resta un modesto scalo di pescatori all'estremità occidentale del mondo norvegese."
 hamar_desc: "Situata sulla riva occidentale del Lago Mjøsa, nel cuore interno della Norvegia, Hamar fu elevata nel 1152 a vescovado dal Cardinale Nicola Breakspear, futuro Papa Adriano IV, durante la sua grande missione per riorganizzare la chiesa norvegese e stabilire l'arcivescovado di Nidaros. La cattedrale, iniziata poco dopo sulla riva del lago, si sviluppò nel corso del XII e XIII secolo in una delle più ambiziose chiese romaniche dell'interno norvegese, e il vescovo di Hamar, governando una diocesi di valli montane e parrocchie lacustri, si annoverava tra i primi prelati del regno. All'inizio del XIV secolo la modesta città della cattedrale serviva come principale centro religioso delle province norvegesi interne, il suo vescovado il fulcro spirituale della regione dei laghi e delle montagne orientali norvegesi."
 vyborg_desc: "Fondata nel 1293 dal maresciallo svedese Torkel Knutsson durante la Terza Crociata Svedese contro i Careliani, Vyborg fu innalzata come un grande castello di pietra su un isolotto roccioso al largo della costa carelica, l'avamposto più orientale del regno svedese e la principale fortezza a guardia della nuova frontiera contro Novgorod. Dalle sue mura i governatori svedesi diressero campagne contro incursori careliani e russi per trent'anni, finché il Trattato di Nöteborg del 1323 fissò finalmente il confine tra Svezia e Novgorod, lasciando Vyborg come incontestato bastione orientale del re svedese. Attorno al castello si sviluppò una crescente città mercantile, attirando ai suoi molo il commercio di pellicce careliane, cera russa e merci finlandesi, fungendo da terminale orientale delle vie di navigazione baltiche."
 burgos_desc: "Colonizzata nell'884 dal Conte Diego Rodríguez Porcelos alla confluenza dei fiumi Arlanzón e Vena, Burgos divenne attraverso il IX e il X secolo la principale roccaforte della Contea di Castiglia e dal 1037, sotto Ferdinando il Grande, la principale città reale del Regno unificato di Castiglia e León. Fu patria di Rodrigo Díaz de Vivar, chiamato El Cid Campeador, le cui spoglie riposarono nel vicino monastero di San Pedro de Cardeña, e capo della grande strada di pellegrinaggio, il #italic Camino Francés#!, che incanalava i pellegrini da tutta la Cristianità verso Santiago de Compostela. Il mausoleo reale di Las Huelgas, fondato da Alfonso VIII nel 1187, custodiva le tombe dei re castigliani, e la grande cattedrale gotica iniziata nel 1221 sotto Re Ferdinando III era considerata una delle supreme realizzazioni architettoniche della Spagna medievale."
 leon_desc: "Fondata dai Romani come campo della #italic Legio VII Gemina#! da cui prende il nome, León si elevò nel X secolo a capitale del regno cristiano asturiano-leonese che spinse la Reconquista a sud, attraverso i piedi della Cantabria, fino alla Meseta. Il palazzo reale e la grande basilica di San Isidoro, il cui Pantheon dei Re dell'XI secolo custodiva le tombe di due dozzine di sovrani leonesi, fecero della città il cuore spirituale e politico di un regno che per un tempo superò la Castiglia sia in prestigio che in territorio. Sebbene l'unione con la Castiglia sotto Ferdinando III nel 1230 spostasse il centro politico verso sud, a Toledo e Valladolid, León mantenne la dignità simbolica del suo antico status reale, e la sua grande cattedrale gotica, iniziata nel 1205 e modellata sulle cattedrali della Francia settentrionale, si ergeva come luminosa testimonianza di quell'orgoglio duraturo."
 salamanca_desc: "Situata su uno sperone roccioso sopra il Tormes, nella Meseta occidentale, Salamanca era un'antica città celtiberica e romana che i regni cristiani ripopolarono sotto Alfonso VI nel 1085, come parte del grande ripopolamento delle terre tra il Duero e il Tago. La trasformazione decisiva avvenne nel 1218, quando Re Alfonso IX di León istituì qui uno #italic Studium Generale#!, e la scuola che fondò crebbe con straordinaria rapidità in una delle quattro grandi università della Cristianità, insieme a Bologna, Parigi e Oxford, la sua #italic licentia ubique docendi#! confermata da Papa Alessandro IV nel 1255. I suoi studiosi di diritto canonico e teologia rivaleggiarono presto con quelli degli #italic studia#! europei più antichi, e all'inizio del XIV secolo Salamanca era il principale centro della vita intellettuale nel regno castigliano."
 segovia_desc: "Ai piedi della Sierra de Guadarrama, Segovia è dominata dal grande acquedotto romano in granito a doppia arcata che ha portato le acque del Frío dalle sierre alla città per più di milleduecento anni senza malta, uno dei più spettacolari monumenti d'ingegneria sopravvissuti dall'antichità in tutta la Spagna. Ripopolata come città di frontiera da Alfonso VI dopo la conquista di Toledo nel 1085, Segovia si sviluppò come residenza reale preferita e sede di un'importante zecca reale durante i secoli medievali, i re castigliani sostando al suo Alcázar sulla rocca sopra il fiume per amministrare la giustizia e dirigere gli affari di stato. Le sue pecore merino, condotte ogni anno tra i pascoli invernali dell'Estremadura e gli altipiani estivi castigliani, resero la lana di Segovia famosa sui mercati fiamminghi."
 avila_desc: "Su uno sperone granitico battuto dal vento all'estremità occidentale del Sistema Centrale, Ávila fu ripopolata dal Conte Raimondo di Borgogna nel 1090 e immediatamente cinta dal più completo e formidabile circuito di mura medievali dell'Iberia, innalzato dai muratori di León e Burgos in meno di un decennio. Le ottantotto torri semicircolari e le nove porte che coronano il bordo della piattaforma rocciosa vegliano su una città che crebbe fino a diventare una vitale roccaforte di frontiera della Castiglia del ripopolamento, e le chiese della città, inclusa la cattedrale di San Salvador la cui abside è costruita entro il tratto orientale dei bastioni, ne fecero un centro di vita religiosa oltre che un bastione militare. All'inizio del XIV secolo le mura della città restavano imbattute come simbolo del ripopolamento castigliano, vegliando impassibili sulla Meseta che erano state innalzate a difendere."
 madrid_desc: "Fondata alla fine del IX secolo come piccolo avamposto musulmano di #italic Majrīṭ#!, che prende il nome dalle abbondanti sorgenti che irrigavano le sue lande circostanti, Madrid era una fortificata città rurale della frontiera settentrionale del Califfato quando Alfonso VI di León-Castiglia la conquistò senza resistenza nel 1083, durante la sua grande avanzata verso Toledo. La corona castigliana la mantenne come modesta città reale, concedendole il suo #italic Fuero#! nel 1202 sotto Alfonso VIII, e le terre di caccia dei suoi dintorni ne fecero un luogo di sosta preferito per la corte itinerante castigliana. Nel 1309 Re Ferdinando IV convocò per la prima volta le Cortes di Castiglia a Madrid, segno della crescente importanza amministrativa della città, anche se rimaneva un modesto insediamento nella lunga ombra della vicina città imperiale di Toledo."
 santiago_compostela_desc: "All'inizio del IX secolo, l'eremita Pelayo, guidato da una strana stella sopra un bosco di querce nelle selvagge colline della Galizia, fu condotto a una tomba romana. Il Vescovo Teodomiro di Iria Flavia la identificò come il luogo di sepoltura dell'apostolo Giacomo, fratello di Giovanni, il cui corpo era stato portato lì dai suoi discepoli dopo il martirio a Gerusalemme. Re Alfonso II delle Asturie innalzò la prima chiesa sopra la tomba ritrovata, e attraverso l'XI e il XII secolo Santiago de Compostela crebbe fino a diventare la terza destinazione di pellegrinaggio della Cristianità dopo Roma e Gerusalemme, le #italic concha#! dell'apostolo portate sui cappelli di penitenti da ogni angolo d'Europa. La grande cattedrale romanica iniziata nel 1075 dal Vescovo Diego Peláez e continuata dal formidabile Vescovo Diego Gelmírez dominava la fine del #italic Camino Francés#!, la strada più percorsa dell'Europa medievale, e l'arcivescovado di Compostela si annoverava tra le più potenti e contese signorie ecclesiastiche della Cristianità latina."
 zaragoza_desc: "Fondata come #italic Caesaraugusta#! dall'imperatore Augusto sull'Ebro, nel cuore della grande pianura fluviale, Saragozza servì come principale città romana dell'alto Ebro prima di passare sotto il governo visigoto e musulmano. Sotto i re taifa Banū Hūd dell'XI secolo divenne la capitale di uno dei più raffinati stati successori andalusi, il cui palazzo suburbano dell'Aljafería risplendeva come gioiello della tarda architettura di corte islamica. Conquistata nel 1118 da Alfonso il Battagliero d'Aragona in uno dei grandi trionfi della Reconquista, la città fu elevata a capitale del nuovo Regno d'Aragona, e le sue grandi chiese mudéjar, la zecca reale e il luogo d'incontro delle Cortes d'Aragona ne fecero il cuore politico e cerimoniale della corona aragonese."
 valencia_desc: "Stabilita per la prima volta come colonia romana di #italic Valentia Edetanorum#! sulla vasta pianura costiera del Turia, la città passò attraverso il governo visigoto e moro prima di diventare, brevemente, la signoria personale di Rodrigo Díaz de Vivar, El Cid, che la tenne dal 1094 fino alla sua morte nel 1099. Dopo il ritiro delle sue forze cristiane, la città ritornò al governo musulmano, fiorendo sotto le dinastie Almoravide e Almohade come una delle grandi città dell'al-'Andalus, la sua #italic huerta#! di campi irrigati e aranceti rinomata in tutto il Mediterraneo. Re Giacomo il Conquistatore d'Aragona entrò in città in trionfo il 9 ottobre 1238, coronando il più lungo assedio della Reconquista orientale, e fondò il nuovo Regno di Valencia entro la corona aragonese, mantenendone l'agricoltura irrigua, la corte delle acque della #italic huerta#! e gran parte della sua prosperità."
 palma_desc: "Fondata come colonia romana di #italic Palmaria#! su una baia riparata dell'isola che i Romani chiamavano Baleare, la città passò in mano vandala e bizantina prima che la sua conquista da parte del Califfato di Cordova nel 902 la trasformasse nella prospera città musulmana di #italic Madīnat Mayūrqa#!. Nel 1229, Re Giacomo il Conquistatore d'Aragona guidò la grande crociata marittima che conquistò l'isola in una sola campagna, e suo figlio Giacomo II ricevette il nuovo Regno di Majorca nel 1276, un piccolo ma ricco regno comprendente le Baleari, il Rossiglione e Montpellier. All'inizio del XIV secolo il Regno di Majorca sotto Giacomo III sopravviveva ancora come vassallo indipendente della corona aragonese, la sua capitale uno dei principali porti mercantili del Mediterraneo occidentale, la sua cattedrale La Seu innalzandosi in arenaria dorata sopra il porto."
 girona_desc: "Situata alla confluenza di quattro fiumi nei Pirenei orientali, Girona era la #italic Gerunda#! romana sulla Via Augusta ed è stata una città fortificata sin dall'antichità. I suoi conti carolingi governarono dal IX secolo come punta di lancia della Marca di Spagna contro l'al-'Andalus musulmano. Nel XIII secolo la città era diventata una delle principali città del Principato catalano, il suo vescovado tra i primi della Corona d'Aragona e il suo quartiere ebraico, il #italic Call#!, patria di una florida comunità di studiosi e medici. Nel 1285 Girona fu assediata dal Re Filippo III di Francia durante la Crociata Aragonese a sostegno dei Vespri Siciliani, e la sua difesa vittoriosa, coronata dalla distruzione della flotta francese alle Formigues, divenne uno dei momenti più orgogliosi della memoria civica catalana."
 pamplona_desc: "Fondata dal generale romano Pompeo come #italic Pompaelo#! durante la sua campagna del 75 a.C. contro Sertorio, Pamplona fu capitale del regno basco-romanzo di Navarra dal momento in cui Íñigo Arista fu acclamato suo primo re nell'824. L'insolita forma urbana di tre borghi murati rivali — la Navarrería degli abitanti baschi originari, il borgo di San Cernin dei mercanti franchi e il borgo di San Nicolás dei successivi coloni francesi — rese la politica della città notoriamente turbolenta, le tre comunità che occasionalmente si combattevano persino entro le mura. Sotto la casa capetingia di Évreux, che detenne la corona navarrese a partire dal 1328, Pamplona servì come capitale dell'unico regno pirenaico a mantenere la propria indipendenza tra le crescenti potenze di Castiglia e Aragona, il suo vescovo e i suoi mercanti definendo insieme una città la cui identità era al contempo basca, romanza e franca."
 malaga_desc: "Colonizzata nell'VIII secolo a.C. dai Fenici di Tiro come #italic Malaka#!, che prende il nome dall'industria di salagione del pesce che ancora oggi sostiene la sua economia, Málaga è stata uno dei principali porti della costa iberica meridionale per quasi tremila anni. Sotto il Califfato di Cordova e più tardi gli emiri Nasridi di Granada, la città fiorì come porta marittima dell'al-'Andalus, il suo porto ricevendo le sete, gli schiavi e le spezie del commercio magrebino e il suo fertile retroterra dell'#italic Axarquía#! produceva i famosi vini dolci e le mandorle spedite in tutto il Mediterraneo. L'alcazaba murata sulla sua collina portuale, innalzata dagli emiri Hammudidi nell'XI secolo e costantemente ampliata, ancorava una città la cui colonia mercantile genovese, i quartieri delle concerie e i ricchi orti di mercato fecero insieme di Málaga il motore economico del regno nasride."
 almeria_desc: "Fondata all'inizio del X secolo da 'Abd ar-Raḥmān III come il grande arsenale marittimo del Califfato di Cordova, Almería raggiunse straordinaria importanza sotto i suoi re taifa dell'XI secolo come una delle città più ricche dell'al-'Andalus, i suoi tessitori di seta e lavoratori di bronzo esportando beni fini verso il Levante e il Maghreb e i suoi cantieri navali lanciando le galee che brevemente contesero il controllo del Mediterraneo occidentale a Pisani e Genovesi. La catastrofica conquista cristiana della città da parte delle flotte combinate di Castiglia, Aragona, Genova e Pisa nel 1147, sotto la Seconda Crociata, distrusse quest'età d'oro, e sebbene fosse riconquistata dalle armi Almohadi dieci anni dopo, la città non si riprese mai completamente. All'inizio del XIV secolo, Almería era stata incorporata nel regno nasride di Granada come sua seconda città, la seta che ancora fluiva dalle sue officine un'eco della prosperità di un'epoca precedente."
 coimbra_desc: "Situata su una collina scoscesa sopra il Mondego, dove il fiume si curva verso nord in direzione dell'Atlantico, Coimbra iniziò la sua vita come la romana #italic Aeminium#! e prese poi il nome dall'antica città in rovina nelle vicinanze, #italic Conimbriga#!. Riconquistata dai Mori da Ferdinando il Grande di León nel 1064, divenne la principale città della nuova contea cristiana del Portogallo, e sotto Re Afonso Henriques e i suoi successori servì dal 1139 al 1255 come capitale del neonato Regno del Portogallo, il luogo dove furono scritte le prime cronache portoghesi e dove presero forma i romanzi cavallereschi del regno. Sebbene Re Afonso III trasferisse la corte a Lisbona, Coimbra mantenne un potente ruolo culturale ed ecclesiastico, e lo #italic Studium Generale#! istituito da Re Dinis nel 1290, che si spostò ripetutamente tra Lisbona e Coimbra, fece della città uno dei principali centri di sapere dell'Iberia."
 braga_desc: "Stabilita dall'imperatore Augusto come #italic Bracara Augusta#! e fatta capitale della provincia romana della Gallaecia, Braga è tra le più antiche città cristiane dell'Iberia, il suo vescovado istituito entro il III secolo e la sua pretesa di essere la sede primaziale di tutta l'Hispania portando il peso di una tradizione apostolica ininterrotta. I successivi sovrani visigoti, suebi e mori confermarono ciascuno a loro volta il primato ecclesiastico della città, e dopo la Reconquista l'arcivescovado di Braga, restaurato nel 1070, combatté una battaglia secolare con Toledo per il primato della chiesa iberica. La grande cattedrale romanica, iniziata nel 1070 e costantemente ampliata attraverso i secoli medievali, servì come sede di un arcivescovo che non solo governava gli affari spirituali del Portogallo settentrionale, ma affermava anche l'autorità metropolitana sulle chiese galiziane e asturiane ogniqualvolta il momento politico lo permettesse."
 evora_desc: "Fondata nella remota antichità dai Lusitani celtici su una bassa collina nelle grandi pianure ondulate dell'Alentejo meridionale, Évora divenne la romana #italic Ebora Liberalitas Iulia#!, dove un antico tempio di Diana rimase nel cuore della città vecchia. La città fu riconquistata ai Mori nel 1166 dal leggendario Geraldo Sem Pavor, Geraldo il Senza Paura, in un audace assalto notturno, e attraverso il XII e XIII secolo crebbe fino a diventare la principale città dell'Alentejo cristiano, sede di un vescovado e quartier generale degli ordini militari dei Cavalieri di Avis e dell'Ordine di Calatrava in Portogallo. All'inizio del XIV secolo Évora era una delle città più importanti del regno portoghese, la sua caratteristica cattedrale romanica del XII secolo un tratto prominente della città, diventata residenza reale preferita della Casa di Avis."
 merida_desc: "Fondata da Augusto nel 25 a.C. come colonia per i veterani delle Guerre Cantabriche e fatta capitale della provincia romana di #italic Lusitania#!, Mérida crebbe fino a diventare una delle più grandi e splendide città dell'impero romano occidentale, il suo teatro, anfiteatro, circo, acquedotti e il grande ponte sul Guadiana lasciando un segno sul paesaggio che sopravvisse a undici secoli di declino. Sotto i Visigoti rimase una sede episcopale di grande importanza, e dopo la conquista musulmana divenne una delle principali città delle marche occidentali del Califfato. Riconquistata da Alfonso IX di León nel 1230, Mérida fu concessa all'Ordine di Santiago, che vi stabilì il proprio quartier generale. Sebbene le rovine romane torreggiassero su quella che divenne una modesta città di frontiera, la città rimase un vitale baluardo nell'avanzata cristiana verso l'Estremadura e una potente sede del grande ordine militare castigliano."
 tarragona_desc: "Fondata dai Romani come grande capitale provinciale di #italic Tarraco#! dopo la Seconda Guerra Punica, Tarragona si elevò a diventare una delle principali città dell'impero romano occidentale, sede dei proconsoli che governavano la Hispania Citerior, e una delle prime comunità cristiane dell'Iberia. Saccheggiata dagli invasori musulmani nel 714, la città rimase quasi deserta per quattro secoli prima della sua formale restaurazione nel 1118, e l'arcivescovado di Tarragona fu ristabilito come sede metropolitana della chiesa catalana e principale prelatura della Corona d'Aragona, contendendo con vigore la giurisdizione sulle chiese aragonesi, catalane e valenciane. All'alba del XIV secolo, la grande cattedrale, passata dal romanico al gotico, si innalzava sopra gli antichi bastioni romani come simbolo di una città che recuperava lentamente l'antica dignità."
 murcia_desc: "Stabilita nell'825 dall'emiro omayyade 'Abd ar-Raḥmān II come #italic Mursiyya#! nell'ansa del Segura, dove la grande #italic huerta#! irrigata inizia ad aprirsi sulla pianura costiera, Murcia si elevò sotto i re taifa dell'XI secolo a principale città dell'al-'Andalus sudorientale, un florido centro di tessitura della seta, produzione ceramica e sapere matematico e astronomico arabo insegnato dalla scuola di Ibn al-Banna. Il regno di Murcia accettò la sovranità castigliana nel 1243 sotto l'accordo di Alcaraz, e dopo che una rivolta fu repressa da Giacomo I d'Aragona nel 1266, la città fu decisamente incorporata nella corona castigliana da Alfonso X il Saggio. Ripopolata con coloni catalani e aragonesi, Murcia all'inizio del XIV secolo serviva come principale città di frontiera della Castiglia contro il regno nasride di Granada a sud."
 cadiz_desc: "Colonizzata intorno al 1100 a.C. dai Fenici di Tiro come #italic Gadir#!, il Luogo Forte, su una lunga lingua di sabbia che si protende nell'Atlantico dalla costa iberica meridionale, Cadice è tra le città più antiche abitate ininterrottamente dell'Europa occidentale, il suo porto avendo accolto flotte fenicie, cartaginesi, romane, visigote e more attraverso tremila anni. I Romani la chiamarono #italic Gades#! e ne fecero una delle città più ricche del loro impero occidentale, patria di poeti, senatori e le celebri danzatrici dell'epoca imperiale, ma il lungo declino della tarda antichità la ridusse a una modesta città di pescatori al tempo del governo moro. Conquistata da Alfonso X il Saggio nel 1262 e ripopolata come porto di frontiera castigliano, Cadice all'inizio del XIV secolo serviva come importante sbocco meridionale del regno castigliano, il suo porto rivolto all'Atlantico proteso verso l'oceano più vasto oltre."
 jaca_desc: "Situata in un'alta valle pirenaica sull'alto fiume Aragón, dove la strada dei pellegrini dalla Francia scende dal passo del Somport, Jaca fu elevata da Re Ramiro I a prima capitale dell'infante Regno d'Aragona all'inizio dell'XI secolo. Il Concilio di Jaca del 1063 confermò il suo vescovado, e il celebre #italic fuero#! concesso da Re Sancho Ramírez intorno al 1077, una delle prime e più influenti carte municipali dell'Iberia, attirò mercanti e artigiani franchi a stabilirsi lungo la via per Santiago, servendo da modello copiato da città in tutta Aragona e Navarra. La sua imponente cattedrale romanica di San Pedro, la cui costruzione iniziò attorno alla stessa epoca, è una delle più antiche di Spagna. Sebbene la corte aragonese si trasferisse presto a sud, a Huesca e poi a Saragozza, con l'avanzare della Reconquista, Jaca all'inizio del XIV secolo rimaneva l'orgogliosa porta settentrionale tra Aragona e Francia, e una vitale stazione di sosta sulla via dei pellegrini."
 san_sebastian_desc: "Riparata sotto l'altura boscosa del Monte Urgull, in un punto ristretto del Golfo di Biscaglia, San Sebastián si formò attorno a un monastero dedicato al martire San Sebastiano. Ricevette il suo statuto cittadino da Re Sancho VI il Saggio di Navarra intorno al 1180, concedendo alla corona navarrese, priva di accesso al mare, una tanto desiderata finestra sull'oceano. Quando la Castiglia annesse la Gipuzkoa nel 1200 sotto Alfonso VIII, la città passò alla corona castigliana, che confermò i suoi privilegi e favorì i suoi borghesi di lingua guascone nelle pescherie e nel commercio di trasporto. I suoi marinai si spinsero lontano alla caccia delle balene, e il suo porto inviava ferro e lana castigliani a Bordeaux e oltre, le navi di ritorno cariche di vino. All'inizio del XIV secolo, San Sebastián era uno dei porti più importanti della costa basca, una città murata che viveva e prosperava grazie al mare."
 perpignan_desc: "Comparendo per la prima volta nei documenti del X secolo, Perpignano si trova sulla piana del Têt tra i Pirenei e il Mediterraneo. La città si elevò in importanza come principale insediamento dei Conti del Rossiglione, passando infine con la contea alla Corona d'Aragona nel 1172. Quando Re Giacomo I d'Aragona divise i suoi regni tra i suoi eredi, Perpignano divenne la capitale continentale del nuovo Regno di Majorca sotto Giacomo II nel 1276, che costruì il grande Palazzo dei Re di Majorca sulle alture sopra la città. Arricchita dai suoi tessitori e dal celebre panno del Rossiglione, e dal commercio che passava tra la Catalogna e la Francia, la città fiorì come centro di drapperia e concia. All'inizio del XIV secolo, Perpignano si ergeva come sede continentale dei re di Majorca, una prospera città mercato i cui telai vestivano gran parte del Mediterraneo occidentale."
 alicante_desc: "Colonizzata nell'antichità ai piedi dello scosceso sperone di Benacantil, Alicante — la città che i Greci conoscevano come #italic Ákra Leukḗ#!, il Promontorio Bianco, e i Romani come #italic Lucentum#! — divenne la musulmana #italic Madīnat Laqant#!, un modesto porto sulla costa mediterranea protetto da una fortezza sulla collina. Conquistata per la Castiglia dal futuro Alfonso X nel 1248, la città fu presa da Giacomo II d'Aragona durante una crisi di successione in Castiglia nel 1296 e incorporata nel Regno di Valencia nel 1308, in seguito alla spartizione delle terre conquistate a Torrellas. All'alba del XIV secolo, Alicante serviva come porto meridionale della Corona d'Aragona, il suo castello coronando la rocca di Benacantil sopra un porto che spediva in tutto il mondo il vino, le mandorle e l'alfa del suo retroterra assolato."
 cartagena_desc: "Fondata intorno al 227 a.C. dal generale cartaginese Asdrubale come #italic Qart Ḥadašt#!, la città che i Romani rinominarono #italic Carthago Nova#! su uno dei più bei porti naturali del Mediterraneo. Si arricchì grazie alle sue miniere d'argento e ospitò un grande arsenale navale, famosamente preso d'assalto da Scipione l'Africano nel 209 a.C. durante la guerra contro Cartagine. Il suo vescovado era tra i più antichi dell'Hispania, ma i lunghi secoli di declino e la conquista musulmana ridussero l'antico grande porto a un'ombra di se stesso. Riconquistata per la Castiglia dall'infante Alfonso nel 1245 e dotata della sua sede restaurata, Cartagena all'inizio del XIV secolo era un porto modesto ma strategicamente vitale sulla frontiera del regno castigliano, la sua magnifica baia ancora riparando le flotte che navigavano lungo la costa meridionale."
 algeciras_desc: "Fondata nel 711 dal comandante berbero Ṭāriq ibn Ziyād nel punto esatto dove i conquistatori musulmani posero per la prima volta piede in Iberia, #italic Al-Jazīra al-Ḵaḍrā'#!, l'Isola Verde, prese il nome dall'isolotto che ripara il suo porto sulla riva occidentale dello stretto. Attraverso sei secoli servì come principale luogo di sbarco per eserciti e mercanti che attraversavano dal Maghreb, l'indispensabile testa di ponte che legava l'al-'Andalus al Nord Africa. Tenuta a turno dagli Omayyadi, dalla taifa del suo stesso nome, dagli Almoravidi e dagli Almohadi, la città all'inizio del XIV secolo ancorava l'avamposto marinide in Iberia, il suo porto doppio fortificato la principale porta attraverso cui soldati e oro d'Africa affluivano nelle terre contese attorno allo stretto."
 gibraltar_desc: "Coronata dalla grande rocca calcarea che porta il suo nome, #italic Jabal Ṭāriq#!, la Montagna di Ṭāriq, segna il luogo dove Ṭāriq ibn Ziyād sbarcò il suo esercito nel 711 per iniziare la conquista dell'Iberia. Per secoli poco più che un posto di osservazione sopra lo stretto, la rocca fu fortificata nel 1160 dal califfo Almohade 'Abd al-Mu'min, che innalzò una città murata e una cittadella che chiamò #italic Madīnat al-Fatḥ#!, la Città della Vittoria, per dominare lo stretto. Brevemente presa dalla Castiglia nel 1309 e riconquistata per l'Islam poco dopo, Gibilterra all'inizio del XIV secolo si ergeva come roccaforte marinide fieramente contesa, la sua torreggiante rocca dominando la porta tra due mari e due continenti."
 marbella_desc: "Distesa su una fertile pianura costiera sotto le montagne della Serranía, Marbella crebbe da un insediamento romano fino a diventare la città musulmana di #italic Marballa#!, la sua alcazaba murata a guardia di una costa ricca di vigne, fichi e i prodotti di un clima mite. Un modesto ma prospero porto sulla costa meridionale, spediva la frutta e la seta del suo retroterra e trovava sostentamento nelle pescherie del tiepido Mediterraneo. All'inizio del XIV secolo, Marbella faceva parte del regno nasride di Granada, una delle tante città costiere fortificate che proteggevano il fianco marittimo dell'ultimo regno musulmano in Iberia."
 fez_desc: "Fondata dalla dinastia Idriside intorno all'800 e situata su entrambe le rive del fiume che porta il suo nome, Fez crebbe rapidamente grazie all'insediamento di rifugiati andalusi da Cordova e famiglie arabe da Kairouan, i cui due quartieri diedero alla città il suo carattere duraturo. La grande moschea-università della #italic Qarawiyyīn#!, dotata nell'859 da Fāṭima al-Fihrī, fece di Fez uno dei principali centri di sapere del mondo islamico, attirando studiosi di diritto, teologia e scienze da tutto il Mediterraneo. Quando i Marinidi soppiantarono gli Almohadi, fecero di Fez la loro capitale e innalzarono accanto alla città vecchia il quartiere reale di #italic Fās al-Jadīd#! nel 1276, con i suoi palazzi, giardini e moschea congregazionale. Agli inizi del XIV secolo, Fez si trovava all'apice della sua gloria, cuore politico e intellettuale del sultanato marinide."
 marrakesh_desc: "Fondata nel 1070 dal comandante almoravide Abū Bakr ibn 'Umar ai margini della grande pianura del Haouz, sotto le cime innevate dell'Alto Atlante, Marrakech si evolse con sorprendente rapidità da un accampamento nel deserto a capitale imperiale di un regno che si estendeva dal Senegal all'Ebro. Sotto gli Almoravidi e poi gli Almohadi, che la presero nel 1147, la città fu adornata di palazzi, giardini e del maestoso minareto della moschea Koutoubia, le sue acque portate dalle montagne attraverso gli ingegnosi canali sotterranei #italic khettara#!. Prestò il suo nome, sulla bocca dei viaggiatori europei, a tutto il regno del Marocco. Sebbene i Marinidi trasferissero la loro sede a nord, a Fez, Marrakech all'inizio del XIV secolo rimaneva la grande capitale meridionale, la porta tra l'Atlante, il Sous e le vie carovaniere verso il deserto."
 sijilmasa_desc: "Fondata nel 757 nell'oasi di palme da datteri del Tafilalt, all'estremità settentrionale del Sahara, Sijilmasa divenne il grande terminale settentrionale del commercio carovaniero transahariano, il luogo dove l'oro del Ghana e del Mali, portato attraverso il deserto dalle carovane berbere di cammelli, veniva scambiato con il sale, i tessuti e i manufatti del mondo mediterraneo. Per secoli la sua zecca coniò i dinari d'oro che lubrificavano il commercio di tutto il mondo islamico occidentale, e i suoi mercanti si arricchirono favolosamente come intermediari tra due continenti. Indipendente sotto le proprie dinastie prima di cadere agli Almoravidi, che sorsero nelle vicinanze, Sijilmasa all'inizio del XIV secolo era ancora l'indispensabile porta desertica del regno marinide, sebbene il lento spostamento delle rotte carovaniere avesse iniziato a minacciare la sua antica prosperità."
 rabat_desc: "Innalzata dal califfo Almohade 'Abd al-Mu'min a metà del XII secolo come #italic ribāṭ#! fortificato a guardia della foce del Bou Regreg, l'accampamento assunse grandi ambizioni sotto suo nipote Ya'qūb al-Manṣūr, che dopo la sua vittoria ad Alarcos nel 1195 lo chiamò #italic Ribāṭ al-Fatḥ#!, il Campo della Vittoria, e decise di farne la capitale di un vasto impero. Iniziò un'immensa moschea congregazionale il cui grande minareto, la Torre di Hassan, fu lasciata incompiuta alla sua morte, restando per sempre come monumento a un sogno interrotto. Con il declino del potere Almohade la grandiosa città si svuotò in gran parte, e all'inizio del XIV secolo Rabat era una città molto diminuita accanto alle sue poderose mura incompiute, che guardavano l'Atlantico alla foce del fiume, di fronte alla sua più antica vicina Salé."
 sale_desc: "Situata sulla riva settentrionale del Bou Regreg, dove il fiume incontra l'Atlantico, Salé era uno dei principali porti del Marocco medievale, i suoi mercanti commerciando il grano, la lana, il cuoio e la cera dell'interno con le città cristiane dell'Iberia e dell'Italia e con i mercati del Mediterraneo. La città subì un devastante saccheggio da parte di una flotta castigliana nel 1260, dopo il quale i sultani Marinidi la ricostruirono e la fortificarono, adornandola con una bella moschea congregazionale e una celebre madrasa. All'inizio del XIV secolo, Salé si ergeva come ricca e colta città commerciale, il suo porto affollato dalle navi di due mari e i suoi studiosi e giuristi conferendole una reputazione di sapere rivale delle grandi città dell'interno."
 ceuta_desc: "Dominando la sponda africana dello stretto dove due mari e due continenti quasi si toccano, Ceuta, l'araba #italic Sabta#!, è stata sin dall'antichità uno dei porti più contesi del Mediterraneo occidentale, la sua rada riparata il punto di attraversamento naturale tra il Maghreb e l'al-'Andalus. Grande emporio commerciale, le sue officine famose per le fini opere in ottone e i suoi copisti per bellissimi manoscritti, la città gestiva l'oro e le merci che passavano tra Africa ed Europa e conservò a lungo una gelosa autonomia sotto i suoi notabili mercanti, i Banū al-'Azafī. Contesa tra i Marinidi e i Nasridi di Granada, Ceuta all'inizio del XIV secolo era ancora un premio scintillante, la sua prosperità e la sua posizione facendone insieme la chiave dello stretto."
 tangier_desc: "A guardia della bocca occidentale dello stretto, dove il Mediterraneo si apre sull'Atlantico, Tangeri è tra le città più antiche del Marocco, l'avamposto commerciale fenicio e la romana #italic Tingis#! che diede il nome alla provincia della Mauretania Tingitana. Nel corso dei secoli il suo porto strategico passò per mano vandala, bizantina, omayyade, almoravide e almohade, ciascuna apprezzando la città come porta tra Africa ed Europa. All'inizio del XIV secolo Tangeri era un porto marinide di modeste dimensioni ma duratura importanza, la sua posizione all'angolo stesso del continente assicurandole di non poter essere ignorata da nessuna potenza che contendesse lo stretto."
 taza_desc: "Situata a cavallo del corridoio ristretto tra le montagne del Rif e il Medio Atlante, il varco che costituisce l'unico facile passaggio tra il Marocco orientale e occidentale, Taza è stata da lungo tempo una città-fortezza di primaria importanza strategica. Fu qui che il condottiero Almohade 'Abd al-Mu'min stabilì il suo potere negli anni 1130 prima di dilagare alla conquista di Marrakech, e la grande moschea della città risale a quegli anni. I Marinidi a loro volta fecero di Taza una delle loro prime conquiste e una roccaforte chiave a guardia della strada per Fez. All'inizio del XIV secolo la città murata dominava la vitale porta orientale del regno marinide, chiave perenne per il controllo di tutto il Marocco."
 meknes_desc: "Fondata nel X secolo dai berberi Meknassa che le diedero il nome, e fortificata dagli Almoravidi come roccaforte sulla fertile pianura a nord del Medio Atlante, Meknes si sviluppò tra frutteti, uliveti e campi di grano in una prospera città mercato. Sebbene rimanesse sempre nell'ombra della vicina Fez, i Marinidi la favorirono con moschee e una pregevole madrasa, e la sua ricchezza agricola e le sue abbondanti acque ne fecero un granaio del regno. All'inizio del XIV secolo Meknes era una fiorente città provinciale di giardini e mercati, la sua posizione strategica e il suo ricco retroterra destinandola a un futuro più grande."
 taroudant_desc: "Situata nella fertile valle del Sous, tra l'Alto Atlante e l'Anti-Atlante, Taroudant è stata da lungo tempo la principale città delle ricche terre agricole del sud, irrigata dal fiume e famosa per il suo grano, i suoi ulivi, la sua canna da zucchero e i prodotti dei suoi giardini. Presa dagli Almoravidi nel 1056 come una delle loro prime conquiste sulla via del potere, la città murata servì poi come capitale e mercato di tutta la regione del Sous, raccogliendo i prodotti della valle e le merci portate su dalle oasi del deserto. All'inizio del XIV secolo Taroudant rimaneva il prospero cuore del sud, una città murata di frutteti e mercati al crocevia tra montagna, pianura e deserto."
 aghmat_desc: "Annidata ai piedi dell'Alto Atlante, Aghmat fu la principale città della regione del Haouz ben prima che Marrakech esistesse, un florido mercato dove si scambiavano i prodotti delle montagne, delle pianure e delle carovane transahariane. Servì come base iniziale degli Almoravidi prima che fondassero lì vicino la loro nuova capitale, e fu qui che il poeta-re deposto al-Mu'tamid di Siviglia visse i suoi ultimi anni in esilio e morì nel 1095, la sua tomba diventando luogo di malinconico pellegrinaggio. Eclissata dall'ascesa di Marrakech, Aghmat all'inizio del XIV secolo si era ridotta a una modesta città, la sua gloria ricordata soprattutto nei versi del re prigioniero morto entro le sue mura."
 tinmel_desc: "In alto, in una remota valle dell'Alto Atlante, la roccaforte montana di Tinmel fu la culla del movimento Almohade, il luogo dove il Mahdi Ibn Tumart, predicatore della dottrina dell'unità divina, riunì i suoi seguaci berberi all'inizio del XII secolo e lanciò la rivoluzione che avrebbe rovesciato gli Almoravidi e conquistato tutto il Maghreb e l'al-'Andalus. La sua tomba e la grande moschea fortificata innalzata al suo fianco fecero di Tinmel la capitale spirituale e il santuario dinastico dei califfi Almohadi, un luogo sacro custodito tra le cime. All'inizio del XIV secolo, con gli Almohadi caduti da tempo, Tinmel era un santuario venerato ma appartato, la sua moschea in piedi come monumento a un impero nato tra queste montagne."
 volubilis_desc: "Distesa su un fertile altopiano tra le colline vicino alla futura città di Meknes, Volubilis fu la romana #italic Walīlī#!, capitale occidentale della provincia di Mauretania Tingitana e ricca città provinciale di archi di trionfo, basiliche, frantoi d'olio e pregevoli mosaici all'estremo margine del mondo romano. Sebbene le legioni si ritirassero nella tarda antichità, la città sopravvisse sotto i suoi abitanti berberi, e fu nelle vicinanze che Idrīs ibn 'Abdallāh si rifugiò nel 788 e fu acclamato fondatore della prima dinastia musulmana del Marocco. All'alba del XIV secolo, l'antica grande città romana è un campo di rovine in sfacelo accanto a un modesto insediamento, le sue colonne abbattute a ricordo degli imperi sorti e caduti su questo suolo."
 anfa_desc: "Situata su un basso rilievo sopra una vasta baia della costa atlantica, Anfa era una città portuale berbera che viveva di pesca, della coltivazione della fertile pianura della Chaouia dietro di essa e del commercio marittimo della costa occidentale. Da lungo gelosa della propria indipendenza dalle grandi dinastie dell'interno, la città si guadagnò tra i vicini la fama di nido di audaci marinai e corsari che depredavano le navi della costa. All'inizio del XIV secolo, Anfa era un porto atlantico piccolo ma vivace ai margini del regno marinide, i suoi marinai solcando la costa oceanica in cerca di pesce e di preda in egual misura."
 azemmour_desc: "Situata su una rupe sopra la foce del grande fiume Oum Er-Rbia, dove si getta nell'Atlantico, Azemmour è un'antica città portuale che vive del mare e del fiume, famosa sopra ogni cosa per le alose che risalgono le sue acque in vasti branchi ogni primavera. Il suo porto gestiva il grano e la lana della ricca pianura di Doukkala dietro di essa, commerciando con i mercanti dell'Iberia e del Mediterraneo. All'inizio del XIV secolo Azemmour era un prospero porto murato di pescatori e mercanti sulla costa atlantica del Marocco, le sue fortune che salivano e scendevano con il fiume che le dava vita."
 asfi_desc: "Riparata in una baia della costa atlantica sotto basse scogliere, Asfi era un antico porto di pesca e commercio che raccoglieva il grano, la lana e i prodotti della pianura di 'Abda dietro di essa per l'esportazione attraverso i mari occidentali. Il suo porto attirava i mercanti di Genova, Catalogna e Portogallo in cerca delle merci del Marocco meridionale, e i suoi pescatori lavoravano le ricche acque atlantiche al largo. All'inizio del XIV secolo, Asfi era uno dei principali sbocchi atlantici del sud marinide, un porto modesto ma operoso dove i prodotti dell'interno si mescolavano con le navi delle città mercantili cristiane."
 asilah_desc: "Situata sulla costa atlantica poco a sud dello stretto, Asilah era tra i porti più antichi del Marocco, la stazione commerciale fenicia e cartaginese che gli antichi conoscevano come #italic Zilis#! e che i Romani annoveravano tra i porti della Mauretania Tingitana. Nel corso dei secoli le sue mura e i suoi molo passarono per molte mani, e la sua posizione sulla costa oceanica vicino alla porta dello stretto la mantenne luogo di commercio e di contesa. All'inizio del XIV secolo Asilah era un porto marinide fortificato di modeste dimensioni, il suo porto gestendo il commercio costiero del litorale atlantico e le sue mura a guardia contro le flotte che incrociavano le acque contese."
 larache_desc: "Situata dove il fiume Loukkos incontra l'Atlantico, Larache fu stabilita vicino alle rovine dell'antica colonia fenicia di #italic Lixus#!: uno dei più antichi empori commerciali della costa oceanica, che la leggenda poneva tra i giardini delle Esperidi. La città viveva della pesca nel fiume e nel mare, del sale delle sue paludi e del commercio di grano e merci che passava per il suo porto. All'inizio del XIV secolo Larache era un piccolo ma utile porto atlantico del regno marinide, la sua riparata foce fluviale offrendo un rifugio su una costa altrimenti esposta alla piena forza dell'oceano."
 tetouan_desc: "Situata in una fertile valle sotto le montagne del Rif, a breve distanza dal Mediterraneo, Tétouan fu rifondata e fortificata dal principe marinide Abū Ṯābit intorno al 1286 come base militare da cui condurre l'assedio della vicina Ceuta. La sua posizione dietro una foce fluviale riparata, con le montagne alle spalle e il mare di fronte, ne fece al contempo una naturale roccaforte e un luogo d'incontro per il commercio tra il Rif e la costa. All'inizio del XIV secolo Tétouan era una città murata marinide di crescente importanza, a guardia degli accessi mediterranei e delle vie montane del Marocco settentrionale."
