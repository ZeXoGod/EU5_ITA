 byz_army_reform_decision.title: "Riformare l'Esercito [ROOT.GetCountry.GetAdjectiveWithNoTooltip]"
 byz_army_reform_decision.title.entry: "Riformare l'Esercito Bizantino"
 byz_army_reform_decision.desc: "Mentre il nostro esercito ha dominato in passato grazie ai Themata e alle numerose leve che fornivano, l'aumento della ricchezza e la centralizzazione dei regni hanno portato gli esercizi a diventare una professione a tempo pieno. [target_character.GetName], con [target_character.GetHerHis] consiglio, ha lavorato duramente per redigere una nuova organizzazione militare, una che dipenda meno dai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] per le truppe."
 byz_army_reform_decision.desc.entry: "Mentre il nostro esercito ha dominato in passato grazie ai Themata e alle numerose leve che fornivano, l'aumento della ricchezza e la centralizzazione dei regni hanno portato gli esercizi a diventare una professione a tempo pieno. Il nostro gabinetto potrebbe redigere un piano per riformare il nostro esercito, rendendoci meno dipendenti dalla nostra nobiltà per il sostegno."
 byz_army_reform_decision.a: "L'esercito servirà [target_character.GetNameWithNoTooltip]."
