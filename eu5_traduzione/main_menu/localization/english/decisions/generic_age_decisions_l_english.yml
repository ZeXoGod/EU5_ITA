l_english:
 sponsor_a_cathedral_decision.title: "Finanzia una Cattedrale"
 sponsor_a_cathedral_decision.desc: "Il nostro paese manca ancora di luoghi dove venerare e praticare la nostra fede. Dovremmo finanziare la costruzione di una nuova [ShowBuildingTypeName('cathedral')] per soddisfare le esigenze del nostro popolo."
 sponsor_a_cathedral_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_cathedral_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_cathedral_cooldown_tt: "Non ha usato questa [decision|e] durante il regno del sovrano attuale"

 sponsor_a_great_madrasa_decision.title: "Finanzia una Grande Madrasa"
 sponsor_a_great_madrasa_decision.desc: "Sebbene il nostro paese sia già patria di molti luoghi di culto, i comuni [ShowBuildingTypeName('temple')] e [ShowBuildingTypeName('madrasa')] non bastano a soddisfare le grandi menti dei nostri studiosi. Dovremmo investire in una nuova [ShowBuildingTypeName('great_madrasa')] per fornire loro spazi adeguati per studiare e diffondere la loro conoscenza."
 sponsor_a_great_madrasa_decision.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 sponsor_a_great_madrasa_decision.a.entry: "$common_string_brilliant$"
 sponsor_a_great_madrasa_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"

 construct_a_grand_palace_decision.title: "Commissiona un Nuovo Palazzo"
 construct_a_grand_palace_decision.desc: "La nostra corte e la famiglia del nostro sovrano mancano entrambe di una dimora adeguata al proprio prestigio. Dovremmo assumere un [ShowArtistTypeName('architect')] per progettare la costruzione di un nuovo [ShowBuildingTypeName('grand_palace')]."
 construct_a_grand_palace_decision.a: "Questa sarà una residenza adeguata."
 construct_a_grand_palace_decision.a_tt: "L'[ShowArtistTypeName('architect')] assunto si unirà alla nostra [court|e]"

 strive_towards_thalassocracy_decision.title: "Instaura una Talassocrazia"
 strive_towards_thalassocracy_decision.desc: "I vasti mari potrebbero diventare una parte vitale del nostro paese e della sua espansione economica, se solo potessimo dominare adeguatamente le acque lungo la nostra costa. Versare risorse significative nell'espansione della nostra marina ci permetterebbe di allineare la nostra infrastruttura a questo nuovo focus sulle ambizioni d'oltremare."
 strive_towards_thalassocracy_decision.a: "Abbracciamo il mare."
 strive_towards_thalassocracy_decision.a.tt: "Avremo 20 anni per istituire una marina forte"
 strive_thalassocracy_coastal_markets_tt: "Possiede almeno un [market_center|e] costiero"

 abandon_thalassocracy_decision.title: "Abbandona la Talassocrazia"
 abandon_thalassocracy_decision.desc: "Governare tramite il nostro dominio dei mari non si adatta più alle nostre ambizioni. Dovremmo reindirizzare i nostri sforzi verso la terra in cui viviamo."
 abandon_thalassocracy_decision.a: "Torniamo a un terreno più solido."

 found_trade_company_india_decision.title: "Sostieni le Nostre Rotte Commerciali Asiatiche"
 found_trade_company_india_decision.desc: "Le ricche coste di [ShowSubContinentName('south_asia')] e [ShowSubContinentName('south_east_asia')] ci promettono grandi profitti. Mentre i nostri attuali sforzi commerciali sono condotti principalmente da singoli mercanti, questo non è chiaramente uno stato di cose adeguato per un paese della nostra levatura. Dovremmo sfruttare gli strumenti del nostro stato per stabilire missioni commerciali più grandi tra quei mercati stranieri e il nostro."
 found_trade_company_india_decision.a: "Investiamo in una Compagnia Commerciale Indiana."

 invite_foreign_advisor_decision.title: "Acquista Innovazione Straniera"
 invite_foreign_advisor_decision.desc: "Il nostro paese è gravemente in ritardo rispetto alle altre grandi potenze del mondo. Non possiamo restare con le mani in mano mentre altri paesi ci superano nel campo della tecnologia e dell'innovazione. Offrendo un salario generoso a un individuo proveniente da uno di questi paesi, possiamo cercare di recuperare il ritardo con gli altri e non restare ulteriormente indietro nella ricerca della modernizzazione."
 invite_foreign_advisor_decision.a: "Accogliamo lo studioso straniero."
 invite_foreign_advisor_decision.a.tt: "Uno studioso proveniente da un [country|e] straniero si unirà alla nostra [court|e]"
 invite_foreign_advisor_decision.b: "I nostri consiglieri sono sufficienti."
 invite_foreign_advisor_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"

 disempower_the_parliament_decision.title: "Contesta i Diritti del Parlamento"
 disempower_the_parliament_decision.desc: "Nel corso degli ultimi secoli il nostro parlamento ha acquisito determinati diritti che limitano la libertà del nostro governo. Dovremmo guardare a coloro che detengono seggi radicati nel parlamento e revocare i loro diritti!"
 disempower_the_parliament_decision.a: "Dobbiamo frenare i poteri del parlamento."
 disempower_the_parliament_decision.a_building_tt: "Rimuoveremo un [ShowBuildingTypeName('urban_parliament_seat')] in una delle nostre [locations|e]"
 disempower_the_parliament_decision.a_tt: "Ogni [pop|e] nella [location|e] perderà [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 disempower_the_parliament_decision.b: "Non è il momento giusto per sfidare il parlamento."
 disempower_the_parliament_decision_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"

 abolish_serfdom_decision.title: "Abolisci la Servitù della Gleba"
 abolish_serfdom_decision.desc: "La pratica della Servitù della Gleba, praticata a lungo dal nostro stesso paese, si è trasformata in un ostacolo per le nostre ambizioni economiche. Considerando il clima politico instabile del nostro tempo potrebbe essere saggio abolire la pratica per decreto, per placare sia la nostra crescente classe media sia alleviare la sofferenza di coloro sotto la frusta."
 abolish_serfdom_decision.a: "Firmiamo il decreto."
 abolish_serfdom_decision.b: "Questo sarebbe troppo destabilizzante."

 abandon_absolutism_decision.title: "Abbandona l'Assolutismo"
 abandon_absolutism_decision.desc: "Il governo assolutista del nostro sovrano è diventato sempre più una minaccia per la stabilità interna del nostro paese. Le voci di ribellione sono diventate frequenti e la repressione di coloro che si oppongono al nostro regime non è un compito facile. Forse è tempo di voltare le spalle agli antichi ideali assolutisti e abbracciare una forma di governo più liberale per il nostro paese?"
 abandon_absolutism_decision.a: "L'assolutismo non è più adatto a noi."
 abandon_absolutism_decision.b: "La nostra autorità è suprema!"

 jewish_expulsion_threat.title: "Minaccia di Espulsione"
 jewish_expulsion_threat.desc: "La Corona emette un ultimatum formale: le comunità ebraiche devono pagare un tributo straordinario o affrontare l'espulsione. La minaccia estrae un guadagno immediato dalle comunità spaventate, ma il perdurante clima d'insicurezza sconvolge le reti commerciali a lungo sostenute dagli intermediari ebrei."
 jewish_expulsion_threat.a: "Emettiamo l'ultimatum."
 jewish_expulsion_threat_cooldown_tt: "$sponsor_a_cathedral_cooldown_tt$"
 STATIC_MODIFIER_NAME_jewish_expulsion_threat: "Minaccia di Espulsione"
 jews_may_choose_to_leave_tt: "La maggior parte dei nostri [pops|e] [ShowReligionAdjective('judaism')] migrerà verso [countries|e] vicini\n\nOgni [location|e] che lasceranno subirà [ShowModifier('jewish_expulsion_threat')], scalato in base alla loro quota di [pops] [ShowReligionAdjectiveWithNoTooltip('judaism')]"
 sponsor_a_cathedral_cost_estimate_tt: "La [ShowBuildingTypeName('cathedral')] avrà un prezzo base di 400@gold!. Verrà scontato di $royal_sponsorship$ ed è influenzato dalla [location|e] in cui viene costruita."
 sponsor_a_great_madrasa_cost_estimate_tt: "La [ShowBuildingTypeName('great_madrasa')] avrà un prezzo base di [ShowNamedValue('expensive_build_price_age_of_tradition')|0]@gold!. Verrà scontato di $royal_sponsorship$ ed è influenzato dalla [location|e] in cui viene costruita."
