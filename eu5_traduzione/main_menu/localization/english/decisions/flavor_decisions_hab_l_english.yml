l_english:
 hab_monastery_reform_melk_decision.title: "Il Movimento Riformista di [ShowLocationNameWithNoTooltip('melk')]"
 hab_monastery_reform_melk_decision.desc: "Alcuni membri del nostro [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si sono incontrati nell'area di [ShowLocationName('melk')] per discutere il costante declino della cultura monastica in [ROOT.GetCountry.GetName]. Con sempre più lamentele in aumento, diventa chiaro che i nostri monasteri hanno un disperato bisogno di riforme. Se agiamo rapidamente, potremmo essere visti come un esempio luminoso di riforme [ROOT.GetCountry.GetReligion.GetAdjective]."
 hab_monastery_reform_melk_decision.desc.entry: "Un monastero che ha dimenticato la propria regola vale meno per noi di un campo vuoto, e i nostri sono andati alla deriva per anni. La riunione a [ShowLocationName('melk')] ci dà un pretesto per agire mentre il mondo [ShowReligionAdjective('catholic')] osserva, e per essere visti guidare piuttosto che seguire."
 hab_monastery_reform_melk_decision.a: "Implementiamo le riforme."
 hab_monastery_reform_melk_decision.b: "I metodi attuali vanno bene."

 hab_vienna_concordat_decision.title: "Il Concordato di [ShowLocationNameWithNoTooltip('vienna')]"
 hab_vienna_concordat_decision.desc: "Dopo lunghe negoziazioni con le delegazioni papali, abbiamo finalmente raggiunto un punto accettabile che rappresenta sia gli interessi di [ROOT.GetCountry.GetName] che di [GetCountry('PAP').GetName]. Dopo secoli di ostilità e dubbio tra il [GetUniqueInternationalOrganization('hre').GetName] e il [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle], questo potrebbe essere un punto di svolta nelle nostre relazioni, stabilendo un terreno amichevole tra noi."
 hab_vienna_concordat_decision.desc.entry: "Imperatori e papi hanno passato secoli a disputare su chi nomini chi, e la disputa non ha mai avvantaggiato nessuno dei due. Un accordo stabilito con il Papa scambierebbe parte della nostra libertà di nomina per qualcosa che non abbiamo mai avuto: un papato che non tratta il $hre$ come un rivale."
 hab_vienna_concordat_decision.a: "Firmiamo il trattato!"
 hab_vienna_concordat_decision.b: "Non abbiamo bisogno dell'aiuto del [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]."

 hab_monastery_reform_accepted_decision.title: "Il Consiglio dei [ShowBuildingTypeNameWithNoTooltip('monastery')] di [ROOT.GetCountry.GetNameWithNoTooltip]"
 hab_monastery_reform_accepted_decision.title.entry: "Il Consiglio dei [ShowBuildingTypeNameWithNoTooltip('monastery')] di $HAB$"
 hab_monastery_reform_accepted_decision.desc: "Con la Riforma che raggiunge il nostro paese, ha anche gravi conseguenze per la nostra organizzazione dei [ShowBuildingTypeName('monastery')]. I [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si lamentano della mancanza di nuovi membri negli edifici [ShowBuildingTypeNameWithNoTooltip('monastery')] e dello stato finanziario disperato in cui si trovano. Potremmo istituire un consiglio che prenderebbe in mano l'amministrazione dei [ShowBuildingTypeNameWithNoTooltip('monastery')] nella speranza di risolvere il problema."
 hab_monastery_reform_accepted_decision.desc.entry: "Sale dei novizi vuote e casse vuote sono problemi amministrativi prima di essere problemi spirituali. Un consiglio che tiene i cordoni della borsa di ogni [ShowBuildingTypeName('monastery')] nelle nostre terre potrebbe rimetterli in ordine molto più velocemente di quanto i $clergy_estate$ riusciranno a fare da soli."
 hab_monastery_reform_accepted_decision.a: "Riformiamo la struttura dei [ShowBuildingTypeNameWithNoTooltip('monastery')]."
 hab_monastery_reform_accepted_decision.a.tt: "Sblocca il [ShowProductionMethodName('hab_reformed_monastery_maintenance')] per tutti gli edifici [ShowBuildingTypeNameWithNoTooltip('monastery')] nel nostro paese."
 hab_monastery_reform_accepted_decision.b: "Dovranno semplicemente adattarsi da soli."

 hab_tractatus_incorporalibus_decision.title: "Le Difficoltà dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]"
 hab_tractatus_incorporalibus_decision.title.entry: "Le Difficoltà dei $peasants_estate$"
 hab_tractatus_incorporalibus_decision.desc: "Rappresentanti dei [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] si sono rivolti a [target_ruler.GetName] per ottenere aiuto nella loro attuale posizione debole a causa delle continue tensioni della guerra. Sebbene ci importi poco delle opinioni di questi contadini, è innegabile che dobbiamo assicurarci la loro cooperazione per la necessaria tassazione e il sostegno militare. Concedendo loro un insieme di leggi che regolino i loro doveri verso il loro signore, potremmo regolare il rapporto tra entrambe le parti e assicurare una cooperazione legale, rendendo più facili da risolvere le future dispute."
 hab_tractatus_incorporalibus_decision.desc.entry: "Gli obblighi che esistono solo per consuetudine vengono contestati a ogni raccolto scarso, e la guerra ha reso scarso ogni raccolto. Metter per scritto i doveri dei $peasants_estate$ li vincola con la stessa certezza con cui vincola i loro signori, e un contadino che sa esattamente cosa deve è un contadino che paga."
 hab_tractatus_incorporalibus_decision.a: "Concediamo loro il privilegio."
 hab_tractatus_incorporalibus_decision.b: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] osano pretendere cose da noi?"
 hab_tractatus_incorporalibus_decision.b.entry: "I $peasants_estate$ osano pretendere cose da noi?"

 hab_geheime_kabinettskanzlei_decision.title: "[ShowGovernmentReformNameWithNoTooltip('geheime_kabinettskanzlei')]"
 hab_geheime_kabinettskanzlei_decision.desc: "Lo spionaggio può essere un mestiere poco affidabile, specialmente quando dobbiamo contare su connessioni dirette con singoli individui. Altri paesi hanno già istituito organizzazioni per coprire queste necessità e dovremmo ora crearne una di queste Camere Nere noi stessi. Il [ShowGovernmentReformName('geheime_kabinettskanzlei')] svolgerebbe il proprio lavoro sotto la copertura di un ufficio postale, dandogli facile accesso alla posta che transita nel nostro paese."
 hab_geheime_kabinettskanzlei_decision.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hab_geheime_kabinettskanzlei_decision.a.entry: "$common_string_alright$"
 hab_geheime_kabinettskanzlei_decision.a_tt: "Sblocca il [government_reform|e] [ShowGovernmentReformName('geheime_kabinettskanzlei')]"
 hab_geheime_kabinettskanzlei_decision.b: "L'intelligence è una risorsa inutile."

 hab_geheimer_rat_decision.title: "Istituzionalizzare il [ShowAdvanceNameWithNoTooltip('geheimrat')]"
 hab_geheimer_rat_decision.desc: "Sebbene la nostra recente istituzione del [ShowAdvanceName('geheimrat')] sia stata ampiamente celebrata, alcuni al nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] si chiedono se questa istituzione informale sia sufficiente. Sostengono che forse dovrebbe essere istituzionalizzata come parte integrante delle politiche del [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], assicurando che solo gli individui più fidati e capaci influenzino gli affari del [ROOT.GetCountry.GetFlavorRank]."
 hab_geheimer_rat_decision.desc.entry: "Un circolo informale di consiglieri dura esattamente quanto il sovrano che lo ha riunito. Scritto negli uffici della $crown_estate$, il [ShowAdvanceName('geheimrat')] ci sopravviverebbe e manterrebbe gli affari del regno nelle mani dei pochi uomini adatti a conoscerli."
 hab_geheimer_rat_decision.a: "Istituzionalizziamolo!"
 hab_geheimer_rat_decision.a.tt: "Sblocca eventi su importanti personalità che furono membri del [ShowGovernmentReformName('hab_geheimer_rat')]."
 hab_geheimer_rat_decision.b: "La sua forma attuale serve bene al suo scopo."

 hab_privilegium_maius_decision.title: "Il Privilegium Maius nelle Nostre Mani"
 hab_privilegium_maius_decision.desc: "Ora che siamo stati eletti alla posizione di [GetUniqueInternationalOrganization('hre').GetLeaderTitle], possiamo finalmente correggere il grave errore commesso dai nostri predecessori come [GetUniqueInternationalOrganization('hre').GetLeaderTitle]. Come guida del [GetUniqueInternationalOrganization('hre').GetName], possiamo ora concedere i privilegi che la dinastia [target_ruler.GetDynasty.GetName] merita."
 hab_privilegium_maius_decision.desc.entry: "Ci è stata negata la piena proclamazione dei nostri legittimi privilegi dai precedenti Imperatori. Ora che la corona imperiale riposa sul nostro capo, è finalmente tempo di correggere questo torto."
 hab_privilegium_maius_decision.a: "È tempo di correggere questo torto."
 hab_privilegium_maius_decision.privilegium_not_granted_tt: "Il Privilegium Maius non è ancora stato pienamente Concesso"
 hab_privilegium_maius_decision.privilegium_not_decided_tt: "È dopo il 1370 e il Privilegium Maius non è ancora stato proposto"