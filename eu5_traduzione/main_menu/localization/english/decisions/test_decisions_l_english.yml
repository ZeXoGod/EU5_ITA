l_english:
 test_decision_simple.title: "Decisione di Test (Opzioni Multiple)"
 test_decision_simple.desc: "Una decisione di test con tre opzioni. Usata per verificare che il modello dati delle decisioni venga analizzato correttamente e che l'effetto di ogni opzione funzioni dall'inizio alla fine."
 test_decision_simple.a: "Prendi l'oro (+10)"
 test_decision_simple.b: "Paga l'oro (-10)"
 test_decision_simple.c: "Non fare nulla"

 test_decision_only_once.title: "Decisione di Test (Una Volta per Partita)"
 test_decision_only_once.desc: "Una decisione di test che può essere presa solo una volta per campagna. Usata per verificare che il flag only_once persista tra salvataggio/caricamento e impedisca di riprenderla."
 test_decision_only_once.a: "Reclama l'inatteso guadagno (+50 oro)"
 test_decision_only_once.b: "Rifiuta"
