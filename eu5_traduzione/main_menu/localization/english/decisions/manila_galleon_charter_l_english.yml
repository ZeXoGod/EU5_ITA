 charter_manila_galleon.title: "Noleggia un Galeone di Manila"
 charter_manila_galleon.desc: "Con la rotta di ritorno attraverso il Pacifico tracciata e provata, l'oceano non è più una barriera ma una strada. Equipaggiamo un grande galeone sulla nostra costa occidentale, carichiamo le sue stive d'argento, e inviamolo lungo il passaggio settentrionale verso l'Asia e ritorno — argento all'andata, seta e spezie al ritorno. La spesa è pesante e il viaggio lungo, ma un singolo galeone tornato sano e salvo si ripaga molte volte. Non tornerà entro l'anno, e il mare potrebbe ancora prenderselo; ma se torna a casa, tornerà anche la sua fortuna."
 charter_manila_galleon.a: "Equipaggia il galeone e carica l'argento della stagione."
