l_english:
 mos_prikazi_decision.title: "Istituisci gli Uffici dei $prikazi_reform$"
 mos_prikazi_decision.desc: "L'assenza di un'amministrazione efficiente è vista come un ostacolo per [ROOT.GetCountry.GetName] a prendere il proprio legittimo posto tra le grandi potenze. Potremmo migliorare la governance istituendo una serie di uffici per supervisionare diverse aree degli affari governativi, che a loro volta possono accelerare l'implementazione di vari decreti di [ROOT.GetCountry.GetGovernment.GetRuler.GetName] e aiutare a centralizzare il potere."
 mos_prikazi_decision.desc.entry: "Un sovrano che firma un decreto non ha alcuna garanzia che qualcuno a valle lo leggerà, figuriamoci che gli obbedirà. Uffici permanenti, ciascuno responsabile per una parte degli affari dello stato, porterebbero la parola del sovrano più lontano di quanto la sola reputazione del sovrano potrebbe mai fare."
 mos_prikazi_decision.a: "Come potremmo altrimenti funzionare."
 mos_prikazi_decision.b: "Le redini libere sono la ricetta per il successo."
 mos_prikazi_decision.tt1: "Vengono istituiti diversi uffici, permettendo ai [cabinet_members|e] di supervisionarli tramite [cabinet_action|e]"
 enable_prikazi_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('prikazi_reform')]"
 mos_prikazi_decision.historical_info: "I Prikazi si riferiscono agli uffici amministrativi in essere durante il periodo dello Zarato e dei primi tempi dell'Impero Russo. Erano essenziali per implementare le politiche e le decisioni dello Zar, ma si occupavano anche delle funzioni quotidiane relative agli affari di stato. Alcuni degli uffici più grandi si occupavano di questioni relative agli affari esteri ed erano cruciali in un'epoca in cui la Russia si vedeva circondata da nemici e ancora alle prese con l'affermazione della propria indipendenza dall'Orda d'Oro."

 mos_razriadnyi_decision.title: "[ShowGovernmentReformNameWithNoTooltip('razriadnyi_reform')]"
 mos_razriadnyi_decision.desc: "Ci sono pochi registri disponibili su popolazione, proprietà e tassazione, il che rende più difficile controllare la spesa e finanziare un'espansione della nostra amministrazione. Potremmo condurre un censimento regolare, condotto dalla neo-istituita [ShowGovernmentReformName('razriadnyi_reform')], che fornirebbe registri dettagliati di individui e famiglie in tutto [ROOT.GetCountry.GetName], al fine di valutare le risorse e gli obblighi dei nostri soggetti."
 mos_razriadnyi_decision.desc.entry: "Un tesoro che non può contare i propri soggetti non può onestamente tassarli, e il nostro ha indovinato per anni. Un ufficio permanente del censimento metterebbe un numero reale su ciò che possiamo raccogliere in uomini e moneta, il che vale la pena saperlo ancora prima della prima campagna che esso finanzia."
 mos_razriadnyi_decision.a: "Esaminiamo ogni angolo e fessura."
 mos_razriadnyi_decision.b: "Una violazione della privacy e dell'integrità."
 enable_razriadnyi_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('razriadnyi_reform')]"
 mos_razriadnyi_decision.historical_info: "La Cancelleria Militare, #italic Razriadnyi Prikaz#!, introdusse un nuovo Censimento come mezzo per determinare l'obbligo fiscale della popolazione in base a ricchezza, proprietà e status sociale. Era anche un modo per assicurare che ogni estate fornisse la quantità richiesta di soldati e materiali di guerra in conformità con i propri obblighi. I registri divennero fondamentali per governare un territorio vasto e diversificato."

 mos_build_kremlin_decision.title: "Costruisci il Cremlino"
 mos_build_kremlin_decision.desc: "Le terre Rus' sono ripetutamente soggette a razzie ed è imperativo che siamo in grado di proteggere il nostro popolo durante i periodi di difficoltà. Il sistema di fortificazione che circonda [target_location.GetName] non è all'altezza del compito e potrebbe essere travolto, facendo retrocedere il nostro progresso verso il diventare una potenza regionale.\n\nDovremmo costruire una potente fortificazione con sezioni di muro che rivaleggerebbero con qualsiasi cosa nelle vicinanze."
 mos_build_kremlin_decision.desc.entry: "I razziatori non aspettano che le mura siano finite prima di metterle alla prova, e le nostre non sopravviverebbero alla prova. Ricostruire le difese di [ShowLocationName('moscow')] costa una fortuna che preferiremmo non spendere, ma perdere la città costa considerevolmente di più."
 mos_build_kremlin_decision.a: "Facciamo portare il migliore [ShowGoodsNameWithNoTooltip('lumber')]."
 mos_build_kremlin_decision.b: "Non desideriamo provocare i nostri vicini."
 mos_build_kremlin_decision.c: "Spoglia un [ShowBuildingTypeNameWithNoTooltip('castle')] soggetto per i materiali."
 threatened_by_military_expansion: "Minacciato dalle Espansioni Militari"
 safe_haven_during_raids: "Fornisce Rifugio Sicuro durante le Razzie"
 mos_build_kremlin_decision.tt1: "I vicini rivali percepiscono la costruzione di un potente [ShowBuildingTypeNameWithNoTooltip('kremlin')] come un atto ostile"
 mos_build_kremlin_decision.tt2: "I soggetti vicini considerano la costruzione di un potente [ShowBuildingTypeNameWithNoTooltip('kremlin')] un rifugio sicuro durante le razzie"
 mos_build_kremlin_decision.a.custom1: "Ogni paese vicino perde [ShowBiasValue('threatened_by_military_expansion')|+=0] di [opinion|e] su di noi"
 mos_build_kremlin_decision.a.custom2: "Ogni [subject|e] vicino ottiene [ShowBiasValue('safe_haven_during_raids')|+=0] di [opinion|e] su di noi"
 mos_build_kremlin_decision.b.custom1: "Ogni paese vicino ottiene #G 3#! di [trust|e] verso di noi"
 mos_build_kremlin_decision.b.custom2: "Ogni [subject|e] vicino perde [ShowBiasValue('lack_of_protection')|+=0] di [opinion|e] su di noi"
 lack_of_protection: "Mancanza di Protezione"
 mos_kremlin_construction: "Costruzione del Cremlino"
 mos_build_kremlin_decision.tt3: "Quasi tutto il [ShowGoodsName('clay')] e il [ShowGoodsName('lumber')] necessari vengono ottenuti demolendo forzatamente il [ShowBuildingTypeNameWithNoTooltip('castle')] in una delle località dei nostri soggetti"
 mos_build_kremlin_decision.historical_info: "Il Cremlino di Mosca originale fu costruito principalmente in legno e arrivò a includere non solo mura e torri, ma anche molti edifici amministrativi. La sua costruzione fu un progetto costoso, ma fu considerata necessaria a causa della provata inefficacia dei semplici bastioni in legno usati fino a quel momento contro le ripetute razzie schiaviste tatare e gli assedi nemici."

 mos_vestiarium_decision.title: "Il Vestiarium"
 mos_vestiarium_decision.desc: "Il tesoro regio resta privo di documentazione e manca di qualsiasi tipo di inventario, rendendo difficile accertare il valore complessivo dei beni accumulati. È imperativo che creiamo un mezzo per gestire meglio la nostra ricchezza, poiché può essere usata per promuovere sia obiettivi diplomatici sia aiutare a rafforzare il governo di tutto il paese."
 mos_vestiarium_decision.a: "Una governance efficiente è la chiave del successo."
 mos_vestiarium_decision.b: "La rete della diplomazia deve essere intrecciata."
 mos_vestiarium_decision.custom: "Concede accesso alla [law|e] [ShowLawName('vestiarium')]"
 mos_vestiarium_decision.historical_info: "Il #italic Vestiarium#! di Vasilij I era un inventario di oggetti di valore appartenenti al tesoro regio. Fu introdotto per creare un registro finanziario e d'inventario di qualsiasi cosa, da metalli preziosi, gioielli, tessuti e abiti, a oggetti che potevano essere usati per cerimonie di stato e doni diplomatici."

 mos_byzantine_court_ceremonies_decision.title: "Legami con la Vecchia Dinastia $BYZ_ADJ$"
 mos_byzantine_court_ceremonies_decision.desc: "La caduta di [ShowLocationName('constantinople')] ci ha presentato l'opzione di sposare la ex classe dominante di [GetCountry('BYZ').GetName]. La mano in matrimonio di [sophia_palaiologina.GetName] introdurrebbe le influenze della cultura [GetCountry('BYZ').GetAdjectiveWithNoTooltip] nel nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle], rafforzerebbe la nostra pretesa di essere il naturale successore dell'Impero Romano e portatore della fiaccola della fede [ShowReligionAdjective('orthodox')], e qualsiasi discendente del [ROOT.GetCountry.GetGovernment.GetRulerTitle] sarebbe in grado di rivendicare la propria discendenza dagli imperatori dell'impero caduto."
 mos_byzantine_court_ceremonies_decision.desc.entry: "Una corona presa con la conquista è comunque una corona presa con la forza; una corona ottenuta tramite matrimonio appare più come un'eredità. Legando il sangue di [ShowLocationName('constantinople')] alla nostra linea, qualsiasi figlio di quell'unione potrebbe un giorno rivendicare la discendenza da imperatori piuttosto che da meri conquistatori."
 mos_byzantine_court_ceremonies_decision.a: "Un'unione profetizzata."
 mos_byzantine_court_ceremonies_decision.a_tt: "Il nostro sovrano sposerà una discendente della dinastia regnante bizantina, divorziando dal coniuge attuale se necessario."
 mos_byzantine_court_ceremonies_decision.b: "Offre poco vantaggio."
 mos_byzantine_court_ceremonies_decision.tt1: "Una discendente della dinastia regnante bizantina viene aggiunta come [character|e]"
 enable_byzantine_court_ceremonies_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('byzantine_court_ceremonies_reform')]"
 mos_byzantine_court_ceremonies_decision.tt2: "Il suo risentimento mostrato verso certi diplomatici inasprisce le relazioni diplomatiche tra noi e i nostri vicini [heathen|e]"
 STATIC_MODIFIER_NAME_mongol_intolerance: "Intolleranza Mongola"
 mos_byzantine_court_ceremonies_decision.historical_info: "Il matrimonio tra Ivan III e Sofia Paleologa introdusse elaborate cerimonie di corte e un'etichetta alla corte moscovita, che aiutarono a rafforzare la sua pretesa di essere la Terza Roma. Sofia avrebbe dato alla luce undici figli e sarebbe diventata la nonna del famigerato Ivan il Terribile. La sua intolleranza verso il dominio mongolo causò diversi incidenti diplomatici e aiutò ad accelerare la rottura di Mosca dall'Orda d'Oro nel 1480."

 mos_monastic_reformation_decision.title: "Istituzionalizza gli Insegnamenti di Nil Sorskij"
 mos_monastic_reformation_decision.desc: "Il pioniere spirituale Nil Sorskij sta facendo campagna per una riforma all'interno della Chiesa come risposta alla ricchezza e al materialismo che si sono insinuati in alcuni monasteri [ROOT.GetCountry.GetAdjective]. Il suo movimento, conosciuto come i Non-Possessori, propone un ritorno ai principi di povertà e umiltà, con enfasi su uno stile di vita semplice completamente devoto agli insegnamenti di Cristo. Qualsiasi tentativo di questo tipo incontrerà probabilmente resistenza da parte della Chiesa stabilita, che crede sia imperativo mantenere una certa ricchezza materiale per svolgere le proprie funzioni."
 mos_monastic_reformation_decision.desc.entry: "Nil Sorskij predica che un monaco che possiede terra ha già perso l'argomento per non possedere nient'altro, e abbastanza del clero è d'accordo con lui da rendere nervosa la Chiesa. Sostenere i Non-Possessori ci costa la benevolenza di ogni monastero ricco, ma compra la lealtà di ogni monaco che non ne ha mai voluta uno."
 mos_monastic_reformation_decision.a: "Sostieni i Non-Possessori."
 mos_monastic_reformation_decision.b: "Sostieni i Possessori."
 mos_monastic_reformation_decision.custom1: "Concede accesso alla [law|e] [ShowLawName('monastic_reformation_movement')]"
 mos_monastic_reformation_decision.custom2: "Una [policy|e] sotto la [law|e] [ShowLawName('monastic_reformation_movement')] può essere cambiata solo una volta ogni dieci anni"
 mos_monastic_reformation_decision.historical_info: "Nil Sorskij era un monaco ortodosso russo che aiutò a formare il movimento conosciuto come i Non-Possessori. Era composto da monaci che cercavano una rigida adesione alla povertà monastica, criticando quindi il possesso di terra e ricchezza da parte dei monasteri. Gli insegnamenti incontrarono l'opposizione di alcuni all'interno della Chiesa che erano resistenti ai cambiamenti proposti. Tuttavia, il suo insegnamento lasciò un segno duraturo nella spiritualità russa, e Nil Sorskij è oggi venerato come santo nella Chiesa Ortodossa Orientale."

 mos_stroganov_school_decision.title: "Istituisci la Scuola Stroganov"
 mos_stroganov_school_decision.desc: "La ricca famiglia mercantile degli [ShowDynastyName('stroganov_dynasty')] è una forte sostenitrice delle Arti e sta considerando la sponsorizzazione di una scuola locale per la creazione di icone religiose, gran parte delle quali viene usata per adornare i loro molti palazzi in tutto il [ROOT.GetCountry.GetFlavorRank]. Qualsiasi opera d'arte creata dalla scuola sarebbe progettata specificamente per uso privato ed è improbabile che benefici il paese nel suo insieme, ma riaffermerebbe il sostegno della potente famiglia e contribuirebbe al benessere spirituale di [ROOT.GetCountry.GetName]."
 mos_stroganov_school_decision.desc.entry: "Gli [ShowDynastyName('stroganov_dynasty')] vogliono icone per le proprie cappelle, non santi per la nazione, e sono pronti a pagare per questo privilegio. Una scuola costruita con il loro denaro non produce nulla che il tesoro possa spendere, solo una famiglia che ci deve meno e si aspetta di più."
 mos_stroganov_school_decision.a: "Ci facciamo favori a vicenda."
 mos_stroganov_school_decision.b: "Promuoviamo invece i loro affari."
 mos_stroganov_school_decision.c: "Lasciamo che esercitino influenza a corte."
 enable_stroganov_influences_cabinet_action: "La [cabinet_action|e] [ShowCabinetActionName('stroganov_influences')] diventa disponibile ai membri della dinastia degli [ShowDynastyNameWithNoTooltip('stroganov_dynasty')]"
 mos_stroganov_school_decision.historical_info: "La Scuola Stroganov di pittura di icone fu fondata durante un periodo in cui la pittura medievale fioriva in Russia, precedendo l'inizio dell'occidentalizzazione dell'arte che in seguito si estese all'Europa Orientale. L'arte creata era in gran parte un riflesso dei gusti dei mecenati reali e nobili, finendo per includere anche lo Zar. La scuola godette di popolarità fino alla fondazione di San Pietroburgo, che accelerò il suo declino mentre le influenze occidentali presero gradualmente piede."

 mos_novodevichy_convent_decision.title: "Il Convento di Novodevičij"
 mos_novodevichy_convent_decision.desc: "In seguito alla trionfante conquista di [ShowAreaName('smolensk_area')], si presenta un'opportunità per commemorare la vittoria fortificando la cintura defensiva meridionale di [ShowLocationName('moscow')] per la sicurezza di [ROOT.GetCountry.GetName]. L'idea di costruire un convento fortificato nasce da una necessità strategica, ma potrebbe anche essere usata per ospitare le molte donne [ShowPopTypeName('nobles')] che sono state costrette a prendere i voti, assicurando il favore tra i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] nel processo."
 mos_novodevichy_convent_decision.desc.entry: "Una vittoria vale di più se qualcosa di pietra e permanente la ricorda. Un convento fortificato a sud di [ShowLocationName('moscow')] proteggerebbe l'accesso conquistato a [ShowAreaName('smolensk_area')] mentre discretamente assorbe le figlie [ShowPopTypeName('nobles')] che nessun altro vuole sposare, una comodità che i $nobles_estate$ non ammetteranno apertamente di volere."
 mos_novodevichy_convent_decision.a: "Più valore per il denaro spesso."
 mos_novodevichy_convent_decision.b: "[ShowLocationNameWithNoTooltip('moscow')] è già adeguatamente difesa."
 mos_novodevichy_convent_decision.c: "Offri uno stipendio alle donne coinvolte."
 mos_novodevichy_convent_decision.historical_info: "Il Convento di Novodevičij fu fondato dal Gran Principe Vasilij III in onore della riuscita conquista dell'area di Smolensk. Fu istituito come fortezza e istituzione religiosa per proteggere gli accessi occidentali alla città. Il convento fornì anche residenza alle donne delle famiglie regali russe incoraggiate ad abbracciare la vita monastica."

 mos_limit_namestnik_decision.title: "I Poteri dei Namestnik"
 mos_limit_namestnik_decision.desc: "I Viceré Namestnik esercitano un potere considerevole che permette loro di governare le regioni più remote di [ROOT.GetCountry.GetName]. Questo accordo presenta una serie di sfide, come il negarci una porzione significativa delle entrate generate e le difficoltà nel mantenere la loro obbedienza. Dovremmo lavorare per stabilire un controllo diretto sulla governance regionale e centralizzare l'amministrazione, potenzialmente a spese delle élite locali."
 mos_limit_namestnik_decision.desc.entry: "Un viceré che governa una provincia senza supervisione presto la governa come se fosse sua. Un governo diretto dal centro restituirebbe le entrate che i Namestnik attualmente trattengono per sé, al costo di ogni lealtà locale su cui quegli uffici sono stati costruiti."
 mos_limit_namestnik_decision.a: "È una cosa del passato."
 mos_limit_namestnik_decision.b: "Non tocchiamo ciò che non è disturbato."
 disable_namestnik_policy: "La [policy|e] [ShowPolicyName('namestnik_policy')] diventa non disponibile"
 mos_limit_namestnik_decision.historical_info: "I Namestnik detenevano significativi poteri amministrativi ed esecutivi in Russia, agendo come rappresentanti del monarca nei territori distanti. I loro poteri furono in qualche modo limitati durante il regno di Ivan IV, tuttavia sarebbero durati fino a quando una serie di riforme furono istigate da Pietro 'il Grande', come parte dei cambiamenti generali alla struttura amministrativa della Russia."

 mos_posolsky_prikaz_decision.title: "Posolskij Prikaz"
 mos_posolsky_prikaz_decision.desc: "Il diligente lavoro di [ivan_viskovatiy.GetName] ha dato i suoi frutti, risultando in una gestione più efficiente degli affari esteri e in una burocrazia razionalizzata. Si propone ora di istituire un ufficio separato per gestire le questioni relative alla diplomazia e simili, per stabilire gli stessi standard che si applicano alle altre aree governative."
 mos_posolsky_prikaz_decision.desc.entry: "$name_john.east_slavic_language$ $Viskovatiy$ ha gestito gli affari esteri in modo efficiente per qualche tempo senza un ufficio adeguato da cui gestirli. Rendere permanente questo accordo non ci costa nulla che il suo talento non stesse già discretamente fornendo."
 mos_posolsky_prikaz_decision.a: "Una scelta sensata."
 mos_posolsky_prikaz_decision.b: "Una bottega per intrighi internazionali."
 enable_posolsky_cabinet_action: "Concede accesso alla [cabinet_action|e] [ShowCabinetActionName('posolsky')]"
 mos_posolsky_prikaz_decision.historical_info: "Il #italic Posolskij Prikaz#! fungeva da ufficio governativo che supervisionava gli affari esteri e diplomatici. Giocò un ruolo importante nella gestione delle relazioni diplomatiche, nel dispiegamento di ambasciatori e nell'amministrazione degli affari internazionali."


 mos_moscow_artillery_yard_decision.title: "Cantiere dell'Artiglieria di [ShowLocationNameWithNoTooltip('moscow')]"
 mos_moscow_artillery_yard_decision.desc: "Con l'avanzamento della tecnologia dell'artiglieria sul campo di battaglia, diventa sempre più cruciale essere in grado di fornire all'esercito un'ampia scorta di pezzi di munizioni per sostenere lo sforzo bellico. Dovremmo incaricare i nostri ingegneri di istituire una struttura dedicata focalizzata sulla produzione di artiglieria, trasformando [ShowLocationName('moscow')] in un centro di innovazioni tecnologiche e un fornitore affidabile."
 mos_moscow_artillery_yard_decision.a: "Un affare esplosivo."
 mos_moscow_artillery_yard_decision.b: "Tempo meglio spesso in esercitazioni militari."
 mos_moscow_artillery_yard_decision.historical_info: "Il Cantiere dell'Artiglieria di Mosca fu costruito durante il regno di Ivan IV, e giocò un ruolo importante nel potenziare le capacità militari della Russia. La produzione di cannoni e artiglieria fu cruciale per l'espansione dell'influenza militare russa, e contribuì ai suoi successi militari in diversi conflitti."

 mos_ban_oprichniki_decision.title: "Le Razzie degli Opričniki"
 mos_ban_oprichniki_decision.desc: "Gli Opričniki continuano a eseguire l'esecuzione di individui percepiti come sleali. Recentemente, diverse proprietà [ShowPopTypeName('nobles')] in aree rurali sono state prese di mira, portando i [ShowPopTypeName('peasants')] assegnati alla terra a essere sfollati poiché proibiti di lasciare la casa a cui sono assegnati. Se questa situazione non viene affrontata prontamente, rischiamo di affrontare carenze alimentari endemiche."
 mos_ban_oprichniki_decision.a: "Metti fine agli Opričniki."
 mos_ban_oprichniki_decision.b: "Non è una nostra preoccupazione."
 STATIC_MODIFIER_NAME_displaced_farmers: "Agricoltori Sfollati"
 disable_oprichnik_policy: "La [policy|e] [ShowPolicyName('oprichnik_policy')] diventa non disponibile"
 mos_ban_oprichniki_decision.historical_info: "Gli Opričniki furono coinvolti nella confisca di proprietà da coloro ritenuti nemici dello stato. Questa pratica consolidò ulteriormente il potere economico dello Zar e dei suoi fedeli sostenitori, ma ebbe l'effetto indesiderato di far sfollare e cacciare via i contadini mentre i loro ex padroni venivano uccisi o catturati. Ciò a sua volta ebbe un effetto devastante sulla produzione alimentare poiché i campi vennero lasciati incolti."

 mos_aptekarsky_prikaz_decision.title: "Aptekarskij Prikaz"
 mos_aptekarsky_prikaz_decision.desc: "Gli uffici governativi istituiti in conformità con la riforma [ShowGovernmentReformName('prikazi_reform')] svolgono ciascuno un ruolo distinto all'interno della macchina governativa, eppure la recente pestilenza evidenzia la necessità di un rinnovato focus sulle questioni relative alla salute e al benessere dei nostri soggetti. Dobbiamo istituire un ufficio separato per coordinare meglio qualsiasi risposta necessaria per quando si verificherà la prossima punizione divina o epidemia mortale, o rischiamo una carenza di lavoratori capaci per coltivare le terre e difendere il nostro grande [ROOT.GetCountry.GetFlavorRank]."
 mos_aptekarsky_prikaz_decision.desc.entry: "Gli uffici Prikazi non sono ben equipaggiati per gestire le epidemie e fornire politiche per quelle parti del nostro paese colpite dalla peste. Dovremmo creare un nuovo ufficio separato dagli uffici preesistenti, fornendo aiuto nel caso in cui la pestilenza colpisca nuovamente la nostra popolazione."
 mos_aptekarsky_prikaz_decision.a: "Sanguisughe e salassi per tutti."
 mos_aptekarsky_prikaz_decision.b: "Tutto ciò di cui abbiamo bisogno è la preghiera."
 mos_aptekarsky_prikaz_decision.tt1: "La corte si rallegra per il trattamento medico preferenziale offerto agli strati superiori della società dall'Aptekarskij Prikaz"
 enable_aptekarsky_cabinet_action: "Concede accesso alla [cabinet_action|e] [ShowCabinetActionName('aptekarsky')]"
 mos_aptekarsky_prikaz_decision.historical_info: "L'Aptekarskij Prikaz era un ufficio governativo con un ampio raggio di responsabilità, inclusa la supervisione della produzione e distribuzione di medicinali, la regolamentazione delle farmacie e l'affrontare questioni relative alla salute pubblica. Era anche incaricato del benessere e della salute dello Zar e della sua corte. L'Aptekarskij Prikaz rimase una parte importante dell'amministrazione della Russia Imperiale fino al suo smantellamento in seguito alla rivoluzione del 1917."

 mos_bolshogo_dvortsa_prikaz_decision.title: "$bolshogo_dvortsa$"
 mos_bolshogo_dvortsa_prikaz_decision.desc: "Il Governatore [alexey_lvov.GetName] di [ShowLocationName('nizhny_novgorod')] è recentemente tornato a corte per assumere le responsabilità di Okolnichy, un ruolo senior che gli permetterebbe di assumere responsabilità amministrative aggiuntive. Potremmo espandere questo ruolo per includere anche un nuovo ufficio prikaz che supervisioni gli affari di palazzo e la supervisione dei monasteri, secondo la riforma [ShowGovernmentReformName('prikazi_reform')]. Esso si impegnerebbe verso una migliore gestione delle spese di corte e assicurerebbe che le politiche dei [ShowPolicyName('non_possessors')] siano completamente implementate."
 mos_bolshogo_dvortsa_prikaz_decision.desc.entry: "$name_alexis.east_slavic_language$ detiene già la fiducia che accompagna il rango di Okolnichy; la sola cosa che manca è un ufficio che lo rispecchi. Porre le proprietà del palazzo e i monasteri sotto un'unica mano fedele riordinerebbe un'amministrazione che da tempo ha gestito entrambi male e separatamente."
 mos_bolshogo_dvortsa_prikaz_decision.a: "Una soluzione gradevole."
 mos_bolshogo_dvortsa_prikaz_decision.b: "Nessun bisogno di supervisione aggiuntiva."
 enable_bolshogo_dvortsa_cabinet_action: "Concede accesso alla [cabinet_action|e] [ShowCabinetActionName('bolshogo_dvortsa')]"
 enable_bolshogo_dvortsa_cabinet_action.tt2: "I [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sono felicissimi della fiducia riposta in loro"
 mos_bolshogo_dvortsa_prikaz_decision.historical_info: "Il Principe Aleksej Michajlovič Lvov era un vice-governatore che salì rapidamente i ranghi del governo zarista, guidando delegazioni diplomatiche e servendo come ambasciatore dopo essere stato nominato maggiordomo della corte dello Zar. Servì come capo dell'ufficio degli affari di palazzo, un ruolo che avrebbe mantenuto fino al suo eventuale ritiro."

 mos_greek_latin_academy_decision.title: "Istituisci la $greek_latin_academy$"
 mos_greek_latin_academy_decision.desc: "Un pio studioso originario di [ShowLocationName('polotsk')] ha avanzato una proposta per istituire un'accademia linguistica, focalizzata principalmente sull'educare i funzionari governativi nella lingua della diplomazia, cioè il [latin.GetName]. [simon_sitnianowicz.GetName], non essendo estraneo a idee controverse, ha anche proposto che gli venga affidato l'insegnamento di grammatica, poetica e retorica al popolo comune. Una tale iniziativa dovrebbe essere lodata allocando fondi per assicurare che venga portata a termine."
 mos_greek_latin_academy_decision.desc.entry: "I nostri diplomatici mancano di competenza nella [ShowLanguageName('latin_language')], il che è un enorme svantaggio per i nostri affari esteri. $name_simeon.east_slavic_language$ $Sitnianowicz$ propone di insegnarlo propriamente, e ha inoltre offerto di insegnare retorica anche al popolo comune, al fine di rafforzare la loro padronanza della lingua."
 mos_greek_latin_academy_decision.a: "La comunicazione è fondamentale."
 mos_greek_latin_academy_decision.b: "Tempo meglio spesso in sermoni e predicazioni."
 mos_greek_latin_academy_decision.c: "Assumilo come tutore privato."
 mos_greek_latin_academy_decision.d: "Il popolo deve restare nell'ignoranza."
 mos_greek_latin_academy_decision.tt1: "$name_simeon.east_slavic_language$ $Sitnianowicz$ viene aggiunto come [character|e]"
 mos_greek_latin_academy_decision.tt2: "Dedica il suo tempo a diffondere idee illuminate e a creare poesia"
 mos_greek_latin_academy_decision.tt3: "I [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sono contenti di assistere all'esilio di un uomo di idee non ortodosse."
 mos_greek_latin_academy_decision.historical_info: "Simeone di Polotsk fu un monaco, poeta e traduttore ortodosso bielorusso ricordato per i suoi contributi letterari, considerati fondamentali per l'istituzione della tradizione cristiana ortodossa. Introdusse l'insegnamento del greco e del latino in Russia, e durante la sua vita aiutò anche a tradurre diverse opere di teologi occidentali, facilitando la diffusione della conoscenza verso la Chiesa Ortodossa."

 mos_collegium_decision.title: "Il Collegio"
 mos_collegium_decision.desc: "La recente revisione degli organi governativi ha richiesto una governance ministeriale più efficiente per prevenire qualsiasi sovrapposizione delle responsabilità delle agenzie. Eliminiamo il sistema esistente della [ShowGovernmentReformName('prikazi_reform')], sostituendolo con una serie di collegi. Ogni collegio avrà doveri distinti e una separazione dei poteri, con la responsabilità aggiunta di fornire consigli su casi non risolti quando richiesto."
 mos_collegium_decision.a: "Fuori il vecchio, dentro il nuovo."
 mos_collegium_decision.b: "La governance è delicata e non va manomessa."
 variable_prikazi_tt: "Il Sistema Prikaz Governa lo Stato"
 enable_collegium_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('collegium_reform')]"
 mos_collegium_decision.tt1: "La [government_reform|e] [ShowGovernmentReformNameWithNoTooltip('prikazi_reform')] e qualsiasi [cabinet_action|e] associata diventano non disponibili"
 mos_collegium_decision.tt2: "Vengono presi provvedimenti per migliorare l'amministrazione di [ShowLocationName('neva')] in linea con la [policy|e] [ShowPolicyName('dop_law_governing_senate')]"
 mos_collegium_decision.historical_info: "Dopo l'istituzione del Senato Direttivo, Pietro 'il Grande' istituì vari collegi come organi amministrativi responsabili di diversi aspetti della governance, come il Sinodo e il Collegio dell'Ammiragliato. L'ispirazione fu tratta da riforme simili recentemente implementate nella vicina Svezia. L'urgenza della riforma fu accelerata dal crescente numero di territori dell'Impero Russo."

 mos_sukharev_tower_decision.title: "Torre Suchareva"
 mos_sukharev_tower_decision.desc: "La marina dipende da una costante fornitura di marinai capaci e dal trasferimento di conoscenza da una generazione all'altra. Per accogliere le nostre ambizioni nautiche, dovremmo istituire una scuola che fornisca un'educazione tecnica per porre le basi di una continua espansione delle nostre forze armate. Un progetto per una maestosa torre è stato recentemente presentato e potrebbe ospitare tale istituzione, contribuendo al contempo all'abbellimento del paesaggio urbano di [ShowLocationName('moscow')]."
 mos_sukharev_tower_decision.a: "Un'ambizione adeguata."
 mos_sukharev_tower_decision.b: "Nessun bisogno di tali stravaganze."
 mos_sukharev_tower_decision.tt1: "L'ultimo piano viene destinato a James Bruce, che istituisce un osservatorio astronomico con una vista stellare"
 mos_sukharev_tower_decision.tt2: "Un sistema di approvvigionamento idrico d'avanguardia viene costruito al secondo piano per il beneficio di [ShowLocationName('moscow')]"
 mos_sukharev_tower_decision.historical_info: "La Torre Suchareva fu costruita alla fine del diciassettesimo secolo per commemorare la vittoria di Pietro 'il Grande' sugli Strelitz, che si erano sollevati contro di lui negli anni precedenti. La torre servì vari scopi nel corso degli anni, come caserma, strutture educative, infrastruttura e magazzino per mercanti, fino alla sua eventuale distruzione da parte delle autorità sovietiche nel 1934."

 mos_chosen_rada_decision.title: "Il Consiglio degli Eletti"
 mos_chosen_rada_decision.desc: "Il potere dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] impedisce la centralizzazione del potere necessaria per un rapido processo decisionale. È stato proposto di creare un consiglio esecutivo di individui scelti per aiutare ad accelerare le procedure governative e limitare l'influenza dei nobili, offrendo l'opportunità di affrontare diverse questioni e implementare le riforme necessarie. [alexi_adashev.GetName] e [sylvestr_the_priest.GetName] sono amici stretti del [ROOT.GetCountry.GetGovernment.GetRulerTitle] e si prevede che siedano nel consiglio."
 mos_chosen_rada_decision.desc.entry: "Un consiglio di favoriti risponde al sovrano; i $nobles_estate$ non rispondono a nessuno, il che è esattamente il problema. Porre $name_alexander.east_slavic_language$ $adashev$ e $name_silvester.east_slavic_language$ al centro del governo sposterebbe le decisioni fuori dall'assemblea e in una stanza che controlliamo davvero."
 mos_chosen_rada_decision.a: "Una formidabile forza di uomini capaci."
 mos_chosen_rada_decision.a_tt: "$name_alexander.east_slavic_language$ $adashev$ e $name_silvester.east_slavic_language$ si uniranno alla nostra [court|e]"
 mos_chosen_rada_decision.b: "Un tale consiglio non avrà alcuna influenza."
 mos_chosen_rada_decision.tt3: "$name_alexander.east_slavic_language$ $adashev$ e $name_silvester.east_slavic_language$ vengono braccati ed eseguiti con gioia dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 enable_chosen_rada_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('chosen_rada_reform')]"
 mos_chosen_rada_decision.historical_info: "Il Consiglio degli Eletti fu un gruppo di consiglieri che giocò un ruolo significativo nei primi anni del regno di Ivan IV. Era composto da individui come Aleksej Adašev e il sacerdote Sil'vestr, che erano consiglieri fidati del Gran Principe Ivan IV ed erano necessari per gli sforzi di Ivan di centralizzare il potere, riformare il sistema legale e affrontare varie questioni che affliggevano lo stato."

 rus_russian_absolutism_decision.title: "La Revisione Assoluta della Governance"
 rus_russian_absolutism_decision.desc: "È giunto il momento di modernizzare la governance di [ROOT.GetCountry.GetName] eliminando le tradizioni arcaiche e i mezzi di governo inefficienti. Rafforzando il potere legislativo del [ROOT.GetCountry.GetGovernment.GetRulerTitle] e assicurando che i decreti del sovrano vengano rapidamente implementati da un organo governativo coordinato e centralizzato, possiamo procedere e assicurarci che qualsiasi riforma non venga deragliata dalla corruzione e da appelli dispendiosi in termini di tempo."
 rus_russian_absolutism_decision.desc.entry: "Un decreto che deve sopravvivere a un consiglio prima di sopravvivere al contatto con la realtà è già stato mezzo sconfitto. Concentrare l'autorità nel sovrano e in un unico ministero coordinato permetterebbe alla riforma di superare in velocità gli appelli e i ritardi che hanno sepolto ogni precedente tentativo."
 rus_russian_absolutism_decision.a: "Un nuovo inizio."
 rus_russian_absolutism_decision.b: "Il Vecchio Modo è migliore!"
 enable_russian_absolutism_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('russian_absolutism')]"
 rus_russian_absolutism_decision.tt1: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sono infuriati dal palese disprezzo per i loro privilegi e diritti"
 rus_russian_absolutism_decision.historical_info: "Durante il regno di Pietro 'il Grande', egli sostituì le forme di governo medievali e obsolete con un'autocrazia efficace. Nel 1711, abolì il consiglio dei boiardi e istituì il Senato come organo supremo dello stato, coordinando le azioni centrali e locali, supervisionando le entrate e redigendo la legislazione. La disciplina militare fu applicata alle istituzioni civili, con un ufficiale di guardia in servizio presso il Senato."

 rus_state_controlled_church_decision.title: "La Tutela Governativa"
 rus_state_controlled_church_decision.desc: "Il Patriarcato conserva un potere e un'influenza considerevoli, eppure continua a ostacolare il progresso e l'innovazione in favore della tradizione e dell'accumulo di potere ecclesiastico. Deve essere abolito, e un nuovo sistema deve essere messo al suo posto per rafforzare il controllo governativo sulla Chiesa e assicurare la sua obbedienza allo stato."
 rus_state_controlled_church_decision.a: "Abolisci il Patriarcato."
 rus_state_controlled_church_decision.b: "$common_string_leave_them_be$"
 rus_state_controlled_church_decision.c: "Tutto come prima, per un prezzo."
 rus_state_controlled_church_decision.tt1: "Il Santo Sinodo impone una rigida censura su tutte le pubblicazioni"
 rus_state_controlled_church_decision.historical_info: "Nel 1721, Pietro 'il Grande' abolì il Patriarcato di Mosca per subordinare la Chiesa Ortodossa allo stato. Il Santo Sinodo, un collegio spirituale che rappresentava la volontà dello Zar, sostituì il patriarca. Un ober-prokuror fu nominato per supervisionare il Santo Sinodo, che perseguitò ferocemente i dissidenti e impose la censura sulle pubblicazioni."

 rus_academy_of_sciences_decision.title: "Accademia delle Scienze"
 rus_academy_of_sciences_decision.desc: "È importante che coltiviamo la conoscenza e le ricerche scientifiche per assicurare che [ROOT.GetCountry.GetName] resti al passo sulla scena internazionale. Proponiamo l'istituzione di un'Accademia delle Scienze nella nostra nuova capitale dell'illuminismo e trasformiamola in un baluardo dell'innovazione in campi come matematica, astronomia, fisica, chimica e altro."
 rus_academy_of_sciences_decision.desc.entry: "Una grande potenza che importa la propria matematica e la propria fisica sarà sempre un passo indietro rispetto alle potenze che producono le proprie. Un'Accademia delle Scienze nella nostra città più recente annuncerebbe, più di qualsiasi vittoria, che $RUS$ intende essere contata tra queste ultime."
 rus_academy_of_sciences_decision.a: "L'abilità intellettuale deve eguagliare la potenza militare."
 rus_academy_of_sciences_decision.b: "Progresso tramite il dialogo."
 rus_academy_of_sciences_decision.tt1: "I contributi di $name_basil.east_slavic_language$ $tatishchev$ all'accademia ne accelerano significativamente l'istituzione, aggiungendosi ai suoi contributi verso [ShowLocationName('neva')]"
 rus_academy_of_sciences_decision.tt2: "Le opere letterarie di $name_james$ $Bruce$ vengono aggiunte alla collezione dell'accademia, arricchendo le sue risorse accademiche"
 rus_academy_of_sciences_decision.tt3: "Le migliori menti del nostro paese si impegnano attivamente in un'estesa corrispondenza con altre istituzioni educative in tutta Europa, scambiando idee e favorendo la via della diplomazia"
 rus_academy_of_sciences_decision.historical_info: "L'Accademia delle Scienze di San Pietroburgo fu istituita da Pietro 'il Grande', in seguito al suo lungo viaggio attraverso l'Europa come parte della 'Grande Ambasceria'. L'accademia trasse ispirazione dall'Accademia di Parigi così come dalla Royal Society di Londra, che condividevano un obiettivo simile di promuovere la ricerca scientifica e accademica. L'accademia giocò un ruolo importante nel far progredire la conoscenza scientifica e lo sviluppo culturale in Russia."

 rus_manifesto_of_freedom_decision.title: "Il Manifesto della Libertà"
 rus_manifesto_of_freedom_decision.desc: "La capacità di governare richiede un paese stabile con un sovrano forte che tenga saldamente le redini. Al momento, c'è un crescente malcontento sulle scelte fatte da [ROOT.GetCountry.GetGovernment.GetRuler.GetName], e sarebbe prudente assicurarsi almeno il continuo sostegno dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] fino a quando la situazione non migliorerà. Offriamo generose concessioni che esentino i [ShowPopTypeName('nobles')] dal servizio statale insieme ad altre libertà civili, permettendoci di concentrarci sulla stabilizzazione della natura fragile del governo assolutista attualmente in vigore."
 rus_manifesto_of_freedom_decision.desc.entry: "Un sovrano assoluto con dei $nobles_estate$ scontenti non è, in pratica, molto assoluto. Liberare i $nobles_estate$ dal servizio obbligatorio costa allo stato il loro obbligo, ma compra dei $nobles_estate$ con molto meno motivo per complottare mentre il trono trova il proprio equilibrio."
 rus_manifesto_of_freedom_decision.a: "Un male necessario."
 rus_manifesto_of_freedom_decision.b: "Troviamo una via di mezzo."
 rus_manifesto_of_freedom_decision.c: "Una nozione offensiva."
 rus_manifesto_of_freedom_decision.tt1: "Gli ampi privilegi concessi ai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] restano irrevocabili durante il regno del nostro sovrano attuale"
 revoke_manifesto_of_freedom: "Gli ampi privilegi concessi ai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] restano irrevocabili durante il regno del sovrano che li ha concessi."
 rus_manifesto_of_freedom_decision.tt2: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] approfittano dello stato disastroso del paese e lavorano attivamente per ostacolare il governo di [target_root_country.GetGovernment.GetRuler.GetName]"
 rus_manifesto_of_freedom_decision.historical_info: "Il #italic Manifesto della Libertà della Nobiltà#! fu concesso dall'Imperatore Pietro III durante il suo breve e fallimentare regno. Diversi fattori furono dietro la sua concezione, in particolare il fatto che era riuscito ad alienarsi gran parte della nobiltà a causa del cambiamento delle alleanze geopolitiche che privarono la Russia di una significativa vittoria militare contro la Prussia. Cercando di stabilizzare il proprio governo, Pietro ridusse gli obblighi della nobiltà e sequestrò terre della Chiesa per finanziarlo, il che invece offese il clero. La sua insistenza nell'implementare esercitazioni militari prussiane sull'Esercito provocò quasi una sollevazione, spingendo sua moglie, Caterina, a deporlo con un colpo di stato."

 rus_speransky_liberalization_decision.title: "Le Scintille del Cambiamento"
 rus_speransky_liberalization_decision.desc: "L'implementazione di un nuovo sistema costituzionale resta una priorità assoluta per il pioniere progressista [mikhail_speransky.GetName], che persiste in gabinetto per guidare qualsiasi cambiamento adeguato. Abbracciamo i venti del cambiamento e navighiamo in acque inesplorate con solo una bussola liberale a guidarci."
 rus_speransky_liberalization_decision.desc.entry: "$name_michael.east_slavic_language$ $Speransky$ ha passato anni a redigere una costituzione che nessuno ha ancora avuto il coraggio di concedere. Sostenerlo ora ci impegna a riforme la cui forma non possiamo prevedere completamente, il che è esattamente il motivo per cui ogni sovrano prima di noi ha scelto di aspettare."
 rus_speransky_liberalization_decision.a: "Venti all'Orizzonte!"
 rus_speransky_liberalization_decision.b: "Controverso e pericoloso."
 enable_speransky_liberalization_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('speransky_liberalization_reform')]"
 rus_speransky_liberalization_decision.tt1: "Vengono fatti passi progressisti per modernizzare l'amministrazione di [target_root_country.GetName] nonostante l'opposizione dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]"
 rus_speransky_liberalization_decision.historical_info: "Lo Zar Alessandro I, guidato da una visione di riforma, intraprese cambiamenti sostanziali durante il suo regno. Nel 1802, introdusse un'amministrazione più organizzata istituendo otto ministeri, una mossa che dimostrò il suo impegno verso una governance efficiente. Quest'epoca vide l'influenza di Mikhail Speransky, un consigliere chiave dello Zar e sostenitore della modernizzazione."

 rus_free_economic_society_decision.title: "Società Economica Libera"
 rus_free_economic_society_decision.desc: "L'agricoltura resta un pilastro della nostra società, eppure i metodi di coltivazione e le tecniche agricole usate dai [ShowPopTypeName('peasants')] sono statiche e poco produttive in confronto alle potenze rivali. Per un costo modesto, uno dei nostri architetti ha proposto la creazione di un'organizzazione economica per far progredire la conoscenza in agricoltura e commercio, e ha anche offerto di assumere un ruolo guida nella sua amministrazione.\n\nQualora l'organizzazione avesse successo, dovrebbe anche mirare a migliorare l'educazione degli agricoltori e promuovere la formazione di lavoratori qualificati fornendo consigli pratici e pubblicando riviste e documenti di ricerca sull'argomento."
 rus_free_economic_society_decision.desc.entry: "Un contadino che coltiva come faceva suo nonno non nutrirà più bocche di quante ne nutrisse suo nonno. $name_gregory.east_slavic_language$ $Orlov$ offre, a buon mercato e di propria iniziativa, di fondare una società che insegni metodi migliori, sebbene le sue promesse di riviste e istruzione per gli agricoltori vadano oltre quanto richiesto."
 rus_free_economic_society_decision.a: "Dobbiamo nutrirci, dopotutto."
 rus_free_economic_society_decision.b: "Non è questa la via."
 STATIC_MODIFIER_NAME_potato_varieties_introduced: "Varietà di Patate Introdotte"
 rus_free_economic_society_decision.tt1: "Nuove varietà di [ShowGoodsName('potato')] e metodi di coltivazione innovativi vengono introdotti dalla Società, contribuendo a un aumento dei raccolti"
 rus_free_economic_society_decision.tt2: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] applaudono gli sforzi per mantenere la loro posizione di potere sui [ShowPopTypeName('peasants')]"
 rus_free_economic_society_decision.historical_info: "La Società Economica Libera fu fondata da Grigorij Orlov con il sostegno dell'Imperatrice Caterina II, che lei stessa sentiva che le pratiche agricole della Russia fossero obsolete e in ritardo rispetto ad altre grandi potenze, in particolare la Gran Bretagna. La società pubblicò diversi documenti su nuove tecniche agricole, introdusse colture e organizzò sforzi educativi per gli agricoltori affinché potessero lavorare la terra più efficientemente e produrre più cibo."

 rus_imperial_academy_arts_decision.title: "Accademia Imperiale delle Arti"
 rus_imperial_academy_arts_decision.desc: "Il visionario riformatore [ivan_shuvalov.GetName] continua le sue incessanti riforme del sistema educativo e persiste nel sostegno continuo delle arti. [ivan_shuvalov.GetSheHe|U] cerca di istituire un'accademia dedicata al raggiungimento dei più alti standard nelle arti e nell'architettura, nutrendo e sviluppando il talento artistico [ROOT.GetCountry.GetAdjective] sponsorizzando i suoi studenti più promettenti in città innovative in tutta Europa per ulteriori studi. Abbracciamo questa iniziativa e costruiamo un baluardo di avanzamento culturale per trasformare [ShowLocationName('neva')] in un faro di classicismo."
 rus_imperial_academy_arts_decision.desc.entry: "$name_john.east_slavic_language$ $Shuvalov$ ha già riformato le scuole; ora vuole un'accademia che mandi i nostri pittori e architetti più promettenti a studiare all'estero, e riporti artisti abbastanza bravi da far sì che [ShowLocationName('neva')] non debba più importare il proprio gusto dall'Europa."
 rus_imperial_academy_arts_decision.a: "Una proposta cavalleresca."
 rus_imperial_academy_arts_decision.b: "Le responsabilità di gabinetto hanno la precedenza."
 rus_imperial_academy_arts_decision.c: "Se non è rotto."
 rus_imperial_academy_arts_decision.tt1: "Il rispettato $name_gregory.east_slavic_language$ $Orlov$ dona una parte significativa della sua collezione d'arte alla neo-formata accademia"
 rus_imperial_academy_arts_decision.tt2: "$name_john.east_slavic_language$ $Shuvalov$ si concentra esclusivamente sui doveri del [cabinet|e], eccellendo nel suo incarico e alzando l'asticella per il servizio pubblico"
 rus_imperial_academy_arts_decision.tt3: "Gli stili architettonici attuali vengono rafforzati e godono di una seconda rinascita"
 rus_imperial_academy_arts_decision.historical_info: "L'Accademia Imperiale delle Arti era un'accademia d'arte situata sul fiume Neva a San Pietroburgo. Fondata nel 1757 da Ivan Šuvalov, uno statista e appassionato d'arte, promosse lo stile e la tecnica neoclassica, e mirava a emulare le accademie d'arte europee così come invitò artisti stranieri a insegnare agli studenti russi."

 mos_moscow_orphanage_decision.title: "L'Orfanotrofio Bene Intenzionato"
 mos_moscow_orphanage_decision.desc: "Un'idea notevole viene presentata dal membro di gabinetto [ivan_betskoy.GetName] per affrontare ciò che viene percepito come una delle più grandi tragedie in corso, cioè l'abbandono dei neonati. Si suggerisce di istituire un rifugio sicuro per i meno fortunati, e fornire loro sostentamento e istruzione per assicurare che crescano fino a diventare membri produttivi della società. La questione del finanziamento resta un problema non risolto, ma diverse opzioni valide sono in considerazione per sostenere questa iniziativa."
 mos_moscow_orphanage_decision.desc.entry: "Un bambino abbandonato alla nascita non costa nulla allo stato oggi e molto in vent'anni, in un modo o nell'altro. $name_john.east_slavic_language$ $Betskoy$ propone invece un rifugio che li cresca fino a diventare soggetti utili, se solo si può trovare qualcuno che lo finanzi."
 mos_moscow_orphanage_decision.a: "Un investimento lucrativo."
 mos_moscow_orphanage_decision.b: "Una causa meritevole."
 mos_moscow_orphanage_decision.c: "Ognuno per sé."
 mos_moscow_orphanage_decision.tt1: "L'orfanotrofio istituisce diverse filiali bancarie private per gestire prestiti e risparmi per finanziare le operazioni"
 mos_moscow_orphanage_decision.tt2: "Il finanziamento viene generosamente fornito dal tesoro"
 mos_moscow_orphanage_decision.historical_info: "L'Orfanotrofio di Mosca fu istituito nel 1763 sotto la direzione dell'Imperatrice Caterina 'la Grande' e Ivan Betskoj, un ministro del suo governo e grande sostenitore delle riforme educative. L'istituzione fu concepita quando gli ideali dell'Illuminismo stavano guadagnando terreno in Russia e in tutta Europa. Nonostante fosse ben finanziata, fu affetta da alti tassi di mortalità infantile e ebbe un impatto limitato sulle vite dei bambini abbandonati, sebbene alcuni beneficiarono dell'istruzione fornita e riuscirono a ottenere un impiego di conseguenza."

 rus_institute_of_noble_maidens_decision.title: "Istituto delle Giovani Nobildonne"
 rus_institute_of_noble_maidens_decision.desc: "L'educazione delle donne resta un tema vivacemente dibattuto ed è fortemente sostenuta dall'entusiasta sostenitore [ivan_betskoy.GetName], che ha convocato il gabinetto con l'intenzione di creare un'istituzione formativa dedicata all'istruzione delle donne devote. Si prevede che queste donne svolgano ruoli come preziose contributrici sia alla famiglia che alla società. Commissioniamo una struttura adeguata dedicata a idee progressiste e all'inclusività, e iniziamo a formare una nuova generazione, libera dall'impatto dannoso di una genitorialità ignorante."
 rus_institute_of_noble_maidens_decision.desc.entry: "Una figlia cresciuta solo per la casa non gestirà nulla al di fuori di essa. $name_john.east_slavic_language$ $Betskoy$ vuole un'istituzione che insegni alle giovani donne a essere più di questo, costruita sulla scommessa che una madre istruita cresca una generazione successiva più capace di una ignorante."
 rus_institute_of_noble_maidens_decision.a: "Costruiscilo."
 rus_institute_of_noble_maidens_decision.b: "[ShowLocationNameWithNoTooltip('moscow')] è adatta per questo."
 rus_institute_of_noble_maidens_decision.b.tt: "Se presente, riconvertiremo il [ShowBuildingTypeNameWithNoTooltip('novodevichy_convent')]. Altrimenti costruiremo l'[ShowBuildingTypeNameWithNoTooltip('institute_of_noble_maidens')] a [ShowLocationNameWithNoTooltip('moscow')]"
 rus_institute_of_noble_maidens_decision.c: "Una minaccia all'ordine stabilito."
 rus_institute_of_noble_maidens_decision.tt1: "Carte stampate vengono inviate a tutte le giovani dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e dei [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]"
 rus_printed_charters: "Carte Stampate"
 rus_institute_of_noble_maidens_decision.historical_info: "L'Istituto delle Giovani Nobildonne, istituito da Ivan Betskoj con il forte sostegno dell'Imperatrice Caterina 'la Grande', mirava a esporre le donne ai pensatori intellettuali dell'epoca, inclusi Voltaire e Locke. Le bambine entravano nel convento in giovane età, vivendo una separazione dai propri genitori per un periodo di sei anni. L'istituto cambiò sede diverse volte, ed era finanziato da una tassa annuale per assicurare l'esclusività e limitare l'accesso ai membri di basso rango della società."

 rus_nakaz_decision.title: "Nakaz"
 rus_nakaz_decision.desc: "Diventa sempre più importante spingere [ROOT.GetCountry.GetName] in una nuova era di illuminismo e progresso. Una revisione visionaria del codice legale allineata con i principi vivificanti che attraversano l'Europa sarebbe adeguata, abbracciando ideali come la ragione, la giustizia e l'umanitarismo. Abbracciando questi valori, possiamo finalmente abbandonare le pratiche legali obsolete che ostacolano lo sviluppo sociale. Imbarchiamoci sulla via della riforma, e implementiamo l'uguaglianza di tutti i cittadini davanti alla legge."
 rus_nakaz_decision.desc.entry: "La necessità di introdurre un nuovo codice legale è diventata sempre più evidente e molti studiosi illuminati stanno supplicando il nostro sovrano per una riforma della legge. Tuttavia un'implementazione forzata potrebbe causare una grave reazione da parte di certi organi all'interno del nostro governo."
 rus_nakaz_decision.a: "Il progresso può essere doloroso."
 rus_nakaz_decision.b: "Accontentiamoci di una riforma penale."
 rus_nakaz_decision.c: "Non osiamo."
 enable_nakaz_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('nakaz_reform')]"
 rus_nakaz_decision.tt1: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sono infuriati dalla minaccia posta alla loro posizione di potere"
 rus_nakaz_decision.tt3: "La resa alle forze conservatrici vede la loro agenda rafforzata"
 rus_nakaz_decision.historical_info: "Il #italic Nakaz Pravilnosti#!, o #italic Istruzione sulle Leggi#!, era un codice legale introdotto da Caterina 'la Grande' nel tentativo di modernizzare e riformare il sistema legale. Influenzato dalle idee dell'Illuminismo, cercò di creare un sistema legale allineato con le filosofie progressiste dell'epoca, così come semplificare e chiarire le leggi. Introdusse punizioni più umane, limitò l'uso della tortura, ed enfatizzò l'uguaglianza di tutti i cittadini davanti alla legge. Il Nakaz non fu mai completamente implementato a causa delle molte forze conservatrici che si opposero, e Caterina alla fine spostò la propria attenzione verso altre priorità."

 rus_intellectual_movements_decision.title: "L'Inizio del Nazionalismo"
 rus_intellectual_movements_decision.desc: "La definizione, e la percepita supremazia, della cultura degli [ShowCultureGroupName('slavic_group')] è un tema vivacemente dibattuto tra gli studiosi. Le opinioni differiscono su se dovremmo perseguire una posizione più pro-occidentale per assicurare che [ROOT.GetCountry.GetName] non ristagni in un ciclo infinito di tradizione, o se l'importanza della continuità sia sottostimata, e dovrebbe rimanere una parte centrale nella preservazione dell'identità [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. La divergenza ha stimolato la creazione di due distinti movimenti intellettuali che desiderano guidarci in direzioni opposte, e dobbiamo decidere il percorso che si allinea con la nostra visione per il futuro."
 rus_intellectual_movements_decision.desc.entry: "Gli studiosi si sono divisi su se l'identità degli [ShowCultureGroupName('slavic_group')] valga la pena di essere preservata intatta o valga la pena di essere scambiata per il progresso occidentale, e il dibattito si è irrigidito in due fazioni che non possono entrambe plasmare il futuro di $RUS$. Scegliere tra di esse non risolve nulla che l'altra parte accetterà tranquillamente."
 rus_intellectual_movements_decision.a: "Sostieni gli Slavofili."
 rus_intellectual_movements_decision.b: "Sostieni gli Occidentalisti."
 rus_intellectual_movements_decision.custom1: "Concede accesso alla [law|e] [ShowLawName('intellectual_movements')]"
 rus_intellectual_movements_decision.custom2: "Una [policy|e] sotto la [law|e] [ShowLawName('intellectual_movements')] può essere cambiata solo una volta ogni dieci anni"
 rus_intellectual_movements_decision.historical_info: "Occidentalisti e Slavofili furono due distinti movimenti intellettuali e ideologici nella Russia del diciannovesimo secolo. Avevano opinioni divergenti sul percorso di sviluppo della Russia, sulla sua relazione con l'Europa Occidentale e sulla preservazione dell'identità culturale russa. Gli Occidentalisti favorivano la modernizzazione adottando idee, istituzioni e tecnologie occidentali, mentre gli Slavofili enfatizzavano la preservazione dei valori tradizionali russi, della spiritualità e delle strutture comunitarie."

 rus_secretnoye_byuro_decision.title: "L'Ufficio Segreto delle Investigazioni"
 rus_secretnoye_byuro_decision.desc: "Sono state espresse preoccupazioni riguardo alla capacità della [current_policy.GetName] di sopprimere le sfide delle élite verso il governo di [ROOT.GetCountry.GetName]. Le influenze straniere nel Consiglio dell'Impero hanno proposto un'agenzia specializzata che potrebbe essere più adatta al compito, con la forza brutale come metodo preferito di dissuasione. Riportiamo in vita la knut e riorganizziamo la polizia segreta per instillare un rinnovato senso di autorità e sventare qualsiasi tentativo di far deragliare il nostro governo supremo."
 rus_secretnoye_byuro_decision.desc.entry: "Una politica attuale che si limita a scoraggiare la sedizione non è la stessa cosa che una che la previene, e gli agenti stranieri nella burocrazia hanno notato la differenza. Far rivivere la knut e una polizia segreta dedicata risponde al reclamo, al costo di ogni pretesa che $RUS$ governi con qualcosa di più gentile della paura."
 rus_secretnoye_byuro_decision.a: "L'obbedienza richiede un sacrificio occasionale."
 rus_secretnoye_byuro_decision.b: "Siamo sopra a questo."
 enable_secretnoye_byuro_policy: "Concede accesso alla [policy|e] [ShowPolicyName('secretnoye_byuro_policy')]"
 rus_secretnoye_byuro_decision.tt1: "È selezionabile solo mentre un [cabinet_member|e] svolge la [cabinet_action|e] [ShowCabinetActionName('bironovshchina')]"
 rus_secretnoye_byuro_decision.historical_info: "L'Ufficio Segreto delle Investigazioni giocò un ruolo importante durante il regno dell'Imperatrice Anna Ioannovna, che lo usò per tenere a freno i propri oppositori politici come mezzo per garantire il proprio governo autoritario. Le punizioni includevano il taglio del naso o l'essere picchiati a morte con una knut, che era una frusta tipica caratterizzata da una striscia di pelle grezza o una corda collegata a un manico di legno allungato. Si stima che circa ventimila nobili divennero vittime delle purghe politiche."

 rus_proclaim_tsardom_decision.title: "Proclama lo $tsardom$"
 rus_proclaim_tsardom_decision.desc: "La riunificazione delle terre Rus' è completa, e il [GetInternationalOrganizationType('tatar_yoke').GetName] è rotto. Il nostro [GetCountry('RUS').GetFlavorRank] si erge ora supremo tra i principati, e il nostro [GetCountry('RUS').GetGovernment.GetEstateName('clergy_estate')] ci esorta a rivendicare una dignità all'altezza: il nostro sovrano dovrebbe essere incoronato [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')], erede degli imperatori di un tempo e guardiano della fede [ShowReligionAdjective('orthodox')].\n\nTale incoronazione proclamerebbe a ogni corte d'Europa e a ogni khanato della steppa che [GetCountry('RUS').GetName] non si inchina a nessuna corona straniera."
 rus_proclaim_tsardom_decision.desc.entry: "Le terre Rus' sono riunite, il [GetInternationalOrganizationType('tatar_yoke').GetName] è rotto, e un sovrano che ha già compiuto l'opera di un impero ora manca solo del titolo di un impero. Rivendicarne uno non costa nulla tranne la presunzione, e dice a ogni corte d'Europa esattamente come ci aspettiamo di essere chiamati da ora in avanti."
 rus_proclaim_tsardom_decision.a: "Che il nostro sovrano sia incoronato [SelectLocalization(GetCountry('RUS').GetGovernment.GetRulerOrRegent.IsFemale,'rank_empire_tsar_ruler_female','rank_empire_tsar_ruler_male')] di Tutte le Russie."
 rus_proclaim_tsardom_decision.historical_info: "Il 16 gennaio 1547, Ivan IV di Mosca fu incoronato nella Cattedrale della Dormizione all'interno del Cremlino, il primo sovrano moscovita a essere formalmente investito del titolo di Zar. Il Metropolita Macario, che aveva sostenuto la nuova dignità, gli pose sul capo il Berretto di Monomaco, una corona ingioiellata orlata di pelliccia che la tradizione di corte riteneva fosse un dono dell'imperatore bizantino Costantino IX al Gran Principe Vladimir Monomaco secoli prima.\n\nIl nuovo titolo segnò una rottura deliberata con il più antico stile di Gran Principe, affermando un rango pari a quello di un imperatore ed erede dei caduti imperi cristiani d'Oriente. Le corti straniere furono lente a riconoscerlo: furono necessari decenni di diplomazia prima che il Sacro Romano Impero e il Papato accettassero lo Zar come equivalente del Re, piuttosto che una semplice traduzione di Gran Principe."