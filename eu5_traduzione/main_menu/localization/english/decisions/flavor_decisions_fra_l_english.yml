l_english:
 fra_taille_tax_decision.title: "La Nascita di un Sistema Fiscale Permanente"
 fra_taille_tax_decision.desc: "In seguito a un'opera massiccia, [ruler_fra.GetName] ha completato una ristrutturazione delle finanze di [ROOT.GetCountry.GetName]. Mentre [ROOT.GetCountry.GetNameWithNoTooltip] ha mantenuto la politica di [ShowPolicyName('exceptional_only')], una tassa riscossa solo durante i tempi di guerra, [ruler_fra.GetShortNameWithNoTooltip] ha creato un quadro per un sistema fiscale permanente. Tramite un compromesso con i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], la nuova politica può essere promulgata, sebbene queste nuove politiche fiscali incontreranno la disapprovazione dei [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] e dei [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]."
 fra_taille_tax_decision.desc.entry: "Una tassa votata solo in tempo di guerra deve essere nuovamente richiesta con ogni campagna. Fissarla permanentemente porrebbe fine a questa richiesta, e i $nobles_estate$ e $clergy_estate$ possono essere portati ad accettare purché il peso cada invece sui $burghers_estate$ e sui $peasants_estate$."
 fra_taille_tax_decision.a: "Emettiamola."
 fra_taille_tax_decision.b: "I vecchi metodi sono migliori..."
 enables_taille_laws: "[ROOT.GetCountry.GetName] otterrà accesso alle leggi [ShowLawName('fra_taille')]"
 fra_taille_tax_decision.historical_info: "Il regno di Carlo VII vide una ristrutturazione delle finanze francesi con l'istituzione della tassa della Taille, che portò alla nascita di un sistema fiscale permanente in Francia. Sebbene la nobiltà e il clero fossero esenti, la neo-istituita Taille, una tassa diretta sulla terra, avrebbe considerevolmente aiutato le finanze dello stato dopo la fine della Guerra dei Cent'Anni."

 fra_5_percent_tax_decision.title: "La Tassa del Cinque Percento di [target_character.GetLastNameWithNoTooltip]"
 fra_5_percent_tax_decision.title.entry: "La Tassa del Cinque Percento di $de_machault$"
 fra_5_percent_tax_decision.desc: "Quando la [ShowLawName('fra_taille')] fu originariamente istituita, sostituì un antico sistema fiscale feudale usato dal [ROOT.GetCountry.GetLongName]. Tuttavia, col passare del tempo, i vecchi privilegi speciali concessi al [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] e ai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno iniziato a rivelarsi inefficienti nel più ampio sistema fiscale dello stato.\n\n[target_character.GetName], un membro dell'amministrazione [ROOT.GetCountry.GetAdjectiveWithNoTooltip], ha offerto una proposta per ridefinire la [ShowLawNameWithNoTooltip('fra_taille')], per includere una #italic tassa del 5 percento#! sulla tassa generale sulla terra, che verrebbe estesa a includere i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] e il [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]. Sebbene la proposta si rivelerebbe benefica per le finanze dello stato, il [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] e i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] hanno già espresso una feroce opposizione."
 fra_5_percent_tax_decision.desc.entry: "Le esenzioni concesse per servizi renduti secoli fa continuano a costare al tesoro ogni anno. $name_john.french_language$ $name_baptiste$ $de_machault$ propone una quota fissa del rendimento della terra dovuta da chiunque possieda terra, una somma abbastanza modesta e un principio abbastanza intollerabile da far sì che i $clergy_estate$ e i $nobles_estate$ siano già in subbuglio."
 fra_5_percent_tax_decision.a: "Imponiamola a tutti i costi!"
 fra_5_percent_tax_decision_tt: "$name_john.french_language$ $name_baptiste$ $de_machault$ si unirà alla nostra [court|e]"
 fra_5_percent_tax_decision.b: "Non osiamo farli arrabbiare."
 unlocks_machault_tax_reforms: "[ROOT.GetCountry.GetName] otterrà accesso alle leggi [ShowLawName('fra_5_percent_tax')], un'estensione della [ShowLawName('fra_taille')]"
 fra_5_percent_tax_decision.historical_info: "Quando Jean-Baptiste de Machault divenne controllore generale delle finanze in Francia nel dicembre 1745, trovò il paese sull'orlo della bancarotta. Né i nobili né il clero pagavano la tassa generale sulla terra, la Taille. Nel 1749, Machault tentò di riformare il sistema proponendo di sostituire la vecchia tassa di un decimo, che molti del clero e della nobiltà evadevano, con una tassa del cinque percento senza eccezioni. La proposta fu accolta da proteste così rumorose che Machault non fu in grado di portarla a termine."

 fra_fouage_tax_decision.title: "La Tassa del Fouage"
 fra_fouage_tax_decision.desc: "Durante tutto il [scope_ruler.GetHisHer] regno, [scope_ruler.GetName] ha vissuto uno stile di vita piuttosto lussuoso nella propria veste di [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Dai costosi viaggi attraverso le varie proprietà in [GetCountry('FRA').GetName], al mantenimento del palazzo [ROOT.GetCountry.GetGovernment.GetAdjective] a [ROOT.GetCountry.GetCapital.GetName], il tesoro [ROOT.GetCountry.GetGovernment.GetAdjective] è stato lasciato ampiamente prosciugato dei propri fondi. Per contrastare lo stile di vita sfarzoso di [scope_ruler.GetShortNameWithNoTooltip], membri del gabinetto hanno avanzato l'idea di imporre #italic la Tassa del Fouage#! come nuova tassa sul focolare per le famiglie in tutto [GetCountry('FRA').GetNameWithNoTooltip]. Sebbene questa tassa proposta sarà un prezzo salato da pagare per i [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], permetterebbe al tesoro [ROOT.GetCountry.GetGovernment.GetAdjective] di recuperare i propri fondi permettendo al contempo a [scope_ruler.GetShortNameWithNoTooltip] di mantenere il proprio stile di vita lussuoso."
 fra_fouage_tax_decision.desc.entry: "Palazzi, viaggi di stato, e una corte che si sposta con tutti gli onori non sono pagati di tasca propria dal sovrano. Una tassa sul focolare raggiunge ogni famiglia in $FRA$ e riempirebbe rapidamente il tesoro, il che la rende consigliabile al gabinetto e a nessuno di coloro che vivono sotto quei focolari."
 fra_fouage_tax_decision.a: "Imponiamola per [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 fra_fouage_tax_decision.a.entry: "Imponiamola per la $crown_estate$."
 fra_fouage_tax_decision.b: "Sospendiamo per ora l'implementazione dell'imposta."
 fra_fouage_tax_decision.c: "Lo Stato non coprirà i lussi di [scope_ruler.GetShortNameWithNoTooltip]."
 fra_fouage_tax_decision.c.entry: "Lo Stato non coprirà i lussi del sovrano."
 variable_tt_enabled_fouage_tax: "Fouage Abilitato"
 fra_fouage_tax_decision.historical_info: "Inizialmente imposta durante il regno di Re Filippo III per coprire le spese regie insieme agli effetti finanziari della Peste Nera e della Guerra dei Cent'Anni, la Tassa del Fouage (Focolare) divenne una delle imposte notevoli raccolte per mantenere il tesoro regio dei Monarchi di Francia. Mentre alcune regioni [GetCountry('FRA').GetAdjectiveWithNoTooltip] videro la tassa imposta su di esse, alla fine divenne più diffusa in tutta la Francia nel tardo XIV secolo."

 fra_edict_of_toleration_decision.title: "L'Editto di Fontainebleau"
 fra_edict_of_toleration_decision.desc: "La diffusione della Riforma ha inviato onde d'urto in tutta [ShowContinentName('europe')], con molti di coloro che sono diventati diffidenti verso gli insegnamenti della Chiesa [ShowReligionAdjective('catholic')] e che ora si professano della neo-fondata fede [ShowReligionAdjective('lutheran')]. Mentre la maggioranza di [GetCountry('FRA').GetName] resta ancora fedele alla fede [ShowReligionAdjectiveWithNoTooltip('catholic')], la crescente influenza dei seguaci [ShowReligionAdjectiveWithNoTooltip('lutheran')] ha costretto il [ROOT.GetCountry.GetGovernment.GetCourtTitle] ad agire.\n\n[ruler_fra.GetName] è stato supplicato di promulgare la [ShowPolicyName('edict_of_fontainebleau')], un editto mirato a schiacciare la crescente influenza [ShowReligionAdjectiveWithNoTooltip('lutheran')] prima che possa portare grande disordine a [GetCountry('FRA').GetNameWithNoTooltip]."
 fra_edict_of_toleration_decision.desc.entry: "Una fede che si diffonde tra mercanti e stampatori è più difficile da sradicare di una sostenuta dai contadini. Le congregazioni [ShowReligionAdjective('lutheran')] sono ancora poche, e la nostra corte deve decidere se spezzarle ora con l'[ShowPolicyName('edict_of_fontainebleau')] o imparare a vivere al loro fianco."
 fra_edict_of_toleration_decision.a: "Siamo costretti ad agire per combattere l'ascesa dell'eresia."
 fra_edict_of_toleration_decision.b: "Dovremmo cercare di mantenere una prospettiva umanista con i seguaci [ShowReligionAdjectiveWithNoTooltip('lutheran')]."

 fra_colonial_ambitions_decision.title: "Riaccostamento alle Questioni Coloniali"
 fra_colonial_ambitions_decision.desc: "Con il tumulto religioso che ha avvolto [GetCountry('FRA').GetName] per decenni, il [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective] ha proposto nuovamente di perseguire ambizioni coloniali nel nuovo mondo. Sebbene i viaggi dei precedenti esploratori abbiano già portato a [GetCountry('FRA').GetNameWithNoTooltip] grandi informazioni riguardo alle nuove terre, lo scoppio religioso della Riforma costrinse il [ROOT.GetCountry.GetGovernment.GetCourtTitle] ad abbandonare qualsiasi ulteriore ambizione coloniale. Tuttavia, altre potenze coloniali in [ShowContinentName('europe')] hanno già stabilito i propri insediamenti attraverso il nuovo mondo, e gli insediamenti [GetCountry('FRA').GetAdjectiveWithNoTooltip] potrebbero portare a rotture diplomatiche con altre potenze coloniali.\n\nAltri nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno anche proposto che lo stato persegua ambizioni di monopolizzare le nuove rotte commerciali indiane, e invece stabilisca una compagnia commerciale in [ShowContinentName('asia')]."
 fra_colonial_ambitions_decision.desc.entry: "Conosciamo la via verso ovest, ciò che ci è mancato è un decennio sufficientemente tranquillo in patria per usare questa conoscenza. I rivali hanno passato quel decennio a piantare colonie, quindi qualsiasi nostro insediamento sarà ora fatto nel vicinato di qualcun altro, a meno che non ci volgiamo invece al commercio di [ShowContinentName('asia')]."
 fra_colonial_ambitions_decision.a: "Le terre del Nuovo Mondo dovrebbero essere il nostro obiettivo."
 fra_colonial_ambitions_decision.b: "Dovremmo invece cercare di monopolizzare il commercio indiano."

 fra_centralize_monarchy_decision.title: "Consolidamento delle Terre d'Appannaggio"
 fra_centralize_monarchy_decision.desc: "Dopo secoli di frammentazione, la corona ha finalmente recuperato molte delle terre d'appannaggio estinte, reintegrandole nuovamente nel dominio regio. Sebbene i vari rami cadetti della casata capetingia si siano rivelati soggetti capaci, hanno anche reso impossibile qualsiasi tentativo di centralizzazione. Con queste terre ora consolidate, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] e la sua corte possono fare passi verso la riforma di [GetCountry('FRA').GetName] in uno stato più moderno."
 fra_centralize_monarchy_decision.desc.entry: "Per generazioni gli appannaggi furono governati da cugini, il che era conveniente e rendeva impossibile la riforma. Quelle terre rispondono finalmente direttamente alla corona, e un regno che risponde a un'unica autorità può finalmente essere amministrato come un unico stato."
 fra_centralize_monarchy_decision.a: "Un grande passo verso la Modernizzazione di [GetCountry('FRA').GetNameWithNoTooltip]."

 fra_code_louis_decision.title: "Redigi il Code Louis"
 fra_code_louis_decision.desc: "Cercando di unificare le leggi del paese, [fra_ruler.GetName] insieme a molti dei suoi più stretti consiglieri nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha finalizzato la creazione del #italic Code Louis#!, il primo tentativo di un codice legale unificato in tutto [ROOT.GetCountry.GetName]. Per secoli, [ROOT.GetCountry.GetNameWithNoTooltip] è esistito con due sistemi legali perpetui e coesistenti, con le provincie settentrionali governate da vecchie leggi consuetudinarie, mentre nelle provincie meridionali le leggi civili romane servono come codice legale primario.\n\nSebbene il Code Louis vedrebbe il codice legale di [ROOT.GetCountry.GetNameWithNoTooltip] unificato, alcuni consiglieri hanno esortato alla cautela nell'affrettarne l'implementazione, poiché alcune provincie, specialmente quelle meridionali precedentemente governate dal Diritto Romano, potrebbero affrontare ostacoli nell'adottare il nuovo codice legale."
 fra_code_louis_decision.desc.entry: "Un mercante che passa da una provincia all'altra cambia legge con la stessa certezza con cui cambia cavalli. Un unico codice per tutto $FRA$ porrebbe fine a ciò, sebbene le provincie meridionali abbiano mantenuto il diritto romano da prima che esistesse un regno e non lo cederanno rapidamente."
 fra_code_louis_decision.a: "È tempo che tutto [ROOT.GetCountry.GetNameWithNoTooltip] segua un'unica legge uniforme."
 fra_code_louis_decision.a.entry: "È tempo che tutti noi seguiamo un'unica legge uniforme."
 fra_code_louis_decision.b: "Adottiamo il Codice solo nelle provincie settentrionali di [ROOT.GetCountry.GetNameWithNoTooltip] per ora."
 fra_code_louis_decision.b.entry: "Adottiamo il Codice solo nelle provincie settentrionali di $FRA$ per ora."

 fra_versailles_residence_decision.title: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] e Versailles"
 fra_versailles_residence_decision.title.entry: "I $nobles_estate$ e Versailles"
 fra_versailles_residence_decision.desc: "Sin dalla sua costruzione, Versailles è rapidamente diventata un luogo di ritrovo popolare per [fra_ruler.GetName] e la famiglia [ROOT.GetCountry.GetGovernment.GetAdjective] per ospitare membri delle varie famiglie politiche notabili in [ROOT.GetCountry.GetName]. Sebbene il palazzo sia stato costruito per essere un simbolo del 'Diritto Divino di Governare' del [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetAdjectiveWithNoTooltip], si è anche rivelato diventare un simbolo di favoritismo politico e status per coloro a cui è permesso risiedervi per un certo tempo.\n\nMolti dei consiglieri stretti di [fra_ruler.GetHerHis] hanno esortato [fra_ruler.GetShortNameWithNoTooltip] a estendere inviti a molte delle famiglie influenti ancora radicate nel vecchio modo feudale per portarle presso il [ROOT.GetCountry.GetGovernment.GetCourtTitle] a risiedere a Versailles. Corteggiare queste vecchie famiglie permetterebbe al potere di coagularsi ulteriormente attorno al [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 fra_versailles_residence_decision.desc.entry: "Una grande casa piena di ospiti è anche una grande casa piena di ostaggi. Le famiglie che ancora si attengono alle vecchie abitudini feudali potrebbero essere invitate a Versailles e lusingate a restarvi, e ogni stagione in cui rimangono è una stagione in cui la $crown_estate$ ha sempre meno timore di loro."
 fra_versailles_residence_decision.a: "Estendiamo inviti alle famiglie di spicco a risiedere a Versailles."
 fra_versailles_residence_decision.b: "Il palazzo fu costruito per il piacere della famiglia [ROOT.GetCountry.GetGovernment.GetAdjective], manteniamolo così."
 fra_versailles_residence_decision.b.entry: "Il palazzo fu costruito per il piacere della famiglia reale, manteniamolo così."
 this_may_lead_to_permanent_weakening_of_the_nobility: "Permettere ai membri dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] di risiedere a Versailles potrebbe vedere la loro influenza permanentemente debilitata."

 fra_versailles_permanent_decision.title: "Una Residenza Permanente per i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 fra_versailles_permanent_decision.title.entry: "Una Residenza Permanente per i $nobles_estate$"
 fra_versailles_permanent_decision.desc: "Gli sforzi per assicurare la lealtà e l'influenza politica dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] permettendo loro di risiedere a Versailles si sono rivelati abbastanza efficaci, con molti membri delle varie famiglie politiche che scelgono sempre più di risiedere nel palazzo piuttosto che vivere nelle proprie proprietà. Ogniqualvolta si tengono balli [ROOT.GetCountry.GetGovernment.GetAdjective] a Versailles, questi membri sembrano quasi affascinati dal lusso del palazzo, e sono pronti a mantenere stretti legami con [fra_ruler.GetName] per restare nelle sue grazie.\n\nUna volta spina nel fianco del [ROOT.GetCountry.GetGovernment.GetRulerTitle] [ROOT.GetCountry.GetAdjective], Versailles ha portato a una quasi seduzione del potere esercitato da molti appartenenti ai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. Tuttavia, ora sembra che [fra_ruler.GetShortNameWithNoTooltip] sia davvero emerso come un [ROOT.GetCountry.GetGovernment.GetRulerTitle] senza pari e incontestabile."
 fra_versailles_permanent_decision.desc.entry: "La trappola si è chiusa più dolcemente di quanto chiunque si aspettasse. I $nobles_estate$ ora competono per stanze e precedenza nella nostra casa piuttosto che per il potere nella propria, e un sovrano non più turbato da rivali resta incontestato."
 fra_versailles_permanent_decision.a: "L'Eminenza di Versailles ha per sempre eclissato i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 fra_versailles_permanent_decision.a.entry: "L'Eminenza di Versailles ha per sempre eclissato i $nobles_estate$."
 fra_versailles_permanent_decision.b: "Il potere storico dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] deve ancora essere rispettato."
 fra_versailles_permanent_decision.b_tt: "Potremo selezionare il $permanent_residence_in_versailles$ in un momento successivo"
 fra_versailles_permanent_decision.b.entry: "Il potere storico dei $nobles_estate$ deve ancora essere rispettato."

 fra_marcel_great_ordinance_decision.title: "La Grande Ordinanza"
 fra_marcel_great_ordinance_decision.desc: "I recenti conflitti hanno lasciato le finanze del [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] pesantemente tese, costringendo [ROOT.GetCountry.GetGovernment.GetRuler.GetName] a richiedere agli Stati Generali un rinnovato sostegno nel raccogliere fondi e forze per il [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]. Tuttavia, gli ultimi decenni hanno seminato malcontento in tutti gli Stati Generali, specialmente all'interno del Terzo Stato dove il sostegno alla guerra è stato accolto con scetticismo riguardo al cambiamento delle politiche finanziarie dall'inizio del più recente conflitto. Uno dei leader emergenti in questa opposizione è l'influente [etienne_marcel.GetName] che ha raccolto grande sostegno per una controproposta al fine di rompere lo stallo all'interno degli Stati Generali e assicurare alla nostra corona nuovi finanziamenti. Nella sua proposta 'Grande Ordinanza', [etienne_marcel.GetNameWithNoTooltip] richiede che il [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] conceda di limitare la propria autorità, spianando la strada a riforme guidate dai [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]."
 fra_marcel_great_ordinance_decision.desc.entry: "Gli Stati Generali hanno raggiunto uno stallo nei dibattiti per finanziare le nostre guerre attuali. Il Terzo Stato, guidato da influenti mercanti, ha proposto una 'Grande Ordinanza', comprando il proprio sostegno con maggiori privilegi e poteri per sé stessi. Potremmo accettare la loro proposta, o trovare mezzi alternativi per assicurarci finanziamenti dagli Stati Generali."
 fra_marcel_great_ordinance_decision.a: "I tempi disperati richiedono misure disperate."
 fra_marcel_great_ordinance_decision.b: "Guardiamo invece alla nobiltà per un aiuto!"
 fra_marcel_great_ordinance_decision.c: "Tentiamo di negoziare un compromesso con Marcel."
 fra_marcel_great_ordinance_decision_cooldown: "Ha recentemente rifiutato di collaborare con Marcel"
 fra_marcel_great_ordinance_decision.historical_info: "In seguito alla Battaglia di Poitiers e alla cattura di Re Giovanni II, il Delfino Carlo, agendo ora come Reggente, fu costretto a convocare una riunione degli Stati Generali per gestire le conseguenze della battaglia. Incontrò una feroce opposizione da parte di Étienne Marcel, che esercitava l'influenza del Terzo Stato. Marcel richiese che Carlo accettasse diversi accordi come la firma della Grande Ordinanza, insieme ad altri compromessi politici come il rilascio di Re Carlo 'il Malvagio' di Navarra, a cui il primo era politicamente allineato. Sebbene Carlo inizialmente resistette alle richieste di Marcel, alla fine vi concedette, e firmò l'Ordinanza. Re Giovanni II tuttavia proibì l'Ordinanza nel 1357, impedendole di entrare pienamente in vigore."

 fra_marcel_compromise_decision.title: "Il Compromesso della Grande Ordinanza"
 fra_marcel_compromise_decision.desc: "Il [ROOT.GetCountry.GetLongName] è ancora immerso nella guerra, e le difficoltà del nostro paese che spinsero [etienne_marcel.GetName] a fare le sue proposte non si sono alleviate. Abbiamo rifiutato quelle proposte nel passato, ma potremmo essere costretti ad affrontare la realtà: senza il sostegno degli Stati Generali, potrebbe essere difficile per il [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] farcela. Forse è tempo che ci rivolgiamo a [etienne_marcel.GetNameWithNoTooltip] e tentiamo di rivedere la sua precedente proposta per raggiungere un compromesso. Certamente, dovremo cedergli parte della nostra autorità, ma potremmo ottenere il sostegno finanziario degli Stati Generali in cambio."
 fra_marcel_compromise_decision.desc.entry: "Abbiamo rifiutato di cedere ai termini della Grande Ordinanza, ma siamo ancora immersi nei conflitti e gli Stati Generali sono ancora disposti ad approfittare della situazione. Se ci rivolgiamo a loro, forse possiamo arrivare a un compromesso."
 fra_marcel_compromise_decision.a: "Tentiamo di negoziare un compromesso con Marcel."
 fra_marcel_compromise_decision.a.tt: "$Marcel$ non si opporrà più a noi"
 fra_marcel_compromise_decision.historical_info: "$fra_marcel_great_ordinance_decision.historical_info$"

 fra_formalized_relations_decision.title: "Gli Affari di [ShowRegionNameWithNoTooltip('italy_region')]"
 fra_formalized_relations_decision.desc: "Recentemente, c'è stato un rinnovato approccio verso i nostri confini meridionali lungo le Alpi. Sebbene il [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective] abbia avuto in passato contatti con diversi stati e famiglie [ShowCultureGroupName('italian_group')] di [ShowRegionName('italy_region')], la capacità di mantenere una relazione coesa con la regione è stata limitata. Vari consiglieri e cortigiani hanno suggerito a [fra_ruler.GetName] che [ROOT.GetCountry.GetName] dovrebbe cercare di far crescere la nostra influenza nella regione, poiché sebbene [ShowRegionNameWithNoTooltip('italy_region')] sia patria di vari stati diversi, questi hanno il potenziale di essere potenti alleati politici. Ci sono anche quelli nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] che suggeriscono di adottare un approccio più dominante, e di cercare di portare con la forza i nostri vicini [ShowCultureGroupNameWithNoTooltip('italian_group')] sotto l'ala di [ROOT.GetCountry.GetNameWithNoTooltip]."
 fra_formalized_relations_decision.desc.entry: "Negli ultimi anni, i passi sulle Alpi sembrano meno una frontiera e più un'opportunità. Gli stati [ShowCultureGroupName('italian_group')] di [ShowRegionName('italy_region')] sono ricchi, divisi, e disponibili sia come alleati che come soggetti, a seconda di quale consiglio decidiamo di seguire."
 fra_formalized_relations_decision.a: "Cerchiamo di stabilire relazioni cordiali con stati vantaggiosi."
 fra_formalized_relations_decision.b: "Dovremmo mantenere una politica neutrale per ora."
 fra_formalized_relations_decision.c: "I nostri vicini [ShowCultureGroupNameWithNoTooltip('italian_group')] sarebbero meglio serviti sotto il nostro dominio."