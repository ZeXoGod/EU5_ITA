l_english:
 tur_enderun_academy_decision.title: "L'Accademia dell'Enderûn"
 tur_enderun_academy_decision.desc: "Per addestrare amministratori e generali per il nostro regno in crescita, potremmo istituire una scuola gestita dal circolo interno della corte, per mantenere gli studenti vicini al sovrano. Ciò non solo ci permetterebbe una grande quantità di informazioni, ma legherebbe anche gli studenti a noi, assicurando la continua importanza della dinastia [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] in tutte le questioni di stato.\n\nEppure dovremmo permettere l'iscrizione non solo ai nobili, ma a qualsiasi giovane sufficientemente dotato, indipendentemente dalla sua estrazione."
 tur_enderun_academy_decision.desc.entry: "Un servitore cresciuto all'interno del palazzo deve la propria posizione alla dinastia e nulla al nome di suo padre. Una scuola gestita dalla corte interna ci darebbe amministratori e comandanti le cui carriere iniziano e finiscono a nostro piacimento, e non c'è motivo di riservare i suoi banchi ai nati bene."
 tur_enderun_academy_decision.a: "Questo è il futuro!"
 tur_enderun_academy_decision.historical_info: "Mehmed II istituì una scuola nel cortile del Palazzo Topkapi di nuova costruzione. Gli studenti venivano scelti tra le reclute Devşirme più promettenti (giovani cristiani coscritti), e venivano addestrati nella fede islamica, nelle scienze, e nelle arti militari, così come in molte lingue. L'assegnazione delle cariche governative a reclute Devşirme addestrate nella scuola di palazzo e fedeli al sultano formò la spina dorsale del sistema ottomano di governo patrimoniale durante il XV e il XVI secolo."

 tur_expanded_timariot_decision.title: "Espansione del Sistema dei Timarioti"
 tur_expanded_timariot_decision.desc: "Per finanziare un'espansione del sistema dei Timarioti, consiglieri astuti hanno suggerito che potremmo reindirizzare alcune entrate dal Waqf, le fondazioni basate sulle moschee che sostengono la carità verso i miseri e gli abbandonati. Ciò rafforzerebbe certamente ancora di più il nostro esercito, e ridurrebbe il potere dei [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], ma potrebbe causare un malcontento diffuso una volta che i segmenti più devoti del popolo ne vengano a conoscenza."
 tur_expanded_timariot_decision.desc.entry: "La terra concessa per la cavalleria si ripaga da sola; le dotazioni di carità non pagano nulla che possiamo far marciare. Deviare il Waqf metterebbe più cavalieri in campo e taglierebbe le ali ai $clergy_estate$ nello stesso colpo, sebbene i devoti difficilmente non noteranno dove sono andati i soldi."
 tur_expanded_timariot_decision.a: "Lo stato ha bisogno dei soldi."
 tur_expanded_timariot_decision.b: "Il Waqf non deve mai essere toccato!"
 tur_expanded_timariot_decision.historical_info: "Mehmed II cercò di espandere il proprio potere personale all'interno dell'Impero Ottomano a ogni costo. Verso la fine del suo regno tentò di ridurre il potere degli ulema reindirizzando invece le entrate dalle fondazioni #italic Waqf#! che li sostenevano verso il sistema dei timar, rafforzando l'esercito ottomano. Questa mossa si sarebbe tuttavia rivelata controversa..."

 tur_enderun_service_decision.title: "Il Servizio Interno"
 tur_enderun_service_decision.desc: "Gli abili schiavi eunuchi hanno da tempo giocato un ruolo limitato nel nostro governo, ma c'è un grande potenziale in questi uomini castrati, senza ambizioni di famiglia e potere temporale. Poiché ci sono diversi giovani schiavi di talento a corte, potremmo legare tali abili cortigiani più strettamente alla dinastia [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] dando loro ruoli formali nella nostra casa, a spese dei vecchi e adulatori [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] che erano abituati a contendersi tali posizioni."
 tur_enderun_service_decision.desc.entry: "Un uomo che non può generare una propria dinastia ha poca ragione di costruirne una a nostre spese. Una carica formale di casa per gli eunuchi di palazzo innalzerebbe i più capaci tra loro sopra i $nobles_estate$, che hanno a lungo trattato tali posizioni come la propria eredità."
 tur_enderun_service_decision.a: "Una riforma di corte è attesa da tempo."
 tur_enderun_service_decision.b: "No, dobbiamo continuare a contare sui [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 tur_enderun_service_decision.b.entry: "No, dobbiamo continuare a contare sui $nobles_estate$."
 tur_enderun_service_decision.historical_info: "#italic Enderûn#!, da una parola persiana per #italic interno#!, designava i cortigiani più vicini al sultano ottomano. Erano contrapposti al #italic Birûn#!, il servizio esterno, che era la burocrazia dell'impero. I ranghi dell'Enderûn erano principalmente composti da eunuchi e giovani schiavi cristiani, i cui compiti si concentravano sull'assistere ed educare la famiglia imperiale, ma col tempo, alcuni di loro acquisirono un grande potere politico."

 tur_imperial_harem_decision.title: "Organizzazione dell'Harem"
 tur_imperial_harem_decision.desc: "Fino ad ora, la corte [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] è stata sparsa tra vari palazzi e posizioni. Ma se aspiriamo davvero alla grandezza, potremmo concentrare il nostro potere e la nostra presenza a [capital_location.GetName]. Ciò comporterebbe trasferire lì tutte le concubine reali Cariye, e installarle in recinti chiusi di splendido lusso.\n\nMa i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] vedrebbero questo come una mossa aggressiva contro di loro, poiché priverebbe molti di loro dell'accesso personale a [target_ruler.GetName] di cui hanno goduto per lungo tempo."
 tur_imperial_harem_decision.desc.entry: "Il potere segue chiunque si trovi più vicino al sovrano, e al momento ciò è chiunque capiti a possedere il palazzo più vicino. Riunire la casa in un'unica residenza sorvegliata nella capitale risolverebbe la questione in modo permanente, motivo per cui proprio i $nobles_estate$ ne saranno risentiti."
 tur_imperial_harem_decision.a: "Creiamo l'Harem Imperiale."
 tur_imperial_harem_decision.b: "La nostra organizzazione di corte funziona bene così com'è."
 tur_imperial_harem_decision.historical_info: "Nel XVI secolo, il potere dinastico ottomano si concentrò nel palazzo Topkapi a Costantinopoli, e la maggior parte dei membri della famiglia reale, specialmente le donne, passavano lì tutta la propria vita. Ciò trasformò l'harem in un'istituzione gerarchica ben organizzata, la cui enfasi sulla reclusione della vita dinastica rendeva l'accesso personale al sovrano un grande privilegio, e quindi trasmetteva il suo potere."

 tur_eunuch_viziers_decision.title: "Crea la Carica di Kızlar Ağası"
 tur_eunuch_viziers_decision.desc: "[mehmed_agha.GetName] è un brillante eunuco del [ROOT.GetCountry.GetGovernment.GetCourtTitle], uno dei guardiani dell'harem [ROOT.GetCountry.GetGovernment.GetAdjective]. Diverse fazioni al [ROOT.GetCountry.GetGovernment.GetCourtTitle] vogliono che venga creata per lui una nuova carica, #italic Kızlar Ağası#!, Guardiano delle Ragazze. In questo ruolo supervisionerebbe gli alloggi privati del [ROOT.GetCountry.GetGovernment.GetRulerTitle], e mediarebbe tra l'harem e l'alto consiglio. Si eleverebbe anche sopra il vecchio capo eunuco bianco, il #italic Kapı Ağası#!, che è responsabile dei servitori maschi al [ROOT.GetCountry.GetGovernment.GetCourtTitle], ma non è mai stato davvero affidabile."
 tur_eunuch_viziers_decision.desc.entry: "Chi controlla l'accesso agli alloggi privati del sovrano controlla molto più di una porta. $name_muhammad.turkish_language$ ha l'intelligenza per un tale incarico, e innalzarlo a #italic Kızlar Ağası#! risolverebbe anche una vecchia questione sulla lealtà del capo eunuco bianco."
 tur_eunuch_viziers_decision.a: "Eleviamo il Kızlar Ağası."
 mehmed_agha_tt: "Un [character|e] abile si unirà alla nostra corte e riceverà il [modifier|e] [ShowModifier('kizlar_agha_modifier')]"
 tur_eunuch_viziers_decision.b: "Rafforziamo invece il Kapı Ağası."
 valide_sultan_objects.tt: "La Valide Sultan non accetterà questo."
 mehmed_agha_fired.tt: "[mehmed_agha.GetNameWithNoTooltip] lascia il [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 tur_eunuch_viziers_decision.historical_info: "Il numero di eunuchi alla corte ottomana crebbe costantemente. Nel 1574, la carica di Kızlar Ağası fu creata per Mehmed Agha, dando agli eunuchi un potere senza precedenti. Gli eunuchi africani erano visti come più affidabili poiché le loro terre d'origine erano così lontane, e col tempo divennero molto più influenti degli eunuchi bianchi. Grazie in parte alle strette connessioni del Kızlar Ağası con le potenti Valide Sultan (madri regine), la carica divenne presto vizierato di primo rango, superato solo dal gran visir e dal $common_string_shaikh_al_islam$."

 tur_sekban_system_decision.title: "Termina i [ShowAdvanceNameWithNoTooltip('timariots')]"
 tur_sekban_system_decision.desc: "Il sistema dei [ShowAdvanceName('timariots')], che ci ha servito bene per lungo tempo, sta affrontando problemi critici. Le concessioni di terra che diamo a questi cavalieri sono diventate sempre più suddivise e povere, e i nostri nemici armati di moschetto assicurano che la cavalleria non sia più dominante sul campo di battaglia come nei giorni antichi. Se non concediamo più terre Timar, potremmo, quando i loro detentori invecchiano e muoiono, trasformarle in affitti fiscali per il beneficio diretto dello stato. L'esercito potrebbe anche essere modernizzato, più concentrato su soldati di fanteria armati con armi da polvere da sparo."
 tur_sekban_system_decision.a: "Dobbiamo cambiare con i tempi."
 timars_unavailable.tt: "I [reforms|e] Timar diventeranno permanentemente non disponibili."
 tur_sekban_system_decision.historical_info: "Il sistema Timar di concessioni di terra ai cavalieri Sipâhi divenne insostenibile col tempo. Mentre le grandi conquiste ottomane diventavano cosa del passato, non c'era più abbastanza terra da distribuire. Anche altre fazioni nell'esercito, specialmente i Giannizzeri, richiedevano concessioni. Rendendosi conto che una riforma era attesa da tempo, gli Ottomani abolirono il sistema e iniziarono a fare maggiore affidamento sul reclutamento di soldati Sekban dal contadinato."

 tur_kanum_i_osmani_decision.title: "[ShowPolicyNameWithNoTooltip('tur_kanum_i_osmani')]"
 tur_kanum_i_osmani_decision.desc: "Grazie alla crescita del [ROOT.GetCountry.GetFlavorRank], ci sono state moltitudini di popoli diversi che risiedono entro i suoi confini. Molti sono già consolidati come parte della nostra nazione, seguendo le vecchie leggi [ROOT.GetCountry.GetAdjective]. Eppure, sembra che quelle leggi non siano sufficienti. [target_character.GetName], conosciuto come pioniere di riforme, desidera invece riscrivere l'intero codice legale di [ROOT.GetCountry.GetNameWithNoTooltip], qualcosa per portare stabilità interna piuttosto che incoraggiare la crescita dei confini con la conquista."
 tur_kanum_i_osmani_decision.desc.entry: "Leggi scritte per un principato di frontiera non governano un impero di molti popoli. Un singolo codice, emesso in nostro nome e vincolante per tutti loro, comprerebbe l'ordine interno che ulteriori conquiste non possono, e abbiamo conquistato già abbastanza per un'epoca."
 tur_kanum_i_osmani_decision.a: "Queste leggi ci condurranno a una nuova era."
 tur_kanum_i_osmani_decision.b: "Terremo a mente queste riforme."
 tur_change_tur_kanum_policy_to_give_values_weighted_by_crown_power: "I [modifiers|e] forniti dalla [policy|e] [ShowPolicyName('tur_kanum_i_osmani')] saranno #Y 50%#! più efficaci, ma la loro efficacia scalerà invece con l'[estate_power|e] del [GetEstateName('crown_estate')]"

 tur_autonomous_kadiluks_decision.title: "Rafforza il Qāḍī"
 tur_autonomous_kadiluks_decision.desc: "Il #italic Qāḍī#!, i giudici in tutte le questioni importanti per il popolo [ShowReligionGroupAdjective('muslim')], sono stati a lungo un pilastro dello stato, e la carica di Qāḍī un sogno per molti studiosi. Ma con i recenti progressi nella governance e negli affitti fiscali, i Qāḍī ora cercano una maggiore autonomia sulle concessioni di terra #italic Kadiluk#! di cui sono responsabili. Concedere loro questo, suggeriscono, beneficerebbe la nostra pretesa di primazia su tutto [ShowReligionGroupNameWithNoTooltip('muslim')], e aumenterebbe per sempre la fiducia tra loro e la Sublime Porta."
 tur_autonomous_kadiluks_decision.a: "Meritano la nostra fiducia."
 tur_autonomous_kadiluks_decision.b: "Sono già abbastanza potenti."
 has_enabled_kadiluks_privilege: "Ha abilitato questo [estate_privilege|e] tramite la [decision|e] '$tur_autonomous_kadiluks_decision.title$'"
 tur_autonomous_kadiluks_decision.historical_info: "L'Impero Ottomano del XVII secolo vide un graduale debolimento del potere del sultano, con sempre più influenza investita in istituzioni come i giannizzeri e il Qāḍī. Un Kadiluk era la giurisdizione concessa a un Qāḍī, e al suo interno, egli sovrintendeva sia alla tassazione che alla coscrizione militare. Tramite i Kadiluk, il Qāḍī poteva esercitare una notevole influenza, specialmente nelle provincie fuori dai centri immediati del potere regio, e il loro status raggiunse un nuovo apice dopo l'Incidente di Edirne nel 1703, quando il sultano Mustafa II fu rovesciato."

 tur_malikane_decision.title: "La Riforma del $ottoman_tax_farming$"
 tur_malikane_decision.desc: "Riflettendo sulla nostra economia, [grand_vizier.GetName] ha preparato un nuovo sistema di affitto fiscale, chiamato #italic Malikâne#!. Un villaggio o distretto verrà messo all'asta al miglior offerente, che deterrà poi il diritto di tassarlo per tutta la vita. Ciò migliorerebbe il nostro vecchio sistema, sostiene [grand_vizier.GetSheHe], rendendo un affittuario fiscale più investito nel benessere a lungo termine delle sue terre, e meno propenso a dissanguarle prima della fine del suo mandato. Ci risparmierebbe anche la seccatura burocratica di amministrare tutti quei contratti annuali che erano la norma nelle epoche passate — ma d'altra parte, quelli erano piuttosto profittevoli."
 tur_malikane_decision.desc.entry: "Un affittuario fiscale che detiene un villaggio per un anno lo spoglierà; un affittuario fiscale che lo detiene a vita lo coltiverà. #italic Malikâne#! vende quel diritto a vita al miglior offerente, scambiando le ricche aste annuali del passato con distretti che vale ancora la pena tassare un decennio da ora."
 tur_malikane_decision.a: "Implementiamo questa riforma."
 malikane_available.tt: "Il [government_reform|e] [ShowGovernmentReformName('ottoman_malikane_tax_reform')] diventerà disponibile."
 tur_malikane_decision.historical_info: "Il sistema Malikâne fu introdotto nel 1695 dallo sfortunato gran visir Elmas Mehmed Pasha. Sembra avesse buone intenzioni, volendo migliorare i guadagni economici a lungo termine, ma fallì parzialmente. Il sistema incontrò una feroce ostruzione dalla vecchia generazione di detentori di affitti fiscali, e la supervisione statale sul nuovo tipo di concessioni a vita era carente. Nonostante la riforma, lo stato affrontò presto perdite militari e faticò a pagare i propri soldati. Elmas fu ucciso dai propri uomini nel 1697, e nel 1703, giannizzeri non pagati rovesciarono Mustafa II."

 tur_coffee_house_espionage_decision.title: "Infiltrazione delle Case del Caffè"
 tur_coffee_house_espionage_decision.desc: "Troppo spesso, le case del caffè dove molti [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] si riuniscono diventano rifugi per fraternizzazioni traditrici, e persino complotti di ribellione, specialmente tra i $janissaries_advance$. Sebbene le vivaci discussioni che avvengono sopra caffè scuro e dolci dessert siano state buone per il commercio e la comunità, non potrebbe far male espandere la nostra rete di spionaggio, assicurandoci che nessuno scambio segreto resti inascoltato. "
 tur_coffee_house_espionage_decision.desc.entry: "Gli uomini parlano più liberamente sopra un caffè che sotto interrogatorio, e le case dove i $burghers_estate$ si riuniscono sono dense di discorsi che i $janissaries_advance$ preferirebbero non avessimo mai sentito. Chiuderle ci costerebbe sia il commercio che le chiacchiere, mentre riempirle dei nostri stessi ascoltatori non ci costa nulla."
 tur_coffee_house_espionage_decision.a: "L'informazione è potere."
 tur_coffee_house_espionage_decision.b: "Facciamo un giro di vite sulle case del caffè."
 tur_coffee_house_espionage_decision.c: "Il caffè deve scorrere senza ostacoli."
 coffee_house_espionage_available.tt: "Il [government_reform|e] [ShowGovernmentReformName('ottoman_coffee_house_espionage')] diventerà disponibile."
 tur_coffee_house_espionage_decision.historical_info: "Le case del caffè nell'Impero Ottomano erano luoghi d'incontro dinamici per uomini di molte diverse professioni, etnie, e fedi, dove artigiani turchi potevano mescolarsi con vagabondi russi e mercanti veneziani. Come tali, divennero un forum per il discorso pubblico, idee innovative, arte — e ribellione. Le case del caffè dei giannizzeri in particolare fornivano un modo per connettersi con reti clandestine per assassinii, informazioni, e risorse. Il governo impiantò molte spie nelle case del caffè e simili istituzioni pubbliche, per ottenere informazioni sul sentimento pubblico e qualsiasi discorso di crimine o ribellione."

 tur_new_order_army_decision.title: "L'Esercito del Nuovo Ordine"
 tur_new_order_army_decision.desc: "Riflettendo sulla forza dei nostri rivali e sui pericoli di un mondo che cambia, ma specialmente sulla costante minaccia di ribellione dai turbolenti e decadenti $janissaries_advance$, [target_ruler.GetName] ha una nuova idea. [target_ruler.GetSheHe|U] vuole riformare l'esercito in una forza altamente professionale e moderna, rinforzata da istruttori di [ShowContinentName('europe')] e nuove uniformi, tradizioni, e addestramento. Ma facendo ciò, [target_ruler.GetSheHe] rischierebbe l'ira dei $janissaries_advance$, dei $bashi_bazouks$, dei membri del $sekban_system$, e di tutti gli altri che profittano dallo stato attuale delle cose."
 tur_new_order_army_decision.desc.entry: "L'ostacolo a un esercito moderno non sono i soldi o gli istruttori ma l'esercito che già manteniamo. Formare una forza disciplinata al fianco dei $janissaries_advance$ significa armare gli uomini a cui un giorno verrà ordinato di sciogliere questi ultimi, e i $bashi_bazouks$ e il $sekban_system$ possono leggere quell'intenzione tanto bene quanto noi."
 tur_new_order_army_decision.a: "Abbiamo bisogno di questo cambiamento."
 tur_new_order_army_decision.b: "I vecchi metodi sono sufficienti."
 new_order_army_available.tt: "Il [government_reform|e] [ShowGovernmentReformName('ottoman_new_order_army')] diventerà disponibile."
 tur_new_order_army: "Sbloccato [ShowGovernmentReformNameWithNoTooltip('ottoman_new_order_army')]"
 tur_new_order_army_decision.historical_info: "Il Niẓām-i Jedīd, l'#italic Esercito del Nuovo Ordine#!, fu istituito nel 1797. Era la parte centrale del programma di riforme di Selim III. Egli sperava di invertire la decentralizzazione dell'impero e circumventare il potere radicato dei Giannizzeri, sostituendo gradualmente il corpo dei Giannizzeri con una forza di fanteria moderna secondo il modello degli esercizi d'Europa."