l_english:
 spa_establish_the_council_of_castile_decision.title: "Istituisci il $royal_council_of_castile$"
 spa_establish_the_council_of_castile_decision.desc: "Per troppo tempo il [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] è stato incatenato ai capricci dei piccoli [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e all'inefficiente mosaico di giurisdizioni locali. Il [ShowGovernmentReformName('royal_council_of_castile')], proposto da [target_character.GetName] e sostenuto sia dai riformisti che dai realisti, offre una visione di uno stato più centralizzato e governato professionalmente. Dando al consiglio il potere di sovrintendere alla riscossione delle tasse, alle questioni giudiziarie, e alle nomine, potremmo indirizzare meglio le risorse del [ROOT.GetCountry.GetFlavorRank] verso l'interesse nazionale, piuttosto che verso l'indulgenza dei governatori locali."
 spa_establish_the_council_of_castile_decision.desc.entry: "Governare tramite un mosaico di giurisdizioni locali lascia la $crown_estate$ dipendente da chiunque detenga il potere in ognuna di esse. Un organo permanente di funzionari addestrati che risponde solo a noi, il [ShowGovernmentReformName('royal_council_of_castile')], porrebbe la tassazione, la giustizia, e le nomine al di fuori della portata degli interessi locali."
 spa_establish_the_council_of_castile_decision.a: "Che il consiglio sovrintenda al [ROOT.GetCountry.GetFlavorRank]."
 spa_establish_the_council_of_castile_decision.a.entry: "Che il consiglio sovrintenda al regno."
 establish_the_council_of_castile_tt: "Sblocca il [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')]"
 established_the_council_of_castile_tt: "Istituito il [ShowBureaucracyTypeName('spa_council_of_castile_bureaucracy')] con la decisione $spa_establish_the_council_of_castile_decision.title$."
 spa_establish_the_council_of_castile_decision.historical_info: "Il Reale e Supremo Consiglio di Castiglia fu istituito alla fine del XV secolo sotto i Re Cattolici, Ferdinando II d'Aragona e Isabella I di Castiglia. Originariamente un organo consultivo medievale, il Consiglio fu trasformato in uno strumento centrale dell'autorità regia. Servì a frenare il potere dell'alta nobiltà, superare i privilegi locali, e professionalizzare il governo tramite la nomina di avvocati e burocrati formati all'università che servivano gli interessi del regno."
