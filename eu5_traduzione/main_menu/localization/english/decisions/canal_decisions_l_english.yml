l_english:
 build_suez_canal.title: "Costruisci il Canale di Suez"
 build_suez_canal.desc: "I nostri ingegneri riferiscono che un canale attraverso l'Istmo di Suez è alla nostra portata tecnica. Il progetto sarebbe immenso, ma il premio, il comando di tutto il commercio orientale, è ancora più grande."
 build_suez_canal.a: "Avvia i lavori sul canale."
 build_suez_canal.b: "Non in questo momento."

 build_panama_canal.title: "Costruisci il Canale di Panama"
 build_panama_canal.desc: "I nostri ingegneri hanno rilevato lo stretto collo del Nuovo Mondo. Un canale che collega i due grandi oceani è possibile. Il costo sarà enorme, la ricompensa incalcolabile."
 build_panama_canal.a: "Avvia i lavori sul canale."
 build_panama_canal.b: "Non in questo momento."
 close_suez_canal_to_enemies.title: "Chiudere il Canale di Suez ai Non Alleati"
 close_suez_canal_to_enemies.desc: "Limitiamo il passaggio attraverso il Canale di Suez ai nostri alleati e sudditi per la durata della guerra. I nemici sono esclusi automaticamente; ciò esclude inoltre neutrali e rivali."
 close_suez_canal_to_enemies.a: "Vietiamo il passaggio a tutti tranne ai nostri alleati."
 close_suez_canal_to_enemies.b: "Non in questo momento."
 open_suez_canal_to_all.title: "Aprire il Canale di Suez a Tutti"
 open_suez_canal_to_all.desc: "Revochiamo le restrizioni sul Canale di Suez e riapriamo il passaggio a qualsiasi paese con cui non siamo attivamente in guerra."
 open_suez_canal_to_all.a: "Revochiamo le restrizioni."
 open_suez_canal_to_all.b: "Non in questo momento."
