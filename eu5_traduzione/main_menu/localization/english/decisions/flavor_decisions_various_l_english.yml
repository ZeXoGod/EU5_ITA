l_english:
 ser_novo_brdo_mine_decision.title: "Il Codice di [ShowLocationNameWithNoTooltip('novo_brdo')]"
 ser_novo_brdo_mine_decision.desc: "La vivace città mineraria di [ShowLocationName('novo_brdo')] ha sviluppato un proprio insieme di regole e pratiche per gestire le complesse operazioni e i diritti associati alla sua lucrosa industria. Ultimamente, è cresciuta una richiesta di adottare un codice minerario nazionale completo basato sui suoi principi. Il proposto [ShowPolicyName('novo_brdo_mining_law')] standardizzerebbe l'organizzazione delle città minerarie, delineerebbe i diritti e le responsabilità dei minatori, e assicurerebbe pratiche eque e misure di sicurezza in tutto [ROOT.GetCountry.GetName]."
 ser_novo_brdo_mine_decision.desc.entry: "Una città mineraria ha elaborato, tramite prove e dispute, regole che mantengono i suoi pozzi profittevoli e i suoi minatori dal uccidersi a vicenda per essi. Fare delle usanze di [ShowLocationName('novo_brdo')] la legge per ogni miniera in $SER$ costa alle altre città la loro pratica locale, ma le risparmia dall'inventare male le stesse regole."
 ser_novo_brdo_mine_decision.a: "Compiliamo una nuova legge."
 ser_novo_brdo_mine_decision.b: "Manteniamo le attuali regolamentazioni minerarie."
 has_unlocked_novo_brdo_tt: "Ha sbloccato la legge tramite la [decision|e] #Y Il Codice di [ShowLocationNameWithNoTooltip('novo_brdo')]#!"
 STATIC_MODIFIER_NAME_ser_novo_brdo_code: "Il Codice di Novo Brdo"
 ser_novo_brdo_mine_decision.historical_info: "Il Codice Minerario di Novo Brdo, stabilito nel 1412 da Stefan Lazarević, era un insieme completo di regolamenti che governavano le operazioni minerarie, i diritti dei lavoratori e l'organizzazione delle città minerarie nella Serbia medievale. Forniva linee guida dettagliate sui diritti di proprietà, le misure di sicurezza e le pratiche economiche, influenzando significativamente lo sviluppo e la prosperità delle comunità minerarie."

 chi_grand_pronouncements_decision.title: "Grandi Proclami"
 chi_grand_pronouncements_decision.desc: "[target_character.GetName|U] sostiene che il crollo della precedente dinastia fu causato interamente dalla corruzione e dall'eccesso di potere dei ministri governativi. In questo senso, [target_character.GetHeShe] sostiene che un codice legale più rigido e legalista dovrebbe essere promulgato per impedire che [ROOT.GetCountry.GetName] subisca la stessa sorte."
 chi_grand_pronouncements_decision.desc.entry: "Le dinastie non cadono per invasione tanto spesso quanto cadono per i ministri che dovrebbero servirle. La corte intende scrivere un codice abbastanza rigido da far sì che nessun ministro confonda il palazzo con il proprio, qualunque sia il costo per la flessibilità di cui tali uomini di solito godono."
 chi_grand_pronouncements_decision.a: "Colpiamo duramente la corruzione."
 chi_grand_pronouncements_decision.b: "Corruzione? Nel nostro governo? Impossibile."
 chi_ming_dynasty_code_will_be_changed: "[ShowPolicyName('chi_ming_dynasty_code_policy')] verrà modificata per includere i modificatori di [ShowModifier('chi_grand_pronouncements')]."
 integrated_grand_prounouncements: "Ha integrato [ShowModifier('chi_grand_pronouncements')] nella [ShowPolicyName('chi_ming_dynasty_code_policy')]."

 cas_right_of_possession_decision.title: "[ShowPolicyNameWithNoTooltip('right_of_possesion')]"
 cas_right_of_possession_decision.desc: "Sotto la costante guida della [ShowLawName('mesta_council_law')], la nostra [ShowGoodsName('wool')] è prosperata e ha espanso la propria influenza sulle terre [ROOT.GetCountry.GetAdjective]. Per mantenere l'organizzazione prosperosa e sotto controllo, sarebbe benefico implementare il [ShowPolicyName('right_of_possesion')], una legge che regolerebbe l'uso dei pascoli e imporrebbe un limite ragionevole ai pagamenti d'affitto necessari."
 cas_right_of_possession_decision.desc.entry: "Una gilda lasciata a controllarsi da sola alla fine controlla solo i propri interessi. La [ShowLawName('mesta_council_law')] ha fatto crescere la [ShowGoodsName('wool')] fino a diventare una fortuna, e un limite fisso sugli affitti dei pascoli impedirebbe che tale fortuna venga estratta interamente dagli agricoltori che affittano la terra sottostante."
 cas_right_of_possession_decision.a: "Istituiamo il [ShowPolicyNameWithNoTooltip('right_of_possesion')]."
 cas_right_of_possession_decision.b: "La situazione attuale è preferibile."
 cas_right_of_possession_decision.c: "Aboliamo la [ShowLawNameWithNoTooltip('mesta_council_law')]!"
 cas_right_of_possession_decision.c.tt: "Tutte le [locations|e] di [ShowGoodsNameWithNoTooltip('wool')] che possediamo in [ShowRegionName('iberia_region')] perderanno permanentemente il Modificatore [ShowModifier('merino_wool')]"

 cas_altered_nueva_recopilacion_decision.title: "Novísima Recopilación"
 cas_altered_nueva_recopilacion_decision.desc: "Nonostante l'[ShowAdvanceName('enlightenment_advance')] stia avanzando su [ROOT.GetCountry.GetName], molte delle nostre leggi sono diventate obsolete, in particolare la [ShowPolicyName('nueva_recopilacion_policy')]. Vedendo ciò, [target_character.GetName] desidera eliminare qualsiasi idea tradizionalista, riscrivendole per allontanarsi dal diritto canonico romano. Ciò contribuirebbe a educare le masse, insegnando loro più della semplice fede [ROOT.GetCountry.GetReligion.GetAdjective] che ha dominato il nostro sistema legale."
 cas_altered_nueva_recopilacion_decision.desc.entry: "Un codice legale redatto prima dell'[ShowAdvanceName('enlightenment_advance')] ci governa ancora come se esso non fosse mai accaduto. Riscrivere la [ShowPolicyName('nueva_recopilacion_policy')] allontanandola dal diritto canonico romano insegnerebbe al popolo qualcosa oltre alla fede su cui i tribunali si sono appoggiati per un secolo."
 cas_altered_nueva_recopilacion_decision.a: "Permetteremo a queste idee di progresso di prosperare."
 cas_altered_nueva_recopilacion_decision.b: "Non allontaniamoci dalle nostre tradizioni."
 cas_altered_nueva_recopilacion_decision.historical_info: "Un miglioramento della Nueva Recopilación, la Novísima Recopilación si allontanò dal carattere di diritto canonico romano che la versione precedente aveva. Fu invece un passo verso l'unificazione di Castiglia e Aragona all'interno del regno spagnolo. Implementate nel 1805, queste leggi sarebbero state lo studio di qualsiasi caso legale in Spagna, ma non sarebbero state tanto moderne quanto il nascente Codice Napoleonico dell'epoca."
 spa_alter_nueva_recopilacion_policy_tt: "I bonus della [policy|e] [ShowPolicyName('nueva_recopilacion_policy')] si concentreranno ora sulla [research|e], e scaleranno con l'[estate_power|e] del [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."

 cas_spanish_cloth_industry_decision.title: "Pregiata [ShowGoodsNameWithNoTooltip('wool')] Merino"
 cas_spanish_cloth_industry_decision.desc: "La migliorata qualità della nostra [ShowGoodsName('wool')] ne ha anche aumentato la reputazione in altri mercati europei e incrementato la domanda dall'estero. Ciò potrebbe aprire l'industria guidata dalla [ShowLawName('mesta_council_law')] a diventare un'esportazione molto profittevole per noi se la sosteniamo. Alcuni Membri della [ShowLawNameWithNoTooltip('mesta_council_law')] sostengono anche di usare questa [ShowGoodsNameWithNoTooltip('wool')] di qualità come base per creare un'industria [ROOT.GetCountry.GetAdjective] di [ShowGoodsName('fine_cloth')] e stabilire una solida Industria Tessile [ROOT.GetCountry.GetCulture.GetName]!"
 cas_spanish_cloth_industry_decision.desc.entry: "La [ShowGoodsName('wool')] grezza venduta all'estero arricchisce i tessitori stranieri più di quanto arricchisca noi. Costruire un commercio di [ShowGoodsName('fine_cloth')] sulle spalle della [ShowLawName('mesta_council_law')] ci permetterebbe di vendere invece il prodotto finito, se il consiglio può essere convinto che il passo in più vale l'investimento."
 cas_spanish_cloth_industry_decision.a: "Concentriamoci sull'esportazione!"
 cas_spanish_cloth_industry_decision.a.tt: "Tutte le [locations|e] di [ShowGoodsNameWithNoTooltip('wool')] che possediamo in [ShowRegionName('iberia_region')] riceveranno il Modificatore [ShowModifier('quality_merino_wool')] per 50 anni"
 cas_spanish_cloth_industry_decision.b: "Sosteniamo la nostra industria nazionale."
 cas_spanish_cloth_industry_decision.b.tt: "Sblocca i Metodi di Produzione del Tessuto Spagnolo per [ShowBuildingTypeNameWithNoTooltip('fine_cloth_guild')]."
 has_unlocked_spanish_cloth_industry: "Ha sostenuto l'Industria Tessile Spagnola nell'evento"
 STATIC_MODIFIER_NAME_quality_merino_wool: "Lana Merino di Qualità"

 por_casa_de_india_decision.title: "Casa da Índia"
 por_casa_de_india_decision.desc: "Dobbiamo sovrintendere e amministrare efficacemente gli interessi e i possedimenti [ROOT.GetCountry.GetAdjective] in $india$ e [ShowContinentName('africa')]. È stato suggerito che il modo migliore per raggiungere questo obiettivo sia creare un'istituzione direttamente sotto il Tesoriere [ROOT.GetCountry.GetGovernment.GetAdjective] con diritti di monopolio su tutte le connessioni commerciali e i beni correlati."
 por_casa_de_india_decision.desc.entry: "Un commercio sparso tra $india$ e [ShowContinentName('africa')] è un commercio di cui nessuno tiene propriamente conto. Un'unica istituzione sotto il Tesoriere, con il monopolio sui beni più importanti, risponderebbe di tutto in un solo registro."
 por_casa_de_india_decision.a: "Sembra un buon piano."
 por_casa_de_india_decision.a.tt: "Sblocca la [government_reform|e] [ShowGovernmentReformName('por_casa_de_india')]"

 hol_ned_shipbuilding_decision.title: "Il Fluitschip"
 hol_ned_shipbuilding_decision.desc: "L'espansiva economia [ROOT.GetCountry.GetCulture.GetName] ha posto grandi richieste sulla nostra marina mercantile. Le acque [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] molto basse significano anche che le comuni navi mercantili come le caravelle non sono in grado di avvicinarsi a molti dei porti [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Finora questo è stato gestito tramite l'uso di boeier più piccoli, ma con il supporto finanziario di [target_character.GetName], un mercante di [ShowLocationName('hoorn')], è stato sviluppato un nuovo tipo di nave.\nLo fluitschip o fluyt è più lungo e ha una caratteristica poppa a forma di pera, ed è costruito per essere efficacemente gestito da un piccolo equipaggio. Poiché è in grado di trasportare carichi più grandi pur gestendo le acque basse olandesi e comportandosi molto bene in mare aperto, questa nave è una benedizione per i nostri mercanti."
 hol_ned_shipbuilding_decision.desc.entry: "Un boeier può raggiungere le basse acque che i nostri porti richiedono ma trasporta troppo poco perché il viaggio ne valga la pena. $name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ ha finanziato un progetto più lungo e con la poppa a pera che riesce a fare entrambe le cose, trasportando un carico reale attraverso acque appena profonde quanto basta per una barca a remi."
 hol_ned_shipbuilding_decision.a: "Questa è senza dubbio una buona idea!"
 hol_ned_shipbuilding_decision_tt: "$name_peter.dutch_dialect$ $name_john.dutch_dialect$ $Liorne$ si unirà alla nostra [court|e]"
 hol_ned_shipbuilding_decision.b: "Idea interessante, ma non è il momento. Forse più avanti?"

 nov_ivan_hundred_strong_decision.title: "Associazione Mercantile degli [ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')]"
 nov_ivan_hundred_strong_decision.desc: "Essendo uno dei maggiori centri commerciali, [ROOT.GetCountry.GetName] è diventato la patria di molte potenti associazioni mercantili. Tra queste associazioni, tuttavia, gli [ShowEstatePrivilegeName('novgorod_ivans_hundred')] sono tra i più influenti, mantenendo una forte presa sul commercio della [ShowGoodsName('beeswax')]. Cercando di far crescere ulteriormente la propria influenza, molti degli alti funzionari dell'associazione si sono rivolti a [our_ruler.GetName] e al Veche nella speranza di ottenere ulteriore sostegno. Alcuni all'interno dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno discretamente esortato [our_ruler.GetNameWithNoTooltip] a evitare di rafforzare ulteriormente l'associazione, poiché potrebbero crescere fino ad avere troppa influenza sul commercio di [ROOT.GetCountry.GetNameWithNoTooltip]."
 nov_ivan_hundred_strong_decision.desc.entry: "Gli [ShowEstatePrivilegeName('novgorod_ivans_hundred')] controllano già il commercio della [ShowGoodsName('beeswax')] in modo più completo di quanto dovrebbe fare qualsiasi singola gilda, e i suoi funzionari ne vogliono ancora di più. I $nobles_estate$ ci chiedono discretamente di negarglielo, temendo un corpo mercantile troppo potente per rispondere al Veche."
 nov_ivan_hundred_strong_decision.a: "Concediamo loro un sostegno rafforzato dal Veche."
 empower_ivan_hundred_privilege: "Gli [ShowEstatePrivilegeName('novgorod_ivans_hundred')] otterranno quanto segue per 25 anni:\n#R -5.00%#! [ShowModifierTypeName('global_crown_estate_power')] e #G +20.00%#! [ShowModifierTypeName('global_merchant_capacity_modifier')]"
 ivan_hundred_strengthened_requirement: "Il seguente bonus può essere ottenuto dalla [decision|e] $nov_ivan_hundred_strong_decision.title$:"
 variable_ivan_hundred_strengthened_tt: "Gli [ShowEstatePrivilegeName('novgorod_ivans_hundred')] sono stati Rafforzati"
 ivan_hundred_strengthened: "Rafforzato l'Ivan's Hundred"

 nov_ivan_hundred_beeswax_decision.title: "Gli [ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] Richiedono il Monopolio sulla [ShowGoodsNameWithNoTooltip('beeswax')]"
 nov_ivan_hundred_beeswax_decision.desc: "Seguendo l'ulteriore sostegno del Veche, gli [ShowEstatePrivilegeName('novgorod_ivans_hundred')] sono cresciuti nel godere del loro status più elevato. Cercando di ottenere ulteriore sostegno per le proprie iniziative, l'associazione ha richiesto che venga loro concesso un monopolio esclusivo sulla produzione di [ShowGoodsName('beeswax')] a Novgorod. Sebbene l'associazione abbia sempre mantenuto una grande influenza sul commercio, un monopolio consoliderebbe saldamente il loro controllo sul bene."
 nov_ivan_hundred_beeswax_decision.a: "Concediamo la richiesta per una maggiore influenza sul commercio di [ShowGoodsNameWithNoTooltip('beeswax')]."
 nov_ivan_hundred_beeswax_decision.b: "Impediamo agli [ShowEstatePrivilegeNameWithNoTooltip('novgorod_ivans_hundred')] di diventare più forti."
 ivan_hundred_beeswax_increase: "Gli [ShowEstatePrivilegeName('novgorod_ivans_hundred')] otterranno quanto segue per 25 anni:\n#G +10.00%#! [ShowModifierTypeName('selling_efficiency')] e #G +25.00%#! [ShowModifierTypeName('global_beeswax_output_modifier')]"
 ivan_hundred_beeswax_increase_requirement: "Il seguente bonus può essere ottenuto dalla [decision|e] $nov_ivan_hundred_beeswax_decision.title$:"
 ivan_hundred_beeswax: "Maggiore Influenza sul commercio di Beeswax"

 kbo_serfdom_reform_decision.title: "Continuazione delle Razzie Schiaviste"
 kbo_serfdom_reform_decision.desc: "Come accade in varie parti del continente, anche la nostra economia dipende in larga misura dall'afflusso e dall'utilità del lavoro forzato. Le frequenti razzie sostenute dal nostro esercito e dai signori della guerra locali forniscono ai nostri mercati nuova manodopera da impiegare in ogni angolo della nostra società. Tuttavia, a causa dei nostri recenti progressi e investimenti in queste attività, abbiamo accumulato un numero considerevole di queste persone. Spetta quindi a noi decidere se desideriamo continuare a investire in queste razzie e amplificare il flusso di popoli conquistati nel nostro mercato, oppure decidere di concedere loro una posizione nella nostra società e permettere loro di prosperare come parte di essa."
 kbo_serfdom_reform_decision.a: "La nostra economia beneficerà enormemente da questo commercio."
 kbo_serfdom_reform_decision.b: "Lavoriamo per integrare tutti nella nostra società."
 kbo_pop_promotion_more_potent_tt: "Otterremo accesso alla [cabinet_action|e] unica [ShowCabinetActionName('kbo_pop_promote_action')]"

 kbo_amenokal_salt_traders_decision.title: "Azalai & Taghlamt"
 kbo_amenokal_salt_traders_decision.desc: "Per secoli, dopo l'introduzione del cammello nell'Africa Occidentale e Centrale, molti mercanti si sono presi il compito di attraversare gli ambienti avversi in cerca di profitti e avventure mercantili usando rotte come l'Azalai o il Taghlamt. Conosciuti come Amenokal, questi potenti individui sovrintendevano e viaggiavano attraverso il deserto, da un'oasi all'altra, collegando località lontane e commerciando il preziosissimo [ShowGoodsName('salt')]. In questi mercati, il sale veniva venduto in lastre o mattoni in cambio di cibo, bestiame e altri beni importanti. Se concedere o non concedere una posizione di controllo così privilegiata a individui potenti è una questione delicata, e una che richiederebbe i nostri consiglieri più fidati per essere gestita."
 kbo_amenokal_salt_traders_decision.a: "Lasciamo che l'Amenokal di ogni carovana sovrintenda al proprio commercio."

 kbo_sharia_courts_decision.title: "La $sharia$ in $KBO$"
 kbo_sharia_courts_decision.desc: "La nostra grande nazione è stata una delle più antiche e rapide ad adottare l'Islam [ShowReligionAdjective('sunni')] [ShowReligionGroupName('muslim')]. Con un rinnovato vigore per la vera fede e armati di energia incessante, abbiamo fatto del nostro meglio per consolidare i nostri valori religiosi e difendere il nostro popolo dai curiosi infedeli. Tuttavia, un aspetto della nostra fede che non ha ancora preso piede è la $sharia$. Sebbene l'insieme delle leggi religiose sia presente nel nostro paese già da lungo tempo, non raggiunge ancora ogni angolo del nostro paese. Alcuni dei nostri consiglieri favoriscono la creazione di corti speciali con il compito di far applicare la $sharia$, altri invece sconsigliano di intrecciare religione e amministrazione."
 kbo_sharia_courts_decision.a: "Radicare la $sharia$ più profondamente nel nostro governo è il prossimo passo logico!"
 kbo_enable_sharia_courts_cabinet_action_tt: "Otterremo accesso alla [cabinet_action|e] unica [ShowCabinetActionName('kbo_sharia_courts')]"

 teu_kulm_law_revised_decision.title: "Rivedere la $kulm_law$"
 teu_kulm_law_revised_decision.desc: "La [ShowSituationName('black_death')] ha devastato l'intero continente di [ShowContinentName('europe')], decimando numerose città e sprofondando insediamenti in rovina. Sebbene l'impatto economico sul [ROOT.GetCountry.GetLongName] sia stato terribile, peggio ancora è il fatto che la popolazione ridotta in Germania ha diminuito le pressioni migratorie, riducendo la crescita della popolazione in [ShowAreaName('prussia_area')]. A meno che non forniamo maggiori incentivi a migrare nelle terre [ROOT.GetCountry.GetAdjectiveWithNoTooltip], presto resteremo senza alcun migrante, che costituisce una parte essenziale della nostra missione di cristianizzazione."
 teu_kulm_law_revised_decision.desc.entry: "La [ShowSituationName('black_death')] ha assottigliato la Germania abbastanza da lasciare pochi migranti da inviare verso est, e il nostro ordine in [ShowAreaName('prussia_area')] dipende da un flusso costante di essi. Rendere più vantaggiosi i termini di insediamento costa concessioni che preferiremmo mantenere, ma una frontiera vuota non convertirà nessuno."
 teu_kulm_law_revised_decision.a: "Concediamo maggiori benefici ai migranti."
 teu_kulm_law_revised_decision.b: "Dovremo affrontare la situazione così com'è."
 teu_impact_on_kulm_law: "[ShowEstatePrivilegeName('kulm_law')] verrà modificata da:\n#g +0.1#! [ShowModifierTypeName('rural_migration_attraction')]\n#r -10.0%#! [ShowModifierTypeName('burghers_estate_max_tax')]"
 teu_impact_on_kulm_law_not_revised: "[ShowEstatePrivilegeName('kulm_law')] verrà modificata da:\n#r -50.0%#! [ShowModifierTypeName('german_migration_attraction_modifier')]\n#g +10.0%#! [ShowModifierTypeName('global_pop_assimilation_speed_modifier')]"
 kulm_law_revised_tooltip: "Ha rivisto [ShowEstatePrivilegeName('kulm_law')] tramite la [decision|e] $teu_kulm_law_revised_decision.title$."
 kulm_law_not_revised_tooltip: "Ha scelto di non rivedere [ShowEstatePrivilegeName('kulm_law')] tramite la [decision|e] $teu_kulm_law_revised_decision.title$."

 bra_kreditwerk_reformed_decision.title: "Riforma il $bra_kreditwerk$"
 bra_kreditwerk_reformed_decision.desc: "Nonostante i Poteri concessi al Kreditwerk, l'Istituzione è riuscita a contrarre un debito pesante, gestendo male le nostre finanze in larga misura. Poiché siamo ora di fronte alla bancarotta imminente del Kreditwerk, dovremo prendere una decisione riguardo al suo futuro. Si stanno formando diverse fazioni tra i ranghi dei nostri consiglieri, alcuni consigliano di riformare il Kreditwerk e porlo sotto l'amministrazione diretta della corona, mentre altri raccomandano l'abolizione totale dell'Istituzione."
 bra_kreditwerk_reformed_decision.a: "Riformiamo l'Istituzione sotto la corona."
 bra_kreditwerk_reformed_decision.b: "Liberiamoci di questo male."
 bra_kreditwerk_reformed_decision.c: "Salviamolo e lasciamolo continuare."

 boh_unity_brethren_decision.title: "Sostieni l'Unità dei Fratelli"
 boh_unity_brethren_decision.desc: "Negli anni passati di pratica della liturgia [ShowReligionAdjective('hussite')], l'albero della nostra fede ha fatto germogliare molti rami mentre fiorisce e cresce nel nostro paese. Molti credenti affollano le congregazioni per partecipare a riti ecclesiastici, purificati e liberi dal tocco degli eretici traviati.\n\nTuttavia, in questo ambiente di pietà e teolatria, un numero crescente del nostro [ShowEstateTypeName('clergy_estate')] si è rivolto a un'interpretazione estrema del [ShowReligionNameWithNoTooltip('hussite')] che predica l'esclusione della nobiltà e dei mercanti dal diventare rappresentanti della Chiesa, con la liturgia condotta in cerimonie semplici e umili mentre si rifiuta la successione apostolica."
 boh_unity_brethren_decision.desc.entry: "Una fede che continua a crescere alla fine cresce oltre ciò che i suoi fondatori intendevano, e la nostra lo ha fatto. Alcuni dei $clergy_estate$ ora predicano che nobili e mercanti non hanno alcun posto nella Chiesa, il che è una dottrina più pura di quella con cui abbiamo iniziato e considerevolmente più dirompente."
 boh_unity_brethren_decision.a: "Lasciamoli predicare, le loro parole contengono verità."
 unity_brethren_privilege: "Unità dei Fratelli"
 unity_brethren_privilege_desc: "Un movimento di radicali [ShowReligionName('hussite')] incentrato sulla nuda eleganza della predicazione e del culto, focalizzato sull'esclusione degli individui potenti dei [ShowEstateTypeName('burghers_estate')] e dei [ShowEstateTypeName('nobles_estate')] mentre promuove la lingua madre e cerimonie semplificate durante la comunione."

 ara_sindicat_remenca_decision.title: "Sindicat Remença"
 ara_sindicat_remenca_decision.desc: "La nobiltà nel [ROOT.GetCountry.GetLongName] ha iniziato a far rispettare rigidamente le regole che legano i contadini alla terra, e ciò, combinato con un'applicazione più rigida dei diritti signorili in generale, ha portato a disordini tra i contadini. I contadini più poveri sostengono fortemente la ribellione aperta mentre quelli più benestanti preferiscono appellarsi a noi per riforme e la fine degli abusi signorili.\n\nSarebbe un'eccellente opportunità per ottenere il sostegno dei contadini, poiché siamo in una costante lotta di potere con la nobiltà. Sono state fatte proposte riguardo al permettere ai contadini di formare un [ShowEstatePrivilegeName('ara_sindicat_remenca')], una gilda contadina o primitivo sindacato commerciale, che garantirebbe loro maggiore libertà."
 ara_sindicat_remenca_decision.desc.entry: "Un contadino assolutamente legato alla terra non ha modo legale di resistere al suo signore, solo uno illegale, e la resistenza illegale è ciò che i più poveri tra loro stanno ora scegliendo. Una gilda autorizzata offre invece ai contadini più benestanti uno sfogo legale, e ci compra la loro lealtà contro la nobiltà a un costo molto basso per la corona."
 ara_sindicat_remenca_decision.a: "Permettiamo ai contadini di formare il Sindicat Remença."
 ara_sindicat_remenca_decision.b: "Ignoriamo la plebe contadina."
 ara_sindicat_remenca: "Sindicat Remença"
 ara_sindicat_remenca_desc: "Il Sindicat Remença è una gilda contadina o primitivo sindacato commerciale. Fu introdotto per la prima volta in Catalogna nel 1448."

 nov_tysiatskii_influential_decision.title: "Il Vecchio Tysiatskii"
 nov_tysiatskii_influential_decision.desc: "Sebbene l'[ShowEstatePrivilegeName('tysiatskii_privilege')] sia rimasta una carica elettiva all'interno di [ROOT.GetCountry.GetName], è rimasta in gran parte una carica che i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno mantenuto sotto uno stretto controllo, con molti Tysiatskii eletti che spesso provengono da famiglie dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]. Tuttavia, di recente, anche dopo essersi ritirati dalla carica, gli ex Tysiatskii sono cresciuti nel mantenere una considerevole influenza sulla successiva elezione, spesso sostenendo un figlio per succedere loro nella posizione. Conosciuti come #italic Vecchi Tysiatskii#!, questi individui sono diventati una forza con cui bisogna fare i conti all'interno del Veche."
 nov_tysiatskii_influential_decision.desc.entry: "Una carica elettiva non è un grande freno al potere se le stesse famiglie continuano a vincere l'elezione. I #italic Vecchi Tysiatskii#! ora dirigono il voto verso i propri figli anche dopo aver lasciato la carica, e i $nobles_estate$ hanno discretamente reso la carica propria in tutto tranne il nome."
 nov_tysiatskii_influential_decision.a: "Dovremmo cercare di sfruttare la loro influenza."
 nov_tysiatskii_influential_decision.b: "Cerchiamo di indebolire l'influenza dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] sulla carica."
 nov_tysiatskii_influential_decision.b.entry: "Cerchiamo di indebolire l'influenza dei $nobles_estate$ sulla carica."
 nov_tysiatskii_influence_weakened: "Influenza del Tysiatskii Indebolita"
 nov_influential_tysiatskii: "Tysiatskii Influente"
 nov_tysiatskii_influence_weakened_benefits: "L'[ShowEstatePrivilegeName('tysiatskii_privilege')] otterrà quanto segue per 30 anni:\n#G -25.00%#! [ShowModifierTypeName('global_nobles_estate_power')] e #G +0.10#! [ShowModifierTypeName('stability_investment')]"
 nov_tysiatskii_influence_event_happened: "Il Tysiatskii ha ottenuto più influenza!"
 nov_tysiatskii_influence_event_happened_possible_event: "Il Tysiatskii potrebbe tentare di affermarsi sui [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] in futuro!"
 nov_influential_tysiatskii_benefits: "L'[ShowEstatePrivilegeName('tysiatskii_privilege')] otterrà quanto segue per 30 anni:\n#R +25.00%#! [ShowModifierTypeName('global_nobles_estate_power')] e #G +15.00%#! [ShowModifierTypeName('army_heavy_infantry_power')]"
 nov_influential_tysiatskii_requirement: "Il seguente bonus può essere ottenuto dalla [decision|e] $nov_tysiatskii_influential_decision.title$:"
 nov_tysiatskii_influence_weakened_requirement: "Il seguente bonus può essere ottenuto dalla [decision|e] $nov_tysiatskii_influential_decision.title$:"

 boh_district_paving_decision.title: "Diritti di Tassazione dei Distretti di [ShowLocationNameWithNoTooltip('prague')]"
 boh_district_paving_decision.desc: "Mentre i confini urbani di [ShowLocationName('prague')] crescono, molte figure di spicco che fungono da capi dei vari distretti della città, come la Malá Strana, sono venute avanti a chiedere il diritto di tassare i cittadini che vivono all'interno dei loro confini.\n\nQuesta mossa trasferirebbe certamente molta influenza dalle mani del nostro tesoro a quelle dei [ShowEstateTypeName('nobles_estate')] e deve quindi essere esaminata con la massima cautela."
 boh_district_paving_decision.a: "Molto bene, concediamo loro la richiesta."

 boh_joint_assembly_decrees_decision.title: "Un'Assemblea Generale Congiunta"
 boh_joint_assembly_decrees_decision.desc: "Dalla nostra ascesa a capi del [GetUniqueInternationalOrganization('hre').GetName], abbiamo notato una netta differenza tra le procedure giudiziarie dell'Impero e le nostre. Il divario si amplia ancora di più con le differenze culturali e tradizionali mentre ci impegniamo a difendere e legittimare il nostro governo.\n\nNel tentativo di consolidare la nostra posizione e portare il nostro popolo più vicino all'Impero, molti consiglieri di [target_character.GetName] hanno suggerito un'assemblea generale congiunta. Essa presenterebbe membri dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e rappresentanti di tutti i principi imperiali insieme ai nostri, e permetterebbe la conferma di molte leggi romane esistenti relative ai loro privilegi."
 boh_joint_assembly_decrees_decision.desc.entry: "Governare il $hre$ e governare le nostre terre sono, in pratica, due lavori diversi con due insiemi di leggi diversi, e il divario tra essi diventa più scomodo ogni anno in cui deteniamo entrambe le corone. Un'assemblea congiunta che sieda i nostri $nobles_estate$ insieme ai principi imperiali confermerebbe le leggi romane che essi apprezzano, al costo di trattarli come qualcosa più vicino a dei pari."
 boh_joint_assembly_decrees_decision.a: "Un passo vitale e necessario per legittimare il nostro governo."
 every_elector_25_opinion_tt: "Ogni Elettore otterrà [ShowBiasValue('granted_joint_assembly_decrees_modifier')|+=0] di opinione su di noi"

 ven_doges_palace_decision.title: "Espandere il [ShowBuildingTypeNameWithNoTooltip('doges_palace')]"
 ven_doges_palace_decision.desc: "La costruzione del [ShowBuildingTypeName('doges_palace')] a [ShowLocationName('venice')] iniziò nel IX secolo e continuò nei secoli successivi. Originariamente concepito come un edificio simile a una fortezza, il palazzo si è evoluto nel tempo in una magnifica rappresentazione dell'architettura gotica. Questa meraviglia architettonica serve il duplice scopo di essere sia la residenza del [ROOT.GetCountry.GetGovernment.GetRulerTitle], il massimo leader politico del [GetCountry('VEN').GetLongNameWithNoTooltip], sia di ospitare vari uffici governativi e tribunali.\n\nCol tempo, tuttavia, l'edificio è visibilmente invecchiato e necessita di ristrutturazione. Forse dovremmo considerare di trasformarlo in un palazzo che farebbe impallidire persino le residenze reali dei sovrani occidentali."
 ven_doges_palace_decision.desc.entry: "Un palazzo iniziato come una fortezza nel IX secolo è diventato grandioso per caso più che per disegno, e si vede. Ricostruire il [ShowBuildingTypeName('doges_palace')] in qualcosa che superi in splendore le residenze dei sovrani occidentali costerebbe una fortuna che altrimenti spenderemmo in navi."
 ven_doges_palace_decision.a: "Buona idea!"
 ven_doges_palace_decision.historical_info: "Entro il XVI secolo, il Palazzo del Doge aveva subito sostanziali ristrutturazioni ed espansioni, risultando in un significativo aumento della sua grandiosità. Uno degli sviluppi più notevoli fu il completamento della sua iconica facciata, che si affacciava sul Canal Grande, mostrando a chiunque si avvicinasse per via d'acqua lo splendore architettonico del palazzo. Questo periodo di ristrutturazione ed espansione consolidò ulteriormente lo status del palazzo come duraturo simbolo del potere e dell'autorità veneziana. Le sue sale e camere, caratterizzate da disegni intricati e decorazioni sfarzose, non solo testimoniarono secoli di attività politiche, ma rappresentarono anche una duratura testimonianza della ricca storia della città e della sua continua importanza sulla scena globale."

 ven_piazza_san_marco_decision.title: "[ShowBuildingTypeNameWithNoTooltip('piazza_san_marco')]"
 ven_piazza_san_marco_decision.desc: "Il crescente potere e la ricchezza del nostro illustre [ROOT.GetCountry.GetFlavorRank] richiedono un investimento nello sviluppo della nostra capitale, assicurando che la nostra prosperità si rifletta visibilmente nella grandiosità di [ShowLocationName('venice')]. È stata avanzata una proposta per ristrutturare la piazza centrale, [ShowBuildingTypeName('piazza_san_marco')], trasformandola con magnifici archi e marmo per mostrare lo splendore del nostro impero marittimo. Tale ristrutturazione migliorerebbe la bellezza della nostra città e servirebbe da testimonianza del nostro duraturo potere e della nostra importanza culturale."
 ven_piazza_san_marco_decision.desc.entry: "Un impero marittimo che sembra povero in patria non sarà creduto ricco all'estero. Ricostruire la piazza davanti al palazzo di [ShowLocationName('venice')] in marmo e archi spende moneta su nulla che si possa mangiare, e compra una reputazione che apre porte che la sola moneta non può aprire."
 ven_piazza_san_marco_decision.a: "Finanzieremo la ristrutturazione."
 unlocked_piazza_san_marco_tt: "Abbiamo sbloccato il [building|e] $piazza_san_marco$ tramite una [decision|e] di contorno"
 ven_piazza_san_marco_decision.historical_info: "#italic Piazza San Marco#!, conosciuta anche come la Piazza di San Marco, è la principale piazza pubblica di Venezia, Italia, e uno dei monumenti più famosi della città. La piazza, sviluppata attorno al IX secolo e ampliata alla sua dimensione attuale nel XII secolo, è stata continuamente migliorata con nuove ristrutturazioni e nuovi monumenti. È circondata da edifici iconici, tra cui la Basilica di San Marco, il Palazzo del Doge e la Torre dell'Orologio di San Marco, e per secoli ha servito come luogo di ritrovo centrale a Venezia, ospitando attività politiche, religiose e sociali."

 ven_teatro_san_cassiano_decision.title: "[ShowBuildingTypeNameWithNoTooltip('teatro_san_cassiano')]"
 ven_teatro_san_cassiano_decision.desc: "[ShowLocationName('venice')], già un gioiello scintillante del panorama culturale di [ShowRegionName('italy_region')], è stata a lungo patria di una fervente comunità di artisti e artisti performativi. Per consolidare ulteriormente il suo status di centro di eccellenza artistica e per fornire un grande palcoscenico ai nostri talentuosi cittadini, c'è una crescente richiesta di costruire un magnifico teatro e teatro d'opera. Il proposto [ShowBuildingTypeName('teatro_san_cassiano')] sarebbe un faro di splendore e ricchezza, mostrando la brillantezza artistica di [ShowLocationNameWithNoTooltip('venice')] e attirando ammiratori da lontano e vicino."
 ven_teatro_san_cassiano_decision.desc.entry: "Una città già famosa per la sua arte non ha un luogo adatto dove mettere in scena il meglio di essa. Il proposto [ShowBuildingTypeName('teatro_san_cassiano')] darebbe a [ShowLocationName('venice')] un palcoscenico degno della sua reputazione, e darebbe a ogni porto rivale un motivo in più per invidiarci."
 ven_teatro_san_cassiano_decision.a: "Commissioniamo la sua costruzione!"
 unlocked_teatro_san_cassiano_tt: "Abbiamo sbloccato il [building|e] $teatro_san_cassiano$ tramite una [decision|e] di contorno"
 ven_teatro_san_cassiano_decision.historical_info: "Il Teatro San Cassiano, costruito a Venezia nel 1637, fu il primo teatro d'opera pubblico al mondo, segnando una pietra miliare significativa nella storia delle arti performative e consolidando il ruolo di Venezia come centro culturale di spicco."

 ven_walls_of_ston_decision.title: "Fortificare [ShowLocationNameWithNoTooltip('dubrovnik')]"
 ven_walls_of_ston_decision.desc: "[ShowLocationName('dubrovnik')] è un importante [target_location.GetRank.GetName] commerciale e uno dei beni più preziosi del nostro impero marittimo. Nonostante la sua importanza, la difesa di [ShowLocationNameWithNoTooltip('dubrovnik')] è piuttosto obsoleta, rendendola una facile preda per i nostri nemici che invadono sia da terra che da mare. Destinare oro alla modernizzazione delle mura esistenti e alla costruzione di una fortificazione adeguata per proteggerla non andrebbe certamente sprecato."
 ven_walls_of_ston_decision.desc.entry: "[ShowLocationName('dubrovnik')] ci fa guadagnare più in una buona stagione commerciale di quanto molte delle nostre provincie riescano a fare in un anno, e potrebbe essere presa da una banda di razziatori che non si preoccupa nemmeno di assediarla propriamente. Mura adeguate costano oro che preferiremmo spendere altrove, fino al giorno in cui la città cade senza di esse."
 ven_walls_of_ston_decision.a: "[ShowLocationNameWithNoTooltip('dubrovnik')] deve essere ben protetta."
 ven_walls_of_ston_decision.b: "Le sue fortificazioni attuali sono sufficientemente forti."
 ven_walls_of_ston_decision.historical_info: "Costruite nel XIV secolo, le Mura di Ston sono una serie di muri di pietra difensivi situati nella Penisola di Pelješac in Croazia. Queste mura servono a proteggere le preziose saline e la città di Ston. Estendendosi per circa 7 chilometri, le Mura di Ston sono tra le fortificazioni più lunghe d'Europa, rinomate per la loro impressionante lunghezza e importanza strategica nel periodo medievale."

 zan_husuni_kubwa_decision.title: "Il [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')]"
 zan_husuni_kubwa_decision.desc: "[GetCharacter('zan_abu_al_mawahib_al_hasan_ibn_suleiman').GetName] originariamente commissionò una residenza [ROOT.GetCountry.GetGovernment.GetAdjective] nel cuore di [target_location.GetName], destinata a essere il palazzo più impressionante. Tuttavia, sfortune, la ridistribuzione dei fondi e malattie personali hanno cercato tutte di ritardare e persino porre fine al progetto. Nonostante queste difficoltà, i nostri architetti hanno presentato un piano aggiornato per il palazzo, rafforzato con magazzini e camere appositamente costruite per gli scambi mercantili, accompagnate da una illustre sala del trono. Il loro unico ostacolo, in questo momento, è il denaro."
 zan_husuni_kubwa_decision.desc.entry: "Ogni sovrano prima di noi ha voluto questo palazzo finito e ogni sovrano prima di noi ha trovato un motivo per cui non poteva esserlo. Un nuovo piano per [ShowLocationName('kilwa_kisiwani')], con magazzini a sufficienza per far fronte al nostro commercio e una sala del trono degna di accogliere ospiti, attende solo il denaro che anche i precedenti tentativi mancavano."
 zan_husuni_kubwa_decision.a: "Commissioniamo la costruzione."
 zan_husuni_kubwa_decision.b: "È troppo costoso, per ora..."
 zan_husuni_kubwa_decision.historical_info: "Husuni Kubwa rappresenta una testimonianza dell'abilità architettonica e politica del Sultanato di Kilwa durante il suo apice nel XIV secolo. Costruito sotto il Sultano al-Ḥasan ibn Sulaymān a Kilwa Kisiwani, questo vasto complesso palaziale, che copre 1,6 ettari, fu costruito principalmente in pietra corallina e presentava una fusione di influenze architettoniche swahili, islamiche e persiane. Includeva lussuose camere private, grandi corti, sofisticati bagni e magazzini, evidenziando il suo ruolo multiforme come residenza reale, centro commerciale e fortificazione."
 construct_the_building_at_another_time_tt: "Potremmo scegliere di costruire il [ShowBuildingTypeNameWithNoTooltip('husuni_kubwa')] in un altro momento..."
 unlocked_husuni_kubwa_tt: "Abbiamo sbloccato il [building|e] $husuni_kubwa$ tramite un [event|e] di contorno"

 pap_quirinal_palace_decision.title: "Residenza Estiva dei Papi"
 pap_quirinal_palace_decision.desc: "Il [GetCountry('PAP').GetGovernment.GetRulerTitle] ha espresso interesse nello stabilire una residenza estiva lontana dalle strade affollate e trafficate del centro di [ShowLocationName('rome')]. Il Colle Quirinale, uno dei famosi Sette Colli di [ShowLocationNameWithNoTooltip('rome')], è visto come una posizione ideale, che offre una tranquilla fuga con brezze fresche e vedute panoramiche. Se procediamo, il rinomato architetto [fontana.GetName] potrebbe supervisionare il progetto e la costruzione del palazzo."
 pap_quirinal_palace_decision.desc.entry: "Il trambusto del centro di [ShowLocationName('rome')] è esattamente ciò che un Papa vuole evitare, e il Colle Quirinale offre la brezza e la vista senza la folla. $name_dominic$ $Fontana$ è l'architetto capace di costruirlo, a patto che la Santa Sede sia disposta a pagare per una seconda residenza di cui non ha strettamente bisogno."
 pap_quirinal_palace_decision.a: "Costruiamo la residenza estiva sul Colle Quirinale."
 pap_quirinal_palace_decision.b: "Non è il momento per progetti sfarzosi, dovremmo invece concentrarci sul migliorare le abilità dei nostri artisti."
 pap_quirinal_palace_decision.historical_info: "Il Palazzo del Quirinale fu commissionato nel 1583 da Papa Gregorio XIII come residenza estiva per il papato. Progettato con il contributo di architetti di spicco, tra cui Domenico Fontana, il palazzo offriva un rifugio dal calore e dalla folla del centro di Roma. Quando il neonato Regno d'Italia annesse gran parte di ciò che restava dello Stato Pontificio, il Palazzo del Quirinale divenne la sede dei re italiani."

 nav_camara_comptos_decision.title: "La Cámara de Comptos"
 nav_camara_comptos_decision.desc: "Le finanze di un regno sono una questione seria e il nostro [ROOT.GetCountry.GetGovernment.GetRuler.GetName] crede che il [ROOT.GetCountry.GetLongName] beneficerà enormemente se fondiamo un'istituzione permanente per gestire queste questioni.\n\nAttingendo ispirazione da istituzioni simili nel [GetCountry('FRA').GetLongName], renderemo la nostra nazione più economicamente sostenibile e capace di gestire meglio le possibili difficoltà finanziarie che la nostra delicata situazione può farci affrontare."
 nav_camara_comptos_decision.desc.entry: "Un tesoro gestito con l'improvvisazione funziona abbastanza bene negli anni buoni e fallisce malamente in quelli cattivi, e l'esempio di $FRA$ mostra che un'istituzione permanente va meglio di entrambi. Fondarne una nostra scambierebbe parte della discrezione personale del sovrano sulla borsa con un ufficio che sopravvive all'attenzione di qualsiasi singolo sovrano."
 nav_camara_comptos_decision.a: "Verrà istituita una corte permanente."
 nav_camara_comptos_decision.historical_info: "L'origine della Cámara de Comptos si può trovare negli #italic oidores#! (dal verbo #italic oir#!, 'sentire'), funzionari che amministravano e supervisionavano le finanze reali almeno dal 1258, quando può essere datato il primo Libro dei Comptos. Questa istituzione, profondamente influenzata da istituzioni francesi simili (come la #italic Chambre des Comptes#! di Parigi), fu rese permanente da Re Carlo II e portava il compito di controllare le spese del regno e consigliare i sovrani in materia finanziaria.\n\nÈ considerata la più antica Corte dei Conti di Spagna ed è ancora in uso, al servizio del Parlamento della Comunità Forale di Navarra."

 hun_bibliotheca_corviniana_decision.title: "[ShowBuildingTypeNameWithNoTooltip('bibliotheca_corviniana')]"
 hun_bibliotheca_corviniana_decision.desc: "Mentre il [ShowInstitutionName('renaissance')] si diffonde nel continente come un incendio, accendendo le fiamme della conoscenza e della rinascita culturale, il nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] è in fermento per le possibilità che esso porta. Studiosi, artisti e pensatori hanno iniziato a riunirsi nelle nostre città, ispirati dalla nuova ondata di idee che attraversa [ShowContinentName('europe')]. È stata avanzata una proposta - costruire una grande biblioteca a [ROOT.GetCountry.GetCapital.GetName] - una che attirerebbe studiosi da lontano e vicino, e farebbe di [GetCountry('HUN').GetName] un baluardo del [ShowInstitutionNameWithNoTooltip('renaissance')]. Finanziare un progetto così ambizioso, tuttavia, sarebbe piuttosto costoso. Dovremmo investire nella costruzione della [ShowBuildingTypeName('bibliotheca_corviniana')]?"
 hun_bibliotheca_corviniana_decision.desc.entry: "Ogni città che pretende di guidare il [ShowInstitutionName('renaissance')] ha già costruito qualcosa per dimostrarlo, e $HUN$ non lo ha fatto. Una grande biblioteca nella capitale attirerebbe gli studiosi che attualmente ci ignorano, a un costo che sembrerà più facile da giustificare con il senno di poi che non oggi."
 hun_bibliotheca_corviniana_decision.a: "Magnifico!"
 hun_bibliotheca_corviniana_decision.b: "Siamo meglio serviti migliorando le nostre istituzioni educative."
 unlocked_bibliotheca_corviniana_tt: "Abbiamo sbloccato il [building|e] $bibliotheca_corviniana$ tramite una [decision|e] di contorno"
 hun_bibliotheca_corviniana_decision.historical_info: "Matthias Corvinus, soprannominato il Re del Rinascimento, fu un grande mecenate delle arti e della scienza. Durante il suo regno, l'Ungheria divenne il primo paese fuori dall'Italia ad abbracciare il Rinascimento, e la Bibliotheca Corviniana divenne uno dei suoi maggiori contributi alla rinascita culturale in Ungheria. Servì come centro di scambio accademico e giocò un ruolo fondamentale nella diffusione della conoscenza in tutto il paese. Studiosi da tutto il continente furono attratti dalla biblioteca, contribuendo alla vivacità intellettuale del Rinascimento. Servì come simbolo del fervore intellettuale del Rinascimento in Ungheria e del potere del mecenatismo nel coltivare conoscenza e innovazione."

 mam_ablaq_palace_decision.title: "La Cittadella del [ShowLocationNameWithNoTooltip('cairo')]"
 mam_ablaq_palace_decision.desc: "Un centro di conoscenza, illuminazione e abbondante commercio tra le profondità dell'[ShowContinentName('africa')] e il Mediterraneo, [target_location.GetName] è il cuore pulsante del nostro crescente [ROOT.GetCountry.GetFlavorRank]. La cittadella ha servito generazioni dei sovrani più illustri e prestigiosi. Il nostro attuale [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] è stato recentemente presentato con ambiziosi piani per espandere i vari aspetti di essa che coinvolgerebbero una nuova moschea-madrasa, una sala delle udienze ampliata, così come un centro per produrre il Kiswa."
 mam_ablaq_palace_decision.desc.entry: "Una cittadella che ha ospitato generazioni di sovrani può ancora essere fatta sembrare come se ospitasse solo i più grandi tra loro. Espanderla con una nuova moschea-madrasa, una sala delle udienze più grandiosa e un laboratorio per il Kiswa direbbe tanto sul nostro regno quanto qualsiasi campagna, per considerevolmente meno sangue."
 mam_ablaq_palace_decision.a: "Molto bene."
 mam_ablaq_palace_decision.b: "Saremo frugali, invece."
 unlocked_ablaq_palace_tt: "Abbiamo sbloccato questo [building|e] tramite la [decision|e] '$mam_ablaq_palace_decision.title$'"

 son_trans_saharan_decision.title: "Fioritura del Commercio Trans-Sahariano"
 son_trans_saharan_decision.desc: "Il Commercio Trans-Sahariano ha raggiunto nuovi livelli da quando abbiamo dominato le rotte. Invece di restare inattivi, possiamo cercare di espandere i nostri avamposti nelle destinazioni dove arrivano le nostre carovane. [ShowLocationName('alexandria')], [ShowLocationName('tunis')] e [ShowLocationName('fez')] in particolare, sono le principali destinazioni che dovrebbero essere aiutate."
 son_trans_saharan_decision.a: "Lasciamo fiorire queste tappe delle carovane."
 son_trans_saharan_decision.b: "Invece delle località, rafforziamo l'intero commercio."
 son_trans_saharan_decision.c: "Investire denaro in questo non ne vale la pena."
 son_unlock_unique_buildings_in_alexandria_tunis_and_fez_tt: "Sblocca la costruzione di [ShowBuildingTypeName('trans_saharan_trade_outposts')] a [ShowLocationName('fez')], [ShowLocationName('tunis')] e [ShowLocationName('alexandria')]"

 son_conversion_west_africa_decision.title: "Convertire le Nazioni [ShowReligionGroupAdjectiveWithNoTooltip('folk_african_group')]"
 son_conversion_west_africa_decision.desc: "Sebbene siamo la potenza più forte in [ShowRegionName('guinea_region')], ci sono ancora nazioni che non seguono l'[ShowReligionGroupName('muslim')]. Mentre potremmo usare la forza per convertirle, [target_character.GetName] vuole seguire una strategia più pacifica. [target_character.GetSheHe|U] desidera usare la diplomazia per diffondere l'[ShowReligionGroupNameWithNoTooltip('muslim')] piuttosto che usare la spada per suscitare ulteriori disordini."
 son_conversion_west_africa_decision.desc.entry: "La spada non convertirà nessuno che sopravviva alla conversione, zittisce solo coloro che avrebbero potuto discutere. Il sovrano preferirebbe inviare missionari in [ShowRegionName('guinea_region')] piuttosto che soldati, scambiando una diffusione più lenta della fede con una che non lascia un villaggio in fiamme al suo passaggio."
 son_conversion_west_africa_decision.a: "Sembra una buona idea."
 son_conversion_west_africa_decision.b: "Usare la forza è l'opzione migliore."
 son_unlock_diplo_action_to_demand_conversion_tt: "Sbloccheremo la [country_interaction|E] [ShowCountryInteractionName('demand_conversion_to_islam')] contro gli infedeli di [ShowRegionName('guinea_region')]"

 ori_elephant_hunting_grounds_decision.title: "La Caccia agli [ShowGoodsNameWithNoTooltip('elephants')]"
 ori_elephant_hunting_grounds_decision.desc: "Con un surplus di [ShowGoodsName('elephants')] in [ROOT.GetCountry.GetName], sono nate discussioni sull'aumentare il numero di reggimenti che utilizzano queste maestose bestie. Tuttavia, i nostri attuali [ShowBuildingTypeName('elephant_hunting_grounds')] mancano delle risorse necessarie per espandere propriamente le loro operazioni di caccia e fornire equipaggiamento adeguato. Potrebbe essere il momento di fornire loro il supporto di cui hanno bisogno. [target_character.GetName] e il [ROOT.GetCountry.GetGovernment.GetCourtTitle], in particolare, sono persino disposti ad allocare parte dei propri fondi per realizzare ciò."
 ori_elephant_hunting_grounds_decision.desc.entry: "Un elefante vale poco per l'esercito finché qualcuno non lo ha catturato, addestrato ed equipaggiato, e i nostri [ShowBuildingTypeName('elephant_hunting_grounds')] attualmente gestiscono a malapena ciò. La corte è pronta a spendere il proprio denaro per l'espansione, il che rende la scelta meno una questione di denaro che una questione se più elefanti da guerra si adattino alle nostre ambizioni attuali."
 ori_elephant_hunting_grounds_decision.a: "Sosteniamo queste cacce."
 ori_elephant_hunting_grounds_decision.b: "Non c'è bisogno di sprecare denaro per questo."
 ori_double_elephant_hunting_ground_level_tt: "Il livello massimo del [building|e] [ShowBuildingTypeName('elephant_hunting_grounds')] verrà aumentato di #G +2#!"
 INCREASED_MAX_LEVEL_ELEPHANT_HUNTING_GROUND: "Livello Massimo Aumentato dagli [events|e]"

 jap_rangaku_decision.title: "Rangaku"
 jap_rangaku_decision.desc: "I mercanti [target_country.GetAdjective] sono ormai presenti sull'Isola di Dejima a [target_location.GetName] da qualche tempo, e il contatto tra il nostro popolo e l'enclave è stato strettamente controllato. Tuttavia, le nostre due culture non possono fare a meno di scorgere qualche scorcio dell'altra. Il popolo [target_country.GetAdjectiveWithNoTooltip] sembra conoscere cose che noi non conosciamo, in particolare in medicina, ma anche in scienza, produzione e ingegneria meccanica. Alcuni dei nostri cittadini più ricchi si sono persino rivolti al chirurgo [target_country.GetAdjectiveWithNoTooltip] nell'enclave, piuttosto che affidarsi ai medici locali.\n\nÈ chiaro che c'è molto che si potrebbe imparare da un'interazione maggiore con questi visitatori dall'Occidente, se siamo disposti a rischiare di aprire un po' di più le nostre provincie a loro."
 jap_rangaku_decision.desc.entry: "Un avamposto commerciale strettamente controllato lascia comunque trapelare un po' di conoscenza attraverso le mura destinate a contenerla, e l'enclave $NED_ADJ$ ha fatto trapelare medicina, meccanica e scienza per anni. Allentare la nostra vigilanza ne lascerebbe entrare di più, al costo dell'isolamento che quella vigilanza era costruita per preservare."
 jap_rangaku_decision.a: "Apriamo le nostre provincie alla conoscenza [target_country.GetAdjectiveWithNoTooltip]."
 jap_rangaku_decision.a.entry: "Apriamo le nostre provincie alla conoscenza $NED_ADJ$."
 jap_rangaku_decision.a.tt: "Sblocca la [government_reform|e] [ShowGovernmentReformName('jap_rangaku')]"
 jap_rangaku_decision.b: "Manteniamo le nostre provincie chiuse."

 mch_mandarin_language_reforms_decision.title: "Adottare il Vecchio Regime"
 mch_mandarin_language_reforms_decision.desc: "Non siamo che un'altra linea nella stirpe degli imperatori divini di $china$. Le varie dinastie prima di noi hanno già istituito burocrazie efficienti in grado di tenere unito il vasto [GetInternationalOrganization('middle_kingdom').GetName]. Perché non dovremmo adottare quelle politiche? Tale azione ci renderebbe più [ShowSocietyDirectionName('sinicized')], ma preserverebbe anche la continuità e rafforzerebbe la nostra autorità agli occhi del popolo."
 mch_mandarin_language_reforms_decision.a: "Adotteremo quelle istituzioni."
 mch_mandarin_language_reforms_decision.b: "Favoriamo i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 mch_mandarin_language_reforms_decision.b.entry: "Favoriamo i $tribes_estate$."
 unlock_chinese_language_reforms: "Questo bloccherà la [government_reform|e] [ShowGovernmentReformName('three_departments_system')]."
 MCH_conditional_benefit: "Se non abbracciamo la [government_reform|e] [ShowGovernmentReformName('three_departments_system')], [ShowEstatePrivilegeName('mch_tribal_favor')] darà benefici aggiuntivi."

 pru_unified_legal_system_decision.title: "Una Riforma della Legge"
 pru_unified_legal_system_decision.desc: "Uno stato come il nostro deve essere sempre adattabile ai cambiamenti. Ora un promettente candidato sta salendo di rango nel nostro sistema legale, che potrebbe guidare le riforme disperatamente necessarie del nostro sistema legale. Questo [target_character.GetName] ha lavorato come presidente della #italic Kammergericht#! e ha redatto piani per riformare il sistema legale in tutto [ROOT.GetCountry.GetName]. Se sosteniamo i suoi sforzi, ciò potrebbe portare a una rapida e radicale riforma del nostro paese."
 pru_unified_legal_system_decision.desc.entry: "Un sistema legale ereditato da una dozzina di epoche diverse non serve nessuno particolarmente bene, il che è solitamente motivo sufficiente perché sopravviva un'altra generazione senza riforme. Il presidente della #italic Kammergericht#! ha redatto i piani per cambiare ciò, e sostenerlo ci impegna a una riforma di cui non abbiamo ancora visto la forma completa."
 pru_unified_legal_system_decision.a: "Sosteniamo le sue riforme!"
 pru_unified_legal_system_decision.a_tt: "Il [character|e] che propone la riforma apparirà nella nostra [court|e]"
 pru_unified_legal_system_decision.a.tt: "Il Progresso della Riforma sarà significativamente più rapido"
 pru_unified_legal_system_decision.b: "Frenare le sue ambizioni."
 pru_unified_legal_system_decision.b.tt: "Il Progresso della Riforma sarà significativamente più lento"

 boh_bohemian_commonwealth_decision.title: "Istituzione di un Commonwealth"
 boh_bohemian_commonwealth_decision.desc: "Il nostro percorso nella storia ha visto [ROOT.GetCountry.GetName] salire da potenza minore a vette imperiali - diventando una grande potenza sulla scena globale, governando vaste regioni e numerose nazioni. Governare una tale nazione, tuttavia, richiede una mano ferma. Con timori di separatismo e tensione tra le nazionalità del [ROOT.GetCountry.GetFlavorRank], alcuni suggeriscono di adottare una nuova costituzione. Essi affermano che bisogna guardare oltre ciò che è stato tradizionalmente considerato [ROOT.GetCountry.GetNameWithNoTooltip] per stabilire un commonwealth più ampio. Il nostro impero si estenderà su vaste regioni di [ShowContinentName('europe')], e prenderemo il nostro posto tra le grandi potenze del mondo."
 boh_bohemian_commonwealth_decision.desc.entry: "Un impero sorto da un piccolo regno non lo ha fatto trattando le sue molte nazioni come una sola, e tenerle unite ora potrebbe richiedere di ammettere finalmente che non lo sono. Un nuovo commonwealth, più ampio di ciò che tradizionalmente era nostro, rischia la stessa identità che ha costruito l'impero per impedire che l'impero si spezzi lungo le sue cuciture."
 boh_bohemian_commonwealth_decision.a: "Adottiamo una nuova costituzione."

 ned_unified_dutch_admiralties_decision.title: "Istituzione delle Cinque Ammiragliati"
 ned_unified_dutch_admiralties_decision.desc: "Le nostre terre possono essere governate da [target_character.GetName], ma le differenze tra le nostre provincie hanno diviso il nostro [ShowBuildingTypeName('admiralty')]. Questo fazionalismo tra [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] e [ShowLocationName('amsterdam')] ci impedisce di unificare le nostre marine. Tuttavia, permettere loro di seguire il proprio interesse potrebbe permettere un maggiore impegno da parte di ciascuno di essi."
 ned_unified_dutch_admiralties_decision.desc.entry: "Cinque ammiragliati che rispondono a cinque porti sono cinque marine che competono per le stesse navi. Unificare [ShowLocationName('groningen')], [ShowLocationName('hoorn')], [ShowLocationName('rotterdam')], [ShowLocationName('middelburg')] e [ShowLocationName('amsterdam')] sotto un unico comando porrebbe fine alla rivalità, sebbene lasciare che ciascuno segua il proprio interesse un po' più a lungo potrebbe in realtà raccogliere più da tutti e cinque di quanto non farebbe mai forzare la fusione."
 ned_unified_dutch_admiralties_decision.a: "Lasciamo che questi ammiragliati esistano per proprio conto."
 ned_unified_dutch_admiralties_decision.b: "Uniamoli in uno solo."
 NED_UNLOCKS_UNIFIED_ADMIRALTIES_GOV_REFORM: "Sblocca la [government_reform|e] [ShowGovernmentReformName('unified_admiralty_reform')]."
 ned_unified_dutch_admiralties_decision.historical_info: "Durante la Rivolta Olandese contro gli Asburgo, il popolo olandese creò una confederazione in cui ogni provincia poteva mantenere i propri interessi. Questa confederazione, tuttavia, era ancora affetta da fazionalismo, poiché gli Statisti e gli Orangisti lottavano per il controllo delle numerose provincie. Fu solo con l'Era Napoleonica e la Repubblica Batava che questo intero sistema venne abolito, portando al Regno dei Paesi Bassi come lo conosciamo."

 hol_ned_seven_provinces_decision.title: "Le Sette Provincie"
 hol_ned_seven_provinces_decision.desc: "Sebbene i Paesi Bassi si siano unificati per una causa comune, sono ancora divisi grazie a pretese de jure e differenze culturali. Tuttavia, possiamo usare questa disunità a nostro vantaggio. Creando una confederazione in cui ogni provincia ha le proprie leggi e diritti, mentre obbedisce ancora al governo centrale, possiamo assicurarci propriamente che ciascuna di esse sia protetta e possa prosperare per proprio conto, permettendoci di guardare verso l'esterno."
 hol_ned_seven_provinces_decision.a: "Creiamo questa confederazione."
 hol_ned_seven_provinces_decision.b: "La decentralizzazione non è la soluzione."

 swe_age_of_freedom_decision.title: "Riconsiderare l'Assolutismo"
 swe_age_of_freedom_decision.desc: "[ROOT.GetCountry.GetName|U] è sull'orlo del collasso. L'attuale [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle] ha tanti detrattori quanti sostenitori, con gruppi che spuntano ogni giorno per sostenere pretendenti rivali. C'è stata così tanta interferenza straniera nel governo [ROOT.GetCountry.GetAdjectiveWithNoTooltip] che ci sentiamo più uno stato fantoccio che una grande nazione, e persone di tutte le classi risentono apertamente il peso schiacciante del governo assoluto.\n\nMantenere il controllo totale potrebbe rivelarsi un errore fatale da parte del [ROOT.GetCountry.GetGovernment.GetActiveRegentTitle]. Dobbiamo prepararci a un'opposizione violenta a qualunque scelta facciamo."
 swe_age_of_freedom_decision.desc.entry: "Un reggente con rivali in ogni angolo del regno non sta davvero governando, sta solo arbitrando, e le corti straniere hanno notato la differenza con la stessa chiarezza dei nostri stessi soggetti. Attenersi al governo assoluto ora rischia una lotta di cui nessuno di noi può essere certo di vincere, in qualunque modo scegliamo di risponderle."
 swe_age_of_freedom_decision.a: "Abbandoniamo l'assolutismo."
 swe_age_of_freedom_decision.b: "Teniamo salde le redini..."
 swe_age_of_freedom_always: "Questa è una riforma bloccata che non può essere rimossa per scelta."
 swe_age_of_freedom_decision.historical_info: "La morte del senza figli Carlo XII lasciò la sorella minore Ulrika Eleonora al comando come Regina. Il convinto parlamentarista, Cancelliere Arvid Horn, colse immediatamente questa opportunità per abbattere l'assolutismo e rafforzare i poteri del Parlamento. Sebbene le sue inclinazioni democratiche fossero in un certo senso lodevoli, le sue azioni avrebbero completamente destabilizzato la Svezia e l'avrebbero fatta diventare un fantoccio di interessi stranieri per i successivi 50 anni. Questa cosiddetta 'Età della Libertà' vide anche l'aristocrazia riconquistare parte del terreno perduto. Tuttavia, la giovane regina non vide alcuna alternativa chiara che non avrebbe turbato troppo il suo popolo stanco della guerra."

 iro_iroquois_interactions_decision.title: "Eredità del Grande Pacificatore"
 iro_iroquois_interactions_decision.desc: "Un tempo un popolo diviso, la Confederazione [ShowCultureGroupName('haudenosaunee_group')] si unì attraverso le opere del Grande Pacificatore, Deganawida, che unì le tribù una volta rivali in un'unione familiare. Mentre nel tempo trascorso dalla fondazione della confederazione le tribù degli [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] sono rimaste unite e hanno coesistito, alcune voci hanno iniziato a crescere secondo cui dovrebbe emergere una tribù dominante per servire da leader principale. Tuttavia, un tale traguardo rischierebbe di compromettere gli stessi principi fondanti su cui Deganawida fondò la Confederazione degli [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')]."
 iro_iroquois_interactions_decision.a: "I tempi stanno cambiando."
 may_unify_haudenosaunee_confederation: "Sblocca le interazioni [ShowCountryInteractionName('form_closer_bond_iroquois')] e [ShowCountryInteractionName('merge_tribe_iroquois')] contro le nazioni confratelli degli [ShowCultureGroupName('haudenosaunee_group')]. Unire i territori degli [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] ci permetterà di riformarci in una Confederazione degli [ShowCultureGroupNameWithNoTooltip('haudenosaunee_group')] unita."