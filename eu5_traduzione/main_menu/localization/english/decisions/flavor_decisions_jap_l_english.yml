l_english:
 jap_adopt_japan_identity_decision.title: "Assumere il Nome di $JAP$"
 jap_adopt_japan_identity_decision.desc: "I clan si sono combattuti fino allo stallo, e una casata si è innalzata sopra tutte le altre. Eppure il mondo ci conosce ancora con il nome di quella casata, anziché con quello della terra che ora governiamo.\n\nAssumiamo il nome di $JAP$, affinché ogni corte e ogni provincia sappia che il reame è uno solo, ed è nostro."
 jap_adopt_japan_identity_decision.a: "Noi siamo $JAP$."
 jap_adopt_japan_identity_decision.not_yamato_tt: "La nostra nazione non è stata formata tramite [GetCountry('YMT').Custom('IT_La')][GetCountry('YMT').GetName]"
 jap_adopt_japan_identity_decision.color_tt: "Adottiamo il #Y Rosso#! come colore del nostro paese"
 jap_adopt_japan_identity_decision.historical_info: "Nel 1603 Tokugawa Ieyasu pose fine a più di un secolo di guerre civili e assunse il titolo di shōgun, governando un Giappone unificato da Edo. Prima di lui, Oda Nobunaga e Toyotomi Hideyoshi avevano spezzato il potere dei signori della guerra rivali. I mercanti e gli inviati europei dell'epoca consideravano generalmente lo shōgun come il sovrano di tutto il Giappone."
