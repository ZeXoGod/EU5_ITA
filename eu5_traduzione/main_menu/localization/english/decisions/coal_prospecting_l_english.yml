l_english:
 prospect_for_coal.title: "Esplora per il Carbone"
 prospect_for_coal.desc: "L'era del vapore e del ferro corre sul carbone, e il nostro stesso suolo potrebbe custodire ciò di cui la nostra industria ha così disperatamente bisogno. Spendiamo il capitale politico per inviare squadre di geologi e ingegneri minerari nelle nostre terre carbonifere, per rilevare il terreno, scavare pozzi di prova lungo i filoni promettenti, e aprire una nuova miniera dove la terra cede il raccolto più ricco. I rilevatori inizieranno dai nostri possedimenti rurali meno produttivi, dove poco si perde a cedere i campi alle miniere, e il nuovo lavoro inizierà in piccolo prima di crescere per alimentare le nostre fornaci."
 prospect_for_coal.a: "Commissiona i rilevamenti."
 prospect_for_coal_effect_tt: "[coal_prospect_location.GetName] produrrà ora [ShowGoodsName('coal')], invece di [coal_prospect_location.GetRawMaterial.GetName]"
 prospect_for_coal.historical_info: "I grandi bacini carboniferi della Ruhr, dell'Alta Slesia, e del Galles del Sud alimentarono la Rivoluzione Industriale, e la ricerca sistematica del carbone trasformò tranquilli distretti rurali in alcune delle regioni industriali più dense della terra. Il rilevamento geologico maturò in una disciplina professionale alla fine del XVIII secolo e all'inizio del XIX, mentre stati e imprenditori si contendevano la localizzazione del combustibile da cui dipendeva la nuova era delle macchine."
