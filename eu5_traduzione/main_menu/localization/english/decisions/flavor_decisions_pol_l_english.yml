l_english:
 pol_shooting_societies_decision.title: "Le Società di Tiro"
 pol_shooting_societies_decision.desc: "La vita è spesso piena di pericoli e invasori stranieri che desiderano usurpare le nostre prosperose terre. Per perseguire lo sforzo defensivo della propria casa, molti membri dei [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno iniziato a fondare una società di tiro a [ShowLocationName('krakow')], mirata a mantenere la prosperità e a far crescere un corpo capace di miliziani tiratori scelti.\n\nMentre il nostro dominio e il nostro popolo si espandono, nuovi borghi e città cercano di stabilire le proprie società di tiro e così molti dei loro rappresentanti hanno iniziato a richiedere formalmente il sostegno ufficiale per la fondazione di tali società in ogni borgo e città."
 pol_shooting_societies_decision.desc.entry: "I cittadini che si addestrano con la propria polvere e i propri proiettili non costano nulla al tesoro, eppure si presentano comunque quando viene chiamata la leva. Ciò che è iniziato come una società a [ShowLocationName('krakow')] potrebbe diventare una carta concessa a ogni borgo disposto a finanziarne una, a condizione che ai $burghers_estate$ venga affidata la fiducia delle armi."
 pol_shooting_societies_decision.a: "Sparare ai galli non è uno scherzo da pollaio, richiede precisione e abilità!"
 pol_shooting_societies_decision.b: "Quella fondata a [ShowLocationNameWithNoTooltip('krakow')] sarà sufficiente."
 pol_shooting_societies_decision.historical_info: "Conosciuta come la Società del Gallo, l'origine del nome all'interno della Confraternita risale alle loro prime gare di tiro. Inizialmente, utilizzavano galline e galli vivi come bersagli, evolvendo col tempo in figure di gallo in legno conosciute come #italic kurs#!. Questa transizione portò alla formazione del nome originale, #italic Confraternita di Kur#!, poiché #italic kur#! denota #italic gallo#! nel polacco colloquiale.\n\nCon l'avvento delle armi da fuoco, la somiglianza tra il martelletto di scatto e la testa di un gallo divenne evidente. Mentre i tiratori si preparavano a sparare tirando indietro il martelletto, l'azione in inglese veniva descritta come 'cocking' dell'arma — dove #italic cock#! significa anche 'gallo' — rafforzando l'associazione con il soprannome del gallo."

 pol_privilege_of_koszyce_decision.title: "Privilegio di Koszyce"
 pol_privilege_of_koszyce_decision.desc: "[ruler_scope.GetName] si è rivolto ai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] per chiedere che, in caso di morte senza progenie maschile, una figlia possa succedere al trono. Per i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], questa è un'ampia opportunità per ricevere ulteriori privilegi dal [ROOT.GetCountry.GetGovernment.GetRulerTitle], qualcosa su cui tutti loro possono concordare. Con un tale privilegio, le tasse pagate dai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] verrebbero diminuite e ulteriori tasse non verrebbero stabilite senza il loro consenso. Inoltre, ogni futuro [ROOT.GetCountry.GetGovernment.GetRulerTitle] dovrebbe pagare per i costi della propria visita, certamente umiliante per il [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]."
 pol_privilege_of_koszyce_decision.desc.entry: "Un trono passato a una figlia necessita di consenso, e il consenso in questo regno ha un prezziario. I $nobles_estate$ lo stabiliranno in moneta ed esenzioni, e ogni concessione garantita ora diventa un precedente che nessun futuro $crown_estate$ potrà revocare."
 pol_privilege_of_koszyce_decision.a: "Porteremo a termine."
 POL_may_form_union_with_lit_at_later_date: "Con il [ShowEstatePrivilegeName('privilege_of_koszyce')] promulgato, [ROOT.GetCountry.GetName] potrà formare un'Unione con [GetCountry('LIT').GetName] tramite l'evento $flavor_pol.55.title$."
 pol_privilege_of_koszyce_decision.historical_info: "Il Privilegio di Koszyce fu concesso alla Szlachta da Luigi I, un monarca che governava sia l'Ungheria che la Polonia in un'Unione Personale. Grazie a questo privilegio, la successione di una delle sue figlie fu assicurata, ma al costo di numerosi privilegi alla nobiltà, mettendo la Polonia sulla via per diventare una 'Democrazia Nobiliare' in futuro. La successione di sua figlia, Jadwiga, portò al successivo matrimonio con il Granduca lituano Jogaila, conducendo a un'Unione Personale tra Polonia e Lituania e alla formazione del Commonwealth più avanti."

 pol_nihil_novi_decision.title: "Nihil Novi"
 pol_nihil_novi_decision.desc: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno presentato una proposta a dir poco ridicola a un recente [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. Le loro illusioni di adeguatezza [ROOT.GetCountry.GetGovernment.GetAdjective] li fanno credere che meritino il diritto di non avere leggi fatte su di loro senza il loro consenso. Assurdo! Eppure, senza il loro sostegno, non saremo in condizione di finanziare le nostre ulteriori campagne. Dobbiamo quindi considerare la loro proposta, per quanto assurda possa sembrare. Inoltre, desiderano limitare i diritti della popolazione cittadina e vietare la libertà di movimento ai loro servi della gleba. Potremmo essere costretti ad accettare la petizione dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 pol_nihil_novi_decision.desc.entry: "C'è una petizione dinanzi al nostro parlamento che lascerebbe i $nobles_estate$ non soggetti a nessuna legge che non abbiano essi stessi approvato, mentre nello stesso momento la popolazione cittadina e i servi della gleba vengono vincolati più strettamente. È un insulto travestito da richiesta, e rifiutarla significa trovare un altro modo per pagare le nostre guerre."
 pol_nihil_novi_decision.a: "Lasciamo che abbiano i loro piccoli diritti."
 pol_nihil_novi_decision.b: "Teniamolo a mente per dopo."
 pol_nihil_novi_decision.b_tt: "Potremo selezionare il $nihil_novi$ in un momento successivo"
 pol_nihil_novi_decision.historical_info: "#italic Nihil novi nisi commune consensu#! è il nome di una costituzione del 1505 della Sejm polacca che stabiliva che nessuna nuova legge sarebbe stata istituita senza il consenso comune della nobiltà. È considerata l'inizio della Democrazia Nobiliare in Polonia e fu una delle pietre miliari per la successiva #italic Libertà Dorata#!."

 pol_rule_of_the_sejm_decision.title: "Monarchia Elettiva in Polonia"
 pol_rule_of_the_sejm_decision.desc: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], confidenti nei propri privilegi, hanno iniziato a richiamare le loro antiche pretese. Citando precedenti storici, sempre più membri dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] affermano il loro diritto inalienabile di scegliere i successori al [ROOT.GetCountry.GetFlavorRank]. E sebbene vorremmo opporci a pretese così assurde, non possiamo fare a meno di notare la crescente autorità dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] a spese del [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')]. Sfortunatamente, che ci piaccia o no, dovremo professare fiducia in loro per l'elezione dei futuri monarchi."
 pol_rule_of_the_sejm_decision.desc.entry: "Chi sceglie il monarca detiene la monarchia. I $nobles_estate$ sono diventati abbastanza forti da affermarlo ad alta voce, e la $crown_estate$ non è più abbastanza forte da rispondere."
 pol_rule_of_the_sejm_decision.a: "Ci fideremo della Sejm!"
 pol_rule_of_the_sejm_decision.historical_info: "Con una moltitudine di privilegi nel XIV e XV secolo, il diritto di eleggere il sovrano della Polonia fu esteso ai nobili polacchi. Inizialmente, i vari eredi Jagelloni non furono contestati nella loro successione, e come tali le elezioni furono una mera formalità. Ciò sarebbe cambiato con la fine della Dinastia Jagellona, innescando la prima elezione in cui la Szlachta dovette scegliere tra vari nobili stranieri. Le vere elezioni regie iniziarono nel 1573 con l'elezione di Enrico di Valois, e i monarchi successivi sarebbero stati eletti tra candidati stranieri fino alla fine del Commonwealth nel XVIII secolo."
