l_english:
 ara_coronate_ruler.title: "$flavor_ara.22.title$"
 ara_coronate_ruler.title.entry: "$flavor_ara.22.entry$"
 ara_coronate_ruler.desc: "[target_character.GetName] è salito al trono, e sia [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] che [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] si sono riuniti per assistere all'incoronazione nella prestigiosa sede di [ShowLocationName('zaragoza')], dove il [ROOT.GetCountry.GetGovernment.GetRulerTitle] si impegnerà a rispettare le leggi del [ROOT.GetCountry.GetFlavorRank], le libertà del popolo, e i privilegi dei ceti."
 ara_coronate_ruler.desc.entry: "Un nuovo sovrano che sale al trono non sarà in grado di assicurarsi adeguatamente la lealtà dei [ShowEstateTypeName('nobles_estate')] e dei [ShowEstateTypeName('peasants_estate')] a meno che non venga condotta l'appropriata cerimonia d'incoronazione. Un monarca non incoronato è un monarca non riconosciuto."
 ara_coronate_ruler.a: "$flavor_ara.23.a$"
 ara_coronate_ruler.b: "Aboliamo questa tradizione."