l_english:
 ach_greek_populace_decision.title: "Pacificare l'Élite [ShowCultureNameWithNoTooltip('greek_culture')]"
 ach_greek_populace_decision.desc: "Sebbene il governo [GetCountry('LAT').GetAdjective] su [ShowScriptedGeographyName('greece_geography')] abbia visto un declino della vecchia élite [ShowCultureName('greek_culture')], in alcune aree del paese, membri delle più antiche famiglie [ShowCultureNameWithNoTooltip('greek_culture')] hanno mantenuto una presa sul potere scendendo a compromessi con i [GetEstateName('nobles_estate')] latini. Tuttavia, dalla caduta del [GetCountry('LAT').GetLongNameWithNoTooltip], i membri della popolazione [ShowCultureNameWithNoTooltip('greek_culture')] sono diventati più resistenti al governo latino.\n\nCercando un regno più stabile, il monarca ha invitato a corte i membri delle rimanenti famiglie [ShowCultureNameWithNoTooltip('greek_culture')] nel paese per trovare un compromesso. Tuttavia, alcuni [GetEstateNameWithNoTooltip('nobles_estate')] latini hanno invece spinto per un'ulteriore espansione dei loro diritti sulla popolazione [ShowCultureNameWithNoTooltip('greek_culture')], sostenendo che un'élite latina più forte reprimerebbe i disordini [ShowCultureNameWithNoTooltip('greek_culture')]."
 ach_greek_populace_decision.desc.entry: "Due élite condividono ora queste terre a disagio, e nessuna accetterà i termini dell'altra senza qualcosa in cambio. Corteggiare le famiglie [ShowCultureName('greek_culture')] compra la quiete tra la popolazione, mentre indulgere i $nobles_estate$ latini compra la lealtà di chi già detiene le spade."
 ach_greek_populace_decision.a: "Manteniamo l'attuale status quo."
 ach_greek_populace_decision.b: "Schieriamoci con i [GetEstateNameWithNoTooltip('nobles_estate')] latini."
 ach_greek_populace_decision.b.entry: "Schieriamoci con i $nobles_estate$ latini."
 ach_greek_populace_decision.c: "Ricerchiamo un compromesso con le famiglie [ShowCultureNameWithNoTooltip('greek_culture')]."

 ach_pope_proposes_latin_restoration.title: "Raccogliere il Sostegno Papale per Restaurare l'Impero Latino"
 ach_pope_proposes_latin_restoration.desc: "Avendo preso nota delle nostre campagne in [ShowScriptedGeographyName('greece_geography')], la nostra crescente forza ha attirato l'attenzione del Papato.\n\nRiconoscendo la nostra pretesa di [ShowGovernmentReformName('ach_heirs_of_the_latin_empire')], il Papa ha offerto il sostegno finanziario e politico di [GetCountry('PAP').GetNameWithNoTooltip] qualora accettassimo di aiutare gli sforzi del Papa per sanare le relazioni tra le Chiese [ShowReligionAdjective('catholic')] e [ShowReligionAdjective('orthodox')].\n\nIl Papa ha anche esortato che, qualora [ShowLocationName('constantinople')] venga riconquistata, la tragedia che la Quarta Crociata portò su [ShowLocationNameWithNoTooltip('constantinople')] non debba ripetersi."
 ach_pope_proposes_latin_restoration.desc.entry: "Il [ShowFormableCountryName('LAT_f')] fu di breve durata, ma la nostra pretesa su di esso resta valida. In cambio del sostegno $PAP_ADJ$, risponderemmo stabilendo un vero Impero [ShowReligionAdjective('catholic')] in Oriente, con [ShowLocationName('constantinople')] come sua capitale e più duraturo dell'ultimo."
 ach_pope_proposes_latin_restoration.a: "Accettiamo le richieste dell'emissario $PAP_ADJ$ in cambio del loro sostegno."
 ach_pope_proposes_latin_restoration.b: "Non abbiamo bisogno del sostegno del Papa per riprendere [ShowLocationNameWithNoTooltip('constantinople')]."
 lat_aggressive_conversion_policies_tt: "Il Papa potrebbe richiedere che adottiamo politiche di conversione severe qualora stabilissimo il [GetCountry('LAT').GetLongName], in cambio di ottenere il suo sostegno"

 lat_frankokratia_pope_proposes_latin_restoration.title: "Richiedere il Sostegno Papale per Restaurare l'Impero Latino"
 lat_frankokratia_pope_proposes_latin_restoration.desc: "La crescente influenza del nostro paese in [ShowScriptedGeographyName('greece_geography')] ci ha portato a diventare una potenza di rilievo nella regione, della quale il Papa ha preso nota della crescente potenza. Con il declino dell'influenza di [GetCountry('BYZ').GetName], il Papa ci vede ora come il principale contendente a cui il [GetCountry('LAT').GetLongName] può essere restaurato in [ShowLocationName('constantinople')].\n\nQualora accettassimo alcune delle richieste [GetCountry('PAP').GetAdjectiveWithNoTooltip] e qualora [ShowLocationNameWithNoTooltip('constantinople')] venisse riconquistata, il Papa offrirà il pieno sostegno del [GetCountry('PAP').GetLongNameWithNoTooltip] e riconoscerà il nostro monarca come il legittimo sovrano del [GetCountry('LAT').GetLongNameWithNoTooltip]."
 lat_frankokratia_pope_proposes_latin_restoration.desc.entry: "Un impero morente e uno in ascesa sono osservati dalla stessa Roma, e il Papa ha deciso quale di noi preferisce. La legittimità su una [ShowLocationName('constantinople')] restaurata è sua da concedere, e la concederà, purché accettiamo abbastanza delle sue condizioni da far sembrare meritato il dono."
 lat_frankokratia_pope_proposes_latin_restoration.a: "Accettiamo la richiesta del Papa di restaurare il [GetCountry('LAT').GetLongNameWithNoTooltip]."
 lat_frankokratia_pope_proposes_latin_restoration.b: "Non saremo soggetti alle ambizioni del Papa."

 lat_greater_claims_of_the_latin_empire.title: "Le Maggiori Pretese dell'Impero Latino"
 lat_greater_claims_of_the_latin_empire.desc: "Dopo la caduta di [ShowLocationName('constantinople')] nel 1204, la vecchia élite latina si mosse rapidamente per consolidare il controllo sui possedimenti [GetCountry('BYZ').GetAdjective] in tutta [ShowScriptedGeographyName('greece_geography')], così come per rivendicare la sovranità sulla [ShowRegionName('balkan_region')]. Tuttavia, a quel tempo, [GetCountry('SER').GetName] e [GetCountry('BUL').GetName] si rivelarono grandi rivali per i Latini, con [GetCountry('BUL').GetNameWithNoTooltip] che alla fine giocò un ruolo importante nel collasso dell'impero originale con le loro costanti campagne militari nelle terre latine.\n\nOra con l'impero latino restaurato, potremmo essere in grado di rivendicare il dominio su queste terre, e realizzare ciò che il vecchio impero non poté."
 lat_greater_claims_of_the_latin_empire.desc.entry: "Il primo Impero Latino non cadde per la vendetta $BYZ_ADJ$ ma per i vicini che non riuscì mai del tutto a sottomettere. La [ShowRegionName('balkan_region')] ricorda chi rivendicò la sovranità nel 1204 e chi successivamente spezzò quella pretesa, e un impero restaurato che ignora gli stessi rivali sta invitando la stessa fine."
 lat_greater_claims_of_the_latin_empire.a: "Ci spingeremo per espandere il regno su questi vecchi rivali."
 lat_greater_claims_of_the_latin_empire.b: "Evitiamo di ripetere gli errori del passato."

 lat_restore_the_holy_patriarchate.title: "Restaurare il Sacro Patriarcato di [ShowLocationNameWithNoTooltip('constantinople')]"
 lat_restore_the_holy_patriarchate.desc: "Sebbene il sacco iniziale di [ShowLocationName('constantinople')] nel 1204 vide l'opposizione del Papa, l'occasione che [ShowLocationNameWithNoTooltip('constantinople')] venisse presa dai crociati [ShowReligionAdjective('catholic')] permise l'opportunità di restaurare il Patriarcato, elevando l'autorità [GetCountry('PAP').GetAdjective]. Tuttavia, la riconquista di [ShowLocationNameWithNoTooltip('constantinople')] nel 1261 da parte di [GetCharacter('byz_michael_viii_palaiologos').GetName] vide il titolo diventare nuovamente estinto.\n\nOra con il governo latino nuovamente restaurato su [ShowLocationNameWithNoTooltip('constantinople')], molti all'interno dei [GetEstateNameWithNoTooltip('clergy_estate')] ci hanno esortato a restaurare il Patriarcato."
 lat_restore_the_holy_patriarchate.desc.entry: "Un patriarca seduto a [ShowLocationName('constantinople')] sotto la nostra protezione renderebbe la fede della città soggetta a noi piuttosto che all'oriente. I nostri $clergy_estate$ non hanno dimenticato che il titolo esistette una volta, e intendono vederlo ricoperto di nuovo."
 lat_restore_the_holy_patriarchate.a: "Permettiamo la restaurazione del Patriarcato."
 lat_restore_the_holy_patriarchate.b: "Impegniamoci ad assicurare la protezione del Patriarcato restaurato!"
 lat_restore_the_holy_patriarchate.c: "Sfruttiamo il Patriarcato restaurato per ottenere influenza."
 lat_restore_the_holy_patriarchate.d: "Rifiutiamoci di restaurare il Patriarcato."
 latin_patriarchate_of_constantinople: "Patriarcato di [ShowLocationNameWithNoTooltip('constantinople')]"