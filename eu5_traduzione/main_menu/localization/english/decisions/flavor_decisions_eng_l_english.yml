l_english:
 eng_yorkist_tradition_decision.title: "Reclutamento di Burocrati della Classe Media"
 eng_yorkist_tradition_decision.desc: "Sta diventando sempre più difficile trovare uomini di talento per assumere incarichi governativi, e si sono alzate voci secondo cui dovremmo ampliare la selezione per includere la crescente classe media, in particolare gli avvocati oltre ai membri del [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]. Entrambe le parti attendono con impazienza di vedere se implementeremo tale politica per rispondere alle richieste di cambiamento."
 eng_yorkist_tradition_decision.desc.entry: "La classe media si sta espandendo, e quindi alcuni hanno sollevato la necessità di includerne alcuni in posizioni governative. Essere in grado di trovare persone di talento da impiegare, quindi includere la classe media tra il nostro bacino da cui attingere amplierebbe certamente le nostre opzioni."
 eng_yorkist_tradition_decision.a: "Diamo loro il nostro sostegno."
 eng_yorkist_tradition_decision.b: "Non hanno posto nel Governo."
 enable_yorkist_tradition_policy: "Concede accesso alla [policy|e] [ShowPolicyName('yorkist_tradition_policy')]"
 eng_yorkist_tradition_decision.historical_info: "Promuovere funzionari governativi dalla classe media, principalmente chierici e avvocati, era una tradizione yorkista di lunga data in Inghilterra. Fu fermamente contrastata dalla nobiltà e dal clero, che la consideravano un privilegio esclusivo degli uomini di status sociale più elevato o di nomina divina."

 eng_court_of_the_star_chamber_decision.title: "Corte della Camera Stellata"
 eng_court_of_the_star_chamber_decision.desc: "La giustizia è attualmente amministrata al meglio delle capacità della [ShowPolicyName('common_law_policy')]. Tuttavia, i procedimenti sono tediosamente lenti poiché si basano sul precedente e sulle decisioni dei giudici. Alcuni casi richiedono settimane, se non mesi, prima che si raggiunga un verdetto. Ci sono richieste per una corte giudiziaria secondaria con un certo grado di flessibilità nelle sue procedure, che le permetta di gestire casi considerati troppo delicati o complessi per i tribunali ordinari. Tuttavia, un effetto potenziale ma modesto potrebbe essere l'estensione del potere del [ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], sopprimendo l'opposizione e punendo il dissenso quando necessario."
 eng_court_of_the_star_chamber_decision.desc.entry: "Il precedente è il nostro modo tradizionale di amministrare la giustizia, ma rende necessariamente le procedure lente e le sentenze lunghe da ottenere. Un secondo tribunale, libero di stabilire la propria procedura, risolverebbe tali questioni rapidamente, e potrebbe diventare un'abitudine che servirebbe bene al $crown_estate$."
 eng_court_of_the_star_chamber_decision.a: "Uno strumento fondamentale."
 eng_court_of_the_star_chamber_decision.b: "La [ShowPolicyNameWithNoTooltip('common_law_policy')] sarà sufficiente."
 enable_court_of_the_star_chamber_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('court_of_the_star_chamber_reform')]"
 eng_court_of_the_star_chamber_decision.historical_info: "La Corte della Camera Stellata emerse dalle riunioni del Consiglio Privato del re, acquisendo gradualmente importanza durante il regno di Enrico VII. Il suo nome ebbe origine dal motivo a stelle che ornava il soffitto del Palazzo di Westminster, dove si riuniva. Nel 1487, la Corte fu istituita come organo giudiziario distinto, separato dal Consiglio, incaricato di esaminare le petizioni di riparazione."

 eng_benevolence_tax_decision.title: "Istituisci la Tassa della Benevolenza"
 eng_benevolence_tax_decision.desc: "Grazie all'eccellente gestione del paese, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] è riuscito a restaurare il potere e la stabilità della monarchia [ROOT.GetCountry.GetAdjective] dopo [ShowDisasterName('war_of_the_roses')]. Grazie all'attenta cura dei dettagli e all'opposizione alle spese sfarzose, l'attenzione del sovrano sembra essersi rivolta verso la raccolta di nuove entrate introducendo un meccanismo di tassazione spietatamente efficiente."
 eng_benevolence_tax_decision.desc.entry: "Un sovrano che spende poco e conta con attenzione presto si accorge di quanto spendono tutti gli altri. La pace ottenuta dopo [ShowDisasterName('war_of_the_roses')] ha lasciato il tesoro stabile e l'attenzione del sovrano libera di volgersi verso le borse dei ricchi."
 eng_benevolence_tax_decision.a: "Pace e prosperità economica."
 eng_benevolence_tax_decision.b: "Godiamoci la stabilità che abbiamo creato."
 eng_benevolence_tax_decision.a.custom: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('benevolence_tax_reform')]"
 eng_benevolence_tax_decision.historical_info: "Il regno di Enrico VII contribuì a stabilizzare le finanze del regno e consolidò il potere della monarchia. Con l'aiuto del suo cancelliere, John Morton, il Re introdusse il pagamento di una tassa di benevolenza con il ragionamento che chi viveva modestamente doveva necessariamente stare risparmiando denaro, e quindi potersi permettere la benevolenza, mentre chi viveva in modo stravagante era ovviamente ricco, e quindi poteva permettersi anch'esso di pagarla."

 eng_council_of_the_north_decision.title: "Consiglio del Nord"
 eng_council_of_the_north_decision.desc: "È stato suggerito che la mancanza di giustizia conciliare nel nord sia ulteriormente esacerbata dalla pura distanza da [ROOT.GetCountry.GetCapital.GetName]. Istituire un consiglio indipendente a [target_location.GetName] per occuparsi di tali questioni delegherebbe parte dell'autorità in cambio della garanzia che la giustizia venga rispettata."
 eng_council_of_the_north_decision.desc.entry: "Una giustizia ritardata da tre settimane di duro viaggio a cavallo è una giustizia negata. Un consiglio con sede a [ShowLocationName('york')] e con autorità propria risponderebbe alle contee settentrionali senza che le loro petizioni debbano prima attraversare tutto il paese, al prezzo di un'autorità che non potremo più esercitare noi stessi."
 eng_council_of_the_north_decision.a: "Siamo d'accordo."
 eng_council_of_the_north_decision.b: "La burocrazia non è la soluzione."
 eng_council_of_the_north_decision.b_tt: "Ogni [location|e] in [ShowAreaName('northumbria_area')] otterrà il [modifier|e] [ShowModifier('lack_of_conciliar_justice')]"
 STATIC_MODIFIER_NAME_lack_of_conciliar_justice: "Mancanza di Giustizia Conciliare"
 eng_council_of_the_north_decision.historical_info: "Il Consiglio del Nord era un organo amministrativo istituito con l'obiettivo di esercitare un controllo più diretto sulle contee settentrionali. La funzione principale del consiglio era mantenere l'ordine pubblico e assicurare la lealtà dei soggetti più settentrionali della Corona. Fu infine abolito nel 1641 durante la Guerra Civile Inglese."

 eng_austere_monastic_life_decision.title: "La Riforma dei Monasteri"
 eng_austere_monastic_life_decision.desc: "L'eccessiva ricchezza degli ordini religiosi in [ROOT.GetCountry.GetName] è stata a lungo una spina nel fianco dei riformisti. Il malcontento tra i [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] verso le potenti istituzioni ecclesiastiche è un altro fattore che contribuisce alla ricerca del cambiamento.\n\nPotremmo tentare di riformare queste pratiche e riportare gli ordini religiosi all'ideale austero e claustrale.\n\nUn totale di #Y [ROOT.GetVariable('num_of_monasteries').GetValue]#! monasteri appare nei registri in seguito alle visite ispettive."
 eng_austere_monastic_life_decision.desc.entry: "Niente offende i poveri quanto un eremita ricco. I riformisti lo dicono da anni, i $peasants_estate$ hanno iniziato a essere d'accordo con loro, e riportare gli ordini ai loro voti sarebbe popolare con tutti tranne gli ordini stessi."
 eng_austere_monastic_life_decision.a: "Riformiamo."
 eng_austere_monastic_life_decision.a.custom: "Gli ordini monastici vedono un esodo di membri che si riuniscono ai [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]"
 eng_austere_monastic_life_decision.b: "$common_string_leave_them_be$"
 eng_austere_monastic_life_decision.b.custom: "I [ShowPopTypeName('clergy')] negli ordini monastici ottengono [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] di [pop_satisfaction|e]"
 eng_austere_monastic_life_decision.tt: "Non sarà possibile sciogliere i monasteri a meno che questo [privilege|e] non venga revocato"
 eng_austere_monastic_life_decision.historical_info: "La Riforma o Dissoluzione dei Monasteri fu un evento importante durante il XVI secolo in seguito all'adesione dell'Inghilterra alla Riforma. Thomas Cromwell, il primo ministro del Re, cercò inizialmente di smantellare il sistema monastico, visto come un'estensione della Chiesa Cattolica Romana. L'evento culminò nella chiusura delle case religiose, inclusi monasteri, abbazie e conventi in tutta l'Inghilterra."

 eng_navy_board_decision.title: "Il Consiglio della Marina"
 eng_navy_board_decision.desc: "È stato riconosciuto che i nostri confini sono in qualche modo vulnerabili all'invasione straniera. Per salvaguardare il futuro di [ROOT.GetCountry.GetName], dobbiamo esercitare il controllo sui mari che circondano la nostra isola per contrastare qualsiasi tentativo di invasione delle nostre terre.\n\nAmpliando le nostre capacità logistiche e razionalizzando la gestione della nostra flotta, possiamo rafforzare gli sforzi di costruzione navale e sostenere una marina più grande a spese riducibili."
 eng_navy_board_decision.desc.entry: "Un'isola è sicura solo quanto le acque che la circondano, e le nostre sono osservate da flotte che non abbiamo costruito noi. Porre i cantieri, i magazzini e l'approvvigionamento sotto un unico consiglio ci permetterebbe di mantenere più navi in mare per la stessa spesa, il che è l'unico tipo di espansione navale che possiamo attualmente permetterci."
 eng_navy_board_decision.a: "Facciamo i cambiamenti necessari."
 eng_navy_board_decision.b: "L'Esercito è ciò che conta."
 enable_navy_board_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('navy_board_reform')]"
 eng_navy_board_decision.historical_info: "Nel XVI secolo, durante il regno di Re Enrico VIII, il Consiglio della Marina fu istituito per supervisionare gli affari navali, inclusa la costruzione navale e la gestione logistica. Sotto la guida di Enrico, il Consiglio della Marina facilitò l'espansione della flotta inglese, con l'obiettivo di trasformarla in una forza da temere e assicurare la sicurezza dell'Inghilterra dalle invasioni straniere."

 eng_grand_remonstrance_decision.title: "La Grande Rimostranza"
 eng_grand_remonstrance_decision.desc: "Un rappresentante del Parlamento ha presentato una lista di lamentele che ritengono possano rettificare le loro preoccupazioni riguardo alla corruzione e all'influenza spirituale negli affari di stato. Essi sottolineano che [ROOT.GetCountry.GetGovernment.GetRuler.GetName] ha governato senza convocare il Parlamento per un considerevole periodo di tempo, e ora cercano di preservare i propri diritti e privilegi limitando il potere della monarchia.\n\nInoltre, c'è la questione dei consiglieri del re all'interno del [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], la cui presenza è vista come un'estensione dell'influenza della Chiesa negli affari di stato. È stata proposta l'esclusione dei membri del clero dalla partecipazione al gabinetto. In cambio, il Parlamento sarebbe più favorevole alla futura legislazione."
 eng_grand_remonstrance_decision.desc.entry: "Il Parlamento ha redatto per iscritto le proprie lamentele, cosa che si fa quando si intende ottenere risposta piuttosto che essere semplicemente ascoltati. Vogliono che la monarchia sia controllata e che i $clergy_estate$ vengano estromessi dal gabinetto, e in cambio lasciano intendere una cooperazione di cui non godiamo da anni."
 eng_grand_remonstrance_decision.a: "Rediamo un rifiuto formulato con attenzione."
 eng_grand_remonstrance_decision.b: "Accettiamo i termini."
 eng_grand_remonstrance_decision.c: "Tentiamo di raggiungere un compromesso."
 eng_grand_remonstrance_decision.tt1: "Il Parlamento potrebbe reagire con ostilità e tentare di limitare i poteri reali con qualsiasi mezzo necessario"
 STATIC_MODIFIER_NAME_grand_remonstrance_refused: "Grande Rimostranza Rifiutata"
 eng_grand_remonstrance_decision.b.custom: "Viene implementata la [government_reform|e] [ShowGovernmentReformName('grand_remonstrance_reform')]"
 eng_grand_remonstrance_decision.c.custom1: "La bassa abilità diplomatica del nostro sovrano rende improbabile il successo"
 eng_grand_remonstrance_decision.c.custom2: "L'abilità diplomatica del nostro sovrano potrebbe convincere un numero sufficiente di membri del parlamento"
 eng_grand_remonstrance_decision.tt2: "Il compromesso potrebbe non avere un esito favorevole"
 eng_grand_remonstrance_decision.historical_info: "La Grande Rimostranza fu un documento politico presentato dal Parlamento a Re Carlo I d'Inghilterra nel 1641. Esso evidenziava la loro frustrazione verso il re e proponeva cambiamenti radicali per limitare la sua capacità di interferire con i procedimenti parlamentari. Affrontava anche i timori riguardo al Cattolicesimo ed esprimeva preoccupazioni sull'influenza dei consiglieri del re. Poco dopo la presentazione della Grande Rimostranza, le tensioni tra il Parlamento e il re si intensificarono, culminando nello scoppio della Guerra Civile Inglese."

 eng_overhauled_admiralty_decision.title: "Ristruttura il Consiglio dell'Ammiragliato"
 eng_overhauled_admiralty_decision.desc: "Un amministratore navale sta mostrando un grande potenziale nonostante la mancanza di esperienza marittima. L'influenza, la diligenza e il talento di [samuel_pepys.GetName] potrebbero aiutare a riformare il Consiglio dell'Ammiragliato e contribuire alla professionalizzazione della Marina Reale."
 eng_overhauled_admiralty_decision.desc.entry: "La Marina non ha mai mancato di capitani coraggiosi, solo di qualcuno in grado di contare le sue scorte. $name_samuel$ $Pepys$ non ha mai comandato una nave ed è molto probabilmente l'uomo giusto esattamente per questo motivo."
 eng_overhauled_admiralty_decision.a: "Nominiamolo Segretario del Consiglio."
 eng_overhauled_admiralty_decision.b: "Raccogliamo i frutti del suo lavoro in corso."
 enable_overhauled_admiralty_reform: "Concede accesso alla [government_reform|e] [ShowGovernmentReformName('overhauled_admiralty_reform')]"
 STATIC_MODIFIER_NAME_samuel_pepys_diligence: "Diligenza di Samuel Pepys"
 eng_overhauled_admiralty_decision.tt3: "il suo lavoro nel Consiglio della Marina razionalizza la capacità operativa della Marina"
 eng_overhauled_admiralty_decision.historical_info: "Il lavoro di Samuel Pepys fu fondamentale per la Marina Reale nel modernizzare e riformare la marina durante un periodo significativo della sua storia. Alcuni dei cambiamenti includevano il miglioramento dell'approvvigionamento della marina e l'istituzione di un sistema di paga regolare per marinai e ufficiali. Oggi è ricordato principalmente per l'ampio diario che tenne per un periodo di dieci anni, registrando ogni dettaglio della sua vita e fornendo un resoconto meticoloso di eventi storici come il Grande Incendio e la Grande Peste di Londra."

 eng_taxation_law_decision.title: "L'Imposta sul Reddito"
 eng_taxation_law_decision.desc: "La situazione finanziaria del paese rimane piuttosto delicata, suscitando discussioni sulla necessità di una riforma. Prevale il sentimento che gli attuali sistemi di tassazione favoriscano in modo sproporzionato i ricchi producendo al contempo poche entrate governative. Il membro del gabinetto [william_pitt_the_younger.GetName] sostiene una tassazione temporanea sul reddito per sostenere le finanze del paese e ridistribuire la ricchezza, una proposta che non sarà accolta bene dai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e dal [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 eng_taxation_law_decision.desc.entry: "Una tassa che risparmia i ricchi raccoglie poco e non soddisfa nessuno. $name_william$ $Pitt$ propone di prelevare una quota del reddito direttamente, per un periodo limitato e senza esenzioni degne di questo nome, motivo per cui i $nobles_estate$ e i $clergy_estate$ la combatteranno fino alla fine."
 eng_taxation_law_decision.a: "Equa e progressiva."
 eng_taxation_law_decision.b: "I dazi doganali e le accise ci sosterranno."
 eng_taxation_law_decision.c: "Una patata bollente politica."
 eng_taxation_law_decision.custom: "Concede accesso alla [law|e] [ShowLawName('eng_taxation_law')]"
 eng_taxation_law_decision.tt: "Il Parlamento è contrariato dal disinteresse verso il delicato stato della stabilità finanziaria di [target_root_country.GetNameWithNoTooltip]"
 STATIC_MODIFIER_NAME_temporary_income_tax: "Imposta sul Reddito Temporanea"
 eng_taxation_law_decision.historical_info: "L'imposta sul reddito fu introdotta dal Primo Ministro britannico William Pitt il Giovane per affrontare la tensione finanziaria causata dalle guerre napoleoniche in corso. L'imposta sul reddito di Pitt fu concepita come una tassa progressiva, il che significa che gli individui con reddito più alto pagavano una percentuale più alta del loro reddito in tasse. Incontrò l'opposizione dei contribuenti ad alto reddito e fu infine abrogata dopo la conclusione della guerra."

 eng_factory_working_conditions_decision.title: "La Legge sulle Fabbriche"
 eng_factory_working_conditions_decision.desc: "I riformisti sostengono il miglioramento dei diritti lavorativi per gli operai di fabbrica, spesso soggetti a sfruttamento incessante, protezione inadeguata e bassi salari. Qualsiasi tentativo di modificare la situazione attuale dovrebbe incontrare opposizione e potenzialmente avere effetti negativi sulla crescita economica e sulla produttività. Tuttavia, rischiamo un esodo della forza lavoro se la situazione non migliora."
 eng_factory_working_conditions_decision.a: "Le povere anime hanno bisogno di sollievo."
 eng_factory_working_conditions_decision.b: "I lavoratori alimentano il motore economico."
 eng_factory_working_conditions_decision.c: "Gli ingrati potrebbero mostrare un po' di gratitudine."
 eng_factory_working_conditions_decision.custom: "Concede accesso alla [law|e] [ShowLawName('factory_working_conditions_law')]"
 eng_factory_working_conditions_decision.historical_info: "La Legge sulle Fabbriche fu un'importante legislazione in Gran Bretagna e segnò una svolta negli sforzi per migliorare le condizioni di lavoro e proteggere i diritti degli operai di fabbrica, specialmente i bambini che altrimenti avrebbero lavorato per la maggior parte della giornata per una paga minima. La legge introdusse restrizioni di età, requisiti educativi e ispezioni delle fabbriche, e costrinse i proprietari delle fabbriche a migliorare la sicurezza generale e a tenere registri di impiego."

 eng_coke_smelting_decision.title: "Investi nel Lavoro dei Darby"
 eng_coke_smelting_decision.desc: "Il pionieristico maestro siderurgico [abraham_darby.GetName] ha sviluppato una nuova fonte di combustibile usata negli altiforni. Questo combustibile, conosciuto semplicemente come 'coke', è considerato meno volatile e capace di generare un calore costantemente più alto rispetto alla preferenza attuale del settore, il carbone di legna. [abraham_darby.GetNameWithNoTooltip] sta ora conducendo un'implementazione di prova nella sua [ShowBuildingTypeName('iron_foundry')] di famiglia, con risultati promettenti."
 eng_coke_smelting_decision.desc.entry: "Il carbone di legna brucia caldo abbastanza per un fabbro e non mai abbastanza caldo per un altoforno. $name_abraham$ $Darby$ ha trasformato il carbone in qualcosa di più costante, e le prime prove nella sua [ShowBuildingTypeName('iron_foundry')] suggeriscono che il ferro potrebbe presto essere prodotto in quantità che le foreste non avrebbero mai potuto sostenere."
 eng_coke_smelting_decision.a: "Rendiamolo uno standard del settore."
 eng_coke_smelting_decision.tt2: "La nuova fonte di combustibile lavorato richiede quantità maggiori di [ShowGoodsName('coal')]"
 enable_coke_smelting_advance: "Concede accesso all'[advance|e] [ShowAdvanceName('coke_smelting')]"
 unlocked_advance_coke_smelting_tt: "Ha preso la [decision|e] $eng_coke_smelting_decision.title$"
 eng_coke_smelting_decision.historical_info: "Il processo di fusione a coke inventato da Abraham Darby I è considerato un importante catalizzatore che fece avanzare significativamente la Rivoluzione Industriale. I suoi effetti immediati furono una trasformazione fondamentale nelle tecniche di produzione del ferro, che permise la diffusa adozione del ferro e dell'acciaio in una varietà di industrie. Pose anche le basi per la produzione di massa della ghisa, che fu fondamentale per la Rivoluzione Industriale."

 eng_royal_society_decision.title: "La Royal Society"
 eng_royal_society_decision.desc: "La riunione delle nostre più grandi menti scientifiche ha prodotto alcune delle più grandi invenzioni della nostra società. Potremmo istituire un organo indipendente, governato dal proprio consiglio e con sede a [ROOT.GetCountry.GetCapital.GetName], per promuovere la scienza e i suoi benefici e riconoscere e sostenere la scienza d'eccellenza. Fornirebbe anche consulenza scientifica per le politiche e l'istruzione, concentrando l'attenzione sui nostri sforzi di ricerca."
 eng_royal_society_decision.desc.entry: "Gli uomini di scienza già si incontrano, corrispondono e litigano senza alcun nostro aiuto; ciò che manca loro è un tetto e uno statuto. Concedere entrambi metterebbe i filosofi naturali del paese a portata delle nostre domande così come delle loro."
 eng_royal_society_decision.a: "Idea meravigliosa."
 eng_royal_society_decision.b: "Investiamo invece nelle nostre università."
 eng_royal_society_decision.historical_info: "La Royal Society fu fondata nel 1660, durante il regno di Re Carlo II d'Inghilterra. I suoi organizzatori erano membri di spicco della comunità scientifica, profondamente impegnati nell'ampliare i confini della comprensione scientifica e nell'assicurare il progresso della scienza. L'obiettivo era creare una piattaforma dove scienziati, studiosi e intellettuali potessero incontrarsi e scambiare i risultati delle loro ricerche, al fine di trasformare le idee in risultati tangibili."
 eng_royal_society_decision.tt1: "Il nostro sovrano diventa patrono di questa società scientifica di nuova formazione"

 eng_royal_academy_of_arts_decision.title: "Royal Academy of Arts"
 eng_royal_academy_of_arts_decision.desc: "È stato suggerito di istituire un'istituzione incaricata di promuovere la creatività e far progredire le arti, con finanziamenti forniti da [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. Dovrebbe servire come scuola o accademia di design per l'uso degli studenti d'arte, con l'organizzazione di una mostra annuale di arte contemporanea, aperta a tutti gli artisti."
 eng_royal_academy_of_arts_decision.desc.entry: "I pittori formati all'estero riportano gusti stranieri insieme alla loro tecnica. Un'accademia nostra, con una scuola, una mostra annuale aperta a qualsiasi artista, e la borsa del sovrano a sostenerla, permetterebbe alla prossima generazione di imparare il proprio mestiere in patria."
 eng_royal_academy_of_arts_decision.a: "Approvato con arte!"
 eng_royal_academy_of_arts_decision.b: "Meglio spenderlo per educare i poveri."
 STATIC_MODIFIER_NAME_increased_educational_spending: "Aumento della Spesa per l'Istruzione"
 eng_royal_academy_of_arts_decision.historical_info: "La Royal Academy of Arts è un'istituzione finanziata privatamente dedicata alla promozione delle arti visive e dell'architettura. Fu fondata nel 1768 da un gruppo di artisti, tra cui Sir Joshua Reynolds e Sir William Chambers, con Re Giorgio III come primo patrono reale dell'accademia. L'appartenenza alla Royal Academy è altamente prestigiosa e viene conferita ad artisti e architetti che hanno dato contributi significativi nei rispettivi campi."

 eng_enclosure_act_decision.title: "La Legge sulle Recinzioni"
 eng_enclosure_act_decision.desc: "I proprietari di fabbriche e terreni stanno facendo pressione sul Parlamento affinché permetta un'ulteriore privatizzazione delle terre pubbliche, per accelerare la migrazione della forza lavoro dalle zone rurali alle aree urbane. Sebbene probabilmente causerà un significativo spostamento sociale, garantirebbe anche un'ampia disponibilità di forza lavoro e aumenterebbe la produzione agricola complessiva."
 eng_enclosure_act_decision.a: "Un lavoratore spostato è un lavoratore produttivo."
 eng_enclosure_act_decision.a.custom: "I [ShowPopTypeName('peasants')] risentiti si ribellano, e 10 [locations|e] rurali perdono [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [prosperity|e]"
 eng_enclosure_act_decision.tt: "La Legge accelera il processo di urbanizzazione e incoraggia un'ulteriore industrializzazione a spese dei [ShowEstateTypeName('peasants_estate')]"
 enable_enclosure_act_policy: "Concede accesso alla [policy|e] [ShowPolicyName('enclosure_act')]"
 enclosure_riots: "Sommosse delle Recinzioni"
 eng_enclosure_act_decision.historical_info: "Le Leggi sulle Recinzioni furono una serie di leggi promulgate in Inghilterra che permisero un'ulteriore recinzione, o privatizzazione, delle terre comuni e dei campi aperti. Facevano parte di più ampie trasformazioni economiche e agricole ritenute necessarie per sostenere l'ascesa dell'agricoltura commerciale e la crescita dell'industrializzazione. Le Leggi contribuirono alla disuguaglianza sociale e portarono allo spostamento di migliaia di lavoratori rurali costretti a cercare occupazione nelle città. Culminarono in sommosse da parte di contadini e lavoratori spossessati che resistettero alla perdita dei loro diritti tradizionali."

 sco_witchcraft_act_decision.title: "La Legge sulla Stregoneria [ROOT.GetCountry.GetAdjectiveWithNoTooltip]"
 sco_witchcraft_act_decision.title.entry: "La Legge sulla Stregoneria"
 sco_witchcraft_act_decision.desc: "La crescente aversione popolare verso le streghe e la stregoneria è stata sempre più portata all'attenzione della corte. Le denunce di attività di streghe si accumulano davanti a [ROOT.GetCountry.GetGovernment.GetRuler.GetName], richiedendo una rapida risoluzione. Le denunce sono di vario tipo, dalla guaritrice locale apparentemente innocua accusata di preparare pozioni a presunte possessioni demoniache. C'è persino un contadino che giura di essere stato trasformato una volta in una salamandra ma di essersi poi ristabilito.\n\nLe proposte per una nuova legge che persegua le streghe stanno aumentando, e il [ROOT.GetCountry.GetGovernment.GetRulerTitle] ha iniziato a esprimere anche la propria opinione in materia."
 sco_witchcraft_act_decision.desc.entry: "La corte riceve ora più accuse di stregoneria che di furto, e qualcuno deve decidere quali di esse meritino un processo. Uno statuto porrebbe almeno la questione su basi legali, sebbene una legge contro le streghe abbia la curiosa proprietà di produrne di più."
 sco_witchcraft_act_decision.a: "Difendiamo la Legge sulla Stregoneria."
 sco_witchcraft_act_decision.b: "Denunciamola."
 sco_witchcraft_act_decision.historical_info: "La Legge Scozzese sulla Stregoneria del 1563 rese sia la pratica della stregoneria che il fatto di consultare streghe reati capitali. Giacomo VI ebbe un ruolo importante in essa attraverso il suo coinvolgimento nei processi alle streghe di North Berwick, che furono la prima grande serie di processi sotto la nuova legge. Il Re pubblicò una difesa della caccia alle streghe nella 'Daemonologie' nel 1597, ma in seguito divenne sempre più scettico e prese provvedimenti per limitare i procedimenti giudiziari. La Scozia processò una stima di 6.000 persone per stregoneria, di cui il settantacinque percento degli accusati erano donne, e oltre 1.500 persone furono giustiziate."

 sco_preserve_clan_autonomy_decision.title: "Gli Statuti di Iona"
 sco_preserve_clan_autonomy_decision.desc: "Mentre molti dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] residenti nelle pianure [ROOT.GetCountry.GetAdjective] hanno iniziato a far educare i propri eredi in scuole locali, molti dei restanti clan [ShowCultureName('highland')] seguono ancora l'educazione tradizionale.\n\nCol passare del tempo, ciò è cresciuto fino a essere visto come un danno per [ROOT.GetCountry.GetNameWithNoTooltip]. Alcuni all'interno del [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito che venga promulgata una nuova politica che costringa i membri di questi clan a iscrivere i propri eredi in una delle varie scuole nelle pianure di [ROOT.GetCountry.GetNameWithNoTooltip].\n\nLa politica produrrebbe senza dubbio una generazione più istruita di leader di clan, ma alcuni temono che ciò farà sì che i clan [ShowCultureNameWithNoTooltip('highland')] diventino simili a quelli delle pianure."
 sco_preserve_clan_autonomy_decision.desc.entry: "Un clan che educa i propri eredi in patria forma uomini leali al clan; un clan che li manda a sud forma uomini leali a chiunque li abbia istruiti. Costringere i capi [ShowCultureName('highland')] a fare quest'ultima cosa ci darebbe una generazione di signori più utile, e meno Highland."
 sco_preserve_clan_autonomy_decision.a: "Implementiamo gli Statuti."
 sco_preserve_clan_autonomy_decision.b: "I loro vecchi diritti saranno rafforzati."

 eng_east_india_company_decision.title: "La Compagnia delle Indie Orientali [ROOT.GetCountry.GetAdjectiveWithNoTooltip]"
 eng_east_india_company_decision.title.entry: "La Compagnia delle Indie Orientali"
 eng_east_india_company_decision.desc: "Come tutte le altre nazioni di questo tempo con una costa, il [ROOT.GetCountry.GetLongName] è riuscito anch'esso a replicare gli sforzi delle loro espansioni d'oltremare, e ha trovato una rotta verso le Indie Orientali. Creare una compagnia per sfruttare le sue molte ricchezze sarà certamente a nostro vantaggio."
 eng_east_india_company_decision.desc.entry: "La rotta verso est non è più un segreto che valga la pena mantenere, e ogni rivale con un porto la sta già navigando. Una compagnia privilegiata permetterebbe al denaro privato di sopportare il rischio dei viaggi mentre la corona incassa su ciò che ritorna."
 eng_east_india_company_decision.a: "Lo sfrutteremo!"
 eng_east_india_company_decision.b: "Concentriamoci sulla patria."

 sco_company_of_scotland_decision.title: "Fonda la [ShowGovernmentReformNameWithNoTooltip('company_of_scotland')]"
 sco_company_of_scotland_decision.desc: "Con il nostro crescente interesse nel commercio d'oltremare, la mancanza di supervisione governativa sulle nostre rotte commerciali intercontinentali diventa sempre più preoccupante. Dovremmo concedere monopoli commerciali a individui meritevoli, incaricati dell'organizzazione delle nostre spedizioni e della protezione dei nostri investimenti."
 sco_company_of_scotland_decision.a: "La Compagnia porterà prosperità al nostro paese!"
 sco_company_of_scotland_decision.b: "Questo sembra un po' rischioso."