 DIFFICULTY_LEVEL_LABEL: "Difficoltà"
 difficulty_level_name_1: "#G Molto Facile #!"
 difficulty_level_desc_1: "#T Molto facile #!\nQuesto [country|e] ha una posizione iniziale #G molto facile#! ed è consigliato per un #G principiante#!.\n\nI [countries] #G molto facili#! di solito hanno dimensioni gestibili, appartengono a un unico [market|e], hanno vicini più deboli o molto amichevoli e non sono vincolati da meccaniche speciali." 
 difficulty_level_name_2: "#G Facile #!"
 difficulty_level_desc_2: "#T Facile #!\nQuesto [country|e] ha una posizione iniziale #G facile#! ed è consigliato per un #G principiante#!.\n\nI [countries] #G facili#! di solito hanno dimensioni gestibili, appartengono a un unico [market|e] e hanno vicini più deboli o amichevoli." 
 difficulty_level_name_3: "#W Media #!" 
 difficulty_level_desc_3: "#T Media #!\nQuesto [country|e] è di difficoltà media ed è consigliato se conosci già le basi del gioco.\n\nI [countries] di difficoltà #W media#! di solito hanno dimensioni maggiori, si estendono su più [markets|e] e i loro vicini possono rappresentare una minaccia più significativa, mettendo a rischio la loro sopravvivenza.\n\nI [countries] di difficoltà #W media#! potrebbero anche essere coinvolti fin dall'inizio in contenuti speciali come [situations|e], [disasters|e] o [international_organizations|e], rendendo potenzialmente il loro stile di gioco diverso dalla norma." 
 difficulty_level_name_4: "#R Difficile #!"
 difficulty_level_desc_4: "#T Difficile #!\nQuesto [country|e] è #R difficile#! da giocare ed è meglio evitarlo finché non avrai padroneggiato le basi di #italic Europa Universalis V#!.\n\nI [countries] #R difficili#! sono difficili da gestire internamente, perché eccessivamente grandi e complessi da amministrare, oppure sono molto vulnerabili a vicini più forti fin dall'inizio." 
 difficulty_level_name_5: "#R Molto Difficile #!"
 difficulty_level_desc_5: "#T Molto difficile #!\nQuesto [country|e] è #R molto difficile#! da giocare ed è meglio evitarlo finché non sarai diventato un maestro di #italic Europa Universalis V#!.\n\nI [countries] #R molto difficili#! sono molto difficili da gestire internamente, perché eccessivamente grandi e complessi da amministrare, oppure sono estremamente vulnerabili a vicini più forti fin dall'inizio." 
