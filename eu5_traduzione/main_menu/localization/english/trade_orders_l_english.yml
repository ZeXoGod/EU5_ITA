 TRADE_ORDER_MODE_PROFIT: "Focus sul Profitto"
 TRADE_ORDER_MODE_FOOD: "Focus sul Cibo"
 TRADE_ORDER_MODE_NEEDS: "Focus sulla Carenza"
 TRADE_ORDER_MODE_PROFIT_WITH_ICON: "@gold! $TRADE_ORDER_MODE_PROFIT$"
 TRADE_ORDER_MODE_FOOD_WITH_ICON: "@food! $TRADE_ORDER_MODE_FOOD$"
 TRADE_ORDER_MODE_NEEDS_WITH_ICON: "@shortage! $TRADE_ORDER_MODE_NEEDS$"
 TRADE_ORDER_MODE_PROFIT_TT: "L'ordine spenderà la sua [merchant_capacity|e] nei [trades|e] più redditizi che riesce a trovare tra i beni e i mercati selezionati."
 TRADE_ORDER_MODE_FOOD_TT: "L'ordine spenderà la sua [merchant_capacity|e] nei [trades|e] che spostano più [food|e] verso i mercati che stanno perdendo cibo e hanno meno del [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] di [food_stockpile|e]."
 TRADE_ORDER_MODE_NEEDS_TT: "L'ordine spenderà la sua [merchant_capacity|e] per coprire le carenze di [goods|e] dei suoi mercati di destinazione, voce per voce in ordine. Vengono forniti solo i beni la cui [stockpile|e] è al di sotto del [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]."
 TRADE_ORDER_MODE_PROFIT_INFO: "Questo ordine privilegia il #italic profitto#!: spende la sua [merchant_capacity|e] nei [trades|e] più redditizi tra i beni e i mercati selezionati."
 TRADE_ORDER_MODE_FOOD_INFO: "Questo ordine privilegia il #italic cibo#!: spende la sua [merchant_capacity|e] nei [trades|e] che spostano più [food|e] verso i mercati che ne hanno bisogno.\n\nUn mercato viene aiutato solo mentre perderebbe cibo senza questo ordine e la sua [food_stockpile|e] è al di sotto del [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%]. Sotto il [GetDefine('NAI','TRADE_ORDER_FOOD_GROWTH_STOCKPILE_FRACTION')|V0%] l'ordine riempie anche la scorta del [GetDefine('NAI','TRADE_ORDER_FOOD_MONTHLY_STOCKPILE_GAIN')|V0%] del suo massimo al mese. Sopra il [GetDefine('NAI','TRADE_ORDER_FOOD_MAINTAIN_STOCKPILE_FRACTION')|V0%] il mercato è considerato approvvigionato e non riceve nulla.\n\nLe esportazioni si fermano mentre il mercato dell'ordine stesso è sotto il [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_STOP_FRACTION')|V0%] di [food_stockpile] e vengono annullate sotto il [GetDefine('NAI','TRADE_ORDER_FOOD_EXPORT_SELF_CANCEL_FRACTION')|V0%]."
 TRADE_ORDER_MODE_NEEDS_INFO: "Questo ordine privilegia la #italic carenza#!: spende la sua [merchant_capacity|e] per coprire ogni bene nell'elenco, in ordine, con i beni precedenti per primi.\n\nUn bene viene fornito solo mentre il mercato di destinazione ne consuma più di quanto ne produca localmente e la sua [stockpile|e] è al di sotto del [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%]. L'ordine ne sposta solo quanto basta per riportare il bilancio a zero, contando l'aiuto già in arrivo da altri, e ignora le carenze causate solo dalle esportazioni.\n\nMentre la [stockpile|e] di un bene è al di sotto del [GetDefine('NAI','TRADE_ORDER_NEEDS_GROWTH_STOCKPILE_FRACTION')|V0%] l'ordine la riempie anche del [GetDefine('NAI','TRADE_ORDER_NEEDS_MONTHLY_STOCKPILE_GAIN')|V1%] del suo massimo al mese; tra quel valore e il [GetDefine('NAI','TRADE_ORDER_NEEDS_STOCKPILE_EXCLUSION_FRACTION')|V0%] copre solo il bilancio."
 TRADE_ORDER_NEW_TOOLTIP_SUMMARY: "Nuovo [trade_order|e] che alloca [TradeOrderLateralView.GetEffectiveTC|2]@trade_capacity!. L'IA creerà [trades|e] per esso una volta applicato."
