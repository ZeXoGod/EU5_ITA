 TRADE_ORDER_MIN_PROFIT_TT: "L'ordine non potrà effettuare [trades] sotto questa soglia, garantendo una certa redditività.\n\nSe negativo, o deselezionato, il [trade_order] potrà eseguire [trades] in perdita netta, sussidiando di fatto il [trade].\n\nPiù il miglior profitto di [trade] di un bene si avvicina a questa soglia, più lenta e minore sarà la capacità commerciale che l'ordine destina a quel bene — potrebbe lasciare capacità inutilizzata piuttosto che far crollare il prezzo del bene; più si trova sopra la soglia, più velocemente e ampiamente si espande."
