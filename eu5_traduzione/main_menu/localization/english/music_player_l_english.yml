 Dan_Cecil_Hill: "Dan Cecil Hill (flutes)"
 Dan_Cecil_Hill_facts: "Dan Cecil Hill (Nazione Cayuga, Clan dell'Airone) è un artista e musicista Haudensaunee (Iroquois) specializzato nella tradizionale lavorazione dell'argento e nella costruzione di flauti. Artista, interprete e leader culturale per gran parte della sua vita, si è dedicato a preservare e condividere tutti gli aspetti della storia del suo popolo, risalendo all'epoca precoloniale statunitense e oltre."
 Pierre_Harmon: "Pierre Harmon"
 Pierre_Harmon_facts: "Pierre Harmon è un noto flautista e rinomato esperto di musica precolombiana. Conosciuto in tutto il mondo per le sue preziose ricerche musicologiche, specialmente sulla musica azteca, possiede anche una delle più grandi collezioni di strumenti antichi, che ha imparato a padroneggiare nel corso della sua carriera."
