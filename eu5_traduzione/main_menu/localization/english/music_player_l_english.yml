 Yingying_Herrdahl: "Yingying Herrdahl (pipa)"
 Yingying_Herrdahl_facts: "Ying Ying Herrdahl è una virtuosa del pipa che vive attualmente in Svezia."
 Pipa_facts: "Il pipa cinese è uno strumento a corde con una forma a pera, suonato con le unghie o storicamente anche con un plettro. Le sue origini risalgono a quasi duemila anni fa ed è uno degli strumenti cinesi più popolari."
 Martin_Ostergren: "Martin Östergren (organ)"
 Feras_Charestan: "Feras Charestan (qanun)"
 Feras_Charestan_facts: "Feras Charestan proviene dalla città di Al-Hasakeh, nel nord-est della Siria, e ha studiato qanun all'Alto Istituto di Musica di Damasco."
 Qanun_facts: "Il qanun, o kanun, è uno strumento a corde della famiglia delle cetre, forse originario dell'antica Mesopotamia, sebbene le sue origini siano incerte."
 Ilona_Danho: "Ilona Danho (vocals)"
