 MusicPlayer_sol_chinese_Ambush_from_Ten_Sides_The_Complete_Epos_flavour: "Un capolavoro della musica classica cinese, tipicamente eseguito da virtuosi. Scritto in stile marziale, rappresenta la Battaglia di Gaixia del 202 a.C., dove il generale Xiang Yu fu sconfitto da Liu Bang."
