#### TRACK NAMES AND FLAVOUR TEXT ####

 MusicPlayer_01_Overture_I_Genesis: "01 - Overture I Genesis"
 MusicPlayer_01_Overture_I_Genesis_flavour: "'Il mondo si risveglia, la luce del sole ne rivela il volto pezzo per pezzo.'"
 MusicPlayer_02_Overture_II_The_Odyssey: "02 - Overture II Odyssey"
 MusicPlayer_02_Overture_II_The_Odyssey_flavour: "'L'ouverture della nostra storia, in cui veniamo introdotti al suo carattere e ai suoi temi.'"
 MusicPlayer_03_Royal_Court_Invitation: "03 - Royal Court Invitation"
 MusicPlayer_03_Royal_Court_Invitation_flavour: "Il clavicembalo, udibile in questo brano, è uno strumento a tastiera diffuso nella musica rinascimentale e barocca. Produce il suono pizzicando meccanicamente una serie di corde montate su una tavola armonica: premendo un tasto si muove un plettro di penna d'oca che pizzica una singola corda."
 MusicPlayer_25_The_Noble_Art_of_Diplomacy: "25 - The Noble Art of Diplomacy"
 MusicPlayer_25_The_Noble_Art_of_Diplomacy_flavour: "La famiglia di strumenti del liuto ha una lunga storia in molte regioni del mondo e periodi storici, e il liuto europeo è lo strumento dominante nella musica secolare rinascimentale in Europa."
 MusicPlayer_21_Conquer_or_Fall: "21 - Conquer or Fall" 
 MusicPlayer_21_Conquer_or_Fall_flavour: "Una composizione epica che include corni, archi e coro. Presenta una variazione ispirata su uno dei principali temi melodici della musica di Europa Universalis V."
 MusicPlayer_07_For_the_Lost_Ones: "07 - For the Lost Ones"
 MusicPlayer_07_For_the_Lost_Ones_flavour: "Una composizione lamentosa e ondeggiante, che riprende temi e motivi di altre composizioni di Europa Universalis V."
 MusicPlayer_12_Jester_Speaks_the_Truth: "12 - Jester Speaks the Truth"
 MusicPlayer_12_Jester_Speaks_the_Truth_flavour: "Una composizione ispirata alla musica del primo Rinascimento, incentrata su una variazione del motivo melodico principale della musica di Europa Universalis V."
 MusicPlayer_05_The_Rise_of_an_Empire: "05 - The Rise of an Empire"
 MusicPlayer_05_The_Rise_of_an_Empire_flavour: "Aprendosi con il motivo principale di Europa Universalis V, questa composizione è una rappresentazione incisiva dell'emozione centrale dell'esperienza."
 MusicPlayer_20_Thirty_Years: "20 - Thirty Years"
 MusicPlayer_20_Thirty_Years_flavour: "La Guerra dei Trent'Anni (1618-1648) è uno dei conflitti più devastanti della storia europea, e causò la morte di 4,5-8 milioni di persone. Fu scatenata dalla Riforma del XVI secolo e ulteriormente alimentata da conflitti d'interesse esterni e vecchie rivalità."
 MusicPlayer_24_The_Black_Death: "24 - The Black Death"
 MusicPlayer_24_The_Black_Death_flavour: "Dimezzando la popolazione europea del XIV secolo, la Peste Nera è una delle pandemie più letali della storia umana."
 MusicPlayer_10_Gloria_Patri: "10 - Gloria Patri"
 MusicPlayer_10_Gloria_Patri_flavour: "Una variazione vocale sulla Suite per Violoncello n.1 in Sol maggiore di Bach, BWV 1007: I.Prélude."
 MusicPlayer_14_Lux_aeterna: "14 - Lux Aeterna"
 MusicPlayer_14_Lux_aeterna_flavour: "Lux aeterna è un testo comunemente musicato come parte della Messa da Requiem nella Chiesa Cattolica. Parla della grazia di Dio e della Sua luce eterna che risplende sui defunti."
 MusicPlayer_18_Falalalan: "18 - Falalalan"
 MusicPlayer_18_Falalalan_flavour: "La storia è sempre presente nella musica, a volte in più di un modo."
 MusicPlayer_22_A_Message_to_The_King: "22 - A Message to the King"
 MusicPlayer_22_A_Message_to_The_King_flavour: "Una composizione piena di urgenza e fervore, che trasmette la sensazione che la fretta sia della massima importanza."
 MusicPlayer_08_No_Fear_No_Mercy: "08 - No Fear, No Mercy"
 MusicPlayer_08_No_Fear_No_Mercy_flavour: "Una composizione trionfale, che evoca la calma prima di una battaglia e i cuori dei combattenti che battono nel petto per l'attesa."
 MusicPlayer_06_Pain_is_Salvation: "06 - Pain is Salvation"
 MusicPlayer_06_Pain_is_Salvation_flavour: "Il testo mescola inglese, tedesco antico e latino, e parla della sofferenza sul cammino verso la salvezza."
 MusicPlayer_04_In_Your_Honor: "04 - In Your Honor"
 MusicPlayer_04_In_Your_Honor_flavour: "Un brano travolgente che evoca verdi pascoli e il timore reverenziale verso Dio e la Natura."
 MusicPlayer_15_A_Bargain_with_Beelzebub: "15 - A Bargain with Beelzebub"
 MusicPlayer_15_A_Bargain_with_Beelzebub_flavour: "Religione e guerra, e guerre per la religione. Pietà e sete di sangue che si intrecciano. I secoli qui rappresentati sono secoli di forti contrasti, interrotti da sfumature di grigio."
 MusicPlayer_16_The_Path_to_Potsdam: "16 - The Path to Potsdam"
 MusicPlayer_16_The_Path_to_Potsdam_flavour: "La città di Potsdam perse quasi la metà della sua popolazione durante la Guerra dei Trent'Anni."
 MusicPlayer_11_Maiden_Voyage: "11 - Maiden Voyage"
 MusicPlayer_11_Maiden_Voyage_flavour: "Una composizione in ritmo di danza, come il moto ondoso quando si salpa verso mari sconosciuti."
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor: "17 - The Coronation of a Naked Emperor"
 MusicPlayer_17_The_Coronation_of_a_Naked_Emperor_flavour: "Un brano in stile barocco secolare, con archi e clavicembalo."
 MusicPlayer_13_Battle_of_Lutzen: "13 - Battle of Lützen"
 MusicPlayer_13_Battle_of_Lutzen_flavour: "La Battaglia di Lützen fu combattuta il 16 novembre 1632 dall'esercito svedese, supportato da truppe di Sassonia e Assia-Kassel, contro l'Armata Imperiale del Sacro Romano Impero, ed è una delle battaglie più importanti della Guerra dei Trent'Anni. In seguito alla morte del re Gustavo Adolfo di Svezia durante la battaglia, fu istituita la Lega di Heilbronn."
 MusicPlayer_26_Peace_of_Westphalia: "26 - Peace of Westphalia"
 MusicPlayer_26_Peace_of_Westphalia_flavour: "La Pace di Westfalia è il nome collettivo di due distinti trattati di pace firmati a Osnabrück e Münster nel 1648, che posero fine alla Guerra dei Trent'Anni e portarono la pace nel Sacro Romano Impero."
 MusicPlayer_23_The_Flagellant: "23 - The Flagellant"
 MusicPlayer_23_The_Flagellant_flavour: "La flagellazione è l'atto di percuotersi come penitenza per i peccati e per condividere la Passione di Gesù, presente in molte tradizioni cristiane. Il flagellantismo fu un movimento del XIV secolo nel cristianesimo occidentale, nato come risposta alla guerra, alla carestia e alla peste."
 MusicPlayer_19_O_quam_gloriosum: "19 - O quam gloriosum"
 MusicPlayer_19_O_quam_gloriosum_flavour: "Questa composizione si basa su un testo scritto da Tomás Luis de Victoria (1548-1611) per la sua 'Missa O quam gloriosum'."
 MusicPlayer_09_Libera_me_Domine: "09 - Libera me Domine"
 MusicPlayer_09_Libera_me_Domine_flavour: "Questa composizione combina i testi 'Pie Jesu' e 'Libera me', comunemente musicati come parte della Messa da Requiem nella Chiesa Cattolica. Chiedono che la misericordia di Gesù conceda ai defunti il riposo e la liberazione nel giorno del giudizio."
 MusicPlayer_sol_ashanti_Aho: "Ashanti - Aho"
 MusicPlayer_sol_ashanti_Aho_flavour: "Nana Osei Twum Barima è un maestro di tutti gli strumenti usati nella musica e nelle cerimonie Ashanti, incluso il seperewa, i corni tradizionali e gli strumenti a percussione. È anche un successore dell'Imperatore e fondatore del Regno Ashanti. Il titolo della canzone si traduce come 'Canto di Guerra'."
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko: "Ashanti - Asanteman Yenim Ko"
 MusicPlayer_sol_ashanti_Asanteman_Yenim_Ko_flavour: "L'inizio del testo della canzone si traduce approssimativamente come 'Gli Ashanti sanno combattere ma non scappare', e prosegue proclamando la superiorità dei guerrieri Ashanti."
 MusicPlayer_sol_ashanti_Seperewa_Akasa: "Ashanti - Seperewa Akasa"
 MusicPlayer_sol_ashanti_Seperewa_Akasa_flavour: "Il titolo della canzone si traduce come 'Il Seperewa Ha Parlato'. Il seperewa è uno strumento della famiglia arpa-liuto, con una cassa di risonanza a forma di scatola e 10-14 corde collegate al manico dello strumento avvolgendole direttamente su di esso. Ha origine nell'Africa occidentale, e si dice che il re Osei Tutu, fondatore dell'impero Asante/Ashanti, lo amasse così tanto che ne fu realizzata una replica in oro per i suoi oggetti regali."
