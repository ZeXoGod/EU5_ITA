 Jacob_Regnart: "Jacob Regnart (1540s-1599)"
 Jacob_Regnart_facts: "Regnart è un compositore rinascimentale fiammingo, nato a Douai, che scrisse sia musica sacra che secolare. Nel corso della sua vita fu attivo in Austria e Boemia, tra le altre cose come Kapellmeister sotto l'Arciduca Ferdinando a Innsbruck negli anni 1580."
 Martin_Rinckart: "Martin Rinckart (1586-1649)"
 Martin_Rinckart_facts: "Martin Rinckart fu un chierico luterano e autore di inni, attivo come arcidiacono a Eilenburg, nel Nordsachsen, dove nacque e morì."
 Joachim_Neander: "Joachim Neander (1650-1680)"
 Joachim_Neander_facts: "Nato a Brema, Joachim Neander fu un autore di inni, teologo e insegnante della Chiesa Riformata (Calvinista). È considerato il più importante autore di inni della Chiesa Riformata, avendone scritti circa 60."
 Dietrich_Buxtehude: "Dietrich Buxtehude (1637-1707)"
 Dietrich_Buxtehude_facts: "Nato Dietrich Hansen Buxtehude a Helsingborg, nella provincia di Scania, nel 1637. Buxtehude è considerato uno dei compositori più importanti del XVII secolo e influenzò notevolmente compositori successivi come Bach e Handel."
