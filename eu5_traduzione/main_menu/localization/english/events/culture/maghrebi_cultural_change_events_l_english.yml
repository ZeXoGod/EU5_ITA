 maghrebi_cultural_change_events.1004.title: "La Sfacciataggine dei Coloni [ShowCultureNameWithNoTooltip('andalusi')]"
 maghrebi_cultural_change_events.1004.desc: "Negli ultimi anni si è assistito a un grande afflusso di [ShowCultureName('andalusi')] da [ShowRegionName('iberia_region')], a causa delle dilaganti persecuzioni che i nostri fratelli [ShowReligionGroupAdjective('muslim')] subiscono laggiù. Nonostante il dono di una nuova casa che [ROOT.GetCountry.GetReligion.GetGodName] ha concesso loro, quegli audaci nuovi arrivati hanno la sfacciataggine di lamentarsi apertamente delle condizioni di vita nel [ShowRegionName('maghreb_region')], esaltando al contempo coloro che sono rimasti nelle terre dei vili stati [ShowReligionGroupAdjective('christian')]!\n\nUn noto membro [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] tra i [target_pop2.GetName] ha paragonato questo atteggiamento a 'un quasi abbandono della fede'."
 maghrebi_cultural_change_events.1004.a: "Se [ShowRegionNameWithNoTooltip('iberia_region')] è così bella, perché non ci tornano?"
 maghrebi_cultural_change_events.1004.b: "Cerchiamo di calmare entrambe le parti."

