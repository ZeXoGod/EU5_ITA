l_english:
 iberian_culture.1.title: "Canti della Reconquista"
 iberian_culture.1.desc: "I nostri scontri con l'infedele hanno ispirato menestrelli e gente comune a comporre canti che celebrano il coraggio dei nostri soldati, che combattono per il trionfo della causa [ShowReligionGroupAdjective('christian')|U]. Mentre queste melodie si diffondono in tutta la [ROOT.GetCountry.GetFlavorRank], potrebbero rivelarsi uno strumento utile — per ispirare i nostri soldati in battaglia e, forse, per convincere più uomini ad arruolarsi nei nostri ranghi."
 iberian_culture.1.a: "Che risuonino sul campo di battaglia!"
 iberian_culture.1.b: "Ispireranno il nostro reclutamento!"

 iberian_culture.2.title: "Eroe della Reconquista"
 iberian_culture.2.desc: "Tra i molti coraggiosi che hanno combattuto nella guerra contro [GetCountry('GRA').GetName] spicca [new_general.GetName], che si è distinto [new_general.GetHerselfHimself] per coraggio e abilità in battaglia. La [new_general.GetHerHis] reputazione precede ormai [new_general.GetHerHim] in tutta la [ROOT.GetCountry.GetFlavorRank], e molti sostengono che un simile talento vada ricompensato con un comando degno delle [new_general.GetHerHis] imprese."
 iberian_culture.2.a: "[new_general.GetSheHe|U] comanderà i nostri eserciti."
 iberian_culture.2.b: "Impiegheremo le [new_general.GetHerHis] abilità altrove."

 iberian_culture.3.title: "Insediamento nel Sud"
 iberian_culture.3.desc: "Ora che [ShowAreaName('granada_area')] è stata finalmente liberata dal dominio [ShowReligionGroupAdjective('muslim')], molte famiglie hanno iniziato a guardare a queste terre in cerca di opportunità. Di recente ci sono giunte notizie di gente di [origin_province.GetName], attratta dalle promesse di terre abbandonate e dalla possibilità di costruirsi una nuova vita a [target_province.GetName]."
 iberian_culture.3.a: "Permettiamo la loro migrazione."
 iberian_culture.3.b: "Cerchiamo di limitare il numero di coloni."

 iberian_culture.4.title: "Miracolo della Vergine Maria"
 iberian_culture.4.desc: "Si è diffusa la notizia di un miracolo che sarebbe avvenuto a [target_location.GetName]. Secondo i racconti locali, la Beata Vergine Maria è apparsa su un colle che domina l'insediamento. Sebbene alcuni siano scettici riguardo al miracolo, esso ha comunque attirato pellegrini da vicino e da lontano. Le strade sono ora affollate di viaggiatori dai quali la gente del posto trae avidamente profitto. Molte offerte sono affluite nelle casse locali, e come utilizzare questa nuova ricchezza è oggetto di acceso dibattito."
 iberian_culture.4.a: "Reinvestiamo il denaro in loco."
 iberian_culture.4.b: "Diamo le offerte [ROOT.GetCountry.Custom('IT_CLERGY_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 iberian_culture.4.c: "Distribuiamo l'elemosina ai poveri."
 iberian_culture.4.d: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] sovrintenderà a queste donazioni."

 iberian_culture.5.title: "Ritorno dai Mari del Nord"
 iberian_culture.5.desc: "I balenieri [ShowCultureName('basque')] sono tornati da un'altra spedizione nei lontani mari del nord. Dopo aver affrontato tempeste insidiose e acque ignote alla maggior parte dei marinai, hanno riportato a casa sia un carico prezioso sia un patrimonio di conoscenze pratiche. I membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] dibattono ora su come applicare questi insegnamenti."
 iberian_culture.5.a: "Ogni viaggio dovrebbe imparare dal precedente."
 iberian_culture.5.b: "L'oceano offre infinite opportunità."

 iberian_culture.6.title: "Abile Artista Mudéjar"
 iberian_culture.6.desc: "Ci è stato segnalato che [target_character.GetName], un abile artista [ShowReligionGroupAdjective('muslim')], sta guadagnando consensi in tutta la [ROOT.GetCountry.GetFlavorRank]. I membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggeriscono di invitare [target_character.GetHimHer] al nostro servizio, sebbene molti tra [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si oppongano a concedere un simile prestigio a un Mudéjar."
 iberian_culture.6.a: "Il talento non è definito dalla fede."
 iberian_culture.6.b: "Simili onori spettano ai sudditi [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]."

 iberian_culture.7.title: "Disputa al Mercato"
 iberian_culture.7.desc: "Sono esplose tensioni a [target_location.GetName], dove mercanti [ShowReligionAdjective('sunni')] e [ShowReligionAdjective('catholic')] si accusano a vicenda di ricevere un trattamento ingiusto da parte dei funzionari e delle corporazioni locali. È stato chiesto [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] di intervenire e mediare in questa disputa."
 iberian_culture.7.a: "La giustizia deve prevalere."
 iberian_culture.7.a.tt1: "Tutti i [pops|e] [ShowReligionAdjective('sunni')] a [target_location.GetName] ottengono [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.7.a.tt2: "Tutti i [pops|e] [ShowReligionAdjective('catholic')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.7.b: "Dobbiamo proteggere i nostri."
 iberian_culture.7.b.tt1: "Tutti i [pops|e] [ShowReligionAdjective('sunni')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.7.b.tt2: "Tutti i [pops|e] [ShowReligionAdjective('catholic')] a [target_location.GetName] ottengono [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.7.c: "Che la risolvano da soli."

 iberian_culture.8.title: "Disputa sulle Tradizioni Mudéjar"
 iberian_culture.8.desc: "A [target_location.GetName], la popolazione [ShowReligionAdjective('sunni')] locale si è radunata ancora una volta per celebrare una delle sue feste tradizionali, un'usanza che esiste da generazioni. Sebbene molti vedano i festeggiamenti come una parte innocua della vita quotidiana, i rappresentanti [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ci spingono a vietare queste celebrazioni, poiché simili manifestazioni pubbliche minano il carattere [ShowReligionAdjective('catholic')] della [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.8.a: "Lasciamo che la festa continui."
 iberian_culture.8.a.tt: "Tutti i [pops|e] [ShowReligionAdjective('sunni')] a [target_location.GetName] ottengono [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.8.b: "Poniamo fine ai festeggiamenti."
 iberian_culture.8.b.tt: "Tutti i [pops|e] [ShowReligionAdjective('sunni')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.9.title: "Prospero Quartiere Mudéjar"
 iberian_culture.9.desc: "Il quartiere Mudéjar di [target_location.GetName] è in fiore, e attira numerosi artigiani e mercanti la cui operosità ha portato nuova prosperità all'insediamento. Sebbene la sua crescente ricchezza giovi all'economia locale, alcune élite locali hanno iniziato a temere che la crescente influenza della comunità possa un giorno rivaleggiare con la loro."
 iberian_culture.9.a: "La prosperità giova a tutti."
 iberian_culture.9.b: "Sequestriamo una parte della loro ricchezza per limitarne l'influenza."
 iberian_culture.9.b.tt: "Tutti i [pops|e] [ShowReligionAdjective('sunni')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.10.title: "Rinomati Medici Mudéjar"
 iberian_culture.10.desc: "I medici Mudéjar hanno ottenuto di recente ampi consensi in tutta la [ROOT.GetCountry.GetFlavorRank], e molti membri [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] si ritrovano sempre più dipendenti dalla loro competenza. Alcuni dei nostri consiglieri suggeriscono ora di nominarli formalmente medici della [ROOT.GetCountry.GetGovernment.GetCourtTitle]; tuttavia, membri influenti [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si oppongono con fermezza a questa proposta."
 iberian_culture.10.a: "L'abilità conta più del credo."
 iberian_culture.10.b: "Nominiamo invece un medico [ShowReligionGroupAdjectiveWithNoTooltip('christian')|U]."

 iberian_culture.11.title: "Conversos Sotto Sospetto"
 iberian_culture.11.desc: "Alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] è giunta notizia che [target_character.GetName], un abile mercante la cui famiglia si era in precedenza convertita dall'[ShowReligionName('judaism')], è stato accusato di continuare a praticare in segreto i riti della precedente fede. Mentre il rapporto afferma che sono state osservate preghiere proibite e riunioni segrete, altri sostengono che queste accuse nascano da invidia e controversie per debiti."
 iberian_culture.11.a: "I nostri tribunali religiosi devono indagare su queste eresie."
 iberian_culture.11.b: "Sono accuse calunniose!"

 iberian_culture.12.title: "Mercanti [ShowCultureNameWithNoTooltip('sephardi')] Accusati"
 iberian_culture.12.desc: "Diversi importanti mercanti [ShowCultureName('sephardi')] di [target_location.GetName] sono stati accusati di accumulare ricchezze mediante pratiche illecite, come lo sfruttamento di lacune nella tassazione, il prestito a usura o la manipolazione dei prezzi a proprio vantaggio. Sebbene queste accuse provengano dai loro rivali commerciali e non possiamo sapere con certezza se siano vere, dobbiamo agire prima che il conflitto si inasprisca ulteriormente."
 iberian_culture.12.a: "Confischiamo le loro ricchezze."
 iberian_culture.12.a.tt: "Tutti i [pops|e] [ShowCultureName('sephardi')] [ShowPopTypeName('burghers')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.12.b: "Non possiamo agire senza prove."
 iberian_culture.12.b.tt: "Tutti i [pops|e] [ShowPopTypeName('burghers')] non [ShowCultureName('sephardi')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.13.title: "Contrastare il Caldo e la Peste"
 iberian_culture.13.desc: "Nelle regioni meridionali della nostra [ROOT.GetCountry.GetFlavorRank], la gente ha sviluppato la tradizione di imbiancare le proprie case con calce spenta per mantenerle fresche sotto il sole intenso. Si ritiene inoltre che aiuti a prevenire la diffusione delle malattie. La gente di [target_location.GetName] ha recentemente faticato a causa della mancanza di calce spenta, e si è rivolta [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] chiedendo aiuto per proteggere le proprie case."
 iberian_culture.13.a: "Assicuriamoci che ottengano abbastanza calce spenta."
 iberian_culture.13.a.tt: "Tutti i [pops|e] a [target_location.GetName] ottengono [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.13.b: "Non possiamo risparmiare una moneta."
 iberian_culture.13.b.tt: "Tutti i [pops|e] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.14.title: "Disputa sulle Cañadas Reales"
 iberian_culture.14.desc: "Con il mutare delle stagioni, milioni di pecore vengono condotte lungo le Cañadas Reales, le storiche vie regie della transumanza che attraversano la nostra campagna. Tuttavia, gli abitanti di [target_location.GetName] si rifiutano di lasciar passare i pastori attraverso il loro insediamento, temendo che gli animali calpestino i loro campi."
 iberian_culture.14.a: "Difendiamo l'antico diritto di passaggio dei pastori."
 iberian_culture.14.a.tt: "Tutti i [pops|e] [ShowPopTypeName('peasants')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.14.b: "Risolviamo la disputa a favore della popolazione locale."

 iberian_culture.15.title: "Scontro nel Tribunale delle Acque"
 iberian_culture.15.desc: "Il tradizionale Tribunale delle Acque si è occupato di recente di una disputa tra [target_location_1.GetName] e [target_location_2.GetName]. Sotto il sole cocente dell'estate, la regione non ha acqua a sufficienza per sostenere pienamente i campi di entrambi gli insediamenti, e i loro abitanti hanno litigato sui diritti di distribuzione."
 iberian_culture.15.a: "Si deve dare priorità a [target_location_1.GetNameWithNoTooltip]."
 iberian_culture.15.b: "I campi di [target_location_2.GetNameWithNoTooltip] sono più importanti."
 iberian_culture.15.c: "L'acqua sarà distribuita equamente."

 iberian_culture.16.title: "Difesa dei Fueros"
 iberian_culture.16.desc: "Il nostro esattore delle tasse inviato a [target_location.GetName] è stato fisicamente bloccato all'ingresso della città dai magistrati locali. Le élite regionali invocano i loro antichi #italic fueros#!, privilegi legali che le rendono completamente immuni dalle tasse [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] a meno che non siano esplicitamente approvate dalla loro assemblea."
 iberian_culture.16.a: "Rispettiamo le carte."
 iberian_culture.16.b: "Le necessità dello stato sono assolute!"

 iberian_culture.17.title: "Banditi della Sierra"
 iberian_culture.17.desc: "Alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] sono giunte notizie che fuorilegge pesantemente armati hanno preso il controllo degli impervi passi montani attorno a [target_location.GetName]. Continuano a saccheggiare carovane e carichi, il che soffoca gravemente il commercio in tutta la regione. Se lasciati senza controllo, più persone potrebbero essere incoraggiate a darsi al banditismo."
 iberian_culture.17.a: "Non abbiamo uomini da risparmiare."
 iberian_culture.17.b: "Organizziamo una spedizione per sgominarli."

 iberian_culture.18.title: "L'Arte Mudéjar"
 iberian_culture.18.desc: "Per secoli, la gente di [ShowRegionName('iberia_region')] ha ammirato lo stile architettonico [ShowReligionGroupAdjective('muslim')] prevalente ai tempi di al-'Andalus. Molti architetti hanno iniziato a incorporare varie tecniche dell'arte Mudéjar negli edifici romanici e gotici, siano esse la decorazione geometrica o gli ornamenti in stucco. Di recente, [target_artist.GetName], al servizio [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], ha chiesto al trono il permesso di incorporare questo stile nelle commissioni reali."
 iberian_culture.18.a: "Approviamo il loro lavoro."
 iberian_culture.18.b: "L'arte [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] non dovrebbe essere associata al trono."

 iberian_culture.19.title: "Il Gotico Ispanico"
 iberian_culture.19.desc: "Costruttori di tutta la [ROOT.GetCountry.GetFlavorRank] hanno iniziato a sviluppare uno stile architettonico diverso da qualunque altro nella Cristianità. Ispirati dalle slanciate cattedrali delle nazioni occidentali e dalle solide tradizioni edilizie delle nostre terre, hanno creato monumenti che proclamano tanto la gloria di Dio quanto la grandezza di [ROOT.GetCountry.GetName]. Questo stile, noto come Gotico Ispanico, potrebbe lasciare il proprio segno sul paesaggio per secoli, se decidessimo di patrocinarlo."
 iberian_culture.19.a: "Che la pietra proclami la nostra gloria!"
 iberian_culture.19.b: "Le nostre risorse sono meglio spese altrove."

 iberian_culture.20.title: "Il Protorrenacimiento"
 iberian_culture.20.desc: "Nuove idee artistiche note come [ShowInstitutionNameWithNoTooltip('renaissance')] hanno iniziato a raggiungere la nostra [ROOT.GetCountry.GetFlavorRank] da [ShowRegionName('italy_region')], e in risposta molti dei nostri architetti e pittori hanno intrecciato queste influenze con le nostre tradizioni native. Molti commissionano ora opere influenzate da questo stile emergente, e forse, se incoraggiato, questo nuovo movimento artistico potrebbe inaugurare un'epoca di prosperità e innovazione."
 iberian_culture.20.a: "Abbracciamo questa nuova tradizione."
 iberian_culture.20.b: "Preserviamo le nostre antiche tradizioni."

 iberian_culture.21.title: "Conversione dei Nuovi Cristiani"
 iberian_culture.21.desc: "Un numero considerevole di appartenenti alla popolazione [ShowReligionAdjective('judaism')] di [target_location.GetName] ha deciso di accettare volontariamente il battesimo nella fede [ShowReligionName('catholic')]. Mentre molti celebrano questi convertiti come prova del successo della Chiesa, altri restano scettici sulla loro sincerità, chiamandoli Nuovi Cristiani per distinguerli da coloro le cui famiglie professano da tempo la fede."
 iberian_culture.21.a: "Diamo loro il benvenuto nella fede."
 iberian_culture.21.b: "Costringiamone altri a convertirsi."
 iberian_culture.21.b.tt: "Tutti i [pops|e] [ShowReligionAdjective('judaism')] a [target_location.GetName] perdono [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.22.title: "La Corsa dei Tori"
 iberian_culture.22.desc: "Gli abitanti di [ShowLocationName('cuellar')], un insediamento che si ritiene vanti la più antica festa della corsa dei tori di [ShowRegionName('iberia_region')], faticano a finanziare la loro celebrazione annuale. Si sono rivolti [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] per i fondi, promettendo che, se li sovvenzioneremo, la festa sarà dedicata a [target_ruler.GetName] anziché alla Vergine del Rosario, la loro santa patrona che la festa celebra di solito."
 iberian_culture.22.a: "Dobbiamo aiutarli!"
 iberian_culture.22.b: "Non possiamo sostenere questa festività barbara!"
 iberian_culture.22.b.tt: "Tutti i [pops|e] a [ShowLocationName('cuellar')] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.23.title: "Il Culto degli Alumbrados"
 iberian_culture.23.desc: "Notizie inquietanti hanno iniziato a raggiungere la [ROOT.GetCountry.GetGovernment.GetCourtTitle] e la gerarchia ecclesiastica riguardo a una strana confraternita mistica, che sta silenziosamente guadagnando adepti in tutta la [ROOT.GetCountry.GetFlavorRank]. Chiamandosi gli Illuminati, sostengono che i veri fedeli possano ricevere l'illuminazione divina direttamente dallo Spirito Santo, rendendo superflui sacerdoti, sacramenti, pellegrinaggi e persino la Santa Messa. I rappresentanti [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] temono che i loro insegnamenti somiglino alle eresie protestanti, e chiedono di avviare un'indagine."
 iberian_culture.23.a: "Reprimiamo gli Illuminati."
 iberian_culture.23.b: "Non ogni voce nasconde un eretico."
 iberian_culture.23.b.tt: "Se lasciata senza controllo, l'influenza del Culto potrebbe diffondersi ulteriormente"

 iberian_culture.24.title: "La Maschera Cade"
 iberian_culture.24.desc: "La nostra riluttanza a indagare sulle voci riguardanti gli Illuminati si è rivelata un errore. L'influenza del Culto è cresciuta enormemente a [target_province.GetName], e i suoi adepti hanno apertamente confessato la propria adesione alle eresie [ShowReligionAdjective('lutheran')]. [ROOT.GetCountry.Custom('IT_CLERGY_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] accusa ora [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] di aver ignorato gli avvertimenti e le richieste di indagine, sostenendo che un'azione decisa avrebbe impedito questo scoppio di eresia."
 iberian_culture.24.a: "Non possiamo perseguitare ogni dissidente."
 iberian_culture.24.a.tt: "Il 15% di tutti i [pops|e] [ShowReligionAdjective('catholic')] a [target_province.GetName] si convertirà al [ShowReligionName('lutheran')]"
 iberian_culture.24.a.tt2: "Tutti i [pops|e] [ShowReligionAdjective('catholic')] a [target_province.GetName] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 iberian_culture.24.b: "Avevano ragione, e dobbiamo agire con prudenza."
 iberian_culture.24.b.tt: "Il 5% di tutti i [pops|e] [ShowReligionAdjective('catholic')] a [target_province.GetName] si convertirà al [ShowReligionName('lutheran')]"
 iberian_culture.24.b.tt2: "Tutti i [pops|e] a [target_province.GetName] perdono [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 iberian_culture.25.title: "Preservare i [ShowBuildingTypeNameWithNoTooltip('irrigation_systems')]"
 iberian_culture.25.desc: "Il dominio [ShowReligionGroupAdjective('muslim')] su [ShowAreaName('granada_area')] vide la costruzione di intricati [ShowBuildingTypeName('irrigation_systems')] che portano la preziosa acqua dalla Sierra Nevada ai campi e ai frutteti delle fertili valli. I combattimenti nella regione hanno inflitto danni significativi a questi sistemi, dai quali la popolazione locale dipende da tempo per il proprio sostentamento."
 iberian_culture.25.a: "Finanziamo la loro ricostruzione."
 iberian_culture.25.b: "Non possiamo permetterci questo investimento."

 iberian_culture.26.title: "La Via per Santiago"
 iberian_culture.26.desc: "Ogni anno migliaia di pellegrini si mettono in cammino per il lungo viaggio verso [ShowLocationName('santiago_compostela')]. Il loro passaggio ha portato prosperità a innumerevoli insediamenti, ma il viaggio resta difficile poiché molte strade e ponti lungo il percorso sono caduti in rovina. Gli abitanti di [target_location.GetName] hanno chiesto [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] di migliorare le strade che conducono a Compostela, sostenendo che ciò incoraggerebbe la devozione e rafforzerebbe il commercio in tutta la [ROOT.GetCountry.GetFlavorRank]."
 iberian_culture.26.a: "Non risparmiamo spese per i pellegrini."
 iberian_culture.26.b: "Al momento abbiamo priorità maggiori."

 iberian_culture.27.title: "Tradizione che Svanisce"
 iberian_culture.27.desc: "Per generazioni, i trovatori di [ShowAreaName('galicia_area')] hanno cantato le loro tradizionali #italic cantigas#! in [ShowDialectName('galician_dialect')], una prestigiosa lingua letteraria la cui influenza si estese ben oltre i confini di [ShowAreaNameWithNoTooltip('galicia_area')]. Tuttavia, poiché quella lingua non è la lingua della [ROOT.GetCountry.GetGovernment.GetCourtTitle] di [ROOT.GetCountry.GetName], questa tradizione sta lentamente svanendo."
 iberian_culture.27.a: "Patrociniamo la conservazione di questa tradizione."
 iberian_culture.27.b: "Rafforziamo l'uso della nostra lingua."

 iberian_culture.28.title: "Confraternite di Pescatori"
 iberian_culture.28.desc: "I pescatori di [target_location.GetName] si sono organizzati in una corporazione che chiamano Confraternita dei Pescatori. Il suo scopo, a quanto si riferisce, è la regolamentazione della pesca, la conservazione del sapere marittimo e la tutela degli interessi di coloro che sfidano le acque. È anche un pilastro della comunità locale, che garantisce resilienza nei momenti difficili fornendo aiuto ai suoi membri e alle loro famiglie."
 iberian_culture.28.a: "Rafforziamo la loro corporazione."
 iberian_culture.28.b: "Abbiamo bisogno della loro competenza per la marina."

 iberian_culture.29.title: "Prosperità della [ShowGoodsNameWithNoTooltip('silk')] Valenciana"
 iberian_culture.29.desc: "I tessitori di [ShowLocationName('valencia')] sono diventati famosi per i loro pregiati tessuti di [ShowGoodsName('silk')], ammirati in tutta [ShowContinentName('europe')]. La ricchezza generata da questa fiorente industria ha riempito le casse dei mercanti e [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')], sebbene la [ROOT.GetCountry.GetGovernment.GetCourtTitle] sia divisa su come impiegare questa ricchezza."
 iberian_culture.29.a: "Investiamola nell'industria locale."
 iberian_culture.29.b: "Queste ricchezze devono servire la [ROOT.GetCountry.GetFlavorRank]."

 iberian_culture.30.title: "I Vigneti della Rioja"
 iberian_culture.30.desc: "Lungo le fertili valli dell'Ebro, i vigneti della Rioja prosperano da generazioni. Queste terre producono vini di qualità eccezionale, e ciò ha attirato l'attenzione [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], che vedono ora l'opportunità di creare una grande industria espandendo i vigneti in tutta la [ROOT.GetCountry.GetFlavorRank], ma [ROOT.GetCountry.Custom('IT_PEASANTS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] protestano che ciò potrebbe sconvolgere le usanze locali che guidano la vinificazione da secoli."
 iberian_culture.30.a: "Diffondiamo i nostri vigneti."
 iberian_culture.30.b: "Proteggiamo le nostre tradizioni vinicole."
