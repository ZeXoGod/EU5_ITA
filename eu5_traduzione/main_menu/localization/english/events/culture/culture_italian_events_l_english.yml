l_english:
 italian_renaissance_culture.1.title: "Sfidare la [ShowGoodsNameWithNoTooltip('wool')] $FLO_ADJ$"
 italian_renaissance_culture.1.desc: "Da tempo le corporazioni mercantili di [ShowLocationName('florence')] dominano il commercio della [ShowGoodsName('wool')] in [ShowRegionName('italy_region')], ma la recente espansione della produzione [ROOT.GetCountry.Custom('IT_ADJ_FS')] di [ShowGoodsNameWithNoTooltip('wool')] ha alimentato tra i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] una crescente fiducia nel fatto che [ROOT.GetCountry.GetNameWithNoTooltip] possa contendere ai mercanti $FLO_ADJ$ il controllo che esercitano sui mercati.\n\nSe il [ROOT.GetCountry.GetGovernment.GetCourtTitle] fornirà un adeguato sostegno finanziario, alcuni tra i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] si sono offerti di fondare nuove corporazioni mercantili per rafforzare la crescente industria [ROOT.GetCountry.Custom('IT_ADJ_FS')] della [ShowGoodsNameWithNoTooltip('wool')]. Tuttavia, altri nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] preferiscono permettere ai [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] di mantenere l'autonomia sulla produzione della [ShowGoodsNameWithNoTooltip('wool')]."
 italian_renaissance_culture.1.a: "Affidiamo ai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] la fondazione delle corporazioni della [ShowGoodsNameWithNoTooltip('wool')]."
 italian_renaissance_culture.1.b: "Difendiamo l'autonomia dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] sulla produzione della [ShowGoodsNameWithNoTooltip('wool')]."
 ita_culture_rival_wool_guild_locations.tt: "Tutte le [locations|e] produttrici di [ShowGoodsNameWithNoTooltip('wool')] che possediamo in [ShowRegionName('italy_region')] riceveranno [ShowModifier('italian_culture_rival_wool_trade')] per 60 anni e saranno ampliate di #G +1.00#! se non sono già al livello massimo"

 italian_renaissance_culture.2.title: "Spopolamento delle campagne"
 italian_renaissance_culture.2.desc: "Da quando la [ShowSituationName('black_death')] si è abbattuta sulle nostre terre, molte aree rurali [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] sono state gravemente spopolate. Sebbene anche [target_location.GetName] sia stata duramente colpita dalla [ShowSituationNameWithNoTooltip('black_death')], molti membri sopravvissuti della nostra popolazione desiderano trasferirsi lì nella speranza di recuperare l'accesso a risorse essenziali, ora indisponibili a causa della peste.\n\nAnche se alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] vedono in ciò un'occasione per urbanizzare ulteriormente e ricostruire [target_location.GetNameWithNoTooltip], permettere ai [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] di abbandonare molte di queste aree rurali fondamentali [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetNameWithNoTooltip] potrebbe avere gravi conseguenze."
 italian_renaissance_culture.2.a: "Incoraggiamo ulteriormente il trasferimento verso [target_location.GetNameWithNoTooltip]."
 italian_renaissance_culture.2.b: "Distribuiamo aiuti alle campagne per rallentare le migrazioni."

 italian_renaissance_culture.3.title: "Riscoperta del pensiero [ShowCultureNameWithNoTooltip('greek_culture')] antico"
 italian_renaissance_culture.3.desc: "Da quando gli ideali della [ShowAgeName('age_2_renaissance')] si sono diffusi in [ShowRegionName('italy_region')], tra gli studiosi [ShowCultureGroupName('italian_group')] è cresciuto l'interesse per l'acquisizione e la traduzione della letteratura [ShowCultureName('greek_culture')] antica. Desiderosi di affermare [ROOT.GetCountry.GetNameWithNoTooltip] come uno degli stati più eminenti di [ShowRegionNameWithNoTooltip('italy_region')], molti consiglieri del [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno esortato [target_character.GetName] a sostenere il recupero di queste opere antiche."
 italian_renaissance_culture.3.a: "Incoraggiamo la riscoperta di queste arti!"
 italian_renaissance_culture.3.b: "Offriamo il pieno patrocinio dello stato."
 italian_renaissance_culture.3.c: "Restiamo fedeli alle nostre tradizioni."
 encourage_humanist_thought_for_rewards_tt: "Incoraggiare uno spostamento verso [ShowSocietyDirectionName('humanist')] offre inoltre a [ROOT.GetCountry.GetCapital.GetName] l'occasione di diventare un grande centro del pensiero [ShowSocietyDirectionNameWithNoTooltip('humanist')]"

 italian_renaissance_culture.4.title: "[target_location.GetNameWithNoTooltip], un centro dell'Umanesimo"
 italian_renaissance_culture.4.desc: "Da quando gli ideali della [ShowAgeName('age_2_renaissance')] si sono diffusi in [ShowRegionName('italy_region')], vi è stata una riscoperta della letteratura [ShowCultureName('greek_culture')] antica, tradotta da vari manoscritti tratti dagli archivi $BYZ_ADJ$. La riscoperta di questi testi antichi ha portato a un profondo mutamento tra molti filosofi in tutta [ShowRegionNameWithNoTooltip('italy_region')], ispirando un nuovo approccio all'Umanesimo. Con questi sforzi largamente sostenuti dal [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective], [target_location.GetName] è stata trasformata in uno dei principali centri della cultura [ShowSocietyDirectionName('humanist')] in tutta [ShowRegionNameWithNoTooltip('italy_region')], con molti studiosi che hanno preso dimora nel [target_location.GetRank.GetName]. Mentre gli ideali della [ShowAgeName('age_2_renaissance')] continuano a diffondersi, [target_location.GetNameWithNoTooltip] rimarrà senza dubbio una forza essenziale per la loro affermazione."
 italian_renaissance_culture.4.a: "[target_location.GetNameWithNoTooltip] diventerà un faro del pensiero [ShowSocietyDirectionNameWithNoTooltip('humanist')] in [ShowRegionNameWithNoTooltip('italy_region')]."
 italian_renaissance_culture.4.b: "Conteniamo la crescente diffusione del pensiero [ShowSocietyDirectionNameWithNoTooltip('humanist')]."

 italian_renaissance_culture.5.title: "Un artista emergente attira il [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 italian_renaissance_culture.5.desc: "Con la [ShowAgeName('age_2_renaissance')] che ha dato origine a molti nuovi artisti di rilievo in [ShowRegionName('italy_region')], alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno notato [target_artist.GetName], che ha attirato grande attenzione in tutta [ROOT.GetCountry.GetCapital.GetName]. Alcuni stretti consiglieri di [target_character.GetName] hanno esortato [target_character.GetHimHer] a patrocinare [target_artist.GetNameWithNoTooltip], poiché col tempo [target_artist.GetHeShe] potrebbe diventare uno degli artisti più talentuosi di tutta [ShowRegionNameWithNoTooltip('italy_region')]."
 italian_renaissance_culture.5.a: "Assumiamo [target_artist.GetHimHer] per il [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"
 italian_renaissance_culture.5.b: "Non ci servono i [target_artist.GetHisHer] servizi."

 italian_renaissance_culture.6.title: "Diffusione delle idee [ShowSocietyDirectionNameWithNoTooltip('humanist')] da [target_location.GetNameWithNoTooltip]"
 italian_renaissance_culture.6.desc: "Illustri studiosi di [target_location.GetNameWithNoTooltip], sostenitori delle idee [ShowSocietyDirectionName('humanist')], hanno preso dimora a [ROOT.GetCountry.GetCapital.GetName], cercando di diffondere tra la popolazione locale la letteratura antica [ShowCultureName('greek_culture')] appena tradotta. Mentre alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno mostrato interesse per i testi tradotti, altri hanno esortato a contenere le idee [ShowSocietyDirectionNameWithNoTooltip('humanist')] per evitare rischi di potenziale instabilità."
 italian_renaissance_culture.6.a: "Permettiamo agli studiosi di diffondere la letteratura tradotta."
 italian_renaissance_culture.6.b: "Limitiamo la diffusione della letteratura tradotta."

 italian_renaissance_culture.7.title: "Patrocinio nelle nuove arti"
 italian_renaissance_culture.7.desc: "Dopo la [ShowSituationName('black_death')], il clima commerciale per molti [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] si è rivelato oneroso, con merci più difficili da trasportare su lunghe distanze e una maggiore domanda di beni essenziali. Tuttavia, la diffusione della [ShowAgeName('age_2_renaissance')] ha portato molti tra i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] a patrocinare le nuove arti invece di concentrarsi esclusivamente sul commercio.\n\nPoiché il patrocinio artistico si dimostra un investimento prezioso per i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], alcuni hanno esortato il [ROOT.GetCountry.GetGovernment.GetCourtTitle] a sostenere ulteriormente la crescita di queste nuove arti."
 italian_renaissance_culture.7.a: "Patrociniamo la crescita di queste nuove arti."
 italian_renaissance_culture.7.b: "Destiniamo invece le entrate alle casse dello stato"

 italian_renaissance_culture.8.title: "Condottiero di spicco a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 italian_renaissance_culture.8.desc: "È giunta voce al [ROOT.GetCountry.GetGovernment.GetCourtTitle] che il celebre condottiero [target_character_2.GetNameWithNoTooltip] sia arrivato a [ROOT.GetCountry.GetCapital.GetName]. Avendo ottenuto diverse vittorie militari, l'arrivo di [target_character_2.GetNameWithNoTooltip] ha suscitato discussioni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] sull'opportunità di assicurarsi i [target_character_2.GetHisHer] servigi mentre [target_character_2.GetHeShe] si trova a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip], poiché le [target_character_2.GetHisHer] abilità militari potrebbero rivelarsi decisive qualora un conflitto raggiungesse [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName]."
 italian_renaissance_culture.8.a: "Assumiamo [target_character_2.GetNameWithNoTooltip] per garantire la sicurezza [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip]."
 italian_renaissance_culture.8.b: "Non abbiamo bisogno della [target_character_2.GetHisHer] perizia militare."

 italian_renaissance_culture.9.title: "La crescente influenza [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip] attira condottieri"
 italian_renaissance_culture.9.desc: "Con l'espansione dell'influenza [ROOT.GetCountry.Custom('IT_ADJ_FS')] su [ShowRegionName('italy_region')], molte compagnie mercenarie di condottieri hanno contattato il [ROOT.GetCountry.GetGovernment.GetCourtTitle] nella speranza di ottenere un impiego. Mentre alcuni membri del [ROOT.GetCountry.GetGovernment.GetCourtTitle] sono favorevoli ad assumerli, poiché l'espansione [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip] ha reso più costoso reclutare un esercito, altri temono che questi condottieri agiscano per puro opportunismo, cercando di rendersi indispensabili favorendo un'eccessiva dipendenza dai loro soldati."
 italian_renaissance_culture.9.a: "Proviamo a ingraziarci questi condottieri mercenari e ad assumerli."
 italian_renaissance_culture.9.b: "Non possiamo rischiare di indebitarci con queste compagnie."

 italian_renaissance_culture.10.title: "[condottieri_company.GetNameWithNoTooltip] chiedono un pagamento maggiore"
 italian_renaissance_culture.10.desc: "I celebri condottieri [condottieri_company.GetName] hanno inviato una richiesta formale al [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective] per un aumento dei loro compensi, convinti che lo stato non li abbia ricompensati a sufficienza per i loro talenti.\n\nSebbene sia improbabile che i [condottieri_company.GetNameWithNoTooltip] tradiscano apertamente il loro accordo con [ROOT.GetCountry.GetNameWithNoTooltip], rifiutare di soddisfare le loro richieste potrebbe rendere la compagnia meno affidabile."
 italian_renaissance_culture.10.a: "Accogliamo le richieste di [condottieri_company.GetNameWithNoTooltip]."
 italian_renaissance_culture.10.b: "Rifiutiamo di concedere pagamenti aggiuntivi a [condottieri_company.GetNameWithNoTooltip]."

 italian_renaissance_culture.11.title: "Diffusione della cultura $FLO_ADJ$"
 italian_renaissance_culture.11.desc: "Sebbene [ROOT.GetCountry.GetCapital.GetName] sia un influente [ROOT.GetCountry.GetCapital.GetRank.GetName], non è un segreto che non regga il confronto con la celebre [ShowLocationName('florence')], cresciuta fino a diventare una [ShowLocationRankName('city')] dominante in [ShowRegionNameWithNoTooltip('italy_region')].\n\nNel tentativo di accrescere il prestigio di [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip], alcuni membri del [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito di adottare aspetti della nuova architettura culturale di [ShowLocationNameWithNoTooltip('florence')]."
 italian_renaissance_culture.11.a: "Adottiamo aspetti della cultura $FLO_ADJ$."
 italian_renaissance_culture.11.b: "Salvaguardiamo la cultura peculiare di [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."

 italian_renaissance_culture.12.title: "Rivitalizzare i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]"
 italian_renaissance_culture.12.desc: "Sebbene tutte le classi sociali [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] siano state colpite dalla [ShowSituationName('black_death')], nessuna è rimasta più devastata dei [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]. Mentre negli anni successivi molti tra i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno iniziato a investire nell'arte della [ShowAgeName('age_2_renaissance')], portando a una rinascita culturale dell'élite [ROOT.GetCountry.Custom('IT_ADJ_FS')], molti dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] sono rimasti in larga parte stremati dagli effetti della [ShowSituationNameWithNoTooltip('black_death')].\n\nPer contribuire a rivitalizzare i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] duramente colpiti, alcune voci solidali all'interno del [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito di ridurre drasticamente il nostro patrocinio delle arti a favore dello stanziamento di fondi per aiutarli a riprendersi."
 italian_renaissance_culture.12.a: "Il nostro patrocinio delle arti continuerà senza ostacoli."
 italian_renaissance_culture.12.b: "Dirottiamo fondi per aiutare i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] indeboliti."

 italian_renaissance_culture.13.title: "[target_artist.GetNameWithNoTooltip] traduce un antico manoscritto [ShowCultureNameWithNoTooltip('greek_culture')]"
 italian_renaissance_culture.13.desc: "La traduzione completata da [target_artist.GetName] di un antico manoscritto [ShowCultureName('greek_culture')] ha attirato l'attenzione degli studiosi [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName], molti dei quali desiderano mettere le mani sull'opera tradotta. Tuttavia, vedendo in ciò un'occasione per rafforzare il prestigio [ROOT.GetCountry.GetAdjectiveWithNoTooltip], alcuni hanno esortato [target_character.GetName] a sostenere la diffusione del manoscritto tradotto in [ShowContinentName('europe')]."
 italian_renaissance_culture.13.a: "Elogiamo [target_artist.GetNameWithNoTooltip] per il [target_artist.GetHisHer] lavoro di traduzione!"
 italian_renaissance_culture.13.b: "Diffondiamo la [target_artist.GetHisHer] opera ovunque!"
 italian_renaissance_culture.13.c: "Teniamola riservata a chi si trova nel [ROOT.GetCountry.GetGovernment.GetCourtTitle]."

 italian_renaissance_culture.14.title: "Le abilità di [target_artist.GetNameWithNoTooltip] impressionano il [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 italian_renaissance_culture.14.desc: "Da quando ha ottenuto il patrocinio del [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_artist.GetName] si è rivelato una risorsa preziosa per [target_character.GetName], e le [target_artist.GetHisHer] abilità hanno suscitato lodi ai vertici della società. Dai membri di alto rango dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] agli influenti [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], la presenza di [target_artist.GetNameWithNoTooltip] si è fatta sentire e si è dimostrata un grande vantaggio per l'influenza di [target_character.GetNameWithNoTooltip]."
 italian_renaissance_culture.14.a: "Le [target_artist.GetHisHer|U] opere hanno arricchito enormemente il [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"

 italian_renaissance_culture.15.title: "[ShowArtistTypeName('architect')] di crescente fama"
 italian_renaissance_culture.15.desc: "Avendo già completato diversi progetti architettonici a [ROOT.GetCountry.GetCapital.GetName], [target_artist.GetName] ha accresciuto la [target_artist.GetHisHer] fama [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] e ha già attirato il patrocinio di molte famiglie eminenti tra i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. Alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] ritengono che dovremmo impiegare [target_artist.GetHimHer], poiché [target_artist.GetHeShe] potrebbe rivelarsi un catalizzatore decisivo nella pianificazione di una rinascita architettonica di [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] attraverso le [target_artist.GetHerHis] tecniche architettoniche classiche."
 italian_renaissance_culture.15.a: "Offriamo a [target_artist.GetHimHer] il patrocinio dello stato."
 italian_renaissance_culture.15.b: "Non abbiamo interesse a perseguire progetti architettonici."

 italian_renaissance_culture.16.title: "[target_artist.GetNameWithNoTooltip] richiede ulteriori risorse del [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 italian_renaissance_culture.16.desc: "A metà della creazione di un'opera ispirata alle arti classiche, [target_artist.GetName] ha chiesto che il [ROOT.GetCountry.GetGovernment.GetCourtTitle] fornisca a [target_artist.GetHimHer] risorse aggiuntive. Avendo dichiarato che l'impresa si è rivelata più impegnativa del previsto, [target_artist.GetHeShe] promette che i finanziamenti extra per il [target_artist.GetHisHer] progetto varranno ampiamente il costo e porteranno fama culturale al [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.16.a: "Offriamo a [target_artist.GetHimHer] le risorse aggiuntive di cui [target_artist.GetHeShe] ha bisogno."
 italian_renaissance_culture.16.b: "Non possiamo permettercelo."

 italian_renaissance_culture.17.title: "[target_rival_artist.GetArtistType.GetNameWithNoTooltip] scontento [target_rival.Custom('IT_In')][target_rival.GetNameWithNoTooltip]"
 italian_renaissance_culture.17.desc: "Sebbene [target_rival_artist.GetName] sia al servizio del nostro rivale, [target_rival.Custom('IT_La')][target_rival.GetName], [target_rival_artist.GetHeShe] ha acquisito una certa fama in tutta [ShowRegionName('italy_region')] per le [target_rival_artist.GetHisHer] opere. Di recente, tuttavia, si sono diffuse voci secondo cui [target_rival_artist.GetHeShe] sarebbe insoddisfatto del patrocinio fornito [target_rival.Custom('IT_Dalla')][target_rival.GetNameWithNoTooltip].\n\nVedendo un'opportunità sia per indebolire l'influenza [target_rival.Custom('IT_Della')][target_rival.GetNameWithNoTooltip] sia per assicurarsi i servizi di un rinomato [target_rival_artist.GetArtistType.GetName], alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] ci hanno esortato a organizzare un accordo segreto con [target_rival_artist.GetNameWithNoTooltip] nella speranza che [target_rival_artist.GetHeShe] si unisca al nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.17.a: "Muoviamoci rapidamente per assumere [target_rival_artist.GetNameWithNoTooltip]!"
 italian_renaissance_culture.17.b: "Non possiamo rischiare di assumere artisti legati [target_rival.Custom('IT_Alla')][target_rival.GetNameWithNoTooltip]."

 italian_renaissance_culture.18.title: "[target_artist.GetNameWithNoTooltip] e l'arte della pittura a olio"
 italian_renaissance_culture.18.desc: "Sebbene gli artisti $FLA_ADJ$ abbiano prodotto dipinti a olio unici, la conoscenza di questa tecnica è rimasta a lungo confinata nei Paesi Bassi. Tuttavia, [target_artist.GetName] è recentemente tornato dai Paesi Bassi a [ROOT.GetCountry.GetCapital.GetName] con la speranza di coltivare una distinta tradizione [ShowCultureGroupName('italian_group')] della pittura a olio.\n\nInteressati ad aiutare [target_artist.GetHimHer] a sviluppare questa tradizione in [ShowRegionName('italy_region')], molti tra i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno esortato [target_character.GetName] a concedere patrocinio a [target_artist.GetHimHer]."
 italian_renaissance_culture.18.a: "La [target_artist.GetHisHer|U] distinta forma d'arte merita patrocinio!"
 italian_renaissance_culture.18.b: "Non siamo interessati alla [target_artist.GetHisHer] forma di pittura."

 italian_renaissance_culture.19.title: "[target_artist.GetNameWithNoTooltip] di [ShowLocationNameWithNoTooltip('florence')]"
 italian_renaissance_culture.19.desc: "Avendo ottenuto fama regionale per le [target_artist.GetHisHer] opere a [ShowLocationName('florence')], [target_artist.GetName] è arrivato a [ROOT.GetCountry.GetCapital.GetName], accettando alcune commissioni per membri dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Tuttavia, la [target_artist.GetHisHer] presenza a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] ha attirato l'attenzione dei [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], che hanno espresso grande interesse per le [target_artist.GetHisHer] opere e hanno chiesto che il [ROOT.GetCountry.GetGovernment.GetCourtTitle] commissioni [target_artist.GetHimHer] nella speranza di prolungare la [target_artist.GetHisHer] permanenza a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip].\n\nDetto ciò, essendo un importante [ShowArtistTypeName('philosopher')] di [ShowLocationNameWithNoTooltip('florence')], [target_artist.GetNameWithNoTooltip] si aspetterà risorse superiori a quelle che il [ROOT.GetCountry.GetGovernment.GetCourtTitle] fornisce di solito."
 italian_renaissance_culture.19.a: "Costoso, ma la [target_artist.GetHisHer] esperienza sarà ben accolta."
 italian_renaissance_culture.19.b: "[target_artist.GetShortNameWithNoTooltip] è troppo costoso per il [ROOT.GetCountry.GetGovernment.GetCourtTitle]."

 italian_renaissance_culture.20.title: "Il [target_country.GetLongNameWithNoTooltip] richiede [target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.20.desc: "Mentre la fama di [target_artist.GetName] si estende oltre [ShowRegionName('italy_region')], il [target_country.GetGovernment.GetCourtTitle] del [target_country.GetLongName] ha contattato [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] nella speranza di assicurarsi i servizi di [target_artist.GetNameWithNoTooltip]. Impressionato dai racconti sulle opere di [target_artist.GetNameWithNoTooltip], il [target_country.GetGovernment.GetCourtTitle] [target_country.GetAdjectiveWithNoTooltip] è disposto a pagare una somma considerevole, se [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetNameWithNoTooltip] accetterà di permettere a [target_artist.GetNameWithNoTooltip] di prendere dimora [target_country.Custom('IT_In')][target_country.GetNameWithNoTooltip]."
 italian_renaissance_culture.20.a: "Accettiamo le monete [target_country.Custom('IT_ADJ_FP')] in cambio di [target_artist.GetShortNameWithNoTooltip]."
 italian_renaissance_culture.20.b: "Conserviamo il patrocinio esclusivo di [target_artist.GetShortNameWithNoTooltip]."

 italian_renaissance_culture.21.title: "Il patrocinio artistico della [ShowAgeNameWithNoTooltip('age_2_renaissance')] è troppo costoso"
 italian_renaissance_culture.21.desc: "Sebbene [ROOT.GetCountry.GetName] abbia offerto un ampio patrocinio alle nuove arti della [ShowAgeName('age_2_renaissance')], col tempo questo patrocinio si è rivelato dannoso per lo stato. Il tesoro [ROOT.GetCountry.GetAdjectiveWithNoTooltip] ora rischia una crisi finanziaria se non interveniamo, anche se alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] credono ancora che continuare il patrocinio porterà benefici nel lungo periodo."
 italian_renaissance_culture.21.a: "Riduciamo il patrocinio statale delle arti per preservare il tesoro."
 italian_renaissance_culture.21.b: "Dobbiamo continuare il nostro patrocinio delle arti!"

 italian_renaissance_culture.22.title: "[target_location.GetNameWithNoTooltip], un centro dell'arte e della cultura della [ShowAgeNameWithNoTooltip('age_2_renaissance')]"
 italian_renaissance_culture.22.desc: "Sebbene si sia rivelato un impegno finanziario significativo per il [ROOT.GetCountry.GetLongName], [target_location.GetName] è cresciuta fino a diventare uno dei centri chiave dell'arte della [ShowAgeName('age_2_renaissance')] in [ShowRegionName('italy_region')], se non in tutta [ShowContinentName('europe')]. Artisti e studiosi eminenti da tutta [ShowContinentNameWithNoTooltip('europe')] sono ansiosi di visitare [target_location.GetRank.GetName], e molti diffondono racconti su come [target_location.GetNameWithNoTooltip] sia stata trasformata da quest'epoca."
 italian_renaissance_culture.22.a: "[target_location.GetNameWithNoTooltip] risplenderà come centro di arte e cultura nei secoli a venire!"
 italian_renaissance_culture.22.b: "Sfruttiamo la nuova fama di [target_location.GetNameWithNoTooltip] per rafforzare il nostro prestigio"

 italian_renaissance_culture.23.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_on_the_fates_of_famous_men')]"
 italian_renaissance_culture.23.desc: "[target_artist.GetName], una delle figure di spicco della [ShowAgeName('age_2_renaissance')], ha completato un'altra opera impressionante. Intitolata [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')], tratta di molte persone eminenti delle epoche biblica e classica, oltre che di figure chiave del secolo scorso. Una raccolta davvero raffinata: se il [ROOT.GetCountry.GetGovernment.GetCourtTitle] desiderasse separarsene, l'opera di [target_artist.GetLastNameWithNoTooltip] probabilmente frutterebbe una somma considerevole."
 italian_renaissance_culture.23.a: "Una meravigliosa raccolta di figure storiche."
 italian_renaissance_culture.23.b: "Offriamo la [target_artist.GetHisHer] opera ai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] a caro prezzo."

 italian_renaissance_culture.24.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_the_decameron')]"
 italian_renaissance_culture.24.desc: "Avendo assistito agli orrori della [ShowSituationName('black_death')], [target_artist.GetName] trovò l'ispirazione per completare  [ShowWorkOfArtName('boccaccio_the_decameron')], attirando un notevole interesse da parte dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]. Ambientata a [ShowLocationName('florence')], la storia segue dieci individui $FLO_ADJ$ che fuggono in campagna per scampare alla peste. Alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] credono che dovremmo impegnarci a diffondere l'opera di [target_artist.GetLastNameWithNoTooltip] in lungo e in largo."
 italian_renaissance_culture.24.a: "Una raccolta di storie affascinante! Dovremmo diffondere la [target_artist.GetHisHer] opera."
 italian_renaissance_culture.24.b: "Offriamo la proprietà dell'opera ai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."

 italian_renaissance_culture.25.title: "[ShowWorkOfArtNameWithNoTooltip('boccaccio_concerning_famous_women')]"
 italian_renaissance_culture.25.desc: "Sulla scia della [target_artist.GetHisHer] opera precedente, [ShowWorkOfArtName('boccaccio_on_the_fates_of_famous_men')], [target_artist.GetName] ha pubblicato un altro volume su figure celebri della storia, questa volta però incentrato su donne eminenti. Gran parte del [ROOT.GetCountry.GetGovernment.GetCourtTitle] è sorpresa dall'interesse che [target_artist.GetLastNameWithNoTooltip] ha mostrato per queste figure, ma come molte delle [target_artist.GetHisHer] opere precedenti, [ShowWorkOfArtName('boccaccio_concerning_famous_women')] si dimostrerebbe senza dubbio un bene prezioso qualora le nostre finanze scarseggiassero."
 italian_renaissance_culture.25.a: "Resterà un'opera preziosa all'interno del [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.25.b: "Organizziamo un'asta del [ROOT.GetCountry.GetGovernment.GetCourtTitle] per vendere il [ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]."

 italian_renaissance_culture.26.title: "Ascesa di [target_character_2.GetNameWithNoTooltip]"
 italian_renaissance_culture.26.desc: "Avendo svolto per qualche tempo un ruolo influente a [ShowLocationName('florence')], [target_character_2.GetName] si è dimostrato sia una persona competente sia un diffusore del pensiero [ShowSocietyDirectionName('humanist')] della [ShowAgeName('age_2_renaissance')]. Poiché [target_character_2.GetNameWithNoTooltip] ha ottenuto lodi e apprezzamento dai membri del [ROOT.GetCountry.GetGovernment.GetCourtTitle], alcuni hanno suggerito che [target_character.GetName] conceda a [target_character_2.GetNameWithNoTooltip] una posizione speciale nel [ROOT.GetCountry.GetGovernment.GetCabinetTitle]."
 italian_renaissance_culture.26.a: "Affidiamo a [target_character_2.GetHimHer] un ruolo nel [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.26.b: "[target_character_2.GetHeShe] sarebbe un ottimo [ROOT.GetCountry.GetGovernment.GetCabinetMemberTitle] del [ROOT.GetCountry.GetGovernment.GetCabinetTitle]."
 italian_renaissance_culture.26.c: "Non concediamo alcun privilegio speciale a [target_character_2.GetHimHer]."

 italian_renaissance_culture.27.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.27.desc: "Sebbene [target_artist.GetHeShe] abbia ottenuto riconoscimento in tutta [ShowRegionName('italy_region')] negli ultimi anni, la recente residenza di [target_artist.GetName] a [ROOT.GetCountry.GetCapital.GetName] ha portato il suo nome alla ribalta in tutto il [ROOT.GetCountry.GetCapital.GetRank.GetName], con molti tra la popolazione più agiata che hanno abbracciato la [target_artist.GetHisHer] particolare forma di istruzione secolare. Mentre alcuni dei [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] hanno espresso fastidio per le [target_artist.GetHisHer] pratiche didattiche, altri hanno esortato [target_character.GetName] a offrire a [target_artist.GetNameWithNoTooltip] piena residenza [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName]."
 italian_renaissance_culture.27.a: "Assumiamo [target_artist.GetHimHer]!"
 italian_renaissance_culture.27.b: "Le [target_artist.GetHisHer|U] idee sono troppo radicali."

 italian_renaissance_culture.28.title: "Fondazione della Casa Gioiosa"
 italian_renaissance_culture.28.desc: "Da quando ha ottenuto piena residenza [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName], [target_artist.GetName] ha portato i [target_artist.GetHisHer] insegnamenti a molti all'interno di [target_location.GetName]. Grazie alla [target_artist.GetHisHer] fama e influenza a [target_location.GetNameWithNoTooltip], [target_artist.GetNameWithNoTooltip] ora cerca aiuti finanziari dal [ROOT.GetCountry.GetGovernment.GetCourtTitle] per fondare una nuova scuola, la #italic Casa Gioiosa#!.\n\nSebbene sarebbe un'impresa costosa, una nuova [ShowBuildingTypeNameWithNoTooltip('art_school')] a [target_location.GetNameWithNoTooltip] accrescerebbe il prestigio [ROOT.GetCountry.GetAdjectiveWithNoTooltip] in tutta [ShowRegionName('italy_region')]."
 italian_renaissance_culture.28.a: "Commissioniamo la fondazione di [ShowBuildingTypeNameWithNoTooltip('art_school')]!"
 italian_renaissance_culture.28.b: "Sosteniamo invece la fondazione della Casa Gioiosa come nuova [ShowBuildingTypeNameWithNoTooltip('university')]."
 italian_renaissance_culture.28.c: "Non abbiamo i fondi per il progetto."

 italian_renaissance_culture.29.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.29.desc: "Illustre allievo di [target_artist_2.GetName], [target_artist.GetName] si è guadagnato la reputazione di essere uno dei principali studiosi di [ShowRegionName('italy_region')] ed è particolarmente abile nel tradurre manoscritti [ShowCultureName('greek_culture')] antichi. Ora che [target_artist.GetNameWithNoTooltip] è arrivato a [ROOT.GetCountry.GetCapital.GetName], [target_artist.GetSheHe] ha espresso interesse ad assicurarsi il patrocinio del [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective] per continuare questo lavoro sui manoscritti [ShowCultureNameWithNoTooltip('greek_culture')] recentemente riportati alla luce."
 italian_renaissance_culture.29.a: "Assumiamo [target_artist.GetHimHer]!"
 italian_renaissance_culture.29.b: "Non vogliamo patrocinare la [target_artist.GetHisHer] opera!"

 italian_renaissance_culture.30.title: "[target_artist.GetNameWithNoTooltip]"
 italian_renaissance_culture.30.desc: "Sebbene la diffusione della pittura a olio in [ShowRegionName('italy_region')] sia ancora in gran parte agli inizi, il [ShowArtistTypeName('painter')] [target_artist.GetName] si è distinto tra i suoi praticanti più abili, con molti dei [target_artist.GetHisHer] dipinti già divenuti beni preziosi di varie corti [ShowCultureGroupName('italian_group')].\n\nMolti dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e dei [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno esortato [target_character.GetName] a offrire patrocinio per adornare il [ROOT.GetCountry.GetGovernment.GetCourtTitle] con i [target_artist.GetHisHer] dipinti unici."
 italian_renaissance_culture.30.a: "I [target_artist.GetHisHer|U] dipinti rafforzerebbero il prestigio del [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 italian_renaissance_culture.30.b: "Non possiamo permetterci il patrocinio di [target_artist.GetHimHer]."
