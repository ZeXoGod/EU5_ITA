l_english:
 culture_greek.1.title: "Disputa con [target_character.GetNameWithNoTooltip]"
 culture_greek.1.desc: "Sebbene la nostra posizione di orgogliosa nazione [ROOT.GetCountry.GetReligion.GetAdjective] sia chiara a molti dei nostri vicini, sembra che vi siano alcuni problemi interni al nostro Patriarcato.\n\n[target_character.GetName] ha notato la negligenza di [target_character2.GetName] nei [target_character2.GetHerHis] doveri religiosi. [target_character.GetSheHe|U] cita il maltrattamento di [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], la condotta scorretta durante le cerimonie religiose e una generale mancanza di rispetto per la cultura religiosa [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] della nostra nazione.\n\nSebbene molti ritengano che queste accuse siano esagerate, la gente è comunque ben consapevole della negligenza di [target_character2.GetNameWithNoTooltip] e di come [target_character2.GetSheHe] si consideri [target_character2.GetHerselfHimself] al di sopra di qualsiasi istituzione religiosa. È questo che ha spinto alcuni dei nostri cittadini [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] a considerare [target_character2.GetHerHim] illegittimo e indegno del titolo di [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 culture_greek.1.a: "[ROOT.GetCountry.Custom('IT_CLERGY_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] non sanno di cosa parlano!"
 culture_greek.1.b: "Forse dovremmo limitare maggiormente [target_character2.GetNameWithNoTooltip]."
 culture_greek.1.c: "Nessuno metterà in dubbio la legittimità di [target_character2.GetNameWithNoTooltip]!"
 culture_greek.1.d: "Un discorso placherà certamente i loro sospetti."


 culture_greek.2.title: "Il Patriarca Benedice [target_character2.GetNameWithNoTooltip]"
 culture_greek.2.desc: "L'eleganza e l'ordine di [ROOT.GetCountry.GetName] hanno suscitato l'interesse di [target_character.GetName] per l'approccio di [target_character2.GetName] al governo. Giunto per la prima volta a [target_capital.GetName], [target_character.GetSheHe] è rimasto colpito da quanta attenzione ai dettagli sia stata dedicata alla preservazione dei pilastri religiosi di [ROOT.GetCountry.GetReligion.GetName]. I monasteri sono ben tenuti e adornati con tutte le ricchezze che [ROOT.GetCountry.GetGovernment.GetGovernmentType.GetName] ha potuto raccogliere; i cittadini ammirano i kandylakia di marmo lungo le strade, ricordando storie di cari perduti o i miracoli che li hanno aiutati a sopravvivere nei momenti di crisi.\n\nNella [ROOT.GetCountry.GetGovernment.GetCourtTitle], molti membri recitano la Bibbia e si possono trovare in preghiera davanti alle icone del Messia in persona. L'odore dell'incenso riempie l'aria mentre [target_character.GetNameWithNoTooltip] si avvicina alla sala in cui [target_character2.GetNameWithNoTooltip] discute di politica."
 culture_greek.2.a: "La benedizione del Patriarca è garantita."
 culture_greek.2.b: "Una benedizione non basta. Dobbiamo impegnarci di più a [target_capital.GetNameWithNoTooltip]."

 culture_greek.3.title: "La Riforma in [target_country.GetNameWithNoTooltip]"
 culture_greek.3.desc: "Con l'ondata della Riforma che attraversa [ShowContinentName('europe')], persone come [target_character.GetName] si sono interessate a stabilire relazioni diplomatiche con riformatori come [target_country.GetName], che si oppongono all'istituzione papale.\n\nDopo alcune discussioni, ci è chiaro che abbiamo davvero un nemico in comune: anche loro desiderano liberarsi dei modi corrotti di [papal_capital.GetName] e riconquistare l'autonomia di [target_country.Custom('IT_CROWN_DEL')][target_country.GetGovernment.GetEstateName('crown_estate')]. Tuttavia, vi sono ancora differenze che la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] non può tollerare: i segni che il [ShowReligionName('catholic')] ha lasciato sulle loro terre."
 culture_greek.3.a: "Il nemico del mio nemico è mio amico."
 culture_greek.3.b: "Non abbiamo bisogno dell'aiuto degli eretici."
 culture_greek.3.c: "[target_character2.GetShortNameWithNoTooltip] ci ha fatti passare per sciocchi!"

 culture_greek.4.title: "La Questione dell'«[ShowCultureNameWithNoTooltip('greek_culture')]»"
 culture_greek.4.desc: "L'ascesa dell'assolutismo e il concetto di stato e del suo popolo stanno plasmando il modo di pensare della nostra attuale popolazione. In passato simili questioni non sarebbero state considerate apertamente, poiché la religione dava forma principalmente alla cultura. Ma ora, con grandi pensatori che provengono dagli strati inferiori, molti all'interno delle nostre istituzioni educative si pongono una domanda: che cos'è l'[ShowCultureNameWithNoTooltip('greek_culture')]?\n\nAlcuni sostengono che la diglossia presente nella lingua di [ROOT.GetCountry.GetName] mantenga una divisione, in cui i burocrati e [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sono separati in quasi ogni aspetto da [ROOT.GetCountry.Custom('IT_PEASANTS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] a causa di maniere completamente diverse e di dialetti differenti.\n\nQuesta situazione ha lentamente radicalizzato molti, che hanno chiesto un cambiamento per sanare questa divisione e unificare davvero la nazione."
 culture_greek.4.a: "Lentamente ma inesorabilmente, possiamo unire il popolo."
 culture_greek.4.b: "Apportare simili cambiamenti destabilizzerebbe la nostra attuale struttura di potere."
 culture_greek.4.c: "Non vi sono differenze culturali, solo diverse varianti della stessa cultura."
 greek_culture_greek_peasants_will_gain_satisfaction: "Ogni [pops|e] di [culture|e] [ShowCultureGroupName('greek_group')] nelle località che non sono [rural_locations|e] e che sia [ShowPopTypeName('peasants')] o [ShowPopTypeName('laborers')] otterrà [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"

 culture_greek.5.title: "L'Ascesa di [target_character.GetNameWithNoTooltip]"
 culture_greek.5.desc: "Avendo ottenuto molte vittorie, come a [victory_location1.GetName] o a [victory_location2.GetName], la gente ha iniziato a venerare [target_character.GetHerHim] come un brillante strategos, uno che sconfigge con la spada i nemici di [ROOT.GetCountry.GetName], versandone il sangue nel nome del Signore e di [target_character2.GetName].\n\nDopo aver parlato con molti membri influenti della [ROOT.GetCountry.GetGovernment.GetCourtTitle], sembra che anch'essi rispettino [target_character.GetHerHim] e siano incuriositi dai [target_character.GetHerHis] racconti sulla Battaglia di [victory_location3.GetName] — l'ultima storia di cui tutti discutono. [target_character2.GetNameWithNoTooltip] si sente in qualche modo minacciato da questa fama, poiché [target_character2.GetSheHe] avverte che l'influenza della [ROOT.GetCountry.GetGovernment.GetCourtTitle] si sta spostando verso questo strategos. Forse, tuttavia, può essere usata per rafforzare ulteriormente il governo della dinastia [target_character2.GetDynasty.GetName] su [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.5.a: "Celebriamo eroi come lui."
 culture_greek.5.b: "Dovremmo limitare l'influenza di [target_character.GetShortNameWithNoTooltip]."
 culture_greek.5.c: "Teniamo [target_character.GetHerHim] #italic giusto#! abbastanza vicino a noi, ma il più lontano possibile dalla politica."
 greek_culture_strategos_will_never_be_able_to_influence_politics: "Negando a [target_character.GetName] la possibilità di influenzare i [courtiers|e], ci assicureremo che [target_character.GetSheHe] non ordisca un colpo di stato contro di noi in futuro"
 greek_culture_strategos_will_never_get_the_opportunity_to_coup: "[target_character.GetName] non avrà mai l'occasione di influenzare i [courtiers|e], il che significa che [target_character.GetSheHe] non potrà mai lanciare un colpo di stato contro di noi"

 culture_greek.6.title: "Lo Strategos del Popolo"
 culture_greek.6.desc: "Mentre il celebre strategos [target_character.GetName] percorre le strade di [target_capital.GetName] con la [target_character.GetHerHis] guardia personale, le folle si radunano per vedere di persona questa mente strategica.\n\n[ROOT.GetCountry.Custom('IT_PEASANTS_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] e [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] alzano insieme le voci in un coro unanime, gridando il [target_character.GetHerHis] nome: '[target_character.GetShortNameWithNoTooltip]!'. Alcune voci più sommesse mormorano anche tra la folla, dicendo che [target_character.GetSheHe] sarebbe un governante meno corrotto, uno che ascolterebbe davvero il popolo. Le voci di questi discorsi hanno raggiunto la [ROOT.GetCountry.GetGovernment.GetCourtTitle], segno inequivocabile della gravitas che questa persona ha acquisito."
 culture_greek.6.a: "Si dovrebbe mostrare rispetto a questo strategos, persino da parte dei [target_character.GetHerHis] rivali."
 culture_greek.6.b: "Cerchiamo di mettere a tacere la folla prima che qualcuno si faccia delle idee."
 greek_culture_all_capital_pops_gain_pop_satisfaction: "Tutti i [pops|e] a [target_capital.GetName] otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 greek_culture_prevent_coup_for_two_year: "Se [target_character.GetName] stava pianificando un colpo di stato, i [target_character.GetHerHis] sforzi saranno bloccati per #y 2#! Anni"

 culture_greek.7.title: "Il Colpo di Stato di [target_character.GetNameWithNoTooltip]"
 culture_greek.7.desc: "Dopo mesi di intrighi, di raccolta di sostegno, di riduzione dell'influenza degli oppositori e di radunamento di truppe, [target_character.GetName] è ora in condizione di rovesciare [target_character2.GetName].\n\nRitenendo [target_character.GetHerselfHimself] il legittimo sovrano di [ROOT.GetCountry.GetName], e un governante ben più benevolo e competente, [target_character.GetSheHe] si trova ora fuori da [ROOT.GetCountry.GetCapital.GetName], esigendo che [target_character2.GetShortName] abdichi al trono di [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.7.a: "Serve una nuova guida per liberarci dalla decadenza."
 culture_greek.7.b: "[target_character2.GetShortNameWithNoTooltip] non abdicherà tanto facilmente!"
 culture_greek.7.c: "Che cosa sa [target_character.GetShortNameWithNoTooltip] di legittimità?"
 culture_greek.7.d: "Bandiamo [target_character.GetHerHim] per aver cercato di rovesciarci."
 greek_culture_weaker_due_to_righteous_trait: "I [rebels|e] saranno molto più deboli."

 culture_greek.8.title: "Spie a [target_location.GetNameWithNoTooltip]"
 culture_greek.8.desc: "Le guardie di [target_location.GetName] hanno recentemente scoperto un gruppo di spie che cercava di infiltrarsi nei più grandi segreti di [ROOT.GetCountry.GetName] — segreti come il Fuoco Greco e altri progressi tecnologici che abbiamo compiuto e che vorrebbero per il proprio reame.\n\nSebbene non abbiano confessato per chi lavorano, ci hanno detto di essere state assegnate qui da mesi e di essere andate di locanda in locanda e di chiesa in chiesa cercando qualsiasi indizio su dove scavare per scoprire i nostri segreti. Forse quelle spie potrebbero avere un uso migliore che marcire nelle nostre segrete sperando che il loro padrone scopra che cosa è accaduto. Forse potrebbero servire noi."
 culture_greek.8.a: "Quelle spie sono più utili alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 culture_greek.8.b: "Lasciamole marcire e scopriamo altre reti di spie che si infiltrano a [target_location.GetNameWithNoTooltip]!"
 culture_greek.8.c: "Forse possono aiutarci a trovare altre reti di spie nascoste nella nostra [target_location.GetRank.GetNameWithNoTooltip]."
 every_country_with_spy_network_on_us_will_lose_25_network: "Ogni [country|e] noto che abbia una [spy_network|e] di almeno #Y 15#! nella nostra [target_location.GetRank.GetNameWithNoTooltip] perderà #R -25#! di [spy_network|e]"

 culture_greek.9.title: "La Crisobolla di [target_location.GetNameWithNoTooltip]"
 culture_greek.9.desc: "L'influenza [ShowCultureGroupName('italian_group')] all'interno della [target_location.GetRank.GetName] di [target_location.GetName] ha iniziato a dominare il commercio locale. Gli unici mercanti con cui la gente vuole commerciare sono quelli che hanno la sede in [ShowRegionName('italy_region')], il che fa sfuggire gran parte delle nostre ricchezze dalla nostra presa, poiché non possiamo sfruttare adeguatamente questa ricchezza. Tuttavia, queste pratiche hanno alcuni benefici, principalmente la possibilità per la nazione di vendere le proprie ricchezze, sebbene non a prezzi ideali. Ma tali transazioni potrebbero anche portare a un declino dell'autorità detenuta da [target_character.GetName], conducendo forse a una maggiore dipendenza da questi mercanti [ShowCultureGroupNameWithNoTooltip('italian_group')]."
 culture_greek.9.a: "Lasciamo che godano di maggiori privilegi, purché ci porti ricchezza."
 culture_greek.9.b: "Se vogliono privare la [target_location.GetRank.GetNameWithNoTooltip] della sua ricchezza, devono pagare una tassa aggiuntiva."
 culture_greek.9.c: "Diamo loro alcuni privilegi — di quelli che non portano alcun vantaggio reale."
 culture_greek.9.d: "Se dobbiamo redigere leggi per la loro protezione, dobbiamo essere efficienti."
 all_italian_pops_become_happier: "Tutti i [pops|e] [ShowPopTypeName('burghers')] [ShowCultureGroupName('italian_group')] otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 all_italian_pops_become_angrier: "Tutti i [pops|e] [ShowPopTypeName('burghers')] [ShowCultureGroupName('italian_group')] perderanno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 culture_greek.10.title: "Una Nuova Generazione a [target_location.GetNameWithNoTooltip]"
 culture_greek.10.desc: "Con le attuali burocrazie radicate e la corruzione in aumento tra coloro che le gestiscono, stanno emergendo molti giovani studenti di rilievo, desiderosi di estirpare questa corruzione sostituendo i metodi antiquati della vecchia guardia con altri più progressisti. Una di queste nuove persone è [target_character.GetName], membro di [target_estate.GetName], nato a [target_location2.GetName] da una famiglia semplice, ma che nel corso degli anni ha mostrato la capacità di migliorare la nostra burocrazia con metodi radicali. Questi nuovi metodi promettono di rimodellare l'attuale rigida struttura burocratica in qualcosa che gioverà allo stato e al suo popolo.\n\nSebbene ciò migliorerebbe certamente l'efficienza della nostra amministrazione, molti di coloro che già occupano posizioni consolidate temono di essere licenziati e combattono questa nuova generazione soffocandone le voci e persino corrompendo alcuni individui per 'tenerli buoni'."
 culture_greek.10.a: "Questi giovani sono il futuro."
 culture_greek.10.b: "In tali questioni stiamo con la vecchia guardia."

 culture_greek.11.title: "Una Frase Straniera"
 culture_greek.11.desc: "Sebbene l'influenza della lingua romana sia in declino nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] d'Oriente, abbiamo cercato di mantenere un'identità di orgoglioso popolo [ShowCultureGroupName('greek_group')]. Eppure alcuni [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sembrano abbastanza esperti da recitare frasi in [ShowLanguageName('latin_language')].\n\n'Pro bono', dice [target_character.GetName] ai cortigiani. Tutti sono confusi finché [target_character.GetSheHe] non ne spiega l'origine e il significato. Alcuni sono del tutto conservatori e deridono [target_character.GetHerHim] per l'uso di una lingua così strana, mentre altri sono incuriositi e desiderano saperne di più sul [ShowLanguageNameWithNoTooltip('latin_language')]. Con persone simili nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], si mormora di adottare questo stile di parlata e di integrarlo nell'amministrazione. Una sorta di ritorno alle antiche tradizioni romane, nel tentativo di mantenere le usanze di Roma all'interno di [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.11.a: "Non c'è ragione di abbandonare il nostro carattere [ShowCultureNameWithNoTooltip('greek_culture')]."
 culture_greek.11.b: "Il parlare in [ShowLanguageName('latin_language')] dovrebbe essere incoraggiato."
 culture_greek.11.c: "Una [ROOT.GetCountry.GetGovernment.GetCourtTitle] dovrebbe rispettare tutte le lingue."

 culture_greek.12.title: "Un Assaggio di Corruzione"
 culture_greek.12.desc: "Sebbene molte posizioni importanti in [ROOT.GetCountry.GetName] siano occupate da uomini capaci, alcuni ingranaggi del sistema sembrano non rendere a dovere.\n\nLa recente ispezione della nostra amministrazione ha prodotto un risultato piuttosto interessante: si dice che [target_character.GetName] abbia distribuito incarichi a parenti, amici e persino a persone che possono arricchire [target_character.GetHerHim]. Quando la notizia ha raggiunto la [ROOT.GetCountry.GetGovernment.GetCourtTitle] e, cosa ancora più importante, [target_character2.GetName], alcuni si sono affrettati a liquidarla come una semplice rivalità tra gli ispettori e [target_character.GetNameWithNoTooltip].\n\nForse è necessario un intervento più diretto, per mostrare a coloro che pensano che la nostra amministrazione sia un mezzo per aumentare la propria ricchezza che ogni azione ha le sue conseguenze."
 culture_greek.12.a: "Se epuriamo ogni membro corrotto, non avremo più membri."
 culture_greek.12.b: "[target_character.GetShortNameWithNoTooltip] ha fatto una scelta e ne affronterà le conseguenze."
 culture_greek.12.c: "Ogni corruzione sarà epurata!"
 culture_greek.12.d: "Forse... si possono prendere accordi."

 culture_greek.13.title: "Una Kephalē in Declino"
 culture_greek.13.desc: "La Kephalē di [target_area.GetName] è in declino fin dalla sua istituzione. Il suo governatore, che risiede a [target_location.GetName], non è riuscito a soddisfare le aspettative, ma questo fallimento è stato ignorato anche da molti all'interno della nostra burocrazia. Ciò ha permesso alla popolazione locale di evitare di pagare le tasse e ad alcuni nobili di impadronirsi di terre nella zona, sfruttando i contadini e la loro potenziale ricchezza. Quando questi rapporti hanno raggiunto la [ROOT.GetCountry.GetGovernment.GetCourtTitle] di [target_character.GetName], come avvoltoi sulla carogna, molti hanno suggerito di sostituire il governatore con sé stessi o con un parente, sostenendo che farebbero un lavoro migliore nel mantenere sicura la regione. Sebbene simili azioni sembrino drastiche, potrebbe non essere una cattiva idea cambiare la gestione laggiù. Oppure, forse, è colpa nostra per aver trascurato la leadership locale, e dovremmo inviare loro più risorse per aiutarli a tenere a freno [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] indisciplinati e a esigere obbedienza dai fieri popolani."
 culture_greek.13.a: "Sostituiamo il governatore con qualcun altro."
 culture_greek.13.b: "È la negligenza ad aver permesso il fallimento di [target_area.GetNameWithNoTooltip]. Diamo loro sostegno."
 culture_greek.13.c: "Solo il tempo può guarire questa ferita. Non c'è bisogno di una nuova gestione laggiù."
 all_pops_in_kephale_area_lose_satisfaction: "Tutti i [pops|e] a [target_area.GetName] perderanno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"
 gain_extra_control_in_the_area: "Ogni [location|e] che possediamo a [target_area.GetName] otterrà [ShowNamedValue('control_mild_bonus')|+=2%] di [control|e] e il [modifier|e] [ShowModifier('increased_kephale_support')] per #Y 10#! anni"
 lose_extra_control_in_the_area: "Ogni [location|e] che possediamo a [target_area.GetName] perderà [ShowNamedValue('control_mild_penalty')|+=2%] di [control|e]"

 culture_greek.14.title: "Non Nato nella Porpora"
 culture_greek.14.desc: "Sebbene [target_character.GetName] abbia rivendicato per [target_character.GetHerselfHimself] il trono di [ROOT.GetCountry.GetName], manca prestigio in [target_character.GetHerHim]. Senza che [target_character.GetNameWithNoTooltip] sia nato nella porpora, sono in molti a ritenere che questa mancanza di reputazione lasci la [ROOT.GetCountry.GetGovernment.GetCourtTitle] in una posizione debole. Circolano già voci sulla mancanza di dignità in questo [target_character.GetWomanMan], una che reca le caratteristiche di un conquistatore più che di un sovrano. Alcuni stanno persino pensando a piani per 'rimodellare' l'amministrazione in modi che sarebbero visti come lussuosi da molti di coloro che sono vicini a [target_character.GetNameWithNoTooltip]."
 culture_greek.14.a: "Si dovrebbe spendere denaro per migliorare lo status di [target_character.GetNameWithNoTooltip]."
 culture_greek.14.b: "Da quando il prestigio ha mantenuto in piedi un reame da solo?"
 culture_greek.14.c: "Se vogliono sapere cosa sia la dignità, la sperimenteranno."

 culture_greek.15.title: "$STATIC_MODIFIER_NAME_despot_modifier$ in Contrasto"
 culture_greek.15.desc: "Sebbene la famiglia [target_character.GetDynasty.GetName] sia sempre stata unita nella propria causa di amministrare [ROOT.GetCountry.GetName], vi sono stati alcuni scismi su come ciò debba essere gestito. [target_character.GetName] e [target_character2.GetName] sono in contrasto su come la [ROOT.GetCountry.GetGovernment.GetCourtTitle] debba funzionare in relazione alla famiglia. [target_character.GetShortNameWithNoTooltip] preferisce che sia più vicina al nostro governo, dove possiamo controllare più facilmente ogni suddito. [target_character2.GetShortNameWithNoTooltip] sostiene l'opposto, ossia che permettere l'autonomia ai nostri sudditi possa consentire un reame più grande, in cui possiamo mantenere piccoli lembi di influenza su una vasta quantità di terra."
 culture_greek.15.a: "Le idee di [target_character.GetShortNameWithNoTooltip] dovrebbero essere favorite."
 culture_greek.15.b: "Le promesse di [target_character2.GetShortNameWithNoTooltip] sembrano allettanti..."
 culture_greek.15.c: "Ricordiamo loro chi governa [ROOT.GetCountry.GetNameWithNoTooltip]."
 culture_greek.15.d: "Forse entrambi potrebbero imparare da [ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip]."

 culture_greek.16.title: "[target_character.GetNameWithNoTooltip] Parla nella [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 culture_greek.16.desc: "La notizia delle imprese di [target_character.GetName] si è diffusa in tutta [ROOT.GetCountry.GetName] e a [ROOT.GetCountry.GetCapital.GetName]. Molti cortigiani desiderano vedere la leggenda che è stata scolpita nella storia della nostra nazione e hanno inviato un messaggio a [target_character.GetHerHim] per convocare [target_character.GetHerHim] alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] e dare a [target_character.GetHerHim] la possibilità di conversare con altri membri influenti.\n\nAlcuni dei [target_character.GetHerHis] rivali non sono esattamente entusiasti di questa idea, e alcuni ritengono che ciò darà a [target_character.GetHerHim] delle idee, alcune delle quali potrebbero portare [target_character.GetHerHim] a voler usurpare la posizione di [target_character2.GetName] e a rivendicare [ROOT.GetCountry.GetNameWithNoTooltip] per [target_character.GetHerselfHimself]."
 culture_greek.16.a: "Chi siamo noi per negare a [target_character.GetWomanMan] il diritto di parlare nella [ROOT.GetCountry.GetGovernment.GetCourtTitle]?"
 culture_greek.16.b: "Un'occasione nella [ROOT.GetCountry.GetGovernment.GetCourtTitle]? Non lo permetteremo."

 culture_greek.17.title: "Espansione del Commercio a [target_location.GetNameWithNoTooltip]"
 culture_greek.17.desc: "La nostra competenza marittima ha consentito lo sviluppo di nuovi porti e rotte commerciali in [ROOT.GetCountry.GetName]. Uno di questi nuovi empori è [target_location.GetName], una [target_location.GetRank.GetName] in cui molti di [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono affluiti, grazie ai privilegi concessi per rafforzare ulteriormente le loro posizioni.\n\nLa nuova infrastruttura creata dalla popolazione locale ha attirato sempre più persone da tutta [ROOT.GetCountry.GetNameWithNoTooltip], portando a una necessità ancora maggiore di mercati, navi e alloggi. Queste richieste sono giunte alle orecchie di [target_character.GetName], che ha convocato la [ROOT.GetCountry.GetGovernment.GetCourtTitle] per stabilire come risolvere la situazione."
 culture_greek.17.a: "Promuoviamo il commercio a [target_location.GetNameWithNoTooltip]"
 culture_greek.17.b: "Li aiuteremo, purché siano disposti a restarci debitori."
 culture_greek.17.c: "Dovremmo invece dividere i costi."

 culture_greek.18.title: "Negligenza degli $a_akritai$ a [target_location.GetNameWithNoTooltip]"
 culture_greek.18.desc: "I capi della [target_location.GetRank.GetName] di frontiera di [target_location.GetName] hanno trascurato i propri doveri di custodi del fronte allentando le esercitazioni quotidiane, e sono quindi diventati vulnerabili a razzie e invasioni da parte dei nostri nemici.\n\nUna recente ispezione ci ha fornito maggiori informazioni sulla situazione: il loro comandante sembra una creatura del nepotismo, avendo ereditato la posizione per famiglia anziché per merito. Anche le truppe hanno goduto dei fondi che [ROOT.GetCountry.GetName] ha dato loro, bevendo e vantandosi di imprese che non corrispondono alla loro reale competenza. Anziché accettare questa situazione e rischiare una breccia sul confine di [target_area.GetName], dobbiamo invece far rispettare la disciplina tra questi $a_akritai$. Forse [target_character.GetName] dovrebbe essere più proattivo in questa materia."
 culture_greek.18.a: "Non abbiamo fondi da risparmiare per questo."
 culture_greek.18.b: "Proteggere il confine è loro dovere, e sarà loro ricordato."
 all_pop_in_location_lose_satisfaction: "Tutti i [pops|e] a [target_location.GetName] perderanno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 culture_greek.19.title: "Racconti degli $a_akritai$ a [target_location.GetNameWithNoTooltip]"
 culture_greek.19.desc: "Sebbene molti racconti sugli $a_akritai$ siano esagerati per diffondere il prestigio di [ROOT.GetCountry.GetName] in lungo e in largo, esistono anche le storie senza fronzoli di coloro che a [target_location.GetName] custodiscono il confine di [target_area.GetName]. La loro diligenza ha fatto sì che i nemici siano tenuti a bada e che il nome di [target_character.GetName] imponga rispetto in queste terre. Alcuni hanno dubbi sulla legittimità di questi $a_akritai$, ma all'interno della [ROOT.GetCountry.GetGovernment.GetCourtTitle] vi sono anche coloro che desiderano aiutarli ulteriormente e rafforzare la leggenda che stanno cercando di costruire, anche se solo a beneficio di [ROOT.GetCountry.GetNameWithNoTooltip]. Forse [target_character.GetNameWithNoTooltip] può anche provare a fornire qualche assistenza, creando una leggenda locale per la gente di [target_location.GetNameWithNoTooltip]."
 culture_greek.19.a: "Se le imprese degli $a_akritai$ si diffondono così, promuoveremo le loro storie."
 culture_greek.19.b: "Il solo servizio è sufficiente a garantire un racconto per i secoli."

 culture_greek.20.title: "Gli $a_akritai$ di [target_location.GetNameWithNoTooltip] Chiedono Aiuto"
 culture_greek.20.desc: "Essendo [ROOT.GetCountry.GetName] una vasta [ROOT.GetCountry.GetFlavorRank], è inevitabile che in certe zone vi sia negligenza. Sebbene il più delle volte non sia deliberata, lascia un sapore amaro in bocca ai locali. Questa negligenza ha fatto sentire minacciata la gente di [target_area.GetName], poiché il confine non è così sicuro come vorrebbe. Hanno chiesto alla guarnigione locale di [target_location.GetName] di rafforzare ulteriormente i propri sforzi e di aumentare la vigilanza, ma per difendersi adeguatamente da una razzia o da un'invasione avranno bisogno anche del sostegno della [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nI loro messaggeri sono giunti a [target_capital.GetName], chiedendo udienza a [target_character.GetName]. Hanno richiesto che inviamo loro denaro per finanziare l'espansione delle fortificazioni a [target_location.GetNameWithNoTooltip], oltre a più uomini che facciano da guarnigione o da istruttori per i soldati nelle loro esercitazioni quotidiane."
 culture_greek.20.a: "Faremo in modo che ogni angolo resti protetto."
 culture_greek.20.b: "Non siamo in grado di risparmiare queste risorse."

 culture_greek.21.title: "Declino del Commercio Mediterraneo a [target_location.GetNameWithNoTooltip]"
 culture_greek.21.desc: "La scoperta del Nuovo Mondo ha portato alla creazione di nuove rotte commerciali. Molte di esse stanno contribuendo a ridurre l'importanza del commercio mediterraneo, che abbiamo cercato di sfruttare a nostro vantaggio. Avendo già acquisito esperienza in questo mare, molti tra [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono ostinati e non disposti ad abbandonare le loro attuali reti marittime. Credono invece che non sarà un cambiamento di tradizione ad aiutarli, bensì i finanziamenti della [ROOT.GetCountry.GetGovernment.GetCourtTitle] e la costante promozione dei loro centri commerciali preferiti.\n\nUno di questi centri che richiedono tale aiuto è la [target_location.GetRank.GetName] di [target_location.GetName], che ha subito il mutamento globale delle rotte commerciali. Chiedono che concediamo loro finanziamenti per permettere ai loro mercanti di importare nuove merci, creando più affari e potenzialmente facendo rivivere l'importanza che [target_location.GetNameWithNoTooltip] un tempo deteneva."
 culture_greek.21.a: "Concediamo loro questi fondi."
 culture_greek.21.b: "Se vogliono essere mercanti di successo, dovrebbero imparare a gestire meglio ciò che già hanno."
 culture_greek.21.c: "Niente che l'astuzia non possa risolvere."
 burghers_in_location_lose_satisfaction: "Tutti i [pops|e] [ShowPopTypeName('burghers')] a [target_location.GetName] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]"
 burghers_in_location_gains_satisfaction: "Tutti i [pops|e] [ShowPopTypeName('burghers')] a [target_location.GetName] otterranno [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] di [pop_satisfaction|e]"

 culture_greek.22.title: "Festa della Theotokos a [target_location.GetNameWithNoTooltip]"
 culture_greek.22.desc: "La nascita di Gesù è considerata un evento monumentale per ogni devoto seguace [ShowReligionAdjective('orthodox')], e per questo motivo molti celebrano feste nel nome di sua madre, Maria, spesso chiamata #italic Theotokos#!, la Madre di Dio.\n\nNessuno è tanto fervente in queste celebrazioni quanto la gente di [target_location.GetName]. Stanno organizzando una festa all'interno della [target_location.GetRank.GetName] e delle zone circostanti, sperando di riposare davvero per un giorno intero e di diffondere la loro gioia a chiunque desideri unirsi a loro. In effetti, alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] si stanno già recando lì per assistere allo spettacolo, sebbene i più spirituali tra loro desiderino anche arricchire questo giorno santo per il popolo."
 culture_greek.22.a: "Davvero una grande occasione."
 culture_greek.22.b: "Celebreremo insieme a loro."
 culture_greek.22.c: "Sebbene non condividiamo la loro fede, possiamo almeno rispettarla."
 culture_greek.22.d: "Nessuna tradizione [ShowReligionAdjectiveWithNoTooltip('orthodox')] si diffonderà a [target_location.GetNameWithNoTooltip]."
 all_pops_in_location_gain_satisfaction: "Tutti i [pops|e] otterranno [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] di [pop_satisfaction|e]"
 all_orthodox_pops_in_location_lose_satisfaction: "Tutti i [pops|e] [ShowReligionAdjective('orthodox')] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]"

 culture_greek.23.title: "L'Influenza di [target_location.GetNameWithNoTooltip]"
 culture_greek.23.desc: "L'influenza che [target_location.GetName] detiene in [ROOT.GetCountry.GetName] sta diventando più evidente a tutti, soprattutto ai funzionari che risiedono a [target_capital.GetName]. Sono assai interessati a capire come questa [target_location.GetRank.GetName] di [target_area.GetName] sia assurta a tale rilievo, principalmente grazie al patronato di [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] e di vari individui di [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Burocrati minori e ricchi membri di [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] traggono egualmente beneficio dalle opportunità che questa [target_location.GetRank.GetNameWithNoTooltip] offre loro, e [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] locali godono di una vita di lusso.\n\nSebbene tutto ciò abbia reso felici alcuni, ha anche portato a un aumento dell'influenza della regione, che diminuisce il potere di coloro che si trovano a [target_capital.GetName] e altrove, turbando l'equilibrio di potere dell'intero paese."
 culture_greek.23.a: "Perché punire un luogo per aver attirato nuove persone e nuova ricchezza?"
 culture_greek.23.b: "Le altre città hanno preoccupazioni fondate. Forse dovremmo limitare la crescita di [target_location.GetNameWithNoTooltip]."
 all_pops_with_influential_polis_modifier_lose_satisfaction: "Tutti i [pops|e] nelle [locations|e] con il [modifier|e] [ShowModifier('greek_culture_influential_polis')] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]"
 all_pops_in_location_lose_satisfaction: "Tutti i [pops|e] a [target_location.GetName] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]"

 culture_greek.24.title: "Le Pretese dei Rhōmaîoi"
 culture_greek.24.desc: "Le influenze dell'Impero Romano indugiano ancora nelle terre di [ROOT.GetCountry.GetName]. Sebbene il titolo $BYZ$ non sia nostro da rivendicare, la gente si associa ancora al vecchio Impero, sostenendo che [target_character.GetName] dovrebbe perseguire un'agenda più aggressiva nel rivendicare parti dell'Impero Romano. Anziché recuperare soltanto i suoi territori, alcuni populisti all'interno della [ROOT.GetCountry.GetGovernment.GetCourtTitle] ritengono che dovremmo iniziare a presentarci come facevano un tempo gli imperatori della leggenda. Anche [target_capital.GetName] dovrebbe riflettere quello stile, impiegando estetiche che ci conferirebbero la legittimità e il prestigio necessari per avanzare pretese più forti sui nostri antichi territori."
 culture_greek.24.a: "Questi 'Rhōmaîoi' possono scordarsi le loro fantasie."
 culture_greek.24.b: "Simili azioni potrebbero essere vantaggiose; forse possiamo attuarle."

 culture_greek.25.title: "L'Erudizione di [ShowLocationNameWithNoTooltip('mystras')]"
 culture_greek.25.desc: "La celebre via filosofica di [ShowLocationName('mystras')] ha esteso la sua influenza attraverso [ShowRegionName('balkan_region')], [ShowAreaName('west_anatolia_area')] e [ShowRegionName('italy_region')].\n\nMolti luoghi, poveri e ricchi, sono stati visitati da studiosi. Uno di questi luoghi è [target_location.GetName], situato in [target_area.GetName]. Studiosi minori partiti per esplorare le terre al di là vi hanno fatto sosta, condividendo con la gente le loro idee filosofiche, culturali e retoriche. Molti abitanti si sono interessati a tali idee, soprattutto le persone più istruite che desiderano ampliare i propri orizzonti. Questi insegnamenti hanno anche attirato l'attenzione della [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.Custom('IT_ADJ_FS')], che ha posizioni più estreme in materia. Alcuni desiderano reprimere qualsiasi idea e insegnamento che possa sembrare pericoloso, soprattutto quelli che potrebbero rappresentare un rischio per l'identità di [ROOT.GetCountry.GetNameWithNoTooltip], mentre alcuni di rango inferiore desiderano permettere alle idee di diffondersi, poiché offrono una grande opportunità di apprendimento per la nostra gente."
 culture_greek.25.a: "I loro insegnamenti non sono pericolosi. Lasciamo che diffondano il loro sapere."
 culture_greek.25.b: "Perché dovremmo rischiare che [target_location.GetNameWithNoTooltip] sviluppi idee radicali?"
 event_will_only_fire_for_locations_within_mystras_scholarship_geography: "Questo [event|e] può attivarsi solo per [locations|e] all'interno di [ShowScriptedGeographyName('mystras_scholarship_geography')]"

 culture_greek.26.title: "Nuova Retorica [ROOT.GetCountry.GetAdjectiveWithNoTooltip]"
 culture_greek.26.desc: "Durante l'era romana furono prodotte innumerevoli opere, tutte scritte in [ShowLanguageName('latin_language')], una lingua che alcuni in [ROOT.GetCountry.GetName] sono riluttanti a imparare. Ciò ha spinto i nostri studiosi più intellettuali a tradurle nella [ROOT.GetCountry.GetCommonLanguage.GetName], la lingua comune parlata dal cittadino di ogni giorno.\n\nL'élite ne ha preso nota, sentendosi minacciata dall'idea che gli ordini inferiori possano avere accesso agli stessi testi che [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno trascorso anni a studiare e perfezionare. Per questo ne hanno parlato nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], sollecitando il divieto di tali opere tradotte in tutta la [ROOT.GetCountry.GetFlavorRank] al fine di mantenere l'integrità e il prestigio dell'élite."
 culture_greek.26.a: "Anche la gente comune ha il diritto di imparare."
 culture_greek.26.b: "Qualsiasi cosa pur di preservare la superiorità dell'élite [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."

 culture_greek.27.title: "[target_character.GetNameWithNoTooltip] Esige un Trionfo"
 culture_greek.27.desc: "[target_character.GetName] è tornato da un'altra magnifica vittoria, attraversando le strade di [target_capital.GetName] con una folla che acclama [target_character.GetHerHim], circondato da una nutrita guardia del corpo dei [target_character.GetHerHis] soldati più fedeli, che proteggono [target_character.GetHerHim] da qualsiasi danno possa incontrare lungo il [target_character.GetHerHis] cammino.\n\nGiunto alla [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_character.GetSheHe] ha chiesto udienza, che gli è stata concessa a malincuore. Amico o nemico che fosse, [target_character.GetSheHe] ha ignorato ogni altro cortigiano e ha invece guardato direttamente [target_character2.GetName] mentre esigeva che venisse celebrato un trionfo all'antica in [target_character.GetHerHis] onore. [target_character.GetSheHe|U] insiste che tutti debbano conoscere le [target_character.GetHerHis] imprese per sollevare il morale e incutere timore a chiunque osi opporsi militarmente a [ROOT.GetCountry.GetName]."
 culture_greek.27.a: "Un trionfo? Che chiasso. Respingiamo queste richieste."
 culture_greek.27.b: "Se è per la gloria di [ROOT.GetCountry.GetNameWithNoTooltip], ne terremo uno volentieri."
 greek_culture_strategos_will_not_use_triumph_for_popularity: "Non celebrando un trionfo per [target_character.GetName], [target_character.GetSheHe] non farà progressi in alcun tentativo di colpo di stato pianificato"
 greek_culture_progress_coup_attempt_if_strategos_is_disloyal: "Celebrando un trionfo per [target_character.GetName], [target_character.GetSheHe] potrà usare la [target_character.GetHerHis] popolarità per accelerare qualsiasi tentativo di colpo di stato"

 culture_greek.28.title: "La Fuga degli Studiosi"
 culture_greek.28.desc_common: "L'instabilità in [ROOT.GetCountry.GetName] ha spinto molte persone istruite a cercare una vita migliore, lontano dalla nostra tormentata [ROOT.GetCountry.GetFlavorRank]."
 culture_greek.28.desc.a: "$culture_greek.28.desc_common$\n\n Desiderano vivere una vita più stabile, che permetta loro di coltivare le proprie idee in filosofia, diritto e religione; una vita che non venga loro strappata in un istante dalla guerra, dalla carestia o dalla morte. È per questo che molti parlano con nostalgia di [target_country.GetName], una [target_country.GetFlavorRank] più prestigiosa e stabile, che può offrire loro il comfort che tanto desiderano. Molti hanno già iniziato a migrare verso [target_destination.GetName], un fatto che preoccupa i membri più raffinati della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Ritengono che tali migrazioni siano una ferita al prestigio di [ROOT.GetCountry.GetNameWithNoTooltip], poiché mostrano la nostra incapacità di proteggere coloro che non possono sopportare il nostro attuale stato di crisi, ma sono comunque membri preziosi della società."
 culture_greek.28.desc.b: "$culture_greek.28.desc_common$\n\n Sebbene non vi siano terre adatte a una simile fuga, parlano delle glorie di reami lontani di cui hanno letto: di come la gente comune in [scholar_country.1.GetName] viva nel lusso, in contrasto con la vita qui; di come i governanti di [scholar_country2.GetName] non maltrattino i propri sudditi, rispettandone invece i diritti in quanto persone; e di come in [scholar_country3.GetName] non sia la tradizione a mandare avanti tutto, ma l'innovazione.\n\nSebbene all'inizio innocue, queste voci si sono diffuse in ogni angolo della nostra [ROOT.GetCountry.GetFlavorRank], creando disordini civili, cosa di cui la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] è profondamente preoccupata."
 culture_greek.28.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 culture_greek.28.b: "Fermiamoli, prima che altri provino ad andarsene."
 culture_greek.28.c: "Le loro parole causano ancora più instabilità."
 culture_greek.28.d: "Forse possiamo stanziare dei fondi per prevenire ulteriori disordini."
 greek_culture_migration_largely_prevented: "Gran parte della [migration|e] sarà mitigata"

 culture_greek.29.title: "[ShowBuildingTypeNameWithNoTooltip('orthodox_monastery')] Chiede Aiuto"
 culture_greek.29.desc: "La gente di [target_location.GetName] è devota seguace di [ROOT.GetCountry.GetReligion.GetName], e prega [ROOT.GetCountry.GetReligion.GetGodName] ogni giorno. Tuttavia, a causa della mancanza di sostegno da parte di [ROOT.GetCountry.GetName] e del suo governo, il [ShowBuildingTypeName('orthodox_monastery')] locale nella [target_location.GetRank.GetName] ha un disperato bisogno di nuovi ornamenti per riflettere degnamente il proprio status sacro. Per questo motivo, i sacerdoti del luogo hanno inviato un messaggio alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], sollecitando [target_character.GetName] a inviare denaro per decorare adeguatamente sia l'esterno sia l'interno di questo luogo sacro. Concedere un favore simile non passerebbe inosservato, dimostrando a tutti quanto siamo dedicati a qualsiasi causa [ROOT.GetCountry.GetReligion.GetAdjectiveWithNoTooltip] all'interno della nostra [ROOT.GetCountry.GetFlavorRank]."
 culture_greek.29.a: "Avranno il loro oro per la decorazione."
 culture_greek.29.b: "[target_character.GetNameWithNoTooltip] non dovrebbe risparmiare denaro per ogni luogo sacro."
 culture_greek.29.c: "Nel nome dell'[ShowReligionNameWithNoTooltip('orthodox')], non risparmieremo fondi per questo."
 all_orthodox_pops_gain_satisfaction_in_location: "Tutti i [pops|e] [ShowReligionAdjective('orthodox')] otterranno [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] di [pop_satisfaction|e]"

 culture_greek.30.title: "L'Eredità dell'Impero"
 culture_greek.30.desc: "La luce dell'Impero Romano d'Oriente si è spenta. Nonostante ciò, molti dei nostri cittadini si definiscono Rhōmaîoi, e parti della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] sembrano aver adottato le usanze del vecchio Impero. Questo, a sua volta, ci ha dato una certa legittimità per rivendicare parti di questo antico reame con il pretesto di esserne i legittimi successori. Molti a [ROOT.GetCountry.GetCapital.GetName] sono consapevoli del nostro confine a [target_province.GetName] e ne sostengono la riconquista da [target_country.GetName], che non ha alcun diritto di definirsi erede di Roma. I militari sembrano concordare con questo sentimento e, insieme a [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], incoraggiano la popolazione ad andare in guerra e a riprendersi ciò che spetta di diritto a [ROOT.GetCountry.GetName]."
 culture_greek.30.a: "I confini di Roma saranno riconquistati!"
 culture_greek.30.b: "Non c'è bisogno di guerra."
