l_english:
  # Estate related
 maghrebi_culture_masters_of_sahara_country_bonus: "Il seguente bonus può essere ottenuto dalla [decision|e]\n$maghreb_masters_of_the_sahara.title$:"
 maghrebi_culture_masters_of_sahara_desert_location_bonus: "Il seguente bonus può essere ottenuto dalla [decision|e]\n$maghreb_masters_of_the_sahara.title$ e influenzerà le [locations|e] [ShowVegetationName('desert')]:"
 maghrebi_culture_masters_of_sahara_arid_location_bonus: "Il seguente bonus può essere ottenuto dalla [decision|e]\n$maghreb_masters_of_the_sahara.title$ e influenzerà le [locations|e] [ShowClimateName('arid')]:"
 # Estate end

 maghrebi_culture.1.title: "Comunità [ShowReligionAdjectiveWithNoTooltip('judaism')] di [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.1.desc: "Sebbene gran parte della popolazione [ShowCultureName('mustaarabi')] del [ShowRegionName('maghreb_region')] sia stata scacciata durante il dominio degli Almohadi, [target_location.GetName] è emersa come un centro in cui molti [ShowCultureNameWithNoTooltip('mustaarabi')] hanno trovato nuovamente rifugio. Mentre la [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.Custom('IT_ADJ_FS')] ha adottato una politica più tollerante verso gli [ShowReligionAdjective('judaism')], alcuni tra i più radicali di [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] hanno espresso interesse a riadottare la dottrina almohade abbandonata."
 maghrebi_culture.1.a: "[target_location.GetNameWithNoTooltip] resterà un rifugio per i [ShowCultureNameWithNoTooltip('mustaarabi')]."
 maghrebi_culture.1.b: "Facciamo appello ai radicali di [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] e costringiamoli ad adottare [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."

 maghrebi_culture.2.title: "Le Terre [ShowReligionAdjectiveWithNoTooltip('ibadi')] del [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.2.desc: "Sebbene sia passato parecchio tempo da quando un potente stato [ShowReligionAdjectiveWithNoTooltip('ibadi')] ha esercitato influenza sul [ShowRegionName('maghreb_region')], [our_ruler.GetName] ha compiuto grandi passi per consolidare gli stati rimasti che ancora restano fedeli alle credenze [ShowReligionAdjective('ibadi')]. Sebbene le terre di [ROOT.GetCountry.GetName] non siano ricche quanto alcuni degli stati più sviluppati del [ShowRegionNameWithNoTooltip('maghreb_region')], il successo di [our_ruler.GetShortNameWithNoTooltip] potrebbe ancora condurre al culmine di un nuovo stato [ShowReligionAdjectiveWithNoTooltip('ibadi')]."
 maghrebi_culture.2.a: "Apriremo la strada a un forte stato [ShowReligionAdjectiveWithNoTooltip('ibadi')] nel [ShowRegionNameWithNoTooltip('maghreb_region')]!"
 maghrebi_culture.2.b: "Dovremmo invece concentrarci sul forgiare la nostra strada."

 maghrebi_culture.3.title: "Rinascita del Dominio [ShowReligionAdjectiveWithNoTooltip('ibadi')] nel [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.3.desc: "[our_ruler.GetName] è riuscito a compiere l'impossibile e a ritagliare un nuovo reame [ShowReligionAdjective('ibadi')] all'interno del [ShowRegionName('maghreb_region')]. Con [ROOT.GetCountry.GetName] ora tra le principali potenze del [ShowRegionNameWithNoTooltip('maghreb_region')], alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno sollecitato [our_ruler.GetNameWithNoTooltip] ad adottare una nuova politica verso le altre sette del [ShowReligionGroupName('muslim')]. Sebbene un nuovo stato [ShowReligionAdjectiveWithNoTooltip('ibadi')] abbia attirato nuovi seguaci, molte persone nel [ShowRegionNameWithNoTooltip('maghreb_region')] seguono ancora il [ShowReligionAdjective('sunni')]."
 maghrebi_culture.3.a: "Adotteremo una politica di tolleranza verso tutti i rami del [ShowReligionGroupNameWithNoTooltip('muslim')]."
 maghrebi_culture.3.b: "I seguaci delle altre sette devono adottare l'[ShowReligionNameWithNoTooltip('ibadi')]."

 maghrebi_culture.4.title: "I Giovani Stati [ShowReligionAdjectiveWithNoTooltip('ibadi')] del [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.4.desc: "Sebbene un importante sultanato [ShowReligionAdjective('ibadi')] abbia un tempo esercitato grande influenza nel [ShowRegionName('maghreb_region')], i secoli successivi al crollo dei Rustamidi hanno portato molti devoti seguaci [ShowReligionAdjectiveWithNoTooltip('ibadi')] a trasferirsi in [ShowAreaName('desert_area')]. Con i domini di [ROOT.GetCountry.GetName] che ora si estendono verso queste regioni, alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito che [our_ruler.GetName] lanci campagne contro [target_country.GetName], uno dei più deboli tra gli stati residui."
 maghrebi_culture.4.a: "Sfruttiamo la debolezza di [target_country.GetNameWithNoTooltip]!"
 maghrebi_culture.4.b: "Sono troppo frammentati e distanti per rappresentare una minaccia."

 maghrebi_culture.5.title: "Assoggettamento della Popolazione [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] [ShowReligionAdjectiveWithNoTooltip('ibadi')]"
 maghrebi_culture.5.desc: "Sebbene [ShowAreaName('desert_area')] sia da tempo patria di una consistente popolazione [ShowReligionAdjectiveWithNoTooltip('ibadi')], la maggior parte di essa è passata sotto il dominio di [ROOT.GetCountry.GetName]. Con [ROOT.GetCountry.GetNameWithNoTooltip] che ora ospita un numero non trascurabile di seguaci dell'[ShowReligionNameWithNoTooltip('ibadi')], molti nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno sollecitato [our_ruler.GetName] ad adottare una politica di tolleranza verso i fedeli [ShowReligionAdjectiveWithNoTooltip('ibadi')], per non rischiare che lo stato soffra di instabilità religiosa."
 maghrebi_culture.5.a: "Devono volgersi a [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]."
 maghrebi_culture.5.b: "Puntiamo invece a integrare pacificamente la popolazione [ShowReligionAdjectiveWithNoTooltip('ibadi')]."

 maghrebi_culture.6.title: "L'Influenza Crescente [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip]"
 maghrebi_culture.6.desc: "Sebbene [target_country_1.GetName] e [target_country.GetName] abbiano esercitato grande influenza sul [ShowRegionName('maghreb_region')] nei decenni successivi alla caduta degli Almohadi, [target_country.GetNameWithNoTooltip] sono riusciti a ritagliarsi un potente reame all'interno del [ShowRegionNameWithNoTooltip('maghreb_region')] sotto la guida di [our_ruler.GetName]. Sebbene le élite di [target_country_1.GetNameWithNoTooltip] e di [target_country.GetNameWithNoTooltip] guardino con sospetto all'influenza [ROOT.GetCountry.GetAdjectiveWithNoTooltip], molti popoli [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] si sono mostrati più accoglienti verso il nostro dominio."
 maghrebi_culture.6.a: "Porteremo il [ShowRegionNameWithNoTooltip('maghreb_region')] sotto il dominio [ROOT.GetCountry.GetAdjectiveWithNoTooltip]!"

 maghrebi_culture.7.title: "Irrigazione delle Palme di [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.7.desc: "Sebbene molte terre del [ShowRegionName('maghreb_region')] offrano un suolo fertile, esso è anche patria di un terreno ostile, data la sua vicinanza a [ShowAreaName('desert_area')].\n\n[target_location.GetName] ha richiesto risorse per istituire un nuovo [ShowBuildingTypeName('maghreb_palm_irrigation')] nella [target_location.GetRank.GetName], nella speranza di alleviare le condizioni più dure dell'insediamento."
 maghrebi_culture.7.a: "Offriamo risorse a [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] locali per istituire la rete di irrigazione."
 maghrebi_culture.7.b: "Non possiamo risparmiare le risorse."

 maghrebi_culture.8.title: "Sofisticata Architettura di [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.8.desc: "Sebbene la gente di [target_location.GetName] goda da tempo di una reputazione per l'adattamento della propria architettura al terreno ostile del [ShowVegetationName('desert')], gli architetti della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] sono tornati colpiti da ciò che hanno osservato nella regione. Sebbene il terreno di [ROOT.GetCountry.GetCapital.GetName] non sia lo stesso di quello di [target_location.GetNameWithNoTooltip], i nostri architetti ritengono che, con il sostegno di [our_ruler.GetName], miglioramenti simili possano essere realizzati a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 maghrebi_culture.8.a: "Adottiamo alcuni aspetti dell'architettura di [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.8.b: "Dovremmo invece fornire risorse aggiuntive a [target_location.GetNameWithNoTooltip]."

 maghrebi_culture.9.title: "Tradizioni del Popolo [ShowCultureGroupNameWithNoTooltip('amazigh_group')]"
 maghrebi_culture.9.desc: "Dalla migrazione di molte tribù [ShowCultureName('bedouin_culture')] verso il [ShowRegionName('maghreb_region')] nell'XI secolo, con il sostegno dei Fatimidi, molti nativi del gruppo [ShowCultureGroupName('amazigh_group')] furono costretti a riconoscere questa crescente classe d'élite [ShowCultureGroupName('arabic_group')]. Sebbene sotto [ROOT.GetCountry.GetName] molti popoli [ShowCultureGroupNameWithNoTooltip('amazigh_group')] abbiano mantenuto la propria autonomia, alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito di accogliere alcuni di questi [ShowCultureGroupNameWithNoTooltip('arabic_group')] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] in [ROOT.GetCountry.GetNameWithNoTooltip] per legittimare il nostro dominio. Tuttavia, un simile invito susciterà con ogni probabilità l'ira di molti tra [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')]."
 maghrebi_culture.9.a: "Dovremmo adoperarci per collaborare con l'élite [ShowCultureGroupNameWithNoTooltip('arabic_group')]."
 maghrebi_culture.9.b: "Dovremmo invece cercare di preservare le tradizioni [ShowCultureGroupNameWithNoTooltip('amazigh_group')]."

 maghrebi_culture.10.title: "La Crescente Importanza di [target_location.GetNameWithNoTooltip] per il Commercio Sahariano"
 maghrebi_culture.10.desc: "Situata lungo una delle tante rotte commerciali all'interno di [ShowAreaName('desert_area')], [target_location.GetName] è da tempo una tappa importante per i mercanti di [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]. Negli ultimi anni, tuttavia, sotto la protezione di [ROOT.GetCountry.GetName], la [target_location.GetRank.GetName] è cresciuta d'importanza, e molti mercanti la scelgono come tappa perché attraversare le terre [ROOT.GetCountry.Custom('IT_ADJ_FP')] è sicuro. Sebbene la maggiore importanza abbia procurato a [target_location.GetNameWithNoTooltip] un maggiore riconoscimento in tutto il Sahara, ha anche messo a dura prova la [target_location.GetRank.GetNameWithNoTooltip].\n\nPer garantire che la [target_location.GetRank.GetNameWithNoTooltip] possa restare un influente snodo commerciale, molti nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno chiesto a [our_ruler.GetName] di fornire alla [target_location.GetRank.GetNameWithNoTooltip] le risorse adeguate ad accogliere questo crescente afflusso di mercanti."
 maghrebi_culture.10.a: "[target_location.GetNameWithNoTooltip] deve mantenere la sua importanza per il commercio sahariano!"
 maghrebi_culture.10.b: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] non può risparmiare risorse per [target_location.GetNameWithNoTooltip]."

 maghrebi_culture.11.title: "Agricoltura Fiorente a [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.11.desc: "Sebbene si trovi in una delle regioni più aspre del [ShowRegionName('maghreb_region')], la gente di [target_location.GetName] è riuscita a stabilizzare la propria situazione con la recente espansione di un [ShowBuildingTypeName('maghreb_palm_irrigation')], rivelatosi un grande vantaggio per [ROOT.GetCountry.Custom('IT_PEASANTS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] di [target_location.GetNameWithNoTooltip]."
 maghrebi_culture.11.a: "$common_string_good$"

 maghrebi_culture.12.title: "Sotto il Dominio [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]"
 maghrebi_culture.12.desc: "Dalla caduta degli Almohadi, gli [ShowCultureName('tunisian')] [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] hanno mantenuto un'influenza considerevole sul [ShowRegionName('maghreb_region')] orientale. Sebbene [ROOT.GetCountry.GetName] abbia mantenuto una certa indipendenza da [target_country.GetName], i sovrani [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] si sono dimostrati validi sovrani nel proteggere il territorio [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Tuttavia, man mano che il dominio almohade diventa un ricordo lontano, alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno messo in discussione la legittimità dei sovrani [ShowDynastyNameWithNoTooltip('hafsid_dynasty')], suggerendo che sia ora che [ROOT.GetCountry.GetNameWithNoTooltip] si liberi dal giogo [ShowCultureNameWithNoTooltip('tunisian')]."
 maghrebi_culture.12.a: "Gli [ShowDynastyNameWithNoTooltip('hafsid_dynasty')] hanno offerto un'ampia protezione a [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.12.b: "È ora di spezzare le catene del controllo [ShowDynastyNameWithNoTooltip('hafsid_dynasty')]."

 maghrebi_culture.13.title: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] [ShowCultureNameWithNoTooltip('tunisian')] si Intromettono negli Affari Interni"
 maghrebi_culture.13.desc: "Sebbene [ROOT.GetCountry.GetLongName] riconosca da tempo la sovranità [ShowCultureName('tunisian')], la [ROOT.GetCountry.GetGovernment.GetCourtTitle] di [ROOT.GetCountry.GetNameWithNoTooltip] ha in gran parte mantenuto la propria autonomia. Tuttavia, le recenti incursioni di [target_character.GetName] nel tradizionale territorio [ROOT.GetCountry.GetCulture.GetName] hanno fomentato instabilità in tutto [ROOT.GetCountry.GetNameWithNoTooltip]. Molti membri di [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] hanno chiesto che [target_character.GetNameWithNoTooltip] sia esiliato da [ROOT.GetCountry.GetNameWithNoTooltip] immediatamente, sebbene una simile espulsione susciterà probabilmente l'ira di [target_country.GetName]."
 maghrebi_culture.13.a: "Esiliamo [target_character.GetNameWithNoTooltip] da [ROOT.GetCountry.GetNameWithNoTooltip]!"
 maghrebi_culture.13.b: "Permettiamo a [target_character.GetHerHim] di restare nella [ROOT.GetCountry.GetGovernment.GetCourtTitle]."

 maghrebi_culture.14.title: "[ROOT.GetCountry.Custom('IT_TRIBES_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] Ribelli Razziano [target_location.GetNameWithNoTooltip]"
 maghrebi_culture.14.desc: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] è in subbuglio dopo le notizie di razzie alle carovane da parte di soldati fedeli a [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] a [target_location.GetName]. Situata lungo una delle rotte commerciali sahariane essenziali, [target_location.GetNameWithNoTooltip] è una tappa importante per molti mercanti. Cercando un risarcimento per i danni causati dai soldati ribelli, molti tra [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] colpiti hanno chiesto che [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] paghino per i danni."
 maghrebi_culture.14.a: "Costringiamo [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] a pagare per i danni causati dalle razzie."
 maghrebi_culture.14.b: "Rimproveriamo [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')], ma facciamo sì che lo stato copra i danni."
 maghrebi_culture.14.c: "Schieriamoci con [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] e permettiamo che le razzie continuino."

 maghrebi_culture.15.title: "Sostegno Crescente tra [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] [target_culture.GetNameWithNoTooltip]"
 maghrebi_culture.15.desc: "Con la crescente espansione dell'autorità [ROOT.GetCountry.GetAdjective] sul [ShowRegionName('maghreb_region')], diversi gruppi nativi hanno giurato fedeltà a [ROOT.GetCountry.GetNameWithNoTooltip]. Tra questi, [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] [target_culture.GetName] si sono dimostrati i più ricettivi verso il dominio [ROOT.GetCountry.GetAdjectiveWithNoTooltip], con molti capi [target_culture.GetNameWithNoTooltip] che offrono il pieno sostegno delle proprie tribù. Sorpresi da questa ondata di sostegno da parte dei [target_culture.GetNameWithNoTooltip], alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito che [our_ruler.GetName] offra il pieno appoggio dello stato e promuova gli interessi [target_culture.GetNameWithNoTooltip] in tutto il [ShowRegionNameWithNoTooltip('maghreb_region')], mentre altri hanno suggerito di sfruttare invece il loro fervente sostegno."
 maghrebi_culture.15.a: "Accogliamo il loro sostegno!"
 maghrebi_culture.15.b: "Sfruttiamo il loro sostegno per rafforzare la nostra influenza sul [ShowRegionNameWithNoTooltip('maghreb_region')]."

 maghrebi_culture.16.title: "Eminente Generale [target_culture.GetNameWithNoTooltip]"
 maghrebi_culture.16.desc: "Il crescente rapporto tra i popoli [target_culture.GetName] e l'élite [ROOT.GetCountry.GetCulture.GetName] si è rivelato vantaggioso, poiché il dominio [ROOT.GetCountry.GetAdjective] nel [ShowRegionName('maghreb_region')] si è stabilizzato. Cercando di dimostrare ulteriormente la propria lealtà alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.Custom('IT_ADJ_FS')], [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] [target_culture.GetNameWithNoTooltip] hanno offerto uno dei loro capi più dotati al servizio di [ROOT.GetCountry.GetNameWithNoTooltip]. Tuttavia, alcuni tra [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] hanno sollecitato [our_ruler.GetName] a rifiutare l'offerta, temendo che cedere autonomia a [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] [target_culture.GetNameWithNoTooltip] possa in ultima analisi nuocere al nostro dominio nel [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.16.a: "Diamo il benvenuto a [target_character.GetShortNameWithNoTooltip] nella [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"
 maghrebi_culture.16.b: "Rifiutiamo di impiegare [target_character.GetHimHer] come generale."

 maghrebi_culture.17.title: "[ROOT.GetCountry.Custom('IT_TRIBES_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] Offrono un Generale Promettente"
 maghrebi_culture.17.desc: "Sebbene [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] di [ROOT.GetCountry.GetName] si siano rivelati un peso per la [ROOT.GetCountry.GetGovernment.GetCourtTitle], negli ultimi anni gli un tempo indisciplinati [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] hanno iniziato a riconoscere l'autorità [ROOT.GetCountry.GetAdjectiveWithNoTooltip] in tutto il [ShowRegionName('maghreb_region')]. Cercando di dimostrare queste lealtà ritrovate alla [ROOT.GetCountry.GetGovernment.GetCourtTitle], [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] hanno offerto [target_character.GetName] al servizio di [ROOT.GetCountry.GetNameWithNoTooltip], di cui si dice abbia grandi talenti. Alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] temono tuttavia che possa trattarsi di uno stratagemma di [ROOT.GetCountry.Custom('IT_TRIBES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] per ottenere influenza su [our_ruler.GetName]."
 maghrebi_culture.17.a: "Accettiamo l'offerta di [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."
 maghrebi_culture.17.b: "Non possiamo rischiare di concedere ulteriore influenza a [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]."

 maghrebi_culture.18.title: "La Crescente Eminenza della Dinastia [our_ruler.GetDynasty.GetNameWithNoTooltip]"
 maghrebi_culture.18.desc: "All'indomani della caduta degli Almohadi, i [ShowDynastyName('marinid_dynasty')] e gli [ShowDynastyName('hafsid_dynasty')] accumularono entrambi un considerevole potere nel [ShowRegionName('maghreb_region')]. Tuttavia, le recenti campagne militari dei [our_ruler.GetDynasty.GetName] hanno spianato la strada all'ascesa di una nuova potenza all'interno del [ShowRegionNameWithNoTooltip('maghreb_region')]. Sebbene il dominio dei [our_ruler.GetDynasty.GetNameWithNoTooltip] nel [ShowRegionNameWithNoTooltip('maghreb_region')] abbia guadagnato sostegno tra la popolazione nativa [ShowCultureGroupNameWithNoTooltip('amazigh_group')], alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito di guardare all'estero se vogliamo superare gli altri grandi attori del [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.18.a: "Dovremmo cercare alleati per rafforzare la nostra posizione."
 maghrebi_culture.18.b: "Concentriamoci invece sulla nostra politica interna."

 maghrebi_culture.19.title: "Unità Condivisa con i Popoli [target_culture.GetNameWithNoTooltip]"
 maghrebi_culture.19.desc: "Sebbene la migrazione dei [ShowCultureName('bedouin_culture')] verso il [ShowRegionName('maghreb_region')] nell'XI secolo abbia trasformato l'assetto politico della regione, i popoli [ROOT.GetCountry.GetCulture.GetName] e [target_culture.GetName] sotto il dominio degli [ROOT.GetCountry.GetAdjectiveWithNoTooltip] condividono un senso di ritrovata unità. Il dominio [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sul loro [ShowRegionNameWithNoTooltip('maghreb_region')] nativo ha in gran parte posto fine alle precedenti ostilità tribali tra questi popoli, che ne sono usciti con una nuova unità condivisa."
 maghrebi_culture.19.a: "Una forte unità ci renderà inconquistabili!"
 maghrebi_culture.19.b: "Dovremmo sfruttare la nostra forte unità con i [target_culture.GetNameWithNoTooltip] per rafforzare la nostra influenza nel [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.19.c: "Il legame culturale tra [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] e [target_culture.GetNameWithNoTooltip] è indissolubile."

 maghrebi_culture.20.title: "Dominio [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sul [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.20.desc: "Sebbene molti tra l'élite [ROOT.GetCountry.GetCulture.GetName] abbiano gradualmente adottato aspetti dei costumi e delle tradizioni [ShowCultureGroupName('arabic_group')], ciò ha talvolta portato a conflitti con i popoli più tradizionalisti del [ShowRegionName('maghreb_region')]. Per [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], i popoli [target_culture.GetName] sono diventati un punto focale di insoddisfazione alla [ROOT.GetCountry.GetGovernment.GetCourtTitle], con molte élite [target_culture.GetNameWithNoTooltip] che si rifiutano di fare affari con [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')].\n\nCercando di usare la propria influenza in tutto [ROOT.GetCountry.GetName], [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] hanno chiesto a [our_ruler.GetName] di adoperarsi per una politica di assimilazione più aggressiva verso i [target_culture.GetNameWithNoTooltip]. Tuttavia, alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno sollecitato [our_ruler.GetShortNameWithNoTooltip] a respingere le loro richieste, temendo l'instabilità che ne deriverebbe."
 maghrebi_culture.20.a: "Adoperiamoci per assimilarli nella società [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]."
 maghrebi_culture.20.b: "Dovremmo invece cercare di integrare i popoli [target_culture.GetNameWithNoTooltip]."

 maghrebi_culture.21.title: "Il Destino del [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.21.desc: "La caduta dell'ultimo stato [ShowReligionGroupAdjective('muslim')] in [ShowRegionName('iberia_region')] ha portato con sé un rinnovato senso di panico in tutto il [ShowRegionName('maghreb_region')], con molti che temono che gli stati [ShowReligionGroupAdjectiveWithNoTooltip('christian')] di [ShowRegionNameWithNoTooltip('iberia_region')] volgeranno presto lo sguardo al [ShowRegionNameWithNoTooltip('maghreb_region')]. Già molti [ShowCultureName('andalusi')] si sono rivolti a [ROOT.GetCountry.GetNameWithNoTooltip] nella speranza di sfuggire all'ira degli [ShowCultureGroupName('iberian_group')]."
 maghrebi_culture.21.a: "Non cederemo agli invasori [ShowCultureGroupNameWithNoTooltip('iberian_group')]!"
 maghrebi_culture.21.b: "Dovremmo restare vigili contro eventuali invasioni."

 maghrebi_culture.22.title: "Presenza nel [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]"
 maghrebi_culture.22.desc: "Sebbene la gente di [ROOT.GetCountry.GetName] sia rimasta più avvezza al commercio sahariano, le campagne di [our_ruler.GetName] hanno aiutato [ROOT.GetCountry.GetNameWithNoTooltip] a stabilire una consistente presenza costiera, ottenendo l'accesso al [ShowScriptedGeographyName('mediterranean_sea_geography')]. Vedendo nuove opportunità commerciali, molti tra [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno sollecitato la [ROOT.GetCountry.GetGovernment.GetCourtTitle] a finanziare l'espansione di una nuova flotta, sebbene alcuni temano che ciò possa turbare il tradizionale commercio sahariano che da tempo giova a [ROOT.GetCountry.GetNameWithNoTooltip]."
 maghrebi_culture.22.a: "Dobbiamo muoverci rapidamente per stabilire una presenza marittima."
 maghrebi_culture.22.b: "Non possiamo trascurare le nostre rotte commerciali sahariane."

 maghrebi_culture.23.title: "Resa dei Conti per l'Élite Arabizzata"
 maghrebi_culture.23.desc: "I [target_culture.GetName] detengono da molto tempo un considerevole potere nel [ShowRegionName('maghreb_region')]. Sono stati anche un punto di attrito con molti popoli [ShowCultureGroupName('amazigh_group')], poiché sostengono politiche di assimilazione aggressive e li esortano ad adottare i costumi [ShowCultureGroupName('arabic_group')]. Con l'ascesa di [ROOT.GetCountry.GetName], una [ROOT.GetCountry.GetFlavorRank] in cui i [ROOT.GetCountry.GetCulture.GetName] mantengono il potere come élite dominante, alcuni tra [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno chiesto a [our_ruler.GetName] di limitare il potere dei [target_culture.GetNameWithNoTooltip]. Altri nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], tuttavia, vedono l'élite [target_culture.GetNameWithNoTooltip] come alleati inestimabili per rafforzare il nostro crescente dominio sul [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.23.a: "Adoperiamoci per un compromesso tra le élite [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip] e [target_culture.GetNameWithNoTooltip]."
 maghrebi_culture.23.b: "L'influenza [target_culture.GetNameWithNoTooltip] sul [ShowRegionNameWithNoTooltip('maghreb_region')] è giunta al termine."

 maghrebi_culture.24.title: "Nuovi Kilim [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip]"
 maghrebi_culture.24.desc: "Gli arazzi [ROOT.GetCountry.GetCulture.GetName] sono da tempo una merce diffusa nel [ShowRegionName('maghreb_region')], oltre che un bene fondamentale per molti mercanti [ROOT.GetCountry.Custom('IT_ADJ_MP')]. Negli ultimi anni, tuttavia, l'acquisizione di una fonte più affidabile di [ShowGoodsNameWithNoTooltip('dyes')] ha portato a una nuova generazione di Kilim [ROOT.GetCountry.GetCulture.GetNameWithNoTooltip], insieme a un crescente interesse per gli arazzi sia nel [ShowRegionName('maghreb_region')] sia all'estero."
 maghrebi_culture.24.a: "Raccogliamo i frutti dei nuovi arazzi."
 maghrebi_culture.24.b: "Dobbiamo continuare a investire nei nuovi arazzi!"

 maghrebi_culture.25.title: "Consolidamento delle Terre [ROOT.GetCountry.Custom('IT_TRIBES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')]"
 maghrebi_culture.25.desc: "Sebbene la forza di [ROOT.GetCountry.Custom('IT_TRIBES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('tribes_estate')] sia stata determinante per garantire che [ROOT.GetCountry.GetName] potesse respingere le minacce in passato, la burocrazia in espansione della [ROOT.GetCountry.GetFlavorRank] ha portato a numerose discussioni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] sulla loro efficacia. Sebbene [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] abbiano contribuito a proteggere [ROOT.GetCountry.GetNameWithNoTooltip] in passato, sono stati anche fonte di guai quando erano in disaccordo con le politiche della [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nCiò ha ora portato a discussioni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] sul fatto che lo stato sia divenuto abbastanza forte da non dover più fare affidamento su [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] per la protezione. Inoltre, [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] devono ora essere tenuti a freno una volta per tutte per rafforzare il crescente stato [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 maghrebi_culture.25.a: "Che a [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] sia ricordato il loro posto in questo mondo."
 maghrebi_culture.25.b: "Manteniamo l'autonomia di [ROOT.GetCountry.Custom('IT_TRIBES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('tribes_estate')] per evitare conflitti interni."

 maghrebi_culture.26.title: "Predominio sul [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.26.desc: "Sebbene il crollo degli Almohadi abbia visto il [ShowRegionName('maghreb_region')] entrare in un periodo di instabilità, oltre all'indebolimento dell'influenza su [ShowRegionName('iberia_region')], [ROOT.GetCountry.GetName] sotto [our_ruler.GetName] è emersa come la potenza di fatto della regione. Sebbene altre porzioni del [ShowRegionNameWithNoTooltip('maghreb_region')] restino ancora al di fuori dell'influenza [ROOT.GetCountry.GetAdjectiveWithNoTooltip], i Regni [ShowCultureGroupName('iberian_group')] saranno più propensi a riconoscere [ROOT.GetCountry.GetNameWithNoTooltip] come un rivale regionale da non sottovalutare, qualora desiderassero conquistare il [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghrebi_culture.26.a: "Saremo i protettori del Maghreb!"

 maghrebi_culture.27.title: "L'Età dell'Oro [our_ruler.GetDynasty.GetNameWithNoTooltip] del [ShowRegionNameWithNoTooltip('maghreb_region')]"
 maghrebi_culture.27.desc: "Con gran parte del [ShowRegionName('maghreb_region')] ora sotto il dominio [ROOT.GetCountry.GetAdjective], i [our_ruler.GetDynasty.GetName] hanno compiuto passi verso il rinnovamento di gran parte dell'importante architettura culturale del [ShowRegionNameWithNoTooltip('maghreb_region')], oltre a promuovere la costruzione di vari nuovi centri di studio. Sebbene la regione fosse un tempo sul punto di essere dominata da potenze esterne, sotto il dominio dei [our_ruler.GetDynasty.GetNameWithNoTooltip] si è invece affermata come una grande potenza venerata in tutto il [ShowScriptedGeographyName('mediterranean_sea_geography')]."
 maghrebi_culture.27.a: "Che il dominio dei [our_ruler.GetDynasty.GetNameWithNoTooltip] continui a portare prosperità"


 maghrebi_culture.28.title: "Influenza sui Corsari"
 maghrebi_culture.28.desc: "Sebbene i corsari del [ShowRegionName('maghreb_region')] si siano guadagnati in tutta [ShowContinentName('europe')] la reputazione di principale forza predatrice nel [ShowScriptedGeographyName('mediterranean_sea_geography')], il loro patrocinio fino ad ora è variato da stato a stato.\n\nTuttavia, con la crescente espansione dell'influenza [ROOT.GetCountry.GetAdjective] sulla costa, molti corsari si sono rivolti a [ROOT.GetCountry.GetNameWithNoTooltip] nella speranza di ottenere il nostro sostegno per intensificare le razzie nel [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]. Alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle], tuttavia, ritengono che ciò crei anche un'opportunità per indebolire i corsari nella speranza di ricostruire i rapporti con le potenze europee che nei secoli si sono attirate la loro ira."
 maghrebi_culture.28.a: "Offriamo il pieno appoggio dello stato."
 maghrebi_culture.28.b: "Permettiamo ai Corsari di continuare le loro operazioni."
 maghrebi_culture.28.c: "Reprimiamo le razzie dei Corsari"

 # Decisions
 maghreb_ibadi_nation_establish_majlis_ammi_said.title: "Centralizzare il Majlis 'Ammi Sa'īd"
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc: "Dalla caduta dei Rustamidi, molti [ShowReligionAdjective('ibadi')] del [ShowRegionName('maghreb_region')] sono stati costretti a fuggire nella Valle del Mzab. Mentre molti di questi stati [ShowReligionAdjectiveWithNoTooltip('ibadi')] hanno scelto di partecipare al Majlis 'Ammi Sa'īd con [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] al timone, altri hanno deciso di mantenere la propria indipendenza.\n\nCon molte delle terre [ShowReligionAdjectiveWithNoTooltip('ibadi')] più popolate ora sotto [ROOT.GetCountry.GetName], [our_ruler.GetName] ha cercato di centralizzare il Majlis 'Ammi Sa'īd a [ROOT.GetCountry.GetCapital.GetName] nella speranza di creare ulteriormente uno stato [ShowReligionAdjectiveWithNoTooltip('ibadi')] forte e influente nel [ShowRegionNameWithNoTooltip('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.desc.entry: "Un consiglio disperso tra stati [ShowReligionAdjective('ibadi')] orgogliosamente indipendenti può consigliare, ma non può governare. Ora che le più popolose di quelle terre rispondono a noi, il Majlis 'Ammi Sa'īd può essere riunito sotto un unico tetto e un'unica autorità. Ciò che era iniziato come un rifugio nella Valle del Mzab diverrebbe allora un reame a pieno titolo in tutto il [ShowRegionName('maghreb_region')]."
 maghreb_ibadi_nation_establish_majlis_ammi_said.a: "La lealtà di [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] contribuirà a rafforzare il nostro dominio!"
 maghreb_ibadi_nation_establish_majlis_ammi_said.a.entry: "La lealtà $crown_estate$ contribuirà a rafforzare il nostro dominio!"

 maghreb_masters_of_the_sahara.title: "Signori del Sahara"
 maghreb_masters_of_the_sahara.desc: "Per generazioni i popoli del [ShowRegionName('maghreb_region')] hanno partecipato al commercio sahariano, attraversando i duri deserti per trasportare preziose merci commerciali. Sebbene possa rivelarsi un compito arduo, se riuscissimo a stabilire una considerevole influenza su [ShowAreaName('desert_area')] ampliando al contempo le infrastrutture delle principali tappe carovaniere, i nostri popoli potrebbero ancora domare queste sabbie implacabili."
 maghreb_masters_of_the_sahara.a: "Abbiamo raggiunto l'impossibile!"
 empower_the_desert_power_privilege_tt: "[ShowEstatePrivilegeName('desert_power')] sarà notevolmente potenziato, ottenendo benefici aggiuntivi che contrastano le penalità subite dalle [locations|e] [ShowVegetationName('desert')] e [ShowClimateName('arid')]"
 empower_the_desert_power_privilege_tt_default_bonus: "[ShowEstatePrivilegeName('desert_power')] otterrà inoltre #G +0.0020#! [ShowModifierTypeName('global_monthly_development')] e #G +2.50%#! [ShowModifierTypeName('global_max_control')]"
