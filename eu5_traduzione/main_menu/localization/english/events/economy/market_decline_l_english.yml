l_english:
 market_decline.1.title: "Il Declino di [withering_market.GetName]"
 market_decline.1.desc: "Il mercato di [withering_market.GetCenterLocation.GetName] non è più il polo commerciale che era un tempo. Con solo una manciata di località ancora ad esso collegate, i nostri mercanti instradano sempre più le loro merci attraverso i mercati vicini meglio serviti. Se lasciato così, il mercato si ridurrà a un semplice casello lungo una strada che porta altrove.\n\nIl nostro gabinetto chiede come vogliamo gestire il declino."
 market_decline.1.a: "Sovvenzionare i mercanti e sostenere il mercato."
 market_decline.1.b: "Sciogliere il mercato e lasciare che le nostre località si uniscano ai loro vicini naturali."
 market_decline.1.b.tt: "Il [market|e] di [withering_market.GetName] viene sciolto. Le sue località si ricollegano al miglior [market|e] successivo."
 market_decline.1.c: "Accettare il declino e lasciare che i mercanti prendano le proprie decisioni."
