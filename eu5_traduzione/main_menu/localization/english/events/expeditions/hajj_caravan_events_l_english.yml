l_english:

 hajj_caravan_events.1.title: "La Strada per [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.1.desc: "La carovana è riunita, le preghiere sono state recitate e inizia il lungo cammino verso [ShowAreaName('hedjaz_area')]. Folle si assiepano lungo le strade per salutarci, prova che questa casa rispetta ancora gli obblighi della fede. [ShowLocationName('mecca')] dista mesi di viaggio, attraverso deserti e acque aperte che puniscono gli impreparati."
 hajj_caravan_events.1.a: "Il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] parte come sovrano e come servo di [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.1.b: "Approvvigioniamo la carovana e allestiamo una scorta per la strada."
 hajj_caravan_events.1.c: "Riforniamo e mettiamo in sicurezza la carovana, e portiamo davanti a noi il #italic maḥmal#!."
 hajj_caravan_events.1.historical_info: "Il califfo abbaside Hārūn ar-Rašīd compì il pellegrinaggio da Baghdad nove volte nel corso del suo regno (786–809), percorrendo persino parte del tragitto a piedi come atto di pietà, e la sua devozione divenne un modello che i sovrani pii si sforzarono di emulare per secoli."

 hajj_caravan_events.display_wealth: "Portiamo apertamente il #italic maḥmal#!, perché tutti possano contemplare la ricchezza [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."

 hajj_caravan_events.guards_up_tt: "La scorta armata della carovana cresce (#G +25#! Scorta Armata)"
 hajj_caravan_events.guards_down_15_tt: "La scorta armata della carovana è indebolita (#R -15#! Scorta Armata)"
 hajj_caravan_events.guards_down_20_tt: "La scorta armata della carovana è indebolita (#R -20#! Scorta Armata)"
 hajj_caravan_events.splendor_up_15_tt: "Lo splendore della carovana cresce (#G +15#! Splendore)"
 hajj_caravan_events.splendor_up_20_tt: "Lo splendore della carovana cresce (#G +20#! Splendore)"
 hajj_caravan_events.splendor_up_30_tt: "Lo splendore della carovana cresce (#G +30#! Splendore)"
 hajj_caravan_events.splendor_down_10_tt: "Lo splendore della carovana è diminuito (#R -10#! Splendore)"
 hajj_caravan_events.splendor_down_15_tt: "Lo splendore della carovana è diminuito (#R -15#! Splendore)"
 hajj_caravan_events.splendor_down_20_tt: "Lo splendore della carovana è diminuito (#R -20#! Splendore)"
 hajj_caravan_events.splendor_down_25_tt: "Lo splendore della carovana è diminuito (#R -25#! Splendore)"
 hajj_caravan_events.weakened_tt: "Spinta avanti senza riposo, la carovana resta indebolita per le prove che ancora l'attendono"
 hajj_caravan_events.recovered_tt: "Riposata e dissetata, la carovana si scrolla di dosso la stanchezza"
 hajj_caravan_events.mahmal_lost_tt: "Il maḥmal è andato perduto nella tempesta"
 hajj_caravan_events.mahmal_gained_tt: "La carovana porta ora il maḥmal, il che consente ostentazioni di ricchezza agli ospiti stranieri lungo il cammino, anche se può andare perduto per mano di predoni o per tempeste"

 hajj_caravan_events.2.title: "La Porta di [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.2.desc: "[ShowLocationName('jeddah')]. L'antico porto [jeddah_location.GetRank.GetName|l] odora di [ShowGoodsName('salt')], [ShowGoodsName('incense')] e del sudore di diecimila pellegrini giunti prima di noi via mare. I mercanti smerciano provviste a prezzi raddoppiati e gli studiosi discutono sul giusto ordine dei riti. [ShowLocationName('mecca')] è ormai vicina, a meno di tre giorni di cammino, ma la carovana è stanca e le provviste scarseggiano. Potremmo proseguire dritti, oppure fermarci un giorno qui per riposare e rifornirci."
 hajj_caravan_events.2.a: "Riposiamo qui, ed entriamo nella città santa freschi."
 hajj_caravan_events.2.b: "Siamo arrivati troppo lontano per fermarci ora. Avanti verso [ShowLocationNameWithNoTooltip('mecca')]."
 hajj_caravan_events.2.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.2.historical_info: "Il califfo 'Uṯmān ibn 'Affān, terzo dei califfi Rāšidūn, designò nel 646 Gedda come porto ufficiale d'ingresso per i pellegrini che arrivavano via mare, ruolo che la città ha mantenuto da allora per il traffico dell'Ḥajj."

 hajj_caravan_events.3.title: "La Ka'ba"
 hajj_caravan_events.3.desc: "La Grande Moschea si apre davanti a noi e la Ka'ba si erge al suo centro, avvolta di nero e antica, più vecchia della memoria. Attorno a essa i fedeli in vesti bianche si muovono in pazienti cerchi, a migliaia, da ogni terra in cui si ode il richiamo alla preghiera. Qui, sultano e pastore vestono allo stesso modo. Il viaggio è finito. Ora la questione è che tipo di pellegrino saremo. Ciò che qui viene offerto avrà eco per una generazione nei mercati, nelle moschee e nelle corti del mondo musulmano."
 hajj_caravan_events.3.a: "Distribuiamo oro senza risparmio. Nessun pellegrino qui resti affamato."
 hajj_caravan_events.3.b: "Dotiamo le moschee e gli studiosi che custodiscono la città santa."
 hajj_caravan_events.3.c: "Compiamo i riti in silenzio. È una questione tra noi e [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.3.d: "Il nostro [ShowBureaucracyTypeNameWithNoTooltip('diwan_al_hajj_bureaucracy')] ha già provveduto a tutto."
 hajj_caravan_events.3.e: "Non badiamo a spese. Ricopriamo la carovana d'oro e di seta."
 hajj_caravan_events.3.historical_info: "L'Ḥajj reale più celebre della storia fu quello di Mansa Mūsā I del Mali nel 1324. Viaggiando con un seguito di sessantamila persone e portando oro a sufficienza da distribuirlo liberamente a ogni tappa, il suo pellegrinaggio causò un crollo decennale dei prezzi dell'oro in tutto il Nord Africa e il Medio Oriente. La sua visita alla corte del sultano egiziano fu ampiamente documentata dai cronisti arabi, che registrarono sia la sua straordinaria generosità sia lo sconvolgimento economico che ne derivò."

 hajj_caravan_events.4.title: "La Città dai Mille Minareti"
 hajj_caravan_events.4.desc: "[ShowLocationName('cairo')] è vasta e antica, e inghiotte la carovana nel momento in cui varchiamo la porta settentrionale: rumore, spezie, cuoio in concia, carne arrostita. Sopra i tetti si leva la grande moschea di Al-Azhar, i cui studiosi sono annoverati tra i migliori del mondo [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]. Il nostro sovrano potrebbe trattenersi a studiare presso di loro, oppure semplicemente rifornirsi e proseguire verso [ShowLocationName('mecca')]."
 hajj_caravan_events.4.a: "Sediamo con gli studiosi di Al-Azhar finché possiamo."
 hajj_caravan_events.4.b: "Siamo venuti per [ShowLocationNameWithNoTooltip('mecca')], non per [ShowLocationNameWithNoTooltip('cairo')]. Rifornirsi e partire."
 hajj_caravan_events.4.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.4.historical_info: "Lo storico e studioso Ibn Ḵaldūn si stabilì al Cairo nel 1382, dove insegnò ad Al-Azhar e fu capo dei giudici malikiti della città. La sua reputazione attirava sovrani e studiosi in visita da tutto il mondo musulmano, desiderosi di assistere alle sue lezioni o di chiedere il suo consiglio."

 hajj_caravan_events.5.title: "L'Antica Capitale"
 hajj_caravan_events.5.desc: "[ShowLocationName('baghdad')] fu un tempo la più grande città del mondo, capitale di un califfato che si estendeva dall'[ShowContinentName('atlantic_ocean_continent')] all'[ShowSubContinentName('central_asia')] prima che i Mongoli la riducessero in cenere. Ciò che resta è più quieto, con mercati più piccoli e studiosi meno fervidi, ma i santuari dei suoi santi defunti attirano ancora pellegrini da tutto l'oriente, e il nostro sovrano potrebbe renderne omaggio qui prima di volgere a sud verso [ShowAreaName('hedjaz_area')]."
 hajj_caravan_events.5.a: "Visitiamo i santuari e cerchiamo i loro studiosi."
 hajj_caravan_events.5.b: "Rendiamo omaggio, poi avanti."
 hajj_caravan_events.5.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.5.historical_info: "Zubayda bint Ja'far, moglie del califfo abbaside Hārūn ar-Rašīd, finanziò la costruzione della Darb Zubayda, una strada per pellegrini con pozzi, cisterne e stazioni di sosta che correva da vicino a Baghdad fino alla Mecca, dopo aver visto di persona le difficoltà del percorso."

 hajj_caravan_events.6.title: "La Sosta Damascena"
 hajj_caravan_events.6.desc: "I frutteti lasciano il posto alle mura di [ShowLocationName('damascus')], una delle città più antiche ancora in piedi, la cui Grande Moschea è famosa in tutto il mondo della fede. Pregare sotto la sua cupola e sedere con i giuristi che affollano i suoi cortili ci costerebbe giorni che forse non abbiamo; la carovana potrebbe altrettanto bene abbeverarsi, rifornirsi e partire entro il mattino."
 hajj_caravan_events.6.a: "Indugiamo un po' tra le sue moschee e i suoi giuristi."
 hajj_caravan_events.6.b: "Abbeveriamo le bestie e partiamo all'alba."
 hajj_caravan_events.6.c: "$hajj_caravan_events.display_wealth$"
 hajj_caravan_events.6.historical_info: "Negli anni 1550, il sultano ottomano Solimano il Magnifico fece costruire a Damasco il complesso della Takiyya as-Sulaymāniyya, una moschea con ostello e mensa per i poveri eretta appositamente per ospitare e sfamare le migliaia di pellegrini che vi si radunavano ogni anno prima della partenza della carovana dell'Ḥajj per la Mecca."

 hajj_caravan_events.7.title: "Ḥājjī"
 hajj_caravan_events.7.desc: "La carovana torna a casa, con le scorte più leggere e i pellegrini cambiati. La voce ha già superato i cammelli, e le folle si radunano per dare il bentornato a un sovrano che è stato davanti alla Ka'ba ed è vissuto per raccontarlo. Da questo giorno il nostro sovrano porta il titolo di Ḥājjī: guadagnato, non concesso, e suo per sempre."
 hajj_caravan_events.7.a: "Si sappia: a [ShowLocationNameWithNoTooltip('mecca')] e ritorno, per grazia di [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.7.historical_info: "Askia Muḥammad Ture dell'Impero Songhai intraprese l'Ḥajj nel 1496-97 con un seguito di centinaia di persone e una fortuna in oro da distribuire in elemosine lungo il cammino. Al Cairo, il pretendente abbaside al califfato gli concesse il titolo di Califfo del Sudan, ed egli tornò a casa come al-Ḥajj, con la propria autorità sull'Islam dell'Africa occidentale confermata dal pellegrinaggio."

 hajj_caravan_events.8.title: "Morte sulla Strada per [ShowLocationNameWithNoTooltip('mecca')]"
 hajj_caravan_events.8.desc: "Alla carovana giunge notizia che il nostro sovrano è morto lungo il cammino, lontano da casa e ancor più lontano dalla Ka'ba. Senza un sovrano alla testa, la carovana non può proseguire com'era. Si spezza: alcuni pellegrini tornano indietro, altri proseguono da soli per compiere i riti per cui erano venuti."
 hajj_caravan_events.8.a: "Che [ROOT.GetCountry.GetReligion.GetGodName] abbia pietà della sua anima."

 hajj_caravan_events.hire_escorts: "Assoldiamo altre guardie per la strada che ci attende."
 hajj_caravan_events.adorn: "Adorniamo la carovana di stendardi e seta, poi attendiamo."
 hajj_caravan_events.2.d: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.5.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.6.e: "$hajj_caravan_events.adorn$"
 hajj_caravan_events.4.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.5.d: "$hajj_caravan_events.hire_escorts$"
 hajj_caravan_events.6.d: "$hajj_caravan_events.hire_escorts$"

 hajj_caravan_events.9.title: "Predoni sulla Strada"
 hajj_caravan_events.9.desc: "Dalla foschia di calore emergono cavalieri del deserto con le lance alzate, che girano attorno alla colonna. Ci hanno osservati attraversare le loro sabbie e hanno giudicato la carovana degna di essere saccheggiata. Le nostre guardie serrano i ranghi, ma uno scontro nel deserto aperto non è mai cosa certa."
 hajj_caravan_events.9.a: "Paghiamo il tributo. L'argento costa meno del sangue."
 hajj_caravan_events.9.b: "Che la scorta si guadagni la paga."
 hajj_caravan_events.9.b.chance_tt: "Le nostre guardie potrebbero non riuscire a respingere i predoni, costando guardie e splendore anziché [prestige|e]"
 hajj_caravan_events.9.c: "Questi sono pellegrini diretti a [ShowLocationNameWithNoTooltip('mecca')], sotto la protezione di [ROOT.GetCountry.GetReligion.GetGodName]."
 hajj_caravan_events.9.c.chance_tt: "L'appello potrebbe non bastare a respingere i predoni, costando guardie e splendore anziché [prestige|e] e [legitimacy|e]"

 hajj_caravan_events.10.title: "I Pozzi Asciutti"
 hajj_caravan_events.10.desc: "I pozzi più avanti sono vuoti: fango screpolato sul fondo, prosciugati fino all'ultima goccia da qualche carovana passata giorni prima di noi. Gli otri appesi ai fianchi dei cammelli sono già leggeri, le bestie muggiscono per la sete e il sole sale più alto, senza pietà. Le guide si mettono a borbottare su quanto disti la prossima buona acqua."
 hajj_caravan_events.10.a: "Meglio lenti che morti. Dirigiamoci al pozzo lontano."
 hajj_caravan_events.10.b: "La prossima acqua andrà bene. Continuiamo a muoverci."

 hajj_caravan_events.11.title: "Il Simun"
 hajj_caravan_events.11.desc: "L'orizzonte assume il colore della ruggine e il vento sale fino a un urlo. Un muro di sabbia rotola sulla colonna e in pochi istanti non c'è più né strada, né cielo, né cavaliere davanti a noi: solo il buio che punge."
 hajj_caravan_events.11.a: "Giù i carichi, su i veli. Aspettiamo che passi."
 hajj_caravan_events.11.b: "Leghiamo insieme la colonna e proseguiamo."

 hajj_caravan_events.12.title: "Febbre nella Carovana"
 hajj_caravan_events.12.desc: "Comincia con pochi casi, ma al mattino è in ogni tenda: una febbre che consuma in pochi giorni anche i più forti. Stipati insieme lungo la strada, i pellegrini non hanno modo di evitarla."
 hajj_caravan_events.12.a: "Ci fermiamo. Nessun pellegrino muoia abbandonato."
 hajj_caravan_events.12.b: "La stagione non aspetterà i malati."

 hajj_caravan_events.13.title: "Il Prezzo del [toll_owner.GetGovernment.GetRulerTitle]"
 hajj_caravan_events.13.desc: "La strada davanti a noi attraversa le terre di un signore locale, e i suoi cavalieri la sbarrano in sella, con le lance a terra e senza alcuna fretta. Il suo araldo si fa avanti sorridendo: c'è un pedaggio per l'acqua, un pedaggio per il passaggio, un pedaggio per la sabbia stessa sotto i nostri piedi, e la carovana non si muove oltre finché non sarà pagato. Dietro di noi i pellegrini attendono nel caldo, osservando di che pasta sia fatto il loro sovrano."
 hajj_caravan_events.13.a: "Paghiamo l'uomo e chiudiamo la questione."
 hajj_caravan_events.13.b: "Non gli dobbiamo nulla. Aggiriamo i suoi pozzi."
 hajj_caravan_events.13.c: "Che il [toll_owner.GetGovernment.GetRulerTitle] veda la nostra carovana e riconsideri il pedaggio."

 hajj_caravan_events.14.title: "La Sosta Verde"
 hajj_caravan_events.14.desc: "Palme si levano dalla sabbia davanti a noi, e sotto di esse una sorgente, e attorno a essa gente che esce incontro ai pellegrini con datteri e acqua fresca. Dare riparo a chi è diretto alla città santa è già di per sé un atto di devozione, e offerto liberamente."
 hajj_caravan_events.14.a: "Riposiamo e abbeveriamo del tutto la carovana prima di ripartire."
 hajj_caravan_events.14.b: "Dividiamo le nostre provviste con i poveri dell'oasi."
 hajj_caravan_events.14.c: "Ringraziamoli e restiamo sulla strada."

 hajj_caravan_events.15.title: "Studiosi sulla Strada"
 hajj_caravan_events.15.desc: "Un gruppo di studiosi itineranti si unisce alla carovana, diretto alla stessa città santa, con le bisacce cariche di libri. Attorno ai fuochi serali disquisiscono di legge e scritture fino a notte inoltrata."
 hajj_caravan_events.15.a: "Sediamo tra loro e ascoltiamo."
 hajj_caravan_events.15.b: "Rispondiamo loro argomento per argomento."

 hajj_caravan_events.16.title: "La Stagione è Passata"
 hajj_caravan_events.16.desc: "Arriviamo troppo tardi. L'anno è girato, e con esso la sosta a 'Arafāt ci è sfuggita: le ore tra mezzogiorno e tramonto in cui ogni pellegrino della stagione avrebbe dovuto stare insieme agli altri su quella piana, ai piedi del Monte della Misericordia, a pregare e a chiedere perdono. Un detto del Profeta afferma che l'Ḥajj non è né più né meno che quel singolo pomeriggio; mancarlo significa che nessun rito compiuto in seguito può completare il pellegrinaggio. La carovana non può far altro che disperdersi e tornare a casa, e il viaggio dovrà essere rifatto dall'inizio l'anno prossimo."
 hajj_caravan_events.16.a: "Abbiamo indugiato troppo. Dovrà essere intrapreso di nuovo."

 hajj_caravan_events.17.title: "La Tempesta"
 hajj_caravan_events.17.desc: "Il cielo si fa nero e il mare si solleva in grigie colline d'acqua. La nave beccheggia, il sartiame stride e un'onda presa male potrebbe sfondare uno scafo o trascinare a fondo una nave con tutte le anime a bordo."
 hajj_caravan_events.17.a: "Tenete duro. I carpentieri l'hanno costruita bene."
 hajj_caravan_events.17.b: "Diamole il vento e corriamo."

 hajj_caravan_events.18.title: "In Bonaccia"
 hajj_caravan_events.18.desc: "Il vento cala fino a spegnersi. Le vele pendono flosce, il mare giace piatto come metallo battuto e la nave resta immobile sotto un sole spietato. L'acqua scarseggia, e i nervi ancor più, a ogni giorno senza vento."
 hajj_caravan_events.18.a: "Aspettiamo. Il vento ritorna sempre."
 hajj_caravan_events.18.b: "Fuori le barche. Non ce ne staremo qui a marcire."

 hajj_caravan_events.19.title: "Febbre Sottocoperta"
 hajj_caravan_events.19.desc: "Una malattia si insinua nell'aria stretta e fetida sottocoperta, e nel giro di pochi giorni i malati superano i sani. La nave deve comunque essere governata, e a ogni alba le mani disponibili sono meno."
 hajj_caravan_events.19.a: "Facciamo rotta verso terra. L'equipaggio ha bisogno di acqua pulita."
 hajj_caravan_events.19.b: "Manteniamo la rotta e confidiamo nella resistenza degli uomini."

 hajj_caravan_events.20.title: "Corsari"
 hajj_caravan_events.20.desc: "Una galea bassa e veloce taglia verso la flotta con altre due al seguito, i remi scintillanti al sole. Nessuna bandiera, nessun richiamo, solo il bagliore delle lame lungo i parapetti e il ritmo sempre più incalzante di un tamburo che si propaga sull'acqua. Corsari, e hanno scelto i pellegrini come preda. Le vedette lanciano l'allarme mentre sottocoperta i fedeli stringono i loro fagotti e le loro preghiere."
 hajj_caravan_events.20.a: "Compriamo il nostro passaggio e togliamoci di mezzo."
 hajj_caravan_events.20.b: "Sgombrate i ponti. Apriamoci un varco tra di loro."
 hajj_caravan_events.20.b.chance_tt: "Le nostre guardie potrebbero non riuscire a respingere i corsari, costando guardie e splendore anziché [prestige|e]"

 hajj_caravan_events.21.title: "La Scogliera"
 hajj_caravan_events.21.desc: "Un sussulto stridente percorre l'intero scafo e il ponte si inclina sotto i piedi: una scogliera non cartografata, i cui denti di corallo scorticano il fasciame sotto la linea di galleggiamento. L'acqua di mare gorgoglia già nella stiva, e l'equipaggio si getta sulle pompe. Lo scafo è squarciato e si sta abbassando, ma non è ancora perduto, e la terra più vicina è solo una bassa macchia verde all'orizzonte."
 hajj_caravan_events.21.a: "Arenamo la flotta e ripariamola come si deve."
 hajj_caravan_events.21.b: "Lasciamo un equipaggio a salvarla. Gli altri proseguono."

 hajj_caravan_events.22.title: "Un Mercante in Mare"
 hajj_caravan_events.22.desc: "Una nave mercantile ci chiama attraverso l'acqua, con i ponti stipati di rotoli di seta e stoffe pregiate di porti lontani. Il suo capitano commercerà a prezzo di mercante, ma solo dopo la placida trattativa di un mercante."
 hajj_caravan_events.22.a: "Compriamo la stoffa più pregiata a bordo."
 hajj_caravan_events.22.b: "Niente tempo per trattare. Facciamoli proseguire."
