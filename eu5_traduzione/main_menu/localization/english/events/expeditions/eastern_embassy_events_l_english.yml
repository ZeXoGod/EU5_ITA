l_english:
 # Eastern Alliance Embassy events
 received_eastern_alliance_embassy: "Ambasciata Ricevuta da una Corte Lontana"
 eastern_embassy_events.1.title: "Un'Ambasciata alle Corti Lontane"
 eastern_embassy_events.1.desc: "L'ambasciata sta per partire alla volta di una corte oltre ogni orizzonte familiare. Le terre di mezzo sono rette da potenze che potrebbero sbarrare la strada, il mare è pattugliato da flotte che potrebbero sequestrare il carico, e il principe al termine del viaggio non ha alcun motivo di riconoscere la nostra pretesa di importanza."
 eastern_embassy_events.1.desc.persia: "$eastern_embassy_events.1.desc$ [dest_country.Custom('IT_La')|U][dest_country.GetName] siede sul trono a [dest_city.GetName], potenza le cui guerre trarrebbero grande vantaggio da qualsiasi secondo fronte che potessimo promettere. La strada passa per [ShowLocationName('hormuz')], dove il commercio dell'[ShowRegionName('indian_ocean_region')] incontra le vie di terra [dest_country.Custom('IT_ADJ_FP')]. Il modo in cui [target_leader.GetName] si presenterà alla [dest_country.GetGovernment.GetCourtTitle] del [dest_country.Custom('GetRulerOrRegentTitle')] determinerà se l'ambasciata sarà accolta come pari o come una curiosità."
 eastern_embassy_events.1.desc.ethiopia: "$eastern_embassy_events.1.desc$ [dest_country.Custom('IT_La')|U][dest_country.GetName] ha la sua antica sede a [dest_city.GetName], cuore [desc_country.GetReligion.GetAdjective] degli altopiani di cui le cronache parlano da secoli senza certezza. La strada passa per [ShowLocationName('alexandria')], poi attraverso il [ShowAreaName('red_sea_area')] e dentro una terra di chiese scavate nella roccia viva. Poche ambasciate della nostra parte del mondo hanno mai raggiunto il [dest_country.Custom('GetRulerOrRegentTitle')]."
 eastern_embassy_events.1.a: "Un'ambasciata sobria di inviati e chierici, austera ma chiara nei suoi scopi."
 eastern_embassy_events.1.a.tt: "Segna l'ambasciata come austera: alla corte di destinazione, l'opzione del patto congiunto concederà [ShowModifier('eastern_alliance_persia')] o [ShowModifier('eastern_alliance_ethiopia')] a seconda dell'ospite"
 eastern_embassy_events.1.b: "Un'ambasciata sontuosa, con tesori, [ShowGoodsNameWithNoTooltip('silk')] e cerimoniale sufficienti a onorare un pari."
 eastern_embassy_events.1.b.tt: "Segna l'ambasciata come sontuosa: alla corte di destinazione, l'opzione della presentazione dei doni concederà [ShowModifier('eastern_alliance_persia')] o [ShowModifier('eastern_alliance_ethiopia')], oltre a bonus di prestigio e legittimità"
 eastern_embassy_events.1.c: "Una pratica delegazione commerciale, con mercanti e doni modesti."
 eastern_embassy_events.1.c.tt: "Segna l'ambasciata come delegazione commerciale: alla corte di destinazione, l'opzione della rotta commerciale concederà [ShowModifier('eastern_route_open')]"
 eastern_embassy_events.1.historical_info: "Ambasciate dirette alle corti di Persia ed Etiopia furono un'ambizione ricorrente dell'Europa cristiana. Uzun Hasan degli Aq Qoyunlu inviò messi a Venezia negli anni 1460 per cercare un'azione congiunta contro gli Ottomani, e missioni portoghesi raggiunsero la corte etiope di Lebna Dengel all'inizio del XVI secolo. Le distanze erano enormi, i protocolli diplomatici del tutto diversi dalle norme europee, e gli esiti furono quasi sempre inferiori a quanto entrambe le parti avevano sperato."
 eastern_embassy_events.2.title: "Al Crocevia dell'Oriente"
 eastern_embassy_events.2.desc: "L'ambasciata raggiunge il grande crocevia dove da mille anni si contratta il commercio del mondo. I [ShowBuildingTypeName('caravanserai')] sono pieni di mercanti che hanno percorso molte volte il cammino successivo, di chierici che conoscono i costumi della corte e di informatori disposti a vendere ciò che sanno al giusto prezzo. La strada verso oriente sarà più agevole con le loro conoscenze."
 eastern_embassy_events.2.desc.hormuz: "$eastern_embassy_events.2.desc$ [crossroad_city.GetName] è il cardine del commercio orientale, la fortezza insulare dove il [ShowAreaName('persian_gulf_sea_zones_area')] si apre sull'[ShowRegionName('indian_ocean_region')]. Ogni mercante di rilievo tra [ShowLocationName('cairo')] e [ShowLocationName('goa')] è passato per i suoi [ShowBuildingTypeName('caravanserai')]. La strada verso la [dest_country.GetGovernment.GetCourtTitle] del [dest_country.Custom('GetRulerOrRegentTitle')] corre da qui verso nord, attraverso paesaggi che nessuna ambasciata occidentale ha attraversato a memoria d'uomo."
 eastern_embassy_events.2.desc.alexandria: "[crossroad_city.GetName] è il grande porto del Mediterraneo orientale, dove si incrociano pellegrini, mercanti e profughi di ogni setta [ShowReligionGroupAdjective('christian')]. I monaci [ShowCultureName('coptic_culture')] hanno compiuto molte volte il viaggio verso sud, fino agli altopiani [dest_country.Custom('IT_ADJ_MP')], e i loro resoconti del paese sono abbastanza dettagliati da avere un'utilità militare, per il giusto prezzo."
 eastern_embassy_events.2.a: "Fermiamoci un poco ad ascoltare. La conoscenza della [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip] vale più della fretta."
 eastern_embassy_events.2.a.tt: "Sblocca un'opzione speciale di udienza che concede [ShowModifier('eastern_alliance_persia')] o [ShowModifier('eastern_alliance_ethiopia')] insieme a [ShowModifier('eastern_route_open')]"
 eastern_embassy_events.2.b: "Proseguiamo. Il nostro messaggio non guadagnerà nulla dal ritardo."
 eastern_embassy_events.2.c: "Cerchiamo i nostri correligionari in città perché ci procurino delle presentazioni."
 eastern_embassy_events.2.historical_info: "Hormuz e Alessandria erano i due grandi mercati di informazioni del mondo medievale e della prima età moderna. Un'ambasciata straniera poteva acquistare, a pagamento, resoconti sull'etichetta di corte, sulle dispute di fazione in corso, sulle preferenze personali del sovrano e sui nomi dei funzionari che avrebbero davvero deciso l'accoglienza dell'ambasciata. Le ambasciate che arrivavano senza questa preparazione fallivano di regola per ragioni che nulla avevano a che fare con la sostanza delle loro proposte."
 eastern_embassy_events.3.title: "La Carovana si Ferma"
 eastern_embassy_events.3.desc: "La strada si restringe attraverso un territorio accidentato e dei cavalieri armati bloccano il passaggio, una ventina, ben montati e ben armati. Il loro capo pretende un pedaggio per lasciarci passare: [ShowGoodsName('silver')], o una parte delle provviste dell'ambasciata, o la scelta dei suoi [ShowGoodsName('horses')]. L'interprete spiega che è l'accordo consueto e che pagarlo non è disonorevole."
 eastern_embassy_events.3.a: "Paghiamo il pedaggio e proseguiamo senza incidenti."
 eastern_embassy_events.3.b: "Apriamoci la strada con le armi. Non siamo venuti fin qui per farci derubare."
 eastern_embassy_events.3.historical_info: "La riscossione tribale dei pedaggi sulle carovane era la normale base economica della vita lungo ogni strada commerciale a lunga distanza. Lo Šayḵ o il capo locale che controllava una gola o un punto d'acqua aveva diritto, per consuetudine più antica di qualsiasi impero attraversato dalla strada, a una parte del valore di ogni carovana. Il rifiuto di pagare non era prevenzione del furto; era una dichiarazione che la carovana si considerava al di fuori dell'ordine locale, con tutti i rischi che ciò comportava."
 eastern_embassy_events.4.title: "Udienza a [court_city.GetNameWithNoTooltip]"
 eastern_embassy_events.4.desc: "La sala di [court_city.GetName] non somiglia a nessuna sala del trono d'Occidente. Il [court_country.Custom('GetRulerOrRegentTitle')] [court_country.Custom('IT_Di')][court_country.GetName], [shah.GetName], siede su un palco rialzato sopra i supplicanti, affiancato da visir in vesti di stato, da segretari che registrano tutto in caratteri [court_country.GetCourtLanguage.GetName] e da ambasciatori di una dozzina di corti che l'Occidente non riconosce formalmente. [target_leader.GetName] è ammesso al secondo rango degli ospiti stranieri, la posizione che i funzionari del protocollo hanno stabilito per un sovrano della nostra distanza e del nostro rango."
 eastern_embassy_events.4.a: "Proponiamo un patto congiunto contro i nostri nemici comuni."
 eastern_embassy_events.4.b: "Presentiamo i doni con tutto il cerimoniale che l'occasione richiede."
 eastern_embassy_events.4.c: "Apriamo la rotta commerciale meridionale attraverso [crossroad_city.GetNameWithNoTooltip], con le nostre merci su ogni carovana."
 eastern_embassy_events.4.d: "Applichiamo ciò che abbiamo appreso a [crossroad_city.GetNameWithNoTooltip] sui costumi di questa corte."
 eastern_embassy_events.4.historical_info: "Le corti persiane del tardo Medioevo e della prima età moderna, dagli Aq Qoyunlu ai Safavidi, mantennero un elaborato cerimoniale che combinava le tradizioni mongole di sovranità universale con la raffinatezza amministrativa persiana. Le ambasciate straniere erano accolte con formale cortesia ma classificate secondo una rigida gerarchia di distanza e prestigio. L'azione congiunta contro l'Impero Ottomano era una possibilità ricorrente che non maturò quasi mai in un vero coordinamento militare, anche se la minaccia stessa condizionò la strategia ottomana per tutto il periodo."
 eastern_embassy_events.5.title: "Udienza a [court_city.GetNameWithNoTooltip]"
 eastern_embassy_events.5.desc: "La [court_country.GetGovernment.GetCourtTitle] di [court_city.GetName] si tiene in una sala le cui pareti sono dipinte con scene delle Vite dei Santi, in caratteri [court_country.GetCourtLanguage.GetName] che nessuno dei chierici dell'ambasciata sa leggere. [negus.GetName], [court_country.Custom('GetRulerOrRegentTitle')] [court_country.Custom('IT_Di')][court_country.GetNameWithNoTooltip], riceve l'ambasciata seduto su un trono portato dal palazzo più antico, assistito da #italic abuna#! e #italic däǧǧazmač#! in vesti color cremisi e oro. Il legame di una fede condivisa è inconfondibile, per quanto diverso sia il rito. L'ambasciata è stata accolta da [ROOT.GetCountry.GetReligion.GetGroup.GetAdjectiveWithNoTooltip] a [court_country.GetReligion.GetGroup.GetAdjectiveWithNoTooltip]."
 eastern_embassy_events.5.a: "Proponiamo una crociata comune contro le potenze [ShowReligionGroupAdjective('muslim')] che ci separano."
 eastern_embassy_events.5.b: "Presentiamo doni e reliquie degni di un re [ROOT.GetCountry.GetReligion.GetGroup.GetAdjectiveWithNoTooltip] unto."
 eastern_embassy_events.5.c: "Negoziamo l'accesso al commercio del [ShowAreaNameWithNoTooltip('red_sea_area')] di spezie, [ShowGoodsNameWithNoTooltip('goods_gold')] e [ShowGoodsNameWithNoTooltip('ivory')]."
 eastern_embassy_events.5.d: "Applichiamo ciò che abbiamo appreso a [crossroad_city.GetNameWithNoTooltip] sui costumi di questa corte."
 eastern_embassy_events.5.historical_info: "Il regno cristiano d'Etiopia conservò una tradizione ecclesiastica ininterrotta fin dalla tarda antichità e, dal XIV secolo in poi, le ambizioni europee di stabilire un contatto con esso furono alimentate dalla leggenda del Prete Gianni, il re cristiano la cui alleanza avrebbe schiacciato le potenze musulmane tra l'Europa e l'India. Le ambasciate portoghesi raggiunsero infine la corte etiope nel 1493 e di nuovo con Rodrigo de Lima nel 1520. Il rapporto era reale, ma le aspettative strategiche dell'Occidente furono sempre sproporzionate rispetto a ciò che entrambe le parti potevano offrire."
