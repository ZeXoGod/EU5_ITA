l_english:

 mining_survey_events.1.title: "La Commissione di Prospezione"
 mining_survey_events.1.desc: "Una squadra di prospettori è pronta nel cortile, con i muli da soma carichi di picconi, trapani e una cassa di legno oliato contenente i crogioli, le bilance e gli acidi del saggiatore. Percorreranno per un anno le nostre zone montuose, saggiando i letti dei torrenti in cerca di oro alluvionale, martellando i filoni di quarzo e interrogando i pastori su quali valli restituiscano pagliuzze nel setaccio. Le colline hanno già ceduto le loro ricchezze in passato, spesso a popoli che abbiamo del tutto dimenticato. Non c'è ragione di credere che non ne abbiano più."
 mining_survey_events.1.a: "Non badiamo a spese. Inviamo saggiatori esperti e oro per i campioni."
 mining_survey_events.1.b: "Basterà un compenso modesto. I capi villaggio forniranno guide e riparo."
 mining_survey_events.1.historical_info: "La prospezione sistematica era praticata in tutta l'Europa medievale e della prima età moderna, più celebre nei monti Metalliferi di Sassonia e Boemia, dove la scoperta di filoni d'argento nel XII secolo diede vita alle città minerarie di Freiberg, Jáchymov e Schneeberg. Il #italic De re metallica#! (1556) di Georgius Agricola divenne il manuale di riferimento del mestiere, descrivendo nel dettaglio l'uso della bacchetta da rabdomante, il saggio dei campioni di minerale in piccoli crogioli e le consuetudini legali che regolavano la delimitazione dei diritti minerari."

 mining_survey_events.10.title: "Un Filone di [ShowGoodsNameWithNoTooltip('iron')]"
 mining_survey_events.10.desc: "I prospettori hanno incontrato un filone di minerale di [ShowGoodsName('iron')] di alta qualità che si addentra nella montagna, con la roccia striata di nero e di rosso là dove i picconi l'hanno messa a nudo. Il capo del villaggio più vicino dice che suo nonno parlava di vecchi scavi da qualche parte sul pendio soprastante; i nuovi pozzi potrebbero semplicemente riaprire ciò che era andato perduto. Le forge e le fonderie a valle mangeranno bene per una generazione, se la scoperta regge."
 mining_survey_events.10.a: "Annunciamo la scoperta, perché [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sappia cosa possediamo."
 mining_survey_events.10.b: "Sfruttiamolo in silenzio. Le fonderie rivali non devono ancora saperlo."
 mining_survey_events.10.historical_info: "L'estrazione del ferro nell'Europa premoderna si concentrava su piccoli scavi di superficie e pozzi poco profondi che seguivano l'affioramento visibile del minerale, con forni a bassofuoco che convertivano il minerale in ferro battuto vicino alla miniera. L'altoforno, introdotto nel tardo medioevo, permise la produzione di ghisa in quantità molto maggiori, e le grandi regioni produttrici di ferro della Svezia, della Stiria e dei Paesi Baschi costruirono su di esso la loro prosperità della prima età moderna."

 mining_survey_events.11.title: "Un Giacimento di [ShowGoodsNameWithNoTooltip('copper')]"
 mining_survey_events.11.desc: "I prospettori hanno seguito una striscia di roccia macchiata di verde lungo il fianco di una collina e ne hanno trovato l'origine: un giacimento di [ShowGoodsName('copper')] che attraversa la parete rocciosa, esposto alle intemperie e in attesa di essere aperto. Il saggiatore spezza un campione sulla sua incudine portatile, lo getta nel crogiolo e riferisce che il metallo è puro e rende bene. I fonditori vengono già convocati dalle città a sud."
 mining_survey_events.11.a: "Sfruttiamolo apertamente, perché [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sappia del nostro [ShowGoodsNameWithNoTooltip('copper')]."
 mining_survey_events.11.b: "Sfruttiamolo in silenzio. I fonditori di ottone pagano di più se le voci restano basse."
 mining_survey_events.11.historical_info: "L'estrazione del rame era concentrata in pochi celebri distretti nell'Europa preindustriale: Falun in Svezia, i versanti dei monti Metalliferi, la regione di Mansfeld in Sassonia e le Alpi tirolesi. Il metallo era essenziale per l'artiglieria di bronzo, il rivestimento delle navi e gli oggetti d'ottone, e una miniera di rame produttiva poteva arricchire sia la corona che la possedeva sia le case mercantili che ne finanziavano lo sviluppo. La dinastia bancaria dei Fugger salì alla ribalta in parte grazie al controllo del rame tirolese."

 mining_survey_events.12.title: "Un Giacimento di [ShowGoodsNameWithNoTooltip('tin')] sulle Colline"
 mining_survey_events.12.desc: "I prospettori hanno seguito i ciottoli scuri di cassiterite in un letto di torrente su per il pendio e hanno trovato il giacimento là dove affiorava in superficie, con la roccia ricca di [ShowGoodsName('tin')] che correva spessa e pulita lungo un filone di quarzo. I minatori stanno già allestendo pozzi armati con travi e un mulino a pestelli ai piedi della collina. I fonditori di bronzo, gli stagnini e i fabbricanti di piatti avranno tutti materiale su cui lavorare per una generazione."
 mining_survey_events.12.a: "Annunciamo la scoperta. Un nuovo giacimento di [ShowGoodsNameWithNoTooltip('tin')] riguarda lo stato."
 mining_survey_events.12.b: "Teniamolo nascosto. Accaparriamoci il commercio del bronzo prima dei rivali."
 mining_survey_events.12.historical_info: "Lo stagno era un metallo strategico nel mondo premoderno, essenziale tanto per i cannoni di bronzo quanto per il peltro domestico, e le forniture erano concentrate in poche celebri regioni: la Cornovaglia, i monti Metalliferi e parti della Boemia. Le Stannarie della Cornovaglia godettero dal medioevo in poi di uno status giuridico speciale, con propri tribunali e parlamento, e il commercio dello stagno della Cornovaglia alimentava la produzione di ottone e bronzo in tutta l'Europa atlantica."

 mining_survey_events.13.title: "Galena nel Calcare"
 mining_survey_events.13.desc: "Un filone di galena è stato aperto sulle colline, con i suoi cristalli scuri attraversati da bagliori d'argento che promettono un utile sottoprodotto di fusione. Il [ShowGoodsName('lead')] del filone coprirà tetti di chiese, rivestirà tubature e verrà fuso in pallini, mentre la frazione di [ShowGoodsName('silver')] contribuirà a pagare lo sviluppo. Il capocantiere riferisce un fronte di scavo pulito e una corrente d'aria costante nel nuovo pozzo."
 mining_survey_events.13.a: "Rendiamo nota la scoperta. Il [ShowGoodsNameWithNoTooltip('lead')] è questione di interesse pubblico."
 mining_survey_events.13.b: "Appaltiamo discretamente la produzione a polverifici e stampatori."
 mining_survey_events.13.historical_info: "Piombo e argento venivano quasi sempre estratti insieme nell'Europa premoderna, poiché il minerale di galena dava entrambi i metalli attraverso il processo di coppellazione inventato nell'antichità e perfezionato per tutto il medioevo. Le colline di Mendip in Inghilterra, i monti Harz in Sassonia e la Sierra Morena in Spagna erano tutti importanti distretti di piombo e argento, e il piombo che producevano plasmava ogni cosa, dai tetti delle cattedrali ai caratteri tipografici alle tubature dell'acqua urbana."

 mining_survey_events.14.title: "[ShowGoodsNameWithNoTooltip('silver')] nella Roccia"
 mining_survey_events.14.desc: "I prospettori hanno trovato [ShowGoodsName('silver')], un filone abbastanza largo da potervi vibrare un piccone e abbastanza puro da prendere la lucidatura direttamente dalla roccia. I crogioli del saggiatore sono ancora caldi dalle prove. Il pozzo è armato con travi e i primi carri di minerale vengono già issati in superficie da un argano cigolante. La zecca non mancherà di metallo prezioso per questa generazione, e le corti d'[ShowContinentName('europe')] noteranno la scoperta entro l'anno."
 mining_survey_events.14.a: "Annunciamolo [ROOT.GetCountry.Custom('IT_AL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]. Una miniera di [ShowGoodsNameWithNoTooltip('silver')] è un trionfo."
 mining_survey_events.14.b: "Teniamolo nascosto. Occhi stranieri sul nostro [ShowGoodsNameWithNoTooltip('silver')] portano guai."
 mining_survey_events.14.historical_info: "L'estrazione dell'argento trasformò le economie europee nel tardo medioevo e nella prima età moderna. La scoperta di importanti filoni d'argento a Schwaz in Tirolo e a Jáchymov in Boemia alla fine del XV secolo, seguita dal ritrovamento di Potosí sulle Ande nel 1545, inondò l'Europa di metallo prezioso e sostenne le grandi inflazioni del XVI secolo. Una miniera d'argento produttiva era una risorsa strategica pari a una flotta o a una fortezza."

 mining_survey_events.15.title: "Il Metallo Giallo"
 mining_survey_events.15.desc: "I prospettori hanno trovato [ShowGoodsName('goods_gold')]. Un filone di quarzo, attraversato dal metallo in grossi fili, giace esposto sulla parete rocciosa dove una frana invernale ha portato via la copertura di terra. Il metallo brilla alla luce della lampada, intatto da quando la roccia si è formata. Il capo del villaggio si offre di affittare gli scavi [ROOT.GetCountry.Custom('IT_CROWN_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] per quella che definisce una giusta parte. Il saggiatore raccomanda di accettare, con delle condizioni."
 mining_survey_events.15.a: "Annunciamo la scoperta. Che i nostri nemici ne sentano parlare."
 mining_survey_events.15.b: "Sfruttiamolo in silenzio. L'[ShowGoodsNameWithNoTooltip('goods_gold')] attira visitatori indesiderati."
 mining_survey_events.15.historical_info: "I giacimenti di oro nativo nell'Europa premoderna erano rari e si esaurirono presto. Le miniere d'oro medievali di Kremnica in Slovacchia e di Vrancea in Valacchia furono fonti locali importanti, ma la maggior parte dell'oro europeo proveniva da lavorazioni alluvionali in fiumi come il Reno e il Tago, o dalla raffinazione della frazione d'argento dei minerali di piombo e argento. La scoperta di oro nativo in quantità significativa era una fortuna di primo ordine, e la corona si affrettava invariabilmente a rivendicarla."

 mining_survey_events.16.title: "La Pietra Nera Brucia Forte"
 mining_survey_events.16.desc: "Un grosso filone di [ShowGoodsName('coal')] attraversa le colline qui, affiorando in due punti dove l'erosione dei torrenti ha scavato fino agli strati. Il filone è seguibile e il [ShowGoodsNameWithNoTooltip('coal')] brucia pulito. I fabbri del posto stanno già scambiando con esso la legna delle loro forge. Le forge, le saline e le vetrerie possono tutte essere alimentate da questo filone senza disboscare ulteriormente il paese."
 mining_survey_events.16.a: "Sfruttiamolo con concessione [ROOT.GetCountry.GetGovernment.GetAdjective]. Informiamo [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.16.b: "Affittiamo gli scavi ai maestri del ferro in cambio di una quota stabile."
 mining_survey_events.16.historical_info: "L'estrazione del carbone era praticata su piccola scala in Europa dal medioevo in poi, principalmente in Galles, nel bacino carbonifero di Newcastle e in parti di Liegi, ma la sua vera espansione giunse con la crisi dei combustibili della prima età moderna, quando le foreste venivano abbattute per ampliare i terreni coltivabili. Il carbone di mare di Newcastle veniva spedito a Londra a migliaia di tonnellate nel XVII secolo, e l'industria del ferro non sarebbe sopravvissuta alla perdita del carbone di legna senza di esso."

 mining_survey_events.17.title: "Una Buona [ShowGoodsNameWithNoTooltip('stone')] da Taglio"
 mining_survey_events.17.desc: "Una nuova cava è stata aperta sulle colline, con la [ShowGoodsName('stone')] che si taglia nettamente lungo i piani di stratificazione e si indurisce dopo l'esposizione. Il maestro muratore è stato fatto salire dai lavori della cattedrale per ispezionare un blocco campione e lo dichiara adatto a conci squadrati, a sculture raffinate e a corsi portanti. Ogni cattedrale e ogni cinta muraria per cento miglia attingerà ad essa per una generazione."
 mining_survey_events.17.a: "Poniamo gli scavi sotto controllo [ROOT.GetCountry.GetGovernment.GetAdjective]. La [ShowGoodsNameWithNoTooltip('stone')] è strategica."
 mining_survey_events.17.b: "Affittiamo la cava alla corporazione dei muratori per una rendita stabile."
 mining_survey_events.17.historical_info: "La pietra da costruzione era una merce lenta ma preziosa nell'Europa preindustriale, poiché il costo del trasporto era il fattore dominante del suo prezzo. Una cava produttiva a un giorno di trasporto da una grande città o da un cantiere era una risorsa a lungo termine, e i grandi cantieri delle cattedrali medievali di Reims, Salisbury e Colonia mantennero cave dedicate per generazioni per soddisfare le proprie esigenze costruttive."

 mining_survey_events.18.title: "[ShowGoodsNameWithNoTooltip('marble')] nella Conca"
 mining_survey_events.18.desc: "In una conca riparata è stato trovato [ShowGoodsName('marble')] venato della migliore qualità, e il maestro muratore ha tagliato un blocco campione che si lucida fino a un lucore profondo e traslucido. Gli scultori locali stanno già facendo richiesta del diritto di prelazione sulla produzione. Botteghe fino alla capitale attingeranno a questa cava per una generazione, e gli scultori di pale d'altare e di monumenti funebri si riterranno benedetti."
 mining_survey_events.18.a: "Annunciamolo. Una grande cava di [ShowGoodsNameWithNoTooltip('marble')] è un tesoro nazionale."
 mining_survey_events.18.b: "Riserviamo il [ShowGoodsNameWithNoTooltip('marble')] a un uso [ROOT.GetCountry.GetGovernment.GetAdjective], in silenzio."
 mining_survey_events.18.historical_info: "Il marmo per la scultura e l'architettura di pregio nell'Europa medievale e rinascimentale proveniva da una manciata di cave celebri: Carrara in Toscana, Paro e Pentelico in Grecia e Saint-Béat nei Pirenei. La scoperta di un nuovo filone produttivo di marmo da statuaria era un evento notevole tra gli artisti, che commissionavano campioni e viaggiavano di persona per ispezionare un ritrovamento promettente."

 mining_survey_events.19.title: "Pietre che Catturano la Luce"
 mining_survey_events.19.desc: "I prospettori hanno trovato ghiaie ricche di [ShowGoodsName('gems')] in un letto di torrente e le hanno ricondotte a una sacca più ricca nel fianco della collina sopra, dove la matrice è una pegmatite attraversata da cristalli. Il rappresentante dei lapidari, fatto salire dalla capitale, divide un mucchio di pietre grezze in cumuli per colore e limpidezza e riferisce che la frazione tagliabile è eccezionale. I gioiellieri di corte non mancheranno di pietre in questa generazione."
 mining_survey_events.19.a: "Annunciamo la scoperta. Una cava di [ShowGoodsNameWithNoTooltip('gems')] è una meraviglia di cui vantarsi."
 mining_survey_events.19.b: "Teniamo le [ShowGoodsNameWithNoTooltip('gems')] per le casse [ROOT.GetCountry.GetGovernment.GetAdjective], custodite in silenzio."
 mining_survey_events.19.historical_info: "L'estrazione di gemme in Europa era cosa minore rispetto ai grandi giacimenti indiani e birmani, ma fonti locali di granato, berillo, ametista e topazio venivano sfruttate negli altipiani boemi, nei Cairngorms scozzesi e in parti dei Pirenei. Le botteghe di lapidari di Idar-Oberstein, in Renania, divennero un centro per il taglio di pietre estratte localmente, e un ritrovamento produttivo poteva tenere impegnati i loro artigiani per anni."

 mining_survey_events.20.title: "Cinabro sulle Colline"
 mining_survey_events.20.desc: "Un giacimento di cinabro è stato aperto negli altipiani, con il suo minerale rosso vivo segno inconfondibile di [ShowGoodsName('mercury')] nella roccia. La storta e il condensatore vengono già allestiti a distanza di sicurezza dagli scavi, poiché i fumi sprigionati dall'arrostimento sono noti per far cadere i denti e stordire la mente. Alchimisti, saggiatori e doratori attingeranno a questa miniera per una generazione, e un metallo così scarso e così utile può spuntare qualunque prezzo vogliamo fissare."
 mining_survey_events.20.a: "Sfruttiamo la miniera apertamente. Il [ShowGoodsNameWithNoTooltip('mercury')] è una merce strategica."
 mining_survey_events.20.b: "Sfruttiamola in silenzio. Un monopolio sul [ShowGoodsNameWithNoTooltip('mercury')] è una cosa potente."
 mining_survey_events.20.historical_info: "Il mercurio, l'unico metallo liquido a temperatura ambiente, era essenziale per il processo di amalgamazione che giunse a dominare la raffinazione dell'argento americano nel XVI secolo. La miniera di Almadén in Castiglia e quella di Idrija in Carniola erano le due grandi fonti europee, e la corona di Spagna deteneva gli scavi di Almadén come rigido monopolio reale, con il mercurio spedito in Messico e in Perù su galeoni sotto scorta navale."

 mining_survey_events.21.title: "Una Sorgente di Salamoia"
 mining_survey_events.21.desc: "Un nuovo giacimento di [ShowGoodsName('salt')] di roccia è stato aperto negli altipiani, con sorgenti di salamoia che sgorgano dove gli strati attraversano il fondovalle. I salinieri sono già al lavoro, e i contadini del posto portano il bestiame ad abbeverarsi alle polle di salamoia. Il commercio delle carni conservate e la tavola ne trarranno entrambi giovamento, e la gabella, se decidessimo di imporne una, pagherebbe da sola un anno di spese di casa [ROOT.GetCountry.GetGovernment.GetAdjective] con questa scoperta."
 mining_survey_events.21.a: "Sfruttiamo le saline di [ShowGoodsNameWithNoTooltip('salt')] con concessione [ROOT.GetCountry.GetGovernment.GetAdjective]."
 mining_survey_events.21.b: "Affittiamo l'attività ai mercanti di sale in cambio di una quota stabile."
 mining_survey_events.21.historical_info: "Il sale era una merce strategica nell'Europa premoderna, indispensabile per la conservazione dei cibi e importante fonte di entrate statali tramite le varie tasse e monopoli sul sale, il più famoso dei quali era la gabella francese. Le grandi miniere di sale di Wieliczka in Polonia, di Hallstatt in Austria e di Cardona in Catalogna furono sfruttate per secoli e fecero la fortuna delle famiglie e delle corone che le possedevano."

 mining_survey_events.22.title: "Trovati Scisti di [ShowGoodsNameWithNoTooltip('alum')]"
 mining_survey_events.22.desc: "I prospettori hanno trovato scisti ricchi di [ShowGoodsName('alum')] sulle colline, con la roccia che si altera naturalmente in un sale per il quale i tintori pagheranno qualunque prezzo. Una storta pilota ha prodotto [ShowGoodsNameWithNoTooltip('alum')] bianco e puro dai primi campioni, e i rappresentanti dei mercanti di stoffe si informano già su contratti a lungo termine. Il commercio tessile ha atteso a lungo una fonte più vicina a casa del monopolio papale di Tolfa."
 mining_survey_events.22.a: "Annunciamo la scoperta. L'[ShowGoodsNameWithNoTooltip('alum')] è un trionfo dell'ingegno [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.22.b: "Sfruttiamolo in silenzio. Il monopolio papale dell'[ShowGoodsNameWithNoTooltip('alum')] non deve saperlo."
 mining_survey_events.22.historical_info: "L'allume, il mordente essenziale per fissare i coloranti ai tessuti, era una merce tessile strategica in tutto il medioevo e la prima età moderna. La scoperta dei grandi giacimenti di allume di Tolfa, nello Stato Pontificio, nel 1462 creò un monopolio vaticano che durò oltre un secolo, finché non si svilupparono fonti alternative in Inghilterra, Svezia e Paesi Bassi. Ogni nazione che poteva produrre il proprio allume liberava la propria industria tessile da una gravosa dipendenza straniera."

 mining_survey_events.23.title: "[ShowGoodsNameWithNoTooltip('saltpeter')] nella Valle"
 mining_survey_events.23.desc: "Il [ShowGoodsName('saltpeter')] è stato estratto dal suolo di una valle riparata, con i cristalli bianchi fioriti sulla parete rocciosa dopo il disgelo primaverile. Il maestro polveriere, fatto salire dall'arsenale, assaggia il nitro grezzo e lo dichiara adatto a essere raffinato in polvere da sparo di prima qualità. I polverifici non mancheranno di nitro per questa generazione, e il treno d'artiglieria [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] potrà finalmente essere all'altezza della sua ambizione."
 mining_survey_events.23.a: "Sfruttiamolo in monopolio [ROOT.GetCountry.GetGovernment.GetAdjective]. Il [ShowGoodsNameWithNoTooltip('saltpeter')] significa guerra."
 mining_survey_events.23.b: "Lasciamo che i mercanti di polvere lo sfruttino in cambio del diritto di prelazione sulla produzione."
 mining_survey_events.23.historical_info: "Il salnitro, ingrediente principale della polvere da sparo, veniva estratto nell'Europa premoderna da suoli riparati a lungo concimati con letame e sterco, oppure importato a caro prezzo dall'India e dal Levante. Il controllo statale della produzione di salnitro era una questione strategica: l'Inghilterra gestiva un sistema di salnitrai con l'autorità legale di scavare sotto stalle e colombaie, e la Francia mantenne la #italic Régie des Poudres#! come monopolio reale fino al XIX secolo."

 # BAD events
 mining_survey_events.30.title: "Crollo nel Pozzo di Prova"
 mining_survey_events.30.desc: "Disastro alla prospezione di [ShowGoodsName('iron')]. Il pozzo di prova è crollato durante la notte, con l'armatura divelta da un lento cedimento dello scisto sciolto sopra la fascia di minerale. Due membri della squadra di prospezione sono sepolti; un altro, l'apprendista del saggiatore, è stato tirato fuori con una gamba rotta e il rifiuto di scendere mai più in un pozzo. Il capocantiere dice che il [ShowGoodsNameWithNoTooltip('iron')] c'è, ma raggiungerlo significherà aprire una nuova galleria in terreno più duro, e il costo sarà considerevole."
 mining_survey_events.30.a: "Ritiriamo la squadra. Certi terreni non valgono la vita degli uomini."
 mining_survey_events.30.historical_info: "I crolli del soffitto e i cedimenti dei pozzi erano il rischio professionale cronico dell'estrazione premoderna. Le armature di legno che sostenevano gli scavi marcivano nel terreno umido; gli strati sciolti sopra la fascia di minerale cedevano senza preavviso; e il metodo standard di estrazione a camere e pilastri lasciava vuoti sempre meno sostenuti man mano che il minerale veniva estratto. Cappelle dei minatori, corporazioni funerarie dei minatori e fondi per le vedove dei minatori erano una presenza permanente in ogni distretto minerario europeo."

 mining_survey_events.31.title: "Fumo Tossico dagli Scavi"
 mining_survey_events.31.desc: "La prospezione di [ShowGoodsName('copper')] sta dando un minerale dal carattere inatteso. Il primo cumulo di arrostimento, allestito per eliminare i solfuri prima della fusione, produce un fumo giallo e acre che ha scacciato gli operai dal pendio e fa appassire l'erba per mezzo miglio sottovento. I contadini del posto hanno presentato una formale protesta. Il metallurgo dice di poter costruire forni di arrostimento adeguati per contenere i fumi, ma costerà oro e tempo che non avevamo preventivato."
 mining_survey_events.31.a: "Abbandoniamo la prospezione. La gente del posto non ha torto sull'aria."
 mining_survey_events.31.historical_info: "La fusione del rame da minerali solforati liberava grandi quantità di anidride solforosa, che danneggiava raccolti, bestiame e polmoni in tutta la campagna circostante. Il distretto del rame di Falun in Svezia era noto per il suo fumo, che si diceva rendesse sterili i campi circostanti per miglia, e la grande valle di fusione del rame dell'Harz inferiore era altrettanto rovinosa. Le cause civili contro le attività minerarie per danni da fumo furono comuni dal medioevo in poi."

 mining_survey_events.32.title: "Il Letto del Torrente si Prosciuga"
 mining_survey_events.32.desc: "La prospezione di [ShowGoodsName('tin')] era promettente all'inizio: cassiterite alluvionale in quantità sfruttabile, setacciata dal letto del torrente a carrettate. Ma la fonte del giacimento alluvionale non è stata trovata, e i letti dei torrenti sono ormai ripuliti del minerale pesante. Le fosse scavate sulle colline sopra gli scavi hanno incontrato solo matrice sterile. La squadra ha esaurito i punti ovvi dove scavare, e il costo di aprire pozzi più profondi senza alcuna prova è difficile da giustificare."
 mining_survey_events.32.a: "Abbandoniamo la prospezione. Il giacimento alluvionale è stato un fuoco di paglia."
 mining_survey_events.32.historical_info: "Il dilavamento alluvionale dello stagno, la lavorazione di ghiaie stannifere nei letti di torrenti e fiumi, fu il modo originario di estrazione dello stagno in Cornovaglia e si protrasse nella prima età moderna. Esaurite le ghiaie più facili, i minatori dovevano risalire il giacimento alluvionale fino alla sua fonte attraverso una prospezione sistematica delle colline circostanti. Molti torrenti promettenti conducevano soltanto a un esile filone disseminato che non giustificava il costo di una lavorazione sotterranea."

 mining_survey_events.33.title: "Gli Operai si Ammalano"
 mining_survey_events.33.desc: "La prospezione di [ShowGoodsName('lead')] produce minerale. Gli operai producono lamentele. Gli uomini che escono dal turno hanno le gengive grigiastre, le articolazioni gonfie e una pesante lentezza che il medico del campo chiama colica dei lavoratori del piombo. Due sono morti; altri quattro sono troppo malati per scendere nel pozzo. Il capocantiere dice che gli scavi possono continuare se assumiamo sostituti e accettiamo le perdite, ma il capo del villaggio pone domande pungenti su chi sarà il prossimo."
 mining_survey_events.33.a: "Chiudiamo. Non siamo venuti a seppellire uomini liberi [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]."
 mining_survey_events.33.historical_info: "L'intossicazione da piombo, la #italic colica plumbica#! degli antichi, era una malattia professionale ben nota di minatori del piombo, fonditori, vetrai e vasai. Il #italic De morbis artificum diatriba#! (1700) di Bernardino Ramazzini, testo fondativo della medicina del lavoro, dedicò un lungo capitolo a questa afflizione. I rimedi abituali di salassi, purghe e bevute di latte erano inefficaci, e l'unica vera prevenzione era limitare l'esposizione, cosa per cui i proprietari delle miniere avevano scarso incentivo economico."

 mining_survey_events.34.title: "Il Filone si Assottiglia"
 mining_survey_events.34.desc: "Il filone di [ShowGoodsName('silver')] era largo dove i prospettori lo hanno aperto per la prima volta, e i primi carri sono stati saggiati a oltre trenta marchi di [ShowGoodsNameWithNoTooltip('silver')] per quintale. Poi, dieci iarde più in basso lungo l'inclinazione del filone, questo si è ristretto bruscamente, il minerale si è impoverito e il fronte di scavo vale ormai appena il costo del trasporto della roccia in superficie. Il termine geologico è #italic pinch-out#!. Il termine dei minatori è assai meno educato. Potrebbe esserci altro [ShowGoodsNameWithNoTooltip('silver')] più avanti lungo la faglia, ma trovarlo significherà costosi pozzi esplorativi senza alcuna prova."
 mining_survey_events.34.a: "Ritiriamoci. Un filone assottigliato è una porta chiusa."
 mining_survey_events.34.historical_info: "I filoni d'argento erano notoriamente variabili lungo la loro estensione, ingrossandosi in corpi minerari spessi un piede in alcuni tratti e restringendosi in sterili venuzze in altri. I capricci della geometria dei filoni facevano dell'estrazione dell'argento un mestiere di azzardo istruito, e l'ascesa e la caduta di città minerarie medievali come Jáchymov, Schwaz e Iglau seguivano con cupa regolarità la scoperta e l'esaurimento di particolari filoni."

 mining_survey_events.35.title: "Non È Tutto Oro Quel Che Luccica"
 mining_survey_events.35.desc: "Delusione alla prospezione di [ShowGoodsName('goods_gold')]. Le brillanti pagliuzze metalliche che attraversano il quarzo non sono [ShowGoodsNameWithNoTooltip('goods_gold')] ma pirite, il solfuro di ferro che inganna i prospettori fin dagli albori della metallurgia. La prima prova del saggiatore, per riduzione nel crogiolo, ha prodotto non una perla gialla di [ShowGoodsNameWithNoTooltip('goods_gold')] ma una sottile schiuma rossa e sulfurea e un pezzo di ghisa. Il capo del villaggio locale non è affatto sorpreso; aveva sentito le vecchie storie dei nonni sul #italic Narrengold#! di questo pendio e aspettava di vedere se i nostri studiosi sapevano la differenza."
 mining_survey_events.35.a: "Facciamo i bagagli e partiamo. Oro dei folli, il più vecchio trucco del prospettore."
 mining_survey_events.35.historical_info: "La pirite, il solfuro di ferro che brilla di un giallo ottone nella roccia e che nei paesi minerari tedeschi si guadagnò il nome popolare di #italic Narrengold#! (oro dei folli), ha tratto in inganno i prospettori da quando gli uomini cercano il metallo vero. Le prove distintive, malleabilità sotto il martello (la pirite va in frantumi; l'oro si appiattisce), peso specifico (l'oro è diciannove volte più denso dell'acqua; la pirite solo cinque) e comportamento al saggio al fuoco (l'oro sopravvive; la pirite si dissolve arrostendo in zolfo e ossido di ferro), erano prassi per ogni saggiatore competente."

 mining_survey_events.36.title: "Grisù nel Filone"
 mining_survey_events.36.desc: "Il filone di [ShowGoodsName('coal')] è spesso e pulito. È anche pieno di grisù. Il gas di palude che si accumula in ogni profonda miniera di [ShowGoodsNameWithNoTooltip('coal')] ha preso fuoco dalla lampada di uno dei picconieri, e l'esplosione risultante ha ucciso tre uomini sul colpo e ne ha ustionati altri sei così gravemente che non lavoreranno più. Il capocantiere dice che il filone può essere sfruttato, ma solo con una ventilazione costante tramite un pozzo d'aria e un forno, il che richiederà un capitale considerevole prima che esca anche solo un po' di [ShowGoodsNameWithNoTooltip('coal')]."
 mining_survey_events.36.a: "Chiudiamo gli scavi. Non siamo ancora attrezzati per combattere il grisù."
 mining_survey_events.36.historical_info: "Il grisù, il metano che si accumula nelle miniere di carbone e si accende con esplosione da qualsiasi fiamma, era il killer cronico dei minatori di carbone preindustriali. La contromisura standard era la ventilazione sistematica tramite pozzi accoppiati con un forno alla base di quello di uscita, che richiamava aria attraverso gli scavi; la lampada di sicurezza di Davy, che consentiva di illuminare senza innescare, non fu inventata fino al 1815. Fino ad allora, ogni profondo filone di carbone veniva sfruttato sotto la condanna di un disastro intermittente."

 mining_survey_events.37.title: "La Cava si Allaga"
 mining_survey_events.37.desc: "La [ShowGoodsName('stone')] è eccellente, ma la cava non vuole restare asciutta. La prima fossa, scavata dodici piedi nel piano di stratificazione, si riempie durante la notte dell'acqua di una sorgente che i cavatori non avevano previsto, e il corso più basso di [ShowGoodsNameWithNoTooltip('stone')] è ora sotto tre piedi d'acqua gelida. Il maestro muratore dice che la cava può essere sfruttata se si scava una galleria di drenaggio verso la valle sottostante, ma la galleria è di per sé un anno di lavoro sulla pietra, e il bilancio non lo prevedeva."
 mining_survey_events.37.a: "Abbandoniamo la cava. Una fossa allagata è una fossa chiusa."
 mining_survey_events.37.historical_info: "Il drenaggio delle cave era un cronico problema ingegneristico nella lavorazione preindustriale della pietra, e molte fosse altrimenti produttive furono abbandonate quando il fronte di scavo scese sotto il livello della falda locale. Le soluzioni standard erano gallerie di drenaggio scavate orizzontalmente verso terreno più basso (i cosiddetti #italic Stollen#! della tradizione mineraria tedesca), ruote idrauliche che azionavano pompe a catena di secchi e, dal XVII secolo in poi, la graduale introduzione di macchine di pompaggio a vapore."

 mining_survey_events.38.title: "Il Blocco si Frantuma"
 mining_survey_events.38.desc: "Il [ShowGoodsName('marble')] sembrava inizialmente sano al fronte di scavo. Due giorni dopo, quando il primo grande blocco è stato finalmente staccato dal basamento roccioso e calato sui rulli di legno, si è spaccato lungo una crepa invisibile, dividendosi in sei pezzi senza valore sotto il peso della propria discesa. Il maestro muratore percorre il blocco scartato, lo batte con il martello e pronuncia ciò che la squadra già sa: il [ShowGoodsNameWithNoTooltip('marble')] di questa conca è attraversato da linee di frattura interne che nessuna ispezione del fronte di scavo aveva rivelato."
 mining_survey_events.38.a: "Chiudiamo. Il [ShowGoodsNameWithNoTooltip('marble')] fratturato serve solo come pietrisco stradale."
 mining_survey_events.38.historical_info: "I blocchi di marmo per la statuaria e per le opere architettoniche di pregio dovevano essere privi di difetti interni, e la scoperta di linee di frattura nascoste (#italic peli#! nel gergo dei cavatori italiani) era il terrore costante del mestiere. I maestri scultori visitavano di persona le cave per ispezionare i blocchi grezzi prima della commissione, e il costo di una grande commissione statuaria comprendeva un generoso margine per i blocchi scoperti difettosi dopo la consegna."

 mining_survey_events.39.title: "Pasta Vitrea, Non Cristallo"
 mining_survey_events.39.desc: "Le ghiaie ricche di [ShowGoodsName('gems')] erano insolitamente ricche. Sospettosamente ricche. Il lapidario reale, fatto salire dalla capitale sotto scorta, esamina il bottino sotto una forte lampada, pesa ogni pietra sul palmo, ne graffia una contro un frammento di corindone e pronuncia l'inevitabile: la maggior parte dei ritrovamenti è pasta vitrea, vetro al piombo abilmente tagliato e invecchiato per assomigliare a cristallo grezzo. Qualcuno ha salato il letto del torrente. Il capocantiere è vistosamente assente dal campo, questa mattina."
 mining_survey_events.39.a: "Facciamo i bagagli. L'intera prospezione era una truffa."
 mining_survey_events.39.historical_info: "La salatura, la pratica di piazzare vero minerale o materiale gemmario lavorato in un sito di prospezione per attirare investimenti, era un'antica frode professionale della frontiera mineraria. Il capocantiere che salava i propri scavi, la guida locale che disseminava pochi campioni nascosti lungo un letto di torrente scelto e il promotore assente che organizzava il ritrovamento accuratamente collocato erano figure perenni nelle storie dell'estrazione mineraria europea e americana. Il saggiatore disonesto che confermava la frode completava il consueto schema."

 mining_survey_events.40.title: "La Follia del [ShowGoodsNameWithNoTooltip('mercury')]"
 mining_survey_events.40.desc: "Gli scavi di [ShowGoodsName('mercury')] producono metallo. Producono anche pazzi. Gli operai alla storta hanno iniziato a tremare in modo incontrollabile; l'apprendista incaricato di rimestare il [ShowGoodsNameWithNoTooltip('mercury')] condensato ha perso i denti e l'uso di due dita della mano destra; e il maestro metallurgo, che conosceva i rischi meglio di chiunque altro, è sprofondato in una distrazione irritabile che il medico del campo chiama #italic follia del cappellaio#! e dichiara inguaribile. Il [ShowGoodsNameWithNoTooltip('mercury')] c'è. Gli uomini per estrarlo no."
 mining_survey_events.40.a: "Chiudiamo gli scavi. Nessun metallo vale questo."
 mining_survey_events.40.historical_info: "L'intossicazione da mercurio, che si manifestava con tremori, perdita dei denti e progressivo deterioramento psichico, era la malattia professionale ben nota di minatori di cinabro, addetti alle storte e amalgamatori dell'argento. La miniera di Almadén in Castiglia, la grande fonte europea di mercurio, veniva sfruttata in parte con il lavoro dei detenuti proprio per questa ragione. L'espressione inglese #italic mad as a hatter#! ha conservato il ricordo del mestiere, quando i cappellai del feltro venivano avvelenati dal mercurio usato nella loro arte."

 mining_survey_events.41.title: "La Sorgente di Salamoia si Esaurisce"
 mining_survey_events.41.desc: "La prospezione di [ShowGoodsName('salt')] era iniziata bene. La sorgente di salamoia era forte, le caldaie producevano [ShowGoodsNameWithNoTooltip('salt')] bianco di prima qualità e i mercanti di sale stavano già negoziando contratti a lungo termine. Poi, dopo un'estate asciutta e un inverno più freddo del solito, la sorgente si è ridotta a un filo e infine si è fermata. Il geologo inviato a indagare riferisce che la fonte sotterranea era una sacca finita di salamoia intrappolata, non un flusso che si rinnova, e che la prospezione è sostanzialmente esaurita."
 mining_survey_events.41.a: "Ritiriamoci. Una sorgente asciutta è la fine di un'impresa di sorgenti di [ShowGoodsNameWithNoTooltip('salt')]."
 mining_survey_events.41.historical_info: "Le sorgenti di salamoia e i giacimenti di salgemma avevano caratteri geologici e prospettive economiche molto diversi. Alcune fonti di salamoia, come quelle di Halle in Sassonia o di Salins-les-Bains nel Giura, scorsero per secoli e sostennero città sostanziose; altre erano essenzialmente sacche fossili che si esaurivano entro una generazione di sfruttamento intensivo. Il salgemma, estratto in luoghi come Wieliczka e Cardona, era una risorsa più affidabile ma più dispendiosa in termini di capitale."

 mining_survey_events.42.title: "Gli Scisti Sono Sterili"
 mining_survey_events.42.desc: "L'affioramento di scisto sembrava promettente in superficie, con la roccia che si alterava in un sale che nel saggio risultava pulito e bianco. Ma sotto copertura gli scisti sono sterili: spessi, scuri e del tutto privi dei filoni piritosi ricchi di [ShowGoodsName('alum')] che i campioni di superficie sembravano promettere. Il chimico prova la lisciviazione con acido, poi l'arrostimento, poi una lunga alterazione sul cumulo di scarto, e non ne ricava quasi nulla. Gli operai, fatti salire a notevole spesa dalle città tessili, restano oziosi mentre l'ingegnere prova un metodo dopo l'altro."
 mining_survey_events.42.a: "Chiudiamo le lavorazioni. La chimica non darà [ShowGoodsNameWithNoTooltip('alum')] qui."
 mining_survey_events.42.historical_info: "La fabbricazione dell'allume da scisti piritosi richiedeva esattamente la giusta chimica minerale: pirite di ferro per fornire lo ione solfato, scisto alluminoso per fornire l'alluminio e un lungo processo di alterazione per portare i due insieme in soluzione. I campioni di superficie potevano facilmente ingannare, poiché l'affioramento era il luogo in cui l'alterazione naturale aveva già fatto il suo lavoro; la roccia sotterranea era spesso sterile. Le allumiere dello Yorkshire sulla costa del Mare del Nord spesero decenni e notevoli capitali su scisti che alla fine non diedero frutto."

 mining_survey_events.43.title: "Il Suolo Non Rende Nulla"
 mining_survey_events.43.desc: "Il suolo della valle avrebbe dovuto essere ricco di [ShowGoodsName('saltpeter')]. I contadini del posto dicevano che i loro nonni raccoglievano la fioritura bianca dalla parete rocciosa ogni primavera. I prospettori hanno ora scavato, lisciviato ed evaporato il suolo in una dozzina di punti lungo il fondovalle e non hanno prodotto quasi nulla di valore. Il maestro polveriere, mostrato il magro rendimento, suggerisce che i vecchi giacimenti di [ShowGoodsNameWithNoTooltip('saltpeter')] siano stati esauriti proprio dai contadini i cui nonni raccontavano quelle storie. La valle è ora priva di [ShowGoodsNameWithNoTooltip('saltpeter')]."
 mining_survey_events.43.a: "Abbandoniamo la valle. Il suolo è morto; qui non c'è [ShowGoodsNameWithNoTooltip('saltpeter')]."
 mining_survey_events.43.historical_info: "I suoli ricchi di salnitro non erano infiniti. Il processo naturale di formazione del nitro in terreni umidi e concimati richiedeva anni e si esauriva facilmente con un'estrazione intensiva. La tradizione tedesca dei #italic Salpetersieder#! includeva quindi la creazione sistematica di #italic Salpeterplantagen#! artificiali, dove letame, calce e cenere venivano ammucchiati e curati per anni per ottenere una resa stabile di salnitro. Il passaggio dal trovare al produrre il salnitro fu un grande passo nella razionalizzazione della produzione preindustriale di polvere da sparo."
