l_english:

 cartographic_survey_events.1.title: "La Commissione di Rilevamento"
 cartographic_survey_events.1.desc: "L'ordine è stato dato. Una piccola flotta di due o tre navi, con cartografi, custodi degli strumenti e un capitano prescelto, percorrerà l'intera lunghezza della nostra costa e tornerà con carte degne del secolo a venire. Gran parte di ciò che sappiamo delle nostre coste proviene da piloti locali e da dicerie di mercanti. Dopo questa spedizione, avremo carte che fisseranno a inchiostro tutti i porti del [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')], i pericoli per i naviganti e le calette dei contrabbandieri. Resta solo da stabilire quali strumenti commissionare per il viaggio."
 cartographic_survey_events.1.a: "Commissioniamo i migliori strumenti d'ottone e i migliori cartografi."
 cartographic_survey_events.1.b: "I cartografi ordinari andranno bene. Nessun bisogno di sfarzo."
 cartographic_survey_events.1.historical_info: "Il rilevamento sistematico delle coste iniziò seriamente nel XVI secolo, quando il crescente volume dei traffici marittimi rese le carte accurate una questione di interesse statale. La #italic Casa de Contratación#! di Siviglia e l'#italic Armazém da Guiné e Índia#! portoghese mantenevano entrambe cartografi ufficiali il cui compito era produrre e aggiornare le carte nautiche, e gli ammiragliati olandesi seguirono l'esempio nel XVII secolo."

 # GOOD events: material-specific
 cartographic_survey_events.10.title: "Mappati i Banchi di Pesca"
 cartographic_survey_events.10.desc: "La nave da rilevamento ha trascorso tre settimane a lavorare con i pescatori locali in e intorno a [target_location.GetName], eseguendo scandagli sui grandi banchi di pesca, segnando le linee delle migrazioni stagionali e annotando le correnti che riportano le barche a casa prima del cambio del tempo. I cartografi hanno prodotto un foglio di lavoro che registra le profondità, la composizione dei fondali e le consuete stagioni di pesca. Un pilota locale osserva di aver passato la vita su questi fondali senza mai vederli rappresentati con tanta chiarezza."
 cartographic_survey_events.10.a: "Distribuiamo la carta ai villaggi di pescatori, in cambio di scambi."
 cartographic_survey_events.10.historical_info: "Le attività di pesca premoderne dipendevano da conoscenze orali tramandate all'interno di famiglie e corporazioni di pescatori. Il passaggio ad aree di pesca cartografate, con banchi segnati, curve di profondità e cicli stagionali registrati, fu un processo lento che accelerò nel XVII e XVIII secolo con l'affermarsi dell'idrografia sostenuta dagli stati."

 cartographic_survey_events.11.title: "Boschi di Legname sulla Costa"
 cartographic_survey_events.11.desc: "I rilevatori hanno percorso a cavallo le foreste costiere di [target_location.GetName] insieme ai forestali e ai maestri d'ascia, segnando i migliori boschi di pini da alberatura e di querce da costruzione navale, tracciando i corsi d'acqua lungo i quali i tronchi possono essere fluitati fino alle spiagge di imbarco e annotando le stagioni in cui il legname si lascia segare meglio. L'architetto navale, convocato dall'arsenale per ispezionare il tratto più promettente, lo dichiara adatto a chiglie e ossature di prima classe."
 cartographic_survey_events.11.a: "Riserviamo i boschi migliori come legname navale [ROOT.GetCountry.GetGovernment.GetAdjective]."
 cartographic_survey_events.11.historical_info: "Il legname navale, in particolare la quercia necessaria per le ossature delle navi di linea e l'alto pino per gli alberi, era una merce strategica nell'età della vela. Le corone inglese, francese e olandese mantenevano rilevamenti dei boschi costieri e riservavano i tratti migliori come proprietà della corona, con norme severe su abbattimento, essiccazione e trasporto."

 cartographic_survey_events.12.title: "Catalogate le Saline"
 cartographic_survey_events.12.desc: "La nave da rilevamento ha registrato ogni salina, sorgente di salamoia e bassofondo di [ShowGoodsName('salt')] lungo il tratto di costa di [target_location.GetName]. Sono state contate le caldaie, annotate le consuete stagioni di lavoro e intervistati i mercanti locali di [ShowGoodsNameWithNoTooltip('salt')] su prezzi, domanda e rotte con cui il [ShowGoodsNameWithNoTooltip('salt')] viaggia verso l'interno. La carta che ne risulta mostra un'economia costiera che [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] [ROOT.GetCountry.Custom('IT_CROWN_HA')] compreso a stento fino ad ora, e da cui una tassa sul [ShowGoodsNameWithNoTooltip('salt')], se estesa a coprirla, ricaverebbe un buon gettito."
 cartographic_survey_events.12.a: "Inviamo la carta ai funzionari del [ShowGoodsNameWithNoTooltip('salt')] per regolarizzare il commercio."
 cartographic_survey_events.12.historical_info: "La produzione costiera di sale per evaporazione solare era praticata fin dall'antichità nel Mediterraneo e sulle coste atlantiche di Francia, Portogallo e Iberia. La baia di Bourgneuf, l'Île de Ré e le saline della penisola di Setúbal erano i grandi distretti salinieri industriali dell'Europa premoderna, e rifornivano la pesca del merluzzo del Nord Atlantico e il commercio di carni conservate dell'intero continente."

 cartographic_survey_events.13.title: "Trovati i Banchi di Perle"
 cartographic_survey_events.13.desc: "Il rilevamento ha individuato e mappato i banchi locali di [ShowGoodsName('pearls')] a [target_location.GetName], lavorando con le famiglie di sommozzatori che raccolgono in queste acque da generazioni. La carta registra le profondità, le stagioni della raccolta, i confini consueti tra le comunità rivali di pescatori di perle e le rotte con cui il raccolto giunge ai tagliatori delle città. Il lapidario, convocato per ispezionare un campione del pescato della stagione, dichiara le gemme di insolita lucentezza."
 cartographic_survey_events.13.a: "Le [ShowGoodsNameWithNoTooltip('pearls')] di questa qualità devono stare sotto una regolamentazione [ROOT.GetCountry.GetGovernment.GetAdjective]."
 cartographic_survey_events.13.historical_info: "Le pescherie di perle europee erano modeste rispetto ai grandi banchi del Golfo Persico e dello Sri Lanka, ma le acque delle Ebridi, della Vistola e le coste di Bretagna e Galles producevano perle d'acqua dolce e salata di qualità commerciale. La corona scozzese mantenne dal medioevo in poi un monopolio reale sulla raccolta di perle da certi sistemi fluviali, e il Senato veneziano regolava la raccolta nell'Adriatico."

 cartographic_survey_events.14.title: "Mappata la Costa dei Vigneti"
 cartographic_survey_events.14.desc: "I rilevatori hanno percorso a cavallo le colline costiere di [target_location.GetName] insieme ai viticoltori, annotando i versanti migliori per l'uva, i venti prevalenti che fanno maturare o marcire il frutto e le spiagge d'imbarco dove le botti possono essere caricate per l'esportazione. I mercanti di [ShowGoodsName('wine')], di solito gente riservata, si sono rivelati inaspettatamente utili una volta capito che carte migliori significano tempi migliori per la spedizione."
 cartographic_survey_events.14.a: "Inviamo la carta agli spedizionieri di [ShowGoodsNameWithNoTooltip('wine')] per una migliore tempistica."
 cartographic_survey_events.14.historical_info: "Il commercio marittimo del vino era la spina dorsale economica di regioni come la valle della Garonna, il Douro, le isole dell'Egeo e la costa dalmata. I tempi della vendemmia, le finestre di spedizione e la qualità dei porti determinavano se il vino di un anno giungeva al mercato in buone condizioni. La cartografia delle coste vinicole era quindi di notevole interesse commerciale, e i grandi spedizionieri di vino di Bordeaux e Porto conservarono per secoli le proprie collezioni private di carte."

 cartographic_survey_events.15.title: "Rilevata la Costa dei Colori"
 cartographic_survey_events.15.desc: "Il rilevamento ha mappato la costa locale produttrice di coloranti a [target_location.GetName]: i banchi di murici da cui si raccoglie la porpora di Tiro, le querce kermes sopra le scogliere, le piantagioni di indaco nelle pianure interne, o qualunque pianta o conchiglia locale dia il colore per cui i mercanti di [ShowGoodsName('cloth')] pagano. La carta registra le stagioni di lavoro, le consuete zone di raccolta e le rotte con cui i [ShowGoodsName('dyes')] raggiungono le città tessili."
 cartographic_survey_events.15.a: "Inviamo la carta ai mercanti di [ShowGoodsNameWithNoTooltip('cloth')] e ai villaggi."
 cartographic_survey_events.15.historical_info: "I coloranti prima di quelli sintetici erano una merce strategica in tutto il medioevo e la prima età moderna. La porpora di Tiro ricavata dai molluschi murici, il rosso kermes dagli insetti delle querce, l'indaco dalla pianta indigofera e il guado dalle foglie di Isatis tinctoria avevano ciascuno la propria geografia produttiva, e il commercio dei tessuti dipendeva dall'affidabilità delle catene di approvvigionamento dalla zona di raccolta alla città tessile."

 cartographic_survey_events.16.title: "Mappata la Costa dell'[ShowGoodsNameWithNoTooltip('amber')]"
 cartographic_survey_events.16.desc: "Il rilevamento ha mappato le spiagge di [target_location.GetName] dove l'[ShowGoodsName('amber')] viene gettato a riva dopo le tempeste, individuando le battigie che valgono il lavoro, le stagioni in cui la risacca porta a riva la resina e le consuetudini locali con cui si divide la raccolta. I tagliatori di [ShowGoodsNameWithNoTooltip('amber')] delle città, che hanno sempre pagato un sovrapprezzo per le pietre della migliore limpidezza, pagheranno ancora meglio quando sapranno quali spiagge producono quale qualità."
 cartographic_survey_events.16.a: "Poniamo le battigie migliori sotto una riserva [ROOT.GetCountry.GetGovernment.GetAdjective]."
 cartographic_survey_events.16.historical_info: "La costa baltica dell'ambra, dalla penisola di Sambia alla riva della Pomerania orientale, fu la principale fonte di ambra per l'artigianato europeo dall'antichità in poi. L'Ordine Teutonico impose notoriamente un rigido monopolio sulla raccolta, con pene severe per chi la effettuava senza autorizzazione. Le vie dell'ambra collegarono per oltre mille anni la costa baltica alle botteghe di Boemia, Italia e Costantinopoli."

 # GOOD events: generic encounters
 cartographic_survey_events.20.title: "Un Porto Riparato"
 cartographic_survey_events.20.desc: "La nave da rilevamento ha doppiato un promontorio basso a [target_location.GetName] e ha gettato l'ancora in uno specchio d'acqua protetto che i pescatori locali usano da generazioni ma che non compare in nessuna carta esistente. La profondità resta costante a quattro braccia su fondo sabbioso, i venti prevalenti si infrangono innocui sulla scogliera esterna e il pilota locale riferisce che imbarcazioni di qualunque pescaggio ragionevole possono ormeggiarvi con ogni tempo. Con scandagli e allineamenti adeguati, il porto diventa utilizzabile da natanti più grandi."
 cartographic_survey_events.20.a: "Fissiamo gli allineamenti e cartografiamo il porto come si deve."
 cartographic_survey_events.20.historical_info: "I pescatori locali conoscevano spesso ancoraggi riparati che non figuravano in nessuna carta ufficiale, un sapere tramandato per generazioni come pilotaggio pratico più che come documentazione scritta. I rilevamenti idrografici statali ponevano cura nell'intervistare tali piloti, e l'aggiunta di un porto prima non segnalato alle istruzioni nautiche ufficiali era un esito ordinario dei lavori di rilevamento costiero premoderni."

 cartographic_survey_events.21.title: "Un Canale Attraverso la Scogliera"
 cartographic_survey_events.21.desc: "I cartografi hanno trascorso due settimane a calare lo scandaglio su una scogliera al largo di [target_location.GetName] che era sempre stata ritenuta invalicabile. Hanno trovato un canale: largo trenta piedi nel punto più stretto, profondo quattro braccia con la bassa marea e percorribile con ogni tempo se si collocano le giuste mire di allineamento sul promontorio alle spalle. Un pilota locale, che si scopre conoscere il canale da trent'anni senza averlo mai detto a nessuno, chiede un piccolo compenso per la segnalazione."
 cartographic_survey_events.21.a: "Segniamo le mire di allineamento. Il canale va sulla carta."
 cartographic_survey_events.21.historical_info: "Le scogliere al largo che nascondevano canali navigabili erano una caratteristica ricorrente della navigazione costiera premoderna. Il metodo delle mire di allineamento, in cui una nave si avvicina al canale seguendo la linea di due punti di riferimento a terra allineati l'uno dietro l'altro, era la tecnica standard per segnalare un passaggio simile, e la conoscenza locale di tali allineamenti era spesso un segreto gelosamente custodito della categoria dei piloti locali."

 cartographic_survey_events.22.title: "Una Caletta Usata da Tempo"
 cartographic_survey_events.22.desc: "Il rilevamento ha individuato una caletta riparata a [target_location.GetName], a qualche lega dal porto ufficiale più vicino. Il fondale conserva il segno recente di un'ancora, le rocce sopra la spiaggia mostrano vecchi segni di botti fatte rotolare e i figli dei pescatori locali, interrogati, non riescono a mantenere del tutto la compostezza. La caletta è stata usata per anni per i commerci non ufficiali. Ora che la sua esistenza è nei registri ufficiali, può essere destinata a un uso legittimo, o almeno a una sorveglianza doganale che porti entrate."
 cartographic_survey_events.22.a: "Registriamo la caletta e stabiliamo un piccolo posto doganale."
 cartographic_survey_events.22.historical_info: "Le calette dei contrabbandieri furono una presenza fissa delle coste europee dall'antichità ai primi tempi dell'età industriale. L'introduzione della guardia costiera, del cutter doganale e della cartografia sistematica dei luoghi di sbarco sospetti spinse gradualmente i commerci non ufficiali verso baie più piccole e remote, ma ci vollero la ferrovia, il telegrafo e la nave pattuglia a vapore per rendere davvero difficile il contrabbando su vasta scala."

 # BAD events
 cartographic_survey_events.30.title: "La Tempesta Disperde il Rilevamento"
 cartographic_survey_events.30.desc: "Una tempesta si è levata il terzo giorno di lavoro, ha spinto la nave da rilevamento su una costa sottovento per due fredde notti di frangenti e ha disperso le barche inviate a recuperare i cartografi dalle postazioni di lavoro. Quando il vento è calato e la nave è stata rimessa a galla, il lavoro della stagione era andato perso, gli strumenti fradici e due aiutanti del nostromo sepolti nelle dune sopra la spiaggia. La carta del tratto di costa di [target_location.GetName] resta bianca come prima."
 cartographic_survey_events.30.a: "Andiamo avanti. La stagione è troppo avanzata per ricominciare."
 cartographic_survey_events.30.historical_info: "Le tempeste improvvise erano il rischio professionale cronico del rilevamento costiero con piccole imbarcazioni. La scala Beaufort, l'avviso standardizzato di tempesta e le previsioni meteorologiche sistematiche non giunsero prima del XIX secolo, e fino ad allora una nave da rilevamento che si trovava su una costa sottovento con il vento in aumento aveva solo lo scandaglio, l'ancora e il sangue freddo del nostromo a separarla dal disastro."

 cartographic_survey_events.31.title: "Incagliati su un Bassofondo Non Cartografato"
 cartographic_survey_events.31.desc: "La nave da rilevamento ha urtato un bassofondo a [target_location.GetName] che nessuna carta esistente segnalava, con il fondale che saliva bruscamente sotto la chiglia quasi nello stesso istante in cui lo scandaglio indicava quattro braccia. Lo scafo è stato squarciato a prua della paratia, e il carpentiere lavora con toppe di piombo e un cassone di fermo mentre la nave giace sbandata sulla spiaggia. I cartografi hanno montato gli strumenti sulla sabbia e lavorato per giorni, ma il rilevamento di questo tratto di costa è finito."
 cartographic_survey_events.31.a: "Ripariamo la nave. Almeno il bassofondo è sulla nostra carta."
 cartographic_survey_events.31.historical_info: "L'incaglio su un bassofondo non cartografato era una disgrazia ordinaria nel rilevamento premoderno, e le navi naufragate producevano spesso informazioni idrografiche più accurate di quelle dei cauti scandagliatori che avevano percorso sani e salvi la stessa costa. Molte istruzioni nautiche annotavano i bassifondi con riferimento ai relitti che li avevano scoperti, e la posizione di una scogliera prima ignota veniva spesso aggiunta alla carta con la laconica annotazione che una nave con un dato nome vi aveva urtato in un determinato anno."

 cartographic_survey_events.32.title: "Una Nave Ostile"
 cartographic_survey_events.32.desc: "Una nave senza bandiera, con vele latine e chiaramente armata, è emersa all'improvviso dalla foschia e ha fatto rotta verso la nave da rilevamento mentre era ancorata a [target_location.GetName]. Il nostro equipaggio, a terra sulla spiaggia con i suoi strumenti, è stato costretto ad abbandonare il lavoro, salire sulle barche e tornare alla nave con i taccuini compilati a metà. La nave sconosciuta ci ha seguiti per mezza giornata, si è allontanata su una rotta che suggerisce un porto d'origine ostile e ha lasciato a brandelli il rilevamento di questo tratto di costa. I cartografi non si lasceranno convincere a tornare."
 cartographic_survey_events.32.a: "Andiamo avanti. Una costa sorvegliata da occhi ostili non dà alcuna carta."
 cartographic_survey_events.32.historical_info: "Il rilevamento costiero era politicamente delicato, poiché carte accurate di una costa straniera erano un presupposto per operazioni navali contro di essa. Le navi da rilevamento che operavano in acque contese erano regolarmente pedinate da navi armate della potenza locale, a volte fermate, a volte semplicemente scoraggiate. I rilevamenti idrografici dell'Ammiragliato inglese sulle coste spagnole ed egee nel XVII e XVIII secolo furono ripetutamente interrotti da simili pressioni, e gli equipaggi addetti al rilevamento venivano addestrati a gettare in mare gli appunti più compromettenti al primo segno di abbordaggio."

 cartographic_survey_events.33.title: "La Nebbia Blocca i Lavori"
 cartographic_survey_events.33.desc: "La nebbia è calata la seconda mattina e non si è sollevata per tre settimane. I cartografi, incapaci di prendere rilevamenti incrociati su punti di riferimento a terra invisibili dietro il muro di nuvole, hanno passato il tempo a giocare a dadi e a lamentarsi del freddo. Le provviste sono scese; [target_leader.GetName] ha deciso che attendere ancora era uno spreco di scorte, e il rilevamento della costa di [target_location.GetName] è stato abbandonato con la carta a metà e gli scandagli non verificati. La nebbia si è sollevata, naturalmente, il giorno dopo la partenza della nave."
 cartographic_survey_events.33.a: "Accettiamo la perdita della stagione e andiamo avanti."
 cartographic_survey_events.33.historical_info: "La nebbia costiera era il nemico cronico del rilevamento premoderno. Il metodo idrografico standard richiedeva linee di vista libere verso punti di riferimento fissi a terra dalle postazioni di lavoro al largo, e una nebbia prolungata rendeva impossibile l'intera procedura. Le spedizioni di rilevamento in regioni nebbiose, come Terranova, il Mare del Nord e il Nordovest del Pacifico, passavano spesso più tempo ad attendere il bel tempo che a svolgere il vero lavoro di rilevamento."
