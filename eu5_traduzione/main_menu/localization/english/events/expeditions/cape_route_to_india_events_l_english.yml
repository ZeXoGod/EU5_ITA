 cape_route_to_india_events.pilot_gained_tt: "Un pilota esperto guida ora la flotta, e offrirà consigli più saggi quando tratteremo con il sovrano di Calicut"

 cape_route_to_india_events.19.title: "Il Morbo del Mare"
 cape_route_to_india_events.19.desc: "Comincia, come sempre, con le gengive. Si ammorbidiscono, poi sanguinano, poi i denti ballano nelle loro sedi. Vecchie ferite guarite anni fa si riaprono come appena inferte. Gli uomini si fanno apatici, poi senza fiato, poi non riescono più ad alzarsi dalle amache. Il chirurgo non ha rimedio, nessuno lo ha. I barili di pesce salato e di gallette piene di punteruoli che hanno sostenuto la flotta attraverso le leghe vuote non contengono nulla che risponda a questo. A ogni alba si fa l'appello, e a ogni alba ci sono meno voci a rispondere. I corpi vanno in mare avvolti nelle loro stesse amache, e le leghe fino alla prossima riva amica si allungano senza pietà."
 cape_route_to_india_events.19.a: "Razioniamo l'ultima frutta e facciamo rotta verso terra a tutta velocità."
 cape_route_to_india_events.19.b: "Non c'è nulla da fare. Seppelliamo i morti e preghiamo per gli altri."
 cape_route_to_india_events.19.b.tt: "Molti dell'equipaggio non sopravvivranno: i frutti del viaggio saranno ridotti"
 cape_route_to_india_events.19.historical_info: "Lo scorbuto, causato da una carenza di vitamina C, fu il più grande killer di marinai nell'epoca dei viaggi a lunga distanza. Nel primo passaggio di Vasco da Gama verso $india$, si stima che novantatré uomini su centoquarantotto siano morti, la grande maggioranza di scorbuto nei lunghi tratti lontani dal cibo fresco. La causa non sarebbe stata compresa con certezza per altri due secoli e mezzo; marinai e medici capivano soltanto che le provviste fresche, gli agrumi su tutte, in qualche modo tenevano a bada la malattia, una conoscenza appresa e dimenticata più volte."

 cape_route_to_india_events.20.title: "La Burrasca del Sud"
 cape_route_to_india_events.20.desc: "Il barometro aveva dato un avvertimento, se qualcuno avesse saputo leggerlo: una lunga e pesante risacca che saliva da sudovest da un cielo sereno. Poi il cielo non fu più sereno. Il vento arrivò forte e poi più forte, strappando le creste alle onde e scagliando gli spruzzi in orizzontale sull'acqua. I mari crescono a un'altezza per cui nessun uomo a bordo ha parole, pareti grigio-verdi striate di schiuma che sollevano le navi di poppa verso le nubi in corsa e le lasciano cadere in avvallamenti dove il vento cala all'improvviso in un'immobilità innaturale. Da qualche parte nella foschia le altre navi sparano cannonate per mantenere la posizione, i colpi persi quasi subito nel ruggito. Non c'è rotta da seguire ora se non quella che il mare consente."
 cape_route_to_india_events.20.a: "Serriamo le vele e mettiamoci alla cappa. Ci fidiamo delle navi."
 cape_route_to_india_events.20.b: "Corriamo davanti ad essa con poca tela e preghiamo di non essere spazzati da poppa."
 cape_route_to_india_events.20.b.win_tt: "L'azzardo paga: la flotta sfugge al peggio della tempesta"
 cape_route_to_india_events.20.b.lose_tt: "Il mare fa ciò che vuole della flotta"
 cape_route_to_india_events.20.historical_info: "Le acque al largo dell'Africa meridionale, dove la calda corrente di Agulhas incontra le fredde onde atlantiche spinte su dall'Oceano Meridionale, sono tra le più pericolose del mondo. Onde anomale in grado di sopraffare una grande nave vi sono documentate ancora oggi. Per le piccole navi dell'età delle scoperte, caracche e caravelle di poche centinaia di tonnellate, una burrasca dell'Atlantico meridionale era una minaccia mortale, e il passaggio attorno al Capo si guadagnò onestamente il suo primo nome, Capo delle Tempeste."

 cape_route_to_india_events.21.title: "Il Mare senza Vento"
 cape_route_to_india_events.21.desc: "Il vento muore a mezzogiorno e non ritorna. Le vele pendono flosce contro gli alberi, sbattendo inutilmente con il rollio dell'onda lunga. Il secondo giorno il mare è diventato vetro, un vasto specchio accecante che si stende fino a un orizzonte tremolante di calore. Il catrame si scioglie nelle giunture del ponte. L'acqua nelle botti diventa calda, verde e imputridita. Non c'è nulla da fare se non attendere: attendere, e guardare il sole, e ascoltare lo scricchiolio delle travi, e cercare di non contare quanta parte delle provviste viene mangiata da uomini che non vanno da nessuna parte. I marinai parlano a bassa voce di navi trovate anni dopo, alla deriva, con gli equipaggi morti di sete a vista di un vento che non hanno mai preso."
 cape_route_to_india_events.21.a: "Aspettiamo il vento. Non c'è nient'altro da fare."
 cape_route_to_india_events.21.b: "Mettiamo fuori le barche e rimorchiamo; qualunque cosa è meglio di questa immobilità."
 cape_route_to_india_events.21.historical_info: "Le calme equatoriali, i doldrums o Zona di Convergenza Intertropicale, erano un pericolo noto della traversata atlantica da e verso l'emisfero australe. Una nave a vela poteva restare in bonaccia lì per giorni o settimane, consumando provviste e acqua senza fare alcun progresso. Fu proprio per evitare questa fascia di calme e venti contrari che i navigatori portoghesi svilupparono la #italic volta do mar#!, la grande virata verso ovest nell'Atlantico, quasi fino al Brasile, per intercettare venti favorevoli verso sud prima di tornare a est verso il Capo."

 cape_route_to_india_events.22.title: "Il Verme nello Scafo"
 cape_route_to_india_events.22.desc: "Il carpentiere lo scopre durante un normale scandaglio del pozzo: il succhiello torna molle, e quando saggia il fasciame sotto la linea di galleggiamento il suo attrezzo affonda in un legno che dovrebbe essere duro come il ferro. Teredine. L'acqua tropicale calda ne è piena, e hanno forato gli scafi da quando la flotta ha attraversato l'equatore: migliaia di tane pallide che crivellano il legno dall'interno, invisibili finché un'asse non cede o le pompe non riescono più a tenere il passo. Lasciata a se stessa, una nave così infestata si aprirà un giorno alle giunture e andrà a fondo con tutti a bordo. Il volto del carpentiere dice a [target_leader.GetName] tutto prima ancora che parli."
 cape_route_to_india_events.22.a: "Carenamo le navi e bruciamo il verme dalle travi."
 cape_route_to_india_events.22.a.tt: "La carenatura costa tempo e denaro, ma salva la flotta"
 cape_route_to_india_events.22.b: "Spogliamo lo scafo peggiore di scorte e legname, e abbandoniamolo."
 cape_route_to_india_events.22.c: "Facciamo rotta verso un porto amico e rimettiamola in sesto come si deve."
 cape_route_to_india_events.22.c.tt: "Una riparazione adeguata in un porto sicuro risolleva il morale della flotta"
 cape_route_to_india_events.22.historical_info: "Il teredine #italic Teredo navalis#!, non un verme ma una specie di mollusco bivalve marino, era il flagello delle navi di legno nelle acque calde, capace di distruggere uno scafo non protetto nel giro di una sola stagione. Le sue devastazioni spinsero a secoli di contromisure: gli scafi venivano rivestiti di piombo, spalmati di pece e sego, o raddoppiati con un fasciame esterno sacrificabile. Il problema era così grave sulla rotta verso $india$ che i portoghesi costruirono infine strutture di carenaggio dedicate nelle loro basi dell'Oceano Indiano per raschiare e riparare gli scafi tra un viaggio e l'altro."

 cape_route_to_india_events.24.title: "Ammutinamento"
 cape_route_to_india_events.24.desc: "Covava da settimane: nelle conversazioni mormorate che cessano all'avvicinarsi di un ufficiale, nella cupa lentezza con cui si obbedisce agli ordini, negli sguardi. Ora esce allo scoperto. Un gruppo di uomini sul castello di prua, uno di loro con un caviglione in pugno, e dietro di loro una folla di altri che non hanno ancora deciso da che parte saltare. Le loro richieste sono quelle di uomini spaventati che credono di essere stati condotti alla morte: tornare indietro, fare rotta verso un porto [ROOT.GetCountry.GetReligion.GetAdjective], qualsiasi cosa tranne proseguire in un oceano che ha già inghiottito tanti loro compagni. [target_leader.GetName] sta, senza alcun appoggio, al limite del cassero. Ciò che farà nel prossimo minuto deciderà se ci sarà ancora un viaggio."
 cape_route_to_india_events.24.a: "Sbarchiamo i caporioni e lasciamo andare i pavidi."
 cape_route_to_india_events.24.b: "Affrontiamoli con l'acciaio. Una nave non è una democrazia."
 cape_route_to_india_events.24.fight_win_tt: "Gli ufficiali prevalgono e l'ordine viene ristabilito"
 cape_route_to_india_events.24.fight_lose_tt: "Lo scontro è sanguinoso, e la flotta ne paga il prezzo"
 cape_route_to_india_events.24.c: "Parliamo loro di $india$, di ricchezze e di gloria a venire."
 cape_route_to_india_events.24.rouse_tt: "Le parole di [target_leader.GetNameWithNoTooltip] riaccendono la determinazione dell'equipaggio"

 cape_route_to_india_events.25.title: "Una Riva Deserta"
 cape_route_to_india_events.25.desc: "Una bassa costa verde si leva dalla foschia sottovento: nessun fumo, nessuna vela, nessun segno di mano umana, solo foresta che scende fino a una linea di risacca e, oltre, la promessa di acqua dolce e di qualunque selvaggina la terra possa offrire. Le carte non mostrano nulla qui. È non rivendicata, sconosciuta, e potrebbe contenere qualunque cosa: sorgenti amiche e caccia facile, o febbre, o un popolo ostile che osserva invisibile dal limitare degli alberi. Ma le botti d'acqua sono quasi vuote e gli uomini hanno gli occhi infossati, e una costa è una costa."
 cape_route_to_india_events.25.a: "Mandiamo le barche a terra per acqua e quel che la terra rende."
 cape_route_to_india_events.25.b: "Troppo rischioso su questa costa. Annotiamola e proseguiamo."

 cape_route_to_india_events.26.title: "Una Riva Disposta a Commerciare"
 cape_route_to_india_events.26.desc: "La costa qui è abitata, e la sua gente non è ostile. Canoe salpano dalla riva mentre la flotta si avvicina, prima caute, poi più audaci, mostrando pesce e frutta e indicando la spiaggia dove si sta rapidamente radunando una specie di mercato. Chiunque detenga questo tratto di costa non ha dissidi con gli stranieri, e la vista del [ShowGoodsName('iron')] e del [ShowGoodsName('cloth')] della flotta ha chiaramente suscitato interesse per il commercio. È esattamente il genere di occasione che le lunghe tratte vuote offrono così di rado: un luogo dove riempire le botti, comprare cibo fresco e far posare agli uomini i piedi su terra solida tra gente che non vuole loro alcun male."
 cape_route_to_india_events.26.a: "Barattiamo [ShowGoodsNameWithNoTooltip('iron')] e [ShowGoodsNameWithNoTooltip('cloth')] per tutte le provviste fresche."
 cape_route_to_india_events.26.b: "Non possiamo risparmiare i giorni. Facciamo solo acqua e proseguiamo."

 cape_route_to_india_events.27.title: "Perduti con Tutti a Bordo"
 cape_route_to_india_events.27.desc: "L'ultima nave è scomparsa. Se per il mare, per la malattia, per la disperazione degli stessi uomini, o per una riva ostile, nessuno in patria lo saprà mai con certezza: solo che la flotta salpata con tanta cerimonia non tornerà. Nessuna stiva piena di [ShowGoodsName('pepper')]. Nessun ritorno trionfale. Nessuna carta della via per $india$. Da qualche parte lungo quell'immenso arco d'oceano, tra la costa dell'Africa e la ricchezza dell'Oriente, la spedizione è semplicemente finita, e il mare si è richiuso su di essa come se non fosse mai esistita. A Lisbona le famiglie attenderanno per mesi, e poi per anni, prima di capire."
 cape_route_to_india_events.27.a: "Che [ROOT.GetCountry.GetReligion.GetGodName] li accolga. Non tenteremo di nuovo presto questa impresa."
 cape_route_to_india_events.27.historical_info: "La rotta marittima verso $india$ fu aperta a un costo umano sbalorditivo. Anche i viaggi riusciti perdevano regolarmente metà degli equipaggi e una parte delle navi; quelli falliti scomparivano del tutto, senza lasciare altra traccia che il mancato ritorno di una flotta. Delle navi che tentarono la #italic Carreira da Índia#! nel secolo successivo, una frazione significativa andò perduta del tutto: naufragate sulla costa africana, affondate nelle burrasche dell'Oceano Meridionale, o semplicemente mai più udite. Grande ricchezza può essere affluita a Lisbona, ma fu pagata con uomini annegati e colpiti dalla febbre su una scala che non andrebbe dimenticata."

 cape_route_to_india_events.28.title: "Approdo a [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.28.desc.empty: "Dieci coni di roccia vulcanica nera si levano da un mare indifferente, e non vive anima su nessuno di essi. Nessun fumo, nessuna vela, nessuna bandiera: solo uccelli marini, vento e poche sorgenti salmastre tra la cenere. Le vecchie carte nominavano queste isole, ma nessuna corona le ha mai colonizzate. Si trovano a cavallo delle stesse acque che la nostra rotta deve attraversare, e [target_leader.GetName] ne conosce il valore con la stessa chiarezza con cui conosce il proprio nome: chi tiene [ShowProvinceDefinitionName('cape_verde_province')] tiene la porta dell'[ShowContinentName('atlantic_ocean_continent')]. E a quest'ora, nessuno la tiene."
 cape_route_to_india_events.28.desc.foreign: "Stendardi [rival_owner.GetAdjective] sventolano sopra l'ancoraggio di [ShowLocationName('santiago')]. [rival_owner.GetName] ha raggiunto queste isole prima di noi e vi ha messo radici: una guarnigione, una batteria, un capitano di porto che voga fuori a chiedere i nostri affari con un tono cortese e inospitale in egual misura. Le isole si trovano a cavallo delle stesse acque che la nostra rotta deve attraversare; in mani [rival_owner.GetAdjectiveWithNoTooltip] sono un coltello puntato alla gola di ogni viaggio verso sud. [target_leader.GetName] studia le fortificazioni dal parapetto, non dice nulla e pensa molto."
 cape_route_to_india_events.28.a: "Rivendichiamo le isole; erigiamo una [ShowBuildingTypeNameWithNoTooltip('por_feitoria')] con la nostra bandiera."
 cape_route_to_india_events.28.b: "Sbarchiamo per l'acqua e foraggiamo ciò che le isole offrono."
 cape_route_to_india_events.28.c: "Queste isole non sono nostre da usare. Proseguiamo a sud."
 cape_route_to_india_events.28.d: "Torniamo a casa."
 cape_route_to_india_events.28.historical_info: "Le isole di Capo Verde furono avvistate dai navigatori portoghesi intorno al 1456 e colonizzate dal 1462, prima di allora completamente disabitate. La loro posizione a metà dell'Atlantico, in grado di intercettare gli alisei di nordest, le rese una tappa indispensabile per i viaggi attorno all'Africa e verso le Americhe. Una potenza che controllava Capo Verde teneva un punto di strozzatura su ogni rotta meridionale; non è un caso che il Portogallo si sia mosso per colonizzare e fortificare le isole man mano che le sue ambizioni oceaniche crescevano."

 cape_route_to_india_events.29.title: "Un Pilastro di Pietra"
 cape_route_to_india_events.29.desc.rafael: "La flotta ha fatto scalo alla foce di un ampio fiume fangoso che i piloti chiamano già [ShowLocationNameWithNoTooltip('quelimane')], il Fiume dei Buoni Segni, perché qui, finalmente, gli uomini hanno trovato ciò per cui hanno attraversato mezzo mondo: imbarcazioni locali armate alla maniera [ShowCultureGroupName('arabian_group')], mercanti che conoscono la parola per '$india$' e indicano a est quando la pronunciano. La grande traversata è vicina. Nella stiva giacciono i pilastri di calcare lavorato portati da casa proprio per questo scopo, ciascuno sormontato da una croce e dallo stemma reale. Il carpentiere chiede se portarne uno a terra. Erigerlo significa piantare una rivendicazione nella pietra e fare acqua e legna mentre i muratori lavorano, ma costerà alla flotta giorni che potrebbe non avere."
 cape_route_to_india_events.29.desc.maria: "Bassi isolotti giacciono al largo della costa qui, verdi e ben irrigati, riparati dall'onda, il genere di terreno che una flotta stanca apprezza più dell'oro. $india$ è ora vicina; la riva del Malabar dista pochi giorni di navigazione a sud. Nella stiva attende un altro dei pilastri di calcare, rifinito e inciso prima dell'inizio del viaggio, pronto a proclamare che le navi della nostra corona hanno raggiunto per prime queste acque. Collocarlo significa lasciare un segno che sopravvivrà a ogni uomo a bordo, ma la cerimonia, e la carenatura e il rifornimento d'acqua che la accompagnano, terranno ferma la flotta mentre la stagione cambia."
 cape_route_to_india_events.29.desc: "La costa qui merita di essere segnata. Nella stiva giace uno dei pilastri di calcare rifinito portati da casa, sormontato da una croce e dallo stemma reale, destinato a ergersi su un promontorio e a proclamare che le nostre navi sono passate di qui per prime. Innalzarlo è un atto solenne, e lento; la flotta deve restare all'ancora mentre i muratori collocano la pietra."
 cape_route_to_india_events.29.a: "Erigiamo il #italic padrão#!: pietra e croce segnino il nostro passaggio."
 cape_route_to_india_events.29.b: "Niente tempo per cerimonie: facciamo acqua, foraggiamo e proseguiamo."
 cape_route_to_india_events.29.historical_info: "Il #italic padrão#! era un pilastro di pietra sormontato da una croce e dallo stemma del Portogallo, portato a bordo prefabbricato ed eretto sulle coste appena raggiunte per affermare scoperta e sovranità. Secondo l'umanista Damião de Góis, la flotta di Vasco da Gama ne collocò cinque durante il viaggio verso $india$: #italic São Rafael#! sul Fiume dei Buoni Segni, #italic São Jorge#! a Mozambico, #italic Espírito Santo#! a Malindi, #italic Santa Maria#! sugli isolotti e #italic São Gabriel#! a Calicut. I pilastri sostituirono le croci di legno deperibili dei viaggi precedenti ed erano destinati a durare; diversi sopravvissero per secoli."

 cape_route_to_india_events.30.title: "Il Viaggio Abbandonato"
 cape_route_to_india_events.30.desc: "L'ordine è dato, e su questa nave non c'è discussione: solo sollievo su alcuni volti e delusione su altri. La prua vira. Alle spalle, la costa sconosciuta si allontana; davanti, la lunga strada familiare verso casa. Nessuna carta di $india$, nessuna stiva di [ShowGoodsName('pepper')], nessun posto nei racconti degli storici su chi trovò per primo la via marittima verso oriente. Ma le navi sono integre, gli equipaggi sono vivi e il porto di casa è una certezza anziché una speranza.\n\n[target_leader.GetName] osserva a lungo l'orizzonte a poppa prima di volgere l'attenzione ai compiti del viaggio che ancora attendono."
 cape_route_to_india_events.30.a: "Così sia. Torniamo con quel poco che abbiamo appreso."
 cape_route_to_india_events.30.historical_info: "Non tutte le spedizioni portoghesi lungo la costa africana proseguivano fino alla meta ultima. I capitani soppesavano regolarmente i rischi di una traversata ignota contro le navi e gli uomini già radunati, e un ritorno sicuro con un resoconto parziale di nuova costa era spesso giudicato la scelta più saggia. Tali viaggi aggiungevano gradualmente alle carte anche quando non raggiungevano $india$, e la conoscenza accumulata da una generazione di viaggi parziali fu ciò che alla fine rese possibile la traversata completa di Vasco da Gama."

 cape_route_to_india_events.31.title: "I Portoghesi Costruiscono la Loro [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.31.desc: "Il loro capitano è sbarcato con doni anziché con artiglieri, e i termini sono stati definiti in tre giorni di trattative: un lotto di terra accanto all'acqua per la loro [ShowBuildingTypeName('por_feitoria')], un affitto versato alla nostra tesoreria, le nostre corti a giudicare ogni contesa tra i loro uomini e i nostri, e la loro flotta a frapporsi tra questo porto e i nostri rivali. Il legname è uscito dalle loro stive già tagliato su misura, e la stazione è stata eretta nel giro di pochi giorni.\n\nBatte lo stemma di [por_feitoria_builder.GetName] accanto al nostro, e l'ancoraggio sottostante è più animato di quanto sia stato in una generazione. I nostri nipoti potrebbero ancora maledire l'accordo, ma il conto di oggi è abbastanza chiaro: noi abbiamo polvere, stoffa e un amico con i cannoni, e loro hanno un magazzino e un molo."
 cape_route_to_india_events.31.a: "Rispettiamo i termini; la nostra corte brontolerà per le armi straniere."
 cape_route_to_india_events.31.b: "Mettiamolo per iscritto, con affitti e diritti fissati per entrambe le corone."
 cape_route_to_india_events.31.historical_info: "Non tutte le feitorias furono erette sotto la minaccia di un bombardamento. Il sultano di Malindi, impegnato in una lunga rivalità con Mombasa, accolse la flotta di Vasco da Gama come un utile contrappeso e fornì il pilota che la portò fino a Calicut. Malindi rimase per decenni un alleato portoghese sulla costa swahili e ospitò prima una fattoria portoghese e poi un forte. I governanti che giunsero presto a un accordo ottennero accesso alle merci portoghesi e protezione navale contro i propri nemici, e diversi usarono l'intesa per regolare vecchi conti propri. Tali accordi erano di rado alla pari, ma dove venivano stretti volontariamente tendevano a durare molto più a lungo di quelli imposti con la forza."
