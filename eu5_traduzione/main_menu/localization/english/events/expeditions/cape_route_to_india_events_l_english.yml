l_english:

 # ── Event 1: Departure ──────────────────────────────────────────────────────
 cape_route_to_india_events.1.title: "La Flotta Salpa"
 cape_route_to_india_events.1.desc: "Le nostre acque non vedevano una flotta simile da una generazione. Quattro navi, centosettanta uomini, [ShowGoodsName('salt')], [ShowGoodsName('fish')] e gallette a sufficienza per anni, e ordini da parte di [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] in persona di trovare la via marittima per $india$. I sacerdoti benedicono gli scafi. La folla preme sulla riva. Qualcuno piange.\n\n[target_leader.GetName] sta a prua mentre le navi superano la barra e incontrano l'[ShowContinentName('atlantic_ocean_continent')] aperto. Alle spalle, il porto si riduce a una macchia bianca su una collina verde. Davanti, l'oceano si estende senza confini in ogni direzione. I calcoli sono stati fatti. Si sa ciò che il viaggio richiede. Se questo basti resta, come sempre, nelle mani di [ROOT.GetCountry.GetReligion.GetGodName]."
 cape_route_to_india_events.1.a: "Se [ROOT.GetCountry.GetReligion.GetGodName|U] vuole, torneremo con le stive piene di spezie."
 cape_route_to_india_events.1.b: "Preghiamo, e poi salpiamo a tutta velocità."
 cape_route_to_india_events.1.historical_info: "La spedizione portoghese per trovare una rotta marittima verso $india$ fu il culmine di quasi un secolo di esplorazioni graduali verso sud lungo la costa africana. Bartolomeo Dias aveva doppiato il Capo di Buona Speranza nel 1488, dimostrando che la rotta era possibile. Il viaggio di Vasco da Gama del 1497-99 portò a termine l'impresa, tornando con pepe e spezie a sufficienza per ripagare sessanta volte il costo della spedizione. Il viaggio cambiò radicalmente il commercio mondiale delle spezie, spezzando il monopolio veneziano e ottomano sulle vie di terra."

 # ── Event 2: Cabo Verde ──────────────────────────────────────────────────────
 cape_route_to_india_events.2.title: "Le Isole di [ShowProvinceDefinitionNameWithNoTooltip('cape_verde_province')]"
 cape_route_to_india_events.2.desc: "Dieci isole vulcaniche che si levano da un mare piatto e senza tratti distintivi: è l'arcipelago di [ShowProvinceDefinitionName('cape_verde_province')]. La flotta sapeva di doverlo incontrare, eppure arriva come un sollievo: terra solida dopo settimane di oceano aperto. La residenza del governatore a [ShowLocationName('santiago')] è una modesta costruzione di pietra imbiancata. Il porto sa di sale, di pesce essiccato e, debolmente, di lichene oricello raschiato dalle rocce per ricavarne tintura.\n\n[target_leader.GetName] soppesa la scelta. [ROOT.GetCountry.GetName] tiene queste isole da decenni, ma 'tenere' è una parola generosa: una piccola guarnigione, pochi coloni, una nave di rifornimento all'anno. Se questa rotta deve significare qualcosa per il futuro di [ROOT.GetCountry.GetNameWithNoTooltip], le isole devono essere più di una semplice tappa di riposo."
 cape_route_to_india_events.2.a: "Investiamo qui, ampliamo l'avamposto a guardia della nostra rotta meridionale."
 cape_route_to_india_events.2.b: "Rifornirsi, fare acqua fresca e proseguire."
 cape_route_to_india_events.2.c: "Proseguiamo: non possiamo permetterci di indugiare così presto."
 cape_route_to_india_events.2.d: "Torniamo a casa."
 cape_route_to_india_events.2.historical_info: "Le isole di Capo Verde furono scoperte dai navigatori portoghesi intorno al 1456 e abitate stabilmente dal 1462. Per la loro posizione nell'Atlantico, in grado di intercettare gli alisei di nordest, divennero una tappa essenziale per i viaggi verso il Sud America e attorno all'Africa. La loro importanza strategica crebbe notevolmente dopo che il viaggio di Vasco da Gama dimostrò la rotta dell'Oceano Indiano. Nel XVI secolo erano un importante snodo della tratta atlantica degli schiavi."

 # ── Event 3: São Tomé ────────────────────────────────────────────────────────
 cape_route_to_india_events.3.title: "L'Isola di [ShowLocationNameWithNoTooltip('sao_tome')]"
 cape_route_to_india_events.3.desc_common: "Il caldo si annuncia prima della costa: un muro umido e soffocante che si posa sul ponte nell'istante in cui la flotta attraversa l'equatore, lasciando gli uomini boccheggianti in un'aria che non si raffredda mai. [ShowLocationName('sao_tome')] emerge dalla foschia del mattino come una corona verde scuro, con due picchi sormontati da nubi e cascate che filtrano attraverso una foresta così fitta che nessuna luce raggiunge il suolo."
 cape_route_to_india_events.3.desc: "$cape_route_to_india_events.3.desc_common$\n\nUn piccolo insediamento si aggrappa alla riva occidentale. Il suolo qui, dicono i coloni, è straordinariamente ricco. Tutto ciò che si pianta cresce. Un uomo potrebbe fare fortuna con lo zucchero su quest'isola, se avesse la manodopera per lavorarla."
 cape_route_to_india_events.3.desc.uninhabited: "$cape_route_to_india_events.3.desc_common$\n\nNessun fumo si leva da alcuna riva. Nessuna barca attende in alcuna cala. L'isola è del tutto priva di gente: le barche della flotta sono le prime a toccare questa spiaggia. Eppure il suolo, dove la giungla può essere ripulita, è nero, profondo e incessantemente fertile. Un uomo potrebbe fare fortuna con lo zucchero su un'isola come questa, se avesse la manodopera per lavorarla, e se le febbri dell'equatore non se lo portassero via prima."
 cape_route_to_india_events.3.desc.foreign: "$cape_route_to_india_events.3.desc_common$\n\nUn insediamento si aggrappa già alla riva occidentale, sotto una bandiera che non è la nostra: moli, una cappella, i primi campi di canna grezzi di coloni [rival_owner.GetAdjective] giunti su questa fertile isola prima di [ROOT.GetCountry.GetName]. Il suolo è ricco quanto promettevano le storie, ma è già impegnato. Qualunque cosa vogliamo da [ShowLocationNameWithNoTooltip('sao_tome')] va ora presa, o negoziata, dalle mani di [rival_owner.GetNameWithNoTooltip]."
 cape_route_to_india_events.3.a: "Stabiliamo una stazione commerciale; la promessa di quest'isola ne vale la pena."
 cape_route_to_india_events.3.a.owned: "Investiamo ulteriormente nell'isola: [ShowLocationNameWithNoTooltip('sao_tome')] risponde già alla nostra bandiera."
 cape_route_to_india_events.3.b: "Piantiamo un #italic padrão#! e rivendichiamo l'isola per la Corona."
 cape_route_to_india_events.3.c: "Facciamo acqua fresca e dirigiamoci a sud."
 cape_route_to_india_events.3.d: "Torniamo a casa."
 cape_route_to_india_events.3.historical_info: "São Tomé era disabitata quando i navigatori portoghesi vi giunsero intorno al 1470. Il suo clima equatoriale si rivelò devastante per i coloni europei, con un'alta mortalità per malattie, ma straordinariamente produttivo per la coltivazione dello zucchero. Negli anni 1520 São Tomé era il maggior produttore mondiale di canna da zucchero, lavorata quasi interamente da africani ridotti in schiavitù. L'isola divenne in seguito un importante punto di smistamento della tratta atlantica degli schiavi, ruolo che avrebbe mantenuto per oltre due secoli."

 # ── Event 4: Loango ──────────────────────────────────────────────────────────
 cape_route_to_india_events.4.title: "La Foce del Grande Fiume"
 cape_route_to_india_events.4.desc: "Qui l'oceano diventa marrone. La flotta lo osserva accadere da un giorno: il colore che sanguina nel mare da sud, color tè e denso di limo. Poi vedono la causa: un fiume più largo di qualsiasi altro in [ROOT.GetCountry.GetName], più largo di qualunque fiume visto da questi uomini, che si getta nell'[ShowContinentName('atlantic_ocean_continent')] in un torrente bruno che macchia il mare per chilometri in ogni direzione.\n\nDalla frangia di mangrovie emergono canoe ricavate da tronchi. Sono enormi: scavate da un unico tronco, lunghe trenta piedi, remate da una dozzina di uomini in perfetta sincronia. Gli uomini in piedi a prua non sono armati. Osservano la flotta con la composta curiosità di gente che non ha mai avuto paura degli stranieri."
 cape_route_to_india_events.4.a: "Cerchiamo udienza presso il [target_owner.Custom('GetRulerOrRegentTitle')] di questa terra."
 cape_route_to_india_events.4.b: "Scambiamo [ShowGoodsNameWithNoTooltip('ivory')], [ShowGoodsNameWithNoTooltip('copper')] e qualunque cosa offrano."
 cape_route_to_india_events.4.c: "Cartografiamo la foce del fiume e proseguiamo a sud; non possiamo ritardare."
 cape_route_to_india_events.4.d: "Torniamo a casa."
 cape_route_to_india_events.4.historical_info: "Il Regno del Kongo fu una delle entità politiche più sofisticate dell'Africa subsahariana, e controllava territori attraverso gran parte dell'attuale Congo, Angola e Gabon. Il ManiKongo (il re) governava attraverso una burocrazia gerarchica e manteneva un sofisticato sistema di governo provinciale. I missionari portoghesi presero contatto con il regno negli anni 1480, avviando una relazione che si sarebbe rivelata trasformativa e, alla fine, catastrofica per entrambe le parti. Il regno si convertì al cristianesimo negli anni 1490, e il ManiKongo assunse il nome di João I."

 # ── Event 5: Luanda ──────────────────────────────────────────────────────────
 cape_route_to_india_events.5.title: "La Baia di [ShowLocationNameWithNoTooltip('luanda')]"
 cape_route_to_india_events.5.desc: "Ogni ufficiale della spedizione la riconosce nell'istante in cui la vede. Nessuno dei marinai ha mai visto un porto simile lungo la costa africana: una lunga baia curva riparata da sudovest da una lingua di sabbia naturale, acque profonde vicino alla riva e, dietro, un basso promontorio con una vista dominante in ogni direzione. I pescatori locali la chiamano Loanda: il luogo piatto.\n\n[target_leader.GetName] percorre per intero la lingua di sabbia nella luce del pomeriggio, con la baia da un lato e l'[ShowContinentName('atlantic_ocean_continent')] aperto dall'altro. Già si pensa alle mura. All'acqua dolce. Al numero di navi che una guarnigione qui potrebbe proteggere, o intercettare. Una città costruita qui potrebbe controllare l'intero commercio dell'Atlantico meridionale."
 cape_route_to_india_events.5.desc.owned: "La flotta entra in una baia di cui non c'è bisogno di spiegare il valore: [ShowLocationName('luanda')] batte già i colori di [ROOT.GetCountry.GetName], con la sua lunga lingua di sabbia che ripara navi che rispondono alla nostra stessa corona.\n\n[target_leader.GetName] percorre per intero la lingua di sabbia nella luce del pomeriggio, con la baia da un lato e l'[ShowContinentName('atlantic_ocean_continent')] aperto dall'altro, pensando non se impadronirsi di questo suolo, ma a quanto altro potrebbe ancora rendere. Rafforzata ulteriormente, una città qui potrebbe controllare l'intero commercio dell'Atlantico meridionale."
 cape_route_to_india_events.5.a: "Costruiamo qui una grande [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]: nessun'altra è paragonabile."
 cape_route_to_india_events.5.a.owned: "Ampliamo il nostro grande avamposto a [ShowLocationNameWithNoTooltip('luanda')]: nessuno su questa costa è paragonabile."
 cape_route_to_india_events.5.b: "Stabiliamo una modesta stazione commerciale e un deposito di rifornimenti."
 cape_route_to_india_events.5.b.owned: "Ampliamo la stazione commerciale e il deposito di rifornimenti che già possediamo qui."
 cape_route_to_india_events.5.c: "Annotiamo la sua posizione sulle carte e proseguiamo a sud."
 cape_route_to_india_events.5.d: "Torniamo a casa."
 cape_route_to_india_events.5.historical_info: "Luanda fu fondata formalmente come colonia portoghese nel 1575 sotto Paulo Dias de Novais, il che ne fa uno dei più antichi insediamenti europei dell'Africa subsahariana. Il suo porto naturale ne fece per oltre quattro secoli il principale scalo dell'Angola portoghese. Dal XVI secolo in poi, Luanda divenne il principale punto d'imbarco della tratta transatlantica degli schiavi nell'Africa meridionale, spedendo milioni di persone ridotte in schiavitù verso il Brasile e i Caraibi."

 # ── Event 6: Walvis Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.6.title: "La Costa del Deserto"
 cape_route_to_india_events.6.desc: "Qui il deserto arriva al mare, con dune rosse che si levano direttamente dalla linea della risacca e creste che spargono sabbia nell'aria. Non ci sono alberi. Non c'è acqua dolce visibile. La costa a nord, che gli uomini chiamano già [ShowLocationName('skeleton_coast')] per le ossa di balena che sbiancano sulla spiaggia, non mostra alcun segno di insediamento umano per centinaia di miglia in ogni direzione.\n\nEppure la baia è calma. Riparata dalle peggiori ondate, offre alla flotta l'opportunità di riparare un albero danneggiato e di rifornirsi d'acqua da una sorgente salmastra tra le dune. Sul promontorio sopra, il navigatore della nave misura l'angolo del sole con i suoi strumenti e prende appunti. Il Capo, dice, non dista più di una settimana di navigazione a sud. Alcuni degli uomini si fanno il segno della croce."
 cape_route_to_india_events.6.a: "Rincuoriamo gli uomini: il Capo è finalmente a portata. Avanti!"
 cape_route_to_india_events.6.b: "Queste correnti e questi venti parlano; lasciamo che li leggiamo."
 cape_route_to_india_events.6.c: "Lasciamo che gli uomini riposino; avranno bisogno di forze per le tempeste che ci attendono."
 cape_route_to_india_events.6.d: "Torniamo a casa: questa costa è troppo desolata per spingersi oltre."
 cape_route_to_india_events.6.historical_info: "La costa della Namibia era nota ai marinai portoghesi come #italic Costa dos Esqueletos#! (Costa degli Scheletri) per l'abbondanza di ossa di balena e di foca, e per i relitti di navi spinte sulla sua costa sottovento dai potenti venti da sudovest. Walvis Bay, chiamata dagli olandesi #italic Walvischbaai#! (Baia delle Balene), era uno dei pochi ancoraggi riparati lungo questo tratto altrimenti ostile. Bartolomeo Dias vi si fermò nel 1488 durante il suo viaggio verso sud."

 # ── Event 7: Cape of Good Hope ───────────────────────────────────────────────
 cape_route_to_india_events.7.title: "Il Capo delle Tempeste"
 cape_route_to_india_events.7.desc: "Nulla, in tre mesi di navigazione, li ha preparati a questo. La tempesta arriva senza preavviso, da sudovest, spingendo davanti a sé onde alte quaranta piedi. La nave di testa scompare in un avvallamento e non riemerge per trenta secondi. L'attrezzatura viene strappata via. Uomini vengono scagliati giù dal sartiame. [target_leader.GetName] stringe il parapetto di poppa con entrambe le mani e fissa il caos attorno, e da qualche parte nella cacofonia del vento e dell'acqua infranta capisce qualcosa: sono passati. Il Capo, la grande punta meridionale del continente africano, la fine del mondo conosciuto, è alle loro spalle.\n\nLa via per $india$ è aperta."
 cape_route_to_india_events.7.a: "Chiamiamolo Capo di Buona Speranza e facciamo vela a est senza indugio!"
 cape_route_to_india_events.7.b: "Ripariamoci sottovento al promontorio finché la tempesta non passa."
 cape_route_to_india_events.7.d: "Abbiamo fatto abbastanza; il Capo è doppiato. Torniamo a casa."
 cape_route_to_india_events.7.historical_info: "Bartolomeo Dias doppiò per primo il Capo nel 1488, chiamandolo #italic Cabo das Tormentas#! (Capo delle Tempeste). Secondo le fonti portoghesi, re João II lo ribattezzò #italic Cabo da Boa Esperança#! (Capo di Buona Speranza) per incoraggiare future spedizioni, anche se questo racconto potrebbe essere apocrifo. Il Capo non è il punto più meridionale dell'Africa, primato che spetta a Capo Agulhas, circa duecento chilometri a est, ma segna il punto di incontro tra l'Oceano Atlantico e quello Indiano e la porta verso oriente."

 # ── Event 8: Mossel Bay ──────────────────────────────────────────────────────
 cape_route_to_india_events.8.title: "La Baia dei Mandriani"
 cape_route_to_india_events.8.desc: "La baia è calma e bellissima, riparata da sudovest da un basso promontorio. Alberi di milkwood offrono una gradita ombra lungo la riva. E sul pendio sopra la spiaggia: bovini. Bovini grassi e sani che pascolano in enormi mandrie, accuditi da gente alta con ocra e perline di vetro che osserva la flotta da una distanza di sicurezza da quando ha gettato l'ancora.\n\nAlcuni degli uomini sono quasi in lacrime alla vista della carne fresca. Vivono da settimane di pesce salato e gallette. Alla fine uno dei mandriani scende alla linea dell'acqua e vi sosta, osservando, finché il capitano della flotta sale su una lancia e voga per incontrarlo. Segue uno scambio che coinvolge anelli di [ShowGoodsName('copper')], pesce essiccato e moltissimi pazienti gesti. Al calar della notte, tre bovini sono nella stiva. Il suono dei muggiti è, per ogni uomo della flotta, il rumore più bello che abbia mai udito."
 cape_route_to_india_events.8.a: "Scambiamo [ShowGoodsNameWithNoTooltip('copper')] e [ShowGoodsNameWithNoTooltip('cloth')] per bovini; piantiamo un #italic padrão#!."
 cape_route_to_india_events.8.a.morale_tt: "Il morale degli equipaggi si risolleva molto (#G +15#! Morale dell'Equipaggio)"
 cape_route_to_india_events.8.b: "Erigiamo un #italic padrão#! e rivendichiamo questa terra per [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.8.b.morale_tt: "Il morale degli equipaggi si risolleva leggermente (#G +8#! Morale dell'Equipaggio)"
 cape_route_to_india_events.8.c: "Lasciamo che gli uomini riposino e si riprendano qui prima di spingerci a nord."
 cape_route_to_india_events.8.c.morale_tt: "Il morale degli equipaggi si risolleva in modo percepibile (#G +10#! Morale dell'Equipaggio)"
 cape_route_to_india_events.8.d: "Torniamo a casa."
 cape_route_to_india_events.8.historical_info: "Mossel Bay era nota ai marinai portoghesi come #italic Bahia dos Vaqueiros#! (Baia dei Mandriani) o, in seguito, #italic Aguada de São Brás#! (Punto di Acqua di San Biagio). Bartolomeo Dias vi eresse un #italic padrão#! di pietra nel 1488, tradizione proseguita da Vasco da Gama nel 1497. I Khoikhoi indigeni commerciarono inizialmente di buon grado con entrambe le spedizioni, ma in seguito divennero ostili: gli uomini di Vasco da Gama furono bersagliati di pietre quando tentarono di prendere acqua fresca senza un adeguato pagamento."

 # ── Event 9: Sofala ──────────────────────────────────────────────────────────
 cape_route_to_india_events.9.title: "Il Porto dell'Oro di [ShowLocationNameWithNoTooltip('sofala')]"
 cape_route_to_india_events.9.desc: "Il porto di [ShowLocationName('sofala')] è affollato di dhow. Non sono i piccoli natanti da pesca a cui la flotta si è abituata lungo la costa meridionale; sono navi d'alto mare provenienti dall'[ShowRegionName('arabia_region')] e dalla [ShowRegionName('persia_region')], cariche fino all'orlo di [ShowGoodsName('ivory')], ebano e [ShowGoodsName('cloth')]. Sul lungomare, i mercanti trattano affari in [ShowLanguageName('arabic_language')] e in [location.GetDominantCulture.GetLanguage.GetName], una lingua che nessuno degli interpreti della flotta riesce a collocare. Piccoli pizzichi di polvere d'oro passano di mano in cambio di rotoli di cotone indiano.\n\nI mercanti arabi che dominano questo porto da secoli osservano l'arrivo della flotta [ROOT.GetCountry.GetAdjective] da sotto i tendoni dei loro magazzini. Le loro espressioni sono indecifrabili, ma il linguaggio del corpo è inequivocabile: l'apparizione di questi stranieri, con i loro cannoni di ferro e le croci dipinte sulle vele, non è uno sviluppo gradito. Il capitano della flotta prende nota dei magazzini più grandi, delle posizioni degli ormeggi dei dhow, della profondità dell'acqua all'ingresso della baia."
 cape_route_to_india_events.9.a: "Costruiamo una grande [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]; quest'oro arricchirà [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.9.a.owned: "Riversiamo investimenti nel nostro avamposto a [ShowLocationNameWithNoTooltip('sofala')]: quest'oro renderà ricca [ROOT.GetCountry.GetNameWithNoTooltip]."
 cape_route_to_india_events.9.b: "Scambiamo per polvere d'oro e scopriamo cosa si trova nell'entroterra."
 cape_route_to_india_events.9.c: "Raccogliamo informazioni e proseguiamo: il tempo è prezioso."
 cape_route_to_india_events.9.d: "Torniamo a casa."
 cape_route_to_india_events.9.historical_info: "Sofala era il porto significativo più meridionale della rete commerciale swahili, e controllava l'accesso al regno aurifero di #italic Mutapa#! (Grande Zimbabwe) sull'altopiano a ovest. I mercanti arabi vi operavano almeno dal X secolo. I portoghesi presero Sofala nel 1505, distruggendo la rete commerciale araba e tentando di reindirizzare il commercio dell'oro attraverso i propri canali, con successo alterno, poiché gran parte dei traffici si spostò semplicemente nell'entroterra, fuori dalla loro portata."

 # ── Event 10: Mozambique Island ──────────────────────────────────────────────
 cape_route_to_india_events.10.title: "L'Isola di [ShowLocationNameWithNoTooltip('mozambique')]"
 cape_route_to_india_events.10.desc: "Una piccola isola, non più di tre chilometri da un capo all'altro, separata dalla terraferma da uno stretto canale appena abbastanza profondo per le navi d'alto mare. L'isola è dominata da una stazione commerciale in pietra che batte una bandiera verde, e il porto è pieno di dhow provenienti da ogni angolo dell'[ShowContinentName('indian_ocean_continent')]. [ShowGoodsName('ivory')] ed ebano scendono dall'entroterra, uomini e donne ridotti in schiavitù vengono condotti dalla terraferma, il [ShowGoodsName('copper')] arriva da sud, e [ShowGoodsName('cloth')] e [ShowGoodsName('porcelain')] giungono da $india$ e $china$, tutto passando di mano in una rete commerciale che funziona da sei secoli.\n\nIl [target_ruler_country.Custom('GetRulerOrRegentTitle')] è ricco e sospettoso. I mercanti [ShowCultureGroupName('arabian_group')] arrivati prima della flotta hanno avvertito il sovrano che gli stranieri sono pirati [ROOT.GetCountry.GetReligion.GetAdjective] che distruggono ciò che non possono rubare. Il sovrano riceve l'inviato della flotta con attenta cortesia, circondato da guardie armate, e pone molte domande sugli armamenti. La sua posizione, nel cuore di un porto circondato da bocche di cannone, non è ciò che i [ROOT.GetCountry.GetAdjective] definirebbero comoda."
 cape_route_to_india_events.10.a: "Corrompiamo il [target_ruler_country.Custom('GetRulerOrRegentTitle')] con merci e compriamo il diritto di costruire."
 cape_route_to_india_events.10.b: "Negoziamo diritti commerciali con la diplomazia e i doni."
 cape_route_to_india_events.10.c: "Superiamo l'offerta dei mercanti [ShowCultureGroupNameWithNoTooltip('arabian_group')] e conquistiamo il [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.10.d: "Riconosciamo per ora la pretesa del [target_ruler_country.Custom('GetRulerOrRegentTitle')] e proseguiamo a nord."
 cape_route_to_india_events.10.f: "Erigiamo il #italic São Jorge padrão#!."
 cape_route_to_india_events.10.e: "Torniamo a casa."
 cape_route_to_india_events.10.historical_info: "L'isola di Mozambico divenne la più importante base del Portogallo nell'Africa orientale, fondata formalmente nel 1507. Il forte di São Sebastião, costruito nel XVI secolo, rimane una delle più antiche fortificazioni europee ancora in piedi nell'Africa subsahariana. L'isola servì da capitale amministrativa dell'Africa orientale portoghese e da tappa per la rotta verso $india$ per oltre due secoli. La sua cattura distrusse di fatto il controllo arabo sulla rete commerciale della costa swahili settentrionale."

 # ── Event 11: Mombasa ────────────────────────────────────────────────────────
 cape_route_to_india_events.11.title: "La Trappola di [ShowLocationNameWithNoTooltip('mombasa')]"
 cape_route_to_india_events.11.desc: "Il canale d'ingresso di [ShowLocationName('mombasa')] è stretto, non più di due gomene di larghezza, con alture su entrambe le rive. Mentre la flotta lo attraversa, gli uomini cominciano a percepire che qualcosa non va: uomini che bighellonano lungo il lungomare con l'eccessiva noncuranza di uomini pesantemente armati cui è stato detto di sembrare disarmati, un dhow ancorato in una posizione strana che bloccherebbe l'uscita del canale, e l'inviato del [target_ruler_country.Custom('GetRulerOrRegentTitle')] che sale a bordo della nave ammiraglia con elaborata cerimonia, doni e troppe domande sul numero di uomini d'arme a bordo.\n\nQuella notte, un interprete assunto dalla flotta si introduce nella cabina del capitano. Prima di tornare a terra, l'inviato del [target_ruler_country.Custom('GetRulerOrRegentTitle')] ha parlato ai suoi compagni in [location.GetDominantCulture.GetLanguage.GetName], un dialetto che l'uomo comprende. Le parole erano inequivocabili: la flotta non deve lasciare [ShowLocationNameWithNoTooltip('mombasa')]."
 cape_route_to_india_events.11.a: "Partiamo prima dell'alba; questa accoglienza non vale il rischio."
 cape_route_to_india_events.11.b: "Restiamo e tentiamo di commerciare nonostante l'evidente tensione."
 cape_route_to_india_events.11.c: "Se tramano tradimento, agiremo per primi; prepariamo gli uomini."
 cape_route_to_india_events.11.d: "Torniamo a casa: non rischieremo la flotta qui."
 cape_route_to_india_events.11.historical_info: "Vasco da Gama fu quasi vittima di un'imboscata a Mombasa nell'aprile del 1498. Secondo le fonti portoghesi, i piloti locali forniti dal sultano tentarono di far arenare la flotta su un banco di sabbia. Da Gama si ritirò prima che la trappola scattasse. Nei decenni successivi, i portoghesi tornarono più volte a bombardare e saccheggiare Mombasa. Il Forte Jesus, costruito nel 1593, assicurò infine il controllo portoghese del porto, anche se la città fu catturata dagli omaniti nel 1698 dopo un lungo assedio."

 # ── Event 12: Malindi ────────────────────────────────────────────────────────
 cape_route_to_india_events.12.title: "Il [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] Amico"
 cape_route_to_india_events.12.desc: "Tutto di [ShowLocationName('malindi')] è diverso da ciò che è venuto prima. [court_host.GetName], il [target_ruler_country.Custom('GetRulerOrRegentTitle')], scende in persona al porto, con indosso seta bianca e verde, accompagnato da musicisti che suonano uno strumento che produce una musica mai udita da nessuno dei [ROOT.GetCountry.GetAdjective]. Ha avuto notizie della flotta dai propri contatti a sud e ne attendeva l'arrivo.\n\nHa un dono che vale più dell'avorio: al proprio servizio ha un uomo che ha navigato dodici volte fino a Calicut. Un uomo che conosce ogni corrente, ogni scogliera, ogni cambio di vento tra qui e la costa del Malabar. Che sa quando il monsone di sudovest porterà una nave attraverso l'[ShowContinentName('indian_ocean_continent')] in tre settimane e quando la distruggerà in ventiquattr'ore. Il nome del pilota, spiega [court_host.GetNameWithNoTooltip], è difficile da rendere in una lingua europea. Ma la sua conoscenza non lo è, e il prezzo di quella conoscenza è l'amicizia."
 cape_route_to_india_events.12.a: "Accogliamo volentieri il pilota di [court_host.GetNameWithNoTooltip] e la sua amicizia."
 cape_route_to_india_events.12.b: "Offriamo doni, una presenza e protezione al [target_ruler_country.Custom('GetRulerOrRegentTitle')]."
 cape_route_to_india_events.12.c: "Preghiamo prima della traversata; [ROOT.GetCountry.GetReligion.GetGodName|U] ci ha condotti qui."
 cape_route_to_india_events.12.e: "Erigiamo l'#italic Espírito Santo padrão#! prima della grande traversata."
 cape_route_to_india_events.12.d: "Torniamo a casa; Calicut è troppo lontana, la traversata troppo pericolosa."
 cape_route_to_india_events.12.historical_info: "Il sultano di Malindi manteneva una lunga rivalità con Mombasa ed era perciò ben disposto verso i portoghesi, giunti come potenziali contrappesi ai suoi nemici. Il pilota dell'Oceano Indiano che fornì a Vasco da Gama, indicato nelle fonti portoghesi come Malemo Canaca, è stato oggetto di dibattito accademico per secoli. Alcuni storici lo identificano con Ahmad ibn Majid, il più grande navigatore arabo del XV secolo e autore di diverse opere sulla navigazione nell'Oceano Indiano. Altri sostengono che l'identificazione sia errata e che il pilota fosse un mercante gujarati. La sua identità resta incerta."

 # ── Event 13: Kozhikode (Calicut) ────────────────────────────────────────────
 cape_route_to_india_events.13.title: "Calicut: la Porta delle Spezie"
 cape_route_to_india_events.13.desc: "[ShowLocationName('kozhikode')] è più grande di [ROOT.GetCountry.GetCapital.GetName]. Il porto contiene più navi di quante gli ufficiali della flotta riescano a contare: vascelli dall'[ShowRegionName('arabia_region')], dalla [ShowRegionName('persia_region')], da [ShowAreaName('gujarat_area')], dal [ShowRegionName('bengal_region')], da $china$, da [ShowLocationName('malacca')] e da [ShowAreaName('java_area')]. Un intero mondo connesso è stato attratto dalla forza magnetica del [ShowGoodsName('pepper')], della cannella, del cardamomo e dei [ShowGoodsName('cloves')], e tutto fluisce attraverso questo porto. La flotta getta l'ancora in una rada già affollata di dhow mentre i mercanti [ShowCultureGroupName('arabian_group')] sul lungomare la fissano.\n\nPer due mesi hanno detto al [target_ruler_country.Custom('GetRulerOrRegentTitle')], il sovrano di Calicut, che governa da dietro elaborate mura cerimoniali, che questi nuovi arrivati sono pirati del freddo nord, non mercanti. Il [target_ruler_country.Custom('GetRulerOrRegentTitle')|U] ha accettato di ricevere il capitano della flotta, ma la sua [target_ruler_country.GetGovernment.GetCourtTitle|l] è diffidente e i suoi mercanti nervosi. L'aria sa di [ShowGoodsNameWithNoTooltip('pepper')] nero e del sale di un mare che ha visto mille anni di commerci. Tutto ciò per cui il viaggio è stato fatto si riduce a ciò che verrà detto nella prossima ora."
 cape_route_to_india_events.13.a: "Offriamo le nostre merci al [target_ruler_country.Custom('GetRulerOrRegentTitle')] e chiediamo una stazione commerciale."
 cape_route_to_india_events.13.b: "Proponiamo un trattato: dazi fissi, ancoraggio sicuro, protezione."
 cape_route_to_india_events.13.c: "Definiamo bugiardi i mercanti [ShowCultureGroupNameWithNoTooltip('arabian_group')]; costringiamo il [target_ruler_country.Custom('GetRulerOrRegentTitle')] a scegliere."
 cape_route_to_india_events.13.d: "Il nostro pilota conosce questa [target_ruler_country.GetGovernment.GetCourtTitle|l]; il suo consiglio guida le nostre parole."
 cape_route_to_india_events.13.e: "Piantiamo il #italic São Gabriel padrão#! perché tutti lo vedano."
 cape_route_to_india_events.13.historical_info: "Kozhikode (nota agli europei come Calicut) era il più importante porto del commercio delle spezie nell'Oceano Indiano. Il #italic Sāmūtiri#! (Zamorin, o Signore del Mare) ne era il sovrano, e manteneva un attento equilibrio tra i mercanti arabi che dominavano i traffici, i rivali stati indiani e, più tardi, gli europei in arrivo. La prima accoglienza di Vasco da Gama nel 1498 fu contrastata: i suoi doni furono ritenuti inadeguati e i mercanti arabi avvelenarono con successo i rapporti a corte. Partì con un carico esiguo e insoddisfacente. Solo nei viaggi successivi, sostenuti dalla minaccia dei cannoni portoghesi, furono estorti accordi commerciali significativi."

 # ── Event 14: Axim (Gold Coast) ─────────────────────────────────────────────
 cape_route_to_india_events.14.title: "La Costa d'Oro"
 cape_route_to_india_events.14.desc: "La foresta inizia a un giorno di cammino dalla riva, e il sentiero tra costa e foresta è ben battuto. Le carovane arrivano alla spiaggia due, tre volte a settimana: portatori con sacche di cuoio piene di polvere d'oro, estratta dalle ghiaie fluviali dell'interno dove i re [ShowCultureName('akan')] controllano i siti di lavaggio e commerciano il loro surplus attraverso una rete di mercanti Wangara che risale a quattro secoli fa.\n\nI [ROOT.GetCountry.GetAdjective] hanno sentito parlare di questo luogo. Ogni capitano [ShowCultureGroupName('arabian_group')] che commerciava lungo queste coste parlava dei mercati della Costa d'Oro come del tratto più produttivo del litorale guineano. La gente qui ha già visto navi straniere. Non ha paura. Sta calcolando quanto valgano i nuovi arrivati."
 cape_route_to_india_events.14.a: "Erigiamo São Jorge da Mina; gli [ShowCultureNameWithNoTooltip('akan')] venderanno a chi la detiene."
 cape_route_to_india_events.14.a.owned: "Rafforziamo São Jorge da Mina: gli [ShowCultureNameWithNoTooltip('akan')] già vendono per le nostre mani."
 cape_route_to_india_events.14.b: "Negoziamo per i prigionieri che gli [ShowCultureNameWithNoTooltip('akan')] prendono come tributo di guerra."
 cape_route_to_india_events.14.c: "Assaltiamo l'insediamento prima che i mercanti Wangara partano."
 cape_route_to_india_events.14.d: "Annotiamo il volume di scambi e proseguiamo a sud. Non c'è tempo da perdere."
 cape_route_to_india_events.14.e: "Torniamo a casa. L'oro da solo giustifica il viaggio."
 cape_route_to_india_events.14.historical_info: "I portoghesi costruirono São Jorge da Mina (il Castello di Elmina) nel 1482 sulla Costa d'Oro, usando pietra estratta da un vicino promontorio e legname pretagliato in Portogallo e caricato sulle navi allo scopo. Il forte fu eretto nel giro di poche settimane, in parte per negoziato con un capo locale di nome Caramansa e in parte di sorpresa. Era inizialmente destinato a controllare il commercio dell'oro con i regni forestali akan. Nel giro di pochi decenni divenne il principale snodo della tratta atlantica degli schiavi, ricevendo prigionieri dalle guerre dell'interno e spedendoli verso ovest alle piantagioni di zucchero di São Tomé e, più tardi, del Brasile. Lo storico Walter Rodney stimò che il commercio della Costa d'Oro valesse per il Portogallo diverse centinaia di migliaia di cruzados d'oro l'anno prima che la tratta degli schiavi soppiantasse l'oro come merce principale."

 # ── Event 15: Fernando Po ────────────────────────────────────────────────────
 cape_route_to_india_events.15.title: "L'Isola di Fernão do Pó"
 cape_route_to_india_events.15.desc: "Un'isola si leva dal Golfo di Guinea: un picco vulcanico con una scia di nubi sulla cima, fitto di giungla fino al bordo dell'acqua. I [ShowCultureName('bubi_culture')] che vivono qui non hanno mai visto europei. Osservano dal limitare degli alberi mentre la flotta getta l'ancora in una baia naturale e viene calata una barca.\n\nL'esploratore che diede il proprio nome a quest'isola è passato di qui una generazione fa e l'ha disegnata in modo approssimativo sulle carte. Il pilota della flotta possiede quella carta. Ciò che essa non mostra è se valga la pena di fermarsi sull'isola."
 cape_route_to_india_events.15.desc.owned: "L'isola si leva dal mare come prima: un picco vulcanico con una scia di nubi, la giungla che preme fino al bordo dell'acqua. Ma l'ancoraggio sottostante batte già la nostra bandiera, e le barche che salpano incontro alla flotta sono le nostre.\n\n[target_leader.GetName] non ha bisogno di chiedersi se valga la pena fermarsi sull'isola. La questione ora è solo quanto di più si possa ricavare dal punto d'appoggio che [ROOT.GetCountry.GetNameWithNoTooltip] possiede già qui, a cavallo del commercio di [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
 cape_route_to_india_events.15.a: "Stabiliamo un avamposto; l'isola controlla il commercio di [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
 cape_route_to_india_events.15.a.owned: "Rinforziamo il nostro avamposto qui: l'isola ancora già il nostro commercio di [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')]."
 cape_route_to_india_events.15.b: "Piantiamo un #italic padrão#!, cartografiamo l'isola e rivendichiamola."
 cape_route_to_india_events.15.c: "Carenamo gli scafi, riempiamo le botti e foraggiamo l'isola."
 cape_route_to_india_events.15.c.tt: "Gli scafi vengono raschiati e sigillati con la pece, e il teredine non darà fastidio alla flotta in questo viaggio"
 cape_route_to_india_events.15.d: "Torniamo a casa. [ShowAreaNameWithNoTooltip('gulf_of_guinea_area')] è già una ragione sufficiente."
 cape_route_to_india_events.15.historical_info: "Fernando Po (l'odierna Bioko) fu raggiunta dall'esploratore portoghese Fernão do Pó intorno al 1472, il primo europeo ad avvistare l'isola. Gli indigeni Bubi vi vivevano in isolamento da secoli, avendo attraversato dalla terraferma molto tempo prima. I portoghesi usarono l'isola come tappa ma faticarono a stabilire un insediamento duraturo, in parte per le malattie tropicali e in parte perché i Bubi resistevano al contatto. L'isola cambiò più volte di mano nei secoli successivi; con il Trattato di El Pardo del 1778, il Portogallo la cedette alla Spagna in cambio di concessioni territoriali in Sud America, e alla fine divenne parte della moderna Guinea Equatoriale."

 # ── Event 16: Mogadishu ──────────────────────────────────────────────────────
 cape_route_to_india_events.16.title: "La Città del Sultano del Mare"
 cape_route_to_india_events.16.desc: "[ShowLocationName('mogadishu')] è più grande di quanto ci aspettassimo. Il porto è animato da dhow dall'[ShowRegionName('arabia_region')] e da $india$, con le stive piene di [ShowGoodsName('cloth')], [ShowGoodsName('copper')] e [ShowGoodsName('porcelain')]. [ShowLocationNameWithNoTooltip('mogadishu')] è governata dal [target_owner.Custom('GetRulerOrRegentTitle')] di [target_owner.GetName], che regola il commercio tra l'interno [ShowCultureName('somali_culture')] e il più ampio mondo oceanico. I mercanti sul lungomare osservano le nostre navi con occhio calcolatore. Non siamo i primi stranieri ad arrivare qui con vele strane e merci strane, ma potremmo essere i primi a provenire da così lontano a occidente."
 cape_route_to_india_events.16.a: "Commerciamo con i mercanti [ShowCultureNameWithNoTooltip('somali_culture')]. Ogni contatto conta."
 cape_route_to_india_events.16.b: "Osserviamo, registriamo e proseguiamo a nord. Cerchiamo $india$, non questo."
 cape_route_to_india_events.16.c: "Torniamo indietro. La rotta è ignota; le provviste non basteranno."
 cape_route_to_india_events.16.historical_info: "Mogadiscio era una delle più antiche e ricche città della costa dell'Africa orientale, con una storia commerciale ininterrotta che risaliva a secoli prima dell'arrivo dei portoghesi. I geografi arabi la documentarono come importante porto già nel IX secolo. All'epoca del viaggio di da Gama era governata da un sultanato e faceva parte della rete commerciale della costa swahili che collegava l'interno africano con l'Arabia, la Persia e il subcontinente indiano. La decisione portoghese di aggirare o costringere queste città-stato swahili a favore dell'instaurazione di un proprio monopolio commerciale li portò in diretto conflitto con un sistema commerciale esistente e altamente funzionale."

 # ── Event 17: Masqat (Oman) ──────────────────────────────────────────────────
 cape_route_to_india_events.17.title: "Il Porto Ibadita"
 cape_route_to_india_events.17.desc: "[ShowLocationName('masqat')] si leva da scogliere rosse e l'odore del mare qui è diverso: più secco, più acuto, con un gusto insieme di polvere e di [ShowGoodsName('salt')]. Il porto è uno dei migliori del [ShowProvinceDefinitionName('arabian_sea_province')], abbastanza profondo per grandi navi e riparato dal monsone di sudovest. I mercanti [ShowCultureName('omani_culture')] navigano verso $india$ da mille anni. Gli uomini sul lungomare conoscono le rotte, i venti e i tempi. Sanno quando salpare e quando attendere. Ci guardano e si chiedono cosa vogliamo."
 cape_route_to_india_events.17.a: "Cerchiamo le autorità [ShowCultureNameWithNoTooltip('omani_culture')] e presentiamoci."
 cape_route_to_india_events.17.b: "Paghiamo i navigatori [ShowCultureGroupNameWithNoTooltip('arabian_group')] per le loro carte verso $india$."
 cape_route_to_india_events.17.c: "Rifornirsi e partire. I marinai [ShowCultureNameWithNoTooltip('omani_culture')] non sono amici."
 cape_route_to_india_events.17.d: "Torniamo indietro. La traversata verso $india$ è fuori dalle nostre possibilità."
 cape_route_to_india_events.17.historical_info: "Masqaṭ (Mascate) era uno dei principali porti dell'Imamato ibadita dell'Oman, una delle maggiori potenze marittime dell'Oceano Indiano occidentale. I marinai omaniti erano tra i navigatori più abili del mondo, profondamente familiari con i monsoni che governavano i tempi di traversata tra l'Arabia e il subcontinente indiano. L'arrivo dei portoghesi minacciò il ruolo omanita di intermediario nel commercio delle spezie, e i rapporti tra Portogallo e Oman rimasero ostili per gran parte del XVI secolo, culminando in ripetute guerre per il controllo del Golfo Persico e dei porti dell'Africa orientale. L'Oman finì per espellere i portoghesi da gran parte della loro rete in Africa orientale nel XVII secolo."

 # ── Event 18: Notification — Feitoria at foreign location ───────────────────
 cape_route_to_india_events.18.title: "I Portoghesi Hanno Costruito una [ShowBuildingTypeNameWithNoTooltip('por_feitoria')]"
 cape_route_to_india_events.18.desc: "Le loro navi sono arrivate senza preavviso, hanno gettato l'ancora nella rada esterna e puntato i cannoni sul porto. La richiesta era cortese nella forma e assoluta nella sostanza. Volevano costruire una stazione commerciale. Avrebbero pagato un piccolo affitto. Avrebbero rispettato le leggi locali. Ciò che non dissero, e non c'era bisogno di dirlo, era cosa sarebbe accaduto se avessimo rifiutato. Il legname era già tagliato e caricato nelle loro stive. La stazione fu eretta nel giro di pochi giorni. Ora batte la croce [por_feitoria_builder.GetAdjective], dove prima sventolava il nostro stendardo."
 cape_route_to_india_events.18.a: "Non abbiamo scelta; il loro cannone pesa più delle nostre proteste."
 cape_route_to_india_events.18.b: "Inviamo una protesta ed esigiamo rispetto per la nostra sovranità."
 cape_route_to_india_events.18.historical_info: "Il sistema delle feitorias fu uno dei primi esempi di imperialismo commerciale europeo in Asia e in Africa. Stabilendo stazioni commerciali fortificate in porti esistenti, il Portogallo riuscì a inserirsi nelle reti commerciali esistenti senza il costo di una conquista territoriale completa. I governanti che acconsentivano ottenevano accesso alle merci portoghesi e protezione navale contro i rivali; chi rifiutava subiva il bombardamento. Il sistema trasformò l'Oceano Indiano da uno spazio commerciale relativamente aperto in uno strutturato attorno al dominio navale portoghese e al monopolio commerciale della Casa da Índia."

