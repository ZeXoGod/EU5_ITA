l_english:
 arctic_passage_events.1.title: "Nel Buio del Nord"
 arctic_passage_events.1.desc: "La logica è semplice: le rotte marittime del sud sono ormai ben note e battute. Un passaggio a nord, a est o a ovest, apparterrebbe a chi lo trovasse per primo. La flotta è stata equipaggiata per un viaggio in acque che nessuna carta descrive con affidabilità. I piloti hanno studiato tutto ciò che è stato scritto sul nord, trovando ben poco di utile.\n\nCiò che si sa: in estate il mare non gela del tutto. Ciò che non si sa: quanto sia navigabile, e per quanto tempo."
 arctic_passage_events.1.a: "Prepariamo la flotta al peggio che il nord possa offrire: ogni botte piena, ogni cima sostituita."
 arctic_passage_events.1.b: "Un equipaggio robusto è preparazione sufficiente. Salpiamo con la marea."
 arctic_passage_events.1.historical_info: "La ricerca di una rotta marittima settentrionale verso l'Asia occupò i navigatori inglesi, olandesi e scandinavi per tutto il XVI secolo. Il Passaggio a Nord-Ovest fu percorso con successo soltanto con la spedizione di Roald Amundsen del 1903-06; il Passaggio a Nord-Est fu completato per la prima volta da Adolf Nordenskiöld nel 1878-79. Entrambe le rotte si rivelarono commercialmente poco pratiche rispetto alle alternative meridionali, ma i viaggi produssero alcune delle più dettagliate mappature antiche dell'Artico e aprirono il commercio di pellicce e balene dell'estremo nord."
 arctic_passage_events.2.title: "La Banchisa"
 arctic_passage_events.2.desc: "La nebbia si solleva e rivela un muro di ghiaccio compatto che si stende da un orizzonte all'altro, gemendo mentre i lastroni si stritolano a vicenda. Il ghiaccio non è solido: tra i lastroni si aprono canali d'acqua libera, ma si spostano e si chiudono senza preavviso. Tre navi della flotta hanno già riportato danni allo scafo a causa di blocchi di ghiaccio alla deriva sotto la linea di galleggiamento.\n\nGli uomini tengono lo sguardo su [target_leader.GetName]. [target_leader.GetSheHe|U] osserva il ghiaccio da due giorni. A rigore, non è invalicabile. Ma è quanto di più vicino all'invalicabile abbiano mai visto."
 arctic_passage_events.2.a: "Apriamoci un varco tra i lastroni: ogni canale è una strada, se ci si muove abbastanza in fretta."
 arctic_passage_events.2.b: "[target_leader.GetNameWithNoTooltip] sa leggere il ghiaccio. [target_leader.GetSheHe|U] troverà un passaggio."
 arctic_passage_events.2.c: "Facciamo ritorno. Nessun passaggio vale la perdita della flotta."
 arctic_passage_events.2.historical_info: "La banchisa, ossia il ghiaccio marino staccatosi dalla sua origine polare e spinto alla deriva verso sud, fu il principale ostacolo fisico a ogni navigazione artica. A differenza delle calotte ancorate alla terraferma, la banchisa si sposta di continuo con il vento e le correnti, aprendo e chiudendo canali senza preavviso. I navigatori del XVI secolo non avevano alcun modo affidabile di prevederne i movimenti; le spedizioni di maggior successo si affidavano a piloti esperti, capaci di leggere le condizioni del ghiaccio dal colore dell'acqua, dai suoni del mare e dal comportamento della fauna."
 arctic_passage_events.3.title: "La Costa Ricoperta di Ghiaccio"
 arctic_passage_events.3.desc: "[ShowAreaName('greenland_area')] emerge dal mare come un muro bianco, non di scogliere di roccia ma di ghiaccio, continuo dal bordo dell'acqua fino all'altopiano lontano e in alto. La costa, che corre verso nord lungo il margine della calotta glaciale, è navigabile solo in estate. Non si scorge alcun insediamento, alcun fumo, alcun segno di presenza umana, a parte le rare rovine di strutture in pietra sepolte a metà dalla neve accumulata.\n\nL'equipaggio non ha mai visto una costa simile. È inutile per l'agricoltura, per il legname, per quasi tutto tranne che come punto di riferimento. Ma è un punto di riferimento, e siamo sulla rotta giusta."
 arctic_passage_events.3.a: "Prendiamoci il tempo di rilevare la costa: nessuno ha mai mappato questo litorale a dovere."
 arctic_passage_events.3.b: "Segniamo la rotta e proseguiamo a nord. Qui non c'è nulla per cui valga la pena fermarsi."
 arctic_passage_events.3.historical_info: "La Groenlandia era nota ai coloni norreni dal X secolo e rimase nominalmente sotto la sovranità dano-norvegese nel XV e XVI secolo. Tuttavia, dei suoi due principali insediamenti, quello Occidentale era già crollato entro la metà del XIV secolo e i contatti con quello Orientale andarono perduti meno di cento anni dopo. Pescatori inglesi e portoghesi riferirono occasionalmente di aver avvistato la costa mentre inseguivano il merluzzo nell'Atlantico nordoccidentale, ma l'esplorazione europea sistematica della costa groenlandese non iniziò fino alle spedizioni di Frobisher degli anni 1570."
 arctic_passage_events.4.title: "Il Labirinto Gelato"
 arctic_passage_events.4.desc: "Il mare davanti a noi è ostruito dal ghiaccio, non dalla banchisa che si sposta e si apre, ma da ghiaccio vecchio di molti anni, frantumato e ricongelato in un labirinto di creste di pressione e lastroni così vasti da richiedere ore per essere attraversati. I canali tra di essi sono stretti e si chiudono in vicoli ciechi senza preavviso. Tre tentativi in altrettanti giorni non hanno trovato alcun passaggio.\n\nÈ qui che la rotta del nord finisce, se finisce da qualche parte. Dalla testa d'albero i piloti scorgono acqua libera a ovest, che luccica oltre la distesa di ghiaccio. Se dista un'ora o una settimana, nessuno può dirlo."
 arctic_passage_events.4.a: "Apriamoci comunque un varco. L'acqua libera è visibile: la raggiungeremo."
 arctic_passage_events.4.b: "[target_leader.GetNameWithNoTooltip] vede i canali da quassù. [target_leader.GetSheHe|U] conosce la via."
 arctic_passage_events.4.c: "Nessuna nave costruita da mano umana può attraversare tutto questo. Torniamo a casa."
 arctic_passage_events.4.historical_info: "L'ostacolo centrale del Passaggio a Nord-Ovest è l'arcipelago di isole a nord della terraferma canadese, dove il ghiaccio marino convergente dal bacino artico crea in molti canali una banchisa pluriennale permanente. La maggior parte delle spedizioni del XVI secolo (Frobisher, Davis, Hudson) tornò indietro da qualche parte in questa regione. La prima navigazione riuscita del passaggio richiese un'imbarcazione progettata appositamente per le condizioni glaciali e occupò tre inverni."
 arctic_passage_events.5.title: "Un Mare a Ovest"
 arctic_passage_events.5.desc: "Il ghiaccio si spezza e la flotta entra in acque libere: un grande mare interno, calmo e freddo, circondato da coste basse di abeti e roccia che si estendono in ogni direzione. Non è il Pacifico. I piloti lo sanno. Ma è acqua libera a ovest del ghiaccio, e nessuna flotta europea è mai stata qui prima, per quanto ne sappiamo.\n\nLa forma esatta di ciò che hanno trovato è incerta. Stabilire se questa grande baia sia un passaggio verso l'Asia o uno specchio d'acqua chiuso e senza uscita richiederà altra navigazione. Per ora, hanno fatto ciò che nessuno diceva fosse possibile."
 arctic_passage_events.5.a: "Rileviamo ciò che vediamo, poi proseguiamo. Dobbiamo sapere fin dove si estende questo mare."
 arctic_passage_events.5.b: "Il mare è stato trovato. È prova sufficiente: ritorniamo ora."
 arctic_passage_events.5.historical_info: "La Baia di Hudson fu raggiunta da Henry Hudson nel 1610-11 durante la sua ricerca del Passaggio a Nord-Ovest. Hudson trascorse l'inverno bloccato dai ghiacci nella Baia di James e in primavera fu abbandonato alla deriva dal suo equipaggio ammutinato; i sopravvissuti tornarono in Inghilterra con le carte della baia ma senza alcun passaggio oltre di essa. In seguito si scoprì che la baia non aveva sbocco a ovest, ma il viaggio stabilì le pretese inglesi sulla regione e aprì il territorio che sarebbe poi diventato l'impero commerciale della Compagnia della Baia di Hudson."
 arctic_passage_events.8.title: "Il Fondo della Baia"
 arctic_passage_events.8.desc: "Il mare si è fatto più stretto per tre giorni e ora è chiaro che non esiste alcuno sbocco a ovest. La grande baia è chiusa: non un passaggio verso l'Asia, ma un mare interno di dimensioni straordinarie, sconosciuto a ogni carta europea in nostro possesso fino a questo viaggio. I piloti ne hanno mappato la riva orientale, la riva occidentale e ora l'estensione meridionale.\n\nNon è ciò che qualcuno cercava. Ma non c'è vergogna in ciò che è stato trovato. Un mare di queste dimensioni, così addentro al continente, apre possibilità che nessuno ha ancora iniziato a calcolare. L'equipaggio sa di aver compiuto qualcosa. Il ricordo di questa baia sopravvivrà a ogni uomo a bordo."
 arctic_passage_events.8.a: "Rileviamo ogni riva prima di tornare. Che questa baia porti il nostro nome."
 arctic_passage_events.8.b: "Iniziamo il ritorno. Siamo andati più lontano di chiunque altro."
 arctic_passage_events.8.historical_info: "La Baia di James, l'estensione meridionale della Baia di Hudson, fu il luogo in cui l'equipaggio di Henry Hudson si ammutinò e lo abbandonò alla deriva nel 1611 dopo un inverno brutale. I sopravvissuti tornarono in Inghilterra con carte sufficienti a stabilire la forma della baia, anche se furono necessarie ulteriori spedizioni per confermare l'assenza di un passaggio a ovest. La Compagnia della Baia di Hudson, fondata nel 1670, avrebbe usato la baia come porta d'accesso al vasto territorio del commercio di pellicce della Terra di Rupert, una delle più grandi concessioni di terre della storia."
