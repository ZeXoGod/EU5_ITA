 pacific_crossing_events.1.title: "Una Rotta di Ritorno"
 pacific_crossing_events.1.desc: "L'incarico non è semplicemente raggiungere l'[ShowContinentName('asia')]: delle navi l'hanno già fatto, portate verso occidente dagli alisei come una foglia su un ruscello. L'incarico è tornare. Una colonia sull'altra sponda di questo oceano non vale nulla se una flotta può raggiungerla ma mai ritornare; l'intera impresa dipende dal trovare un passaggio di ritorno affidabile, che una nave possa percorrere anno dopo anno con l'[ShowGoodsName('silver')] in partenza e la [ShowGoodsName('silk')] al ritorno.\n\nIl vento d'andata è noto e costante. Cosa si trovi oltre, e se il mare concederà mai alla flotta una via di ritorno, nessuna carta in questo porto può dirlo. I piloti sono certi di una sola cosa: la strada dell'andata non sarà quella del ritorno."
 pacific_crossing_events.1.a: "Allestiamo una flotta più grande, con una nave in più per la ricerca che ci attende."
 pacific_crossing_events.1.a.tt: "Una nave aggiuntiva viene armata e aggiunta alla flotta (#G +1#! Navi)"
 pacific_crossing_events.1.b: "Approvvigioniamoci per il passaggio; per il resto, ci affidiamo alla fortuna."
 pacific_crossing_events.1.c: "[target_leader.GetNameWithNoTooltip] cartograferà ogni vento e ogni corrente che attraverseremo."
 pacific_crossing_events.1.historical_info: "Il ritorno verso est, il #italic tornaviaje#!, fu il grande problema irrisolto dei primi tempi del Pacifico. Álvaro de Saavedra, partito dalla Nuova Spagna, fu respinto due volte dagli alisei nel 1528 e nel 1529 e morì nel tentativo; anche la spedizione di Ruy López de Villalobos del 1542 raggiunse l'Asia ma non trovò alcuna via di ritorno. Solo nel 1565 fu scoperta una rotta di ritorno affidabile, e fino ad allora una flotta poteva raggiungere l'Asia ma mai riportarne il carico."

 pacific_crossing_events.2.title: "Le Isole dei Ladroni"
 pacific_crossing_events.2.desc: "Settimane di nient'altro che acqua e cielo finiscono quando la vedetta grida terra: una bassa isola verde cinta di bianca risacca. Prima che la flotta possa gettare l'ancora, canoe corrono incontro ad essa: sottili piroghe a bilanciere sotto vele triangolari, che sfrecciano da un'onda all'altra così veloci che i piloti restano in piedi a fissarle. Gli isolani si arrampicano sui fianchi, ridendo e senza paura, e portano via tutto ciò che non è legato. Per loro non c'è furto nel prendere ciò che giace senza padrone; per uomini affamati da un mese in mare è una provocazione.\n\nMa qui ci sono acqua fresca, frutta e pesce, maturi per essere presi, in un modo o nell'altro."
 pacific_crossing_events.2.a: "Scambiamo perline, [ShowGoodsNameWithNoTooltip('cloth')] e [ShowGoodsNameWithNoTooltip('iron')] con acqua e frutta."
 pacific_crossing_events.2.b: "Prendiamo con la forza ciò che serve alle navi. Non c'è tempo da perdere."
 pacific_crossing_events.2.fight_win_tt: "Gli isolani si disperdono davanti alle armi delle navi, e l'equipaggio fa il pieno di acqua e frutta a piacimento"
 pacific_crossing_events.2.fight_lose_tt: "Gli isolani combattono con più forza del previsto, e l'equipaggio viene ricacciato alle barche a mani vuote"
 pacific_crossing_events.2.c: "Lasciamo stare l'acqua: osserviamo i loro scafi e le loro vele veloci."
 pacific_crossing_events.2.historical_info: "Il 6 marzo 1521, dopo oltre tre mesi senza toccare terra, i sopravvissuti della flotta di Ferdinando Magellano raggiunsero Guam. I Chamorro uscirono in veloci proas a bilanciere, che il cronista Antonio Pigafetta ammirò come più rapide di qualunque cosa gli spagnoli avessero mai navigato. Dopo che gli isolani presero una delle barche delle navi, Magellano chiamò l'arcipelago #italic Islas de los Ladrones#! (le Isole dei Ladroni) e sbarcò in forze per fare provviste prima di proseguire verso le Filippine."

 pacific_crossing_events.3.title: "Quaranta Giorni di Nulla"
 pacific_crossing_events.3.desc: "Nessuna terra, nessun uccello, nemmeno un filo d'alga che galleggi sull'acqua. L'equipaggio è in mare da settimane e la sicurezza del pilota si assottiglia con ognuna di esse. Gli uomini hanno le gengive sanguinanti e i denti che ballano; uno giura che una vecchia ferita, guarita da anni, si sia riaperta. Le botti d'acqua sono quasi vuote e le gallette sono più punteruoli che pane. Il vento è benevolo, costante e fresco, ma li porta sempre più in profondità in un oceano che non dà segno di finire.\n\nIl capitano mantiene il volto calmo e la voce ferma, conta i giorni sulla carta e non dice nulla che non creda."
 pacific_crossing_events.3.a: "Riduciamo le razioni. Sopportiamo ciò che dobbiamo."
 pacific_crossing_events.3.b: "La rotta è giusta. La terra è davanti a noi: manteniamo la rotta."
 pacific_crossing_events.3.c: "Disciplina per gli uomini: la parola del capitano è legge!"
 pacific_crossing_events.4.title: "Terra Oltre il Mare Occidentale"
 pacific_crossing_events.4.desc: "Molto dopo aver lasciato le Isole dei Ladroni, la vedetta scorge verdi colline nella foschia del mattino. Man mano che la flotta entra nella grande baia, diventa chiaro che questa non è una riva deserta. Un insediamento di mura imbiancate e tetti di foglie di palma sale lungo la collina sopra l'acqua. Canoe a bilanciere salpano verso le navi, con equipaggi di uomini in stoffe colorate che non mostrano alcun allarme.\n\nIl più grande di loro, con dell'oro alla gola, parla [location.GetDominantCulture.GetLanguage.GetName], una lingua che nessuno dei piloti conosce, e indica la riva con la disinvoltura di chi commercia spesso con gli stranieri. Queste isole hanno un mondo tutto loro, e attraverso di esse già scorrono la [ShowGoodsName('silk')] e la [ShowGoodsName('porcelain')] del lontano Catai."
 pacific_crossing_events.4.desc.owned: "Molto dopo aver lasciato le Isole dei Ladroni, la vedetta scorge verdi colline nella foschia del mattino, e poi, inconfondibili sopra l'insediamento che sale lungo il pendio, i nostri stessi colori che sventolano. La flotta non si è imbattuta in una riva sconosciuta ma è entrata in un porto nostro: [pacific_colony.GetName], possedimento della nostra Corona, con i moli e i magazzini già al lavoro.\n\nBarche salpano incontro alle navi con connazionali a bordo, stupiti di vedere una flotta uscire dall'oceano vuoto a oriente. Qui gli equipaggi possono fare acqua e rifornirsi in sicurezza, e caricare la [ShowGoodsName('silk')] e la [ShowGoodsName('porcelain')] che i mercanti cinesi portano ai nostri moli."
 pacific_crossing_events.4.desc.hostile: "Molto dopo aver lasciato le Isole dei Ladroni, la vedetta scorge verdi colline nella foschia del mattino, e poi una bandiera che non è la nostra sventolare sopra una palizzata sulla riva. Un'altra potenza ha raggiunto queste isole per prima. Mentre la flotta entra nella baia, [pacific_rival_shore.GetName] mostra cannoni tirati fuori lungo le mura, e barche armate si dirigono verso le navi per esigere di conoscere i loro affari.\n\nQuesto è ormai il territorio di [pacific_rival.GetName], e l'accoglienza sarà guardinga nel migliore dei casi. La seta e la porcellana del Catai fluiscono ancora attraverso l'arcipelago, ma per le mani di un rivale, e non liberamente verso le nostre."
 pacific_crossing_events.4.a: "Apriamo gli scambi per la [ShowGoodsNameFlat('silk')] e la [ShowGoodsNameFlat('porcelain')] in transito."
 pacific_crossing_events.4.b: "Saccheggiamo l'insediamento: prendiamo acqua e provviste con la forza."
 pacific_crossing_events.4.b.raid_win_tt: "Gli abitanti fuggono nell'entroterra, e gli equipaggi spogliano l'insediamento di cibo e acqua"
 pacific_crossing_events.4.b.raid_lose_tt: "Gli abitanti combattono per le loro case e ricacciano gli assalitori alle barche, a mani vuote e sanguinanti"
 pacific_crossing_events.4.d: "Carichiamo le merci della stagione dai nostri magazzini."
 pacific_crossing_events.4.e: "Facciamo riposare e riparare gli equipaggi nel nostro porto."
 pacific_crossing_events.4.f: "Trattiamo con cautela con gli agenti del rivale, sotto i loro cannoni."
 pacific_crossing_events.4.g: "Forziamo l'ancoraggio e prendiamo ciò che ci serve con le armi."
 pacific_crossing_events.4.h: "Teniamoci ben lontani dai loro cannoni e manteniamo la rotta."
 pacific_crossing_events.4.raid_win_tt: "L'avamposto viene preso d'assalto e le sue scorte portate via; gli equipaggi trionfano"
 pacific_crossing_events.4.raid_lose_tt: "L'assalto viene respinto con perdite, e una nave danneggiata deve essere abbandonata"
 pacific_crossing_events.4.historical_info: "Ruy López de Villalobos, che attraversò dalla Nuova Spagna nel 1542, chiamò l'arcipelago #italic Las Islas Filipinas#! in onore dell'erede al trono spagnolo, il futuro Filippo II. Una presenza spagnola duratura iniziò solo nel 1565, quando Miguel López de Legazpi fondò il primo insediamento a Cebu; nel 1571 prese Manila al rajah Sulayman e ne fece la capitale delle Indie Orientali spagnole e il capolinea occidentale del commercio dei galeoni."

 pacific_crossing_events.5.title: "L'Isola dei Chiodi di Garofano"
 pacific_crossing_events.5.desc: "L'odore raggiunge la flotta prima dell'isola: una dolcezza nel vento, densa, acuta e speziata. Un singolo picco vulcanico con una scia di nuvole, verde fino al bordo dell'acqua. Il porto è affollato di proas malesi e giavanesi, e il [target_owner.Custom('GetRulerOrRegentTitle')] di [target_owner.GetName] ha un palazzo ben visibile dall'ancoraggio.\n\nOgni mercante di [ShowLocationName('lisbon')] e [ShowLocationName('sevilla')] paga una fortuna per questo profumo, senza mai sapere dove sia la sua fonte. Nessuno in questa flotta è mai stato così vicino alla fonte: gli alberi carichi di [ShowGoodsName('cloves')] ancora acerbi sui pendii sopra la baia, dove un solo carico di nave vale più dell'intero viaggio. Le stive possono essere riempite qui. Resta solo da portarle a casa."
 pacific_crossing_events.5.desc_known: "L'odore raggiunge la flotta prima dell'isola: una dolcezza nel vento, densa, acuta e speziata. Un singolo picco vulcanico con una scia di nuvole, verde fino al bordo dell'acqua. Il porto è affollato di proas malesi e giavanesi, e il [target_owner.Custom('GetRulerOrRegentTitle')] di [target_owner.GetName] ha un palazzo ben visibile dall'ancoraggio.\n\nOgni mercante di [ShowLocationName('lisbon')] e [ShowLocationName('sevilla')] conosce questo profumo di seconda mano, e lo paga una fortuna. Nessuno in questa flotta è mai stato così vicino alla fonte: gli alberi carichi di [ShowGoodsName('cloves')] ancora acerbi sui pendii sopra la baia, dove un solo carico di nave vale più dell'intero viaggio. Le stive possono essere riempite qui. Resta solo da portarle a casa."
 pacific_crossing_events.5.desc.driven_back: "Le Isole delle Spezie si levano ancora una volta sopra la prua: lo stesso picco verde, lo stesso ancoraggio affollato, e con esse l'amara consapevolezza che la flotta è stata ricacciata fino al punto di partenza, con la via di casa ancora da trovare. Gli alisei non hanno lasciato alle navi altra scelta che correre indietro verso queste coste.\n\nC'è ormai una cupa routine nell'ancoraggio. Le isole daranno di nuovo acqua e cibo; i malati possono essere sbarcati, gli equipaggi riposati, le stive rabboccate con tutto ciò che le navi possono ancora portare. Ma ogni uomo a bordo sa quale resa dei conti attende: la flotta deve ricomporsi e tornare in mare aperto per tentare di nuovo il passaggio verso casa, e non le resteranno molti altri tentativi."
 pacific_crossing_events.5.a: "Riempiamo la stiva di [ShowGoodsNameWithNoTooltip('cloves')]: carichiamo fino all'ultimo barile."
 pacific_crossing_events.5.b: "Approvvigioniamo le navi per il lungo viaggio di ritorno."
 pacific_crossing_events.5.c: "Lasciamo che gli equipaggi riposino e si rimettano a terra."
 pacific_crossing_events.5.d: "Abbandoniamo la ricerca: torniamo a casa per la via lunga, doppiando il Capo."
 pacific_crossing_events.5.historical_info: "I navigatori portoghesi raggiunsero le Molucche nel 1512, dove Francisco Serrão divenne consigliere del sultano di Ternate. Le navi superstiti di Magellano caricarono chiodi di garofano presso il sultanato rivale di Tidore nel 1521. La contesa ispano-portoghese per le isole fu risolta dal Trattato di Saragozza nel 1529, in cui l'imperatore Carlo V, a corto di denaro, vendette al Portogallo la pretesa spagnola sulle Molucche per 350.000 ducati."

 pacific_crossing_events.6.title: "La Via di Casa"
 pacific_crossing_events.6.desc: "Le stive sono piene, e la metà facile del viaggio è alle nostre spalle. Ora la flotta deve fare l'unica cosa che nessuna carta a bordo può insegnarle: ritrovare la strada attraverso l'oceano che ha appena attraversato. Il vento che ha portato le navi così dolcemente verso occidente è schierato di fronte al loro ritorno, e ogni pilota al tavolo sa cosa significhi.\n\nGli ufficiali della flotta siedono fino a tardi sulle carte, e per una volta i piloti non concordano. Ciascuno ha una rotta da sostenere e una ragione per temere le altre, e oltre il limite del mare noto nessuno può promettere dove conduca niente di tutto ciò: c'è solo congettura, e il coraggio di scommetterci. La decisione spetta al solo capitano, e ogni anima a bordo vivrà o morirà secondo la rotta che sceglierà."
 pacific_crossing_events.6.desc.driven_back: "Gli ufficiali della flotta si riuniscono di nuovo, e l'atmosfera al tavolo si è inacidita. Una rotta è stata scelta, e l'oceano l'ha respinta; la flotta ha lottato fin qui senza altro frutto che la lezione. Le rotte rimaste sono ancora soltanto argomenti, non meglio provati di prima, e ora ci sono meno navi e equipaggi più sottili da esporre ad esse.\n\nI piloti hanno smesso di alzare la voce. Ogni uomo chino sulla carta sa che questo mare non può essere affrontato ancora e ancora senza costo. Una rotta deve essere tracciata fuori da queste acque ancora una volta, e non ci saranno molte altre occasioni di scegliere."
 pacific_crossing_events.6.a: "La rotta settentrionale: costeggiamo l'Asia, poi cavalchiamo verso est."
 pacific_crossing_events.6.a.tt: "Dirigersi a nord lungo la costa di [ShowRegionName('japan_region')] e oltre, poi lasciare che i venti occidentali delle alte latitudini portino la flotta fino in [ShowContinentName('america')] e a casa"
 pacific_crossing_events.6.b: "Il passaggio centrale: battiamo verso est contro gli alisei."
 pacific_crossing_events.6.b.tt: "Spingersi dritti a est nelle fauci degli alisei, passando per le vecchie isole. Il vento ha respinto ogni flotta che l'ha tentato: aspettarsi di essere ricacciati fino alle Isole delle Spezie"
 pacific_crossing_events.6.c: "La rotta del lontano sud: un vasto arco, lungo ma libero."
 pacific_crossing_events.6.c.tt: "Puntare molto a sud e a est attraverso l'oceano meridionale disseminato di isole. Un passaggio potrebbe benissimo trovarsi da quella parte, ma è immensamente lungo, e le provviste della flotta potrebbero non bastare fino alla fine"
 pacific_crossing_events.6.historical_info: "Ogni tentativo di navigare verso est dall'Asia lungo i tropici era fallito. La #italic Trinidad#! di Gonzalo Gómez de Espinosa, nel tentativo di tornare alla Nuova Spagna nel 1522, fu respinta e catturata dai portoghesi; Álvaro de Saavedra fallì due volte, nel 1528 e nel 1529. Nel 1565 il frate agostiniano Andrés de Urdaneta ebbe successo navigando molto a nord, fino a circa quaranta gradi di latitudine, per intercettare la corrente del Kuroshio e i venti occidentali, e poi cavalcandoli attraverso il Pacifico settentrionale fino alla California e giù fino ad Acapulco. La sua rotta servì i galeoni di Manila per i due secoli e mezzo successivi."

 pacific_crossing_events.7.title: "Mar Pacífico"
 pacific_crossing_events.7.desc: "Il vento muore. Le vele pendono flosce, il mare giace piatto e vitreo a ogni orizzonte e le navi restano immobili sotto un cielo bianco e infuocato. È per una bonaccia come questa che l'oceano fu chiamato 'il mare pacifico', una dolcezza che ha già affamato degli equipaggi.\n\nL'acqua nelle botti diventa calda e imputridita. Ogni giorno senza vento è una razione spesa senza distanza guadagnata, e gli uomini lo sanno. Guardano il sartiame vuoto e l'orizzonte, e già due volte hanno gridato terra a un banco di nubi che si è dissolto nel nulla. Le mani oziose a bordo di una nave in bonaccia raramente restano oziose a lungo."
 pacific_crossing_events.7.a: "Aspettiamo, e conserviamo ogni goccia e ogni briciola. Il vento ritorna."
 pacific_crossing_events.7.b: "Fuori le barche: rimorchiamo le navi finché il vento non ritorna."
 pacific_crossing_events.7.c: "L'onda lunga corre a sud-est: lasciamoci portare verso il vento."
 pacific_crossing_events.8.title: "Il Galeone Ritorna"
 pacific_crossing_events.8.desc: "Il galeone noleggiato è tornato a casa. I mesi in mare sul lungo arco settentrionale lo hanno lasciato basso sull'acqua mentre entra in rada, pesante di carico: le ricchezze dell'[ShowContinentName('asia')] portate per l'intera ampiezza dell'oceano e sbarcate sane e salve. I moli si riempiono di agenti e acquirenti prima ancora che abbia gettato l'ancora. La rotta regge e l'impresa rende; ci sarà un altro galeone l'anno prossimo, e quello dopo ancora."
 pacific_crossing_events.8.a: "Una fortuna, sbarcata sana e salva."
 pacific_crossing_events.8.historical_info: "Il galeone di Manila percorse la tratta Acapulco–Manila quasi ogni anno dal 1565 al 1815, una delle linee di navigazione più longeve della storia. Trasportava argento americano verso ovest e seta, porcellana e spezie cinesi verso est; il carico di un solo galeone poteva fare la fortuna dei suoi investitori. Il commercio legò l'argento delle Americhe ai mercati della Cina e trasformò il Pacifico in un'autostrada del commercio globale."

 pacific_crossing_events.9.title: "Una Riva Nota"
 pacific_crossing_events.9.desc: "La lunga salita verso nord in acque fredde e grigie, poi l'infinito arco verso est attraverso l'oceano vuoto, finisce quando la vedetta la vede finalmente: una costa alta e boscosa, promontori che si susseguono verso sud sotto un banco di nebbia. Questa non è parte dell'[ShowContinentName('asia')], né un'isola: è la sponda occidentale dell'[ShowContinentName('america')] stessa. La flotta è uscita dal [ShowContinentName('pacific_ocean_continent')] sul lato vicino del mondo, e non ha che da scendere a sud lungo una costa che le sue carte già conoscono per raggiungere un porto amico.\n\nLa via di casa è stata trovata. Resta solo da percorrerne l'ultimo tratto."
 pacific_crossing_events.9.a: "Corriamo a sud verso casa lungo una costa che conosciamo."
 pacific_crossing_events.9.b: "Facciamo prima scalo per acqua e riposo: gli uomini se lo sono guadagnato."
 pacific_crossing_events.9.historical_info: "Il viaggio di ritorno di Andrés de Urdaneta del 1565 approdò sulla costa americana in California, vicino a Capo Mendocino, dopo circa quattro mesi nel Pacifico settentrionale aperto. Da lì la #italic San Pedro#! corse a sud fino ad Acapulco, dove giunse l'8 ottobre 1565, dimostrando la validità della rotta. L'arco settentrionale divenne il passaggio di ritorno abituale dei galeoni di Manila."

 pacific_crossing_events.10.title: "Il Mare si Solleva"
 pacific_crossing_events.10.desc: "Il cielo assume il colore di un livido e il vento arriva come un muro. In un'ora la flotta lotta per la vita: onde che si impennano più alte del pennone maestro, acqua verde che irrompe sul ponte, tela che si squarcia con schianti come colpi d'arma da fuoco. Le navi faticano e rollano, e nella foschia perdono di vista l'una l'altra, una dopo l'altra. I piloti non possono far altro che tenersi saldi e contare le ore.\n\nC'è una scelta, e non c'è tempo di soppesarla: ridurre la vela e cavalcare la tempesta dove le navi si trovano, oppure correre davanti ad essa nel buio e confidare che gli scafi reggano."
 pacific_crossing_events.10.a: "Mettiamoci alla cappa e affrontiamola ad alberi nudi."
 pacific_crossing_events.10.b: "Corriamo davanti al vento e preghiamo che il fasciame regga."
 pacific_crossing_events.10.weathered_tt: "La flotta ne esce malconcia ma integra"
 pacific_crossing_events.10.foundered_tt: "Una nave viene inghiottita e perduta con tutti a bordo"
 pacific_crossing_events.11.title: "Legno Verde"
 pacific_crossing_events.11.desc: "Le navi furono impostate in fretta nei nuovi cantieri della costa pacifica americana, con legname che non ebbe mai il tempo di stagionare, da carpentieri che non avevano mai costruito per un oceano come questo. Ora il mare riscuote il debito. Un tavolato si stacca dalla giuntura a mezzanave; la calafatura si allenta; sottocoperta gli uomini stanno nell'acqua che sale e le pompe sferragliano giorno e notte senza guadagnare terreno. Il volto del carpentiere racconta da solo la sua storia.\n\nQuesto non può continuare, e la terra asciutta più vicina è a mezzo oceano di distanza."
 pacific_crossing_events.11.a: "Carenamo la parte peggiore ed eseguiamo riparazioni adeguate."
 pacific_crossing_events.11.b: "Armiamo le pompe a turni e proseguiamo comunque."
 pacific_crossing_events.11.c: "Abbandoniamo lo scafo cedente; stipiamo il suo equipaggio sulle altre navi."

 pacific_crossing_events.12.title: "Un Dono dal Mare"
 pacific_crossing_events.12.desc: "Comincia con i delfini: un grande branco, che spinge qualcosa verso le navi. Poi il mare stesso sembra prendere fuoco: un enorme banco di pesci scagliato in superficie, acri di argento che lampeggiano e ribollono attorno agli scafi, stretti dai delfini in cerchio finché l'acqua si vede a stento per la calca.\n\nL'equipaggio non ha bisogno di ordini. Le barche vengono calate in mare, seguono lenze e reti, e gli uomini si sporgono dai parapetti issando pesce a bracciate sui ponti, presto colmi e scivolosi di pescato. Dopo settimane di gallette e carne salata, è un banchetto, una manna e una grazia tutte insieme."
 pacific_crossing_events.12.a: "Caliamo ogni barca e ogni lenza: prendiamo tutto ciò che possiamo recuperare."
 pacific_crossing_events.12.b: "Facciamo una pesca rapida, poi di nuovo al vento."

 pacific_crossing_events.13.title: "Scorte Marce"
 pacific_crossing_events.13.desc: "Il dispensiere si presenta al capitano con il cappello in mano. Giù nella stiva, interi ordini di barili sono stati aperti e si sono rivelati rovinati: carne salata mal conservata, gallette imballate umide, acqua guasta in botti mai stagionate a dovere. Le provviste caricate in fretta e sigillate umide nei porti di partenza sono marcite nel caldo tropicale, e ciò che avrebbe dovuto nutrire l'equipaggio per settimane è una perdita fetida e piena di vermi.\n\nQui non c'è mercato, né seconda possibilità: solo scorte guaste e uomini affamati."
 pacific_crossing_events.13.a: "Gettiamo le scorte guaste in mare e accettiamo la perdita."
 pacific_crossing_events.13.b: "Razioniamole comunque: gli uomini mangiano ciò che c'è."

 pacific_crossing_events.17.title: "Perduti in Mare"
 pacific_crossing_events.17.desc: "I resoconti, quando infine arrivano, sono frammenti: un nome, una data, un'ultima rotta nota. La flotta che salpò per trovare la via di casa non l'ha mai trovata. Se le navi siano state inghiottite da una tempesta, spinte su qualche scogliera senza nome, o semplicemente alla deriva finché l'acqua è finita, e con essa gli uomini, nessuno potrà mai dirlo con certezza. L'oceano li ha trattenuti.\n\nLa via di casa resta ignota. Da qualche parte laggiù, il vento soffia ancora nella direzione sbagliata."
 pacific_crossing_events.17.a: "Non saranno gli ultimi che perderemo a causa di quell'oceano."
 pacific_crossing_events.17.end_tt: "La spedizione è perduta, e il suo viaggio finisce qui"
 pacific_crossing_events.17.historical_info: "L'oceano verso est reclamò molti di coloro che lo tentarono. Il comandante della spedizione García Jofre de Loaísa e il circumnavigatore Juan Sebastián Elcano morirono entrambi in mare durante la traversata del Pacifico del 1526; Álvaro de Saavedra morì in mezzo all'oceano nel 1529 tentando il ritorno; e Ferdinando Magellano fu ucciso a Mactan nel 1521. Dei circa 270 uomini che lasciarono la Spagna con Magellano, solo diciotto tornarono a bordo della #italic Victoria#!."

 pacific_crossing_events.18.title: "L'Equipaggio si Volta"
 pacific_crossing_events.18.desc: "Gli uomini ne hanno abbastanza. Razioni ridotte, un oceano senza fine e una rotta di cui solo i piloti possono rispondere: ha consumato l'equipaggio oltre l'obbedienza. Un gruppo di marinai si raduna a poppa, cupo e armato, ed espone la richiesta in modo chiaro: far voltare la flotta, o lo faranno da sé. Gli ufficiali sono pochi contro molti, e i moschetti non sono tutti da una parte sola.\n\nQualunque cosa si decida ora, costerà alla flotta qualcosa che non potrà sostituire facilmente."
 pacific_crossing_events.18.desc.last_ship: "Gli uomini ne hanno abbastanza. Una nave è tutto ciò che resta della flotta, e sul suo ponte affollato e maleodorante non c'è dove nascondersi per un ufficiale. I caporioni vengono a poppa in gruppo, e questa volta non chiedono: dicono al capitano la verità della loro situazione con terribile semplicità: non c'è un'altra nave su cui fuggire, nessun fante di marina da chiamare e moltissimo oceano oltre la fiancata. Voltate per casa ora, dicono, o sarete gettati in pasto ad esso.\n\nI piloti sono ammutoliti. Il capitano è solo al parapetto con il mare alle spalle, e deve rispondere."
 pacific_crossing_events.18.a: "Cediamo: i caporioni prendano una nave e tornino indietro."
 pacific_crossing_events.18.b: "Reprimiamola con la forza. Impicchiamo i caporioni e proseguiamo."
 pacific_crossing_events.18.c: "Ricordiamo loro cosa li attende a casa, e chi li guida fin là."
 pacific_crossing_events.18.fight_win_tt: "L'ammutinamento è stroncato e l'ordine ripristinato (#G +5#! Morale dell'Equipaggio)"
 pacific_crossing_events.18.fight_lose_tt: "Lo scontro si fa sanguinoso, e una nave va perduta nel caos"
 pacific_crossing_events.18.overboard_tt: "Gli ammutinati sopraffanno gli ufficiali e gettano in mare [target_leader.GetName]. Il viaggio finisce qui"

 pacific_crossing_events.19.title: "Ancora le Isole dei Ladroni"
 pacific_crossing_events.19.desc: "Battendo verso est contro il vento, la flotta non guadagna terreno che possa tenere, e infine le basse isole verdi di [ShowLocationName('guahan')] si levano di nuovo sopra la prua: le stesse rive che aveva lasciato dopo la traversata. Le proas sfrecciano fuori come prima, guardinghe e curiose, i loro equipaggi che osservano gli stranieri tornati dall'oceano vuoto senza nulla da mostrare. Qualunque cosa sia accaduta qui la prima volta, gli isolani la ricordano."
 pacific_crossing_events.19.desc.friendly: "Battendo verso est contro il vento, la flotta non guadagna terreno che possa tenere, e infine le basse isole verdi di [ShowLocationName('guahan')] si levano di nuovo sopra la prua. Questa volta le proas escono senza timore: gli isolani ricordano il trattamento leale, e tra loro ci sono volti che gli equipaggi riconoscono a metà. Si mostrano merci di scambio, si scambiano gesti, e la promessa di acqua e cibo fresco è evidente.\n\nLa flotta ha un disperato bisogno di entrambi. La vecchia benevolenza, a quanto pare, vale più quaggiù di qualunque carta."
 pacific_crossing_events.19.desc.hostile: "Battendo verso est contro il vento, la flotta non guadagna terreno che possa tenere, e infine le basse isole verdi di [ShowLocationName('guahan')] si levano di nuovo sopra la prua. Ma le proas che ora salpano arrivano in gran numero, e non c'è risata in esse: gli isolani non hanno dimenticato il saccheggio, e hanno aspettato. Le lance si ergono a schiera lungo la riva, e l'ancoraggio che prima dava acqua liberamente non la darà facilmente ora.\n\nLa flotta ha comunque bisogno di acqua e cibo, e gli uomini sanno che dovranno prenderli attraverso un popolo preparato."
 pacific_crossing_events.19.a: "Commerciamo di nuovo con chi ci ricorda con affetto."
 pacific_crossing_events.19.b: "Prendiamo ciò che ci serve con la forza prima che si radunino in massa."
 pacific_crossing_events.19.b.win_tt: "Lo sbarco si impadronisce di cibo e acqua prima che gli isolani possano radunarsi"
 pacific_crossing_events.19.b.lose_tt: "Questa volta gli isolani sono pronti; gli assalitori vengono respinti con perdite"
 pacific_crossing_events.19.c: "Facciamo l'acqua che possiamo senza combattere, e proseguiamo."
 pacific_crossing_events.19.historical_info: "Le Marianne divennero una tappa regolare di rifornimento d'acqua per le navi che attraversavano il Pacifico, e i rapporti con i Chamorro oscillarono tra commercio guardingo e aperta violenza lungo i secoli della rotta dei galeoni. Una flotta che aveva trattato bene gli isolani poteva sperare in provviste; una che non l'aveva fatto trovava spesso le stesse rive chiuse a sé, o doveva combattere per ogni botte d'acqua."

 pacific_crossing_events.20.title: "Una Riva Feroce"
 pacific_crossing_events.20.desc: "Un'altra isola si leva dall'infinito mare meridionale: ripida, verde e cinta di scogliere. Questa è abitata: il fumo sale dagli alberi, e canoe già si staccano dalla spiaggia, affollate di figure che si dipingono il corpo e portano lance, e che sollevano un muro di suoni attraverso l'acqua che è o un benvenuto o un avvertimento. Nessuno a bordo sa dire quale.\n\nI piloti non hanno mai cartografato questo luogo e non sanno nominare il popolo che lo detiene. Ma le botti d'acqua sono quasi vuote e gli uomini hanno fame, e un'isola abitata significa cibo, se lo si può ottenere. Che questa riva nutra la flotta o si rivolti contro di essa dipenderà da come verrà giocata l'ora successiva."
 pacific_crossing_events.20.a: "Teniamoci ben lontani dall'isola: nessuna lotta quaggiù."
 pacific_crossing_events.20.b: "Avviciniamoci e commerciamo: mostriamo [ShowGoodsNameWithNoTooltip('iron')] e [ShowGoodsNameWithNoTooltip('cloth')], e speriamo."
 pacific_crossing_events.20.trade_ok_tt: "Gli isolani abbassano le lance e barattano liberamente; le barche tornano cariche di cibo e acqua"
 pacific_crossing_events.20.trade_ambush_tt: "Il parlamento è una trappola: le canoe assalgono le barche, e la flotta si apre la strada a caro prezzo"
 pacific_crossing_events.20.c: "Sbarchiamo in forze e prendiamo con le armi ciò che l'isola possiede."
 pacific_crossing_events.20.raid_win_tt: "Lo sbarco ricaccia gli isolani tra gli alberi e porta via le loro scorte"
 pacific_crossing_events.20.raid_lose_tt: "Gli isolani combattono ferocemente per le loro case, e gli assalitori vengono fatti a pezzi e ricacciati alle barche"

 pacific_crossing_events.21.title: "Respinti"
 pacific_crossing_events.21.desc: "Settimana dopo settimana la flotta si arrampica verso est, e settimana dopo settimana il mare riporta indietro tutto ciò che abbiamo guadagnato. L'aliseo non cala mai e non cambia mai; sta dritto sulle prue come un muro, e la corrente sottostante corre nella stessa direzione, portando le navi a ovest più in fretta di notte di quanto avanzino a est di giorno. I piloti prendono le loro rilevazioni, le confrontano e tacciono: la linea sulla carta ha smesso di avanzare e ha cominciato a scivolare indietro.\n\nNon c'è modo di discutere: un tapis roulant, non un passaggio, e ogni giorno speso su di esso costa acqua e vite per nulla. L'unica rotta rimasta è quella amara: virare, correre davanti al vento che li ha sconfitti e riportare la flotta alle Isole delle Spezie per riflettere di nuovo."
 pacific_crossing_events.21.a: "Non c'è modo di forzare questo mare."

 pacific_crossing_events.22.title: "La Petizione dell'Equipaggio"
 pacific_crossing_events.22.desc: "Ogni giorno le provviste calano più in fretta di quanto avanziamo di miglia. L'acqua è scarsa e guasta, le gallette si sono ridotte in polvere e l'elenco dei malati si allunga ogni mattina. Una delegazione dei marinai più anziani viene a poppa, non in ammutinamento, non ancora, ma con la piatta convinzione di uomini che sanno contare i barili. Hanno fatto l'aritmetica del viaggio, e il conto non torna a loro favore. Tornate indietro, dicono, finché c'è ancora abbastanza nella stiva per raggiungere una riva nota. Insistete, e seppelliranno la flotta in questo oceano.\n\nC'è logica in ciò che dicono, per quanto sgradita da sentire."
 pacific_crossing_events.22.a: "Ascoltiamoli e facciamo tornare la flotta alle Isole delle Spezie."
 pacific_crossing_events.22.b: "Rifiutiamo. Siamo andati troppo lontano per tornare indietro ora."

 pacific_crossing_events.23.title: "Sangue sul Ponte"
 pacific_crossing_events.23.desc: "La discussione iniziata il giorno in cui la petizione è stata respinta non si è mai davvero placata, e oggi degenera in colpi. Un nostromo fedele al viaggio scambia insulti con un gruppo di uomini che ancora covano il rifiuto di tornare indietro; gli insulti diventano spintoni, e gli spintoni una rissa che si propaga in fretta sul ponte, con più di una lama già sguainata.\n\n[target_leader.GetName] arriva sulla scena e trova la guardia già alle mani per una lite che non riguardava davvero il nostromo."
 pacific_crossing_events.23.a: "Interveniamo e separiamo i contendenti."
 pacific_crossing_events.23.b: "Gettiamo il caporione in mare e non se ne parli più."
 pacific_crossing_events.23.c: "Ascoltiamoli e facciamo tornare la flotta alle Isole delle Spezie."
 pacific_crossing_events.23.break_up_win_tt: "La rissa viene sedata prima che si versi vero sangue"
 pacific_crossing_events.23.break_up_lose_tt: "La rissa si fa sanguinosa prima che l'ordine venga ripristinato"
 pacific_crossing_events.23.overboard_tt: "Il caporione viene afferrato e scagliato in mare senza cerimonie. L'equipaggio osserva in gelido silenzio"

 pacific_crossing_events.24.title: "Incendio in Mare"
 pacific_crossing_events.24.desc: "Un grido si leva da poppa: un'altra nave della flotta è in fiamme. Ciò che era iniziato come un'altra rissa sulla rotta di ritorno ha rovesciato una lanterna nella confusione, e le fiamme salgono già lungo il sartiame più in fretta di quanto si possano riempire i secchi. Le scintille portate dal vento vanno verso il resto della flotta.\n\n[target_leader.GetName] deve decidere in fretta se avvicinarsi e aiutare a combattere l'incendio, o tenersi a distanza e lasciare che la nave in fiamme si salvi da sé."
 pacific_crossing_events.24.a: "Portiamo la nostra nave a fianco per aiutare a spegnere il fuoco."
 pacific_crossing_events.24.b: "Manteniamo le distanze e lasciamo che se la vedano da soli."
 pacific_crossing_events.24.saved_tt: "Le braccia in più respingono le fiamme prima che si propaghino"
 pacific_crossing_events.24.caught_fire_tt: "Le scintille saltano lo spazio, e la tua stessa nave prende fuoco a sua volta"
 pacific_crossing_events.24.distance_tt: "L'altra nave brucia fino alla linea di galleggiamento mentre la flotta osserva da una distanza di sicurezza"

 pacific_crossing_events.25.title: "Ammutinamento a Bordo"
 pacific_crossing_events.25.desc: "Una segnalazione da una delle altre navi porta a [target_leader.GetName] la notizia: l'equipaggio di quella si è sollevato contro gli ufficiali, la stessa disputa sul tornare indietro è degenerata in aperto ammutinamento. Gli uomini fedeli sono asserragliati sottocoperta mentre gli ammutinati discutono su cosa fare dopo. C'è poco tempo per decidere se intervenire.\n\nUna barca calata ora potrebbe ancora far pendere l'equilibrio a bordo dell'altra nave, o semplicemente consegnare agli ammutinati una seconda preda."
 pacific_crossing_events.25.a: "Abbordiamo la nave e sosteniamo l'equipaggio fedele."
 pacific_crossing_events.25.b: "Manteniamo le distanze e lasciamo che risolvano da soli."
 pacific_crossing_events.25.c: "Ascoltiamoli e facciamo tornare la flotta alle Isole delle Spezie."
 pacific_crossing_events.25.loyal_win_tt: "I fedeli prevalgono, e l'ordine viene ripristinato a bordo"
 pacific_crossing_events.25.loyal_lose_tt: "Gli ammutinati sopraffanno il gruppo d'abbordaggio e si impadroniscono della nave"
 pacific_crossing_events.25.distance_tt: "Gli ammutinati si allontanano con la nave prima che si possa fare qualcosa"

 pacific_crossing_events.26.title: "Ancora una Petizione"
 pacific_crossing_events.26.desc: "La delegazione è tornata, più sommessa stavolta ma non meno determinata. Non minacciano, né alzano la voce; espongono semplicemente la stessa aritmetica di prima, un po' più cupa per i giorni trascorsi da quando fu respinta. Alcune piccole concessioni potrebbero comprare un po' di pace sottocoperta, se [target_leader.GetName] è disposto a farle.\n\nOppure la risposta può essere la stessa dell'ultima volta, e la petizione può essere rimandata sottocoperta senza nulla in mano."
 pacific_crossing_events.26.a: "Ascoltiamoli fino in fondo e concediamo qualche piccola concessione."
 pacific_crossing_events.26.b: "Congediamoli di nuovo e proseguiamo."

 pacific_crossing_events.27.title: "Sabotaggio nella Notte"
 pacific_crossing_events.27.desc: "Qualcuno ha manomesso le scorte nella notte: una botte d'acqua sfondata, un cavo del sartiame tagliato a metà. Piccole cose, ma fatte con chiara intenzione. Chiunque voglia far tornare indietro questo viaggio ha deciso che le parole non bastano più. [target_leader.GetName] può ordinare una ricerca accurata del colpevole, o semplicemente raddoppiare le guardie e proseguire senza di esso.\n\nIn ogni caso, il messaggio è stato ricevuto."
 pacific_crossing_events.27.a: "Indaghiamo e troviamo il responsabile."
 pacific_crossing_events.27.b: "Raddoppiamo le guardie e proseguiamo senza risposte."
 pacific_crossing_events.27.culprit_found_tt: "Il colpevole viene trovato e usato come esempio davanti all'intero equipaggio"
 pacific_crossing_events.27.culprit_free_tt: "La ricerca non porta a nulla, e il sabotatore colpisce di nuovo prima che venga sospesa"
 pacific_crossing_events.27.no_investigation_tt: "Le guardie vengono raddoppiate, ma il danno alle scorte è già fatto"
 pacific_crossing_events.5.desc.no_owner: "L'odore raggiunge la flotta prima dell'isola: una dolcezza nel vento, pesante, pungente e speziata. Un solo picco vulcanico che trascina una nuvola, verde fino al bordo dell'acqua. Il porto è affollato di proas malesi e giavanesi, sebbene nessuno stendardo né palazzo indichi chi rivendichi questa riva.\n\nOgni mercante di [ShowLocationName('lisbon')] e di [ShowLocationName('sevilla')] paga una fortuna per questo aroma, senza mai sapere dove si trovi la sua fonte. Nessuno in questa flotta si è mai trovato così vicino alla fonte, con gli alberi carichi di [ShowGoodsName('cloves')] acerbi sui pendii sopra la baia, dove un solo carico vale più dell'intero viaggio. Le stive possono essere riempite qui. Resta solo da portarle a casa."
