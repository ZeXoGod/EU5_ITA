 grand_tour_events.1.title: "Il Grand Tour"
 grand_tour_events.1.desc: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] è riunita, i bauli sono pronti e la scorta si forma sulla strada verso sud. L'[ShowRegionName('italy_region')] attende: la terra delle antiche rovine, del sapere del [ShowInstitutionName('renaissance')] e di corti le cui arti politiche fanno apparire giovane il nord. Qualunque cosa il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] vi apprenda plasmerà questo regno per una generazione. L'unica questione è che tipo di educazione intendiamo impartire."
 grand_tour_events.1.a: "Le sue corti insegneranno ciò che i libri non possono."
 grand_tour_events.1.party: "Spendiamo denaro per un'ultima notte di baldoria prima della strada."

 grand_tour_events.2.desc.geography_intro: "[target_location.GetName]: [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] esiste in deliberata sfida alla geografia, sorge sul fango, galleggia sul commercio, e a governare è un consiglio di famiglie mercantili che ha visto passare ogni dinastia d'[ShowContinentName('europe')]."
 grand_tour_events.2.desc.ducal_palace: "Mentre l'opulento palazzo ducale brilla di rosa sopra la laguna in una mostra di raffinatezza e lusso a disposizione di tutti."
 grand_tour_events.2.desc.heir_arrival: "Il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] ha raggiunto quella che è forse [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip] dal carattere più cosmopolita d'[ShowContinentNameWithNoTooltip('europe')], dove nei mercati si parla ogni lingua del Mediterraneo e ogni genere di informazione può essere acquistato al giusto prezzo."
 grand_tour_events.2.title: "[target_location.GetNameWithNoTooltip], la Serenissima"
 grand_tour_events.2.desc: "$grand_tour_events.2.desc.geography_intro$ L'[ShowBuildingTypeName('venetian_arsenal')] che si estende nel quartiere orientale può impostare la chiglia di una nave da guerra e metterla in acqua completa nel giro di un solo giorno di lavoro. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.desc.no_arsenal: "$grand_tour_events.2.desc.geography_intro$ Cantieri ordinari costeggiano il quartiere orientale, sfornando scafi mercantili e galee da guerra al ritmo pacato comune a ogni porto d'[ShowContinentNameWithNoTooltip('europe')]. $grand_tour_events.2.desc.ducal_palace$\n\n$grand_tour_events.2.desc.heir_arrival$"
 grand_tour_events.2.knowledge: "Studiamo ingegneria navale nell'[ShowBuildingTypeNameWithNoTooltip('venetian_arsenal')]."
 grand_tour_events.2.experience: "Visitiamo i cantieri dove vengono costruite le galee da guerra di [target_location.GetNameWithNoTooltip]."
 grand_tour_events.2.connections: "Partecipiamo al ricevimento offerto da [court_host.GetNameWithNoTooltip]."
 grand_tour_events.2.party: "Scambiamo i registri con una notte tra i festaioli dei canali."
 grand_tour_events.2.historical_info: "Durante la Settimana dell'Ascensione del 1645, il gentiluomo inglese John Evelyn, allora impegnato nel proprio lungo viaggio in Francia e in Italia, assistette a una rappresentazione dell'opera #italic Ercole in Lidia#! in uno dei teatri pubblici di Venezia. Il suo diario si meraviglia per scenari che cambiavano tredici volte e distingue il soprano Anna Renzi, anche se ritenne che un cantante castrato la superasse, e dichiarò un basso genovese 'incomparabile'. Tra le prospettive dipinte e le macchine volanti, lo spettacolo 'ci tenne avvinti con gli occhi e con le orecchie fino alle due del mattino'. Lasciò Venezia la primavera seguente, con i bauli carichi di libri, stampe e vasetti della celebre teriaca della città."

 grand_tour_events.3.title: "[target_location.GetNameWithNoTooltip], [target_location.GetRank.GetNameWithNoTooltip] del [ShowInstitutionNameWithNoTooltip('renaissance')]"
 grand_tour_events.3.desc: "[target_location.GetName] è più piccola della fama che la precede, e più strana. [target_location.Custom('IT_ART_LOCATION')|U][target_location.GetRank.GetName] ronza di nuove idee: filosofi che la chiamano una rinascita dell'antichità, mercanti che la chiamano un buon affare, pittori che la chiamano il modo in cui la luce cade sull'intonaco. Il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] scopre che la corte riceverà visitatori stranieri questa sera, se la stanchezza del viaggio lo consente.\n\nC'è anche, a parte, un invito alla biblioteca del monastero dove attende in silenzio la più notevole collezione di manoscritti [ShowCultureName('greek_culture')] della cristianità occidentale."
 grand_tour_events.3.knowledge: "Cerchiamo una presentazione agli studiosi del monastero."
 grand_tour_events.3.experience: "Visitiamo le botteghe di [ShowGoodsNameWithNoTooltip('wool')] e gli orafi di Ponte Vecchio."
 grand_tour_events.3.connections: "Impariamo l'arte del mecenatismo alla corte di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.3.party: "Mettiamo da parte i manoscritti per il gioco ai tavoli di [target_location.GetNameWithNoTooltip]."
 grand_tour_events.3.historical_info: "Nell'autunno del 1764, il malaticcio romanziere scozzese Tobias Smollett visitò gli Uffizi e, davanti alla Venere de' Medici che ogni altro Grand Tourist lodava per fede, scrisse: 'Non posso fare a meno di pensare che non ci sia bellezza nei lineamenti di Venere e che l'atteggiamento sia goffo e fuori carattere.' Laurence Sterne immortalò poi lo sfogo, facendo scontrare il suo Yorick con 'Smelfungus' davanti al Pantheon a Roma, lamentando che 'si era scagliato contro la dea e l'aveva trattata peggio di una comune sgualdrina, senza la minima provocazione in natura'. La loro disputa su una Venere di marmo sopravvisse a entrambi."

 grand_tour_events.4.title: "[target_location.GetNameWithNoTooltip], la Città Eterna"
 grand_tour_events.4.desc: "[target_location.GetName] esiste in due tempi insieme. Il Foro giace aperto sotto l'erba invernale, con le colonne che stanno ad angoli strani in mezzo ai pascoli di bestiame, il marmo estratto da ogni appaltatore che ne ha avuto bisogno negli ultimi mille anni. Sopra tutto, la chiesa destinata a essere la sede di tutta la cristianità svetta sul centro di ciò che oggi è [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName].\n\n[target_leader.GetName] può trascorrere il proprio tempo tra le rovine o tra i vivi. La corte papale è antica, cerimoniosa e collegata a ogni trono [ShowReligionAdjective('catholic')] d'[ShowContinentName('europe')]."
 grand_tour_events.4.knowledge: "Consultiamo i manoscritti e gli umanisti della Biblioteca Vaticana."
 grand_tour_events.4.experience: "Percorriamo le antiche rovine e misuriamo i monumenti."
 grand_tour_events.4.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.4.party: "Lasciamo le rovine per una notte nelle osterie di [target_location.GetNameWithNoTooltip]."
 grand_tour_events.4.historical_info: "Il 15 ottobre 1764, il gentiluomo inglese Edward Gibbon, allora impegnato a completare il proprio Grand Tour d'Italia, sedeva meditando tra le rovine del Campidoglio mentre frati scalzi cantavano i vespri in quello che credette l'antico Tempio di Giove. Scrisse in seguito nelle sue memorie che fu lì, tra le colonne spezzate e il canto serale che svaniva, che 'l'idea di scrivere la decadenza e la caduta della città gli si presentò per la prima volta alla mente'. L'idea portata via da quella singola sera romana crebbe, nei successivi vent'anni di studio in Inghilterra, fino a diventare #italic Storia del declino e caduta dell'Impero romano#!."

 grand_tour_events.5.title: "[target_location.GetNameWithNoTooltip], [target_country.GetLongNameWithNoTooltip]"
 grand_tour_events.5.desc: "[target_location.GetName] è il punto più meridionale del viaggio e la più antica tra le grandi corti [ShowCultureGroupName('italian_group')], [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] conta un milione di anime sparse all'ombra del Vesuvio, con la sua storia stratificata [ShowCultureName('greek_culture')] su [ShowCultureName('roman_culture')], [ShowCultureName('norman')] e padroni ancora più recenti, ogni conquista visibile nell'architettura per chi sa dove guardare. La [target_country.GetGovernment.GetCourtTitle] [target_country.GetGovernment.GetAdjective] riceve i visitatori con una cerimonia che fa sembrare provvisorie, al confronto, le corti dell'[ShowContinentName('europe')] settentrionale.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] ha visto [ShowLocationName('venice')], [ShowLocationName('florence')] e [ShowLocationName('rome')]. Questa è la lezione finale."
 grand_tour_events.5.knowledge: "Trascorriamo le ultime settimane tra biblioteche e rovine."
 grand_tour_events.5.experience: "Uniamoci agli scavatori che riportano alla luce Ercolano sepolta."
 grand_tour_events.5.connections: "Trascorriamo le ultime settimane alla corte di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.5.party: "Scambiamo le lezioni con un'ultima notte nelle taverne di [target_location.GetNameWithNoTooltip]."
 grand_tour_events.5.historical_info: "Nel gennaio del 1786, Hester Piozzi scalò il Vesuvio legata con una corda alla sua guida Bartolomeo, 'il Ciclope del Vesuvio', e si fermò a riposare alla cella dell'eremita a metà salita. L'eremita, un francese, la riconobbe all'improvviso: 'Non vi ho mai vista prima, signora? Sì, certo che sì, e vi ho anche vestita, quando facevo il parrucchiere a Londra.' Spinta a proseguire per la vergogna quando seppe che un bambino di quattro anni del suo gruppo aveva già raggiunto il bordo del cratere, la Piozzi proseguì per vedere di persona il camino fumante, e registrò l'intero incontro nelle sue lettere di viaggio pubblicate."

 grand_tour_events.6.title: "[target_location.GetNameWithNoTooltip], Città dell'Antica Arena"
 grand_tour_events.6.desc: "[target_location.GetName] si leva dove il fiume piega: [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] sorge all'ombra lunga di un anfiteatro più antico di qualunque corte dell'[ShowRegionName('italy_region')]. L'arena romana sta ancora in piedi quasi intera, con i gradoni di pietra che salgono sopra i tetti, sede di mercati e fiere e, in rari giorni di festa, di qualcosa di simile ai giochi per cui fu costruita.\n\nCi sono qui sale di lezione oltre alle rovine, e una corte desiderosa di ricevere un [ROOT.GetCountry.GetGovernment.GetHeirTitle] in visita."
 grand_tour_events.6.knowledge: "Studiamo le rovine romane e l'antica ingegneria dell'arena."
 grand_tour_events.6.experience: "Visitiamo le cave di [ShowGoodsNameWithNoTooltip('marble')] e i traffici fluviali lungo l'Adige."
 grand_tour_events.6.connections: "Facciamo visita a [court_host.GetNameWithNoTooltip] e alle casate principali che dominano [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.6.party: "Saltiamo l'anfiteatro per una notte nelle taverne sottostanti."
 grand_tour_events.6.historical_info: "Giunta a Verona nell'aprile del 1785, Hester Piozzi sentì il proprio cuore 'dilatarsi sensibilmente' nel trovare l'anfiteatro romano così ben conservato, e in seguito definì la città 'la più allegra d'aspetto in cui abbia mai vissuto'. Una guida che le mostrava le antichità dell'Accademia Filarmonica le assicurò che i marmi di Arundel inglesi erano stati rovinati da tempo dal fumo del carbone, finché ella riconobbe la frase, parola per parola, dalla guida #italic Verona illustrata#! che egli aveva memorizzato. Registrò l'inganno come 'malafede, e un pregiudizio molto ridicolo' nel resoconto pubblicato del viaggio."

 grand_tour_events.7.title: "[target_location.GetNameWithNoTooltip], la Città Ideale"
 grand_tour_events.7.desc: "[target_location.GetName] non sembra un caso, perché non lo è. Ampi viali rettilinei attraversano [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] secondo uno schema che nessuna città medievale ha mai formato per caso, disposti deliberatamente per essere guardati tanto quanto abitati. Il teatro ducale, le tipografie e i poeti che si trattengono a corte servono tutti la stessa ambizione: far sembrare [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip], nonostante le dimensioni modeste, il futuro dell'urbanistica.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova una corte interessata ai versi quanto all'arte di governo."
 grand_tour_events.7.knowledge: "Leggiamo i romanzi cavallereschi custoditi nella biblioteca ducale."
 grand_tour_events.7.experience: "Visitiamo l'armeria ducale e le chiuse dei canali che attraversano [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.7.connections: "Assistiamo a una rappresentazione alla corte di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.7.party: "Mettiamo da parte i versi ducali per una serata più animata."
 grand_tour_events.7.historical_info: "Nell'aprile del 1817, lord Byron, allora in viaggio per l'Italia, visitò l'Ospedale di Sant'Anna a Ferrara e gli fu mostrata la cella angusta dove si diceva che il poeta Torquato Tasso fosse stato rinchiuso per follia dal duca Alfonso II d'Este negli anni 1580. Byron trovò la reliquia più commovente del monumento di Ariosto lì vicino, e il giorno seguente compose 'Il lamento del Tasso', un monologo drammatico che dà voce alla disperazione del poeta. La visita divenne uno dei più celebri pellegrinaggi del Grand Tour dell'epoca romantica, fissando nell'immaginazione dei viaggiatori la caduta della corte estense di Ferrara."

 grand_tour_events.8.title: "[target_location.GetNameWithNoTooltip], la Città Dotta"
 grand_tour_events.8.desc: "[target_location.GetName] insegna diritto e argomentazione da più tempo di qualunque altro luogo della cristianità, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] porta apertamente la propria erudizione: portici bordati di studenti di ogni nazione, sale di lezione più antiche della maggior parte delle chiese che le circondano. Un [ROOT.GetCountry.GetGovernment.GetHeirTitle] in visita potrebbe trascorrervi una vita e non esaurire comunque ciò che i dottori di legge hanno scritto.\n\nC'è anche una corte da vedere, se la politica ci interessa più della giurisprudenza."
 grand_tour_events.8.knowledge: "Seguiamo una lezione di diritto civile all'università."
 grand_tour_events.8.experience: "Visitiamo le filande di seta che hanno reso famoso il filo di [target_location.GetNameWithNoTooltip]."
 grand_tour_events.8.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.8.party: "Saltiamo la sala di lezione per del vino tra gli studenti."
 grand_tour_events.8.historical_info: "Nel 1739, Charles de Brosses, magistrato francese in viaggio per l'Italia, trascorse una serata a Bologna in casa di Laura Bassi, già la prima donna in Europa a ricoprire una cattedra universitaria, dove gli studiosi locali si riunivano per discutere la nuova scienza dell'elettricità. De Brosses ricordò in seguito di aver dovuto rispolverare il proprio arrugginito latino scolastico per dibattere di magnetismo e 'della singolare attrazione dei corpi elettrizzati' davanti alla compagnia riunita. Registrò la serata nelle sue #italic Lettres familières écrites d'Italie#!, e il salotto della Bassi divenne una delle tappe più visitate dai Grand Tourist di passaggio in città."

 grand_tour_events.9.title: "[target_location.GetNameWithNoTooltip], Città del Palio"
 grand_tour_events.9.desc: "[target_location.GetName] si leva su tre colline attorno a una piazza a forma di conchiglia, con il suo Duomo a strisce visibile da ogni via che sale verso di esso. [target_location.Custom('IT_ART_LOCATION')|U][target_location.GetRank.GetName] costruì la propria ricchezza sulla [ShowGoodsName('wool')] e sulle attività bancarie prima che [ShowLocationName('florence')] la mettesse in ombra, e non ha mai del tutto perdonato quell'eclissi, una rivalità che ancora colora ogni conversazione a corte.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] arriva in tempo per vedere la corsa di cavalli che riempie la piazza due volte l'anno, stendardi compresi."
 grand_tour_events.9.knowledge: "Seguiamo una lezione di diritto canonico all'università."
 grand_tour_events.9.experience: "Studiamo gli affreschi e i celebri registri bancari che hanno arricchito [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.9.connections: "Guardiamo la corsa dalla loggia di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.9.party: "Scambiamo gli affreschi con i tavoli da gioco del Campo."
 grand_tour_events.9.historical_info: "Nell'autunno del 1764, il romanziere Tobias Smollett interruppe il viaggio da Firenze a Roma con una notte a Siena, e brontolò nei suoi #italic Travels through France and Italy#! pubblicati di essere stato 'alloggiato malamente in una casa che puzzava come una latrina' e di aver 'cenato miseramente'. Concesse che la città era 'grande e ben costruita', e notò che i senesi 'si vantano della propria cortesia e della purezza del loro dialetto', al punto che i visitatori stranieri vi alloggiavano unicamente per imparare la corretta pronuncia italiana. Il resoconto di Smollett divenne una delle più note lamentele inglesi sull'ospitalità del Grand Tour in Toscana."

 grand_tour_events.10.title: "[target_location.GetNameWithNoTooltip], Città della Torre Pendente"
 grand_tour_events.10.desc: "[target_location.GetName] costruì un campanile che non riusciva a stare dritto e, anziché demolirlo, continuò semplicemente a costruire; [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] tratta l'inclinazione come motivo di orgoglio anziché di imbarazzo. Un tempo potenza marittima rivale di [ShowLocationName('genoa')] e [ShowLocationName('venice')], le sue galee non ci sono più, ma restano l'università e la piazza della cattedrale.\n\nUn [ROOT.GetCountry.GetGovernment.GetHeirTitle] in visita può studiare qui con la stessa facilità con cui può percorrere il porto che un tempo contava."
 grand_tour_events.10.knowledge: "Seguiamo le lezioni all'università sulla piazza della cattedrale."
 grand_tour_events.10.experience: "Visitiamo il vecchio arsenale e i conciatori lungo l'Arno."
 grand_tour_events.10.connections: "Presentiamoci a [court_host.GetNameWithNoTooltip]."
 grand_tour_events.10.party: "Lasciamo la lezione per una notte tra le taverne del porto."
 grand_tour_events.10.historical_info: "Alla fine del 1821, Percy e Mary Shelley si stabilirono a Pisa e convinsero lord Byron a unirsi a loro, sistemandolo a Palazzo Lanfranchi sul Lungarno; insieme a Edward e Jane Williams, e più tardi a Edward Trelawny, formarono il gruppo noto in seguito come 'Circolo Pisano'. Byron arrivò con un seguito di cavalli, cani e scimmie, e il gruppo trascorse l'inverno a elaborare progetti per una rivista letteraria, #italic The Liberal#!. Leigh Hunt raggiunse infine l'Italia l'estate seguente, sbarcando pochi giorni prima che Shelley annegasse al largo della costa toscana a luglio; il cenacolo che Shelley aveva costruito a Pisa si disperse nel giro di pochi mesi, lasciando la città una delle più celebri tappe del Romanticismo."

 grand_tour_events.11.title: "[target_location.GetNameWithNoTooltip], Città di San Francesco"
 grand_tour_events.11.desc: "[target_location.GetName] sale su un verde pendio attorno alla basilica costruita per custodire le ossa dell'uomo nato qui, un frate che non possedeva nulla e grazie al quale [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] è oggi una delle grandi mete di pellegrinaggio dell'occidente. Le pareti affrescate all'interno attirano pittori e pellegrini in egual numero.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] può trascorrere la visita tra gli affreschi o tra i frati che ancora custodiscono la regola dell'ordine."
 grand_tour_events.11.knowledge: "Studiamo gli affreschi e la vita del santo."
 grand_tour_events.11.experience: "Visitiamo le botteghe che producono reliquie e medaglie devozionali."
 grand_tour_events.11.connections: "Incontriamo [court_host.GetNameWithNoTooltip] e i funzionari della città."
 grand_tour_events.11.party: "Mettiamo da parte la compagnia dei frati per una serata più animata in città."
 grand_tour_events.11.historical_info: "La sera del 26 ottobre 1786, Johann Wolfgang von Goethe giunse ad Assisi e, per sua stessa ammissione nel #italic Viaggio in Italia#!, si distolse dalla 'vasta massa di chiese ammucchiate come a Babele l'una sull'altra' che custodivano i resti di san Francesco, liquidando il luogo di pellegrinaggio con aperta avversione. Salì invece al Tempio romano di Minerva sulla piazza della città vecchia, definendolo 'il primo monumento completo dell'antichità che avessi mai visto'. Lo sgarbo di Goethe al più celebre santuario di Assisi a favore di un tempio pagano divenne uno dei giudizi personali più sorprendenti sopravvissuti dall'epoca del Grand Tour."

 grand_tour_events.12.title: "[target_location.GetNameWithNoTooltip], la Città Etrusca"
 grand_tour_events.12.desc: "[target_location.GetName] siede in alto sulla sua collina dietro mura che gli Etruschi eressero molto prima che Roma contasse qualcosa, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] ne attraversa ancora le porte ogni giorno senza pensarci. I suoi pittori si sono fatti da poco un nome in tutta l'[ShowRegionName('italy_region')], e la sua università tiene piene le sale di lezione.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] può studiare le vecchie mura o i nuovi dipinti, secondo l'inclinazione."
 grand_tour_events.12.knowledge: "Studiamo all'università e percorriamo le antiche mura etrusche."
 grand_tour_events.12.experience: "Visitiamo le botteghe dei vasai famose per la maiolica."
 grand_tour_events.12.connections: "Cerchiamo una presentazione alla corte di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.12.party: "Saltiamo le vecchie mura per una notte tra le taverne degli studenti."
 grand_tour_events.12.historical_info: "All'inizio del 1765, il romanziere Tobias Smollett viaggiava da Roma verso Firenze quando la sua carrozza iniziò la ripida salita verso Perugia e i suoi cavalli esausti cominciarono a scivolare all'indietro sotto il peso della carrozza, trascinandola verso il bordo di un precipizio. Un passante incuneò un grosso sasso dietro una ruota appena in tempo per fermare lo scivolamento, salvando l'intero gruppo dall'essere, con le parole di Smollett, 'ridotto in pezzi'. Non essendoci cavalli di ricambio disponibili quel giorno, Smollett e la sua famiglia furono costretti a trascorrere la notte in città, visitando le sue chiese e i dipinti del suo figlio nativo, Pietro Perugino, prima di riprendere la strada per Firenze."

 grand_tour_events.13.title: "[target_location.GetNameWithNoTooltip], la Città sul Danubio"
 grand_tour_events.13.desc: "[target_location.GetName] custodisce l'attraversamento del fiume dove si incontrano le strade dall'[ShowRegionName('italy_region')], dai [ShowRegionName('balkan_region')] e dalle terre [ShowLanguageName('german_language')], e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] si è arricchita con i pedaggi. L'Hofburg ducale domina il suo centro, sede di una corte che si considera qualcosa di più che semplicemente regionale.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] ha finalmente varcato le Alpi; da qui le strade scorrono più facili."
 grand_tour_events.13.knowledge: "Visitiamo le scuole cattedrali e gli studiosi della città."
 grand_tour_events.13.experience: "Visitiamo l'arsenale e i moli dei barcaioli lungo il Danubio."
 grand_tour_events.13.connections: "Presentiamoci all'Hofburg a [court_host.GetNameWithNoTooltip]."
 grand_tour_events.13.party: "Scambiamo le scuole cattedrali con una notte lungo il Danubio."
 grand_tour_events.13.historical_info: "Nel 1775, il medico John Moore visitò Vienna come compagno di viaggio del giovane duca di Hamilton, e i due furono ricevuti in udienza privata dall'imperatore Giuseppe II, poi dalla stessa imperatrice Maria Teresa a Schönbrunn. Moore notò che la leggendaria rigidità della corte si sciolse quando il cancelliere di stato, il principe Kaunitz, si accorse del figlio quattordicenne di Moore che viaggiava con il gruppo e insistette perché l'imperatore e l'imperatrice ricevessero anche lui. Moore registrò anche un vecchio aneddoto di corte sull'epidemia di vaiolo che aveva colpito la famiglia asburgica otto anni prima: venuta a sapere di aver contratto la malattia, una delle figlie dell'imperatrice aveva chiesto subito uno specchio e aveva salutato allegramente la bellezza che stava per rovinare."

 grand_tour_events.14.title: "[target_location.GetNameWithNoTooltip], la Città d'Oro"
 grand_tour_events.14.desc: "[target_location.GetName] si estende su entrambe le rive della Moldava, con il suo ponte di pietra che collega la città vecchia alla collina del castello, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] si comporta come la capitale di un impero. L'università sulla collina attira studenti da ogni angolo delle terre [ShowLanguageName('german_language')] e oltre.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova una città che misura la propria importanza in secoli, non in stagioni."
 grand_tour_events.14.knowledge: "Seguiamo le lezioni all'università sulla collina."
 grand_tour_events.14.experience: "Visitiamo le vetrerie e gli orafi del Vicolo d'Oro."
 grand_tour_events.14.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.14.party: "Lasciamo l'università per una notte tra le taverne del fiume."
 grand_tour_events.14.historical_info: "In viaggio in Boemia nel 1775 come compagno del giovane duca di Hamilton, il medico John Moore era in una strada di Praga con il suo pupillo quando un sacerdote di passaggio, legato a uno dei seminari della città, li sentì parlare e dichiarò: 'Vi assicuro che anch'io sono irlandese.' Quando gli fu chiesto come avesse riconosciuto così facilmente la loro nazionalità, il sacerdote rispose che l'aveva capito nel momento in cui li aveva sentiti parlare inglese. Divenne la loro guida per il resto della visita, mostrando loro a un certo punto la finestra della cancelleria da cui due nobili e il loro segretario erano stati gettati nel 1618, un precedente che Moore raccomandò ironicamente agli statisti di ogni dove."

 grand_tour_events.15.title: "[target_location.GetNameWithNoTooltip], la Città dei Monaci"
 grand_tour_events.15.desc: "[target_location.GetName] prende il nome stesso dai monaci il cui insediamento sorgeva qui prima che i duchi costruissero accanto un mercato e una zecca, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] è cresciuta notevolmente da allora. La corte ducale dei Wittelsbach tiene [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip] più ordinata della maggior parte, e i birrai locali la tengono ben rifornita.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] troverà ad attenderlo sia studiosi sia una corte ben governata."
 grand_tour_events.15.knowledge: "Visitiamo le scuole cattedrali e i cronisti della città."
 grand_tour_events.15.experience: "Visitiamo l'armeria ducale e i magazzini del commercio di [ShowGoodsNameWithNoTooltip('salt')]."
 grand_tour_events.15.connections: "Presentiamoci alla corte ducale di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.15.party: "Mettiamo da parte le cronache per una notte tra i birrai."
 grand_tour_events.15.historical_info: "Nel 1786, la scrittrice Hester Lynch Piozzi passò per Monaco con il marito durante il loro lungo viaggio di nozze continentale, giungendo all'alba dopo una notte di traversata delle Alpi da Innsbruck e fermandosi a visitare la pinacoteca e il gabinetto di curiosità dell'Elettore. Tra i pezzi che un collezionista locale le mostrò c'era un'immagine minuziosamente lavorata della Vergine con il Bambino, resa con qualcosa come tela di ragno filata, così sottile che le sue figure non si distinguevano a occhio nudo e diventavano visibili solo al microscopio. La Piozzi registrò l'esposizione con meraviglia, stupita dalla gran pena spesa per un'opera tanto delicata e poco pratica."

 grand_tour_events.16.title: "[target_location.GetNameWithNoTooltip], la Città sulla Senna"
 grand_tour_events.16.desc: "[target_location.GetName] si distende a cavallo del suo fiume attorno a un'isola coronata dalla grande cattedrale, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] è più grande di quasi ogni altro luogo che il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] abbia visto finora in questo viaggio. Il quartiere universitario sulla riva sinistra insegna teologia e diritto a più studenti di quanti abitanti abbiano la maggior parte delle città.\n\nLa corte reale, quando riceve visitatori, lo fa con una formalità che non lascia dubbi sull'opinione che ha di sé."
 grand_tour_events.16.knowledge: "Assistiamo alle dispute all'università sulla riva sinistra."
 grand_tour_events.16.experience: "Visitiamo i rilegatori e le tipografie vicino all'università."
 grand_tour_events.16.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.16.party: "Saltiamo le dispute per le taverne sulla riva sinistra."
 grand_tour_events.16.historical_info: "Durante il suo soggiorno a Parigi nell'ottobre del 1763, il romanziere Tobias Smollett vide una carrozza da nolo fermarsi sulla strada per Choisy e scaricare cinque o sei uomini armati, ciascuno dei quali prese posizione dietro un albero diverso. Aspettandosi briganti o ufficiali all'inseguimento di un criminale, Smollett chiese al servitore chi fossero, per apprendere che erano gentiluomini usciti dalla città per una giornata di caccia alla lepre, che sparavano da un riparo a qualunque selvaggina passasse. Smollett trovò l'intero spettacolo grottesco, osservando con ironia che era almeno un modo efficace di ripulire un campo dalle lepri."

 grand_tour_events.17.title: "[target_location.GetNameWithNoTooltip], Città delle Fiere"
 grand_tour_events.17.desc: "[target_location.GetName] sorge dove si incontrano due fiumi, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] ha trasformato quella confluenza in una fortuna: mercanti dall'[ShowRegionName('italy_region')], dalle terre [ShowCultureGroupName('german_group')] e dalle Fiandre convergono qui per le fiere reali, quando le strade si riempiono di più [ShowGoodsName('silk')] e [ShowGoodsName('dyes')] di quanti i magazzini ne possano contenere. Le presse qui stampano quasi veloci quanto i telai tessono.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] arriva e trova una città che vive di commercio anziché di cerimonie."
 grand_tour_events.17.knowledge: "Cerchiamo i poeti umanisti che si riuniscono alle tipografie."
 grand_tour_events.17.experience: "Visitiamo le tipografie e i libri contabili dei mercanti."
 grand_tour_events.17.connections: "Facciamo visita a [court_host.GetNameWithNoTooltip] e ai principali mercanti che animano [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.17.party: "Mettiamo da parte i registri per una notte tra i festaioli."
 grand_tour_events.17.historical_info: "Nell'ottobre del 1763, il romanziere Tobias Smollett giunse a Lione sulla via verso sud per l'Italia e registrò la visita in lettere poi pubblicate come #italic Travels through France and Italy#!. Indirizzato a una locanda che si rivelò al completo, fu condotto a una taverna che chiedeva dodici livres al giorno per tre stanze squallide e altre trentadue per i pasti; irritato dall'imposizione, se ne andò senza una parola e si recò dritto a un'altra locanda concorrente. Il racconto di Smollett sugli albergatori lionesi che spillavano denaro divenne uno dei passi più citati del suo libro, un classico lamento tra i viaggiatori inglesi sulla strada per l'Italia."

 grand_tour_events.18.title: "[target_location.GetNameWithNoTooltip], la Città dei Crocevia"
 grand_tour_events.18.desc: "[target_location.GetName] prende il nome dalle strade che qui si incrociano, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] svolge ancora lo stesso scopo, a cavallo del fiume che divide le terre di lingua [ShowLanguageName('french_language')] da quelle [ShowLanguageName('german_language')]. La guglia della sua cattedrale sale più in alto di qualunque altra cosa il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] abbia visto in tutto il viaggio, una sola torre dove una seconda gemella non fu mai costruita.\n\nLa città libera si governa da sé, e i suoi stampatori hanno da poco iniziato a contare quanto i suoi mercanti."
 grand_tour_events.18.knowledge: "Seguiamo una lezione al Ginnasio di Johannes Sturm."
 grand_tour_events.18.experience: "Saliamo sulla torre della cattedrale e visitiamo le officine tipografiche."
 grand_tour_events.18.connections: "Incontriamo [court_host.GetNameWithNoTooltip] e il consiglio cittadino."
 grand_tour_events.18.party: "Lasciamo le tipografie per una notte sotto la guglia."
 grand_tour_events.18.historical_info: "All'inizio degli anni 1770, il medico scozzese John Moore, in viaggio per il continente come compagno del duca di Hamilton, salì sul campanile di 466 piedi della cattedrale di Strasburgo e registrò la visita in #italic A View of Society and Manners in France, Switzerland, and Germany#!. Descrive di aver atteso con una folla l'arrivo di un figlio illegittimo di Luigi XV alla messa, solo per vedere la congregazione disperdersi senza averlo ascoltato quando scoccò mezzogiorno prima che il nobile arrivasse, e poi di aver udito un fiammeggiante sermone sulla tirannia delle passioni. Moore notò anche il grande corno della cattedrale, suonato ogni sera in memoria di un complotto che le guide ancora incolpavano di un massacro di quattro secoli prima."

 grand_tour_events.19.title: "[target_location.GetNameWithNoTooltip], Porta del Mediterraneo"
 grand_tour_events.19.desc: "[target_location.GetName] è un porto da prima che Roma esistesse, fondata da marinai [ShowCultureName('greek_culture')] che videro il porto e non se ne andarono più, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] odora ancora di sale e di catrame in ogni quartiere. Galee da mezzo Mediterraneo affollano il suo lungomare, e i mercati vendono merci che non vedono mai l'interno di [GetCountry('FRA').GetName].\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova che sia il mare stesso a governare [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.19.knowledge: "Studiamo le iscrizioni che ricordano chi, di cultura [ShowCultureNameWithNoTooltip('greek_culture')], fondò [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip]."
 grand_tour_events.19.experience: "Visitiamo il porto e parliamo con i marinai del Mediterraneo."
 grand_tour_events.19.connections: "Facciamo visita a [court_host.GetNameWithNoTooltip]."
 grand_tour_events.19.party: "Scambiamo i pettegolezzi con una notte tra le taverne dei moli."
 grand_tour_events.19.historical_info: "Nel maggio del 1765, il romanziere Tobias Smollett giunse a Marsiglia nel viaggio di ritorno attraverso la Provenza e descrisse la città portuale in lettere poi pubblicate come #italic Travels through France and Italy#!. Passeggiando sulla banchina del porto, osservò i galeotti affittati dalla Corona per lavorare in mestieri in piccole bancarelle prese in affitto, incatenati per un piede eppure, nelle sue parole, ben nutriti e di aspetto gioviale come calzolai, argentieri e librai. Smollett giudicò Marsiglia una città nobile e fiorente, anche se brontolò che i suoi albergatori gli facevano pagare quattro livres a testa per ogni pasto."

 grand_tour_events.20.title: "[target_location.GetNameWithNoTooltip], la Città di Augusto"
 grand_tour_events.20.desc: "[target_location.GetName] porta il nome dell'imperatore che la fondò, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] non ha smesso di crescere da allora. Le casate bancarie qui muovono somme che fanno sembrare modeste alcune tesorerie reali, e la Dieta Imperiale si riunisce abbastanza spesso perché [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip] si sia abituata a ospitare principi.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] arriva e trova il denaro discusso apertamente come il lignaggio."
 grand_tour_events.20.knowledge: "Consultiamo le antichità e i manoscritti umanistici della città."
 grand_tour_events.20.experience: "Studiamo i libri contabili delle grandi casate bancarie."
 grand_tour_events.20.connections: "Partecipiamo a un ricevimento offerto da [court_host.GetNameWithNoTooltip]."
 grand_tour_events.20.party: "Mettiamo da parte i registri per i tavoli da gioco."
 grand_tour_events.20.historical_info: "La mattina del 15 luglio 1772, lo storico della musica inglese Charles Burney giunse ad Augusta dopo aver viaggiato tutta la notte e andò direttamente in cattedrale, dove ascoltò un sermone in tedesco e una messa cantata da due cori per una festività. Ammirò i cantori ma trovò le armonie dell'organista così rozze e forzate che l'esecuzione torturava anziché allietare l'orecchio, e fu sorpreso da un rozzo squillo di tamburi e trombe all'elevazione dell'Ostia, un'usanza che aveva udito solo ad Anversa. Venuto a sapere che il cantore per il quale portava lettere era fuori città, Burney, che raccoglieva materiale per la sua storia della musica, non si trattenne."

 grand_tour_events.21.title: "[target_location.GetNameWithNoTooltip], la Città della Cattedrale"
 grand_tour_events.21.desc: "[target_location.GetName] costruisce la propria cattedrale da più tempo di quanto chiunque in vita ricordi, con una torre a metà che domina [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] e una gru ancora appollaiata in cima dove i muratori l'hanno lasciata. Il Reno porta più traffici lungo [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip] che quasi ovunque altrove nelle terre [ShowLanguageName('german_language')], e il suo arcivescovo governa quanto qualunque principe.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova una città che misura la pazienza in secoli."
 grand_tour_events.21.knowledge: "Visitiamo i lavori della cattedrale e gli studiosi dell'università."
 grand_tour_events.21.experience: "Visitiamo le fonderie che fondono campane per le chiese della Renania."
 grand_tour_events.21.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.21.party: "Saltiamo i lavori della cattedrale per una notte lungo il Reno."
 grand_tour_events.21.historical_info: "Nel settembre del 1794, la romanziera Ann Radcliffe giunse a Colonia durante un viaggio in Renania con il marito, un'escursione registrata nel suo diario di viaggio pubblicato #italic A Journey Made in the Summer of 1794#!. Trovò la città sopraffatta da profughi in fuga dagli eserciti francesi che avanzavano su Liegi e Maastricht, con le strade affollate di carri d'ospedale carichi di feriti e moribondi. Ogni locanda era piena; i compagni di viaggio dormivano in carrozza, sui tavoli da biliardo e su chaise-longue per mancanza di una stanza. La Radcliffe scrisse in seguito che la scena le insegnò più del vero costo della guerra di qualunque battaglia di cui avesse letto."

 grand_tour_events.22.title: "[target_location.GetNameWithNoTooltip], la Città di Barcino"
 grand_tour_events.22.desc: "[target_location.GetName] fa risalire le proprie mura alla colonia romana che qui sorse per prima, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] è diventata il porto più trafficato di questa costa, con il suo scalo fitto di galee che commerciano [ShowGoodsName('wool')], spezie e [ShowGoodsName('dyes')] attraverso il Mediterraneo occidentale. Il suo codice marittimo è consultato da capitani che non hanno mai messo piede in città.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] ha quasi finito la lunga strada verso casa."
 grand_tour_events.22.knowledge: "Seguiamo una lezione sulle leggi delle #italic Corts#! catalane."
 grand_tour_events.22.experience: "Studiamo il codice marittimo custodito alla borsa dei mercanti."
 grand_tour_events.22.connections: "Presentiamoci alla corte di [court_host.GetNameWithNoTooltip]."
 grand_tour_events.22.party: "Scambiamo il codice marittimo con le taverne dei moli."
 grand_tour_events.22.historical_info: "Alla fine di ottobre del 1775, l'antiquario inglese Henry Swinburne giunse a Barcellona poco prima che le porte della città si chiudessero per la notte, episodio da lui raccontato nei suoi #italic Travels through Spain, in the Years 1775 and 1776#!. Dopo aver reso omaggio al governatore, andò a teatro, brontolando all'inizio che 'la Noia ha stabilito il proprio trono su questo palcoscenico', per poi essere conquistato giorni dopo da una vivace rappresentazione di #italic El Cid Campeador#! recitata in antichi costumi spagnoli. Ispezionò anche la cittadella, notando che il suo terreno basso, umido e infestato dalle zanzare fu scelto meno per la salute che per intimidire la città sottostante."

 grand_tour_events.23.title: "[target_location.GetNameWithNoTooltip], la Città dei Re"
 grand_tour_events.23.desc: "[target_location.GetName] incorona la sua collina con il castello dove i re vengono fatti e sepolti, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] tratta entrambe le cerimonie con uguale solennità. La sua università, più antica della maggior parte di quelle delle terre [ShowLanguageName('german_language')], insegna astronomia e diritto a studenti provenienti da tutta la regione, e il commercio di [ShowGoodsName('amber')] e [ShowGoodsName('salt')] tiene animati i suoi mercati tutto l'anno.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova l'ultima grande tappa prima di casa."
 grand_tour_events.23.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.23.experience: "Visitiamo la Sala dei Panni dove i mercanti trattano le loro merci."
 grand_tour_events.23.connections: "$grand_tour_events.seek_castle_audience$"
 grand_tour_events.23.party: "Lasciamo la sala di lezione per una notte vicino al castello."
 grand_tour_events.23.historical_info: "Il 25 luglio 1778, William Coxe, precettore itinerante del giovane lord Herbert in un lungo Grand Tour attraverso l'Europa settentrionale e orientale, attraversò la Vistola a Cracovia e trovò la vecchia capitale polacca segnata da cannonate e mitraglia di recenti assedi, con le sue grandi case ridotte in rovina. Visitò l'università fondata da Casimiro il Grande, dove il bibliotecario gli mostrò un libro turco di poco valore in sé, ma apprezzato come curiosità: preso tra i bottini della battaglia di Khotyn, era stato donato all'università dallo stesso re Giovanni Sobieski come memoriale della vittoria che salvò la Polonia e gli fece guadagnare il trono."

 grand_tour_events.24.title: "E Poi Dove?"
 grand_tour_events.24.desc: "Da [target_location.GetName] si aprono diverse strade. [target_leader.GetName] deve decidere in che direzione prosegua il viaggio: più a fondo nell'[ShowRegionName('italy_region')], o verso casa."
 grand_tour_events.24.a: "Deviamo verso [ShowLocationNameWithNoTooltip('verona')]."
 grand_tour_events.24.b: "Puntiamo invece su [ShowLocationNameWithNoTooltip('ferrara')]."
 grand_tour_events.24.c: "Voltiamo verso [ShowLocationNameWithNoTooltip('bologna')]."
 grand_tour_events.24.d: "Proseguiamo verso [ShowLocationNameWithNoTooltip('florence')]."
 grand_tour_events.24.e: "Interrompiamo il viaggio a [ShowLocationNameWithNoTooltip('siena')]."
 grand_tour_events.24.f: "Passiamo prima da [ShowLocationNameWithNoTooltip('pisa')]."
 grand_tour_events.24.g: "Voltiamo verso [ShowLocationNameWithNoTooltip('assisi')]."
 grand_tour_events.24.h: "Puntiamo invece su [ShowLocationNameWithNoTooltip('perugia')]."
 grand_tour_events.24.i: "Proseguiamo verso [ShowLocationNameWithNoTooltip('rome')]."
 grand_tour_events.24.j: "Continuiamo verso [ShowLocationNameWithNoTooltip('naples')]."
 grand_tour_events.24.k: "Il viaggio ha visto abbastanza. Torniamo a casa."

 grand_tour_events.25.title: "La Strada di Casa"
 grand_tour_events.25.desc: "Il viaggio volge finalmente verso casa. Anziché ripercorrere l'intera strada verso sud, [target_leader.GetName] deve scegliere dove interrompere il viaggio prima dell'ultimo tratto: una sosta per riposare i cavalli e, forse, essere ricevuti a un'altra corte prima di tornare."
 grand_tour_events.25.desc.second: "Una sola tappa non basta a parlare di ritorno a casa. Prima che la strada riconduca infine a [ROOT.GetCountry.GetCapital.GetName], [target_leader.GetName] sceglie un'altra città dove interrompere il viaggio: un'ultima corte, un'ultima curiosità, prima che il viaggio sia davvero finito."
 grand_tour_events.25.a: "Interrompiamo il viaggio a [ShowLocationNameWithNoTooltip('vienna')]."
 grand_tour_events.25.b: "Riposiamo i cavalli a [ShowLocationNameWithNoTooltip('prague')]."
 grand_tour_events.25.c: "Voltiamo verso casa passando per [ShowLocationNameWithNoTooltip('munich')]."
 grand_tour_events.25.d: "Fermiamoci a [ShowLocationNameWithNoTooltip('paris')] prima dell'ultimo tratto."
 grand_tour_events.25.e: "Passiamo per [ShowLocationNameWithNoTooltip('lyon')] sulla via del ritorno."
 grand_tour_events.25.f: "Attraversiamo fino a [ShowLocationNameWithNoTooltip('london')] prima di volgere nell'entroterra."
 grand_tour_events.25.g: "Facciamo prima una deviazione a [ShowLocationNameWithNoTooltip('strasbourg')]."
 grand_tour_events.25.h: "Instradiamo il viaggio attraverso [ShowLocationNameWithNoTooltip('marseille')]."
 grand_tour_events.25.i: "Puntiamo su [ShowLocationNameWithNoTooltip('augsburg')] prima dell'ultima tappa."
 grand_tour_events.25.k: "Riposiamoci un po' a [ShowLocationNameWithNoTooltip('cologne')]."
 grand_tour_events.25.l: "Torniamo a casa per mare passando per [ShowLocationNameWithNoTooltip('barcelona')]."
 grand_tour_events.25.n: "Interrompiamo il viaggio a [ShowLocationNameWithNoTooltip('orleans')]."
 grand_tour_events.25.o: "Passiamo per [ShowLocationNameWithNoTooltip('krakow')] prima dell'ultima tappa verso casa."
 grand_tour_events.25.p: "Basta ritardi. Dirigiamoci direttamente a casa."

 grand_tour_events.26.title: "[target_location.GetNameWithNoTooltip], la Città sul Tamigi"
 grand_tour_events.26.desc: "[target_location.GetName] si estende lungo il suo fiume dietro mura che i Romani innalzarono per primi, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] è cresciuta ben oltre di esse da allora, con il suo ponte affollato di case e negozi propri. Il commercio di [ShowGoodsName('wool')] riempie i suoi magazzini, e il Parlamento si riunisce abbastanza spesso perché [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetNameWithNoTooltip] si sia abituata a ospitare gli affari del regno.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova una corte ambiziosa quanto qualunque altra del continente."
 grand_tour_events.26.knowledge: "Seguiamo una lettura alle Inns of Court sul diritto consuetudinario."
 grand_tour_events.26.experience: "Visitiamo i mercanti di [ShowGoodsNameWithNoTooltip('wool')] e le sedi delle corporazioni della città."
 grand_tour_events.26.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.26.party: "Mettiamo da parte le sedi delle corporazioni per una notte nelle taverne di [target_location.GetNameWithNoTooltip]."
 grand_tour_events.26.historical_info: "Nel 1765 il magistrato e letterato francese Pierre-Jean Grosley trascorse quasi un anno a Londra raccogliendo materiale per il libro poi tradotto come #italic A Tour to London#!. Tra le sue osservazioni, registrò di aver visto un ministro di stato trascorrere ventiquattr'ore ininterrotte a un tavolo da gioco, sostenuto per tutto il tempo da nient'altro che manzo freddo pressato tra due fette di pane tostato. 'Questo nuovo piatto', scrisse Grosley, 'divenne molto di moda durante la mia permanenza a Londra', noto da allora con il nome del suo inventore. L'aneddoto, abbellito o meno, divenne la frase più citata del suo Tour."

 grand_tour_events.27.title: "[target_location.GetNameWithNoTooltip], la Città sulla Loira"
 grand_tour_events.27.desc: "[target_location.GetName] sorge dove la Loira piega a nord prima di tornare verso il mare, e [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName] ha da tempo tratto profitto dal traffico che segue il fiume. La sua università insegna diritto con quasi lo stesso rigore di quella di [ShowLocationName('bologna')], e le sue mura hanno resistito ad assedi che altre città non sopravvissero.\n\nIl nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] trova sia studiosi sia soldati con storie da raccontare."
 grand_tour_events.27.knowledge: "$grand_tour_events.attend_university_lectures$"
 grand_tour_events.27.experience: "Visitiamo le cantine e la corporazione dei barcaioli della Loira."
 grand_tour_events.27.connections: "$grand_tour_events.seek_audience$"
 grand_tour_events.27.party: "Saltiamo le lezioni di diritto per le taverne sul fiume."
 grand_tour_events.27.historical_info: "Nell'aprile del 1644, il giovane diarista John Evelyn interruppe il suo viaggio lungo la Loira a Orléans, in quello che divenne uno dei primi Grand Tour documentati. Visitò l'antica università, i cui studenti erano ancora divisi in quattro storiche 'nazioni', francese, normanna, picarda e olandese superiore, ciascuna con i propri ufficiali, e usò le due biblioteche pubbliche della città, osservando che uno studioso poteva prendere in prestito un libro fino al proprio alloggio semplicemente lasciando un biglietto firmato, una liberalità che trovò notevole. Vide anche la chiesa collegiata di Santa Croce, un tempo maestosa ma ancora visibilmente segnata dalle recenti guerre civili."

 grand_tour_events.28.title: "Un'Occasione di Apprendimento"
 grand_tour_events.28.desc.university: "Giunge al seguito la notizia che un posto tra gli studenti dell'università di [target_location.GetName] potrebbe essere organizzato per [target_leader.GetName]: lezioni, dispute e la compagnia di studiosi i cui nomi saranno ricordati molto dopo che questo viaggio sarà dimenticato."
 grand_tour_events.28.desc.scholar: "Giunge al seguito la notizia di uno studioso a [target_location.GetName] la cui fama attira studenti da tutto il continente, e che potrebbe essere convinto, a pagamento e per l'allievo giusto, a prendere con sé [target_leader.GetName] per un periodo."
 grand_tour_events.28.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.28.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.28.c: "$grand_tour_events.opportunity_decline$"

 grand_tour_events.29.title: "Le Lezioni Finiscono"
 grand_tour_events.29.desc: "I mesi di studio volgono al termine, e [target_leader.GetName] deve decidere cosa si sia davvero appreso a [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.29.a: "$grand_tour_events.reflect_and_continue$"

 grand_tour_events.30.title: "Un'Occasione sul Campo"
 grand_tour_events.30.desc: "Il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] apprende che [target_country.GetLongName] è in guerra, e che il suo corpo ufficiali è disposto ad accogliere visitatori con le giuste presentazioni. [target_leader.GetName] non avrebbe alcun vero comando né alcuna responsabilità per ciò che accade agli uomini, ma potrebbe cavalcare accanto a ufficiali esperti, osservare una campagna dal vivo e imparare ciò che nessun libro di strategia ha mai davvero catturato."
 grand_tour_events.30.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.30.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.30.c: "$grand_tour_events.opportunity_decline$"

 grand_tour_events.31.title: "La Campagna Finisce"
 grand_tour_events.31.desc: "La stagione delle campagne volge al termine, e [target_leader.GetName] deve decidere cosa si sia davvero appreso dagli ufficiali di [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.31.a: "$grand_tour_events.reflect_and_continue$"

 grand_tour_events.32.title: "Un'Occasione di Contatti"
 grand_tour_events.32.desc: "Giunge a [target_leader.GetName] la notizia di un invito a unirsi alla corte di [target_country.GetLongName] come ospite per una stagione: stanze a palazzo, un invito permanente a ogni ricevimento e presentazioni a ogni cortigiano e diplomatico in visita che valga la pena conoscere."
 grand_tour_events.32.desc.no_owner: "Giunge a [target_leader.GetName] la notizia di un invito a unirsi alla casa della famiglia principale di [target_location.GetName] come ospite per una stagione: presentazioni a ogni notabile che valga la pena conoscere e un invito permanente alla loro tavola."
 grand_tour_events.32.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.32.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.32.c: "$grand_tour_events.opportunity_decline$"

 grand_tour_events.33.title: "La Stagione a Corte Finisce"
 grand_tour_events.33.desc: "La stagione a corte volge al termine, e [target_leader.GetName] deve decidere cosa si sia davvero guadagnato dalle conoscenze fatte a [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.33.a: "Riflettiamo su ciò che si è guadagnato e proseguiamo il viaggio."

 grand_tour_events.34.title: "Un'Occasione di Scherma"
 grand_tour_events.34.desc: "Il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] apprende che [target_location.GetName] ospita un maestro di scherma di vera fama, disposto ad accogliere un allievo promettente per la stagione. [target_leader.GetName] non combatterebbe alcun duello di vera conseguenza e non risolverebbe alcuna vera contesa, ma potrebbe apprendere il gioco di gambe, i tempi e quel particolare coraggio che nessun manuale d'armi ha mai davvero catturato."
 grand_tour_events.34.a: "$grand_tour_events.opportunity_accept$"
 grand_tour_events.34.b: "$grand_tour_events.opportunity_commit$"
 grand_tour_events.34.c: "$grand_tour_events.opportunity_decline$"

 grand_tour_events.35.title: "Le Lezioni Finiscono"
 grand_tour_events.35.desc: "La stagione delle lezioni volge al termine, e [target_leader.GetName] deve decidere cosa si sia davvero appreso dagli incontri combattuti a [target_location.GetName], $grand_tour_events.worth_the_delay$"
 grand_tour_events.35.a: "$grand_tour_events.reflect_and_continue$"

 grand_tour_events.36.title: "Una Lettera da Casa"
 grand_tour_events.36.desc: "Una lettera da [ROOT.GetCountry.GetName] raggiunge finalmente il viaggio. Reca parole affettuose da [ROOT.GetCountry.GetGovernment.GetRuler.GetName]: la corte parla bene di [target_leader.GetName] e del resoconto che sta componendo sul proprio tempo all'estero, già argomento di più di una cena in patria."
 grand_tour_events.36.a: "Segniamolo con una piccola festa."
 grand_tour_events.36.b: "Non abbiamo tempo per la vecchia corte di casa."

 grand_tour_events.37.title: "Un Ammiratore Locale"
 grand_tour_events.37.desc: "[gt_admirer.GetName], una giovane persona della nobiltà locale, chiaramente colpita dal rango e dai modi di [target_leader.GetName], lo ha cercato, desiderosa di rendersi utile durante la visita a [target_location.GetName]."
 grand_tour_events.37.a: "Facciamo presentare [target_leader.GetNameWithNoTooltip] alle persone giuste."
 grand_tour_events.37.b: "Accettiamo il dono di abiti pregiati, adatti al viaggio."
 grand_tour_events.37.c: "Accettiamo l'invito a soggiornare nella sua casa."

 grand_tour_events.38.title: "Una Presentazione Utile"
 grand_tour_events.38.desc: "A una cena, [target_leader.GetName] è seduto accanto a [gt_secretary.GetName], un giovane dimesso che dice poco di sé, finché una battuta casuale lo rivela segretario del cardinale [target_cardinal.GetName]. Si lascia sfuggire che una sua parola potrebbe far ricevere [target_leader.GetNameWithNoTooltip] dal cardinale in persona, se l'impressione fatta stasera è quella giusta."
 grand_tour_events.38.a: "Insistiamo per la presentazione, rischiando un'impressione imbarazzante."
 grand_tour_events.38.b: "Spingiamo forte, al diavolo l'imbarazzo."
 grand_tour_events.38.c: "Godiamoci la serata, e basta così."

 grand_tour_events.39.title: "Un Momento di Intuizione"
 grand_tour_events.39.desc: "Nel mezzo di una disputa a [target_location.GetName], un argomento di [target_leader.GetName] colpisce all'improvviso come un guizzo di genio, e gli studiosi riuniti restano in silenzio, poi annuiscono in segno di approvazione."
 grand_tour_events.39.a: "Spingiamoci oltre, rischiando il ridicolo se sbagliamo."
 grand_tour_events.39.b: "Portiamolo al limite, al diavolo il ridicolo."
 grand_tour_events.39.c: "Una buona prova per oggi. Fermiamoci qui."

 grand_tour_events.40.title: "Una Dimostrazione di Abilità"
 grand_tour_events.40.desc: "Durante un incontro alla scuola di scherma di [target_location.GetName], [target_leader.GetName] trova un varco che nessun istruttore ha mai insegnato, e per un istante l'intera sala osserva cosa ne farà."
 grand_tour_events.40.a: "Spingiamo l'attacco, rischiando una brutta caduta."
 grand_tour_events.40.b: "Forziamo lo scambio, al diavolo le ferite."
 grand_tour_events.40.c: "Mostriamoci all'altezza dell'occasione, e fermiamoci lì."
 grand_tour_events.40.injury_tt: "[target_leader.GetName] fa una brutta caduta e resta a letto, a curare lividi e orgoglio"

 grand_tour_events.41.title: "Un Attacco di Malattia"
 grand_tour_events.41.desc: "[target_leader.GetName] si ammala di un brutto flusso, causato, sospettano i medici, dall'acqua locale: nulla di pericoloso per la vita, assicurano al seguito, ma abbastanza spiacevole da costringere a letto per alcuni giorni, e le loro parcelle non sono a buon mercato."
 grand_tour_events.41.a: "Mandiamo a chiamare un medico."
 grand_tour_events.41.b: "Mandiamo a chiamare il miglior medico disponibile."
 grand_tour_events.41.c: "Lasciamo che faccia il suo corso."

 grand_tour_events.42.title: "Nostalgia di Casa"
 grand_tour_events.42.desc: "La novità della permanenza si è consumata, e [target_leader.GetName] si accorge che i propri pensieri vanno a casa, soprattutto a [target_parent.GetName]. Ciò non giova affatto alla concentrazione."
 grand_tour_events.42.a: "Scriviamo a casa a [target_parent.GetNameWithNoTooltip], con un piccolo dono."
 grand_tour_events.42.b: "Commissioniamo un ritratto da inviare a [target_parent.GetNameWithNoTooltip]."
 grand_tour_events.42.c: "Abbandoniamo il viaggio e torniamo a casa da [target_parent.GetNameWithNoTooltip]."

 grand_tour_events.43.title: "Un Passo Falso Costoso"
 grand_tour_events.43.desc: "Emerge solo a cose fatte che [target_leader.GetName] ha salutato il magistrato locale fuori turno al ricevimento di ieri sera, una violazione della precedenza evidente a tutti nella sala tranne che al seguito. Il loro ospite difficilmente lo dimenticherà senza qualche gesto di contrizione, anche se uno goffo potrebbe facilmente peggiorare le cose."
 grand_tour_events.43.a: "Offriamo un piccolo dono a titolo di scuse, rischiando che cada nel vuoto."
 grand_tour_events.43.b: "Facciamo un grande gesto di scuse."
 grand_tour_events.43.c: "Lasciamo correre."

 grand_tour_events.44.title: "La Guardia Corrotta"
 grand_tour_events.44.desc: "Tornando dopo il tramonto, [target_leader.GetName] viene assalito in un vicolo da uomini con la livrea della guardia cittadina, più interessati alla borsa di uno straniero che alla legge che hanno giurato di far rispettare."
 grand_tour_events.44.a: "Denunciamo le guardie al magistrato domattina."
 grand_tour_events.44.b: "Sfidiamo a duello le guardie nel vicolo."
 grand_tour_events.44.c: "Fuggiamo in strada, gridando aiuto."
 grand_tour_events.44.d: "Consegniamo la borsa e allontaniamoci."

 grand_tour_events.45.title: "Un Compagno di Viaggio"
 grand_tour_events.45.desc: "Tra la folla di una vivace locanda, il nostro [ROOT.GetCountry.GetGovernment.GetHeirTitle] si mette a conversare con [gt_friend.GetName], un altro giovane nobile della patria che compie più o meno lo stesso giro per più o meno le stesse ragioni. I due vanno subito d'accordo, scambiandosi storie del loro paese e dei loro viaggi prima che la strada li separi di nuovo, ciascuno verso una città diversa."
 grand_tour_events.45.a: "Una bella amicizia sta nascendo."
 grand_tour_events.45.b: "Auguriamo ogni bene e restiamo per conto nostro."

 grand_tour_events.friendship_up_1_tt: "L'amicizia con [gt_friend.GetName] si approfondisce (#G +1#! Amicizia)"
 grand_tour_events.friendship_up_2_tt: "L'amicizia con [gt_friend.GetName] si approfondisce molto (#G +2#! Amicizia)"
 grand_tour_events.friendship_down_1_tt: "L'amicizia con [gt_friend.GetName] si raffredda (#R -1#! Amicizia)"
 grand_tour_events.friend_joins_court_tt: "[gt_friend.GetName], l'amico fatto dal nostro erede lungo il cammino, è disposto a seguire [heir.GetNameWithNoTooltip] a casa, alla nostra corte"

 grand_tour_events.friend_reunion_intro: "Per caso, anche [gt_friend.GetName] si trova a [target_location.GetName], con le strade dei due amici che si incrociano di nuovo dopo del tempo trascorso lontani, e la conversazione riprende come se non si fosse mai interrotta."

 grand_tour_events.46.title: "Un Amico nel Bisogno"
 grand_tour_events.46.desc: "$grand_tour_events.friend_reunion_intro$ La borsa, ammette, è stata svuotata da una serie di sfortune ai tavoli da carte, e chiede, con evidente imbarazzo, se ci sia modo di aiutarlo prima che il debito diventi uno scandalo."
 grand_tour_events.46.a: "Copriamo in silenzio il debito con la nostra borsa."
 grand_tour_events.46.b: "Scriviamo ai nostri contatti perché gli concedano credito."
 grand_tour_events.46.c: "Auguriamo buona fortuna e lasciamo che trovi da sé la via d'uscita."

 grand_tour_events.47.title: "Una Scoperta Condivisa"
 grand_tour_events.47.desc: "$grand_tour_events.friend_reunion_intro$ Aggiornandosi su ciò che ciascuno ha appreso dall'ultima separazione, [gt_friend.GetNameWithNoTooltip] ammette di non riuscire a seguire una lezione, un testo che i nostri studi hanno già reso chiaro, e chiede aiuto per capirlo."
 grand_tour_events.47.a: "Sediamoci e spieghiamolo, attingendo a ciò che già sappiamo."
 grand_tour_events.47.b: "Assoldiamo invece un precettore che lo accompagni nello studio."
 grand_tour_events.47.c: "Diciamo che è semplice e lasciamolo alle prese con il testo."

 grand_tour_events.48.title: "Una Parola all'Orecchio Giusto"
 grand_tour_events.48.desc: "$grand_tour_events.friend_reunion_intro$ [gt_friend.GetNameWithNoTooltip] ha sentito di un salotto privato a [target_location.GetNameWithNoTooltip] dove si riuniscono le famiglie migliori che abitano [target_location.Custom('IT_ART_LOCATION')][target_location.GetRank.GetName], ma non ha lì alcuna conoscenza che gli conceda l'ingresso. [target_leader.GetName], grazie alle relazioni costruite lungo il viaggio, è tutt'altra faccenda."
 grand_tour_events.48.a: "Mandiamo parola alla nostra conoscenza, garantendo per lui."
 grand_tour_events.48.b: "Paghiamo invece l'ingresso a una riunione minore."
 grand_tour_events.48.c: "Diciamogli di trovare da sé la strada per entrare."

 grand_tour_events.49.title: "Una Minaccia di Violenza"
 grand_tour_events.49.desc: "$grand_tour_events.friend_reunion_intro$ L'incontro si fa subito brutto: [gt_friend.GetNameWithNoTooltip] ha indispettito un usuraio locale e l'uomo ora sta accanto al loro tavolo alla locanda con due scagnozzi assoldati, promettendo di spaccare più dei mobili a meno che il debito non sia saldato stasera."
 grand_tour_events.49.a: "Interveniamo di persona; sappiamo come trattare simili uomini."
 grand_tour_events.49.b: "Paghiamo semplicemente chi è creditore e chiudiamo la questione."
 grand_tour_events.49.c: "Lasciamolo ad affrontare da solo le conseguenze."

 grand_tour_events.50.title: "Una Piccola Malattia"
 grand_tour_events.50.desc: "Giunge a [target_leader.GetName] la notizia che anche [gt_friend.GetName] si trova a [target_location.GetName], e giace a letto alla locanda locale con un brivido febbrile preso lungo la strada. L'oste borbotta che la borsa del giovane sembrava scarsa quando ha pagato la stanza e che ha già rifiutato due volte il medico locale per risparmiare la parcella."
 grand_tour_events.50.a: "Paghiamo un medico, nonostante le sue obiezioni."
 grand_tour_events.50.b: "Curiamolo noi stessi, con la nostra esperienza di viaggio."
 grand_tour_events.50.c: "Facciamogli visita e auguriamogli ogni bene."
 grand_tour_events.50.d: "Meglio non avvicinarsi, allora."

