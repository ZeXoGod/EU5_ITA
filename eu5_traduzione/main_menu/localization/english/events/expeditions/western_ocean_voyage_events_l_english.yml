l_english:

 western_ocean_voyage_events.1.title: "Facciamo Rotta a Ovest"
 western_ocean_voyage_events.1.desc: "Le navi stanno basse nel porto, rifornite per un viaggio per il quale nessuna carta ci ha preparati. [target_leader.GetName] ha trascorso mesi presso [ROOT.GetCountry.GetGovernment.GetCourtTitle] a sostenere la propria tesi: che l'oceano a occidente sia più stretto di quanto affermino i dotti e che le Indie siano alla portata di una flotta risoluta.\n\nGli uomini di scienza restano scettici. I marinai sono a disagio. Ma il vento è favorevole, la marea sta cambiando e non resta altro da fare che mollare gli ormeggi."
 western_ocean_voyage_events.1.columbus: "Secondo i calcoli precisi di [target_leader.GetNameWithNoTooltip] sono tremila miglia, non una di più."
 western_ocean_voyage_events.1.a: "Facciamo vela, qualunque cosa ci riservi l'oceano. La troveremo per primi."
 western_ocean_voyage_events.1.historical_info: "L'idea di raggiungere l'Asia navigando verso occidente era dibattuta dagli studiosi europei da decenni prima che si tentasse il primo viaggio di questo tipo. L'ostacolo principale non era la forma della Terra, che le persone istruite sapevano essere sferica, ma le sue dimensioni. La maggior parte degli studiosi stimava correttamente che l'oceano fosse troppo vasto per essere attraversato. Le spedizioni che li smentirono non lo fecero confutando quella stima, ma trovando qualcosa di inatteso lungo la strada."

 western_ocean_voyage_events.2.title: "Il Confine del Mondo Cartografato"
 western_ocean_voyage_events.2.desc: "Le Isole Fortunate, così le chiamavano gli antichi, si trovano al limite estremo di ogni carta che portiamo con noi, a [ShowLocationName('northern_fuerteventura_coast')]. Oltre di esse l'oceano non ha nomi, né profondità registrate, né coste tracciate. I pescatori del posto dicono che a volte vedono uccelli volare da ovest prima di una tempesta, cosa che [target_leader.GetName] interpreta come segno di terra oltre l'orizzonte. L'equipaggio la interpreta come segno di tempeste.\n\nImbarchiamo acqua fresca, carne salata e gallette. Al tramonto gli uomini guardano il mare farsi dorato, poi scuro."
 western_ocean_voyage_events.2.a: "Rifornirsi e salpare entro la settimana."
 western_ocean_voyage_events.2.b: "Gli uomini non sono pronti. Torniamo indietro."
 western_ocean_voyage_events.2.historical_info: "Le Canarie servivano da punto di partenza abituale per i viaggi atlantici verso l'ignoto, per la loro posizione al margine delle acque atlantiche cartografate e per i costanti alisei che da lì soffiano verso sudovest in direzione dei Caraibi. La loro importanza strategica era così ben compresa che il controllo delle isole fu esso stesso oggetto di contesa tra Portogallo e Castiglia per gran parte del XV secolo."

 western_ocean_voyage_events.3.title: "Siamo Andati Abbastanza Lontano"
 western_ocean_voyage_events.3.desc: "Il pane sta ammuffendo. Le botti d'acqua puzzano. Tre uomini hanno preso la febbre. Questa mattina una delegazione si presenta a [target_leader.GetName] con un messaggio semplice: hanno navigato a ovest abbastanza a lungo, non hanno visto altro che mare aperto e intendono tornare a navigare verso est, che [target_leader.GetNameWithNoTooltip] sia d'accordo o no.\n\nNon c'è terra in nessuna direzione. Non c'è nulla, solo il vento alle spalle, che li ha portati fin qui e non li riporterebbe indietro."
 western_ocean_voyage_events.3.columbus: "[target_leader.GetNameWithNoTooltip] promette all'equipaggio altri tre giorni, secondo un giornale di bordo falsificato."
 western_ocean_voyage_events.3.a: "Promettiamo altri tre giorni e una parte di ciò che troveremo."
 western_ocean_voyage_events.3.b: "Gli uomini hanno ragione. Torniamo indietro."
 western_ocean_voyage_events.3.historical_info: "I resoconti del viaggio del 1492 registrano una vera crisi di morale circa un mese dopo l'inizio della traversata atlantica, quando l'equipaggio minacciò l'ammutinamento e chiese a Colombo di invertire la rotta verso casa. La soluzione della crisi, attribuita di volta in volta alla promessa di avvistare terra entro tre giorni, alla vista di vegetazione galleggiante o semplicemente alla forza di carattere di Colombo, resta controversa. La terra fu avvistata la mattina seguente."

 western_ocean_voyage_events.4.title: "Terra!"
 western_ocean_voyage_events.4.desc: "Poco prima dell'alba un grido giunge dalla coffa. Poi un altro, più forte. Poi ogni uomo sul ponte sta gridando.\n\nUna forma all'orizzonte. Dapprima bassa, poco più di un oscurarsi del cielo, ma con l'aumentare della luce diventa inconfondibile: alberi, una linea di costa, verdi colline che si innalzano da acque immobili. Il mare intorno alle navi è passato dal blu profondo al verde al turchese pallido. Uccelli sconosciuti volteggiano in alto. Rami con foglie mai viste scivolano accanto allo scafo.\n\n[target_leader.GetName] sta a prua e per molto tempo non dice nulla.\n\nQuando le barche toccano la riva, gli isolani si sono già radunati a guardare, e alcuni portano ben visibili piccoli ornamenti d'oro al naso. Interrogati, a gesti più che a parole, su dove provenga l'oro, indicano l'interno, e alcuni indicano il sud, verso colline che nessuno dell'equipaggio riesce a vedere da qui."
 western_ocean_voyage_events.4.columbus: "Piantiamo la bandiera. [target_leader.GetShortNameWithNoTooltip] è certo che siano le Indie."
 western_ocean_voyage_events.4.a: "Piantiamo la bandiera. Qualunque posto sia questo, ci appartiene."
 western_ocean_voyage_events.4.b: "Questo non corrisponde a nessun resoconto delle Indie. Non rivendichiamo ancora nulla."
 western_ocean_voyage_events.4.historical_info: "Il primo contatto tra gli europei e i popoli delle Americhe avvenne nei Caraibi nel 1492. Gli abitanti taíno delle Bahamas, che chiamavano la loro isola #italic Guanahani#!, salutarono dalla riva le navi in arrivo. Nel giro di una generazione, le malattie epidemiche, alle quali i Taíno non erano mai stati esposti, avevano ucciso la maggior parte della popolazione delle isole caraibiche. Le conseguenze a lungo termine della traversata rimodellarono l'ecologia, l'economia e la popolazione di ogni continente della Terra."

 western_ocean_voyage_events.5.title: "L'Isola delle Sette Città"
 western_ocean_voyage_events.5.desc: "Da qualche parte oltre la metà della traversata, con il vento costante e le navi che avanzano bene, i piloti portano a [target_leader.GetName] una vecchia carta. Disegnata da uomini che non hanno mai solcato questo oceano, segna una grande isola molto a ovest delle [ShowAreaName('azores_area')]: Antillia, cinta di mura e costellata di sette città, che si dice fondate dai vescovi fuggiti da [ShowRegionName('iberia_region')] quando gli eserciti omayyadi la invasero.\n\nNessuno a bordo ha visto quest'isola, e nessuno si aspetta di vederla. Ma la carta è antica, gli uomini che l'hanno disegnata non erano sciocchi e qui, con il nulla su ogni orizzonte, una vecchia storia vale più di quanto varrebbe in porto."
 western_ocean_voyage_events.5.a: "Tracciamo la rotta su di essa, nel caso le vecchie carte abbiano ragione."
 western_ocean_voyage_events.5.b: "Le carte dei marinai sono piene di isole che non sono mai esistite."
 western_ocean_voyage_events.5.historical_info: "Antillia, l'Isola delle Sette Città, compare sulle carte portoghesi e genovesi già nel 1424, a indicare una grande isola a ovest delle Azzorre. La leggenda che vi stava dietro narrava che sette vescovi visigoti fossero fuggiti dall'Iberia nel 714, durante la conquista omayyade, e avessero fondato sette città su un'isola dell'oceano occidentale. La leggenda sopravvisse all'età delle esplorazioni che avrebbe dovuto smentirla: quando decenni dopo Francisco Vázquez de Coronado partì alla ricerca delle sette città d'oro nel sud-ovest americano, diede al proprio obiettivo il nome di questo racconto più antico e puramente europeo."

 western_ocean_voyage_events.6.title: "Da Dove Viene l'Oro"
 western_ocean_voyage_events.6.desc: "Parola per parola, gli interpreti non concordano. Uno insiste che gli isolani stiano nominando un luogo. Un altro, che stiano nominando un popolo. Un terzo, che il gesto verso sud e quello verso l'interno siano due risposte diverse a due domande diverse che nessuno traduce correttamente.\n\nÈ certa la direzione: verso l'interno e, oltre, verso sud, verso montagne e fiumi che nessuno dell'equipaggio ha visto. [target_leader.GetName] fa comunque segnare la zona sulla carta ai piloti, metà diceria e metà congettura, nel caso qualcuno un giorno abbia bisogno di sapere dove cercare."
 western_ocean_voyage_events.6.a: "Annotiamolo così com'è, contraddizioni comprese."
 western_ocean_voyage_events.6.b: "Teniamo solo ciò su cui tutti concordano: l'interno, e l'oro."
 western_ocean_voyage_events.6.historical_info: "I primi resoconti del contatto nei Caraibi descrivono i Taíno con piccoli ornamenti d'oro, lavorato più che estratto localmente in quantità visibili ai nuovi venuti. Interrogati a gesti su dove provenisse, gli isolani indicarono ripetutamente l'interno e, in alcuni resoconti, terre più a sud e a ovest. Queste indicazioni di seconda mano e mal tradotte, più di qualsiasi scoperta confermata, orientarono le ricerche d'oro delle generazioni successive di esploratori nelle Americhe."

 western_ocean_voyage_events.7.title: "Leggiamo i Resoconti presso [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 western_ocean_voyage_events.7.desc: "Le navi raggiungono finalmente il porto, incrostate di sale e malconce, e nel giro di pochi giorni leggiamo ad alta voce il resoconto di [target_leader.GetName] presso [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Le isole, la traversata, gli uccelli strani e i frutti ancora più strani, l'oro portato da gente che non aveva mai sentito parlare di noi fino al momento del nostro arrivo.\n\nAlcuni dubitano della maggior parte di quanto viene detto, eppure scriviamo tutto comunque. Le carte iniziano a cambiare, con cautela, nei margini occidentali dove un tempo non si disegnava nulla."
 western_ocean_voyage_events.7.a: "Il resoconto resti com'è stato scritto."
 western_ocean_voyage_events.7.historical_info: "I resoconti scritti e orali delle spedizioni di ritorno venivano letti nelle corti reali di tutta l'Europa occidentale entro pochi mesi da ogni approdo, e le versioni tradotte circolarono ampiamente in seguito. Questi racconti, distorti dalla traduzione e dalle ambizioni di chi li narrava, descrivevano ricchezze dell'entroterra che nessun europeo aveva ancora visto di persona. Fu questa testimonianza di seconda mano, più di qualsiasi scoperta confermata, a spingere le generazioni successive di esploratori a cercare più all'interno e più a sud le fonti di ciò che i primi arrivati avevano solo intravisto."
 western_ocean_voyage_mythical_cities_tt: "Cartografare le coste delle Americhe renderà disponibili le [expeditions|e] alla ricerca delle sue leggendarie città perdute"
 western_ocean_voyage_events.provisions_up_10_tt: "La flotta si rifornisce di provviste fresche (#G +10#! Provviste)"
 western_ocean_voyage_events.provisions_up_20_tt: "La flotta si rifornisce di provviste fresche (#G +20#! Provviste)"
 western_ocean_voyage_events.morale_up_5_tt: "Il morale degli equipaggi sale (#G +5#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_up_10_tt: "Il morale degli equipaggi sale (#G +10#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_up_15_tt: "Il morale degli equipaggi sale (#G +15#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_up_30_tt: "Il morale degli equipaggi sale (#G +30#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_down_5_tt: "Il morale degli equipaggi cala (#R -5#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_down_10_tt: "Il morale degli equipaggi cala (#R -10#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_down_15_tt: "Il morale degli equipaggi cala (#R -15#! Morale degli Equipaggi)"
 western_ocean_voyage_events.morale_crash_20_tt: "Il morale crolla e gli equipaggi si avvicinano all'ammutinamento (#R -20#! Morale degli Equipaggi)"
 western_ocean_voyage_events.ship_gained_tt: "La flotta ottiene una nave aggiuntiva (#G +1#! Navi)"
 western_ocean_voyage_events.ship_lost_tt: "La flotta perde un'imbarcazione (#R -1#! Navi)"
 western_ocean_voyage_events.charted_kept_tt: "Le acque cartografate dalla flotta restano sulle nostre mappe"
 western_ocean_voyage_events.1.b: "Navighiamo avanti, qualunque cosa nasconda l'oceano. La troveremo per primi."
 western_ocean_voyage_events.1.c: "Che i venti siano la nostra carta."
 western_ocean_voyage_events.2.c: "Mandiamo delle scialuppe a terra per acqua e capre."
 western_ocean_voyage_events.2.c.calm_tt: "Il gruppo di sbarco ritorna senza problemi"
 western_ocean_voyage_events.2.c.clash_tt: "Il gruppo di sbarco si scontra con gli isolani"
 western_ocean_voyage_events.2.d: "Acquistiamo una caravella dai maestri d'ascia dell'isola."
 western_ocean_voyage_events.2.e: "Facciamo acqua alle navi e proseguiamo con ciò che abbiamo."
 western_ocean_voyage_events.2.f: "Gli uomini non sono pronti. Torniamo indietro."
 western_ocean_voyage_events.3.columbus.tt: "[target_leader.GetNameWithNoTooltip] calma l'equipaggio con un giornale di bordo falsificato, perciò il Morale degli Equipaggi non cala"
 western_ocean_voyage_events.7.desc.later: "Le navi raggiungono finalmente il porto, incrostate di sale e malridotte, e nel giro di pochi giorni leggiamo ad alta voce il resoconto di [target_leader.GetName] alla [ROOT.GetCountry.GetGovernment.GetCourtTitle]. I marinai di un'altra corona hanno raggiunto queste isole prima dei nostri, e i loro rapporti hanno ormai fatto il giro di ogni corte.\n\nEppure la nostra flotta ha attraversato lo stesso oceano ed è tornata a casa, e non è poco. I nostri piloti conoscono ora da sé i venti occidentali, e nessuna carta straniera può insegnare loro questo."
 western_ocean_voyage_events.8.title: "Ammutinamento in Mare Aperto"
 western_ocean_voyage_events.8.desc: "Comincia con un borbottio al cambio di guardia e finisce con i coltelli sguainati sul ponte principale. L'equipaggio di una delle nostre navi ha rinchiuso gli ufficiali sottocoperta e manda a dire attraverso l'acqua che al primo chiarore dell'alba punterà verso casa, e che abborderà qualunque nave tenti di fermarlo.\n\n[target_leader.GetName] sta alla murata e misura la distanza tra i due scafi. Dietro di [target_leader.GetHerHim], gli equipaggi fedeli aspettano di vedere cosa farà [target_leader.GetSheHe]."
 western_ocean_voyage_events.8.a: "Lasciamo che gli ammutinati prendano la loro nave e tornino a casa."
 western_ocean_voyage_events.8.b: "Abbordiamoli. Una nave in mare non è un consiglio."
 western_ocean_voyage_events.8.fight_win_tt: "Gli ufficiali hanno la meglio e ripristinano l'ordine"
 western_ocean_voyage_events.8.fight_lose_tt: "Lo scontro è sanguinoso, e la flotta ne paga il prezzo"
 western_ocean_voyage_events.8.c: "Parliamo loro delle Indie e dell'oro che vi attende."
 western_ocean_voyage_events.8.rouse_tt: "Le parole di [target_leader.GetNameWithNoTooltip] riaccendono la determinazione dell'equipaggio"
 western_ocean_voyage_events.9.title: "Febbre Sottocoperta"
 western_ocean_voyage_events.9.desc: "L'acqua nelle botti è diventata verde e la carne salata brulica. Prima pochi uomini si mettono a letto con la febbre, poi una dozzina, poi così tanti che gli ufficiali riescono a malapena a coprire i turni di guardia. Il chirurgo li ha salassati e purgati e non può fare altro.\n\nI sani guardano i malati e poi l'orizzonte vuoto, e non dicono ad alta voce ciò che tutti pensano."
 western_ocean_voyage_events.9.a: "Ammainiamo le vele e curiamo i malati finché la febbre non cede."
 western_ocean_voyage_events.9.b: "Non possiamo perdere giorni. Seppelliamo i morti e proseguiamo."
 western_ocean_voyage_events.9.historical_info: "Le lunghe traversate oceaniche del XV secolo erano limitate meno dalla navigazione che da ciò che una nave poteva trasportare. L'acqua conservata in botti di legno si inquinava nel giro di poche settimane, le provviste salate marcivano per il caldo, e gli equipaggi stipati in piccoli scafi si trasmettevano febbri e dissenteria. I capitani diretti verso l'Atlantico aperto si rifornivano nell'ultimo porto possibile, spesso le Canarie o le isole di Capo Verde, perché una volta partiti non c'era più nessun luogo dove farlo."
 western_ocean_voyage_events.10.title: "A Casa Prima del Confine"
 western_ocean_voyage_events.10.desc: "La flotta rientra in porto molto prima di quanto chiunque si aspettasse, con le stive ancora mezze piene e gli equipaggi al completo. Non hanno trovato terra, solo mare aperto e un vento che non lasciava dimenticare quanto fossero lontani da casa.\n\nA corte si parla del viaggio sottovoce, quando se ne parla. Eppure i piloti hanno tenuto i loro registri, e le nostre carte delle acque occidentali si spingono ora un po' più in là di prima."
 western_ocean_voyage_events.10.a: "L'oceano sarà ancora lì la prossima volta."
 western_ocean_voyage_events.11.title: "Mai Più Avuto Notizie"
 western_ocean_voyage_events.11.desc: "Passano mesi senza notizie della flotta che ha salpato verso ovest. Poi un anno. I mercanti che hanno investito nel viaggio cancellano le loro quote, e le famiglie degli equipaggi smettono di aspettare sul molo.\n\nChe le navi siano affondate in una tempesta, abbiano esaurito l'acqua in pieno oceano o abbiano semplicemente navigato finché non è rimasto più nulla, nessuno lo saprà mai. Tutto ciò che ci resta è l'ultimo rapporto che la flotta ha inviato a casa prima di spingersi oltre il mondo cartografato."
 western_ocean_voyage_events.11.a: "Il mare li ha presi. Preghiamo per le loro anime."
 western_ocean_voyage_events.11.historical_info: "I viaggi atlantici verso l'ignoto finivano spesso senza lasciare traccia. I fratelli genovesi Ugolino e Vadino Vivaldi salparono verso ovest attraverso lo Stretto di Gibilterra nel 1291, in cerca di una rotta marittima per l'India, e non se ne ebbero mai più notizie. Due secoli dopo, i fratelli portoghesi Gaspar e Miguel Corte-Real scomparvero in viaggi separati verso l'Atlantico nordoccidentale nel 1501 e nel 1502."
 western_ocean_voyage_events.13.title: "Un Mare di Alghe"
 western_ocean_voyage_events.13.desc: "Da giorni le navi solcano prati galleggianti di alghe giallo-verdi, così fitte in certi punti da sembrare trattenere gli scafi. I marinai più anziani giurano che significhi secche in vista, e che la flotta si incaglierà su una riva sommersa prima che qualcuno la veda.\n\n[target_leader.GetName] ordina di preparare lo scandaglio. Gli uomini osservano l'acqua e attendono di sapere cosa dirà loro."
 western_ocean_voyage_events.13.a: "Fermiamoci e scandagliamo i fondali."
 western_ocean_voyage_events.13.b: "Le alghe non sono una scogliera. Manteniamo la rotta e attraversiamole."
 western_ocean_voyage_events.13.c: "Il nostro pilota legge le alghe come corrente, non come secche."
 western_ocean_voyage_events.13.historical_info: "Il Mar dei Sargassi, una regione dell'Atlantico settentrionale coperta da banchi galleggianti di alghe sargasso, si trova lungo la rotta dalle Canarie ai Caraibi. La flotta di Colombo vi entrò nel settembre del 1492. Le sue ciurme temevano che le alghe segnalassero secche nascoste o che intrappolassero le navi, ma gli scandagli non trovarono fondo, e la flotta passò indenne."
 western_ocean_voyage_events.14.title: "Segni di Terra"
 western_ocean_voyage_events.14.desc: "Una vedetta nota un bastone intagliato che passa a prua, poi un ramo verde ancora coperto di foglie e bacche. Stormi di uccelli sorvolano al crepuscolo, tutti nella stessa direzione, verso sudovest.\n\nNessuno pronuncia ancora la parola ad alta voce. Ma gli uomini che pochi giorni fa minacciavano di tornare indietro ora si accalcano alle murate a ogni cambio di guardia, fissando l'orizzonte."
 western_ocean_voyage_events.14.a: "Seguiamo gli uccelli. La terra non può essere lontana."
 western_ocean_voyage_events.14.b: "Annotiamolo nel giornale di bordo e manteniamo la rotta."
 western_ocean_voyage_events.14.historical_info: "Nei giorni precedenti l'approdo dell'ottobre 1492, il giornale di bordo di Colombo registra un bastone intagliato, un ramo con bacche, canne e grandi stormi di uccelli in volo verso sudovest. Il 7 ottobre egli modificò la rotta per seguire gli uccelli, un cambiamento che portò la flotta alle Bahamas cinque giorni dopo."
 western_ocean_voyage_events.15.c: "Il nostro pilota conosce questi cieli. Puntiamo verso il quadrante calmo."
 western_ocean_voyage_events.16.c: "Il nostro pilota sa dove torna il vento. Andiamo a cercarlo."
