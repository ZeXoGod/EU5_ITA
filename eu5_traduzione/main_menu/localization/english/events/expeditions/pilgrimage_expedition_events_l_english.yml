l_english:
 pilgrimage_expedition_events.1.title: "[current_location.GetNameWithNoTooltip], la Città Santa"
 pilgrimage_expedition_events.1.desc: "Dopo mesi di stanco viaggio, [target_ruler.GetName] sta finalmente davanti alle mura di [current_location.GetName], città della Crocifissione, città della Resurrezione, il suolo più santo di tutta la cristianità. La polvere di mille pellegrini aleggia nell'aria, mescolandosi all'incenso che fluttua da cento cappelle.\n\nAl centro di tutto sorge la Chiesa del Santo Sepolcro, costruita sulla roccia stessa del Golgota. Si è viaggiato a lungo per questo momento. La lunga strada, i piedi piagati, le notti insonni, tutto svanisce mentre le grandi porte si aprono e l'odore di olio santo e di pietra antica si riversa incontro."
 pilgrimage_expedition_events.1.a: "Prostriamoci davanti al Santo Sepolcro."
 pilgrimage_expedition_events.1.b: "Commissioniamo una cappella in nome di [ROOT.GetCountry.GetNameWithNoTooltip]."
 pilgrimage_expedition_events.1.historical_info: "Gerusalemme attira i pellegrini cristiani fin dal IV secolo, quando l'imperatore Costantino fece costruire la Chiesa del Santo Sepolcro nel luogo della sepoltura e della resurrezione di Cristo. La città passò più volte di mano durante le Crociate: conquistata dalla Prima Crociata nel 1099, perduta a favore di Saladino nel 1187 e brevemente recuperata per via diplomatica sotto Federico II nel 1229, prima di cadere definitivamente in mano ai Mamelucchi. Nonostante la perdita del dominio cristiano, i luoghi santi rimasero accessibili ai pellegrini grazie ad accordi diplomatici, e Gerusalemme restò la meta suprema della devozione cattolica in tutto il mondo medievale."

 pilgrimage_expedition_events.2.title: "La Città Eterna"
 pilgrimage_expedition_events.2.desc: "[current_location.GetName] si leva lentamente dalla pianura, con le sue cupole e le sue torri che catturano la luce del pomeriggio mentre il seguito di [target_ruler.GetName] attraversa l'ultimo ponte sul Tevere. [current_location.Custom('IT_ART_LOCATION')|U][current_location.GetRank.GetName] è vasta e antica, con le strade affollate di pellegrini da ogni angolo della cristianità, tutti attratti dalla stessa invisibile corrente.\n\nSulla cima del colle Vaticano, San Pietro si staglia contro il cielo. Qui è il trono del Vicario di Cristo, l'autorità vivente della Chiesa sulla terra. [target_ruler.GetNameWithNoTooltip] è in soggezione al trovarsi al centro della spiritualità [ShowReligionAdjective('catholic')]."
 pilgrimage_expedition_events.2.a: "Riconosciamo con umiltà l'autorità divina."
 pilgrimage_expedition_events.2.b: "Facciamo una donazione degna del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 pilgrimage_expedition_events.2.c: "Abbiamo reso omaggio. Il nostro popolo ha bisogno di noi a casa."
 pilgrimage_expedition_events.2.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.2.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.2.historical_info: "Roma divenne sede dell'autorità cristiana fin dai primi secoli della Chiesa, grazie al martirio dell'apostolo Pietro, la cui tomba giace sotto la grande basilica che porta il suo nome. Il papato si sviluppò come potere temporale oltre che spirituale, attirando sovrani e pellegrini da tutta Europa in cerca di assoluzione, legittimità e della benedizione del successore di Pietro. Gli Anni Santi, iniziati nel 1300 sotto papa Bonifacio VIII, richiamarono centinaia di migliaia di pellegrini e consolidarono il posto di Roma come principale meta del pellegrinaggio cattolico."

 pilgrimage_expedition_events.3.title: "La Fine del Cammino"
 pilgrimage_expedition_events.3.desc: "Le ultime miglia del #italic Camino de Santiago#! sono le più affollate. Da ogni strada e da ogni valle, fiumi di pellegrini convergono sulla grande cattedrale di [current_location.GetName], con i bastoni levigati dall'uso, i mantelli incrostati della polvere di cinquecento leghe. Alcuni piangono. Alcuni hanno camminato scalzi per cento miglia.\n\n[target_ruler.GetName] cavalca alla testa del proprio seguito, ma smonta quando le torri della cattedrale entrano in vista. Sembra giusto percorrere l'ultimo tratto a piedi. Un grande boato dell'inno dei pellegrini si leva nel vento, #italic Ultreia! Ultreia!#!, e le pietre della strada sembrano risuonarne."
 pilgrimage_expedition_events.3.a: "Rendiamo grazie alla tomba di san Giacomo."
 pilgrimage_expedition_events.3.b: "Proclamiamolo un segno del favore di Dio sul nostro regno."
 pilgrimage_expedition_events.3.c: "Un giorno profondo. Ma c'è ancora [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] da governare."
 pilgrimage_expedition_events.3.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.3.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.3.historical_info: "Il culto di san Giacomo apostolo a Santiago de Compostela nacque nel IX secolo, quando in Galizia furono scoperte reliquie identificate come quelle di Giacomo e custodite dal re Alfonso II delle Asturie. La rotta di pellegrinaggio che ne derivò, il #italic Camino de Santiago#!, divenne uno dei tre grandi pellegrinaggi della cristianità medievale insieme a Roma e Gerusalemme. Nel XII secolo la strada era costellata di ospedali, monasteri e chiese, e pellegrini di ogni nazione europea la percorrevano. Giungere a Santiago dava diritto al pellegrino a un certificato di Compostela e a un'indulgenza plenaria."

 pilgrimage_expedition_events.4.title: "Il Santuario dei Tre Re"
 pilgrimage_expedition_events.4.desc: "[current_location.GetName]: [current_location.Custom('IT_ART_LOCATION')][current_location.GetRank.GetName] è un groviglio di gru e impalcature. La grande cattedrale è in costruzione da quasi due secoli, con le torri incompiute che salgono ogni anno più in alto verso un completamento che non arriverà per generazioni ancora non nate. Eppure, anche incompleto, l'edificio è vasto oltre ogni misura, il più grande del mondo, dicono gli uomini.\n\nNel transetto meridionale, dietro un altare fiammeggiante d'oro in foglia e di luce di candele, si trova il Santuario dei Tre Re: un reliquiario d'oro che contiene le ossa dei Magi che seguirono la stella fino a Betlemme. [target_ruler.GetName] ne sente parlare fin dall'infanzia. Nulla lo prepara davvero a questo."
 pilgrimage_expedition_events.4.a: "Inginocchiamoci e veneriamo il Santuario dei Tre Re."
 pilgrimage_expedition_events.4.b: "Facciamo una generosa donazione alla costruzione della cattedrale."
 pilgrimage_expedition_events.4.c: "Pregheremo, e poi proseguiremo per la nostra strada."
 pilgrimage_expedition_events.4.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.4.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.4.historical_info: "Il Santuario dei Tre Re a Colonia è il più grande reliquiario del mondo occidentale e il presunto luogo di riposo delle ossa dei Magi biblici. Le reliquie furono acquisite dall'imperatore del Sacro Romano Impero Federico Barbarossa dopo la conquista di Milano nel 1164 e donate all'arcivescovo di Colonia Rainaldo di Dassel. Il loro arrivo trasformò Colonia in una delle più importanti mete di pellegrinaggio dell'Europa settentrionale e diede impulso alla costruzione della grande cattedrale gotica iniziata nel 1248, un progetto che non sarebbe stato completato fino al 1880. Il legame dei Magi con la regalità e con l'Epifania rese il loro culto particolarmente risonante per i sovrani laici in cerca di un'approvazione divina."

 pilgrimage_expedition_events.5.title: "Nostra Signora di [current_location.GetNameWithNoTooltip]"
 pilgrimage_expedition_events.5.desc: "Si dice che le vetrate di [current_location.GetName] non si possano descrivere, solo vedere. [target_ruler.GetName] sta nella navata e ne capisce il motivo. La cattedrale è piena di luce blu, luce che ha attraversato mille lastre di vetro colorato e si è trasformata in qualcosa di non più del tutto terreno. Cade sul pavimento di pietra in pozze cangianti, sui volti dei pellegrini inginocchiati, sull'antica reliquia nel suo scrigno dorato dietro l'altare maggiore.\n\nLa #italic Sancta Camisa#!, il velo della Vergine Maria, che si dice fosse indossato all'Annunciazione, attira i fedeli qui fin dai tempi di Carlo Magno. [target_ruler.GetNameWithNoTooltip] sta molto fermo ed è inaspettatamente commosso."
 pilgrimage_expedition_events.5.a: "Veneriamo la #italic Sancta Camisa#! e preghiamo Nostra Signora."
 pilgrimage_expedition_events.5.b: "La bellezza di questo luogo merita contemplazione."
 pilgrimage_expedition_events.5.c: "Una bella cattedrale. Il nostro popolo ha bisogno di noi a casa."
 pilgrimage_expedition_events.5.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.5.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.5.historical_info: "La cattedrale di Notre-Dame di Chartres è uno dei più begli esempi di architettura gotica francese ed è meta di pellegrinaggio fin dal primo Medioevo. La sua principale reliquia, la #italic Sancta Camisa#!, un pezzo di tessuto ritenuto la tunica indossata dalla Vergine Maria all'Annunciazione, fu donata alla cattedrale da Carlo Magno e sopravvisse a un disastroso incendio nel 1194 che distrusse la precedente struttura romanica. La cattedrale fu ricostruita attorno alla reliquia con straordinaria rapidità, e il suo rosone occidentale e le sue vetrate a lancetta, risalenti al 1220 circa, sono tra le vetrate medievali più celebrate al mondo. La #italic Sancta Camisa#! fece di Chartres uno dei principali luoghi di pellegrinaggio mariano d'Europa."

 pilgrimage_expedition_events.6.title: "Il Santuario del Martire"
 pilgrimage_expedition_events.6.desc: "[current_location.GetName] sorge in una valle poco profonda nella verde campagna [ShowCultureName('english')], e le torri della sua cattedrale si vedono per miglia prima che il viaggiatore arrivi. [current_location.Custom('IT_ART_LOCATION')|U][current_location.GetRank.GetName] è fitta di pellegrini; gli ostelli traboccano in fienili e cortili, e le strade sono piene di gente che parla una dozzina di lingue, tutta diretta nello stesso luogo.\n\nIl Santuario di san Tommaso Becket si trova nella Cappella della Trinità dietro l'altare maggiore. Un tempo era il santuario più riccamente adorno di [ShowScriptedGeographyName('england_geography')]: gioielli, oro, offerte votive di ogni genere. [target_ruler.GetName] si ferma davanti ad esso. Qui un uomo fu abbattuto per aver sfidato un re. Qui quella stessa sfida divenne santità. C'è qualcosa di istruttivo in questo, in un modo o nell'altro."
 pilgrimage_expedition_events.6.a: "Accendiamo una candela e preghiamo al santuario di Becket."
 pilgrimage_expedition_events.6.b: "Commissioniamo una Messa per le anime dei fedeli."
 pilgrimage_expedition_events.6.c: "Il santo ha già avuto abbastanza sovrani che gli rendono omaggio. Torniamo a casa."
 pilgrimage_expedition_events.6.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.6.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.6.historical_info: "Thomas Becket, arcivescovo di Canterbury, fu assassinato nella sua stessa cattedrale da cavalieri che agivano secondo i desideri impliciti del re Enrico II d'Inghilterra il 29 dicembre 1170. La sua morte scosse la cristianità ed egli fu canonizzato appena tre anni dopo, nel 1173. Enrico II fu costretto a fare pubblica penitenza alla tomba di Becket, e il santuario di Becket divenne rapidamente la meta di pellegrinaggio più visitata d'Inghilterra, immortalata nei #italic Racconti di Canterbury#! di Geoffrey Chaucer. Il santuario era adorno di una straordinaria collezione di gioielli e oro donati nel corso di due secoli, tra cui la Regale di Francia, un grande rubino donato da re Luigi VII. Enrico VIII ordinò la distruzione del santuario e la confisca dei suoi tesori nel 1538."

 pilgrimage_expedition_events.7.title: "La Sede di San Patrizio"
 pilgrimage_expedition_events.7.desc: "[current_location.GetName] sorge su una bassa collina nel nord dell'[ShowRegionName('ireland_region')], con le sue due cattedrali visibili dalle campagne circostanti. Non è una grande città, non è [ShowLocationName('rome')], non è [ShowLocationName('jerusalem')], ma porta la propria antichità con quieta autorità. È la più antica comunità [ShowReligionGroupAdjective('christian')] dell'[ShowRegionNameWithNoTooltip('ireland_region')], la sede fondata da san Patrizio in persona quando venne a convertire l'isola.\n\n[target_ruler.GetName] arriva al primo mattino, quando la nebbia si aggrappa ancora alle colline. Un canonico della cattedrale lo accoglie al cancello e lo conduce al luogo dove si dice che Patrizio abbia pregato. L'umiltà del luogo è inattesa e in qualche modo appropriata."
 pilgrimage_expedition_events.7.a: "Assistiamo alla Messa nella Cattedrale di San Patrizio."
 pilgrimage_expedition_events.7.b: "Lasciamo un'offerta al santuario di San Patrizio."
 pilgrimage_expedition_events.7.c: "Una visita compiuta con riverenza. È tempo di tornare."
 pilgrimage_expedition_events.7.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.7.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.7.historical_info: "Armagh è tradizionalmente considerata la capitale ecclesiastica dell'Irlanda, status che rivendica per la sua associazione con san Patrizio, che si dice vi avesse fondato la sua chiesa principale intorno al 445 d.C. La sede di Armagh divenne la sede primaziale della Chiesa irlandese, una posizione contesa tra le cattedrali cattolica e protestante che ancora sorgono sulle due colline della città. Con l'avvicinarsi della Riforma, l'importanza di Armagh risiedeva tanto nel suo peso simbolico, la chiesa dell'apostolo che convertì l'Irlanda, quanto nel suo potere politico, rendendola una meta per i sovrani che volevano dimostrare pietà o solidarietà con la Chiesa irlandese."

 pilgrimage_expedition_events.8.title: "Un Santuario Lungo la Via"
 pilgrimage_expedition_events.8.desc: "[target_ruler.GetName] arriva a [current_location.GetName], un'altra tappa sulla lunga strada della devozione. Qualunque reliquia o memoria di santità abbia attirato per prima i pellegrini qui, continua ad attirarli ancora, generazione dopo generazione, molto tempo dopo che la maggior parte di chi passa di qui ne ha dimenticato i particolari.\n\nCi si ferma tra gli altri viandanti, stanchi e coperti di polvere come il proprio seguito, e si rende grazie per il passaggio sicuro fin qui."
 pilgrimage_expedition_events.8.a: "Rendiamo grazie per il passaggio sicuro."
 pilgrimage_expedition_events.8.b: "Lasciamo un'offerta per i pellegrini che verranno."
 pilgrimage_expedition_events.8.c: "Questo luogo santo è alle nostre spalle. È ora di volgerci verso casa."
 pilgrimage_expedition_events.8.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.8.e: "$pilgrimage_resupply_heavy$"

 pilgrimage_expedition_events.9.title: "Il Pellegrinaggio Finisce nel Dolore"
 pilgrimage_expedition_events.9.desc: "[target_leader.GetName] ha perso la vita lungo la strada, e il pellegrinaggio resta ora incompiuto. La notizia della perdita giungerà lentamente a [ROOT.GetCountry.GetName], portata a casa dai servitori rimasti al suo fianco fino all'ultimo."
 pilgrimage_expedition_events.9.a: "Piangeremo la nostra perdita."

 pilgrimage_expedition_events.17.title: "Il Pellegrinaggio Abbandonato"
 pilgrimage_expedition_events.17.desc: "[target_leader.GetName] volge verso casa con il voto non mantenuto, il pellegrinaggio abbandonato da qualche parte prima della fine. La notizia del voto infranto giunge a [ROOT.GetCountry.GetName] prima del suo ritorno, e ne resterà memoria a lungo presso [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], dopo che la [ROOT.GetCountry.GetGovernment.GetCourtTitle] sarà passata oltre."
 pilgrimage_expedition_events.17.a: "Torniamo nella vergogna, con il nostro voto a Dio non adempiuto."

 pilgrimage_expedition_events.10.title: "Il Poverello di Assisi"
 pilgrimage_expedition_events.10.desc: "[target_ruler.GetName] sale l'ultimo pendio verso [current_location.GetName], e la grande basilica si leva davanti, in due ordini di pallida pietra, costruita nel fianco stesso della collina ed eretta con sorprendente rapidità dopo la morte dell'uomo che onora: un mendicante che non possedeva nulla e che ora domina una delle più magnifiche chiese d'Italia.\n\nNella chiesa inferiore, in una cripta scavata nella roccia viva, giace Francesco d'Assisi in persona. Ci si inginocchia davanti alla tomba di un uomo che rinunciò a seta e oro per una cintura di corda e piedi nudi, e che si dice abbia predicato agli uccelli e addomesticato un lupo. La contraddizione tra la povertà del santo e lo splendore eretto in sua memoria non passa inosservata."
 pilgrimage_expedition_events.10.a: "Inginocchiamoci con umiltà, come avrebbe fatto Francesco stesso."
 pilgrimage_expedition_events.10.b: "Facciamo l'elemosina ai poveri fuori, nello spirito del santo."
 pilgrimage_expedition_events.10.c: "Abbiamo reso omaggio. È tempo di tornare."
 pilgrimage_expedition_events.10.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.10.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.10.historical_info: "Francesco d'Assisi (1181/2-1226) rinunciò alla ricchezza della propria famiglia per vivere in povertà, fondando l'Ordine francescano su principi di umiltà, predicazione itinerante e servizio ai poveri e ai malati. Fu canonizzato da papa Gregorio IX nel 1228, appena due anni dopo la morte, una delle canonizzazioni più rapide della storia medievale. La costruzione della Basilica di San Francesco iniziò quello stesso anno e fu in gran parte completata nel 1253, con le sue chiese inferiore e superiore adornate in seguito da affreschi attribuiti a Cimabue e Giotto. Nonostante il rifiuto del santo per la ricchezza materiale, Assisi divenne una delle grandi mete di pellegrinaggio dell'Europa cattolica, attirando sovrani e comuni pellegrini."

 pilgrimage_expedition_events.11.title: "Il Santo dei Marinai"
 pilgrimage_expedition_events.11.desc: "[current_location.GetName] sa di mare ben prima che [target_ruler.GetName] raggiunga le sue mura: [current_location.Custom('IT_ART_LOCATION')][current_location.GetRank.GetName] portuale ruota attorno a un unico grande tesoro. Sotto gli archi romanici della basilica giace la tomba di Nicola di Myra, portato qui da marinai del luogo oltre cent'anni fa, sottratto alle chiese in rovina di un Oriente cristiano non più in grado di proteggerle.\n\nUna volta all'anno, la tomba viene aperta e dal contorno delle ossa del santo viene prelevato un liquido limpido, la #italic manna#! che i fedeli, [ShowReligionAdjective('catholic')] e [ShowReligionAdjective('orthodox')] allo stesso modo, credono abbia il potere di guarire. A [target_ruler.GetName] viene mostrata una fiala di essa, e colpisce il pensiero che nessun altro santuario di questo pellegrinaggio sia venerato così completamente da entrambi i rami della cristianità contemporaneamente."
 pilgrimage_expedition_events.11.a: "Veneriamo la tomba e riceviamo una fiala di manna."
 pilgrimage_expedition_events.11.b: "Commissioniamo una Messa per i marinai che portarono il santo a casa."
 pilgrimage_expedition_events.11.c: "Il santo ci ha benedetti. Ora torniamo a casa."
 pilgrimage_expedition_events.11.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.11.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.11.historical_info: "Nel 1087, sessantadue marinai di Bari salparono per Myra in Licia, allora minacciata dalla conquista selgiuchide, e portarono via le ossa di san Nicola prima che andassero perdute o distrutte. Le reliquie giunsero a Bari il 9 maggio 1087, ancora oggi celebrato come Festa della Traslazione, e la Basilica di San Nicola fu eretta per ospitarle, con la cripta consacrata alla presenza di papa Urbano II nel 1089. Dall'arrivo delle reliquie, un liquido limpido che i fedeli chiamano #italic manna#! continua a formarsi attorno alle ossa e viene prelevato ogni anno dall'arcivescovo di Bari. Patrono di marinai, mercanti e bambini, e uno dei pochi santi venerati con uguale devozione sia nel mondo cattolico sia in quello ortodosso, Nicola fece di Bari una meta di pellegrinaggio unica in Italia."

 pilgrimage_expedition_events.12.title: "La Consacrazione degli Angeli"
 pilgrimage_expedition_events.12.desc: "L'abbazia benedettina di [current_location.GetName] sorge al margine di una foresta oscura negli altipiani [ShowCultureGroupName('swiss_group')], con i suoi monaci in nero discendenti da un unico eremita ucciso da dei ladri in questo luogo generazioni fa. [target_ruler.GetName] ha sentito la storia fin dall'infanzia: come la cappella qui non fu consacrata da alcun vescovo, ma da Cristo stesso, disceso con un coro di angeli e santi alla vigilia della dedicazione.\n\nNella Cappella della Madonna si trova l'oggetto di quella prima, controversa consacrazione: una piccola statua della Vergine, scurita da secoli di fumo di candele fino a un nero profondo. Pellegrini da tutte le terre di lingua tedesca si inginocchiano davanti a lei in una fila ininterrotta che si estende più indietro di quanto [target_ruler.GetNameWithNoTooltip] possa facilmente immaginare."
 pilgrimage_expedition_events.12.a: "Inginocchiamoci davanti alla Madonna Nera in silenziosa devozione."
 pilgrimage_expedition_events.12.b: "Dotiamo la rinomata biblioteca e lo scriptorium dell'abbazia."
 pilgrimage_expedition_events.12.c: "Abbiamo visto abbastanza di questi boschi oscuri. Avanti."
 pilgrimage_expedition_events.12.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.12.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.12.historical_info: "Einsiedeln fa risalire le proprie origini all'eremita Meinrado, che si stabilì in questa foresta e fu ucciso da ladri nell'861. Un monastero formale fu fondato sul sito nel 934 dal monaco Eberardo e, secondo una leggenda duratura, la sua cappella fu miracolosamente consacrata da Cristo in persona nella notte del 14 settembre 948, affermazione in seguito confermata da papa Leone VIII. La Madonna Nera dell'abbazia è stata per secoli oggetto di devozione di pellegrinaggio, facendo di Einsiedeln uno dei santuari mariani più visitati del mondo di lingua tedesca."

 pilgrimage_expedition_events.13.title: "La Collina Luminosa"
 pilgrimage_expedition_events.13.desc: "#italic Jasna Góra#!, la Collina Luminosa, si leva sopra la pianura ben prima che [target_ruler.GetName] raggiunga le porte del monastero, con le sue bianche mura che catturano la luce in un modo che i monaci paolini che le costruirono certamente intendevano. All'interno, dietro un muro di argento votivo e candele accese, pende l'icona dal volto scuro della Vergine che ha reso [current_location.Custom('IT_ART_LOCATION')][current_location.GetRank.GetName] di cultura [ShowCultureGroupName('polish_group')] una meta di pellegrini da tutto il nord.\n\n[target_ruler.GetName] osserva da vicino il volto della Madonna e le vede: due cicatrici parallele sulla guancia destra, vecchie ferite che nessun restauro ha mai cancellato del tutto. La spada di un predone la colpì una volta, molto tempo fa, e i monaci che la ridipinsero poi trovarono i tagli che sanguinavano attraverso la pittura fresca, ancora e ancora, finché rinunciarono a nascondere ciò che era stato fatto."
 pilgrimage_expedition_events.13.a: "Veneriamo l'icona e le sue ferite durature."
 pilgrimage_expedition_events.13.b: "Promettiamo oro per le fortificazioni, perché resti inviolata."
 pilgrimage_expedition_events.13.c: "Abbiamo visto la Collina Luminosa. Torniamo a casa."
 pilgrimage_expedition_events.13.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.13.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.13.historical_info: "Il monastero paolino di Jasna Góra fu fondato nel 1382 dal duca Ladislao di Opole, che portò con sé un'icona della Vergine con il Bambino in stile bizantino, già venerata come miracolosa. A Pasqua del 1430, una banda di predoni ussiti provenienti da Boemia, Moravia e Slesia prese d'assalto il monastero, spezzando l'icona in pezzi e sfregiando il volto della Vergine due volte con una sciabola. I restauratori della corte reale di Władysław Jagiełło a Cracovia riparono il pannello, ma le cicatrici riapparvero attraverso ogni nuovo strato di pittura e furono infine lasciate come tratto permanente e deliberato dell'immagine. Nostra Signora di Częstochowa divenne il preminente santuario mariano della Polonia, con il suo volto sfregiato copiato su icone in tutta la regione per secoli."

 pilgrimage_expedition_events.14.title: "La Sede di Santo Stefano"
 pilgrimage_expedition_events.14.desc: "[current_location.GetName] sorge dove il Danubio piega, con la collina della cattedrale che domina il fiume che un tempo segnava il margine dell'Europa cristiana. Qui, in una cappella da tempo ricostruita e ricostruita ancora, Stefano d'Ungheria nacque, fu battezzato e, in un giorno d'inverno al volgere del millennio, fu incoronato primo re cristiano del suo popolo.\n\n[target_ruler.GetName] viene ricevuto dall'arcivescovo di [current_location.GetNameWithNoTooltip], primate d'Ungheria, successore della sede che Stefano stesso fondò. L'arcivescovo parla del giovane re che scelse il battesimo al posto dei vecchi dèi, che costruì questa chiesa prima del proprio palazzo e che fu canonizzato nel giro di pochi decenni dalla morte, proprio perché aveva compreso che una corona cristiana deve poggiare su una chiesa cristiana."
 pilgrimage_expedition_events.14.a: "Rendiamo omaggio all'eredità di Santo Stefano in silenziosa preghiera."
 pilgrimage_expedition_events.14.b: "Conferiamo a lungo con l'arcivescovo primate d'Ungheria."
 pilgrimage_expedition_events.14.c: "Una visita adatta a un sovrano cristiano. È tempo di partire."
 pilgrimage_expedition_events.14.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.14.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.14.historical_info: "Stefano I d'Ungheria nacque intorno al 975 a Esztergom e vi fu incoronato all'approssimarsi del Natale dell'anno 1000, evento che segnò la nascita formale del Regno cristiano d'Ungheria. Stefano fondò l'arcidiocesi di Esztergom nel 1001, la più antica del paese, e i suoi arcivescovi detengono da allora il rango di primate d'Ungheria. Esztergom fu la capitale politica e religiosa del regno fino alla metà del XIII secolo, e la canonizzazione di Stefano nel 1083 consolidò il posto della città come cuore spirituale del cristianesimo ungherese."

 pilgrimage_expedition_events.15.title: "La Nazaret della Croazia"
 pilgrimage_expedition_events.15.desc: "Sulla collina sopra [current_location.GetName], che domina la baia, sorge una modesta chiesa francescana costruita attorno a uno spazio vuoto dove, insistono i pellegrini di qui, un tempo si trovava qualcosa di straordinario. Per tre anni, dicono, la casa stessa della Sacra Famiglia si trovò su questo suolo, portata intera da Nazaret dagli angeli quando la Terra Santa divenne troppo pericolosa per proteggerla, prima di proseguire il suo miracoloso viaggio verso Loreto in Italia.\n\n[target_ruler.GetName] viene condotto a vedere il dipinto che il Papa inviò per consolare [current_location.Custom('IT_ART_LOCATION')][current_location.GetRank.GetName] per la partenza della casa: la Vergine che allatta Gesù Bambino, si dice opera di san Luca in persona. Da allora ha attirato pellegrini su questo pendio per generazioni, un santuario di qualcosa che non c'è più, eppure in qualche modo c'è ancora."
 pilgrimage_expedition_events.15.a: "Veneriamo il dipinto di Nostra Signora di Tersatto."
 pilgrimage_expedition_events.15.b: "Commissioniamo una Messa per un passaggio sicuro, dato che [current_location.Custom('IT_ART_LOCATION')][current_location.GetRank.GetNameWithNoTooltip] vive di mare."
 pilgrimage_expedition_events.15.c: "La casa è proseguita per Loreto. Così dobbiamo fare noi, verso casa."
 pilgrimage_expedition_events.15.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.15.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.15.historical_info: "Secondo la tradizione, la Santa Casa di Nazaret, dimora della Vergine Maria, fu portata dagli angeli sulla collina di Tersatto sopra Fiume il 10 maggio 1291, restandovi per tre anni prima di proseguire per Loreto in Italia il 10 dicembre 1294. Nikola I Frankopan eresse la prima chiesa sul sito per segnare dove la casa era stata. Nel 1367 papa Urbano V inviò al santuario un dipinto della Vergine con il Bambino, tradizionalmente attribuito a san Luca, come consolazione per la partenza della casa, e i frati francescani custodiscono il santuario dal secolo successivo. La leggenda valse alla città il suo duraturo epiteto: la Nazaret della Croazia."

 pilgrimage_expedition_events.16.title: "Il Re Martire"
 pilgrimage_expedition_events.16.desc: "La cattedrale di [current_location.GetName] si leva austera e grigia contro il cielo del nord, costruita sul banco di sabbia dove la tomba di un re fu aperta poco più di un anno dopo la sua morte e si scoprì, con lo stupore di tutti i presenti, che il suo corpo non si era decomposto. I suoi capelli e le sue unghie, dice la storia, avevano continuato a crescere nella terra scura, e una dolce fragranza si levava dalla bara dove avrebbe dovuto esserci il fetore della morte.\n\n[target_ruler.GetName] sta davanti al santuario di Olav Haraldsson, un tempo signore della guerra vichingo caduto in battaglia nel tentativo di imporre il cristianesimo a un regno che non lo voleva, e che fu dichiarato santo entro un anno dalla morte per sola acclamazione, senza bisogno di alcun papa lontano. È, riflette [target_ruler.GetNameWithNoTooltip], uno strano tipo di santità: conquistata non con la mite pietà, ma con la spada, e morendo per una causa che solo a posteriori apparve giusta."
 pilgrimage_expedition_events.16.a: "Veneriamo il re incorrotto al suo santuario."
 pilgrimage_expedition_events.16.b: "La lezione di Olav: la fede per mezzo della spada è comunque fede."
 pilgrimage_expedition_events.16.c: "Un luogo freddo e santo. Torniamo a casa."
 pilgrimage_expedition_events.16.d: "$pilgrimage_resupply_light$"
 pilgrimage_expedition_events.16.e: "$pilgrimage_resupply_heavy$"
 pilgrimage_expedition_events.16.historical_info: "Olav Haraldsson, re di Norvegia, morì nella battaglia di Stiklestad il 29 luglio 1030, combattendo per riconquistare il trono e completare la cristianizzazione del suo regno con la forza delle armi. Quando la sua tomba fu aperta un anno e cinque giorni dopo, il 3 agosto 1031, il vescovo Grimkell trovò il corpo apparentemente non decomposto e dichiarò Olav santo in base a quella sola scoperta, una canonizzazione locale poi confermata da papa Alessandro III nel 1164. La cattedrale di Nidaros fu eretta sul suo santuario e divenne la preminente meta di pellegrinaggio del Nord, attirando fedeli da tutta la Scandinavia e oltre lungo una rete di strade ancora oggi percorse come Vie di Sant'Olav."

 pilgrimage_expedition_events.18.title: "Il Passo di Montagna"
 pilgrimage_expedition_events.18.desc: "La strada sale in una zona brulla e spazzata dal vento, con la via che si restringe in un sentiero lungo la spalla della montagna. [target_ruler.GetName] si ferma dove il sentiero si divide: un percorso più lungo che aggira il peggio della salita, e uno diretto che i pastori locali dicono non sempre sia sopravvissuto agli impreparati.\n\nSi soppesa la montagna contro il calendario. Ogni giorno speso a cercare una via più facile è un giorno in cui la compagnia non si avvicina alla fine del viaggio."
 pilgrimage_expedition_events.18.a: "Assoldiamo guide locali che conoscono ogni punto d'appoggio sicuro."
 pilgrimage_expedition_events.18.b: "Proseguiamo senza di loro e confidiamo nella fede e nel passo."
 pilgrimage_expedition_events.18.c: "Torniamo indietro e prendiamo la strada più lunga attorno alla catena."
 pilgrimage_expedition_events.18.d: "Rimandiamo i ritardatari giù per la montagna da soli."

 pilgrimage_expedition_events.19.title: "Tempesta in Mare"
 pilgrimage_expedition_events.19.desc: "Il cielo sopra la nave si fa scuro senza preavviso, e nel giro di un'ora l'equipaggio combatte onde che si infrangono nette sul parapetto. [target_ruler.GetName] viene scagliato contro l'albero prima di trovare un appiglio, e il ponte sotto di sé beccheggia come qualcosa di vivo.\n\nSottocoperta, i pellegrini si aggrappano a qualsiasi cosa sia fissata e pregano in una dozzina di dialetti insieme. C'è poco altro da fare finché il mare non decide di aver finito con loro."
 pilgrimage_expedition_events.19.a: "Resistiamo sottocoperta e speriamo che la nave regga."
 pilgrimage_expedition_events.19.b: "Raduniamo la compagnia sul ponte e preghiamo durante la tempesta."
 pilgrimage_expedition_events.19.c: "Alleggeriamo la nave mettendo parte del seguito sulle barche."
 pilgrimage_expedition_events.19.afloat_tt: "L'equipaggio riesce a tenere a galla la nave"
 pilgrimage_expedition_events.19.off_course_tt: "La tempesta getta la nave gravemente fuori rotta"
 pilgrimage_expedition_events.19.faith_protects_tt: "La nostra fede ci protegge durante la tempesta"
 pilgrimage_expedition_events.19.piety_lacking_tt: "La nostra pietà si rivela insufficiente contro la tempesta"

 pilgrimage_expedition_events.20.title: "Guadare il Fiume"
 pilgrimage_expedition_events.20.desc: "La strada termina bruscamente a un fiume che corre alto e bruno per le recenti piogge, con il guado che dovrebbe esserci sommerso da una corrente abbastanza forte da far perdere l'equilibrio a un cavallo. Un traghettatore osserva dalla riva opposta, senza fretta di attraversare finché non vede il colore della buona moneta.\n\n[target_ruler.GetName] scruta l'acqua e il traghettatore a turno. Nessuno dei due sembra particolarmente affidabile oggi."
 pilgrimage_expedition_events.20.a: "Paghiamo il traghettatore per un passaggio sicuro."
 pilgrimage_expedition_events.20.b: "Guadiamo il fiume direttamente e risparmiamo il pedaggio."
 pilgrimage_expedition_events.20.c: "Mandiamo parte del seguito a trovare un proprio attraversamento."

 pilgrimage_expedition_events.21.title: "Febbre nelle Paludi"
 pilgrimage_expedition_events.21.desc: "La strada affonda in acque basse e stagnanti per miglia e miglia, e l'aria si addensa dell'odore di marcio e di insetti che pungono. Nel giro di pochi giorni, le tossi si trasformano in febbri tra il seguito, e più di un viaggiatore deve essere trasportato anziché camminare.\n\n[target_ruler.GetName] osserva la compagnia farsi più sottile e più silenziosa a ogni miglio attraverso questa terra, e si chiede quanti di loro si fossero imbarcati per un pellegrinaggio anziché per una pestilenza."
 pilgrimage_expedition_events.21.a: "Procediamo in fretta e lasciamoci alle spalle le paludi."
 pilgrimage_expedition_events.21.b: "Fermiamoci e lasciamo che i malati si riprendano prima di proseguire."

 pilgrimage_expedition_events.22.title: "L'Inverno Chiude la Strada"
 pilgrimage_expedition_events.22.desc: "La neve si richiude sul passo davanti a noi in cumuli più alti di un uomo, e gli abitanti dei villaggi dicono chiaramente che nessuno attraversa questa strada fino alla primavera. [target_ruler.GetName] non aveva previsto una stagione persa per il maltempo, ma la montagna non consulta i piani di viaggio.\n\nC'è una città vicina con spazio a sufficienza per la compagnia, se la borsa può sostenere l'alloggio. Oppure ci sono guide, a pagamento, che affermano di conoscere una via anche ora."
 pilgrimage_expedition_events.22.a: "Attendiamo la fine dell'inverno nella città vicina."
 pilgrimage_expedition_events.22.b: "Paghiamo guide e carri per aprirci un varco."

 pilgrimage_expedition_events.23.title: "L'Ospitalità di un Signore"
 pilgrimage_expedition_events.23.desc: "La notizia dell'avvicinarsi del pellegrinaggio ha viaggiato più in fretta della compagnia stessa, e il signore locale cavalca di persona per accogliere [target_ruler.GetName] con un invito a riposare alla propria tavola prima di proseguire. L'ospitalità offerta è generosa, chiaramente pensata per essere vista e ricordata.\n\nL'offerta viene riconosciuta per ciò che è: pietà e prestigio insieme, se accettata con la giusta grazia."
 pilgrimage_expedition_events.23.a: "Accettiamo l'ospitalità con garbo."
 pilgrimage_expedition_events.23.a.host_opinion_tt: "[scope:host_lord.GetName] ottiene +20 di [opinion|E] nei nostri confronti"
 pilgrimage_expedition_events.23.b: "Rifiutiamo l'indugio e preghiamo invece in privato."

 pilgrimage_expedition_events.24.title: "Il Pedaggio di un Signore Ostile"
 pilgrimage_expedition_events.24.desc: "La strada davanti a noi attraversa le terre di un signore che annovera [ROOT.GetCountry.GetName] tra i suoi nemici, e i suoi uomini attendono al confine con un casello e una richiesta. [target_ruler.GetName] aveva sperato di passare in silenzio. Quella speranza muore alla vista delle picche attraverso la strada.\n\nL'esattore del pedaggio indica un prezzo che è meno un'offerta che un insulto, e attende di vedere quanto valga il suo orgoglio."
 pilgrimage_expedition_events.24.a: "Paghiamo il pedaggio richiesto."
 pilgrimage_expedition_events.24.b: "Forziamo il passaggio con il seguito che abbiamo."
 pilgrimage_expedition_events.24.c: "Deviamo e troviamo una via più lunga attorno alle sue terre."

 pilgrimage_expedition_events.25.title: "Di un'Altra Fede"
 pilgrimage_expedition_events.25.desc: "La strada passa accanto a un santuario sacro ai credenti [current_location.GetDominantReligion.GetAdjective], con icone e riti sconosciuti. [target_ruler.GetName] osserva i fedeli locali compiere le proprie devozioni, curiosi e un po' diffidenti verso i nuovi arrivati di passaggio.\n\nC'è un'antica abitudine tra i pellegrini di discutere di fede con chiunque voglia ascoltare. Si soppesa se oggi sia il giorno di concedersela."
 pilgrimage_expedition_events.25.a: "Discutiamo con la gente del posto i meriti della vera fede."
 pilgrimage_expedition_events.25.b: "Lasciamo dormire il cane che dorme e passiamo oltre in silenzio."

 pilgrimage_expedition_events.26.title: "Banditi sulla Strada"
 pilgrimage_expedition_events.26.desc: "La natura selvaggia inghiotte la strada per un tratto in cui nessun editto signorile la protegge, e figure emergono dal limitare degli alberi prima che la compagnia possa reagire: armate, cenciose e chiaramente avvezze a derubare i viaggiatori. [target_ruler.GetName] li conta in fretta. Sono abbastanza da costituire un problema, e troppo pochi per essere un esercito.\n\nIl loro capo si fa avanti e fissa un prezzo per il passaggio sicuro, con un tono che chiarisce cosa accade se verrà rifiutato."
 pilgrimage_expedition_events.26.a: "Paghiamoli e chiudiamo la questione."
 pilgrimage_expedition_events.26.b: "Resistiamo e combattiamo per l'onore del pellegrinaggio."
 pilgrimage_expedition_events.26.c: "Compriamo il passaggio sicuro lasciando parte del seguito ai banditi."

 pilgrimage_expedition_events.27.title: "Pellegrini si Uniscono al Corteo"
 pilgrimage_expedition_events.27.desc: "La voce di un pellegrinaggio reale sulla strada viaggia in anticipo, e quando [target_ruler.GetName] raggiunge il successivo incrocio, vi si è radunata una cenciosa colonna di comuni pellegrini, che sperano di percorrere il resto della via sotto la protezione del seguito di un sovrano.\n\nTra loro ci sono famiglie, e vecchi a piedi che da soli non andranno molto più lontano. Non si può nutrire per sempre l'intera compagnia, ma respingerli qui significherebbe respingerli a cavarsela da soli."
 pilgrimage_expedition_events.27.a: "Accogliamoli nella compagnia."
 pilgrimage_expedition_events.27.b: "Respingiamoli per mantenere il passo."

 pilgrimage_expedition_events.29.title: "Corsari al Largo della Costa"
 pilgrimage_expedition_events.29.desc: "Uno scafo basso e scuro taglia l'orizzonte, con i remi che luccicano al sole, avvicinandosi alla nave dei pellegrini più in fretta di quanto qualunque onesto mercante abbia motivo di muoversi. [target_ruler.GetName] riconosce la sagoma di un corsaro ben prima che la vedetta la segnali, e non c'è porto, né riva, né aiuto a portata.\n\nSi radunano sul ponte gli uomini d'arme che il seguito può mettere insieme, e si soppesa se bastino, o se le scorte della nave valgano più della battaglia."
 pilgrimage_expedition_events.29.a: "Prendiamo le armi e respingiamoli."
 pilgrimage_expedition_events.29.b: "Cediamo le scorte della nave e speriamo si accontentino."
 pilgrimage_expedition_events.29.c: "Compriamo la salvezza della nave con parte del nostro seguito."

 pilgrimage_expedition_events.30.title: "Tenuti in Ostaggio"
 pilgrimage_expedition_events.30.desc: "Con il seguito assottigliato dalla strada, [target_ruler.GetName] è un bersaglio facile, e qualcuno lungo il cammino se n'è accorto. Uomini armati si stringono attorno alla compagnia prima che si possa radunare una guardia adeguata, con il loro capo che indica un prezzo per la libertà del sovrano con la stessa noncuranza di un mercante che indica il costo del pane.\n\nRestano pochi uomini cui fare appello, e ancora meno buone opzioni."
 pilgrimage_expedition_events.30.a: "Paghiamo il riscatto richiesto."
 pilgrimage_expedition_events.30.b: "Tentiamo di svignarcela col favore dell'oscurità."

 pilgrimage_expedition_events.28.title: "Dispense Vuote"
 pilgrimage_expedition_events.28.desc: "Le scorte della compagnia si sono esaurite da qualche parte oltre l'ultima città degna del nome, e le pance del seguito sono diventate vuote come i sacchi che un tempo contenevano il loro pane. [target_ruler.GetName] non ha mai guidato un esercito, e si vede: la fame non si cura della santità della strada davanti a noi.\n\nLa terra qui è almeno abbastanza gentile da offrire qualcosa: campi, frutteti e un mercato di villaggio a portata, se la compagnia è disposta a spendere il tempo, la moneta o l'orgoglio necessari per servirsene."
 pilgrimage_expedition_events.28.a: "Mandiamo il seguito a foraggiare nella campagna."
 pilgrimage_expedition_events.28.b: "Compriamo qualunque cibo si trovi, a qualunque prezzo richiesto."
 pilgrimage_expedition_events.28.c: "Non c'è altro da fare. Torniamo indietro."

 pilgrimage_resupply_light: "Paghiamo la gente del posto per cavalcature fresche, cibo e braccianti."
 pilgrimage_resupply_heavy: "Non badiamo a spese per rifornire completamente e rinforzare il seguito."

