l_english:

 grand_embassy.1.title: "Preparare la delegazione"
 grand_embassy.1.desc: "Prima della partenza della delegazione, dobbiamo decidere come presentarla. Un sovrano condotto tra banchetti e alloggi sorvegliati vede soltanto ciò che l'ospite vuole mostrargli: le officine, i bacini di carenaggio e i campi di addestramento restano preclusi agli ospiti d'onore. [figurehead.GetName] viaggerà come volto pubblico della delegazione, mentre [target_ruler.GetName] si muoverà tra il seguito, senza dare nell'occhio. Fino a che punto dobbiamo spingerci per mantenere il segreto?"
 grand_embassy.1.a: "Prepariamo la delegazione come qualsiasi altra."
 grand_embassy.1.a.tt: "Preparativi ordinari, segretezza ordinaria (Discrezione: 55)"
 grand_embassy.1.b: "Facciamo di tutto per preservare la segretezza."
 grand_embassy.1.b.tt: "Un'attenzione ulteriore garantisce un vero anonimato (Discrezione: 75)"
 grand_embassy.1.c: "Inviamo delegazioni civetta."
 grand_embassy.1.c.tt: "Le esche fanno perdere le tracce (Discrezione: 95)"

 grand_embassy.2.title: "Presentare la delegazione a [embassy_country.GetCapital.GetNameWithNoTooltip]"
 grand_embassy.2.desc.port: "La delegazione è giunta a [embassy_country.GetCapital.GetName]. Siamo venuti per ottenere accesso ai bacini di carenaggio e agli arsenali dove [embassy_country.GetName] costruisce le flotte che le garantiscono la supremazia sul mare. Il modo in cui ci presenteremo al [embassy_country.GetGovernment.GetCourtTitle] determinerà quanto ci verrà realmente mostrato."
 grand_embassy.2.desc.inland: "La delegazione è giunta a [embassy_country.GetCapital.GetName]. Siamo venuti per ottenere accesso alle officine e ai campi di addestramento dove gli artigiani e i maestri d'armi [embassy_country.Custom('IT_Di')][embassy_country.GetName] hanno già rinnovato il commercio e l'esercito. Il modo in cui ci presenteremo al [embassy_country.GetGovernment.GetCourtTitle] determinerà quanto ci verrà realmente mostrato."
 grand_embassy.2.a: "Che parli [figurehead.GetShortNameWithNoTooltip]; [target_ruler.GetShortNameWithNoTooltip] resta con il seguito."
 grand_embassy.2.a_no_figurehead: "Teniamo [target_ruler.GetShortNameWithNoTooltip] tra il seguito."
 grand_embassy.2.b: "Presentiamo apertamente [target_ruler.GetShortNameWithNoTooltip], per ciò che è realmente."
 grand_embassy.2.c: "Evitiamo il [embassy_country.GetGovernment.GetCourtTitle]. Non siamo venuti qui per farci vedere."

 grand_embassy.3.title: "Una delegazione a corte"
 grand_embassy.3.desc.unaware: "Una delegazione di [from.GetName] è giunta presso il [ROOT.GetCountry.GetGovernment.GetCourtTitle]: viaggiatori senza alcun rango particolare, a detta loro, desiderosi di vedere come si fanno le cose [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName]. Li lasciamo entrare nelle nostre officine e nelle nostre istituzioni, o li rimandiamo per la loro strada?"
 grand_embassy.3.desc.aware: "Il [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha scoperto in via riservata chi viaggia davvero con questa delegazione. Smascherare apertamente [target_ruler.GetName] metterebbe tutti in imbarazzo, eppure ospitare un sovrano disposto a imparare dalle meraviglie [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName], seppur in incognito, è un onore non da poco. A quanto pare, la discrezione funziona in entrambi i sensi."
 grand_embassy.3.a: "Concediamo loro l'accesso."
 grand_embassy.3.b: "Le nostre meraviglie sono per tutti."
 grand_embassy.3.c: "Non permetteremo a degli stranieri di carpire i nostri segreti."
 grand_embassy.3.d: "Concediamo loro l'accesso, con discrezione."
 grand_embassy.3.e: "Ospiti così importanti possono ammirare le nostre meraviglie senza ostacoli."
 grand_embassy.3.f: "[target_ruler.GetShortNameWithNoTooltip], sappiamo chi siete, e qui non siete il benvenuto."

 grand_embassy.4.title: "Un'accoglienza prolungata"
 grand_embassy.4.desc: "Ora che la verità su chi viaggia con la delegazione è nota, il [embassy_country.GetGovernment.GetCourtTitle] [embassy_country.Custom('IT_Di')][embassy_country.GetName] ha esteso un invito: fermarci ancora un po' e vedere di più di ciò che c'è da vedere."
 grand_embassy.4.a: "Accettiamo l'invito con gratitudine."
 grand_embassy.4.b: "Imploriamo un soggiorno ancora più lungo."

 grand_embassy.6.title: "Un invito che non si può rifiutare"
 grand_embassy.6.desc: "A [embassy_country.GetCapital.GetName] è giunta voce di chi viaggia davvero con la delegazione. Il [embassy_country.GetGovernment.GetCourtTitle] ha perso la pazienza per la finzione e ora convoca [target_ruler.GetName] perché si presenti, non come un ospite che può declinare, ma come il sovrano che è. Non c'è più margine di manovra: o si affronta la corte, o si torna indietro adesso."
 grand_embassy.6.a: "Affrontiamo la corte."
 grand_embassy.6.b: "Abbandoniamo l'ambasciata."

 grand_embassy.7.title: "Le lezioni sono esaurite"
 grand_embassy.7.desc: "La delegazione ha esaurito ogni possibilità offerta [embassy_country.Custom('IT_Dalla')][embassy_country.GetName] e ora deve scegliere se proseguire verso un'altra corte o tornare in patria per mettere a frutto ciò che ha imparato."
 grand_embassy.7.a: "Torniamo in patria."
 grand_embassy.7.b: "Proseguiamo verso [target_1.GetNameWithNoTooltip]."
 grand_embassy.7.c: "Puntiamo invece su [target_2.GetNameWithNoTooltip]."
 grand_embassy.7.d: "Rivolgiamo lo sguardo a [target_3.GetNameWithNoTooltip]."
 grand_embassy.7.e: "Resta ancora [target_4.GetNameWithNoTooltip] da visitare."
 grand_embassy.7.f: "Dirigiamo la delegazione verso [target_5.GetNameWithNoTooltip]."

 grand_embassy.5.title: "L'ambasciata è stata respinta"
 grand_embassy.5.desc: "A [ROOT.GetCountry.GetCapital.GetName] è giunta notizia che il [embassy_country.GetGovernment.GetCourtTitle] di [embassy_country.GetCapital.GetName] si è rifiutato di ricevere [target_ruler.GetName] e la delegazione. Non è stata fornita alcuna ragione che il cronista ritenga degna di essere annotata. Il rifiuto riduce il prestigio dell'ambasciata; l'ambasciata stessa, tuttavia, non è ancora giunta al termine."
 grand_embassy.5.a: "Torniamo in patria."
 grand_embassy.5.b: "Salviamo il salvabile a [target_1.GetNameWithNoTooltip]."
 grand_embassy.5.c: "Cerchiamo un'accoglienza più calorosa a [target_2.GetNameWithNoTooltip]."
 grand_embassy.5.d: "[target_3.GetNameWithNoTooltip] potrebbe rivelarsi più ospitale."
 grand_embassy.5.e: "Tentiamo invece la sorte a [target_4.GetNameWithNoTooltip]."
 grand_embassy.5.f: "Resta ancora [target_5.GetNameWithNoTooltip] a cui rivolgerci."

 grand_embassy.discretion_down_4_tt: "Un lampo di riconoscimento (#R -4#! Discrezione)"
 grand_embassy.discretion_down_5_tt: "Restano meno posti dove nascondersi (#R -5#! Discrezione)"
 grand_embassy.discretion_down_10_tt: "La corte inizia a sospettare (#R -10#! Discrezione)"
 grand_embassy.discretion_down_20_tt: "Troppi favori attirano troppi sguardi (#R -20#! Discrezione)"
 grand_embassy.discretion_down_30_tt: "La copertura è saltata (#R -30#! Discrezione)"
 grand_embassy.discretion_up_10_tt: "Siamo rimasti lontani dai riflettori (#G +10#! Discrezione)"
 grand_embassy.discretion_set_0_tt: "La finzione è finita (Discrezione: 0)"
 grand_embassy.modernization_up_0to10_tt: "La lezione si apprende meglio non visti (#G Da +0 a +10#! Modernizzazione)"
 grand_embassy.opportunities_set_1_tt: "A uno straniero viene mostrato ben poco (Opportunità: 1)"
 grand_embassy.opportunities_set_2_tt: "Alcune porte si aprono comunque (Opportunità: 2)"
 grand_embassy.opportunities_set_3_tt: "Ogni porta ci è aperta (Opportunità: 3)"
 grand_embassy.opportunities_set_4_tt: "Non ci viene nascosto proprio nulla (Opportunità: 4)"
 grand_embassy.opportunities_up_1_tt: "L'invito apre un'altra porta (#G +1#! Opportunità)"
 grand_embassy.opportunities_up_2_tt: "La perseveranza, per quanto poco dignitosa, ne apre altre due (#G +2#! Opportunità)"
 grand_embassy.opportunities_down_1_tt: "La giornata è trascorsa (#R -1#! Opportunità)"

 received_grand_embassy: "Grande Ambasciata ricevuta"
 rejected_grand_embassy: "Grande Ambasciata respinta"
 humiliated_grand_embassy: "Grande Ambasciata umiliata"

 grand_embassy.8.title: "Guai in patria"
 grand_embassy.8.desc: "Alla delegazione è giunta notizia che in patria sono scoppiati dei disordini. Con [target_ruler.GetName] ancora all'estero, [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vogliono sapere perché il loro [ROOT.GetCountry.GetGovernment.GetRulerTitle] non si trovi da nessuna parte. Interrompere ora il viaggio significa tornare a mani vuote. Proseguire significa governare ancora un po' per assenza."
 grand_embassy.8.a: "Dobbiamo tornare in patria subito."
 grand_embassy.8.b: "Le lezioni ancora da imparare valgono il prezzo."

 grand_embassy.modernization_up_5_tt: "La lezione dà buoni frutti (#G +5#! Modernizzazione)"
 grand_embassy.modernization_up_15_tt: "La lezione è stata appresa appieno (#G +15#! Modernizzazione)"
 grand_embassy.discretion_up_20_tt: "Il denaro compra molta dimenticanza (#G +20#! Discrezione)"

 grand_embassy.9.title: "La contabilità"
 grand_embassy.9.desc: "[embassy_country.Custom('IT_In')][embassy_country.GetName], un contabile ci illustra i registri e i ruoli fiscali che mandano avanti il tesoro. Dita macchiate d'inchiostro scorrono lungo ogni colonna senza esitazione, e i totali non sembrano mai mentire. Il contabile registra ogni somma due volte, una come dovuta e una come pagata, in modo che nessuna moneta sfugga, e verifica i conteggi con i manifesti del porto prima che la settimana sia finita. C'è ancora molto da imparare, per chi è disposto a pagare per il tempo del contabile e ha la pazienza di seguirne il metodo fino in fondo."
 grand_embassy.9.a: "Prendiamo nota del metodo."
 grand_embassy.9.b: "Paghiamo per studiare i registri per intero."
 grand_embassy.9.c: "Paghiamo per vedere ogni registro, e restiamo per padroneggiarli."

 grand_embassy.10.title: "I compilatori di almanacchi"
 grand_embassy.10.desc: "Una società di scribi di [embassy_country.GetCapital.GetName] ha preso a contare ogni cosa: nascite, raccolti, navi in porto, perfino il prezzo del pane da una settimana all'altra. I loro registri riempiono intere scaffalature, ogni colonna datata e confrontata con la precedente, finché i numeri stessi iniziano a raccontare una storia che nessun cronista saprebbe raccontare. I loro almanacchi pretendono di mostrare un regno più fedelmente di qualunque cronaca, prevedendo carestia e abbondanza da schemi che solo loro paiono notare. Per un compenso, spiegheranno i loro metodi a chiunque abbia la pazienza di sorbirsi l'aritmetica."
 grand_embassy.10.a: "Annotiamo i loro metodi."
 grand_embassy.10.b: "Paghiamo per un resoconto completo della loro arte."
 grand_embassy.10.c: "Paghiamo per l'intero studio, e restiamo per padroneggiarlo."

 grand_embassy.11.title: "La moda a corte"
 grand_embassy.11.desc: "Il taglio di una giacca, l'acconciatura di una parrucca, la giusta profondità di un inchino: i cortigiani [embassy_country.Custom('IT_Di')][embassy_country.GetName] studiano queste cose con la stessa cura di un trattato, e un orlo mal valutato può costare anni di fatica per riparare una reputazione. Ogni piega e ogni piuma ha un significato che i non iniziati non sanno leggere, e una delegazione vestita male è una delegazione che non viene davvero vista. Un cortigiano si offre, con discrezione, di spiegare cosa si indossa e perché, a chi bisogna inchinarsi per primo e di quanto."
 grand_embassy.11.a: "Osserviamo e ricordiamo."
 grand_embassy.11.b: "Paghiamo il cortigiano per una lezione più approfondita."
 grand_embassy.11.c: "Paghiamo per la lezione completa, e restiamo per padroneggiarla."

 grand_embassy.12.title: "Il salotto delle idee"
 grand_embassy.12.desc: "In un palazzo cittadino vicino alla reggia, mercanti, studiosi e nobili oziosi si riuniscono quasi ogni sera per discutere davanti a un caffè di questioni che un tempo sarebbero rimaste taciute: tasse, fede e i giusti limiti dell'autorità di una corona. La conversazione si protrae fino a tardi e si fa più accesa man mano che le candele si consumano, e a nessuno importa chi ascolta, purché anche lui abbia qualcosa di valido da dire. Ottenere un invito per unirsi a loro, anche da sconosciuti, non è impossibile, a patto che il caffè sia buono e le opinioni audaci."
 grand_embassy.12.a: "Sediamoci e ascoltiamo in silenzio."
 grand_embassy.12.b: "Paghiamo per entrare nel circolo."
 grand_embassy.12.c: "Paghiamo per entrarvi a pieno titolo, e restiamo per padroneggiarlo."

 grand_embassy.13.title: "Il pavimento della fonderia"
 grand_embassy.13.desc: "Le fonderie [embassy_country.Custom('IT_Di')][embassy_country.GetName] fondono cannoni con metodi che i nostri armaioli pagherebbero a caro prezzo per conoscere: la miscela della lega, la forma dello stampo, i tempi del raffreddamento. Il calore ondeggia sopra le bocche dei forni, e gli operai si muovono attorno al metallo fuso con una calma esercitata che parla di lunga abitudine più che di semplice abilità. Il maestro fonditore, madido di sudore e palesemente orgoglioso del suo lavoro, è disposto a spiegare di più, dietro compenso, e sembra apprezzare soprattutto un pubblico che capisce davvero ciò che ha davanti."
 grand_embassy.13.a: "Osserviamo la fusione."
 grand_embassy.13.b: "Paghiamo il maestro fonditore perché ci spieghi il mestiere."
 grand_embassy.13.c: "Paghiamo il maestro per intero, e restiamo per padroneggiare il mestiere."

 grand_embassy.14.title: "Il campo di addestramento"
 grand_embassy.14.desc: "Sul campo di addestramento fuori [embassy_country.GetCapital.GetName], le compagnie manovrano e ricaricano all'unisono, più velocemente di qualsiasi nostra leva, con gli stivali che battono il terreno compatto in un ritmo che non sembra mai vacillare. Gli ufficiali abbaiano ordini a cui le file rispondono prima ancora che le parole abbiano finito di lasciare le loro bocche, e l'intera formazione si volge come un unico corpo anziché come cento uomini distinti. Un sergente istruttore, lusingato dalla nostra attenzione, si offre di mostrarci l'addestramento per intero, dal primo comando all'ultima salva."
 grand_embassy.14.a: "Osserviamo l'addestramento."
 grand_embassy.14.b: "Paghiamo il sergente per vedere più da vicino."
 grand_embassy.14.c: "Paghiamo il sergente per intero, e restiamo per padroneggiare l'addestramento."

 grand_embassy.15.title: "Una parola all'orecchio giusto"
 grand_embassy.15.desc: "Il ciambellano che organizza le nostre udienze fa sapere, con discrezione, che un dono nella mano giusta può appianare moltissime porte, e che certi nomi su certe liste tendono a sfuggire alla memoria una volta scambiata la moneta. Lo accenna quasi di sfuggita, come si parlerebbe del tempo, e attende di vedere se cogliamo il suo senso. È una piccola cosa, e abbastanza comune a qualsiasi corte, anche se il prezzo tende a salire con la richiesta."
 grand_embassy.15.a: "Offriamo il dono di rito."
 grand_embassy.15.b: "Offriamo un dono assai più generoso."

 grand_embassy.16.title: "Il mediatore discreto"
 grand_embassy.16.desc: "Un mediatore che si guadagna da vivere facilitando il cammino ai visitatori stranieri offre i suoi servigi, vantando conoscenze in ogni corpo di guardia e in ogni dogana da qui al confine. Parla con mezze frasi caute, senza mai dire chi gli deve dei favori, solo che qualcuno glieli deve. Dietro compenso, può far sì che vengano poste meno domande su dove vada la delegazione, e perché, e che le risposte, se incalzato, risultino convenientemente vaghe."
 grand_embassy.16.a: "Assumiamo il mediatore."
 grand_embassy.16.b: "Assumiamo il mediatore, e paghiamo anche il suo silenzio."

 grand_embassy.17.title: "Una lingua lunga"
 grand_embassy.17.desc: "Uno del nostro seguito, ubriaco in una taverna e desideroso di fare colpo su un tavolo di sconosciuti, ha detto molto più del dovuto su chi guida davvero questa delegazione. Al mattino non ricorda nemmeno di averlo detto, ma l'oste sì, e così tutti coloro che bevevano al tavolo accanto. La voce si sta già diffondendo tra le stanze della servitù, tramandata con la voluttà riservata ai segreti troppo belli per essere custoditi."
 grand_embassy.17.a: "Ormai non c'è nulla da fare."
 grand_embassy.17.b: "Paghiamo per soffocare la voce."

 grand_embassy.18.title: "Riconosciuti per strada"
 grand_embassy.18.desc: "Un mercante che anni fa, in circostanze più felici, commerciava [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName], incrocia la delegazione per strada e si blocca a metà passo, fissando per un attimo di troppo il volto di [target_ruler.GetName] prima di allontanarsi in fretta senza dire una parola. Non c'è da fraintendere l'espressione che gli attraversa il viso: non semplice curiosità, ma un improvviso, sbalordito riconoscimento. Sa esattamente chi ha visto, e se terrà la cosa per sé non dipende affatto da noi."
 grand_embassy.18.a: "Speriamo che tenga la bocca chiusa."
 grand_embassy.18.b: "Facciamolo trovare e paghiamo il suo silenzio."

 grand_embassy.19.title: "L'oste curioso"
 grand_embassy.19.desc: "L'oste che ospita la delegazione ha troppe domande, ciascuna posta con la studiata disinvoltura di chi già sospetta che le risposte contino: perché un seguito così raffinato viaggi in modo così dimesso, perché il denaro sia sempre pronto e mai contato due volte, perché nessuno del gruppo lo guardi negli occhi quando gli si chiede degli affari. Non è ancora sospettoso, soltanto curioso, e rigira le piccole stranezze nella mente come si rigira una moneta per controllare che non sia tosata. Potrebbe non durare ancora a lungo."
 grand_embassy.19.a: "Rispondiamo il meno possibile."
 grand_embassy.19.b: "Paghiamolo abbastanza da fargli smettere di chiedere."

 grand_embassy.20.title: "Una lettera intercettata"
 grand_embassy.20.desc: "Una lettera diretta in patria, che nomina chiaramente [target_ruler.GetName] e descrive il vero scopo della delegazione con più dettagli di quanti la prudenza avrebbe mai consentito, è andata perduta tra il corriere e la nave. Non è seguita alcuna richiesta di riscatto, alcuna accusa, alcun segno di dove sia finita, il che è in un certo senso più inquietante di quanto sarebbe stato altrimenti. Dove sia finita, chi l'abbia letta e cosa intenda fare di ciò che ora sa, non possiamo dirlo."
 grand_embassy.20.a: "Non c'è modo di richiamarla."
 grand_embassy.20.b: "Spendiamo senza risparmio per farla trovare e bruciare."

 grand_embassy.21.title: "Un banchetto in nostro onore"
 grand_embassy.21.desc: "Il [embassy_country.GetGovernment.GetCourtTitle] ha organizzato un banchetto in onore della delegazione, con brindisi, tributi e discorsi sufficienti a riempire un'intera giornata, ogni portata più elaborata della precedente, come se le cucine gareggiassero tra loro. Ogni piatto va lodato, ogni brindisi ricambiato e ogni prolisso dignitario ascoltato fino alla fine, a prescindere da quanto abbia davvero da dire. Declinare sarebbe un affronto; partecipare significa perdere l'intera giornata tra cerimonie e piatti colmi."
 grand_embassy.21.a: "Restiamo fino alla fine."
 grand_embassy.21.b: "Sgattaioliamo via per vedere qualcosa di più utile."

 grand_embassy.22.title: "Un accompagnatore assegnato"
 grand_embassy.22.desc: "Il [embassy_country.GetGovernment.GetCourtTitle] ha assegnato un funzionario per guidare ogni passo della delegazione: piacevole, instancabile e fermamente deciso a non farci vedere altro che giardini e gallerie, per quanto cortesemente venga formulata la richiesta di qualcosa di più. Ha una risposta pronta per ogni domanda e un diversivo pronto per ogni silenzio, riportando la conversazione su fontane e affreschi ogni volta che si avvicina troppo a qualcosa di utile. Le officine restano saldamente fuori portata, in qualunque modo lo chiediamo."
 grand_embassy.22.a: "Seguiamo dove ci conducono."
 grand_embassy.22.b: "Insistiamo, in quanto visitatori di rango, per vedere di più."

 grand_embassy.23.title: "La lunga udienza"
 grand_embassy.23.desc: "Un'udienza con un funzionario minore si trascina per ore: complimenti scambiati, doni ammirati, nulla di sostanziale detto, lo stesso pugno di convenevoli ripetuto in un ordine leggermente diverso finché non perdono ogni significato. Non sembra avere alcuna fretta, e assapora l'attenzione dei visitatori stranieri ben più della sostanza di ciò che potrebbero discutere. Quando finalmente si conclude, il tempo per fare qualcosa di più utile è ormai passato da un pezzo."
 grand_embassy.23.a: "Sopportiamo con garbo."
 grand_embassy.23.b: "Tronchiamo l'udienza, al diavolo l'autorità."

 grand_embassy.24.title: "Un maggiordomo comprensivo"
 grand_embassy.24.desc: "Il maggiordomo che tiene il registro quotidiano della casa lascia intendere, con la cautela di chi l'ha già fatto, che alcuni nomi potrebbero semplicemente non venire annotati, per un'adeguata ricompensa. Non lo chiede apertamente; lascia che sia il silenzio a chiedere, e attende con paziente maestria che siamo noi a colmarlo."
 grand_embassy.24.a: "Paghiamo il maggiordomo per un registro più leggero."
 grand_embassy.24.b: "Paghiamo il maggiordomo perché perda del tutto il registro."

 grand_embassy.25.title: "Una voce esca"
 grand_embassy.25.desc: "Una delegazione rivale proveniente da una corte minore, giunta quasi nello stesso momento della nostra, alimenta molti più pettegolezzi, essendo rumorosa, poco sottile e di gran lunga più facile da commentare. Un po' di denaro distribuito tra i servitori giusti potrebbe mantenere la situazione tale, dirigendo ogni lingua oziosa verso i loro spostamenti anziché verso i nostri."
 grand_embassy.25.a: "Distribuiamo un po' di denaro."
 grand_embassy.25.b: "Distribuiamo moltissimo denaro."

 grand_embassy.26.title: "La scorta silenziosa"
 grand_embassy.26.desc: "Una guida locale, che sa quali strade e quali porte sfuggono agli occhi indiscreti e in quali ore la guardia guarda altrove, si offre di condurre gli spostamenti della delegazione senza che nessuno li veda. Non chiede perché sia necessaria tanta cautela, soltanto quanto valga per noi."
 grand_embassy.26.a: "Assumiamo la guida."
 grand_embassy.26.b: "Assumiamo la guida, e paghiamo anche per una maggiore cautela."

