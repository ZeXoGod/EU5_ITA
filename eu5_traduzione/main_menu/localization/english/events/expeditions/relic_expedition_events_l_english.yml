 relic_expedition_events.12.title: "Cacciatori di Tesori Rivali"
 relic_expedition_events.12.desc: "Un taverniere lieto di essere pagato due volte porta a [target_leader.GetName] la notizia: agenti di una potenza rivale hanno occupato le stesse stanze, offrendo da bere agli stessi scaricatori e chiedendo della stessa voce che ci ha condotti qui. Sono sbarcati una settimana prima di noi e da allora non sono stati attenti con il denaro. Il silenzio e la cooperazione hanno entrambi un prezzo in questa città, e chi lo paga per primo conserva la pista."
 relic_expedition_events.12.a: "Offriamo più di quanto possano. La corona coprirà qualunque somma."
 relic_expedition_events.12.b: "Lasciamo che inseguano questa. Altre verranno entro primavera."
 relic_expedition_events.12.c: "Aspettiamoli alla strettoia, e chiudiamo la questione lì."

 relic_expedition_events.13.title: "La Bottega di un Falsario"
 relic_expedition_events.13.desc: "Un artigiano viene colto mentre vende a un pellegrino credulone l'osso del dito di un santo, ricavato quella stessa mattina da del montone e tinto con del tè. Incalzato su chi altro abbia truffato, giura invece di sapere di qualcosa di autentico, trovato mentre raccoglieva legno vecchio e ferro più vecchio per la bottega. Dirà il distretto ma non la via finché non vedrà denaro. La parola di un falsario vale esattamente quanto vale la parola di un falsario."
 relic_expedition_events.13.a: "Paghiamolo per ciò che sostiene, ma una volta sola."
 relic_expedition_events.13.b: "Che il seguito lo metta sotto pressione. La paura costa meno dell'argento."
 relic_expedition_events.13.forger_honest_tt: "Per una volta, il denaro compra qualcosa di vero, e il racconto del falsario regge"
 relic_expedition_events.13.forger_cheated_tt: "Il distretto che ha indicato contiene solo chiacchiere; il falsario è stato pagato due volte per la stessa menzogna"
 relic_expedition_events.13.threats_work_tt: "La paura scioglie ciò che l'argento non poteva, e il falsario cede qualcosa di reale"
 relic_expedition_events.13.threats_fail_tt: "Strilla solo scuse più forti; le minacce del seguito non hanno fruttato altro che nocche contuse"

 relic_expedition_events.14.title: "Tempesta di Sabbia sulla Strada"
 relic_expedition_events.14.desc: "Un muro di polvere ocra si alza all'orizzonte verso mezzogiorno e nel giro di un'ora ha inghiottito la strada. I cammelli piegano le zampe e si rifiutano di rialzarsi, la sabbia si insinua in ogni piega di stoffa e in ogni otre, e la guida ammette di non riuscire più a distinguere i cumuli di pietre che segnano la via. [target_leader.GetName] può proseguire alla cieca o perdere giorni ad aspettare che la tempesta passi."
 relic_expedition_events.14.a: "Proseguiamo attraverso di essa. La strada non può essere andata lontano."
 relic_expedition_events.14.b: "Appesantiamo le tende, accampiamoci e lasciamo che si esaurisca da sé."

 relic_expedition_events.15.title: "Colpiti dalla Febbre"
 relic_expedition_events.15.desc_land: "La febbre è arrivata con i portatori d'acqua e prende gli uomini a due e tre alla volta quasi senza preavviso: un mal di testa all'alba, tremori a mezzogiorno, una tomba poco profonda la seconda mattina. I due medici della compagnia sono già oltre la possibilità di aiutare tutti coloro che li chiedono, e i sani hanno iniziato a dormire ben lontani dai malati. [target_leader.GetName] deve decidere quanto la corona spenderà per contenerla."
 relic_expedition_events.15.desc_sea: "La febbre è salita a bordo con l'ultima acqua imbarcata in porto, e prende gli uomini a due e tre alla volta quasi senza preavviso: un mal di testa all'alba, tremori a mezzogiorno, un corpo gettato oltre il parapetto la seconda mattina. I due medici della compagnia sono già oltre la possibilità di aiutare tutti coloro che li chiedono nella stiva angusta, e i sani hanno iniziato a dormire il più lontano possibile dai malati, per quanto consenta il ponte. [target_leader.GetName] deve decidere quanto la corona spenderà per contenerla."
 relic_expedition_events.15.a: "Non badiamo a spese per curare i malati e tenerli separati."
 relic_expedition_events.15.b: "Lasciamo che faccia il suo corso. Le febbri si spengono presto."

 relic_expedition_events.16.title: "Banditi del Deserto Esigono un Tributo"
 relic_expedition_events.16.desc: "Uomini armati sono schierati attraverso la strada dove scende tra due creste, troppi e troppo ordinati per essere semplici opportunisti. Il loro capo avanza a cavallo davanti alla linea, fissa una somma per il passaggio sicuro e chiarisce di aver già soppesato quanto gli costerebbe l'alternativa."
 relic_expedition_events.16.a: "Paghiamo il pedaggio e andiamocene prima che ci ripensi sul prezzo."
 relic_expedition_events.16.b: "Apriamoci un varco combattendo. Non siamo venuti fin qui per essere derubati."
 relic_expedition_events.16.c: "Lasciamo che parlino i nostri numeri. Pochi discutono con tanti uomini."

 relic_expedition_events.17.title: "La Voce di un Pellegrino"
 relic_expedition_events.17.desc: "Una carovana di pellegrini condivide la stazione di posta per la notte, e la conversazione al fuoco volge alle reliquie, come sempre. Uno di loro, il figlio di un mercante di lana dell'entroterra lontano, ripete una storia che ricorda a metà da uno zio morto da vent'anni: monaci che portano un fagotto fuori da una casa in fiamme, una notte sulla strada costiera e una sepoltura che nessuno doveva vedere. Non sa dire quale fosse la casa. È stranamente certo della strada."
 relic_expedition_events.17.a: "Offriamo all'uomo un'altra coppa e incalziamolo su ogni dettaglio."
 relic_expedition_events.17.b: "Un racconto in più tra mille. Ripartiamo alle prime luci."
 relic_expedition_events.17.tale_confirmed_tt: "Una moneta gli scioglie la lingua, e gli sfugge un dettaglio che probabilmente non avrebbe dovuto condividere"
 relic_expedition_events.17.tale_fades_tt: "Un'altra coppa non aiuta; i dettagli si confondono sempre di più a ogni ripetizione"

 relic_expedition_events.18.title: "Il Denaro Scarseggia"
 relic_expedition_events.18.desc: "Un mese magro di cambio, e prestatori diventati improvvisamente cauti nel prestare agli stranieri, lasciano le casse della spedizione molto più leggere del previsto. Le paghe del seguito sono già in ritardo di due settimane, i mulattieri vogliono essere pagati in monete di cui si fidano anziché nelle nostre, e la voce di una compagnia non pagata viaggia in queste città più in fretta di qualunque nostra domanda."
 relic_expedition_events.18.a: "Copriamo l'ammanco con la borsa della corona, in fretta."
 relic_expedition_events.18.b: "Lasciamo che la loro paga ritardi ancora un po'. Non hanno altro posto dove andare."

 relic_expedition_events.19.title: "Le Autorità Locali Prendono Nota"
 relic_expedition_events.19.desc_muslim: "Il #italic qāḍī#! locale ha saputo che degli stranieri pongono domande mirate sul tesoro dei Franchi, e su quali famiglie tennero per sé cosa quando i regni caddero. Il suo segretario fa visita a [target_leader.GetName] con tè, complimenti e un messaggio sufficientemente chiaro sotto la cortesia: simili indagini procedono assai più agevolmente con la conoscenza del suo signore, e con un adeguato contributo al mantenimento della moschea."
 relic_expedition_events.19.desc_christian: "[relic_hunt_current_loc.GetOwner.Custom('IT_CLERGY_IL')|U][relic_hunt_current_loc.GetOwner.GetGovernment.GetEstateName('clergy_estate')] locale [relic_hunt_current_loc.GetOwner.Custom('IT_CLERGY_HA')] notato una compagnia straniera che indaga un po' troppo da vicino su reliquie considerate affare della Chiesa e di nessun altro. L'arcidiacono riceve [target_leader.GetName] con ogni cortesia, parla a lungo del peccato dell'avarizia e non lascia alcun dubbio che la sua continua benevolenza richiederà un dono deposto sull'altare."
 relic_expedition_events.19.desc_fallback: "La voce delle domande della spedizione è giunta a orecchie che sarebbe meglio non disturbare. Un uomo che nessuno si prende la briga di presentare arriva alla locanda dopo il tramonto, si siede senza essere invitato e spiega a lungo quanti guai un gruppo straniero possa trovarsi in una città come questa. L'avvertimento è tranquillo, perfettamente cortese e del tutto chiaro."
 relic_expedition_events.19.a: "Rendiamo i dovuti omaggi, visti dalle persone giuste."
 relic_expedition_events.19.b: "Ignoriamo l'avvertimento e continuiamo a lavorare. Il tempo è già poco."

 relic_expedition_events.20.title: "La Vera Croce Ritrovata"
 relic_expedition_events.20.desc: "Giunge alle corti della cristianità la notizia che [relic_finder.GetLongName] ha recuperato $relic_true_cross_found$, scomparsa dal disastro di Hattin, e ora la custodisce nel proprio tesoro. Ogni capitolo di cattedrale vorrà il proprio resoconto di come è stata trovata, e pochi concorderanno sulla sua legittimità."
 relic_expedition_events.20.a: "Le notizie viaggiano in fretta nella cristianità."

 relic_expedition_events.21.title: "La Santa Lancia Riemerge"
 relic_expedition_events.21.desc: "Tra i fedeli si diffonde la notizia che [relic_finder.GetLongName] ha recuperato $relic_holy_lance_found$, scomparsa da quando la Prima Crociata lasciò [ShowLocationName('antioch')]. Più di un itinerario di pellegrinaggio verrà ridisegnato in base a ciò."
 relic_expedition_events.21.a: "Un'altra reliquia ritrova la via di casa."

 relic_expedition_events.22.title: "Ritrovata la Sacra Sindone"
 relic_expedition_events.22.desc: "Nell'Europa cattolica circolano voci che [relic_finder.GetLongName] sia entrato in possesso di $relic_holy_shroud_found$, un telo di cui si parla da tempo e di cui non si è mai saputo nulla. Gli scettici dubiteranno, come hanno sempre fatto. I fedeli faranno comunque il viaggio."
 relic_expedition_events.22.a: "Che siano i pellegrini a giudicare da sé."
