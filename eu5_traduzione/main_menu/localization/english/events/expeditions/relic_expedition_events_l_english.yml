l_english:

 relic_expedition_events.1.title: "La Caccia alle Reliquie"
 relic_expedition_events.1.desc: "I vescovi lo hanno chiesto, e il [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')] ha acconsentito. Un mercante tornato dal Levante la racconta così: un commerciante di Damasco aveva saputo da suo padre che, quando i regni crociati caddero, buona parte di ciò che i Franchi custodivano nelle loro chiese fu portata via e sepolta anziché bruciata. Le cose sepolte si possono dissotterrare. Si possono anche comprare, se un uomo trova la casa giusta nella settimana giusta e non tratta sul prezzo dove può essere sentito.\n\nQuale reliquia, e dove, nessuno lo dice. Storie come questa costano poco in ogni porto di quella costa. Questa è stata ripetuta alle orecchie giuste."
 relic_expedition_events.1.a: "Equipaggiamoli bene: doni, un interprete, un frate, una borsa."
 relic_expedition_events.1.b: "Un solo agente, una borsa discreta. Meno occhi, meno rischi."
 relic_expedition_events.1.historical_info: "La Vera Croce fu portata sul campo di Hattin nel luglio del 1187 e catturata dall'esercito di Saladino. Riccardo Cuor di Leone, l'imperatore bizantino e la regina di Georgia tentarono tutti di riscattarla, e tutti fallirono; l'ultima notizia attendibile la colloca a Damasco, dopodiché esce del tutto dalle fonti. La Santa Lancia, trovata ad Antiochia nel 1098, scomparve altrettanto silenziosamente una volta che la Prima Crociata proseguì. Nessuna delle due perdite fu mai spiegata, ed è proprio per questo che i ricercatori continuarono a cercare."

 relic_expedition_events.2.title: "L'Arrivo"
 relic_expedition_events.2.desc_jerusalem_first: "La spedizione è giunta a [ShowLocationName('jerusalem')] e sta davanti alla Chiesa del Santo Sepolcro. La guarnigione [location_scope.GetOwner.Custom('IT_ADJ_FS')] scruta il gruppo e perde interesse. Qui giungono stranieri ogni stagione per la stessa tomba e le stesse storie. Da qualche parte dietro quelle storie c'è una pista che vale la pena seguire, e trovarla sarà lento e costoso, e soprattutto una questione di scegliere a chi credere."
 relic_expedition_events.2.desc_jerusalem_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('jerusalem')]. I canonici del Santo Sepolcro ormai conoscono [target_leader.GetName], e la guarnigione non si prende più la briga di alzare lo sguardo."
 relic_expedition_events.2.desc_acre_first: "La spedizione raggiunge [ShowLocationName('acre')], capitale del regno crociato finché i Mamelucchi la presero nel 1291. La cattedrale è ancora in piedi, in un certo senso, con il cielo dove c'era il tetto, e interi quartieri non sono mai stati ricostruiti dopo il saccheggio. Nessuno ha ancora avuto motivo di setacciare le macerie."
 relic_expedition_events.2.desc_acre_repeat: "Ancora [ShowLocationNameWithNoTooltip('acre')]. [target_leader.GetName] sa quali vicoli ripagano una seconda passeggiata."
 relic_expedition_events.2.desc_antioch_first: "La spedizione raggiunge [ShowLocationName('antioch')], sede del principato crociato scomparso e città in cui $relic_holy_lance_found$ fu dissotterrata dal pavimento di una chiesa nella disperata estate del 1098. Dove sia andata la lancia dopo che l'esercito marciò a sud verso [ShowLocationNameWithNoTooltip('jerusalem')], in Occidente nessuno l'ha mai stabilito. Non è l'unica cosa di cui questa città ha perso le tracce."
 relic_expedition_events.2.desc_antioch_repeat: "[target_leader.GetName] è di nuovo ad [ShowLocationNameWithNoTooltip('antioch')], sempre a chiedere della lancia perduta, sempre ricevendo tre risposte a ogni domanda."
 relic_expedition_events.2.desc_damascus_first: "La spedizione raggiunge [ShowLocationName('damascus')], la grande capitale [location_scope.GetOwner.Custom('IT_ADJ_FS')] di [ShowProvinceDefinitionName('shaam_province')] e l'ultimo luogo in cui $relic_true_cross_found$ fu segnalata in modo attendibile dopo Hattin. Se quella reliquia sia ancora qui è un altro discorso. Una città di queste dimensioni ha accolto moltissimi tesori nei secoli e ne ha restituiti ben pochi."
 relic_expedition_events.2.desc_damascus_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('damascus')]. [target_leader.GetName] ha imparato chi parla dentro [location_scope.Custom('IT_ART_LOCATION')][location_scope.GetRank.GetNameWithNoTooltip], e quanto costa."
 relic_expedition_events.2.desc_tripoli_first: "La spedizione raggiunge [ShowLocationName('tripoli_syria')], contea crociata fino alla sua caduta nel 1289. Il commercio nel porto è vivace come sempre, ma la cappella della vecchia cittadella è rimasta sconsacrata più a lungo di quanto chiunque qui ricordi, e nessuno l'ha mai svuotata."
 relic_expedition_events.2.desc_tripoli_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('tripoli_syria')]. I mercanti del porto ormai conoscono [target_leader.GetName] di vista."
 relic_expedition_events.2.desc_tyre_first: "La spedizione raggiunge [ShowLocationName('sur')], dove [location_scope.Custom('IT_ART_LOCATION')][location_scope.GetRank.GetName] risale a tempi tanto remoti che i Vangeli registrano il passaggio di Cristo nel suo territorio; fu una delle ultime roccaforti sulla terraferma tenute dai Crociati prima del 1291. La sua arcidiocesi conservò archivi per due secoli. Ciò che ne resta è sparso in una dozzina di case private, e non ci sono due proprietari che concordino su ciò che possiedono."
 relic_expedition_events.2.desc_tyre_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('sur')]. [target_leader.GetName] ha letto quasi tutto ciò che l'antica arcidiocesi ha lasciato."
 relic_expedition_events.2.desc_jaffa_first: "La spedizione raggiunge [ShowLocationName('jaffa')], dove un tempo i pellegrini sbarcavano a carichi di nave, e dove si dice che l'apostolo Pietro abbia risuscitato la vedova Tabita. Due secoli di traffico di pellegrini sono passati per questo porto in entrambe le direzioni. Non tutti sono ripartiti."
 relic_expedition_events.2.desc_jaffa_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('jaffa')]. Il quartiere del molo si è abituato alle domande di [target_leader.GetName]."
 relic_expedition_events.2.desc_hebron_first: "La spedizione raggiunge [ShowLocationName('hebron')] e la Grotta dei Patriarchi, dove si dice siano sepolti Abramo, Isacco e Giacobbe, sacra per i credenti [ShowReligionGroupAdjective('israelite_group')], [ShowReligionGroupAdjective('christian')] e [ShowReligionGroupAdjective('muslim')] allo stesso modo. Tre fedi hanno aggiunto e tolto qualcosa a questo santuario per secoli. Qualcosa di piccolo, riposto nel secolo sbagliato, potrebbe restare qui inosservato per sempre."
 relic_expedition_events.2.desc_hebron_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('hebron')]. [target_leader.GetName] ha già percorso i recinti del santuario, e sa dove non farsi vedere."
 relic_expedition_events.2.desc_sidon_first: "La spedizione raggiunge [ShowLocationName('sidon')], un'altra città che secondo i Vangeli Cristo visitò, e signoria crociata fino alla caduta del regno. L'antico quartiere franco è stato ripopolato due volte da allora. Gli attuali inquilini non hanno idea di cosa ci sia nelle loro stesse cantine."
 relic_expedition_events.2.desc_sidon_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('sidon')]. [target_leader.GetName] ha un elenco di case franche che meritano una seconda visita."
 relic_expedition_events.2.desc_karak_first: "La spedizione raggiunge [ShowLocationName('karak')], il castello nel deserto che Rinaldo di Châtillon tenne come signore dell'Oltregiordano. Rinaldo derubò per anni le carovane di pellegrini e si dice abbia conservato qui il bottino in vista dell'assedio che sapeva Saladino avrebbe portato. Ogni famiglia della città sottostante racconta quella storia in modo diverso."
 relic_expedition_events.2.desc_karak_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('karak')]. [target_leader.GetName] ha già sentito le leggende del castello una volta, e due volte dai chiacchieroni."
 relic_expedition_events.2.desc_gaza_first: "La spedizione raggiunge [ShowLocationName('gaza')], un'antica città che ebbe ai suoi tempi una guarnigione templare, sulla strada del deserto verso sud in direzione dell'[ShowRegionName('egypt_region')]. L'ordine fu soppresso e i suoi frati dispersi in tutta la cristianità generazioni fa. Ciò che custodivano qui non se n'è andato tutto con loro."
 relic_expedition_events.2.desc_gaza_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('gaza')]. [target_leader.GetName] ha parlato con la maggior parte delle famiglie che vivono dove un tempo stavano i Templari."
 relic_expedition_events.2.desc_famagusta_first: "La spedizione raggiunge [ShowLocationName('famagusta')], il grande porto [location_scope.GetOwner.Custom('IT_DEL_RANGO')][location_scope.GetOwner.GetFlavorRank] di [ShowProvinceDefinitionName('cyprus_province')]. Famiglie latine vi fuggirono in gran numero dopo la caduta di [ShowLocationNameWithNoTooltip('acre')] nel 1291, e molte di loro portarono via dalla terraferma più dei propri titoli."
 relic_expedition_events.2.desc_famagusta_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('famagusta')]. Ormai alla Cattedrale di San Nicola conoscono [target_leader.GetName]."
 relic_expedition_events.2.desc_nicosia_first: "La spedizione raggiunge [ShowLocationName('nicosia_cyp')], sede del potere su [ShowProvinceDefinitionName('cyprus_province')]. La [location_scope.GetOwner.GetGovernment.GetCourtTitle] [location_scope.GetOwner.Custom('IT_ADJ_FS')] conserva un lungo archivio di ciò che la nobiltà esiliata della terraferma portò con sé, e uno più lungo di ciò che in seguito impegnò."
 relic_expedition_events.2.desc_nicosia_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('nicosia_cyp')]. Gli archivisti [location_scope.GetOwner.GetAdjective] hanno smesso di chiedersi perché [target_leader.GetName] continui a tornare."
 relic_expedition_events.2.desc_rhodes_first: "La spedizione raggiunge [ShowLocationName('rodos')], territorio [location_scope.GetOwner.GetAdjective]. L'ordine qui ricorda la caduta di [ShowLocationNameWithNoTooltip('acre')] come storia propria e conservò elenchi di ogni commenda abbandonata sulla terraferma. Nessun'altra città in queste acque aprirebbe simili archivi a un gruppo di ricerca cattolico."
 relic_expedition_events.2.desc_rhodes_repeat: "Di nuovo a [ShowLocationNameWithNoTooltip('rodos')]. Gli archivisti [location_scope.GetOwner.GetAdjective] salutano [target_leader.GetName] come un fastidio ormai familiare."
 relic_expedition_events.2.desc_fallback: "Un'altra tappa, un altro giro di presentazioni. [target_leader.GetName] ricomincia e attende qualcosa che valga la pena inseguire."
 relic_expedition_events.2.a: "Chiediamo in giro. Pellegrini e soldati parlano, se pagati in [ShowGoodsNameWithNoTooltip('wine')]."
 relic_expedition_events.2.b: "Abbiamo finalmente trovato le tracce di una reliquia."
 relic_expedition_events.2.c: "Assoldiamo altro seguito qui. Le buone guardie non sono a buon mercato."
 relic_expedition_events.2.d: "Corrompiamo un funzionario di corte per ciò che c'è nell'archivio locale."
 relic_expedition_events.2.e: "Cerchiamo uno studioso. Una mente allenata legge meglio le dicerie."
 relic_expedition_events.2.f: "Seguiamo un indizio promettente verso [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.2.g: "Sospendiamo la ricerca e torniamo indietro."

 relic_expedition_events.3.title: "La Ricerca Continua"
 relic_expedition_events.3.desc_jerusalem: "[target_leader.GetName] torna al Santo Sepolcro prima dell'alba, prima delle folle di pellegrini. C'è un'altra cripta da vedere a lume di candela, un'altra iscrizione consunta da copiare, un altro canonico disposto a parlare per il giusto compenso."
 relic_expedition_events.3.desc_acre: "Muri vuoti battuti per saggiarli, murature crollate rivoltate dove nessuno le smuove da generazioni. [ShowLocationNameWithNoTooltip('acre')] occupa un'area enorme, ma [relic_hunt_loc.Custom('IT_ART_LOCATION')][relic_hunt_loc.GetRank.GetName] ha ben poche persone rimaste, e un solo gruppo può coprirne solo una parte."
 relic_expedition_events.3.desc_antioch: "[target_leader.GetName] ripercorre la linea delle mura scomparse, confrontando ciò che ancora sta in piedi con i resoconti dei pellegrini su dove emerse la Lancia. I resoconti non concordano tra loro, e nessuno concorda con il terreno."
 relic_expedition_events.3.desc_damascus: "Suq dopo suq, [target_leader.GetName] coltiva mercanti e prestatori di denaro. Le voci si muovono lentamente in una città così vasta, ma si muovono, e arrivano con un prezzo già attaccato."
 relic_expedition_events.3.desc_tripoli: "La cappella della cittadella viene smontata lastra per lastra, con l'intonaco staccato ovunque la parete suoni male. La sola cappella richiede settimane di lavoro."
 relic_expedition_events.3.desc_tyre: "[target_leader.GetName] passa in rassegna ciò che resta degli archivi dell'arcidiocesi di [ShowLocationNameWithNoTooltip('sur')], affiancando registri macchiati d'acqua a carte semileggibili e cercando la voce che non corrisponda alle altre."
 relic_expedition_events.3.desc_jaffa: "[target_leader.GetName] passa le giornate al porto di [ShowLocationNameWithNoTooltip('jaffa')], offrendo da bere a scaricatori e barcaioli e chiedendo quali magazzini gestissero il carico dei pellegrini prima della partenza dei Franchi."
 relic_expedition_events.3.desc_hebron: "Il santuario viene esaminato nicchia per nicchia, lentamente e con grande cura di non offendere nessuna delle tre fedi che lo custodiscono. [target_leader.GetName] annota ogni passaggio sigillato e non ne chiede ad alta voce nessuno."
 relic_expedition_events.3.desc_sidon: "Casa dopo casa ripopolata attraverso l'antico quartiere franco, [target_leader.GetName] bussa e chiede di cantine e soffitte che nessuno apre dalla fuga degli ultimi inquilini cristiani."
 relic_expedition_events.3.desc_karak: "Lanterna alla mano, [target_leader.GetName] percorre le volte e le cisterne di [ShowLocationNameWithNoTooltip('karak')], confrontando il tesoro di Rinaldo di Châtillon come lo descrivono i narratori con ciò che le mura sono davvero disposte ad ammettere."
 relic_expedition_events.3.desc_gaza: "[target_leader.GetName] insiste sui possedimenti dell'ordine soppresso a [ShowLocationNameWithNoTooltip('gaza')], interrogando i vicini su quali magazzini i Templari tenessero chiusi a chiave, e chi ne prese le chiavi dopo."
 relic_expedition_events.3.desc_famagusta: "Baule dopo baule tra i forzieri di famiglia delle famiglie esiliate dalla terraferma a [ShowLocationNameWithNoTooltip('famagusta')], catalogando ciò che uscì da [ShowLocationNameWithNoTooltip('acre')] e ciò che da allora è stato silenziosamente dimenticato."
 relic_expedition_events.3.desc_nicosia: "[target_leader.GetName] scorre l'archivio della [relic_hunt_loc.GetOwner.GetGovernment.GetCourtTitle] [relic_hunt_loc.GetOwner.Custom('IT_ADJ_FS')] a [ShowLocationNameWithNoTooltip('nicosia_cyp')], confrontando inventari e registri ereditari alla ricerca di una reliquia su cui nessuno ha pensato di chiedere."
 relic_expedition_events.3.desc_rhodes: "[target_leader.GetName] preme sugli archivisti [relic_hunt_loc.GetOwner.GetAdjective] di [ShowLocationNameWithNoTooltip('rodos')] per i volumi che non hanno offerto, e confronta i loro elenchi con ciò che i frati più anziani dicono sia stato portato via da [ShowLocationNameWithNoTooltip('acre')]."
 relic_expedition_events.3.desc_fallback: "[target_leader.GetName] insiste, rigirando ogni piccola pista a turno prima di lasciarla."
 relic_expedition_events.3.a: "Continuiamo a chiedere. Qualcuno qui sa più di quanto dica."
 relic_expedition_events.3.b: "Finalmente, la pista vera e propria. L'abbiamo trovata."
 relic_expedition_events.3.c: "Assoldiamo altro seguito finché siamo qui."
 relic_expedition_events.3.d: "Corrompiamo un altro funzionario. Questa città conserva archivi migliori."
 relic_expedition_events.3.e: "Consultiamo uno studioso locale prima di proseguire."
 relic_expedition_events.3.f: "Un nuovo indizio punta altrove. Seguiamolo verso [relic_hunt_new_lead.GetNameWithNoTooltip]."
 relic_expedition_events.3.g: "Sospendiamo la ricerca e torniamo indietro."

 relic_expedition_events.4.title: "La Pista si è Raffreddata"
 relic_expedition_events.4.desc: "Ogni pista inseguita da [target_leader.GetName] non ha portato a nulla. Gli interpreti hanno esaurito le taverne, i funzionari corrotti non hanno più nulla da vendere e la borsa si alleggerisce ogni settimana in cui il gruppo sta inattivo in terra straniera. La notizia torna in patria alla corona: pagare per altre ricerche, o porvi fine."
 relic_expedition_events.4.a: "Inviamo i fondi necessari."
 relic_expedition_events.4.b: "Basta. Richiamiamo la spedizione."

 relic_expedition_events.5.title: "La Scorta è Perduta"
 relic_expedition_events.5.desc: "La scorta di [target_leader.GetName] non c'è più, persa a due e tre alla volta a causa di banditi, febbri e della silenziosa diserzione di uomini pagati troppo poco per una ricerca senza fine in vista. Nessuno pressa un signore o un abate per una reliquia che non vuole cedere senza uomini armati a sostegno della richiesta.\n\nLa caccia finisce qui."
 relic_expedition_events.5.a: "La missione non può continuare senza di loro."

 relic_expedition_events.6.title: "Un Venditore Disponibile"
 relic_expedition_events.6.desc_true_cross: "Un mercante della città, attento a chi sia a portata d'orecchio, dice di possedere un frammento di $relic_true_cross_found$ stessa, il legno perduto a Hattin, giunto attraverso mani che si rifiuta di nominare. Un prezzo, però, lo farà."
 relic_expedition_events.6.desc_holy_lance: "La famiglia di un soldato defunto conserva una punta di lancia dal servizio del bisnonno e insiste che sia $relic_holy_lance_found$, quella riportata alla luce nel 1098. Preferirebbero il denaro."
 relic_expedition_events.6.desc_holy_shroud: "Un mercante spiega un lenzuolo di lino segnato dalla debole immagine di un uomo crocifisso. Non sa rendere conto di dove sia stato in tutti questi secoli, e ne vuole comunque una somma altissima."
 relic_expedition_events.6.desc_holy_nail: "La vedova di un fabbro porta fuori un chiodo di ferro annerito dal tempo. La famiglia del marito ha sempre giurato che fosse uno dei chiodi della Crocifissione. Venderebbe."
 relic_expedition_events.6.desc_true_cross_fragment: "Un monastero povero e semidimenticato conserva una scheggia di legno in un semplice reliquiario, etichettata soltanto come un pezzo di $relic_true_cross_found$. L'abate se ne separerà in silenzio se la vendita servirà a tenere in piedi il tetto."
 relic_expedition_events.6.desc_saint_bones: "Un parroco offre un piccolo cofanetto di ossa con il nome di un santo in latino sbiadito. Chiamerebbe il pagamento un'offerta alla chiesa."
 relic_expedition_events.6.desc_baptist_head: "Una chiesa del distretto venera quella che dice essere la testa di Giovanni Battista. La pretesa non ha mai viaggiato lontano oltre la parrocchia, e il clero è aperto a discutere di un trasferimento."
 relic_expedition_events.6.desc_virgin_milk: "Un piccolo santuario custodisce una fiala sigillata di residuo bianco e gessoso, onorato per generazioni come latte della Vergine Maria. Il custode lo venderà, reliquiario d'argento compreso."
 relic_expedition_events.6.desc_holy_thorn: "Una famiglia di piccola nobiltà possiede una singola spina in un modesto reliquiario, data a un antenato dalla Corona di Spine, così raccontano. Preferirebbero che ogni vendita passasse inosservata."
 relic_expedition_events.6.desc_holy_chalice: "Un mercante non si aspetta di essere creduto e lo dice, poi offre una semplice coppa di pietra che sostiene essere il vero calice dell'Ultima Cena, qualunque cosa insistano i pretendenti più illustri altrove. Il suo prezzo non è modesto."
 relic_expedition_events.6.desc_titulus_crucis: "La leggenda locale vuole che quando il legno della Croce andò a occidente, la tavola con l'iscrizione che stava sopra di essa rimase qui e fu nascosta. Una famiglia di qui afferma di aver ereditato proprio una tavola simile, e la venderebbe."
 relic_expedition_events.6.a: "Contrattiamo. Il prezzo richiesto è alto, ma c'è margine."
 relic_expedition_events.6.b: "Paghiamo quanto chiesto. Certe cose valgono il prezzo."
 relic_expedition_events.6.c: "Lasciamo che sia la grandezza del nostro seguito a parlare."

 relic_expedition_events.7.title: "Concludere l'Affare"
 relic_expedition_events.7.desc: "I termini sono concordati e il reliquiario avvolto in un panno. Non resta che [target_leader.GetName] decida quanta parte del racconto del venditore credere."
 relic_expedition_events.7.a: "Paghiamo e portiamo la reliquia a casa."
 relic_expedition_events.7.b: "Qualcosa in tutto questo non ci convince. Andiamocene."

 relic_expedition_events.8.title: "Un Complice Disponibile"
 relic_expedition_events.8.desc_true_cross: "Un servo della casa di un notabile locale, amareggiato per qualcosa che non vuole spiegare, accenna che il suo padrone custodisce un frammento avvolto di legno scuro che chiama $relic_true_cross_found$, senza darvi particolare rilievo tra gli altri tesori. Per un compenso, il servo ci aiuterà a prenderlo."
 relic_expedition_events.8.desc_holy_lance: "Un soldato di guarnigione a cui è dovuto un anno di paga arretrata si lascia sfuggire che nell'armeria c'è una vecchia punta di lancia che nessuno inventaria a memoria d'uomo. I più anziani la chiamano ancora $relic_holy_lance_found$. Può farci entrare."
 relic_expedition_events.8.desc_holy_shroud: "Un portinaio di monastero, da poco in aspra disputa con il suo abate, dice che la comunità custodisce un panno piegato con un'immagine, chiuso a chiave per tutti tranne i frati anziani. Lascerà una porta senza sbarra."
 relic_expedition_events.8.desc_holy_nail: "Un impiegato del tesoro oberato di debiti ammette che un vecchio chiodo di ferro venerato come uno dei chiodi della Crocifissione giace non catalogato in un caveau laterale. Ne possiede l'unica chiave."
 relic_expedition_events.8.desc_true_cross_fragment: "Un novizio infelice della sua vocazione si offre di lasciare una persiana aperta sulla cappella in cui la sua casa custodisce la sua scheggia di $relic_true_cross_found$."
 relic_expedition_events.8.desc_saint_bones: "Un becchino pagato troppo poco per una vita di lavoro sa dove la parrocchia custodisce il cofanetto con le ossa di un santo, e a che ora il sacrestano si sdraia nel pomeriggio."
 relic_expedition_events.8.desc_baptist_head: "Un canonico minore scavalcato una volta di troppo per la promozione si offre di accompagnarci al reliquiario che il clero anziano venera come la testa di Giovanni Battista."
 relic_expedition_events.8.desc_virgin_milk: "Il custode stesso del santuario, silenziosamente furioso dopo decenni di paghe misere, lascerà aperta la teca del reliquiario in una notte di sua scelta."
 relic_expedition_events.8.desc_holy_thorn: "Un maggiordomo licenziato una volta e riassunto per tolleranza sa esattamente dove la famiglia custodisce il reliquiario con l'unica spina della Corona."
 relic_expedition_events.8.desc_holy_chalice: "Un sacrestano di cattedrale non ha nulla di buono da dire del capitolo che serve da anni, e si offre di aiutarci a sottrarre la semplice coppa di pietra che chiamano, in privato, il vero calice dell'Ultima Cena."
 relic_expedition_events.8.desc_titulus_crucis: "Una famiglia che ha tenuto vivo un antico e semicredulo racconto propone tutt'altro: aiutarli a riprendersi quella che insistono sia la vera tavola con l'iscrizione della Croce da un parente che non vuole venderla loro."
 relic_expedition_events.8.a: "La discrezione costa denaro."
 relic_expedition_events.8.d: "Nessun bisogno di oro. Il suo fascino basterà ad assicurarci il loro aiuto."
 relic_expedition_events.8.b: "Entriamo senza. Meno pagati significa meno chiacchiere."
 relic_expedition_events.8.c: "Nessun complice necessario. Il nostro seguito può semplicemente prenderla."

 relic_expedition_events.9.title: "Il Furto"
 relic_expedition_events.9.desc: "Finora il piano regge. Chiunque dovrebbe fare la guardia dorme, o è altrove, o è pagato per guardare dall'altra parte, e la porta che il complice aveva promesso è senza sbarra. [target_leader.GetName] attende nel buio il grido che significherebbe il contrario."
 relic_expedition_events.9.a: "È fatta. La reliquia è nostra, e nessuno ne sa nulla."
 relic_expedition_events.9.b: "Qualcuno si sveglia. Grida, passi di corsa. Ritirata!"

 relic_expedition_events.10.title: "Le Indicazioni dello Studioso"
 relic_expedition_events.10.desc_true_cross: "Uno studioso itinerante che ha letto ogni cronaca di Hattin ha ristretto, da tre resoconti che concordano quasi per caso, il tratto di terreno dove si dice che i cavalieri in ritirata abbiano sepolto un frammento di $relic_true_cross_found$ anziché perderlo a favore di Saladino. Offre i suoi appunti, le sue mappe consunte e se stesso."
 relic_expedition_events.10.desc_holy_lance: "Uno studioso della Prima Crociata crede di aver individuato, in base al racconto di [GetCharacter('koj_petrus_bartholomaeus').GetName], la cantina da cui emerse $relic_holy_lance_found$ nel 1098. Sostiene che ciò che giaceva accanto non fu mai del tutto recuperato. I chierici rivali la definirono allora una fantasia, ma nessuno di loro la confutò."
 relic_expedition_events.10.desc_holy_shroud: "Un anziano antiquario è mezzo convinto da una voce di cui non sa indicare bene la fonte: un sudario con un'immagine murato in una cripta da monaci in fuga da un'incursione che non compare in nessuna cronaca. È quasi cieco e vuole un'ultima scoperta, e ci guiderà egli stesso sul posto."
 relic_expedition_events.10.desc_holy_nail: "Uno studioso di reliquie indica una cappella semicrollata dove la tradizione locale vuole che un sacerdote in fuga seppellisse un chiodo della Crocifissione prima dell'arrivo di soldati di passaggio."
 relic_expedition_events.10.desc_true_cross_fragment: "Tre generazioni di registri monastici, letti da cima a fondo, hanno condotto uno studioso a un eremitaggio abbandonato in fretta, dove si dice che l'ultimo eremita abbia posto un frammento di $relic_true_cross_found$ sotto il pavimento della cappella prima di fuggire per salvarsi la vita."
 relic_expedition_events.10.desc_saint_bones: "Un agiografo locale che lavora su registri parrocchiali in sfacelo si è fermato su una tomba senza nome ai margini di un vecchio cimitero: un santo minore le cui ossa furono nascoste anziché lasciate a un esercito ostile."
 relic_expedition_events.10.desc_baptist_head: "Da una cronaca frammentaria trovata in un archivio monastico, uno studioso sostiene che un reliquiario venerato come la testa di Giovanni Battista finì sotto il pavimento di una cappella durante un antico assedio, e che la cappella gli crollò sopra."
 relic_expedition_events.10.desc_virgin_milk: "Uno studioso che cita il diario di un pellegrino che nessun altro si è preso la briga di leggere indica una nicchia murata in un santuario abbandonato, dove si dice che i custodi abbiano nascosto una fiala del latte della Vergine anziché consegnarla ai saccheggiatori."
 relic_expedition_events.10.desc_holy_thorn: "Uno studioso ha letto la corrispondenza privata di una famiglia estinta e ha ricondotto una spina della Corona stessa alla loro cripta, sigillata dalla peste che svuotò la casa."
 relic_expedition_events.10.desc_holy_chalice: "C'è qui un filone della leggenda del Graal che non ha nulla a che fare con le celebri pretese di [ShowLocationName('genoa')] e [ShowLocationName('valencia')]. Lo studioso che lo segue crede che una semplice coppa di pietra giaccia sotto una cappella distrutta in un antico assedio, con la sua congregazione dispersa ben prima che a qualcuno venisse in mente di scavare."
 relic_expedition_events.10.desc_titulus_crucis: "La tradizione locale vuole che la tavola con l'iscrizione della Croce non sia mai andata a occidente. Uno studioso che prende sul serio quella tradizione ritiene che sia stata murata in una cappella di qui durante l'ultima ritirata crociata, e si offre di aiutare a trovare il muro."
 relic_expedition_events.10.a: "Assoldiamo manovali locali. Più braccia, più probabilità di successo."
 relic_expedition_events.10.b: "Scaviamo con gli uomini della spedizione. Meno domande."
 relic_expedition_events.10.c: "Nessun bisogno di pagare estranei. Il nostro seguito può scavare."

 relic_expedition_events.11.title: "Lo Scavo"
 relic_expedition_events.11.desc: "Il terreno è ostinato e lo scavo lento. [target_leader.GetName] non può far altro che attendere e scoprire se lo studioso sa leggere una mappa."
 relic_expedition_events.11.a: "Le vanghe urtano qualcosa. Proprio dove diceva lo studioso."
 relic_expedition_events.11.b: "Nient'altro che terra e macerie. Il sito era stato svuotato."

