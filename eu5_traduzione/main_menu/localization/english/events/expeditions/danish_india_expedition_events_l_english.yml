l_english:
 danish_india_expedition_events.1.title: "La Flotta della Compagnia delle Indie"
 danish_india_expedition_events.1.desc: "La patente è stata concessa, la compagnia organizzata, le navi noleggiate o costruite. Una piccola flotta di due o tre scafi d'alto mare partirà da un porto [ROOT.GetCountry.GetAdjective], scenderà a sud lungo la costa africana, doppierà il Capo di Buona Speranza, riattraverserà l'[ShowRegionName('indian_ocean_region')] e cercherà una concessione commerciale sulla costa del Coromandel, nel sud dell'$india$. Il viaggio è il primo del suo genere sotto bandiera [ROOT.GetCountry.Custom('IT_ADJ_FS')]. Passeranno almeno diciotto mesi prima che ne giunga qualche notizia. La [ROOT.GetCountry.GetGovernment.GetCourtTitle] è divisa tra chi vede in ciò una grande impresa e chi una grande follia."
 danish_india_expedition_events.1.a: "Approvvigioniamo la flotta con generosità. Non saremo ricordati come [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] che mandò i propri mercanti a morire."
 danish_india_expedition_events.1.b: "Una commissione modesta. La compagnia ha un proprio capitale."
 danish_india_expedition_events.1.historical_info: "La Compagnia Danese delle Indie Orientali (#italic Dansk Ostindisk Kompagni#!) fu fondata per patente da Cristiano IV nel 1616, e la sua prima spedizione, al comando dell'ammiraglio Ove Gjedde, salpò da Copenaghen nel 1618. Dopo un difficile viaggio di due anni che costò la vita alla maggior parte degli uomini a causa di scorbuto e malattie, la spedizione raggiunse la costa del Coromandel e negoziò con il Nayak di Tanjore una concessione commerciale nel villaggio di Tharangambadi (poi anglicizzato in Tranquebar). La fattoria fortificata di Dansborg fu completata nel 1620 e rimase danese fino alla vendita della colonia ai britannici nel 1845, facendo di Tranquebar uno degli insediamenti europei detenuti più a lungo in India."
 danish_india_expedition_events.2.title: "Il Capo delle Tempeste"
 danish_india_expedition_events.2.desc: "La flotta ha raggiunto il grande capo all'estremità meridionale dell'[ShowContinentName('africa')], il Capo che i [ShowCultureName('portuguese')] chiamarono giustamente Cabo das Tormentas. Il tempo qui, anche d'estate, è di un genere che nessun capitano del [ShowRegionName('baltic_region')] ha mai visto: il vento gira da sudovest con una forza che rovescia le navi sul fianco, e i frangenti sulla riva sottovento hanno il colore dei capelli di un vecchio. Il pilota suggerisce qualche giorno nella Baia della Tavola per fare acqua dolce e procurarsi carne dai pastori [ShowCultureGroupName('khoisan_group')] che pascolano il bestiame vicino alla spiaggia. I capitani sono divisi sull'opportunità di perdere il vento da sud per questa sosta."
 danish_india_expedition_events.2.a: "Facciamo scalo nella Baia della Tavola. Acqua dolce e manzo salveranno più uomini di quanti ne costeranno i giorni."
 danish_india_expedition_events.2.b: "Doppiamo il Capo a vele spiegate. Gli uomini berranno la pioggia, quando verrà."
 danish_india_expedition_events.2.historical_info: "Il Capo di Buona Speranza, doppiato per la prima volta da Bartolomeo Dias nel 1488, divenne la tappa di rifornimento abituale sulla rotta orientale dall'Europa all'Oceano Indiano. L'insediamento olandese permanente al Capo iniziò con la stazione di Jan van Riebeeck nella Baia della Tavola nel 1652, fondata appositamente per rifornire di acqua, verdure fresche e carne, scambiata con i pastori khoikhoi locali, le navi delle Indie Orientali di passaggio. Prima dell'insediamento olandese, le flotte di passaggio facevano scalo informalmente nella Baia della Tavola e trattavano direttamente con i Khoikhoi per bestiame, pecore e l'acqua salmastra dei piccoli corsi che scendevano dalla Table Mountain."
 danish_india_expedition_events.3.title: "La [ShowRegionNameWithNoTooltip('swahili_coast_region')]"
 danish_india_expedition_events.3.desc: "La flotta ha raggiunto [target_location.GetName], principale porto della [ShowRegionName('swahili_coast_region')], dove il commercio dell'[ShowRegionName('indian_ocean_region')] era organizzato da Arabi e Africani da quasi mille anni prima che nascesse un solo [ROOT.GetCountry.GetAdjective]. Il porto è pieno: dhow [ShowCultureName('omani_culture')], patamar [ShowCultureName('gujarati')] e perfino una malconcia nave [ShowCultureName('portuguese')] in riparazione nell'area di carenaggio. I piloti locali si offrono di guidarci attraverso il monsone fino alla costa del Coromandel per un compenso che ci pare esorbitante. I mercanti locali offrono carichi di [ShowGoodsName('ivory')], pali di mangrovia e [ShowGoodsName('goods_gold')] dell'alta [ShowAreaName('zambezi_area')] a prezzi che su qualsiasi altra costa sarebbero esorbitanti. Il [target_country.Custom('GetRulerOrRegentTitle')] ci offre una cordiale accoglienza e protezione finché ci troveremo nelle sue acque."
 danish_india_expedition_events.3.a: "Assumiamo il pilota [ShowCultureNameWithNoTooltip('swahili_culture')] e impariamo dal monsone da chi lo possiede."
 danish_india_expedition_events.3.b: "Fidiamoci dei nostri navigatori. I venti stagionali sono documentati a sufficienza."
 danish_india_expedition_events.3.historical_info: "La costa swahili, da Mogadiscio a Sofala, era stata una rete commerciale autorganizzata per quasi un millennio prima che le flotte europee iniziassero ad arrivare in gran numero. Mombasa, Malindi, Kilwa e le più piccole città di pietra della costa commerciavano i carichi dell'Oceano Indiano con le proprie navi, usavano i propri piloti e rispondevano ai propri sultani. La perturbazione portoghese di questa rete all'inizio del XVI secolo non sostituì mai del tutto il commercio indigeno, e le flotte europee del XVII secolo dirette in India pagavano abitualmente piloti swahili perché le guidassero attraverso il monsone di sudovest, un accordo che restituiva alle case mercantili swahili, nello stesso momento, preziose informazioni commerciali."
 danish_india_expedition_events.4.title: "Rada [european_power.Custom('IT_ADJ_FS')] presso [ShowAreaNameWithNoTooltip('cape_verde_area')]"
 danish_india_expedition_events.4.desc: "La flotta ha gettato l'ancora davanti a una piccola stazione commerciale [european_power.Custom('IT_ADJ_FS')] a [target_location.GetName]. Il fattore è un uomo di origini incerte e di notevole scaltrezza, che conduce un attento commercio di carne secca, di acqua delle sorgenti vulcaniche sopra la città e dei raccolti che il suo entroterra produce in quantità marginali sui pendii esposti al vento. Offre ai nostri capitani la sua ospitalità, i suoi prezzi e la sua franca opinione che qualsiasi flotta intenda attraversare l'[ShowContinentName('atlantic_ocean_continent')] senza rifornirsi qui sia una flotta che pianifica di seppellire il proprio equipaggio in mare. I capitani, a pensarci bene, non gli danno del tutto torto."
 danish_india_expedition_events.4.a: "Paghiamo i prezzi del fattore. Un uomo annegato costa più di un conto saldato."
 danish_india_expedition_events.4.b: "Prendiamo solo acqua. Gli uomini possono mangiare il biscotto di bordo ancora per un po'."
 danish_india_expedition_events.4.historical_info: "Le isole di Capo Verde, rivendicate dal Portogallo a metà del XV secolo, divennero la tappa di rifornimento abituale sul lungo tratto atlantico delle rotte per le Indie Orientali e il Brasile. Ribeira Grande, a Santiago, fondata intorno al 1462, fu la prima città europea ai tropici e per oltre un secolo il centro operativo della tratta atlantica portoghese degli schiavi. Quando una flotta della Compagnia danese delle Indie avrebbe potuto farvi scalo, la città era passata per diverse mani e la sua funzione di stazione di rifornimento persisteva per le flotte straniere disposte a pagare il fattore europeo che ora la gestiva."
 danish_india_expedition_events.5.title: "La [ShowAreaNameWithNoTooltip('gold_coast_area')] sotto Bandiera [european_power.Custom('IT_ADJ_FS')]"
 danish_india_expedition_events.5.desc: "La flotta è giunta all'altezza della [ShowAreaName('gold_coast_area')], dove una piccola stazione commerciale [european_power.Custom('IT_ADJ_FS')] domina il commercio locale con gli stati [ShowCultureName('akan')] dell'entroterra, in polvere di [ShowGoodsName('goods_gold')], [ShowGoodsName('slaves_goods')] e [ShowGoodsName('ivory')]. Più avanti sulla spiaggia si scorgono alcune pinasse europee rivali, ma il castello principale a questa latitudine batte la bandiera [european_power.Custom('IT_Di')][european_power.GetNameWithNoTooltip]. I kabosseer locali inviano un messaggero a invitare i nostri capitani a un colloquio, con l'implicita intesa che una piccola partita di polvere di [ShowGoodsNameWithNoTooltip('goods_gold')] possa cambiare di mano in cambio delle dovute cortesie. I capitani sono tentati, ma consapevoli che la flotta è diretta alle Indie, non al commercio africano."
 danish_india_expedition_events.5.a: "Accettiamo una piccola partita di polvere di [ShowGoodsNameWithNoTooltip('goods_gold')]. Le Indie sono lontane, e un costo coperto è un costo reale."
 danish_india_expedition_events.5.b: "Passiamo oltre la costa senza trattare. Non siamo qui per essere il settimo mercante europeo su questa spiaggia."
 danish_india_expedition_events.5.historical_info: "La Costa d'Oro (l'odierno Ghana) era stata il centro del commercio europeo con l'Africa occidentale da quando i portoghesi fondarono il Castello di Elmina nel 1482. All'inizio del XVII secolo la Costa era contesa tra mezza dozzina di potenze europee, con stazioni commerciali sotto altrettante bandiere che operavano a portata di vista l'una dall'altra. Il commercio era organizzato attraverso gli stati costieri africani dei Fante e dei Ga, che controllavano l'accesso ai giacimenti auriferi akan dell'entroterra e alle carovane che rifornivano di schiavi dall'interno."
 danish_india_expedition_events.6.title: "La Cittadella [european_power.Custom('IT_ADJ_FS')] di [target_location.GetNameWithNoTooltip]"
 danish_india_expedition_events.6.desc: "La flotta ha risalito il [ShowAreaName('mozambique_channel_area')] e si avvicina a [target_location.GetName], la piccola isola fortificata su cui poggia l'autorità [european_power.Custom('IT_Di')][european_power.GetName] sulla bassa [ShowRegionName('swahili_coast_region')]. Una fortezza di pietra domina l'ingresso del porto; una nave delle Indie sta scaricando al molo della dogana; un grande scafo sta imbarcando acqua per la traversata verso le Indie. Il capitano maggiore, che invita i nostri capitani a rendere omaggio alla cittadella, è cortese, vigile e istruttivo. Chiede sotto quale bandiera navighiamo e dove siamo diretti, e il suo scrivano annota con cura le risposte. Saremo ricordati a [european_power.GetCapital.GetName] dal prossimo dispaccio in partenza per la patria."
 danish_india_expedition_events.6.a: "Rendiamo omaggio alla cittadella. Una visita cordiale costa meno dell'ostilità [european_power.Custom('IT_Di')][european_power.GetNameWithNoTooltip]."
 danish_india_expedition_events.6.b: "Gettiamo l'ancora al largo. Possono registrarci da dove si trovano."
 danish_india_expedition_events.6.historical_info: "L'Ilha de Moçambique, fortificata dai portoghesi dal 1507, fu la capitale amministrativa dell'Africa Orientale Portoghese fino al 1898 e una tappa obbligata per le navi delle Indie tra Lisbona e Goa. La fortezza di São Sebastião, completata nel 1583, rimane la più grande struttura di architettura coloniale europea a sud del Sahara ancora in piedi. Verso la fine del XVII secolo la cittadella poteva cambiare padrone; la sua posizione strategica sulla bassa costa swahili ne faceva un premio naturale per qualsiasi potenza europea in grado di proiettare forza navale nell'Oceano Indiano occidentale."
 danish_india_expedition_events.14.title: "Flotta [danish_fleet.Custom('IT_ADJ_FS')] alla Stazione di [ShowAreaNameWithNoTooltip('cape_verde_area')]"
 danish_india_expedition_events.14.desc: "Il fattore della nostra stazione di [ShowAreaName('cape_verde_area')] riferisce che ieri una flotta [danish_fleet.Custom('IT_ADJ_FS')], due navi ben equipaggiate di foggia sconosciuta e battenti i colori della Compagnia delle Indie Orientali [danish_fleet.Custom('IT_ADJ_FS')], ha fatto scalo per acqua e provviste. Hanno pagato in buon argento, hanno imbarcato quanto basta a nutrire gli equipaggi attraverso l'[ShowContinentName('atlantic_ocean_continent')] e hanno ripreso il mare verso sud con il vento della mattina seguente. Il fattore descrive il capitano [danish_fleet.GetAdjectiveWithNoTooltip] come silenzioso, attento e chiaramente ben informato. Ha capito che la flotta è diretta nell'[ShowSubContinentName('south_asia')]. Ne sentiremo parlare ancora."
 danish_india_expedition_events.14.a: "Un fatto interessante. Annotiamolo nel prossimo dispaccio per la patria."
 danish_india_expedition_events.15.title: "Una Nave [danish_fleet.Custom('IT_ADJ_FS')] sulla [ShowAreaNameWithNoTooltip('gold_coast_area')]"
 danish_india_expedition_events.15.desc: "Il nostro fattore sulla [ShowAreaName('gold_coast_area')] riferisce che una nave [danish_fleet.Custom('IT_ADJ_FS')] ha fatto una breve sosta, ha acquistato una piccola partita di polvere di [ShowGoodsName('goods_gold')] al mercato del re locale ed è ripartita verso est. Il capitano ha lasciato intendere che la sua flotta era diretta alle Indie Orientali e non al commercio dell'[ShowContinentName('atlantic_ocean_continent')]. Il fattore aggiunge, con un certo disagio, che [danish_fleet.Custom('IT_La')][danish_fleet.GetNameWithNoTooltip] sembrava insolitamente pratica della costa per una potenza che qui non ha una propria stazione."
 danish_india_expedition_events.15.a: "Teniamoli d'occhio. Una presenza [danish_fleet.Custom('IT_ADJ_FS')] su questa costa è qualcosa da valutare prima che cresca."
 danish_india_expedition_events.16.title: "Flotta [danish_fleet.Custom('IT_ADJ_FS')] alla Cittadella di [ShowLocationNameWithNoTooltip('mozambique')]"
 danish_india_expedition_events.16.desc: "Il capitano maggiore della nostra cittadella di [ShowLocationName('mozambique')] riferisce l'arrivo di una flotta commerciale [danish_fleet.Custom('IT_ADJ_FS')], evidentemente diretta alla costa del Coromandel con un incarico commerciale. Il capitano [danish_fleet.GetAdjectiveWithNoTooltip] ha reso omaggio alla cittadella, ha accettato rinfreschi, ha risposto cordialmente alle domande e ne ha poste di attente lui stesso sulla traversata verso l'[ShowSubContinentName('south_asia')]. È ripartito entro la settimana. Il capitano maggiore ha inviato un dispaccio che descrive l'incontro; sapremo di più al suo arrivo."
 danish_india_expedition_events.16.a: "Prendiamo nota della visita. Una nuova bandiera nell'[ShowRegionNameWithNoTooltip('indian_ocean_region')] è il genere di notizia che vale la pena conservare."
 danish_india_expedition_events.7.title: "[target_location.GetNameWithNoTooltip] e il Monsone"
 danish_india_expedition_events.7.desc: "La flotta ha raggiunto [target_location.GetName] sul [ShowAreaName('oman_sea_zones_area')], dove la dinastia locale ha di recente costruito una flotta propria che contende all'[ShowRegionName('indian_ocean_region')] il traffico dal Golfo Persico alla costa dell'Africa orientale. Il capitano del porto [ShowCultureName('omani_culture')] è cortese, i prezzi sono ragionevoli e i piloti [ShowCultureGroupName('arabian_group')] che si ingaggiano per la traversata del monsone conoscono la costa del Coromandel come un marinaio del [ShowRegionName('baltic_region')] conosce gli accessi a [ShowLocationName('riga')]. Offrono i propri servigi per la traversata per un compenso che ci pare esorbitante. I capitani, dopo la loro esperienza a [ShowLocationName('mombasa')], sono inclini ad accettare."
 danish_india_expedition_events.7.a: "Assumiamo il pilota [ShowCultureNameWithNoTooltip('omani_culture')]. Il monsone è più clemente con la mano giusta sulla carta."
 danish_india_expedition_events.7.b: "Fidiamoci dei nostri piloti e delle carte di [ShowLocationNameWithNoTooltip('mombasa')]. Il vento è quello che è."
 danish_india_expedition_events.7.historical_info: "L'Imamato Yaarubide dell'Oman, fondato nel 1624, scacciò i portoghesi da Masqaṭ (Mascate) nel 1650 e costruì un impero commerciale e corsaro nell'Oceano Indiano che per oltre un secolo contese il primato europeo sulle coste dell'Africa orientale e della Persia. I piloti omaniti erano considerati le guide più affidabili per le traversate monsoniche tra Africa, Arabia, India e Indie Orientali, e il loro ingaggio era un normale costo d'esercizio per le flotte europee disposte ad ammettere che i propri navigatori non conoscessero l'Oceano Indiano quanto avrebbero preferito."
