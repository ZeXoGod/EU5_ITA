l_english:

 expedition_succession_events.new_leader_tt: "[target_leader.GetName] assume il comando della spedizione"
 expedition_succession_events.morale_down_tt: "Il morale dell'equipaggio soffre per la perdita del proprio capo (#R -20#! Morale dell'Equipaggio)"

 expedition_succession_events.1.title: "Una Nuova Mano alle Carte"
 expedition_succession_events.1.desc: "A [ROOT.GetCountry.GetCapital.GetName] giunge notizia che il capo della spedizione è morto. Per fortuna, tra gli ufficiali ancora a bordo c'è un uomo con abbastanza istruzione e ardimento da saper leggere una carta e tenere unito un equipaggio, e gli altri si sono rimessi a lui fin dalla perdita.\n\nL'equipaggio lo conferma al comando, e la spedizione prosegue sotto la sua guida."
 expedition_succession_events.1.a: "Così sia. Il viaggio continua."

 expedition_succession_events.2.title: "Un Nuovo Capitano Generale"
 expedition_succession_events.2.desc: "A [ROOT.GetCountry.GetCapital.GetName] giunge notizia che l'ammiraglio della flotta è morto. Una flotta non può navigare senza guida in queste acque, ma per fortuna uno dei suoi ufficiali è abbastanza anziano e capace perché gli altri accettino la sua parola come legge, e ha già preso posto sul cassero.\n\nGli ufficiali lo confermano come nuovo comandante della flotta, e il viaggio continua sotto di lui."
 expedition_succession_events.2.a: "Così sia. La flotta prosegue."

 expedition_succession_events.generic_new_leader_tt: "[target.GetName] assume il comando della spedizione"
 expedition_succession_events.3.title: "Il Comando Passa di Mano"
 expedition_succession_events.3.desc: "Un dispaccio portato in patria dall'ultima barca di ritorno riferisce che [former_leader.GetName], che guidava la spedizione, è morto sul campo. La compagnia non ha atteso istruzioni: quando la lettera è stata sigillata, i sopravvissuti avevano già risolto la questione tra loro, come tendono a fare gli uomini lontani da ogni corte.\n\n[target.GetName] ha assunto il comando, e la spedizione prosegue."
 expedition_succession_events.3.a: "L'impresa è più grande di qualunque singolo uomo."
