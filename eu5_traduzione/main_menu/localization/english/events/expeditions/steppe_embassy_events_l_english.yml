l_english:
 steppe_embassy_events.1.title: "Ambasciata alle Corti della Steppa"
 steppe_embassy_events.1.desc: "L'ambasciata parte. La corte del Grande $rank_kingdom_horde_ruler_suffix_male$ si trova a molti mesi di viaggio verso est, attraverso deserti e praterie che si stendono senza fine."
 steppe_embassy_events.1.desc.glh: "$steppe_embassy_events.1.desc$ [dest_city.GetName]: gioiello della steppa del Volga, sede del $rank_kingdom_horde_ruler_suffix_male$ [dest_country.Custom('IT_Della')][dest_country.GetName]. La strada corre a nordest attraverso i porti del [ShowAreaName('black_sea_area')] e dentro le praterie aperte. Il modo in cui [target_leader.GetName] si presenterà alla [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip] determinerà ogni cosa."
 steppe_embassy_events.1.desc.chg: "$steppe_embassy_events.1.desc$ [dest_city.GetName]: antica città della Via della Seta, capitale [dest_country.Custom('IT_Di')][dest_country.GetName]. La strada attraversa la [ShowRegionName('persia_region')] e valica le montagne fino al cuore dell'[ShowContinentName('asia')]. Il modo in cui [target_leader.GetName] si presenterà alla [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip] determinerà ogni cosa."
 steppe_embassy_events.1.a: "Cavalchiamo da guerrieri: la nostra forza è l'unica lettera di cui abbiamo bisogno."
 steppe_embassy_events.1.b: "Un'ambasciata sontuosa: [ShowGoodsNameWithNoTooltip('silver')], [ShowGoodsNameWithNoTooltip('silk')] e cerimoniale, a sufficienza per impressionare persino un Gran [dest_country.Custom('GetRulerOrRegentTitle')]."
 steppe_embassy_events.1.c: "Una modesta delegazione commerciale: pratica, rispettosa e con doni sufficienti ad aprire le porte."
 steppe_embassy_events.1.historical_info: "Il contatto diplomatico diretto con gli stati successori dei Mongoli fu un'ambizione ricorrente dei sovrani europei e mediorientali per tutto il XIV secolo. Le ambasciate occidentali presso l'Ilkhanato, l'Orda d'Oro e altre corti andavano da missioni cerimoniali sontuose a imprese commerciali pratiche, ciascuna plasmata da ciò che il mittente sperava di ottenere."
 steppe_embassy_events.2.title: "Ai Margini della Steppa"
 steppe_embassy_events.2.desc: "La carovana si ferma al confine. Oltre, la terra si appiattisce in un mare d'erba che si estende fino all'orizzonte. Esploratori della [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip] seguono da giorni la colonna di [target_leader.GetName], osservando senza avvicinarsi. Qualunque impressione si faccia qui precederà l'ambasciata presso la [dest_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.2.a: "Avanziamo in formazione, con le insegne al vento e le lance levate. Che portino notizia di ciò che hanno visto."
 steppe_embassy_events.2.b: "Mandiamo avanti i doni con un araldo e chiediamo una scorta formale fino alla [dest_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.2.c: "Annunciamoci formalmente e attendiamo il loro permesso di attraversare."
 steppe_embassy_events.2.historical_info: "I confini degli stati successori dei Mongoli erano permeabili ma sorvegliati. Mercanti, diplomatici e missionari li attraversavano tutti, ma presentarsi senza adeguate presentazioni poteva essere preso per un insulto o una minaccia."
 steppe_embassy_events.3.title: "Cavalieri all'Orizzonte"
 steppe_embassy_events.3.desc: "Da tre giorni le stesse sagome lontane ombreggiano la colonna: una dozzina di cavalieri che non si avvicinano mai, non si ritirano mai, si limitano a osservare. La steppa appartiene a chi sa leggerla. La notizia avrà raggiunto la [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip] molto prima di [target_leader.GetName]."
 steppe_embassy_events.3.a: "Teniamo la colonna compatta. Che vedano la nostra disciplina."
 steppe_embassy_events.3.b: "Mandiamo avanti un cavaliere con un invito. Forse si uniranno a noi attorno al fuoco."
 steppe_embassy_events.3.historical_info: "L'esplorazione dell'avvicinamento delle ambasciate straniere era una pratica normale alle corti della steppa. Le informazioni sul numero, l'equipaggiamento e il comportamento di un visitatore determinavano il modo in cui sarebbe stato accolto."
 steppe_embassy_events.4.title: "Briganti sulla Strada"
 steppe_embassy_events.4.desc: "La strada si restringe in una gola e uomini armati bloccano il passaggio, una ventina, stracciati ma ben armati. Il loro capo urla una richiesta di pedaggio in una lingua che [target_leader.GetName] non parla. L'interprete traduce: dieci cavalli o argento equivalente. Non è la prima volta che lo fanno."
 steppe_embassy_events.4.a: "Paghiamo. Una scaramuccia qui potrebbe costare più del denaro."
 steppe_embassy_events.4.b: "Mostriamo loro che non siamo venuti fin qui per farci derubare dai banditi."
 steppe_embassy_events.4.historical_info: "Le grandi strade della steppa non furono mai davvero sicure. Anche le ambasciate ufficiali rischiavano l'incontro con briganti, soldati ribelli e opportunisti che agivano nelle lacune dell'autorità dei khan."
 steppe_embassy_events.5.title: "Il Sapere di un Mercante"
 steppe_embassy_events.5.desc: "In un [ShowBuildingTypeName('caravanserai')] lungo la strada verso est, un mercante segnato dalle intemperie si avvicina a [target_leader.GetName] davanti a una tazza di tè. È stato cinque volte alla [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip]. Sa quali doni sono offensivi, quali usanze vanno osservate entrando nella sala del trono e che cosa il [dest_country.Custom('GetRulerOrRegentTitle')] cerca quest'anno dai visitatori stranieri. Si offre di condividere tutto, a pagamento."
 steppe_embassy_events.5.a: "Paghiamo per il suo consiglio. La conoscenza della [dest_country.GetGovernment.GetCourtTitle] [dest_country.GetAdjectiveWithNoTooltip] vale più dell'oro."
 steppe_embassy_events.5.b: "Abbiamo letto ciò che dovevamo leggere. Ringraziamolo e proseguiamo."
 steppe_embassy_events.5.historical_info: "Le reti di mercanti della Via della Seta erano i migliori servizi di informazione del mondo medievale. Un commerciante veterano che avesse compiuto più volte il circuito delle grandi corti asiatiche possedeva conoscenze politiche non reperibili in alcuna biblioteca europea."
 steppe_embassy_events.6.title: "Udienza a [target_location.GetNameWithNoTooltip]"
 steppe_embassy_events.6.desc: "Le tende di [target_location.GetName] si estendono lungo il Volga per miglia. Al centro, la grande yurta di [court_host.GetName] risplende di foglia d'[ShowGoodsName('goods_gold')] e di tendaggi di [ShowGoodsName('silk')], circondata dalle corti di una dozzina di principi vassalli e dall'apparato permanente di un impero mondiale. [target_leader.GetName] viene ricevuto nella sala esterna e condotto a un posto tre file dietro il trono, che è esattamente dove spettano i servitori di una potenza straniera minore. [court_host.GetNameWithNoTooltip] osserva con il paziente disinteresse di chi ha ricevuto un centinaio di simili ambasciate."
 steppe_embassy_events.6.a: "Sfidiamo i loro cavalieri a una dimostrazione d'armi in campo aperto."
 steppe_embassy_events.6.b: "Presentiamo i doni con tutto il cerimoniale che l'occasione richiede."
 steppe_embassy_events.6.c: "Proponiamo l'apertura di una rotta commerciale attraverso il territorio [court_country.Custom('IT_Di')][court_country.GetNameWithNoTooltip]."
 steppe_embassy_events.6.d: "Facciamo tesoro di ciò che abbiamo appreso lungo la strada: i costumi, i protocolli, gli interessi particolari di questa [court_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.6.historical_info: "L'Orda d'Oro mantenne un'elaborata cultura di corte che fondeva la tradizione mongola con la raffinatezza amministrativa persiana e una notevole apertura verso mercanti e diplomatici stranieri. La corte di Sarai ricevette ambasciate da Bisanzio, dall'Egitto e da numerosi regni europei per tutto il XIV secolo."
 steppe_embassy_events.7.title: "Udienza a [target_location.GetNameWithNoTooltip]"
 steppe_embassy_events.7.desc: "[target_location.GetName] non è ciò che [target_leader.GetName] si aspettava. Le madrase e i minareti si innalzano sopra strade piene di mercanti di ogni angolo del mondo conosciuto. La corte di [court_host.GetName] riceve l'ambasciata in una sala di piastrelle azzurre e stucchi scolpiti, assistita da astronomi, poeti e ambasciatori di una dozzina di potenze orientali. [court_host.GetNameWithNoTooltip] siede su un trono intarsiato di giada, affiancato da segretari che registrano tutto contemporaneamente in caratteri [ShowLanguageName('persian_language')] e [ShowLanguageName('mongolian_language')]."
 steppe_embassy_events.7.a: "Coinvolgiamo gli studiosi di corte in una discussione filosofica. [court_host.GetNameWithNoTooltip] ha da offrire più degli eserciti."
 steppe_embassy_events.7.b: "Presentiamo i doni con tutto il cerimoniale che l'occasione richiede."
 steppe_embassy_events.7.c: "Proponiamo un accordo commerciale per aprire le rotte attraverso il territorio [court_country.Custom('IT_Di')][court_country.GetNameWithNoTooltip]."
 steppe_embassy_events.7.d: "Facciamo tesoro della guida del mercante sui costumi particolari di questa [court_country.GetGovernment.GetCourtTitle]."
 steppe_embassy_events.7.historical_info: "Samarcanda, sotto il Khanato Chagatai e poi sotto i Timuridi, divenne uno dei più grandi centri di sapere e commercio islamici del mondo. La corte era raffinata e cosmopolita, e alle ambasciate straniere si chiedeva di dimostrare credibilità culturale oltre che politica."
