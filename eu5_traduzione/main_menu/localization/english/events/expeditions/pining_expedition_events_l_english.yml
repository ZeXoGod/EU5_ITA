l_english:
 pining_expedition_events.1.title: "Incarico [ROOT.GetCountry.GetGovernment.GetAdjective] per i Mari del Nord"
 pining_expedition_events.1.desc: "[ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] [ROOT.GetCountry.Custom('IT_CROWN_HA')] incaricato un corsaro di notevole reputazione, da poco tornato dalle incursioni sulle rotte commerciali [ShowCultureName('hanseatic')], di condurre una piccola squadra a nord e a ovest, nell'ignoto [ShowContinentName('atlantic_ocean_continent')]. Il viaggio toccherà [ShowLocationName('shetland')], farà rotta verso le terre fredde di [ShowAreaName('iceland_area')] e [ShowAreaName('greenland_area')] che le saghe ricordano, e poi si spingerà ancora oltre, verso qualunque cosa si trovi al di là. Esistono vecchie carte [ShowCultureName('icelandic')] che accennano a una costa boscosa più a ovest di quanto qualsiasi marinaio vivente abbia mai visto. [target_leader.GetName] dice che [target_leader.GetSheHe] può farcela, purché adeguatamente rifornito. Gli scrivani del [ROOT.GetCountry.Custom('GetHeadOfCabinetName')] stanno ancora calcolando quanto costerebbe il naufragio della squadra."
 pining_expedition_events.1.a: "Approvvigioniamo la squadra al completo. Non vogliamo essere ricordati per la nostra avarizia."
 pining_expedition_events.1.b: "Un incarico modesto. Che [target_leader.GetNameWithNoTooltip] dimostri che la rotta esiste prima che il tesoro si apra di più."
 pining_expedition_events.1.historical_info: "Didrik Pining, un corsaro di origine tedesca al servizio della corona danese, fu incaricato intorno al 1473 da Cristiano I di Danimarca di guidare un viaggio verso ovest attraverso l'Atlantico settentrionale. La spedizione non fu documentata ufficialmente all'epoca, e il poco che se ne sa proviene da successivi riferimenti nella corrispondenza anseatica e da un'osservazione del cosmografo portoghese Martin Behaim, secondo cui Pining e il suo collega Hans Pothorst avevano toccato una costa molto a ovest della Groenlandia. La Danimarca non diede mai seguito al viaggio, e il silenzio della documentazione ufficiale ha alimentato secoli di dibattito storiografico su cosa, ammesso che sia accaduto, i capitani abbiano effettivamente trovato."
 pining_expedition_events.2.title: "Marinai [ShowCultureNameWithNoTooltip('icelandic')] e Antiche Saghe"
 pining_expedition_events.2.desc: "La squadra ha riparato sottovento alla costa dell'[ShowAreaName('iceland_area')] per fare acqua dolce e consultarsi con i capitani dei porti dei piccoli insediamenti di pescatori. La gente del posto, [ShowCultureName('icelandic')], è riservata dapprima, poi loquace quando compare il [ShowGoodsName('wine')]: raccontano di nonni che ricordavano uomini tornati dalla [ShowAreaName('greenland_area')] con storie di una terra boscosa ancora più a ovest, di navi perdute nel ghiaccio, di un vecchio che sosteneva di aver visto le ossa di una strana bestia esposte in una cappella a [ShowLocationName('brattahlid')]. Il pilota si offre di venderci, a un prezzo equo, i frammenti di carte che la sua famiglia conserva dai tempi in cui la rotta occidentale fu percorsa per l'ultima volta."
 pining_expedition_events.2.a: "Compriamo le saghe e i frammenti di carte. La conoscenza è raramente a buon mercato."
 pining_expedition_events.2.b: "Prendiamo ciò che viene dato liberamente. I nostri piloti hanno le proprie osservazioni da fare."
 pining_expedition_events.2.historical_info: "L'Islanda medievale conservò una notevole memoria orale e scritta dei viaggi norreni in Groenlandia e nelle terre più a ovest, registrata nelle saghe di Erik il Rosso e nelle saghe del Vinland di Leif Eriksson. Alla fine del XV secolo questi racconti erano in gran parte usciti dall'uso dei marinai attivi, ma frammenti dell'antica conoscenza sopravvivevano nelle famiglie di pescatori e capitani mercantili islandesi. I viaggi tardomedievali danesi, inglesi e di Bristol verso l'Atlantico occidentale passavano di regola dall'Islanda per rifornirsi e quasi certamente vi trovarono informatori islandesi."
 pining_expedition_events.3.title: "Fattorie Abbandonate sulla Costa della [ShowAreaNameWithNoTooltip('greenland_area')]"
 pining_expedition_events.3.desc: "La squadra ha raggiunto la costa occidentale della [ShowAreaName('greenland_area')] e ha fatto sbarcare un gruppo in uno dei piccoli fiordi descritti nelle antiche carte [ShowCultureName('icelandic')]. L'insediamento che avrebbe dovuto esserci è scomparso: la chiesa sta in piedi senza tetto, le case lunghe sono crollate, il cimitero è invaso dalla vegetazione. In una delle case troviamo un corpo, in parte conservato dal freddo, vestito di abiti dell'Europa settentrionale che il cronista stima vecchi di una generazione. Non è rimasto nessuno a cui chiedere cosa sia accaduto. Gli uomini tornano alle navi sommessi. Il paese che siamo venuti a mappare è un paese che ha già seppellito i suoi precedenti abitanti."
 pining_expedition_events.3.a: "Seppelliamo le ossa che troviamo. Lasciamo una pietra con il marchio del [ROOT.GetCountry.Custom('GetRulerOrRegentTitle')]. Proseguiamo verso ovest."
 pining_expedition_events.3.b: "Facciamo vela. Gli insediamenti [ShowCultureNameWithNoTooltip('icelandic')] non sono più affar nostro."
 pining_expedition_events.3.historical_info: "Gli insediamenti norreni in Groenlandia, l'Insediamento Orientale (Eystribyggð) e quello Occidentale (Vestribyggð), fondati da Erik il Rosso negli anni 980, durarono per circa quattrocento anni prima di essere progressivamente abbandonati. Le cause esatte sono dibattute e probabilmente molteplici: l'effetto di raffreddamento della Piccola Era Glaciale sull'agricoltura groenlandese, la competizione con la popolazione inuit Thule in espansione, il crollo del commercio dell'avorio di tricheco controllato dai norvegesi che aveva sostenuto l'economia di esportazione delle colonie, e forse l'emigrazione di ritorno in Islanda e Norvegia. Quando Pining salpò, negli anni 1470, l'Insediamento Occidentale era scomparso da oltre un secolo e quello Orientale era probabilmente scomparso o nella sua fase finale di declino."
 pining_expedition_events.5.title: "Il Popolo [norse_greenland.GetCulture.GetAdjectiveWithNoTooltip]"
 pining_expedition_events.5.desc: "La squadra ha raggiunto [target_location.GetName], sede del [norse_greenland.Custom('GetRulerOrRegentTitle')] e capitale effettiva della colonia [norse_greenland.Custom('IT_ADJ_FS')] in [ShowAreaName('greenland_area')]. L'insediamento è molto ridotto rispetto a quanto descrivono le antiche saghe, ma è ancora lì: una cattedrale con il tetto di piombo intatto, qualche dozzina di case lunghe di zolle, pecore sui pendii, barche da pesca tirate in secca sulla spiaggia di ghiaia. Il [norse_greenland.Custom('GetRulerOrRegentTitle')] e il portavoce della legge ricevono i nostri capitani con la gravità di uomini che non vedono da anni una nave dall'[ShowSubContinentName('europe')]. Sono ansiosi di notizie, ansiosi di merci di scambio e non riluttanti a condividere ciò che sanno delle acque occidentali."
 pining_expedition_events.5.a: "Lasciamo un dono generoso presso la sede del [norse_greenland.Custom('GetRulerOrRegentTitle')]. [ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] non dimentica i suoi sudditi più lontani."
 pining_expedition_events.5.b: "Facciamo acqua e provviste, scambiamo cortesie e proseguiamo verso ovest."
 pining_expedition_events.5.historical_info: "Gli insediamenti norreni in Groenlandia furono fondati da Erik il Rosso intorno al 985 e durarono per circa quattrocento anni. La sede vescovile di Garðar, istituita nel 1124, fu la diocesi più occidentale della Chiesa cattolica medievale e rimase occupata almeno in modo intermittente fino alla fine del XV secolo, quando il graduale abbandono della colonia divenne infine totale. La causa del collasso è dibattuta e probabilmente multifattoriale: vi contribuirono la Piccola Era Glaciale, l'espansione inuit verso sud, la perdita del mercato norvegese dell'avorio di tricheco e l'emigrazione di ritorno in Islanda e Norvegia."
 pining_expedition_events.4.title: "Una Costa Boscosa"
 pining_expedition_events.4.desc: "La squadra ha navigato per tre settimane a ovest e a nord della [ShowAreaName('greenland_area')] attraverso acque libere e ghiaccio spezzato, e ora si è avvicinata a una costa che non corrisponde ad alcuna carta in nostro possesso. La riva è scura di alberi fino al bordo dell'acqua. [target_leader.GetName] sbarca con un piccolo gruppo su una barca di bordo, attraverso frangenti che i marinai della [ShowAreaNameWithNoTooltip('greenland_area')] avrebbero detto impossibili. Tornano a sera con rami di una specie sconosciuta, una punta di freccia finemente lavorata di [ShowGoodsName('stone')] grigia e la descrizione di impronte nella sabbia che non suggerivano né stivali europei né altro a cui sapessero dare un nome. Il cronista, quando gli viene mostrata la punta di freccia, rivolge a [target_leader.GetNameWithNoTooltip] una domanda a cui [target_leader.GetSheHe] non sa rispondere."
 pining_expedition_events.4.a: "Piantiamo a terra lo stendardo [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]. Che il mondo sappia che questa costa è stata raggiunta [ROOT.Custom('IT_Dalla')][ROOT.GetNameWithNoTooltip]."
 pining_expedition_events.4.b: "Registriamo la costa in una carta privata. [ROOT.GetCountry.Custom('IT_CROWN_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] lo saprà. Gli altri non ne hanno bisogno."
 pining_expedition_events.4.historical_info: "Se Didrik Pining abbia davvero raggiunto la costa del Labrador o di Terranova nel suo viaggio del 1473 resta un punto controverso nella storia dell'esplorazione atlantica precolombiana. La prova più citata è una nota a margine sul globo di Martin Behaim del 1492 e una lettera del 1551 del geografo danese Jacob Cnoyen che accenna al 'viaggio settentrionale di Pining e Pothorst alla ricerca di uno stretto'. Una piccola minoranza di studiosi attribuisce al viaggio il raggiungimento della terraferma nordamericana vent'anni prima della prima traversata di Colombo più a sud; l'opinione più comune è che i capitani possano aver toccato la Groenlandia o il Labrador senza produrre alcuna rivendicazione o carta utilizzabile. La Danimarca, in ogni caso, non ne fece nulla."
