l_english:

 circumnavigation_expedition_events.1.title: "La Grande Impresa"
 circumnavigation_expedition_events.1.desc: "Cinque navi. Duecentosettanta uomini. Provviste per un anno e una rotta che nessun pilota ha mai navigato. [target_leader.GetName] parla con calma di isole ricche di chiodi di garofano e di un passaggio verso occidente fino alle Isole delle Spezie. Il capitano di porto non ci crede. I piloti sono incerti. Ma le navi sono rifornite, il vento è favorevole e l'incarico reca il sigillo reale.\n\nDavanti a noi c'è tutto ciò che non è ancora su nessuna carta."
 circumnavigation_expedition_events.1.magellan: "Facciamo rotta per le Canarie. Se Dio vuole, troveremo il Mare Occidentale."
 circumnavigation_expedition_events.1.a: "Puntiamo verso le Canarie. Ciò che c'è oltre, lo scopriremo."
 circumnavigation_expedition_events.1.historical_info: "Nel settembre del 1519, Ferdinando Magellano partì da Sanlúcar de Barrameda su incarico della Corona spagnola per trovare una rotta occidentale verso le Isole delle Spezie. La spedizione era composta da cinque navi: la #italic Trinidad#!, la #italic San Antonio#!, la #italic Concepción#!, la #italic Victoria#! e la #italic Santiago#!. Magellano era un navigatore portoghese che aveva viaggiato verso l'India e le Molucche al servizio del Portogallo, prima di trasferire la propria fedeltà alla Corona spagnola dopo che re Manuele I si era rifiutato di aumentargli lo stipendio. Il viaggio sarebbe diventato la prima circumnavigazione della Terra, anche se Magellano stesso non sarebbe vissuto abbastanza per vederne il compimento."

 circumnavigation_expedition_events.2.title: "L'Ultima Riva Familiare"
 circumnavigation_expedition_events.2.desc: "[current_location.GetProvince.GetName] si leva dal mare in piatte terrazze brune, fortezze di roccia contro un cielo che è ancora lo stesso cielo di [departure_port.GetName]. I piloti eseguono gli ultimi scandagli. Gli uomini bevono acqua fresca da botti di ferro e riparano il sartiame logorato dalla risacca atlantica. Oltre l'ultimo promontorio, le carte finiscono.\n\nAlcuni uomini pregano. Qualcuno scrive lettere che non ha modo di spedire. [target_leader.GetName] cammina sul ponte come misurando qualcosa che non si può misurare. Ciò che si carica ora dovrà durare attraverso un oceano e oltre."
 circumnavigation_expedition_events.2.a: "Imbarchiamo provviste complete. Potremmo non passare più di qui."
 circumnavigation_expedition_events.2.b: "Partiamo subito, finché il coraggio degli uomini regge."
 circumnavigation_expedition_events.2.c: "La rotta è troppo incerta. Torniamo in porto."
 circumnavigation_expedition_events.2.historical_info: "Le isole Canarie, allora sotto il dominio castigliano, servivano da tappa standard di rifornimento per le spedizioni atlantiche iberiche in tutta l'Età delle Esplorazioni. La flotta di Magellano fece scalo a Tenerife per imbarcare provviste fresche prima di iniziare la lunga traversata atlantica verso la costa del Sud America. Le isole erano state colonizzate dalla Castiglia all'inizio del XV secolo e servivano sia da deposito di rifornimenti sia da punto di partenza per viaggi in acque ignote. Quanto a fondo una flotta si riforniva qui poteva decidere se i suoi equipaggi sarebbero sopravvissuti alle leghe vuote a venire."

 circumnavigation_expedition_events.3.title: "Il Margine del Nuovo Mondo"
 circumnavigation_expedition_events.3.desc: "Dopo settimane di [ShowContinentName('atlantic_ocean_continent')] aperto, una bassa linea verde si definisce all'orizzonte occidentale: la costa di un Nuovo Mondo. I pappagalli strillano nella foresta e l'acqua scorre dolce da cento fiumi. Canoe salpano dalla riva, i loro rematori curiosi e senza paura, che offrono legna, acqua e frutti strani. Qui c'è tutto ciò che una flotta stanca potrebbe desiderare, ma la stagione sta cambiando e il passaggio verso sud non è ancora stato trovato.\n\n[target_leader.GetName] soppesa il conforto della riva contro le miglia ancora da percorrere."
 circumnavigation_expedition_events.3.a: "Sbarchiamo per legna, acqua e frutta; commerciamo con la gente del posto."
 circumnavigation_expedition_events.3.b: "La costa può aspettare. Proseguiamo verso sud finché la stagione regge."
 circumnavigation_expedition_events.3.historical_info: "La flotta di Magellano raggiunse la costa brasiliana alla fine del 1519, approdando nei pressi di Cabo de Santo Agostinho prima di proseguire verso sud. Il Brasile ricadeva nella metà portoghese del mondo secondo il Trattato di Tordesillas, e una flotta al servizio della Spagna non poteva indugiare apertamente su quella riva; ciononostante i Tupi della costa commerciarono con entusiasmo, e l'abbondanza della terra fu un gradito sollievo dopo la traversata atlantica."

 circumnavigation_expedition_events.4.title: "La Grande Baia"
 circumnavigation_expedition_events.4.desc: "La flotta entra in una baia così vasta e riparata da sembrare un dono, cinta da verdi montagne, con le acque argentee di pesci. La gente della riva esce a frotte, scambiando volatili, frutta e pesce con ami e coltelli, offrendo più di quanto le stive possano portare. Dopo il lungo viaggio attraverso l'Atlantico è un paradiso, e gli uomini non se ne andrebbero mai volentieri.\n\nMa il paradiso è un cattivo padrone per un viaggio. [target_leader.GetName] deve decidere quanto a lungo la flotta possa indugiare."
 circumnavigation_expedition_events.4.a: "Facciamo riposare gli equipaggi e riforniamoci a fondo; tanta abbondanza non ritornerà."
 circumnavigation_expedition_events.4.b: "Scambiamo per le provviste che possiamo e partiamo entro una settimana."
 circumnavigation_expedition_events.4.c: "Non siamo qui per banchettare. Proseguiamo senza commerciare."
 circumnavigation_expedition_events.4.historical_info: "La grande baia che avrebbe poi accolto Rio de Janeiro diede alla flotta di Magellano il più ricco rifornimento dell'intero viaggio. Le sue acque riparate pullulavano di pesci, e i Tupi della costa scambiavano provviste in quantità sbalorditive in cambio di bagattelle e attrezzi di ferro. Un rifornimento approfondito qui temprò gli equipaggi per le latitudini fredde e la ricerca dello stretto; una flotta che avesse fretta di proseguire pagava la propria fretta al sud."

 circumnavigation_expedition_events.5.title: "La Foce d'Argento"
 circumnavigation_expedition_events.5.desc: "I piloti sapevano che doveva esserci un passaggio. Nessun continente poteva proseguire per sempre. Ma il grande estuario è così largo che la riva opposta non si vede dall'albero, e l'acqua, per quanto salmastra, corre marrone di limo per quaranta leghe fino al mare aperto. Le barche vengono mandate a risalire la foce per due settimane.\n\nTornano con notizie di pesci gatto, acque basse e nessun passaggio verso alcun oceano. Da qualche parte più a sud, il vero passaggio attende, ammesso che esista."
 circumnavigation_expedition_events.5.a: "Esploriamo l'estuario a dovere; potrebbe valere la pena di conoscerlo."
 circumnavigation_expedition_events.5.b: "Non abbiamo tempo per fiumi che non portano da nessuna parte. Proseguiamo verso sud."
 circumnavigation_expedition_events.5.press_tt: "La flotta prosegue verso sud senza indugio, in cerca del passaggio che deve trovarsi da qualche parte più in basso"
 circumnavigation_expedition_events.5.c: "Queste latitudini sono oltre ogni ragione. Torniamo a casa."
 circumnavigation_expedition_events.5.historical_info: "Il Río de la Plata, il 'Fiume d'Argento', fu esplorato dal navigatore spagnolo Juan Díaz de Solís nel 1516, che fu ucciso dagli indigeni poco dopo l'approdo. La spedizione di Magellano indagò l'estuario nel gennaio 1520, credendo erroneamente che potesse essere il passaggio verso occidente. L'errore costò loro diverse settimane ma produsse il primo rilevamento spagnolo dettagliato della regione del Río de la Plata. Il fiume prese il nome dall'argento scambiato lì dai popoli Charrúa e Guaraní, anche se le montagne d'argento di cui si vociferava più all'interno si rivelarono sfuggenti."

 circumnavigation_expedition_events.6.title: "Il Passaggio alla Fine del Mondo"
 circumnavigation_expedition_events.6.desc: "Il passaggio è freddo, stretto e micidiale. Pareti di roccia nera si ergono a picco su entrambi i lati, e il canale si ripiega su se stesso finché i piloti non sanno più dire in quale direzione sia l'ovest. Il vento è il vero nemico: incanalandosi giù dai campi di neve cambia direzione senza preavviso, urlando nel sartiame in improvvisi groppi bianchi che respingono le navi da dove sono venute e le inchiodano per giorni contro la roccia.\n\n[target_leader.GetName] sta in silenzio a prua della nave ammiraglia mentre le pareti si stringono. I piloti dicono che il passaggio è navigabile. Gli uomini non sono certi che i piloti siano sani di mente. Da qualche parte più avanti, se alle carte si può credere, c'è un oceano così vasto da non avere ancora un nome."
 circumnavigation_expedition_events.6.a: "Spingiamo le navi attraverso. Il solo vento non ci fermerà ora."
 circumnavigation_expedition_events.6.b: "Svernamo qui. Il passaggio sarà più clemente con equipaggi riposati."
 circumnavigation_expedition_events.6.c: "Nessuna rotta vale questo. Facciamo invertire la rotta alla flotta."
 circumnavigation_expedition_events.6.historical_info: "Lo Stretto di Magellano, percorso nel novembre del 1520, è un passaggio di 570 chilometri attraverso l'estrema punta meridionale del Sud America, fiancheggiato dall'isola della Terra del Fuoco, così chiamata per i fuochi di guardia dei suoi abitanti. Il transito richiese 38 giorni. Durante l'avvicinamento, Magellano represse un ammutinamento a Porto San Julián, giustiziando un capitano e abbandonandone un altro su una costa deserta. Una terza nave, la #italic San Antonio#!, disertò e tornò in Spagna. Le restanti tre, #italic Trinidad#!, #italic Concepción#! e #italic Victoria#!, entrarono il 28 novembre 1520 in quello che Magellano chiamò #italic Mar Pacífico#!, così detto per la sua apparente calma dopo i terrori dello stretto."

 circumnavigation_expedition_events.7.title: "Il Mare che Chiamarono Pacifico"
 circumnavigation_expedition_events.7.desc: "L'ultimo promontorio nero dello stretto resta a poppa, e davanti alla flotta si apre un oceano senza limiti. [target_leader.GetName] lo chiama #italic Mar Pacífico#! per la sua calma, una calma che diventerà una maledizione. Una settimana cede il posto all'altra e nessuna isola si leva. L'acqua nelle botti diventa gialla e imputridita; le gallette sono polvere e punteruoli; gli uomini rosicchiano pelle di bue ammorbidita fuori bordo e pagano mezzo ducato per un topo.\n\nI piloti non sanno dire quanto sia largo questo mare, perché nessuno lo ha mai attraversato. In qualunque modo [target_leader.GetName] scelga di affrontarlo, alcuni di coloro che sono partiti non vivranno abbastanza per vedere la riva opposta."
 circumnavigation_expedition_events.7.a: "Razioniamo ciò che abbiamo e manteniamo una rotta costante e prudente."
 circumnavigation_expedition_events.7.endured_tt: "L'equipaggio resiste alla traversata; la flotta raggiunge la riva opposta ancora in condizioni di combattere"
 circumnavigation_expedition_events.7.scurvy_tt: "Lo scorbuto e la fame esigono un duro tributo; la flotta avanza faticosamente con gli equipaggi decimati"
 circumnavigation_expedition_events.7.b: "Spieghiamo ogni vela. Moriranno meno uomini quanto prima avvisteremo terra."
 circumnavigation_expedition_events.7.fast_tt: "Il passaggio rapido risparmia il peggio delle morti, e la terra viene avvistata in tempo"
 circumnavigation_expedition_events.7.lost_tt: "Il mare si rivela più largo di quanto qualsiasi uomo credesse. Le ultime provviste finiscono, e la spedizione è perduta con tutti a bordo"
 circumnavigation_expedition_events.7.c: "Puntiamo a nord verso le isole di cui si mormora, e preghiamo per l'acqua fresca."
 circumnavigation_expedition_events.7.islands_tt: "Un gruppo sparso di isole fornisce acqua e cibo fresco; la traversata viene sopravvissuta quasi intatta"
 circumnavigation_expedition_events.7.empty_sea_tt: "La parte settentrionale si rivela vuota come il resto; la ricerca costa tempo prezioso e altre vite"
 circumnavigation_expedition_events.7.historical_info: "La traversata del Pacifico di Magellano durò circa novantanove giorni senza un solo rifornimento: la flotta si trascinò attraverso il tratto più vuoto del più grande oceano della Terra e avvistò quasi nessuna terra. Circa diciannove uomini morirono di scorbuto; i sopravvissuti mangiarono segatura, pelle dei rinforzi anti-sfregamento ammollata in acqua di mare e ratti venduti tra l'equipaggio a prezzo maggiorato. Il primo approdo fu Guam, nelle Marianne, nel marzo del 1521, che gli spagnoli chiamarono #italic Islas de los Ladrones#! (le 'Isole dei Ladroni') dopo che gli isolani Chamorro portarono via una delle barche della nave, provocando un'incursione punitiva. Navigare nel Pacifico verso est per tornare a casa avrebbe sconfitto i marinai finché Andrés de Urdaneta non trovò la rotta settentrionale di ritorno, il #italic tornaviaje#!, nel 1565, aprendo il commercio secolare dei galeoni di Manila."

 circumnavigation_expedition_events.8.title: "La Prima Terra in Due Mesi"
 circumnavigation_expedition_events.8.desc: "Per sessanta giorni e più la flotta non ha visto altro che acqua. Poi un grido dalla coffa: terra! La speranza corre tra le navi come un fuoco, finché le barche non si avvicinano. La 'terra' è un basso anello di corallo e palme, battuto dalla risacca, senza fondale per tenere un'ancora e nessun segno di acqua dolce. Uccelli volteggiano in alto; gli alberi non offrono nulla che un uomo affamato possa mangiare.\n\nL'isola offre solo la crudeltà della speranza. [target_leader.GetName] deve decidere se indugiare e cercare, o proseguire."
 circumnavigation_expedition_events.8.a: "Caliamo le barche; cerchiamo acqua o cibo sulla scogliera."
 circumnavigation_expedition_events.8.barren_tt: "La scogliera non dà altro che lo scherno della terraferma, e i giorni sono perduti"
 circumnavigation_expedition_events.8.relief_tt: "Si raccolgono un po' d'acqua piovana e qualche uccello marino: una piccola grazia contro la fame"
 circumnavigation_expedition_events.8.b: "Qui non c'è nulla e nessun fondale che ci tenga. Proseguiamo."
 circumnavigation_expedition_events.8.historical_info: "Il 24 gennaio 1521 la flotta avvistò la sua prima terra del Pacifico: un piccolo atollo disabitato che chiamò San Pablo, molto probabilmente Pukapuka nelle Tuamotu. Pigafetta riferisce che le due isole trovate durante la traversata non avevano 'alcun luogo dove gettare l'ancora, poiché non c'è fondale', e contenevano 'solo uccelli e alberi'. Non potendo sbarcare, gli equipaggi affamati non poterono trarne nulla, e Magellano chiamò la coppia #italic Islas Infortunadas#! (le Isole Sfortunate)."

 circumnavigation_expedition_events.9.title: "L'Isola degli Squali"
 circumnavigation_expedition_events.9.desc: "Una seconda isola si leva dal mare, ed è sterile quanto la prima: corallo e sterpaglia, cinta di risacca, senza alcun ancoraggio. L'unica vita nelle sue acque sono gli squali, che scivolano grigi sotto gli scafi in numero tale da far segnare i marinai. Qui non c'è sbarco, né acqua, né cibo: solo lo stesso oceano vuoto, e la speranza degli uomini che si assottiglia di giorno in giorno.\n\n[target_leader.GetName] deve decidere come la flotta sopporterà la propria disperazione."
 circumnavigation_expedition_events.9.a: "Caliamo di nuovo le barche e tentiamo la risacca verso la riva."
 circumnavigation_expedition_events.9.a.tt: "Le barche tornano vuote, ma gli equipaggi hanno visto il tentativo compiuto, e il morale cala solo di poco (#R -3#! Morale dell'Equipaggio)"
 circumnavigation_expedition_events.9.b: "Chiamiamola Isola degli Squali, e proseguiamo in silenzio."
 circumnavigation_expedition_events.9.historical_info: "La seconda delle Isole Sfortunate, avvistata il 21 febbraio 1521, fu chiamata #italic Tiburones#! (Squali) per i molti squali che Pigafetta registrò nelle sue acque. Probabilmente Caroline o Flint Island, anch'essa non offriva fondale per l'ancora né sollievo. Le settimane tra le due isole furono le peggiori della traversata: lo scorbuto uccideva costantemente, e gli equipaggi mangiavano pelle, segatura e ratti per sopravvivere. Non pescarono gli squali; non riuscivano nemmeno a raggiungere la riva."

 circumnavigation_expedition_events.10.title: "Le Isole dei Ladroni"
 circumnavigation_expedition_events.10.desc: "Al limite estremo della sopportazione, le vedette scorgono montagne verdi: finalmente terra vera, con acqua, frutta e pesce. Canoe a bilanciere si precipitano incontro alla flotta, i loro marinai veloci e senza paura, che salgono a bordo e portano via tutto ciò che non è legato. Per loro, ciò che non è custodito è ciò che si prende liberamente; per gli equipaggi affamati è rapina.\n\nQueste isole possono salvare la spedizione, se [target_leader.GetName] riuscirà a strapparne le provviste."
 circumnavigation_expedition_events.10.a: "Scambiamo con lealtà per tutto il cibo e l'acqua che possiamo portare."
 circumnavigation_expedition_events.10.b: "Sbarchiamo uomini armati per recuperare la barca e prendere ciò che ci serve."
 circumnavigation_expedition_events.10.c: "Prendiamo ciò che possiamo dalle canoe e riprendiamo il largo subito."
 circumnavigation_expedition_events.10.historical_info: "La flotta raggiunse Guam, nelle Marianne, il 6 marzo 1521, il primo approdo dopo lo stretto. Magellano chiamò le isole #italic Islas de los Ladrones#! (le Isole dei Ladroni) dopo che i Chamorro, che non avevano alcuna nozione di proprietà privata, portarono via uno schifo della nave. Per rappresaglia sbarcò circa quaranta uomini armati, bruciò case e uccise diversi isolani per recuperare la barca. Comunque fosse stato ottenuto, lo scalo diede agli equipaggi morenti il primo cibo e la prima acqua freschi in oltre tre mesi, e fu la salvezza."

 circumnavigation_expedition_events.11.title: "Sangue e Fede a Cebu"
 circumnavigation_expedition_events.11.desc: "Le isole hanno salvato la spedizione. Dopo la prova della traversata, gli equipaggi di [target_leader.GetName] fanno scorta di acqua, frutta e carne fresca, e a Cebu il rajah li riceve con banchetti. Viene giurato un patto di sangue: il suo popolo abbraccerà [ROOT.GetCountry.GetReligion.GetName], e in cambio i cannoni degli stranieri serviranno la sua corona. Centinaia si convertono in un solo giorno sotto il sole tropicale.\n\nPoi arriva il prezzo dell'alleanza. Oltre uno stretto canale, sull'isola di Mactan, un capo ribelle rifiuta sia [ROOT.GetCountry.GetReligion.GetGodName] sia il nuovo signore, e il nostro alleato si aspetta che lo umiliamo. Farsi un amico tra queste isole significa ereditarne i nemici."
 circumnavigation_expedition_events.11.a: "Prendiamo le parti del nostro alleato. Mactan conosca la nostra forza."
 circumnavigation_expedition_events.11.mactan_triumph_tt: "La dimostrazione di forza intimorisce le isole, e i nemici del nostro alleato vengono umiliati"
 circumnavigation_expedition_events.11.mactan_disaster_tt: "L'assalto fallisce nei bassifondi; uomini valorosi cadono, e la flotta ne esce indebolita"
 circumnavigation_expedition_events.11.b: "Prendiamo ciò che le isole ci danno e proseguiamo; non è la nostra battaglia."
 circumnavigation_expedition_events.11.c: "Piantiamo lo stendardo reale. La corona registri questa scoperta."
 circumnavigation_expedition_events.11.historical_info: "Magellano raggiunse l'arcipelago filippino nel marzo del 1521, chiamandolo Arcipelago di San Lazzaro. Le Filippine offrirono il primo contatto prolungato con i popoli del Pacifico occidentale e le provviste che salvarono la flotta affamata. Magellano stipulò un patto di sangue con il rajah Humabon di Cebu, convertendo lui e diverse migliaia di sudditi al cristianesimo. L'alleanza si rivelò fatale: il 27 aprile 1521 Magellano fu ucciso nella battaglia di Mactan, guidando un assalto avventato attraverso le scogliere contro il capo Lapulapu in nome del suo nuovo alleato. Il comando passò infine a Juan Sebastián Elcano, e i sopravvissuti, ormai troppo pochi per armare tre navi, bruciarono la #italic Concepción#! a Bohol."

 circumnavigation_expedition_events.12.title: "Le Isole delle Spezie"
 circumnavigation_expedition_events.12.desc: "Le Molucche. Il punto su ogni mappa che nessuna nave iberica aveva mai raggiunto da occidente. L'odore raggiunge le navi prima che le isole siano visibili: chiodi di garofano, ricco e scuro, il loro profumo portato dallo stesso vento che le ha spinte attraverso due oceani.\n\n[target_leader.GetName] sta sul ponte mentre i piloti annunciano le profondità, e per molto tempo non dice nulla. Le stive sono quasi vuote. L'equipaggio è l'ombra di ciò che era. Ma sono qui, e le barche del Sultano stanno già venendo loro incontro."
 circumnavigation_expedition_events.12.a: "Riempiamo le stive di [ShowGoodsNameWithNoTooltip('cloves')]; abbiamo attraversato il mondo per questo."
 circumnavigation_expedition_events.12.cloves_loaded_tt: "Le stive superstiti sono stipate di [ShowGoodsName('cloves')], da vendere a [ROOT.GetCountry.GetCapital.GetMarket.GetName] al ritorno della flotta. Un equipaggio che attraversa il Pacifico intatto porta a casa un carico ben più ricco"
 circumnavigation_expedition_events.12.b: "Giuriamo un trattato con il Sultano. L'alleanza vale più del carico."
 circumnavigation_expedition_events.12.treaty_cargo_tt: "Viene giurato un trattato con il Sultano e viene caricata una parte di [ShowGoodsName('cloves')]: un carico più leggero, ma un'amicizia nelle Isole delle Spezie che gli sopravvivrà"
 circumnavigation_expedition_events.12.historical_info: "Le Molucche, le originali 'Isole delle Spezie', erano la fonte dei chiodi di garofano, della noce moscata e del macis che rendevano così prezioso il commercio orientale. Le navi di Elcano raggiunsero Tidore nel novembre del 1521, il cui sultano era rivale di quello di Ternate, allora nella sfera portoghese. La #italic Victoria#! e la #italic Trinidad#! caricarono chiodi di garofano; la #italic Trinidad#! tentò poi di tornare verso est attraverso il Pacifico, fallì contro i venti e fu catturata dai portoghesi. Solo la #italic Victoria#!, al comando di Elcano, proseguì verso ovest. Quando raggiunse finalmente Sanlúcar de Barrameda nel settembre del 1522 con diciotto sopravvissuti e una stiva di chiodi di garofano, quel singolo carico di spezie pagò l'intera spedizione triennale e fruttò un profitto."

 circumnavigation_expedition_events.13.title: "Doppiare il Capo"
 circumnavigation_expedition_events.13.desc: "Il capo è tutto ciò che i racconti dei vecchi marinai avevano avvertito: un muro di acqua grigia e vento che tratta le navi come foglie. L'equipaggio, ciò che ne resta, non si lamenta. Ha già attraversato un passaggio che avrebbe dovuto essere impossibile, un oceano senza nome e un arcipelago che quasi inghiottì la flotta. Il Capo di Buona Speranza è solo un altro ostacolo.\n\nQuando l'ammiraglia supera il promontorio e i venti si placano, [target_leader.GetName] guarda a est, poi a ovest. Sono stati ormai in ogni oceano che il mondo possiede."
 circumnavigation_expedition_events.13.a: "Rendiamo grazie. Qualunque altra cosa accada, saremo ricordati."
 circumnavigation_expedition_events.13.b: "Niente cerimonie. Proseguiamo a nord. Non siamo ancora a casa."
 circumnavigation_expedition_events.13.historical_info: "La #italic Victoria#! doppiò il Capo di Buona Speranza nel maggio del 1522 al comando di Elcano, completando l'ultimo grande ostacolo geografico prima del ritorno in Spagna. I portoghesi controllavano la rotta del Capo e i suoi porti di rifornimento; Elcano li evitò a causa dell'ambiguità giuridica dello status della spedizione, poiché Spagna e Portogallo si contendevano la sovranità sulle Molucche in base al Trattato di Tordesillas. La nave era in cattive condizioni, imbarcava acqua, e l'equipaggio di 18 uomini, ridotto dagli originali 270, era vicino all'esaurimento. Raggiunsero Sanlúcar de Barrameda il 6 settembre 1522, completando la prima circumnavigazione della Terra in poco meno di tre anni."

 circumnavigation_expedition_events.14.title: "Rive Amiche"
 circumnavigation_expedition_events.14.desc: "Le isole davanti a noi battono i colori di [ROOT.GetCountry.GetName]. Dopo anni oltre ogni carta, la flotta è sbarcata finalmente su suolo amico: un porto dove la nave può essere calafatata, le botti riempite e l'equipaggio ridotto nutrito senza paura né inganno. La gente del governatore scende sul molo a fissare a bocca aperta gli uomini smunti e cenciosi che dicono di aver navigato attorno al mondo.\n\nLe acque di casa sono ormai vicine. [target_leader.GetName] deve solo decidere quanto a lungo riposare."
 circumnavigation_expedition_events.14.a: "Rimettiamola in sesto: calafatiamo le giunture, riempiamo le botti, nutriamo gli uomini."
 circumnavigation_expedition_events.14.b: "Solo una breve sosta. Gli uomini riposeranno a dovere una volta a casa."
 circumnavigation_expedition_events.14.historical_info: "Ai tempi di Magellano le isole di Capo Verde erano portoghesi, e una flotta spagnola non osava rifornirsi lì apertamente. Una corona che tenesse in proprio queste isole atlantiche le troverebbe tuttavia un'ultima tappa preziosissima prima della corsa verso casa: un luogo riparato per carenare, fare acqua e rifornire una nave logorata all'esaurimento dal più lungo viaggio mai tentato."

 circumnavigation_expedition_events.15.title: "Il Conto"
 circumnavigation_expedition_events.15.desc: "L'ultima nave perde da ogni giuntura e l'equipaggio muore di fame, eppure l'unico porto a portata batte i colori di una corona rivale. [target_leader.GetName] ordina alla nave di entrare con una storia falsa: che torna dalle Americhe, non dall'oriente proibito. Ma quando gli uomini a terra chiedono che giorno sia, la risposta è sbagliata di uno: da qualche parte nel girare il mondo, la flotta ha perso un giorno dal proprio computo, e la discrepanza potrebbe tradire tutto.\n\nLe provviste sono a portata di mano, se l'inganno regge."
 circumnavigation_expedition_events.15.a: "Atteniamoci alla storia. Compriamo in fretta, prima che inizino le domande."
 circumnavigation_expedition_events.15.ruse_ok_tt: "La storia regge; le provviste vengono acquistate e la nave scivola via prima che le domande si facciano insistenti"
 circumnavigation_expedition_events.15.ruse_failed_tt: "La menzogna si sfalda per via del giorno mancante, e parte del gruppo a terra viene catturata prima che la nave possa fuggire"
 circumnavigation_expedition_events.15.b: "Non rischiamo il porto di un rivale. Proseguiamo verso casa, affamati come siamo."
 circumnavigation_expedition_events.15.historical_info: "Nel luglio del 1522 la #italic Victoria#! fece scalo a Santiago portoghese, nelle isole di Capo Verde, affermando di tornare dalle Americhe per nascondere il proprio passaggio attraverso l'oriente rivendicato dai portoghesi. Lo stratagemma resse finché una discrepanza di un solo giorno nel giornale di bordo, la prima prova pratica di cosa faccia al calendario circumnavigare il globo, destò sospetti, e i portoghesi catturarono tredici membri dell'equipaggio. Gli altri tagliarono l'ormeggio e fuggirono, raggiungendo la Spagna con soli diciotto uomini a bordo."

 circumnavigation_expedition_events.16.title: "Un Ancoraggio Brullo"
 circumnavigation_expedition_events.16.desc: "Le isole sono disabitate, ammassi di roccia e sterpaglia aridi e spazzati dal vento, ma sono terra, con acque riparate e sorgenti tra le pietre. Meglio ancora, capre selvatiche corrono sui pendii, lasciate da qualche nave precedente, e ai marinai viene l'acquolina in bocca al pensiero di carne fresca dopo così tanto tempo tra marciume e punteruoli.\n\nL'ancoraggio non costa altro che tempo, e il tempo è l'unica cosa che una nave in rotta verso casa può permettersi di sprecare. [target_leader.GetName] dà l'ordine."
 circumnavigation_expedition_events.16.a: "Mandiamo cacciatori a terra per le capre e riempiamo le botti alle sorgenti."
 circumnavigation_expedition_events.16.b: "Facciamo acqua e proseguiamo. Casa è ormai abbastanza vicina."
 circumnavigation_expedition_events.16.historical_info: "Le navi di passaggio rifornivano spesso di capre e maiali le isole atlantiche disabitate, che si riproducevano in greggi selvatici e trasformavano nude rocce in dispense involontarie per i marinai successivi. Un'isola non colonizzata ma ricca d'acqua sulla rotta di ritorno offriva a una spedizione provata carne fresca e acqua pulita al solo costo di qualche giorno di ritardo: una piccola grazia, ma reale, a portata di casa."

 circumnavigation_expedition_events.17.title: "Nessuna Nave Ritorna"
 circumnavigation_expedition_events.17.desc: "Stagione dopo stagione a [capital_location.GetName] senza notizie della flotta, finché la speranza stessa si esaurisce. La spedizione non tornerà a casa. Da qualche parte oltre il limite del mondo conosciuto, inghiottite da un mare troppo largo da attraversare, o ridotte a troppo poche navi e troppe poche mani per proseguire, le navi e i loro equipaggi sono scomparsi. Della flotta partita per circumnavigare il mondo non ritorna altro che silenzio e i nomi dei morti.\n\nIl sogno sopravvive agli uomini che lo inseguirono. Un altro regno, un altro equipaggio, potrebbe ancora completare ciò che questo ha iniziato."
 circumnavigation_expedition_events.17.a: "Non saranno dimenticati."
 circumnavigation_expedition_events.17.end_tt: "La spedizione è perduta, e il suo viaggio finisce qui"
 circumnavigation_expedition_events.17.historical_info: "Delle sette navi partite sotto García Jofre de Loaísa nel 1525 per ripercorrere la rotta di Magellano, solo una nave malconcia e una manciata di sopravvissuti raggiunsero le Molucche, e nessuna completò il ritorno attraverso il passaggio orientale. La perdita totale era un rischio reale dell'epoca: la circumnavigazione richiedeva anni in mare oltre ogni speranza di rifornimento, e una flotta inghiottita dal Pacifico poteva non essere mai più ritrovata."

 circumnavigation_expedition_events.18.title: "Ammutinamento"
 circumnavigation_expedition_events.18.desc: "Comincia come cominciano sempre queste cose: una parola borbottata durante il turno di notte, un gruppo di uomini che tace quando passa un ufficiale, un capitano che non incrocia più lo sguardo di [target_leader.GetName]. Le provviste sono scarse, gli uomini hanno freddo e paura, e si sono imbarcati per un viaggio alle Indie, non per la fine del mondo. Ora il malcontento si è indurito in qualcosa che ha una forma: uno dei capitani ha rifiutato apertamente un ordine, e il suo equipaggio gli sta alle spalle, esigendo che la flotta torni a casa.\n\n[target_leader.GetNameWithNoTooltip] ha forse un giorno prima che il marcio si diffonda alle altre navi. Ciò che va deciso va deciso ora."
 circumnavigation_expedition_events.18.a: "Lasciamo che i malcontenti tornino indietro. Noi proseguiamo senza di loro."
 circumnavigation_expedition_events.18.b: "Reprimiamo l'ammutinamento con la forza. I caporioni ne risponderanno."
 circumnavigation_expedition_events.18.fight_win_tt: "L'ammutinamento è stroncato e i suoi capi usati come esempio. L'ordine è ristabilito, anche se la resa dei conti è costata tempo alla flotta"
 circumnavigation_expedition_events.18.fight_lose_tt: "La repressione degenera in uno scontro aperto e va male: una nave viene perduta nel caos prima che l'ordine sia ristabilito, e anche la flotta ha perso tempo"
 circumnavigation_expedition_events.18.c: "Ricordiamo loro cosa li attende oltre l'orizzonte."
 circumnavigation_expedition_events.18.rouse_tt: "[target_leader.GetName] percorre i ponti e parla agli equipaggi come nessun comandante comune saprebbe fare. L'ammutinamento si dissolve da sé, e il morale degli uomini si solleva più in alto di prima"

 circumnavigation_expedition_events.19.title: "Una Costa Tutta Nostra"
 circumnavigation_expedition_events.19.desc: "Dopo settimane di [ShowContinentName('atlantic_ocean_continent')] aperto, una bassa linea verde si definisce all'orizzonte occidentale, e gli stendardi sopra la piccola città portuale sono i nostri. Una colonia di [ROOT.GetCountry.GetName], piantata su questa riva lontana, spalanca i propri magazzini alle navi della corona. Acqua fresca, frutta, carne salata e legname per le riparazioni sono tutti disponibili, e liberamente, tra connazionali.\n\n[target_leader.GetName] può imbarcare tutto ciò che la flotta può portare prima di volgere a sud verso l'ignoto."
 circumnavigation_expedition_events.19.a: "Riposiamo e riforniamoci a fondo. Un suolo amico come questo è raro."
 circumnavigation_expedition_events.19.b: "Una breve, grata sosta, poi a sud. La stagione non aspetta."
 circumnavigation_expedition_events.19.historical_info: "La spalla nordorientale del Brasile, Pernambuco, Paraíba, Rio Grande, fu tra le prime e più ricche zone di insediamento iberico nel Nuovo Mondo, con la costa orlata di legno brasile e, ben presto, di zucchero. Una corona che possedesse questi porti poteva fare acqua e rifornire una flotta sul proprio suolo prima del lungo tratto verso le latitudini meridionali: un lusso che Magellano, destreggiandosi in acque rivendicate da un rivale, non conobbe mai."

 circumnavigation_expedition_events.20.title: "La Costa di un Rivale"
 circumnavigation_expedition_events.20.desc: "Dopo settimane di [ShowContinentName('atlantic_ocean_continent')] aperto, una bassa linea verde si definisce all'orizzonte occidentale, ma gli stendardi sopra il porto appartengono a [rival_crown.GetName]. La loro colonia tiene questa riva, e una flotta al nostro servizio non ha alcun diritto legittimo ai suoi moli. Eppure i magazzini sono pieni, gli agenti abbastanza disposti a commerciare per buona moneta e gli uomini hanno fame di qualsiasi cosa che non siano gallette piene di punteruoli.\n\n[target_leader.GetName] deve decidere se fare scalo sotto i cannoni di un rivale o mantenere la rotta verso sud."
 circumnavigation_expedition_events.20.a: "Commerciamo con cautela con la colonia di [rival_crown.GetNameWithNoTooltip] per le provviste."
 circumnavigation_expedition_events.20.b: "Teniamoci ben lontani dal porto del rivale. Proseguiamo a sud."
 circumnavigation_expedition_events.20.historical_info: "In base al Trattato di Tordesillas, la costa brasiliana ricadeva nella metà portoghese del mondo, e una flotta al servizio di Castiglia non poteva vantare alcun diritto sui suoi porti. In pratica, un equipaggio affamato e un agente coloniale compiacente potevano comunque stringere un accordo discreto per le provviste, ma fare scalo nel porto di una corona rivale significava sempre rischiare il sequestro, l'estorsione o la confisca di qualsiasi nave che non potesse provare il proprio diritto di essere lì."

 circumnavigation_expedition_events.21.title: "Scorbuto a Bordo"
 circumnavigation_expedition_events.21.desc: "Il morbo che perseguita ogni lungo viaggio è finalmente arrivato. Le gengive annerite sanguinano, le vecchie cicatrici si riaprono da sole, i denti ballano nella mascella e uomini che erano sani un mese fa non riescono più ad alzarsi dal ponte. Il chirurgo non ha rimedio se non riposo e cibo fresco, e ce n'è ben poco dell'uno e dell'altro.\n\n[target_leader.GetName] deve soppesare quanto si possa spingere un equipaggio morente."
 circumnavigation_expedition_events.21.a: "Razioniamo le scorte fresche e restiamo tranquilli finché il peggio passa."
 circumnavigation_expedition_events.21.b: "Non c'è tempo da perdere. Proseguiamo; i forti resisteranno."
 circumnavigation_expedition_events.21.b.tt: "La traversata prosegue faticosamente con i malati lasciati al proprio destino. Molti non vedranno la riva opposta, e i sopravvissuti saranno troppo pochi per riportare a casa l'intera flotta"

 circumnavigation_expedition_events.22.title: "Una Tempesta"
 circumnavigation_expedition_events.22.desc: "Il cielo assume il colore di un livido e il mare si solleva in montagne grigie. Il vento artiglia il sartiame, e le navi faticano in avvallamenti abbastanza profondi da inghiottire un campanile. L'acqua verde si abbatte netta sui ponti, e i piloti non riescono più a distinguere una nave dall'altra.\n\n[target_leader.GetName] deve scegliere se affrontare la tempesta di petto o correre davanti ad essa e pregare che la flotta regga."
 circumnavigation_expedition_events.22.a: "Mettiamoci alla cappa, riduciamo la vela e affrontiamola."
 circumnavigation_expedition_events.22.b: "Corriamo davanti al vento e facciamo la velocità che possiamo."
 circumnavigation_expedition_events.22.b.win_tt: "La flotta attraversa il peggio e ne esce dispersa, scossa, ma integra"
 circumnavigation_expedition_events.22.b.lose_tt: "L'azzardo fallisce, la flotta viene sbaragliata nel buio, e una nave potrebbe non rispondere alla prossima alba"

 circumnavigation_expedition_events.23.title: "Il Verme nello Scafo"
 circumnavigation_expedition_events.23.desc: "In queste acque calde il teredine fora il fasciame più in fretta di quanto qualsiasi carpentiere possa turare, finché le travi non sono crivellate come un favo. Le pompe sono presidiate giorno e notte, e la sentina continua a salire. Uno scafo ridotto a tal punto non può essere affidato a un oceano senza una carenatura adeguata: tirare la nave in secca, bruciare le incrostazioni dal fondo e ricalafatare le giunture.\n\n[target_leader.GetName] deve decidere come tenere a galla la flotta."
 circumnavigation_expedition_events.23.a: "Carenamo e ripariamo su qualche spiaggia solitaria come meglio possiamo."
 circumnavigation_expedition_events.23.a.tt: "La flotta viene carenata su una riva deserta e fa ciò che può; il lavoro è lento e costoso, ma gli scafi reggeranno ancora un po'"
 circumnavigation_expedition_events.23.b: "Abbandoniamo lo scafo peggiore e stipiamo il suo equipaggio sulle altre navi."
 circumnavigation_expedition_events.23.c: "Facciamo rotta verso il vicino porto amico e rimettiamola in sesto."
 circumnavigation_expedition_events.23.c.tt: "La flotta fa scalo in un porto amico a portata e si rimette in sesto in sicurezza: una riparazione ben più sicura di qualsiasi spiaggia solitaria, e un gradito riposo per gli equipaggi"

 circumnavigation_expedition_events.24.title: "In Bonaccia"
 circumnavigation_expedition_events.24.desc: "Il vento cala fino a spegnersi. Le vele pendono flosce contro gli alberi, il mare giace piatto e vitreo sotto un cielo bianco e spietato, e le navi restano immobili giorno dopo giorno mentre l'acqua nelle botti imputridisce e il cibo cala. Gli uomini si fanno cupi e poi spaventati, mormorando che la flotta sia uscita dal bordo dei venti del mondo e non li sentirà mai più.\n\n[target_leader.GetName] può solo aspettare, oppure mettere le barche ai remi."
 circumnavigation_expedition_events.24.a: "Aspettiamo il ritorno del vento, per quanto ci voglia."
 circumnavigation_expedition_events.24.b: "Fuori le barche, e rimorchiamo le navi a forza di braccia."

 circumnavigation_expedition_events.25.title: "Troppe Poche Mani"
 circumnavigation_expedition_events.25.desc: "Così tanti sono morti o giacciono inermi sottocoperta che non ci sono più abbastanza uomini validi per governare tutte le navi. Non c'è altra via: una nave viene spogliata di tutto ciò che serve, la manciata di sopravvissuti in forze viene stipata sulle altre e il suo scafo vuoto abbandonato al mare. La flotta prosegue più piccola, ma almeno ciò che resta può essere armato come si deve."
 circumnavigation_expedition_events.25.a: "Non c'era altra scelta. Dividiamo il suo equipaggio tra le altre."

 circumnavigation_expedition_events.26.title: "Una Nave Affonda"
 circumnavigation_expedition_events.26.desc: "Quando la tempesta si esaurisce finalmente e la flotta si riunisce di nuovo, manca una nave. Se sia stata spinta su una costa sottovento, abbia aperto le giunture e sia affondata nel buio, o sia stata semplicemente portata oltre l'orizzonte e perduta, nessuno può dire. Non si ricongiunge. Il mare l'ha presa, con tutte le anime a bordo."
 circumnavigation_expedition_events.26.a: "Preghiamo per i morti, e proseguiamo."

 circumnavigation_expedition_events.27.title: "Una Riva Deserta"
 circumnavigation_expedition_events.27.desc: "Le stive stanno calando, ma una bassa costa verde si trova al traverso: disabitata, per quanto le vedette possano dire, senza fumo di fuochi da cucina né canoe che salpano. Acqua fresca scorre dalle rocce in una dozzina di ruscelli, uccelli acquatici affollano i bassifondi e i boschi promettono frutta, legname e selvaggina a qualsiasi gruppo disposto a sbarcare e prenderli.\n\nRaccogliere abbastanza da contare costerà alla flotta giorni che non può permettersi, ma gli stomaci vuoti costano di più. [target_leader.GetName] dà l'ordine."
 circumnavigation_expedition_events.27.a: "Sbarchiamo. Riempiamo le botti e raccogliamo legna, frutta e selvaggina."
 circumnavigation_expedition_events.27.b: "Non c'è tempo per foraggiare. Proseguiamo, affamati come siamo."

 circumnavigation_expedition_events.28.title: "Commercio con la Riva"
 circumnavigation_expedition_events.28.desc.christian: "Le stive stanno calando, ma sulla costa vicina si trova [trade_shore.Custom('IT_ART_LOCATION')][trade_shore.GetRank.GetName], di fede cristiana: campane di chiesa che giungono debolmente attraverso l'acqua, una croce eretta sopra il porto. La loro gente salpa in barca per osservare gli stranieri, cauta ma ben disposta, e dove c'è una fede comune c'è una lingua comune per trattare. Grano, carne salata, frutta e acqua fresca si possono avere in cambio di moneta e merci.\n\nQualche giorno all'ancora qui riempirebbe di nuovo le stive. [target_leader.GetName] soppesa il ritardo contro le scorte che si assottigliano."
 circumnavigation_expedition_events.28.desc.muslim: "Le stive stanno calando, ma sulla costa vicina si trova [trade_shore.Custom('IT_ART_LOCATION')][trade_shore.GetRank.GetName], di fede musulmana: il richiamo alla preghiera che si diffonde sull'acqua, dhow tirati in secca lungo la spiaggia. I loro mercanti vengono incontro alla flotta, scaltri e senza paura, perché questa è gente che ha comprato e venduto attraverso ogni mare del mondo. Riso, datteri, pesce salato e acqua dolce si possono avere per buona moneta e le merci giuste.\n\nQualche giorno all'ancora qui riempirebbe di nuovo le stive. [target_leader.GetName] soppesa il ritardo contro le scorte che si assottigliano."
 circumnavigation_expedition_events.28.desc.pagan: "Le stive stanno calando, ma sulla costa vicina si trova [trade_shore.Custom('IT_ART_LOCATION')][trade_shore.GetRank.GetName], la cui gente segue dèi che i cappellani della flotta non hanno mai sentito nominare. Escono con cautela in canoa, offrendo radici, frutta, pesce e zucche di acqua fresca, curiosi del ferro, dei tessuti e delle bagattelle che gli stranieri mostrano in cambio. Nessuna delle due parti conosce la lingua dell'altra, ma la fame e il baratto non ne hanno bisogno.\n\nQualche giorno di scambi qui riempirebbe di nuovo le stive. [target_leader.GetName] soppesa il ritardo contro le scorte che si assottigliano."
 circumnavigation_expedition_events.28.a: "Facciamo scalo e commerciamo per tutte le provviste che la flotta può portare."
 circumnavigation_expedition_events.28.b: "Non abbiamo tempo per barattare. Proseguiamo, affamati come siamo."

