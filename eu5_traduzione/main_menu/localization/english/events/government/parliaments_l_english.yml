l_english: 
 parliaments.1.title: "[target_city.Custom('IT_ART_LOCATION')|U][target_city.GetRank.GetNameWithNoTooltip] Richiede un Posto [ROOT.GetCountry.Custom('IT_PARL_NEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName]" 
 parliaments.1.desc: "[target_city.Custom('IT_ART_LOCATION')|U][target_city.GetRank.GetName] di [target_city.GetName] è diventat[target_city.Custom('IT_OA_LOCATION')] ricc[target_city.Custom('IT_OA_LOCATION')] e prosper[target_city.Custom('IT_OA_LOCATION')] e la gente è delusa di non essere stata scelta come sede dell'attuale parlamento. I rappresentanti di [target_city.GetNameWithNoTooltip] chiedono da noi un risarcimento e una garanzia, tutelando i loro interessi per il futuro. Minacciano di andarsene se le loro richieste non vengono accolte." 
 parliaments.1.a: "Concedetele!" 
 parliaments.1.b: "Rifiutatele!" 
 
 parliaments.2.title: "Borghi Putridi" 
 parliaments.2.desc: "Grazie alla sua posizione importante [ROOT.GetCountry.Custom('IT_PARL_NEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName], [target_location.GetName] può vantarsi di avere una certa influenza sulla politica del nostro paese. I cittadini di [envious.GetName], tuttavia, si sentono sottorappresentati. Desiderano il proprio [ShowBuildingTypeName('urban_parliament_seat')], con tutti i diritti ad esso annessi. Sebbene la loro richiesta isolatamente sembri ragionevole, arriva anche con la revoca della sede di [target_location.GetNameWithNoTooltip], che i membri [ROOT.GetCountry.Custom('IT_NOBLES_DEL_NOSTRO')][ROOT.GetCountry.Custom('IT_NOBLES_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] prenderebbero sicuramente come un grave insulto. 
 parliaments.2.a: "Ingiusto o no, quel posto è di diritto di [target_location.GetNameWithNoTooltip]!" 
 parliaments.2.b: "Dobbiamo riassegnare il seggio." 
 
 parliaments.3.desc_generic: "Oltre ad essere un membro importante [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName], [target_location.GetName] è anche il centro di una serie di attività influenti con interessi nel commercio estero." 
 parliaments.3.title: "Il Potere Economico di [target_location.GetNameWithNoTooltip]" 
 parliaments.3.desc: "$parliaments.3.desc_generic$ Sembra che molte di queste abbiano deciso che non trarrebbero beneficio dall'implementazione della proposta attualmente dibattuta e hanno esercitato pressioni sui loro membri [ROOT.GetCountry.Custom('IT_PARL_NEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] per indebolire la proposta." 
 parliaments.3.a: "[ROOT.GetCountry.Custom('common_string_negative')]" 
 parliaments.3.b: "Se è il denaro che vogliono, allora possono averlo." 
 
 parliaments.4.title: "Corruzione del Voto" #QUI
 parliaments.4.desc: "I membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] dei borghi putridi di [target_location.GetName] hanno scelto di opporsi alla nostra proposta. Sembra che il proprietario terriero che controlla l'area sia stato convinto che la proposta non sia nel suo interesse." 
 parliaments.4.a: "Che sfortuna!" 
 parliaments.4.b: "Allora dobbiamo corrompere il proprietario terriero."
 
 parliaments.5.title: "[target_location.GetNameWithNoTooltip] Vince il Dibattito" 
 parliaments.5.desc: "L'influente [ShowBuildingTypeName('university')] di [target_location.GetName] è riuscita a influenzare i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] a dichiararsi a favore dell'aumento dei finanziamenti all'[ShowBuildingTypeNameWithNoTooltip('university')]." 
 parliaments.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 parliaments.5.b: "Dovrebbero concentrarsi esclusivamente sulla ricerca." 
 
 parliaments.6.desc: "$parliaments.3.desc_generic$ Sembra che molte di queste attività abbiano deciso che trarrebbero vantaggio dall'implementazione della proposta attualmente dibattuta e hanno esercitato pressioni sui loro membri [ROOT.GetCountry.Custom('IT_PARL_NEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] affinché venga approvata." 
 parliaments.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 
 parliaments.7.title: "Supporto Militare a [target_location.GetNameWithNoTooltip]" 
 parliaments.7.desc: "L'esercito è per molti versi la forza interna più influente a [target_location.GetName] e i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] che provengono e sono fedeli a questa influente organizzazione, sono stati persuasi a votare a favore dell'attuale proposta." 
 parliaments.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 parliaments.7.b: "Il loro sostegno è sufficiente per noi." 
 
 parliaments.8.title: "L'Influenza di [target_location.GetNameWithNoTooltip]" 
 parliaments.8.desc: "L'attuale dibattito [ROOT.GetCountry.Custom('IT_PARL_AL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] su come proteggere al meglio la produzione nazionale ha attirato l'attenzione di molti a [target_location.GetName]. Tra questi, alcune importanti figure sono venute a sostenerci nel dibattito, nella speranza di trarre beneficio dalla politica suggerita." 
 parliaments.8.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 parliaments.8.b: "Dovremmo investire a [target_location.GetNameWithNoTooltip] indipendentemente dal risultato."
 
 parliaments.9.title: "La Potenza di [target_location.GetNameWithNoTooltip]" 
 parliaments.9.desc: "Come sede della nostra capitale, [target_location.GetName] trarrà grandi benefici dalle riforme attualmente proposte. Fortunatamente, un numero sufficiente di persone se ne è reso conto per garantire che il loro rappresentante ora voti a nostro favore." 
 parliaments.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 
 parliaments.10.title: "[target_location.GetNameWithNoTooltip] Cambia Idea nel Dibattito!" 
 parliaments.10.desc: "Sembra che i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] di [target_location.GetName] abbiano finalmente capito quanto sarebbe vantaggioso per loro la proposta attualmente dibattuta se venisse approvata. Il loro sostegno alla nostra causa è il benvenuto." 
 parliaments.10.desc_b: "Sembra che i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] di [target_location.GetName] si siano resi conto di quanto sarebbe dannoso per loro la proposta attualmente dibattuta se venisse approvata. Il loro sostegno alla nostra opposizione è di grande valore." 
 parliaments.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 
 parliaments.11.desc: "Sembra che i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] di [target_location.GetName], sebbene convinti sostenitori della nostra causa fino a poco tempo fa, sono arrivati a cambiare completamente la loro posizione sulla questione attualmente dibattuta. Non possiamo sapere con certezza come ciò sia accaduto, ma è chiaro che non possiamo più fare affidamento sul loro voto." 
 parliaments.11.a: "Forse l'avidità ha avuto la meglio su di loro..." 
 
 parliaments.12.title: "Nessun Sostegno ai Contadini" 
 parliaments.12.desc: "Anche se permettiamo [ROOT.GetCountry.Custom('IT_PEASANTS_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] di presentare una petizione [ROOT.GetCountry.Custom('IT_PARL_AL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName], questo diritto non si traduce nello stesso potere che altri ceti hanno su questa istituzione. Durante una recente discussione, è diventato chiaro che la gente comune [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] non gode degli stessi privilegi della classe superiore dominante, che sembra opporsi alla proposta [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]." 
 parliaments.12.a: "[ROOT.GetCountry.Custom('common_string_negative')]" 
 parliaments.12.b: "Che terribile ingiustizia!" 
 
 parliaments.13.title: "Dominio [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] nel Dibattito" 
 parliaments.13.desc: "Una campagna risoluta da parte dei membri [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] ha influenzato [ROOT.GetCountry.Custom('IT_PARL_IL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] a favore della questione attualmente dibattuta. Nonostante il loro status sociale inferiore, la loro voce è accettata come pari nelle discussioni sullo Stato." 
 parliaments.13.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 parliaments.13.b: "Le richieste del popolo verranno ascoltate"
 
 parliaments.14.desc_common: "I membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] di [target_location.GetName] occupano una posizione influente, poiché rappresentano uno dei nostri centri economici." 
 parliaments.14.title: "[ROOT.GetCountry.Custom('IT_BURGHERS_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] di [target_location.GetNameWithNoTooltip]" 
 parliaments.14.desc: "$parliaments.14.desc_common$ La loro ricchezza ha molta influenza [ROOT.GetCountry.Custom('IT_PARL_NEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName], ma fortunatamente per noi, la proposta in discussione andrà a loro vantaggio se passa, quindi i loro soldi vengono spesi per acquistare sostegno invece di ostacolarlo." 
 parliaments.14.a: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 
 parliaments.15.title: "Il Peso di [target_location.GetNameWithNoTooltip]" 
 parliaments.15.desc: "Molti in [target_location.GetName] sono rimasti piuttosto delusi dalla proposta di aumentare la nostra attenzione sulle infrastrutture marittime. Ritengono che la loro regione già contribuisce molto alle forze armate del nostro paese e si aspettavano piuttosto che [ROOT.GetCountry.Custom('IT_PARL_IL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] autorizzasse più fondi a loro discrezione, invece di chiedere più soldi per la flotta." 
 parliaments.15.a: "[ROOT.GetCountry.Custom('common_string_negative')]" 
 parliaments.15.a.tt: "I nostri [pops|e] in [target_location.GetName] perderanno il [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] di [pop_satisfaction|e]" 
 
 parliaments.16.title: "Dominio Marittim a [target_location.GetNameWithNoTooltip]" 
 parliaments.16.desc: "Il predominio della marina a [target_location.GetName] ha fatto sì che la proposta di aumento delle spese per l'esercito in discussione [ROOT.GetCountry.Custom('IT_PARL_AL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] sia stata accolta piuttosto freddamente. Nonostante inizialmente fossero stati favorevoli alla proposta, i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] di questa zona ora non vedono altra scelta che votare contro di essa." 
 parliaments.16.a: "[ROOT.GetCountry.Custom('common_string_negative')]" 
 
 parliaments.17.desc_common: "Il popolo di [target_location.GetName] tende a seguire una fede diversa dalla nostra, e i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] che sono responsabili di [target_location.GetNameWithNoTooltip] sono stati accusati di rappresentare i loro interessi rispetto a quelli della nostra stessa fede." 
 parliaments.17.title: "La Fede di [target_location.GetNameWithNoTooltip]" 
 parliaments.17.desc_tolerance: "$parliaments.17.desc_common$ Tuttavia, queste accuse di solito suscitano solo risate nel resto [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName], poiché non è raro per noi rispettare coloro che seguono una fede diversa da quella del nostro Stato." 
 parliaments.17.desc_intolerance: "$parliaments.17.desc_common$ Queste accuse radicali hanno danneggiato la reputazione di [target_location.GetNameWithNoTooltip] e danneggiato il supporto per l'attuale proposta [ROOT.GetCountry.Custom('IT_PARL_AL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName]." 
 parliaments.17.a: "Era la volontà di [ROOT.GetCountry.GetReligion.GetGodName]." 
 
 parliaments.18.title: "Le Aspettative di [target_location.GetNameWithNoTooltip]" 
 parliaments.18.desc: "I membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] di [target_location.GetName] sono sorprendentemente ricettivi nei confronti della nostra proposta nel dibattito parlamentare. Sembra che l'università di [target_location.GetNameWithNoTooltip] sia convinta di avere un ruolo importante da svolgere in tutti i conteggi e censimenti previsti dal progetto attuale, e questi studiosi sono entusiasti all'idea di poter raccogliere tutti i dati grezzi relativi alla situazione dell'intero territorio." 
 parliaments.18.a: "[ROOT.GetCountry.Custom('common_string_ok')]" 
 
 parliaments.19.title: "L'Incompetenza di [target_character.GetNameWithNoTooltip]" 
 parliaments.19.desc: "Con il nostro attuale dibattito [ROOT.GetCountry.Custom('IT_PARL_AL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] incentrato sulla composizione del nostro [ROOT.GetCountry.GetGovernment.GetCabinetTitle], è venuto alla luce un grave errore commesso da [target_character.GetName]. Le sue capacità sembrano essersi rapidamente deteriorate dall'inizio del suo mandato e potrebbe essere opportuno valutare la sua sostituzione definitiva." 
 parliaments.19.a: "[ROOT.GetCountry.Custom('common_string_negative')]" 
 
 parliaments.20.title: "La Vita a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]" 
 parliaments.20.desc: "Come rappresentanti di aree che a volte sono piuttosto distanti da [ROOT.GetCountry.GetCapital.GetName], molti membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] spesso scoprono durante le loro visite che la vita lì è molto diversa da quella a cui sono abituati. Alcuni lo trovano angusta e sporca, e molti sembrano piuttosto sollevati quando tornano a casa.\n\nQuest'anno si è rivelato ancora più difficile del solito da sopportare per la delicata sensibilità dei vari membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName]. I mesi caldi sono stati insolitamente caldi, i mesi umidi insolitamente umidi e i mesi freddi insolitamente freddi. Un certo numero di membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] hanno ora deciso che ne hanno avuto abbastanza e si sono rivolti a noi chiedendo aiuto per rendere il loro soggiorno più piacevole." 
 parliaments.20.a: "Dobbiamo fare quello che possiamo." 
 parliaments.20.b: "Dovranno resistere come tutti noi." 
 
 parliaments.21.title: "Membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] Coinvolti nello Scandalo" 
 parliaments.21.desc: "Un piccolo scandalo si è verificato a [ROOT.GetCountry.GetCapital.GetName] durante l'attuale dibattito. Sembra che, invece di partecipare personalmente alle sessioni, alcuni membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] fossero fuori a disturbare la pace e a molestare i loro connazionali. L'indignazione è grande, sia tra i loro coetanei che nelle strade, e questo incidente probabilmente segnerà i futuri parlamenti per anni." 
 parliaments.21.a: "$common_string_let_it_slide$" 
 parliaments.21.b: "Arrestate i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName]." 
 
 parliaments.22.title: "Assenteismo" 
 parliaments.22.desc: "Data la sua grande influenza sulla politica del nostro paese, sarebbe facile supporre che tutti i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] abbiano partecipato alle sessioni parlamentari con grande entusiasmo, desiderosi di fare il massimo possibile con il potere che è stato loro affidato. Questo, tuttavia, è tutt'altro che vero. In ogni seduta, ce ne saranno alcuni che non si presenteranno mai, o perché si stanno ancora godendo le loro tenute in campagna o perché hanno deciso di prendere parte alle tante gioie della capitale. Negli ultimi tempi il problema è diventato sempre più grave e temiamo che i dignitari stranieri ridano di noi alle nostre spalle. Potremmo multare coloro che sono assenti durante i dibattiti per aumentare la partecipazione, ma ovviamente questi non la prenderebbero bene." 
 parliaments.22.a: "Multate i trasgressori peggiori"
 parliaments.22.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]" 
 
 parliaments.23.title: "Richieste di Rappresentanza" 
 parliaments.23.desc: "Un certo numero di pubblicazioni ostili hanno cominciato a circolare nelle città [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. Autori anonimi, ma molto critici, affermano che il nostro governo è autocratico e non governa tenendo in debita considerazione la situazione di tutti i cittadini [ROOT.GetCountry.Custom('IT_ADJ_MP')], insieme ad altre accuse ridicole. Chiedono sia una costituzione scritta sia un parlamento in cui possano essere rappresentate le varie parti del nostro Paese." 
 parliaments.23.a: "Vietate le pubblicazioni"
 parliaments.23.b: "Facciamo vaghe promesse di riforma" 
 
 parliaments.24.title: "Aiuti Finanziari" 
 parliaments.24.desc: "Sembra che le scarse finanze del nostro governo e i nostri disperati tentativi di reperire qualsiasi tipo di finanziamento siano diventati di pubblico dominio. Anche se questo sicuramente danneggerà la nostra reputazione sia [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] che all'estero, ha comportato alcuni vantaggi, poiché diversi membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName], che rappresentano [target_location.GetName], si sono avvicinati a noi offrendo il loro aiuto. Il loro prezzo, tuttavia, è una maggiore rappresentanza nel governo in generale, nonché canali formalizzati attraverso i quali lo Stato può chiedere il loro aiuto in futuro." 
 parliaments.24.a: "Concedete loro una maggiore rappresentanza"
 parliaments.24.b: "Rifiutate i loro soldi"
 parliaments.24.c: "Promettete di prendere in considerazione le loro opinioni." 
 
 parliaments.25.desc: "$parliaments.14.desc_common$ La loro ricchezza ha molta influenza [ROOT.GetCountry.Custom('IT_PARL_NEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] e, sfortunatamente, la usano per fare pressione contro i nostri attuali sforzi." 
 parliaments.25.a: "[ROOT.GetCountry.Custom('common_string_negative')]" 
 
 parliaments.27.title: "Tradizioni Parlamentari" 
 parliaments.27.desc: "Una delle cose più difficili dell'essere un parlamentare ha meno a che fare con i dibattiti a [ROOT.GetCountry.GetCapital.GetName], ma più con come vendere i dibattiti e i compromessi alle persone in patria. Tuttavia, un membro [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] locale avrà spesso più facilità a spiegare una nuova tassa rispetto a un esattore inviato dal governo centrale in sistemi meno rappresentativi.\n\nSembra che i membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] in generale, e quelli di [target_location.GetName] in particolare, siano diventati così abili nel difendere le politiche, che abbiamo visto un conseguente aumento del sostegno del governo centrale nel suo complesso." 
 parliaments.27.a: "Finalmente ci capiscono!" 
 
 parliaments.26.title: "Parlamento Favorevole" 
 parliaments.26.desc: "I membri [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName] sono stati particolarmente favorevoli negli ultimi tempi. Con le loro inclinazioni lealiste, potremmo facilmente influenzarli a nostro favore o estrarre risorse extra dalle loro regioni." 
 parliaments.26.a: "Fare leva sulla loro lealtà è la cosa più importante." 
 parliaments.26.b: "Abbiamo bisogno di valuta forte!" 
 
 parliaments.28.title: "Autorità in Conflitto" 
 parliaments.28.desc: "Uno spettacolo raro e inaspettato è emerso a [ROOT.GetCountry.GetCapital.GetName], poiché [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] e altri membri delle classi medie e inferiori si sono riuniti improvvisatamente durante una seduta [ROOT.GetCountry.Custom('IT_PARL_DEL')][ROOT.GetCountry.GetGovernment.GetParliament.GetName]. Uniti nel loro malcontento, stanno portando avanti il ​​dibattito su [target_debate.GetName], chiedendo cambiamenti che sfidino direttamente la volontà di [target_character.GetName]. Molti dei loro membri, alimentati dalle frustrazioni nei confronti della classe dirigente, hanno deciso che non possono più sopportare lo status quo e stanno facendo sentire la loro voce, nonostante la forte opposizione di [target_character.GetShortNameWithNoTooltip]." 
 parliaments.28.a: "Le nostre fruste sono diventate inefficaci!"
 parliaments.29.title: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] Hanno Tutte le Carte in Mano" 
 parliaments.29.desc: "I [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno presentato un reclamo formale dinanzi al [ROOT.GetCountry.GetGovernment.GetParliament.GetName], ed è difficile non dar loro ragione. I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] detengono una quota dominante del potere, soffocando i mercanti che generano gran parte della ricchezza [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]. Se lasciato senza controllo, questo squilibrio degenererà in aperto risentimento. Dobbiamo decidere se la lealtà verso i nostri alleati più antichi valga il prezzo di alienarci proprio coloro che riempiono le nostre casse." 
 parliaments.29.a: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ci hanno serviti bene." 
 parliaments.29.b: "I mercanti meritano un'udienza equa." 
 parliaments.30.title: "Una Questione di Fede nel [ROOT.GetCountry.GetGovernment.GetParliament.GetName]" 
 parliaments.30.desc: "È tutto molto bello discutere di strade e tasse, eppure il nostro [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ci ricorda che non tutto [ROOT.GetCountry.GetName] venera la vera fede. Con così tante anime ancora erranti al di fuori della sua luce, come può il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] occuparsi di questioni minori? Il loro argomento è persuasivo, forse scomodamente tanto. Dobbiamo decidere se lasciare che lo zelo spirituale guidi questa sessione o tenere a freno le ambizioni del clero." 
 parliaments.30.a: "La fede richiede la nostra piena attenzione." 
 parliaments.30.b: "Le questioni spirituali possono attendere." 
 parliaments.31.title: "La Voce dei Diseredati" 
 parliaments.31.desc: "Una spessa pila di petizioni è giunta al [ROOT.GetCountry.GetGovernment.GetParliament.GetName], ciascuna colma delle lamentele dei sudditi più oppressi [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. I [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] hanno ben poco potere, eppure il loro malcontento è cresciuto pericolosamente forte. Se ignoriamo queste grida, rischiamo di trasformare un risentimento latente in qualcosa di assai peggiore. Se ascoltiamo, rischiamo di incoraggiare coloro che vorrebbero usare i contadini come arma politica." 
 parliaments.31.a: "La loro sofferenza merita un riconoscimento." 
 parliaments.31.b: "L'ordine deve essere mantenuto." 
 parliaments.32.title: "Mercati dei Monasteri" 
 parliaments.32.desc: "I [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono furiosi. Le botteghe monastiche e le case di commercio gestite dalla Chiesa ribassano i loro prezzi a ogni occasione, godendo per giunta del considerevole vantaggio di essere esenti dalle tasse che gli onesti mercanti devono pagare. Il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], naturalmente, non vede alcuna ingiustizia in questo stato di cose. Entrambe le fazioni chiedono un'udienza, e non possiamo accontentarle entrambe. Questa disputa non si risolverà da sola." 
 parliaments.32.a: "I [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno le loro ragioni." 
 parliaments.32.b: "Il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] serve uno scopo superiore." 
 parliaments.32.c: "Non faremo favoritismi." 
 parliaments.33.title: "Dove Sono Finiti Tutti i Soldi?" 
 parliaments.33.desc: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno unito le voci nel [ROOT.GetCountry.GetGovernment.GetParliament.GetName] per porre una domanda a cui preferiremmo di gran lunga non rispondere. Come abbiamo fatto ad accumulare tanti debiti? La nostra spesa è stata effettivamente considerevole, e i nostri creditori stanno perdendo la pazienza. Possiamo affrontare questa tempesta con una ferma replica, oppure scegliere di fare promesse che faticheremo a mantenere. Nessuna delle due risposte è comoda." 
 parliaments.33.a: "Le nostre spese servono la gloria [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]." 
 parliaments.33.b: "Stringeremo la cinghia." 
 parliaments.34.title: "Il Diritto di Inviare un Delegato" 
 parliaments.34.desc: "Non tutti i membri del [ROOT.GetCountry.GetGovernment.GetParliament.GetName] possono sempre essere presenti di persona — guerre, malattie e le notevoli distanze tra i domini [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] lo garantiscono. I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno chiesto che ai loro membri assenti sia concesso di inviare delegati con pieno diritto di voto. È una soluzione sensata dal loro punto di vista. La corona la vede piuttosto diversamente. Un parlamento di delegati è un parlamento che non può essere pressato o persuaso allo stesso modo di una sala piena di persone in carne e ossa. Dobbiamo decidere che tipo di istituzione vogliamo che sia il [ROOT.GetCountry.GetGovernment.GetParliament.GetName]." 
 parliaments.34.a: "I signori assenti possono inviare delegati." 
 parliaments.34.b: "Tutti i voti devono essere espressi di persona." 
 parliaments.35.title: "Un Raro Accordo" 
 parliaments.35.desc: "È accaduto qualcosa di insolito nel [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] e i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno trovato una causa su cui sono realmente d'accordo, e ce l'hanno presentata con una sola voce. Momenti di unità come questo sono troppo rari per essere sprecati. Faremmo bene ad accoglierlo, sebbene ci si debba sempre chiedere cosa ciascuno di loro si aspetti di guadagnarne in cambio." 
 parliaments.35.a: "L'unità giova [ROOT.GetCountry.Custom('IT_Alla')][ROOT.GetCountry.GetName]." 
 parliaments.35.b: "La loro unità ci inquieta." 
 parliaments.36.title: "Il Costo di Questa Guerra" 
 parliaments.36.desc: "Il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] è esausto. Le petizioni delle famiglie dei soldati, dei mercanti falliti, dei sacerdoti chiamati a benedire troppe tombe si sono accumulate più in fretta delle vittorie. Persino coloro che esultavano più forte quando dichiarammo guerra ora impallidiscono all'arrivo dei conti. Possiamo ispirarli ancora una volta con la promessa di un trionfo finale, oppure possiamo riconoscere il tributo che questa guerra ha richiesto. In entrambi i casi, non possiamo ignorare ancora a lungo l'umore in quelle aule." 
 parliaments.36.a: "La vittoria renderà ogni sacrificio degno." 
 parliaments.36.b: "Ascoltiamo la sofferenza del nostro popolo." 
 parliaments.37.title: "Il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] Va in Guerra" 
 parliaments.37.desc: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno chiarito la loro posizione. Il nemico non aspetterà, e nemmeno possono farlo gli eserciti [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. Essi chiedono che il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] autorizzi immediatamente leve straordinarie. Che si condivida o meno la loro urgenza, il campo di battaglia è raramente un'arena paziente. Dobbiamo decidere fino a che punto estendere questa chiamata alle armi, e i figli di chi saranno costretti a risponderne." 
 parliaments.37.a: "Autorizziamo le leve straordinarie." 
 parliaments.37.b: "Non arruoleremo con la forza." 
 parliaments.38.title: "Coloro Che Sono Tornati a Casa" 
 parliaments.38.desc: "Hanno combattuto sotto le nostre insegne, sanguinato per i nostri confini, e ora sono a casa, in gran parte dimenticati. I veterani della nostra ultima campagna hanno chiesto al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] un riconoscimento per il loro servizio, che sia in terre, in denaro, o semplicemente un attestato di gratitudine da parte dei loro sovrani. Il costo di onorarli è modesto. Il costo di ignorarli potrebbe rivelarsi assai più alto." 
 parliaments.38.a: "Concediamo loro delle terre." 
 parliaments.38.b: "Paghiamo loro il giusto compenso di un soldato." 
 parliaments.38.c: "Hanno servito. Questo è già una ricompensa sufficiente." 
 parliaments.39.title: "Lupi ai Confini della Mappa" 
 parliaments.39.desc: "I nostri vicini non sono stati affatto sottili riguardo alle loro intenzioni. I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno portato al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] informazioni su provocazioni lungo le nostre frontiere — gesti diplomatici mancati, movimenti di truppe, il consueto teatro che precede qualcosa di ben poco teatrale. Possiamo finanziare le nostre difese ora, finché abbiamo ancora il lusso del tempo, oppure possiamo cercare un rimedio diplomatico prima che le spade escano dai foderi." 
 parliaments.39.a: "Fortifichiamo i nostri confini." 
 parliaments.39.b: "Inviamo prima i diplomatici." 
 parliaments.40.title: "La Fame Non Ha Pazienza per il Parlamento" 
 parliaments.40.desc: "Le petizioni sono scritte in un linguaggio semplice — il tipo che si usa quando si sono esauriti i modi cortesi per dire la stessa cosa. I granai sono vuoti. I bambini hanno fame. I [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] hanno portato la questione dinanzi al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] non perché credano nei bei discorsi, ma perché non hanno altrove a cui rivolgersi. Non possiamo discuterne fino a farla svanire nel nulla. Bisogna fare qualcosa, e in fretta." 
 parliaments.40.a: "Acquistiamo immediatamente riserve di grano." 
 parliaments.40.b: "Apriamo i nostri mercati al grano straniero." 
 parliaments.40.c: "Lasciamo che i mercati si correggano da soli." 
 parliaments.41.title: "La Moneta Vale Sempre Meno di Mese in Mese" 
 parliaments.41.desc: "I nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono allarmati, e per una volta non stanno esagerando. I prezzi salgono a un ritmo che supera qualsiasi spiegazione ragionevole, e il valore di ciò che scorre nelle nostre casse si riduce di giorno in giorno. Se lasciato senza controllo, questo potrebbe rovinare proprio le classi commerciali che mantengono solvibile [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName]. Abbiamo bisogno di un'azione decisa, sebbene la forma che tale azione assumerà farà piacere a qualcuno e infurierà altri." 
 parliaments.41.a: "Introduciamo misure di austerità." 
 parliaments.41.b: "Attribuiamo la colpa a chi di dovere." 
 parliaments.41.c: "Ripaghiamo i nostri debiti prima di ogni altra cosa." 
 parliaments.42.title: "Due Città, Un Solo Mercato" 
 parliaments.42.desc: "Entrambe le città hanno inviato rappresentanti al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] ed entrambe stanno discutendo con ammirevole veemenza e notevole clamore. La questione di chi debba detenere la carta commerciale dominante [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName] non è, francamente, una questione che si risolve da sola. Possiamo concedere a una città un vantaggio esclusivo, oppure possiamo aprire il mercato e lasciare che la concorrenza faccia ciò che i parlamenti raramente riescono a compiere, risolvendo il problema da sé." 
 parliaments.42.a: "Una sola carta, un solo mercato dominante." 
 parliaments.42.b: "Lasciamo che competano liberamente." 
 parliaments.43.title: "Il Peso dei Debiti [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]" 
 parliaments.43.desc: "Il registro contabile non è un documento piacevole da esaminare. Dobbiamo più di quanto ci piaccia ammettere, e i nostri creditori non sono del tipo paziente. Il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] ha convocato una sessione d'emergenza per affrontare la questione, sebbene 'affrontare' sia un termine generoso per le tre proposte assolutamente incompatibili che in questo momento vengono gridate da un capo all'altro dell'aula. Dobbiamo sceglierne una e convivere con le conseguenze." 
 parliaments.43.a: "Ristrutturiamo il debito." 
 parliaments.43.b: "Aumentiamo le tasse per coprirlo." 
 parliaments.43.c: "Vendiamo tutto ciò che deve essere venduto." 
 parliaments.44.title: "Per Una Volta, Buone Notizie" 
 parliaments.44.desc: "Per una volta, il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] si è riunito con qualcosa di piacevole da discutere. Il regno è stabile, le casse non piangono, e il nostro popolo non ha recentemente tentato nulla di catastrofico. Sono emerse diverse proposte su come impiegare al meglio questa rara buona sorte, e per una volta i dibattiti sono quasi civili. Non sprechiamo questo momento." 
 parliaments.44.a: "Costruiamo per il futuro." 
 parliaments.44.b: "Condividiamo la ricchezza con i nostri sudditi." 
 parliaments.44.c: "Prepariamoci alla guerra che inevitabilmente arriverà." 
 parliaments.45.title: "Eresia nelle Sale del Potere" 
 parliaments.45.desc: "Le nuove idee religiose che si stanno diffondendo in [ShowContinentName('europe')] hanno raggiunto i banchi del nostro [ROOT.GetCountry.GetGovernment.GetParliament.GetName], e il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] non la sta prendendo con calma. Pamphlet riformisti sono circolati, si sono levate voci di rabbia, e una rissa è stata evitata per un pelo durante la sessione della scorsa settimana. Dobbiamo prendere posizione prima che questo si trasformi da disputa teologica in qualcosa di assai più pericoloso." 
 parliaments.45.a: "Il parlamento sosterrà la vera fede." 
 parliaments.45.b: "Il parlamento ascolterà tutte le voci." 
 parliaments.46.title: "Chi Se Ne Prenderà il Merito?" 
 parliaments.46.desc: "Sia i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] che il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sono determinati a essere ricordati come i grandi mecenati di questa epoca. La loro disputa su chi, con la propria generosità, abbia fatto di più per le arti [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] è, dobbiamo ammetterlo, in qualche modo divertente, finché non si ricorda che ha completamente bloccato i lavori ordinari del [ROOT.GetCountry.GetGovernment.GetParliament.GetName] per le ultime due sessioni. Qualcuno deve essere dichiarato vincitore." 
 parliaments.46.a: "I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno guidato la nostra rinascita culturale." 
 parliaments.46.b: "Il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] è stato il vero mecenate." 
 parliaments.46.c: "Entrambi meritano ugualmente un riconoscimento." 
 parliaments.47.title: "Parole Pericolose in Tempi Pericolosi" 
 parliaments.47.desc: "Da quando la stampa a caratteri mobili si è stabilita [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetName], il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si lamenta dei pamphlet. I [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] li distribuiscono. Entrambi gli schieramenti sono giunti al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] con opinioni molto forti su quale versione dei fatti meriti di circolare liberamente. Una parte la chiama illuminismo. L'altra la chiama sedizione. Dovremo scegliere quale parola preferiamo." 
 parliaments.47.a: "Limitiamo le pubblicazioni dannose." 
 parliaments.47.b: "La stampa deve poter circolare liberamente." 
 parliaments.48.title: "I Campi di Dio e l'Aratro del Contadino" 
 parliaments.48.desc: "C'è una disputa che cova nelle nostre campagne da generazioni, e che è finalmente giunta al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] in tutta la sua scomoda complessità. Le terre monastiche premono contro i campi contadini, e la questione di chi possa coltivare cosa si è trasformata da lamentela locale in questione di principio. Il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] invoca il diritto divino. I [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] invocano la tradizione. Nessuno dei due argomenti è del tutto sbagliato, ed è proprio questo a rendere la faccenda così difficile." 
 parliaments.48.a: "I diritti dei monasteri sono sacrosanti." 
 parliaments.48.b: "Restituiamo le terre contese ai contadini." 
 parliaments.49.title: "Una Voce dai Nuovi Territori" 
 parliaments.49.desc: "Rappresentanti dei nostri territori recentemente acquisiti hanno intrapreso il viaggio per chiedere al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] diritti e rappresentanza. Parlano senza arroganza ma con una tranquilla determinazione che impone quantomeno una certa attenzione. Se includerli negli ingranaggi del governo [ROOT.GetCountry.GetAdjectiveWithNoTooltip] o respingere la loro richiesta è una questione che plasmerà per decenni a venire il modo in cui i nostri nuovi sudditi vedranno i loro sovrani." 
 parliaments.49.a: "Concediamo loro una voce nel nostro [ROOT.GetCountry.GetGovernment.GetParliament.GetName]." 
 parliaments.49.b: "Sono sudditi, non partecipanti." 
 parliaments.50.title: "Un Regno nel Regno" 
 parliaments.50.desc: "I grandi signori delle nostre province sono giunti al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] con un'antica richiesta avvolta in un linguaggio nuovo. La chiamano 'autogoverno locale'. Ciò che intendono, ovviamente, è che desiderano essere lasciati liberi di gestire i propri affari senza interferenze dalla capitale, il che è un modo educato per chiederci di governare meno del nostro stesso paese. È una proposta allettante, se non si pensa troppo a fondo a dove porterebbe alla fine." 
 parliaments.50.a: "Concediamo loro i propri tribunali locali." 
 parliaments.50.b: "La corona governa tutto [ROOT.GetCountry.GetName]." 
 parliaments.51.title: "Disordine ai Confini" 
 parliaments.51.desc: "Un rapporto è stato posto dinanzi al [ROOT.GetCountry.GetGovernment.GetParliament.GetName] la cui lettura risulta a dir poco sgradevole. In certi angoli [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName], la legge del regno sembra essere diventata più un suggerimento che una regola. I funzionari locali sono assenti, incompetenti, o semplicemente in inferiorità numerica. I [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] sono stati i più rumorosi nelle loro lamentele, il che è di solito un segno affidabile che il problema è reale. Non possiamo permettere che questo peggiori." 
 parliaments.51.a: "Inviamo amministratori per ristabilire l'ordine." 
 parliaments.51.b: "Inviamo invece dei soldati." 
 parliaments.52.title: "Due Popoli, Un Solo [ROOT.GetCountry.GetGovernment.GetParliament.GetName]" 
 parliaments.52.desc: "L'incorporazione di nuovi territori ha portato nuovi popoli sotto il dominio [ROOT.GetCountry.GetAdjectiveWithNoTooltip] e nell'aula del [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. I [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] vedono un'opportunità nell'assimilazione; i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] vedono partnership commerciali nella convivenza. Nessuna delle due posizioni è disinteressata, ma almeno sono entrambe coerenti. Dobbiamo scegliere quale visione [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] vogliamo costruire." 
 parliaments.52.a: "Un solo [ROOT.GetCountry.GetNameWithNoTooltip], una sola cultura." 
 parliaments.52.b: "La diversità ci rende più forti." 
 parliaments.53.title: "La Questione di [target_character.GetNameWithNoTooltip]" 
 parliaments.53.desc: "I risultati di solito non bastano a soddisfare il [ROOT.GetCountry.GetGovernment.GetParliament.GetName]. [target_character.GetName] li ha ottenuti. I rapporti sono misurabili, i miglioramenti sono reali, e il parlamento se n'è accorto. Ed è proprio questo, a quanto pare, il problema. Quando un ministro diventa così efficace, sorgono domande su come sia stato svolto il lavoro. Le aspettative di chi sono state silenziosamente accantonate? Gli interessi di chi sono stati silenziosamente serviti? Il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] ha chiesto un resoconto completo, e dobbiamo decidere quanto controllo [target_character.GetName] riceverà effettivamente." 
 parliaments.53.a: "Il loro operato parla da sé." 
 parliaments.53.b: "Lasciamo che il parlamento esamini i conti." 
 parliaments.54.title: "Due Ministri, Due Agende" 
 parliaments.54.desc: "Il gabinetto è diventato un campo di battaglia, e il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] se ne accorge. [target_character.GetName] e [rival_character.GetName] hanno trascorso l'intera sessione cercando di screditarsi a vicenda, ciascuno sperando che l'altro venga incolpato di un fallimento che nessuno dei due ammetterà di aver causato. La loro rivalità non diverte nessuno, tranne loro stessi e chiunque stia scommettendo. Dobbiamo risolverla." 
 parliaments.54.a: "Sosteniamo [target_character.GetName]." 
 parliaments.54.b: "Sosteniamo [rival_character.GetName]." 
 parliaments.54.c: "Licenziamoli entrambi." 
 parliaments.55.title: "Mani Sporche in Aule Pulite" 
 parliaments.55.desc: "Qualcuno nel [ROOT.GetCountry.GetGovernment.GetParliament.GetName] ha accusato [target_character.GetName] di corruzione, e l'accusa contiene abbastanza dettagli da risultare impossibile da ignorare del tutto. Se l'accusa sia autentica o soltanto un'arma politica dipende molto da chi la chiede, e chi pone la domanda ha una notevole influenza su come verrà data la risposta. Dobbiamo decidere se perseguire la questione o seppellirla sotto la nostra dignitosa disapprovazione." 
 parliaments.55.a: "Indaghiamo sulle accuse." 
 parliaments.55.b: "Non è altro che teatro politico." 
 parliaments.56.title: "Un Disaccordo Procedurale di Monumentale Tedio" 
 parliaments.56.desc: "Il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] si è bloccato del tutto. Una disputa sulla procedura di voto — se decidere le questioni per acclamazione o per appello nominale, se i delegati possano astenersi, se l'ordine degli oratori sia stato determinato correttamente — ha consumato tre intere sessioni che avrebbero potuto essere dedicate all'effettivo governo. Da qualche parte, esiste una risposta corretta a tutto questo. Vorremmo soltanto che non dovessimo essere noi a fornirla." 
 parliaments.56.a: "Emettiamo un editto dal trono." 
 parliaments.56.b: "Lasciamo che il parlamento risolva da solo il proprio pasticcio." 
 parliaments.57.title: "Banchi Vuoti, Lamentele Abbondanti" 
 parliaments.57.desc: "Uno dei nostri ceti più potenti ha raggiunto il limite della propria pazienza. La loro soddisfazione per l'attuale direzione del [ROOT.GetCountry.GetGovernment.GetParliament.GetName] è, per usare un eufemismo, estremamente bassa, e hanno fatto sapere che la loro presenza continuata non può essere garantita a meno che qualcosa non cambi. Se si tratti di una minaccia autentica o di una tattica negoziale è difficile dirlo. Ciò che è certo è che un parlamento con un'assenza così vistosa prende decisioni piuttosto poco convincenti." 
 parliaments.57.a: "Facciamo delle concessioni prima che se ne vadano." 
 parliaments.57.b: "Lasciamo che ci provino." 
 parliaments.58.title: "Il [ROOT.GetCountry.GetGovernment.GetParliament.GetName] Fa Valere le Sue Pretese" 
 parliaments.58.desc: "Un'assemblea costituzionale non si limita a restare ferma, grata della propria esistenza. La nostra ha deciso che questo è il momento di spingersi oltre — di enumerare diritti che finora sono stati impliciti anziché scritti, di stabilire precedenti che sarebbe difficile disfare. Non hanno torto nel dire che un simile documento chiarirebbe il governo [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]. Non hanno nemmeno torto nel dire che limiterebbe permanentemente l'autorità della corona. Dobbiamo decidere quanto potere siamo disposti a cedere per iscritto, perché il potere scritto tende a restare ceduto." 
 parliaments.58.a: "Concediamo la carta." 
 parliaments.58.b: "L'autorità della corona non è soggetta a enumerazione." 
