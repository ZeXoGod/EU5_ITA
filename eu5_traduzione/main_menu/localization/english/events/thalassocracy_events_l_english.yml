l_english:
 thalassocracy_events.1.title: "I Frutti del Nostro Lavoro"
 thalassocracy_events.1.desc_success: "La rapida espansione della nostra marina è stata un successo straordinario! Le numerose navi costruite e ammodernate di recente, condotte da marinai esperti, incuteranno certamente timore ai nostri rivali e nemici. Né pirati malvagi né flotte sotto stendardi ostili ostacoleranno più il nostro dominio sulle onde. Con le nostre rotte marittime al sicuro, ci sarà molto più facile governare terre lontane e proiettare la nostra potenza attraverso i mari."
 thalassocracy_events.1.desc_failure: "Dopo anni di difficili dibattiti per assicurare i fondi alla nostra marina, dovremo ora abbandonare i nostri sogni di dominare attraverso i mari. Senza una marina forte a sostegno delle nostre pretese di Talassocrazia, non possiamo difendere le nostre acque né dai rivali né dai corsari."
 thalassocracy_events.1.a: "Il nostro impero marittimo prospererà!"
 unlock_thalassocracy_reform_tt: "Sblocca la [government_reform|e] [ShowGovernmentReformName('thalassocracy_reform')]"
 thalassocracy_events.1.b: "Dovremo convivere con il nostro fallimento."
