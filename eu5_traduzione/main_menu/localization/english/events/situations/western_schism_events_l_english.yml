l_english:
 western_schism.1.title: "Uno Scisma nella Chiesa Cattolica"
 western_schism.1.desc: "Uno Scisma ha colpito [ShowReligionName('catholic')] e ha gettato la $curia$ in un meschino fazionalismo!\n\nDopo la morte dell'ultimo [GetInternationalOrganization('catholic_church').GetLeaderTitle], una fazione di cardinali [ShowCultureGroupName('italian_group')] cerca di riconquistare la Santa Sede, a lungo sotto il controllo [ShowCultureGroupName('french_group')], mentre la fazione [ShowCultureGroupNameWithNoTooltip('french_group')] si rifiuta di cederla.\n\nNessuna delle due parti cede, e la [GetInternationalOrganization('catholic_church').GetName] resta priva dei suoi pastori. Finché la divisione non si sanerà, i fedeli dovranno decidere da soli chi parli davvero in nome della volontà divina."
 western_schism.1.a: "Questo non va bene."

 western_schism.3.title: "Insoddisfazione [ROOT.GetCountry.Custom('IT_CLERGY_OAI')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] per lo Scisma"
 western_schism.3.desc: "Non abbiamo ancora scelto uno schieramento nello Scisma tra [target_schism_pope_cardinal.GetName] e [target_schism_opponent_cardinal.GetName]. I nostri cardinali ci esortano a prendere una decisione ufficiale su chi sostenere."
 western_schism.3.a: "Questa decisione può aspettare ancora..."
 
 western_schism.4.title: "[jan_hus.GetNameWithNoTooltip]"
 western_schism.4.desc: "Nel cuore di [ROOT.GetCountry.GetCapital.GetArea.GetName], si accende una fiamma di dissenso religioso, alimentata dai potenti venti del cambiamento. [jan_hus.GetName], carismatico sacerdote e studioso [ShowCultureName('czech')], si è schierato contro la corruzione percepita della [GetInternationalOrganization('catholic_church').GetName]. Le [jan_hus.GetHerHis|U] parole trovano eco nel popolo, e una nuova fede, quella [ShowReligionAdjective('hussite')], inizia a mettere radici.\n\n[jan_hus.GetNameWithNoTooltip] predica contro lo sfarzo e gli eccessi della [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip], invocando un ritorno alla semplicità e alla purezza del cristianesimo delle origini. I [jan_hus.GetHerHis|U] seguaci, noti come [ShowReligionAdjectiveWithNoTooltip('hussite')], abbracciano i [jan_hus.GetHerHis] insegnamenti, con un fervore che cresce di giorno in giorno. L'ordine costituito trema, poiché le parole di [jan_hus.GetLastNameWithNoTooltip] sfidano l'autorità della [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip] e del [GetInternationalOrganization('hre').GetName]."
 western_schism.4.historical_info: "Jan Hus, noto anche come Johannes Hus, fu un teologo e filosofo che divenne uno dei primi riformatori del cattolicesimo. Fu l'ispiratore della fede Hussita, un predecessore del Luteranesimo. Nacque da genitori poveri, ma fu educato al sacerdozio nel tentativo di sfuggire alla povertà. Durante il suo servizio come sacerdote, si oppose a molti aspetti della Chiesa Cattolica in Boemia. Quando Alessandro V fu eletto Papa, emise una bolla papale per scomunicarlo e durante il Concilio di Costanza, che segnò la fine dello Scisma d'Occidente, Jan Hus partecipò per presentare le sue opinioni sul dissenso con la Chiesa, ma fu immediatamente arrestato e imprigionato. Si rifiutò di ritrattare le sue opinioni e il 6 luglio 1415 fu bruciato sul rogo per eresia. I suoi seguaci fondarono una nuova religione e combatterono contro cinque diverse crociate nei decenni successivi. La fede hussita durò per quasi due secoli in Boemia."
 western_schism.4.a: "Ha degli insegnamenti interessanti..."

 western_schism.5.title: "Erosione della Fede"
 western_schism.5.desc: "La confusione causata dal conflitto tra [target_schism_pope_cardinal.GetName] e [target_schism_opponent_cardinal.GetName] ha avuto un impatto grave sulla stabilità [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]. L'incertezza sull'occupazione della Santa Sede sta diffondendo dubbi sul corretto servizio religioso e sta lentamente erodendo la fede della gente."
 western_schism.5.a: "Pregheremo per una rapida fine dei loro litigi."
 western_schism.5.b: "Forse la nostra gente dovrebbe valutare delle alternative."

 western_schism.6.title: "Scontro tra [opponent_support_location.GetNameWithNoTooltip] e [pope_support_location.GetNameWithNoTooltip]"
 western_schism.6.desc: "I cittadini di [opponent_support_location.GetName], convinti sostenitori di [target_schism_opponent_cardinal.GetName], si sono recentemente scontrati con [pope_support_location.GetName], accaniti seguaci di [target_schism_pope_cardinal.GetName]. Entrambe le fazioni hanno ora chiesto [target_ruler.Custom('IT_AL_TITOLO')][target_ruler.GetName] di prendere una posizione chiara a favore di una delle due parti."
 western_schism.6.a: "[opponent_support_location.GetNameWithNoTooltip] ha chiaramente ragione."
 western_schism.6.b: "Sostieniamo i cittadini di [pope_support_location.GetNameWithNoTooltip]."
 western_schism.6.c: "Possono risolvere queste piccole controversie tra loro."
 western_schism_resolution_impact_positive.tt: "La parte prescelta otterrà un certo sostegno nello $western_schism$"
 western_schism_resolution_impact_negative.tt: "La parte prescelta perderà un certo sostegno nello $western_schism$"

 western_schism.7.title: "Il Fiorente Commercio in [ShowRegionNameWithNoTooltip('italy_region')]"
 western_schism.7.desc: "Grazie agli sforzi di [target_schism_pope_cardinal.GetName] in [ShowRegionName('italy_region')], il commercio con la regione sta fiorendo. [ROOT.GetCountry.Custom('IT_BURGHERS_IL_NOSTRO')|U][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] [ROOT.GetCountry.Custom('IT_BURGHERS_SONO')] molto soddisfatt[ROOT.GetCountry.Custom('IT_BURGHERS_OAI')] di questa situazione e della tutela dei propri interessi nella regione."
 western_schism.7.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 italian_trade: "Legami con l'[ShowRegionNameWithNoTooltip('italy_region')]"

 western_schism_8_10_common_string: "La nostra posizione nello [GetSituationByKey('western_schism').GetName] ha suscitato proteste popolari in alcune parti del nostro Paese. La popolazione di [target_location.GetName] ha iniziato ad armarsi e a chiedere il nostro sostegno alla fazione di"

 western_schism.8.title: "Sostegno Popolare per [target_schism_opponent_cardinal.GetNameWithNoTooltip]"
 western_schism.8.desc: "$western_schism_8_10_common_string$ [target_schism_opponent_cardinal.GetName]."
 western_schism.8.a: "Non cederemo a richieste così meschine."
 western_schism.8.b: "Dopotutto [target_schism_opponent_cardinal.GetNameWithNoTooltip] potrebbe essere la scelta migliore per noi."

 western_schism.9.title: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] Premia la Fedeltà"
 western_schism.9.desc: "[target_schism_opponent_cardinal.GetName], l'unico e vero [GetInternationalOrganization('catholic_church').GetLeaderTitle] ha premiato la nostra fedeltà con una concessione speciale, che ci garantisce maggiori diritti all'interno della [GetInternationalOrganization('catholic_church').GetName]."
 western_schism.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 western_schism.10.title: "Supporto Popolare per [target_schism_pope_cardinal.GetNameWithNoTooltip]"
 western_schism.10.desc: "$western_schism_8_10_common_string$ [target_schism_pope_cardinal.GetName]."
 western_schism.10.a: "Lasciamoli provare."
 western_schism.10.b: "Hanno dei validi argomenti."

 western_schism_11_12_common_string: "nella continua lotta per la guida della [GetInternationalOrganization('catholic_church').GetName], [target_country.Custom('IT_La')][target_country.GetName] ha elogiato il nostro popolo! Hanno lodato la resilienza [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] e la forte fede che dimostriamo in tempi così instabili.\n\nSebbene le loro dolci parole siano un ovvio stratagemma per assicurarsi il nostro sostegno, potrebbero comunque rivelarsi utili per noi, indipendentemente dal fatto che mostriamo apertamente il nostro sostegno per"

 western_schism_11_12_common_string_2: "altrimenti utilizziamo questo elogio per i nostri programmi all'interno della [GetInternationalOrganization('catholic_church').GetNameWithNoTooltip]."

 western_schism.11.title: "[target_country.Custom('IT_La')|U][target_country.GetNameWithNoTooltip] Elogia la Nostra Convinzione"
 western_schism.11.desc: "Un forte sostenitore di [target_schism_pope_cardinal.GetName], $western_schism_11_12_common_string$ [target_schism_pope_cardinal.GetNameWithNoTooltip], $western_schism_11_12_common_string_2$"
 western_schism.11.a: "[target_schism_pope_cardinal.GetNameWithNoTooltip] è il nostro [GetInternationalOrganization('catholic_church').GetLeaderTitle]!"
 western_schism.11.b: "Facciamo leva su questa lode all'interno della Chiesa."

 western_schism.12.desc: "Un forte sostenitore di [target_schism_opponent_cardinal.GetName], $western_schism_11_12_common_string$ [target_schism_opponent_cardinal.GetNameWithNoTooltip], $western_schism_11_12_common_string_2$"
 western_schism.12.a: "[target_schism_opponent_cardinal.GetNameWithNoTooltip] è il nostro [GetInternationalOrganization('catholic_church').GetLeaderTitle]!"

 western_schism_13_14_common_string: "in opposizione al resto degli altri ceti. Questa divisione interna, causata dalla divisione che attraversa la stessa [GetInternationalOrganization('catholic_church').GetName], minaccia di frammentare il nostro Paese in più fazioni se non agiamo con cautela."

 western_schism.13.title: "Contro Ogni Previsione"
 western_schism.13.desc: "Il ceto [target_estate.GetName], composto da persone timorate di [ROOT.GetCountry.GetReligion.GetGodName], si è ritrovato a sostenere [target_schism_pope_cardinal.GetName] $western_schism_13_14_common_string$"
 western_schism.13.a: "Schieriamoci con il ceto [target_estate.GetNameWithNoTooltip]."
 western_schism.13.b: "Staremo con la maggioranza."

 western_schism.14.desc: "Il ceto [target_estate.GetName], composto da persone timorate di [ROOT.GetCountry.GetReligion.GetGodName], si è ritrovato a sostenere [target_schism_opponent_cardinal.GetName] $western_schism_13_14_common_string$"

 western_schism.15.title: "Un Predicatore Itinerante"
 western_schism.15.desc: "L'erosione della nostra fede causata dallo [ShowSituationName('western_schism')] ha intaccato profondamente la fiducia della popolazione di [unrest_location_scope.GetName]. In questo vuoto di fiducia e stabilità è comparso [target_character.GetName] con i suoi sermoni eretici e le sue accuse di corruzione. Mentre [target_character.GetSheHe] afferma di essere un vero [ROOT.GetCountry.Custom('IT_REL_MS')], le sue letture hanno incoraggiato alcuni in [unrest_location_scope.GetNameWithNoTooltip] a seguire idee pericolose e potremmo dover agire rapidamente per impedire che questa eresia si diffonda ulteriormente."
 western_schism.15.a: "Le sue idee non sembrano poi così male."
 western_schism.15.b: "Non possiamo permettere che [target_character.GetNameWithNoTooltip] continui."

 western_schism.1000.title: "Il Prezzo dell'#italic Oboedientia#!"
 western_schism_action_event_tt: "Chiederemo a uno dei candidati di aiutarci finanziariamente."
 western_schism.1001.desc: "[target.GetName] ha premiato la nostra lealtà in un modo che si addice a una nazione importante e prestigiosa come la nostra. Con il nostro supporto, tutti accetteranno sicuramente [target.GetNameWithNoTooltip] come il vero [GetInternationalOrganization('catholic_church').GetLeaderTitle]."
 western_schism.1001.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 western_schism.1002.desc: "[target.GetName] ha disprezzato il nostro supporto e si è rifiutato di trattarci con il dovuto rispetto. Questo oltraggioso affronto non può essere tollerato e dovremmo seriamente riconsiderare la nostra fedeltà, poiché chiaramente non siamo apprezzati da loro."
 western_schism.1002.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

 western_schism.1100.title: "Il Falso Sostegno [target_country.Custom('IT_Alla')][target_country.GetNameWithNoTooltip]"
 western_schism.1100.desc: "Il nostro rapporto con [target_country.Custom('IT_La')][target_country.GetName] è teso e ha sofferto ancora di più durante lo [ShowSituationName('western_schism')]. Sebbene la nostra influenza all'interno della [GetInternationalOrganization('catholic_church').GetName] non sia totale, potremmo sfruttarla per spostare l'equilibrio a nostro favore."
 western_schism.1100.a: "Avremo l'influenza che meritiamo!"
 western_schism.1100.b: "Dovremmo cercare di non aumentare le ostilità."

 western_schism.1101.title: "Un Grave Insulto"
 western_schism.1101.desc: "I diplomatici moralmente corrotti [origin_country.Custom('IT_Della')][origin_country.GetName] hanno lavorato per ridurre la nostra influenza sulla [GetInternationalOrganization('catholic_church').GetName]. Questo insulto non può essere tollerato e dovremmo considerarlo un pretesto per mostrargli il loro posto."
 western_schism.1101.a: "[ROOT.GetCountry.Custom('common_string_we_must_do_something')]"

 western_schism.1200.title: "[target_country.Custom('IT_La')|U][target_country.GetNameWithNoTooltip] Desta Sospetti"
 western_schism.1200.desc: "L'attuale [ShowSituationName('western_schism')] ha causato instabilità all'interno della [GetInternationalOrganization('catholic_church').GetName] e l'esistenza di un falso [GetInternationalOrganization('catholic_church').GetLeaderTitle] ha portato incertezza tra i fedeli. Recentemente, [target_ruler.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][target_ruler.GetName] [target_country.Custom('IT_DEL_RANGO')][target_country.GetLongName] ha attirato la nostra attenzione con un incidente diplomatico che mostra come sia fedele al pretendente, e non a noi. Dovremmo inviare una delegazione per una inchiesta ed assicurci che [target_ruler.GetSheHe] sia sulla retta via."
 western_schism.1200.a: "Inviamo la delegazione [target_country.Custom('IT_Alla')][target_country.GetNameWithNoTooltip]."
 western_schism.1200.b: "Abbiamo cose migliori da fare."

 western_schism.1201.title: "Una Delegazione Papale"
 western_schism.1201.desc: "Un diplomatico di [target_schism_pope_cardinal.GetName] è arrivato alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Sebbene non siamo ancora certi di quale sia il loro scopo dichiarato, è probabile che vogliano essere trattati come una delegazione ufficiale del [GetInternationalOrganization('catholic_church').GetLeaderTitle] e vogliano indagare sulle nostre alleanze all'interno dello [ShowSituationName('western_schism')]. Anche se non possiamo respingerli direttamente, saremo comunque senza alcun dubbio in grado di dimostrare la nostra fedeltà."
 western_schism.1201.a: "Certamente, [target_schism_pope_cardinal.GetNameWithNoTooltip] è il vero [GetInternationalOrganization('catholic_church').GetLeaderTitle]"
 western_schism.1201.b: "Siamo leali a [target_schism_opponent_cardinal.GetNameWithNoTooltip]."

 western_schism.1300.title: "La Richiesta di un Concilio"
 western_schism.1300.desc: "Grazie alla nostra attuale posizione di vantaggio all'interno della Curia, abbiamo raccolto sufficiente sostegno per convocare un concilio a [target_location.GetName]. Sebbene la legittimità del concilio sarà sicuramente messa in discussione da molti all'interno della [GetInternationalOrganization('catholic_church').GetName], i nostri sostenitori lo ascolteranno, dimostrando sia il nostro potere che il sostegno della maggioranza dei cardinali. Sebbene non possiamo porre fine allo [ShowSituationName('western_schism')], dimostreremo l'autorità del nostro [GetInternationalOrganization('catholic_church').GetLeaderTitle] e faremo un passo importante per risolvere questo conflitto a nostro favore."
 western_schism.1300.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 western_schism.1300.a.tt: "Ogni membro della fede [THIS.GetReligion.GetAdjective] cambia la propria opinione nei confronti [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] di [ShowBiasValue('schism_called_council')|+=0]"

 western_schism.1301.title: "Il Consiglio di [target_location.GetNameWithNoTooltip]"
 western_schism.1301.desc: "Diplomatici di [council_country.GetName] sono giunti alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], per convocare rappresentanti del nostro [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] a un concilio a [target_location.GetName]. Sebbene la legittimità del concilio sia già messa in discussione dai suoi oppositori, potrebbe rappresentare una tappa importante nella risoluzione della [ShowSituationName('western_schism')]."
 western_schism.1301.a: "Partecipiamo al concilio per sostenerlo."
 western_schism.1301.b: "Dobbiamo riconoscere l'autorità del concilio."
 western_schism.1301.c: "Respingiamo l'audacia di questi impostori."

 western_schism.2000.title: "La Chiesa Cattolica di Nuovo Unita!"
 western_schism.2000.desc: "Dopo il Concilio, la Chiesa è stata nuovamente riunita grazie agli sforzi di [winner_country.GetName], sotto una nuova autorità. [GetInternationalOrganization('catholic_church').GetName] rimane integra e indivisa, ma l'autorità del [GetInternationalOrganization('catholic_church').GetLeaderTitle] si è notevolmente indebolita durante questo periodo. Speriamo che ciò non abbia danneggiato permanentemente la nostra fede. Auspichiamo che il nuovo [GetInternationalOrganization('catholic_church').GetLeaderTitle] si dimostri capace."
 western_schism.2000.title.unresolved: "Lo Scisma si Spegne"
 western_schism.2000.desc.unresolved: "Non è stato possibile riunire alcun Concilio per dirimere la questione, e le pretese rivali sono svanite per mancanza di sostegno. La [ShowSituationName('western_schism')] si conclude senza che alcun candidato venga acclamato come legittimo [GetInternationalOrganization('catholic_church').GetLeaderTitle], e l'autorità di quella carica ne esce fortemente ridimensionata per la [GetInternationalOrganization('catholic_church').GetName]. Speriamo che ciò non abbia danneggiato in modo permanente la nostra fede."
 western_schism.2000.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 western_schism.2100.title: "Un Nuovo [GetInternationalOrganization('catholic_church').GetLeaderTitle] per la Chiesa"
 western_schism.2100.desc.common: "Grazie ai nostri ripetuti sforzi per risolvere lo [ShowSituationName('western_schism')] durante un concilio, è diventato chiaro che il nostro candidato è veramente il legittimo [GetInternationalOrganization('catholic_church').GetLeaderTitle]. Mentre alcuni si aggrappano ancora al pretendente eretico, abbiamo raccolto una schiacciante maggioranza di sostegno per dichiarare lo [ShowSituationName('western_schism')] risolto."
 western_schism.2100.desc.a: "$western_schism.2100.desc.common$\n\nGrazie al sostegno che abbiamo accumulato, sarà facile selezionare un candidato idoneo tra le nostre fila, restituendo l'autorità papale alla città eterna di [ShowLocationName('rome')]."
 western_schism.2100.desc.b: "$western_schism.2100.desc.common$\n\nGrazie alla nostra influenza sulla curia, saremo in grado di preservare la consuetudine consolidata del papato di [ShowLocationName('avignon')]."
 western_schism.2100.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

 western_schism.20.title: "Due Vescovi, una Sola Diocesi"
 western_schism.20.desc: "Un vescovado del nostro regno è rimasto vacante, e non appena la sede si è raffreddata, due uomini ne hanno rivendicato il possesso: uno recante il sigillo di Roma, l'altro quello del papa rivale. Ciascuno ha scagliato #R la scomunica#! contro l'altro; ciascuno pretende il nostro riconoscimento. Nel frattempo la diocesi resta senza guida, i suoi sacerdoti sono smarriti, e i suoi fedeli chiedono a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] quale pastore debbano obbedire."
 western_schism.20.a: "La sede spetta all'uomo di Roma."
 western_schism.20.b: "La sede spetta all'altro pretendente."
 western_schism.20.c: "Lasciamoli litigare: le rendite restino a noi."

 western_schism.21.title: "Il Ritiro dell'Obbedienza"
 western_schism.21.desc: "I nostri giuristi e i maestri delle scuole rivolgono a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] un audace consiglio: non dobbiamo obbedienza a #Y nessuno#! dei due pretendenti finché due uomini indossano la tiara, e dovremmo negarla a entrambi finché la Cristianità non sarà di nuovo unita. Il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] è sgomento; i tesorieri della corona, liberati dalle esazioni papali, ne sono invece segretamente compiaciuti."
 western_schism.21.a: "Non riconosceremo alcun papa finché la Chiesa non sarà di nuovo una sola."
 western_schism.21.b: "Restiamo un figlio fedele della Chiesa."

 western_schism.22.title: "Esattori Rivali delle Annate"
 western_schism.22.desc: "Due esattori papali sono giunti nella stessa settimana, ciascuno recando lettere di autorità dal proprio signore, ciascuno pretendendo le #Y annate#! di ogni beneficio del nostro regno: la rendita del primo anno di ogni nomina ecclesiastica, dovuta, a loro dire, all'unico vero papa. Si squadrano con disprezzo nella nostra corte, ed entrambi guardano al nostro tesoro con bramosia."
 western_schism.22.a: "Roma avrà quanto le spetta."
 western_schism.22.b: "Paghiamo l'uomo dell'altro pretendente."
 western_schism.22.c: "Mandiamoli via entrambi: le monete restano qui."

 western_schism.23.title: "Un Giubileo Proclamato"
 western_schism.23.desc: "Uno dei papi rivali ha proclamato un #Y Anno Giubilare#!, promettendo la remissione piena dei peccati a ogni pellegrino che venga a venerare le tombe degli apostoli. Il suo rivale ha denunciato l'intera faccenda come una frode ai danni dei fedeli e un tentativo spudorato di accaparrarsi l'argento dei pellegrini. Il nostro popolo sta già preparando i bastoni da viaggio e chiede la nostra benedizione per il cammino."
 western_schism.23.a: "Lasciamo partire i fedeli, e il Cielo sorrida loro."
 western_schism.23.b: "Una truffa travestita da grazia. Vietiamola."

 western_schism.24.title: "I Venditori di Indulgenze"
 western_schism.24.desc: "Venditori di indulgenze affollano le nostre piazze di mercato, spacciando pergamene munite del sigillo dell'uno o dell'altro papa, ciascuno giurando che solo la propria apre le porte del Paradiso. Il popolo svuota le proprie borse e torna a casa inquieto, mormorando che la salvezza è stata messa all'asta, e che una Chiesa con due teste difficilmente può concordare su quale chiave apra la serratura."
 western_schism.24.a: "Concediamo loro una licenza, e prendiamoci la nostra parte del commercio."
 western_schism.24.b: "Cacciamo questi ciarlatani dalle nostre strade."

 western_schism.25.title: "Il Predicatore degli Ultimi Giorni"
 western_schism.25.desc: "Una figura smunta, vestita di cilicio, percorre le strade del nostro regno. [apocalyptic_preacher.GetName] raduna folle in ogni villaggio, gridando che una Chiesa con due teste è il segno stesso predetto della Fine dei Tempi, e che solo la #Y flagellazione#! può purificare un clero corrotto. I contadini piangono e seguono [apocalyptic_preacher.GetHerHis|l] a piedi scalzi; il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] osserva con crescente allarme."
 western_schism.25.a: "Lasciamolo predicare. In tempi come questi, il popolo ha bisogno di speranza."
 western_schism.25.a.tt: "A #Y [apocalyptic_preacher.GetName]#! sarà consentito di predicare. Il suo movimento potrebbe crescere oltre il nostro controllo."
 western_schism.25.b: "Mettiamo a tacere questo folle prima che ci danni tutti."

 western_schism.26.title: "I Flagellanti si Radicalizzano"
 western_schism.26.desc: "Ciò che era iniziato come penitenza si è trasformato in rivolta. I seguaci di [apocalyptic_preacher.GetName] si flagellano a sangue per le nostre strade e urlano che ogni sacerdote è servo dell'Anticristo e ogni papa un impostore. Il movimento non obbedisce più ai nostri ordini, e le strade sono piene di sguardi stravolti e flagelli."
 western_schism.26.a: "Schiacciamoli, qualunque sia il prezzo di sangue da pagare."
 western_schism.26.b: "Volgiamo la loro furia contro il falso papa."

 western_schism.27.title: "Un Cardinale Vacilla"
 western_schism.27.desc: "Uno dei nostri cardinali è stato segretamente corteggiato dalla curia rivale, che gli offre una sede più ricca di qualunque altra in nostro dono. Non si è ancora dichiarato apertamente, ma le sue lettere si fanno sempre più evasive, e la sua lealtà, a quanto pare, ha ormai un prezzo. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] deve decidere se quel prezzo valga la pena di essere pagato."
 western_schism.27.a: "Ricompriamo la sua coscienza prima che venga venduta."
 western_schism.27.b: "Lasciamolo andare. Un uomo comprato non vale nulla."

 western_schism.28.title: "La Lettera di una Santa"
 western_schism.28.desc: "Una donna santa, venerata in tutta la regione per le sue visioni, ha inviato alla nostra corte una lettera infuocata, implorando [ROOT.GetCountry.GetGovernment.GetRuler.GetName] di schierarsi senza esitazione a fianco del legittimo pontefice romano e di prestare le voci dei nostri cardinali alla sua causa. Le copie passano di mano in mano tra i devoti, e il [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] attende di vedere se risponderemo al suo appello."
 western_schism.28.a: "La santa dice il vero. Che tutta la Cristianità ci ascolti."
 western_schism.28.b: "Non ci lasceremo governare dalle visioni di una donna."

 western_schism.29.title: "La Generosità della Curia"
 western_schism.29.desc: "Il papa da noi scelto, ansioso di mantenere i nostri cardinali nel proprio campo, ha colmato la nostra corte di doni: reliquie in reliquiari dorati, generose dispense e monete sufficienti a far girare la testa a chiunque. Le sue lettere grondano di gratitudine e di aspettative in egual misura. Accettare significa legarci ancor più alla sua obbedienza; rifiutare significa accusarlo apertamente di #R simonia#!."
 western_schism.29.a: "Accettiamo con gratitudine, e rafforziamo il legame."
 western_schism.29.b: "Questa è simonia. Non ne vogliamo sapere."

 western_schism.30.title: "Il Dibattito dei Dottori"
 western_schism.30.desc: "I maestri della facoltà di teologia della nostra università si sono divisi a metà su una questione tanto pericolosa quanto profonda: può un #Y concilio generale#! giudicare un papa e deporlo per il bene della Chiesa? I dottori più giovani la ritengono l'unico rimedio allo scisma; gli anziani la considerano la via della rovina. Entrambi si rivolgono a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] perché dirima la questione."
 western_schism.30.a: "Un concilio può giudicare anche un papa. Che sia detto apertamente."
 western_schism.30.b: "Questa è eresia. Condanniamola da ogni pulpito."

 western_schism.31.title: "Chi Dovranno Seguire i Nostri Cardinali?"
 western_schism.31.desc: "I nostri cardinali stanno sellando i loro muli per recarsi al concistoro, e prima di partire si rivolgono a [ROOT.GetCountry.GetGovernment.GetRuler.GetName] per avere una parola: a quale obbedienza dovranno prestare il peso dei nostri cappelli rossi? Ogni giorno in cui lo scisma si trascina, la pressione cresce, e persino il silenzio comincia a sembrare una scelta."
 western_schism.31.a: "Per Roma, e la città stessa dell'apostolo."
 western_schism.31.b: "Per l'altro pretendente, e la riforma della Chiesa."
 western_schism.31.c: "Che ciascuno segua la propria coscienza."

 western_schism.32.title: "Le Casse Vuote di Roma"
 western_schism.32.desc: "Il tesoro di San Pietro è vuoto. I nostri cardinali restano senza stipendio e brontolano nei corridoi, mentre ad Avignone la curia rivale ostenta le decime di metà della Cristianità in sete e banchetti. Se Roma non può pagare i propri servitori, teme [ROOT.GetCountry.GetGovernment.GetRuler.GetName], non li manterrà a lungo."
 western_schism.32.a: "Vendiamo le cariche. Roma non deve ridursi a mendicare."
 western_schism.32.b: "Appelliamoci ai principi fedeli per un sussidio."

 western_schism.33.title: "La Plebe Romana"
 western_schism.33.desc: "Il popolo di Roma ha riempito le strade, e il suo ruggito scuote persino le finestre del palazzo: il papato #Y deve restare italiano#!, gridano, e guai a qualunque cardinale pensi di portarlo di nuovo in Francia. La folla guarda la curia con aperta minaccia, e [ROOT.GetCountry.GetGovernment.GetRuler.GetName] deve scegliere tra la furia della folla e la dignità della Chiesa."
 western_schism.33.a: "Pieghiamoci alla volontà del popolo romano."
 western_schism.33.b: "Sgomberiamo le strade, e che l'ordine sia ristabilito."

 western_schism.34.title: "Scomunica Reciproca"
 western_schism.34.desc: "La notizia è giunta da entrambe le curie contemporaneamente: ciascun papa ha solennemente #R scomunicato#! l'altro, e con lui ogni principe, sacerdote e contadino che osi seguire il pastore sbagliato. Il nostro popolo si fa il segno della croce con terrore, sussurrando che in qualunque direzione si volgano sono dannati, e che i sacramenti stessi potrebbero ormai essere privi di valore in metà della Cristianità."
 western_schism.34.a: "Rassicuriamoli con una grande cerimonia di fede."
 western_schism.34.b: "La paura è una leva. Usiamola, e prendiamoci l'oro della Chiesa."

 western_schism.35.title: "Una Reliquia di Autenticità Contestata"
 western_schism.35.desc: "Un monastero nelle nostre terre ha svelato una reliquia che, a suo dire, benedirà chiunque sia il legittimo Vicario di Cristo tra i due papi, e i pellegrini già affollano i suoi cancelli. Chierici rivali gridano alla #R falsificazione#! e ne chiedono il rogo. [ROOT.GetCountry.GetGovernment.GetRuler.GetName] deve decidere se fare di questo prodigio il vessillo della nostra fede, o lasciare che studiosi dagli occhi freddi lo smontino pezzo per pezzo."
 western_schism.35.a: "Un dono del Cielo. Veneriamola davanti a tutti."
 western_schism.35.b: "Lasciamo che uomini dotti esaminino da vicino questo presunto 'miracolo'."

 western_schism.36.title: "Mercenari per la Curia"
 western_schism.36.desc: "Giunge una lettera disperata recante il sigillo del papa da noi scelto: egli implora armi, uomini e denaro per strappare lo Stato della Chiesa al pretendente con la forza delle armi, poiché parole e voti lo hanno deluso. Una compagnia di lance temprate è pronta a marciare, se solo [ROOT.GetCountry.GetGovernment.GetRuler.GetName] aprirà il tesoro per pagarla."
 western_schism.36.a: "Inviamo una compagnia. Il nostro papa avrà i suoi soldati."
 western_schism.36.b: "Abbiamo le nostre guerre da combattere. Che aspetti."

 western_schism.37.title: "Il Principe Neutrale"
 western_schism.37.desc: "I nostri consiglieri più scaltri si avvicinano e suggeriscono astuzia: non impegniamoci con nessuno dei due papi, dicono, ma facciamo balenare la nostra fedeltà davanti a entrambi, lasciando che ciascuno rilanci l'altro in oro e privilegi. È una strada che potrebbe riempire generosamente le nostre casse, sebbene i devoti avvertano che un principe di cui nessuno si fida non è amato da nessuno."
 western_schism.37.a: "Promettiamo tutto, non impegniamoci con nessuno, e traiamo profitto da entrambi."
 western_schism.37.b: "Non siamo tipi da restare in equilibrio. Dichiariamoci per il nostro papa."

 western_schism.38.title: "Voci di un Concilio Generale"
 western_schism.38.desc: "Una voce audace corre per tutta la Cristianità: i cardinali di #Y entrambe#! le obbedienze, stanchi dello scandalo, potrebbero convocare un grande concilio per giudicare i papi rivali e deporli entrambi in un sol colpo. Per alcuni è l'unica via verso la pace; per altri è pura eresia, poiché chi può porsi al di sopra del Vicario di Cristo? [ROOT.GetCountry.GetGovernment.GetRuler.GetName] è sollecitato a schierarsi ancor prima che il concilio venga convocato."
 western_schism.38.a: "Un concilio potrebbe essere la nostra unica via verso la pace. Sosteniamolo."
 western_schism.38.b: "Nessun concilio si pone al di sopra del vicario di Cristo. Denunciamolo."

 western_schism.39.title: "Un Terzo Pretendente"
 western_schism.39.desc: "L'impensabile si è compiuto. Un concilio di cardinali ha dichiarato deposti entrambi i papi e #Y ne ha eletto un terzo#! per sanare lo scisma, e ora la Cristianità ha tre padri e nessun capo. Nessuno dei due vecchi papi vuole cedere il trono, e ogni corte d'Europa deve chiedersi nuovamente dove risieda ora la vera Chiesa di Cristo."
 western_schism.39.a: "Il concilio ha parlato. Riconosciamo il suo papa."
 western_schism.39.b: "Manteniamo fede al papa che abbiamo sempre conosciuto."

 western_schism.2200.desc: "Con un ultimo sforzo, abbiamo trovato una soluzione semplice ma elegante ai problemi sollevati dallo [ShowSituationName('western_schism')]. Costringendo entrambe le parti a rinunciare alle loro pretese sulla Santa Sede e a indire nuove elezioni, possiamo istituire nuovamente un legittimo [GetInternationalOrganization('catholic_church').GetLeaderTitle] e concentrarci sulla guarigione delle ferite causate da questo periodo di conflitti. Il nuovo [GetInternationalOrganization('catholic_church').GetLeaderTitle] eccellerà sicuramente in questo compito, riunendo i sacerdoti divisi e riaffermando la vera dottrina della fede."
