l_english:
 hussite_wars: "Guerre Hussite"
 hussite_wars_desc: "Una serie di conflitti tra i seguaci dell'[ShowReligionName('hussite')] e quelli del [ShowReligionAdjective('catholic')], degenerata rapidamente in una vera e propria guerra per l'identità stessa del Paese."
 hussite_wars_empire_dissolved: "Il [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip] si Dissolve"
 hussite_wars_bohemia_subdued: "[GetCountry('BOH').GetNameWithNoTooltip] Sono Sottomessi"
 hussite_wars_bohemia_reconverted: "[GetCountry('BOH').GetNameWithNoTooltip] Ritornano [GetCountry('PAP').Custom('IT_Alla')][GetCountry('PAP').GetNameWithNoTooltip]"
 hussite_wars_bohemia_reconverted_desc: "[GetCountry('BOH').GetName] sono costretti a tornare nel grembo cattolico: la loro [stability|e] e il loro [government_power|e] subiscono un duro colpo, e il loro sovrano e la sua famiglia sono costretti a convertirsi."
 hussite_wars_emperor_converted: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle] Abbraccia l'Hussitismo"
 hussite_wars_emperor_converted_desc: "Con la conversione dello stesso Imperatore, le terre hussite ottengono un duraturo incremento a [stability|e], [government_power|e] e [religious_influence|e]."
 hussite_wars_hussite_bohemia_endures: "[GetCountry('BOH').GetNameWithNoTooltip] Hussiti Resistono"
 hussite_wars_hussite_bohemia_endures_desc: "La fede [GetCountry('BOH').Custom('IT_Di')][GetCountry('BOH').GetName] ha retto: loro e i loro compagni hussiti ottengono un duraturo incremento a [stability|e], [government_power|e] e [religious_influence|e]."
 recognized_hussites_tt: "Siamo emersi vittoriosi dalle #Y Guerre Hussite#!"
 has_not_had_this_situation_before_tt: "Questa [situation|e] non si è verificata prima"
 DEFENDERS_CATHOLICISM: "Coalizione [ShowReligionAdjective('catholic')]"
 DEFENDERS_HUSSITISM: "Coalizione [ShowReligionAdjective('hussite')]"
 HUSSITE_WARS_NO_SUPPORTERS: "Nessun [country|e] si è schierato da questa parte"
 bohemia_and_emperor_at_war_with_both_being_leaders_tt: "[GetCountry('BOH').Custom('IT_La')|U][GetCountry('BOH').GetName] sta combattendo una [war|e] in corso contro una coalizione [ShowReligionAdjectiveWithNoTooltip('catholic')]"
 HERETICS_KILLED: "Morti dei Tribunali"
 HERETICS_CONVERTED: "Conversioni del Tribunale"
 loc_key_desc_tribunal: "Durante la [situation|e] delle [ShowSituationName('hussite_wars')], i nemici dell'[ShowReligionName('hussite')] ottengono l'accesso all'esclusiva [action|e] dell'[unit|e]  [ShowUnitAbilityName('hussite_tribunal')] nelle [locations|e] controllate da un [enemy|e] di fede [ShowReligionAdjective('catholic')]. Questa azione [Concept('convert', 'Convertirà')|e] alcuni [pops|e] hussiti mentre passerà altri a fil di spada."

 hussite_wars.1.title: "La Congregazione di [jan_zelivsky_scope.GetNameWithNoTooltip]"
 hussite_wars.1.entry: "Congregazione di Jan Želivský"
 HUSSITE_WARS_SIDE_BOHEMIA: "[THIS.GetLocation.GetOwner.Custom('IT_ART_RANGO')|U][THIS.GetLocation.GetOwner.GetLongName|Y] sta supportando [GetCountry('BOH').Custom('IT_ART_RANGO')][GetCountry('BOH').GetLongName] nelle [ShowSituationName('hussite_wars')]!"
 HUSSITE_WARS_SIDE_EMPEROR: "[THIS.GetLocation.GetOwner.Custom('IT_La')|U][THIS.GetLocation.GetOwner.GetLongName|Y] si oppone [GetCountry('BOH').Custom('IT_Alla')][GetCountry('BOH').GetLongName] nella [ShowSituationName('hussite_wars')]!"
 emperor_hw_tt: "Questo è il [GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetGovernment.GetRulerTitle], deciso a distruggere [ShowReligionName('hussite')]!"
 boh_hw_tt: "Questo è [GetCountry('BOH').Custom('IT_ART_RANGO')][GetCountry('BOH').GetLongName], difensore dell'[ShowReligionName('hussite')]!"
 recent_tribunal_tt: "Un [ShowUnitAbilityName('hussite_tribunal')] si è tenuto qui negli ultimi #Y 5#! anni"

 convert_heretics_hw_action: "Imporre Conversioni"
 convert_heretics_hw_action_desc: "La pressione esterna su di noi da parte dei nemici eretici non può restare senza risposta! Dobbiamo difendere le nostre tradizioni e la fede [ShowReligionAdjective('hussite')] imponendo disciplina e pratiche rigorose in tutto [actor.Custom('IT_ART_NOSTRO_RANGO')] nostr[actor.Custom('IT_OA_RANGO')] [actor.GetFlavorRank]."
 
 demand_donation_key: "Tempi di guerra e scontri attendono il nostro popolo, mentre ci sforziamo di rivendicare il nostro posto e difendere i nostri confini. A tal fine, chiederemo una donazione ai membri più abbienti"
 demand_noble_donations_hw_action: "Richiedere Donazioni Nobiliari"
 demand_noble_donations_hw_action_desc: "$demand_donation_key$ della nobiltà."
 
 demand_clergy_donations_hw_action: "Richiedere Donazioni Clericali"
 demand_clergy_donations_hw_action_desc: "$demand_donation_key$ del clero."

 demand_burgher_donations_hw_action: "Richiedere Donazioni Mercantili"
 demand_burgher_donations_hw_action_desc: "$demand_donation_key$ della borghesia."

 prepare_defenses_hw_action: "Preparare le Difese"
 prepare_defenses_hw_action_desc: "Le orde Cattoliche presto devasteranno le nostre terre nella loro folle ricerca del dominio religioso. Sarebbe saggio per noi assicurarci che ogni provincia sia protetta da solide difese."

 align_with_moderates_help_hw_action: "Allinearsi con i Moderati"
 align_with_moderates_help_hw_action_desc: "La via della diplomazia e della tolleranza attirerà sicuramente una visione più simpatetica verso la nostra causa, anche da parte dei Paesi che si inchinano al [ShowReligionName('catholic')]."

 align_with_radicals_help_hw_action: "Allinearsi con i Radicali"
 align_with_radicals_help_hw_action_desc: "Siamo soli contro un mare di eretici, le loro fauci che mordono affamate i margini del nostro territorio. Il popolo deve prepararsi e adottare una politica di non tolleranza e fanatismo verso i nostri nemici."

 join_the_imperial_side_hw_action: "Schierati con [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('IT_La')][GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongNameWithNoTooltip]"
 join_the_imperial_side_hw_action_desc: "È nostro dovere unirci [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('IT_Alla')][GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] nella sua lotta per cancellare l'eresia dalla faccia di [ShowContinentName('europe')]!"

 join_the_hussite_side_hw_action: "Schierarsi con [GetCountry('BOH').Custom('IT_ART_RANGO')][GetCountry('BOH').GetLongNameWithNoTooltip]"
 join_the_hussite_side_hw_action_desc: "Non dovremmo restare a guardare mentre [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('IT_La')][GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetLongName] compie atroci brutalità contro i meno fortunati. Dobbiamo quindi difendere [GetCountry('BOH').Custom('IT_La')][GetCountry('BOH').GetLongName] e porre fine alle irragionevoli crociate [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('IT_ADJ_FP')]!"

 hw_province_gains_hw_heretic_conversions_modifier_tt: "La [province|e] designata otterrà [ShowModifier('hw_heretic_conversions_modifier')] per #Y 10#! anni"
 prepare_defenses_hw_action_tt: "Ogni [location|e] nella [province|e] designata otterrà [ShowModifier('hw_prepared_defenses_modifier')] per #Y 15#! anni e, se possibile, un [ShowBuildingTypeName('castle')] sarà costruito nella [province_capital|e] per il #G -90%#! del costo base"
 countries_less_likely_to_join_against_us_tt: "I nostri [countries|e] vicini saranno #G meno propensi#! a unirsi alla guerra contro di noi mentre il modificatore [ShowModifier('promoted_moderates_modifier')] è attivo"
 countries_more_likely_to_join_against_us_tt: "I nostri [countries|e] vicini saranno #R più propensi#! a unirsi alla guerra contro di noi mentre il modificatore [ShowModifier('promoted_radicals_modifier')] è attivo"
 catholic_victory_tt: "Vittoria [ShowReligionAdjectiveWithNoTooltip('catholic')]"
 hussite_victory_tt: "Vittoria [ShowReligionAdjectiveWithNoTooltip('hussite')]"
 reignite_the_fires_of_crusade_tt: "Le relazioni tra [GetCountry('BOH').GetLongNameWithNoTooltip] e i [countries|e] Cattolici peggioreranno e molti potrebbero unirsi alla nostra causa a tempo debito"
 income_depends_on_estate_power_tt: "I [gold|e] guadagnati dipenderanno in gran parte dal [estate_power|e] di questo [estate|e]"

 join_current_war_against_emperor_tt: "Ci uniremo alla [war|e] in corso dalla parte [GetCountry('BOH').Custom('IT_Della')][GetCountry('BOH').GetLongName]"
 join_current_war_against_bohemia_tt: "Ci uniremo alla [war|e] in corso contro [GetCountry('BOH').Custom('IT_La')][GetCountry('BOH').GetLongName]"






