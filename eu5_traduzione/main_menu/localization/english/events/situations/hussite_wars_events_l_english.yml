 hussite_wars.1.desc.generic: "Folle inferocite guidate da [jan_zelivsky_scope.GetName] hanno invaso le strade di [target_boh_capital_scope.GetName], chiedendo maggiori diritti e l'assoluzione di diversi prigionieri di fede [ShowReligionAdjective('hussite')] da parte del consiglio cittadino."
 hussite_wars.1.desc: "$hussite_wars.1.desc.generic$ Sfortunatamente, il giudice e il suo entourage hanno respinto le richieste dei manifestanti, portando a violenze esplosive in un circolo vizioso di riforme bloccate e rivolte della folla. Forse è tempo di spezzare il ciclo..."
 hussite_wars.1.desc.other_heresy: "$hussite_wars.1.desc.generic$ Il concilio, in maggioranza di fede [ROOT.GetCountry.GetReligion.GetAdjective], è più che solidale nei confronti dei propri fratelli hussiti, ma agenti cattolici cercano di minare e sabotare la loro causa. Non importa se decidiamo di rimanere fedeli alla nostra fede o di sostenere l'[ShowReligionNameWithNoTooltip('hussite')], una cosa è certa: il mondo cattolico ci percepirà come una minaccia eretica che deve essere distrutta..."
 hussite_wars.1.a: "Morte al [GetUniqueInternationalOrganization('catholic_church').GetLeaderTitle]!"
 hussite_wars.1.b: "Non possiamo permetterci di rompere con il [ShowReligionNameWithNoTooltip('catholic')]..."
 end_hussite_wars_situation_tt: "La [situation|e] [ShowSituationName('hussite_wars')] non si verificherà finché non ci convertiremo a [ShowReligionName('hussite')]"
 boh_every_neighboring_country_tt: "Ogni [country|e] non alleato confinante con noi o con uno qualsiasi dei nostri [subjects|e] perderà [ShowBiasValue('violated_congress_of_visegrad_modifier')|+=0] [opinion|e] nei nostri confronti"
 hussite_rebellion_tooltip: "Ogni [pop|e] che segue l'[ShowReligionName('hussite')] radunerà le proprie forze e sosterrà i [hussite_rebel_scope.GetName]"
 every_neighbor_of_bohemia_gets_hussite_wars.3_tt: "Si verificherà l'evento '#Y Una Pia Chiamata alle Armi#!' per ogni [country|e] di fede [ShowReligionAdjective('catholic')] non alleato confinante con [target_country.Custom('IT_La')][target_country.GetName]"
 hussite_wars.6_happens_for_catholic_champion_scope_tt: "Si verificherà l'evento '#Y La Spada del [ShowReligionName('catholic')]#!' per [catholic_champion_scope.GetName]"

 hussite_wars.3.title: "Una Pia Chiamata alle Armi"
 hussite_wars.3.desc: "Nel tentativo di estirpare l'eresia, il [GetUniqueInternationalOrganization('hre').GetLeaderTitle] ha preso le armi contro il popolo [target_country.Custom('IT_Di')][target_country.GetName], con la benedizione di [ShowReligionName('catholic')]. [war_leader_scope.GetGovernment.GetRulerOrRegent.GetSheHe|U] pretende che compiamo il nostro dovere [ShowReligionAdjective('catholic')] e prendiamo le armi contro questa vile eresia. Qualunque cosa decidiamo, dobbiamo stare attenti a non crearci nemici potenti in una sterile ricerca di pia gloria."
 hussite_wars.3.a: "Alle armi!"
 hussite_wars.3.b: "Non affrettiamoci ad agire."

 hussite_wars.4.title.hussite_victory_ally_or_subject: "Una Vittoria Condivisa nella [ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.4.title.hussite_victory: "Vittoria [ShowReligionAdjectiveWithNoTooltip('hussite')] nella [ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.4.title.catholic_victory: "Vittoria [ShowReligionAdjectiveWithNoTooltip('catholic')] nella [ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.4.a.desc: "La nostra lotta per ricevere pari trattamento e riconoscimento dalle autorità cattoliche è giunta a buon fine. La difesa del nostro popolo e della nostra fede ha avuto successo e ora rivendichiamo il nostro posto al tavolo Europeo come pari."
 hussite_wars.4.b.desc: "Il sapore della sconfitta siede amaramente sulle nostre labbra, poiché siamo stati costretti a riconoscere l'autorità suprema della Chiesa [ShowReligionAdjective('catholic')]. Avevamo un sogno che sapevamo essere giusto, ma di fronte alla corruzione e al male abbiamo vacillato, ahimè non doveva essere..."
 hussite_wars.4.c.desc: "La nostra crociata contro l'eresia è stata coronata da un successo divino. I fuochi di [ShowReligionName('hussite')] sono stati spenti [GetCountry('BOH').Custom('IT_In')][GetCountry('BOH').GetName], e la giusta autorità di [ShowReligionName('catholic')] è stata restaurata in tutte le terre dei fedeli. Che il mondo veda che la determinazione della Chiesa è incrollabile."
 hussite_wars.4.d.desc: "Nonostante la giustizia della nostra causa, i seguaci di [ShowReligionName('hussite')] hanno prevalso a [target_capital.GetNameWithNoTooltip]. [GetCountry('BOH').Custom('IT_La')|U][GetCountry('BOH').GetName] emerge da questo conflitto rafforzata, con la sua fede eretica riconosciuta da tutti. Dobbiamo accettare questa pace amara e cercare un'altra via per restaurare l'unità di [ShowReligionName('catholic')]."
 hussite_wars.4.e.desc: "L'ombra della sconfitta cala sulla nostra causa [ShowReligionAdjectiveWithNoTooltip('hussite')]. Pur avendo combattuto al fianco dei nostri fratelli [GetCountry('BOH').Custom('IT_In')][GetCountry('BOH').GetName], le forze di [ShowReligionName('catholic')] hanno prevalso e il vecchio ordine è stato restaurato. Eppure la nostra fede resiste, e le idee per cui abbiamo combattuto non possono essere messe a tacere così facilmente."
 hussite_wars.4.f.desc: "Sebbene siamo rimasti fedeli al [ShowReligionName('catholic')], abbiamo scelto di schierarci con [GetCountry('BOH').GetName] e con la loro causa [ShowReligionAdjective('hussite')]. I legami di alleanza e lo scopo comune si sono rivelati più forti dei richiami di prelati lontani, e siamo rimasti al loro fianco durante i lunghi anni di guerra.\n\nOra i combattimenti sono terminati e la nostra scommessa è stata ripagata. [GetCountry('BOH').GetNameWithNoTooltip] si ergono trionfanti, la loro fede riconosciuta in tutto il continente, e noi condividiamo i frutti di una vittoria duramente conquistata. Che coloro che hanno messo in dubbio la nostra determinazione riflettano su dove ci ha condotto la lealtà."
 hussite_wars.4.g.desc: "Le fiamme del movimento [ShowReligionName('hussite')] hanno infine ceduto il passo a un altro credo riformato. La lotta iniziata per il calice ha condotto [GetCountry('BOH').Custom('IT_La')][GetCountry('BOH').GetName] lungo un percorso che nessuno avrebbe potuto prevedere, e la [ShowSituationNameWithNoTooltip('hussite_wars')] giunge ora alla sua conclusione."
 hussite_wars.4.a: "La nostra vera fede è vittoriosa!"
 hussite_wars.4.b: "Tutto è lecito, in fede e in guerra..."
 hussite_wars.4.c: "La Chiesa ha prevalso!"
 hussite_wars.4.d: "L'eresia resiste..."
 hussite_wars.4.e: "La nostra fede resiste, anche nella sconfitta."
 hussite_wars.4.f: "Insieme verso la vittoria!"
 hussite_wars.4.g: "Così finisce questo capitolo."

 hussite_wars.5.title: "[target_character.GetLastNameWithNoTooltip] il Guercio"
 hussite_wars.5.entry: "Žižka il Guercio"
 hussite_wars.5.desc: "Uno dei nostri leader più importanti sul campo di battaglia, [target_character.GetName] ha una storia di servizio al nostro popolo durante questi tempi difficili. Si dice in giro per gli accampamenti che [target_character.GetSheHe] abbia perso un occhio a causa di una freccia di un soldato rivale. Secondo i resoconti dei testimoni oculari, invece di ritirarsi o arrendersi, ha semplicemente rimosso la freccia e ha continuato a combattere.\n\nNonostante le ferite, è diventat[target_character.Custom('IT_ART_O_A')] un comandante formidabile e ora desidera essere promoss[target_character.Custom('IT_ART_O_A')] e guidare più truppe verso grandi vittorie. Se desideriamo sferrare un colpo temibile contro i nostri nemici, dobbiamo considerare seriamente di acclamarl[target_character.Custom('IT_ART_O_A')] come eroe nazionale, un emblema della nostra resistenza contro il [ShowReligionName('catholic')]."
 hussite_wars.5.a: "Un grande eroe nel momento del bisogno."
 hussite_wars.5.historical_info: "Noto anche come Jan Žižka z Trocnova a Kalicha, fu un eminente leader militare nel XV secolo, acclamato come una delle figure più importanti del movimento Hussita. Guidò gli Hussiti a numerose vittorie utilizzando tattiche militari innovative, incluso l'uso di carri da guerra per la difesa mobile. La sua brillantezza strategica e la sua leadership carismatica furono fondamentali per i loro successi contro le molteplici crociate lanciate dalla Chiesa Cattolica."
 
 hussite_wars.6.title: "La Spada del [ShowReligionNameWithNoTooltip('catholic')]"
 hussite_wars.6.desc: "In tempi disperati, quando la nostra fede è minacciata da eretici esterni, spetta a noi sopportare il peso di una rinnovata crociata contro coloro che vogliono nuocere al nostro pio popolo.\n\nPerciò il [GetUniqueInternationalOrganization('hre').GetLeaderTitle], benedetto dall'autorità di [ShowReligionName('catholic')], ci ha chiamati a unirci a [target_ruler1.GetHerHim] in una crociata contro [GetCountry('BOH').Custom('IT_La')][GetCountry('BOH').GetLongName]."
 hussite_wars.6.a: "Sradicheremo questi eretici!"
 hussite_wars.6.b: "Non siamo servitori del [GetUniqueInternationalOrganization('hre').GetLeaderTitle]!"

 hussite_wars.7.title: "La Piaga dei Fedeli Hussiti"
 hussite_wars.7.desc: "Un messaggero malconcio è riuscito a raggiungere la nostra corte. Porta notizia della crociata del [GetUniqueInternationalOrganization('hre').GetLeaderTitle] contro [GetCountry('BOH').Custom('IT_La')][GetCountry('BOH').GetName], sostenuta dall'autorità di [ShowReligionName('catholic')]. Racconti di brutalità, terra bruciata e combattimenti incessanti hanno invaso le strade, mentre soldati e contadini si scontrano senza distinzione.\n\nIl messaggero tesse le lodi del legame che unisce le nostre due nazioni, quello di fratelli, e chiede che veniamo in aiuto del suo popolo insanguinato. [GetCountry('BOH').Custom('IT_La')|U][GetCountry('BOH').GetNameWithNoTooltip] chiede aiuto!"
 hussite_wars.7.a: "E [GetCountry('POL').Custom('IT_La')][GetCountry('POL').GetNameWithNoTooltip] risponderà. Radunate i cavalieri!"
 hussite_wars.7.b: "Questo è poco saggio..."
 teutons_hussite_wars_tt: "Si verificherà l'evento '#Y Una Pia Chiamata alle Armi#!' per [GetCountry('TEU').Custom('IT_ART_RANGO')][GetCountry('TEU').GetLongName]"

 hussite_wars.8.title: "Un Nemico Comune"
 hussite_wars.8.desc: "I nostri compatrioti sono nella disperazione. Con gli eserciti eretici che abbattono i nostri cancelli, molte delle vecchie amare rivalità tra figure di spicco sono state messe da parte mentre ci uniamo contro l'avidità e la miopia dei nostri nemici. La forza della nostra risolutezza e la nostra pietà assicureranno che supereremo questo ostacolo infido, sconfiggeremo coloro che desiderano danneggiare il nostro popolo e la nostra fede, emergendo vittoriosi e riconquistando il nostro antico splendore e il dovuto rispetto."
 hussite_wars.8.a: "Combattete, figli e figlie [ROOT.GetCountry.Custom('IT_Di')][GetCountry('BOH').GetNameWithNoTooltip]!"
 boh_clergy_donation_tt: "Questa donazione [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] mirerà a sollevare lo spirito del nostro popolo"
 hussite_wars.8.b: "Intensificheremo la diffusione dei nostri insegnamenti contro il [ShowReligionNameWithNoTooltip('catholic')]."
 hussite_wars.8.c: "Rivolgiamoci [ROOT.GetCountry.Custom('IT_NOBLES_AL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] durante questi tempi difficili..."

 hussite_wars.9.title: "Rinnovata Crociata Contro l'[ShowReligionNameWithNoTooltip('hussite')]"
 hussite_wars.9.desc: "Il flagello noto come [ShowReligionName('hussite')] è un affronto al nostro mondo venerabile e pio, una piaga pericolosa che minaccia l'unità della fede e l'ordine divino. I loro insegnamenti eretici seminano discordia e profanano le sacre dottrine sostenute dal [ShowReligionName('catholic')] per generazioni. Tale sfida non può essere tollerata. È nostro sacro dovere radunare gli eserciti del [ShowReligionNameWithNoTooltip('catholic')] senza indugio, marciando con incrollabile risolutezza per estinguere questa eresia prima che si infetti ulteriormente. Sradicando la loro influenza, preserveremo la purezza delle nostre credenze e ripristineremo l'armonia divina nelle terre sotto la nostra santa cura."
 hussite_wars.9.a: "In guerra!"
 hussite_wars.9.b: "Possiamo aspettare il nostro momento, per ora."
 explain_situation_peace_treaty_tt: "Durante questa [war|e], possiamo estirpare [ShowReligionName('hussite')] tramite #italic Force Convert#! e i [peace_treaties|e] [ShowPeaceTreatyTypeName('supress_hussite_faith')], ponendo fine alla [ShowSituationName('hussite_wars')]"

 hussite_wars.10.title: "Le [ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.10.desc: "L'ascesa di [ShowReligionName('hussite')] ha spinto [target_country.Custom('IT_La')][target_country.GetName] a diventare un paria del mondo [ShowReligionAdjective('catholic')], mentre vacilla sull'orlo del precipizio. L'esecuzione di [GetCharacter('boh_jan_hus').GetName] non ha sedato il dissenso, lo ha rafforzato. Predicatori eretici ora radunano il [GetCountry('BOH').GetGovernment.GetEstateName('peasants_estate')] e il [GetCountry('BOH').GetGovernment.GetEstateName('nobles_estate')], invocando una nuova Chiesa libera dall'autorità di [target_location1.GetName].\n\nIl [GetCountry('BOH').GetFlavorRank] precipita nel disordine mentre [target_location2.GetName] arde di fervore riformista. Per i membri del [GetUniqueInternationalOrganization('hre').GetName], questa non è una semplice ribellione. È un'eresia con eserciti, una rivolta con uno scopo. Se [target_country.Custom('IT_La')][target_country.GetNameWithNoTooltip] prevarrà, l'infezione potrà diffondersi oltre i suoi confini, minacciando la stessa unità di [ShowReligionGroupName('christian')]."
 hussite_wars.10.a: "Alle armi, uomini di fede!"
 hussite_wars.10.historical_info: "Le Guerre Hussite (1419-1434) furono una serie di conflitti religiosi e civili in Boemia innescati dall'esecuzione di Jan Hus, un riformatore Ceco che criticò la Chiesa Cattolica. I suoi seguaci, noti come Hussiti, chiesero riforme tra cui la comunione per tutti e una Chiesa nazionale indipendente da Roma. Le guerre opposero fazioni Hussite radicali a lealisti Cattolici e eserciti crociati inviati dall'Imperatore del Sacro Romano Impero e dal Papa. Nonostante fossero in inferiorità numerica, gli Hussiti usarono tattiche innovative e unità interna per sconfiggere ripetutamente i loro nemici, costringendo la Chiesa a negoziare e concedere alla fine limitate concessioni."
 hussite_wars.10.b: "Purificheremo la loro eresia!"
 hussite_wars.10.c: "La loro resa dei conti può attendere..."

 #Rebels
 hussite_rebellion: "Ribellione Hussita"

 hussite_wars.11.title: "La [ShowSituationNameWithNoTooltip('hussite_wars')]"
 hussite_wars.11.desc: "Dai pulpiti di [target_boh_capital_scope.GetName] fino alla cappella del villaggio più remoto, la voce si è diffusa: il [GetUniqueInternationalOrganization('hre').GetLeaderTitle] ci ha dichiarati pericolosi eretici, da abbattere o convertire con la forza. La fiamma di [ShowReligionName('hussite')] che abbiamo acceso è ora al tempo stesso faro e bersaglio. Mentre gli eserciti crociati si radunano oltre i nostri confini, il nostro popolo guarda a noi per trovare forza. Abbiamo anteposto la nostra fede all'autorità di [ShowReligionName('catholic')] e ora dobbiamo essere pronti a difenderla."
 hussite_wars.11.a: "Combattiamo per la nostra fede e il nostro popolo!"
 hussite_wars_11_tt: "La [situation|e] [ShowSituationName('hussite_wars')] è iniziata"
 not_on_opposing_hussite_wars_sides_tt: "Non siamo schierati su fronti opposti nella [ShowSituationName('hussite_wars')]"
 jan_hus_has_died_tt: "#Y Jan Hus#! è morto"
