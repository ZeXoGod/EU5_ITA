l_english:

 italian_wars.1.title: "Le Guerre $italian_group$" 
 italian_wars.1.desc.a: "Mani oscure dietro porte chiuse e gli infiniti intrighi delle altre maggiori nazioni intorno all'[ShowRegionName('italy_region')] hanno portato a una crisi diplomatica senza precedenti. Di conseguenza, la nostra presa sulla penisola, e la nostra influenza su di essa, vengono messe in discussione. In questo momento di pericolo, non dobbiamo vacillare. La vittoria in [ShowRegionNameWithNoTooltip('italy_region')] assicurerà sicuramente il nostro posto tra le grandi potenze!"
 italian_wars.1.desc.b: "La guerra è arrivata in [ShowRegionName('italy_region')]. Gli stendardi dei conquistatori stranieri si affollano per usurpare la grande ricchezza custodita nella nostra penisola. Mai prima d'ora la nostra regione è caduta in un tale conflitto di potere, mentre le grandi potenze circondano la nostra casa come avvoltoi affamati. È tempo che il nostro popolo imbracci la spada e lo scudo per proteggere la nostra libertà, a meno che non si cada vittima delle tendenze espansionistiche degli stranieri..."
 italian_wars.1.a: "Il dado è tratto."
 italian_wars.1.b: "Allineiamoci con [GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.Custom('IT_La')][GetUniqueInternationalOrganization('foreign_league_hre').GetLeaderCountry.GetNameWithNoTooltip]!" 
 italian_wars_explanation_tooltip1: "In questo periodo, gli stati in [ShowRegionNameWithNoTooltip('italy_region')] potranno difendersi unendosi a una #italic Lega $italian_group$#!.\n" 
 italian_wars_explanation_tooltip2: "I paesi stranieri possono creare le loro #italic Leghe Straniere#! nel tentativo di espandere la loro influenza nella regione.\n"
 italian_wars_explanation_tooltip3: "I [rivals|e] e i [enemies|e] dei leader della #italic Lega Straniera#! possono intervenire per assistere le #italic Leghe $italian_group$#! con la guerra o con aiuti sotto forma di moneta e uomini\n" 
 italian_wars_explanation_tooltip4: "I leader di ciascuna Lega ottengono l'accesso al [peace_treaty|e] [ShowPeaceTreatyTypeName('dissolve_league_peace_deal')]"
 iw_italian_league_merc_efficiency_tt: "Come membro di una #italic Lega $italian_group$#!, la nostra [ShowModifierTypeName('mercenary_maintenance_efficiency')] cresce in base alla porzione di [ShowRegionNameWithNoTooltip('italy_region')] controllata dalla nostra Lega. Alla massima estensione (#Y 301#! località), concede fino a #G +33%#! [ShowModifierTypeNameWithNoTooltip('mercenary_maintenance_efficiency')]." 
 italian_wars.1.historical_info: "Le Guerre $italian_group$ (1494-1559) furono una serie di violenti conflitti per determinare il dominio sull'Italia, combattuti principalmente da Francia e Spagna con una parte sostanziale dell'Europa coinvolta in questo scontro di potenze. Iniziarono quando Charles VIII di Francia invase l'Italia nel 1494, prendendo Napoli, ma Maximilian I d'Asburgo, Isabella di Castiglia e Ferdinand d'Aragona, i Re Cattolici di Spagna, accorsero in aiuto del Papa per scacciarlo. Il re di Francia prese poi di nuovo Milano, Genova e Napoli nel 1499, ma la Spagna li espulse da Napoli nel 1503, affermando il proprio controllo sull'Italia meridionale, e Papa Julius II formò un'alleanza per cacciare i francesi dall'Italia settentrionale. Alcuni anni dopo, Francis I di Francia rilanciò la pretesa francese su Milano, che fu presa nel 1515, ma nel 1525 perse una battaglia decisiva a Pavia contro l'Imperatore Charles V, anche Re Charles I di Spagna, e fu catturato. Francis I fu rilasciato dopo aver rinunciato formalmente a tutte le pretese francesi in Italia, ma poi si alleò con l'Inghilterra, il Papa, Venezia e Firenze, il che portò al sacco di Roma da parte dei lanzichenecchi tedeschi di Charles V nel 1527, a una pace con il Papa e all'incoronazione imperiale di Charles V a Bologna nel 1529. Le guerre terminarono infine nel 1559 con la Pace di Cateau-Cambrésis, lasciando gli Asburgo di Spagna come potenza dominante in Italia per 150 anni." 
 italian_wars.20.title: "Il Prezzo del Condottiere" 
 italian_wars.20.desc.a: "[target_character.GetName], il capitano di [target_merc.GetName], ha fermato l'avanzata e ha inviato un messaggio chiedendo una rinegoziazione dei termini del [target_character.GetHerHis] contratto. La campagna si è protratta ben oltre quanto concordato e [target_character.GetShortNameWithNoTooltip] non marcerà un altro giorno senza un ulteriore compenso.\n\nPossiamo accogliere la richiesta e mantenere [target_merc.GetNameWithNoTooltip] al nostro servizio, oppure rifiutare e rischiare che [target_character.GetShortNameWithNoTooltip] porti altrove la compagnia prima che la campagna sia decisa." 
 italian_wars.20.desc.b: "[target_merc.GetName] è diventata irrequieta e i suoi rappresentanti sono giunti al campo chiedendo una rinegoziazione dei termini contrattuali originali. Senza un singolo capitano con cui trattare, la richiesta viene dalla compagnia nel suo insieme e il suo potere contrattuale è considerevole finché la campagna resta indecisa.\n\nDobbiamo decidere come rispondere prima che [target_merc.GetNameWithNoTooltip] perda del tutto la pazienza." 
 italian_wars.20.desc.c: "[target_merc.GetName] ha inviato un messaggio chiedendo una rinegoziazione del proprio contratto. La campagna è durata molto più di quanto avessero previsto e, senza un ulteriore compenso, il loro impegno verso la nostra causa diventa incerto.\n\nDobbiamo soppesare il costo di soddisfare le loro richieste contro il rischio di perdere il loro servizio." 
 italian_wars.20.a: "Accoglieremo le loro richieste." 
 italian_wars.20.b: "Rifiutiamo. Il contratto resta valido." 
 italian_wars.20.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] gestirà personalmente queste trattative." 
 mercs_among_the_ranks_of_target_merc_are_reigned_in_tt: "La compagnia accetta i nuovi termini e riprende servizio senza ulteriori incidenti" 
 mercs_extract_coin_and_supplies_from_the_land_tt: "I mercenari prelevano denaro e rifornimenti dalle terre circostanti a nostre spese" 
 target_province_loses_prosperity_extreme_penalty_tt: "Ogni [location|e] in [target_province.GetName] perde [ShowNamedValue('prosperity_extreme_penalty')|+=2%] [prosperity|e]" 
 italian_wars.21.title: "Veterani Temprati dalla Battaglia" 
 italian_wars.21.desc: "I veterani di [target_army.GetName], temprati dalle campagne incessanti del conflitto $italian_group$, sono tornati all'accampamento vicino a [target_location.GetName] portando i segni di duri scontri. I loro ufficiali parlano di uomini trasformati dal fuoco, i cui istinti e la cui disciplina sono stati affinati ben oltre quanto il solo addestramento potrebbe fornire.\n\nIl modo in cui sceglieremo di onorare la loro esperienza plasmerà il carattere delle nostre forze per gli anni a venire." 
 italian_wars.21.a: "Teniamoli insieme. Il loro legame è la loro forza." 
 italian_wars.21.b: "Il loro valore ha plasmato l'anima della nostra nazione." 
 italian_wars.21.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] sovrintenderà alle esercitazioni di questi veterani." 
 italian_wars.22.title: "Il Problema dei Disertori" 
 italian_wars.22.desc: "La lotta prolungata in [ShowRegionName('italy_region')] ha gravato pesantemente su coloro che ne portano il peso. Al nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] sono giunti rapporti di soldati che abbandonano i propri posti in numero crescente, spinti dalla stanchezza e dal dubbio nella causa per cui è stato chiesto loro di combattere. Voci tra i ceti hanno iniziato a riecheggiare apertamente il loro malcontento e l'umore nel nostro reame si è spostato verso qualcosa di pericolosamente vicino all'insubordinazione.\n\nDobbiamo decidere come rispondere a questi disordini prima che mettano radici più profonde. Possiamo denunciare i disertori e fare un esempio di chi vacilla, ricordando a tutti coloro che servono che il dovere non permette ritirate. Oppure possiamo tenere la posizione con pura forza di volontà, accettando il costo di un impegno continuo e pretendendo lo stesso da chi ci circonda." 
 italian_wars.22.a: "Codardi e traditori, fino all'ultimo." 
 italian_wars.22.b: "Non un passo indietro. Resistiamo." 
 italian_wars.23.title: "Il Generale Voltagabbana" 
 italian_wars.23.desc: "[target_character2.GetName], comandante di [target_army.GetName], ha preso contatti preoccupanti con potenze straniere. Ci è giunta voce che [target_character2.GetShortNameWithNoTooltip] possa prendere in considerazione le promesse dei nostri nemici, e la condotta di [target_character2.GetHerHis] durante la campagna ha fatto poco per dissipare i nostri sospetti.\n\n[target_character1.GetName] deve agire prima che questo tradimento diventi una defezione aperta." 
 italian_wars.23.a: "Che se ne vada, traditore!" 
 italian_wars.23.b: "[target_character2.GetHerHis|U] lealtà ha un prezzo. Lo pagheremo." 
 italian_wars.23.c: "[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortNameWithNoTooltip] metterà [target_character2.GetShortNameWithNoTooltip] al [target_character2.GetHerHis] posto." 
 target_character2_wont_attempt_to_flee_for_10_years_tt: "[target_character2.GetShortNameWithNoTooltip] non tenterà di fuggire per #Y 10#! anni" 
 italian_wars.24.title: "Discordia fra Alleati" 
 italian_wars.24.desc: "All'interno di [target_io.GetNameWithNoTooltip], le tensioni tra il nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] e [target_country.Custom('IT_La')][target_country.GetName] sono giunte al culmine. Quello che era iniziato come un piccolo disaccordo è degenerato in aperta discordia, e [target_country.Custom('IT_La')][target_country.GetName] ora mette apertamente in dubbio il nostro impegno verso la causa comune della Lega.\n\nUn'alleanza fratturata non serve a nessuno se non alle potenze straniere che osservano ogni nostra mossa. Possiamo cercare di riparare questa frattura con una diplomazia accorta, oppure restare fermi e lasciare che le conseguenze cadano dove devono. In ogni caso, dobbiamo agire prima che questa discordia si diffonda ulteriormente tra i ranghi di [target_io.GetNameWithNoTooltip]." 
 italian_wars.24.a: "Offriremo un ramoscello d'ulivo." 
 italian_wars.24.b: "Le loro lamentele non ci riguardano." 
 ruler_or_regent_skillful_diplomacy_saves_the_day: "L'abilità diplomatica di [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetShortName] allevia la situazione" 
 italian_wars.25.title: "Una Fratellanza d'Armi" 
 italian_wars.25.desc: "Nel mezzo del conflitto che attanaglia [target_io.GetName], il nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] e [target_country.Custom('IT_La')][target_country.GetName] hanno trovato un terreno comune inatteso. Le difficoltà condivise e un nemico comune hanno fatto ciò che anni di sola diplomazia non erano riusciti a fare, legando i nostri due popoli in un modo che va oltre la semplice alleanza.\n\nQuesta intesa crescente è cosa rara in tempo di guerra e non dovrebbe essere sprecata. Possiamo scegliere di formalizzarla e rafforzare i legami tra le nostre corti, oppure mantenere il riserbo e occuparci di questioni più urgenti. La scelta plasmerà il modo in cui [target_country.Custom('IT_La')][target_country.GetNameWithNoTooltip] ci considererà negli anni a venire." 
 italian_wars.25.a: "Rafforzeremo questi legami." 
 italian_wars.25.b: "Abbiamo questioni più urgenti." 
 good_relations_will_help_keep_em_in_league_tt: "Buone relazioni tra i nostri [countries|e] possono aiutare a mantenerli nella nostra Lega" 
 italian_wars.26.title: "Un Insulto Senza Risposta" 
 italian_wars.26.desc: "[target_character.GetName] [target_country.Custom('IT_Di')][target_country.GetName] ha causato un affronto considerevole davanti ai rappresentanti riuniti di entrambe le Leghe. Le sue parole hanno messo in dubbio la nostra guida di [our_io.GetName] e la nostra posizione tra le potenze di [ShowRegionNameWithNoTooltip('italy_region')], e un'accusa simile non può essere facilmente accantonata.\n\nLasciare l'affronto senza risposta non farebbe che incoraggiare [target_character.GetShortNameWithNoTooltip] e invitare ulteriore impertinenza da altri fronti. Possiamo insistere sulla questione e pretendere una resa dei conti, anche se farlo rischia un'escalation a cui nessuna Lega potrebbe essere preparata. L'alternativa è subire l'insulto per ora e attendere il nostro momento." 
 italian_wars.26.a: "Non tollereremo questo insulto." 
 italian_wars.26.b: "La resa dei conti arriverà, ma non oggi." 
 italian_wars.27.title: "Lezioni di Guerra" 
 italian_wars.27.desc: "Le campagne incessanti attraverso [ShowRegionName('italy_region')] hanno prodotto più che sangue e rovina. I nostri ufficiali e studiosi sono tornati con conoscenze duramente conquistate, forgiate nel crogiolo della battaglia aperta e tratte dai metodi dei nostri avversari. Nuove idee hanno messo radici nel nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle], e ora la questione è come sfruttarle al meglio.\n\nPossiamo impegnarci in uno studio continuativo di ciò che le guerre ci hanno insegnato, investendo nel perfezionamento della nostra arte e della nostra dottrina. In alternativa, possiamo mettere subito a frutto queste conoscenze sul campo, indirizzandole dove possono produrre risultati tangibili per i nostri eserciti e le nostre terre." 
 italian_wars.27.a: "Approfondiamo ciò che abbiamo imparato." 
 italian_wars.27.b: "Ai nostri eserciti servono risultati, non teoria." 
 italian_wars.28.title: "L'Ingegnere di [target_location.GetNameWithNoTooltip]" 
 italian_wars.28.desc: "Un ingegnere di notevole reputazione ha percorso la [new_character.GetHerHis] strada fino al nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle], portando lettere di presentazione e progetti dettagliati per nuove opere d'assedio. [new_character.GetName], proveniente da [target_location.GetName], è una delle diverse menti brillanti attratte dal teatro $italian_group$, dove le guerre hanno spinto l'ingegneria militare a nuovi limiti. La [new_character.GetHerHis|U] competenza, se applicata, potrebbe dare alle nostre forze un vantaggio decisivo nello sfondare le mura nemiche.\n\nI [new_character.GetHerHis|U] servizi non costano poco, e [new_character.GetSheHe] non ne fa mistero. Eppure, poche opportunità di questo tipo si presentano in una vita di campagne." 
 italian_wars.28.a: "Paghiamo il [new_character.GetHerHis] compenso. Un buon ingegnere vale ogni moneta." 
 italian_wars.28.b: "Non possiamo permettercelo ora. Mandiamo via [new_character.GetHerHim]." 
 iw28_no_engineer_for_years_tt: "Con l'ingegnere congedato, la voce si diffonderà in questi ambienti e dunque potrebbe passare del tempo prima che qualcun altro del [new_character.GetHerHis] calibro ci cerchi" 
 engineer_boosts_short_term_research_tt: "I metodi dell'ingegnere aprono nuove vie d'indagine per i nostri studiosi, producendo progressi immediati nella nostra ricerca" 
 engineer_boosts_literacy_efforts_tt: "Il contatto con gli scritti tecnici e i diagrammi dell'ingegnere incoraggia un più ampio desiderio di apprendere tra le nostre classi istruite" 
