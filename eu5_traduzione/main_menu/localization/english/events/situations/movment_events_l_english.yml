l_english:
 movements.10.title: "Latinitas"
 movements.10.desc: "Per celebrare il ritorno al grande Impero Romano, i leali cittadini di lingua [ShowLanguageFamilyName('romance_language_family')] di [target_location.GetName] si sono rinvigoriti con gli ideali della lingua [ShowLanguageName('latin_language')] e dell'antica cultura [ShowCultureName('roman_culture')].\n\nQuesti nuovi Romani cercano di restaurare la gloria dell'Impero Romano. Sono orgogliosi della loro eredità e desiderosi di diffondere la loro cultura e la loro influenza in tutto il mondo."
 movements.10.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 movements.10.b: "Anche noi siamo [ShowCultureNameWithNoTooltip('roman_culture')]!"
 movements.10.tt: "[ShowMovementDefinitionName('roman_culture_movement')] compare a [target_location.GetName]"

 movements.20.title: "L'Emanazione dell'Uno"
 movements.20.desc: "Una cerchia di studiosi e filosofi del [ShowMovementDefinitionName('hellenism_religion_movement')] ha iniziato a insegnare che la verità più alta risiede non nelle scritture ma nella ragione: ogni esistenza fluisce dall'Uno, attraverso emanazioni dell'intelletto divino, fino al nostro mondo materiale.\n\nAttingendo a Platone, Plotino e Proclo, questi pensatori si premurano di notare i paralleli con il [ShowReligionGroupName('christian')]. L'Uno, dicono, non è poi così diverso da Dio: eterno, al di là di ogni predicazione, fonte di ogni essere.\n\nEppure [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si fa sospettoso, denunciandolo come vile paganesimo [ShowReligionAdjective('hellenism_religion')].\n\nPermetteremo a questa rinascita filosofica di fiorire, o ci muoveremo per estinguerla?"
 movements.20.a: "La ricerca dell'Uno conduce alla verità."
 movements.20.b: "Questa filosofia conduce le anime fuori strada."
 movements.20.tt: "[ShowMovementDefinitionName('hellenism_religion_movement')] si diffonde a [ROOT.GetCountry.GetCapital.GetName]"
