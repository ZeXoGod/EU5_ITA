l_english:

 flavor_iberian_union.1.title: "Le Nozze Iberiche"
 flavor_iberian_union.1.desc: "Il matrimonio che unisce le corone di [iu_member_a.GetName] e [iu_member_b.GetName] è un'occasione per forgiare un legame duraturo tra i nostri reami. Sebbene l'unione sia nata da necessità politica, la coppia [ROOT.GetCountry.GetGovernment.GetAdjective] sembra assai felice nel proprio matrimonio, e insieme lavorano per stabilizzare l'unione e costruire un duraturo assetto politico che possa essere considerato una grande potenza in [ShowContinentName('europe')]."
 flavor_iberian_union.1.historical_info: "La più celebre delle unioni dinastiche iberiche fu forgiata nel 1469 dal matrimonio di Isabella I di Castiglia e Ferdinando II d'Aragona, i Re Cattolici. La loro unione congiunse le due più grandi corone della penisola preservando le istituzioni distinte di ciascuna, e il loro nipote Carlo avrebbe ereditato entrambe come un unico reame. Un secolo dopo, nel 1580, Filippo II di Spagna fece valere la propria pretesa al vacante trono portoghese, unendo Castiglia, Aragona e Portogallo sotto gli Asburgo di Spagna fino alla Restaurazione portoghese del 1640."
 flavor_iberian_union.1.a: "Assicuriamo un'eredità duratura all'unione."

 flavor_iberian_union.2.title: "L'Unione Iberica"
 flavor_iberian_union.2.desc: "Le corone di [ShowRegionName('iberia_region')] sono passate a un solo sovrano. Ciò che era iniziato come un matrimonio tra due casate è divenuto un'unione personale, con i troni dei nostri reami ora posati su un'unica fronte. Ogni regno conserva le proprie leggi, le proprie corti e il proprio orgoglio, ma in materia di legittimità e di dinastia parlano con una sola voce. L'Unione Iberica è nata, e con essa la promessa di una potenza in grado di rivaleggiare con qualunque altra della Cristianità."
 flavor_iberian_union.2.historical_info: "Quando l'erede di due corone ereditò entrambe, il risultato non fu un unico regno ma una monarchia composita: reami distinti che condividevano un sovrano. Questa era la realtà costituzionale della Monarchia Spagnola, in cui Castiglia, Aragona e, in seguito, il Portogallo conservavano ciascuno le proprie #italic Cortes#!, leggi e amministrazione sotto un re comune. Simili unioni duravano solo finché durava la dinastia comune, e la mancanza di un erede poteva dividere ciò che il matrimonio aveva unito."
 flavor_iberian_union.2.a: "Che i nostri reami prosperino come uno solo."

 flavor_iberian_union.3.title: "Le Nozze Iberiche"
 flavor_iberian_union.3.desc: "La questione della successione incombe pesantemente su [ROOT.GetCountry.GetName] finché [initiator_candidate.GetName] rimane celibe. La nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] sta spingendo [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] a cercare un matrimonio per assicurare la successione, ed è stato proposto di unire le nostre fortune a quelle di una delle altre corone [ShowReligionGroupAdjective('christian')] di [ShowRegionName('iberia_region')]. Senza un successore forte, la nostra [ROOT.GetCountry.GetFlavorRank] potrebbe affrontare turbolenze, pretendenti rivali o persino ingerenze straniere."
 flavor_iberian_union.3.historical_info: "L'evento chiamato Nozze Iberiche riflette la successione di Enrico IV di Castiglia. Dopo la sua morte, due pretendenti si contesero il trono: Isabella di Castiglia, sostenuta dal marito Ferdinando d'Aragona, e sua nipote Giovanna, appoggiata dal Portogallo. Il conflitto si concluse con la vittoria di Isabella e Ferdinando, assicurando il governo di Isabella e segnando l'inizio del celebre regno dei Re Cattolici. Questa unione di Castiglia e Aragona avrebbe poi portato alla creazione di una Spagna unificata."
 flavor_iberian_union.3.a: "Inviamo la proposta di matrimonio a [iu_partner_a.GetNameWithNoTooltip]."
 flavor_iberian_union.3.b: "Rivolgiamoci invece a [iu_partner_b.GetNameWithNoTooltip]."
 flavor_iberian_union.3.c: "Troveremo un'altra via."

 flavor_iberian_union.4.title: "Le Nozze Iberiche"
 flavor_iberian_union.4.desc: "Un emissario di [iu_initiator.GetName] è giunto alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Propongono un matrimonio dinastico tra [initiator_candidate.GetName] e [iu_chosen_candidate.GetName] della nostra stessa casata, per unire i nostri reami. La loro offerta reca la promessa di prosperità e stabilità reciproche, eppure alcuni dei nostri consiglieri la guardano con scetticismo. Sebbene una simile unione possa assicurare un'alleanza contro nemici comuni e condurre potenzialmente all'unificazione delle corone, altri avvertono che potrebbe minacciare la nostra indipendenza nel lungo periodo."
 flavor_iberian_union.4.a: "Non abbiamo nulla da perdere."
 flavor_iberian_union.4.b: "Sarebbe più saggio rifiutare l'offerta."

 flavor_iberian_union.5.title: "Matrimonio Reale Accettato"
 flavor_iberian_union.5.desc: "Le campane risuonano in tutta la nostra [ROOT.GetCountry.GetFlavorRank] e in quella di [iu_chosen.GetName], mentre [initiator_candidate.GetName] e [iu_chosen_candidate.GetName] si uniscono in un'unica casata [ROOT.GetCountry.GetGovernment.GetAdjective]. La gente si assiepa per le strade, ed entrambe le corti brindano a un legame che ambasciatori e vescovi si sono adoperati per combinare. Ciò che un tempo era una questione di fredda arte di governo è ora suggellato da voti e festeggiamenti.\n\nL'unione assicura ben più di una stagione di festeggiamenti. Le nostre dinastie sono congiunte, le nostre casate legate dal sangue, e se questo matrimonio fosse benedetto da un figlio che erediti entrambe le corone, potrebbe venire il giorno in cui i nostri due reami saranno governati come uno solo. Per ora la nostra successione ne esce più salda, e il nostro prestigio tra le corti della Cristianità cresce con lo splendore dell'occasione."
 flavor_iberian_union.5.a: "Un'occasione gioiosa!"

 flavor_iberian_union.6.title: "Matrimonio Reale Rifiutato"
 flavor_iberian_union.6.desc: "La nostra proposta di matrimonio è stata respinta da [iu_chosen.GetName]. Sebbene questa decisione macchierà certamente i nostri rapporti negli anni a venire, soprattutto lascia ancora irrisolta la questione della nostra successione."
 flavor_iberian_union.6.a: "Troveremo un'altra soluzione."

 flavor_iberian_union.7.title: "Scavalcati"
 flavor_iberian_union.7.desc: "[iu_initiator.GetName] hanno scelto di legare la propria casata a [iu_chosen.GetName] anziché alla nostra, benché fossimo un'opzione altrettanto valida. L'affronto brucia, ma non è privo di opportunità: un'offesa simile è giustificazione sufficiente per prendere con la forza ciò che avrebbe dovuto essere nostro per matrimonio."
 flavor_iberian_union.7.a: "Il loro affronto non resterà senza risposta."

 iu_marriage_may_form_union_tt: "Ciò potrebbe condurre alla formazione di un'[union|e]"
 iu_spurned_will_be_displeased_tt: "[iu_spurned.GetName] potrebbe non prendere bene di essere stato scavalcato per questo matrimonio"
