l_english:

 ap_falls_desc_key: "Dopo un assedio turbolento e una valorosa difesa della guarnigione residente, [target_location.GetName] è caduta sotto la potenza dei nostri grandi eserciti."
 ap_diplomatic_desc_key: "Con l'integrazione di [target_location.GetName] [scope:winner.Custom('IT_NEL_RANGO')][scope:winner.GetFlavorRank] [scope:winner.Custom('IT_Di')][scope:winner.GetName],"
 ap_falls_desc_key_2: "Entro le sue mura risiede una potente autorità religiosa, poiché il [target_location.GetRank.GetNameWithNoTooltip] un tempo ospitava dignitari della fede [ShowReligionAdjective('orthodox')]. Resta però una domanda: dobbiamo abolire questa istituzione affine o adottarla sotto la nostra protezione?"
 autocephalous_patriarchates.1.title: "La Sede del Patriarcato Autocefalo è Caduta!"
 autocephalous_patriarchates.1.desc: "$ap_falls_desc_key$ Era la sede del [target_ap.GetName], e ora spetta a noi decidere cosa fare di questa autorità Patriarcale."
 autocephalous_patriarchates.1.desc_diplomatic: "$ap_diplomatic_desc_key$ la sede del [target_ap.GetName] ora rientra nella nostra competenza. Spetta a noi decidere cosa fare di questa istituzione Patriarcale."
 autocephalous_patriarchates.1.a: "Non c'è bisogno del loro Patriarcato quando abbiamo il nostro."
 autocephalous_patriarchates.1.b: "Non interferiremo con l'autorità del Patriarca."
 autocephalous_patriarchates.1.c: "Ora saremo noi a occuparci del Patriarca."
 every_member_of_scopeloser_ap_loses_opinion_of_scopewinner_tt: "Ogni membro del [target_ap.GetName] perderà [ShowBiasValue('destroyed_my_autocephalous_patriarchate')|+=0] opinione nei nostri confronti"
 every_member_of_winner_ap_gains_opinion_of_scopewinner_tt: "Ogni membro del [target_winner_ap.GetName] otterrà [ShowBiasValue('destroyed_another_autocephalous_patriarchate')|+=0] opinione nei nostri confronti"

 autocephalous_patriarchates.2.title: "La Sede del Patriarcato Autocefalo è Caduta!"
 autocephalous_patriarchates.2.desc: "$ap_falls_desc_key$ $ap_falls_desc_key_2$"
 autocephalous_patriarchates.2.desc_diplomatic: "$ap_diplomatic_desc_key$ spetta a noi decidere in merito alle questioni relative alla sua fede. $ap_falls_desc_key_2$"
 autocephalous_patriarchates.2.a: "Dissolvi il Patriarcato."
 autocephalous_patriarchates.2.b: "Mantienilo."
 
 autocephalous_patriarchates.3.title: "Restauro del Patriarcato di [target_location.GetNameWithNoTooltip]"
 autocephalous_patriarchates.3.desc: "Con il trasferimento del [recipient.GetName] a [target_location.GetName], la gloria del [target.GetType.GetName] è stata restaurata. D'ora in poi, il Patriarcato guiderà le questioni di fede con la maestà e il rispetto che si addicono a una carica così elevata."
 autocephalous_patriarchates.3.a: "Per la gloria suprema di [ROOT.GetCountry.GetReligion.GetNameWithNoTooltip]!"
