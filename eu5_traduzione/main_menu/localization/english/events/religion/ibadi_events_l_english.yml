l_english:
 shurat: "Šurāh"

 ibadi_events.1.title: "$legacy_of_rustamids$"
 ibadi_events.1.desc: "$legacy_of_rustamids_desc$\n\nNello spirito dell'antico Imamato, [target_character.GetName] è stato appena proclamato primo [ShowPolicyName('ibadi_zuhur_imam_policy')] a governare nel [ShowRegionName('maghreb_region')]. I fedeli non saranno più costretti a vivere sotto il [ShowPolicyNameWithNoTooltip('ibadi_kitman_imam_policy')]."
 ibadi_events.1.a: "Sorge una nuova era."
 ibadi_events.1.b: "In verità, [ROOT.GetCountry.GetReligion.GetGodName] sorride su di noi."

 may_adopt_a_different_color: "Possiamo adottare un #Y Blu Intenso#! come colore del nostro paese"
 rustamids_adopt_different_color: "Adottiamo un #Y Blu Intenso#! come colore del nostro paese"

 ibadi_events.2.title: "Un 'Imām Debole"
 ibadi_events.2.desc: "[target_estate.GetName] sono sempre più insoddisfatti del governo di [target_character.GetName], un [ShowPolicyName('ibadi_daif_imam_policy')]. Dopotutto, il governo di un 'Imām debole viene tollerato solo in tempi di crisi, e i fedeli [ShowReligionAdjective('ibadi')] di [ROOT.GetCountry.GetName] non sono più minacciati."
 ibadi_events.2.a: "Dobbiamo trovare un candidato migliore che ci guidi."

 ibadi_weak_imam_penalty_tt: "[ShowPolicyName('ibadi_daif_imam_policy')] ci darà penalità crescenti finché non cambieremo il nostro [ruler|e] con [ShowGenericActionName('return_to_zuhur_imamate')]"
 has_penalty_for_weak_imam: "Non soddisfa più i requisiti e l'[event|e] #Y $ibadi_events.2.title$#! si è attivato"
