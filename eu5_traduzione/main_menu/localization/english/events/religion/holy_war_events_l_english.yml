l_english:
 holy_war.1.title: "Un Appello alla Guerra Santa"
 holy_war.1.desc: "Dei predicatori sono giunti alla nostra corte, con la voce roca di fervore, chiamando ogni vero credente a prendere le armi contro [preach_io.GetTarget.GetName]. Gli occhi dei fedeli si volgono a noi. Risponderemo all'appello?"
 holy_war.1.a: "Facciamo nostra la causa!"
 holy_war.1.b: "Non in questo momento."

 holy_war.2.title: "Una Contribuzione per la Guerra Santa"
 holy_war.2.desc: "Giungono emissari da [levy_leader.GetLongName], che guida [levy_io.GetName], recando una solenne supplica. La guerra santa contro [levy_io.GetTarget.GetName] divora denaro con la stessa rapidità con cui versa sangue, e come fratelli nella fede siamo chiamati a riempirne le casse di guerra. Apriremo i nostri forzieri alla causa?"
 holy_war.2.a: "Paghiamo una somma modesta."
 holy_war.2.b: "Paghiamo generosamente."
 holy_war.2.c: "Meglio unirci noi stessi alla causa."
 holy_war.2.d: "Non saremo tassati per la guerra di un altro."
 holy_war.2.d.tt: "Ogni membro di [levy_io.GetName] ottiene l'opinione #R [ROOT.GetCountry.GetBiasConfig('opinion_shirked_holy_war').GetNameWithTooltip]#! nei nostri confronti"

 holy_war.3.title: "Il Nostro Popolo Convertito"
 holy_war.3.desc: "Nelle terre che il nemico ci ha strappato, il suo clero si sposta di villaggio in villaggio, costringendo la nostra gente ad abbandonare la fede dei padri o a patirne le conseguenze. La notizia di ogni conversione giunge alla nostra corte, e questo oltraggio non sarà dimenticato."
 holy_war.3.a: "Pagheranno per questo."
 holy_war.3.a.tt: "Non intraprendiamo alcuna azione contro le conversioni forzate"

 holy_war.4.title: "Un Rimprovero dai Fedeli"
 holy_war.4.desc: "Il capo della guerra santa ci accusa di sottrarci al nostro sacro dovere e minaccia gravi conseguenze se non dimostreremo la nostra devozione. Come rispondiamo?"
 holy_war.4.a: "Giuriamo di raddoppiare i nostri sforzi."
 holy_war.4.a.tt: "Il capo della guerra santa ci concede #G 2 anni#! per metterci alla prova. Se entro allora la nostra partecipazione alla guerra santa sarà cresciuta, i fedeli ne saranno lieti; in caso contrario, subiremo comunque il loro rimprovero."
 holy_war.4.b: "Non rispondiamo a nessuno."

 holy_war.6.title: "I Fedeli sono Compiaciuti"
 holy_war.6.desc: "La notizia del nostro rinnovato zelo per la guerra santa si è diffusa lontano, e i capi dei fedeli pronunciano ora il nostro nome con calore. Dove un tempo vi era dubbio, ora vi è favore."
 holy_war.6.a: "#italic Deus vult#!."
 holy_war.6.a.muslim: "#italic Allāhu akbar#!."
 holy_war.20.title: "I Fedeli sono Scontenti"
 holy_war.20.desc: "Il tempo che ci era stato concesso per tener fede ai nostri voti è trascorso, e non abbiamo fatto nulla per onorarli. I capi della guerra santa non hanno dimenticato le nostre promesse, né il nostro mancato adempimento, e il rimprovero di cui ci avevano avvertito ora si abbatte su di noi."
 holy_war.20.a: "Dobbiamo sopportare il loro giudizio."
 holy_war.7.title: "Il Nostro Appello è Stato Accolto"
 holy_war.7.desc: "[preach_target.GetName] hanno dato ascolto alla nostra predicazione e si sono uniti alla guerra santa, impegnando spada e tesori per la causa. Un'altra spada è sguainata per la fede, e l'esercito si ingrossa."
 holy_war.7.a: "I fedeli si raccolgono."
 holy_war.8.title: "Il Nostro Appello è Stato Rifiutato"
 holy_war.8.desc: "[preach_target.GetName] hanno fatto orecchie da mercante alla nostra predicazione, offrendo parole fredde e porte chiuse, e non si uniranno alla guerra santa. I fedeli ricorderanno l'affronto."
 holy_war.8.a: "E sia."
 holy_war.8.a.tt: "Hanno ignorato la nostra offerta"

 holy_war.9.title: "L'Offerta di un Seggio Cardinalizio"
 holy_war.9.desc: "[cardinal_offerer.GetName], in qualità di capo di [cardinal_io.GetName], offre di elevare uno dei nostri prelati a un seggio cardinalizio, da istituire nel nostro stesso reame, qualora prendessimo la croce. Un simile patrocinio ci legherebbe alla causa santa. Accettiamo?"
 holy_war.9.a: "Accettiamo questo onore e ci uniamo alla Crociata."
 holy_war.9.a.no_seat_tt: "Il nostro reame detiene già un Seggio Cardinalizio in ogni insediamento, perciò veniamo onorati invece con un prestigio maggiore"
 holy_war.9.b: "Rifiutiamo l'offerta."

 holy_war.10.title: "Un'Offerta di Riconoscimento"
 holy_war.10.desc: "[recognition_offerer.GetName], in qualità di capo di [recognition_io.GetName], offre di riconoscere la nostra posizione tra i fedeli, una concessione di autorità religiosa e legittimità, qualora ci unissimo alla guerra santa contro gli infedeli. Accettiamo?"
 holy_war.10.a: "Accettiamo e ci uniamo al Jihād."
 holy_war.10.b: "Rifiutiamo l'offerta."

 holy_war.17.title: "Una Guarigione Miracolosa"
 holy_war.17.desc: "Un soldato semplice, dato per morto dai medici dell'accampamento, si è alzato dal suo giaciglio sano e salvo, e molti già parlano di opera del Cielo. Eppure, nella morsa della febbre, fu visitato da sogni strani e inquietanti, visioni che giura preannuncino ciò che verrà, e gli uomini ne mormorano con inquietudine. Come trattiamo la questione?"
 holy_war.17.a: "Proclamiamo la sua guarigione un miracolo e raduniamo l'esercito!"
 holy_war.17.a.muslim: "$holy_war.17.a$"
 holy_war.17.a.tt: "Aumenta lo zelo religioso della guerra santa di #G 5#!"
 holy_war.17.b: "Mettiamo a tacere la faccenda prima che la paura prenda piede."

 holy_war.18.title: "Il Fervore Scema nell'Accampamento"
 holy_war.18.desc: "La lunga attesa logora crudelmente l'esercito. Le preghiere che un tempo risuonavano di fervore ora vengono biascicate a memoria, gli animi si accendono per le minuzie più futili e vecchie faide covano di nuovo ogni notte attorno ai fuochi. L'ardore che per primo aveva attirato i fedeli alla causa si è raffreddato in grigia cenere e, a meno che qualcosa non riaccenda presto il loro spirito, l'intera impresa potrebbe consumarsi prima che venga sferrato un solo colpo. Che cosa fare?"
 holy_war.18.a: "Teniamo un grande sermone e un banchetto per l'esercito."
 holy_war.18.a.tt: "Aumenta lo zelo religioso della guerra santa di #G 8#!"
 holy_war.18.b: "I fedeli devono trovare da soli il proprio fuoco."
 holy_war.18.b.tt: "Riduce lo zelo religioso della guerra santa di #R 5#! e ne ritarda la preparazione di #R 5#!"

 holy_war.19.title: "Un Predicatore Infuocato"
 holy_war.19.desc: "Un predicatore dallo sguardo selvaggio è apparso ai margini dell'accampamento, con le vesti consunte dal viaggio e la voce resa roca da giorni di incessante esortazione. Le sue parole ardenti attirano una folla crescente di poveri e di pii, lavoratori e uomini senza terra, tutti smaniosi di marciare per la fede in questo stesso istante. È fervente oltre ogni ragione e del tutto indisciplinato, e nessun signore tra noi ha alcun comando su di lui. Come trattiamo questo incendiario?"
 holy_war.19.a: "Gli diamo mano libera per radunare i fedeli."
 holy_war.19.a.tt: "Aumenta lo zelo religioso della guerra santa di #G 5#!"
 holy_war.19.b: "Teniamolo a freno prima che susciti disordini."

 holy_war.21.title: "Una Lite sul Bottino"
 holy_war.21.desc: "Appena caduta la città, i nostri soldati e gli uomini di un esercito alleato sono venuti alle mani per la spartizione del saccheggio. Coltelli sono stati sguainati nelle strette vie, tende rovesciate, e vecchi rancori tra i due campi traboccano in aperte zuffe. Se la lite non viene sedata rapidamente, potrebbe guastare l'intera campagna e mettere fratello contro fratello mentre il nemico è ancora in piedi. Come la risolviamo?"
 holy_war.21.a: "Lasciamo che i nostri uomini prendano ciò che si sono guadagnati."
 holy_war.21.a.tt: "Riduce lo zelo religioso della guerra santa di #R 5#!"
 holy_war.21.b: "Tratteniamoli per il bene della causa."
 holy_war.21.b.tt: "Aumenta lo zelo religioso della guerra santa di #G 5#!"

 holy_war.22.title: "Malattia nell'Esercito"
 holy_war.22.desc: "Una febbre consuntiva si è insinuata nelle affollate linee d'assedio, e ogni grigio mattino altri uomini vengono portati fuori privi di sensi dalle tende. I medici dell'accampamento praticano salassi, purghe e preghiere su di loro, eppure nulla arresta il morbo, e il fetore dei moribondi grava pesante su tutto l'accampamento. Ogni giorno che passa l'esercito perde forze che non può permettersi di perdere, così lontano da casa, davanti a mura ancora intatte. Come affrontiamo questo flagello?"
 holy_war.22.a: "Proseguiamo la campagna, a qualunque costo."
 holy_war.22.b: "Facciamo riposare l'esercito finché la malattia non passa."
 holy_war.22.b.tt: "Riduce lo zelo religioso della guerra santa di #R 5#!"

 holy_war.23.title: "Cade un Campione"
 holy_war.23.desc: "All'assedio di [sieged_location.GetName], [fallen_champion.GetName] è caduto nel pieno dei combattimenti, abbattuto sui bastioni dopo gesta di valore che saranno cantate per una generazione. L'esercito piange un campione amato tanto dal soldato semplice quanto dal fiero signore, eppure, anche nel dolore, il sangue degli uomini si infiamma, e molti implorano ora l'onore di vendicare il caduto sul nemico. Come segniamo questa morte?"
 holy_war.23.a: "Acclamiamolo martire della fede!"
 holy_war.23.a.tt: "Aumenta lo zelo religioso della guerra santa di #G 10#!"
 holy_war.23.b: "Onoriamolo con silenziosa dignità."
 holy_war.23.b.tt: "Aumenta lo zelo religioso della guerra santa di #G 3#!"

 holy_war.24.title: "Falsi Credenti nei Ranghi"
 holy_war.24.desc: "Brutti sussurri corrono per l'accampamento: eretici e falsi credenti si sarebbero insinuati tra i fedeli, le loro preghiere una vuota derisione e la loro lealtà in grave dubbio. I più pii dell'esercito esigono che vengano estirpati prima che avvelenino l'intero esercito, mentre le teste più fredde consigliano che una spada è una spada nella mano di un uomo, qualunque credo giaccia sepolto nel suo cuore. Come rispondiamo all'accusa?"
 holy_war.24.a: "Epuriamo i falsi credenti dall'esercito."
 holy_war.24.a.tt: "Aumenta lo zelo religioso della guerra santa di #G 8#!"
 holy_war.24.b: "Chiudiamo un occhio. Abbiamo bisogno di ogni spada."
 holy_war.24.b.tt: "Riduce lo zelo religioso della guerra santa di #R 5#!"

 holy_war.25.title: "Un Pio Lascito"
 holy_war.25.desc: "Un ricco magnate del nostro reame, recentemente passato alla sua ricompensa eterna, ha lasciato una grande somma alla guerra santa nel suo ultimo testamento. I suoi esecutori hanno consegnato le ricchezze alla nostra custodia, forzieri sigillati di monete da spendere come riteniamo opportuno per la causa, e già il clero, i capitani e i poveri avanzano ciascuno una pretesa su di esse. Dove andrà questa fortuna?"
 holy_war.25.a: "Prendiamo la ricchezza per finanziare la nostra guerra."
 holy_war.25.b: "Diamola alle casse di guerra della guerra santa."
 holy_war.25.b.tt: "Aumenta lo zelo religioso della guerra santa di #G 3#!"
 holy_war.25.c: "Distribuiamola come elemosina ai fedeli."
 holy_war.25.c.tt: "Aumenta lo zelo religioso della guerra santa di #G 3#!"
 holy_war.27.title: "Un Disertore Conquistato"
 holy_war.27.desc: "Il nostro argento ha compiuto il suo silenzioso lavoro. [desertion_member.GetName] hanno accettato la tangente e abbandonato la loro causa, ammainando i propri stendardi e tornando furtivamente a casa con scuse a cui nessuno crede davvero. I nostri nemici restano più deboli per la loro partenza. Ancora una volta l'oro ci ha procurato ciò che né l'acciaio né i sermoni avrebbero potuto, e un fastidioso nemico è stato discretamente rimosso dalla scacchiera. Forse una lezione sul vero prezzo della lealtà."
 holy_war.27.a: "L'avidità riesce dove la spada vacilla."
 holy_war.27.a.tt: "[desertion_member.GetName] hanno accettato la tangente e lasciato [desertion_io.GetName]"
 holy_war.28.title: "Il Nostro Argento Respinto"
 holy_war.28.desc: "[desertion_member.GetName] hanno respinto con decisione la nostra offerta segreta e scacciato il nostro emissario dalla loro corte, giurando di restare in guerra senza timore e senza lasciarsi tentare dal nostro denaro. Peggio ancora, la notizia del tentativo potrebbe diffondersi, e se giungesse alle orecchie del pubblico il nostro nome verrebbe infangato come quello di un corruttore e di un ingannatore. Poco da mostrare per l'impresa, se non il rischio."
 holy_war.28.a: "E sia."
 holy_war.28.a.tt: "Hanno rifiutato la tangente"

 holy_war.29.title: "Un Legato Papale"
 holy_war.29.desc: "Sua Santità ha inviato [papal_legate.GetName] — un prelato guerriero versato tanto nell'arte della guerra quanto in quella del clero — a cavalcare alla testa del nostro esercito e a conferire alla nostra [holy_war.GetName] la piena benedizione di Roma. Un uomo simile potrebbe affinare i nostri eserciti e legarci sempre più alla Santa Sede, sebbene risponda prima al Papa e solo poi a noi. Lo accogliamo al nostro servizio?"
 holy_war.29.a: "Diamo il benvenuto al legato sotto le nostre insegne."
 holy_war.29.a.tt: "Aumenta lo zelo religioso della [crusade|e] di #G 5#!"
 holy_war.29.b: "Rimandiamolo a Roma con i nostri ringraziamenti."

 holy_war.30.title: "Venditori di Indulgenze nell'Accampamento"
 holy_war.30.desc: "Una compagnia di venditori di indulgenze è calata sull'accampamento come avvoltoi su carogna fresca, spacciando indulgenze e ninnoli sacri a ogni soldato disposto a separarsi dal proprio denaro. I loro guadagni crescono con la stessa rapidità dei brontolii dei devoti, che definiscono l'intero commercio uno scandalo per la causa. Eppure, denaro è denaro, e nessuna guerra santa fu mai vinta con le sole preghiere. Che cosa ne facciamo?"
 holy_war.30.a: "Lasciamo che i loro guadagni gonfino le casse di guerra."
 holy_war.30.a.tt: "Riduce lo zelo religioso della [crusade|e] di #R 3#!"
 holy_war.30.b: "Dirottiamo discretamente il denaro nelle nostre casse."
 holy_war.30.b.tt: "Riduce lo zelo religioso della [crusade|e] di #R 5#!"
 holy_war.30.c: "Cacciamo i venditori dall'accampamento."
 holy_war.30.c.tt: "Aumenta lo zelo religioso della [crusade|e] di #G 5#!"

 holy_war.31.title: "Le Reliquie di un Santo"
 holy_war.31.desc: "Le ossa di un venerato santo sono giunte in nostra custodia, portate alla nostra corte da una compagnia di monaci riconoscenti che le hanno custodite attraverso molte leghe perigliose. Simili reliquie sono un tesoro al di là di ogni prezzo in oro, perché là dove giungeranno infine a riposare i fedeli si raduneranno a migliaia per pregare e stupirsene. Dove saranno custoditi questi sacri resti?"
 holy_war.31.a: "Custodiamoli come in un santuario nella nostra capitale."
 holy_war.31.b: "Portiamoli davanti all'esercito in battaglia."
 holy_war.31.b.tt: "Aumenta lo zelo religioso della [crusade|e] di #G 8#!"

 holy_war.32.title: "Il Voto del Crociato"
 holy_war.32.desc: "Davanti all'intera corte riunita, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] si è inginocchiato all'altare e ha pronunciato un solenne voto di prendere la croce di persona, di guidare i fedeli nel cuore stesso della guerra santa e di condividere ogni difficoltà e pericolo della campagna accanto all'ultimo dei fanti. È un impegno audace, e pericoloso, e l'intero reame attende ora la nostra parola. Lasciamo che questo voto rimanga?"
 holy_war.32.a: "Lasciamo che [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] guidi l'esercito di persona."
 holy_war.32.a.tt: "Aumenta lo zelo religioso della [crusade|e] di #G 5#!"
 holy_war.32.b: "Il reame è meglio servito con [ROOT.GetCountry.GetGovernment.GetRuler.GetNameWithNoTooltip] sul trono."

 holy_war.33.title: "La Cristianità Prende la Croce"
 holy_war.33.desc: "Una grande ondata di fervore sacro ha attraversato il reame, e uomini di ogni ceto smaniano di cucire la croce sulle proprie tuniche e di marciare per la fede. Fieri cavalieri e signori terrieri gareggiano per la gloria dell'avanguardia, mentre nei villaggi la gente comune imbraccia qualunque arma riesca a trovare. Di chi sfruttiamo maggiormente l'ardore?"
 holy_war.33.a: "Chiamiamo cavalieri e nobili sotto le insegne."
 holy_war.33.b: "Raduniamo un grande esercito dalla gente comune."

 holy_war.34.title: "Uno Shaykh Sufi"
 holy_war.34.desc: "Un venerato shaykh sufi, [sufi_shaykh.GetName], la cui pietà e il cui sapere sono celebri in tutto il mondo musulmano, è giunto al nostro accampamento con un gruppo di devoti discepoli alle calcagna. I suoi sermoni attorno ai fuochi serali infiammano il cuore dei ghazi, e uomini che fino a ieri marciavano stancamente ora parlano di martirio con occhi scintillanti. Come accogliamo questo uomo santo?"
 holy_war.34.a: "Accogliamo lo shaykh nella nostra corte."
 holy_war.34.a.tt: "Aumenta lo zelo religioso del [jihad|e] di #G 5#!"
 holy_war.34.b: "Teniamo a distanza il mistico vagabondo."
 holy_war.34.b.tt: "Riduce lo zelo religioso del [jihad|e] di #R 3#!"

 holy_war.35.title: "I Ghazi Pretendono la Loro Parte"
 holy_war.35.desc: "I guerrieri volontari accorsi all'appello ci incalzano ora per il bottino che era stato loro promesso, affollandosi davanti alla nostra tenda con voci alte e pazienza breve. Hanno combattuto per la fede, dicono, ma anche per le loro mogli e i loro figli, e le mani vuote fanno ranghi vuoti alla prossima dura battaglia. Come rispondiamo alla loro richiesta?"
 holy_war.35.a: "Concediamo ai ghazi la loro parte del bottino."
 holy_war.35.a.tt: "Aumenta lo zelo religioso del [jihad|e] di #G 5#!"
 holy_war.35.b: "Il saccheggio appartiene allo sforzo bellico, non all'avidità."
 holy_war.35.b.tt: "Riduce lo zelo religioso del [jihad|e] di #R 3#!"

 holy_war.36.title: "La Fatwa di un Giurista"
 holy_war.36.desc: "Un stimato giurista, un uomo la cui parola ha peso da un capo all'altro dell'#italic umma#!, ha emesso una #italic fatwa#! che proclama la guerra santa un sacro dovere vincolante per ogni credente in grado di portare armi. Copiato da cento mani e portato di moschea in moschea, un simile verdetto potrebbe infiammare l'intero Islam per la nostra causa. Lo diffondiamo in lungo e in largo?"
 holy_war.36.a: "Diffondiamo il verdetto in ogni angolo."
 holy_war.36.a.tt: "Aumenta lo zelo religioso del [jihad|e] di #G 8#!"
 holy_war.36.b: "Riceviamolo con silenziosa gratitudine."
 holy_war.36.b.tt: "Aumenta lo zelo religioso del [jihad|e] di #G 3#!"

 holy_war.37.title: "Volontari da Tutta l'Umma"
 holy_war.37.desc: "La notizia della guerra santa ha viaggiato ben oltre i nostri confini, e ora gruppi di volontari ghazi giungono al raduno da lontane terre musulmane. Con i piedi doloranti, coperti di polvere e smaniosi, chiedono soltanto un posto nei ranghi e l'occasione di colpire il nemico. Sono molte bocche da sfamare, è vero, ma anche molte spade volenterose. Li accogliamo?"
 holy_war.37.a: "Diamo il benvenuto ai volontari al raduno."
 holy_war.37.a.tt: "Aumenta lo zelo religioso del [jihad|e] di #G 3#!"
 holy_war.37.b: "Non possiamo sfamare ogni zelota vagabondo."

 holy_war.38.title: "Lo Stendardo Sacro"
 holy_war.38.desc: "Un antico stendardo di guerra, che si dice abbia sventolato sulle vittorie dei primi credenti nei primissimi giorni della fede, è stato affidato alla nostra custodia. Per quanto il tessuto sia sbiadito e logoro, la sua sola vista scuote i fedeli a un furore giusto, e gli uomini giurano che lo seguiranno in qualsiasi pericolo senza esitare. Che cosa facciamo di una reliquia così preziosa?"
 holy_war.38.a: "Innalziamolo alto sopra l'esercito."
 holy_war.38.a.tt: "Aumenta lo zelo religioso del [jihad|e] di #G 5#!"
 holy_war.38.b: "Custodiamolo come il tesoro che è."

 sacred_war_banner: "Lo Stendardo Sacro"
 sacred_war_banner_desc: "Uno stendardo di guerra di tessuto sbiadito e logoro, che si dice abbia sventolato sulle vittorie dei primi credenti, custodito ora come sacro tesoro del reame e portato fuori nei giorni più santi per scuotere i fedeli a un furore giusto."

 holy_war.39.title: "Seggio Cardinalizio Accettato"
 holy_war.39.desc: "[cardinal_candidate.GetName] ha accettato la nostra offerta di un seggio cardinalizio e ha preso la croce, unendosi a [cardinal_io.GetName]. Che un nuovo principe della Chiesa sorga tra loro."
 holy_war.39.a: "Deo gratias!"
 holy_war.40.title: "Seggio Cardinalizio Rifiutato"
 holy_war.40.desc: "[cardinal_candidate.GetName] ha respinto la nostra offerta di un seggio cardinalizio e non si unirà a [cardinal_io.GetName]. L'onore verrà offerto altrove."
 holy_war.40.a: "E sia."

 holy_war.41.title: "Il Nostro Riconoscimento Accettato"
 holy_war.41.desc: "[recognition_candidate.GetName] ha accettato la nostra offerta di riconoscimento e si è unito a [recognition_io.GetName], sguainando la spada contro gli infedeli insieme ai fedeli."
 holy_war.41.a: "Dio è grande!"
 holy_war.42.title: "Il Nostro Riconoscimento Rifiutato"
 holy_war.42.desc: "[recognition_candidate.GetName] ha respinto la nostra offerta di riconoscimento e non si unirà a [recognition_io.GetName]. I fedeli ricorderanno chi è rimasto in disparte."
 holy_war.42.a: "E sia."
