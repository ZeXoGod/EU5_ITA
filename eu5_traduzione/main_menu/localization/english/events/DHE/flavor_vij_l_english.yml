l_english:
 flavor_vij.1.title: "Amministrazione del Reame"
 flavor_vij.1.entry: "$flavor_vij.1.title$"
 flavor_vij.1.desc: "Sotto la sapiente guida di [ROOT.GetCountry.GetGovernment.GetRuler.GetName] ci siamo espansi nella parte meridionale dell'$india$ e ora governiamo i popoli [ShowCultureName('telugu')] e [ShowCultureName('tamil')] e le loro lingue peculiari. Per garantire la stabilità della nostra [ROOT.GetCountry.GetFlavorRank] dovremmo integrare ulteriormente questi popoli anziché trattarli come sudditi lontani. Un primo passo in tale direzione potrebbe essere concedere loro il diritto di perorare nella propria lingua, indipendentemente dalla nostra corte [ShowCultureName('kannadiga')]. "
 flavor_vij.1.a: "Concediamo loro i diritti."
 unlock_vij_language_rights.tt: "Sblocca la Legge [ShowLawName('language_of_pleading')] indipendentemente dalla nostra [court_language|e] e la [ShowPolicyName('multi_lingual_court')] per il nostro paese"
 flavor_vij.1.b: "Non diamo loro nulla!"
 flavor_vij.2.title: "Kanaka Dasa"
 flavor_vij.2.entry: "$flavor_vij.2.title$"
 flavor_vij.2.desc: "Il Movimento Haridasa dell'$india$ meridionale ci ha già colmati di doni sotto forma di brani musicali e trattati filosofici. Ora il nome di un uomo si diffonde per la terra, un uomo che potrebbe influenzare la nostra cultura per i secoli a venire. Dovremmo patrocinare e sostenere quest'uomo affinché possa realizzare il proprio potenziale."
 flavor_vij.2.historical_info: "Il poeta, filosofo, musicista e compositore Kanaka Dasa si chiamava Thimmappa Nayaka finché, da ragazzo, trovò un tesoro d'oro e divenne noto come Kanaka Nayaka - Kanaka significa oro in kannada - sebbene non abbia mai usato l'oro per sé. Il suo nome completo, Kanaka Dasa, gli fu dato dallo studioso Vyasaraja, di cui Kanaka Dasa era discepolo. Nato in una comunità di guerrieri, Kanaka Dasa abbandonò la professione di guerriero quando subì una grave ferita in guerra e fu miracolosamente salvato. Dedicò la sua vita a comporre musica e letteratura con una filosofia spiegata nel linguaggio della gente comune. Tra le sue opere principali figurano #italic Nalacharitre#!, #italic Haribhaktisara#!, #italic Nrisimhastava#!, #italic Ramadhanyacharitre#! e #italic Mohanatarangini#!."
 flavor_vij.2.a: "La sua musica vivrà per sempre!"
 flavor_vij.2.b: "La sua filosofia durerà!"
 flavor_vij.3.title: "Dodda Ganeshana Gudi"
 flavor_vij.3.entry: "$flavor_vij.3.title$"
 flavor_vij.3.desc: "[target_character.GetName], un sovrano locale in [ROOT.GetCountry.GetName], ci presenta i piani per la costruzione di un tempio per venerare Nandi, il toro sacro e stretto devoto e attendente di [ShowGodName('shiva_god')], nello stile architettonico [ROOT.GetCountry.GetCulture.GetName]. Sebbene il tempio consisterebbe soltanto nel santuario preceduto da un portico e in un grande monolite di granito di Nandi, posto su un plinto nel santuario del tempio, sarebbe una delle murthi più grandi di sempre. L'umile Kempe Gowda ha anche chiesto una piccola donazione per aiutare a finanziare questa costruzione."
 flavor_vij.3.a: "Patrociniamo il tempio."
 flavor_vij.3.b: "Non abbiamo i fondi per questo."
 flavor_vij.4.title: "Tempio di Veerabhadra"
 flavor_vij.4.entry: "$flavor_vij.4.title$"
 flavor_vij.4.desc: "Il Tempio di Veerabhadra offrirà un meraviglioso esempio dello stile architettonico e dell'arte [ROOT.GetCountry.Custom('IT_ADJ_FP')]. Gli stapathi Vishwakarma Brāhmaṇa hanno già accettato di scolpire il tempio dedicato alla divinità Veerabhadra. L'interno del santuario sarà squisito, con una ricchezza di magnifiche sculture negli intricati mandapam. Un mandapam avrà pilastri con immagini a grandezza naturale di danzatrici, musicisti e altre sculture, create dagli artigiani del nostro impero. Il enorme toro Nandi di granito promesso dagli stapathi Vishwakarma Brāhmaṇa sarà scolpito in un'unica pietra e i soffitti avranno murali di una bellezza mozzafiato. Sebbene questi piani siano già stati redatti e siano pronti per essere eseguiti, richiederebbero fondi significativi."
 flavor_vij.4.a: "Costruiamo il tempio."
 flavor_vij.4.b: "Non abbiamo i fondi per questo."
 flavor_vij.5.title: "Forte di Vellore"
 flavor_vij.5.entry: "$flavor_vij.5.title$"
 flavor_vij.5.desc: "La periferia di [ShowLocationName('vellore')] è adatta a un grande complesso fortificato, che funga da ritiro per il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Con la giusta quantità di investimenti, [ShowLocationNameWithNoTooltip('vellore')] potrebbe essere abbellita fino a diventare una grande capitale per la nostra [ROOT.GetCountry.GetFlavorRank]."
 flavor_vij.5.historical_info: "Nell'anno 1566 il Forte di Vellore fu costruito da Chinna Bommi Nayak e Thimma Reddy Nayak, capi sotto l'Impero Vijayanagara. I suoi grandiosi bastioni, l'ampio fossato e la solida muratura lo hanno reso famoso, ed è stato costruito con granito proveniente dalle vicine cave dei distretti di Arcot e Chittor. All'interno del forte si trova un tempio dedicato a Jalagandeeswar, noto per le sue sculture."
 flavor_vij.5.a: "Costruiamo il forte e facciamone la nostra capitale!"
 flavor_vij.5.b: "Un forte nella zona ci sarebbe di grande utilità."
 flavor_vij.5.c: "Ignoriamolo!"
 flavor_vij.6.title: "Signore dell'Impero Kannada"
 flavor_vij.6.entry: "$flavor_vij.6.title$"
 flavor_vij.6.desc: "Grazie a tutti gli sforzi del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] e dei [ROOT.GetCountry.GetGovernment.GetRuler.GetHerHis] predecessori abbiamo finalmente raggiunto una posizione dominante su tutti gli altri stati dell'$india$ meridionale. Forti del nostro successo sia in ambito militare sia nella stabilità economica, possiamo ora proclamarci Imperatori del popolo [ROOT.GetCountry.GetCulture.GetName] e garantire la nostra guida dei popoli dell'$india$ meridionale."
 flavor_vij.6.historical_info: "Il grande Imperatore di Vijayanagar Krishna Deva Raya si guadagnò i titoli di Andhra Bhoja, Mooru Rayara Ganda - 'Re dei tre Re' - e Kannada Rajya Rama Ramana - 'Signore dell'impero Kannada'. Sconfiggendo i Sultani di Bijapur, Golconda e il Raja di Odisha, Krishna Deva Raya divenne il sovrano più potente della penisola meridionale dell'India. Il re non era solo un abile amministratore, ma anche un eccellente generale, che guidava in prima linea in battaglia e si prendeva persino cura dei feriti. Insieme al suo Primo Ministro Timmarusu, il re amministrò bene il Regno, mantenne la pace nella terra e accrebbe la prosperità del popolo."
 flavor_vij.6.a: "Gli Dei ci sorridono!"
 flavor_vij.7.title: "[vij_atukuri_molla.GetLastNameWithNoTooltip]"
 flavor_vij.7.entry: "$molla$"
 flavor_vij.7.desc: "La poetessa [vij_atukuri_molla.GetName] è nata in una famiglia di vasai a Kadapa e vuole tradurre il $ramayana$ [ShowLanguageName('sanskrit_language')] in [ShowLanguageName('telugu_language')]. Dichiara di avere il Signore [ShowGodName('shiva_god')] come Guru e trae ispirazione dal poeta Potana, che scrisse il Bhagavata Purana in [ShowLanguageNameWithNoTooltip('telugu_language')]. Chiede il nostro patrocinio ma rifiuta di dedicare i suoi scritti a qualsiasi re, come è consuetudine generale per i poeti. Dovremmo patrocinarla nonostante la sua convinzione di non dedicare la sua opera al nostro graziosissimo [ROOT.GetCountry.GetGovernment.GetRulerTitle]?"
 flavor_vij.7.historical_info: "L'Imperatore di Vijayanagara, Krishnadevaraya, invitò Atukuri Molla alla sua corte reale, dove ella recitò il $ramayana$ davanti a lui e ai suoi poeti. Molla usava principalmente un telugu semplice e utilizzava parole sanscrite molto raramente, e la sua opera nota come Molla $ramayana$ è scritta in telugu. La poesia di apertura del Molla $ramayana$ dice: '$ramayana$ è stato scritto molte volte. Qualcuno smette forse di mangiare perché ha mangiato ogni giorno? Così è la storia di Rama, e si può scriverla, leggerla e amarla tutte le volte che si vuole.'"
 flavor_vij.7.a: "Sosteniamo la poetessa."
 flavor_vij.7.b: "Ignoriamola."
 flavor_vij.8.title: "[vij_tallapaka_tirumalamma.GetNameWithNoTooltip]"
 flavor_vij.8.entry: "$Tallapaka$ $Tirumalamma$"
 flavor_vij.8.desc: "Considerata una delle prime poetesse [ShowCultureName('telugu')], [vij_tallapaka_tirumalamma.GetName] è nata in una famiglia di [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] e ha iniziato a scrivere nella sua lingua nativa, il [ShowLanguageName('telugu_language')]. Di recente ha pubblicato il Subhadra Kalyanam, un'opera contenente 1170 poesie sul matrimonio di Arjuna e Subhadrā. Con la sua abilità già consolidata, sarebbe vantaggioso per noi sostenerla ulteriormente."
 flavor_vij.8.a: "Sosteniamo la sua opera."
 flavor_vij.8.b: "Ignoriamola."
 flavor_vij.9.title: "Astadiggajas"
 flavor_vij.9.entry: "$flavor_vij.9.title$"
 flavor_vij.9.desc: "Durante il regno del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] la cultura [ShowCultureName('telugu')] ha vissuto un'età dell'oro, culminata nelle opere di otto poeti [ShowCultureNameWithNoTooltip('telugu')], chiamati gli Astadiggajas. Dovremmo sfruttare questo stato attuale e attuare un sistema per preservare la nostra cultura peculiare per le generazioni future."
 flavor_vij.9.historical_info: "L'imperatore Sri Krishna Deva Raya governò l'Impero Vijayanagara dal 1509 fino alla morte nel 1529, durante il quale patrocinò otto poeti telugu chiamati Astadiggajas. Gli otto poeti Allasani Peddana, Nandi Thimmana, Madayyagari Mallana, Dhurjati, Ayyalaraju Ramambhadrudu, Pingali Surana, Ramarajabhushanudu e Tenali Ramakrishnudu erano considerati gli otto pilastri della sua assemblea letteraria. L'Età Prabandha, come viene chiamata l'età degli Astadiggajas, proseguì dal 1540 al 1600, e in quel periodo la corte dei poeti era chiamata anche Bhuvana Vijayam, o Conquista del Mondo."
 flavor_vij.9.a: "Che abbia inizio l'Età Prabandha!"
 flavor_vij.9.b: "Non abbiamo bisogno di loro."
 STATIC_MODIFIER_NAME_vij_astadiggajas_modifier: "Età Prabandha"
 STATIC_MODIFIER_DESC_vij_astadiggajas_modifier: "Patrocinare i poeti del nostro paese eleva la nostra cultura a nuove vette."
 flavor_vij.10.title: "Vyasatirtha"
 flavor_vij.10.entry: "$flavor_vij.10.title$"
 flavor_vij.10.desc: "Lo studioso [vij_vyasatirtha.GetName] è già acclamato come una delle tre luci spirituali, o munitrayam, del Dvaita Vedanta. Persino i suoi oppositori ammirano la sua chiara comprensione ed esposizione delle loro scuole di pensiero. Dovremmo sfruttare la sua competenza e assumerlo alla nostra corte prima che lo facciano altri."
 flavor_vij.10.historical_info: "Maestro nel dibattito e nel dialogo in logica e filosofia, Vyasatirtha ebbe grande influenza sull'Impero Vijayanagar durante il regno di Shri Krishnadevaraya. Il re nutriva il massimo rispetto per Vyasatirtha, considerandolo nulla meno che la sua kuladevata e il suo Guru. Tra le famose opere di Vyasatirtha figurano Nyayamruta - Il Nettare della Logica, Tarkatandava - La Danza della Logica, Tatparya Chandrika - I Raggi di Luna del Commentario, Mayavada Khandana Mandaramanjari, Upadhi Khandana Mandaramanjari, Prapancha Mithyatvanumana Khandana Mandaramanjari, Tattvaviveka Mandaramanjari, Bhedojjivana e Sattarkavilasa."
 flavor_vij.10.a: "Che la sua saggezza ci guidi!"
 flavor_vij.11.title: "Le Corporazioni Commerciali Tamil"
 flavor_vij.11.entry: "$flavor_vij.11.title$"
 flavor_vij.11.desc: "Mentre le origini della nostra [ROOT.GetCountry.GetFlavorRank] si trovano negli aridi altopiani di [ShowAreaName('karnakassala_area')], le nostre recenti espansioni hanno posto sotto il nostro controllo le ricche città commerciali di [ShowAreaName('tamil_land_area')]. Con la nostra crescente autorità nella zona, siamo entrati in conflitto con [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] [ShowCultureName('tamil')] locali. Ora ci hanno chiesto di sancire i loro privilegi commerciali. Sebbene ciò ci assicurerebbe la loro cooperazione per il futuro, dovremmo cedere il controllo faticosamente conquistato in [ShowAreaNameWithNoTooltip('tamil_land_area')]."
 flavor_vij.11.a: "Concediamo loro ciò che hanno chiesto."
 flavor_vij.11.b: "Non abbiamo bisogno della loro cooperazione."
 flavor_vij.12.title: "I Mercanti di [ShowLocationNameWithNoTooltip('pazhaverkadu')] Prosperano"
 flavor_vij.12.entry: "I Mercanti di Pazhaverkadu Prosperano"
 flavor_vij.12.desc: "Dopo la nostra conquista della Provincia di [ShowProvinceDefinitionName('kosta')], [ROOT.GetCountry.Custom('IT_BURGHERS_IL_NOSTRO')][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno investito molto denaro per sviluppare il porto di [ShowLocationName('pazhaverkadu')] in una destinazione importante per le navi di tutti i mari dell'Asia."
 flavor_vij.12.historical_info: "La costa settentrionale del Coromandel e in particolare la città di Pazhaverkadu erano vitali per l'impero Vijayanagara. Era attraverso questa striscia costiera che tutte le merci dell'oriente raggiungevano la capitale imperiale. Dopo la devastazione portata dalle guerre contro il Regno di Orissa, la zona attorno a Pazhaverkadu entrò in un'età dell'oro economica."
 flavor_vij.12.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_vij.12.a.entry: "$common_string_brilliant$"
 flavor_vij.13.title: "Il Tempio di Venkateshwara"
 flavor_vij.13.entry: "$flavor_vij.13.title$"
 flavor_vij.13.desc: "Nel cuore della nostra [ROOT.GetCountry.GetFlavorRank], negli insediamenti di [ShowLocationName('penukonda')], sorge un Tempio dedicato a Venkateshwara, una forma del nostro più venerato Dio [ShowGodName('vishnu_god')]. Per secoli prima di noi, i governanti della terra hanno fatto donazioni lussuose al complesso del tempio per mostrare la loro generosità nel culto di [ShowGodNameWithNoTooltip('vishnu_god')]. Poiché abbiamo conquistato il territorio non molto tempo fa, dobbiamo ora decidere come affrontare le donazioni al tempio durante il nostro regno."
 flavor_vij.13.a: "Facciamo una grande donazione."
 flavor_vij.13.b: "Manteniamo più modesti i nostri contributi."

 flavor_vij.14.title: "La Profezia di [target_character.GetNameWithNoTooltip]"
 flavor_vij.14.entry: "La Profezia dei Re Fondatori"
 flavor_vij.14.desc: "Da quando [target_character.GetName] e suo fratello fuggirono da [ShowLocationName('delhi')] dopo la sconfitta del Re di [ShowLocationName('warangal')], si affrettarono verso l'altopiano di [ShowRegionName('deccan_region')], dove fondarono [ROOT.GetCountry.GetLongName]. Ora, con il grande [target_character.GetNameWithNoTooltip] come nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle], possiamo garantire che il nostro controllo sull'$india$ meridionale si estenda oltre [ShowLocationName('vijayanagar')], la Città della Vittoria."
 flavor_vij.14.a: "Che [ROOT.GetCountry.GetNameWithNoTooltip] si innalzi!"
 flavor_vij.14.a.entry: "Che ci innalziamo!"
 flavor_vij.14.historical_info: "Sebbene si sappia poco della prima vita di Harihara I e Bukka Raya, esistono varie teorie su come siano giunti a essere ciò che furono. Una suggerisce che fossero pastori, e che un Brahmano dicesse a Bukka che un giorno sarebbe stato Imperatore di tutto il Bharatwarsh. L'altra teoria sostiene che sia Harihara sia Bukka fossero comandanti sotto i Kākatīya e che, dopo una schiacciante sconfitta contro Muḥammad ibn Ṭughlāq, fossero stati inviati a Delhi, dove si convertirono all'Islam. Dopo la loro fuga, e sotto la guida del saggio Vidyāraṇya, fondarono l'Impero Vijayanagara."

 flavor_vij.15.title: "Morte di [target_character2.GetNameWithNoTooltip]"
 flavor_vij.15.entry: "CIMITERO"
 flavor_vij.15.desc: "Con la morte di [target_character2.GetName] e l'ascesa di [target_character.GetName] al trono [ROOT.GetCountry.Custom('IT_ADJ_MS')], [ROOT.GetCountry.GetNameWithNoTooltip] è ora pronta a entrare in una nuova era di prosperità. [target_character.GetSheHe|U] ha già elaborato piani per la promozione di molti studiosi nella [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 flavor_vij.15.a: "Che il [target_character.GetHerHis] regno ci porti prosperità."
 flavor_vij.15.a.entry: "Che il suo regno ci porti prosperità."

 flavor_vij.16.title: "Città del Sapere"
 flavor_vij.16.entry: "$flavor_vij.16.title$"
 flavor_vij.16.desc: "Con la nostra ascesa in $india$ e la necessità di rafforzare la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_character.GetName] ha elaborato piani per sviluppare ulteriormente [target_location.GetName]. [target_character.GetSheHe|U] ha già in mente di condurre la [target_location.GetRank.GetName] a nuove vette, definendola già la #italic Città del Sapere#! per invitare più studiosi."
 flavor_vij.16.a: "Aiutiamo questo sforzo."
 flavor_vij.16.b: "È piuttosto costoso..."

 flavor_vij.17.title: "[target_location.GetNameWithNoTooltip], la Città della Vittoria"
 flavor_vij.17.entry: "Vijayanagar, la Città della Vittoria"
 flavor_vij.17.desc: "[target_character.GetName] e i [target_character.GetHerHis] sforzi per rafforzare [target_location.GetName] hanno fatto sì che la [target_location.GetRank.GetName] divenisse un centro di molte religioni diverse, pur mantenendo il proprio status di [target_location.GetRank.GetNameWithNoTooltip] in cui molti studiosi [ShowReligionAdjective('hindu')] possono studiare. Possiamo forse aiutare ancora di più questa impresa."
 flavor_vij.17.a: "Tutta l'$india$ conoscerà [target_location.GetNameWithNoTooltip]!"
 flavor_vij.17.a.entry: "Tutta l'$india$ conoscerà [ShowLocationNameWithNoTooltip('vijayanagar')]!"
 flavor_vij.17.b: "Non dovremmo mandarci in bancarotta per questo."
 flavor_vij.17.historical_info: "Vijayanagar, che si traduce Città della Vittoria, era la città più popolosa e più prestigiosa dell'India dell'epoca. Dopo essere stata fondata da Harihara e Bukka Raya, divenne lentamente un centro nevralgico per ogni cittadino indù del subcontinente. Ciò non significa che fosse una città religiosa, poiché molti monumenti erano multi-religiosi. Nel XVI secolo fu conquistata e saccheggiata per 6 mesi da una coalizione di Sultanati musulmani."

 flavor_vij.18.title: "Caduta di [target_location.GetNameWithNoTooltip]"
 flavor_vij.18.desc: "Con le nostre forze che hanno preso d'assalto [target_location.GetName] e occupato le sue strade, molti dei nostri soldati hanno iniziato a saccheggiare le sue vaste ricchezze. Sebbene possiamo permetterglielo e prendere la ricchezza per noi, potrebbe essere meglio preservare la [target_location.GetRank.GetName]."
 flavor_vij.18.a: "Prendiamo il bottino di guerra!"
 flavor_vij.18.b: "Preserviamo la [target_location.GetRank.GetNameWithNoTooltip]."
 flavor_vij.18.b.entry: "Preserviamo la città."

 flavor_vij.19.title: "$madhura_vijayam$"
 flavor_vij.19.entry: "$flavor_vij.19.title$"
 flavor_vij.19.desc: "Con la scomparsa dei fondatori della nostra grande nazione, [GetCharacter('vij_harihara_sangama').GetName] e [GetCharacter('vij_bukka_raya_sangama').GetName], sono stati scritti molti nuovi racconti e poemi su di loro. Uno di questi poemi è #italic $madhura_vijayam$#!, che narra la caduta di [ShowLocationName('madurai')]. Forse possiamo provare a pubblicare queste opere."
 flavor_vij.19.historical_info: "Sebbene gran parte del suo contenuto sia andato perduto nel tempo, il Madhura Vijayam narra la vita di Kumara Kampana, figlio di Bukka Raya I, e contiene dettagli sulla caduta del Sultanato di Madurai. Per questo motivo non è solo un poema ma una fonte di informazioni storiche. Fu riscoperto nel 1916, il che ne consentì la stampa e la pubblicazione al resto del mondo."
 flavor_vij.19.a: "Possiamo permetterci una simile impresa."
 flavor_vij.19.b: "Spendere denaro per dei poemi? È troppo costoso."
 variable_vij_harihara_or_bukka_raya_conquered_madurai_flag_tt: "Madurai è stata Conquistata"

 flavor_vij.20.title: "[target_character.GetNameWithNoTooltip]"
 flavor_vij.20.entry: "Nachana Somanatha, Traduttore di Corte"
 flavor_vij.20.desc: "A causa del numero elevato di poemi scritti in varie lingue all'interno della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], vi è stata una richiesta di traduttori. Uno di essi è [target_character.GetName], un uomo di umili origini ma di molto talento. È giunto per aiutarci nei nostri sforzi di traduzione."
 flavor_vij.20.a: "Assumiamolo."
 flavor_vij.20.b: "Tradurre? Persone simili non servono a [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_vij.20.b.entry: "Tradurre? Persone simili non servono al nostro paese."

 flavor_vij.21.title: "Vita Accademica a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]"
 flavor_vij.21.entry: "$flavor_vij.21.title$"
 flavor_vij.21.desc: "Con molte opere d'arte a [ROOT.GetCountry.GetCapital.GetName] e molti nuovi studiosi, poeti e traduttori che affluiscono alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_character.GetName] ha pensato di cambiare il modo in cui funziona la [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.Custom('IT_ADJ_FS')]. Anziché essere influenzata da [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], forse dovrebbe essere un organismo del tutto separato, una dimostrazione di prestigio anziché un organo amministrativo."
 flavor_vij.21.a: "È necessario un approccio più accademico in [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_vij.21.a.entry: "È necessario un approccio più accademico nel nostro paese."
 flavor_vij.21.b: "Non dovremmo irritare [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 flavor_vij.21.b.entry: "Non dovremmo irritare $nobles_estate$."

 flavor_vij.22.title: "Imparare dai Guerrieri [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]."
 flavor_vij.22.entry: "Imparare dai Guerrieri Musulmani"
 flavor_vij.22.desc: "Sebbene siamo in costante conflitto con le nazioni [ShowReligionGroupAdjective('muslim')], non dovremmo essere ristretti di vedute riguardo ai loro modi di combattere. I loro cavalieri sono più abili dei nostri e causano sempre problemi alla nostra fanteria. Forse possiamo adottare alcune delle loro tattiche e integrarle nell'esercito [ROOT.GetCountry.Custom('IT_ADJ_MS')]."
 flavor_vij.22.a: "Questa innovazione ci garantirà molte vittorie."
 flavor_vij.22.b: "Nemmeno un [ShowReligionGroupAdjectiveWithNoTooltip('muslim')] sarà ammesso nell'esercito."
 vijay_riders_may_only_be_recruited_from_muslim_provinces: "[ShowUnitDefinitionName('a_muslim_riders_vijay')] possono essere reclutati solo dalle [locations|e] in cui la fede [ShowReligionGroupName('muslim')] è dominante."

 flavor_vij.23.title: "Sostenere la Letteratura [ShowLanguageNameWithNoTooltip('kannada_language')]"
 flavor_vij.23.entry: "$flavor_vij.23.title$"
 flavor_vij.23.desc: "Gran parte delle nostre opere letterarie, e molti dei nostri grandi poeti, hanno scritto le proprie opere nella lingua [ShowLanguageName('kannada_language')], da cui deriva il termine #italic Letteratura [ShowLanguageNameWithNoTooltip('kannada_language')]#! all'interno della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Tuttavia, [target_character.GetName] ha pensato di sostenere questa forma di letteratura, poiché [target_character.GetSheHe] è affascinato da tutte le grandi storie che contiene."
 flavor_vij.23.a: "[ROOT.GetCountry.GetNameWithNoTooltip] avrà tutti i grandi poemi!"
 flavor_vij.23.a.entry: "Avremo tutti i grandi poemi!"
 flavor_vij.23.b: "Non vale il nostro impegno."

 flavor_vij.24.title: "Richiesta d'Acqua a [target_location.GetNameWithNoTooltip]"
 flavor_vij.24.entry: "Richiesta d'Acqua a Vijayanagar"
 flavor_vij.24.desc: "Se [target_location.GetName] vuole prosperare, ha bisogno di un rifornimento costante d'acqua. In questo momento, la popolazione in costante crescita della [target_location.GetRank.GetName] può essere mantenuta solo se riusciamo a fornirle tutti i suoi bisogni fondamentali. Per questi motivi, [target_character.GetName] ha elaborato dei piani con il [target_character.GetHerHis] [ROOT.GetCountry.GetGovernment.GetCabinetTitle] per rafforzare l'irrigazione a [target_location.GetNameWithNoTooltip]."
 flavor_vij.24.a: "La Città della Vittoria prospererà!"
 flavor_vij.24.b: "Non dovremmo sovraccaricare le nostre casse con progetti simili."

 flavor_vij.25.title: "L'Approccio di [target_character.GetNameWithNoTooltip]"
 flavor_vij.25.entry: "L'Approccio del Monarca al Sincretismo"
 flavor_vij.25.desc: "Con il governo di [target_character.GetName] su [ROOT.GetCountry.GetName] appena iniziato, è tempo che [target_character.GetSheHe] scelga un approccio in materia di sincretismo. Con le varie culture presenti in $india$, forse scegliere un approccio più tollerante è meglio, ma per consolidare il potere potrebbe essere preferibile tenerle a freno come nostri sudditi inferiori."
 flavor_vij.25.a: "Non irritiamo alcuna minoranza culturale."
 flavor_vij.25.b: "Per [ROOT.GetCountry.GetNameWithNoTooltip], si piegheranno davanti a noi."
 flavor_vij.25.b.entry: "Per noi, si piegheranno davanti a noi."

 flavor_vij.26.title: "Conquista del Popolo [ShowCultureNameWithNoTooltip('tamil')]"
 flavor_vij.26.entry: "Conquista del Popolo Tamil"
 flavor_vij.26.desc: "Con la caduta delle terre [ShowCultureName('tamil')], molti nella nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno discusso sulla loro posizione nel nostro paese. Sebbene vi siano stati diversi conflitti nell'$india$ meridionale tra noi e loro, sono comunque sudditi preziosi da sfruttare. [ROOT.GetCountry.Custom('IT_BURGHERS_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] di quel popolo sono forse tra i più ricchi della regione. Ciò che faremo con loro potrebbe tuttavia cambiare il modo in cui ci vedranno in futuro."
 flavor_vij.26.a: "Siamo conquistatori, non barbari."
 flavor_vij.26.b: "La loro ricchezza ci appartiene."
 VIJ_EVERY_TAMIL_POP_GAINS_SATISFACTION_BUT_LOSES_CONTROL: "Tutti i [pops|e] [ShowCultureName('tamil')] otterranno [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] di [pop_satisfaction|e], ma ogni località con almeno #Y 5%#! di [pops|e] [ShowCultureName('tamil')] perderà [ShowNamedValue('control_mild_penalty')|+=2%] di [control|e]."
 VIJ_EVERY_TAMIL_POP_LOSES_SATISFACTION: "Tutti i [pops|e] [ShowCultureName('tamil')] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]."

 flavor_vij.27.title: "Migrazione del Popolo Vadugan"
 flavor_vij.27.entry: "$flavor_vij.27.title$"
 flavor_vij.27.desc: "Con le nostre conquiste in [ShowAreaName('tamil_land_area')] e con il popolo [ShowCultureName('telugu')] in cerca di una vita migliore, essi hanno deciso di migrare a sud, dove risiede il popolo [ShowCultureName('tamil')]. Chiamati popolo Vadugan, hanno causato instabilità nelle terre [ShowCultureNameWithNoTooltip('tamil')]. Forse possiamo tentare di mitigare parte di questa migrazione per garantire la stabilità culturale."
 flavor_vij.27.a: "Lasciamo che si spostino a sud."
 flavor_vij.27.b: "Possiamo cercare di limitarli."
 VIJ_EVERY_TAMIL_POP_GAINS_20_SATISFACTION: "Tutti i [pops|e] [ShowCultureName('tamil')] otterranno [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] di [pop_satisfaction|e]."

 flavor_vij.28.title: "Ampliare il $ranganathaswamy_temple$"
 flavor_vij.28.entry: "$flavor_vij.28.title$"
 flavor_vij.28.desc: "Con i conflitti avvenuti in $india$, il tempio di [ShowLocationName('srirangam')] è stato completamente devastato. I governanti [ShowReligionGroupAdjective('muslim')] non vi hanno mai prestato attenzione, ma ora che controlliamo questo luogo sacro, forse possiamo restaurare il tempio al suo antico splendore."
 flavor_vij.28.historical_info: "Costruito dal sovrano Chola Dharmavarma, il Tempio di Ranganathaswamy è il più antico complesso templare sopravvissuto nell'India meridionale. Sebbene abbia goduto di prosperità nei suoi primi anni, nel XIV secolo il generale musulmano Malik Kafur lo saccheggiò e inviò la sua icona d'oro a Delhi. Ci vollero sei decenni perché il tempio venisse recuperato, e fu sotto il dominio di Vijayanagara che il tempio conobbe 200 anni di prosperità, poiché l'Impero si concentrò sulle riparazioni e sulla reinstallazione delle sue antiche icone di Vishnu e Lakshmi."
 flavor_vij.28.a: "Per [ShowGodNameWithNoTooltip('vishnu_god')], ricostruiamolo!"
 flavor_vij.28.b: "Non vale lo sforzo e il denaro."

 flavor_vij.29.title: "Protettori delle Pratiche [ShowReligionAdjectiveWithNoTooltip('hindu')]"
 flavor_vij.29.entry: "Protettori delle Pratiche Indù"
 flavor_vij.29.desc: "Con la nostra ascesa al potere nell'$india$ meridionale, restiamo uno dei pochi grandi reami [ShowReligionAdjective('hindu')] che si ergono come baluardo contro le orde [ShowReligionGroupAdjective('muslim')]. Tuttavia, anziché guardare all'esterno, forse è ora di guardare all'interno, alle diverse sette e fedi all'interno di [ROOT.GetCountry.GetName]. Anziché essere un faro di speranza solo per il popolo [ShowReligionAdjectiveWithNoTooltip('hindu')], possiamo cercare di proteggere i diritti di altre fedi."
 flavor_vij.29.a: "Proteggiamo tutti i nostri cittadini [ShowReligionAdjectiveWithNoTooltip('hindu')]."
 flavor_vij.29.b: "La libertà di pratica religiosa ha la priorità."

 flavor_vij.30.title: "Complesso Templare di Tirupati-Tirumala"
 flavor_vij.30.entry: "$flavor_vij.30.title$"
 flavor_vij.30.desc: "Forse il più grande tempio delle nostre terre, il grande tempio di Venkateshwara e il connesso tempio di Tirupati sono sempre più legati ai governanti del nostro stato. Nel corso degli anni è passato da importante luogo di pellegrinaggio a uno dei grandi templi dell'$india$. Il tempio è sostenuto dalle donazioni di innumerevoli tesori e da oltre quaranta villaggi che gli forniscono cibo e reddito. Non dovremmo tuttavia accontentarci di questo. Aumentando il nostro sostegno, fornendogli ancora più villaggi e donazioni, potremmo garantire che diventi il più grande tempio di tutta l'$india$ meridionale."
 flavor_vij.30.historical_info: "Sebbene il Tempio di Venkateswara a Tirumala esista fin dai tempi antichi, fu durante il controllo dell'Impero Vijayanagara che poté prosperare intensamente. L'Imperatore Krishnadevaraya fece frequenti donazioni, che permisero di dorare il santuario interno, e commissionò persino una statua di sé stesso al suo interno."
 flavor_vij.30.a: "Facciamo donazioni lussuose."
 flavor_vij.30.b: "Manteniamo più modesti i nostri contributi."

 flavor_vij.31.title: "[target_location.GetNameWithNoTooltip]"
 flavor_vij.31.entry: "Il Porto di Pazhaverkadu"
 flavor_vij.31.desc: "La costa settentrionale del Coromandel e in particolare la [target_location.GetRank.GetName] di [target_location.GetName] sono vitali per il nostro reame. È attraverso questa striscia costiera che tutte le merci dell'oriente raggiungono le anime esigenti della nostra capitale. Mentre la zona si riprende dalla nostra occupazione e la nostra [ROOT.GetCountry.GetFlavorRank] continua a crescere, il porto è entrato in un'età dell'oro."
 flavor_vij.31.a: "Che il porto prosperi!"
 flavor_vij.31.b: "La sua crescita naturale è sufficiente."

 flavor_vij.32.title: "Disordini a [ShowProvinceDefinitionNameWithNoTooltip('mysore_plateau')]"
 flavor_vij.32.entry: "Disordini sull'Altopiano di Mysore"
 flavor_vij.32.desc: "Nonostante il nostro dominio su [ShowProvinceDefinitionName('mysore_plateau')] abbia portato ordine nella zona, la gente del luogo non è ancora soddisfatta di noi. Ha espresso la propria opposizione e si prepara a una rivolta."
 flavor_vij.32.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 flavor_vij.32.a.entry: "$common_string_curses$"
 flavor_vij.32.b: "Dovremmo cercare di limitare questi disordini."
 VIJ_ALL_MYSORE_POPS_LOSE_50_SATISFACTION: "Tutti i [pops|e] a [ShowProvinceDefinitionName('mysore_plateau')] perderanno [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e]."
 VIJ_ALL_MYSORE_POPS_LOSE_20_SATISFACTION_AND_10_CONTROL: "Tutti i [pops|e] a [ShowProvinceDefinitionName('mysore_plateau')] perderanno [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e] e ogni [location|e] di quella zona perderà [ShowNamedValue('control_mild_penalty')|+=2%] di [control|e]."

 flavor_vij.33.title: "Fortificare [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_vij.33.entry: "$flavor_vij.33.title$"
 flavor_vij.33.desc: "[ROOT.GetCountry.Custom('IT_La')|U][ROOT.GetCountry.GetName] è colma di molti grandi forti e castelli. Forti come quelli di [target_location.GetName] e [target_location2.GetName] hanno permesso alla popolazione di vivere nella prosperità, poiché è protetta da qualsiasi razzia o attacco. Ciò ha portato questi luoghi a nuove vette."
 flavor_vij.33.a: "Lasciamo che prosperino."
 flavor_vij.33.b: "Usiamoli per controllare più efficacemente le aree circostanti."
 flavor_vij.33.c: "Investiamo ancora di più in queste località."
 VIJ_ALL_DEFENSE_PROVINCES_GAIN_DEVELOPMENT: "Ogni località che ha un [building|e] #Y Difensivo#! otterrà [ShowNamedValue('development_mild_bonus')|+=] di [development|e]."
 VIJ_ALL_DEFENSE_PROVINCES_GAIN_CONTROL: "Ogni località che ha un [building|e] #Y Difensivo#! otterrà [ShowNamedValue('control_mild_bonus')|+=2%] di [control|e]."

 flavor_vij.1000.title: "I Templi di [target_country.Custom('IT_Di')][target_country.GetNameWithNoTooltip]"
 flavor_vij.1000.entry: "Templi Indù sotto Dominio Musulmano"
 flavor_vij.1000.desc: "Il sovrano [ShowReligionGroupAdjective('muslim')] di [target_country.GetName] controlla uno dei nostri siti spirituali più venerati. Sebbene ciò possa essere un accordo accettabile, è troppo instabile per restare passivi in materia. Dovremmo esigere la loro sottomissione e preparare un'invasione per garantire che questi templi non vengano mai profanati dai miscredenti."
 flavor_vij.1000.historical_info: "Sebbene gran parte dell'India possa essere dominata dagli Indù in termini di popolazione, la maggior parte dei loro templi più sacri si trova nella parte meridionale del subcontinente. Questo, insieme all'instabilità dei Sultanati musulmani nella zona, permise a Harihara e Bukka Raya di consolidare queste aree, fungendo da baluardo contro i Sultanati settentrionali."
 flavor_vij.1000.a: "È tempo di passare all'offensiva."
 flavor_vij.1000.b: "Dovremmo astenerci da simili ostilità."
 flavor_vij.1001.title: "[ROOT_country.GetNameWithNoTooltip] esige la sottomissione"
 flavor_vij.1001.desc: "[ROOT_country.GetLongName] esige la nostra sottomissione! Se non ci sottomettiamo, ci minaccia con un'invasione. La sua debole scusa per questa aggressione sembrano essere i templi sacri [ShowReligionAdjective('hindu')] nel nostro paese."
 flavor_vij.1001.a: "Che vengano."
 flavor_vij.1001.b: "Dovremmo sottometterci al loro dominio."
 flavor_vij.1002.title: "[target_country.GetNameWithNoTooltip] rifiuta"
 flavor_vij.1002.entry: "Il Vicino Musulmano Rifiuta"
 flavor_vij.1002.desc: "Purtroppo, sebbene con poca sorpresa, [target_country.GetName] rifiuta la nostra richiesta di sottomissione."
 flavor_vij.1002.a: "Preparate l'esercito!"
 flavor_vij.1003.title: "[target_country.GetNameWithNoTooltip] cede"
 flavor_vij.1003.entry: "Il Vicino Musulmano Cede"
 flavor_vij.1003.desc: "[target_country.GetName] ha accettato la nostra richiesta di sottomissione e agirà ora ufficialmente come nostro vassallo."
 flavor_vij.1003.a: "Una piacevole sorpresa."

 flavor_vij.1100.title: "Voci di una Ribellione [ShowCultureNameWithNoTooltip('tamil')]"
 flavor_vij.1100.entry: "Voci di una Ribellione Tamil"
 flavor_vij.1100.desc: "Sebbene abbiamo portato i [ShowCultureName('tamil')] sotto il nostro dominio, molti di loro non sono soddisfatti di noi. Si sono diffusi mormorii secondo cui, sotto la guida di [target_character2.GetName], si sta addensando una tempesta pronta a gettare [ROOT.GetCountry.GetName] nella guerra civile. I nostri consiglieri ci supplicano di esiliare [target_character2.GetHerHim], ma se lo facessimo rischieremmo di irritare il nostro popolo [ShowCultureName('tamil')]."
 flavor_vij.1100.a: "Ci libereremo di questo tradimento!"
 VIJ_REVOLT_IN_15_YEARS_UNLESS_IF_WE_MANAGE_TO_KEEP_TAMILS_SATISFIED: "A meno che non riusciamo a ottenere #G 80%#! di [control|e] o di [pop_satisfaction|e] in [ShowAreaName('tamil_land_area')], o a esiliare il #Y Capo della Ribellione Tamil#! entro 20 anni, le terre [ShowCultureName('tamil')] si ribelleranno."

 flavor_vij.1101.title: "$flavor_vij.1100.title$"
 flavor_vij.1101.desc.a: "Con le nostre politiche per contenere la ribellione [ShowCultureName('tamil')], abbiamo pacificato la maggior parte di questi ribelli. Sono di nuovo soddisfatti del nostro dominio e, cosa ancora migliore, hanno catturato il traditore che aveva organizzato questa ribellione. [target_character.GetName] è stato ora catturato dalle nostre forze, e tutti sono impazienti di bandire [target_character2.GetHerHim]."
 flavor_vij.1101.desc.b: "Avendo fallito nel contenere la ribellione [ShowCultureName('tamil')], il capo di questa orda traditrice mostra il [target_character.GetHerHis] volto. [target_character.GetName] aveva tramato per ottenere sostegno e ritagliarsi un [target_character.GetHerHis] reame indipendente da [ROOT.GetCountry.GetName], [target_character.GetHeShe] ha negoziato con il popolo [ShowCultureNameWithNoTooltip('tamil')]. Ciò che resta ora è schiacciare questi ribelli."
 flavor_vij.1101.a: "Via con [target_character.GetHerHim]! I traditori non appartengono a [ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_vij.1101.a.entry: "Via con lui! I traditori non appartengono al nostro paese!"
 flavor_vij.1101.b: "All'armi, uomini! Schiacciamo [target_character.GetNameWithNoTooltip] e la [target_character.GetHerHis] marmaglia!"
 flavor_vij.1101.b.entry: "All'armi, uomini! Schiacciamo lui e la sua marmaglia!"
 tamil_uprising: "Sollevazione Tamil"
 VIJ_ALL_TAMILS_LOSE_90_SATISFACTION: "Tutti i [pops|e] [ShowCultureName('tamil')] perderanno [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e]."

 flavor_vij.1102.title: "$flavor_vij.1100.title$"
 flavor_vij.1102.desc: "Con il sostegno della [ROOT.GetCountry.GetGovernment.GetCourtTitle], siamo riusciti a catturare il capo della ribellione [ShowCultureName('tamil')]. [target_character.GetName] e le [target_character.GetHerHis] ambizioni di ritagliarsi il [target_character.GetHerHis] reame sono state schiacciate, ed è ora esiliato da [ROOT.GetCountry.GetName]. Tuttavia, il popolo [ShowCultureNameWithNoTooltip('tamil')] non dimenticherà l'esilio del proprio capo..."
 flavor_vij.1102.a: "Per proteggere [ROOT.GetCountry.GetNameWithNoTooltip], era necessario."
 flavor_vij.1102.a.entry: "Per proteggerci, era necessario."
 VIJ_EVERY_TAMIL_POP_LOSES_10_SATISFACTION: "Tutti i [pops|e] [ShowCultureName('tamil')] perderanno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]."

 flavor_vij.1103.title: "$flavor_vij.1100.title$"
 flavor_vij.1103.entry: "$flavor_vij.1103.title$"
 flavor_vij.1103.desc: "[target.GetName] è deceduto. Con ulteriori indagini, e con la reazione della popolazione [ShowCultureName('tamil')], la ribellione è ora quasi pacificata. I loro sforzi per staccarsi dal nostro reame sono stati stroncati."
 flavor_vij.1103.a: "Tutta [ROOT.GetCountry.GetNameWithNoTooltip] tira un sospiro di sollievo."
 flavor_vij.1103.a.entry: "Tutta $VIJ$ tira un sospiro di sollievo."
 VIJ_EVERY_TAMIL_POP_GAINS_10_SATISFACTION: "Tutti i [pops|e] [ShowCultureName('tamil')] otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]."

 flavor_vij.1200.title: "Un Nemico [ShowReligionGroupAdjectiveWithNoTooltip('muslim')]"
 flavor_vij.1200.entry: "Spingere a Nord, la Rivalità Dinamica Bahmanide-Vijayanagar"
 flavor_vij.1200.desc: "Con il declino dell'influenza di [GetCountry('DLH').GetName] in $india$ e la piena liberazione di [ShowRegionName('deccan_region')], sono sorte nuove potenze. Una di queste è [target_country.GetName], che si pone come nostro principale avversario per l'unificazione dell'$india$."
 flavor_vij.1200.a: "Prepariamoci a schiacciarli."
 flavor_vij.1200.b: "Non siamo ancora pronti..."

 flavor_vij.1201.title: "$flavor_vij.1200.title$"
 flavor_vij.1201.desc: "[target_country2.GetName] ha elaborato piani per espandersi nelle nostre terre, pronta a radere al suolo [ROOT.GetCountry.GetCapital.GetName]. Dobbiamo proteggere il nostro reame!"
 flavor_vij.1201.a: "Siamo pronti a combattere!"

 flavor_vij_1200_shared_title: "Caduta di [target_location.GetNameWithNoTooltip]"
 flavor_vij_1200_shared_desc: "La capitale del nostro rivale, [target_location.GetName], è caduta dopo un lungo assedio. La sua popolazione è ora alla nostra mercé. Potremmo saccheggiare la [target_location.GetRank.GetName] ed estorcerne le ricchezze per noi, oppure potremmo rispettarla e svilupparla a nuove vette."
 flavor_vij_1200_response_shared_desc: "[target_country.GetName] ha raso al suolo la nostra capitale. Non rispettando la popolazione locale, ha deciso di umiliarla, causando instabilità in [ROOT.GetCountry.GetName]."
 flavor_vij_1200_shared_opt_1: "Radiamola al suolo!"
 flavor_vij_1200_shared_opt_2: "Preserviamo [target_location.GetNameWithNoTooltip]."

 flavor_vij.1202.title: "$flavor_vij_1200_shared_title$"
 flavor_vij.1202.desc: "$flavor_vij_1200_shared_desc$"
 flavor_vij.1202.a: "$flavor_vij_1200_shared_opt_1$"
 flavor_vij.1202.b: "$flavor_vij_1200_shared_opt_2$"

 flavor_vij.1203.title: "$flavor_vij_1200_shared_title$"
 flavor_vij.1203.desc: "$flavor_vij_1200_response_shared_desc$"
 flavor_vij.1203.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 flavor_vij.1203.a.entry: "$common_string_curses$"

