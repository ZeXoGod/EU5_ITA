l_english:
 flavor_pis.1.entry: "$flavor_pis.1.title$"
 flavor_pis.1.title: "Il Declino [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_pis.1.desc: "La un tempo gloriosa [ROOT.GetCountry.GetLongName] non è più il gigante che era un tempo in [ShowRegionName('italy_region')]. La sua influenza si estendeva da [ShowRegionName('iberia_region')] fino a [ShowRegionName('crescent_region')], ma la flotta [GetCountry('GEN').Custom('IT_ADJ_FS')] bloccò per diversi anni il nostro prezioso [ShowBuildingTypeName('porto_pisano')] a [ShowLocationName('pisa')], portando al suo declino. A peggiorare le cose, gli eserciti [GetCountry('ARA').Custom('IT_ADJ_MP')] ci hanno strappato [ShowAreaName('sardinia_area')].\n\nCiò ha lasciato [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank] in uno stato indebolito. La nostra potente flotta è ora un'ombra della sua antica gloria, con altri stati [ShowCultureGroupName('italian_group')] che ci eclissano su questo fronte. La nostra influenza commerciale viene lentamente soppiantata da rivali più affidabili, e [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank] è impantanato nella decadenza politica.\n\nInvece di restare inattivi e lasciare che la storia faccia il suo corso, dovremmo concentrarci sulla ricostruzione, raccogliendo quante più forze possibili per vendicarci di chi è responsabile della nostra situazione attuale."
 flavor_pis.1.a: "Finché [target_character.GetNameWithNoTooltip] regna, non vacilleremo!"
 flavor_pis.1.a.entry: "Non vacilleremo!"

 flavor_pis.2.title: "Caduta di [target.GetNameWithNoTooltip]"
 flavor_pis.2.desc: "Gli eserciti [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] sono emersi ancora una volta vittoriosi, catturando [target.Custom('IT_ART_LOCATION')][target.GetRank.GetName] di [target.GetName]. Senza dimenticare la distruzione del suolo a [ShowLocationName('pisa')] e il blocco che ha affamato la popolazione lì, le truppe e il loro comandante si preparano a radere al suolo [target.Custom('IT_ART_LOCATION')][target.GetRank.GetNameWithNoTooltip], cospargere di sale il suo terreno e riportare la ricchezza nella nostra capitale."
 flavor_pis.2.a: "Occhio per occhio!"
 flavor_pis.2.b: "Non c'è bisogno di distruggere il luogo."
 pis_allow_upgrade_of_porto_pisano: "Il [ShowBuildingTypeName('porto_pisano')] a [ShowLocationName('pisa')] può essere potenziato di un livello extra"

 flavor_pis.3.entry: "$flavor_pis.3.title$"
 flavor_pis.3.title: "Riconquista di [ShowAreaNameWithNoTooltip('sardinia_area')]"
 flavor_pis.3.desc: "Le nostre forze hanno finalmente riconquistato [ShowAreaName('sardinia_area')]!\n\nNumerosi soldati, membri del [ROOT.GetCountry.GetGovernment.GetCourtTitle], e [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno festeggiato questo traguardo, pronti a ristabilire la loro influenza lì. Sebbene siano sparsi in tutto il paese, molti hanno iniziato a trasferirsi a [target_location.GetName], stabilendola come capitale dell'area.\n\nCiò ha portato a numerose proposte per lo sviluppo del [target_location.GetRank.GetName], garantendo il successo di qualsiasi colono che desideri riportare ricchezza al [ShowBuildingTypeName('porto_pisano')]. Tuttavia, alcuni ritengono che la nostra influenza non dovrebbe concentrarsi in un unico luogo, e che l'intera isola abbia bisogno di sostegno."
 flavor_pis.3.a: "[target_location.GetNameWithNoTooltip] sarà la gemma di [ShowAreaNameWithNoTooltip('sardinia_area')]."
 flavor_pis.3.a.entry: "Questo luogo sarà la gemma di [ShowAreaNameWithNoTooltip('sardinia_area')]."
 flavor_pis.3.b: "Garantiamo la prosperità dell'intera isola."
 pis_all_of_sardinia_gains_development_and_prosperity: "Ogni [location|e] in [ShowAreaName('sardinia_area')] che è di nostra proprietà otterrà [ShowNamedValue('development_mild_bonus')|+=2%] [development|e] e [ShowNamedValue('prosperity_mild_bonus')|+=2%] [prosperity|e]"

 flavor_pis.4.entry: "$flavor_pis.4.title$"
 flavor_pis.4.title: "Ampliamento della [ShowWorkOfArtNameWithNoTooltip('leaning_tower_of_pisa')]"
 flavor_pis.4.desc: "La [ShowWorkOfArtName('leaning_tower_of_pisa')] è completa, ma sono in molti nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] a desiderare un ampliamento del suo interno.\n\n[target_character.GetName] vuole utilizzare elementi gotici per il campanile, fondendoli con lo stile romanico che la torre già possiede. Un simile compito non può essere svolto gratuitamente, come [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank] sa bene, ma è qualcosa che ci aiuterebbe a rafforzare il nostro prestigio in [ShowRegionName('italy_region')]."
 flavor_pis.4.a: "Ampliamo la torre."
 flavor_pis.4.b: "È già completa; qualsiasi altra cosa è superflua."

 flavor_pis.5.entry: "$flavor_pis.5.title$"
 flavor_pis.5.title: "Un Cambio di Rotta"
 flavor_pis.5.desc: "Sebbene l'ambizione di riconquistare la nostra antica gloria nel Mediterraneo stia lentamente svanendo, ci ha portato nuove idee su come ristabilire il nostro dominio su [ShowRegionName('italy_region')]. Piuttosto che dipendere da mercanti e marinai, si suggerisce di iniziare a utilizzare la nostra ricchezza per campagne militari, assoldando numerosi condottieri e comandando loro di conquistare le città vicine.\n\nTali idee non sono popolari tra i più esperti, che preferiscono il piano di ricostruire il [ShowBuildingTypeName('porto_pisano')], ma coloro più desiderosi di dimostrare il proprio valore sono a favore di una politica espansionista finché non avremo eclissato le città-stato rivali."
 flavor_pis.5.a: "Andiamo avanti e conquistiamo!"
 flavor_pis.5.b: "La guerra, a cosa serve? Il commercio è ciò che ci darà potere."
 pis_gain_casus_belli_on_every_neighbor_country_in_italy: "Se non abbiamo già un [casus_belli|e], otterremo il [casus_belli|e] [ShowCasusBelliName('cb_conquer_province')] sulla [province|e] [capital|e] di ogni [country|e] vicino"

 flavor_pis.6.title: "Gioco del Ponte"
 flavor_pis.6.desc.a: "Il recente festival del Gioco del Ponte a [ShowLocationName('pisa')] ha portato all'ascesa di un promettente [target_character.GetWomanMan]. Nel tiro alla fune svoltosi quel giorno, [target_character.GetName] ha dimostrato grande capacità di comando, ordinando ai soldati di spingere il carro sul Ponte di Mezzo. Ciò ha guadagnato a [target_character.GetHerHim] il rispetto del popolo, portando forse a pensare che [target_character.GetSheHe] abbia la stoffa di un vero leader."
 flavor_pis.6.desc.b: "[ShowLocationName('pisa')] ha recentemente ospitato il Gioco del Ponte, e la popolazione locale si è divertita per l'occasione. La parata lungo il fiume Arno ha attirato molti cittadini di ogni estrazione sociale a prendervi parte, favorendo l'unità tra il popolo [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] — in particolare, i più influenti, che hanno messo da parte le loro divergenze per godersi questa tradizione annuale."
 flavor_pis.6.desc.c: "Molte persone da tutta [ShowContinentName('europe')] si sono radunate a [ShowLocationName('pisa')] per il festival del Gioco del Ponte. Sono rimaste piuttosto colpite dallo spettacolo della parata lungo il fiume Arno, e coloro con esperienza militare si sono uniti al tiro alla fune, desiderosi di portare la vittoria alla propria squadra. Sebbene alcuni si siano limitati a osservare i festeggiamenti, hanno riportato nei loro paesi la notizia di questa gioiosa esperienza che [ROOT.GetCountry.GetName] ospita ogni anno."
 flavor_pis.6.a: "Anche se temporanea, godiamoci questa stabilità."
 flavor_pis.6.b: "Le storie del festival raggiungeranno ogni angolo."
 flavor_pis.6.c: "Promuoviamo [target_character.GetNameWithNoTooltip]."
 flavor_pis.6.c.entry: "Promuoviamo questo personaggio."
 flavor_pis.6.d: "Non permetteremo a nessuno a caso di servire il [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_pis.6.d.entry: "Non permetteremo a nessuno a caso di servire il paese."

 flavor_pis.1000.entry: "$flavor_pis.1000.title$"
 flavor_pis.1000.title: "Nuova Leadership"
 flavor_pis.1000.desc: "La crisi si è impadronita [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName].\n\nUn debito dilagante, il declino economico e l'instabilità hanno spinto molti a mettere in dubbio l'autorità di [target_character.GetName], che guida un governo fragile e in disperato bisogno di sostegno straniero. Piuttosto che assistere al suo crollo, i ricchi e gli influenti si sono riuniti per trovare un nuovo candidato che governi [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank]. Alcuni hanno proposto la [target_country.GetGovernment.GetRuler.GetDynasty.GetName] [target_country.Custom('IT_Di')][target_country.GetName], sperando che possa sostenerci economicamente. Altri preferiscono la [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] [target_country2.Custom('IT_Di')][target_country2.GetName], e altri ancora sostengono che la [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] [target_country3.Custom('IT_Di')][target_country3.GetName] sia la scelta migliore — e che saremmo sciocchi a non invitarli a diventare i nostri nuovi governanti."
 flavor_pis.1000.a: "Inviamo una lettera [target_country.Custom('IT_Alla')][target_country.GetNameWithNoTooltip]."
 flavor_pis.1000.a.entry: "Inviamo loro una lettera."
 pis_offer_rulership_to_country1: "Offriremo il governo [target_country.Custom('IT_Alla')][target_country.GetName]. Se accetteranno, accadrà quanto segue:"
 pis_a_member_of_target_country_dynasty_becomes_ruler: "Un membro della [dynasty|e] [target_country.GetGovernment.GetRuler.GetDynasty.GetName] diventerà il nostro [ruler|e]"
 flavor_pis.1000.b: "È meglio se scegliamo [target_country2.GetNameWithNoTooltip]."
 flavor_pis.1000.b.entry: "È meglio se scegliamo un altro paese."
 pis_offer_rulership_to_country2: "Offriremo il governo [target_country2.Custom('IT_Alla')][target_country2.GetName]. Se accetteranno, accadrà quanto segue:"
 pis_a_member_of_target_country2_dynasty_becomes_ruler: "Un membro della [dynasty|e] [target_country2.GetGovernment.GetRuler.GetDynasty.GetName] diventerà il nostro [ruler|e]"
 flavor_pis.1000.c: "I governanti [target_country3.Custom('IT_Di')][target_country3.GetNameWithNoTooltip] sono la scelta più adatta."
 flavor_pis.1000.c.entry: "I governanti di questa alternativa sono la scelta più adatta."
 pis_offer_rulership_to_country3: "Offriremo il governo [target_country3.Custom('IT_Alla')][target_country3.GetName]. Se accetteranno, accadrà quanto segue:"
 pis_a_member_of_target_country3_dynasty_becomes_ruler: "Un membro della [dynasty|e] [target_country3.GetGovernment.GetRuler.GetDynasty.GetName] diventerà il nostro [ruler|e]"
 flavor_pis.1000.d: "Non venderemo [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] ai nostri rivali."

 flavor_pis.1001.title: "$flavor_pis.1000.title$"
 flavor_pis.1001.desc: "La crisi politica [from_country.Custom('IT_In')][from_country.GetName] sta raggiungendo il suo apice, poiché messaggeri che rappresentano la loro élite si sono rivolti al nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] con richieste di aiuto. Chiedono che [ROOT.GetCountry.GetGovernment.GetRuler.GetName] li aiuti stabilendo [target_character.GetName] come nuovo governante [from_country.Custom('IT_DEL_RANGO')][from_country.GetFlavorRank], e che a [target_character.GetName] venga fornita assistenza finanziaria."
 flavor_pis.1001.a: "Un ottimo modo per espandere l'influenza della [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]."
 flavor_pis.1001.a.entry: "Un ottimo modo per espandere la nostra influenza."
 flavor_pis.1001.b: "Simili legami ci trascinerebbero solo verso il basso."

 flavor_pis.1100.entry: "$flavor_pis.1100.title$"
 flavor_pis.1100.title: "In Supremae Dignitatis"
 flavor_pis.1100.desc: "Gli studiosi di [ShowLocationName('pisa')] sono rinomati in tutta [ShowRegionName('italy_region')], eppure [ROOT.GetCountry.GetName] è priva di un'istituzione di apprendimento formalmente riconosciuta. [ROOT.GetCountry.Custom('IT_CLERGY_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ha proposto che [target_character.GetName] faccia richiesta a [target_character2.GetName] affinché [ShowLocationNameWithNoTooltip('pisa')] venga formalmente riconosciuta come Studium Generale, permettendo alle istituzioni accademiche autonome di prosperare."
 flavor_pis.1100.a: "Inviamo una delegazione a [GetCountry('PAP').GetCapital.GetNameWithNoTooltip]."
 flavor_pis.1100.a.entry: "Inviamo una delegazione a $PAP$."
 flavor_pis.1100.b: "Non abbiamo bisogno di immischiarci in nessuna politica [GetCountry('PAP').Custom('IT_ADJ_FS')]."
 flavor_pis.1100.b.entry: "Non abbiamo bisogno di immischiarci in nessuna politica $PAP_ADJ$."

 flavor_pis.1101.title: "$flavor_pis.1100.title$"
 flavor_pis.1101.desc: "[target_character.GetName] [from_country.Custom('IT_Di')][from_country.GetName] ci ha inviato una delegazione. I [target_character.GetHerHis|U] delegati parlano con grande entusiasmo dell'istruzione a [ShowLocationName('pisa')], e delle molte persone [from_country.Custom('IT_NEL_RANGO')][from_country.GetFlavorRank] che desiderano diventare studiosi. A tal fine, portano con sé una richiesta — la concessione di un sigillo di riconoscimento da parte [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName], che autorizzi la fondazione di un'istituzione di apprendimento formale all'interno del loro [from_country.GetFlavorRank]."
 flavor_pis.1101.a: "Hanno la nostra approvazione."
 flavor_pis.1101.b: "[ShowRegionNameWithNoTooltip('italy_region')] ha molti luoghi in cui le persone possono studiare."
