l_english:

 flavor_jap.1.title: "La Legge [ShowPolicyNameWithNoTooltip('sakoku_enabled')]"
 flavor_jap.1.entry: "The Sakoku Law" #NEW
 flavor_jap.1.desc: "La nostra decisione di isolarci dal mondo in generale attraverso la [ShowPolicyName('sakoku_enabled')] è finora riuscita a rendere più facile imporre il nostro controllo sulla popolazione. Tuttavia, è chiaro che ci stiamo ostacolando per quanto riguarda la diffusione di nuove idee e invenzioni. Mentre il mondo intorno a noi sta iniziando a globalizzarsi, vediamo i nostri vicini beneficiare di questo contatto con altre nazioni, mentre noi siamo lasciati a lottare. Forse è giunto il momento di ripensare la nostra politica?"
 flavor_jap.1.a: "Continuiamo a seguire la legge [ShowPolicyNameWithNoTooltip('sakoku_enabled')]."
 flavor_jap.1.b: "Abbandoniamo la legge [ShowPolicyNameWithNoTooltip('sakoku_enabled')]."

 flavor_jap.2.title: "Rangaku"
 flavor_jap.2.entry: "$flavor_jap.2.title$"
 flavor_jap.2.desc: "I mercanti [target_country.Custom('IT_Della')][target_country.GetName] sono ormai presenti sull'isola di Dejima a [target_location.GetName] da tempo, e il contatto tra la nostra gente e l'enclave è stato strettamente controllato. Ciononostante, le nostre due culture non possono fare a meno di scorgere barlumi dell'altra. Il popolo [target_country.GetAdjectiveWithNoTooltip] sembra conoscere cose che noi non conosciamo, in particolare nella medicina, ma anche nella scienza, nella produzione e nell'ingegneria meccanica. Alcuni dei nostri cittadini più ricchi hanno persino scelto di avvalersi del chirurgo [target_country.GetAdjectiveWithNoTooltip] nell'enclave, piuttosto che affidarsi ai medici locali.\n\nÈ chiaro che c'è molto che si potrebbe imparare da una maggiore interazione con questi visitatori dell'Occidente, se siamo disposti a rischiare di aprire le nostre province a loro un po' di più."
 flavor_jap.2.a: "Apri le nostre province alla conoscenza [target_country.GetAdjectiveWithNoTooltip]."
 flavor_jap.2.a.entry: "Open our provinces to their knowledge." #NEW
 flavor_jap.2.a.tt: "Sblocca la [government_reform|e] [ShowGovernmentReformName('jap_rangaku')]"
 flavor_jap.2.b: "Mantenete le nostre province chiuse."
 
 flavor_jap.3.title: "Nave Occidentale Naufragata"
 flavor_jap.3.entry: "$flavor_jap.3.title$"
 flavor_jap.3.desc: "A ship has reached the shores of [target_location.GetName] after a long and arduous voyage via what the crew calls the #italic Strait of Magellan#!. #italic De Liefde#! is apparently the only ship remaining out of a group of five, and it has only 24 sick and dying men out of an original crew of over a hundred, with less than 10 being able to stand.\n\nIts rich cargo of Western curiosities and military equipment fared far better than its crew, and should be worth quite a bit. What is more, one of the survivors, a navigator called [target_character.GetName], insists he be brought before our 'king'..." #NEW
 flavor_jap.3.historical_info: "William Adams fu il primo inglese a raggiungere il Giappone. Dopo aver servito sotto Sir Francis Drake durante la guerra con la Spagna, si unì alla Compagnia Olandese delle Indie Orientali in una spedizione attraverso lo Stretto di Magellano che, dopo molte traversie, riuscì ad arrivare in Giappone. Lui e il suo secondo ufficiale Jan Joosten furono inviati da Tokugawa Ieyasu ed entrarono al suo servizio, venendo entrambi nominati hatamoto, un alto rango samurai, e autorizzati a portare le due spade. Adams prese il nome di Miura Anjin e ricevette il territorio di Miura. Diresse la costruzione delle prime navi giapponesi in stile occidentale, così come varie missioni commerciali e diplomatiche tra il Giappone e l'Europa."
 flavor_jap.3.a: "Aiuta gli stranieri."
 flavor_jap.3.b: "Non fate nulla."
 flavor_jap.3.c: "We expect his arrival." #NEW
 flavor_jap.3.c.tt: "[target_country.Custom('IT_La')|U][target_country.GetName] deciderà cosa fare di [target_character.GetName]."

 flavor_jap.4.title: "$flavor_jap.3.title$"
 flavor_jap.4.desc: "$flavor_jap.3.desc$"
 flavor_jap.4.a: "[target_character.GetSheHe|U] è un individuo eccezionale."
 flavor_jap.4.a.entry: "He is a remarkable individual." #NEW
 flavor_jap.4.b: "Invital[target_character.Custom('IT_ART_O_A')] alla [target_shogun.GetGovernment.GetCourtTitle] [target_shogun.GetGovernment.GetAdjective]." 
 flavor_jap.4.b.entry: "Send him to the Shogunate court." #NEW

 flavor_jap.5.title: "[target_character.GetNameWithNoTooltip]"
 flavor_jap.5.entry: "William Adams" #NEW
 flavor_jap.5.desc: "[target_country.Custom('IT_ART_RANGO')|U][target_country.GetLongName] ha adempiuto al suo dovere e ci ha inviato [target_character.GetName] come aveva chiesto. Ora vediamo che [target_character.GetSheHe] è un individuo notevole, con una vasta conoscenza del mondo e del mare. [target_character.GetSheHe|U] sarà indubbiamente di grande servizio per noi se lo prenderemo sotto la nostra ala."
 flavor_jap.5.a: "[target_character.GetSheHe|U] sarà una valida aggiunta alla [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 flavor_jap.5.a.entry: "He will be a fine addition at court." #NEW
 flavor_jap.5.b: "Una curiosità, ma non ci serve a nulla."
 flavor_jap.5.b.entry: "A curiosity, but we have no use of him." #NEW
 
 flavor_jap.6.title: "Kirishitan"
 flavor_jap.6.entry: "$flavor_jap.6.title$"
 flavor_jap.6.desc: "I mercanti che abbiamo accolto hanno solo aumentato sempre di più la loro presenza nel nostro paese. Così facendo, hanno portato con sé i missionari di fede [ShowReligionAdjective('catholic')], sostenuti dai loro stati d'origine, i quali hanno prontamente iniziato a diffondere il [ShowReligionGroupName('christian')] e a convertire la popolazione locale in massa. Se non vengono fermati, questi Gesuiti, Francescani e Domenicani potrebbero rappresentare una minaccia significativa per lo [ShowReligionName('shinto')]."
 flavor_jap.6.a: "Ferma i missionari!"
 flavor_jap.6.a.tt: "Molti dei nostri [pops|e] si convertiranno al [ShowReligionName('catholic')] e perderanno [ShowNamedValue('pop_satisfaction_ultimate_penalty')] di [pop_satisfaction|e]"
 flavor_jap.6.b: "Lascia che diffondano la loro fede."
 
 flavor_jap.7.title: "[ShowLawNameWithNoTooltip('jap_buke_shohatto')]"
 flavor_jap.7.entry: "$jap_buke_shohatto$"
 flavor_jap.7.desc: "I signori feudali hanno fallito nel loro dovere ed è tempo di assicurarsi che conoscano le loro responsabilità. Il [ShowLawName('jap_buke_shohatto')] o 'I vari punti delle leggi per le case guerriere' è una risposta a ciò, sotto forma di una serie di editti progettati per illustrare le responsabilità e il comportamento dei samurai. Dovrebbe essere visto come un codice di condotta, una mera descrizione di ciò a cui un samurai ideale dovrebbe aspirare. Pertanto, l'idea è che i samurai stessi vogliano seguirli, piuttosto che essere costretti da noi a farlo."
 flavor_jap.7.a: "Imponete il [ShowLawNameWithNoTooltip('jap_buke_shohatto')] per l'intero [GetUniqueInternationalOrganization('japanese_shogunate').GetNameWithNoTooltip]."
 flavor_jap.7.a.entry: "Enforce [ShowLawNameWithNoTooltip('jap_buke_shohatto')] for the whole of the $japanese_shogunate$." #NEW
 flavor_jap.7.b: "Il codice è più simile a delle linee guida che a regole vere e proprie."
 flavor_jap.7.c: "Ignoratelo."

 flavor_jap.8.title: "[ShowLawNameWithNoTooltip('jap_buke_shohatto')]"
 flavor_jap.8.entry: "$jap_buke_shohatto$"
 flavor_jap.8.desc: "[target_character.GetName] ha emesso una raccolta di editti chiamata [ShowLawName('jap_buke_shohatto')] o 'I Vari Punti delle Leggi per le Case Guerriere'. Si tratta di una serie di editti, note su come i samurai dovrebbero comportarsi e quali dovrebbero essere le loro responsabilità. Tra questi, enumera le pratiche e le arti marziali in cui la classe guerriera dovrebbe impegnarsi, così come le attività che dovrebbe evitare. Fornisce inoltre linee guida per il corretto comportamento dei $daimyo$, stabilendo cosa è permesso e cosa no nei loro domini."
 flavor_jap.8.a: "Queste sono solo linee guida."
 
 flavor_jap.9.title: "Gokaidō"
 flavor_jap.9.entry: "$flavor_jap.9.title$"
 flavor_jap.9.desc: "Per aumentare il nostro controllo sullo [GetUniqueInternationalOrganization('japanese_shogunate').GetName], dovremmo controllare il movimento attraverso le cinque strade amministrate centralmente che collegano la nostra capitale con le province esterne. Le Cinque Vie o Gokaidō avranno stazioni di posta allestite lungo i percorsi più utilizzati dove i viaggiatori possono riposare e acquistare provviste."
 flavor_jap.9.historical_info: "Le Gokaidō erano cinque grandi autostrade nel Giappone durante il periodo Edo, che collegavano importanti città e regioni del paese. Queste strade giocarono un ruolo cruciale nel commercio, nella comunicazione e nel movimento delle persone. L'infrastruttura delle Gokaidō contribuì significativamente allo sviluppo economico e culturale del Giappone durante questo periodo."
 flavor_jap.9.a: "Istituisci il Gokaidō."
 flavor_jap.9.b: "Non ce n'è bisogno."
 
 flavor_jap.10.title: "Riforme Kyōhō"
 flavor_jap.10.entry: "$flavor_jap.10.title$"
 flavor_jap.10.desc: "Una proposta è stata presentata a [target_character.GetName] per le 'Riforme Kyōhō', una serie di politiche economiche volte a rendere [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetLongName] finanziariamente solvibile. Poiché i principi confuciani sono in una certa misura radicati nel nostro governo, e poiché essi sostengono che il denaro sia contaminante, sarà necessario accantonare alcuni di questi principi qualora dovessero ostacolare il processo di riforma. Le riforme includono la formazione di gilde di mercanti che consentiranno un maggiore controllo e tassazione, e pongono l'accento sulla frugalità."
 flavor_jap.10.a: "Riformeremo il commercio."
 flavor_jap.10.b: "L'esercito ha bisogno di riforme."
 flavor_jap.10.c: "Procedete con le riforme economiche originali."
 
 flavor_jap.11.title: "Genroku"
 flavor_jap.11.entry: "$flavor_jap.11.title$"
 flavor_jap.11.desc: "È una nuova età dell'oro per noi. Anni di pace interna [ROOT.GetCountry.Custom('IT_NEL_RANGO')][ROOT.GetCountry.GetLongName] hanno creato stabilità economica. Le arti e l'architettura fioriscono, la prosperità si sta diffondendo in tutta la terra e le nostre menti più brillanti stanno ottenendo notevoli progressi nella tecnologia e nella filosofia."
 flavor_jap.11.a: "Questo è il nostro momento!"
 
 flavor_jap.12.title: "Kokugaku"
 flavor_jap.12.entry: "$flavor_jap.12.title$"
 flavor_jap.12.desc: "Lo studio dominante dei testi del [ShowCultureGroupName('chinese_group')] Confuciano e di quello [ShowReligionGroupAdjective('buddhist')] ha portato a un declino dello studio del [ShowCultureGroupName('japanese_group')]. Alcuni studiosi hanno iniziato a ricercare i primi classici Giapponesi, criticando il moralismo repressivo dei pensatori confuciani e tentando di ristabilire la cultura [ShowCultureGroupNameWithNoTooltip('japanese_group')] prima dell'afflusso di modi di pensare e comportamenti stranieri. Si definiscono pensatori Kokugaku, o 'Studio Nazionale'."
 flavor_jap.12.a: "Sosterremo volentieri questi pensatori."

 flavor_jap.13.title: "$kakitsu_treaty$"
 flavor_jap.13.entry: "$flavor_jap.13.title$"
 flavor_jap.13.desc: "I predoni e i pirati traggono profitto dal saccheggio delle rotte commerciali, poiché lo trovano più vantaggioso per loro rispetto al praticare un commercio onesto. Per limitare le loro attività, gli inviati [target_kor.Custom('IT_Della')][target_kor.GetName] sono venuti da noi offrendo di firmare un trattato che ci consentirebbe diritti commerciali preferenziali con loro. Firmando il trattato, avremo i loro porti aperti ai nostri mercanti, ma dovremo aiutarli a combattere la pirateria nella regione."
 flavor_jap.13.historical_info: "Il Trattato di Kakitsu, chiamato anche Trattato di Gyehae, fu firmato nel 1443 tra la dinastia Joseon di Corea e Sō Sadamori del clan Sō di Tsushima. Il trattato giunse a seguito di un'invasione di Tsushima da parte delle forze Coreane nel tentativo di stroncare la pirateria che si era sviluppata lì e che minacciava costantemente il commercio intorno alla penisola Coreana. Sō Sadamori propose il trattato per stabilire una quantità fissa di navi che avrebbero potuto commerciare con la Corea, permettendo così al clan Sō di monopolizzare questo commercio."
 flavor_jap.13.a: "Firma il trattato."
 flavor_jap.13.b: "Questo trattato non è a nostro vantaggio."
 kakitsu_treaty: "Trattato di Kakitsu"

 # New DHE

 flavor_jap.101.title: "Proclamazione di [our_ruler.GetNameWithNoTooltip] come [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 flavor_jap.101.entry: "Proclamation of Takauji as Shōgun" #NEW
 flavor_jap.101.desc: "Con [go_daigo.GetName] ormai rovesciato, [our_ruler.GetName] ha provveduto a insediare se stesso come [ROOT.GetCountry.GetGovernment.GetRulerTitle] e a stabilire [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] come l'erede del dominio di Kamakura. Sebbene [go_daigo.GetNameWithNoTooltip] sia fuggito a [ShowLocationName('yoshino')], [koumyou.GetName] è stato elevato al posto di [go_daigo.GetNameWithNoTooltip] e ha ufficialmente sanzionato il dominio [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip] con [our_ruler.GetNameWithNoTooltip] al timone. Sebbene la maggior parte dei clan sostenga [our_ruler.GetNameWithNoTooltip], ci sono sussurri nell'ombra di coloro che cercherebbero di restaurare [go_daigo.GetNameWithNoTooltip] come imperatore."
 flavor_jap.101.a: "[ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip] guiderà il [ShowRegionNameWithNoTooltip('japan_region')] in questa nuova era!"
 flavor_jap.101.a.entry: "The dynasty will guide [ShowRegionNameWithNoTooltip('japan_region')] in this new era!" #NEW

 flavor_jap.102.title: "Nomina di [kou_no_moronao.GetNameWithNoTooltip]"
 flavor_jap.102.entry: "Appointment of Kō no Moronao as Shitsuji" #NEW
 flavor_jap.102.desc: "Seeking distinguished individuals to assist in the [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] stabilization of [ShowRegionName('japan_region')] along with further curtailing [GetCountry('STC').GetName] power, [our_ruler.GetName] has appointed [kou_no_moronao.GetName] as #italic Shitsuji#!. Though close supporters within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] support [our_ruler.GetNameWithNoTooltip], others have more quietly expressed discontent with [kou_no_moronao.GetNameWithNoTooltip], fearing he may disrupt the current power makeup within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] internal's politics." #NEW
 flavor_jap.102.a: "Concedetegli la carica di Shitsuji!"
 flavor_jap.102.b: "Evitate di dare potere a [kou_no_moronao.GetNameWithNoTooltip]."
 flavor_jap.102.b.entry: "Avoid empowering $Kou$ no $name_moronao$." #NEW
 flavor_jap.102.b_tt: "La carica di Shitsuji rimarrà vacante per evitare conflitti politici."
 jap_should_ko_clan_accept: "Se [GetCountry('KOU').Custom('IT_LA')][GetCountry('KOU').GetName] accetterà, otterremo i seguenti benefici:"
 jap_should_ko_clan_decline: "Se [GetCountry('KOU').Custom('IT_LA')][GetCountry('KOU').GetName] rifiuterà, otterremo invece i seguenti benefici:"
 jap_random_court_official_becomes_shitsuji: "Un funzionario apolitico esterno alla sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] diventerà Shitsuji."

 flavor_jap.103.title: "Tentato Assassinio di [kou_no_moronao.GetNameWithNoTooltip]"
 flavor_jap.103.entry: "Attempted Assassination of Moronao by Tadayoshi" #NEW
 flavor_jap.103.desc: "When initially appointed as Shitsuji, some within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] were rather displeased, seeing [kou_no_moronao.GetName] as a figure who would upend the makeup of the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. As time has passed, many of those fears have come to be realized, with news around [ROOT.GetCountry.GetCapital.GetName] that [kou_no_moronao.GetNameWithNoTooltip] survived an attempt on his life overnight!\n\nThe culprit of the attempt has emerged to be no other than [ask_tadayoshi.GetName], one of [kou_no_moronao.GetShortNameWithNoTooltip]'s fiercest political rivals in the [ROOT.GetCountry.GetGovernment.GetCourtTitle]." #NEW
 flavor_jap.103.a: "Rimuovi [ask_tadayoshi.GetNameWithNoTooltip] dalla sua [ROOT.GetCountry.GetGovernment.GetCourtTitle]!"
 flavor_jap.103.a.entry: "Remove Ashikaga $name_tadayoshi$ from court!" #NEW
 flavor_jap.103.b: "Risparmia [ask_tadayoshi.GetNameWithNoTooltip] per ora."
 flavor_jap.103.b.entry: "Spare Ashikaga $name_tadayoshi$ for now." #NEW
 flavor_jap.103.c: "Rimuovi [kou_no_moronao.GetNameWithNoTooltip] e nomina [ask_tadayoshi.GetNameWithNoTooltip] come Shitsuji."
 flavor_jap.103.c.entry: "Remove $Kou$ no $name_moronao$ and appoint Ashikaga $name_tadayoshi$ as Shitsuji." #NEW
 variable_jap_tadayoshi_may_rebel_tt: "Ashikaga Tadayoshi may Rebel" #NEW

 flavor_jap.104.title: "[ask_tadayoshi.GetNameWithNoTooltip] diserta a favore [GetCountry('STC').Custom('IT_Della')][GetCountry('STC').GetLongNameWithNoTooltip]"
 flavor_jap.104.entry: "Tadayoshi Defects to the South Court" #NEW
 flavor_jap.104.desc: "Though [our_ruler.GetName] exiled [ask_tadayoshi.GetName] from the [ROOT.GetCountry.GetGovernment.GetCourtTitle] for his attempted assassination of [kou_no_moronao.GetName], he has still managed to retain political allies. Greatly dissatisfied with [our_ruler.GetNameWithNoTooltip] continued rule, [ask_tadayoshi.GetNameWithNoTooltip] has fled [ROOT.GetCountry.GetCapital.GetName] along with his supporters to the [GetCountry('STC').GetLongName] to support [stc_ruler.GetName]. Knowing [ask_tadayoshi.GetNameWithNoTooltip] as a powerful individual, many officials within the [ROOT.GetCountry.GetGovernment.GetCourtTitle] have urged [our_ruler.GetNameWithNoTooltip] to not act brazenly in the face of [ask_tadayoshi.GetShortNameWithNoTooltip]'s betrayal, and have instead urged caution in taking further actions against the [GetCountry('STC').GetLongNameWithNoTooltip]." #NEW
 flavor_jap.104.a: "Dovremmo diffidare [GetCountry('STC').Custom('IT_Della')][GetCountry('STC').GetLongNameWithNoTooltip] ora che [ask_tadayoshi.GetNameWithNoTooltip] è fuggito."
 flavor_jap.104.a.entry: "We should be wary of $STC$ now that Ashikaga $name_tadayoshi$ has fled." #NEW
 variable_tadayoshi_to_south_court_tt: "Ashikaga Tadayoshi Defected to the Southern Court" #NEW
 south_court_will_become_stronger: "[ask_tadayoshi.GetName] will take many of his allies to the [GetCountry('STC').GetLongName], emboldening them." #NEW

 flavor_jap.105.title: "Arriva [ask_tadayoshi.GetNameWithNoTooltip]"
 flavor_jap.105.entry: "Arrival of Tadayoshi to the South Court" #NEW
 flavor_jap.105.desc: "In a surprising move, the rogue [ask_tadayoshi.GetName] has arrived to the [ROOT.GetCountry.GetLongName] seeking to swear fealty in support of [our_ruler.GetName]. Having grown dissatisfied with [jap_ruler.GetName]'s handling of [jap_ruler.GetHisHer] [GetCountry('JAP').GetGovernment.GetCourtTitle], [ask_tadayoshi.GetNameWithNoTooltip] has now expressed his support in restoring the [ROOT.GetCountry.GetLongNameWithNoTooltip] to the Chrysanthemum Throne." #NEW
 flavor_jap.105.a: "[ask_tadayoshi.GetNameWithNoTooltip] sarà fondamentale nei tempi a venire."
 flavor_jap.105.a.entry: "Ashikaga $name_tadayoshi$ will be crucial in the times ahead." #NEW

 flavor_jap.106.title: "Il [ymn_clan.GetNameWithNoTooltip] diserta a favore [GetCountry('STC').Custom('IT_DEL_RANGO')][GetCountry('STC').GetLongNameWithNoTooltip]"
 flavor_jap.106.entry: "Yamana Shugo Sides with Southern Court" #NEW
 flavor_jap.106.desc: "Terribili notizie sono giunte a [ROOT.GetCountry.GetCapital.GetName]: uno dei clan più influenti, [ymn_clan.Custom('IT_La')][ymn_clan.GetName] sotto [ymn_ruler.GetName], ha disertato a favore [GetCountry('STC').Custom('IT_DEL_RANGO')][GetCountry('STC').GetLongName]. Temendo una risposta dalle sue forze [ymn_clan.GetAdjectiveWithNoTooltip], molti nella sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno avanzato l'idea di lanciare un'offensiva anticipata contro [ymn_clan.Custom('IT_La')][ymn_clan.GetNameWithNoTooltip], sperando di distruggere qualsiasi piano [ymn_clan.Custom('IT_Della')][ymn_clan.GetNameWithNoTooltip] volto a rinforzare [GetCountry('STC').Custom('IT_ART_RANGO')][GetCountry('STC').GetLongNameWithNoTooltip]."
 flavor_jap.106.a: "Dobbiamo restare diffidenti nei confronti del [ymn_clan.GetLongNameWithNoTooltip]."
 flavor_jap.106.a.entry: "We must stay wary of the $YMN$." #NEW
 flavor_jap.106.b: "Ci muoveremo per abbatterli rapidamente!"
 flavor_jap.106.tt: "[GetCountry('YMN').Custom('IT_ART_RANGO')][GetCountry('YMN').GetLongName] sosterrà ora [GetCountry('STC').Custom('IT_ART_RANGO')][GetCountry('STC').GetLongName] a [GetCountry('STC').GetCapital.GetNameWithNoTooltip]."
 variable_supports_northern_court_tt: "The Clan Supports the Northern Court" #NEW

 flavor_jap.107.title: "Un Compromesso per la Sottomissione"
 flavor_jap.107.entry: "$flavor_jap.107.title$"
 flavor_jap.107.desc: "Tra alcuni dei più forti [ShowSpecialStatusName('shugo_daimyo')] del [ShowRegionName('japan_region')], [GetCountry('OUC').Custom('IT_La')][GetCountry('OUC').GetName] e [GetCountry('YMN').Custom('IT_La')][GetCountry('YMN').GetName] si sono dimostrati due clan piuttosto difficili con cui negoziare, esercitando spesso la loro considerevole influenza per respingere le richieste di [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName]. Tuttavia, cercando di integrare ulteriormente i clan nella più ampia burocrazia, [our_ruler.GetName] ha proposto un'offerta di autonomia [GetCountry('OUC').Custom('IT_Alla')][GetCountry('OUC').GetNameWithNoTooltip] e [GetCountry('YMN').Custom('IT_Alla')][GetCountry('YMN').GetNameWithNoTooltip], sotto forma di non interferenza all'interno dei domini dei rispettivi clan, a condizione che i [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] si sottomettano pienamente. Sebbene i negoziati siano apparsi promettenti, alcuni all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno esortato [our_ruler.GetNameWithNoTooltip] a non dare seguito all'accordo, temendo che esso possa solo incoraggiare i clan a lungo termine."
 flavor_jap.107.a: "Accogli il compromesso con [GetCountry('OUC').Custom('IT_La')][GetCountry('OUC').GetNameWithNoTooltip] e [GetCountry('YMN').Custom('IT_La')][GetCountry('YMN').GetNameWithNoTooltip]."
 flavor_jap.107.a.entry: "Welcome the compromise with $OUC$ and $YMN$." #NEW
 flavor_jap.107.b: "Rifiuta, non offriremo privilegi speciali a nessun [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')]!"

 flavor_jap.110.title: "Integrazione dei [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] nella Burocrazia"
 flavor_jap.110.entry: "Early Phase of Shugo integration into Bureaucracy" #NEW
 flavor_jap.110.desc: "Cercando di ridurre la separazione tra il dominio di [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] e l'autonomia dei [ShowSpecialStatusName('shugo_daimyo')], [our_ruler.GetName] ha iniziato a gettare le basi per integrare i clan più forti del [ShowRegionName('japan_region')] nella burocrazia del suo [ROOT.GetCountry.GetFlavorRank]. È attraverso queste riforme che [our_ruler.GetName] spera che i clan dominanti rimangano leali al suo [ROOT.GetCountry.GetFlavorRank] regnante, premiando al contempo coloro che si dimostrano una risorsa preziosa per il dominio di [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]."
 flavor_jap.110.a: "Attiriamo questi [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] nella burocrazia del suo [ROOT.GetCountry.GetFlavorRank]."
 flavor_jap.110.a.entry: "Let us draw these [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] into the realm bureaucracy." #NEW
 flavor_jap.110.b: "Adottiamo ulteriori misure per garantire la lealtà dei [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')]."

 flavor_jap.111.title: "Sistema del Consiglio Kanrei"
 flavor_jap.111.entry: "$flavor_jap.111.title$"
 flavor_jap.111.desc: "Tra le prime riforme per il rafforzamento della burocrazia del suo [ROOT.GetCountry.GetFlavorRank] vi è l'istituzione del nuovo sistema del consiglio Kanrei. Attraverso questo sistema riformato, [our_ruler.GetName] spera che i potenti [ShowSpecialStatusName('shugo_daimyo')] abbiano voce nell'amministrazione del [ShowRegionName('japan_region')], approfondendo al contempo i legami e le relazioni tra il suo [ROOT.GetCountry.GetFlavorRank] e i clan."
 flavor_jap.111.a: "Questo consiglio aiuterà l'autorità del suo [ROOT.GetCountry.GetGovernment.GetRulerTitle] sui [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')]."
 flavor_jap.111.a.entry: "This council shall help aid his authority over the [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')]." #NEW
 variable_jap_integrating_the_shugo_tt: "The Shugo are Being Integrated" #NEW

 flavor_jap.112.title: "Inclusione di clan Potenti nel Consiglio Kanrei"
 flavor_jap.112.entry: "$flavor_jap.112.title$"
 flavor_jap.112.desc: "Cercando di costituire i primi membri principali del neonato consiglio Kanrei, [our_ruler.GetName] ha guardato ai clan più forti di tutta il [ShowRegionName('japan_region')] nella speranza di costruire un solido rapporto politico per la stabilità futura. Su consiglio della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle], i membri hanno raccomandato [GetCountry('HSK').Custom('IT_La')][GetCountry('HSK').GetName], [GetCountry('SBA').Custom('IT_La')][GetCountry('SBA').GetName] e [GetCountry('HTK').Custom('IT_La')][GetCountry('HTK').GetName] affinché servano come primi membri anziani."
 flavor_jap.112.a: "Che possano inaugurare l'inizio di una nuova era!"
 flavor_jap.112.b: "Ridimensiona la loro autorità per garantire che non diventino troppo potenti."

 flavor_jap.113.title: "L'Espansione dello Shukurō Kaigi"
 flavor_jap.113.entry: "$flavor_jap.113.title$"
 flavor_jap.113.desc: "Mentre la fondazione iniziale del consiglio Kanrei ha visto tre potenti clan nominati nel consiglio, alcuni all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito che [our_ruler.GetName] provveda ad espanderlo. Nominando alcuni clan più deboli nello Shukurō Kaigi (consiglio degli anziani), si garantirebbe che altri [ShowSpecialStatusName('shugo_daimyo')] abbiano una voce più forte all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle], tenendo allo stesso tempo sotto controllo i [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] di rango più elevato al potere."
 flavor_jap.113.a: "Inseriamo alcuni dei clan più deboli nello Shukurō Kaigi."
 flavor_jap.113.b: "Non possiamo rischiare di rafforzare ulteriormente questi clan."
 variable_kanrei_council_shugo_dominant_family_tt: "A Dominant Family Leads the Kanrei Council" #NEW

 flavor_jap.114.title: "Samurai-Dokoro"
 flavor_jap.114.entry: "$flavor_jap.114.title$"
 flavor_jap.114.desc: "Con i crescenti casi di criminalità in tutta il [ShowRegionName('japan_region')], [our_ruler.GetName] si è mosso per rafforzare il #italic Samurai-Dokoro#! espandendolo al contempo affinché diventi una posizione di potere più forte all'interno [ROOT.GetCountry.Custom('IT_DEL_RANGO')][ROOT.GetCountry.GetLongName]. In quanto ufficio principale per la giustizia penale all'interno del [ShowRegionNameWithNoTooltip('japan_region')], alcuni all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno espresso favoritismo verso [GetCountry('IMG').Custom('IT_La')][GetCountry('IMG').GetName] per l'incarico, mentre altri suggeriscono che la posizione dovrebbe essere invece assegnata [replacement_clan.Custom('IT_Alla')][replacement_clan.GetName]."
 flavor_jap.114.a: "Assegniamo l'ufficio [GetCountry('IMG').Custom('IT_AL_RANGO')][GetCountry('IMG').GetLongNameWithNoTooltip]."
 flavor_jap.114.a.entry: "Award the office to $IMG$." #NEW
 flavor_jap.114.b: "Esercitate una maggiore autorità sull'ufficio con [replacement_clan.Custom('IT_La')][replacement_clan.GetNameWithNoTooltip]."
 flavor_jap.114.b.entry: "Leverage greater authority over the office with the clan." #NEW
 variable_jap_shukuro_kaigi_expanded_clans_tt: "The Shukurō Kaigi has been Expanded" #NEW

 flavor_jap.115.title: "Il Consiglio Kanrei Costruisce Affinità tra i Membri"
 flavor_jap.115.entry: "$flavor_jap.115.title$"
 flavor_jap.115.desc: "Sebbene il consiglio Kanrei sia diventato un luogo di rivalità politica tra i clan, è cresciuto fino a diventare anche un luogo per una crescente affinità tra di essi. Inoltre, questa affinità ha portato il suo dominio [ROOT.GetCountry.GetGovernment.GetAdjective] a consolidarsi ulteriormente, con molti dei clan che esprimono assoluta lealtà a [our_ruler.GetName]."
 flavor_jap.115.a: "Il consiglio si è dimostrato uno strumento efficace della burocrazia."

 flavor_jap.120.title: "Malcontento nei Confronti [GetCountry('SBA').Custom('IT_Della')][GetCountry('SBA').GetNameWithNoTooltip]"
 flavor_jap.120.entry: "Discontentment with Shiba Shugo" #NEW
 flavor_jap.120.desc: "Sebbene la nomina [GetCountry('SBA').Custom('IT_Della')][GetCountry('SBA').GetLongName] nel consiglio Kanrei avesse lo scopo di migliorare la posizione tra il suo [ROOT.GetCountry.GetFlavorRank] e il [GetCountry('SBA').GetNameWithNoTooltip], [sba_ruler.GetName] ha mostrato malcontento verso il dominio di [our_ruler.GetName] e ha intrapreso passi sempre più decisi per sfidare apertamente [our_ruler.GetNameWithNoTooltip] all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nCercando di punire il [GetCountry('SBA').GetNameWithNoTooltip] per il suo comportamento indisciplinato, [our_ruler.GetNameWithNoTooltip] ha inviato emissari in tutta la [ShowRegionName('japan_region')] per lanciare una coalizione contro [sba_ruler.GetNameWithNoTooltip], sperando di deporlo, sebbene altri all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] temano che ciò possa destabilizzare il suo [ROOT.GetCountry.GetFlavorRank]."
 flavor_jap.120.a: "Questa insolenza non può essere tollerata, cercate altri [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')]!"
 flavor_jap.120.b: "Ignoreremo questa insolenza per ora."
 summoning_of_shugo_lords: "Diversi [ShowSpecialStatusName('shugo_daimyo')] accoglieranno la richiesta del suo [our_ruler.GetName] e aiuteranno a contrastare [GetCountry('SBA').Custom('IT_La')][GetCountry('SBA').GetLongName]."

 flavor_jap.121.title: "Coalizione Shugo contro [GetCountry('SBA').Custom('IT_La')][GetCountry('SBA').GetNameWithNoTooltip]"
 flavor_jap.121.entry: "Summoning of the Shugo Lords Against Shiba" #NEW
 flavor_jap.121.desc: "Rispondendo alle richieste di [our_ruler.GetName], i clan [summoned_shugo_one.GetName], [summoned_shugo_two.GetName] e [summoned_shugo_three.GetName] si sono offerti di assistere nella coalizione per schiacciare [GetCountry('SBA').Custom('IT_La')][GetCountry('SBA').GetNameWithNoTooltip]. Sebbene [our_ruler.GetNameWithNoTooltip] abbia offerto grandi benefici politici, alcuni all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno invece richiesto che il suo [ROOT.GetCountry.GetFlavorRank] gestisca la faccenda personalmente, poiché i clan ricompensati potrebbero tentare di capitalizzare il loro favore presso il suo [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 flavor_jap.121.a: "Il disonorevole [GetCountry('SBA').GetNameWithNoTooltip] deve essere abbattuto."
 flavor_jap.121.a.entry: "The dishonorable $SBA$ must be brought down." #NEW
 flavor_jap.121.b: "Gestiremo invece la questione da soli."
 variable_may_attack_shiba_for_free_tt: "The Shugo Coalition Opposes the Shiba" #NEW
 shugo_lords_will_join_and_prestige: "[summoned_shugo_one.GetName], [summoned_shugo_two.GetName] e [summoned_shugo_three.GetName] guadagneranno [ShowNamedValue('prestige_extreme_bonus')|+] di [prestige|e] e si uniranno alla nostra [war|E] contro [GetCountry('SBA').Custom('IT_La')][GetCountry('SBA').GetName]"

 flavor_jap.122.title: "[chosen_kanrei_leader.GetNameWithNoTooltip] e il Consiglio Kanrei"
 flavor_jap.122.entry: "Hatakeyama or Hosokawa assumes Kanrei council" #NEW
 flavor_jap.122.desc: "La caduta [GetCountry('SBA').Custom('IT_Della')][GetCountry('SBA').GetName] ha visto evaporare la posizione di potere che detenevano nel consiglio Kanrei. Cercando di colmare il vuoto di potere lasciato, [chosen_kanrei_leader.GetName] si è offerto di servire come clan più anziano all'interno del consiglio. Altri all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno invece suggerito che sia giunto il momento di scegliere un nuovo clan esterno al consiglio per colmare il vuoto rimasto, preferibilmente uno senza precedenti ambizioni."
 flavor_jap.122.a: "[chosen_kanrei_leader.GetNameWithNoTooltip] guiderà per ora."
 flavor_jap.122.a.entry: "The leader shall lead for now." #NEW
 flavor_jap.122.b: "Il [new_major_kanrei_member.GetNameWithNoTooltip] prenderà il posto [GetCountry('SBA').Custom('IT_Della')][GetCountry('SBA').GetNameWithNoTooltip] nel consiglio."
 flavor_jap.122.b.entry: "The leader will assume $SBA$'s place on the council." #NEW
 variable_jap_recently_won_against_shiba_tt: "We have Recently Defeated the Shiba" #NEW

 flavor_jap.123.title: "Crescita dell'autorità punitiva"
 flavor_jap.123.entry: "$flavor_jap.123.title$"
 flavor_jap.123.desc: "La caduta [GetCountry('SBA').Custom('IT_Della')][GetCountry('SBA').GetName] ha inviato onde d'urto in tutto il [ShowRegionName('japan_region')], segnalando che lo [ROOT.GetCountry.GetFlavorRank] è disposto a prendere misure punitive per gestire qualsiasi natura dirompente tra i suoi sudditi. Sebbene in precedenza i clan si fossero comportati fuori dalle righe, non temevano alcuna ripercussione dallo [ROOT.GetCountry.GetFlavorRank] fino ad ora.\n\nSebbene la ritrovata natura punitiva possa diminuire le ambizioni di alcuni [ShowSpecialStatusName('shugo_daimyo')], essa ha anche portato con sé una certa sfiducia nei confronti di [our_ruler.GetName]."
 flavor_jap.123.a: "I [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] impareranno a essere più cauti nei confronti dell'autorità di [our_ruler.GetNameWithNoTooltip]."
 flavor_jap.123.a.entry: "[ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] will learn to be more careful of his authority." #NEW
 variable_jap_growth_of_punitive_actions_tt: "The Kanrei's Punitive Authority is Growing" #NEW

 flavor_jap.130.title: "Legittimazione del Dominio [ROOT.GetCountry.GetGovernment.GetAdjective]"
 flavor_jap.130.entry: "$flavor_jap.130.title$"
 flavor_jap.130.desc: "Sebbene [old_ashikaga_ruler.GetName] abbia istituito il nuovo [ROOT.GetCountry.GetFlavorRank], esso è stato ampiamente visto come illegittimo da molti [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] del [ShowRegionName('japan_region')] a causa del suo trattamento della famiglia [ShowDynastyName('yamato_dynasty')]. Cercando di legittimare ulteriormente [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] come regnante, [kanrei_council_leader.GetName] si è mosso per incoraggiare la partecipazione di [our_ruler.GetName] all'antico sistema di ranghi. Essendo una delle pietre miliari delle tradizioni imperiali, se [our_ruler.GetNameWithNoTooltip] mostrasse rispetto per il processo, ciò potrebbe rafforzare la sua legittimità agli occhi dell'élite."
 flavor_jap.130.a: "Seguiamo il consiglio di [kanrei_council_leader.GetNameWithNoTooltip] e partecipiamo."
 flavor_jap.130.a.entry: "Follow the advise of the leader and participate." #NEW
 flavor_jap.130.b: "Rifiuta di partecipare all'antico sistema di ranghi della corte."
 variable_jap_founding_kanrei_member_tt: "We are a Founding Member of the Kanrei Council" #NEW

 flavor_jap.131.title: "Editto della Mezza Tassa"
 flavor_jap.131.entry: "$flavor_jap.131.title$"
 flavor_jap.131.desc: "Cercando di rafforzare ulteriormente i legami della corte imperiale con [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetLongName], [our_ruler.GetName] ha ufficialmente sanzionato l'editto #italic Hanzei#!. Vietando il dimezzamento delle terre imperiali da parte dei [ShowSpecialStatusName('shugo_daimyo')], [ROOT.GetCountry.Custom('IT_NOBLES_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sarà ora richiesto di pagare una mezza tassa proporzionale al sostegno ricevuto dai rappresentanti [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetGovernment.GetName] nel risolvere le incursioni locali. I [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] di nuova nomina, tuttavia, sono stati risparmiati dall'editto."
 flavor_jap.131.a: "Questo editto beneficerà su tutto il [ShowRegionNameWithNoTooltip('japan_region')]!"
 flavor_jap.131.b: "Consentiamo alcune confische di terre imperiali."

 flavor_jap.132.title: "Kyūshū Tandai"
 flavor_jap.132.entry: "$flavor_jap.132.title$"
 flavor_jap.132.desc: "Essendo una delle regioni più problematiche del dominio [ROOT.GetCountry.GetGovernment.GetAdjective] sul [ShowRegionName('japan_region')], la [ShowAreaName('saikaidou_area')] si è dimostrata una roccaforte principale per il sostegno ai [GetCountry('STC').GetAdjective]. Cercando di dare un giro di vite alla regione, [our_ruler.GetName] ha chiesto che venga nominato un nuovo Tandai leale per la [ShowAreaNameWithNoTooltip('saikaidou_area')], sebbene alcuni abbiano sollecitato la scelta di un clan locale leale alla causa [ROOT.GetCountry.GetGovernment.GetAdjective] nella speranza di un amministratore più efficace."
 flavor_jap.132.a: "[non_kyushu_clan_tandai.GetNameWithNoTooltip] servirà come Kyūshū Tandai."
 flavor_jap.132.a.entry: "The leader shall serve as Kyūshū Tandai." #NEW
 flavor_jap.132.b: "Nomina invece [kyushu_clan_tandai.Custom('IT_ART_RANGO')][kyushu_clan_tandai.GetLongNameWithNoTooltip] locale."
 flavor_jap.132.b.entry: "Appoint the local clan instead." #NEW

 flavor_jap.133.title: "Sviluppo del Gobanshū"
 flavor_jap.133.entry: "$flavor_jap.133.title$"
 flavor_jap.133.desc: "Cercando di contrastare la crescente disobbedienza di alcuni [ShowSpecialStatusName('shugo_daimyo')], [our_ruler.GetName] ha chiesto sostegno alla sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] per la fondazione di un nuovo esercito Shogunale. Per garantire la lealtà del nuovo esercito, [our_ruler.GetNameWithNoTooltip] ha ordinato che i suoi ranghi rispondano direttamente [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_AL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle], limitandone il comando ai soli [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] con la massima lealtà verso [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank]."
 flavor_jap.133.a: "Nessuno oserà sfidare la potenza [ROOT.GetCountry.Custom('IT_DEL_RANGO')][ROOT.GetCountry.GetFlavorRank]!"
 flavor_jap.133.a.entry: "None shall dare challenge the might of the realm!" #NEW
 flavor_jap.133.b: "Mettete una maggiore enfasi su un esercito basato sulle leve."

 flavor_jap.134.title: "Residenza Obbligatoria"
 flavor_jap.134.entry: "$flavor_jap.134.title$"
 flavor_jap.134.desc: "Desiderando centralizzare ulteriormente la [ShowRegionName('japan_region')], il nostro [our_ruler.GetName] ha emesso un editto che impone ai [ShowSpecialStatusName('shugo_daimyo')] con posizioni all'interno del consiglio Kanrei di prendere la residenza obbligatoria a [ROOT.GetCountry.GetCapital.GetName]. Mentre ad alcuni [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] non piacerà indubbiamente il nuovo editto, costringere i [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] a rimanere a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] indebolirà senza dubbio ogni aspirazione che potrebbero nutrire contro il [ROOT.GetCountry.GetFlavorRank], trovandosi sotto lo sguardo del nostro [our_ruler.GetNameWithNoTooltip]."
 flavor_jap.134.a: "Costringete i [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] a prendere residenza a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 flavor_jap.134.a.entry: "Force the [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] to take residence within the capital." #NEW
 flavor_jap.134.b: "Ritirate l'attuazione della politica."

 flavor_jap.135.title: "Indebolimento [tki_country.Custom('IT_Della')][tki_country.GetNameWithNoTooltip]"
 flavor_jap.135.entry: "Defiance of Toki" #NEW
 flavor_jap.135.desc: "Sebbene [tki_country.Custom('IT_La')][tki_country.GetName] sia sempre rimasto uno dei clan più forti all'interno del [ShowRegionName('japan_region')], negli ultimi tempi è cresciuto considerevolmente sotto [tki_ruler.GetName] e la sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] non può più ignorare le sue ambizioni. Con le richieste della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] di dividere le terre [tki_country.Custom('IT_Di')][tki_country.GetNameWithNoTooltip] in rami cadetti, [our_ruler.GetName] ha chiesto che venga intrapresa un'azione diretta per punire [tki_ruler.GetNameWithNoTooltip] per la sua sfida."
 flavor_jap.135.a: "[tki_country.Custom('IT_La')|U][tki_country.GetNameWithNoTooltip] deve essere frenato!"
 flavor_jap.135.a.entry: "$TKI$ must be reined in!" #NEW
 flavor_jap.135.b: "Non porteremo oltre questa faccenda."

 flavor_jap.136.title: "La Rivolta Meitoku"
 flavor_jap.136.entry: "$flavor_jap.136.title$"
 flavor_jap.136.desc: "Sebbene i legami tra [GetCountry('YMN').Custom('IT_La')][GetCountry('YMN').GetName] e lo [ROOT.GetCountry.GetFlavorRank] siano rimasti stabili in tempi recenti, [ymn_ruler.GetName] ha causato un collasso quasi completo con l'improvviso sequestro di terre imperiali all'interno del suo dominio. Ignorando le richieste della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] di restituire le terre confiscate, il nostro [our_ruler.GetName] ha cercato assistenza per schiacciare il clan per i suoi atti disonorevoli."
 flavor_jap.136.a: "Al [GetCountry('YMN').GetNameWithNoTooltip] non può essere permesso l'ulteriore sequestro di terre imperiali!"
 flavor_jap.136.a.entry: "$YMN$ cannot be allowed further seizure of Imperial lands!" #NEW
 flavor_jap.136.b: "[GetCountry('YMN').GetNameWithNoTooltip] are a strong clan, let us avoid conflict with them." #NEW
 flavor_jap.136.b.entry: "$YMN$ are a strong clan, let us avoid conflict with them." #NEW

 flavor_jap.137.title: "Tassazione dei Sakaya-Dosō"
 flavor_jap.137.entry: "$flavor_jap.137.title$"
 flavor_jap.137.desc: "Cercando di generare ulteriori entrate per [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank], [our_ruler.GetName] ha proposto una nuova tassa sui Sakaya-Dosō (usurai) in tutta [ROOT.GetCountry.GetCapital.GetName]. Sebbene fossero una fonte di reddito in passato, negli ultimi tempi l'espansione di [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip] ha visto i Sakaya-Dosō [ROOT.GetCountry.GetCapital.GetRank.Custom('IT_DEL_LOCATION')][ROOT.GetCountry.GetCapital.GetRank.GetName] diventare considerevolmente ricchi, al punto che le attuali politiche fiscali lasciavano loro gran parte della loro ricchezza."
 flavor_jap.137.a: "Tassiamo gli usurai!"
 flavor_jap.137.b: "Non possiamo rischiare di far arrabbiare gli usurai."

 flavor_jap.138.title: "Deterioramento delle Relazioni con [chi_nation.Custom('IT_La')][chi_nation.GetNameWithNoTooltip]"
 flavor_jap.138.entry: "Reestablishment with China" #NEW
 flavor_jap.138.desc: "Sebbene un tempo il commercio fiorisse tra [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] e [chi_nation.Custom('IT_La')][chi_nation.GetName], i tempi recenti si sono rivelati turbolenti tra i nostri due stati. Cercando di rinnovare i legami con [chi_nation.Custom('IT_La')][chi_nation.GetNameWithNoTooltip], [our_ruler.GetName] ha chiesto assistenza alla sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] per formare una nuova delegazione, ma ha anche espresso il suo malcontento nei confronti di [chi_ruler.GetName]."
 flavor_jap.138.a: "Ristabiliamo le relazioni tra i nostri stati."
 flavor_jap.138.b: "Gli affari [chi_nation.Custom('IT_Della')][chi_nation.GetNameWithNoTooltip] non hanno significato per noi."
 flavor_jap.138.b.entry: "The affairs of $CHI$ are meaningless to us." #NEW

 flavor_jap.140.title: "[ShowWorkOfArtNameWithNoTooltip('hana_no_gosho_palace')]"
 flavor_jap.140.entry: "$hana_no_gosho_palace$"
 flavor_jap.140.desc: "Con la base di potere [ROOT.GetCountry.Custom('IT_DEL_RANGO')][ROOT.GetCountry.GetFlavorRank] ampiamente consolidata in tutto il [ShowRegionName('japan_region')], [our_ruler.GetName] si è assunto il compito di costruire un grande nuovo palazzo come simbolo del potere e dello splendore [ROOT.GetCountry.GetGovernment.GetAdjective]. Ricevuto il nome di [ShowWorkOfArtName('hana_no_gosho_palace')], [our_ruler.GetNameWithNoTooltip] spera che esso rimanga una fonte della forza e del prestigio [ROOT.GetCountry.GetGovernment.GetAdjective] nei secoli a venire."
 flavor_jap.140.a: "Un palazzo prestigioso!"

 flavor_jap.141.title: "Costruzione del [ShowWorkOfArtNameWithNoTooltip('kinkaku_ji')]"
 flavor_jap.141.entry: "Construction of $kinkaku_ji$"
 flavor_jap.141.desc: "Dopo aver acquisito il sito da una famiglia Saionji attraverso l'uso di pressioni politiche e del tesoro [ROOT.GetCountry.GetGovernment.GetAdjective], [our_ruler.GetName] ha ordinato la costruzione di una grande nuova struttura adornata d'oro.\n\nAttraverso l'adornamento della struttura con l'oro, [our_ruler.GetNameWithNoTooltip] spera di rimuovere ogni sentimento verso la morte, mostrando allo stesso tempo la magnificenza [ROOT.GetCountry.Custom('IT_DEL_RANGO')][ROOT.GetCountry.GetFlavorRank]."
 flavor_jap.141.a: "Questo tempio servirà come simbolo della nostra magnificenza!"

 flavor_jap.142.title: "[ShowWorkOfArtNameWithNoTooltip('jinno_shotoki_chronicle')]"
 flavor_jap.142.entry: "Jinnō Shōtōki" #NEW
 flavor_jap.142.desc: "Dopo aver suscitato scalpore in tutta la sua [ROOT.GetCountry.GetGovernment.GetCourtTitle], una cronaca accuratamente costruita da [kitabatake_chikafusa.GetName] è stata conclusa. Documentando tutti gli imperatori passati fino all'attuale [stc_ruler.GetName], si è diffusa in tutto il [ShowRegionName('japan_region')] come una tempesta. Alcuni nella sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno espresso preoccupazioni riguardo allo scritto, affermando che l'esclusione [GetCountry('NTC').Custom('IT_DEL_RANGO')][GetCountry('NTC').GetLongName] dalla cronaca e la scelta di seguire invece [stc_ruler.GetNameWithNoTooltip] [GetCountry('STC').Custom('IT_Della')][GetCountry('STC').GetName] getterà ulteriori dubbi sulla legittimità di [ntc_ruler.GetName]."
 flavor_jap.142.a: "Una cronaca schiacciante."

 flavor_jap.143.title: "Rinascita della Gakkō di [ShowLocationNameWithNoTooltip('ashikaga_loc')]"
 flavor_jap.143.entry: "Revival of the Ashikaga Gakko Academy" #NEW
 flavor_jap.143.desc: "Sebbene sia stata un'accademia di rilievo per secoli, in tempi recenti la Gakkō di [ShowLocationName('ashikaga_loc')] ha visto un ripido declino nella sua innovazione. Con diversi sostenitori simpatizzanti per le arti della scuola presenti nella sua [ROOT.GetCountry.GetGovernment.GetCourtTitle], molti hanno iniziato a esortare [our_ruler.GetName] a patrocinare il suo rafforzamento, nella speranza che un rinnovato aiuto da parte dello stato aiuti a far rinascere quella che un tempo fu una grande accademia."
 flavor_jap.143.a: "Facciamo rinascere questa grande accademia!"

 flavor_jap.144.title: "Arrivo di [jesuit_francis_xavier.GetNameWithNoTooltip]"
 flavor_jap.144.entry: "Francis Xavier" #NEW
 flavor_jap.144.desc: "In recent years, the increasing occurrences of #italic Nanban#! Traders to our shores have stirred controversy among some of the local [ShowSpecialStatusNameWithNoTooltip('shugo_daimyo')] as well as figures within the [ROOT.GetCountry.GetGovernment.GetCourtTitle]. However, a recent figure has attracted the personal attention of [our_ruler.GetName]. Called [jesuit_francis_xavier.GetName] by the Nanban traders, he has arrived in [arrival_location.GetName] and as a man of faith, he is hoping to spread his [ShowReligionName('catholic')] teachings throughout [ShowRegionName('japan_region')]." #NEW
 flavor_jap.144.a: "Allow him to stay." #NEW
 flavor_jap.144.b: "Blocca ogni tentativo di convertire la nostra popolazione."
 variable_nanban_trade_tt: "The Nanban Trade has Begun" #NEW

 flavor_jap.145.title: "Tempio [ShowWorkOfArtNameWithNoTooltip('shokoku_ji')]"
 flavor_jap.145.entry: "Construction of $shokoku_ji$"
 flavor_jap.145.desc: "Fiero sostenitore dei monaci di fede [ShowReligionGroupAdjective('buddhist')], [our_ruler.GetName] ha dirottato fondi per la fondazione dello [ShowWorkOfArtName('shokoku_ji')], un nuovo tempio [ShowReligionGroupAdjectiveWithNoTooltip('buddhist')] a [ShowLocationName('kyoto')]. Vedendolo come un dono per i monaci, [our_ruler.GetNameWithNoTooltip] spera col tempo di utilizzare il nuovo tempio come mezzo per ospitare banchetti in futuro e come luogo di ritrovo per tutti all'interno della burocrazia [ROOT.GetCountry.GetGovernment.GetAdjective]."
 flavor_jap.145.a: "Un tempio meraviglioso!"

 flavor_jap.146.title: "[target_character.GetNameWithNoTooltip]"
 flavor_jap.146.entry: "Josetsu" #NEW
 flavor_jap.146.desc: "One of the resident monks of [ShowWorkOfArtName('shokoku_ji')], [target_character.GetName] has begun to earn the attention of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] with his practice of the #italic Suiboku#! ink painting. Through his time within [ShowWorkOfArtNameWithNoTooltip('shokoku_ji')], [target_character.GetNameWithNoTooltip] has come to paint several incredible paintings that have impressed the [ROOT.GetCountry.GetGovernment.GetCourtTitle], though none have come to rival the favorite, [ShowWorkOfArtName('catfish_with_a_gourd')]." #NEW
 flavor_jap.146.a: "Un individuo esperto nel Suiboku."

 flavor_jap.147.title: "[target_character.GetNameWithNoTooltip]"
 flavor_jap.147.entry: "Tenshō Shūbun" #NEW
 flavor_jap.147.desc: "Having learned a great deal in the practice of #italic Suiboku#! from [josetsu.GetName] during his time at [ShowWorkOfArtName('shokoku_ji')], [target_character.GetName] has risen through the ranks to serve as director of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] painting in [ROOT.GetCountry.GetCapital.GetName]. Among his many paintings in his service to the [ROOT.GetCountry.GetFlavorRank], none has attracted more acclaim across the [ROOT.GetCountry.GetGovernment.GetCourtTitle] than [ShowWorkOfArtName('reading_in_a_bamboo_grove')]." #NEW
 flavor_jap.147.a: "Un eccellente pittore!"

 flavor_jap.148.title: "[target_character.GetNameWithNoTooltip]"
 flavor_jap.148.entry: "Sesshū Tōyō" #NEW
 flavor_jap.148.desc: "Following in the footsteps of his master [tensho_shubun.GetName] and the great [josetsu.GetName], [target_character.GetName] has emerged as yet another great painter of our times, having earned fame throughout [ShowRegionName('japan_region')] with his merging of [ShowCultureGroupName('japanese_group')] and [ShowCultureGroupName('chinese_group')] ink painting styles. Among his many paintings, the [ShowWorkOfArtName('jap_winter_landscape')] serves as one of the finest demonstration of this merging of styles." #NEW
 flavor_jap.148.a: "Un individuo rinomato!"

 flavor_jap.150.title: "Fondazione della Scuola Kanō"
 flavor_jap.150.entry: "$flavor_jap.150.title$"
 flavor_jap.150.desc: "Throughout his service as the chief painter of the [ROOT.GetCountry.GetGovernment.GetCourtTitle], [target_character.GetName] has been a proponent of the various Zen and #italic Suiboku#! painting styles. Though his position as chief painter has been criticized by some within the [ROOT.GetCountry.GetGovernment.GetCourtTitle], his works have made him a close friend of [our_ruler.GetName].\n\nSeeking to found a school of painting, [target_character.GetNameWithNoTooltip] has requested [our_ruler.GetNameWithNoTooltip] spare some [ROOT.GetCountry.GetGovernment.GetAdjective] funding for him to grow the newfound style." #NEW
 flavor_jap.150.a: "Una proposta meravigliosa!"
 flavor_jap.150.b: "Forniamo a [target_character.GetNameWithNoTooltip] fondi aggiuntivi."
 flavor_jap.150.b.entry: "Provide him with additional funds." #NEW
 flavor_jap.150.c: "Rifiuta di esaudire la richiesta di [target_character.GetNameWithNoTooltip]."
 flavor_jap.150.c.entry: "Refuse to grant him request." #NEW

 flavor_jap.151.title: "Privilegiare il Teatro Nō"
 flavor_jap.151.entry: "$flavor_jap.151.title$"
 flavor_jap.151.desc: "Sebbene molte forme di teatro siano state oggetto di fissazioni all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] in passato, nessuna ha lasciato un'impressione più duratura della pratica del Nō. Tuttavia, rispetto ai suoi predecessori, [our_ruler.GetName] ha mostrato un netto gradimento per tale arte e cerca di fonderla con le arti aristocratiche della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle], richiedendo il sostegno degli altri membri della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] per patrocinare le arti Nō."
 flavor_jap.151.a: "Patrocinate le arti Nō."
 flavor_jap.151.b: "Avremo altre forme per mostrare il potere [ROOT.GetCountry.GetGovernment.GetAdjective]."
 flavor_jap.151.b.entry: "We will have other forms to display Shogunate power." #NEW

 flavor_jap.152.title: "Sviluppo dell'Architettura Shoin-Zukuri"
 flavor_jap.152.entry: "$flavor_jap.152.title$"
 flavor_jap.152.desc: "Cercando di separare l'era [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetName] da quella di Kamakura, [our_ruler.GetName] si è mosso per gettare le basi di un nuovo stile edilizio per l'era [ROOT.GetCountry.GetGovernment.GetRuler.GetDynasty.GetNameWithNoTooltip]. Rispetto ai progetti del passato, nello stile #italic Shoin-Zukuri#! i pilastri quadrati con stuoie di tatami costituiscono il nucleo della struttura.\n\nCercando di rinnovare il palazzo a [ROOT.GetCountry.GetCapital.GetName] secondo i nuovi modelli, [our_ruler.GetNameWithNoTooltip] spera che col tempo tutto il [ShowRegionNameWithNoTooltip('japan_region')] segua l'esempio adottando la nuova architettura Shoin-Zukuri."
 flavor_jap.152.a: "È un tempo di cambiamenti."

 flavor_jap.153.title: "La Via del [ShowGoodsNameWithNoTooltip('tea')]"
 flavor_jap.153.entry: "The Way of Tea" #NEW
 flavor_jap.153.desc: "Though [ShowGoodsName('tea')] culture has remained a key part of [ShowCultureGroupName('japanese_group')] traditions, [target_character.GetName] has drawn attention from [our_ruler.GetName] and other members of the [ROOT.GetCountry.GetGovernment.GetCourtTitle] for his revolutionizing of the practice. Redefining every aspect of the #italic tea ceremony#!, from utensils to the very procedures, [target_character.GetNameWithNoTooltip]'s new practices have quickly garnered attention and spread throughout [ShowRegionName('japan_region')]." #NEW
 flavor_jap.153.a: "Adottiamo formalmente questa pratica."
 flavor_jap.153.b: "Sarebbe una distrazione non necessaria."

 flavor_jap.154.title: "Shoshidai di [ShowLocationNameWithNoTooltip('kyoto')]"
 flavor_jap.154.entry: "$kyoto$ Shoshidai" #NEW
 flavor_jap.154.desc: "Cercando di rafforzare ulteriormente la burocrazia, [our_ruler.GetName] ha gettato le basi per l'ufficio dello #italic Shoshidai di [ShowLocationName('kyoto')]#!, un'evoluzione del precedente ufficio Tandai ricoperto dai governatori regionali. Sotto questo ufficio appena ampliato, il titolare servirà come rappresentante personale [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] e opererà direttamente sotto la sua guida."
 flavor_jap.154.a: "Istituiamo l'ufficio!"
 flavor_jap.154.b: "It would be a waste of resources." #NEW

 flavor_jap.155.title: "Istituzionalizzazione degli Hatamoto"
 flavor_jap.155.entry: "$flavor_jap.155.title$"
 flavor_jap.155.desc: "Cercando di tracciare una linea con i Gokenin, [our_ruler.GetName] ha gettato le basi per istituzionalizzare i suoi seguaci più leali come appartenenti alla classe Hatamoto. Sebbene siano funzionalmente simili ai Gokenin dei secoli passati, coloro che sono Hatamoto possono richiedere personalmente un'udienza con [our_ruler.GetNameWithNoTooltip], un privilegio speciale precedentemente concesso solo a pochissimi."
 flavor_jap.155.a: "Istituzionaliziamo gli Hatamoto."
 flavor_jap.155.b: "Manteniamo l'equilibrio tra Gokenin e Hatamoto."

 flavor_jap.156.title: "Costruzione dell'isola di Dejima"
 flavor_jap.156.entry: "$flavor_jap.156.title$"
 flavor_jap.156.desc: "Con il crescente arrivo di mercanti Nanban da terre straniere, molti nella sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno richiesto che [our_ruler.GetName] getti le basi per un porto speciale a [ShowLocationName('nishisonogi')]. Fungendo da isola distaccata dall'insediamento principale, 'Dejima' servirebbe come punto di scambio designato per chiunque desideri commerciare con i Nanban."
 flavor_jap.156.a: "Costruiamo l'isola."
 flavor_jap.156.b: "Costruiamo il porto sull'isola, ma allentiamo le restrizioni per chi commercia all'interno."


 flavor_jap.160.title: "Istituzione del Distretto di Yoshiwara"
 flavor_jap.160.entry: "$flavor_jap.160.title$"
 flavor_jap.160.desc: "Cercando di isolare aspetti [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] a [ShowLocationName('toshima_kanto')], [our_ruler.GetName] ha ordinato la creazione di un nuovo distretto all'interno di [ShowLocationNameWithNoTooltip('toshima_kanto')], Yoshiwara. All'interno di questo distretto, la ricca classe [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] può vivere nell'eccesso, pur essendo completamente isolata dal resto dell'insediamento."
 flavor_jap.160.a: "Istituisci il distretto!"
 flavor_jap.160.b: "[ShowLocationNameWithNoTooltip('toshima_kanto')] non ha bisogno del distretto."

 flavor_jap.161.title: "Kinchū Narabini Kuge Shohatto"
 flavor_jap.161.entry: "$flavor_jap.161.title$"
 flavor_jap.161.desc: "Cercando di limitare ulteriormente il potere della famiglia [ShowDynastyName('yamato_dynasty')], [our_ruler.GetName] ha stabilito nuove leggi per limitare l'autorità di [ymt_ruler.GetName] e la sua influenza sulla sua [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Sotto la nuova legge, [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank] ha anche raccomandato che [ymt_ruler.GetNameWithNoTooltip] dedichi la sua vita al perseguimento delle arti dell'erudizione e della poesia."
 flavor_jap.161.a: "Emaniamo le leggi per limitare la famiglia imperiale."
 flavor_jap.161.b: "Evitiamo di indebolire la famiglia imperiale."

 flavor_jap.162.title: "Costruzione del Castello di [ShowLocationNameWithNoTooltip('osaka')]"
 flavor_jap.162.entry: "Construction of Osaka Castle" #NEW
 flavor_jap.162.desc: "Desiderando superare molti grandi castelli in tutto il [ShowRegionName('japan_region')], [our_ruler.GetName] ha gettato le basi per la fondazione del castello di [ShowLocationName('osaka')]. Dotato di cinque torri principali e di un fossato fortificato intorno al perimetro, [ShowLocationNameWithNoTooltip('osaka')] sarebbe indubbiamente una delle strutture più fortificate in tutto il [ShowRegionNameWithNoTooltip('japan_region')] e un importante segno distintivo del dominio di [our_ruler.GetNameWithNoTooltip]."
 flavor_jap.162.a: "Costruiamo il castello!"
 flavor_jap.162.b: "Sarebbe una spesa troppo grande."
 flavor_jap.162.a.tt: "Se [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] ha sbloccato [ShowAdvanceName('bastion_advance')] e [ShowLocationName('osaka')] possiede già un [ShowBuildingTypeName('castle')], verrà costruito invece un [ShowBuildingTypeName('bastion')]."

 flavor_jap.163.title: "Istituzionalizzazione del Kinchū Narabini Kuge Shohatto"
 flavor_jap.163.entry: "$flavor_jap.163.title$"
 flavor_jap.163.desc: "Cercando di limitare ulteriormente il potere di [our_ruler.GetName], [jap_ruler.GetName] ha promulgato il #italic Kinchū Narabini Kuge Shohatto#!. Sotto la nuova legge, l'autorità di [our_ruler.GetNameWithNoTooltip] è stata ampiamente ridimensionata, insieme alla raccomandazione di [jap_ruler.GetNameWithNoTooltip] affinché [our_ruler.GetNameWithNoTooltip] persegua una vita di erudizione e poesia."
 flavor_jap.163.a: "Questa è una restrizione orribile!"

 flavor_jap.170.title: "Riforme Kansei"
 flavor_jap.170.entry: "$flavor_jap.170.title$"
 flavor_jap.170.desc: "In seguito a decenni di instabilità e carestie in tutto il [ShowRegionName('japan_region')], molti all'interno della sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno esortato [our_ruler.GetName] a prendere misure estreme.\n\nCercando di stabilizzare e affrontare le molte questioni che [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank] deve affrontare, molti nella sua [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno partecipato alla stesura delle riforme Kansei. Sebbene alcune delle azioni proposte dalla [ROOT.GetCountry.GetGovernment.GetCourtTitle] danneggino le relazioni con gli stati stranieri riducendo il commercio, esse getterebbero le basi per rinvigorire la base agricola del [ShowRegionNameWithNoTooltip('japan_region')]."
 flavor_jap.170.a: "Attua le riforme!"
 flavor_jap.170.b: "Forbid the reforms." #NEW

 flavor_jap.180.title: "La Carica di Shitsuji"
 flavor_jap.180.desc: "Desiderando individui illustri all'interno della sua [GetCountry('JAP').GetGovernment.GetCourtTitle], [jap_ruler.GetName] ha offerto la prestigiosa posizione di #italic Shitsuji#! a [our_ruler.GetName]. Un ufficio di immensa influenza politica all'interno dello [GetUniqueInternationalOrganization('japanese_shogunate').GetName]; se il nostro [our_ruler.GetNameWithNoTooltip] accettasse l'offerta, egli sarebbe in grado di esercitare una considerevole influenza in tutto il [ShowRegionName('japan_region')]."
 flavor_jap.180.a: "Accetta la carica di Shitsuji!"
 flavor_jap.180.b: "Rifiuta l'offerta per l'ufficio."

 flavor_jap.181.title: "[kou_no_moronao.GetNameWithNoTooltip] Rifiuta la Nomina"
 flavor_jap.181.desc: "Despite being a position of great power, [kou_no_moronao.GetNameWithNoTooltip] has rejected [our_ruler.GetName]'s offer for the office of #italic Shitsuji#!.\n\nSeeking to prevent empowering one of factions within the [ROOT.GetCountry.GetGovernment.GetCourtTitle], [our_ruler.GetNameWithNoTooltip] has instead sought the lower ranking official, [target_character.GetName] in hopes he will be untainted by [ROOT.GetCountry.GetGovernment.GetCourtTitle] politics." #NEW
 flavor_jap.181.a: "Speriamo che il funzionario possa mantenere l'ufficio con integrità."

 flavor_jap.182.title: "[kou_no_moronao.GetNameWithNoTooltip] Accetta la Nomina"
 flavor_jap.182.desc: "Having received our offer for the office of Shitsuji, [kou_no_moronao.GetName] has arrived in [ROOT.GetCountry.GetCapital.GetName] to formerly accept the position and bolster our [ROOT.GetCountry.GetGovernment.GetCourtTitle] with his influence." #NEW
 flavor_jap.182.a: "[kou_no_moronao.GetNameWithNoTooltip] servirà come un eccellente Shitsuji."
 flavor_jap.182.a.entry: "$Kou$ no $name_moronao$ shall serve as a fine Shitsuji." #NEW
