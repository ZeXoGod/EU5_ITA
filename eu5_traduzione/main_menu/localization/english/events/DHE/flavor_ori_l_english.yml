l_english:
 flavor_ori.1.title: "[ROOT.GetCountry.GetGovernment.GetRulerTitle] e il Culto di Jagannātha"
 flavor_ori.1.entry: "$flavor_ori.1.title$"
 flavor_ori.1.desc: "Le cerimonie nel grande tempio di [ShowLocationName('puri')] e il tronco nel quale Jagannātha si manifesta sono stati talvolta derisi e dileggiati dai sovrani stranieri, ma in [ShowAreaName('orissa_area')] Jagannātha, il 'Signore dell'Universo', è indiscutibilmente la divinità più popolare.\n\nIl sostegno di Jagannātha e dei suoi sacerdoti è stato inoltre incrollabile per [target_character.GetName]. Ora è giunto il momento che la dinastia [target_character.GetDynasty.GetName] ripaghi questo debito: dovremmo patrocinare il tempio di [ShowLocationNameWithNoTooltip('puri')] ed elevare il culto di Jagannātha a culto principale della nostra [ROOT.GetCountry.GetFlavorRank]."
 flavor_ori.1.a: "Lode a Jagannātha!"
 flavor_ori.1.b: "Non mettiamo tutte le uova in un solo paniere."

 flavor_ori.2.title: "Il Prezzo della Guerra."
 flavor_ori.2.entry: "$flavor_ori.2.title$"
 flavor_ori.2.desc: "Le recenti guerre hanno causato instabilità in [ROOT.GetCountry.GetName]. [ROOT.GetCountry.Custom('IT_PEASANTS_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] si stanno lentamente rivoltando contro di noi a causa delle nostre costose guerre, e diverse stagioni di cattivo raccolto li hanno radicalizzati ulteriormente. Dopo alcune indagini, abbiamo scoperto che la loro principale lamentela riguarda le nostre tasse sul sale, una risorsa vitale per gran parte della gente comune. [target_character.GetName] e la [target_character.GetHerHis] [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito una riduzione di tali tasse per alleviare il malcontento."
 flavor_ori.2.historical_info: "Quando Kapilendra Deva rovesciò l'ultimo dei re Ganga Orientali nel 1434, l'Orissa versava in un triste stato. Le incursioni musulmane da nord e da ovest, così come la rivalità con gli altri vicini a sud, avevano ridotto notevolmente il regno. Da allora, il Raja Kapilendra ribaltò rapidamente la situazione. In guerre consecutive contro il Bengala, i Reddy dell'Andhra, i Sultani Bahmani e l'impero di Vijayanagar, l'Orissa crebbe sia in estensione sia in forza sotto la sua guida. Questa guerra costante, tuttavia, aveva messo a dura prova la popolazione del regno e, insieme a una serie di cattivi raccolti, portò a malcontento popolare all'interno del reame."
 flavor_ori.2.a: "Non abbiamo bisogno della tassa sul sale."
 flavor_ori.2.b: "Non possiamo piegarci alla pressione popolare."

 flavor_ori.3.title: "Nascita della Letteratura [ShowLanguageNameWithNoTooltip('oriya_language')]"
 flavor_ori.3.entry: "$flavor_ori.3.title$"
 flavor_ori.3.desc: "Fino ad ora il [ShowLanguageName('sanskrit_language')] è stato l'unica lingua di letteratura in [ROOT.GetCountry.GetName], mentre la lingua colloquiale [ShowLanguageName('oriya_language')] era riservata a [ROOT.GetCountry.Custom('IT_PEASANTS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] e alle caste inferiori. [sarala_dasa.GetName], un soldato in pensione con poca istruzione formale, ha però iniziato a cambiare questo stato di cose traducendo il [ShowAdvanceName('mahabarata')] in [ShowLanguageNameWithNoTooltip('oriya_language')]. Anche l'opera originale di [sarala_dasa.GetNameWithNoTooltip] è esclusivamente in [ShowLanguageNameWithNoTooltip('oriya_language')], e altri poeti hanno ora iniziato ad adottare questa pratica."
 flavor_ori.3.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 flavor_ori.3.a.entry: "$common_string_alright$"
 flavor_ori.3.b: "Che sia la lingua della [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 flavor_ori.3.b.entry: "Che sia la lingua della corte."

 flavor_ori.4.title: "[achyutananda.GetNameWithNoTooltip]"
 flavor_ori.4.entry: "Achyutananda Das"
 flavor_ori.4.desc: "Un poeta, veggente e prolifico autore sta guadagnando popolarità come santo del [ShowPolicyName('vaishnavism')] nella nostra [ROOT.GetCountry.GetFlavorRank]. Si dice che [achyutananda.GetName] sia in grado di predire il futuro e i suoi libri sono scritti in [ShowLanguageName('oriya_language')], la lingua del popolo."
 flavor_ori.4.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 flavor_ori.4.a.entry: "$common_string_alright$"
 flavor_ori.4.b: "Promuoviamo la sua arte."

 flavor_ori.5.title: "[target_character.GetNameWithNoTooltip] Scala i Ranghi"
 flavor_ori.5.entry: "Kapilendra Deva Sale al Potere"
 flavor_ori.5.desc: "Con il governo di [target_character2.GetName] ancora in corso, una nuova figura si è fatta strada attraverso i ranghi in [ROOT.GetCountry.GetName]. Il suo nome è [target_character.GetName], uno stratega ambizioso e astuto, determinato a proteggere [ROOT.GetCountry.GetNameWithNoTooltip] dalle minacce esterne. Tuttavia, i mormorii nella nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggeriscono che possa stare tramando per reclamare il trono, con l'intento di usurpare [target_character2.GetName] ed eliminare gli ultimi resti della dinastia [target_character2.GetDynasty.GetName] da [ShowAreaName('orissa_area')]."
 flavor_ori.5.a: "Le persone ambiziose sono proprio ciò di cui abbiamo bisogno."
 flavor_ori.5.b: "Via con lui."
 ori_kapilendra_may_revolt_tt: "Finché [target_character.GetName] sarà in vita, [target_character.GetSheHe] potrà usurpare il trono di [ROOT.GetCountry.GetName]"

 flavor_ori.6.title: "Ribellione di [target_character.GetNameWithNoTooltip]"
 flavor_ori.6.entry: "Ribellione di Kapilendra"
 flavor_ori.6.desc: "Con la crescente popolarità di [target_character.GetName], [target_character.GetSheHe] ha deciso di volgere parte della nazione contro di noi. Radunando migliaia di soldati, sembra inevitabile che [ROOT.GetCountry.GetName] affronti una guerra civile a meno che [target_character2.GetName] non abdichi al trono in favore di [target_character.GetNameWithNoTooltip]."
 flavor_ori.6.a: "È tempo di abdicare."
 flavor_ori.6.b: "Radunate gli uomini. Schiacceremo questi pretendenti."
 kapilendra_rebels: "Sostenitori di $Kapilendra$"

 flavor_ori.7.title: "$kapilesvara_siva_temple$"
 flavor_ori.7.entry: "$flavor_ori.7.title$"
 flavor_ori.7.desc: "Con l'aumento di potenza che [ROOT.GetCountry.GetName] ha vissuto negli ultimi anni, [target_character.GetName] ha pianificato la costruzione di ulteriori templi dedicati alle divinità [ShowReligionName('hindu')]. Tra questi vi è il $kapilesvara_siva_temple$ che sarà costruito a [target_location.GetName], un luogo che si dice sia il luogo di nascita di [ShowGodName('shiva_god')]."
 flavor_ori.7.a: "Costruiamo questo tempio."
 flavor_ori.7.b: "È troppo costoso."

 flavor_ori.8.title: "[target_character2.GetNameWithNoTooltip]"
 flavor_ori.8.entry: "Purushottama Dasa, Poeta Orissano"
 flavor_ori.8.desc: "Figura oscura in [ROOT.GetCountry.GetName], [target_character2.GetName] ha recentemente attirato l'attenzione della [ROOT.GetCountry.GetGovernment.GetCourtTitle] di [target_character.GetName]. Sebbene le sue poesie possano non aver ottenuto popolarità nella [ROOT.GetCountry.GetFlavorRank], incarnano precisamente ciò che la lingua [ROOT.GetCountry.GetCourtLanguage.GetName] aspira a essere all'interno di [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_ori.8.a: "Promuoviamo i suoi scritti."
 flavor_ori.8.b: "[target_character.GetHerHis|U] scritti non sono ammessi qui."
 flavor_ori.8.b.entry: "I suoi scritti non sono ammessi qui."

 flavor_ori.9.title: "Declino del Militarismo [ROOT.GetCountry.GetAdjectiveWithNoTooltip]"
 flavor_ori.9.entry: "$flavor_ori.9.title$"
 flavor_ori.9.desc: "Sebbene un tempo marciassimo e conquistassimo, è chiaro che quelle glorie sono ormai ben alle nostre spalle. Molti cittadini di [ROOT.GetCountry.GetName] hanno dimenticato le vie del guerriero, abbracciando invece una vita di pace. Sebbene ciò possa non essere di buon auspicio per la forza del nostro esercito, forse è giunto il momento di adottare un approccio più pacifico al governo."
 flavor_ori.9.a: "[target_character.GetNameWithNoTooltip] diventerà un amministratore."
 flavor_ori.9.a.entry: "Il personaggio diventerà un amministratore."
 flavor_ori.9.b: "Forse è ora di tornare in guerra."

 flavor_ori.10.title: "Riforme Militari di [target_character.GetNameWithNoTooltip]"
 flavor_ori.10.entry: "Riforme Militari del Gajapati"
 flavor_ori.10.desc: "Con l'ascesa di [target_character.GetName] alla guida di [ROOT.GetCountry.GetName], [target_character.GetSheHe] ha delineato piani per riformare l'esercito affinché sostenga meglio le [target_character.GetHerHis] conquiste. Assicurando che il militarismo pervada ogni aspetto della società [ROOT.GetCountry.GetAdjectiveWithNoTooltip], verrà istituito un esercito permanente per presidiare i confini e, potenzialmente, lanciare invasioni contro i vicini più deboli."
 flavor_ori.10.a: "Portiamo a compimento queste riforme."
 flavor_ori.10.b: "Non c'è bisogno di altro militarismo."
 variable_kapilendra_ambitions_var_tt: "Kapilendra Nutre Grandi Ambizioni"
 ori_every_location_in_orissa_with_armory_gains_2_dev: "Ogni [location|e] con [building|e] [ShowBuildingTypeName('armory')] in [ShowAreaName('orissa_area')] otterrà [ShowNamedValue('development_weak_bonus')|+=] di [development|e]"

 flavor_ori.11.title: "Declino del Commercio Marittimo"
 flavor_ori.11.entry: "$flavor_ori.11.title$"
 flavor_ori.11.desc: "Man mano che i nostri legami con $china$ e [ShowSubContinentName('south_east_asia')] si affievoliscono, così anche il nostro commercio con loro. In passato facevamo grande affidamento sull'esportazione verso queste regioni della nostra ricca produzione di tessuti e sale, ma i recenti cambiamenti all'interno di [ROOT.GetCountry.GetName] e tra i nostri partner commerciali hanno causato questo declino. [target_character.GetName] cerca di contrastare questa tendenza introducendo un sistema commerciale più aperto. Tuttavia, questa mossa rischia di minare l'influenza di [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] negli altri mercati."
 flavor_ori.11.a: "Attuiamo questi cambiamenti."
 flavor_ori.11.b: "Non indeboliremo [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
 flavor_ori.11.b.entry: "Non indeboliremo $burghers_estate$."
 flavor_ori.11.c: "Possiamo addolcire un po' l'accordo per loro..."

 flavor_ori.13.title: "[ShowPolicyNameWithNoTooltip('vedic_education')]"
 flavor_ori.13.entry: "Istruzione Vedica"
 flavor_ori.13.desc: "Sebbene il sistema dell'[ShowPolicyName('vedic_education')] sia una tradizione antica, è stato in gran parte abbandonato in $india$ in seguito alle invasioni [ShowReligionGroupAdjective('muslim')]. Anziché lasciare che questo sistema cada nell'oblio, potremmo tentare di reintrodurlo. Tuttavia, così facendo è probabile che si susciti il malcontento di [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]."
 flavor_ori.13.a: "Torniamo al vecchio sistema di istruzione."
 flavor_ori.13.b: "Quello attuale funziona altrettanto bene."

 flavor_ori.14.title: "Il [ROOT.GetCountry.GetGovernment.GetRulerTitle] Folle di [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_ori.14.entry: "$flavor_ori.14.title$"
 flavor_ori.14.desc: "[target_character.GetName] si è guadagnato una cattiva fama presso [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] [ROOT.GetCountry.GetAdjective]. A causa della [target_character.GetHerHis] personalità e incompetenza come [ROOT.GetCountry.GetGovernment.GetRulerTitle], tutti pensano che [target_character.GetSheHe] possa essere folle, e che emani nuove leggi per capriccio, provocando il clamore di [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 flavor_ori.14.a: "Chi lascia che [target_character.GetNameWithNoTooltip] faccia tutto ciò che [target_character.GetSheHe] vuole?"
 flavor_ori.14.a.entry: "Chi lascia che faccia tutto ciò che vuole?"
 flavor_ori.14.b: "Per fortuna possiamo fermare [target_character.GetHerHim] prima che venga fatto troppo danno."
 flavor_ori.14.b.entry: "Per fortuna possiamo fermarlo prima che venga fatto troppo danno."
 ori_nobles_lose_20_satisfaction: "Tutti i [pops|e] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] perderanno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 flavor_ori.15.title: "Patrocinare l'Architettura Kalinga"
 flavor_ori.15.entry: "$flavor_ori.15.title$"
 flavor_ori.15.desc: "Parte dell'antica architettura di [ROOT.GetCountry.GetName], lo stile architettonico Kalinga contraddistingue i templi dedicati a ciascuna delle principali divinità [ShowReligionName('hindu')], garantendo a ciascuno uno stile distinto. Sebbene non siamo in condizione di dedicare altri templi a queste divinità, possiamo almeno assicurare che uno dei templi riceva finanziamenti extra, in particolare quello di [target_location.GetName]."
 flavor_ori.15.a: "Possiamo permetterci un patrocinio."
 flavor_ori.15.b: "I templi sono in buono stato."
 flavor_ori.15.c: "Facciamo loro generose donazioni."

 flavor_ori.16.title: "Promozione del [ShowPolicyNameWithNoTooltip('vaishnavism')]"
 flavor_ori.16.entry: "Promozione del Vaishnavismo"
 flavor_ori.16.desc: "I seguaci del [ShowPolicyNameWithNoTooltip('vaishnavism')] hanno radicato le proprie credenze in queste terre fin dalla fondazione della nostra nazione. Purtroppo, i conflitti politici e le turbolenze religiose ci hanno costretto a cambiare le nostre usanze, allontanando la nostra nazione dalle credenze originarie. Sebbene [ROOT.GetCountry.GetName] non creda necessariamente che [ShowGodName('vishnu_god')] sia l'essere supremo tra tutte le divinità, le masse la pensano diversamente, ricordandoci che il culto di Jagannātha è davvero l'unica vera parola all'interno di [ROOT.GetCountry.GetReligion.GetName]. Questa sola pressione ha indotto la [ROOT.GetCountry.GetGovernment.GetCourtTitle] a riconsiderare la propria posizione. Forse anche loro crederanno che [ShowGodNameWithNoTooltip('vishnu_god')] sia supremo e che [ROOT.GetCountry.GetNameWithNoTooltip] debba cambiare posizione su quale ramo dell'[ROOT.GetCountry.GetReligion.GetNameWithNoTooltip] sia quello giusto."
 flavor_ori.16.a: "Torniamo a questa setta!"
 flavor_ori.16.b: "Non ci piegheremo alle masse."
 ori_all_hindu_clergy_pops_will_gain_20_satisfaction: "Tutti i [pops|e] [ShowReligionName('hindu')] otterranno [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] di [pop_satisfaction|e]"

 flavor_ori.1000.title: "Contatti con [GetCountry('POR').Custom('IT_La')][GetCountry('POR').GetNameWithNoTooltip]"
 flavor_ori.1000.entry: "Contatti con $POR$"
 flavor_ori.1000.desc: "L'arrivo del popolo [GetCountry('POR').GetAdjective] ha aperto nuove opportunità sia per noi sia per i nostri nemici. I loro mercanti si sono intromessi nel mercato di [target_market.GetName], acquistando i nostri beni e aumentando al contempo la propria influenza. Possiamo cercare di migliorare i rapporti con loro, oppure sabotare questa loro influenza nel nostro mercato."
 flavor_ori.1000.a: "Diamo il benvenuto a questa nuova gente."
 flavor_ori.1000.b: "Non faranno concorrenza ai nostri mercanti."
 ori_sabotaged_merchants: "Mercanti Sabotati"

 flavor_ori_1001_shared: "Invitare Mercanti [GetCountry('POR').Custom('IT_ADJ_MP')]"
 flavor_ori.1001.title: "$flavor_ori_1001_shared$"
 flavor_ori.1001.desc: "Con i nostri sforzi per ingraziarci [target_country2.GetGovernment.GetRulerTitle] [target_country2.Custom('IT_ADJ_MS')], [target_character.GetName] ha avuto un'idea quanto mai ingegnosa. Sfruttando le ricche terre di [target_country.GetName], potremmo attirare alcuni dei loro mercanti a stabilirsi a [target_location.GetName] e, usando i loro fondi, potremmo assicurare con maggiore fiducia la costante prosperità della [target_location.GetRank.GetName]."
 flavor_ori.1001.a: "Un'idea davvero ingegnosa."
 flavor_ori.1001.b: "Stringere un accordo con loro non vale il nostro tempo."
 ori_por_must_accept_offer_tt: "[target_country2.GetName] deve accettare l'offerta affinché gli effetti abbiano luogo"
 ori_no_deal_with_portugal_tt: "Non invieremo alcun accordo a [target_country2.GetName]"

 flavor_ori.1002.title: "$flavor_ori_1001_shared$"
 flavor_ori.1002.desc: "[target_country.GetName] si è avvicinata a noi con un accordo. Desiderando attirare alcuni [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], verrà loro concessa la libertà di commerciare e di sviluppare [target_location.GetName] come desiderano, preferibilmente a nostro vantaggio, e in cambio manterranno la produzione delle terre di quella zona."
 flavor_ori.1002.a: "Permettiamo loro di stabilirsi lì."
 flavor_ori.1002.b: "Non sprecheremo [ROOT.GetCountry.Custom('IT_BURGHERS_IL_NOSTRO')][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]!"
 flavor_ori.1002.b.entry: "Non sprecheremo $burghers_estate$!"
