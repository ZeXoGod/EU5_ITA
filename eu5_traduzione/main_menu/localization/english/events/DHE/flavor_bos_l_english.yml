l_english:
 flavor_bos.1.title: "Aspirazione all'Indipendenza"
 flavor_bos.1.entry: "$flavor_bos.1.title$"
 flavor_bos.1.desc: "La morte di [hun_robert.GetName] ha aperto un'opportunità mai vista prima. Con [GetCountry('HUN').GetName] indebolita e distratta, [target_ruler.GetName] ha iniziato a immaginare [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName] libera dal dominio ungherese. Invece di impegnarci in una ribellione aperta, è stato suggerito di iniziare a minare silenziosamente il loro potere e intavolare rapporti diplomatici con i loro nemici, che potrebbero rivelarsi utili nella nostra ricerca della libertà."
 flavor_bos.1.a: "Sfruttiamo questa opportunità."
 flavor_bos.1.b: "Rimaniamo fedeli alla [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjectiveWithNoTooltip]."
 flavor_bos.1.b.entry: "Rimaniamo fedeli alla $crown_estate$ $HUN_ADJ$."
 flavor_bos.1.a.tt: "Continuare a minare l'autorità ungherese, ad esempio migliorando le relazioni con i loro rivali e riducendo la nostra lealtà, potrebbe costringere [GetCountry('HUN').GetNameWithNoTooltip] a riconsiderare il nostro status di loro sudditi."
 flavor_bos.1.historical_info: "Il regno di Stefano II fu segnato da sforzi significativi per liberare la Bosnia dal dominio Ungherese, contrapponendo l'Ungheria alle sue rivali. Dopo la morte di importanti alleati Ungheresi, come re Carlo Roberto e Mikac di Slavonia, Stefano iniziò a sfruttare le guerre dell'Ungheria con Venezia tramite corruzione, lealtà negata e persino la fuga di informazioni sulle posizioni militari. Queste azioni valsero a Stefano il soprannome di 'Allievo del Diavolo', e resero il nuovo re Ungherese diffidente nei suoi confronti, ma la corona ormai esausta non aveva la forza né la volontà di rimuoverlo. Verso la fine del suo regno, l'autorità Ungherese sulla Bosnia divenne puramente nominale."

 flavor_bos.2.title: "Il Declino [GetCountry('SER').Custom('IT_Della')][GetCountry('SER').GetNameWithNoTooltip]"
 flavor_bos.2.entry: "Il declino della Serbia"
 flavor_bos.2.desc: "Dopo la scomparsa di [ser_dusan.GetName], [GetCountry('SER').Custom('IT_La')][GetCountry('SER').GetName] affronta anni di lotte interne. Il declino dell'autorità di governo ha spinto diversi signori locali a combattere per il potere, sebbene nessuno di loro possieda la legittimità dinastica o l'autorità per rivendicare il trono. Poiché i nostri sovrani hanno legami dinastici con la famiglia regnante dei [ser_dusan.GetDynasty.GetName], possiamo legittimamente rivendicare la loro corona."
 flavor_bos.2.a: "Sfruttiamo la loro frammentazione per espandere la nostra influenza."
 flavor_bos.2.b: "Concentriamoci sulle nostre questioni interne."
 flavor_bos.2.historical_info: "L'estinzione della dinastia dei Nemanjić lasciò il trono Serbo di fatto vacante, con casati locali che governavano porzioni frammentate del vecchio impero. Tvrtko I approfittò di questo vuoto di potere e, grazie alla sua ascendenza Nemanjić per parte di nonna paterna, rivendicò la corona Serba, cercando di espandere l'influenza della Bosnia verso est."

 flavor_bos.3.title: "Il Primo Re [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_bos.3.entry: "$flavor_bos.3.title$"
 flavor_bos.3.desc: "La nostra vittoriosa campagna ha consegnato nelle nostre mani vaste porzioni delle antiche terre [GetCountry('SER').Custom('IT_ADJ_FP')]. Questo trionfo ha spinto [target_ruler.GetName] a farsi avanti con una proposta audace. [target_ruler.GetSheHe|U] non desidera soltanto assumere ufficialmente la regalità di [GetCountry('SER').GetNameWithNoTooltip], ma anche elevare [ROOT.GetCountry.GetName] a rango regio, diventando il primo re che il nostro paese abbia mai avuto."
 flavor_bos.3.a: "La nostra nazione ha bisogno di un re."
 flavor_bos.3.b: "La corona porta più guai che potere."
 flavor_bos.3.historical_info: "Agli inizi degli anni 1370, il vecchio impero Serbo si era disgregato ed era diviso tra numerosi signori locali, tra cui Tvrtko di Bosnia. La posizione di Tvrtko era però fondamentalmente diversa. Egli governava già una nazione indipendente che includeva importanti territori dell'impero Serbo. Ancora più importante, rivendicava una discendenza dinastica dalla famiglia dei Nemanjić, il che gli conferiva una legittimità che nessun altro signore Serbo possedeva. Sulla base di questi diritti, la sua corte elaborò le basi della sua incoronazione e del suo diritto a una doppia corona, il che portò all'incoronazione di Tvrtko come re dei Serbi e di Bosnia nell'autunno del 1377."

 flavor_bos.4.title: "Il Concilio degli Strojnici si Riunisce"
 flavor_bos.4.entry: "$flavor_bos.4.title$"
 flavor_bos.4.desc: "Gli Strojnici, gli anziani più autorevoli della Chiesa [ROOT.GetCountry.Custom('IT_ADJ_FS')], si sono riuniti per discutere il futuro cammino della nostra fede. Dispute di lunga data, questioni dottrinali e molte altre questioni vengono messe a nudo davanti al concilio."
 flavor_bos.4.a: "La chiesa ha bisogno di stabilità sopra ogni cosa."
 flavor_bos.4.b: "Lavoriamo per chiarire i nostri insegnamenti."
 flavor_bos.4.c: "Concentriamoci sulla risoluzione delle dispute interne."
 flavor_bos.4.d: "Occupiamoci dei beni della chiesa."

 flavor_bos.5.title: "Il Destino della Chiesa [ROOT.GetCountry.Custom('IT_ADJ_FS')]"
 flavor_bos.5.entry: "$flavor_bos.5.title$"
 flavor_bos.5.desc: "La crescente pressione della [GetUniqueInternationalOrganization('catholic_church').GetName] [ROOT.GetCountry.Custom('IT_SUL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sta diventando sempre più difficile da sopportare. Ci sono giunte notizie che [target_pope.GetName] sta di nuovo valutando una crociata contro [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName], accusandoci di ospitare pericolose eresie. Per generazioni abbiamo difeso la sopravvivenza della nostra chiesa nativa, ma forse è giunto il momento di sottometterci e assicurarci un posto tra le nazioni del mondo [ShowReligionAdjective('catholic')]."
 flavor_bos.5.a: "La nostra chiesa resisterà!"
 flavor_bos.5.b: "Uniamoci al mondo [ShowReligionAdjectiveWithNoTooltip('catholic')]."
 flavor_bos.5.c: "Ci rivolgeremo invece a [ShowLocationNameWithNoTooltip('constantinople')]."
 flavor_bos.5_catholic_unhappy: "Tutti i [pops|e] di religione [ShowReligionAdjective('catholic')] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 flavor_bos.5_krstjani_unhappy: "Tutti i [pops|e] di religione [ShowReligionAdjective('bosnian_church')] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 flavor_bos.5_orthodox_unhappy: "Tutti i [pops|e] di religione [ShowReligionAdjective('orthodox')] perdono [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
 flavor_bos.5.historical_info: "La Chiesa Bosniaca divenne un bersaglio costante di critiche e interventi da parte del Papato, poiché veniva spesso accusata di ospitare credenze eretiche. Nel 1203, i rappresentanti della Chiesa firmarono l'Abiura di Bilino Polje, con cui accettarono di abbandonare le pratiche ritenute eretiche e di conformarsi alla dottrina Cattolica. Nonostante ciò, molti continuarono a mantenere segretamente le proprie pratiche tradizionali. Nel 1337, papa Benedetto XII indisse un'altra crociata, ma gli sforzi alla fine fallirono. La Chiesa Bosniaca sopravvisse fino alla conquista Ottomana della regione."