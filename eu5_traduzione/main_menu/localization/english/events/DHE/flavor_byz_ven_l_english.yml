l_english:
 flavor_byz_ven.1.title: "In Cattive Acque"
 flavor_byz_ven.1.entry: "$flavor_byz_ven.1.title$"
 flavor_byz_ven.1.desc: "Mentre la [ShowDisasterName('byzantine_succession_crisis')] infuria, il nostro tesoro viene prosciugato, rendendo la nostra posizione sempre più insostenibile con il proseguire dei conflitti. Se il nostro tumulto interno persisterà, l'esistenza stessa del [origin_country.GetLongName] sarà in pericolo.\n\nIn circostanze così disperate, circola un'idea un tempo incredibile — impegnare [target_woa.GetName] come garanzia per un prestito da una delle repubbliche mercantili."
 flavor_byz_ven.1.a: "Tempi disperati richiedono misure altrettanto disperate."
 flavor_byz_ven.1.b: "È assurdo."

 BYZ_crown_jewels_tt: "Se [THIS.GetCountry.GetName] accetta, ci concederà in [loan|e] [SCOPE.GetLocalVariable('loan_size').GetValue|+=] [gold_i|e] e subiremo [ShowModifier('BYZ_lacking_jewels')] finché la [work_of_art|e] di [target_woa.GetName] non sarà restituita"

 flavor_byz_ven.2.title: "Pegno dei Gioielli della Corona [origin_country.GetAdjectiveWithNoTooltip]"
 flavor_byz_ven.2.entry: "Pegno dei Gioielli della Corona $BYZ_ADJ$"
 flavor_byz_ven.2.desc: "Il [origin_country.GetLongName] è nella più disperata delle situazioni. Soffrendo la [ShowDisasterName('byzantine_succession_crisis')], sta consumando rapidamente il suo tesoro di guerra e ha un bisogno critico di fondi aggiuntivi. La sua situazione sembra così terribile, infatti, che ci ha fatto un'offerta sorprendente: una richiesta di prestito, offrendo [target_woa.GetName] come garanzia. Questo può essere considerato da alcuni un segno di fiducia... o da altri un atto di disperazione."
 flavor_byz_ven.2.a: "Sarà una splendida aggiunta alla nostra collezione."
 flavor_byz_ven.2.b: "Lasciamo cadere il malvagio [origin_country.GetFlavorRank]."
 flavor_byz_ven.2.b.entry: "Lasciamo cadere il malvagio reame."

 pawning_of_crown_jewels: "Pegno dei Gioielli della Corona"
 LOAN_SHORT_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
 LOAN_SHORT_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"
 LOAN_TOOLTIP_pawning_of_crown_jewels: "È stato raggiunto un accordo reciproco in cui il prestatore concede un prestito al debitore in cambio del possesso di $byzantine_crown_jewels$. Quando il prestito verrà ripagato, anche i gioielli impegnati dovrebbero essere restituiti — almeno in teoria."
 LOAN_TITLE_pawning_of_crown_jewels: "$pawning_of_crown_jewels$"
 LOAN_NAME_pawning_of_crown_jewels_L: "$pawning_of_crown_jewels$"
 LOAN_NAME_pawning_of_crown_jewels_B: "$pawning_of_crown_jewels$"

 flavor_byz_ven.3.title: "Prestito Ripagato"
 flavor_byz_ven.3.entry: "$flavor_byz_ven.3.title$"
 flavor_byz_ven.3.desc: "Il [origin_country.GetLongName] ha appena ripagato il prestito che gli abbiamo concesso, e ora pretende che [target_woa.GetName] sia restituito al suo possesso. Secondo il nostro accordo, dobbiamo acconsentire — ma farlo ci farebbe perdere la leva che abbiamo su di lui.\n\nSicuramente, se non restituissimo i gioielli, non accadrebbe nulla di significativo..."
 flavor_byz_ven.3.a: "Non possiamo rischiare una simile macchia sulla nostra reputazione."
 flavor_byz_ven.3.b: "Dopotutto, perché no? Perché non dovremmo tenerlo?"

 flavor_byz_ven.4.title: "Gioielli della Corona Restituiti"
 flavor_byz_ven.4.desc: "Secondo il nostro accordo, abbiamo ripagato il prestito al [target_country.GetLongName] e [target_woa.GetName] è stato successivamente restituito, riportato al possesso [origin_country.GetAdjective] in [target_location.GetName].\n\nÈ stato un piacere fare affari con la più serena [ShowGovernmentReformName('merchant_republic')] di tutte."
 flavor_byz_ven.4.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.4.a.entry: "$common_string_brilliant$"

 flavor_byz_ven.5.title: "Accordo Infranto"
 flavor_byz_ven.5.desc: "Nonostante abbiamo ripagato il prestito secondo l'accordo stipulato, la parte [target_country.GetAdjective] ha ignorato la nostra richiesta di restituire [target_woa.GetName]. Possiamo interpretarlo in un solo modo — un grande furto!\n\nAffronteranno l'ira del [origin_country.GetLongName]..."
 flavor_byz_ven.5.a: "Non avremmo dovuto trattare con il Diavolo."

 flavor_byz_ven.6.title: "$flavor_byz_ven.4.title$"
 flavor_byz_ven.6.desc: "Il [target_army.GetName] ha finalmente riportato [target_woa.GetName] in nostro possesso. La nostra proprietà è stata ricondotta a [target.GetName], dove è stata accolta calorosamente dalla [ROOT.GetCountry.GetGovernment.GetCourtTitle]. I nostri nemici non potranno più usare questi gioielli per imporci la loro volontà!"
 flavor_byz_ven.6.desc_recovered: "I [target_woa.GetName] sono di nuovo in nostro possesso, recuperati insieme a [target.GetName]. I nostri beni sono stati riportati dove appartengono, accolti calorosamente dalla [ROOT.GetCountry.GetGovernment.GetCourtTitle]. I nostri nemici non possono più usare questi gioielli per imporci la loro volontà!"
 flavor_byz_ven.6.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.6.a.entry: "$common_string_brilliant$"

 flavor_byz_ven.7.title: "[target_woa.GetNameWithNoTooltip]"
 flavor_byz_ven.7.desc: "La recente presa di [location.GetName] è stata un grande successo per [ROOT.GetCountry.GetName]. Le nostre forze, [target_army.GetName], hanno condotto una completa 'ispezione' della terra, acquisendo [target_woa.GetName] nel processo, una risorsa importante per i nostri alleati in [origin_country.GetName]. Potremmo restituirlo a loro... ma non meritiamo forse una quota uguale delle spoglie di guerra?"
 flavor_byz_ven.7.a: "Li restituiremo ai nostri cari alleati."
 flavor_byz_ven.7.b: "Ma è nostro di diritto per furto!"

 flavor_byz_ven.8.title: "Gioielli Rubati!"
 flavor_byz_ven.8.desc: "Ci sono giunti rapporti dell'assoluta incompetenza dei nostri prestatori! Dopo averci prestato oro con il venerabile [target_woa.GetName] come garanzia, sono riusciti a farsi rubare quegli stessi gioielli proprio sotto il naso. Speriamo devotamente che recuperino i nostri beni. In caso contrario, dovremo riprenderceli da [target.GetName] da soli..."
 flavor_byz_ven.8.a: "C'è qualcosa che sappiano fare bene, oltre ad accumulare oro?"

 byz_woa_was_moved: "[target_woa.GetName] è stato spostato a [target.GetName]"
 flavor_byz_ven.9.title: "Un Accordo è Stato Concluso"
 flavor_byz_ven.9.entry: "$flavor_byz_ven.9.title$"
 flavor_byz_ven.9.desc: "I nostri inviati sono tornati da [target_country.GetName] con notizie molto gradite: i mercanti [target_country.GetAdjective] hanno accettato la nostra offerta. In cambio del [target_woa.GetName], ci è stato concesso un prestito, dando al nostro tesoro il respiro di cui aveva disperatamente bisogno. Sfruttiamo al meglio questa tregua."
 flavor_byz_ven.9.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_byz_ven.9.a.entry: "$common_string_brilliant$"
 flavor_byz_ven.10.title: "Rifiutati dalla Serenissima"
 flavor_byz_ven.10.entry: "$flavor_byz_ven.10.title$"
 flavor_byz_ven.10.desc: "I nostri inviati sono tornati a mani vuote. Il [target_country.GetLongName] ha rifiutato la nostra offerta, non disposto a fornire un prestito nemmeno con il [target_woa.GetName] come garanzia. L'insulto brucia quasi quanto il colpo alle nostre finanze. Dobbiamo cercare altri mezzi per superare questa crisi."
 flavor_byz_ven.10.a: "Così sia."
 flavor_byz_ven.11.title: "Garanzia Perduta" #NEW
 flavor_byz_ven.11.entry: "$flavor_byz_ven.11.title$"
 flavor_byz_ven.11.desc: "Il nostro tesoro giace in rovina. Tra gli obblighi resi nulli dal nostro collasso finanziario vi è il prestito che abbiamo concesso [origin_country.Custom('IT_AL_RANGO')][origin_country.GetLongName], con [target_woa.GetName] come garanzia. Con l'annullamento del contratto, i gioielli tornano in mani [origin_country.Custom('IT_ADJ_FP')], e la leva che speravamo di esercitare su di loro ci sfugge tra le dita." #NEW
 flavor_byz_ven.11.a: "Una perdita amara in una stagione amara." #NEW
 flavor_byz_ven.12.title: "Un Collasso Veneziano" #NEW
 flavor_byz_ven.12.entry: "$flavor_byz_ven.12.title$"
 flavor_byz_ven.12.desc: "La notizia è giunta alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] dalla laguna. [target_country.Custom('IT_ART_RANGO')|U][target_country.GetLongName] è fallito, con i suoi creditori che si stringono attorno a quel che resta della ricchezza della Serenissima. Nel disordine, i [target_woa.GetName] tenuti [target_country.Custom('IT_Dalla')][target_country.GetNameWithNoTooltip] come garanzia contro il nostro prestito su pegno sono stati silenziosamente restituiti in nostro possesso. Il contratto è nullo, e i nostri gioielli sono di nuovo nostri." #NEW
 flavor_byz_ven.12.a: "La Provvidenza ci ha risparmiato questa umiliazione." #NEW
 flavor_byz_ven.13.title: "Inadempimento e Confisca" #NEW
 flavor_byz_ven.13.entry: "$flavor_byz_ven.13.title$"
 flavor_byz_ven.13.desc: "Le nostre casse sono vuote, i nostri debiti ripudiati. Il prestito che abbiamo contratto con [target_country.Custom('IT_ART_RANGO')][target_country.GetLongName] contro il [target_woa.GetName] è ora inadempiuto. Secondo i termini dell'accordo, i gioielli sono confiscati a favore [target_country.Custom('IT_Di')][target_country.GetNameWithNoTooltip], e la notizia della nostra vergogna si diffonde rapidamente nelle corti della Cristianità." #NEW
 flavor_byz_ven.13.a: "Il nostro onore segue il nostro tesoro nell'abisso." #NEW
 flavor_byz_ven.14.title: "L'Inadempimento del Debitore" #NEW
 flavor_byz_ven.14.entry: "$flavor_byz_ven.14.title$"
 flavor_byz_ven.14.desc: "Notizie angosciose raggiungono la [ROOT.GetCountry.GetGovernment.GetCourtTitle] [origin_country.Custom('IT_DAL_RANGO')][origin_country.GetLongName], che ha ripudiato i propri debiti e portato rovina al proprio tesoro. Il prestito che abbiamo concesso contro il [target_woa.GetName] non sarà ripagato. Eppure la garanzia è nostra per diritto dell'accordo, e adorna la Serenissima come premio della nostra prudenza." #NEW
 flavor_byz_ven.14.a: "La loro perdita è il nostro guadagno duraturo." #NEW
 flavor_byz_ven.15.title: "Un'Opportunità contro la Minaccia [GetCountry('GEN').Custom('IT_ADJ_FS')]" #NEW
 flavor_byz_ven.15.entry: "Un'Opportunità contro la Minaccia Genovese" #NEW
 flavor_byz_ven.15.desc: "La conquista [GetCountry('GEN').Custom('IT_ADJ_FS')] di [ShowLocationName('chios')] e delle isole vicine ai danni [GetCountry('BYZ').Custom('IT_DEL_RANGO')][GetCountry('BYZ').GetLongName] ha profondamente preoccupato i mercanti della laguna. [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')|U]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] non può tollerare il predominio [GetCountry('GEN').GetAdjectiveWithNoTooltip] nel [ShowAreaName('aegean_sea_area')], e lo stato [GetCountry('BYZ').GetAdjectiveWithNoTooltip] ferito rappresenta il più naturale degli alleati.\n\nDovremmo tendere una mano di amicizia al [GetCountry('BYZ').GetAdjectiveWithNoTooltip] [GetCountry('BYZ').GetGovernment.GetCourtTitle]?" #NEW
 flavor_byz_ven.15.a: "Inviamo emissari per proporre un patto congiunto." #NEW
 flavor_byz_ven.15.b: "Perseguiremo i nostri interessi da soli." #NEW
 flavor_byz_ven.16.title: "L'Apertura [GetCountry('VEN').Custom('IT_ADJ_FS')]" #NEW
 flavor_byz_ven.16.entry: "L'Apertura Veneziana" #NEW
 flavor_byz_ven.16.desc: "Gli inviati [GetCountry('VEN').Custom('IT_DEL_RANGO')][GetCountry('VEN').GetLongName] si presentano alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] recando una proposta quanto mai gradita, un'intesa congiunta contro [GetCountry('GEN').Custom('IT_ART_RANGO')][GetCountry('GEN').GetLongName], le cui flotte mercantili sono divenute troppo audaci nel [ShowAreaName('aegean_sea_area')] dopo la conquista di [ShowLocationName('chios')].\n\nSebbene i nostri recenti rapporti con [GetCountry('VEN').GetNameWithNoTooltip] non siano sempre stati amichevoli, essere entrambi contrari all'ambizione [GetCountry('GEN').Custom('IT_ADJ_FS')] costituisce un insolito allineamento di interessi." #NEW
 flavor_byz_ven.16.a: "Un vecchio rivale diventa un alleato utile contro un nemico più grande." #NEW
 flavor_byz_ven.16.b: "Nessuno di questi Latini è degno di fiducia." #NEW
