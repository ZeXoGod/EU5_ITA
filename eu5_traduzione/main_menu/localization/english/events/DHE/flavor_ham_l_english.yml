l_english:
 flavor_ham.1.title: "La Banca Berenberg"
 flavor_ham.1.entry: "$flavor_ham.1.title$"
 flavor_ham.1.desc: "Molti mercanti e finanzieri sono giunti nella nostra [ROOT.GetCountry.GetFlavorRank], attratti dalla ricchezza che scorre attraverso le nostre terre. Tra loro vi sono i [GetDynasty('berenberg_dynasty').GetName], abili nell'arte del commercio e della finanza, che desiderano fondare una banca privata a [berenberg_bank_hq.GetName]. Un'istituzione simile potrebbe rivelarsi preziosa nella gestione dei crediti commerciali e nell'agevolare lo scambio di merci attraverso il Mare del Nord."
 flavor_ham.1.historical_info: "Fondata nel 1590 da Hans e Paul Berenberg, mercanti fiamminghi fuggiti dalla riconquista spagnola di Anversa, la #italic Banca Berenberg#! è una delle più antiche banche mercantili del mondo ancora in attività oggi. Con sede ad Amburgo, prosperò come impresa familiare privata finanziando il commercio in tutta l'Europa settentrionale, rimanendo in mani private e crescendo grazie a un'attenta gestione del credito mercantile e degli investimenti."
 flavor_ham.1.a: "Diamo il benvenuto a tutti i mercanti abili."
 flavor_ham.1.b: "Vediamo cosa riusciranno a ottenere!"

 flavor_ham.2.title: "$flavor_ham.1.title$"
 flavor_ham.2.desc: "Abbiamo fondato la nostra banca nella grande [berenberg_bank_hq.GetRank.GetName] di [berenberg_bank_hq.GetName]. Con i nostri contatti con mercanti di tutta l'Europa settentrionale e oltre, siamo pronti a renderci indispensabili al commercio di questa regione."
 flavor_ham.2.a: "La nostra ricchezza cresce a ogni transazione."

 flavor_ham.3.title: "La Banca di Amburgo"
 flavor_ham.3.entry: "$flavor_ham.3.title$"
 flavor_ham.3.desc: "Il volume sempre crescente di scambi che passano per [hamburger_bank_hq.GetName] ha rivelato la necessità di una banca di cambio pubblica stabile e affidabile, in grado di garantire il valore delle valute e di agevolare le grandi transazioni commerciali. Sul modello del successo di istituzioni analoghe, una banca pubblica a [hamburger_bank_hq.GetNameWithNoTooltip] offrirebbe una base sicura per la nostra prosperità finanziaria."
 flavor_ham.3.historical_info: "La #italic Banca di Amburgo#! fu fondata nel 1619 nella città libera di Amburgo, ricalcando da vicino la Banca di Amsterdam istituita un decennio prima. Operava come banca di cambio pubblica, accettando depositi e gestendo pagamenti internazionali in una valuta bancaria affidabile. Fu una delle più importanti istituzioni finanziarie dell'Europa settentrionale per oltre due secoli, finché non venne assorbita dalla Reichsbank nel 1875."
 flavor_ham.3.a: "La banca servirà i nostri interessi."
 flavor_ham.3.b: "Nuotiamo nell'oro!"

 flavor_ham.4.title: "$flavor_ham.3.title$"
 flavor_ham.4.desc: "Siamo stati incaricati di gestire le finanze dei nostri patroni e dei loro partner commerciali. La prosperità dei mari del nord è nostra da amministrare, e non sprecheremo l'occasione."
 flavor_ham.4.a: "$flavor_ham.3.b$"
