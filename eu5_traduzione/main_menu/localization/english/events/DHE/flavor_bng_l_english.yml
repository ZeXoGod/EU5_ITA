l_english:
 flavor_bng.1.title: "L'Influenza di [target_artist.GetNameWithNoTooltip]"
 flavor_bng.1.entry: "Nur Qutb Alam e l'Ordine Chishti"
 flavor_bng.1.desc: "[target_artist.GetName], proveniente da una famiglia influente, ha ricevuto il plauso popolare come studioso e scrittore, preservando gli insegnamenti dell'Ordine Sufi Chishti in [ROOT.GetCountry.GetName]. Con la sua fama crescente tra [ROOT.GetCountry.Custom('IT_PEASANTS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] e [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], potremmo aumentare la nostra reputazione presso la popolazione invitandolo a corte e sponsorizzandolo. Ciò aumenterebbe ulteriormente l'influenza dell'ordine nel nostro paese, radicandone i valori nella nostra società."
 flavor_bng.1.a: "Patrociniamolo!"
 flavor_bng.1.b: "Non abbiamo bisogno di lui."
 flavor_bng.1.historical_info: "Nur Qutb Alam fu un leader dell'ordine Sufi Chishti in Bengala tra la fine del XIV secolo e l'inizio del XV secolo. L'Ordine Chishti godette di un duraturo patrocinio sotto i sovrani musulmani del Bengala. Sotto la sua guida, l'Ordine preservò la presenza musulmana durante il regno di Raja Ganesha, un induista."
 
 flavor_bng.2.title: "Le Opere Letterarie di [target_artist.GetNameWithNoTooltip]"
 flavor_bng.2.entry: "Syed Sultan completa il Nabibangsha"
 flavor_bng.2.desc: "Sotto il nostro continuo patrocinio, la cultura [ROOT.GetCountry.GetCulture.GetName] prospera, e numerosi artisti hanno fatto di [ROOT.GetCountry.GetCapital.GetName] la loro residenza permanente. [target_artist.GetName] ha lavorato su un'opera epica sui profeti del [ShowReligionGroupName('muslim')]. L'opera è una traduzione del #italic Qaṣaṣ al-anbiyā'#! in lingua [ShowLanguageName('bengali_language')], e se sponsorizzassimo la pubblicazione potremmo elevare le nostre opere letterarie autoctone a nuove vette."
 flavor_bng.2.a: "Questo segnerà l'inizio di una nuova era letteraria!"
 flavor_bng.2.b: "Non dovremmo spendere denaro per questo."
 
 flavor_bng.3.title: "La Città delle Moschee di [target_character.GetNameWithNoTooltip]"
 flavor_bng.3.entry: "Khan Jahan Ali - Khalifatabad"
 flavor_bng.3.desc: "Proveniente [ROOT.GetCountry.Custom('IT_NOBLES_DAL_NOSTRO')][ROOT.GetCountry.Custom('IT_NOBLES_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] regionale, [target_character.GetName] ha trasformato l'area attorno a [ShowLocationName('khalifatabad')] in una splendida città di moschee e ponti. Essendo la città situata nel Delta del Gange, non è stato un compito facile. Ciò nonostante, nelle sue capaci mani, [ShowLocationNameWithNoTooltip('khalifatabad')] sta rapidamente diventando un centro di rilievo tra le nostre città di zecca."
 flavor_bng.3.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_bng.3.a.entry: "$common_string_brilliant$"

 flavor_bng.4.title: "Le Città di Zecca di [ShowAreaNameWithNoTooltip('bengal_area')] Prosperano"
 flavor_bng.4.entry: "Città di Zecca in Bengala"
 flavor_bng.4.desc: "Con l'istituzione di nuove zecche nell'area di [ShowAreaName('bengal_area')], giunge una grande crescita economica. La fornitura stabile di monete sta portando non solo a una valuta rinomatamente solida, ma anche a una preferenza dei mercanti stranieri di commerciare nei nostri porti e nelle nostre città."
 flavor_bng.4.a: "Siamo ricchi!"

 flavor_bng.5.title: "La Moschea Adina a [ShowLocationNameWithNoTooltip('pandua')]"
 flavor_bng.5.entry: "Moschea Adina, Pandua"
 flavor_bng.5.desc: "[target_character.GetName] desidera celebrare la nostra indipendenza, duramente conquistata, dal governo tirannico [GetCountry('DLH').Custom('IT_Di')][GetCountry('DLH').GetName] tramite l'ornamento della [ShowBuildingTypeName('cathedral')] di recente commissionata a [ShowLocationName('pandua')]. Per questa impresa monumentale, dovremmo assumere solo i migliori architetti, esperti negli stili di [ShowRegionName('persia_region')] e di [ShowRegionName('crescent_region')]. Sebbene ciò sarebbe piuttosto costoso, mostrerebbe il nostro splendore e consoliderebbe la nostra eredità per i secoli a venire."
 flavor_bng.5.historical_info: "La Moschea Adina fu commissionata da Sikandar Shah nel 1373. Situata nella capitale imperiale di Pandua, la Moschea imitava il design dell'architettura sasanide persiana, con ulteriore ispirazione tratta dalla Grande Moschea di Damasco. Fu progettata per legittimare le ambizioni imperiali del Sultanato del Bengala e per celebrare le vittorie sul Sultanato di Delhi nel XIV secolo, assicurando l'indipendenza del giovane paese."
 flavor_bng.5.a: "Un piano meraviglioso."
 flavor_bng.5.b: "Non abbiamo denaro per edifici tanto sfarzosi."

 flavor_bng.6.title: "Gli Stati Vicini"
 flavor_bng.6.entry: "$flavor_bng.6.title$"
 flavor_bng.6.desc: "Poiché [target_character.GetName] desidera unificare [ShowRegionName('bengal_region')], ha iniziato a raccogliere un esercito e a provocare conflitti di confine con gli stati vicini, nella speranza di spingerli alla guerra."
 flavor_bng.6.a: "Unifichiamo [ShowRegionNameWithNoTooltip('bengal_region')]!"
 flavor_bng.6.b: "Mantenere la stabilità è preferibile."

 flavor_bng.7.title: "[target_location.GetNameWithNoTooltip]"
 flavor_bng.7.entry: "Pandua come capitale"
 flavor_bng.7.desc: "Il [target_location.GetRank.GetName] di [target_location.GetName] è stato il centro degli studiosi Sufi all'interno di [ShowRegionName('bengal_region')], permettendo alle sue strade e alla sua popolazione di prosperare. Con esso sotto il nostro controllo, potremmo forse farne la capitale [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]."
 flavor_bng.7.a: "Lasciamo prosperare [target_location.GetNameWithNoTooltip]!"
 flavor_bng.7.a.entry: "Lasciamo prosperare [ShowLocationNameWithNoTooltip('pandua')]!"
 flavor_bng.7.b: "[target_character.GetNameWithNoTooltip] preferisce la sede di [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."
 flavor_bng.7.b.entry: "Il personaggio preferisce la sede della capitale."

 flavor_bng.8.title: "Un Pretendente [ShowReligionAdjectiveWithNoTooltip('hindu')]"
 flavor_bng.8.entry: "Pretendente Induista"
 flavor_bng.8.desc: "La popolazione [ShowReligionAdjective('hindu')] [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] si è raccolta attorno a un governatore locale. Il suo nome è [target_character.GetName], un uomo di umili origini, stanco del governo [ShowReligionGroupAdjective('muslim')] [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetNameWithNoTooltip], che desidera usurpare il trono [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip] a [target_character2.GetName]."
 flavor_bng.8.a: "Forse è tempo di una nuova gestione..."
 flavor_bng.8.b: "Alle armi!"
 bng_muslim_nobles_become_disloyal_tt: "Tutti i nostri [pops|e] non-[ShowReligionAdjective('hindu')] [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] perderanno [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e]"
 bng_hindus_become_disloyal_tt: "Tutti i [pops|e] [ShowReligionAdjective('hindu')] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]"

 flavor_bng.9.title: "Promozione del Sufismo"
 flavor_bng.9.entry: "$flavor_bng.9.title$"
 flavor_bng.9.desc: "Le pratiche sufi si sono diffuse all'interno [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. Molti santuari sono stati loro dedicati, e persino alcune persone all'interno del [ROOT.GetCountry.GetGovernment.GetCourtTitle] seguono le loro idee. Forse potremmo sponsorizzarle ancora di più."
 flavor_bng.9.a: "Promuoveremo le pratiche sufi."
 flavor_bng.9.b: "Non c'è bisogno di spendere risorse per questo."

 flavor_bng.10.title: "Dare Priorità a [ShowRegionNameWithNoTooltip('bengal_region')]"
 flavor_bng.10.entry: "$flavor_bng.10.title$"
 flavor_bng.10.desc: "Le terre della regione [ShowRegionName('bengal_region')] sono ricche di risorse. [target_character.GetName] e il [ROOT.GetCountry.GetGovernment.GetCourtTitle] desiderano sfruttare queste risorse, creando nuove città e affermando [ROOT.GetCountry.GetName] come egemone economico."
 flavor_bng.10.a: "Iniziamo un'espansione interna."
 flavor_bng.10.b: "Siamo già in una buona posizione economica."

 flavor_bng.11.title: "Tradizioni Navali"
 flavor_bng.11.entry: "$flavor_bng.11.title$"
 flavor_bng.11.desc: "Il popolo [ROOT.GetCountry.GetCulture.GetName] ha avuto in passato una presenza rilevante all'interno di [ShowProvinceDefinitionName('bengal_high_sea_zones_province')], assicurandosi il controllo della costa e delle rotte commerciali lì presenti. Abbiamo rafforzato una delle marine più potenti all'interno di $india$ e abbiamo un'eredità di costruzione navale nella regione. Dovremmo promuovere anche questa tradizione, rafforzando il nostro porto a [target_location.GetName]."
 flavor_bng.11.a: "La nostra marina prospererà."
 flavor_bng.11.b: "Rafforzare le nostre terre è più importante."
 bng_buff_naval_parliament_debate_tt: "Per #Y 20#! anni, il [ShowParliamentIssueType('increase_naval_spending')] concederà ora #G +5%#! di [societal_values|e] verso [ShowSocietyDirectionName('naval')]"

 flavor_bng.12.title: "$firoz_minar$"
 flavor_bng.12.entry: "$flavor_bng.12.title$"
 flavor_bng.12.desc: "Con l'ossessione di [target_character.GetName] per l'architettura, ha deciso di creare una torre ispirata all'architettura della [ShowDynastyName('tughlaq_dynasty')]. Chiamata $firoz_minar$, è pensata per commemorare le vittorie di [target_character.GetNameWithNoTooltip]."
 flavor_bng.12.a: "Il capo architetto la renderà la torre più alta!"
 flavor_bng.12.b: "A cosa serve una semplice torre?"

 flavor_bng.13.title: "$dakhil_darwaza$"
 flavor_bng.13.entry: "$flavor_bng.13.title$"
 flavor_bng.13.desc: "Per fortificare la cittadella di [target_location.GetName], [target_character.GetName] desidera creare un nuovo ingresso principale per il [target_location.GetRank.GetName], chiamandolo $dakhil_darwaza$. [target_character.GetSheHe|U] vuole trasformarlo nel portale più elegante e grandioso di $india$. Sarebbe costoso, ma sarebbe glorioso."
 flavor_bng.13.a: "Che queste porte vengano costruite."
 flavor_bng.13.b: "[target_location.GetNameWithNoTooltip] è già fortificata."
 flavor_bng.13.b.entry: "[ShowLocationNameWithNoTooltip('gaur')] è già fortificata."

 flavor_bng.14.title: "$kusumba_mosque$"
 flavor_bng.14.entry: "$flavor_bng.14.title$"
 flavor_bng.14.desc: "Diverse moschee all'interno di [ShowRegionName('bengal_region')] hanno seguito l'architettura della [target_character.GetDynasty.GetName], e molte di esse sono già state costruite in quello stile. [target_character.GetName] è rimasto ossessionato dal crearne una nuova, con uno stile completamente diverso. Chiamandola $kusumba_mosque$, sostiene che sarà la gemma nera di [ShowRegionNameWithNoTooltip('bengal_region')]."
 flavor_bng.14.historical_info: "Durante l'apice del dominio Suri sul Bengala, diverse moschee furono costruite da questi sovrani in tutto il regno. Sebbene la maggior parte seguisse lo stesso stile, la Moschea di Kusumba seguì lo stile di quelle più antiche, indipendente dallo stile dei sovrani afghani."
 flavor_bng.14.a: "Sarà una grande moschea."
 flavor_bng.14.b: "$india$ non ha bisogno di altre moschee come questa."
 flavor_bng.14.c: "Sarà la più grande di tutto il [ShowReligionGroupNameWithNoTooltip('muslim')]."

 flavor_bng_1000_shared: "Relazioni con $china$"
 flavor_bng.1000.title: "$flavor_bng_1000_shared$"
 flavor_bng.1000.entry: "$flavor_bng.1000.title$"
 flavor_bng.1000.desc: "Il [GetInternationalOrganization('middle_kingdom').GetName], guidato da [target_country.GetName], potrebbe rivelarsi un alleato di valore. Sebbene non sia del tutto certo che riusciremo a convincerlo a sostenerci in un eventuale conflitto, possiamo almeno inviare emissari per rafforzare le relazioni tra i nostri due regni."
 flavor_bng.1000.a: "Ne vale lo sforzo."
 flavor_bng.1000.b: "Non c'è bisogno di farne nostri alleati."
 bng_no_diplomatic_ties_tt: "Non invieremo alcuna ambasciata a [target_country.GetName]"

 flavor_bng.1001.title: "$flavor_bng_1000_shared$"
 flavor_bng.1001.desc: "[target_country2.GetName] ha inviato un'ambasciata a [ROOT.GetCountry.GetCapital.GetName] nella speranza di stabilire relazioni migliori, e magari apprendere i metodi del nostro governo. Sebbene potremmo aumentare la nostra influenza lì, condividere i nostri metodi con degli estranei potrebbe non essere la scelta migliore."
 flavor_bng.1001.a: "Diamo loro il benvenuto!"
 flavor_bng.1001.b: "Non sono ben accetti qui."
 bng_rejected_agreement_tt: "[target_country2.GetName] non riceverà alcun bonus"
