l_english:
 flavor_cro.1000.title: "L'Unificazione di [ShowAreaNameWithNoTooltip('croatia_area')] e [ShowAreaNameWithNoTooltip('slavonia_area')]"
 flavor_cro.1000.entry: "L'Unificazione di Croazia e Slavonia - Croazia"
 flavor_cro.1000.desc: "L'inarrestabile espansione [GetCountry('TUR').Custom('IT_Di')][GetCountry('TUR').GetName] rappresenta una grave minaccia [ROOT.GetCountry.Custom('IT_AL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank], e la divisione delle terre governate [GetCountry('HUN').Custom('IT_CROWN_DAL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjectiveWithNoTooltip] potrebbe creare un punto debole che i nostri nemici potrebbero sfruttare. Data questa situazione, la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggerisce di proporre che [GetCountry('HUN').Custom('IT_La')][GetCountry('HUN').GetNameWithNoTooltip] ponga le regioni di [ShowAreaName('croatia_area')] e [ShowAreaName('slavonia_area')] sotto un'unica autorità. Sostengono che ciò aumenterebbe significativamente le nostre capacità difensive e alleggerirebbe il carico amministrativo."
 flavor_cro.1000.a: "Procediamo con la proposta."
 flavor_cro.1001.a.tt: "Ogni [location|e] posseduta che sia una [core|e] di $SVN$ o si trovi in [ShowAreaName('slavonia_area')] verrà trasferita [GetCountry('CRO').Custom('IT_Alla')][GetCountry('CRO').GetName]"
 flavor_cro.1000.b: "Questo sarebbe un peso per la nostra amministrazione."
 flavor_cro.1000.historical_info: "Storicamente, la Slavonia fu separata amministrativamente dalla Croazia, e venne governata da un proprio Ban, subordinato alla corona Ungherese. Tuttavia, l'avanzata dell'Impero Ottomano ridisegnò il quadro politico della regione, e le devastazioni causate dalla guerra costrinsero la popolazione a fuggire verso nord. Nel 1476, re Mattia I unificò le cariche di Ban di Croazia e Dalmazia e di Ban di Slavonia, cercando di coordinare più efficacemente la difesa contro le incursioni Ottomane. L'unione fu completata effettivamente nel 1558, quando i parlamenti di Croazia e Slavonia vennero politicamente integrati e unificati."

 flavor_cro.1001.title: "$flavor_cro.1000.title$"
 flavor_cro.1001.desc: "Messaggeri dei nostri sudditi [GetCountry('CRO').Custom('IT_In')][GetCountry('CRO').GetName] sono giunti alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] con la proposta di unire le cariche di Ban di [ShowAreaName('croatia_area')] e di Ban di [ShowAreaName('slavonia_area')]. Sostengono che un comando unificato rafforzerebbe le difese e alleggerirebbe il peso amministrativo di fronte alla minaccia [GetCountry('TUR').Custom('IT_ADJ_FS')]."
 flavor_cro.1001.a: "Una frontiera unificata rafforzerà le nostre difese."
 flavor_cro.1001.b: "[ShowAreaNameWithNoTooltip('slavonia_area')] appartiene [GetCountry('HUN').Custom('IT_CROWN_AL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjectiveWithNoTooltip]."
 flavor_cro.1001.b.entry: "[ShowAreaNameWithNoTooltip('slavonia_area')] appartiene alla $crown_estate$ $HUN_ADJ$."

 flavor_cro.1100.title: "Il Dominio di [target_character.GetNameWithNoTooltip]"
 flavor_cro.1100.entry: "Il Dominio di Ivan Nelipic"
 flavor_cro.1100.desc: "Un potente magnate di nome [target_character.GetName] sta guadagnando un'influenza crescente sugli affari [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. Nella sua regione d'origine, è riuscito a eliminare molti dei suoi nemici, e ha inoltre allentato la presa [GetCountry('HUN').Custom('IT_CROWN_DEL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjective] sugli affari regionali. Sebbene molti siano arrivati ad accettare questo assetto come vantaggioso, altri temono che [GetCountry('HUN').Custom('IT_La')][GetCountry('HUN').GetNameWithNoTooltip] possa in qualsiasi momento cercare di riaffermare la propria autorità. Per risolvere questa situazione, è stato proposto che, se [target_character.GetNameWithNoTooltip] riconoscesse l'autorità [GetCountry('HUN').Custom('IT_CROWN_DEL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')], allora [GetCountry('HUN').Custom('IT_La')][GetCountry('HUN').GetNameWithNoTooltip] dovrebbe, in cambio, riconoscere il suo dominio [ROOT.GetCountry.Custom('IT_Sulla')][ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_cro.1100.a: "Non immischiamoci con [GetCountry('HUN').Custom('IT_CROWN_IL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 flavor_cro.1100.a.entry: "Non immischiamoci con la $crown_estate$."
 flavor_cro.1100.b: "Inviamo l'offerta."
 flavor_cro.1100.historical_info: "Ivan Nelipić era un nobile Croato che nel 1322 prese di fatto il controllo della maggior parte della Croazia, dopo aver precedentemente deposto il Ban Mladen II Šubić. Durante il suo governo, il titolo di Ban di Croazia rimase vacante, e la Croazia sfuggì quasi completamente all'autorità Ungherese. Furono fatti numerosi tentativi, sia da parte della corona Ungherese che del Ban di Slavonia, per deporre Nelipić, ma alla fine fallirono tutti. L'Ungheria riuscì a riaffermare la propria autorità regia sulla Croazia solo nel 1345, dopo la morte di Ivan Nelipić."

 flavor_cro.1101.title: "[GetCountry('CRO').Custom('IT_La')|U][GetCountry('CRO').GetNameWithNoTooltip] Cerca un Compromesso"
 flavor_cro.1101.desc: "Da quando [ShowCultureNameWithNoTooltip('dalmatian')|U] [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] ha ottenuto la vittoria nella Battaglia di Bliska del 1322, [GetCountry('CRO').Custom('IT_La')][GetCountry('CRO').GetName] è dominata dal potente magnate [target_character.GetName], che ha costantemente minato lì l'autorità [GetCountry('HUN').Custom('IT_CROWN_DEL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjective]. Sorprendentemente, [target_character.GetLastNameWithNoTooltip] ha inviato un emissario alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] con un'offerta di compromesso. [target_character.GetSheHe|U] è pront[target_character.Custom('IT_ART_O_A')] a riconoscere formalmente l'autorità [GetCountry('HUN').Custom('IT_CROWN_DEL')][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjective] e a giurare fedeltà al trono. In cambio, [target_character.GetSheHe] chiede che riconosciamo [target_character.GetHerHim] come legittim[target_character.Custom('IT_ART_O_A')] sovran[target_character.Custom('IT_ART_O_A')] di [GetCountry('CRO').GetNameWithNoTooltip]."
 flavor_cro.1101.a: "L'unione resterà intatta."
 flavor_cro.1101.b: "Legittimiamo [target_character.GetHerHim]."
 flavor_cro.1101.b.entry: "Legittimiamolo."

 flavor_cro.1102.title: "[GetCountry('HUN').Custom('IT_La')|U][GetCountry('HUN').GetNameWithNoTooltip] Respinge la Nostra Rivendicazione"
 flavor_cro.1102.desc: "Il nostro inviato è tornato con notizie preoccupanti. [GetCountry('HUN').Custom('IT_CROWN_IL')|U][GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [GetCountry('HUN').GetAdjective] ha respinto la nostra proposta di riconoscere [target_character.GetName] come sovran[target_character.Custom('IT_ART_O_A')] di [GetCountry('CRO').Custom('IT_Di')][GetCountry('CRO').GetName], insistendo sul fatto che [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] sia parte integrante dell'unione. Sebbene il consenso generale presso la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] sia che non si possa fare molto al riguardo, alcuni suggeriscono misure estreme: porre fine alla Pacta Conventa che lega il nostro trono [GetCountry('HUN').Custom('IT_Alla')][GetCountry('HUN').GetNameWithNoTooltip], e incoronare [target_character.GetLastNameWithNoTooltip] come primo re nativo [GetCountry('CRO').Custom('IT_Di')][GetCountry('CRO').GetNameWithNoTooltip] in più di due secoli."
 flavor_cro.1102.a: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 flavor_cro.1102.a.entry: "$common_string_nothing_we_can_do_about_it$"
 flavor_cro.1102.b: "Poniamo fine alla Pacta Conventa e incoroniamo [target_character.GetLastNameWithNoTooltip]!"
 flavor_cro.1102.b.entry: "Poniamo fine alla Pacta Conventa e incoroniamolo!"

 flavor_cro.1103.title: "[GetCountry('CRO').Custom('IT_La')|U][GetCountry('CRO').GetNameWithNoTooltip] Pone Fine alla Pacta Conventa"
 flavor_cro.1103.desc: "A seguito del nostro rifiuto di riconoscere l'autorità di [target_character.GetName], [GetCountry('CRO').Custom('IT_La')][GetCountry('CRO').GetName] ha deciso di compiere un passo ben più drastico di quanto chiunque avesse previsto. Hanno dichiarato nulla e priva di effetto la Pacta Conventa, un accordo che li vincola [GetCountry('HUN').Custom('IT_CROWN_AL_NOSTRO')]nostr[GetCountry('HUN').Custom('IT_CROWN_OAI')] [GetCountry('HUN').GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]. Inoltre, [target_character.GetLastNameWithNoTooltip] è stat[target_character.Custom('IT_ART_O_A')] proclamat[target_character.Custom('IT_ART_O_A')] loro nuov[target_character.Custom('IT_ART_O_A')] [GetCountry('CRO').GetGovernment.GetRulerTitle]."
 flavor_cro.1103.a: "Questa ribellione non può essere tollerata!"
 flavor_cro.1103.b: "Non interverremo."
