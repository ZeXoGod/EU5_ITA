l_english:

 flavor_nav.1.title: "Governo Congiunto di [target_character.GetNameWithNoTooltip] e [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.1.entry: "Governo Congiunto di Giovanna II e Filippo di Évreux"
 flavor_nav.1.desc: "Dopo la loro ascesa al trono di [ROOT.GetCountry.GetName] nel 1329, [target_character.GetName] e [target_character_2.GetName] hanno governato [ROOT.GetCountry.GetFlavorRank] a stretto contatto; tuttavia, i possedimenti di [target_character_2.GetNameWithNoTooltip] in [ShowRegionName('france_region')] sono chiaramente preferiti dai co-sovrani, che lasciano spesso [ROOT.GetCountry.GetNameWithNoTooltip] per risiedere nei loro possedimenti [ShowCultureGroupNameWithNoTooltip('french_group')].\n\nSebbene la [ROOT.GetCountry.GetGovernment.GetCourtTitle] abbia trovato molti abili reggenti per governare [ROOT.GetCountry.GetFlavorRank] in assenza dei sovrani, negli ultimi anni sono cresciuti i malumori, con molti signori [ROOT.GetCountry.GetAdjectiveWithNoTooltip] che desiderano chiedere ai due sovrani di stabilirsi più permanentemente a [ROOT.GetCountry.GetCapital.GetName], affinché [ROOT.GetCountry.GetFlavorRank] non appaia debole agli occhi delle potenze straniere avide di conquista."
 flavor_nav.1.a: "I nostri possedimenti in [ShowRegionNameWithNoTooltip('france_region')] sono i più importanti."
 flavor_nav.1.b: "Entrambi i regni saranno amministrati in egual misura."
 flavor_nav.1.c: "Le terre di [ROOT.GetCountry.GetNameWithNoTooltip] devono essere la nostra priorità."

 flavor_nav.2.title: "Ascesa di [target_character.GetNameWithNoTooltip]"
 flavor_nav.2.entry: "Ascesa di Carlo di Navarra"
 flavor_nav.2.desc: "La morte di [GetCharacter('nav_jeanne_ii_capet').GetName] ha visto l'ambizioso [target_character.GetName] ascendere al trono. Arrivato a [ROOT.GetCountry.GetCapital.GetName] per la cerimonia e l'incoronazione [ROOT.GetCountry.GetGovernment.GetAdjective|U], [target_character.GetSheHe] si distingue già come un sovrano atipico, avendo [target_character.GetNameWithNoTooltip] espresso l'interesse a pronunciare il giuramento in [ShowDialectName('aragonese_dialect')]. Ciò ha causato una certa frustrazione tra [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], che preferirebbero che il giuramento fosse pronunciato nel tradizionale [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.a: "Pronuncia il giuramento in Romanzo."
 flavor_nav.2.b: "Un'idea sciocca: il giuramento deve essere in [ShowLanguageNameWithNoTooltip('latin_language')]."
 flavor_nav.2.c: "Fai invece pronunciare il giuramento in [ShowLanguageNameWithNoTooltip('basque_language')]."

 flavor_nav.3.title: "I Possedimenti di [target_character.GetNameWithNoTooltip]"
 flavor_nav.3.entry: "I Possedimenti Francesi di Carlo di Navarra"
 flavor_nav.3.desc: "Avendo ereditato sia le terre di [GetCharacter('nav_philip_iii_evreux').GetName] che quelle di [GetCharacter('nav_jeanne_ii_capet').GetName], [target_character.GetName] governa ora un territorio vastissimo, che comprende [ROOT.GetCountry.GetName] e diversi possedimenti all'interno di [ShowRegionName('france_region')]. Sebbene [GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] e [GetCharacter('nav_philip_iii_evreux').GetNameWithNoTooltip] governassero [ROOT.GetCountry.GetNameWithNoTooltip] congiuntamente, visitarono [ROOT.GetCountry.GetFlavorRank] solo brevemente, preferendo risiedere in [ShowRegionNameWithNoTooltip('france_region')].\n\nCon l'ascesa di [target_character.GetNameWithNoTooltip], molti alleati nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno esortato [target_character.GetHerHim] a stabilirsi più permanentemente in [ROOT.GetCountry.GetNameWithNoTooltip], sebbene altri ritengano che [ROOT.GetCountry.GetGovernment.GetRulerTitle] possa nutrire ambizioni maggiori verso il conteso trono di [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.a: "Mantieni gli affari della [ROOT.GetCountry.GetGovernment.GetCourtTitle] nei nostri possedimenti in [ShowRegionNameWithNoTooltip('france_region')]."
 flavor_nav.3.b: "Stabilisci la [ROOT.GetCountry.GetGovernment.GetCourtTitle] principale in [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.3.c: "Concentra il nostro governo da [evr_country.GetNameWithNoTooltip]."
 flavor_nav.3.c.entry: "Concentra il nostro governo da Évreux."
 nav_will_be_able_to_rally_other_appanages_tt: "Raggiungere #G 150#! relazioni con un suddito Appanage di [GetCountry('FRA').GetName] lo renderà più propenso a sostenerci in una guerra contro [GetCountry('FRA').GetNameWithNoTooltip] tramite la [decision|e] [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]"

 flavor_nav.4.title: "La Pretesa dei [ShowDynastyNameWithNoTooltip('capet_dynasty')]"
 flavor_nav.4.entry: "La Pretesa Capetingia"
 flavor_nav.4.desc: "Sebbene molti sospettassero che [target_character.GetName] fosse un sovrano ambizioso, pochi si aspettavano di sentire il suo desiderio di rivendicare direttamente il trono di [fra_country.GetName]. Sebbene la pretesa di [target_character.GetNameWithNoTooltip] sia forte grazie al sangue [ShowDynastyName('capet_dynasty')] di [GetCharacter('nav_jeanne_ii_capet').GetShortName], una delle condizioni dell'eredità di [ROOT.GetCountry.GetName] da parte di [GetCharacter('nav_jeanne_ii_capet').GetHerHis] fu la rinuncia alla pretesa su [fra_country.GetNameWithNoTooltip].\n\nSebbene molti signori di [fra_country.GetNameWithNoTooltip] siano anch'essi improbabili a riconoscere pienamente la pretesa di [target_character.GetNameWithNoTooltip] a causa dell'antica [ShowHeirSelectionName('salic_law')], alcuni ritengono che [target_character.GetNameWithNoTooltip] dovrebbe sfruttare la sua influenza politica all'interno di [fra_country.GetNameWithNoTooltip] per persuadere i signori più potenti."
 flavor_nav.4.a: "Il trono di [fra_country.GetNameWithNoTooltip] appartiene di diritto a [target_character.GetNameWithNoTooltip]!"
 flavor_nav.4.a.entry: "Il trono di Francia appartiene di diritto a Carlo!"
 flavor_nav.4.b: "Sfrutta queste pretese per ottenere legittimità presso i nostri sudditi [ShowCultureGroupNameWithNoTooltip('french_group')]."
 flavor_nav.4.c: "[GetCharacter('nav_jeanne_ii_capet').GetNameWithNoTooltip] ha già rinunciato alla sua pretesa: concentriamoci invece sul governare [ROOT.GetCountry.GetNameWithNoTooltip]."
 unlocks_enforce_the_capetian_claim_to_france_tt: "Sblocca la [decision|e] $navarre_charles_ii_claim_to_france.title$"
 nav_appanage_support_for_french_throne_tt: "Se [ROOT.GetCountry.GetNameWithNoTooltip] è un Appanage, raggiungere #G +150#! relazioni con altri sudditi Appanage di [GetCountry('FRA').GetNameWithNoTooltip] li renderà propensi a sostenerci in una guerra contro [GetCountry('FRA').GetNameWithNoTooltip] tramite la [decision|e] [ShowDecisionName('navarre_charles_ii_claim_to_france_appanage_route')]"

 flavor_nav.5.title: "Alleanza con [target_character_2.GetNameWithNoTooltip]"
 flavor_nav.5.entry: "Alleanza con Étienne Marcel"
 flavor_nav.5.desc: "Inizialmente, molti degli sforzi di [target_character.GetName] per raccogliere sostegno si sono arenati, con diversi signori [fra_country.GetAdjectiveWithNoTooltip] che hanno espresso la loro fedeltà a [fra_ruler.GetName] e hanno rigettato la pretesa di [target_character.GetNameWithNoTooltip]. Tuttavia, mentre [target_character.GetNameWithNoTooltip] è riuscito a convincere alcuni signori [fra_country.GetAdjectiveWithNoTooltip] minori, molti consiglieri di [target_character.GetShortNameWithNoTooltip] non si aspettavano di sentire che l'eminente [target_character_2.GetName] fosse disposto a gettare il proprio sostegno dietro [target_character.GetNameWithNoTooltip]. Sebbene membro dei [fra_country.GetAdjectiveWithNoTooltip] [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], [target_character_2.GetNameWithNoTooltip] è stato da tempo una spina nel fianco di [fra_ruler.GetNameWithNoTooltip], ostacolando molti degli sforzi di [fra_ruler.GetHerHis] negli Stati Generali. Sebbene [target_character_2.GetNameWithNoTooltip] si rivelerebbe una risorsa inestimabile, alcuni temono che le sue ambizioni possano divergere da quelle di [target_character.GetNameWithNoTooltip], e che quindi possa rivelarsi un rischio.\n\nInoltre, [target_character_2.GetNameWithNoTooltip] ha portato la notizia che i signori di [nrm_country.GetName] sono diventati scontenti di [fra_ruler.GetNameWithNoTooltip], e sarebbero probabilmente disposti a offrire il loro sostegno a [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.5.a: "[target_character_2.GetNameWithNoTooltip] si rivelerà un collaboratore inestimabile."
 flavor_nav.5.a.entry: "Étienne Marcel si rivelerà un collaboratore inestimabile."
 flavor_nav.5.b: "Fai sì che [target_character_2.GetHerHim] dirotti le entrate di [fra_country.GetNameWithNoTooltip] nelle nostre casse."
 flavor_nav.5.b.entry: "Fai sì che dirotti le entrate della Francia nelle nostre casse."
 flavor_nav.5.c: "Rifiuta del tutto il suo aiuto. Prenderemo [fra_country.GetNameWithNoTooltip] senza i suoi intrighi."
 flavor_nav.5.c.entry: "Rifiuta del tutto il suo aiuto. Prenderemo la Francia senza i suoi intrighi."
 nav_decision_seizure_of_duchy_of_normandy_tt: "Sblocca la [decision|e] $nav_coercing_of_normandy.title$"

 flavor_nav.6.title: "Una Fine di Fuoco"
 flavor_nav.6.entry: "La Morte tra le Fiamme di Carlo di Navarra"
 flavor_nav.6.desc: "Sebbene la salute di [target_character.GetName] sia peggiorata negli ultimi anni, la [ROOT.GetCountry.GetGovernment.GetCourtTitle] fu comunque sconvolta dalla notizia che era morto nelle sue stanze in un incendio la notte precedente. Voci che circolavano nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] sussurravano che, mentre veniva curato per la sua malattia, una candela fosse caduta sul letto di [target_character.GetNameWithNoTooltip] incendiandolo.\n\n[scope_our_heir.GetName] ascende ora al trono con ambizioni minori rispetto al suo predecessore, e molti si chiedono come gli scribi di [ROOT.GetCountry.GetName] ricorderanno il governo di [target_character.GetNameWithNoTooltip]."
 flavor_nav.6.a: "Il suo regno sarà ricordato come ambizioso, ma terribile."
 flavor_nav.6.b: "Sarà ricordato come il Conquistatore di [GetCountry('FRA').GetNameWithNoTooltip]!"
 flavor_nav.6.c: "Sarà ricordato per il suo avvicinamento a [ROOT.GetCountry.GetNameWithNoTooltip], nonostante le sue origini [ShowCultureGroupNameWithNoTooltip('french_group')]."
 flavor_nav.6.d: "Dovremmo invece guardare al futuro."

 flavor_nav.7.title: "Le Terre di Confine Contese"
 flavor_nav.7.entry: "Divisione delle Regioni di Confine"
 flavor_nav.7.desc: "Sebbene i rapporti tra [ROOT.GetCountry.GetName] e [cas_country.GetName] siano stati ostili in passato, i sovrani di [cas_country.GetNameWithNoTooltip] non hanno mai cercato di conquistare pienamente [ROOT.GetCountry.GetFlavorRank]. Tuttavia, nelle terre di confine di [ShowProvinceDefinitionName('biscay_province')], [ShowProvinceDefinitionName('gipuzkoa_province')] e [ShowProvinceDefinitionName('alava_province')], le tensioni tra le famiglie locali più potenti sono in aumento da tempo a causa dei confini mal definiti della regione.\n\nSebbene i rappresentanti di [cas_country.GetNameWithNoTooltip] e di [our_ruler.GetName] abbiano lavorato per risolvere le controversie di confine, lo scoppio della [ShowDisasterNameWithNoTooltip('castilian_civil_war')] in [cas_country.GetNameWithNoTooltip] ha notevolmente bloccato ulteriori negoziati, causando ancor più discordia tra le importanti dinastie regionali.\n\nCon [cas_country.GetNameWithNoTooltip] ora impantanata nel conflitto interno, i rappresentanti di queste famiglie locali hanno chiesto a [our_ruler.GetNameWithNoTooltip] di lanciare un'invasione per rivendicare le terre contese."
 flavor_nav.7.a: "Queste controversie territoriali, se non risolte, continueranno probabilmente a far infuriare le famiglie [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_nav.7.b: "Sospendi ogni ulteriore trattativa diplomatica: dobbiamo garantire che la nostra pretesa sulla regione sia salda!"

 flavor_nav.8.title: "Il Vuoto di Potere Si Riversa in [ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_nav.8.entry: "Il Vuoto di Potere Si Riversa in Navarra"
 flavor_nav.8.desc: "Sebbene la [ShowDisasterNameWithNoTooltip('castilian_civil_war')] sia terminata, le sue conseguenze si fanno ancora sentire in tutta [ShowRegionName('iberia_region')]. Con gran parte delle terre di confine ora meno presidiate, gran parte del malanimo tra le famiglie della regione si è trasformato in guerra aperta.\n\nData la scarsa forza di [cas_country.GetName], l'intensità del conflitto nella regione si rivelerebbe un compito scoraggiante per la [ROOT.GetCountry.GetGovernment.GetCourtTitle] di [ROOT.GetCountry.GetName] da risolvere da sola."
 flavor_nav.8.a: "Tempi pericolosi attendono [ROOT.GetCountry.GetNameWithNoTooltip]."
 nav_end_blood_feud_decision_enabled_tt: "Sblocca la [decision|e] $nav_end_the_blood_feuds.title$"
 nav_sow_division_in_the_borderlands_enabled_tt: "Sblocca la [decision|e] $nav_sow_division_in_the_borderlands.title$"

 flavor_nav.9.title: "Dissoluzione di [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')]"
 flavor_nav.9.entry: "Dissoluzione di Biscaglia"
 flavor_nav.9.desc: "Sebbene il controllo di [ShowProvinceDefinitionName('biscay_province')] sia stato a lungo conteso tra [cas_country.GetName] e [ROOT.GetCountry.GetName], la regione ha ospitato molte famiglie di spicco, tra cui la dinastia degli Haro, che si è distinta come il vassallo più influente e fedele. Tuttavia, [cas_country.GetNameWithNoTooltip] ha preso a dissolvere direttamente i titoli nella regione, annettendo in seguito le aree contese all'interno di [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')].\n\nQueste azioni da parte di [cas_country.GetNameWithNoTooltip] hanno fatto infuriare la famiglia Haro, che ha esortato la [ROOT.GetCountry.GetGovernment.GetCourtTitle] a finanziare i rivoltosi in [ShowProvinceDefinitionNameWithNoTooltip('biscay_province')] per reprimere coloro che hanno appoggiato l'annessione della regione da parte dei [cas_country.GetAdjectiveWithNoTooltip]."
 flavor_nav.9.a: "Non possiamo accondiscendere alle richieste della famiglia Haro senza incorrere nell'ira [cas_country.GetAdjectiveWithNoTooltip]."
 flavor_nav.9.a.entry: "Non possiamo accondiscendere alle richieste della famiglia Haro senza incorrere nell'ira castigliana."
 flavor_nav.9.b: "Sostieni la famiglia Haro mentre semina l'anarchia locale."

 flavor_nav.10.title: "Scontro tra i Leguizamón e gli Zamudiano a [target_location.GetNameWithNoTooltip]"
 flavor_nav.10.entry: "Scontro tra i Leguizamón e gli Zamudiano"
 flavor_nav.10.desc: "Sebbene le famiglie Leguizamón e Zamudiano abbiano esercitato una forte influenza in [ROOT.GetCountry.GetName], sono anche da tempo aspre rivali. Con il vuoto di potere causato dalla [ShowDisasterNameWithNoTooltip('castilian_civil_war')], le due famiglie sono state coinvolte in continue scaramucce in tutta la [ShowRegionName('iberia_region')] settentrionale. Tuttavia, il recente scontro a [target_location.GetName] si è rivelato un disastro per [target_location.GetRank.GetName], con gran parte della popolazione coinvolta.\n\nCon questa faida che ha ora raggiunto livelli pericolosi, molti hanno chiesto a [our_ruler.GetNameWithNoTooltip] di usare tutta l'autorità possibile per debilitare queste famiglie litigiose."
 flavor_nav.10.a: "Sfrutta l'autorità di [our_ruler.GetShortNameWithNoTooltip] per prevenire ulteriori spargimenti di sangue."
 flavor_nav.10.a.entry: "Sfrutta l'autorità della corona per prevenire ulteriori spargimenti di sangue."
 flavor_nav.10.b: "Non abbiamo altra scelta che lasciarli continuare."

 flavor_nav.11.title: "Le Famiglie Filo-[ROOT.GetCountry.GetAdjectiveWithNoTooltip] Ottengono la Superiorità nelle [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.11.entry: "Le Famiglie Filo-Navarresi Ottengono la Superiorità nelle Terre di Confine"
 flavor_nav.11.desc: "Sebbene i conflitti tra le famiglie filo-[ROOT.GetCountry.GetAdjective] e filo-[GetCountry('CAS').GetAdjective] nelle [ShowScriptedGeographyName('nav_contested_basque_borderlands')] abbiano lasciato un effetto devastante sulla regione, le famiglie [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sono riuscite a compiere l'impresa quasi impossibile, ripristinando gran parte dell'influenza di [ROOT.GetCountry.GetNameWithNoTooltip] sulle [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]. Sebbene [GetCountry('CAS').GetNameWithNoTooltip] possa ancora manovrare per riaffermare il proprio controllo sulla regione, ciò si rivelerà senza dubbio un'impresa costosa per la [GetCountry('CAS').GetAdjectiveWithNoTooltip] [GetCountry('CAS').GetGovernment.GetCourtTitle]."
 flavor_nav.11.a: "Che questo spiani la strada a una [ROOT.GetCountry.GetNameWithNoTooltip] più forte."
 navarre_gains_castile_basque_lands_tt: "Tutte le località possedute da [GetCountry('CAS').GetName] nelle [ShowScriptedGeographyName('nav_contested_basque_borderlands')] avranno un'alta probabilità di passare sotto il controllo di [ROOT.GetCountry.GetName], a meno che [GetCountry('CAS').GetNameWithNoTooltip] non decida di adottare misure drastiche per mantenere il controllo dei territori"

 flavor_nav.12.title: "Rafforzamento delle Hermandades"
 flavor_nav.12.entry: "$flavor_nav.12.title$"
 flavor_nav.12.desc: "Sebbene le Hermandades di [ROOT.GetCountry.GetName] si siano dimostrate alleate capaci in passato, i decenni di faide di sangue tra le varie famiglie [ROOT.GetCountry.GetAdjectiveWithNoTooltip] hanno raggiunto il punto di ebollizione.\n\nMolti membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno contribuito con fondi per sponsorizzare il ramo [ROOT.GetCountry.GetGovernment.GetAdjective|U] delle Hermandades. Sebbene si tratti di un'impresa costosa, una volta rafforzate, le Hermandades aiuteranno a far rispettare l'autorità di [our_ruler.GetName] sulle famiglie in lotta e a tenerle a freno una volta per tutte."
 flavor_nav.12.a: "Le Hermandades metteranno finalmente fine a queste liti familiari."

 flavor_nav.13.title: "[target_character.GetNameWithNoTooltip] e la Tutela di [scope_our_heir.GetNameWithNoTooltip]"
 flavor_nav.13.entry: "Juan de Beaumont e la Tutela dell'Erede"
 flavor_nav.13.desc: "Sebbene detengano influenza all'interno di [ROOT.GetCountry.GetName] da tempo, l'offerta dei Beaumontesi di istruire personalmente [scope_our_heir.GetName] è giunta come una sorpresa. Sebbene [target_character.GetName] abbia la reputazione di essere un uomo d'onore, alcuni consiglieri temono che la sua offerta di tutela possa essere una manovra per ingraziarsi [scope_our_heir.GetNameWithNoTooltip], che un giorno governerà [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_nav.13.a: "Sarebbe un eccellente tutore."
 flavor_nav.13.a.entry: "Sarebbe un eccellente tutore."
 flavor_nav.13.b: "Non possiamo rischiare che abbia influenza sul nostro [scope_our_heir.GetNameWithNoTooltip]."
 flavor_nav.13.b.entry: "Non possiamo rischiare che abbia influenza sul nostro erede."

 flavor_nav.14.title: "[scope_our_consort.GetNameWithNoTooltip] e [target_character.GetNameWithNoTooltip]"
 flavor_nav.14.entry: "L'Influenza della Consorte e di Pedro de Peralta"
 flavor_nav.14.desc: "Una delle casate di spicco nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], gli Agramontesi, ha accumulato una notevole influenza sotto [target_character.GetName], stabilendo al contempo una stretta collaborazione con [scope_our_consort.GetName]. Sebbene i loro contributi abbiano portato frutti per [ROOT.GetCountry.GetName], alcuni temono che nei loro intrighi si celino obiettivi più oscuri."
 flavor_nav.14.a: "Gli Agramontesi ci hanno servito bene."
 flavor_nav.14.b: "La sua influenza su [scope_our_consort.GetNameWithNoTooltip] è preoccupante: agisci per separarli."
 flavor_nav.14.b.entry: "La sua influenza sulla Consorte è preoccupante: agisci per separarli."

 flavor_nav.15.title: "L'Incombente Usurpazione di [the_legal_heir.GetNameWithNoTooltip]"
 flavor_nav.15.entry: "L'Incombente Usurpazione dell'Erede"
 flavor_nav.15.desc: "Sebbene [our_ruler.GetName] abbia mantenuto un governo stabile, è recentemente caduto malato e costretto a letto. Temendo che la fine della vita del/la [ROOT.GetCountry.GetGovernment.GetRulerTitle] sia vicina, i sostenitori agramontesi fedeli a [the_consort_usurper.GetName] hanno segretamente incoronato [the_consort_usurper.GetHerHim] nuovo sovrano di [ROOT.GetCountry.GetName].\n\nMentre [the_legal_heir.GetNameWithNoTooltip] è lontano dalla [ROOT.GetCountry.GetGovernment.GetCourtTitle], alcuni tra i Beaumontesi hanno segretamente inviato lettere al suo seguito, nella speranza di informarlo del tradimento agramontese. Se le lettere arriveranno in tempo, potrebbe esserci ancora tempo per raccogliere sostegno sufficiente a schiacciare il complotto agramontese prima che si realizzi."
 flavor_nav.15.a: "[the_consort_usurper.GetNameWithNoTooltip] è più adatto a guidare [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.15.a.entry: "La corte è più adatta a guidare la Navarra."
 flavor_nav.15.b: "Schierati con [the_legal_heir.GetNameWithNoTooltip], il legittimo sovrano di [ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_nav.15.b.entry: "Schierati con il nostro erede, il legittimo sovrano della Navarra!"
 flavor_nav.15.historical_info: "I co-sovrani Bianca I e Giovanni II decretarono che il loro figlio Carlo, il Principe di Viana, avrebbe dovuto ereditare il trono di Navarra alla morte di Bianca. Tuttavia, invece di passare a Carlo, il trono fu mantenuto da Giovanni II, che divenne di fatto Re rovesciando il proprio figlio. Con il sostegno dei Beaumontesi e degli Agramontesi, i due si scontrarono poi nella Guerra Civile Navarrese, che vide infine Giovanni II emergere vittorioso e conservare il trono di Navarra."

 flavor_nav.16.title: "La Pretesa [target_country.GetAdjectiveWithNoTooltip]"
 flavor_nav.16.desc: "Avendo raccolto un notevole sostegno in tutta [ShowRegionName('france_region')], [target_character.GetName] si è apertamente dichiarato per il trono di [ShowRegionNameWithNoTooltip('france_region')], e ha inviato messaggeri in tutta [ShowRegionNameWithNoTooltip('france_region')] offrendo un'ultima possibilità di unirsi a lui nel suo tentativo di impadronirsene. Sebbene [target_character.GetShortNameWithNoTooltip] si sia guadagnato molto favore presso la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], alcuni nel consiglio temono che possa destabilizzare notevolmente [ShowRegionNameWithNoTooltip('france_region')], qualora dovesse riuscire."
 flavor_nav.16.a: "Ci dichiareremo per [target_character.GetNameWithNoTooltip]."
 flavor_nav.16.b: "Rimani fuori da questo conflitto."
 flavor_nav.16.c: "Deve essere fermato."
 nav_appanage_ally_join_war_tt: "[ROOT.GetCountry.GetName] si unirà alla guerra di [target_character.GetName] per il controllo di [ShowRegionName('france_region')]"

 flavor_nav.17.title: "La Difficile Situazione delle [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')]"
 flavor_nav.17.desc: "Molti dei nostri territori lungo le [ShowScriptedGeographyName('nav_contested_basque_borderlands')] con [GetCountry('NAV').GetName] sono stati invasi da fazioni filo-[GetCountry('NAV').GetAdjectiveWithNoTooltip], con molte famiglie [ShowCultureName('basque')] fedeli a [ROOT.GetCountry.GetName] lasciate devastate. Sebbene alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] ritengano che la regione non sia ancora perduta, sarà difficile riconquistare l'autorità con gran parte della popolazione ora in debito verso le potenti famiglie [GetCountry('NAV').GetAdjectiveWithNoTooltip]."
 flavor_nav.17.a: "Lascia che le terre di confine facciano secessione verso [GetCountry('NAV').GetNameWithNoTooltip]."
 flavor_nav.17.b: "Ricorderemo questa rivolta da parte dei popoli [ShowCultureNameWithNoTooltip('basque')]."
 flavor_nav.17.c: "Agisci rapidamente per schiacciare la rivolta, a qualunque costo!"

 flavor_nav.20.title: "San Francisco de Olite"
 flavor_nav.20.entry: "$flavor_nav.20.title$"
 flavor_nav.20.desc: "Essendo una persona devota, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] non può accettare il lento avanzamento dei lavori del Convento di San Francesco a [ShowLocationName('olite')].\n\nIl convento fu iniziato più di un secolo fa e non può ancora essere considerato terminato.\n\nNonostante l'impatto che accelerare i lavori potrebbe avere sul nostro tesoro, il luogo e il nostro prestigio potrebbero trarne grande beneficio."
 flavor_nav.20.a: "Praise God!"
 flavor_nav.20.b: "Ha aspettato finora, può aspettare ancora."
 flavor_nav.20.historical_info: "Secondo la leggenda, San Francesco d'Assisi fondò il convento di Olite durante il suo pellegrinaggio a Santiago de Compostela (intorno al 1213-1214).\n\nFondato dal re Teobaldo II, i successivi monarchi navarresi, in particolare Giovanna II e Carlo II, sostennero l'ordine finanziariamente e spiritualmente, favorendone la crescita e la devozione.\n\nCol tempo, il convento subì diverse trasformazioni, diventando un 'Collegio Apostolico' per la formazione e l'invio di missionari in Spagna e in America, o fungendo da ospedale durante la Guerra della Convenzione nel 1795."
 flavor_nav.21.title: "La Chiamata della Chiesa"
 flavor_nav.21.entry: "$flavor_nav.21.title$"
 flavor_nav.21.desc: "[target_character.GetName], la prima e maggiore figlia del nostro [ROOT.GetCountry.GetGovernment.GetRuler.GetName], attende il corteo che l'accompagnerà alla sua nuova vita a [ShowLocationName('paris')].\n\nQuando nacque, le stelle parvero sorriderle, essendo l'erede di tutto ciò che possedevano i suoi genitori, ma non più. Il suo matrimonio con [GetCountry('ARA').GetGovernment.GetRuler.GetName] fu annullato ed ella divenne un ostacolo per la sorella minore [target_sister.GetShortName].\n\nOra entrerà a far parte della [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] a [ShowLocationNameWithNoTooltip('paris')] e servirà il nostro Signore e Salvatore.\n\nTuttavia, alcuni si chiedono se non possa ancora essere utile al regno, rivelandosi una possibile risorsa in altre trattative diplomatiche."
 flavor_nav.21.a: "Diventerà una monaca."
 flavor_nav.21.b: "Può ancora essere utile."
 flavor_nav.21.historical_info: "Nonostante Giovanna fosse promessa in sposa a Pietro IV d'Aragona, il matrimonio non avvenne mai. Gli storici ipotizzano che potesse aver sofferto di una condizione o malattia che la rendeva poco appetibile come sposa. Maria, la sorella minore, prese il suo posto e sposò Pietro al suo posto.\n\nPoiché questo matrimonio avvenne, Giovanna fu costretta a rinunciare ai suoi diritti di successione ed entrò nell'Abbazia Francescana di Longchamp, vicino a Parigi, come membro delle Clarisse Povere."
 flavor_nav.30.title: "Irrigation Projects in Tudela"
 flavor_nav.30.entry: "$flavor_nav.30.title$"
 flavor_nav.30.desc: "Anche quando il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] trascorre molto del suo tempo nei suoi possedimenti in [ShowRegionName('france_region')], trova sempre tempo per sviluppare nuovi progetti in [ROOT.GetCountry.GetLongName].\n\nLe parti meridionali di [ROOT.GetCountry.GetFlavorRank], attorno a [ShowLocationName('tudela')], sono note per la loro fertilità, ma anche per la loro aridità, e scavare alcuni canali per migliorare l'irrigazione dei campi può far crescere i raccolti più forti."
 flavor_nav.30.a: "Il terreno sarà molto più produttivo."
 flavor_nav.30.b: "Non possiamo permetterci queste spese."
 flavor_nav.30.historical_info: "Durante il loro regno, sia Giovanna II che Filippo III intrapresero diversi progetti di sviluppo economico in tutto il Regno di Navarra, inclusa l'espansione dei sistemi di irrigazione attorno a Tudela, la città più importante del sud del Regno."
 flavor_nav.40.title: "A Copy of the Fueros of Navarra"
 flavor_nav.40.entry: "$flavor_nav.40.title$"
 flavor_nav.40.desc: "Poiché il coinvolgimento del [ROOT.GetCountry.GetGovernment.GetRulerTitle] nei doveri quotidiani del regno diventa più frequente, è stata ordinata una copia dei #italic Fueros di Navarra#! per lui.\n\nLa copia proposta sarà splendidamente decorata, con una pregevole copertina in pelle della migliore qualità e scritta dai copisti più abili del regno. Come da tradizione, il testo sarà scritto in [spanish_language.GetName], con qua e là interessanti termini in [basque_language.GetName].\n\nSfortunatamente, il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] parla in [french_language.GetName] e non sa parlare il Romanzo Navarrese."
 flavor_nav.40.a: "A translation to [french_language.GetNameWithNoTooltip] will be added."
 flavor_nav.40.a.entry: "A translation to [ShowLanguageNameWithNoTooltip('french_language')] will be added."
 flavor_nav.40.b: "Forse è tempo che i nostri sovrani imparino la lingua di questa terra."
 flavor_nav.40.c: "Il basco dovrebbe essere la lingua ufficiale, se è quella più parlata."
 flavor_nav.40.historical_info: "Sebbene sia probabile che la maggior parte della popolazione del Regno di Navarra avesse il basco (#italic Lingua Navarrorum#!) come lingua madre, la documentazione ufficiale del regno era perlopiù scritta in navarro-aragonese (#italic Ydiomate Navarre Terrae#!, #italic Ydiomate Navarre#! o #italic Lengoage de Navarra#!), mentre l'occitano cadeva in declino.\n\nInoltre, erano comuni anche varianti francesi, sin da quando le prime dinastie francesi entrarono nel regno, a partire dalla Casa di Champagne nel 1234."
 flavor_nav.50.title: "The Siege of Algeciras"
 flavor_nav.50.entry: "$flavor_nav.50.title$"
 flavor_nav.50.desc: "Notizie di guerra al confine [target_country.GetAdjective] sono giunte al regno. [GetCountry('CAS').GetName] ha ripreso la Crociata contro [target_country.GetNameWithNoTooltip] e [target_character.GetName] è tornato rapidamente a [ROOT.GetCountry.GetName] per prendere parte ai combattimenti.\n\nNonostante l'apparente mancanza di beneficio per [ROOT.GetCountry.GetFlavorRank], abbiamo sempre sentito che fosse nostro dovere aiutare i nostri vicini a scacciare i [ShowReligionGroupAdjective('muslim')] da [ShowRegionName('iberia_region')]."
 flavor_nav.50.a: "[target_character.GetShortNameWithNoTooltip] comanderà i nostri combattenti."
 flavor_nav.50.a.entry: "Il personaggio comanderà i nostri combattenti."
 flavor_nav.50.b: "Dobbiamo inviare uomini alla Crociata, ma non dovremmo inviare [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.50.b.entry: "Dobbiamo inviare uomini alla Crociata, ma non dovremmo inviare lui."
 flavor_nav.50.c: "Questa non è una questione che riguarda [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_nav.50.c.entry: "Questa non è una questione che ci riguarda."
 flavor_nav.50.historical_info: "Nel 1343, il re Filippo di Navarra si preparò a unirsi alla crociata contro Granada, sottolineando il proprio dovere di sovrano di un regno iberico. La sua presenza all'assedio di Algeciras, sostenuta dalle provviste del Golfo di Biscaglia, fu cruciale nonostante le forze militari limitate. Sfortunatamente, Filippo si ammalò, portando alla sua morte nel settembre del 1343. Il suo corpo fu riportato a Pamplona per la sepoltura, mentre il suo cuore trovò riposo a Parigi. Giovanna, la sua vedova, ricevette le condoglianze di Papa Clemente VI. Algeciras cadde infine, e Giovanna continuò a regnare fino alla sua morte nel 1349, lasciando la corona al loro figlio, Carlo II."
 flavor_nav.60.title: "Il Testamento di una Regina"
 flavor_nav.60.entry: "$flavor_nav.60.title$"
 flavor_nav.60.desc: "[target_character.GetName] è morta e il suo testamento è stato letto. In esso, [target_character.GetSheHeFormal] chiede al suo successore di aggiungere una cappella alla chiesa di Santa Maria la Real a [ShowLocationName('olite')].\n\nAlcuni cortigiani hanno proposto di dedicare la cappella alla Concezione della Santa Maria, e il nostro sovrano, [ROOT.GetCountry.GetGovernment.GetRuler.GetName], è piuttosto convinto dell'idea, sapendo quanto fosse pia [target_character.GetShortNameWithNoTooltip]."
 flavor_nav.60.a: "Il volere di una madre deve essere rispettato."
 flavor_nav.60.b: "Abbiamo in mente usi migliori per quel denaro."
 flavor_nav.60.historical_info: "Quando la regina Giovanna II morì di peste nera nel 1349, il suo ultimo testamento fu letto e, tra le sue richieste, chiese a suo figlio Carlo II di finanziare una cappella nella chiesa gotica di Santa Maria La Real de Olite.\n\nQuesta chiesa era utilizzata dalla Casa di Évreux per i propri riti religiosi e il suo stile è influenzato dalla Cattedrale parigina di Notre-Dame."

 # Decisions
 navarre_charles_ii_claim_to_france.title: "Legittima Pretesa su [GetCountry('FRA').GetNameWithNoTooltip]"
 navarre_charles_ii_claim_to_france.desc: "Sebbene [GetCharacter('nav_jeanne_ii_capet').GetName] abbia rinunciato alla sua pretesa su [GetCountry('FRA').GetNameWithNoTooltip], [GetCharacter('nav_charles_ii_evreux').GetName] mantiene ancora una discendenza di sangue diretta dall'antico [GetCharacter('fra_louis_x_capet').GetName]. Anche se la [ShowHeirSelectionName('salic_law')] dovesse a torto dichiarare [GetCharacter('nav_charles_ii_evreux').GetNameWithNoTooltip] non ammissibile, la sua pretesa resta comunque più forte di quella degli attuali sovrani di [GetCountry('FRA').GetNameWithNoTooltip]!"
 navarre_charles_ii_claim_to_france.a: "Ora è il momento di far valere la nostra legittima pretesa su [GetCountry('FRA').GetNameWithNoTooltip]!"

 navarre_charles_ii_claim_to_france_appanage_route.title: "$navarre_charles_ii_claim_to_france.title$"
 navarre_charles_ii_claim_to_france_appanage_route.desc: "$navarre_charles_ii_claim_to_france.desc$"
 navarre_charles_ii_claim_to_france_appanage_route.a: "È giunto il momento di scatenare una guerra civile per rivendicare il trono!" 
 nav_appanage_willingness_to_join_tt: "Raggiungere #G +150#! relazioni con altri sudditi Appanage di [GetCountry('FRA').GetNameWithNoTooltip] li renderà propensi a sostenerci in una guerra contro [GetCountry('FRA').GetNameWithNoTooltip] per impadronirci del trono"

 nav_coercing_of_normandy.title: "Coercizione di [GetCountry('NRM').GetNameWithNoTooltip]"
 nav_coercing_of_normandy.desc: "Essendo stati in prima linea nella [ShowSituationNameWithNoTooltip('hundred_years_war')], molti signori di [GetCountry('NRM').GetName] sono diventati insoddisfatti dell'attuale sovrano di [GetCountry('FRA').GetName]. Attraverso l'eredità delle terre di [GetCharacter('nav_philip_iii_evreux').GetName], [GetCharacter('nav_charles_ii_evreux').GetName] ha mantenuto strette relazioni con persone nel [GetCountry('NRM').GetFlavorRank], alcune delle quali potrebbero essere disposte ad accettare [GetCharacter('nav_philip_iii_evreux').GetShortNameWithNoTooltip] come loro nuovo signore feudale."
 nav_coercing_of_normandy.a: "Prendi il controllo di [GetCountry('NRM').GetNameWithNoTooltip]!" 

 nav_end_the_blood_feuds.title: "Metti Fine alle Faide di Sangue"
 nav_end_the_blood_feuds.desc: "Dalla fine della [ShowDisasterName('castilian_civil_war')], gran parte di [GetCountry('NAV').GetName] è stata oggetto di faide di sangue di lunga data tra le famiglie, rese audaci dall'influenza regionale [GetCountry('CAS').GetAdjectiveWithNoTooltip] indebolita. Ora che l'influenza [GetCountry('NAV').GetAdjectiveWithNoTooltip] si è rafforzata, possiamo sfruttarla e porre fine a queste faide una volta per tutte."
 nav_end_the_blood_feuds.a: "L'autorità è stata ripristinata!"  

 nav_sow_division_in_the_borderlands.title: "Semina Divisione nelle Terre di Confine"
 nav_sow_division_in_the_borderlands.desc: "Con l'influenza [GetCountry('CAS').GetAdjective] nelle [ShowScriptedGeographyName('nav_contested_basque_borderlands')] ridotta a una frazione di quella che era, le faide in corso tra le famiglie della regione fedeli a [GetCountry('NAV').GetName] potrebbero risultare utili, qualora scegliessimo di appoggiare la loro guerra aperta contro le altre famiglie ancora fedeli a [GetCountry('CAS').GetNameWithNoTooltip]. Sebbene possa rivelarsi un'impresa costosa, le [ShowScriptedGeographyNameWithNoTooltip('nav_contested_basque_borderlands')] potrebbero riunirsi ancora una volta a [GetCountry('NAV').GetNameWithNoTooltip]."
 nav_sow_division_in_the_borderlands.a: "Concedi il permesso di radere al suolo i possedimenti delle famiglie rivali."  
 nav_sow_division_in_the_borderlands.b: "Incendia la periferia delle terre di confine." 
 nav_sow_division_in_the_borderlands.c: "Semina sfiducia nelle terre controllate dai [GetCountry('CAS').GetAdjectiveWithNoTooltip]." 
 nav_sow_division_in_the_borderlands_a_tt: "Ogni [location|e] [owned|e] da [GetCountry('CAS').GetName] nelle [ShowScriptedGeographyName('nav_contested_basque_borderlands')] otterrà [ShowModifier('nav_feud_crossfire')] per 3 anni e perderà una pesante quantità di [prosperity|e] e [pop_satisfaction|e]"
 nav_sow_division_in_the_borderlands_b_tt: "Ogni [location|e] [owned|e] da [GetCountry('CAS').GetName] nelle [ShowScriptedGeographyName('nav_contested_basque_borderlands')] otterrà [ShowModifier('nav_destructive_feuds')] per 3 anni e perderà una lieve quantità di [prosperity|e], [pop_satisfaction|e] e [development|e]"
 nav_sow_division_in_the_borderlands_c_tt: "Ogni [location|e] [owned|e] da [GetCountry('CAS').GetName] nelle [ShowScriptedGeographyName('nav_contested_basque_borderlands')] otterrà [ShowModifier('nav_widespread_distrust_caused_by_feuds')] per 3 anni e perderà una lieve quantità di [prosperity|e], [pop_satisfaction|e] e [control|e]"
