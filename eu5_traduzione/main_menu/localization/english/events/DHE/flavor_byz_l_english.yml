BYZ_THE_COST_WILL_SCALE_WITH_RULERS_ADM: "La quantità di [gold|e] che pagheremo scalerà con [adm|e] di [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
BYZ_THE_COST_WILL_SCALE_WITH_RULERS_MIL: "La quantità di [gold|e] che pagheremo scalerà con [mil|e] di [ROOT.GetCountry.GetGovernment.GetRuler.GetName]."
BYZ_STABILITY_DEPENDS_ON_RULER_ADM: "La quantità di [stability|e] che otterremo scalerà con [adm|e] di [target_character.GetName]."

flavor_byz.1502.title: "Le Credenze di [target_character.GetNameWithNoTooltip]"
 flavor_byz.1502.entry: "Le Credenze di Gemistos Plethon" 
flavor_byz.1502.desc: "Da parecchio tempo la presenza di [target_character.GetName] ha completato i nostri sforzi artistici e culturali. Gli insegnamenti di [target_character.GetHerHis] in materia di giurisprudenza e ricerche erudite non sono secondi a nessuno, attirando molte discipline che sicuramente influenzeranno il [ShowInstitutionName('renaissance')] a modo loro.\n\nTuttavia, di recente [target_character.GetSheHe] è diventato più aperto riguardo alla vera fede di [target_character.GetHerHis], [ShowReligionName('hellenism_religion')], con grande sgomento dei [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] a [ROOT.GetCountry.GetCapital.GetName]. Secondo loro, tale eresia minaccia le nostre tradizioni e la stabilità dell'intero [ROOT.GetCountry.GetFlavorRank]."
flavor_byz.1502.a: "Bandiamo [target_character.GetHerHim]!"
flavor_byz.1502.b: "Gli dei di [target_character.GetHerHis] proteggeranno [target_character.GetHerHim] dal boia?"
flavor_byz.1502.c: "[target_character.GetSheHe|U] è troppo importante, permettiamo a [target_character.GetHerHim] di continuare."
flavor_byz.1502.d: "Forse [target_character2.GetShortNameWithNoTooltip] ascolterà gli insegnamenti di [target_character.GetHerHis]."
flavor_byz.1502.e: "Forse [target_character.GetSheHe] ha ragione, dopotutto."
every_true_faith_pop_loses_20_satisfaction_tt: "I [pops|e] in [ROOT.GetCountry.GetCapital.GetName] che seguono [ROOT.GetCountry.GetReligion.GetName] perderanno [ShowNamedValue('pop_satisfaction_severe_penalty')|+=2%] di [pop_satisfaction|e]"
everyone_converts_tt: "Ogni membro della famiglia di [target_character2.GetName] abbraccerà [ShowReligionNameWithNoTooltip('hellenism_religion')]"

flavor_byz.1503.title: "Un Nemico Comune"
 flavor_byz.1503.entry: "$flavor_byz.1503.title$" 
flavor_byz.1503.desc: "L'ascesa fulminea del [GetCountry('TUR').GetLongName] ha sconvolto l'equilibrio di potere in [ShowRegionName('anatolia_region')]. La sua espansione aggressiva gli ha procurato molti nemici da ogni lato. [target_character2.GetName] si è opposto alla minaccia [GetCountry('TUR').GetAdjective] per decenni. Forse sarebbe saggio rafforzare le nostre relazioni e presentare un fronte unito, per non rischiare di cadere preda delle ambizioni espansionistiche di [GetCountry('TUR').GetGovernment.GetRulerOrRegent.GetName]."
flavor_byz.1503.historical_info: "Nel corso del XIV secolo, gli Aydinids, un Beylik turco con base nell'Anatolia occidentale, mantennero una relazione cordiale ma complessa con l'Impero Bizantino. Inizialmente furono coinvolti in una serie di alleanze e scontri con i Bizantini mentre espandevano il loro territorio. A volte, i sovrani Aydinid cooperarono con i Bizantini, servendo come mercenari o persino alleati contro altri Beylik turchi e il crescente Impero Ottomano. Tuttavia, questa cooperazione era spesso opportunistica e pragmatica, con entrambe le parti che cercavano di sfruttare la forza militare dell'altra per mutuo beneficio, come schiacciare un nemico vicino."
flavor_byz.1503.a: "Dobbiamo cercare amici ovunque possiamo trovarli."
flavor_byz.1503.b: "Non ci curiamo degli affari di signori meschini." 
