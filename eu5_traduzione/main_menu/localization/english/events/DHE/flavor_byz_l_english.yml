angry_barlaamite_clergy_tt: "A causa del loro sostegno a [target_character_1.GetName], circa [ROOT.GetVariable('num_barlaamite_pops_variable').GetValue|V0] [pops|e] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] in tutto il nostro [ROOT.GetCountry.GetFlavorRank] subiranno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]" 
angry_palamite_clergy_tt: "A causa del loro sostegno a [target_character_2.GetName], circa [ROOT.GetVariable('num_clergy_palamite_pops_variable').GetValue|V0] [pops|e] [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] in tutto il nostro [ROOT.GetCountry.GetFlavorRank] subiranno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]" 
negatively_affect_succ_crisis_tt: "La nostra indecisione su questa questione avrà effetti collaterali negativi durante l'[event|e] di apertura del [disaster|e] [ShowDisasterName('byzantine_succession_crisis')]" 
pay_for_your_indecisiveness_tt: "A causa della nostra posizione indecisa e indifferente nell'[event|e] $flavor_byz.1100.title$, la perdita di [stability|e] è notevolmente amplificata" 

flavor_byz.1101.title: "[target_character.GetNameWithNoTooltip] Arriva a [target_location.GetNameWithNoTooltip]"
 flavor_byz.1101.entry: "Uno Studioso Barlaamita Arriva a Corte" 
flavor_byz.1101.desc: "I dibattiti eruditi di natura teologica non sono estranei a esiti accesi e persecuzioni. Tale, a quanto pare, è il caso di [target_character.GetName], la cui opposizione al #italic Hesychasm#! ha provocato una frattura tra lo studioso e [target_character3.GetName], con il risultato che l'altro è stato bandito e cerca rifugio nelle nostre sale."
flavor_byz.1101.a: "Cosa sta succedendo nel [target_country.GetLongName]?"

flavor_byz.1102.title: "Dibattito per i Secoli"
 flavor_byz.1102.entry: "$flavor_byz.1102.title$" 
flavor_byz.1102.desc: "'Questa calamità è l'inizio della fine per la fede [ShowReligionAdjective('orthodox')]?' Tali sussurri ansiosi risuonano ora nei chiostri mentre la disputa tra [target_character2.GetName] e [target_character.GetName] si approfondisce.\n\nIl primo si erge come fervente difensore della tradizione esicasta, mentre il secondo lavora instancabilmente per denunciare questi insegnamenti come errore e illusione. Le accuse hanno ceduto il passo alla condanna aperta, e gli appelli alla ragione ricevono risposta con invocazioni dell'autorità divina. Ciò che iniziò come un disaccordo teologico ora minaccia di dividere i fedeli di [target_location.GetName] in campi ostili.\n\nA meno che questa questione non venga risolta rapidamente e con saggezza, l'indignazione potrebbe superare i confini del discorso e precipitare nel disordine, forse persino nella ribellione." 
flavor_byz.1102.a: "Il nostro sostegno all'esicasmo è saldo!" 
flavor_byz.1102.b: "[target_character.GetNameWithNoTooltip] apprezzerà la nuova casa di [target_character.GetHerHis] in [target_country.GetNameWithNoTooltip]."
 variable_hesychasm_activated_variable_tt: "The Hesychast Doctrine has been Embraced" #NEW
church_condemns_ongoing_debates_tt: "Figure potenti dei [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] condannano la nostra posizione di difesa dell'Hesychasm" 

flavor_byz_title_key: "Una Mano per la Pace"
flavor_byz.1200.title: "$flavor_byz_title_key$"
 flavor_byz.1200.entry: "$flavor_byz.1200.title$" 
flavor_byz.1200.desc: "Le tendenze antagonistiche di [GetCountry('TUR').GetName] si sono dimostrate difficili da gestire e una distrazione dai nostri veri obiettivi di stabilizzare il nostro [ROOT.GetCountry.GetFlavorRank]. Fortunatamente, il sovrano del nostro vicino turbolento e litigioso, [orhan_scope.GetName], ha mostrato interesse per l'amabile figlia del nostro sovrano, l'amata [theodora_scope.GetName].\n\nPossiamo promettere la mano di [theodora_scope.GetShortNameWithNoTooltip] a [orhan_scope.GetShortNameWithNoTooltip] e garantire un'alleanza duratura che ponga fine alle sue aggressioni."
flavor_byz.1200.historical_info: "Durante la Guerra Civile Bizantina del 1341 - 1347, la figlia dell'Imperatore John VI Kantakouzenos, Theodora Kantakouzenos, sposò il Bey turco Orhan Gazi per contribuire a cementare l'alleanza tra i due paesi e assicurare che gli Ottomani non cambiassero schieramento iniziando a sostenere il rivale di John, l'Imperatrice Reggente Anna of Savoy."
flavor_byz.1200.a: "Inviamo il messaggio."
flavor_byz.1200.b: "Non scambieremo [theodora_scope.GetShortNameWithNoTooltip] per la pace."

flavor_byz.1201.title: "$flavor_byz_title_key$"
flavor_byz.1201.desc: "Il debole sovrano di [GetCountry('BYZ').GetName] è disposto a dare la sua graziosa figlia [theodora_scope.GetName] perché si aggiunga all'harem del nostro valoroso sovrano [orhan_scope.GetName] in cambio di un'alleanza politica.\n\nChe dobbiamo fare di questa proposta?"
flavor_byz.1201.historical_info: "$flavor_byz.1200.historical_info$"
flavor_byz.1201.a: "Accettiamo la nuova sposa."
flavor_byz.1201.b: "Rifiutiamola."


flavor_byz.1202.title: "$flavor_byz_title_key$"
flavor_byz.1202.desc: "[orhan_scope.GetName] ha accettato la nostra proposta, [theodora_scope.GetName] lo sposerà e garantirà la pace tra le nostre nazioni."
flavor_byz.1202.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

flavor_byz.1203.title: "$flavor_byz_title_key$"
 flavor_byz.1203.entry: "$flavor_byz.1203.title$" 
flavor_byz.1203.desc: "[orhan_scope.GetName] ha rifiutato la nostra proposta, sta certamente preparando il suo paese a intensificare le ostilità tra i nostri paesi."
flavor_byz.1203.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

flavor_byz.1300_title_key: "Ricostruzione di [target_location.GetNameWithNoTooltip]"
flavor_byz_1300_historical_info_shared: "La politica bizantina per Constantinople è sempre stata aprire le porte per popolare le strade della città. Dopo che la Black Death aveva colpito Constantinople, la città subì perdite tremende, lasciando molte residenze vuote. Gli imperatori fecero sforzi per restaurare la città, ma non sarebbero stati sufficienti, poiché la popolazione cittadina avrebbe continuato a diminuire fino alla sua caduta nel 1453."
flavor_byz.1300.a: "Dobbiamo ricostruire la città a qualunque costo."
flavor_byz.1300.title: "$flavor_byz.1300_title_key$"
 flavor_byz.1300.entry: "Ricostruzione di Constantinople" 
flavor_byz.1300.desc: "La [ShowSituationName('black_death')] ha devastato gran parte delle nostre terre, con [target_location.GetName] colpita più duramente. Rispetto a prima, la maggior parte delle case è disabitata, con quasi nessuno che cammina per le strade della città. A differenza di prima, le nostre campagne sono state lasciate sterili, con la maggior parte delle province [target_country.GetAdjective] priva di popolazione sufficiente per lavorare i campi. Forse possiamo provare a invitare alcuni mercanti da [ShowRegionName('italy_region')] ad aiutarci con questo problema..."
flavor_byz.1300.historical_info: "$flavor_byz_1300_historical_info_shared$"
flavor_byz.1300.b: "Quei mercanti non sono degni di fiducia."
allowed_italian_merchants_desc: "Da [events|e]" 

flavor_byz.1301.title: "$flavor_byz.1300_title_key$"
flavor_byz.1301.desc: "[target_character.GetName] ha offerto ai nostri mercanti terre a [target_location.GetName], sperando di ripopolare ancora una volta le strade della città."
flavor_byz.1301.a: "Accettiamo questa offerta."
flavor_byz.1301.historical_info: "$flavor_byz_1300_historical_info_shared$"
flavor_byz.1301.b: "Resteranno a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."

flavor_byz.1302.title: "$flavor_byz.1300.title$"
flavor_byz.1302.desc: "[target_country2.GetLongName] ha risposto alla nostra richiesta. Ha preparato [ShowPopTypeName('burghers')] da [target_location2.GetName] perché si stabiliscano a [target_location.GetName]."
flavor_byz.1302.a: "[ROOT.GetCountry.Custom('common_string_positive')]"

flavor_byz.1303.title: "$flavor_byz.1300_title_key$"
 flavor_byz.1303.entry: "Ricostruzione di Constantinople" 
flavor_byz.1303.desc: "[target_country2.GetName] ha rifiutato la nostra richiesta. Pensano che mandare via i loro [ShowPopTypeName('burghers')] non porterà loro nulla di buono."
flavor_byz.1303.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

flavor_byz.1400_title_key: "Restauro dei Varanghi"
flavor_byz.1400.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1400.entry: "$flavor_byz.1400.title$" 
flavor_byz.1400.desc: "Nelle epoche passate, uomini da [ShowRegionName('scandinavian_region')] salpavano verso sud, navigando oltre i fiumi di [ShowRegionName('russian_region')] per emergere in [ShowAreaName('black_sea_area')]. Questi uomini, noti come [ShowUnitDefinitionName('a_varangians')], avevano servito con la massima lealtà gli antichi Imperatori di [ROOT.GetCountry.GetName]. Forse possiamo restaurare questa guardia invitando [varangian_character.GetName] e una banda di uomini da [target_country.GetName] a servire [target_character.GetName] come guardie del corpo."
flavor_byz.1400.a: "Richiediamo una nuova Guardia Variaga."
flavor_byz.1400.b: "Non abbiamo bisogno di [varangian_character.GetNameWithNoTooltip]."
BYZ_IF_THEY_ACCEPT: "Richiederemo [pops|e] da [target_country.GetName]. Se accettano, accadrà quanto segue:" 

flavor_byz.1401.title: "$flavor_byz.1400_title_key$"
flavor_byz.1401.desc: "[target_country2.GetName] ci ha chiesto di inviare [varangian_character.GetName] e una banda di uomini alla loro [target_country.GetGovernment.GetCourtTitle]. Ci offrono denaro se accettiamo."
flavor_byz.1401.a: "È una bella offerta, accettiamo."
flavor_byz.1401.b: "[varangian_character.GetNameWithNoTooltip] appartiene a [ROOT.GetCountry.GetCapital.GetNameWithNoTooltip]."

flavor_byz.1402.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1402.entry: "$flavor_byz.1402.title$" 
flavor_byz.1402.desc: "[target_country.GetName] ha accettato la nostra offerta. [varangian_character.GetName] sta già salpando verso sud con la sua banda di uomini."
flavor_byz.1402.a: "E con questo, la Guardia Variaga è restaurata."

flavor_byz.1403.title: "$flavor_byz.1400_title_key$"
 flavor_byz.1403.entry: "$flavor_byz.1403.title$" 
flavor_byz.1403.desc: "[target_country.GetName] ha rifiutato la nostra offerta. [varangian_character.GetName] e i suoi uomini resteranno a [target_location2.GetName]."
flavor_byz.1403.a: "[ROOT.GetCountry.Custom('common_string_negative')]"

flavor_byz.1500_title_key: "Zeloti di [target_location.GetNameWithNoTooltip]"
flavor_byz.1500.title: "$flavor_byz.1500_title_key$"
 flavor_byz.1500.entry: "Zeloti di Thessaloniki" 
flavor_byz.1500.desc: "Mentre la [ShowDisasterName('succession_crisis')] infuria in [ROOT.GetCountry.GetName], i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] di [target_location.GetName] hanno sfruttato i [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')]. Questo ha portato molti di loro a prendere posizione nella [ShowDisasterNameWithNoTooltip('succession_crisis')]. Se non riusciremo a pacificare questi disordini, potremmo dover combattere un'altra Guerra Civile."
flavor_byz.1500.a: "Il tempo scorre..."

flavor_byz.1501.title: "$flavor_byz.1500_title_key$"
 flavor_byz.1501.entry: "Zeloti di Thessaloniki" 
flavor_byz.1501.desc.a: "Sebbene la Comune di [target_location.GetName] sia brevemente insorta contro i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] locali, siamo riusciti a restaurare l'ordine nel [target_location.GetRank.GetName]. Preghiamo che non si sollevino mai più."
flavor_byz.1501.desc.b: "Nonostante i nostri migliori tentativi di impedire ai [ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] di [target_location.GetName] di sollevarsi contro di noi, [target_character.GetName] non è riuscito a contenere questa piccola scintilla, portando le terre attorno al [target_location.GetRank.GetName] a unirsi alla ribellione."
flavor_byz.1501.a: "Il disastro è stato evitato."
flavor_byz.1501.b: "È tempo di spegnere il vigore di questi contadini."
BYZ_DEAL_WITH_THESSALONIKI_COMMUNE: "Se non riusciremo a ottenere [ROOT.GetVariable('thessaloniki_pop_sat').GetValue|V0%] di [pop_satisfaction|e] a [target_location.GetName] entro #Y 3 Anni#!, [target_location.GetProvince.GetName] #Y Insorgerà#!."
thessaloniki_uprising: "Zeloti di Thessalonica"

