l_english:
 flavor_byz.1.title: "Sacco e Distruzione di Venice"
 flavor_byz.1.entry: "$flavor_byz.1.title$" 
 flavor_byz.1.desc: "Desiderose di vendicare il leggendario tradimento dei Crociati, le truppe [ROOT.GetCountry.GetAdjective] non risparmiarono nessuno mentre calavano sulla città un tempo grande di [ShowLocationName('venice')]. La missione dei generali imperiali è sempre stata chiara, tutte le famiglie patrizie devono essere private delle loro proprietà e dei loro onori, e i tesori che un tempo furono rubati dalla città del desiderio del mondo devono essere restituiti.\n\nQuando giunse il momento della discesa degli eserciti [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sulla Città dell'Acqua, le cose divennero più orribili di quanto chiunque avesse immaginato. Una vita di guerra non favorisce la gentilezza in nessuno e, con comandanti ansiosi di vedere la città bruciare, i soldati [ROOT.GetCountry.GetAdjectiveWithNoTooltip] intrapresero una campagna di devastazione lunga diversi giorni e saccheggiarono chiese, palazzi e persino l'arsenale veneziano."
 flavor_byz.1.a: "Oderint dum metuant."
 flavor_byz.1.b: "Fermiamo il saccheggio!"
 variable_venice_acquired_peacefully_variable_tt: "[ShowLocationName('venice')] was Acquired Peacefully" #NEW
 STATIC_MODIFIER_NAME_chastening_of_venice: "Castigo di Venice"
 STATIC_MODIFIER_DESC_chastening_of_venice: "Il saccheggio e la distruzione subiti dalla città di Venice quando passò sotto il controllo bizantino vi hanno lasciato un segno duraturo."

 flavor_byz.2.title: "Athens riconquistata!"
 flavor_byz.2.entry: "$flavor_byz.2.title$" 
 flavor_byz.2.desc: "Per secoli [ShowLocationName('athens')] fu un centro della cultura e dell'arte [ROOT.GetCountry.GetAdjectiveWithNoTooltip] finché non venne perduta a favore dei Latini nella Quarta Crociata. Più di recente, la città è stata la capitale di un ducato indipendente governato da varie famiglie occidentali. Tuttavia, quel tempo è finito, e per la prima volta dal 1204 [ShowLocationNameWithNoTooltip('athens')] fa di nuovo parte del [ROOT.GetCountry.GetLongName]."
 flavor_byz.2.desc_hellenic: "La città sacra di [ShowLocationName('athens')], culla della filosofia e dell'antica saggezza, è tornata a coloro che onorano gli antichi dei. Per un [ROOT.GetCountry.GetFlavorRank] [ShowReligionAdjective('hellenism_religion')], questo è tanto un trionfo spirituale quanto militare — la città di Athena stessa è di nuovo nostra." #NEW
 flavor_byz.2.desc_other: "L'antica città di [ShowLocationName('athens')], a lungo cuore culturale del vecchio mondo, è tornata sotto il controllo [ROOT.GetCountry.GetAdjective] dopo secoli di dominio straniero. Per la prima volta dal 1204, [ShowLocationNameWithNoTooltip('athens')] fa di nuovo parte del [ROOT.GetCountry.GetLongName]." #NEW
 flavor_byz.2.a: "E per sempre!"
 flavor_byz.2.b: "La città di Athena ci è stata restituita!" #NEW
 flavor_byz.2.c: "Una grande vittoria per il [ROOT.GetCountry.GetFlavorRank]." #NEW

 flavor_byz.3.title: "$izmit.greek_language$ riconquistata!" #NEW
 flavor_byz.3.entry: "$flavor_byz.3.title$" 
 flavor_byz.3.desc: "$izmit.greek_language$, o $izmit$ come la chiamavano i Turchi, fu una città [ROOT.GetCountry.GetAdjective] chiave sulla costa dell'Asia Minor per oltre mille anni prima di essere infine perduta a favore delle forze d'invasione [ShowCultureName('turkish_culture')] nel 1337. Il suo ritorno ci mette in una posizione ideale per espanderci di nuovo in Asia Minor." #NEW
 flavor_byz.3.desc_hellenic: "$izmit$, nota nell'antichità come $izmit.greek_language$, fu un tempo la capitale del regno di Bithynia e una grande città dell'oriente ellenistico. Molto prima di diventare una pietra angolare del nostro [ROOT.GetCountry.GetFlavorRank], era un centro della civiltà [ShowCultureName('greek_culture')]. Il suo ritorno ci pone ancora una volta alla porta dell'Anatolia." #NEW
 flavor_byz.3.desc_other: "$izmit.greek_language$, o $izmit$ come la chiamavano i Turchi, fu una città [ROOT.GetCountry.GetAdjective] chiave sulla costa dell'Asia Minor per oltre mille anni prima di essere infine perduta a favore delle forze d'invasione [ShowCultureName('turkish_culture')] nel 1337. Il suo ritorno ci mette in una posizione ideale per espanderci di nuovo in Asia Minor." #NEW
 flavor_byz.3.a: "E così faremo!"
 flavor_byz.3.b: "L'antica Bithynia è di nuovo nostra!" #NEW
 flavor_byz.3.c: "La nostra testa di ponte in Anatolia è sicura." #NEW

 flavor_byz.4.title: "Antioch riconquistata!"
 flavor_byz.4.entry: "$flavor_byz.4.title$" 
 flavor_byz.4.desc: "Perduta a favore dei Beylik [ShowCultureName('turkish_culture')] nel 1084, [ShowLocationName('antioch')] è stata chiamata la culla di [ShowReligionGroupName('christian')]. Sebbene non sia più la metropoli di un tempo, rimane un importante luogo sacro." #NEW
 flavor_byz.4.desc_hellenic: "[ShowLocationName('antioch')] fu fondata da Seleucus I Nicator, uno dei grandi successori di Alexander, come capitale del suo Impero Seleucide. Per secoli fu una delle città più splendide del mondo ellenistico, un grande centro di cultura e apprendimento [ShowCultureName('greek_culture')]. La sua riconquista è un risultato degno di qualunque erede di quell'antica eredità." #NEW
 flavor_byz.4.desc_other: "Il grande luogo sacro di [ShowLocationName('antioch')], perduto a favore dei Beylik [ShowCultureName('turkish_culture')] nel 1084, è finalmente tornato sotto il controllo imperiale. Sebbene la sua antica gloria sia svanita con i secoli, [ShowLocationNameWithNoTooltip('antioch')] rimane un punto di riferimento significativo e una porta strategica verso l'oriente." #NEW
 flavor_byz.4.a: "Deus vult!"
 flavor_byz.4.b: "[ShowLocationNameWithNoTooltip('antioch')], gioiello dell'oriente ellenistico, è nostra!" #NEW
 flavor_byz.4.c: "Il [ROOT.GetCountry.GetFlavorRank] si spinge più a oriente." #NEW

 flavor_byz.5.title: "Jerusalem riconquistata!"
 flavor_byz.5.entry: "$flavor_byz.5.title$" 
 flavor_byz.5.desc: "Perduta a favore degli Arabi nel 634, [ShowLocationName('jerusalem')] fu un tempo un centro del culto [ShowReligionGroupAdjective('christian')] nell'Impero. La sua riconquista risolleverà sicuramente il morale di tutti i popoli [ShowReligionGroupAdjectiveWithNoTooltip('christian')]."
 flavor_byz.5.desc_hellenic: "[ShowLocationName('jerusalem')] è stata a lungo un luogo di grande importanza per molte fedi, e la sua riconquista estende il nostro dominio in profondità nell'antico cuore imperiale. Sebbene non abbia un significato particolare per il culto [ShowReligionAdjective('hellenism_religion')], controllare un luogo così leggendario ha un valore strategico proprio." #NEW
 flavor_byz.5.desc_other: "La città di [ShowLocationName('jerusalem')], detenuta da potenze straniere dal 634, è stata riportata sotto il controllo imperiale. La sua riconquista rafforza la nostra posizione nella regione e aggiunge al nostro dominio un prestigioso luogo sacro." #NEW
 flavor_byz.5.a: "Deus vult!"
 flavor_byz.5.b: "Il suo valore è strategico, non spirituale." #NEW
 flavor_byz.5.c: "Un altro luogo sacro restituito al [ROOT.GetCountry.GetFlavorRank]." #NEW

 flavor_byz.6.title: "Rome riconquistata!"
 flavor_byz.6.entry: "$flavor_byz.6.title$" 
 flavor_byz.6.desc: "Sebbene non sia sempre stata controllata direttamente dall'Impero, [ShowLocationName('rome')] recise infine ogni legame [ROOT.GetCountry.GetAdjective] quando Papa Leo III incoronò [GetCharacter('fra_charlemagne').GetName] Imperatore del Sacro Romano Impero. Ora, tuttavia, la città è di nuovo nelle nostre mani, e sebbene abbia sofferto molto resta comunque una città di grande prestigio da controllare."
 flavor_byz.6.desc_hellenic: "Molto prima che Papi e imperatori autoproclamati rivendicassero [ShowLocationName('rome')], essa era la sede occidentale del nostro Impero — una città la cui eredità risale ai fondatori stessi della civiltà. Ora, libera dalle ingerenze papali, [ShowLocationNameWithNoTooltip('rome')] può ergersi ancora una volta come monumento alla gloria duratura del mondo antico." #NEW
 flavor_byz.6.desc_other: "L'antica città di [ShowLocationName('rome')], sebbene diminuita rispetto alla sua gloria passata, rimane una delle città più prestigiose del mondo conosciuto. Il suo ritorno in mani imperiali è un risultato significativo e con esso la nostra rivendicazione sull'antico impero occidentale è rafforzata." #NEW
 flavor_byz.6.a: "Rome, la città dove tutto ebbe inizio, è di nuovo nelle nostre mani." 
 flavor_byz.6.b: "L'antica capitale è restituita ai suoi legittimi eredi!" #NEW
 flavor_byz.6.c: "Un premio imperiale senza pari." #NEW

 flavor_byz.7.title: "Ortodossia di Rome restaurata!"
 flavor_byz.7.entry: "$flavor_byz.7.title$" 
 flavor_byz.7.desc: "Il popolo di [ShowLocationName('rome')] segue di nuovo la fede [ShowReligionAdjective('orthodox')], mentre i pochi papisti irriducibili rimasti sono nascosti. Sebbene questo non ponga certo fine al Grande Scisma, anzi semmai lo approfondisca, dà sicuramente alla Chiesa Ortodossa Orientale un vantaggio nell'eterna battaglia per l'autorità religiosa."
 flavor_byz.7.a: "Prendete questo, scismatici!"

 flavor_byz.8.title: "Turchi scacciati dall'Anatolia!"
 flavor_byz.8.entry: "$flavor_byz.8.title$" 
 flavor_byz.8.desc: "Le forze del [GetCountry('TUR').GetName] sono state scacciate da [ShowRegionName('anatolia_region')], che un tempo fu la sede del loro potere. Con [ShowRegionNameWithNoTooltip('anatolia_region')] assicurata, la nostra prosperità è garantita!"
 flavor_byz.8.a: "La Fenice risorge!"
 towns_and_cities_anatolia_get_pop_growth_tt: "Le [towns_and_cities|e] che possediamo in tutto [ShowRegionNameWithNoTooltip('anatolia_region')] beneficeranno del [modifier|e] [ShowModifier('repopulation_of_anatolia_modifier')] per #Y 10#! anni"

 flavor_byz.9.title: "Il Viaggio Occidentale del [ROOT.GetCountry.GetGovernment.GetRulerTitle]"
 flavor_byz.9.entry: "$flavor_byz.9.title$" 
 flavor_byz.9.desc: "Le forze del [GetCountry('TUR').GetName] stanno premendo sulla nostra grande città da qualche tempo, e minacciano direttamente la nostra grande città di [target_province.GetName]. Nonostante la frattura tra le Chiese orientale e occidentale, [ROOT.GetCountry.GetGovernment.GetRuler.GetName] propone di guidare una missione diplomatica presso i nostri fratelli [ShowReligionGroupAdjective('christian')] a Oriente, nel tentativo di assicurarsi fondi sufficienti a respingere i [GetCountry('TUR').GetAdjectiveWithNoTooltip].\n\nSebbene probabilmente sarà un'impresa redditizia, macchierà la nostra reputazione e ci farà apparire deboli."
 flavor_byz.9.a: "Facciamo i preparativi necessari."
 flavor_byz.9.tt: "Il [ROOT.GetCountry.GetGovernment.GetRulerTitle] visiterà le corti dell'Europa occidentale nel tentativo di raccogliere fondi. È probabile che venga percepito come un segno di debolezza e danneggi la nostra posizione internazionale"
 flavor_byz.9.b: "[ROOT.GetCountry.GetGovernment.GetRuler.GetShortNameWithNoTooltip] deve restare per radunare le nostre forze."
 flavor_byz.9.b.entry: "Il sovrano deve restare per radunare le nostre forze." 

 flavor_byz.10.title: "[donated_to_byzantium.GetNameWithNoTooltip] dona alla nostra causa"
 flavor_byz.10.entry: "Donated To Byzantium dona alla nostra causa" 
 flavor_byz.10.desc: "La generosità dei nostri compagni sovrani [ShowReligionGroupAdjective('christian')] non è passata inosservata. Gli sforzi diplomatici del [ROOT.GetCountry.GetGovernment.GetRulerTitle] hanno dato frutto con una cospicua donazione destinata a sostenere la nostra lotta contro il [GetCountry('TUR').GetName]."
 flavor_byz.10.a: "Le nostre fortune sono restaurate."

 flavor_byz.11.title: "La Scuola d'Arte Cretese"
 flavor_byz.11.entry: "$flavor_byz.11.title$" 
 flavor_byz.11.desc: "Poche scuole nella nostra nazione hanno avuto un impatto sulla diffusione della ricchezza e della bellezza dell'arte e dell'iconografia [GetCountry('BYZ').GetAdjectiveWithNoTooltip] quanto la scuola d'arte cretese. La scuola è destinata a diventare un centro di cultura e arte, mentre continua ad attrarre grandi studenti sotto la guida di uomini come [target_artist.GetName]."
 flavor_byz.11.a: "Portiamolo a corte." 
 flavor_byz.11.b: "Intesserà la nostra leggenda all'estero!" 
 flavor_byz.11.c: "Non possiamo permettercelo..."

 flavor_byz.12.title: "El Greco"
 flavor_byz.12.entry: "$flavor_byz.12.title$" 
 flavor_byz.12.desc: "Pochi artisti hanno lasciato il proprio segno nel paesaggio in continuo mutamento dell'arte come [target_artist.GetName], noto anche come #italic el Greco#!. Nonostante la sua opera sia diventata l'antitesi dello stile barocco iniziale, egli è riuscito a ritagliarsi una nuova nicchia distinta sostenendo il primato dell'immaginazione e dell'intuizione sul carattere soggettivo della creazione, mandando così onde nel mondo artistico attraverso le sale di [ShowContinentName('europe')]." 
 flavor_byz.12.a: "I suoi dipinti adorneranno le nostre pareti." 
 flavor_byz.12.c: "Non possiamo permettercelo..."
 get_el_greco_as_painter_tt: "[target_artist.GetNameWithNoTooltip] apparirà come #italic pittore#!"
 get_el_greco_as_sculptor_tt: "[target_artist.GetNameWithNoTooltip] apparirà come #italic scultore#!"

 flavor_byz.13.title: "Un Brillante Centro del Sapere"
 flavor_byz.13.entry: "$flavor_byz.13.title$" 
 flavor_byz.13.desc: "Nonostante le difficoltà che circondano il nostro popolo, le nostre arti e la nostra cultura restano vibranti e prestigiose come sempre. Nessun luogo è un esempio migliore della nostra influenza artistica e coltivazione di [target_location.GetName]. Servendo da trampolino verso la coltivazione e la propagazione del [ShowInstitutionName('renaissance')], il popolo ha accolto e sviluppato scuole d'arte e pensiero, vivendo una meravigliosa età dell'oro di filosofia ed espressione [ROOT.GetCountry.GetAdjective]."
 flavor_byz.13.a: "Finanziamo la sua espansione."
 flavor_byz.13.b: "Lasciamo che la ricchezza si diffonda in tutta [target_province.GetNameWithNoTooltip]!"
 flavor_byz.13.b.entry: "Lasciamo che la ricchezza si diffonda in tutta la provincia!" 
 flavor_byz.13.c: "Questo denaro è meglio speso altrove."

 flavor_byz.14.title: "La Proposta dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]"
 flavor_byz.14.entry: "$flavor_byz.14.title$" 
 flavor_byz.14.desc: "La nostra marina è caduta in rovina da parecchio tempo. Quello che un tempo era un ramo orgoglioso della nostra potente autorità è ora diventato lo zimbello del mondo. In effetti, i nostri vicini sfacciati, che bramano la nostra terra, sono giunti a contestare il nostro dominio marittimo e compiono frequenti incursioni nei nostri porti. Nel nostro momento di bisogno, delegati dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] si sono fatti avanti con una proposta curiosa. Secondo la loro corrispondenza, desiderano assumere il comando delle nostre forze navali, finanziandole nel processo..."
 flavor_byz.14.a: "Non possiamo dipendere da loro!" 
 flavor_byz.14.b: "[ROOT.GetCountry.Custom('common_string_positive')]" 
 flavor_byz.14.b.entry: "$common_string_brilliant$" 
 byz_magnates_wont_offer_again_tt: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] non offriranno più la loro assistenza nelle questioni navali"

 flavor_byz.15.title: "Riforme Navali di [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetNameWithNoTooltip]" 
 flavor_byz.15.entry: "$flavor_byz.15.title$" 
 flavor_byz.15.desc: "Non è un segreto che la nostra marina abbia visto giorni migliori. I recenti tumulti affrontati dal nostro popolo hanno prosciugato il tesoro imperiale, causando tagli e carenze in ogni settore. Nonostante ciò, i nostri consiglieri sotto l'egida di [target_character2.GetName] hanno elaborato un piano nel tentativo di recuperare parte del nostro antico splendore navale!"
 flavor_byz.15.a: "Possiamo giustificare una simile riforma." 
 flavor_byz.15.b: "Che la riforma sia ampia e di vasta portata!" 
 flavor_byz.15.c: "Questo denaro è meglio speso altrove..." 
 if_we_pass_naval_reform_disaster_panel_tt: "Questo produrrà benefici se sceglieremo di riformare la nostra [navy|e] tramite l'[action|e] [ShowGenericActionName('reform_imperial_armies')] nel pannello del [disaster|e] [ShowDisasterName('fate_of_the_phoenix')]" 
 following_rewards_are_bolstered_because_of_disaster_action_tt: "Le seguenti ricompense sono rafforzate perché abbiamo scelto di riformare la nostra [navy|e] almeno una volta tramite l'[action|e] [ShowGenericActionName('reform_imperial_armies')] nel pannello del [disaster|e] [ShowDisasterName('fate_of_the_phoenix')]" 

 flavor_byz.16.title: "[target_character.GetNameWithNoTooltip]"
 flavor_byz.16.entry: "Konstantinos Armenopoulos" 
 flavor_byz.16.desc: "Come un turbine silenzioso, un nuovo trattato giuridico ha preso possesso dei giuristi e dei burocrati del nostro [ROOT.GetCountry.GetFlavorRank]. Il trattato recentemente pubblicato #italic Hexabiblos#! dal giovane [target_character.GetName] ha compilato, incrociato e rivitalizzato gran parte della giurisprudenza [ROOT.GetCountry.GetAdjective] in un tomo di enorme utilità per la corretta amministrazione della Legge.\n\nDovremmo invitare questo giovane giurista a unirsi alla nostra corte come ricompensa per il suo lavoro diligente?"
 flavor_byz.16.a: "Inviamogli un invito."
 flavor_byz.16.b: "No, non vogliamo altri avvocati in giro."

 flavor_byz.17.title: "La Voce Angelica di [john_koukouzelis.GetNameWithNoTooltip]"
 flavor_byz.17.entry: "La Voce Angelica di John Koukouzelis" 
 flavor_byz.17.desc: "La scomparsa del grande [john_koukouzelis.GetName] ha gettato un velo di tristezza sulle basiliche del [ROOT.GetCountry.GetLongName], molti piangono la perdita della sua voce e i più dotti piangono la perdita delle sue mani compositrici.\n\nMa una luce di speranza brilla nella nostra corte mentre le storie delle sue apparizioni della Madre di Dio passano di bocca in bocca. La pietà della sua vita e i molti miracoli attribuitigli stanno spingendo il clero locale a chiedere la sua canonizzazione"
 flavor_byz.17.a: "Parliamo con il Patriarca!"
 flavor_byz.17.b: "Non ci interessano queste questioni."
 
 flavor_byz.18.title: "Caduta di [GetCountry('BYZ').GetNameWithNoTooltip]"
 flavor_byz.18.entry: "Caduta di $BYZ$" 
 flavor_byz.18.desc: "Con la caduta di [GetCountry('BYZ').GetName], il mondo [ShowCultureName('greek_culture')] è stato scosso. Dopo mesi e mesi alla mercé di [target_country.GetName], le mura di [target_location.GetName] sono cadute. Le forze [target_country.GetAdjectiveWithNoTooltip] hanno assaltato la città e l'hanno saccheggiata, ferendo profondamente la popolazione [ShowCultureNameWithNoTooltip('greek_culture')] in tutto il globo. Sebbene la fenice sia ora scomparsa, gran parte della nostra popolazione è stata ferita da questa notizia, soprattutto le comunità di [target_location2.GetName]."
 flavor_byz.18.a: "La Fenice Purpurea non esiste più."
 BYZ_FALL_OF_BYZANTIUM_CONVERSION: "Tutti i nostri [pops|e] [ShowCultureName('greek_culture')] perderanno [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]"

flavor_byz.19.title: "Protezione di [ShowAreaNameWithNoTooltip('morea_area')]"
 flavor_byz.19.entry: "Protezione dell'Area di Morea" 
flavor_byz.19.desc: "Durante la Quarta Crociata e la caduta di [ShowLocationName('constantinople')], le terre di [ShowAreaName('morea_area')] furono conquistate dai Franchi mentre il nostro Impero veniva temporaneamente diviso. La loro influenza nella regione persiste ancora, poiché vi sono ancora mercenari erranti che si oppongono direttamente al nostro dominio."
flavor_byz.19.a: "Dobbiamo proteggere il popolo di [ShowAreaNameWithNoTooltip('morea_area')] da ogni minaccia esterna."

flavor_byz.20.title: "Riforma dei Giudici Universali dei Romani"
 flavor_byz.20.entry: "$flavor_byz.20.title$" 
flavor_byz.20.desc: "Sebbene la nostra corte suprema abbia visto riforme recenti sotto sovrani precedenti, è emerso un recente scandalo. Tre dei quattro giudici sono stati accusati di corruzione, ignorando il bene della nazione per perseguire i propri interessi. [target_character.GetName] ha saputo di questa notizia e intende sbarazzarsi di ogni forma di corruzione nella Corte Suprema."
flavor_byz.20.historical_info: "Sebbene creati alla fine del XIII secolo da Andronikos II Palaiologos, i Giudici Universali dei Romani erano pieni di alcuni giudici corrotti. Durante un'indagine di Andronikos III Palaiologos nel 1337, tre dei quattro giudici furono giudicati colpevoli e l'organo fu parzialmente riformato."
flavor_byz.20.a: "La corruzione in questo sistema deve essere epurata."
flavor_byz.20.b: "Il sistema attuale va bene."
able_to_add_reform_later_tt: "Potremo adottare questa [government_reform|e] in seguito" 
 
flavor_byz.21.title: "Canti Acritici"
 flavor_byz.21.entry: "$flavor_byz.21.title$" 
flavor_byz.21.desc: "Nelle epoche del primo [GetCountry('BYZ').GetName], molti uomini di frontiera noti come #italic Akritais#! combatterono per proteggere [ShowRegionName('anatolia_region')] dagli invasori [ShowCultureGroupName('arabian_group')]. Questo portò alla produzione di molti grandi poemi e molti grandi eroi nella letteratura [ShowCultureName('greek_culture')], come #italic Digenes Akritas#!." 
flavor_byz.21.historical_info: "Molti di questi poemi sono considerati l'inizio della Letteratura Greca Moderna, alcuni dei quali divennero persino un simbolo del nazionalismo greco. Uno di questi poemi, e forse il più noto, è il racconto di Digenes Akritas, una guardia di confine di discendenza sia greca sia araba, che protegge l'Impero Bizantino dagli Arabi e uccide persino esseri mitici come draghi." 
flavor_byz.21.a: "Facciamo conoscere questi poemi al resto del mondo."

flavor_byz.22.title: "Canto di Armouris"
 flavor_byz.22.entry: "$flavor_byz.22.title$" 
flavor_byz.22.desc: "Uno dei più grandi poemi acritici è quello di #italic Armouris Armouropoulos#!. Le sue avventure contengono diverse imprese erculee, come combattere da solo un esercito di Saraceni per "un giorno e una notte". Sebbene venga disarcionato in seguito, insegue colui che gli ha rubato il cavallo fino in Syria, dove alla fine gli taglia entrambe le braccia per il furto. Sebbene originariamente scritto nell'XI secolo, gran parte dei suoi contenuti è andata perduta. Forse ora possiamo provare a restaurarne alcune parti, anche se non saranno esattamente accurate."
flavor_byz.22.historical_info: "$flavor_byz.21.historical_info$" 
flavor_byz.22.a: "Ne vale la pena."
flavor_byz.22.b: "Non macchieremo le nostre antiche opere d'arte."

flavor_byz.23.title: "Il Racconto del Sovrano Marmoreo"
 flavor_byz.23.entry: "$flavor_byz.23.title$" 
flavor_byz.23.desc: "Sebbene [ShowLocationName('constantinople')] non sia più in mani [ShowCultureGroupName('greek_group')], molti credono che il suo ultimo sovrano non sia stato ucciso nei momenti finali di [target_character.GetHerHis]. Invece, grazie alla guida degli angeli e alla luce del sole al tramonto, [target_character.GetSheHe] fu salvato sotto le [ShowBuildingTypeName('theodosian_walls')], dove [target_character.GetSheHe] fu trasformato in marmo. Ancora oggi nessuno sa se queste voci siano vere, ma a volte la finzione può cambiare la percezione della realtà."
flavor_byz.23.a: "[target_character.GetNameWithNoTooltip] sarà il Sovrano di Marmo."

flavor_byz.23.historical_info: "L'Imperatore Marmoreo è esistito in molte altre culture. Per i Greci, Konstantinos XI Palaiologos fu forse uno degli Imperatori più rinomati dell'Impero Bizantino. Si diceva che durante l'assedio di Constantinople nel 1453 non fosse morto in combattimento e che un giorno sarebbe invece tornato a restaurare il suo impero."

BYZ_MARBLED_EMPEROR_TOOLTIP: "A volte, la storia di una persona può essere alterata, persino quella di [target_character.GetName]..."

flavor_byz.24.title: "Lo Stavraton"
 flavor_byz.24.entry: "$flavor_byz.24.title$" 
flavor_byz.24.desc: "Con la nostra vecchia moneta, l'#italic Hyperpyron#!, che diventa lentamente obsoleta nel commercio non solo interno ma anche esterno, [target_character.GetName] ha proposto di iniziare a coniare una nuova moneta, lo #italic Stavraton#!.\n\nQueste riforme monetarie sono modellate sul #italic Venetian Ducat#! e permetterebbero ai nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] di commerciare più facilmente con altri paesi europei, ma anche i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] dovrebbero adattarsi a questa nuova moneta."
flavor_byz.24.a: "Coniamo questa nuova moneta."
flavor_byz.24.b: "[GetCountry('VEN').GetNameWithNoTooltip] non influenzerà la nostra economia."
flavor_byz.24.historical_info: "Nel 1367, l'Imperatore John V Palaiologos introdusse una nuova moneta, lo Stavraton, che prese il nome dalla parola greca per "Croce", per sostituire l'hyperpyron d'oro fuori uso. Questa moneta d'argento rimase fino alla fine dell'Impero Bizantino."
policy_will_not_be_implemented_but_available: "La [target_policy.GetName] non sarà implementata in questo momento ma resterà disponibile per noi" 

flavor_byz.25.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_byz.25.entry: "Studioso dell'Ellenismo" 
flavor_byz.25.desc: "[target_artist.GetName] è arrivato alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Predica il ritorno di [ROOT.GetCountry.GetName] all'età dell'Ellenismo. Sebbene abbia mostrato rilievo, i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] si oppongono alle sue idee."
flavor_byz.25.a: "Lasciamolo restare nella nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
flavor_byz.25.b: "I suoi insegnamenti eretici devono finire!"
flavor_byz.25.historical_info: "Gemistos Plethon fu uno degli studiosi bizantini più rinomati. Sostenne la rinascita del sapere greco in Europa occidentale e scrisse molti manoscritti, molti dei quali incentrati sulla rinascita dell'Ellenismo e sul rifiuto della legge bizantina."
while_remains_chance_to_revive_hellenism_tt: "#italic Finché [target_artist.GetNameWithNoTooltip] rimane nella nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], potrebbe tentare di ravvivare [ShowReligionName('hellenism_religion')]#!"

flavor_byz.26.title: "Il Popolo [ShowCultureNameWithNoTooltip('greek_culture')] di [target_location.GetNameWithNoTooltip]"
 flavor_byz.26.entry: "Il Popolo dell'Asia Minore" 
flavor_byz.26.desc: "Con le nostre forze sbarcate in [ShowAreaName('west_anatolia_area')] e i porti locali riconquistati, [target_location.GetName] si erge tra i più grandi di essi. Essendo stata in passato un punto caldo tra le genti [ShowCultureName('turkish_culture')] e [ROOT.GetCountry.GetAdjective], è caduta ancora una volta nelle nostre mani. Tuttavia [target_character.GetName] intende mantenere la città per il futuro prevedibile, e sta già rafforzando la sua posizione in [ShowRegionName('anatolia_region')]."
flavor_byz.26.a: "Sarà il nostro porto principale in [ShowAreaNameWithNoTooltip('west_anatolia_area')]."
BYZ_SMYRNA_PEOPLE_CONVERT_TO_GREEK: "#G 20%#! dei [pops|e] si convertirà a [ShowCultureName('greek_culture')]"
BYZ_SMYRNA_GREEKS_GAIN_SATISFACTION: "Tutti i [pops|e] [ShowCultureName('greek_culture')] ottengono [ShowNamedValue('pop_satisfaction_severe_bonus')|+=2%] di [pop_satisfaction|e]"

flavor_byz.27.title: "Declino del Rinascimento [target_character.GetDynasty.GetNameWithNoTooltip]"
 flavor_byz.27.entry: "Rinascimento Paleologo" 
flavor_byz.27.desc: "Mentre in passato molti grandi artisti accorrevano alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] in un fenomeno chiamato Rinascimento [target_character.GetDynasty.GetName], negli ultimi anni c'è stato un declino, con grandi uomini che scelgono di unirsi ad altre corti invece che alla nostra. Forse [target_character.GetName] dovrebbe investire per fermare questo declino."
flavor_byz.27.historical_info: "Quando la dinastia Palaiologos riconquistò Constantinople, avviò una campagna di rinnovamento per la città. Ciò accese l'ultimo periodo di sviluppo dell'arte bizantina, in cui essa si sarebbe lentamente allontanata da numerose usanze bizantine, come gli artisti che firmavano le proprie opere, e si sarebbe spostata verso uno stile diverso, quello paleologo, che in seguito avrebbe influenzato la Scuola d'arte Cretese." 
flavor_byz.27.a: "Non abbiamo i fondi per sponsorizzare nessuno in questo momento."
flavor_byz.27.b: "Il tesoro [ROOT.GetCountry.GetAdjectiveWithNoTooltip] coprirà le spese!" 
flavor_byz.27.c: "Permettiamo ai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] di pagare il conto." 
flavor_byz.27.d: "Facciamo di [target_location.GetNameWithNoTooltip] la culla del [ShowInstitutionNameWithNoTooltip('renaissance')]." #NEW
constantinople_to_spawn_renaissance_tt: "[ShowLocationName('constantinople')] può essere il luogo di nascita del [ShowInstitutionName('renaissance')]" #NEW

flavor_byz.28.title: "Una [ROOT.GetCountry.GetGovernment.GetCourtTitle] in [ShowAreaNameWithNoTooltip('morea_area')]"
 flavor_byz.28.entry: "Nuova Sparta" 
flavor_byz.28.desc: "Con il nostro declino in [ShowRegionName('balkan_region')], [target_character.GetName] ha escogitato un modo per garantire che la nostra nazione viva. Stabilendo una nuova capitale a [target_location.GetName] e fortificando [ShowAreaName('morea_area')], possiamo assicurarci che nessuno straniero possa invaderci senza subire grandi perdite."
flavor_byz.28.a: "Forse le parole di [target_character.GetNameWithNoTooltip] hanno qualche merito..."
flavor_byz.28.b: "Abbandonare [target_location2.GetNameWithNoTooltip] non ci porterà nulla di buono."

flavor_byz.29.title: "Katholikon Mouseion"
 flavor_byz.29.entry: "$flavor_byz.29.title$" 
flavor_byz.29.desc: "Con [target_location.GetName] come città di punta dei [target_character.GetDynasty.GetName], [target_character.GetName] sta progettando un'istituzione nel monastero di St. John Prodrome. Una simile costruzione richiederebbe molte risorse, oltre a opere che la nostra nazione potrebbe dover commissionare."
flavor_byz.29.a: "Nessun prezzo fermerà [target_character.GetNameWithNoTooltip]."
flavor_byz.29.b: "È troppo costoso."
flavor_byz.29.historical_info: "Sebbene non si sappia molto dell'istituzione chiamata Katholikon Mouseion, essa fu fondata a cavallo del XIV secolo a Constantinople. Si trovava nel Monastero di St. John Prodrome e usava la sua biblioteca per invitare molti Italiani che desideravano imparare la lingua e la cultura greche."

flavor_byz.30.title: "Un Patto con [target_country.GetNameWithNoTooltip]"
 flavor_byz.30.entry: "Chiesa Ortodossa e Luterani alleati contro i Cattolici" 
flavor_byz.30.desc: "Con l'ascesa di [target_country.GetReligion.GetName] in [ShowContinentName('europe')], il mondo [ShowReligionAdjective('catholic')], i nostri vecchi nemici, sta finalmente vivendo ciò che noi abbiamo vissuto secoli fa. A guidare questa riforma è [target_country.GetName]. Forse, se manterremo buone relazioni con loro, potremo finalmente incidere contro [target_country2.GetName] come tanto desideravamo in passato." 
flavor_byz.30.a: "Ci alleeremo con [target_country.GetNameWithNoTooltip]."
flavor_byz.30.b: "Le questioni di [target_country2.GetReligion.GetNameWithNoTooltip] non ci riguardano."

flavor_byz.31.title: "Riforma dell'Esercito [ROOT.GetCountry.GetAdjectiveWithNoTooltip]" 
 flavor_byz.31.entry: "Riforma dell'Esercito Bizantino" 
flavor_byz.31.desc: "Mentre il nostro esercito dominava in passato usando i Themata e le numerose leve che fornivano, l'aumento della ricchezza e la centralizzazione dei reami hanno portato gli eserciti a diventare una professione a tempo pieno. [target_character.GetName], insieme al consiglio di [target_character.GetHerHis], ha lavorato duramente alla stesura di una nuova organizzazione dell'esercito, una che dipende meno dai [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] per le truppe."
flavor_byz.31.a: "L'esercito servirà [target_character.GetNameWithNoTooltip]."
flavor_byz.31.b: "Non scavalchiamo il ruolo dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
BYZ_ALL_THEMATA_PROVINCES_GAIN_NOBLE_LOYALTY: "Tutti i [pops|e] [ShowPopTypeName('nobles')] nelle [locations|e] con [ShowBuildingTypeName('thema_headquarters')] ottengono [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] di [pop_satisfaction|e]."

flavor_byz.32.title: "Ascesa di [target_character2.GetNameWithNoTooltip]"
 flavor_byz.32.entry: "Il Grande Domestico - Problemi all'Orizzonte" 
flavor_byz.32.desc: "Sebbene l'attuale periodo della storia [ROOT.GetCountry.GetAdjective] possa essere descritto come una piccola rinascita della nazione, non arriva senza la sua parte di problemi. Sebbene siamo recentemente usciti da una devastante Guerra Civile, si stanno ancora formando nuovi schieramenti. Uno di essi si raduna sotto lo stendardo di [target_character2.GetName], il nostro #italic Grande Domestico#!. Solo il tempo dirà a cosa porterà."
flavor_byz.32.a: "Questo intrigo di corte si sta sviluppando..."

flavor_byz.33.title: "Un Impero Romano?"
 flavor_byz.33.entry: "$flavor_byz.33.title$" 
flavor_byz.33.desc: "Sebbene ci siamo sempre chiamati successori di [ShowLocationName('rome')], abbiamo faticato più volte a mantenere quel titolo. Forse è tempo di perseguire una nuova identità, meno concentrata sull'antica gloria e invece capace di guidarci verso il futuro."
flavor_byz.33.a: "Non siamo più Romani. Governiamo come una Nazione [ShowCultureNameWithNoTooltip('greek_culture')]."
flavor_byz.33.b: "Non abbandoneremo mai la nostra eredità."
BYZ_ALL_PRIMARY_AND_ACCEPTED_POP_BECOME_HAPPIER: "Ogni [pop|e] che sia [primary_culture|e] o [accepted_culture|e] otterrà [ShowNamedValue('pop_satisfaction_ultimate_bonus')|+=2%] di [pop_satisfaction|e]."

flavor_byz.34.title: "[target_location.GetNameWithNoTooltip] Supera le sue Mura"
 flavor_byz.34.entry: "Constantinople, la Città in Decadenza" 
flavor_byz.34.desc: "[target_location.GetName] ha visto secoli di decadenza a causa di numerosi conflitti. Ora che abbiamo finalmente ristabilito le casse [ROOT.GetCountry.GetAdjective], possiamo finalmente iniziare a restaurare il [target_location.GetRank.GetName], portandolo in una nuova era."
flavor_byz.34.a: "[target_location.GetNameWithNoTooltip] risorgerà."
flavor_byz.34.b: "Non spenderemo i nostri fondi per un solo [target_location.GetRank.GetNameWithNoTooltip]."
BYZ_UNLOCK_CONSTANTINOPLE_MANAGER_CABINET_ACTION: "Sblocca l'Azione di Gabinetto [ShowCabinetActionName('aid_constantinople')]."

flavor_byz.35.title: "[target_character2.GetNameWithNoTooltip]"
 flavor_byz.35.entry: "Giovanni Giustiniani" 
flavor_byz.35.desc: "Mentre la colonia di [ShowBuildingTypeName('galata')] ha aumentato l'influenza [GetCountry('GEN').GetAdjective] in [target_location.GetName], ha anche portato all'arrivo di alcuni uomini determinati a proteggere [ROOT.GetCountry.GetName]. Uno di loro è [target_character2.GetName], un mercenario [GetCountry('GEN').GetAdjectiveWithNoTooltip] pronto a servire [target_character.GetName]."
flavor_byz.35.a: "Assumiamolo, per il bene del [ROOT.GetCountry.GetFlavorRank]."
flavor_byz.35.b: "Fidarsi dei [GetCountry('GEN').GetAdjectiveWithNoTooltip]? Mai!"

flavor_byz.36.title: "[ShowRegionNameWithNoTooltip('anatolia_region')] Riconquistata!"
 flavor_byz.36.entry: "Ripristino del Controllo in Anatolia" 
 flavor_byz.36.desc: "Our armies have finally secured the lands of [ShowRegionName('anatolia_region')]. With its cities now under our control and our enemies driven away, we can finally celebrate this triumph." #NEW
flavor_byz.36.a: "Gloria a [ROOT.GetCountry.GetNameWithNoTooltip]." 

flavor_byz.37.title: "Sbarco in [ShowRegionNameWithNoTooltip('italy_region')]"
 flavor_byz.37.entry: "Sbarco in Italia" 
flavor_byz.37.desc: "[ShowRegionName('italy_region')] un tempo era [ROOT.GetCountry.GetAdjective], ma con Longobardi e Normanni che ne presero il controllo, perdemmo ogni punto d'appoggio nella regione. Ora che abbiamo ristabilito una base a [target_location.GetName], forse possiamo fortificarla e usarla per operazioni future."
flavor_byz.37.a: "[target_location.GetNameWithNoTooltip] sarà fortificata!"
flavor_byz.37.b: "È uno spreco di denaro."

flavor_byz.38.title: "Il [ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')]"
 flavor_byz.38.entry: "Muro Hexamilion" 
flavor_byz.38.desc: "Con la nostra presa in [ShowRegionName('balkan_region')] che si allenta, il [target_country.GetLongName] è stato posto in una situazione precaria. Tuttavia, [target_character.GetName] ha escogitato un piano per garantire la sopravvivenza del [target_country.GetFlavorRank]. Costruendo il [ShowBuildingTypeName('hexamilion_wall')] a [ShowLocationName('corinth')] e rafforzando la provincia di [ShowAreaName('morea_area')], potrebbe restarci qualche speranza."
flavor_byz.38.a: "La sicurezza di [ShowAreaNameWithNoTooltip('morea_area')] è la nostra massima priorità."
flavor_byz.38.b: "Il [ShowBuildingTypeNameWithNoTooltip('hexamilion_wall')] è troppo costoso."
flavor_byz.38.historical_info: "Durante il regno di Constantine XI su Morea, egli spostò il fulcro dell'impero verso le montagne della regione, credendo che, se l'impero doveva sopravvivere, ciò sarebbe avvenuto fortificando il Muro Hexamilion e sviluppando le città locali. I suoi piani fallirono però quando gli Ottomani lanciarono un'invasione nelle sue terre, lasciando la campagna devastata."

flavor_byz.39.title: "Una Nuova Capitale a [target_location.GetNameWithNoTooltip]?"
 flavor_byz.39.entry: "Una Nuova Capitale" 
flavor_byz.39.desc: "Da quando la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] è migrata a [ShowAreaName('morea_area')], [target_location.GetName] è diventata la capitale [target_country.GetAdjective] in tutto tranne che nel nome. È forse tempo che [target_character.GetName] abbandoni [target_location2.GetName] in favore di questa nuova casa?"
flavor_byz.39.a: "Forse [ShowAreaNameWithNoTooltip('morea_area')] può essere difesa più facilmente..."
flavor_byz.39.b: "Abbandonare [target_location2.GetNameWithNoTooltip] è un grave errore, rafforziamola invece."
flavor_byz.39.c: "Non abbandoneremo [target_location2.GetNameWithNoTooltip] né rafforzeremo la nostra presa lì."

flavor_byz.40.title: "Nomon Syngraphe"
 flavor_byz.40.entry: "$flavor_byz.40.title$" 
flavor_byz.40.desc: "Dalla morte di [target_character.GetName], diverse persone hanno iniziato a rovistare tra ciò che erano i suoi possedimenti. Uno di loro, [target_character2.GetName], ha scoperto uno dei suoi manoscritti, etichettato #italic Nomoi#!. Ispirato dagli insegnamenti [ShowReligionAdjective('zoroastrian')] e da quelli di Plato, consiste in vari argomenti, tutti ricondotti al ritorno delle vie ellenistiche."
flavor_byz.40.a: "Un'opera d'arte deve rimanere un'opera d'arte." #NEW
flavor_byz.40.b: "Rivisitiamo alcuni di questi testi, rendiamoli più grandiosi."
flavor_byz.40.c: "Gettiamolo nel fuoco, distruggiamolo!"

flavor_byz.41.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_byz.41.entry: "Storia dei Palaiologoi" 
flavor_byz.41.desc: "Con sempre più storici interessati alla storia di [target_country.GetName], alcuni di loro hanno pensato di scrivere una cronaca sulla famiglia [target_character.GetDynasty.GetName], come [target_artist.GetName], assicurando che le generazioni successive conoscano le gesta di [target_character.GetName] e della famiglia di [target_character.GetHerHis]."
flavor_byz.41.a: "È libero di registrare la storia."
flavor_byz.41.b: "Possiamo sponsorizzare le sue opere."

flavor_byz.42.title.a: "Ascesa della Famiglia Mavrokordatos"
flavor_byz.42.title.b: "Il Grande Dragomanno"
 flavor_byz.42.entry: "$flavor_byz.42.title.a$" 
flavor_byz.42.desc: "Nato a [target_location.GetName], [target_artist.GetName] ha studiato fin da giovanissimo i metodi occidentali della medicina e della filosofia. Studiando in numerose università, ha assorbito enormi quantità di conoscenza ed è versato in molte forme linguistiche. Forse un filosofo tanto istruito farà bene nella nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
flavor_byz.42.historical_info: "Nato a Mykonos, Alexandros Mavrokordatos fu un medico greco sotto la Turkocracy. Dopo aver studiato in Occidente, soprattutto all'Università di Bologna, scrisse diversi trattati, come #italic Instrumentum Pneumaticum Circulandi Sanguinis sive modu usu pulmonum#!. In seguito servì sotto Sultan Mehmed IV, aiutando nei negoziati che portarono al Treaty of Karlowitz nel 1699, e riuscì a ottenere un potere considerevole nella corte ottomana, permettendo alla sua famiglia di governare Moldavia."
flavor_byz.42.a: "Invitiamo [target_artist.GetNameWithNoTooltip] a [target_location2.GetNameWithNoTooltip]"
flavor_byz.42.b: "Sarebbe un grande diplomatico per [target_country.GetNameWithNoTooltip]."
flavor_byz.42.c: "È troppo costoso da mantenere."

flavor_byz.43.title: "Fondazione della Scuola Eptanese"
 flavor_byz.43.entry: "$flavor_byz.43.title$" 
flavor_byz.43.desc: "Con la Scuola Cretese già stabilita e il dominio dell'arte occidentale in [ShowContinentName('europe')], i [ShowCultureName('greek_culture')] hanno adottato questa nuova forma d'arte. Soprattutto [ShowLocationName('corfu')] ha visto una nuova ondata di questi nuovi artisti. Forse è tempo di fondare una nuova scuola in [ShowProvinceDefinitionName('ionian_islands_province')]."
flavor_byz.43.a: "Fondiamo questa scuola d'arte."
flavor_byz.43.b: "Non abbiamo bisogno di altri artisti."
flavor_byz.43.c: "[target_character.GetNameWithNoTooltip] vi concentrerà tutti i suoi sforzi."
flavor_byz.43.d: "La vecchia scuola cretese sarà favorita."

flavor_byz.44.title: "[target_artist.GetNameWithNoTooltip]"
 flavor_byz.44.entry: "Maniera Greca" 
flavor_byz.44.desc: "[target_artist.GetName], nato a [target_location.GetName] come cittadino [ShowCultureName('greek_culture')], si è fatto un nome in [ShowProvinceDefinitionName('ionian_islands_province')]. La sua arte segue lo stile #italic Maniera Greca#!, mescolando gli stili artistici [GetCountry('BYZ').GetAdjective] e [GetCountry('VEN').GetAdjective]."
flavor_byz.44.a: "Sponsorizziamolo e invitiamolo alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
flavor_byz.44.b: "Non abbiamo bisogno di altri artisti."

flavor_byz.45.title: "Riforma del Sistema Prónoia"
 flavor_byz.45.entry: "$flavor_byz.45.title$" 
flavor_byz.45.desc: "Sebbene la [ShowPolicyName('pronoia_system')] ci abbia servito bene in passato, i titoli amministrativi sono stati ridotti a nulla più dei loro equivalenti feudali, assicurando che i governatori di ogni provincia non siano assegnati da [target_character.GetName], ma da una posizione ereditaria. [target_character.GetNameWithNoTooltip] ha già piani per riformare questo sistema, restaurando il controllo sulle province [ROOT.GetCountry.GetAdjective]."
flavor_byz.45.a: "Aboliamo questo vecchio sistema."
flavor_byz.45.b: "Potrebbero esserci alcune scappatoie, ma riformarlo non ci porterà alcun bene."

flavor_byz.46.title: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] Offre Aiuto Militare"
flavor_byz.46.desc: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] [target_country.GetAdjective] si è dichiarata a sostegno di [target_character.GetName] e delle politiche di [target_character.GetHisHer]. Questo ci permette di apportare cambiamenti nel nostro stato con facilità."
flavor_byz.46.a: "Il loro sostegno servirà bene ai nostri sforzi terrestri."
flavor_byz.46.b: "È invece la marina che dovrebbero aiutare."

flavor_byz.47.title: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] Cospira Contro l'Esercito"
flavor_byz_47_desc_common: "Mentre l'Esercito ha protetto i nostri confini, la [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha visto alcuni degli ufficiali e dei generali lì presenti come una minaccia contro il [ROOT.GetCountry.GetFlavorRank], parlando di come vogliano rovesciare [target_character.GetName] e distruggere il potere della [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Per questo, ci hanno suggerito di spostarci verso"
flavor_byz.47.desc.a: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('quantity')]."
flavor_byz.47.desc.b: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('quality')]."
flavor_byz.47.desc.c: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('land')]."
flavor_byz.47.desc.d: "$flavor_byz_47_desc_common$ [ShowSocietyDirectionName('naval')]."
flavor_byz.47.a: "Un esercito basato sulla quantità ci permetterà di coprire più terreno."
flavor_byz.47.b: "Invece di mandare più uomini nell'esercito, addestriamo quello esistente."
flavor_byz.47.c: "I nostri ufficiali di terra dovrebbero essere rafforzati ancora di più."
flavor_byz.47.d: "Per proteggere [ROOT.GetCountry.GetNameWithNoTooltip], dobbiamo proteggere anche i suoi mari."
byz_court_wants_to_force_societal_changes: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] desidera che imponiamo cambiamenti nella nostra società"

flavor_byz.48.title: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] Offre Aiuto Burocratico"
flavor_byz.48.desc: "Con la nostra amministrazione carente negli ultimi anni, la nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] è intervenuta a sostegno per aiutare [target_character.GetName] a redigere alcune leggi per rafforzare questo ramo di [ROOT.GetCountry.GetName]."
flavor_byz.48.a: "La Burocrazia [ROOT.GetCountry.GetGovernment.GetAdjective] rafforzerà la stessa [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
flavor_byz.48.b: "La nostra società sarà governata con l'oro."

flavor_byz.49.title: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] Cospira Contro la Burocrazia [ROOT.GetCountry.GetGovernment.GetAdjective|U]"
flavor_byz_49_desc_common: "Sebbene la nostra amministrazione abbia funzionato bene di recente, la [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha notato che alcune persone in carica sono state meno che utili per loro. Ora ci hanno forzato la mano, chiedendo che apportiamo un cambiamento verso"
flavor_byz.49.desc.a: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('aristocracy')]."
flavor_byz.49.desc.b: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('plutocracy')]."
flavor_byz.49.desc.c: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('outward')]."
flavor_byz.49.desc.d: "$flavor_byz_49_desc_common$ [ShowSocietyDirectionName('inward')]."
flavor_byz.49.a: "Promuoviamo la [ShowSocietyDirectionNameWithNoTooltip('aristocracy')]."
flavor_byz.49.b: "Saremo una nazione di valori plutocratici."
flavor_byz.49.c: "La nostra amministrazione deve guardare verso l'Esterno."
flavor_byz.49.d: "Guardare [ShowSocietyDirectionNameWithNoTooltip('inward')] è il modo in cui assicureremo la nostra sicurezza."

flavor_byz.50.title: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] Offre Aiuto Commerciale"
flavor_byz.50.desc: "La nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha deciso di sostenerci nelle nostre questioni economiche. Ha offerto le proprie mani per promulgare qualsiasi politica che [target_character.GetName] possa desiderare per i nostri [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
flavor_byz.50.a: "Per preservare questa ricchezza, promuoviamo [ShowSocietyDirectionNameWithNoTooltip('mercantilism')]."
flavor_byz.50.b: "I nostri mercati sono liberi per chiunque voglia entrarvi."

flavor_byz.51.title: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] Isola i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] [ROOT.GetCountry.GetGovernment.GetAdjective|U]"
flavor_byz_51_desc_common: "Invece di aiutare a pianificare un sistema efficiente per sostenere i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], la [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha scelto di partecipare alla riduzione del nostro potere, costringendoci a orientare la nostra nazione verso"
flavor_byz.51.desc.a: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('free_trade')]."
flavor_byz.51.desc.b: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('mercantilism')]."
flavor_byz.51.desc.c: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('capital_economy')]."
flavor_byz.51.desc.d: "$flavor_byz_51_desc_common$ [ShowSocietyDirectionName('traditional_economy')]."
flavor_byz.51.a: "Guidare [ROOT.GetCountry.GetNameWithNoTooltip] verso [ShowSocietyDirectionNameWithNoTooltip('free_trade')] potrebbe non essere una cattiva idea."
flavor_byz.51.b: "[ShowSocietyDirectionNameWithNoTooltip('mercantilism')] sarà utile per proteggere i porti [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
flavor_byz.51.c: "Uno spostamento verso [ShowSocietyDirectionNameWithNoTooltip('capital_economy')] può certamente rafforzare le nostre casse."
flavor_byz.51.d: "Manteniamo i valori di [ShowSocietyDirectionNameWithNoTooltip('traditional_economy')]."

flavor_byz.52.title: "Riforma del Corpus Juris Civilis"
 flavor_byz.52.entry: "$flavor_byz.52.title$" 
flavor_byz.52.desc: "Nonostante il nostro [ROOT.GetCountry.GetFlavorRank] sia sovrano, ciò non ha impedito alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] di intervenire nella politica del [ROOT.GetCountry.GetFlavorRank]. Sempre intenta a immischiarsi nel [ROOT.GetCountry.GetGovernment.GetParliament.GetName], i suoi desideri spesso contraddicono quelli di [target_character.GetName]. Forse cambiando le nostre leggi possiamo limitarne il potere in [ROOT.GetCountry.GetName]."
flavor_byz.52.a: "Riscriviamolo, anche se faremo arrabbiare i nostri ceti."
flavor_byz.52.b: "Il codice ha già servito [ROOT.GetCountry.GetNameWithNoTooltip] per molti secoli."
BYZ_NO_MORE_COURT_EVENTS: "Gli #Y Influenza della Corte Bizantina#! [events|e], tramite i quali la corte spinge periodicamente i nostri [societal_values|e] — nel bene o nel male — non si attiveranno più." #NEW
BYZ_COURT_EVENTS_WILL_CONTINUE: "Gli #Y Influenza della Corte Bizantina#! [events|e], tramite i quali la corte spinge periodicamente i nostri [societal_values|e] — nel bene o nel male — continueranno ad attivarsi." #NEW

flavor_byz.53.title: "Fortificazione delle [ShowBuildingTypeNameWithNoTooltip('theodosian_walls')]"
 flavor_byz.53.entry: "Rifortificazione delle Theodosian Walls" 
flavor_byz.53.desc: "Da quando i Latini saccheggiarono [target_province.GetName] nel 1204, le [ShowBuildingTypeName('theodosian_walls')] sono state ridotte a una frazione della loro antica gloria. In precedenza, ci mancavano le risorse per mantenerle adeguatamente, ma ora, in questi tempi difficili, dobbiamo assicurarci che siano pronte a un assalto."
flavor_byz.53.a: "Sono ciò che ha mantenuto l'impero così a lungo. Dobbiamo fortificarle di nuovo."
flavor_byz.53.b: "Nascondersi a [target_province.GetNameWithNoTooltip] non è la via del successo."
strengthened_theodosian_walls_desc: "Dal [event|e] $flavor_byz.53.title$" 

flavor_byz.54.title: "Gestione dei Mercanti [ShowCultureGroupNameWithNoTooltip('italian_group')]"
 flavor_byz.54.entry: "Gestione dell'Influenza Italiana" 
flavor_byz.54.desc: "Sebbene i [ShowPopTypeName('burghers')] [ShowCultureGroupName('italian_group')] ci abbiano aiutato in passato a ripopolare [target_location.GetName], è diventato chiaro che ora stanno sfruttando il [target_market.GetName]. Dobbiamo liberarci di loro da [target_location.GetNameWithNoTooltip] affinché non continuino i loro misfatti."
flavor_byz.54.a: "[target_location.GetNameWithNoTooltip] appartiene solo a [target_character.GetNameWithNoTooltip]!" 
flavor_byz.54.b: "Non provochiamo un'altra guerra con le nazioni [ShowCultureGroupNameWithNoTooltip('italian_group')]..."
BYZ_ALL_ITALIAN_MERCHANTS_BECOME_UNHAPPY: "Tutti i [pops|e] [ShowCultureGroupName('italian_group')] perdono [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%] di [pop_satisfaction|e]."
byz_destroy_italian_quarters_tt: "Gli [buildings|e] [ShowBuildingTypeName('galata')] e [ShowBuildingTypeName('venetian_quarter')] saranno distrutti a [target_location.GetName]"

flavor_byz.55.title: "Il Concilio di [ShowLocationNameWithNoTooltip('florence')]"
 flavor_byz.55.entry: "Diventare, *brividi*, Cattolici" 
flavor_byz.55.desc: "Con il nostro declino di potere e le minacce crescenti tutto intorno a noi, [target_character.GetName] ha pensato l'impensabile in tutta la storia [ROOT.GetCountry.GetAdjective]. Se il [ROOT.GetCountry.GetFlavorRank] deve sopravvivere, allora abbiamo bisogno del sostegno di [target_character2.GetName] e dell'intero mondo [ShowReligionAdjective('catholic')]. Forse [target_character.GetNameWithNoTooltip] dovrebbe viaggiare a ovest e negoziare con [target_character2.GetNameWithNoTooltip]."
flavor_byz.55.a: "Anche se un accordo con [target_country.GetNameWithNoTooltip] farà infuriare il Patriarcato..."
flavor_byz.55.b: "È una proposta oltraggiosa."
BYZ_ALL_ORTHODOX_BECOME_UNHAPPY: "Tutti i [pops|e] [ShowReligionAdjective('orthodox')] perdono [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e]."

flavor_byz.57.title: "Restauro delle Città di [ShowRegionNameWithNoTooltip('anatolia_region')]"
 flavor_byz.57.entry: "Restauro delle Città della Regione Anatolica" 
flavor_byz.57.desc: "Dall'invasione selgiuchide di [ShowRegionName('anatolia_region')] e dalla caduta delle nostre molte province locali, molte delle antiche città [ShowCultureName('greek_culture')] lì presenti sono state ridotte a nulla più che basi barbariche. Con la nostra riconquista della regione, tuttavia, forse possiamo restaurare lì l'ordine [ROOT.GetCountry.GetAdjective]."
flavor_byz.57.a: "Restauriamole."
flavor_byz.57.b: "Sono solo una reliquia del passato. La popolazione nativa locale merita rispetto."
BYZ_RESTORE_GREEK_POPS_IN_ANATOLIAN_CITIES: "#G 10%#! dei [pop|e] non-[ShowCultureGroupName('greek_group')] in [ShowRegionName('anatolia_region')] che risiedono in una [ShowLocationRankName('city')] o in una [ShowLocationRankName('town')] si convertirà a [ROOT.GetCulture.GetName]."
BYZ_ACCEPT_LOCAL_POPULATION: "Ogni [pop|e] non-[ShowCultureGroupName('greek_group')] in [ShowRegionName('anatolia_region')] che risiede in una [ShowLocationRankName('city')] o in una [ShowLocationRankName('town')] otterrà [ShowNamedValue('pop_satisfaction_extreme_bonus')|+=2%] di [pop_satisfaction|e]."
flavor_byz.58.title: "Migrazione [ShowCultureNameWithNoTooltip('albanian')]" 
flavor_byz.58.desc: "Membri di una tribù [ShowCultureName('albanian')] da [source_location.GetName], di fronte a conflitti tribali e scarse opportunità, hanno scelto di lasciare [source_location.GetProvince.GetName] nella speranza di trovare un futuro migliore. Non si sa molto della loro attuale ubicazione, ma si dice che stiano cercando di stabilirsi in [destination_location.GetProvince.GetName], entro [destination_location.GetName]. Vediamo se troveranno la pace che desiderano così disperatamente." 
flavor_byz.58.a: "Bah! Le loro faide tribali non faranno che peggiorare." 
flavor_byz.59.title: "$flavor_byz.58.title$" 
 flavor_byz.59.entry: "$flavor_byz.59.title$" 
flavor_byz.59.desc: "Membri di una tribù [ShowCultureName('albanian')] da [source_location.GetName] sono arrivati a [destination_location.GetName], cercando udienza presso il governatore locale con l'obiettivo di fondare un nuovo insediamento proprio. Tale permesso è già stato concesso da [destination_location.GetProvince.GetName], anche se potrebbe valere la pena concedere ai nuovi arrivati privilegi aggiuntivi affinché altri di loro vengano verso di noi." 
flavor_byz.59.a: "Dovremmo lavorare per incoraggiare ulteriori migrazioni." 
flavor_byz.59.b: "Bah! Non dovremmo essere disturbati da simili sciocchezze." 
BYZ_do_not_get_informed_about_migrations: "I [pops|e] di [culture|e] [ShowCultureName('albanian')] continueranno a migrare nelle nostre terre, ma non ne saremo più informati" 
BYZ_more_reasons_to_migrate_here: "I [pops|e] [ShowCultureName('albanian')] saranno più propensi a migrare nelle nostre terre tramite l'[event|e] se concediamo l'[estate_privilege|e] [ShowEstatePrivilegeName('tribes_land_rights')]" 
flavor_byz.60.title: "Un Co-Imperatore?" 
 flavor_byz.60.entry: "$flavor_byz.60.title$" 
flavor_byz.60.desc: "[target_character.GetName] è sempre stato un sostenitore e compagno di lunga data del defunto [target_character2.GetName]. Avendo inizialmente sostenuto il [ROOT.GetCountry.GetGovernment.GetRulerTitle] durante la lotta di [target_character2.GetHerHis] contro il nonno di [target_character2.GetHerHis], [GetCharacter('byz_andronikos_ii_palaiologos').GetName], [target_character.GetShortNameWithNoTooltip] ha distinto [target_character.GetHerselfHimself] come compagno leale e statista competente.\n\nDurante la vita di [target_character2.GetHerHis], a [target_character.GetNameWithNoTooltip] era stata offerta molte volte la posizione di co-imperatore, ma l'ha sempre rifiutata. Ora che [target_character2.GetShortNameWithNoTooltip] non c'è più, ci sono persone presso la [ROOT.GetCountry.GetGovernment.GetCourtTitle] che credono che [target_character.GetSheHe] sarebbe un grande co-imperatore." #NEW
flavor_byz.60.a: "Non è volontà di nessun altro se non di [target_character.GetHerHis]." 
flavor_byz.60.b: "Facciamo pressione su [target_character.GetHerHim] affinché accetti." 
BYZ_additional_events_become_available: "Ulteriori [events|e] diventano disponibili quando [target_character.GetName] è considerato co-imperatore" 
flavor_byz.61.title: "Tradimento o Cospirazione" 
 flavor_byz.61.entry: "$flavor_byz.61.title$" 
flavor_byz.61.desc: "[target_character2.GetName], una voce influente nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], ha iniziato a sospettare [target_character.GetName] di tradimento. Essendosi alleato con i nemici di [target_character.GetHerHis], [target_character2.GetShortNameWithNoTooltip] desidera vedere [target_character.GetHerHim] deposto, privato di tutti i titoli ed esiliato in un [ShowBuildingTypeName('orthodox_monastery')], così che [target_character.GetSheHe] non possa mai più influenzare la politica [ROOT.GetCountry.GetAdjective]. Nonostante ciò, molti cortigiani continuano a stimare [target_character.GetNameWithNoTooltip] e non vorrebbero alcun male per [target_character.GetHerHim]." 
flavor_byz.61.a: "Ci si dovrebbe fidare di [target_character2.GetNameWithNoTooltip]." 
flavor_byz.61.b: "[target_character.GetNameWithNoTooltip] non tradirebbe mai il [ROOT.GetCountry.GetFlavorRank]!" 
flavor_byz.62.title: "Delegazione dai Signori Franchi" 
 flavor_byz.62.entry: "$flavor_byz.62.title$" 
flavor_byz.62.desc: "La nostra campagna del 1337 in [GetCountry('EPI').GetName] fu un grande successo. [GetCharacter('epi_nikephoros_ii_orsini').GetName] fu rapidamente spodestato e i locali rimasero con l'impressione di uno stato forte - tutto grazie alla brillante guida di [target_character.GetName] e [GetCharacter('byz_andronikos_iii_palaiologos').GetName]. Le truppe nemiche [target_country.GetAdjective], impressionate da questa rapida campagna e dal nostro trattamento benevolo, tornarono a casa per diffondere notizie del trattamento [ROOT.GetCountry.GetAdjective] delle truppe [GetCountry('EPI').GetAdjectiveWithNoTooltip] e del tono diplomatico di [target_character.GetNameWithNoTooltip]." 
flavor_byz.62.a: "Promettiamo il nostro sostegno." 
flavor_byz.62.b: "Non abbiamo interesse ad assecondare i loro interessi." 
BYZ_conquered_locations_in_morea_will_be_more_integrated: "Per i prossimi #W 30#! anni, le [locations|e] appena conquistate in [ShowAreaName('morea_area')] riceveranno #G +30.0%#! di [integration|e]" 
flavor_byz.63.title: "Morte di [target_character.GetNameWithNoTooltip]" 
 flavor_byz.63.entry: "Morte di Nikephoros Gregoras" 
flavor_byz.63.desc_neutral: "La gelida presa della morte ha portato via uno dei nostri illustri storici, [target_character.GetName]. [target_character.GetShortNameWithNoTooltip] lascia un'eredità di leale servizio al [ROOT.GetCountry.GetLongName] e una notevole [target_woa.GetDefinition.GetName] — [target_woa.GetName]." 
flavor_byz.63.desc_nikephoros_is_hated: "$flavor_byz.63.desc_neutral$ È dunque molto deplorevole che [target_character.GetNameWithNoTooltip] abbia trascorso gli ultimi anni della vita di [target_character.GetHerHis] diffondendo l'eresia dell'esicasmo." 
flavor_byz.63.a: "Il [ROOT.GetCountry.GetLongNameWithNoTooltip] non sarà lo stesso senza [target_character.GetHerHim]." 
woa_was_created_here: "[THIS.GetWorkOfArt.GetDefinition.GetName] [THIS.GetWorkOfArt.GetName] è stata creata a [THIS.GetWorkOfArt.GetLocation.GetName] da [THIS.GetWorkOfArt.GetCreator.GetName]" 
flavor_byz.64.title: "Campagna nel Peloponnesus" 
 flavor_byz.64.entry: "$flavor_byz.64.title$" 
flavor_byz.64.desc: "[target_character.GetName], il nostro fidato generale, statista e co-imperatore, sta pianificando una campagna militare in [ShowAreaName('morea_area')] per sottomettere i principati franchi locali. Da tempo spina nel nostro fianco, i resti [ShowFormableCountryName('LAT_f')] attendono il momento opportuno per colpirci. La campagna di [target_character.GetShortNameWithNoTooltip] ci porterebbe certamente sollievo, ma rafforzerebbe anche la casa di [target_character.GetDynasty.GetName], che da tempo serve nel Peloponnesus come despoti." 
flavor_byz.64.a: "Prepariamoci alla guerra!" 
flavor_byz.64.b: "Questa è solo una folle ricerca di gloria." 
byz_additional_noble_power: "Per i prossimi #W 30#! anni, le [locations|e] appena conquistate in [ShowAreaName('morea_area')] riceveranno il [modifier|e] [ShowModifier('BYZ_morea_nobles')] per #W 30#! anni dal momento in cui vengono conquistate" 
flavor_byz.65.title: "[target_character.GetNameWithNoTooltip]" 
 flavor_byz.65.entry: "Demetrios Kydones, il Filosofo" 
flavor_byz.65.desc: "Il nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle] ha stretto amicizia con un [target_character.GetWomanMan] davvero eccezionale. [target_character.GetName] è uno studente di filosofia dotato di una mente curiosa e aperta. Sia [target_character2.GetName] sia [target_character.GetShortNameWithNoTooltip] concordano su molte cose, e coloro che sono nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] possono vedere il potenziale del giovane [target_character.GetShortNameWithNoTooltip]. [target_character.GetHeShe|U] potrebbe servire come grande aiutante nel governo del [ROOT.GetCountry.GetLongName]." 
flavor_byz.65.a: "[target_character.GetSheHe|U] deve diventare il nostro #italic mesazon#!!" 
flavor_byz.65.b: "Dovremmo far tradurre a [target_character.GetHerHim] opere in [ShowLanguageNameWithNoTooltip('latin_language')] in [ROOT.GetCountry.GetCourtLanguage.GetNameWithNoTooltip]!" 
byz_target_character_is_free_to_promote: "[target_character.GetName] non costerà alcuna [legitimacy_i|e][legitimacy|e] per essere promosso a [head_of_the_cabinet|e]" 
flavor_byz.66.title: "La Pasqua di Saint Demetrius" 
 flavor_byz.66.entry: "$flavor_byz.66.title$" 
flavor_byz.66.desc: "I [ShowPopTypeName('burghers')] di [target_location.GetName] stanno iniziando a organizzare la fiera di quest'anno dedicata a St. Demetrios. Questo consolidato evento annuale attira già molti cittadini e stranieri allo stesso modo e serve come grande dimostrazione della pietà [ROOT.GetCountry.GetAdjective]. Anche noi potremmo prestare il nostro aiuto nel sostenere questa tradizione duratura affinché le celebrazioni di quest'anno siano ricordate per secoli." 
flavor_byz.66.historical_info: "Il festival di Saint Demetrios, santo patrono di Thessaloniki, emerse come grande evento religioso e culturale entro il XIV secolo, radicato nella memoria del martirio del santo in una prigione romana intorno al 306 e nella sua reputazione di difensore miracoloso della città contro gli assedianti. Incentrata sulla basilica di Hagios Demetrios, la celebrazione durava sei giorni e combinava inni solenni e processioni con il vivace mercato Demetria tenuto fuori dalle mura cittadine, attirando mercanti e pellegrini da tutta la regione. In tempi moderni questa tradizione perdura tramite la festa del 26 ottobre e il festival Demetria ravvivato, che continua a esprimere la duratura fusione cittadina di fede, tradizione e vita comunitaria." 
flavor_byz.66.a: "Facciamo una donazione solenne." 
flavor_byz.66.b: "Hanno il nostro sostegno spirituale." 

flavor_byz.1000.title: "I Cannoni di [cannon_maker.GetNameWithNoTooltip]"
 flavor_byz.1000.entry: "I Cannoni di Orbán" 
flavor_byz.1000.desc: "[cannon_maker.GetName], un fonditore di ferro e ingegnere [cannon_maker.GetCulture.GetName], è apparso a corte. [cannon_maker.GetSheHe|U] ha dichiarato audacemente che [cannon_maker.GetSheHe] potrebbe costruire per noi un cannone di scala finora mai vista - se solo fornissimo a [cannon_maker.GetHerHim] metallo e fondi. Tuttavia, eminenti [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] ci mettono in guardia, dicendo che il salario richiesto da [cannon_maker.GetSheHe] sconvolgerebbe le gilde."
flavor_byz.1000.a: "[cannon_maker.GetSheHe|U] avrà tutto ciò di cui [cannon_maker.GetSheHe] ha bisogno."
flavor_byz.1000.b: "È oltraggioso!"
orban_goes_elsewhere.tt: "[cannon_maker.GetNameWithNoTooltip] potrebbe invece andare dai tuoi nemici..."
flavor_byz.1000.historical_info: "Orbán è noto alla storia per aver realizzato la grande bombarda che abbatté le mura di Constantinople. Offrì prima il proprio servizio all'imperatore romano d'Oriente Constantine XI, ma fu respinto - così invece andò dai Turchi..." 
great_bombard: "Costruzione di una Grande Bombarda"

flavor_byz.1001.title: "La Rovina di Babylon"
 flavor_byz.1001.entry: "$flavor_byz.1001.title$" 
flavor_byz.1001.desc: "[cannon_maker.GetName], un fonditore di ferro e ingegnere [cannon_maker.GetCulture.GetName], cerca impiego. [cannon_maker.GetSheHe|U] chiede davvero un salario esorbitante, ed è già stato respinto dal combattivo [GetCountry('BYZ').GetGovernment.GetRuler.GetNameWithNoTooltip] di [GetCountry('BYZ').GetName] - eppure [cannon_maker.GetNameWithNoTooltip] promette di costruire per noi un cannone capace di far saltare le mura stesse di Babylon." 
flavor_byz.1001.a: "Potremmo certamente farne uso."
flavor_byz.1001.b: "Promuoviamo invece i nostri armaioli."
flavor_byz.1001.historical_info: "$flavor_byz.1000.historical_info$" 

flavor_byz.1100.title: "Hesychasm"
 flavor_byz.1100.entry: "$flavor_byz.1100.title$" 
flavor_byz.1100.desc: "Le dispute teologiche agitano da tempo il cuore del nostro Impero. Come custodi e orgoglio della fede [ShowReligionAdjective('orthodox')], ci siamo eretti a difensori della vera dottrina nella nostra ricerca dei misteri divini.\n\nCi giunge ora voce che [target_character_1.GetName] abbia individuato preoccupanti irregolarità nelle pratiche religiose dei monaci di [target_location.GetName]. Sotto la direzione spirituale di [target_character_2.GetName], si dice che le loro devozioni si soffermino su audaci questioni riguardanti l'essenza e le energie di Dio, e incoraggino la pratica della quiete interiore e della preghiera incessante.\n\nIn risposta, [target_character_1.GetShortNameWithNoTooltip] ha messo per iscritto le sue obiezioni, condannando questi insegnamenti dell'Hesychasm come innovazione pericolosa e avvertendo che tali dottrine potrebbero seminare confusione tra i fedeli e turbare la fragile pace del nostro [ROOT.GetCountry.GetFlavorRank]. I nostri consiglieri avvertono che uno zelo mal gestito, mistico o critico che sia, potrebbe infiammare il disordine e forse persino provocare una rivolta aperta se questa questione non sarà risolta con prudenza." 
flavor_byz.1100.a: "Sosteniamo il movimento." 
flavor_byz.1100.b: "[target_character_1.GetShortNameWithNoTooltip] dice la verità, l'esicasmo è eresia!" 
flavor_byz.1100.c: "Ignoriamo il caos che fermenta." 
