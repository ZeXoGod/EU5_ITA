 variable_tt_montserrat_free: "Free Montserrat"
 variable_tt_union_of_aragon_rebels_variable: "Union of Aragon Rebels"
 variable_tt_war_of_the_aragonese_union_happened: "War of the Aragonese Union Happened"
 aragon_ruler_brother_fleeing_tt: "Il fratello del sovrano è fuggito"
 variable_tt_not_war_of_the_aragonese_union_is_won: "War of the Aragonese Union is Won"

 flavor_ara.220.title: "The Taula de Canvi de Barcelona"
 flavor_ara.220.entry: "$flavor_ara.220.title$"
 flavor_ara.220.desc: "The merchants and wealthy members of the [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] of [taula_bank_hq.GetName] have been expressing their need for a reliable institution that could handle money exchanges and guarantee the value of deposits. The establishment of a municipal exchange table in [taula_bank_hq.GetNameWithNoTooltip] would provide our [ROOT.GetCountry.GetFlavorRank] with a stable financial foundation and attract commerce from across the Mediterranean."
 flavor_ara.220.historical_info: "The #italic Taula de Canvi de Barcelona#!, or Exchange Table of Barcelona, was founded in 1401 and is considered one of the oldest public banks in the world. Created the Crown of Aragon at the behest of the #italic Consell de Cent#! in Barcelona, it was quickly followed by other similar #italic Taules#! in other cities of the Kingdom, like Valencia or Girona. Its stability and reliability made it a model for later public banks across Europe."
 flavor_ara.220.a: "A sound institution for our [ROOT.GetCountry.GetFlavorRank]!"
 flavor_ara.220.b: "Let us promote their banking practices."
 flavor_ara.221.title: "$flavor_ara.220.title$"
 flavor_ara.221.desc: "We have been entrusted with the handling finances and money exchange by the [ROOT.GetCountry.GetDiplomacy.GetOverlord.GetLongName] and the merchants of [taula_bank_hq.GetName]. Our exchange table shall provide stability and security to all who deposit with us."
 flavor_ara.221.a: "Our ledgers are open for business."

 flavor_ara.1000.entry: "$flavor_ara.1000.title$"
 flavor_ara.1000.title: "Un compromesso di successione"
 flavor_ara.1000.desc: "L'attuale turbolenza in [ROOT.GetCountry.GetName] ha spinto molti membri del [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] a cercare un nuovo sovrano per il [ROOT.GetCountry.GetFlavorRank]. Con diversi pretendenti in lizza per il trono, alcuni provenienti dallo stesso paese, molti ritengono che sarebbe meglio porre invece sul trono un membro di una dinastia straniera. [trastamara_candidate.GetName] è emerso come il candidato principale, avendo ottenuto il favore di tutti i ceti e avendo anche stretto legami con i sovrani del passato. Tuttavia, altre famiglie desiderano invitare membri sia da [first_country.GetName] sia da [second_country.GetName], ritenendoli più vicini ai propri interessi."
 flavor_ara.1000.a: "Prepariamoci per questa occasione."
 flavor_ara.1000.b: "Perché dovremmo consegnare il trono a degli stranieri?"
 ara_trigger_election_of_new_ruler_event_in_a_year_tt: "L'elezione si terrà entro un anno, e i candidati provenienti da [first_country.GetName] e [second_country.GetName] potranno partecipare"

 flavor_ara.1001.title: "$flavor_ara.1000.title$"
 flavor_ara.1001.desc: "Il [from_country.GetGovernment.GetEstateName('nobles_estate')] di [from_country.GetName] si è rivolto a noi con l'opportunità per [target_character.GetName] di partecipare al compromesso di [election_location.GetName], a causa della crisi di successione all'interno del loro [from_country.GetFlavorRank]. Questa rappresenta una grande opportunità per noi, ma [target_character.GetNameWithNoTooltip] potrebbe essere più adatto a rimanere al nostro servizio piuttosto che governare un'intera nazione."
 flavor_ara.1001.a: "Lasciamo che [target_character.GetHerHim] partecipi."
 flavor_ara.1001.b: "Non siamo interessati ai loro problemi di successione."
 ara_character_will_participate_in_the_selection_of_new_aragonese_ruler_tt: "[target_character.GetName] parteciperà al #Y Compromesso di [election_location.GetName]#!"


 flavor_ara.1002.title: "$flavor_ara.1000.title$"
 flavor_ara.1002.desc: "Con i preparativi per il Compromesso di [election_location.GetName] ormai completi, numerose famiglie del [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] provenienti da tutto il [ROOT.GetCountry.GetName] si sono riunite per esprimere le proprie opinioni sul candidato preferito. Tuttavia, un sentimento comune favorisce [trastamara_candidate.GetName], che sembra aver conquistato il cuore di queste famiglie con parole accattivanti e discorsi appassionati. Abbiamo comunque ancora l'opportunità di scavalcare il loro candidato preferito e scegliere invece un individuo più capace, uno che possa assicurare legami preziosi con il resto del mondo."
 flavor_ara.1002.a: "[trastamara_candidate.GetNameWithNoTooltip] è il candidato scelto dalle famiglie."
 flavor_ara.1002.b: "[first_foreign_candidate.GetNameWithNoTooltip] sembra essere il più capace."
 flavor_ara.1002.c: "I legami di [second_foreign_candidate.GetNameWithNoTooltip] potrebbero rivelarsi utili."
 variable_tt_ara_may_seize_mallorca: "Maiorca ci ha dato un pretesto per invaderla!"
