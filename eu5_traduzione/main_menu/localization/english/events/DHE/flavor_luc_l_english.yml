l_english:
 flavor_luc.1.entry: "$flavor_luc.1.title$"
 flavor_luc.1.title: "La Produzione di [ShowGoodsNameWithNoTooltip('silk')] di [ShowLocationNameWithNoTooltip('lucca')]"
 flavor_luc.1.desc: "[ShowGoodsName('silk')] è considerata una delle risorse più rare in [ShowContinentName('europe')], ed è quindi vista da molti [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] come il materiale più pregiato per l'abbigliamento. [ShowLocationName('lucca')] è già patria sia dei bachi da seta che di una nascente industria di [ShowGoodsNameWithNoTooltip('silk')], anche se la produzione non ha ancora raggiunto il suo pieno potenziale. Sia [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] che [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] concordano sul fatto che investire in questo bene ci permetterà di espandere la nostra produzione di [ShowGoodsName('fine_cloth')], eclissando chiunque in [ShowRegionName('italy_region')] tenti di competere con noi."
 flavor_luc.1.a: "Investiremo in questi bachi da seta."
 flavor_luc.1.b: "Se vogliono profitto, dovranno inseguirlo da soli."

 flavor_luc.2.entry: "$flavor_luc.2.title$"
 flavor_luc.2.title: "Commercio di [ShowGoodsNameWithNoTooltip('fine_cloth')] di [ShowLocationNameWithNoTooltip('lucca')]"
 flavor_luc.2.desc: "[ShowLocationName('lucca')] vanta un'importante industria di [ShowGoodsName('fine_cloth')]. Ci sono molte altre città in [ShowRegionName('italy_region')] che ci sovrastano in termini di quantità di produzione, ma non riescono a eguagliare la qualità superba del nostro tessuto, prodotto dai migliori borghesi con anni di esperienza nel mestiere. Persino le persone più ricche considerano l'abbigliamento in stile [ROOT.GetCountry.GetAdjective] un lusso, un fatto che ha portato a un aumento della produzione per soddisfare la domanda."
 flavor_luc.2.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_luc.2.a.entry: "Ottimo!"
 luc_fine_cloth_demand: "Domanda di Tessuto Pregiato"

 flavor_luc.3.entry: "$flavor_luc.3.title$"
 flavor_luc.3.title: "Raggiungere [ShowLocationNameWithNoTooltip('london')]"
 flavor_luc.3.desc: "I membri più opportunisti [ROOT.GetCountry.Custom('IT_BURGHERS_DEL_NOSTRO')][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] hanno concepito un'espansione nel [target_market.GetName]. In particolare, molti hanno già fatto piani per trasferirsi a [ShowLocationName('london')], che è di proprietà [target_country.Custom('IT_Di')][target_country.GetName], ed è amichevole nei nostri confronti.\n\nQuesta proposta è stata portata davanti al [ROOT.GetCountry.GetGovernment.GetCourtTitle], con alcuni membri entusiasti all'idea di espandere la nostra rete commerciale. Altri, tuttavia, hanno fatto notare che ciò potrebbe generare sfiducia con [target_country.GetNameWithNoTooltip], che i mercanti stranieri potrebbero non essere visti favorevolmente, e che perseguire la cooperazione con loro ci gioverebbe più della competizione."
 flavor_luc.3.a: "Espanderemo la nostra rete commerciale."
 flavor_luc.3.b: "Piuttosto che competere, dovremmo cooperare."

 flavor_luc.4.entry: "$flavor_luc.4.title$"
 flavor_luc.4.title: "Libertas!"
 flavor_luc.4.desc: "Lungo tutta la storia [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName], il nostro popolo ha vissuto molte sconfitte e umiliazioni. Eppure, nonostante tutto, restiamo incrollabili.\n\nArrendersi e accettare la sconfitta non è qualcosa che i cittadini [ROOT.GetCountry.Custom('IT_ADJ_MP')] fanno. Piuttosto, quando emerge una crisi o i nostri eserciti vengono sconfitti in battaglia, siamo pronti a difendere [ShowLocationName('lucca')]."
 flavor_luc.4.a: "Non mostreremo mai paura, qualunque siano le probabilità!"
 flavor_luc.4.b: "La migliore difesa è un grande attacco."

 flavor_luc.5.entry: "$flavor_luc.5.title$"
 flavor_luc.5.title: "Le [ShowBuildingTypeNameWithNoTooltip('walls_of_lucca')]"
 flavor_luc.5.desc: "La guerra e la carestia potrebbero non raggiungere sempre [ShowLocationName('lucca')], ma quando ciò accade, ogni cittadino ne soffre. Le sentinelle sulle mura sono sempre in guardia contro i nemici, sapendo che, qualora giungesse la sconfitta, la loro casa sarebbe in pericolo. Molti nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno proposto di ampliare le mura, rendendole più imponenti possibile per guadagnare la fiducia del popolo e garantire la sicurezza di ogni cittadino."
 flavor_luc.5.a: "Amplieremo le mura."
 flavor_luc.5.b: "Dovremmo assicurarci che la sconfitta militare non giunga mai."

 flavor_luc.1000.entry: "$flavor_luc.1000.title$"
 flavor_luc.1000.title: "Acquisto [GetCountry('LUC').Custom('IT_Di')][GetCountry('LUC').GetNameWithNoTooltip]"
 flavor_luc.1000.desc: "La guerra che [target_country.GetName] sta attualmente combattendo ci ha offerto l'opportunità di cambiare chi serviamo, qualora lo desiderassimo. Piuttosto che ottenere ciò con mezzi militari, molti nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito che potremmo essere venduti [GetCountry('PIS').Custom('IT_Alla')][GetCountry('PIS').GetName], sia per guadagno economico che come dimostrazione di buona fede."
 flavor_luc.1000.a: "Proponiamo questo [target_country.Custom('IT_Alla')][target_country.GetNameWithNoTooltip]."
 flavor_luc.1000.a.entry: "Proponiamo questo ai nostri signori."
 flavor_luc.1000.b: "Se dobbiamo ottenere l'indipendenza, dovrà essere attraverso la guerra."

 flavor_luc.1001.title: "$flavor_luc.1000.title$"
 flavor_luc.1001.desc: "Con la guerra contro [enemy_country.GetName] che infuria, sono arrivati diplomatici [GetCountry('LUC').Custom('IT_Dalla')][GetCountry('LUC').GetName]. Parlano dello stato della guerra, e di come [GetCountry('PIS').GetName] stia preparando le proprie truppe per un intervento militare contro di noi. Per prevenire ciò, hanno offerto [GetCountry('LUC').GetNameWithNoTooltip] stessa come pagamento per la pace — e per il proprio vantaggio finanziario."
 flavor_luc.1001.a: "Non dovremmo rischiare un altro nemico in [ShowRegionNameWithNoTooltip('italy_region')]."
 flavor_luc.1001.b: "I nostri stati clienti non sono in vendita."

 flavor_luc.1002.title: "$flavor_luc.1000.title$"
 flavor_luc.1002.desc: "[target_country.Custom('IT_La')|U][target_country.GetName] ci ha proposto un'offerta speciale. Desiderano venderci il loro stato cliente [GetCountry('LUC').GetName], e in cambio stabiliremo una tregua con loro e non interverremo nel loro attuale conflitto contro [enemy_country.GetName]."
 flavor_luc.1002.a: "Un affare vantaggioso."
 flavor_luc.1002.b: "Perché comprare qualcosa che possiamo ottenere con uno sforzo militare?"

 flavor_luc.1100.entry: "$flavor_luc.1100.title$"
 flavor_luc.1100.title: "Un'Alleanza Vantaggiosa"
 flavor_luc.1100.desc: "La nostra attuale posizione in [ShowRegionName('italy_region')] è stabile, ma potrebbero sorgere minacce esterne se non stiamo abbastanza attenti. Per questo motivo, molti nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggeriscono di cercare un'alleanza con [GetCountry('GEN').GetName]. Entrambe le parti ne trarranno beneficio, assicurando che chiunque tenti di conquistare la regione dovrà affrontare un avversario più grande e più unito."
 flavor_luc.1100.a: "Un'alleanza del genere sarebbe l'ideale."
 flavor_luc.1100.b: "Dovremmo invece cercare di proteggere i nostri confini attraverso l'espansione."

 flavor_luc.1101.title: "$flavor_luc.1100.title$"
 flavor_luc.1101.desc: "Le attuali tensioni in tutta [ShowRegionName('italy_region')] hanno portato molti stati a respingere i nemici da soli, ma ciò non significa che dobbiamo restare separati. È proprio per questo motivo che i diplomatici [from_country.Custom('IT_Di')][from_country.GetName] si sono rivolti a noi riguardo a una potenziale alleanza. Sia [target_character.GetName] che [target_character2.GetName] potranno garantire la propria sovranità, forse anche aiutandosi a vicenda nell'espellere le minacce provenienti da fuori la regione."
 flavor_luc.1101.a: "È di certo qualcosa che aiuterebbe entrambi."
 flavor_luc.1101.b: "Non vale la pena aiutarli. Potremmo invece cercare di conquistarli..."
