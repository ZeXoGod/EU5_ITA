l_english:
 flavor_tun.1.desc: "$ibn_khaldun_patronage$"
 flavor_tun.1.entry: "$flavor_gra.5.title$"
 flavor_tun.1.a: "Molto bene."
 flavor_tun.1.b: "Non ci curiamo di tali spese frivole!"

 tun_have_more_gp_score_than_us: "Nessun [country|e] [ShowReligionAdjective('sunni')] ha più [great_power_score|e] di [THIS.GetCountry.GetName]"

 flavor_tun.2.caliphal_backstory: "Fu durante il crollo del Califfato [GetCountry('ALM').GetAdjective] che il nostro stato si formò. In quel periodo, il fondatore della dinastia [ShowDynastyName('hafsid_dynasty')], il venerabile 'Abū Zakariyyā, rivendicò il titolo di #italic 'Amīr al-Mu'minīn#!, assumendo il ruolo di $rank_empire_muslim_ruler_male$ e proclamando #italic de facto#! l'indipendenza. Questa rivendicazione fu immediatamente riconosciuta dalla dinastia [ShowDynastyName('nasrid_dynasty')] di [ShowCountryNameIfActive('GRA')], così come dai capi delle altre città [ShowCultureName('andalusi')]. Quando gli stati di [ShowCountryNameIfActive('TLE')] e [ShowCountryNameIfActive('MOR')] furono fondati, anch'essi riconobbero rapidamente la nostra rivendicazione. La nostra autorità è rispettata fin nella lontana Città Santa di [ShowLocationName('mecca')], dove lo Šarīf aveva riconosciuto la nostra pretesa califfale nel 1259, in seguito alla recente caduta degli Abbasidi contro i Mongoli."

 flavor_tun.2.title: "Il vacillare del Califfato"
 flavor_tun.2.entry: "$flavor_tun.2.title$"
 flavor_tun.2.desc: "$flavor_tun.2.caliphal_backstory$\n\nOggi rimane ben poco di quello splendore passato. I nostri problemi interni hanno gravemente indebolito l'autorità del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle], che è un $rank_empire_muslim_ruler_male$ soltanto di nome. Dobbiamo restituire l'autorità califfale al [ROOT.GetCountry.GetLongName]!"
 flavor_tun.2.a: "Ci faremo rispettare!"
 flavor_tun.2.b: "Abbandoniamo il titolo."
 tun_caliphate_decision_enabled: "Abilita la [decision|e] [ShowDecisionName('hafsid_caliphate_decision')]"

 flavor_tun.3.title: "Ripristinare l'autorità califfale"
 flavor_tun.3.desc: "$flavor_tun.2.caliphal_backstory$\n\nNonostante questa autorità sia vacillata nel secolo successivo, siamo riusciti a riportare il [ROOT.GetCountry.GetLongName] dall'orlo dell'irrilevanza. Il [ROOT.GetCountry.GetFlavorRank] è ormai di nuovo uno degli stati principali del mondo [ROOT.GetCountry.GetReligion.GetGroup.GetAdjective]."
 flavor_tun.3.a: "Avremo buona cura della #italic 'Umma#!!"
 hafsid_caliphate_name_tt: "Il nostro nome includerà il titolo #Y Califfato#!"
 
 hafsid_caliphate_decision.title: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.entry: "$flavor_tun.3.title$"
 hafsid_caliphate_decision.desc: "$flavor_tun.3.desc$"
 hafsid_caliphate_decision.desc.entry: "Non siamo riusciti ad assicurarci il ruolo di successori del Califfato [GetCountry('ALM').GetAdjective]. Questo non può continuare! Dobbiamo riconquistare il nostro posto a capo della comunità [ShowReligionAdjective('sunni')]!"
 hafsid_caliphate_decision.a: "$flavor_tun.3.a$"

 flavor_tun.4.title: "Successione di [aging_monarch.GetNameWithNoTooltip]"
 flavor_tun.4.entry: "Successione di [GetCharacter('tun_abu_yahya_abu_bakr_ii').GetNameWithNoTooltip]"
 flavor_tun.4.desc: "[aging_monarch.GetName] si preoccupa sempre più della decisione più cupa, ma anche più vitale, che un monarca anziano deve prendere: nominare [aging_monarch.GetHerHis] successore. Questa nomina dovrebbe essere piuttosto ovvia, dato che [preferred_heir.GetName] è sempre stato il favorito del nostro caro [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Il problema riguarda [aging_monarch.GetHerHis] altri figli: [future_usurper.GetName], che assiste il governo a [ROOT.GetCountry.GetCapital.GetName], e [third_way.GetName] di [target_country2.GetName], un possibile pretendente al trono.\n\nQuesta scelta avrà un profondo impatto sulla stabilità del [ROOT.GetCountry.GetLongName] ben oltre la morte di [aging_monarch.GetShortNameWithNoTooltip]."
 flavor_tun.4.a: "Lasciamo che [preferred_heir.GetNameWithNoTooltip] di [target_country.GetNameWithNoTooltip] prenda il potere."
 flavor_tun.4.a.entry: "Lasciamo che [GetCharacter('tun_abu_l_abbas_ahmad').GetNameWithNoTooltip] di $GFS$ prenda il potere."
 flavor_tun.4.b: "[future_usurper.GetNameWithNoTooltip] è una scelta sicura." 
 flavor_tun.4.b.entry: "[GetCharacter('tun_abu_hafs_umar').GetNameWithNoTooltip] è una scelta sicura." 
 flavor_tun.4.c: "[third_way.GetNameWithNoTooltip] aiuterebbe a unire i regni." 
 flavor_tun.4.c.entry: "[GetCharacter('tun_abu_zakariya_yahya').GetNameWithNoTooltip] aiuterebbe a unire i regni." 
 TUN_THIS_will_be_appointed_heir_tt: "[THIS.GetCharacter.GetName] diventerà [heir|e] di [ROOT.GetCountry.GetName]"
 TUN_unite_two_realms_tt: "Poiché [THIS.GetCharacter.GetName] è [ruler|e] di un [ShowSubjectTypeName('familial_governor')] a [THIS.GetCharacter.GetCourtCountry.GetName], quando [THIS.GetCharacter.GetSheHe] salirà al trono, i due stati si uniranno"
 TUN_civil_war_from_preferred_heir_tt: "Poiché [preferred_heir.GetName] è l'erede preferito, [preferred_heir.GetSheHe] scatenerà prontamente una [war|e] con l'appoggio del [ShowEstateTypeName('tribes_estate')], il che farà defezionare le nostre [locations|e] comprese in [ShowScriptedGeographyName('gafsa_sphere_of_influence_geography')]"
 TUN_abu_hafs_will_try_to_start_a_civil_war_tt: "[future_usurper.GetName] potrebbe tentare di usurpare il trono a [THIS.GetCharacter.GetName]"
 TUN_we_will_succeed_when_target_ruler_dies_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.GetName] salirà al trono di [from_country.GetName], unendo i due paesi sotto il vessillo [from_country.GetAdjectiveWithNoTooltip] qualora non avvenga alcuna usurpazione"

 flavor_tun.5.title: "Una nomina a [from_country.GetNameWithNoTooltip]"
 flavor_tun.5.desc_positive: "Ottime notizie! [aging_monarch.GetName] [from_country.Custom('IT_DEL_RANGO')][from_country.GetLongName] ha appena nominato [preferred_heir.GetName] erede al [aging_monarch.GetHerHis] [from_country.GetFlavorRank]. Non è una sorpresa, dato che [preferred_heir.GetShortNameWithNoTooltip] è riconosciuto da tempo come il successore designato. Con un simile capo al timone, il futuro sembra luminoso per [ShowScriptedGeographyName('ifriqiya_geography')]."
 flavor_tun.5.desc_negative: "Dannazione! Con una mossa senza precedenti, [aging_monarch.GetName] [from_country.Custom('IT_Di')][from_country.GetName] ha appena nominato [appointed_heir.GetName] per succedere a [aging_monarch.GetHerHim]. È risaputo in [ShowScriptedGeographyName('ifriqiya_geography')] che [preferred_heir.GetName] sia il candidato più popolare e un successore naturale, quindi dev'essere accaduto qualcosa di losco perché [appointed_heir.GetNameWithNoTooltip] sia stato nominato erede."
 flavor_tun.5.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_tun.5.b: "[preferred_heir.GetNameWithNoTooltip] non accetterà tutto questo!"
 flavor_tun.5.c: "Dovremo conviverci."

 flavor_tun.6.title: "Una risposta attesa"
 flavor_tun.6.desc: "Come previsto, la nomina di [appointed_heir.GetName] non è stata ben accolta da [preferred_heir.GetName], che ha subito reagito contestandola. Con l'appoggio del [ShowEstateTypeName('tribes_estate')], [target_country.GetName] ha dichiarato guerra per il trono di [ROOT.GetCountry.GetName], e gli eserciti di [preferred_heir.GetShortNameWithNoTooltip] sono in marcia verso [ROOT.GetCountry.GetCapital.GetName]."
 flavor_tun.6.a: "[ROOT.GetCountry.Custom('common_string_negative')]"
 GFS_will_receive_following: "Se [target_country.GetName] sceglierà di combattere una [war|e] per questo motivo:"

 flavor_tun.7.title: "Successione usurpata!"
 flavor_tun.7.desc: "Nonostante avesse nominato [target_character2.GetName] successore [from_country.Custom('IT_AL_RANGO')][from_country.GetLongName], il loro parente ribelle [target_character.GetName] ha scelto di sfruttare [target_character.GetHerHis] attuale posizione nella capitale nel tentativo di impadronirsi del [from_country.GetFlavorRank]. Questo farà indubbiamente infuriare [target_character2.GetShortNameWithNoTooltip] di [target_country.GetName], che non mancherà di prendere le armi contro [target_character.GetHerHis] [target_character2.GetSisterBrother]."
 flavor_tun.7.a: "Chi primo arriva, meglio alloggia."
 flavor_tun.7.b: "È uno scandalo! Non è giusto!"

 flavor_tun.8.title: "$flavor_tun.7.title$"
 flavor_tun.8.desc: "La successione di [target_character2.GetName] [from_country.Custom('IT_NEL_RANGO')][from_country.GetLongName] è stata usurpata da parte di [target_character2.GetHerHis] [target_character.GetSisterBrother], [target_character.GetName], che non ha perso tempo a prendere il controllo del [from_country.GetFlavorRank] e a sottomettere il suo [from_country.GetGovernment.GetCourtTitle].\n\nÈ umiliante per [target_character2.GetShortNameWithNoTooltip] vedere il proprio nome infangato in questo modo! Dobbiamo punire [target_character.GetShortNameWithNoTooltip]."
 flavor_tun.8.a: "Alla guerra!"
 flavor_tun.8.b: "Non possiamo permetterci di combattere."

 flavor_tun.10.title: "Emirismo"
 flavor_tun.10.entry: "$flavor_tun.10.title$"
 flavor_tun.10.desc: "[ShowScriptedGeographyName('ifriqiya_geography')] è un covo di anarchia e depravazione. Per buona parte di un secolo, il [ROOT.GetCountry.GetLongName] e le sue dipendenze [ShowDynastyName('hafsid_dynasty')] non sono riusciti a esercitare il controllo oltre le città, causando disordini diffusi e criminalità nelle province rurali. Eppure, un raggio di speranza illumina i notabili [ShowCultureName('andalusi')] e gli sceicchi di spicco del [ShowEstateTypeName('nobles_estate')] — quello dell'ideologia dell'emirismo, che auspica un futuro in cui un unico emiro regionale governerà su tutta [ShowAreaName('tunis_area')], riportandola a prosperare."
 flavor_tun.10.a: "Possa [ROOT.GetCountry.GetReligion.GetGodName] mostrarci la luce."
 flavor_tun.10.a.entry: "Possa $muslim_god_name$ mostrarci la luce."
 tun_info_about_tunis_decentralization: "Dovremmo puntare a rimuovere al più presto la [government_reform|e] [ShowGovernmentReformName('tun_strong_familial_governors')]"
 tun_additional_benefits_for_farfanes_tt: "[ShowGovernmentReformName('catalan_merchant_privileges')] garantisce benefici al nostro [ShowModifierTypeName], in base al numero di [ShowUnitDefinitionName('a_farfanes')] che possediamo"

 flavor_tun.11.title: "[ShowScriptedGeographyNameWithNoTooltip('ifriqiya_geography')] riunita"
 flavor_tun.11.desc: "La decentralizzazione del [ROOT.GetCountry.GetLongName] è stata affrontata alla radice. L'era dei [ShowGovernmentReformName('tun_strong_familial_governors')] è finita, e tutta [ShowScriptedGeographyName('ifriqiya_geography')] è di nuovo riunita sotto i vessilli dei [ROOT.GetCountry.GetGovernment.GetRulerOrHeirIfRegent.GetDynasty.GetName]. Non si vedrà più la campagna [ROOT.GetCountry.Custom('IT_ADJ_FS')] devastata dalla criminalità dilagante; non si vedranno più gli emiri [ROOT.GetCountry.Custom('IT_ADJ_MP')] ricattati dal [ShowEstateTypeName('nobles_estate')]; non si vedrà più lo stato [ROOT.GetCountry.GetAdjectiveWithNoTooltip] dipendere dal sostegno di attori stranieri.\n\nÈ tempo di resa dei conti per il vecchio ordine, e una grande opportunità per inaugurare una nuova era."
 flavor_tun.11.a: "Questa è l'alba di una nuova era."
 flavor_tun.11.b: "La nascita di una nuova identità."
 IFRIQIYA_NAME: "'Ifrīqiya"
 IFRIQIYA_NAME_ADJ: "$IFRIQIYA_NAME$"

 ifriqiya_reunited_decision.title: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.entry: "$flavor_tun.11.title$"
 ifriqiya_reunited_decision.desc: "$flavor_tun.11.desc$"
 ifriqiya_reunited_decision.desc.entry: "Per fin troppo tempo [ShowScriptedGeographyName('ifriqiya_geography')] è rimasta divisa in molti stati, molti dei quali governati da rami della famiglia [ShowDynastyName('hafsid_dynasty')]. Non possiamo permettere che questa decentralizzazione perduri oltre."
 ifriqiya_reunited_decision.a: "$flavor_tun.11.a$"

 flavor_tun.12.title: "La crescita della pirateria a [ShowLocationNameWithNoTooltip('bejaia')]"
 flavor_tun.12.entry: "$flavor_tun.12.title$"
 flavor_tun.12.desc: "Negli ultimi anni, [target_location.GetName] ha visto espandersi la sua industria più insolita, eppure estremamente redditizia: la pirateria nel [ShowScriptedGeographyName('mediterranean_sea_geography')]. Da molti decenni ormai, gli sceicchi locali sostengono ampiamente il [ShowBuildingTypeName('pirate_haven')] e le sue incursioni non proprio clandestine contro i villaggi [ShowReligionGroupAdjective('christian')], nonostante le relazioni commerciali in corso. Tali incursioni danneggiano attivamente i nostri rapporti con potenziali partner commerciali, ma i profitti che ricaviamo dalla [ShowPolicyName('state_piracy_policy')] non vanno sottovalutati."
 flavor_tun.12.a: "Sono nemici di [ROOT.GetCountry.GetReligion.GetGodName]!"
 flavor_tun.12.a.entry: "Sono nemici di $muslim_god_name$!"
 flavor_tun.12.b: "Non importa."
 flavor_tun.12.c: "La pirateria non ci farà alcun bene."

 flavor_tun.13.title: "Morsa economica"
 flavor_tun.13.entry: "$flavor_tun.13.title$"
 flavor_tun.13.desc: "I mercanti [ShowReligionGroupAdjective('christian')] in [ROOT.GetCountry.GetName] hanno già ricevuto ampi [ShowGovernmentReformName('catalan_merchant_privileges')]. Nonostante ciò, nonostante i quartieri che forniamo loro così generosamente, la possibilità di fare riferimento ai propri simili, la libertà di religione che abbiamo concesso loro, il [target_country.GetAdjective] [target_country.GetGovernment.GetEstateName('burghers_estate')] continua a chiedere di più — altrimenti il loro paese d'origine potrebbe cessare del tutto i rapporti commerciali con noi."
 flavor_tun.13.a: "I mercenari sono troppo importanti."
 flavor_tun.13.b: "Bah! Non abbiamo bisogno dei loro servizi."
 tun_economic_stranglehold_tt: "Il [ShowModifierTypeName('global_merchant_power')] in [ShowGovernmentReformName('catalan_merchant_privileges')] diminuirà del #R -10.0%#!"

 flavor_tun.14.title: "La richiesta di un parente"
 flavor_tun.14.desc: "Uno dei principi della famiglia [ShowDynastyName('hafsid_dynasty')], [target_character.GetName], è diventato abbastanza influente da rivendicare una posizione di [ShowSubjectTypeName('familial_governor')]. A meno che non acconsentiamo e concediamo [target_location.GetName] a [target_character.GetNameWithNoTooltip], provocheremo sicuramente disordini nel [ROOT.GetCountry.GetLongName]."
 flavor_tun.14.a: "Concediamolo a [target_character.GetHerHim]!"
 flavor_tun.14.b: "Non è il momento."
 tun_target_character_expects_a_governorship_tt: "[target_character.GetName] si aspetta di diventare un [ShowSubjectTypeName('familial_governor')], e finché [target_character.GetSheHe] non otterrà tale posizione tramite [ShowCharacterInteractionName('assign_familial_governor')], [target_character.GetSheHe] potrà continuare a far scattare questo [event|e]"

 flavor_tun.15.title: "Successione contesa"
 flavor_tun.15.desc: "La morte del vecchio [old_ruler.GetName] ha lasciato un vuoto di potere a [ROOT.GetCountry.GetCapital.GetName]. In teoria, [new_ruler.GetName] dovrebbe assumere il ruolo di governatore in [ROOT.GetCountry.GetName], eppure la successione è tutt'altro che garantita. Una rivolta popolare, sostenuta da un attore sconosciuto, sta marciando per le strade della capitale, cercando di garantire la successione di [target_character2.GetName]. Sosterremo il legittimo erede, o lasceremo che il [ShowEstateTypeName('burghers_estate')] abbia la meglio?"
 flavor_tun.15.a: "[new_ruler.GetNameWithNoTooltip] è il legittimo erede!"
 flavor_tun.15.b: "Dobbiamo ascoltare la rivolta."

 flavor_tun.16.title: "Successione di [target.GetNameWithNoTooltip]"
 flavor_tun.16.desc: "Con la successione di [new_ruler.GetName], gli stati [target.Custom('IT_DEL_RANGO')][target.GetLongName] e di [ROOT.GetCountry.GetName] sono di nuovo uniti sotto un unico sovrano centrale [ShowDynastyName('hafsid_dynasty')]. Speriamo che [ShowScriptedGeographyName('ifriqiya_geography')] venga presto riunificata, e non soffra più di una grave [ShowSocietyDirectionName('decentralization')]."
 flavor_tun.16.a: "Un passo più vicino all'unità."
 flavor_tun.16.b: "[ROOT.GetCountry.Custom('common_string_positive')]"
 tun_target_was_annexed_tt: "[target.GetName] è stato [annexed|e] da [ROOT.GetCountry.GetName]"
 
 flavor_tun.17.title: "Successione contesa in [from_country.GetNameWithNoTooltip]"
 flavor_tun.17.desc: "Avendo ottenuto sufficiente sostegno popolare dal [from_country.GetGovernment.GetEstateName('burghers_estate')] a [from_country.GetCapital.GetName], [target_character2.GetShortNameWithNoTooltip] ha assunto il ruolo di sovrano nominale dello stato, negando di fatto a [new_ruler.GetNameWithNoTooltip] la sua legittima eredità e a noi la sua guida."
 flavor_tun.17.a: "Non lo tollereremo!"
 flavor_tun.17.b: "Altre questioni ci preoccupano di più."

 flavor_tun.18.title: "Un notabile [ShowCultureNameWithNoTooltip('andalusi')]"
 flavor_tun.18.desc: "Un [ShowCultureName('andalusi')] [target_character.GetWomanMan] locale, nato e cresciuto a [target_character.GetBirthLocation.GetArea.GetName], è recentemente salito di grado ed è entrato nella [ROOT.GetCountry.Custom('IT_ADJ_FS')] [ROOT.GetCountry.GetGovernment.GetCourtTitle] a [ROOT.GetCountry.GetCapital.GetName]. Sembra che [target_character.GetName] diventerà presto uno dei membri [ShowEstatePrivilegeName('andalusi_elite')] del nostro [ROOT.GetCountry.GetFlavorRank]."
 flavor_tun.18.a: "Splendido!"

 flavor_tun.19.title: "Un nuovo successore?"
 flavor_tun.19.desc: "Le strade di [ROOT.GetCountry.GetCapital.GetName] hanno riecheggiato di recente di mormorii e pettegolezzi. Il [ROOT.GetCountry.GetCapital.GetRank.GetName] sta valutando il governo di [target_character2.GetName], e chi potrebbe essere il candidato perfetto per succedere a [target_character2.GetHerHim]. Il [ShowEstateTypeName('burghers_estate')] ha scelto un personaggio illustre, [target_character.GetName], che ritiene sarebbe il legittimo successore al trono di [ROOT.GetCountry.GetName]. Si dice che il [ShowEstateTypeNameWithNoTooltip('burghers_estate')] sia stato convinto dalle [target_character.GetHerHis] generose promesse di privilegi e diritti extra."
 flavor_tun.19.a: "Procediamo, nominiamo [target_character.GetNameWithNoTooltip]."
 flavor_tun.19.b: "Sciocchi, se ci credono."
 
