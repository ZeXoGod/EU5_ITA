l_english:
 flavor_hun_ven.1.title: "L'Accordo Dalmata"
 flavor_hun_ven.1.entry: "Trattato di Zara - Evento Ungherese"
 flavor_hun_ven.1.desc: "Da anni, [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] [ROOT.GetCountry.Custom('IT_CROWN_HA')] sognato di liberarsi dai confini dell'entroterra e di conquistare uno sbocco sul [ShowAreaName('adriatic_sea_area')]. Mentre i nostri agenti ci portano notizie del declino [GetCountry('VEN').GetAdjective], alcuni presso la [ROOT.GetCountry.GetGovernment.GetCourtTitle] suggeriscono che questa sia l'opportunità che stavamo aspettando. Piuttosto che gettarci a capofitto in guerra, è stato proposto di fare pressione [GetCountry('VEN').Custom('IT_Sulla')][GetCountry('VEN').GetNameWithNoTooltip] affinché faccia concessioni diplomaticamente."
 flavor_hun_ven.1.a: "Negoziare è una perdita di tempo."
 flavor_hun_ven.1.b: "Proviamo a esercitare pressione diplomatica."
 flavor_hun_ven.1.historical_info: "Durante il regno di Luigi I, l'Ungheria cercò di espandere il proprio accesso all'Adriatico e di indebolire il dominio Veneziano lungo la costa Dalmata. Luigi lanciò un'offensiva contro Venezia nel 1356 e conquistò rapidamente molte importanti città Dalmate. Nel 1358, Venezia aveva subito una serie di gravi sconfitte ed era messa a dura prova da disordini interni, così la Repubblica accettò di negoziare. Con il conseguente Trattato di Zara, Venezia rinunciò al controllo della Dalmazia, il che permise l'ascesa della Repubblica di Ragusa come soggetto semi-indipendente dell'Ungheria."

 flavor_hun_ven.2.title: "L'Accordo Dalmata"
 flavor_hun_ven.2.desc: "La sofferenza interna [ROOT.GetCountry.Custom('IT_DEL_RANGO')][ROOT.GetCountry.GetFlavorRank] non è passata inosservata. [GetCountry('HUN').Custom('IT_La')|U][GetCountry('HUN').GetName] ha proposto un incontro tra delegazioni per negoziare la cessione dei nostri possedimenti [ShowCultureName('dalmatian')|U] in favore [GetCountry('HUN').Custom('IT_Di')][GetCountry('HUN').GetNameWithNoTooltip]. La [ROOT.GetCountry.GetGovernment.GetCourtTitle] è divisa sulla questione. Molti denunciano la proposta come un colpo umiliante al nostro onore e alla nostra forza. Altri invitano alla cautela, sostenendo che rifiutare le loro condizioni potrebbe provocare una guerra in cui potremmo perdere molto più della sola Dalmazia."
 flavor_hun_ven.2.a: "Questa proposta è sciocca quanto [GetCountry('HUN').GetGovernment.GetRuler.Custom('IT_ART_IL_LA')] loro [GetCountry('HUN').GetGovernment.GetRulerTitle]!"
 flavor_hun_ven.2.a.entry: "Questa proposta è sciocca quanto il loro sovrano!"
 flavor_hun_ven.2.b: "Non abbiamo altra scelta se non accettare."
