l_english:
 flavor_rag.1000.title: "Il Nemico alle Porte"
 flavor_rag.1000.entry: "$flavor_rag.1000.title$"
 flavor_rag.1000.desc: "Notizie funeste sono giunte alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]: le potenti armate [GetCountry('TUR').Custom('IT_ADJ_FP')] hanno finalmente raggiunto i nostri confini. È dolorosamente chiaro che la nostra [ROOT.GetCountry.GetFlavorRank] non potrebbe mai sperare di resistere con la forza delle armi, e così alcuni dei nostri patrizi hanno avanzato un'audace proposta. Sostengono che gli interessi di [GetCountry('TUR').GetNameWithNoTooltip] e di [ROOT.GetCountry.GetName] non siano fondamentalmente in conflitto, e che offrire loro il riconoscimento della loro supremazia e un tributo annuale in cambio di protezione e libertà potrebbe essere un modo per sopravvivere."
 flavor_rag.1000.a: "Inviamo un emissario a negoziare con [GetCountry('TUR').GetGovernment.GetRulerTitle]."
 flavor_rag.1000.a.entry: "Inviamo un emissario a negoziare con lui."
 flavor_rag.1000.b: "Difenderemo la nostra indipendenza a ogni costo!"
 flavor_rag.1000.historical_info: "Nel 1458 la Repubblica di Ragusa entrò formalmente in una relazione tributaria con gli Ottomani. Sebbene l'accordo obbligasse Ragusa a pagare un tributo annuo di circa 12.500 ducati d'oro, essa conservò una notevole autonomia e fu in grado di mantenere la propria flotta mercantile e di condurre la diplomazia estera. Il rapporto, vantaggioso per entrambe le parti, durò per secoli, e Ragusa rimase tributaria degli Ottomani fino all'abolizione della Repubblica nel 1808, durante le guerre napoleoniche."

 flavor_rag.1001.title: "Un'Offerta [GetCountry('RAG').Custom('IT_Dalla')][GetCountry('RAG').GetNameWithNoTooltip]"
 flavor_rag.1001.desc: "Un emissario [GetCountry('RAG').Custom('IT_Della')][GetCountry('RAG').GetName] è giunto alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] con una umile proposta da presentare a [ROOT.GetCountry.GetGovernment.GetRulerTitle]. L'emissario [GetCountry('RAG').GetAdjectiveWithNoTooltip] ammette che la loro [GetCountry('RAG').GetFlavorRank] non può sperare di resistere alla nostra potenza, e cerca invece un accordo pragmatico. Offrono di riconoscere la nostra supremazia e di versare un tributo annuale in cambio della nostra protezione e della libertà di commerciare. Mentre alcuni ritengono che sia un patto equo, che andrebbe a beneficio della nostra sfera di influenza, altri sostengono che uno stato così debole dovrebbe essere semplicemente conquistato."
 flavor_rag.1001.a: "Accettiamo il loro tributo."
 flavor_rag.1001.b: "Perché negoziare quando possiamo conquistare?"
