l_english:
 flavor_bav.1.title: "Finalmente Elettore!"
 flavor_bav.1.entry: "$flavor_bav.1.title$"
 flavor_bav.1.desc: "Gli sforzi e la lealtà del nostro [target_ruler.GetName] sono stati finalmente ricompensati da [hre_emperor.GetName], che ha riconosciuto la nostra importanza e ci ha concesso il rango di Elettore. Dovremmo celebrare questo punto di svolta nella storia [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] e organizzare un grande ballo."
 flavor_bav.1.a: "Non badiamo a spese."
 flavor_bav.1.b: "Non c'è tempo per i festeggiamenti."

 flavor_bav.2.title: "Una Nuova Legge per un Nuovo Paese"
 flavor_bav.2.entry: "$flavor_bav.2.title$"
 flavor_bav.2.desc: "Il [ROOT.GetCountry.GetLongName] è finalmente riunito dopo molti anni di divisione. La gioia che l'unità ha portato ai cittadini del nuovo paese ha creato l'opportunità per [ruler_scope.GetName] di cogliere il momento e cambiare le sue tradizioni più radicate. È giunto il momento di proclamare un cambiamento nella nostra legge di successione e garantire che la terra [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip] non venga mai più divisa."
 flavor_bav.2.a: "I vecchi privilegi devono essere revocati."
 flavor_bav.2.b: "Mettiamo fine alla tradizione."
 flavor_bav.2.c: "Dobbiamo rispettare la tradizione."

 flavor_bav.3.title: "Il [GetCountry('LBV').GetLongNameWithNoTooltip]"
 flavor_bav.3.entry: "$LBV$ passa sotto il Governo di Ludwig" #NEW
 flavor_bav.3.desc: "Il Duca della Bassa Baviera [target_cousin.GetName] è morto! Sebbene soffrisse di lebbra e la sua morte non giunga inaspettata, la nostra famiglia è ancora in lutto e deve discutere cosa accadrà a [GetCountry('LBV').GetName] dopo la sua scomparsa.\n\nA [target_ruler.GetName] è stato chiesto di fungere da figura guida per il giovane erede, e potremmo usare questa occasione per lavorare verso una riunificazione della Baviera, un obiettivo a lungo desiderato da [target_ruler.GetNameWithNoTooltip]."
 flavor_bav.3.a: "Allineiamolo strettamente a noi."
 flavor_bav.3.b: "Annettiamolo direttamente!"
 flavor_bav.3.c: "Non intromettiamoci negli affari altrui."

 flavor_bav.4.title: "I Nostri Rivali [GetCountry('BOH').Custom('IT_In')][GetCountry('BOH').GetNameWithNoTooltip]"
 flavor_bav.4.entry: "Relazioni tra Wittelsbach e Lussemburgo" #NEW
 flavor_bav.4.desc: "Gli ultimi decenni sono stati dominati dal conflitto tra le casate di [target_ruler.GetName] e [target_rival.GetName], con la casata di [target_ruler.GetDynasty.GetName] che ha negato a [GetCountry('BOH').GetName] influenza nel nord del [GetUniqueInternationalOrganization('hre').GetName], nominando la propria famiglia come [GetCountry('BRA').GetGovernment.GetRulerTitle] di [GetCountry('BRA').GetName]. I nostri rapporti più recenti sono stati piuttosto stabili, ma un nuovo scontro potrebbe scoppiare in qualsiasi momento. Forse è tempo di seppellire i rancori del passato e ricucire i rapporti [GetCountry('BOH').Custom('IT_Della')][GetCountry('BOH').GetNameWithNoTooltip] con noi."
 flavor_bav.4.a: "Cerchiamo di ricucire i nostri rapporti."
 flavor_bav.4.b: "Sono nostri nemici per un buon motivo!"

 flavor_bav.5.title: "La Minaccia del Sud"
 flavor_bav.5.entry: "$flavor_bav.5.title$"
 flavor_bav.5.desc: "La casata [target_rival.GetDynasty.GetName] non fa mistero delle proprie ambizioni di reclamare la corona imperiale del [GetUniqueInternationalOrganization('hre').GetName]. Al tempo della nostra stessa ascesa al trono, la nostra dinastia si scontrò ferocemente con i loro eserciti, ottenendo la vittoria solo con la loro disfatta durante la battaglia di [ShowLocationName('muhldorf')]. Con la calma degli ultimi anni, forse è giunto il momento di superare i conflitti passati e ricucire i nostri rapporti."
 flavor_bav.5.a: "Distenderemo i nostri rapporti con loro."
 flavor_bav.5.b: "La Dinastia [target_rival.GetDynasty.GetNameWithNoTooltip] deve essere contenuta!"
 flavor_bav.5.b.entry: "La dinastia deve essere contenuta!" #NEW

 flavor_bav.6.title: "L'Ascesa della [hre_ruler.GetDynasty.GetNameWithNoTooltip]"
 flavor_bav.6.entry: "Sostenere l'Imperatore Asburgico?" #NEW
 flavor_bav.6.desc: "Sebbene in passato fossimo i Leader incontestati del [GetUniqueInternationalOrganization('hre').GetName], una nuova casata è ascesa a una posizione dominante nel [GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]. La [hre_ruler.GetDynasty.GetName] ha preso il controllo della corona imperiale e non mostra alcuna intenzione di rinunciarvi a breve.\n\nDovremmo considerare la nostra posizione nei confronti del loro governo e se vogliamo sostenerne il mandato o meno."
 flavor_bav.6.a: "Sono degni del nostro sostegno!"
 bav_reconcile_habsburg: "Riconciliazione tra le nostre dinastie"
 flavor_bav.6.b: "Opponiamoci alla [hre_ruler.GetDynasty.GetNameWithNoTooltip] a ogni occasione!"
 flavor_bav.6.b.entry: "Opponiamoci alla dinastia a ogni occasione!" #NEW
 bav_against_habsburg: "Conflitti Dinastici"

 flavor_bav.7.title: "Otto Quesiti sul Potere del Papa"
 flavor_bav.7.entry: "$flavor_bav.7.title$"
 flavor_bav.7.desc: "Il famoso frate francescano [william_ockham_scope.GetName], scomunicato dal [GetCountry('PAP').GetGovernment.GetRulerTitle] e sotto la protezione di [hre_emperor.GetName], ha scritto un altro trattato di filosofia politica, gettando dubbi sull'autorità del [GetCountry('PAP').GetGovernment.GetRulerTitle]: #italic Otto Quesiti sul Potere del Papa#!.\n\nLa diffusione di queste idee potrebbe creare dissenso e ribellione contro le autorità religiose."
 flavor_bav.7.a: "Diffondiamo le idee di [william_ockham_scope.GetNameWithNoTooltip]."
 flavor_bav.7.a.entry: "Diffondiamo le idee di $name_william$ $Ockham$." #NEW
 flavor_bav.7.b: "Non possiamo permetterlo."

 flavor_bav.8.title: "Una Nuova Mappa per il [ROOT.GetCountry.GetLongNameWithNoTooltip]"
 flavor_bav.8.entry: "$flavor_bav.8.title$"
 flavor_bav.8.desc: "Siamo stati informati che il figlio del noto astronomo, matematico e cartografo Peter Apian, [philipp_apian_scope.GetName], è tornato dai suoi studi a [ShowLocationName('paris')] e attualmente insegna a [ShowLocationName('tubingen')].\n\nPotremmo assumerlo per disegnare una nuova e più dettagliata mappa dei nostri possedimenti, ma il suo rifiuto di rinunciare al [ShowReligionName('calvinist')] probabilmente farebbe infuriare parte [ROOT.GetCountry.Custom('IT_CLERGY_DEL_NOSTRO')][ROOT.GetCountry.Custom('IT_CLERGY_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]."
 flavor_bav.8.a: "Assumiamo l'uomo."
 flavor_bav.8.b: "Non assumeremo un [ShowReligionAdjectiveWithNoTooltip('calvinist')]."
 flavor_bav.8.historical_info: "A Philipp Apian fu ordinato di creare una mappa dettagliata del Ducato di Baviera nel 1554, un compito che completò nei sette anni successivi. Dopo la creazione della mappa originale, furono create copie più piccole, chiamate #italic Bairische Landtafeln#!, vendute personalmente da Apian a Ingolstadt. La sua opera fu superata solo nel XIX secolo, e venne usata a danno della Baviera durante le Guerre Napoleoniche, quando fu utilizzata dall'esercito francese per invadere la Baviera."

 flavor_bav.9.title: "La Vecchia Marienkapelle"
 flavor_bav.9.entry: "$flavor_bav.9.title$"
 flavor_bav.9.desc: "La vecchia Marienkapelle, situata nella parte nord-occidentale della città e costruita accanto alle antiche mura cittadine, ha servito per secoli come amata chiesa parrocchiale per la popolazione e come luogo di sepoltura per i Monacensi [ShowDynastyName('wittelsbach_dynasty')].\n\nCiò nonostante, un architetto $BAV_ADJ$ di nome [george_halsbach_scope.GetName] ha proposto un grandioso progetto per una nuova cattedrale in mattoni rossi, coronata da due imponenti torri visibili da ogni punto della città."
 flavor_bav.9.a: "Costruiamo questa meraviglia."
 flavor_bav.9.b: "No, non sostituiremo un monumento tanto caro."

 flavor_bav.10.title: "Il Santuario dell'Eresia"
 flavor_bav.10.entry: "$flavor_bav.10.title$"
 flavor_bav.10.desc: "Una voce malevola ha iniziato a diffondersi nelle corti dei molti sovrani [ShowReligionAdjective('catholic')]. La voce dice che la corte di [hre_emperor.GetName] sia un rifugio per eretici e miscredenti, dove le leggi di Dio vengono derise e gli insegnamenti della Chiesa ignorati.\n\nDobbiamo porre fine a questa malevola diceria e recuperare il nostro prestigio: potremmo espellere i frati scomunicati [william_ockham_scope.GetName] e [michael_cesena_scope.GetName]; un simile gesto di zelo religioso metterà senz'altro fine alla voce."
 flavor_bav.10.a: "No, quegli uomini sono sotto la mia protezione."
 flavor_bav.10.b: "Espelliamoli, mostriamo a tutti la nostra devozione."
 flavor_bav.10.historical_info: "Il regno dell'Imperatore del Sacro Romano Impero Ludovico IV 'il Bavaro' fu segnato dal suo conflitto con il Papato avignonese. Dopo la sua scomunica da parte di Papa Giovanni XXII nel 1324 e la conseguente agitazione ecclesiastica, la sua corte a Monaco, l'Alter Hof, divenne nota come un santuario per quei teologi che criticavano la Chiesa Cattolica e il Papa ed erano considerati eretici, come Guglielmo di Ockham o Michele da Cesena."

 flavor_bav.11.title: "[target_artist.GetNameWithNoTooltip] e la Storia [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_bav.11.entry: "La Storia della Baviera" #NEW
 flavor_bav.11.desc: "[target_artist.GetName] si è fatto un nome come tutore alla corte di [target_ruler.GetName], e durante questo periodo ha scritto una grammatica [ShowLanguageName('latin_language')] e altri manuali. Come favore per i suoi servizi, ha ora chiesto a [target_ruler.GetShortNameWithNoTooltip] di sponsorizzare il suo tentativo di scrivere una storia [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] per documentare le gesta dei nostri gloriosi predecessori."
 flavor_bav.11.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_bav.11.a.entry: "$common_string_brilliant$"
 flavor_bav.11.b: "Questo è uno spreco di denaro!"

 flavor_bav.20.title: "Il [ShowPolicyNameWithNoTooltip('bav_codex_bavarica')]"
 flavor_bav.20.entry: "$bav_codex_bavarica$"
 flavor_bav.20.desc: "Ispirato dalle tradizioni giuridiche delle regioni vicine, [target_ruler.GetName] ha proposto la creazione di un codice di leggi unificato, facendo eco ai precedenti sforzi di [previous_ruler.GetName] per rafforzare l'autorità [target_country.Custom('IT_ADJ_FS')]. Questa codificazione delle leggi [target_country.Custom('IT_ADJ_FP')] nel [ShowPolicyName('bav_codex_bavarica')] migliorerebbe la governance del [target_country.GetFlavorRank] [target_country.GetAdjective]. Procediamo con il compito monumentale di [ShowSocietyDirectionName('centralization')]?"
 flavor_bav.20.a: "Redigiamo il [ShowPolicyNameWithNoTooltip('bav_codex_bavarica')]!"
 flavor_bav.20.b: "Non è ancora il momento giusto per simili riforme."

 flavor_bav.23.title: "La Nascita dell'Accademia delle Scienze [target_country.Custom('IT_ADJ_FS')]"
 flavor_bav.23.entry: "La Nascita dell'Accademia Bavarese delle Scienze" #NEW
 flavor_bav.23.desc: "Con la fiorente scena culturale dell'$enlightenment$ in [ShowContinentName('europe')], i pensatori di [target_city.GetName] hanno chiesto a [target_ruler.GetName] la fondazione di un'[ShowBuildingTypeName('academy_of_sciences')], simile ad altre istituzioni accademiche in tutta [ShowContinentName('europe')]. Una simile istituzione potrebbe elevare il prestigio [target_country.GetAdjective], ma a caro prezzo. Dovremmo investire nel futuro della conoscenza?"
 flavor_bav.23.a: "Sosteniamo l'accademia: la scienza condurrà avanti [target_country.GetNameWithNoTooltip]."
 flavor_bav.23.a.entry: "Sosteniamo l'accademia: la scienza li condurrà avanti." #NEW
 flavor_bav.23.b: "Investiamo invece in progressi militari."

 flavor_bav.24.title: "Un Omicidio nell'Abbazia"
 flavor_bav.24.entry: "$flavor_bav.24.title$"
 flavor_bav.24.desc: "Il [ShowBuildingTypeName('scriptorium')] in un piccolo villaggio vicino a [ShowLocationName('garmisch')] è ben noto per i suoi grandi illustratori e pittori. Recentemente, un evento scandaloso ha scosso l'abbazia, quando un nobile minore è stato assassinato all'interno dei confini di questa rispettabile istituzione. Fortunatamente, [target_artist.GetName], che risiedeva nel villaggio per il suo capolavoro, è stato in grado di assistere nelle indagini. Un artista tanto talentuoso, unito alla mente acuta di un investigatore, sarebbe senz'altro una meravigliosa aggiunta al nostro paese." #NEW
 flavor_bav.24.a: "Mandiamo a chiamare [target_artist.GetNameWithNoTooltip] subito!"
 flavor_bav.24.a.entry: "Mandiamolo a chiamare subito!" #NEW
 flavor_bav.24.b: "Farà senz'altro fortuna da solo." #NEW

 flavor_bav.25.title: "Il Reinheitsgebot del [GetCurrentYear]"
 flavor_bav.25.entry: "Il Reinheitsgebot dell'Anno Corrente" #NEW
 flavor_bav.25.desc: "Nell'anno [GetCurrentYear], [target_ruler.GetName] [target_country.Custom('IT_Di')][target_country.GetName] ha decretato il Reinheitsgebot, una nuova legge che regola la produzione della [ShowGoodsName('beer')] in tutto il [target_country.GetFlavorRank]. Limitando gli ingredienti a orzo, luppolo e acqua, il [target_country.GetGovernment.GetRulerTitle] intende garantire la qualità della birra [target_country.Custom('IT_ADJ_FS')] e proteggere i suoi sudditi da additivi dannosi. Questa legge non solo garantisce una [ShowGoodsNameWithNoTooltip('beer')] di miglior gusto, ma stabilizza anche i prezzi e rafforza la reputazione delle birre [target_country.Custom('IT_ADJ_FP')] in tutto il [GetInternationalOrganization('hre').GetName]."
 flavor_bav.25.a: "La [ShowGoodsNameWithNoTooltip('beer')] [target_country.Custom('IT_ADJ_FS')] sarà la migliore!"
 flavor_bav.25.a.entry: "La loro [ShowGoodsNameWithNoTooltip('beer')] sarà la migliore!" #NEW
 flavor_bav.25.b: "Simili restrizioni potrebbero danneggiare la creatività dei birrai."

 flavor_bav.1302.title: "La Divisione [target_country.Custom('IT_ADJ_FS')] del [GetCurrentYear]"
 flavor_bav.1302.entry: "La Divisione Bavarese" #NEW
 flavor_bav.1302.desc: "Le rivalità interne alla famiglia [target_ruler.GetDynasty] hanno portato ancora una volta alla divisione del [target_country.GetFlavorRank] [target_country.GetAdjectiveWithNoTooltip] in più entità indipendenti. [rival_brother.GetName] minaccia una rivolta aperta se a [GetCountry('LBV').GetName] non viene concessa piena autonomia. La frammentazione che ne risulterebbe minaccia l'unità del [target_country.GetFlavorRank] e apre la porta a potenziali interferenze esterne. Dovremmo sostenere la divisione per placare [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')], oppure impegnarci a mantenere $BAV$ unita?"
 flavor_bav.1302.a: "Permettiamo la divisione di $BAV$."
 flavor_bav.1302.b: "Combattiamo la divisione di $BAV$."
 flavor_bav.1302.c: "Tentiamo di mantenere l'unità tramite concessioni."
 flavor_bav.1302.historical_info: "La frammentazione dei territori bavaresi fu un tema ricorrente durante il tardo medioevo e la prima età moderna. Le dispute dinastiche, in particolare all'interno della famiglia Wittelsbach, portarono spesso alla divisione del ducato in domini più piccoli e rivali tra loro. Queste divisioni indebolirono l'autorità centrale ed esposero la Baviera a influenze straniere e lotte interne. Il XIV e il XV secolo videro numerose partizioni di questo tipo, incluso il famigerato smembramento del 1392 che diede origine ai ducati separati di Baviera-Monaco, Baviera-Ingolstadt e Baviera-Landshut. I tentativi di preservare l'unità furono spesso minati dagli interessi della nobiltà e dalle tradizioni ereditarie, che favorivano la spartizione tra gli eredi rispetto alla primogenitura."

 flavor_bav.27.title: "La Fondazione dell'Università di [target_location.GetNameWithNoTooltip]"
 flavor_bav.27.entry: "La Fondazione dell'Università di Ingolstadt" #NEW
 flavor_bav.27.desc: "Nel [GetCurrentYear], a [target_ruler.GetName] viene chiesto di finanziare la fondazione dell'[ShowBuildingTypeName('university')] di [target_location.GetName], portando prestigio e sapere alla regione. L'[ShowBuildingTypeNameWithNoTooltip('university')] promette di favorire l'innovazione e la crescita intellettuale, ma sostenerla richiederà di distogliere risorse dalle ambizioni militari."
 flavor_bav.27.a: "Finanziamo l'[ShowBuildingTypeNameWithNoTooltip('university')] di [target_location.GetNameWithNoTooltip]!"
 flavor_bav.27.a.entry: "Finanziamo l'[ShowBuildingTypeNameWithNoTooltip('university')]!" #NEW
 flavor_bav.27.b: "Non possiamo permetterci il finanziamento."
 flavor_bav.27.historical_info: "L'Università di Ingolstadt fu fondata nel 1472 dal Duca Ludovico IX di Baviera-Landshut, rendendola una delle prime università del Sacro Romano Impero. Modellata sull'Università di Vienna, divenne un importante centro di studi cattolici e di erudizione umanistica. L'istituzione giocò un ruolo chiave nelle correnti intellettuali dell'epoca, ospitando figure del Rinascimento tedesco e diventando in seguito una roccaforte della Controriforma. La sua fondazione segnò un investimento significativo nell'istruzione e nella cultura in Baviera, spesso prioritario anche rispetto alle ambizioni militari o territoriali."

 flavor_bav.28.title: "Un'Elevazione a [ShowSpecialStatusNameWithNoTooltip('elector')]?"
 flavor_bav.28.entry: "Un'Elevazione a Elettore?" #NEW
 flavor_bav.28.desc: "[home_ruler.GetName] ha inviato emissari a [emperor_ruler.GetName] chiedendo l'elevazione al titolo di [ShowSpecialStatusName('elector')]. Questa richiesta si basa sul leale sostegno di [bavaria_country.GetNameWithNoTooltip] durante l'attuale [ShowSituationName('war_of_religions')]. Un simile riconoscimento aumenterebbe notevolmente l'influenza [bavaria_country.Custom('IT_ADJ_FS')] all'interno del [GetInternationalOrganization('hre').GetName]."
 flavor_bav.28.a: "Richiediamo l'Elevazione [bavaria_country.Custom('IT_Di')][bavaria_country.GetNameWithNoTooltip]."
 flavor_bav.28.a.entry: "Richiediamo la loro Elevazione." #NEW
 flavor_bav.28.b: "Concentriamoci sul consolidare la nostra forza interna."
 flavor_bav.28.historical_info: "Durante il tumultuoso periodo della Guerra dei Trent'Anni, la Baviera, sotto la guida del Duca Massimiliano I, giocò un ruolo fondamentale nel sostenere la causa cattolica. In riconoscimento di questa lealtà e del sostegno militare, l'Imperatore Ferdinando II convocò la Dieta di Ratisbona nel 1623, dove trasferì la dignità elettorale dal Conte Palatino protestante Federico V, che era stato posto al bando imperiale per il suo ruolo nella Rivolta di Boemia, al Duca Massimiliano I di Baviera. Questa elevazione non solo rafforzò l'influenza politica della Baviera all'interno del Sacro Romano Impero, ma consolidò anche il suo status di potenza centrale nella Lega Cattolica. Il trasferimento dell'elettorato rappresentò uno spostamento significativo negli equilibri di potere imperiali, segnando un punto culminante dell'autorità imperiale durante la guerra."

 flavor_bav.29.title: "Il [GetUniqueInternationalOrganization('hre').GetLeaderTitle] Valuta la Richiesta di [bavaria_country.GetNameWithNoTooltip]"
 flavor_bav.29.desc: "Gli emissari [bavaria_country.Custom('IT_Di')][bavaria_country.GetName] hanno presentato la loro causa a [emperor_ruler.GetName], citando la loro incondizionata lealtà durante la [ShowSituationName('war_of_religions')]. Questa decisione ha un grande peso, poiché elevare [bavaria_country.GetNameWithNoTooltip] significherebbe rimuovere l'attuale [ShowSpecialStatusName('elector')] di [elector_at_war.GetName]."
 flavor_bav.29.a: "Concediamo a [bavaria_country.GetNameWithNoTooltip] il titolo di [ShowSpecialStatusNameWithNoTooltip('elector')]."
 flavor_bav.29.a.entry: "Concediamo loro il titolo di [ShowSpecialStatusNameWithNoTooltip('elector')]." #NEW
 flavor_bav.29.b: "Rifiutiamo la loro richiesta e manteniamo lo status quo."
 flavor_bav.29.historical_info: "Nel bel mezzo della Guerra dei Trent'Anni, l'Imperatore Ferdinando II si trovò di fronte al complesso compito di ricompensare gli alleati leali, mantenendo al contempo il delicato equilibrio di potere all'interno del Sacro Romano Impero. Il Duca Massimiliano I di Baviera era stato fondamentale nel sostenere la causa cattolica, in particolare attraverso la sua guida nella Lega Cattolica e i suoi contributi militari, come la decisiva vittoria nella Battaglia della Montagna Bianca nel 1620. In riconoscimento di questa lealtà incondizionata e per rafforzare la posizione cattolica all'interno dell'Impero, Ferdinando II convocò la Dieta di Ratisbona nel 1623. Lì, trasferì ufficialmente la dignità elettorale dal Conte Palatino protestante Federico V — che era stato posto al bando imperiale per il suo ruolo nella Rivolta di Boemia — a Massimiliano I. Questa decisione strategica non solo ricompensò un alleato fedele, ma riconfigurò anche il panorama elettorale a favore della fazione cattolica, rafforzando l'autorità imperiale durante un periodo tumultuoso."

 flavor_bav.30.title: "[bavaria_country.GetNameWithNoTooltip] Elevata a [ShowSpecialStatusNameWithNoTooltip('elector')]"
 flavor_bav.30.desc: "[emperor_ruler.GetName] ha deciso di concedere a [home_ruler.GetName] e a [bavaria_country.GetName] il prestigioso titolo di [ShowSpecialStatusName('elector')]. Questo segna un momento cruciale per [bavaria_country.GetNameWithNoTooltip], che si eleva a una posizione di notevole influenza all'interno del [GetInternationalOrganization('hre').GetName]."
 flavor_bav.30.a: "Una nuova era inizia per [bavaria_country.GetNameWithNoTooltip]!"
 flavor_bav.30.a.entry: "Una nuova era inizia per loro!" #NEW

 flavor_bav.31.title: "Richiesta Rifiutata dal [GetUniqueInternationalOrganization('hre').GetLeaderTitle]"
 flavor_bav.31.entry: "Richiesta Rifiutata dal $hre$"
 flavor_bav.31.desc: "[emperor_ruler.GetName] ha scelto di rifiutare l'elevazione di [bavaria_country.GetName] allo status di [ShowSpecialStatusName('elector')]. Nonostante il leale sostegno di [bavaria_country.GetNameWithNoTooltip] durante la [ShowSituationName('war_of_religions')], l'equilibrio di potere all'interno del [GetInternationalOrganization('hre').GetName] rimarrà inalterato."
 flavor_bav.31.a: "Ci rafforzeremo indipendentemente da questa decisione."

 flavor_bav.32.title: "Perdiamo il Nostro Status di $elector$!"
 flavor_bav.32.entry: "$flavor_bav.32.title$"
 flavor_bav.32.desc: "La decisione di [emperor_ruler.GetName] ci ha privati del nostro titolo di [ShowSpecialStatusName('elector')]. Il Collegio Elettorale del [GetInternationalOrganization('hre').GetName] accoglie ora [bavaria_country.GetName] come suo più recente [ShowSpecialStatusName('elector')]. Questo segna un cambiamento significativo nell'equilibrio di potere."
 flavor_bav.32.a: "La nostra reputazione è stata infangata."

 flavor_bav.33.title: "Ricostruzione dell'[ShowBuildingTypeNameWithNoTooltip('herrenchiemsee_abbey')]"
 flavor_bav.33.entry: "Ricostruzione dell'Abbazia di Herrenchiemsee" #NEW
 flavor_bav.33.desc: "La ricostruzione barocca dell'[ShowBuildingTypeName('herrenchiemsee_abbey')] è iniziata per ordine di [target_ruler.GetName], trasformandola in uno splendido fulcro della vita culturale e religiosa [target_country.Custom('IT_Di')][target_country.GetName]. L'abbazia, fondata originariamente nel 765 d.C. secondo la tradizione (sebbene probabilmente presente già da almeno 100 anni prima), verrà rivitalizzata con una grande architettura e un'espressione artistica che incarnano l'epoca barocca."
 flavor_bav.33.a: "Investiamo pienamente nella ricostruzione dell'[ShowBuildingTypeNameWithNoTooltip('herrenchiemsee_abbey')]!"
 flavor_bav.33.b: "Concentriamo altrove le nostre risorse."

 flavor_bav.1000.title: "La Secondogenitura di [ShowLocationNameWithNoTooltip('cologne')]"
 flavor_bav.1000.entry: "La Secondogenitura di Colonia" #NEW
 flavor_bav.1000.desc: "L'Elettorato di [ShowLocationName('cologne')] è finalmente caduto sotto l'egida della nostra dinastia. Il loro sovrano di recente nomina, [kol_ruler.GetName], sarà senz'altro molto più favorevole agli obiettivi della nostra casata di quanto non lo fosse mai stato il suo predecessore. È senz'altro nel nostro interesse favorire un rapporto cordiale tra i nostri paesi."
 flavor_bav.1000.desc_rival: "Il nostro acerrimo rivale, il maledetto Elettorato di [ShowLocationName('cologne')], è finalmente caduto sotto il controllo della nostra dinastia. L'ascesa di [kol_ruler.GetName] sarà senz'altro un cambiamento drastico nelle politiche [GetCountry('KOL').Custom('IT_Di')][GetCountry('KOL').GetName], e chiaramente sarà molto più favorevole agli obiettivi della nostra casata di quanto non lo fosse mai stato il suo predecessore. È senz'altro nel nostro interesse porre rapidamente fine alla nostra vecchia rivalità e iniziare a favorire un rapporto migliore."
 flavor_bav.1000.a: "Mostriamo loro la nostra supremazia su di loro."
 flavor_bav.1000.b: "Mettiamo fine a questa rivalità e mostriamo loro la nostra grandezza."
 flavor_bav.1000.c: "Meglio di no."

 flavor_bav.1001.title: "I Nostri Parenti [GetCountry('BAV').Custom('IT_Di')][GetCountry('BAV').GetNameWithNoTooltip]"
 flavor_bav.1001.desc: "Il sovrano [GetCountry('BAV').Custom('IT_Di')][GetCountry('BAV').GetName], [bav_ruler.GetName], ci ha inviato un gentile omaggio per celebrare l'ascesa del suo parente, il nostro caro [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. È senz'altro nel nostro interesse favorire un rapporto cordiale tra i nostri paesi."
 flavor_bav.1001.desc_rival: "I nostri ex rivali [GetCountry('BAV').Custom('IT_Di')][GetCountry('BAV').GetName] hanno inviato un omaggio per celebrare l'ascesa del loro parente, il nostro caro [ROOT.GetCountry.GetGovernment.GetRuler.GetName]. È senz'altro nel nostro interesse porre rapidamente fine alla nostra vecchia rivalità e iniziare a favorire un rapporto migliore."
 flavor_bav.1001.desc_union: "Il [GetCountry('BAV').GetLongName] ha inviato un omaggio per celebrare l'ascesa del nostro caro [ROOT.GetCountry.GetGovernment.GetRuler.GetName] al loro trono. È senz'altro nel nostro interesse favorire un rapporto cordiale nella nostra unione di recente formazione."
 flavor_bav.1001.a: "Accettiamo l'omaggio."
 flavor_bav.1001.b: "Mettiamo fine alla nostra inutile rivalità."
 flavor_bav.1001.c: "Rifiutiamoli."

 flavor_bav.1002.title: "Rifiutati da [GetCountry('KOL').GetNameWithNoTooltip]"
 flavor_bav.1002.entry: "Rifiutati da $KOL$"
 flavor_bav.1002.desc: "Il nostro gentile omaggio e la nostra dimostrazione di sostegno a [GetCountry('KOL').GetName] sono stati rifiutati dal presuntuoso [kol_ruler.GetName]."
 flavor_bav.1002.a: "Che insolente!"

 flavor_bav.1100.title: "Una Fortezza a [ShowLocationNameWithNoTooltip('ingolstadt')]"
 flavor_bav.1100.entry: "Una Fortezza a Ingolstadt" #NEW
 flavor_bav.1100.desc: "Il nostro consigliere [mil_advisor.GetName], un esperto condottiero militare, suggerisce la fortificazione di [ShowLocationName('ingolstadt')]. L'insediamento si trova in una posizione strategicamente molto importante, capace di controllare il crocevia tra [ShowLocationName('regensburg')] e [ShowLocationName('ulm')] e tra [ShowLocationName('nuremberg')] e [ShowLocationName('augsburg')]."
 flavor_bav.1100.a: "Iniziamo la costruzione."
 flavor_bav.1100.b: "Non è necessario."

 flavor_bav.1101.title: "[reginar_solms_scope.GetNameWithNoTooltip] in [ShowLocationNameWithNoTooltip('ingolstadt')]"
 flavor_bav.1101.entry: "Reginar Solms a Ingolstadt" #NEW
 flavor_bav.1101.desc: "L'ingegnere militare [reginar_solms_scope.GetName] ha visitato la città fortificata di [ShowLocationName('ingolstadt')] e ha proposto al nostro sovrano [target_ruler.GetName] un progetto che illustra la modernizzazione, il potenziamento e l'espansione delle fortificazioni della città. A suo parere, per mantenere l'importanza strategica di [ShowLocationNameWithNoTooltip('ingolstadt')], la sua infrastruttura militare deve essere mantenuta aggiornata, altrimenti potrebbe perdere la capacità di estendere la sua influenza sul territorio."
 flavor_bav.1101.a: "Invitiamo [reginar_solms_scope.GetShortNameWithNoTooltip] a unirsi alla nostra corte e realizzare il suo progetto."
 flavor_bav.1101.a.entry: "Invitiamo $name_reginar$ a unirsi alla nostra corte e realizzare il suo progetto." #NEW
 flavor_bav.1101.b: "Non prestiamo attenzione agli allarmisti."
 flavor_bav.1101.reason: "Difese all'avanguardia."

 flavor_bav.1102.title: "[ShowLocationNameWithNoTooltip('ingolstadt')], la Città delle 100 Torri"
 flavor_bav.1102.entry: "Ingolstadt, la Città delle 100 Torri" #NEW
 flavor_bav.1102.desc: "La città fortificata di [ShowLocationName('ingolstadt')] si erge come un fiero baluardo del nostro potere nella regione; le sue solide mura estendono la nostra influenza sull'importante crocevia che custodisce.\n\nÈ ora tempo di espandere ulteriormente questo potere e potenziare le difese della città, affinché i nostri potenziali nemici conoscano l'inutilità di opporsi a noi."
 flavor_bav.1102.a: "Iniziamo la costruzione."
 flavor_bav.1102.b: "Non abbiamo bisogno di questi ampliamenti."

 flavor_bav.1200.title: "La Theatinerkirche"
 flavor_bav.1200.entry: "$flavor_bav.1200.title$"
 flavor_bav.1200.desc: "[consort_scope.GetName] esorta [ruler_scope.GetName] a impegnarsi a finanziare una magnifica chiesa per l'Ordine Teatino a [ShowLocationName('munich')]. Ha già scelto un architetto bolognese, [agostino_barelli_scope.GetName], per costruire la chiesa nello stile alto barocco [ShowCultureGroupName('italian_group')]. La nostra aristocrazia e [ROOT.GetCountry.Custom('IT_BURGHERS_IL_NOSTRO')][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')] ricc[ROOT.GetCountry.Custom('IT_BURGHERS_OAI')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono piuttosto affascinati dai progetti, che lei ha lasciato diventare ampiamente noti, essendo entrambi grandi ammiratori del raffinato stile [ShowCultureGroupNameWithNoTooltip('italian_group')]."
 flavor_bav.1200.a: "Molto bene, facciamo come desidera."
 flavor_bav.1200.b: "No, questo non è necessario."

 flavor_bav.1201.title: "Un Architetto Irascibile"
 flavor_bav.1201.desc: "[agostino_barelli_scope.GetName], il nuovo architetto che sta costruendo la Theatinerkirche a [ShowLocationName('munich')], si è rivelato estremamente difficile con cui lavorare. I suoi continui litigi con il capomastro, il padre teatino confessore di [consort_scope.GetName], hanno causato molti problemi nel cantiere, e una recente violenta sfuriata ha infine causato la sua caduta in disgrazia.\n\nEspellere l'esperto architetto lascerebbe la nuova chiesa nelle mani del suo apprendista e vice, [henry_zuccalli_scope.GetName], poiché è l'unico ad avere conoscenza sufficiente del progetto per portarlo avanti."
 flavor_bav.1201.a: "Espelliamolo e metteremo l'apprendista a capo."
 flavor_bav.1201.b: "Ignoriamo i litigi e manteniamo [agostino_barelli_scope.GetShortNameWithNoTooltip]."
 flavor_bav.1201.b.entry: "Ignoriamo i litigi e manteniamo $Barelli$." #NEW

 flavor_bav.1300.title: "L'Eredità [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_bav.1300.entry: "$flavor_bav.1300.title$"
 flavor_bav.1300.desc: "Con la morte di [old_ruler.GetName], ci troviamo ora ad affrontare l'eredità delle sue terre tra i suoi eredi maschi, secondo le leggi del [ShowCultureGroupName('german_group')]. La morte di [old_ruler.GetNameWithNoTooltip] arriva in un momento infausto per il nostro paese, con il progetto di [target_ruler.GetName] di riunificare $BAV$ che fallisce nelle sue fasi finali.\n\n[target_ruler.GetName] dovrà ora opporsi ai suoi fratelli per annullare i danni della separazione e proclamare la propria sovranità sulla Baviera."
 flavor_bav.1300.a: "Un compito difficile!"

 flavor_bav.1301.title: "La Riunificazione [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_bav.1301.entry: "$flavor_bav.1301.title$"
 flavor_bav.1301.desc: "[target_ruler.GetName] ha finalmente trionfato sulla propria famiglia e centralizzato potere sufficiente nelle proprie mani per proclamarsi unico sovrano di [ROOT.GetCountry.GetName]. I gravi errori di dividere le terre [ROOT.GetCountry.GetCulture.GetName] tra i figli di [target_ancestor.GetName] sono stati annullati, e il paese potrà ora procedere unito sotto la guida di [target_ruler.GetNameWithNoTooltip]"
 flavor_bav.1301.a: "[ROOT.GetCountry.Custom('common_string_positive')]"
 flavor_bav.1301.a.entry: "$common_string_brilliant$"

 flavor_bav.1400.title: "La Fondazione della Residenz di [target_location.GetNameWithNoTooltip]"
 flavor_bav.1400.entry: "La Fondazione della Residenz di Monaco" #NEW
 flavor_bav.1400.desc: "All'indomani dei disordini cittadini, [target_ruler.GetName] ha ordinato la costruzione di una nuova fortezza ai margini di [target_location.GetName], conosciuta in seguito come Neuveste della Residenz di [target_location.GetNameWithNoTooltip]. Nata come fortificazione, la Residenz di [target_location.GetNameWithNoTooltip] sarà usata principalmente come sede del potere e del [target_country.GetGovernment.GetCourtTitle] di [target_ruler.GetNameWithNoTooltip]."
 flavor_bav.1400.a: "Investiamo nella Residenz per dimostrare la nostra forza."
 flavor_bav.1400.b: "Ritardiamo per ora la costruzione."

 flavor_bav.1401.title: "Espansione [ShowInstitutionNameWithNoTooltip('renaissance')] della Residenz di [target_location.GetNameWithNoTooltip]"
 flavor_bav.1401.entry: "Espansione Rinascimentale della Residenz di Monaco" #NEW
 flavor_bav.1401.desc: "Con il [ShowInstitutionName('renaissance')] che si diffonde in tutta [ShowContinentName('europe')], [target_ruler.GetName] immagina di espandere la Residenz di [target_location.GetNameWithNoTooltip] in un grande palazzo che rifletta il crescente prestigio [target_country.Custom('IT_Di')][target_country.GetName]. Questa nuova ala servirebbe da galleria d'arte e cultura, consolidando il posto della famiglia [target_country.GetGovernment.Custom('IT_ADJ_FS')] tra i mecenati delle arti."
 flavor_bav.1401.a: "Espandiamo la Residenz per abbracciare lo spirito del [ShowInstitutionNameWithNoTooltip('renaissance')]."
 flavor_bav.1401.b: "Rinviamo l'espansione per risparmiare fondi."

 flavor_bav.1402.title: "Espansione Barocca della Residenz di [target_location.GetNameWithNoTooltip]"
 flavor_bav.1402.entry: "Espansione Barocca della Residenz di Monaco" #NEW
 flavor_bav.1402.desc: "Nell'epoca barocca di opulenza e magnificenza, [target_ruler.GetName] cerca di espandere ulteriormente la Residenz di [target_location.GetName], adornandola con decorazioni elaborate e nuove ali che riflettano la gloria di [target_country.GetName]. Ciò accrescerà lo splendore del [target_country.GetGovernment.GetCourtTitle] [target_country.GetAdjectiveWithNoTooltip] e impressionerà i dignitari in visita."
 flavor_bav.1402.a: "Iniziamo l'espansione barocca per accrescere il nostro prestigio."
 flavor_bav.1402.b: "Concentriamoci per ora su altri progetti."
