l_english:
 flavor_mll.1.title: "Rapporti Tesi con [target_country.Custom('IT_La')][target_country.GetNameWithNoTooltip]"
 flavor_mll.1.entry: "Rapporti Tesi con l'Aragona"
 flavor_mll.1.desc: "Sebbene [ROOT.GetCountry.GetLongName] e [target_country.GetLongName] abbiano mantenuto stretti legami fin dalla morte di [GetCharacter('ara_jacme_i_arago').GetName], con [ROOT.GetCountry.GetNameWithNoTooltip] che riconosce la sovranità [target_country.GetAdjectiveWithNoTooltip], la recente ascesa di [our_ruler.GetName] ha portato a rapporti tesi con [target_country.GetCapital.GetName]. Considerando il [our_ruler.GetHerHis] status di [ROOT.GetCountry.GetGovernment.GetRulerTitle] pari a quello di [ara_ruler.GetName], [our_ruler.GetNameWithNoTooltip] ha decretato che nessun [ROOT.GetCountry.GetGovernment.GetRulerTitle] possa essere suddito di alcun [target_country.GetGovernment.GetRulerTitle].\n\nSebbene [target_country.GetNameWithNoTooltip] non abbia intrapreso alcuna azione ostile verso [ROOT.GetCountry.GetNameWithNoTooltip], molti nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno espresso il timore che la sfrontatezza di [our_ruler.GetNameWithNoTooltip] possa servire da pretesto alla [target_country.GetGovernment.GetCourtTitle] di [target_country.GetNameWithNoTooltip] per impadronirsi in futuro di [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.1.a: "Dovremo procedere con cautela negli anni a venire."
 repair_or_damage_relations_with_aragon_tt: "Se [ROOT.GetCountry.GetName] riuscirà a raggiungere #G +190#! di relazioni con [target_country.GetName] nei prossimi anni, i rapporti con la [target_country.GetGovernment.GetCourtTitle] [target_country.Custom('IT_ADJ_FS')] potrebbero essere ricuciti. In alternativa, possiamo prepararci a liberarci per sempre da [target_country.GetNameWithNoTooltip]"

 flavor_mll.2.title: "Ripresa dal Conflitto [target_country_1.GetAdjectiveWithNoTooltip]"
 flavor_mll.2.entry: "Ripresa dai Conflitti Passati con Genova"
 flavor_mll.2.desc: "I recenti conflitti tra [target_country.GetName] e [target_country_1.GetName] hanno avuto un effetto paralizzante su [ROOT.GetCountry.GetLongName], con molte navi [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] requisite da [target_country.GetName] per le sue campagne in [ShowAreaName('sardinia_area')]. Sebbene il conflitto sia terminato, le rotte commerciali [ROOT.GetCountry.Custom('IT_ADJ_FP')] sono state pesantemente interrotte, e molti tra [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] chiedono a [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] di aiutare la ripresa. Altri nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] ritengono tuttavia che debba essere imposta una nuova tassa, poiché la perdita di così tante navi ha reso [ROOT.GetCountry.GetNameWithNoTooltip] più vulnerabile alle razzie provenienti dal [ShowRegionName('maghreb_region')]."
 flavor_mll.2.a: "Deve essere imposta una nuova tassa per rimpinguare le casse della [ROOT.GetCountry.GetFlavorRank]."
 flavor_mll.2.b: "Dirottiamo risorse [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] per aiutare la ripresa [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."

 flavor_mll.3.title: "Le Leggi Palatine di [our_ruler.GetNameWithNoTooltip]"
 flavor_mll.3.entry: "Le Leggi Palatine di Giacomo III"
 flavor_mll.3.desc: "Nella speranza di rafforzare ulteriormente la [our_ruler.GetHisHer] posizione di sovrano indipendente nei confronti di [target_country.GetName], [our_ruler.GetName] ha posto le basi per un nuovo [ShowLawNameWithNoTooltip('legal_code_law')], le [ShowPolicyName('mll_leges_palatinae')]. Con le [ShowPolicyNameWithNoTooltip('mll_leges_palatinae')], la posizione indipendente di [ROOT.GetCountry.GetNameWithNoTooltip] viene rafforzata, così come il potere di governo della [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective]."
 flavor_mll.3.a: "Promulgheremo questo nuovo [ShowLawNameWithNoTooltip('legal_code_law')] per rafforzare la nostra posizione!"
 flavor_mll.3.b: "Manteniamo l'impianto del nuovo [ShowLawNameWithNoTooltip('legal_code_law')], ma rinviamo per ora la promulgazione."
 flavor_mll.3.c: "Non abbiamo bisogno di modifiche al nostro attuale [ShowLawNameWithNoTooltip('legal_code_law')]."

 flavor_mll.4.title: "Manoscritto Miniato delle [ShowPolicyNameWithNoTooltip('mll_leges_palatinae')]"
 flavor_mll.4.entry: "Manoscritto Miniato delle Leges Palatinae"
 flavor_mll.4.desc: "Una volta completato l'impianto del nuovo [ShowLawName('legal_code_law')], [our_ruler.GetName] ha commissionato a vari artisti [ShowCultureGroupName('italian_group')] la creazione di un manoscritto miniato per accrescere ulteriormente il [our_ruler.GetHisHer] prestigio. Ora che l'opera è completata, alcuni della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito che [ShowWorkOfArtNameWithNoTooltip('illuminated_manuscrpt_of_the_legas_palatinae')] serva invece come leva diplomatica, poiché l'alta qualità del [ShowWorkOfArtTypeNameWithNoTooltip('treatise')] ne fa un dono generoso."
 flavor_mll.4.a: "Per ora conserviamolo come cimelio della [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 flavor_mll.4.b: "Sarebbe un ottimo dono per [fra_ruler.GetShortNameWithNoTooltip] [target_country_1.Custom('IT_Di')][target_country_1.GetNameWithNoTooltip]."
 flavor_mll.4.b.entry: "Sarebbe un ottimo dono per il sovrano di Francia."
 flavor_mll.4.c: "Inviamo il manoscritto a [target_country.GetCapital.GetNameWithNoTooltip] come simbolo del prestigio [ROOT.GetCountry.GetAdjectiveWithNoTooltip]."
 flavor_mll.4.c.entry: "Inviamo il manoscritto in Aragona come simbolo del prestigio maiorchino."

 flavor_mll.5.title: "Legami con [target_location.GetNameWithNoTooltip]"
 flavor_mll.5.entry: "Legami con Montpellier"
 flavor_mll.5.desc: "Dopo la morte di [GetCharacter('ara_jacme_i_arago').GetName], la divisione delle [GetCharacter('ara_jacme_i_arago').GetHisHer] terre ha fatto ottenere a [ROOT.GetCountry.GetName] diversi possedimenti continentali in [ShowContinentName('europe')]. Tra questi possedimenti, la [target_location.GetRank.GetName] di [target_location.GetName] si è rivelata un prezioso snodo per i sovrani di [ROOT.GetCountry.GetNameWithNoTooltip], insieme ai suoi legami con la [target_country_1.GetGovernment.GetCourtTitle] [target_country_1.Custom('IT_ADJ_FS')].\n\nCon il rapporto tra [target_country.GetName] e [ROOT.GetCountry.GetNameWithNoTooltip] piuttosto teso, alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno sollecitato [our_ruler.GetName] a richiedere il sostegno dei [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] [ShowCultureName('languedocien')] di [target_location.GetNameWithNoTooltip], sebbene altri abbiano suggerito di sfruttare l'importanza di [target_location.GetNameWithNoTooltip] per ingraziarsi la [target_country_1.GetGovernment.GetCourtTitle] [target_country_1.Custom('IT_Di')][target_country_1.GetNameWithNoTooltip]."
 flavor_mll.5.a: "Sfruttiamo i nostri legami con i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] di [target_location.GetNameWithNoTooltip] per ottenere sostegno."
 flavor_mll.5.a.entry: "Sfruttiamo i nostri legami con i nobili di Montpellier per ottenere sostegno."
 flavor_mll.5.b: "Concentriamoci invece sugli affari interni di [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.5.c: "Organizziamo uno scambio con [target_country_1.GetNameWithNoTooltip] per [target_location.GetNameWithNoTooltip]."
 flavor_mll.5.c.entry: "Organizziamo uno scambio con la Francia per Montpellier."
 mll_unlock_sale_of_montpellier_decision_tt: "Sblocca la [decision|e] $mll_exchange_of_montpellier.title$, offrendo la possibilità di ottenere leva diplomatica con [target_country_1.GetName]"

 flavor_mll.6.title: "Difesa delle [ShowAreaNameWithNoTooltip('balearics_area')]"
 flavor_mll.6.entry: "Difesa delle [ShowAreaNameWithNoTooltip('balearics_area')]"
 flavor_mll.6.desc: "Sebbene in passato i pattugliamenti [target_country.Custom('IT_ADJ_MP')] siano riusciti a bloccare le razzie [ShowCultureGroupName('maghrebi_group')] su [ShowAreaName('balearics_area')], negli ultimi anni le razzie sono diventate un impedimento più grave per [ROOT.GetCountry.GetLongName].\n\nCon i rapporti con [target_country.GetNameWithNoTooltip] piuttosto tesi, alcuni membri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno redatto piani per la costruzione di fortificazioni costiere con il duplice scopo di respingere i predoni [ShowCultureGroupNameWithNoTooltip('maghrebi_group')] e di rendere più difficile a [target_country.GetNameWithNoTooltip] l'avvio di una potenziale invasione [target_country.GetAdjectiveWithNoTooltip]."
 flavor_mll.6.a: "Forniamo i fondi necessari a rendere [ShowAreaNameWithNoTooltip('balearics_area')] impenetrabili."
 flavor_mll.6.b: "Non possiamo permetterci questo costoso impegno."
 mll_area_gains_naval_defensives_tt: "Tutte le [locations|e] di [ShowAreaName('balearics_area')] otterranno [ShowModifier('mll_expansion_of_coastal_fortifications')] per 60 anni"

 flavor_mll.7.title: "Raccogliere Sostegno all'Estero"
 flavor_mll.7.entry: "$flavor_mll.7.title$"
 flavor_mll.7.desc: "Con i rapporti tra [ROOT.GetCountry.GetName] e [target_country.GetLongName] più torbidi che mai, molti consiglieri della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno sollecitato [our_ruler.GetName] a rivolgersi ad alcuni dei rivali di un tempo di [target_country.GetNameWithNoTooltip] nella speranza di ottenere sostegno per conquistare la vera libertà da [target_country.GetCapital.GetName]."
 flavor_mll.7.a: "Cerchiamo il sostegno dei [target_country_2.Custom('IT_ADJ_MP')]."
 flavor_mll.7.a.entry: "Cerchiamo il sostegno dei Castigliani."
 flavor_mll.7.b: "Cerchiamo il sostegno di [target_country_3.GetLongNameWithNoTooltip]."
 flavor_mll.7.b.entry: "Cerchiamo il sostegno del Regno di Napoli"
 flavor_mll.7.c: "Rivolgiamoci ai nostri vecchi rivali di [target_country_4.GetNameWithNoTooltip]."
 flavor_mll.7.c.entry: "Rivolgiamoci ai nostri vecchi rivali di Genova."
 flavor_mll.7.d: "Dobbiamo invece fare affidamento su [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 mll_conditions_for_castile_support_tt: "Se [ROOT.GetCountry.GetName] riuscirà a raggiungere #G +150#! di relazioni con [target_country_2.GetName] nei prossimi anni, otterrà #G +50#! di Accettazione presso qualsiasi movimento per l'Indipendenza che potremmo formare"
 mll_conditions_for_naples_support_tt: "Se [ROOT.GetCountry.GetName] riuscirà a raggiungere #G +120#! di relazioni con [target_country_3.GetName] nei prossimi anni, otterrà #G +50#! di Accettazione presso qualsiasi movimento per l'Indipendenza che potremmo formare"
 mll_conditions_for_genoa_support_tt: "Se [ROOT.GetCountry.GetName] riuscirà a raggiungere #G +100#! di relazioni con [target_country_4.GetName] nei prossimi anni, otterrà #G +50#! di Accettazione presso qualsiasi movimento per l'Indipendenza che potremmo formare"
 MLL_PLEDGED_SUPPORT: "Sostegno Promesso"

 flavor_mll.8.title: "Rifiuto della Fedeltà"
 flavor_mll.8.entry: "Rifiuto della Fedeltà Aragonese"
 flavor_mll.8.desc: "Tutte le vie diplomatiche tra [ROOT.GetCountry.GetName] e [target_country.GetName] sono fallite, con i diplomatici [target_country.GetAdjectiveWithNoTooltip] non più interessati a trovare un compromesso con [our_ruler.GetName]. [target_country.GetLongNameWithNoTooltip] fabbricherà con ogni probabilità un complotto per giustificare l'annessione diretta di [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.8.a: "Abbiamo raggiunto il punto di rottura!"
 mll_ara_will_likely_pursue_subjugation_tt: "La [target_country.GetGovernment.GetCourtTitle] [target_country.Custom('IT_Di')][target_country.GetName] cercherà con ogni probabilità di annettere direttamente [ROOT.GetCountry.GetName] nel tentativo di portarla sotto la corona [target_country.GetAdjectiveWithNoTooltip]"

 flavor_mll.9.title: "Rapporti Ricuciti"
 flavor_mll.9.entry: "Rapporti Ricuciti con l'Aragona"
 flavor_mll.9.desc: "Ciò che era un tempo un rapporto destinato al disastro è stato in gran parte ricucito grazie a negoziati accurati tra diplomatici [target_country.Custom('IT_ADJ_MP')] e [ROOT.GetCountry.Custom('IT_ADJ_MP')]. Sebbene [target_country.GetNameWithNoTooltip] abbia evitato di riconoscere le nostre pretese di governo indipendente, gli obblighi finanziari precedentemente dovuti a [target_country.GetNameWithNoTooltip] sono stati in gran parte rescissi. Mentre alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] vedono ciò come una vittoria per [our_ruler.GetNameWithNoTooltip], alcuni stretti alleati di [ROOT.GetCountry.GetGovernment.GetRulerTitle] hanno chiesto che [our_ruler.GetHeShe] persegua vere vie di indipendenza da [target_country.GetNameWithNoTooltip]."
 flavor_mll.9.a: "Per ora una crisi è stata scongiurata."
 mll_ara_will_not_pursue_hostile_action_tt: "[target_country.GetName] non perseguirà più mezzi aggressivi per impadronirsi di [ROOT.GetCountry.GetName]. Tuttavia, [ROOT.GetCountry.GetNameWithNoTooltip] potrà comunque perseguire liberamente i mezzi per ottenere la propria indipendenza"

 flavor_mll.10.title: "Elevazione a Viceregno"
 flavor_mll.10.entry: "Viceregno [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_mll.10.desc: "Con i rapporti tra [target_country.GetName] e [ROOT.GetCountry.GetName] in gran parte ripristinati ai livelli del passato, [target_country.GetLongNameWithNoTooltip] ha mostrato un rinnovato interesse per [ShowAreaName('balearics_area')]. Con gran parte dell'economia della regione ancora fiaccata dalle passate razzie [ShowCultureGroupName('maghrebi_group')] e dai precedenti conflitti con [target_country_1.GetName], la [ROOT.GetCountry.GetGovernment.GetCourtTitle] [target_country.Custom('IT_ADJ_FS')] ha proposto di concedere a [ROOT.GetCountry.GetLongNameWithNoTooltip] lo status di viceregno, ottenendo così un maggiore sostegno da [target_country.Custom('IT_CROWN_DAL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')]."
 flavor_mll.10.a: "Usiamo la nuova posizione di viceregno per rafforzare [ROOT.GetCountry.GetNameWithNoTooltip]."
 flavor_mll.10.b: "Adoperiamoci per proteggere gli interessi [target_country.GetAdjectiveWithNoTooltip] e [ROOT.GetCountry.GetAdjectiveWithNoTooltip] nel [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]."
 flavor_mll.10.b.entry: "Adoperiamoci per proteggere gli interessi aragonesi e maiorchini nel Mar Mediterraneo."
 flavor_mll.10.c: "Rifiutiamo l'offerta di [target_country.Custom('IT_Di')][target_country.GetNameWithNoTooltip] di diventare un viceregno."
 flavor_mll.10.c.entry: "Rifiutiamo l'offerta dell'Aragona di diventare un viceregno."

 flavor_mll.11.title: "Il Flagello della Pirateria [source_of_piracy.GetNameWithNoTooltip]"
 flavor_mll.11.entry: "Il Flagello della Pirateria [ShowCultureGroupNameWithNoTooltip('maghrebi_group')]"
 flavor_mll.11.desc: "Sebbene [ROOT.GetCountry.GetLongName] abbia subito numerose razzie da parte dei pirati del [ShowRegionName('maghreb_region')], negli ultimi anni quelle provenienti da [source_of_piracy.GetName] si sono rivelate le più costose per la [ROOT.GetCountry.GetGovernment.GetCourtTitle]. In mezzo alla crescente rabbia di [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], molti hanno chiesto a [our_ruler.GetName] di invadere [source_of_piracy.GetNameWithNoTooltip] ed eliminare per sempre la minaccia dei pirati."
 flavor_mll.11.a: "Bisogna occuparsi dei pirati di [source_of_piracy.GetNameWithNoTooltip]."
 flavor_mll.11.a.entry: "Bisogna occuparsi dei pirati."
 flavor_mll.11.b: "Solo impadronendosi direttamente dei possedimenti [source_of_piracy.GetAdjectiveWithNoTooltip] saranno prontamente soppressi."
 flavor_mll.11.b.entry: "Solo impadronendosi direttamente dei loro possedimenti saranno prontamente soppressi."

 flavor_mll.12.title: "Le Mura di Alcúdia"
 flavor_mll.12.entry: "$flavor_mll.12.title$"
 flavor_mll.12.desc: "Situata alla periferia di [target_location.GetName], Alcúdia è stata in prima linea contro le razzie provenienti dal [ShowRegionName('maghreb_region')] nell'ultimo secolo. A causa della vulnerabilità della zona, [GetCharacter('mll_jacme_ii_mallorca').GetName] ha precedentemente commissionato la costruzione di nuove mura per proteggere l'insediamento da future razzie. Sebbene le mura non siano ancora state completate, la struttura esistente si è già rivelata assai efficace, e alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] ritengono che [ROOT.GetCountry.Custom('IT_CROWN_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('crown_estate')] debba intraprendere un nuovo progetto, con un disegno simile, per rafforzare la stessa [target_location.GetRank.GetName] principale di [target_location.GetNameWithNoTooltip]."
 flavor_mll.12.a: "Finanziamo l'espansione di nuove fortificazioni che racchiudano l'intera [target_location.GetNameWithNoTooltip]."
 flavor_mll.12.a.entry: "Finanziamo l'espansione di nuove fortificazioni che racchiudano l'intera Manacor."
 flavor_mll.12.b: "Contribuiamo con fondi al completamento delle mura di Alcúdia."
 flavor_mll.12.c: "Annulliamo ogni ulteriore progetto di costruzione ad Alcúdia."

 flavor_mll.13.title: "Libertà da [target_country.Custom('IT_Dalla')][target_country.GetNameWithNoTooltip]"
 flavor_mll.13.entry: "Indipendenza Riaffermata"
 flavor_mll.13.desc: "Attraverso le lotte di [our_ruler.GetName] e della [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective], [ROOT.GetCountry.GetNameWithNoTooltip] ha finalmente ottenuto la vera indipendenza da [target_country.GetLongName]. Con [target_country.GetNameWithNoTooltip] costretta a riconoscere la separazione [ROOT.GetCountry.GetAdjectiveWithNoTooltip], la [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective] può ora guardare al [ShowScriptedGeographyName('mediterranean_sea_geography')] senza essere vincolata ai capricci di [target_country.GetCapital.GetName]."
 flavor_mll.13.a: "[ROOT.GetCountry.GetNameWithNoTooltip] traccerà ora il proprio futuro."

 flavor_mll.14.title: "L'[ShowBuildingTypeNameWithNoTooltip('university')] di [target_location.GetNameWithNoTooltip] Sostiene il Governo di [our_ruler.GetNameWithNoTooltip]"
 flavor_mll.14.entry: "Gli Studiosi di Montpellier Sostengono il Nostro Governo"
 flavor_mll.14.desc: "Sebbene [target_location.GetName] sia rimasta un possedimento continentale di [ROOT.GetCountry.Custom('IT_CROWN_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('crown_estate')] [ROOT.GetCountry.GetAdjectiveWithNoTooltip], gli studiosi dell'[ShowBuildingTypeName('university')] di [target_location.GetNameWithNoTooltip] si sono dimostrati strenui sostenitori di [our_ruler.GetNameWithNoTooltip]. Dall'emanazione del nuovo [ShowLawNameWithNoTooltip('legal_code_law')] delle [ShowPolicyName('mll_leges_palatinae')] al rafforzamento della [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetGovernment.GetAdjective], gli studiosi di [target_location.GetNameWithNoTooltip] hanno fornito una potente leva politica al governo di [our_ruler.GetName]."
 flavor_mll.14.a: "Accogliamo il loro sostegno!"
 flavor_mll.14.b: "Usiamo i loro elogi per rafforzare ulteriormente la posizione politica di [our_ruler.GetShortNameWithNoTooltip]."
 flavor_mll.14.b.entry: "Usiamo i loro elogi per rafforzare ulteriormente la posizione politica del nostro sovrano."

 flavor_mll.15.title: "Ricostruzione dell'Influenza Commerciale [ROOT.GetCountry.GetAdjectiveWithNoTooltip]"
 flavor_mll.15.entry: "Ricostruzione dell'Influenza Commerciale Maiorchina"
 flavor_mll.15.desc: "Con [ROOT.GetCountry.GetLongName] non più vincolata ai capricci di [target_country.GetName], molti dei nostri mercanti sono ansiosi di condurre affari indipendenti nella speranza di ripristinare l'influenza commerciale che [ROOT.GetCountry.GetName] deteneva un tempo sul [ShowScriptedGeographyName('mediterranean_sea_geography')]. Sebbene il declino dell'influenza [ROOT.GetCountry.GetAdjectiveWithNoTooltip] sia stato in gran parte determinato dai passati conflitti tra [target_country_1.GetName] e [target_country.GetNameWithNoTooltip], la ritrovata indipendenza della [ROOT.GetCountry.GetFlavorRank] [ROOT.GetCountry.Custom('IT_ADJ_FS')] spingerà probabilmente i mercanti di tutto il [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')] a riconsiderare la nostra presenza nella regione.\n\nPer incoraggiare il ristabilimento della nostra presenza, alcuni nella [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno suggerito di offrire privilegi aggiuntivi a [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')], oltre a revocare alcune precedenti restrizioni imposte durante il dominio [target_country.GetAdjectiveWithNoTooltip]. Tuttavia, alcuni temono che rafforzare [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] possa portare [ROOT.GetCountry.GetNameWithNoTooltip] ad avvicinarsi a una [ShowGovernmentTypeName('republic')] come quelle di [ShowRegionName('italy_region')]."
 flavor_mll.15.a: "Offriamo ampi privilegi a [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] per la loro assistenza."
 flavor_mll.15.b: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] si farà carico da sola di questa impresa."
 flavor_mll.15.c: "Dovremmo concentrarci maggiormente sui nostri affari interni."

 # Decisions
 mll_a_hub_of_mediterranean_trade.title: "Uno Snodo del Commercio [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]"
 mll_a_hub_of_mediterranean_trade.desc: "Sebbene molte delle antiche rotte commerciali [GetCountry('MLL').Custom('IT_ADJ_FP')] siano state vittime dei passati conflitti [GetCountry('ARA').Custom('IT_ADJ_MP')] e [GetCountry('GEN').Custom('IT_ADJ_MP')], la ritrovata indipendenza di [GetCountry('MLL').GetLongNameWithNoTooltip] crea l'opportunità di ripristinare queste rotte un tempo redditizie. Inoltre, la posizione privilegiata di [ShowAreaNameWithNoTooltip('balearics_area')] ci offre la possibilità di essere un concorrente di primo piano nel commercio [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]."
 mll_a_hub_of_mediterranean_trade.a: "[GetCountry('MLL').GetNameWithNoTooltip] è ora pronta a dominare il [ShowScriptedGeographyNameWithNoTooltip('mediterranean_sea_geography')]."

 mll_exchange_of_montpellier.title: "Scambio di [ShowLocationNameWithNoTooltip('montpellier')]"
 mll_exchange_of_montpellier.desc: "Lasciata in eredità a [GetCharacter('mll_jacme_ii_mallorca').GetName] nel testamento di [GetCharacter('ara_jacme_i_arago').GetName], [ShowLocationNameWithNoTooltip('montpellier')] è stata da allora un possedimento continentale cruciale per [GetCountry('MLL').GetLongName]. Tuttavia, con le crescenti ostilità tra [GetCountry('ARA').GetName] e [GetCountry('MLL').GetNameWithNoTooltip], [ShowLocationNameWithNoTooltip('montpellier')] potrebbe offrire una forte leva nei confronti di [GetCountry('FRA').GetLongName]."
 mll_exchange_of_montpellier.a: "Offriamo di vendere [ShowLocationNameWithNoTooltip('montpellier')] [GetCountry('FRA').Custom('IT_Alla')][GetCountry('FRA').GetNameWithNoTooltip]."
