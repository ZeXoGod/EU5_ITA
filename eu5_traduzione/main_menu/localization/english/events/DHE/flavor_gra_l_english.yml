l_english:
 flavor_gra.1.title: "Profughi Mori"
 flavor_gra.1.desc: "Nel nome di Allah, il più Clemente, il più Misericordioso. Granada è caduta nelle mani degli infedeli! L'ultimo gioiello di al-'Andalus, un faro di sapienza, è ora in mani castigliane. Mentre il mondo islamico barcolla per questa perdita, i profughi mori affluiscono nelle città musulmane e nelle corti del Nord Africa e del Medio Oriente, portando con sé la loro conoscenza e le opere di studiosi eccezionali come Abu al-Walid ibn Rushd, Abu al-Qasim al-Zahrawi e Abu Bakr ibn Tufail. Invitare questi profughi [ROOT.GetCountry.Custom('IT_Alla')][ROOT.GetCountry.GetName] potrebbe fornire un enorme impulso ai nostri sforzi nei campi della scienza e della cultura."
 flavor_gra.1.a: "Certamente, invitateli [ROOT.GetCountry.Custom('IT_In')][ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_gra.1.a.entry: "By all means, invite them to us!"
 flavor_gra.1.b: "No, non ne abbiamo bisogno."
 flavor_gra.2.title: "L'Emirato di Sicilia"
 flavor_gra.2.entry: "$flavor_gra.2.title$"
 flavor_gra.2.desc: "In tempi remoti, l'Emirato di Sicilia fu un valoroso bastione della nostra fede; resistette finché i crociati non conquistarono l'isola nel 1087.\n\nOra che siamo in possesso di questa terra ambita, non ne perderemo di nuovo il controllo!"
 flavor_gra.2.a: "L'autorità assoluta richiede un dominio assoluto."
 STATIC_MODIFIER_NAME_sicily_in_safe_hands: "Investimenti amministrativi"
 STATIC_MODIFIER_NAME_DESC_sicily_in_safe_hands: "La Sicilia ci serve meglio sotto il nostro controllo diretto — come tale, siamo in grado di investire più risorse per indurre l'isola alla prosperità."

 flavor_gra.3.title: "Aiuti [GetCountry('TUR').Custom('IT_Dalla')][GetCountry('TUR').GetNameWithNoTooltip]"
 flavor_gra.3.entry: "Plea for Ottoman support"
 flavor_gra.3.desc: "Poiché siamo ora impegnati in una guerra contro [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetName] che potrebbe rivelarsi senza speranza, dobbiamo inviare disperati appelli ai fedeli oltre il mare per chiedere aiuto. I [GetCountry('TUR').GetGovernment.GetRuler.GetDynasty.GetName] potrebbero venire in nostro aiuto, se solo riuscissimo a sopportare l'indegnità di chiederglielo!"
 flavor_gra.3.a: "Loro sono la nostra unica speranza!"
 flavor_gra.3.tt: "[GetCountry('TUR').Custom('IT_La')][GetCountry('TUR').GetNameWithNoTooltip|U] potrebbe difenderci contro [GetCountry('CAS').Custom('IT_La')][GetCountry('CAS').GetNameWithNoTooltip]"
 flavor_gra.3.b: "Dobbiamo restare soli."
 flavor_gra.3.historical_info: "I sovrani Nasridi di Granada inviarono inviati sia agli ottomani che ai $mamluk$ per cercare aiuto contro la Castiglia. Gli ottomani avevano incrementato la loro presenza nel Mediterraneo occidentale e Granada pianificò entusiasticamente lo sbarco di 200.000 truppe turche a Valencia per sostenerli."

 flavor_gra.4.title: "Una risposta scoraggiante"
 flavor_gra.4.entry: "$flavor_gra.4.title$"
 flavor_gra.4.desc: "Abbiamo ricevuto notizie [GetCountry('TUR').Custom('TUR_IT_Dalla')][GetCountry('TUR').GetName] che essi #italic non#! verranno in nostro aiuto. Per quanto lo desiderino, dichiarano di avere altre preoccupazioni urgenti, ma nella loro lettera hanno lodato eloquentemente le antiche glorie di al-'Andalus — qualunque cosa possa valere ora."
 flavor_gra.4.a: "Dobbiamo continuare a combattere!"
 flavor_gra.4.historical_info: "I sovrani di Granada avevano sperato disperatamente nel sostegno Ottomano e dei $mamluks$. Tuttavia, gli Ottomani e i $mamluks$ rimasero presto invischiati in una guerra tra loro e non furono in grado di fornire molto aiuto diretto. I Turchi inviarono una flotta al comando di Kemal Reis che fece incursioni nei possedimenti Castigliani nel Mediterraneo Occidentale, e quella flotta avrebbe poi aiutato a trasportare molti profughi oltre il mare."
 ibn_khaldun_patronage: "Un uomo di straordinario intelletto e reputazione è arrivato alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]. [target_character.GetName], il celebre storico e filosofo, cerca patrocinio per continuare i suoi studi e i suoi scritti. Noto per le sue intuizioni sul governo, l'economia e l'ascesa e la caduta degli imperi, la sua presenza potrebbe elevare il prestigio della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle] e fornirci una consulenza inestimabile. Gli concederemo la posizione che desidera?"
 flavor_gra.5.title: "[target_character.GetNameWithNoTooltip] chiede patrocinio"
 flavor_gra.5.entry: "Ibn Khaldun Asks for Patronage"
 flavor_gra.5.desc: "$ibn_khaldun_patronage$"
 flavor_gra.5.a: "Molto bene."
 flavor_gra.5.b: "Non ci curiamo di tali spese frivole!"

 flavor_gra.6.title: "Perla dello Stretto"
 flavor_gra.6.entry: "$flavor_gra.6.title$"
 flavor_gra.6.desc: "Giunge un dispaccio dal #italic wālī#! di [target_location.GetName]. Le mura reggono, il porto è animato, e la rimessa che il nostro tesoro ha ricevuto questo mese è stato il più grande pagamento singolo dell'anno proveniente da qualunque angolo [ROOT.GetCountry.Custom('IT_DEL_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank]. Dall'Alcazaba e dal castello di Gibralfaro sopra di essa, la guardia può scorgere chiaramente l'altra sponda dello stretto in ogni mattina serena, il che è quanto basta al [ROOT.GetCountry.GetGovernment.GetCourtTitle] per sapere.\n\n[ROOT.GetCountry.GetCapital.GetName] ci dà il nostro trono. [target_location.GetNameWithNoTooltip] ci dà quasi tutto il resto. Le sue banchine gestiscono la maggior parte delle nostre entrate doganali. I fattori commerciali [GetCountry('GEN').GetAdjective] vi svernano come consuetudine, e il vino dolce fortificato pigiato nel suo entroterra si vende fino a [GetCountry('FLA').GetName]. Non vi è altra città in nostro possesso la cui perdita potremmo permetterci.\n\nEd è proprio per questo che altri vi hanno interesse. [GetCountry('CAS').GetName] osserva il porto da due generazioni. Lo stesso vale per alcuni dei nostri stessi cugini: più di un uomo che in seguito indossò la nostra corona alzò il suo primo stendardo da quelle mura, e lo stesso fecero alcuni dei ribelli che egli poi represse."
 flavor_gra.6.a: "Difenderemo Mālaqa come difendiamo la corona stessa."
 flavor_gra.6.historical_info: "Mālaqa fu la seconda città dell'Emirato di Granada e uno dei porti mediterranei più importanti del mondo islamico medievale. Dopo l'assorbimento nasride dell'ultima taifa di epoca hammudide nel 1239, la città fu posta sotto un #italic wālī#! nominato direttamente dal sultano. Il primo fu Ismaʿīl, fratello di Muhammad I, e la carica rimase un appannaggio quasi permanente degli stretti parenti reali.\n\nLe sue difese erano incentrate sull'Alcazaba, un palazzo-fortezza collinare che dominava il porto, e sul più alto castello di Gibralfaro, ad esso collegato da una coracha, un muro di collegamento coperto. Da quelle alture la guardia poteva avvistare le navi che doppiavano lo Stretto di Gibilterra giorni prima che raggiungessero il porto. Più in basso, i #italic funduq#! ospitavano mercanti genovesi, catalani e magrebini, e le entrate doganali di Mālaqa costituivano la singola fonte di reddito più importante per il tesoro nasride.\n\nLe sue esportazioni raggiungevano Fiandre ed Egitto. Seta andalusa, ceramiche lustro, i fichi secchi e l'uva passa dell'Axarquía, e il vino dolce fortificato che avrebbe dato alla città la sua duratura fama nei mercati europei, partivano tutti dalle sue banchine. I cantieri navali sul Guadalmedina rifornivano le galee nasridi che pattugliavano lo stretto insieme ai loro alleati marinidi.\n\nIl governatorato di Mālaqa comportava sia prestigio che pericolo. La carica era un trampolino di lancio verso il trono, e una base ricorrente di rivolta ogniqualvolta la dinastia si frantumava. Muhammad VI, il cosiddetto Sultano Rosso, alzò i suoi vessilli dalla città nel 1359, e la caduta finale di Mālaqa nel 1487 ai Re Cattolici pose fine al dominio andaluso sulla penisola mezzo decennio prima della stessa Granada."
 
 flavor_gra.9.entry: "$flavor_gra.9.title$"
 flavor_gra.9.title: "Gli Ebrei Sefarditi"
 flavor_gra.9.desc: "[ShowRegionName('iberia_region')] è stata per lungo tempo un importante centro per i seguaci del [ShowReligionName('judaism')], ospitando le loro comunità all'interno delle sue prospere città. Molti di loro hanno deciso di trasformare il [target_location.GetRank.GetName] di [target_location.GetName] in un rifugio, dove possono vivere le proprie vite senza essere perseguitati o discriminati.\n\nIl [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha notato questo sviluppo. Alcuni sostengono questo loro nuovo rifugio, credendo nell'uguaglianza di tutte le creature di [ROOT.GetCountry.GetReligion.GetGodName], mentre altri, più estremisti riguardo alla propria fede, lo considerano una macchia su tutto ciò che è sacro [ROOT.GetCountry.Custom('IT_NEL_RANGO')][ROOT.GetCountry.GetFlavorRank], e desiderano eliminarlo!"
 flavor_gra.9.a: "Proteggeremo i diritti del popolo [ShowReligionAdjectiveWithNoTooltip('judaism')]."
 flavor_gra.9.b: "[ROOT.GetCountry.GetReligion.GetGodName] non permetterebbe mai a questi infedeli di vivere in pace!"
 gra_jewish_people_in_target_location_become_unhappy: "Ogni [pop|e] [ShowReligionAdjective('judaism')] a [target_location.GetName] perderà [ShowNamedValue('pop_satisfaction_extreme_penalty')|+=2%]"
 
 flavor_gra.10.entry: "Assassinio del nostro Sovrano"
 flavor_gra.10.title: "Assassinio di [target_character.GetNameWithNoTooltip]"
 flavor_gra.10.desc: "La tragedia ha colpito [ROOT.GetCountry.GetName]!\n\nDopo aver pregato a [target_location.GetName], sembra che un folle intenzionato a uccidere abbia attaccato [target_character.GetName], infliggendo a [target_character.GetSheHe] gravi ferite. Nemmeno i migliori medici sono riusciti a curare le numerose ferite subite da [target_character.GetSheHe], e poche ore dopo [target_character.GetSheHe] è stato dichiarato morto.\n\nSebbene ciò abbia rattristato il [ROOT.GetCountry.GetGovernment.GetCourtTitle], c'è chi è fermamente convinto che si sia trattato di un incidente architettato. Sostengono che alcuni oppositori del [target_character.GetHerHis] governo abbiano deliberatamente distratto le [target_character.GetHerHis] guardie, offrendo all'assassino l'occasione che attendeva. Ma, ahimè, nessuno conosce la verità, ed è meglio chiudere la bara."
 flavor_gra.10.a: "Cosa accadrà ora a [ROOT.GetCountry.GetNameWithNoTooltip]?"
 leader_is_scarred: "#Y [target_character.GetName] sopravvive, ma porta le cicatrici#!"
 leader_dies: "#Y [target_character.GetName] non sopravvive#!"
 
 flavor_gra.11.entry: "$flavor_gra.11.title$"
 flavor_gra.11.title: "[ShowGoodsNameWithNoTooltip('silk')] di [ShowLocationNameWithNoTooltip('granada')]"
 flavor_gra.11.desc: "Il [ShowGoodsName('silk')] che [ROOT.GetCountry.GetName] produce è forse il più rinomato in tutto [ShowContinentName('europe')]. Mercanti da [ShowLocationName('genoa')], [ShowLocationName('venice')] e persino [ShowLocationName('prague')] desiderano acquistare questo bene di lusso per soddisfare la domanda dei loro ricchi e privilegiati [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], e per noi si tratta di un accordo molto redditizio.\n\nPiuttosto che cercare solo un guadagno monetario dall'esportazione del [ShowGoodsNameWithNoTooltip('silk')], i nostri ricchi [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] desiderano che cerchiamo di diffonderlo, rendendolo qualcosa che il mondo intero desidera acquistare e aumentando il nostro prestigio attraverso il monopolio del suo commercio."
 flavor_gra.11.a: "Il [ShowGoodsNameWithNoTooltip('silk')] di [ShowLocationNameWithNoTooltip('granada')] sarà conosciuto ovunque!"
 unlock_expand_iberian_silk_decision: "Sbloccheremo la [decision|e] $gra_expand_seda_de_granada.title$, che richiederà la conquista di [ShowLocationName('murcia')] per essere attuata"

 flavor_gra.12.entry: "$flavor_gra.12.title$"
 flavor_gra.12.title: "Un'Impresa Commerciale"
 flavor_gra.12.desc: "Il nostro [ShowGoodsName('silk')] è il più rinomato in tutto [ShowContinentName('europe')]. I [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] di tutto [ROOT.GetCountry.GetName] cercano di vendere questo bene non solo per ottenere un profitto, ma anche per mostrare al mondo la sua qualità ineguagliabile. Pur non potendo riuscirci da soli, ci hanno chiesto di creare rotte commerciali per garantire che lo scambio continui. Ciò ci aiuterebbe anche a mantenere la nostra reputazione e il nostro prestigio per quanto riguarda il commercio del [ShowGoodsNameWithNoTooltip('silk')]."
 flavor_gra.12.a: "Cerchiamo di espandere i nostri commerci per via diplomatica."

 flavor_gra.13.entry: "$flavor_gra.13.title$"
 flavor_gra.13.title: "$ghuzat_mujahidin_bureaucracy$"
 flavor_gra.13.desc: "Per il bene della sopravvivenza di [ROOT.GetCountry.GetName], molti volontari si sono uniti al nostro esercito.\n\nQuesti soldati, principalmente di origine [ShowCultureGroupName('amazigh_group')], sono sotto il controllo di [target_character2.GetName] — una figura competente ma incostante. Per la nostra indipendenza nella [ShowSituationName('battle_for_the_strait')], dobbiamo controllare quante più variabili possibile, e questi volontari sono fondamentali come artefici del nostro destino. Piuttosto che lasciarli sotto il controllo di un fattore straniero, dovremmo cercare di inculcare la leadership della [target_character.GetDynasty.GetName] nei loro ranghi ed eliminare il rischio di tradimento."
 flavor_gra.13.a: "Lasciamo che questi uomini servano, tutti quanti."
 flavor_gra.13.b: "Ci disferemo di coloro che non ci sono completamente leali."
 gra_mercenary_company_will_be_weaker_and_more_expensive: "La Compagnia di [mercenary|e] avrà la #Y metà#! degli uomini e sarà più costosa"

 flavor_gra.14.entry: "$flavor_gra.14.title$"
 flavor_gra.14.title: "Qaṣr ar-Riyāḍ as-Sa'īd"
 flavor_gra.14.desc: "L'[ShowBuildingTypeName('alhambra')] di [ShowLocationName('granada')] è stata la principale fonte del nostro prestigio come [ROOT.GetCountry.GetRank.GetName] in [ShowRegionName('iberia_region')]. Eppure ciò non basta per qualcuno insaziabile come [target_character.GetName]. Desiderando mostrare la gloria della [target_character.GetDynasty.GetName] all'intero mondo [ShowReligionGroupAdjective('muslim')], [target_character.GetSheHe] intende assumere i migliori architetti per costruire un palazzo nel cuore dell'[ShowBuildingTypeNameWithNoTooltip('alhambra')], ricolmo di statue di leoni e volte #italic muqarnaṣ#!."
 flavor_gra.14.a: "Finanzieremo questo progetto."
 flavor_gra.14.b: "Che il mondo contempli la gloria della [target_character.GetDynasty.GetNameWithNoTooltip]!"
 flavor_gra.14.b.entry: "Che il mondo contempli la gloria della nostra dinastia!"
 gra_construct_alhambra_increment_tt: "Aggiunge #G +1#! al livello massimo di [ShowBuildingTypeName('alhambra')]"
 flavor_gra.14.c: "Non cercheremo di soddisfare chi è insaziabile."

 flavor_gra.15.entry: "$flavor_gra.15.title$"
 flavor_gra.15.title: "Un'Opportunità nella Lotta"
 flavor_gra.15.desc: "I nostri diplomatici e le nostre spie riferiscono che vi è discordia all'interno di [target_country.GetName]. Una lotta così intensa da aver spinto [target_character2.GetName] a concentrarsi sulla politica interna, offrendoci l'occasione di riprendere fiato sotto il giogo che ci hanno imposto. [target_character.GetName] ritiene persino che ciò possa essere sfruttato per ottenere un vantaggio nella [ShowSituationName('battle_for_the_strait')], poiché non dovremo più concentrarci sul fronte con [target_country.GetNameWithNoTooltip]."
 flavor_gra.15.a: "Preghiamo che i loro tempi difficili continuino."
 gra_gain_granadan_sovereignty_for_the_rest_of_the_disaster: "Finché [GetCountry('CAS').GetName] o [GetCountry('MOR').GetName] si trovano in un [disaster|e], otterremo #G 0.1#! [granadan_sovereignty|e] al mese"

 flavor_gra.16.entry: "$flavor_gra.16.title$"
 flavor_gra.16.title: "Discordia a [ShowProvinceDefinitionNameWithNoTooltip('malaga_province')]"
 flavor_gra.16.desc: "Nonostante noi manteniamo la nostra sovranità in [ShowRegionName('iberia_region')], i governanti di [GetCountry('MOR').GetName] si sono trincerati nei possedimenti di [ShowProvinceDefinitionName('malaga_province')], che appartengono di diritto al nostro [ROOT.GetCountry.GetRank.GetName].\n\n[target_character2.GetName] ritiene che tali possedimenti debbano essere mantenuti per tutto l'aiuto che [GetCountry('MOR').GetNameWithNoTooltip] ci ha fornito in passato. Gli stati in [ROOT.GetCountry.GetName], tuttavia, vedono ciò come una minaccia alla nostra indipendenza, e desiderano che riconquistiamo ciò che un tempo era nostro."
 flavor_gra.16.a: "Andiamo avanti e conquistiamo."
 flavor_gra.16.b: "Non contrarieremo i nostri vicini in questo modo."

 flavor_gra.18.entry: "$flavor_gra.18.title$"
 flavor_gra.18.title: "Sfidando [GetCountry('CAS').GetNameWithNoTooltip]"
 flavor_gra.18.desc: "Siamo molto fieri di essere ciò che resta di $ADU$, ma siamo stati costretti a pagare tributo a [GetCountry('CAS').GetName], il che umilia il nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Questi tributi hanno ostacolato la nostra economia, rafforzando al contempo la nostra nemesi nella lotta per [ShowRegionName('iberia_region')]. Piuttosto che continuare ad accettare questa situazione, molti militari vedono questo come un momento cruciale per scrollarci di dosso il giogo e liberarci da questi fardelli stranieri."
 flavor_gra.18.a: "Anche se questo sforzo fallisse, un giorno spezzeremo queste catene."
 flavor_gra.18.b: "Obbedienza, per ora. Avremo un'altra occasione in seguito."

 flavor_gra.19.title: "Il Giogo si Stringe"
 flavor_gra.19.desc: "Il rapporto che avevamo instaurato con [from_country.GetName] si è spezzato. Invece di godersi pacificamente la propria prosperità, [target_character.GetName] ha individuato la debolezza dei nostri confini e ha deciso di smettere di pagare il tributo. Ciò non è passato inosservato al [ROOT.GetCountry.GetGovernment.GetCourtTitle], che ora insiste affinché ricordiamo loro il proprio dovere. Se continueranno a negarci il tributo che ci spetta di diritto, questa potrebbe essere l'occasione per annettere [from_country.GetNameWithNoTooltip] una volta per tutte."
 flavor_gra.19.a: "[from_country.GetCapital.GetNameWithNoTooltip] cadrà!"
 flavor_gra.19.a.entry: "La pagheranno cara!"

 flavor_gra.20.entry: "$flavor_gra.20.title$"
 flavor_gra.20.title: "Prosperità nei Mercati di [ShowLocationNameWithNoTooltip('granada')]"
 flavor_gra.20.desc: "La nostra produzione di [ShowGoodsName('silk')], e l'entusiasmo con cui i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] lo commerciano in tutto [ShowContinentName('europe')], ha portato alla creazione di nuovi mercati a [ShowLocationName('granada')]. Questo sviluppo ha spinto molti dei nostri [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')] ad espandere questo commercio, usando tutta l'influenza e l'oro di cui dispongono per favorire il progetto.\n\nSarà costruito un imponente [ShowBuildingTypeName('marketplace')], noto come [ShowBuildingTypeName('al_qaysariyya_market')], destinato a fungere da più grande polo commerciale di tutta [ShowRegionName('iberia_region')], attirando mercanti stranieri e incoraggiando i nostri a commerciare con i più remoti angoli del mondo."
 flavor_gra.20.a: "Costruiamo [ShowBuildingTypeNameWithNoTooltip('al_qaysariyya_market')]."
 flavor_gra.20.b: "Questa volta dovremo deludere i nostri [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."

 flavor_gra.1000.entry: "$flavor_gra.1000.title$"
 flavor_gra.1000.title: "Una Figura di Spicco"
 flavor_gra.1000.desc: "Nei recenti anni di sanguinoso conflitto con i nostri vicini, un membro della dinastia [ShowDynastyName('nasrid_dynasty')] si è fatto conoscere in tutto [ROOT.GetCountry.GetName]. Conosciuto come [target_character.GetName], [target_character.GetSheHe] si è dimostrato un comandante militare eccezionale, capace di ispirare migliaia di uomini. È così che [target_character2.GetName] ha notato questo [target_character.GetWomanMan], sperando di avvicinarlo al [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Tuttavia, [target_character.GetSheHe] ha mostrato un'ambizione insaziabile, suscitando la preoccupazione di molti vicini a [target_character2.GetNameWithNoTooltip]."
 flavor_gra.1000.a: "Le grandi persone appartengono a questo grande paese."
 gra_yusuf_will_most_likely_rebel: "Invitare [target_character.GetName] a servire [ROOT.GetCountry.GetName] porterà molto probabilmente [target_character.GetHerHim] a tentare di rovesciare [target_character2.GetName]"
 flavor_gra.1000.b: "È meglio non correre rischi simili."
 gra_banishing_yusuf_prevents_the_rebellion: "Esiliare [target_character.GetName] garantirà che [target_character.GetSheHe] non inizi una ribellione"
 flavor_gra.1000.c: "I nostri informatori ci dicono che questo piano si ritorcerà contro di noi."

 flavor_gra.1001.title: "Ribellione di [target_character.GetNameWithNoTooltip]"
 flavor_gra.1001.desc: "Sfruttando la [target_character.GetHerHis] popolarità per radunare un vasto seguito, [target_character.GetName] rivaleggia ora con la forza e l'influenza di [target_character2.GetName]. I sostenitori di [target_character.GetHerHim] hanno ora lanciato un ultimatum alla nostra attuale guida: abdicare in favore di [target_character.GetNameWithNoTooltip], oppure [ROOT.GetCountry.GetName] sarà travolta da una guerra devastante."
 flavor_gra.1001.a: "Non cederemo mai il potere a un pretendente!"
 flavor_gra.1001.b: "Nessun sangue inutile sarà versato stanotte. [target_character2.GetNameWithNoTooltip] abdicherà."
 flavor_gra.1001.b.entry: "Nessun sangue inutile sarà versato stanotte. Cederemo il trono."

 flavor_gra.1100.entry: "$flavor_gra.1100.title$"
 flavor_gra.1100.title: "Una Stella Nascente"
 flavor_gra.1100.desc: "Tra i nostri soldati al fronte si sono diffuse voci su un giovane e forte [target_character.GetWomanMan] che è salito costantemente di grado, ed è già stato nominato generale. Conosciuto come [target_character.GetName], si dice che [target_character.GetSheHe] abbia occhi da falco, capace di osservare l'intero campo di battaglia e prendere decisioni strategiche intelligenti anche nel pieno della battaglia. Si dice anche che [target_character.GetSheHe] sia impareggiabile con la spada, sconfiggendo ogni avversario che [target_character.GetSheHe] ha affrontato. Ma solo il tempo dirà se queste voci sono vere..."
 flavor_gra.1100.a: "Osserveremo questa carriera con grande interesse."
 flavor_gra.1100.b: "Persone come questa sono note solo per causare problemi."

 flavor_gra.1101.title: "Uno tra Tanti"
 flavor_gra.1101.desc: "Ci sembra, [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetOralAddress], che le affermazioni sorprendenti fatte dai nostri soldati si siano rivelate almeno in parte vere — [target_character.GetWomanMan] è riuscito a compiere imprese miracolose, capace di respingere una carica di cavalleria sul fianco con nient'altro che [target_character.GetHerHis] reggimento. I cortigiani del nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] sembrano pensare che [target_character.GetSheHe] debba ricevere un grande titolo, e sembra saggio premiare simili atti di coraggio. [target_character.GetSheHe|U] potrà anche essere solo uno tra tanti, ma potrebbe anche essere la reincarnazione di Ḵālid ibn al-Walīd."
 flavor_gra.1101.a: "Abbiamo bisogno di più persone come questa."

 flavor_gra.1102.title: "Circondato dai Fedelissimi"
 flavor_gra.1102.desc: "Da quando abbiamo conferito a [target_character.GetName] il [target_character.GetHerHis] titolo nobiliare, i suoi compagni più stretti hanno iniziato a comportarsi più come [target_character.GetHerHis] servitori, occupandosi di ogni suo bisogno e parlando come [target_character.GetHerHis] rappresentanti quando [target_character.GetSheHe] non è presente. La tenuta che [target_character.GetSheHe] ha ricevuto a [ROOT.GetCountry.GetCapital.GetName] ha visto recentemente un aumento di traffico, con le masse che reclamano la possibilità di vedere il [target_character.GetHerHis] volto. Alcuni hanno esagerato le [target_character.GetHerHis] imprese fino a un fervore quasi religioso, e sembra quasi che venerino [target_character.GetHerHim]."
 flavor_gra.1102.a: "Sospetto..."

 flavor_gra.1103.title: "Un Pretendente si Leva"
 flavor_gra.1103.desc: "Abbiamo finalmente scoperto il motivo per cui il seguito di [target_character.GetName] intraprende azioni così eccessive. Hanno diffuso la voce che questo generale sia il rampollo di un ramo cadetto della leggendaria dinastia [ShowDynastyName('umayyad_dynasty')], che un tempo portò [ShowRegionName('iberia_region')] a un'epoca d'oro. Pur non potendo né confutare né confermare queste affermazioni, alcuni dei [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] hanno colto l'occasione per scalare i ranghi legandosi a questo falso pretendente. [target_character.GetHerHis|U] seguito è ormai cresciuto fino alle dimensioni di un'intera divisione, e potrebbe minacciare la nostra autorità sull'esercito."
 flavor_gra.1103.a: "Speriamo che questo non porti a nulla."

 flavor_gra.1104.title: "Un Giorno di Resa dei Conti"
 flavor_gra.1104.desc: "Maledizione! Quest'uomo si è rivoltato contro il trono! Rivendicando la propria discendenza dalla dinastia [ShowDynastyName('umayyad_dynasty')], [target_character.GetSheHe] ha radunato il [target_character.GetHerHis] seguito fedele e gli ha ordinato di marciare sulle nostre città più grandi, dove dovranno incitare disordini diffusi e diffondere la voce della [target_character.GetHerHis] pretesa al nostro trono. Non ha senso negare che il dominio [ShowDynastyNameWithNoTooltip('umayyad_dynasty')] su [ShowLocationName('cordoba')] portò grande prosperità ai nostri antenati, ma la pretesa di questo [target_character.GetWomanMan] di essere un discendente [ShowDynastyNameWithNoTooltip('umayyad_dynasty')] è quantomeno dubbia. Ciononostante, al popolo non importa, avendo sentito parlare delle [target_character.GetHerHis] leggendarie imprese sul campo di battaglia. Numerose persone di ogni estrazione sociale sono disposte a sostenere la [target_character.GetHerHis] causa, e già gridano affinché [ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] si dimetta."
 flavor_gra.1104.a: "Schiacciamo questo pretendente!"
 flavor_gra.1104.b: "Non abbiamo alcuna possibilità."

 flavor_gra.1200.entry: "$flavor_gra.1200.title$"
 flavor_gra.1200.title: "Aiuto da [ShowRegionNameWithNoTooltip('maghreb_region')]"
 flavor_gra.1200.desc: "Con la [ShowSituationName('battle_for_the_strait')] ancora infuria, la nostra sopravvivenza dipende più che mai dall'intervento straniero. Con sia [GetCountry('CAS').GetName] che [GetCountry('MOR').GetName] in competizione per sottometterci, è naturale che cerchiamo aiuto da una parte esterna. I paesi del [ShowRegionName('maghreb_region')] sono spiriti affini con le proprie opinioni in merito, in particolare [strongest_maghreb_country.GetName], che si erge sopra tutti gli altri. Forse chiedendo aiuto a [target_character2.GetName] potremmo riuscire a ottenere un vantaggio militare in questa lotta."
 flavor_gra.1200.a: "Abbiamo disperatamente bisogno di aiuto."
 flavor_gra.1200.b: "Perché dovremmo dipendere dall'intervento esterno per la nostra protezione?"

 flavor_gra.1201.title: "$flavor_gra.1200.title$"
 flavor_gra.1201.desc: "[from_country.GetName] si è rivolta a noi riguardo alla situazione attuale in [ShowRegionName('iberia_region')]. Sentendosi con le spalle al muro, ci chiedono di aiutarli con qualsiasi mezzo possibile contro le crescenti minacce alla loro sovranità. Che si tratti di oro o di uomini, entrambi sarebbero sufficienti per la difesa della loro patria."
 flavor_gra.1201.a: "Daremo loro dell'oro."
 flavor_gra.1201.b: "Riceveranno uomini da parte nostra."
 flavor_gra.1201.c: "Andranno bene sia l'oro che gli uomini."
 flavor_gra.1201.d: "Perché dovremmo coinvolgerci in questo conflitto?"

 flavor_gra.1300.entry: "$flavor_gra.1300.title$"
 flavor_gra.1300.title: "Aiuto dall'Oriente"
 flavor_gra.1300.desc: "Con la caduta di [ShowLocationName('constantinople')] per mano di [target_country.GetName], il mondo [ShowReligionGroupAdjective('muslim')] ha inflitto un duro colpo ai regni [ShowReligionGroupAdjective('christian')] di [ShowContinentName('europe')]. Trionfante, [target_character2.GetName] ha mostrato interesse nell'espandere la propria influenza sul mondo conosciuto. Forse possiamo cogliere l'occasione per inviare una delegazione a [target_country.GetCapital.GetName], nella speranza di ottenere da loro generali e soldati esperti."
 flavor_gra.1300.a: "Inviamo una delegazione."
 flavor_gra.1300.b: "Non abbiamo bisogno del loro aiuto per sopravvivere."
 gra_demand_a_mercenary_company: "Chiederemo a [target_country.GetName] di darci [gold|e] oppure una compagnia di [mercenary|e] guidata da uno dei loro [characters|e]"

 flavor_gra.1301.title: "$flavor_gra.1300.title$"
 flavor_gra.1301.desc: "[target_character.GetName] di [from_country.GetName] ha inviato una delegazione a [ROOT.GetCountry.GetCapital.GetName], congratulandosi con noi per la conquista di [ShowLocationName('constantinople')] e portando le più cordiali parole per il nostro successo militare. Avendo inflitto un duro colpo a [ShowReligionGroupName('christian')], ora ci chiedono di inviare loro aiuto militare per proteggersi dagli avvoltoi in [ShowRegionName('iberia_region')] che desiderano estinguere la fiamma di [ShowReligionGroupName('muslim')]. Un [mercenary_general.GetWomanMan] in particolare, [mercenary_general.GetName], è ansioso di guidare questa spedizione, desiderando ottenere gloria personale oltre che servire [target_character2.GetName] ed espandere la portata del [ROOT.GetCountry.GetFlavorRank] fino alle Colonne d'Ercole."
 flavor_gra.1301.a: "Chi siamo noi per negare ai nostri uomini la conquista?"
 flavor_gra.1301.b: "Non potremo risparmiare alcun generale o soldato, ma possiamo risparmiare un po' d'oro."
 flavor_gra.1301.c: "Perché dovremmo cercare di ravvivare una fiamma quasi spenta?"
