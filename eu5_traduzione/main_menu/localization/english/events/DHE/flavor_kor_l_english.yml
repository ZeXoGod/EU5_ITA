l_english:
 flavor_kor.1.title: "Il Dominio Mongolo"
 flavor_kor.1.entry: "$flavor_kor.1.title$"
 flavor_kor.1.desc: "Nel terribile anno 1231, i Mongoli iniziarono la loro lotta, durata 39 anni, contro il popolo [ROOT.GetCountry.GetAdjective]. Con il passare degli anni, le risorse e gli uomini [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip] non riuscirono più a resistere agli invasori, e il nostro amato [ROOT.GetCountry.GetFlavorRank] cadde, diventando un vassallo della dinastia [GetCountry('CHI').GetLongName].\n\nDa allora, gli aristocratici [GetCountry('MGE').Custom('IT_ADJ_MP')] sono diventati una presenza comune nelle posizioni chiave di governo, dettando la politica e le decisioni dello Stato e imponendo [ShowGovernmentReformName('son_in_law_rule')] al nostro Stato.\n\nMa nessun impero dura per sempre, e il tempo stesso bussa alle porte [GetCountry('CHI').Custom('IT_Della')][GetCountry('CHI').GetNameWithNoTooltip]. La sua caduta inevitabile è prossima, eppure non saremo mai davvero liberi dalle catene [GetCountry('MGE').Custom('IT_ADJ_FP')] finché non ci libereremo dei burattinai che agiscono al suo interno."
 flavor_kor.1.a: "Ci libereremo dal loro dominio barbaro!"
 kor_hostile_attitude: "Atteggiamento Reciprocamente Ostile"
 flavor_kor.1.b: "Cosa accadrà senza la guida mongola?"
 kor_friendly_attitude: "Atteggiamento Reciprocamente Positivo"
 flavor_kor.1.a.at: "#R Fino a quando un [character|e] [ShowCultureName('mongolian_culture')] [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sarà presente alla nostra corte, si innescheranno periodicamente [events|e] che limiteranno il nostro governo e causeranno la perdita di risorse.#!"
 flavor_kor.1.a.tt: "Adottiamo un atteggiamento ostile verso [GetCountry('CHI').GetName], diminuendo reciprocamente le opinioni di [ShowBiasValue('kor_hostile_attitude')|0]. Se rimuoviamo dal paese tutti i [characters|e] [ShowCultureName('mongolian_culture')] [THIS.GetCountry.Custom('IT_NOBLES_DEL')][THIS.GetCountry.GetGovernment.GetEstateName('nobles_estate')], potremo eliminare [ShowGovernmentReformName('son_in_law_rule')]"
 flavor_kor.1.b.tt: "Adottiamo un atteggiamento più favorevole verso [GetCountry('CHI').GetName], aumentando reciprocamente le opinioni di [ShowBiasValue('kor_friendly_attitude')|0]. Se soddisfiamo le richieste [THIS.GetCountry.Custom('IT_NOBLES_DEL')][THIS.GetCountry.GetGovernment.GetEstateName('nobles_estate')] [ShowCultureName('mongolian_culture')], potremo rafforzare i legami tra i nostri Stati"
 flavor_kor.1.a.TIP: "Le [character_interactions|e] [ShowCharacterInteractionName('banish_character')] possono essere usate per rimuovere i sostenitori [GetCountry('CHI').Custom('IT_Di')][GetCountry('CHI').GetNameWithNoTooltip]."
 flavor_kor.2.title: "Le Richieste degli Aristocratici Mongoli"
 flavor_kor.2.desc: "Con le posizioni chiave occupate dagli aristocratici [ShowCultureName('mongolian_culture')], le risorse dello Stato sono alla loro mercé..."
 flavor_kor.2.desc.demand: "[target_character.GetName], attuale portavoce [target_country.Custom('IT_Della')][target_country.GetName] all'interno del nostro Stato, ha dichiarato una nuova richiesta per conto dei suoi padroni."
 flavor_kor.2.desc.gold: "$flavor_kor.2.desc$\n\n$flavor_kor.2.desc.demand$ È stata avanzata una richiesta sulle nostre riserve d'oro per sostenere gli obiettivi del [target_country.GetGovernment.GetRulerTitle]."
 flavor_kor.2.desc.prestige: "$flavor_kor.2.desc$\n\n$flavor_kor.2.desc.demand$ Gli [target_country.Custom('IT_ADJ_MP')] hanno posato gli occhi sui nostri manufatti più preziosi. Desiderano ottenerli per aumentare il proprio prestigio."
 flavor_kor.2.desc.diplomatic_actions: "$flavor_kor.2.desc$\n\n$flavor_kor.2.desc.demand$ I nostri diplomatici sono necessari alla corte [target_country.Custom('IT_ADJ_FS')]."
 flavor_kor.2.desc.estate_satisfaction: "$flavor_kor.2.desc$\n\n$flavor_kor.2.desc.demand$ I ceti dovranno servire il [target_country.GetGovernment.GetRulerTitle] [target_country.Custom('IT_Di')][target_country.GetNameWithNoTooltip]. Naturalmente, una simile azione sconvolgerà non poco i nostri fedeli ceti."
 flavor_kor.2.desc.government_power: "$flavor_kor.2.desc$\n\n$flavor_kor.2.desc.demand$ La richiesta non è altro che umiliante, poiché il nostro stesso [ROOT.GetCountry.GetGovernment.GetRulerTitle] dovrà viaggiare fino a [target_country.GetCapital.GetName] per inchinarsi pubblicamente davanti a [target_country.GetGovernment.GetRuler.GetName]."
 flavor_kor.2.a: "Come desidera il [target_country.GetGovernment.GetRulerTitle]."
 flavor_kor.2.a.entry: "Come desidera."
 flavor_kor.2.b: "Non ci inchiniamo ai Mongoli!"
 flavor_kor.3.title: "Arriva un Nuovo Aristocratico [ShowCultureNameWithNoTooltip('mongolian_culture')]"
 flavor_kor.3.desc: "La corte [target_country.Custom('IT_Di')][target_country.GetName] ha nuovamente inviato uno dei suoi nobili, [mongol_aristocrat.GetName], a [ROOT.GetCountry.GetCapital.GetName] per sorvegliare il nostro governo."
 flavor_kor.3.a: "Diamogli il benvenuto alla nostra corte."
 flavor_kor.3.b: "Non abbiamo bisogno di altre spie da parte del [target_country.GetGovernment.GetRulerTitle]."
 flavor_kor.3.b.entry: "Non abbiamo bisogno di altre sue spie."
 flavor_kor.4.title: "Le Catene Mongole Sono State Spezzate"
 flavor_kor.4.entry: "$flavor_kor.4.title$"
 flavor_kor.4.desc: "Dopo un secolo sotto il giogo del dominio [ShowCultureName('mongolian_culture')] su [ROOT.GetCountry.GetName], la nostra nazione si è finalmente liberata! I conquistatori delle steppe non hanno più voce in capitolo nella politica [ROOT.GetCountry.Custom('IT_ADJ_FS')], e la nostra cultura e il nostro governo tornano a fiorire!\n\nNaturalmente la situazione della Cina resta una questione aperta, e resta da vedere in quale direzione [target_character.GetName] ci condurrà, ma per ora godiamoci la sovranità e la libertà!"
 flavor_kor.4.a: "Lunga vita [ROOT.GetCountry.Custom('IT_Alla')][ROOT.GetCountry.GetNameWithNoTooltip]!"
 flavor_kor.4.a.entry: "Lunga vita al nostro paese!"
 kor_freed_from_mongol_influence_tt: "Libera dall'Influenza [ShowCultureName('mongolian_culture')]"
 flavor_kor.5.title: "Legami Rafforzati con i Mongoli"
 flavor_kor.5.entry: "$flavor_kor.5.title$"
 flavor_kor.5.desc: "La nostra sottomissione e il nostro sostegno al trono [target_country.GetAdjective] ci hanno guadagnato la fiducia e la benevolenza tanto dei sovrani quanto del popolo [ShowCultureName('mongolian_culture')]. Il destino [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] e [target_country.Custom('IT_Della')][target_country.GetNameWithNoTooltip] sono legati l'uno all'altro, nel bene e nel male."
 flavor_kor.5.a: "Che la nostra lealtà venga ricompensata di conseguenza."
 kor_upgrade_son_in_law: "[ShowGovernmentReformName('son_in_law_rule')] verrà rafforzato, rimuovendo diverse penalità e aggiungendo nuovi benefici."
 has_upgraded_son_in_law: "Ha potenziato [ShowGovernmentReformName('son_in_law_rule')] tramite l'[event|e] $flavor_kor.5.title$."
 not_has_upgraded_son_in_law: "NON ha potenziato [ShowGovernmentReformName('son_in_law_rule')] tramite l'[event|e] $flavor_kor.5.title$."
 kor_tied_to_mongol_influence_tt: "Destino Legato alla Causa [ShowCultureName('mongolian_culture')]"

 flavor_kor.6.title: "[target_character.GetNameWithNoTooltip] [target_country.Custom('IT_Di')][target_country.GetNameWithNoTooltip]"
 flavor_kor.6.entry: "L'Imperatrice Consorte Gi degli Yuan"
 flavor_kor.6.desc: "[target_character.GetName], [target_character.GetDaughterSon] [from_country.Custom('IT_Di')][from_country.GetName], ha assunto il potere su [target_country.GetName]. Grazie ai suoi legami con la madrepatria [from_country.Custom('IT_ADJ_FS')], nutre un forte interesse per il benessere del nostro [from_country.GetFlavorRank]. Abbiamo l'occasione unica di ricordarle le sue origini e di richiedere un grande dono dall'Impero Celeste."
 flavor_kor.6.historical_info: "Nata a Haengju (l'odierna Goyang), in Goryeo, Lady Gi della famiglia Gi divenne concubina dell'imperatore Yuán Toghon Temür, conquistandolo con la sua bellezza e i suoi talenti nonostante le opposizioni. Manovrando con abilità tra gli intrighi di corte, assicurò al figlio lo status di erede mentre la sua influenza cresceva, nel momento in cui Toghon Temür si ritirò dal governo. Le sue azioni causarono tensioni tra Goryeo e gli Yuán, specialmente con il suo tentativo di garantire la successione al figlio, portando a conflitti e minacciando la stabilità di Goryeo.\n\nMentre le lotte di potere si intensificavano, il re Gongmin di Goryeo troncò i legami con gli Yuán, scatenando la ritorsione dell'Imperatrice Gi. Nonostante la sua successiva ascesa al rango di imperatrice principale a causa delle lotte intestine tra gli Yuán, il collasso della dinastia nel 1368 la costrinse alla fuga, intrecciando il suo destino con la caduta degli Yuán. Nonostante i fugaci momenti come Grande Imperatrice, la sorte finale dell'Imperatrice Gi divenne un mistero dopo la morte di Toghon Temür, svanendo dai documenti storici."
 flavor_kor.6.a: "Faremo la richiesta!"
 flavor_kor.6.b: "Non abbiamo bisogno del sostegno del [target_country.GetGovernment.GetRulerTitle]."
 flavor_kor.6.b.entry: "Non abbiamo bisogno del sostegno del sovrano."
 flavor_kor.7.title: "La Richiesta [from_country.Custom('IT_Di')][from_country.GetNameWithNoTooltip]"
 flavor_kor.7.desc: "[target_character.GetName] è diventato l'autorità regnante su [target_country.GetName], ma resta comunque [target_character.GetDaughterSon] [from_country.Custom('IT_Di')][from_country.GetName], una Provincia-[from_country.GetFlavorRank] del nostro grande [target_country.GetFlavorRank]. Per questo motivo, i suoi legami con le terre [from_country.Custom('IT_ADJ_FP')] restano forti nonostante la sua nuova posizione di potere all'interno [target_country.Custom('IT_Di')][target_country.GetNameWithNoTooltip].\n\n[from_country.GetGovernment.GetRuler.GetName] ha richiesto un dono a sostegno [from_country.Custom('IT_Di')][from_country.GetNameWithNoTooltip]."
 flavor_kor.7.a: "L'oro servirà benissimo [from_country.Custom('IT_Alla')][from_country.GetNameWithNoTooltip]."
 flavor_kor.7.a.entry: "L'oro servirà benissimo a loro."
 flavor_kor.7.a.tt: "[from_country.GetName] riceverà i [gold|e]"
 flavor_kor.7.b: "Doniamo loro i nostri preziosi manufatti."
 flavor_kor.7.b.tt: "[from_country.GetName] riceverà il [prestige|e]"
 flavor_kor.7.zzz: "Non hanno bisogno di alcun dono."
 flavor_kor.8.title: "Un Dono dal [target_country.GetGovernment.GetRulerTitle]"
 flavor_kor.8.desc: "Il grazioso [target_country.GetGovernment.GetRulerTitle], [target_country.GetGovernment.GetRulerOrRegent.GetShortName], ci ha mandato i suoi saluti!"
 flavor_kor.8.desc.gold: "$flavor_kor.8.desc$ Uno scrigno d'oro di quantità incommensurabile è arrivato alla nostra corte. Con esso, le casse [from_country.Custom('IT_Di')][from_country.GetName] si riempiranno per il decennio a venire."
 flavor_kor.8.desc.prestige: "$flavor_kor.8.desc$ Preziosi e imponenti manufatti provenienti dal cuore della Cina sono arrivati alla nostra corte. Un simile simbolo di prestigio in nostro possesso migliorerà senz'altro di molto la nostra immagine pubblica."
 flavor_kor.8.a: "Lode a [target_country.GetGovernment.GetRuler.GetShortNameWithNoTooltip], vero [target_country.GetGovernment.GetRuler.GetDaughterSon] [from_country.Custom('IT_Di')][from_country.GetNameWithNoTooltip]!"
 flavor_kor.8.a.entry: "Lode a lui, vero figlio del loro popolo!"
 flavor_kor.9.title: "Il [target_country.GetGovernment.GetRulerTitle] Rifiuta!"
 flavor_kor.9.entry: "La Dinastia Yuan Rifiuta il Nostro Dono"
 flavor_kor.9.desc: "Notizie da [target_country.GetCapital.GetName] sono finalmente giunte alla nostra corte. [target_country.GetGovernment.GetRuler.GetName] ha dichiarato di non avere alcun interesse a mandare doni o sostegno di alcun tipo alla sua patria d'origine, abbandonando del tutto le proprie radici [from_country.Custom('IT_ADJ_FP')]."
 flavor_kor.9.a: "Che vergognosa dimostrazione di tradimento..."
 flavor_kor.10.title: "Un'Occasione Lungamente Attesa"
 flavor_kor.10.entry: "$flavor_kor.10.title$"
 flavor_kor.10.desc: "La fortuna è di nuovo dalla nostra parte! Uno dei nostri generali ci informa che, tramite canali segreti e sotterfugi, è riuscito ad assicurarsi un alleato all'interno della corte [GetCountry('SSG').Custom('IT_ADJ_FS')].\n\nÈ giunto il momento di un attacco rapido e decisivo contro i territori settentrionali, per riconquistare le terre che un tempo ci furono rubate, prima che i burocrati [GetCountry('CHI').Custom('IT_Di')][GetCountry('CHI').GetName] abbiano la possibilità di intervenire."
 flavor_kor.10.a: "Chiamiamo alle armi!"
 flavor_kor.10.b: "No, non attaccheremo senza essere stati provocati."
 flavor_kor.11.title: "Il Nord Riconquistato"
 flavor_kor.11.entry: "$flavor_kor.11.title$"
 flavor_kor.11.desc: "Finalmente! Dopo troppi decenni di umiliazione, la provincia settentrionale di [ShowProvinceDefinitionName('hwaju_province')] è di nuovo sotto il vessillo [GetCountry('KOR').Custom('IT_Di')][GetCountry('KOR').GetName], e i detestabili invasori [GetCountry('SSG').Custom('IT_Di')][GetCountry('SSG').GetName] sono stati sconfitti.\n\nÈ tempo di festeggiamenti e allegria. Una spettacolare parata del nostro potente esercito è stata organizzata nella nostra capitale per commemorare l'occasione e permettere al popolo della nostra nazione di vedere e incontrare i propri eroi."
 flavor_kor.11.a: "Magnifico!"
 flavor_kor.12.title: "La Ricetta della Polvere Nera"
 flavor_kor.12.entry: "$flavor_kor.12.title$"
 flavor_kor.12.desc: "#italic Kaboom#!! Tutta la corte è rimasta impressionata dalla dimostrazione esplosiva di [choe_scope.GetName]. Un uomo brillante, spinto all'azione dalle continue incursioni dei pirati [target_country.Custom('IT_ADJ_MP')] e ispirato dagli spettacoli pirotecnici dei diplomatici [GetCountry('CHI').Custom('IT_ADJ_MP')]. Si è imposto il compito di migliorare le capacità del nostro esercito e di scoprire la ricetta della Polvere Nera.\n\nCon molta astuzia e sperimentazione, i suoi sforzi hanno dato i loro frutti, e ha dimostrato di essere in grado di crearla a partire da materie prime, consegnando uno dei segreti più gelosamente custoditi [GetCountry('CHI').Custom('IT_Di')][GetCountry('CHI').GetNameWithNoTooltip] al nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 flavor_kor.12.a: "Meraviglioso, finanziamo le sue ricerche e costruiamogli un laboratorio."
 flavor_kor.12.b: "Non tradiremo la fiducia [GetCountry('CHI').Custom('IT_Di')][GetCountry('CHI').GetNameWithNoTooltip], espelliamolo."
 flavor_kor.12.b.entry: "Non tradiremo la fiducia di $CHI$, espelliamolo."
 flavor_kor.13.title: "La Diffusione del Confucianesimo"
 flavor_kor.13.entry: "$flavor_kor.13.title$"
 flavor_kor.13.desc: "[ShowReligionName('mahayana')] è stata per secoli la religione di Stato e la bussola morale [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. L'influenza e lo status del [ShowReligionGroupName('buddhist')] vanno ben oltre quelli di una semplice religione; è diventata un'organizzazione a sé stante, in cui i membri [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] hanno acquisito grande influenza, potere e terre all'interno del nostro [ROOT.GetCountry.GetFlavorRank].\n\nDa quando [ROOT.GetCountry.GetNameWithNoTooltip] cadde sotto l'invasione mongola, la posizione preminente [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] è stata presa dalla vecchia nobiltà che una volta avevamo, formando il ceto [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Tuttavia, con l'ascesa di questo nuovo ceto è nato anche l'interesse per l'antica letteratura cinese - e per gli insegnamenti di Confucio. Un cambiamento radicale nel nostro sistema di credenze e nei nostri riti potrebbe diventare realtà, man mano che le idee confuciane si diffondono nel nostro paese..."
 flavor_kor.13.a: "Osserviamo come si sviluppa la situazione..."
 flavor_kor.13.a.tt: "Diventiamo idonei a ricevere più [events|e] legati al #Y Confucianesimo#!"
 flavor_kor.14.title: "L'Ascesa dei Neo-Confuciani"
 flavor_kor.14.entry: "$flavor_kor.14.title$"
 flavor_kor.14.desc: "La stabilità politica [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetLongName] è stata scossa dall'emergere di un nuovo gruppo noto come i Neo-Confuciani. Si tratta di studiosi provenienti dalle campagne che tradizionalmente non facevano parte dell'élite conservatrice [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] che governava il paese. I loro evidenti meriti incoraggiano il [ROOT.GetCountry.GetGovernment.GetRulerTitle] a impiegarli nel governo; tuttavia, le loro idee riformiste, unite alla competizione con l'establishment [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] per terre e posizioni, hanno portato a scontri sempre più frequenti tra le diverse fazioni nella politica [ROOT.GetCountry.Custom('IT_ADJ_FS')]."
 flavor_kor.14.a: "Tempi difficili ci attendono..."
 flavor_kor.14.a.tt: "Sblocca quanto segue:\n- [advances|e] [ShowAdvanceName('confucian_academy_advance')] per l'#Y $age_2_renaissance$#!\n- [estate_privileges|e] [ShowEstatePrivilegeName('petty_bureaucracy')] e [ShowEstatePrivilegeName('scholar_officials')]\n- [policy|e] [ShowLawName('imperial_examination_law')] della [law|e] [ShowLawName('bureaucracy_law')]"
 has_neo_confucianism_tt: "Ha avuto l'[event|e] #Y L'Ascesa dei Neo-Confuciani#!"
 variable_tt_kor_has_confucianism_active: "Le Fazioni Neo-Confuciane Sono Sorte a Corte"
 flavor_kor.15.title: "Il Colpo di Stato [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_kor.15.entry: "$flavor_kor.15.title$"
 flavor_kor.15.desc: "Il regime di [old_ruler.GetName] si è rivelato tanto insoddisfacente che lo stesso popolo [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] rigetta il [ROOT.GetCountry.GetGovernment.GetRulerTitle] e si rivolge a [target_character.GetName], un generale promettente che ha conquistato la popolarità tanto [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] quanto [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')].\n\nOggi, [target_character.GetShortNameWithNoTooltip] ha colpito: il suo esercito ha dato inizio a un colpo di Stato contro [old_ruler.GetShortNameWithNoTooltip]."
 flavor_kor.15.a: "Questa è la fine di una vecchia dinastia..."
 flavor_kor.15.b: "Non possiamo permettere che questo traditore vinca!"
 flavor_kor.15.b.tt: "I seguenti effetti si applicano a tutti i [ShowPopTypeName('nobles')] in ogni [location|e] con più del #Y 75.0%#! di Unità Culturale Locale:"
 joseon_pretender: "L'Armata del Pretendente Yi"
 joseon_pretender_scope: "L'Armata del Pretendente Yi"
 variable_tt_had_successful_coup: "Un Colpo di Stato di Corte è Riuscito"
 flavor_kor.16.title: "Il Gyeongguk Daejon"
 flavor_kor.16.entry: "$flavor_kor.16.title$"
 flavor_kor.16.desc: "Le leggi [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] sono raccolte e riunite nel grande #italic Gyeongje Yukjeon#! - i #italic Sei Codici di Governo#!. Sebbene le sue leggi e i suoi codici siano ancora applicabili agli affari nazionali odierni, iniziano a mostrare i segni del tempo. Una nuova compilazione del testo sarebbe di grande beneficio per lo Stato, al fine di rinnovare, rivedere e rimuovere alcune delle vecchie leggi per il bene del popolo [ROOT.GetCountry.GetAdjectiveWithNoTooltip]. Studiosi e burocrati sono pronti a creare il #italic Gyeongguk Daejon#! - il #italic Codice Nazionale#!. Tuttavia, questo processo sarà costoso e richiederà investimenti da parte nostra."
 flavor_kor.16.a: "Investiamo nella compilazione."
 flavor_kor.16.b: "Non possiamo permettercelo."
 is_joseon_dynasty_tt: "La Dinastia Joseon è Stata Fondata"
 flavor_kor.17.title: "Il $samsa_system$"
 flavor_kor.17.entry: "$flavor_kor.17.title$"
 flavor_kor.17.desc: "$samsa_system_desc$ Serve come sostituto dei vecchi Tre Dipartimenti che hanno dominato la burocrazia [ROOT.GetCountry.Custom('IT_ADJ_FS')] per diversi decenni. Tuttavia, l'attuazione di una simile riforma richiederà un'ampia sostituzione governativa, sia di natura finanziaria che amministrativa."
 flavor_kor.17.a: "Forniamo ai nostri burocrati le risorse necessarie."
 flavor_kor.17.b: "Non possiamo permettercelo."

 flavor_kor.18.title: "L'Armata della Giustizia"
 flavor_kor.18.desc: "In risposta alla devastazione causata da [target_war.GetName], i cittadini di [target_location.GetProvince.GetName] hanno scelto di riunirsi per formare la cosiddetta #italic $flavor_kor.18.title$#!. Questa forza paramilitare è composta da membri [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] pronti a pagare il prezzo più alto in difesa della propria patria. Non possiamo che ammirare come, ancora e ancora, la gente comune sia pronta a schierarsi in solidarietà con l'intera nazione. [ROOT.GetCountry.GetName] non dimenticherà il loro sacrificio."
 flavor_kor.18.a: "Eroi, questo è ciò che sono."
 flavor_kor.18.b: "Non ce n'è bisogno."

 flavor_kor.19.title: "Il Furto dei Semi di [ShowGoodsNameWithNoTooltip('cotton')]"
 flavor_kor.19.entry: "Il Furto dei Semi di Cotone"
 flavor_kor.19.desc: "Uno dei nostri inviati, [target_character.GetName], è recentemente tornato dalla sua missione diplomatica [target_country.Custom('IT_In')][target_country.GetName]. Questo da solo è già degno di nota, ma ciò che è ancora più ammirevole è l'importazione di una nuova varietà di [ShowGoodsName('cotton')], meglio adattata al clima [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName]. [target_character.GetNameWithNoTooltip|U] l'ha già coltivata nella sua città natale, [target_location.GetName], e dovremmo considerare di diffonderla anche nel resto del paese."
 flavor_kor.19.a: "Coltiviamolo."
 flavor_kor.19.b: "Facciamo invece arrestare il diplomatico!"

 flavor_kor.20.title: "Lotte tra Fazioni"
 flavor_kor.20.desc: "È tempo di scegliere una nuova direzione per [ROOT.GetCountry.GetLongName]. Quale fazione favorirà [new_ruler.GetName] durante il suo regno?"
 flavor_kor.20.common_introduction: "Al momento, ci sono due fazioni che si contendono il potere nel [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 flavor_kor.20.desc_sarim_hungu: "$flavor_kor.20.desc$\n\n$flavor_kor.20.common_introduction$, il [ShowModifier('kor_support_sarim_modifier')] e il [ShowModifier('kor_support_hungu_modifier')]. I primi sono studiosi ortodossi che sostengono con fervore il Neo-Confucianesimo, mentre i secondi sono uniti nel sostenere con forza il rafforzamento del potere [ROOT.GetCountry.GetGovernment.GetAdjective]."
 kor_description_of_early_factions: "$flavor_kor.20.common_introduction$, il [ShowModifier('kor_support_gwan_hak_modifier')] e il [ShowModifier('kor_support_jeol_eui_modifier')]. I primi rappresentano studiosi affermati, con un'amministrazione efficiente e una mentalità innovativa. Sono inoltre fermi sostenitori dell'armonia tra il [ROOT.GetCountry.GetGovernment.GetCabinetTitle] e il [ROOT.GetCountry.GetGovernment.GetRulerTitle]. L'altra fazione, invece, favorisce l'ordine esistente ed è decisamente [ShowSocietyDirectionName('traditionalist')]."
 flavor_kor.20.desc_gwan_hak_jeol_eui: "$flavor_kor.20.desc$\n\n$kor_description_of_early_factions$"
 flavor_kor.20.a: "Abbiamo le nostre preferenze."
 flavor_kor.20.b: "La scelta è già stata fatta!"
 kor_until_ruler_death: "il tempo che intercorre fino alla scelta di un'altra fazione coreana"

 kor_faction_name_sarim: "Sarim"
 kor_faction_name_hungu: "Hungu"
 kor_faction_name_jeol_eui: "Jeol-Eui"
 kor_faction_name_gwan_hak: "Gwan-Hak"

 flavor_kor.21.title: "Formazione dei $kor_faction_name_jeol_eui$ e $kor_faction_name_gwan_hak$"
 flavor_kor.21.entry: "$flavor_kor.21.title$"
 flavor_kor.21.desc: "Recenti cambiamenti nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno portato a una spaccatura tra i burocrati su linee ideologiche, dando origine a due fazioni molto diverse tra loro. $kor_description_of_early_factions$"
 flavor_kor.21.a: "Ne terremo conto."

 flavor_kor.22.title: "Formazione delle Fazioni $kor_faction_name_sarim$ e $kor_faction_name_hungu$"
 flavor_kor.22.entry: "$flavor_kor.22.title$"
 flavor_kor.22.desc: "Eventi recenti hanno portato al collasso della fazione [ShowModifier('kor_support_gwan_hak_modifier')]. Molti dei suoi ex membri se ne sono andati per formare il [ShowModifier('kor_support_hungu_modifier')], una nuova fazione che combina i principi del $kor_faction_name_gwan_hak$ con una forte attenzione all'autorità del [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Il resto del $kor_faction_name_hungu$ si è unito all'ex fazione [ShowModifier('kor_support_jeol_eui_modifier')], che ha subito dei cambiamenti che l'hanno portata a diventare la nuova fazione [ShowModifier('kor_support_sarim_modifier')]."
 flavor_kor.22.a: "$flavor_kor.21.a$"
 has_korean_factionalism_tt: "Il Fazionalismo di Corte è Emerso"

 flavor_kor.23.title: "La Capitale Meridionale"
 flavor_kor.23.entry: "$flavor_kor.23.title$"
 flavor_kor.23.desc: "Il [target_location.GetRank.GetName] di [target_location.GetName] sta vivendo un'epoca di crescita senza precedenti. Data questa circostanza, alcuni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] propongono di trasferire lì la capitale e di rinominare il [target_location.GetRank.GetNameWithNoTooltip] in $hanseong$. Tuttavia, va detto che vi è anche un certo merito nel restare a [current_capital.GetName]."
 flavor_kor.23.a: "Trasferiamoci definitivamente nella Capitale Meridionale."
 flavor_kor.23.b: "Restiamo a [current_capital.GetNameWithNoTooltip]."
 flavor_kor.23.b.entry: "Restiamo nella capitale."

 flavor_kor.24.title: "Una Campagna Contro [target_country.GetNameWithNoTooltip]"
 flavor_kor.24.entry: "Una campagna contro i $jurchen_group$"
 flavor_kor.24.desc: "Dalla caduta dello stato di Balhae, gran parte dell'antico nord [ShowCultureName('korean_culture')] è stata invasa da tribù [ShowCultureGroupName('mongolian_group')] e [ShowCultureGroupName('jurchen_group')]. Con le nostre catene spezzate e una nuova volontà di espandere il nostro dominio, siamo entrati in conflitto con [target_country.GetName], le cui terre in [target_province.GetName] si trovano sul nostro cammino verso la catena montuosa settentrionale."
 flavor_kor.24.a: "Allora dovremo scacciarli!"
 flavor_kor.24.b: "Una simile guerra non porterà altro che miseria [ROOT.GetCountry.Custom('IT_PEASANTS_AL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]."
 flavor_kor.24.b.entry: "Una simile guerra non porterà altro che miseria al $peasants_estate$."

 flavor_kor.25.title: "[target_character.GetNameWithNoTooltip]"
 flavor_kor.25.entry: "Heo Nanseolheon, Poetessa Coreana"
 flavor_kor.25.desc: "Una delle artiste più rinomate del nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha recentemente composto un'altra poesia. Il suo nome è [target_character.GetName] e ha prodotto molte grandi opere nel corso della sua presenza al [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Fin dall'infanzia è stata considerata un prodigio, ma il suo status di [target_character.GetWomanMan] è stato un ostacolo alla sua ascesa nella nostra società. Non dovremmo lasciare che un simile talento vada sprecato."
 flavor_kor.25.a: "Offriamole il nostro patrocinio."
 flavor_kor.25.b: "Interessante, ma non esattamente un uso sensato del nostro denaro."

 flavor_kor.26.title: "La Tassa Uniforme sulla Terra"
 flavor_kor.26.entry: "$flavor_kor.26.title$"
 flavor_kor.26.desc: "Il nostro sistema fiscale obsoleto ha gravato pesantemente su [ROOT.GetCountry.Custom('IT_PEASANTS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], colpito in modo sproporzionato. Per rimediare a ciò, è stata proposta una riforma sotto il nome di [ShowGovernmentReformName('kor_daedongbeob')], ovvero la Legge della Tassa Uniforme sulla Terra, che migliorerebbe il regime fiscale e permetterebbe allo Stato di ottenere di più dalle tasse che già riscuote. [ROOT.GetCountry.Custom('IT_PEASANTS_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] non avrebbe più bisogno di vendere le proprie terre [ROOT.GetCountry.Custom('IT_NOBLES_AL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] nella speranza di uscire dal registro fiscale."
 flavor_kor.26.historical_info: "L'economia coreana era in pessime condizioni verso il XVII secolo e, per rimediare a questa situazione, il Primo Consigliere di Stato Yi Won-ik introdusse gradualmente riforme fiscali precedentemente ignorate. La tassa di tributo imposta sulle famiglie fu sostituita da un'imposta unificata sulla terra coltivabile. La tassa sui beni fu limitata a una quota che permise a contadini e grossisti intraprendenti di produrre e vendere beni in eccedenza. L'effetto netto fu una riduzione delle tasse per i contadini, un aumento delle entrate per lo Stato e una crescita del commercio."
 flavor_kor.26.a: "Istituiamo la riforma."
 flavor_kor.26.b: "La riconsidereremo in futuro."

 flavor_kor.27.title: "Il Futuro Fiscale [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_kor.27.entry: "$flavor_kor.27.title$"
 flavor_kor.27.desc: "Secondo i membri del nostro gabinetto, la società [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] sembra orientarsi verso un'economia più agricola. I vasi d'argento chiamati #italic eunbyeong#! stanno diventando cosa del passato, e si rende necessaria una riforma fiscale per evitare che la nostra economia collassi. Attualmente, la nostra situazione economica è sostenuta da [ShowPolicyName('kor_chinese_currency')], che potremmo utilizzare più spesso. In alternativa, potrebbe essere utile istituire una nostra valuta sotto forma di [ShowPolicyName('kor_metal_coinage')]. Potremmo anche adottare un approccio molto diverso, ossia la creazione di una moneta cartacea, [ShowPolicyName('kor_jeohwa')], nella speranza di favorire un ambiente più commerciale. Infine, se queste misure fossero destinate a fallire, un [ShowPolicyName('kor_barter_economy')] non sarebbe poi così negativo come potrebbe sembrare."
 flavor_kor.27.a: "Orientiamoci verso [ShowPolicyNameWithNoTooltip('kor_metal_coinage')]."
 flavor_kor.27.b: "Importare [ShowPolicyNameWithNoTooltip('kor_chinese_currency')] potrebbe essere necessario."
 flavor_kor.27.c: "Stampiamo il [ShowPolicyNameWithNoTooltip('kor_jeohwa')]."
 flavor_kor.27.d: "[ShowPolicyNameWithNoTooltip('kor_barter_economy')|U] non è un destino così terribile."

 flavor_kor.28.title: "$STATIC_MODIFIER_NAME_kor_hall_of_worthies_modifier$"
 flavor_kor.28.entry: "$flavor_kor.28.title$"
 flavor_kor.28.desc: "Per servire come principio guida per [target_character.GetName] e per i suoi successori, il [ROOT.GetCountry.GetGovernment.GetRulerTitle] desidera creare l'istituzione del [ShowModifier('kor_hall_of_worthies_modifier')], un istituto di ricerca composto dagli studiosi più illustri ed eccellenti del nostro [ROOT.GetCountry.GetFlavorRank]. Con un adeguato finanziamento, potremo fare grandi progressi nella scienza e nell'arte di governo."
 flavor_kor.28.a: "Istituiamo il $flavor_kor.28.title$."
 flavor_kor.28.b: "Non possiamo spendere altro denaro."

 flavor_kor.29.title: "$veritable_records_of_joseon$"
 flavor_kor.29.entry: "$flavor_kor.29.title$"
 flavor_kor.29.desc: "I potenti stati di $china$ producono e conservano resoconti dettagliati della storia delle dinastie precedenti, intitolati gli Annali Veritieri. La creazione di tali opere permette ai successivi sovrani del [GetInternationalOrganization('middle_kingdom').GetName] di analizzare criticamente i fallimenti e i successi dei loro predecessori. Anche noi potremmo servirci di una [ShowWorkOfArtTypeName('chronicle')] per conservare informazioni sul regno del nostro [ROOT.GetCountry.GetGovernment.GetRulerTitle]. A differenza dei nostri vicini, però, la terremmo aggiornata regolarmente."
 flavor_kor.29.a: "Finanziamo la [ShowWorkOfArtTypeNameWithNoTooltip('chronicle')]."
 flavor_kor.29.b: "Non possiamo permetterci ulteriori spese."

 flavor_kor.30.title: "[target_character.GetNameWithNoTooltip] Cade da Cavallo"
 flavor_kor.30.entry: "Un Sovrano Cade da Cavallo"
 flavor_kor.30.desc: "Era un giorno come tanti altri. [target_character.GetName] era a caccia, in sella al suo cavallo. Tutto procedeva senza intoppi, come sempre, finché la cavalcatura [ROOT.GetCountry.GetGovernment.Custom('IT_ADJ_FS')] non inciampò improvvisamente, gettando [target_character.GetShortNameWithNoTooltip] a terra in modo davvero spettacolare. [target_character.GetSheHe|U] era, naturalmente, accompagnato dalla sua corte, incluso il cronista capo. È prassi che l'episodio venga registrato nel [target_work_of_art.GetName], per quanto imbarazzante possa essere. Il [ROOT.GetCountry.GetGovernment.GetRulerTitle] preferirebbe tuttavia che questo evento non venisse incluso."
 flavor_kor.30.a: "\"E [target_character.GetNameWithNoTooltip] chiese che questo non venisse registrato.\"."
 flavor_kor.30.a.entry: "\"E chiese che questo non venisse registrato.\"."
 flavor_kor.30.b: "Impediamo al cronista di scrivere questo!"

 flavor_kor.31.title: "Il Seonggyungwan"
 flavor_kor.31.entry: "$flavor_kor.31.title$"
 flavor_kor.31.desc: "La [ShowLawName('imperial_examination_law')] necessita di nuovi studenti. Per soddisfare la quota di reclutamento per le nostre posizioni governative, creiamo un'istituzione a [target_location.GetName], la nostra capitale, affinché serva da luogo in cui la meritocrazia possa risplendere e i migliori tra i migliori possano essere selezionati."
 flavor_kor.31.a: "Fondiamo l'istituzione."
 flavor_kor.31.b: "Non possiamo permetterci questa spesa."

 flavor_kor.32.title: "Un Pericoloso Ammutinamento"
 flavor_kor.32.entry: "$flavor_kor.32.title$"
 flavor_kor.32.desc: "Uno dei nostri generali, [target_character.GetName], fortemente deluso dalle azioni di [ROOT.GetCountry.GetGovernment.GetRuler.GetName], ha deciso di prendere in mano le redini e si è armato in un feroce ammutinamento contro il nostro [ROOT.GetCountry.GetFlavorRank]! Il [target_country.GetLongName] si è ora armato contro di noi a [target_location.GetName]."
 flavor_kor.32.a: "Maledetti traditori!"
 kor_mutiny: "[target_character.GetName] ha scatenato un ammutinamento in [target_country.GetName]."

 flavor_kor.33.title: "$tongguk_tonggam$"
 flavor_kor.33.entry: "$flavor_kor.33.title$"
 flavor_kor.33.desc: "La storia antica [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] resta avvolta in molti misteri, e i fatti continueranno a scomparire dalla conoscenza comune se non si interviene. Per contrastare ciò, [target_character.GetName] ha iniziato il processo di compilazione della storia antica di [ShowRegionName('korea_region')], ma necessita di ulteriori fondi per completarlo. La [ShowWorkOfArtTypeName('chronicle')] risultante si intitolerebbe $tongguk_tonggam$."
 flavor_kor.33.a: "Sosteniamo [target_character.GetShortNameWithNoTooltip]."
 flavor_kor.33.a.entry: "Sosteniamolo."
 flavor_kor.33.b: "Concentriamoci su altre questioni."

 flavor_kor.34.title: "Disordini nei Tre Porti"
 flavor_kor.34.entry: "$flavor_kor.34.title$"
 flavor_kor.34.desc: "Permettiamo ai mercanti [ShowCultureGroupName('japanese_group')] di commerciare in quantità limitate in alcuni dei porti meridionali di [ShowRegionName('korea_region')], in particolare il [target_location.GetRank.GetName] di [target_location.GetName]. Nonostante la nostra benevolenza, i mercanti locali in visita restano ingrati, e si sono armati dopo essere stati esclusi dalle nostre agevolazioni fiscali. Fortunatamente, questa sanguinosa rivolta è stata sedata dal nostro esercito e abbiamo ripristinato il controllo sul [target_location.GetRank.GetNameWithNoTooltip]. Questo non basta tuttavia [ROOT.GetCountry.Custom('IT_BURGHERS_AL_NOSTRO')][ROOT.GetCountry.Custom('IT_BURGHERS_NOSTRO')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], che chiede misure più severe contro i rivoltosi."
 flavor_kor.34.a: "Riduciamo i privilegi commerciali dei [ShowCultureGroupNameWithNoTooltip('japanese_group')]."
 flavor_kor.34.b: "Cerchiamo di distendere le tensioni."

 kor_japanese_riot: "Rivolta dei [ShowCultureGroupNameWithNoTooltip('japanese_group')]"

 flavor_kor.35.title: "$kor_cloud_dream_of_nine$"
 flavor_kor.35.entry: "$flavor_kor.35.title$"
 flavor_kor.35.desc: "Un [ShowWorkOfArtTypeName('novel')] intitolato $kor_cloud_dream_of_nine$ ha iniziato a diffondersi nel nostro [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Scritto in [ShowAdvanceName('kor_hangeul_alphabet')], è diventato piuttosto rinomato tra i nostri studiosi. Il suo autore è sconosciuto, ma si ritiene ampiamente che sia [target_character.GetName], che ha da allora negato ogni attribuzione di paternità. Sebbene si creda che sia un'opera ben scritta, l'atto di scrivere un romanzo fantastico in quell'alfabeto non sarebbe visto troppo positivamente."
 flavor_kor.35.a: "È davvero meraviglioso!"
 flavor_kor.35.b: "Davvero vergognoso! Non possiamo permettere che simili confini vengano infranti."

 flavor_kor.36.title: "L'Ufficio degli Interpreti"
 flavor_kor.36.entry: "$flavor_kor.36.title$"
 flavor_kor.36.desc: "Nonostante tutta l'assimilazione culturale, la lingua [ROOT.GetCountry.GetCulture.GetLanguage.GetName] resta incomprensibile a tutti i nostri vicini. Data questa mancanza di intelligibilità, la diplomazia con altri Stati risulta piuttosto difficile, e tutte le missioni, in entrata e in uscita, devono essere accompagnate da interpreti in grado di superare questi ostacoli. Tale è l'importanza di questo aspetto, che il [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective] ha concluso che abbiamo bisogno di un'istituzione professionale per la formazione di interpreti, a supporto delle nostre missioni diplomatiche e tributarie."
 flavor_kor.36.a: "Fondiamo il [ShowModifierWithNoTooltip('kor_sayeogwon')]."
 flavor_kor.36.b: "Faremo senza di loro."

 flavor_kor.37.title: "Una Critica al [ShowReligionGroupNameWithNoTooltip('buddhist')]"
 flavor_kor.37.entry: "Una Critica al Buddhismo"
 flavor_kor.37.desc: "Uno dei nostri studiosi associati a [target_international_organization.GetName] ha recentemente prodotto un grande trattato che espone diversi argomenti polemici contro i principi del [ShowReligionGroupName('buddhist')]. La pubblicazione di 'Una Serie di Critiche al Buddhismo' segna un punto di svolta, poiché ora possiamo essere certi che la società [ROOT.GetCountry.Custom('IT_ADJ_FS')] si stia lentamente orientando verso le credenze di [target_international_organization.GetNameWithNoTooltip]."
 flavor_kor.37.a: "Promuoviamo il trattato in lungo e in largo."
 flavor_kor.37.b: "Condanniamo l'opera."
 KOR_increase_favor_of_confucianism: "Il [international_organization_variable|e] $sect_favor$ di [target_international_organization.GetName] aumenterà del #g +5.0%#!."

 flavor_kor.38.title: "Contesa tra Principi"
 flavor_kor.38.entry: "$flavor_kor.38.title$"
 flavor_kor.38.desc: "La successione di [ROOT.GetCountry.GetGovernment.GetRuler.GetName] è tutt'altro che sicura. Sebbene [target_character2.GetName] resti nominalmente il [ROOT.GetCountry.GetGovernment.GetHeirTitle], le tensioni nel [ROOT.GetCountry.GetGovernment.GetCourtTitle] restano alte. Questo perché molti ministri credono che [target_character.GetName] abbia ambizioni maggiori di quelle del suo parente. Sebbene non sia ancora scoppiata alcuna violenza, i due sono destinati a scontrarsi, a meno che non si intervenga prima."
 flavor_kor.38.a: "Sosteniamo [target_character.GetShortNameWithNoTooltip]."
 flavor_kor.38.a.entry: "Sosteniamolo."
 flavor_kor.38.b: "Favoriamo invece il [ROOT.GetCountry.GetGovernment.GetHeirTitle], [target_character2.GetNameWithNoTooltip]."
 flavor_kor.38.b.entry: "Favoriamo invece il nostro erede."

 flavor_kor.39.title: "Al Servizio del [GetInternationalOrganization('middle_kingdom').GetNameWithNoTooltip]"
 flavor_kor.39.entry: "Al Servizio del Regno di Mezzo"
 flavor_kor.39.desc: "Per gran parte dei secoli passati, i predecessori [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] hanno vissuto e operato in sottomissione agli stati di $china$. Questo ha senso, poiché le risorse detenute dal [GetInternationalOrganization('middle_kingdom').GetName] sono vaste, e un'aperta ostilità servirebbe solo a nuocere agli interessi di entrambe le parti. Tale sottomissione era reciprocamente vantaggiosa per entrambe le parti, ma ci ha anche posto nella scomoda posizione di parte minore, avvicinando la cultura [ShowCultureName('korean_culture')] al [ShowCultureGroupName('chinese_group')] piuttosto che il contrario."
 flavor_kor.39.a: "Abbracciamo pienamente questa politica."
 flavor_kor.39.b: "Non resteremo più all'ombra di $china$."

 flavor_kor.40.title: "Il Divieto degli Eserciti Privati"
 flavor_kor.40.entry: "$flavor_kor.40.title$"
 flavor_kor.40.desc: "Attualmente, i militari [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName], per la maggior parte membri [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], sono pienamente nel loro diritto di possedere e gestire eserciti privati. Ciò comporta un rischio significativo per il nostro [ROOT.GetCountry.GetFlavorRank] e potrebbe portare a colpi di Stato, guerre civili e altre forme di disordine in futuro. Questo stato di cose è stato al centro di politiche di [ShowSocietyDirectionName('centralization')] guidate dal governo di [target_character.GetName]. I [ShowEstatePrivilegeName('noble_armies')] devono essere limitati."
 flavor_kor.40.a: "Procediamo con le restrizioni."
 flavor_kor.40.b: "Questo deve essere fermato."

 flavor_kor.41.title: "Resistenza contro [ShowAdvanceNameWithNoTooltip('kor_hangeul_alphabet')]"
 flavor_kor.41.entry: "Resistenza contro $kor_hangeul_alphabet$"
 flavor_kor.41.desc: "L'invenzione di [ShowAdvanceName('kor_hangeul_alphabet')] è stata di grande beneficio per il popolo comune della società [ROOT.GetCountry.Custom('IT_ADJ_FS')]. A differenza della scrittura straniera [ShowCultureGroupName('chinese_group')], conosciuta in [ROOT.GetCountry.GetNameWithNoTooltip] come #italic Hanja#!, l'alfabeto è facile da imparare, migliorando i tassi di alfabetizzazione in tutto il nostro [ROOT.GetCountry.GetFlavorRank]. Questa diffusione di competenze così basilari non è stata però priva di resistenze, poiché le élite, per la maggior parte membri [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], si sono opposte alla nuova invenzione."
 flavor_kor.41.a: "Ignoriamo [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 flavor_kor.41.a.entry: "Ignoriamo il $nobles_estate$."
 flavor_kor.41.b: "Placchiamo le élite."

 flavor_kor.100.title: "[korRuler.GetNameWithNoTooltip]'s Northern Expedition"
 flavor_kor.100.entry: "La Spedizione Settentrionale del Sovrano"
 flavor_kor.100.desc: "[korRuler.GetName] progetta di lanciare una spedizione settentrionale per punire il popolo [ShowCultureGroupName('jurchen_group')]. Ciò richiederà notevoli preparativi, fondi, ed è impossibile mantenere il segreto. [korRuler.GetSheHe|U] intende rafforzare le difese [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] aumentando e migliorando l'addestramento e potenziando le nostre fortezze."
 flavor_kor.100.a: "Prepariamoci alla guerra."
 
 flavor_kor.101.title: "La Prima Purga dei Letterati"
 flavor_kor.101.entry: "$flavor_kor.101.title$"
 flavor_kor.101.desc: "Mentre serviva come Terzo Censore nel [GetCurrentYear], il Neo-Confuciano [target_character.GetName], ex storico di Stato, ha dimostrato di essere un uomo disposto ad arrivare a grandi estremi nel criticare i funzionari governativi e l'élite [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. I suoi numerosi avversari hanno scoperto alcune allusioni contenute nella sua bozza degli #italic Annali di Re Seongjong#!, che ritengono essere di natura sediziosa. Chiedono la sua immediata esecuzione, e che i suoi sostenitori tra i Neo-Confuciani vengano banditi o giustiziati."
 flavor_kor.101.a: "Giustiziamolo!"
 flavor_kor.101.b: "Purghiamo invece [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]!"
 flavor_kor.101.b.entry: "Purghiamo invece il $nobles_estate$!"
 flavor_kor.101.c: "Dobbiamo mantenere l'equilibrio politico."
 kor_no_literati_purges_yet_tt: "Non è Avvenuta Nessuna Purga dei Letterati"

 flavor_kor.102.title: "La Seconda Purga dei Letterati"
 flavor_kor.102.entry: "$flavor_kor.102.title$"
 flavor_kor.102.desc: "Durante un banchetto di Stato, il Ministro dei Riti [target_character.GetName] ha versato del vino sulle vesti del [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Giungendo com'è dopo un periodo di intensa rivalità tra fazioni e critiche all'autorità reale, gli oppositori di [target_character.GetNameWithNoTooltip] si sono affrettati a interpretare l'episodio come un crimine contro il sovrano, e quindi sedizioso. Chiedono la purga di [target_character.GetNameWithNoTooltip] e dei suoi numerosi alleati, trasversali alle fazioni. Questo sembra in effetti presentare un'occasione d'oro per liberare il governo da chi osa mettere in discussione l'autorità reale."
 flavor_kor.102.a: "Purghiamo tutti coloro che si oppongono a noi."
 flavor_kor.102.b: "Dobbiamo mantenere l'equilibrio politico."
 kor_one_literati_purge_passed_tt: "È Avvenuta la Prima Purga dei Letterati"

 flavor_kor.103.title: "La Terza Purga dei Letterati"
 flavor_kor.103.entry: "$flavor_kor.103.title$"
 flavor_kor.103.desc: "[jo_gwang_jo.GetName], un riformatore Neo-Confuciano, ha tentato di modellare il governo secondo gli ideali confuciani. I suoi successi iniziali nella riforma sembrano tuttavia essersi ritorti contro di lui, dopo essere andato troppo oltre nell'attaccare il vecchio ordine [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], minandone il potere assicurando la preponderanza dei Neo-Confuciani nel governo e facendoli infuriare con le confische di terre proposte.\n\n[ROOT.GetCountry.Custom('IT_NOBLES_IL')|U][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] sostiene ora che [jo_gwang_jo.GetNameWithNoTooltip] sia un traditore che progetta di incoronarsi da solo, e sostiene inoltre che le sue riforme siano sbagliate e danneggeranno la società e le stesse fondamenta dello Stato. Da parte sua, [jo_gwang_jo.GetNameWithNoTooltip] insiste che l'unica linea d'azione corretta sia continuare le riforme con la massima urgenza, nonostante l'opposizione. Da che parte dovremmo schierarci?"
 flavor_kor.103.a: "Purghiamo i Neo-Confuciani!"
 flavor_kor.103.b: "Le riforme devono continuare, a qualunque costo!"
 kor_two_literati_purges_passed_tt: "Sono Avvenute Due Purghe dei Letterati"

 
 flavor_kor.104.title: "[yi_sun_sin.GetNameWithNoTooltip]"
 flavor_kor.104.entry: "Yi Sun Sin"
 flavor_kor.104.desc: "Recentemente, il processo di [yi_sun_sin.GetName] ha attirato molta attenzione negli alti ranghi del nostro esercito. Accusato di diserzione e negligenza, [yi_sun_sin.GetLastNameWithNoTooltip] è stato imprigionato da tempo; eppure, nonostante le frequenti torture, continua a rifiutarsi di ammettere la propria colpa.\n\nInoltre, [yi_sun_sin.GetWomanMan] sembra possedere una comprensione naturale delle questioni militari, e il suo registro di servizio mostra una serie di notevoli successi nel respingere incursioni lungo i nostri confini. La reputazione di disciplina e coraggio di [yi_sun_sin.GetLastNameWithNoTooltip] è incoerente con le accuse rivoltegli, e quindi l'intero processo puzza di un complotto per incastrare [yi_sun_sin.GetWomanMan].\n\nSi parla di retrocederlo al rango di semplice soldato di fanteria, ma di certo i talenti di [yi_sun_sin.GetWomanMan] non dovrebbero essere sprecati in una posizione così modesta."
 flavor_kor.104.a: "Deve essere immediatamente reintegrato come comandante."
 flavor_kor.104.b: "È meglio non intromettersi nel sistema giudiziario."

 flavor_kor.200.title: "Il Comandante-Poeta"
 flavor_kor.200.entry: "$flavor_kor.200.title$"
 flavor_kor.200.desc: "Una voce si sta diffondendo a corte su un brillante giovane di [ShowLocationName('gongju')]. I cortigiani dicono che sia un talentuoso comandante militare e uno straordinario poeta, il cui talento viene sprecato in un'insignificante posizione burocratica in provincia.\n\nDovremmo invitarlo a servire direttamente il [ROOT.GetCountry.GetGovernment.GetRulerTitle]? "
 flavor_kor.200.a: "Invitiamolo a unirsi alla corte."
 flavor_kor.200.b: "Non abbiamo bisogno di altri giovani arrivisti ."
 flavor_kor.201.title: "La Storia [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip]"
 flavor_kor.201.entry: "$flavor_kor.201.title$"
 flavor_kor.201.desc: "[jong_seo.GetName] si è presentato al trono con una proposta. Desidera assumere un gruppo di studiosi che lo aiutino a compilare la storia del nostro grande [ROOT.GetCountry.GetLongName]. Le sue parole sono piene di passione erudita e sostengono che una simile opera non sia solo un beneficio per le generazioni future, ma anche un'opportunità per accrescere il nostro prestigio."
 flavor_kor.201.a: "Finanziamo le sue ricerche."
 flavor_kor.201.b: "Non sprecheremo il nostro oro in libri inutili."

