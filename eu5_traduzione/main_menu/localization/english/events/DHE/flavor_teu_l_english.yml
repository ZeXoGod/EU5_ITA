l_english:
 flavor_teu.1.title: "La Confederazione Prussiana si Rivolta"
 flavor_teu.1.entry: "$flavor_teu.1.title$"
 flavor_teu.1.desc: "Nonostante i nostri migliori sforzi, non siamo riusciti a contenere i tentativi della Confederazione Prussiana di minare il dominio [ROOT.GetCountry.GetAdjective]. Le città che hanno giurato il loro sostegno alla Confederazione hanno raccolto un esercito e si sono sollevate in aperta rivolta. Come sospettavamo, molti dei suoi membri hanno legami con la Polonia e hanno già richiesto l'intervento polacco nel conflitto in arrivo. Sembra che una lotta cruenta in Prussia sia inevitabile, a meno che non rinunciamo al nostro dominio su queste città."
 flavor_teu.1.a: "Uccidiamo ogni ultimo traditore!"
 prussian_confederation_support: "Tutti i [ShowPopTypeName('nobles')] e i [ShowPopTypeName('burghers')] [ShowCultureName('prussian')] in [ShowAreaName('prussia_area')] si uniranno a [prussian_confederation.GetName]"
 flavor_teu.1.tooltip: "[prussian_confederation.GetName] chiederà il Sostegno [GetCountry('POL').GetAdjective]"
 flavor_teu.1.b: "Questa non è una guerra che possiamo vincere."
 prussian_confederation: "Confederazione Prussiana"
 
 
 flavor_teu.2.title: "La Confederazione Prussiana Cerca il Sostegno Polacco"
 flavor_teu.2.entry: "$flavor_teu.2.title$"
 flavor_teu.2.desc: "Un'organizzazione che si definisce [prussian_confederation.GetName] si è sollevata contro le ingiustizie del dominio teutonico! In precedenza abbiamo dato ai suoi membri assicurazioni discrete che avremmo sostenuto la loro causa, se si fosse giunti a una guerra aperta. In cambio, la Confederazione ha concordato che le terre prussiane dovrebbero essere governate dalla Polonia, una volta espulsi i tirannici Cavalieri. Abbiamo molto da guadagnare da questo accordo, ma dovremmo prepararci a una lotta cruenta."
 flavor_teu.2.a: "Avranno il nostro pieno sostegno. Alla battaglia!"
 flavor_teu.2.b: "Non sono affari nostri."
 
 
 flavor_teu.3.title: "La Lega della Lucertola"
 flavor_teu.3.entry: "$flavor_teu.3.title$"
 flavor_teu.3.desc: "Ci è giunta voce che [ROOT.GetCountry.Custom('IT_NOBLES_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] locale di [ShowProvinceDefinitionName('chelmno_province')] si stia organizzando in un'associazione nota come 'Unione della Lucertola'. L'intento ufficiale dell'unione è combattere l'illegalità e proteggere i propri interessi. Sebbene la società possa sembrare legittima nello spirito, alcuni scelgono di credere che la sua vicinanza al confine [GetCountry('POL').GetAdjective] possa essere il segno che si tratti segretamente di un movimento secessionista."
 flavor_teu.3.historical_info: "La Lega della Lucertola, nota in latino come #italic Societas Lacertarum#!, era un'organizzazione di cavalieri prussiani della terra di Chełmno, fondata nel 1397 come fratellanza cavalleresca. In seguito, nel 1410, durante la Battaglia di Grunwald, uno dei fondatori, Nicholas von Renys, abbassò il vessillo del reggimento di Chełmno, spingendo alla ritirata. Dopo l'incidente, i membri dell'Unione furono marchiati come traditori."
 flavor_teu.3.a: "Permettiamo alla Lega di esistere."
 flavor_teu.3.b: "Non tramano nulla di buono!"
 STATIC_MODIFIER_NAME_teu_lizard_league: "Eidechsenbund"

 flavor_teu.4.title: "Omaggio Prussiano"
 flavor_teu.4.entry: "$flavor_teu.4.title$"
 flavor_teu.4.desc: "La disfatta [GetCountry('TEU').Custom('IT_Di')][GetCountry('TEU').GetLongName] ha segnato il ritorno di gran parte della Pomerania sotto il nostro controllo, ma anche la conquista dei territori in [ShowAreaName('prussia_area')]. Sebbene decimati, i Cavalieri [GetCountry('TEU').GetAdjectiveWithNoTooltip] resistono ancora e controllano molte istituzioni nella zona.\n\nPoiché i territori della Prussia Orientale potrebbero essere difficili da integrare, sono state avanzate proposte di costringere l'élite esistente dell'Ordine a secolarizzarsi e a giurare fedeltà davanti a [pol_ruler.GetName]. Con questo schema, i vecchi territori [GetCountry('TEU').Custom('IT_Di')][GetCountry('TEU').GetName] verrebbero divisi in 'Prussia [ROOT.GetCountry.GetGovernment.GetAdjective|U]', direttamente incorporata nella corona, e '[ShowScriptedGeographyName('ducal_prussia_geography')]', detenuta dai Prussiani secolarizzati."
 flavor_teu.4.historical_info: "Dopo la Guerra dei Tredici Anni contro l'Ordine Teutonico nel 1454-1466, la Prussia fu divisa in 'Prussia Reale', detenuta direttamente dal Regno di Polonia, e le province orientali, che rimasero parte dell'ordine come vassallo, note come 'Prussia Ducale'. Nel 1525 lo Stato dell'Ordine Teutonico fu secolarizzato dal suo Hochmeister, Albert von Hohenzollern, diventando noto da allora in poi come 'Ducato di Prussia'."
 flavor_teu.4.a: "Costringiamoli a inchinarsi!"
 flavor_teu.4.b: "Manteniamo lo status quo."
 flavor_teu.4.a.cede_locations_to_ducal_prussia: "Ogni [location|e] [owned|e] in [ShowScriptedGeographyName('ducal_prussia_geography')] verrà ceduta a [ducal_prussia_tag.GetName] e diventerà un suo [core|e]"
 flavor_teu.4.a.integration_in_royal_prussia: "Ogni [location|e] [owned|e] in [ShowScriptedGeographyName('royal_prussia_geography')] otterrà #g +75.0%#! di [integration|e]"

 flavor_teu.5.title: "Fervore Crociato"
 flavor_teu.5.desc: "I Cavalieri [ROOT.GetCountry.GetAdjective] furono invitati in [ShowAreaName('prussia_area')] nel 1226 per volere di [GetCharacter('maz_konrad_i_piast').GetName] di [ShowAreaName('mazovia_area')]. Il loro obiettivo era servire come crociati contro i pagani prussiani del Baltico. Essendo i successori di quei valorosi guerrieri, dobbiamo continuare la crociata contro gli ultimi pagani di [ShowContinentName('europe')] nel [target_nation.GetLongName]!"
 flavor_teu.5.a: "#italic Christ ist erstanden!#!"
 flavor_teu.5.b: "Non abbiamo bisogno di alcun conflitto in questo momento."

 flavor_teu.6.title: "I Pagani [ShowReligionAdjectiveWithNoTooltip('romuva')] a [target_location.GetNameWithNoTooltip]"
 flavor_teu.6.desc: "Il vile paganesimo [ShowReligionAdjective('romuva')] non è da fidarsi. Questi vili pagani, nonostante tutta la gentilezza e l'indulgenza che abbiamo mostrato loro a prescindere dalle loro credenze, hanno inscenato una nuova sollevazione a [target_location.GetName]. Sebbene non sia di grande portata e non richieda la mobilitazione immediata delle nostre forze, resta comunque un fastidio per la nostra sacra missione e deve pertanto essere soffocata. Se simili folle disorganizzate dovessero riunirsi in una forza più grande, il controllo [ROOT.GetCountry.GetAdjective] su queste province pagane potrebbe essere messo a rischio."
 flavor_teu.6.a: "Costruiamo un [ShowBuildingTypeNameWithNoTooltip('castle')] per vigilare su [target_location.GetProvince.GetNameWithNoTooltip]."
 flavor_teu.6.a.entry: "Costruiamo un [ShowBuildingTypeNameWithNoTooltip('castle')] per vigilare sulla provincia."
 flavor_teu.6.b: "Costringiamo il #italic Komtur#! locale a occuparsene."

 teuton_6_event_trigger_information: "Questo [event|e] può attivarsi per i seguenti motivi:\n[ShowTriggerConditionsForScope('teu_event_6_trigger', SCOPE.sLocation('target_location').GetLocation.MakeScope.Self)]"

 flavor_teu.7.title: "Leggi Civiche di [target_location.GetNameWithNoTooltip]"
 flavor_teu.7.entry: "Leggi Civiche di Danzica"
 flavor_teu.7.desc: "Il [target_location.GetRank.GetName] di [target_location.GetName] è la spina dorsale economica e il principale porto commerciale [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetLongName]. Esso, come pochi altri, continua a utilizzare la Legge Civica di $lubeck$ per i suoi profondi legami con [target_country.GetLongName], il che è anche motivo di contesa con i suoi dominatori [ROOT.GetCountry.Custom('IT_ADJ_MP')]. Per porre fine al conflitto, [ROOT.GetCountry.GetNameWithNoTooltip] è disposta a far adottare a [target_location.GetNameWithNoTooltip] il [ShowEstatePrivilegeName('kulm_law')], mantenendo al contempo alcuni privilegi dell'ordine attuale, rafforzando il consiglio locale e concedendogli maggiore autonomia. Una simile risoluzione permetterà al [target_location.GetRank.GetNameWithNoTooltip] di prosperare come polo commerciale nel [target_location.GetMarket.GetName]."
 flavor_teu.7.a: "Spingiamo per questa risoluzione."
 flavor_teu.7.b: "Manteniamo l'ordine attuale."

 flavor_teu.8.title: "Una Recessione Economica"
 flavor_teu.8.entry: "$flavor_teu.8.title$"
 flavor_teu.8.desc: "I tempi recenti sono stati duri per il [ROOT.GetCountry.GetLongName]. Una recessione economica ha portato all'impoverimento di molti membri [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')], e le casse [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetNameWithNoTooltip] si stanno preoccupantemente svuotando. Un simile scenario è già un incubo, e potrebbe peggiorare ulteriormente se non si interviene. Per evitare una situazione in cui dovremo contrarre ulteriori debiti per sostenere i pagamenti esistenti, potremmo forse considerare di imporre una nuova tassa sui nostri possedimenti sparsi in tutta [ShowContinentName('europe')]. Una simile mossa non sarebbe esattamente senza precedenti, ma l'entità della tassa imposta potrebbe esserlo. A cosa serve un [ShowBuildingTypeName('order_commandery')] se non ci porta alcun beneficio?"
 flavor_teu.8.a: "Imponiamo una tassa considerevole."
 flavor_teu.8.b: "Imponiamo loro un importo modesto."
 flavor_teu.8.c: "Troveremo un'altra fonte di reddito."

 flavor_teu.12.title: "Il Monopolio dell'[ShowGoodsNameWithNoTooltip('amber')]"
 flavor_teu.12.entry: "Il Monopolio dell'Ambra"
 flavor_teu.12.desc: "Il [ROOT.GetCountry.GetLongName] possiede molte risorse e ricchezze naturali, ma poche sono tanto significative e ricercate quanto [target_goods.GetName]. Per questo motivo il nostro [ROOT.GetCountry.GetFlavorRank] lo ha posto sotto la giurisdizione [ROOT.GetCountry.Custom('IT_ADJ_FS')] e continuerà a trattarlo come un pregiato monopolio. Tuttavia, un simile protezionismo rischia di irritare [ROOT.GetCountry.Custom('IT_BURGHERS_IL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], che desidera essere incluso in questo commercio e potrebbe trarre grande beneficio dal commerciare una risorsa così preziosa."
 flavor_teu.12.a: "Rafforziamo il nostro controllo sulla risorsa."
 flavor_teu.12.b: "Divulghiamo il nostro monopolio."
 flavor_teu.12.c: "Concediamolo invece [ROOT.GetCountry.Custom('IT_PEASANTS_AL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]."
 flavor_teu.12.c.entry: "Concediamolo invece al $peasants_estate$."
 governmental_monopoly_renewed: "Monopolio Governativo Rinnovato"

 flavor_teu.13.title: "[target_character.GetNameWithNoTooltip]"
 flavor_teu.13.entry: "Dorothea von Montau, Anacoreta"
 flavor_teu.13.desc: "Abbiamo ricevuto notizia di una certa anacoreta di nome [target_character.GetName], che ha ottenuto rinomanza in tutto il nostro [ROOT.GetCountry.GetFlavorRank] grazie alle sue visioni. Nel corso della sua vita, [target_character.GetShortNameWithNoTooltip] ha vissuto molte rivelazioni che hanno attirato l'attenzione dell'intero [ROOT.GetCountry.GetLongName]. Detto ciò, molti considerano quelle visioni false, mentre altri le credono autentiche. Ci sono persino persone che vorrebbero vederla bruciare al rogo per stregoneria.\n\nAd oggi, [target_character.GetNameWithNoTooltip] ha già sopravvissuto a un processo per stregoneria, sebbene ciò non abbia fermato i suoi nemici dal richiederne un altro."
 flavor_teu.13.a: "Quelle visioni sono davvero affascinanti."
 flavor_teu.13.b: "Ascoltiamo gli appelli dei suoi nemici."

 flavor_teu.14.title: "[target_character.GetNameWithNoTooltip]"
 flavor_teu.14.entry: "Johann von Posilge, Cronista"
 flavor_teu.14.desc: "Un chierico di grande potenziale si è fatto un nome nel nostro [ROOT.GetCountry.GetFlavorRank]. Essendo stato parte del [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective] per lungo tempo, è noto come un abile cronista che potrebbe aiutare a produrre un'opera per colmare le lacune di [target_work_of_art.GetName], prodotta a suo tempo in [target_work_of_art.GetCreationDate] da [target_work_of_art.GetCreator.GetName]."
 flavor_teu.14.a: "Abbiamo bisogno dei suoi servizi!"
 flavor_teu.14.b: "Congediamolo."
 teu_event_within_5_to_10_years: "L'[event|e] si attiverà entro 5-10 anni, a condizione che [target_character.GetName] sia ancora in vita."

 flavor_teu.15.title: "$chronik_des_land_preussens$"
 flavor_teu.15.entry: "$flavor_teu.15.title$"
 flavor_teu.15.desc: "Il lavoro di [target_character.GetName] ha finalmente dato i suoi frutti, poiché ha finalmente completato l'opera della sua vita, [target_work_of_art.GetName], una [ShowWorkOfArtTypeName('chronicle')] che narra la storia del [ROOT.GetCountry.GetLongName] dal 1360 ai giorni nostri."
 flavor_teu.15.a: "[ROOT.GetCountry.Custom('common_string_wonder')]"
 flavor_teu.15.a.entry: "$common_string_marvelous$"

 flavor_teu.16.title: "Il Großschäffer del [ROOT.GetCountry.GetFlavorRank]"
 flavor_teu.16.entry: "$flavor_teu.16.title$"
 flavor_teu.16.desc: "I Großschäffer sono gli amministratori degli interessi commerciali [ROOT.GetCountry.Custom('IT_ADJ_MP')] all'estero. Detengono vaste responsabilità e privilegi, e ricevono il diritto esclusivo di commerciare [ShowGoodsName('wheat')] e [ShowGoodsName('amber')] rispettivamente nei porti di [ShowLocationName('gdansk')] e [ShowLocationName('konigsberg')]. Tali vasti privilegi e la quantità di potere a loro conferita li hanno messi nel mirino [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')], che si oppongono fermamente alle concessioni accordate dal nostro [ROOT.GetCountry.GetFlavorRank] a quei ministri e vorrebbero vedere quei diritti revocati. D'altra parte, il [ROOT.GetCountry.GetGovernment.GetCourtTitle] [ROOT.GetCountry.GetAdjective] è molto compiaciuto dalle entrate che i Großschäffer portano, e vorrebbe vedere concessi ulteriori privilegi."
 flavor_teu.16.a: "Spezziamo il loro monopolio."
 flavor_teu.16.b: "Sfruttiamo l'istituzione."
 flavor_teu.16.c: "Manteniamo lo status quo."

 flavor_teu.17.title: "[target_character.GetNameWithNoTooltip]"
 flavor_teu.17.entry: "Petrus de Grudziadz, Compositore"
 flavor_teu.17.desc: "[target_character.GetName] è un [target_character.GetArtistType.GetName], nato a [target_character.GetBirthLocation.GetName]. Avendo studiato presso l'[ShowBuildingTypeName('university')] di [ShowLocationName('krakow')], è disponibile per essere assunto e ha lavorato per molte diverse figure politiche in tutta [ShowContinentName('europe')]. Forse dovremmo richiedere anche i suoi servizi."
 flavor_teu.17.a: "Facciamoci mecenati del [target_character.GetArtistType.GetNameWithNoTooltip]."
 flavor_teu.17.a.entry: "Facciamoci mecenati dell'artista."
 flavor_teu.17.b: "Non possiamo permetterci simili spese."

 flavor_teu.100.title: "La Crociata Prussiana"
 flavor_teu.100.desc: "Anni fa, i gloriosi crociati del Baltico proclamarono la loro Crociata Prussiana per la gloria di Cristo. Molti uomini risposero al richiamo, e uno di essi fu l'orgoglio della Corona [ROOT.GetCountry.GetAdjective]: [target.GetName]."
 flavor_teu.100.desc.crusader_returns: "$flavor_teu.100.desc$\n\nSangue fu versato, Prestigio fu guadagnato e l'Onore fu difeso, mentre gli infedeli e gli empi pagani tremavano di paura davanti alla sua sacra furia. Ora è tornato tra le amorevoli braccia del suo magnifico [ROOT.GetCountry.GetFlavorRank]!"
 flavor_teu.100.desc.crusader_dead: "$flavor_teu.100.desc$\n\nSebbene il nostro [ROOT.GetCountry.GetFlavorRank] avesse riposto grande fede nel cavaliere, il Signore aveva altri piani per lui. Con tattiche spietate e vili, gli esecrati pagani abbatterono il potente crociato. Il popolo [ROOT.GetCountry.GetAdjectiveWithNoTooltip] piange la sua morte."
 flavor_teu.100.desc.fallback: "Le leggende raccontano che vi fu un tempo un cavaliere scelto dalla Corona [ROOT.GetCountry.GetAdjective] per partecipare alla Crociata Prussiana.\n\nTuttavia, come per tutte le leggende, anche questa storia non è altro che una fiaba ben raccontata."
 flavor_teu.100.a: "Che sia un esempio per molti altri cavalieri!"
 flavor_teu.100.b: "Quei selvaggi sanguineranno per questo!"
 flavor_teu.100.c: "È comunque una grande storia."

 flavor_teu.101.title: "Morte di un Crociato"
 target: "[target.GetName]"
 flavor_teu.101.desc.infection_death: "Il popolare crociato [target.GetName] ha lottato per giorni contro una grave febbre. Sebbene il [ROOT.GetCountry.GetGovernment.GetRulerTitle] gli avesse consigliato di tornare a casa, il crociato ha insistito nel restare per la gloria. Ma alla fine, tutto ciò che ha ottenuto è stato l'abbraccio della Morte."
 flavor_teu.101.desc.training_accident_death: "La tragedia ha colpito le caserme [ROOT.GetCountry.GetAdjective]! Durante le ore di addestramento, il crociato [target.GetName] si è battuto con uno scudiero nella speranza di migliorare le proprie abilità marziali e quelle del giovane, dando luogo a un vero scontro con la spada. Sfortunatamente per il nobile, lo scudiero ha alzato troppo la spada e ha decapitato [target.GetNameWithNoTooltip]. È morto sul colpo."
 flavor_teu.101.desc.river_drowning_death: "Una delle caratteristiche fondamentali dei nostri cavalieri è l'armatura pesante. Sebbene renda le nostre truppe virtualmente invincibili ai fendenti, ha anche i suoi svantaggi. Uno di questi, mostratosi nuovamente, è la sua scarsa praticità in acqua. Una volta che un cavaliere cade nel fiume, l'armatura di metallo diventa la sua tomba d'acqua.\n\nIl crociato [target.GetName] ha imparato questa lezione a proprie spese quando, durante una cavalcata con i suoi compagni cavalieri per razziare i villaggi degli infedeli, è caduto da cavallo in un fiume ed è annegato."
 flavor_teu.101.desc.fallback: "Il crociato straniero, [target.GetName], è stato trovato morto nel suo letto questa stessa mattina. La causa della morte è un mistero per tutti, poiché la sera prima era ancora vivo e in salute, e non vi sono nemmeno segni di una morte violenta..."
 flavor_teu.101.a: "Che la sua anima riposi in pace."
 flavor_teu.101.b: "Almeno sappiamo che lo scudiero sa maneggiare efficacemente una lama."
 flavor_teu.101.c: "Un destino infausto ma comune."
 flavor_teu.101.zzz: "Solo il Signore sa cosa gli sia accaduto..."
 flavor_teu.102.title: "$flavor_teu.101.title$"
 flavor_teu.102.entry: "$flavor_teu.102.title$"
 flavor_teu.102.desc: "$flavor_teu.100.desc.crusader_dead$"
 flavor_teu.102.a: "Queste sono certamente notizie spiacevoli."

 flavor_pol_teu.1.title: "Il Giudizio del 1339"
 flavor_pol_teu.1.entry: "$flavor_pol_teu.1.title$"
 flavor_pol_teu.1.desc: "Nel 1335 abbiamo presentato una denuncia contro [GetCountry('TEU').GetName] al [GetCountry('PAP').GetGovernment.GetCourtTitle] [GetCountry('PAP').GetAdjective]. Dopo anni di attesa, la commissione [GetCountry('PAP').GetAdjectiveWithNoTooltip] è finalmente arrivata e il processo di deliberazione è iniziato. Come ci aspettavamo, i giudici hanno accolto la nostra solenne denuncia e dichiarato che [GetCountry('TEU').GetNameWithNoTooltip] debba restituire le province di [ShowProvinceDefinitionName('danzig_province')], [ShowProvinceDefinitionName('tuchola_province')], [ShowProvinceDefinitionName('kuyavia_province')], [ShowProvinceDefinitionName('dobrzyn_province')] e [ShowProvinceDefinitionName('stolp_province')]."
 flavor_pol_teu.1.historical_info: "Sia nel 1319 che nel 1335, la parte polacca presentò denunce contro l'Ordine Teutonico presso la Corte Papale, chiedendo la restituzione della 'Pomerania di Danzica' alla Polonia. Nel caso della denuncia del 1335, la commissione inviata dallo Stato Pontificio determinò che l'aggressione teutonica era ingiusta e che le terre dovevano essere restituite, con il pagamento di una somma riparatoria. L'Ordine Teutonico fece appello a quella decisione e, dopo la deliberazione papale, fu costretto a restituire solo i territori occupati, Bydgoszcz e Dobrzyń."
 flavor_pol_teu.1.a: "E pensavamo che la giustizia fosse morta..."

 flavor_pol_teu.2.title: "$flavor_pol_teu.1.title$"
 flavor_pol_teu.2.desc: "Un'altra sentenza del tribunale! Proprio come nel 1319, nel 1335 [pol_polish_side.GetName] ha presentato un'altra denuncia al Santo Padre, nella speranza di ottenere un risultato che ci umiliasse e ci costringesse a rinunciare alle nostre giuste conquiste. Ebbene, la commissione [GetCountry('PAP').GetAdjective], sicuramente corrotta, ha emesso un'altra ridicola sentenza, stabilendo che dobbiamo restituire le province di [ShowProvinceDefinitionName('danzig_province')], [ShowProvinceDefinitionName('tuchola_province')], [ShowProvinceDefinitionName('dobrzyn_province')], [ShowProvinceDefinitionName('kuyavia_province')] e [ShowProvinceDefinitionName('stolp_province')] al [pol_polish_side.GetLongNameWithNoTooltip]."
 flavor_pol_teu.2.a: "Questo è assurdo! Dobbiamo fare appello immediatamente al [GetCountry('PAP').GetGovernment.GetRulerTitle]."
 flavor_pol_teu.2.a.entry: "Questo è assurdo! Dobbiamo fare appello a lui immediatamente."
 flavor_pol_teu.2.b: "Non contesteremo la legittimità di una commissione [GetCountry('PAP').GetAdjectiveWithNoTooltip]."
 flavor_pol_teu.2.b.entry: "Non contesteremo la legittimità di una commissione $PAP_ADJ$."
 flavor_pol_teu.2.c: "Non cederemo loro nulla!"

 flavor_pol_teu.3.title: "Conflitto tra [pol_polish_side.GetNameWithNoTooltip] e [pol_teutonic_side.GetNameWithNoTooltip]"
 flavor_pol_teu.3.desc: "La politica tra [pol_polish_side.GetName] e [pol_teutonic_side.GetName] è accesa come sempre. La conquista [pol_teutonic_side.GetAdjectiveWithNoTooltip] della Pomerania ha lasciato l'amaro in bocca ai [pol_polish_side.GetAdjectiveWithNoTooltip], spingendoli a tediarci con molteplici denunce contro i Cavalieri.\n\nUna recente indagine della nostra commissione in [pol_polish_side.GetNameWithNoTooltip] ha dichiarato che la parte [pol_teutonic_side.GetAdjectiveWithNoTooltip] deve cedere vasti tratti di territorio ai [pol_polish_side.GetAdjectiveWithNoTooltip], provocando un appello. Dobbiamo risolvere questa faccenda amichevolmente."
 flavor_pol_teu.3.a: "Cerchiamo una via di mezzo."
 flavor_pol_teu.3.b: "Sono servitori di Cristo e sono assolti."
 flavor_pol_teu.3.c: "Non sapete leggere la sentenza?"
 teu_supported_us: "Ci ha Sostenuto"
 teu_supported_other_side: "Si è Rifiutato di Sostenerci"

 flavor_pol_teu.4.title: "Risposta [pol_teutonic_side.GetAdjectiveWithNoTooltip]"
 flavor_pol_teu.4.desc: "La risposta [pol_teutonic_side.GetAdjective] è stata, nel migliore dei casi, fredda."
 flavor_pol_teu.4.desc.a: "$flavor_pol_teu.4.desc$ Di fronte al verdetto, hanno deciso che la migliore linea d'azione fosse non cedere al giusto giudizio della commissione [GetCountry('PAP').GetAdjective]. Hanno invece deciso di tediare il Santo Padre con un appello. Che spreco di tempo sacro."
 flavor_pol_teu.4.desc.b: "$flavor_pol_teu.4.desc$ Detto ciò, la pressione è stata troppo forte da resistere, e hanno finalmente ceduto alle nostre richieste, restituendoci i territori."
 flavor_pol_teu.4.desc.c: "$flavor_pol_teu.4.desc$ Detto ciò, hanno effettivamente ceduto a parte delle nostre richieste, sebbene con risultati modesti per noi. L'intervento [GetCountry('PAP').GetAdjective] ha reso vane molte delle nostre denunce, richiedendo che ci vengano restituite solo alcune aree di confine. È comunque, ai nostri occhi, una vittoria."
 flavor_pol_teu.4.desc.d: "$flavor_pol_teu.4.desc$ I presuntuosi cavalieri hanno deciso che nemmeno la volontà divina si applica a loro, sfidando apertamente il giudizio della commissione. Il messaggio è chiaro: non riceveremo quei territori, e l'unica opzione rimasta è una guerra cruenta. Una guerra che perderanno di certo, ce ne assicureremo noi."
 flavor_pol_teu.4.desc.fallback: "$flavor_pol_teu.4.desc$ Non siamo sicuri di cosa pensare della loro reazione, poiché non possiamo determinare le loro vere intenzioni."
 flavor_pol_teu.4.a: "Facciamo sapere al Santo Padre delle loro trasgressioni."
 flavor_pol_teu.4.b: "Di certo una buona scelta da parte loro."
 flavor_pol_teu.4.c: "Otterremo quel che possiamo."
 flavor_pol_teu.4.d: "Ci affronteranno sul campo di battaglia."

 flavor_pol_teu.5.title: "Elogio [GetCountry('PAP').GetAdjectiveWithNoTooltip]"
 flavor_pol_teu.5.desc: "Il nostro appello al Santo Padre è stato un successo clamoroso. Il nostro ricorso e le prove presentate hanno portato [the_pope.GetName] a determinare che siamo nel giusto e che la sua commissione ha agito in malafede. Dopo aver disprezzato la parte [pol_polish_side.GetAdjective], ci ha rassicurato che le nostre acquisizioni appartengono di diritto al [pol_teutonic_side.GetName]. Inoltre, abbiamo ricevuto elogi per il nostro impegno nella diffusione del [ShowReligionGroupName('christian')] e per il continuo sforzo di convertire i pagani alla vera fede."
 flavor_pol_teu.5.a: "E continueremo la nostra crociata!"
 STATIC_MODIFIER_NAME_teu_papal_resolution: "Risoluzione Papale"
 
 flavor_pol_teu.6.title: "Condanna [GetCountry('PAP').GetAdjectiveWithNoTooltip]"
 flavor_pol_teu.6.desc: "È arrivata una lettera da [GetCountry('PAP').GetName], che condanna la nostra decisione di non attenerci al giudizio del 1339. È profondamente deplorevole che [the_pope.GetName] creda che dovremmo fidarci di giudici che erano evidentemente stati corrotti dall'altra parte."
 flavor_pol_teu.6.a: "È quel che è."
 flavor_pol_teu.6.b: "Faremo finta di non aver letto quella lettera."

 flavor_pol_teu.7.title: "Un Deplorevole Giudizio [GetCountry('PAP').GetAdjectiveWithNoTooltip]"
 flavor_pol_teu.7.desc: "Non ci siamo mai sentiti così traditi dal Santo Padre. Appena pochi mesi fa, ci ha inviato i suoi giudici, che hanno analizzato meticolosamente ogni prova e pronunciato un giusto verdetto su questo inquietante conflitto. Ora, quella stessa decisione è stata ribaltata da [the_pope.GetName] in persona, dopo l'appello della parte [pol_teutonic_side.GetAdjective]. Uno spettacolo davvero deludente."
 flavor_pol_teu.7.a: "E il Santo Padre dovrebbe essere infallibile?"

 flavor_pol_teu.8.title: "Una Via di Mezzo"
 flavor_pol_teu.8.desc: "L'inviato del [GetCountry('PAP').GetLongName] è finalmente tornato, portando notizie sul giudizio finale del Santo Padre riguardo alla situazione in cui ci troviamo. Sfortunatamente, la risposta non ci è del tutto favorevole, ma è più lieve di quanto avremmo potuto altrimenti ottenere."
 flavor_pol_teu.8.a: "Almeno è meglio di quanto orchestrato dai polacchi."
 flavor_pol_teu.8.b: "Non cederemo un solo palmo di territorio, chiunque lo richieda!"

 flavor_teu.300.title: "Indifferenza [GetCountry('POL').GetAdjectiveWithNoTooltip]"
 flavor_teu.300.entry: "Indifferenza $POL_ADJ$"
 flavor_teu.300.desc: "Negli ultimi anni, le tensioni con i [GetCountry('POL').GetAdjective] sono andate crescendo. Entrambe le parti ritengono inevitabile una guerra tra loro, eppure nessuna delle due è disposta a essere quella che inizia il conflitto. Fiduciosi riguardo alle intenzioni [GetCountry('POL').GetAdjectiveWithNoTooltip], molti alti funzionari hanno iniziato a chiedere che [teu_ruler.GetName] faccia presentare loro, da parte nostra, due spade sguainate come provocazione."
 flavor_teu.300.historical_info: "Nel 1410, la Polonia ottenne la sua vittoria più decisiva sull'Ordine Teutonico nella Battaglia di Grunwald, durante la cosiddetta Grande Guerra. Si dice che la parte polacca tentò di stancare l'avversario riposando all'ombra dei boschi vicini, e che la battaglia iniziò solo dopo che i Teutoni inviarono un messaggero con due spade sguainate per invitare i polacchi a combattere."
 flavor_teu.300.a: "Se mancano di spade, allora gliene forniremo."
 flavor_teu.300.b: "Lasciamoli stare."

 flavor_teu.301.title: "Due Spade Sguainate"
 flavor_teu.301.desc: "È arrivato un messaggero del [teu_from.GetLongName], in cerca di udienza con il [ROOT.GetCountry.GetGovernment.GetRulerTitle]. Concessa l'occasione, ha posato due spade sguainate, inviate da [teu_ruler.GetName], proprio davanti a [pol_ruler.GetName], come se ci mancasse l'equipaggiamento necessario per spazzare via le loro arroganti facce dalla faccia della terra. Se il [teu_from.GetGovernment.GetRulerTitle] [teu_from.GetAdjectiveWithNoTooltip] vuole la guerra, l'avrà."
 flavor_teu.301.a: "Che insulto meschino."
 POL_after_next_war_is_won: "Dopo aver vinto la prossima guerra contro [teu_from.GetName], riceveremo:"

 flavor_teu.302.title: "Nuove Insegne"
 flavor_teu.302.desc: "Il paio di spade sguainate che abbiamo ricevuto da [GetCountry('TEU').GetName] ha assunto un nuovo valore simbolico. Segno dell'arroganza [GetCountry('TEU').GetAdjectiveWithNoTooltip], la nostra recente campagna punitiva contro di loro le ha trasformate in un ricordo delle nostre vittorie. Sono diventate parte della collezione di insegne [ROOT.GetCountry.GetGovernment.GetAdjective]."
 flavor_teu.302.a: "La vittoria su di loro valeva il sangue versato."

 flavor_swe_teu.1.title: "I [target_country.GetLongNameWithNoTooltip]"
 flavor_swe_teu.1.entry: "I Fratelli della Vittovaglia"
 flavor_swe_teu.1.victual_brother_info: "Il Baltico è stato dimora della pirateria da tempo immemore. Tra i marinai e i pescatori di [target_location.GetName], molti tentano di seguire una vita di pirateria e crimine. Tra loro, [target_character.GetName] e la sua banda dei cosiddetti Likedeelers issano ora la bandiera nera sui nostri mari, intenzionati ad arricchirsi derubando chiunque abbia la sfortuna di incontrarli. Alcuni di questi mascalzoni, i cosiddetti 'Vitalienbrüder', hanno ora conquistato l'isola di [ShowProvinceDefinitionName('gotland_province')] e stabilito la loro capitale a [ShowLocationName('visby')]. Le loro azioni hanno portato a un calo del commercio nella zona, e la loro continua pirateria porterà infine alla completa rovina dei nostri traffici."
 flavor_swe_teu.1.desc: "$flavor_swe_teu.1.victual_brother_info$ Dobbiamo occuparci di loro prima che possano trincerarsi sulla nostra isola."
 flavor_swe_teu.1.historical_info: "Klaus Störtebeker fu un leggendario pirata tedesco della fine del XIV secolo, noto per aver saccheggiato le navi della Lega Anseatica. Guidò i Vitalienbrüder, un gruppo di pirati originariamente assunti come corsari dai Duchi di Mecklenburg contro la Regina Margherita, ma poi rivoltatisi contro i loro datori di lavoro. Catturato nel 1401 vicino a Heligoland, lui e la sua ciurma furono giustiziati ad Amburgo. Secondo la leggenda, stipulò un patto: chiunque fosse riuscito a camminare oltre dopo la decapitazione sarebbe stato risparmiato. Si narra che riuscì a superare diversi dei suoi compagni, finché il boia non lo fece cadere, ignorando il patto. Il suo nome, che significa '#italic vuota il boccale in un sol sorso#!', riflette la sua famigerata capacità di bere."
 flavor_swe_teu.1.a: "Chiediamo aiuto a [fief_offer_target.GetNameWithNoTooltip]."
 flavor_swe_teu.1.a.entry: "Chiediamogli aiuto."
 flavor_swe_teu.1.b: "Ce ne occuperemo da soli, per quanto costoso possa essere."
 STATIC_MODIFIER_NAME_teu_wrath_of_the_pirates: "Ira dei Pirati"
 vtb_operates_in_the_baltic_tt: "I [target_country.GetLongName] inizieranno le loro operazioni lungo le coste di [ShowAreaNameWithNoTooltip('baltic_area')]"

 flavor_swe_teu.2.title: "$flavor_swe_teu.1.title$"
 flavor_swe_teu.2.desc: "$flavor_swe_teu.1.victual_brother_info$ Per aiutarci in questo, gli [GetCountry('SWE').GetAdjective] ci hanno offerto il diritto di prendere il controllo dell'isola al loro posto, a condizione che agiamo rapidamente contro quei pirati malvagi."
 flavor_swe_teu.2.a: "Accetteremo questo feudo."
 flavor_swe_teu.2.b: "Non è un nostro problema."

 flavor_swe_teu.3.title: "Risposta [fief_offer_target.GetAdjectiveWithNoTooltip]"
 flavor_swe_teu.3.common_desc: "È finalmente arrivato un messaggero con la risposta di [fief_offer_target.GetName]."
 flavor_swe_teu.3.desc_success: "$flavor_swe_teu.3.common_desc$ L'élite [fief_offer_target.GetAdjectiveWithNoTooltip] ha promesso di far sbarcare le proprie forze sull'isola di [ShowProvinceDefinitionName('gotland_province')] per occuparsi del nostro comune nemico. Come promesso, non ci opporremo."
 flavor_swe_teu.3.desc_failure: "$flavor_swe_teu.3.common_desc$ Spiacevolmente, hanno rifiutato il nostro pacifico invito a occuparsi dei vili pirati di [pirate_nation.GetName]. Pare che dovremo occuparcene da soli, per quanto possiamo essere impegnati al momento."
 flavor_swe_teu.3.a: "Concentriamoci allora sulle nostre priorità!"
 flavor_swe_teu.3.b: "Va bene, lo faremo da soli."
 
 flavor_swe_teu.4.title: "La Fratellanza della Vittovaglia"
 flavor_swe_teu.4.entry: "$flavor_swe_teu.4.title$"
 flavor_swe_teu.4.desc: "Traditi dai nostri partner [GetCountry('HSA').GetAdjective], la nostra lega ha dovuto ricorrere a un metodo di sussistenza più vile: la pirateria. Come base operativa abbiamo scelto l'isola di [ShowProvinceDefinitionName('gotland_province')]. Se il mondo è contro di noi, allora affronteremo il mondo intero. Che gli arroganti mercanti tremino, mentre i nostri lupi di mare schiacciano le loro miserabili navi mercantili."
 flavor_swe_teu.4.a: "$pirate_events.2.a$"

 flavor_swe_teu.5.title: "Isola Contesa"
 flavor_swe_teu.5.entry: "$flavor_swe_teu.5.title$"
 flavor_swe_teu.5.desc: "Situata nel cuore del [ShowScriptedGeographyName('baltic_sea_geography')], l'isola di [ShowProvinceDefinitionName('gotland_province')] è un bene fondamentale per qualsiasi potenza che desideri raggiungere l'obiettivo del #italic Dominium Maris Baltici#!. Per questo motivo, altre potenze locali staranno di certo tramando per sottrarci questo preziosissimo possedimento. Con le nostre capacità navali in declino, potremmo voler cedere l'isola a una di quelle potenze."
 flavor_swe_teu.5.a: "Offriamo l'isola a [first_offer.GetNameWithNoTooltip]."
 flavor_swe_teu.5.a.entry: "Offriamogli l'isola."
 flavor_swe_teu.5.b: "[second_offer.GetNameWithNoTooltip] accetterebbe senz'altro."
 flavor_swe_teu.5.b.entry: "Il personaggio accetterebbe senz'altro."
 flavor_swe_teu.5.c: "Non rinunceremo alla nostra terra."

 flavor_swe_teu.6.title: "Occhi su [gutnish_province.GetNameWithNoTooltip]"
 flavor_swe_teu.6.desc: "Abbiamo un vivo interesse per l'isola di [ShowProvinceDefinitionName('gotland_province')]. Come una delle principali potenze del bacino del [ShowScriptedGeographyName('baltic_sea_geography')], sarebbe di grande beneficio controllare questa isola, situata al crocevia delle rotte commerciali e nel cuore del mare interno. Potrebbe essere il nostro primo passo verso il dominio di questo mare. Ahimè, non siamo i soli ad avere questa ambizione, e dobbiamo agire in fretta se vogliamo conquistarla per noi."
 flavor_swe_teu.6.a: "Il Baltico sarà nostro."

 flavor_swe_teu.7.title: "Un'Offerta per [gutnish_province.GetNameWithNoTooltip]"
 flavor_swe_teu.7.desc: "Abbiamo ricevuto un'offerta da [gotland_province_owner.GetName]. Al prezzo di molte libbre d'oro, sono disposti a cederci il controllo dell'isola di [ShowProvinceDefinitionName('gotland_province')]. Sebbene abbiamo di certo la capacità di conquistarla da soli, un trasferimento pacifico come questo potrebbe risparmiarci infamia agli occhi del mondo ed evitare che venga versato sangue."
 flavor_swe_teu.7.a: "Sembra uno scambio equo."
 flavor_swe_teu.7.b: "Perché dovremmo pagare?"

 flavor_swe_teu.8.title: "$flavor_swe_teu.7.title$"
 flavor_swe_teu.8.common_desc: "Abbiamo finalmente appreso i risultati della nostra missione diplomatica a [offer_nation.GetName]. Avendo offerto loro il trasferimento pacifico dell'isola [gotland_province_owner.GetAdjective], ci aspettavamo una risposta positiva e grata."
 flavor_swe_teu.8.desc_success: "$flavor_swe_teu.8.common_desc$ E tale risposta l'abbiamo ricevuta, poiché i [offer_nation.GetAdjectiveWithNoTooltip] sono stati fin troppo felici di soddisfare i nostri desideri e hanno pagato per intero lo scambio."
 flavor_swe_teu.8.desc_failure: "$flavor_swe_teu.8.common_desc$ Sfortunatamente, la nostra delusione è stata incommensurabile, poiché i nostri inviati sono stati ridicolizzati, e ci è stata confermata l'ambizione [offer_nation.GetAdjectiveWithNoTooltip] di sottrarci l'isola."
 flavor_swe_teu.8.a: "Speriamo che questo scambio accenda la pace."
 flavor_swe_teu.8.b: "Dobbiamo restare vigili."
 teu_rejected_sale: "Offerta di Vendita Rifiutata"

 flavor_dan_teu.1.title: "La Rivolta della Notte di San Giorgio"
 flavor_dan_teu.1.entry: "$flavor_dan_teu.1.title$"
 flavor_dan_teu.1.desc: "La calamità ha colpito i nostri possedimenti in [ShowProvinceDefinitionName('estonia_province')]. La popolazione nativa [ShowCultureName('estonian')], scontenta del fatto che le avessimo mostrato la Luce di Cristo tutti questi decenni fa, si è sollevata in un'insurrezione armata. In un giorno di calma, hanno lanciato un attacco mortale contro le nostre guarnigioni e i nostri castelli. Tra di loro, hanno scelto quattro capi che osano chiamare 're'. Per aggiungere insulto al danno, nel loro atto di diabolica 'vendetta' hanno iniziato a massacrare i loro ex signori e protettori in un furore pagano. Non tollereremo tutto ciò, e la loro rivolta sarà schiacciata."
 flavor_dan_teu.1.historical_info: "Nella Notte di San Giorgio del 1343, la popolazione nativa estone si rivoltò contro i propri signori danesi e i vari nobili stranieri che li governavano. Per guidare la rivolta, scelsero tra di loro i 'Quattro Re', che sarebbero poi stati attirati in una trappola e uccisi. La rivolta superò i confini danesi e si diffuse nei territori dell'Ordine di Livonia e nelle isole di Ösel."
 flavor_dan_teu.1.a: "Che siano maledetti!"
 TEU_st_georges_uprising: "Ogni [pop|e] [ShowCultureName('estonian')] [owned|e] nella Provincia di [ShowProvinceDefinitionName('estonia_province')] perde [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e] e si unisce a [estonian_uprising.GetName].\n#r Il 75.0%#! di essi ha anche cambiato [religion|e], convertendosi a [ShowReligionName('muinaisusko')]."
 estonian_uprising: "Rivolta della Notte di San Giorgio"
 STATIC_MODIFIER_NAME_teu_fervor_st_georges_night_uprising: "Rivolta della Notte di San Giorgio"

 flavor_dan_teu.2.title: "Gli Insorti Estoni Attaccano la Livonia"
 flavor_dan_teu.2.attack: "Massacrando ogni nobile [ShowCultureName('german_baltic')] che vedono, il loro disprezzo per i loro signori e per Gesù Cristo è deplorevole. Temeranno l'ira dei cieli."
 flavor_dan_teu.2.desc: "Un'insurrezione armata [ShowCultureName('estonian')], concentrata in [ShowProvinceDefinitionName('estonia_province')] [TEU_denmark_from.GetAdjective], ha iniziato a muoversi contro i nostri sudditi [GetCountry('LIV').GetAdjective]. $flavor_dan_teu.2.attack$"
 flavor_dan_teu.2.a: "Insegneremo loro una lezione."

 flavor_dan_teu.3.title: "Il Destino degli Oppressori"
 flavor_dan_teu.3.desc: "Un contingente armato ha recentemente sedato un'ondata di opposizione in [target_province.GetName]. I soldati, in un impeto d'odio, hanno iniziato a uccidere indiscriminatamente la popolazione [ShowCultureName('german_baltic')], a causa del suo attaccamento alla fede [ShowReligionAdjective('catholic')]."
 flavor_dan_teu.3.a: "Facciamo finta di niente."
 flavor_dan_teu.3.b: "Non è il momento della loro resa dei conti."

 flavor_dan_teu.4.title: "Atrocità a [target_province.GetNameWithNoTooltip]"
 flavor_dan_teu.4.desc: "I bastardi di [teu_rebellion_tag.GetName] si sono abbattuti sulla popolazione innocente [ShowCultureName('german_baltic')] in [target_province.GetName], uccidendo indiscriminatamente. Non c'era nulla che potessimo fare per fermarli."
 flavor_dan_teu.4.a: "Pagheranno per i loro peccati all'inferno."

 flavor_dan_teu.5.title: "La Nostra Insurrezione"
 flavor_dan_teu.5.desc: "I nostri vili signori [ShowCultureName('german_baltic')] ci hanno oppresso per fin troppo tempo. Hanno soppresso le nostre credenze religiose e ci hanno imposto dèi stranieri per fin troppo tempo: forse è tempo che siano loro a conoscere i nostri dèi? Che lo vogliano o no non importa; ciò che conta è la lotta per liberarci dalle loro catene."
 flavor_dan_teu.5.a: "Non saremo schiavizzati!"

 flavor_dan_teu.6.title: "$flavor_dan_teu.2.title$"
 flavor_dan_teu.6.desc: "Un'insurrezione armata [ShowCultureName('estonian')], concentrata in [ShowProvinceDefinitionName('estonia_province')] [TEU_denmark_from.GetAdjective], ha fatto una mossa contro i nostri alleati. $flavor_dan_teu.2.attack$"
 flavor_dan_teu.6.a: "Alziamo le leve!"
 
 flavor_dan_teu.7.title: "Generare Problemi"
 flavor_dan_teu.7.desc: "I nostri possedimenti in [ShowProvinceDefinitionName('estonia_province')] sono diventati una vera spina nel fianco. Separati dalla nostra capitale da vasti mari, il nostro controllo qui è, nel migliore dei casi, precario. Ora, con un attacco a sorpresa lanciato dalla popolazione nativa [ShowCultureName('estonian')], che si è diffuso ai nostri vicini di [teu_receives_estonia.GetName], forse è meglio cercare di ricucire i rapporti con il nostro vicino e vendere questa povera provincia, già all'interno della sfera di influenza di [teu_receives_estonia.GetNameWithNoTooltip]."
 flavor_dan_teu.7.desc_hyperlink: "$flavor_dan_teu.7.desc$ Parliamo con chi decide a [the_deciding_nation.GetName]."
 flavor_dan_teu.7.desc_no_hyperlink: "$flavor_dan_teu.7.desc$ Parliamo con chi decide a [the_deciding_nation.GetNameWithNoTooltip]."
 flavor_dan_teu.7.historical_info: "In seguito alla Rivolta della Notte di San Giorgio del 1343, il viceré danese in Estonia e altri funzionari governativi furono imprigionati da vassalli filotedeschi, e gran parte della provincia cadde sotto il controllo teutonico. Il re danese, riconoscendo i suoi possedimenti come insostenibili, decise di vendere l'Estonia ai Cavalieri per il prezzo di 19 mila marchi di Colonia."
 flavor_dan_teu.7.a: "Vendiamo la provincia."
 flavor_dan_teu.7.b: "Ci faremo una ragione dell'instabilità."
 teu_if_teutons_accept: "Se [the_deciding_nation.GetName] accetta:"
 
 flavor_dan_teu.8.title: "Vendita dell'Estonia"
 flavor_dan_teu.8.desc: "Di fronte alla recente rivolta in [ShowProvinceDefinitionName('estonia_province')], i [TEU_denmark_from.GetAdjective] hanno deciso di offrirci i loro possedimenti in [ShowProvinceDefinitionNameWithNoTooltip('estonia_province')]. Se accettiamo l'offerta, quei territori entrerebbero nella nostra sfera di influenza, e i [TEU_denmark_from.GetAdjectiveWithNoTooltip] si ritirerebbero dal conflitto, lasciando a noi il compito di occuparci dei traditori."
 flavor_dan_teu.8.historical_info: "$flavor_dan_teu.7.historical_info$"
 flavor_dan_teu.8.a: "Accetteremo la loro offerta."
 flavor_dan_teu.8.b: "Non vogliamo nemmeno quei problemi!"
 
 flavor_dan_teu.9.title: "$flavor_dan_teu.8.title$"
 flavor_dan_teu.9.desc_common: "Abbiamo finalmente ricevuto una risposta alla nostra generosa offerta sui diritti su [ShowProvinceDefinitionName('estonia_province')]."
 flavor_dan_teu.9.desc_success: "$flavor_dan_teu.9.desc_common$ Con gioia, [the_deciding_nation.GetName] ha accettato la proposta, liberandoci dal dovere di gestire questa terra piena di traditori."
 flavor_dan_teu.9.desc_failure: "$flavor_dan_teu.9.desc_common$ Sfortunatamente, [the_deciding_nation.GetName] ha rifiutato la proposta, costringendoci non solo a sconfiggere questa rivolta, ma anche a sopportarne le conseguenze e un ulteriore malcontento per decenni a venire. Ebbene, forse con sufficiente impegno un giorno sarà integrata."
 flavor_dan_teu.9.a: "Ci sta bene!"
 flavor_dan_teu.9.b: "Dannazione."
 teu_successful_dealings: "Trattative Riuscite"
