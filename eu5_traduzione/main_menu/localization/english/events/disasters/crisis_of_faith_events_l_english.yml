l_english:

  crisis_of_faith.1.title: "Lo Scisma Divampa"
  crisis_of_faith.1.desc: "La devozione verso la chiesa di stato è crollata, e i fedeli non prestano più ascolto ai suoi insegnamenti. Predicatori scismatici raccolgono seguaci, mentre il clero si divide tra riformatori e intransigenti. Dobbiamo scegliere la nostra strada: venire incontro ai riformatori e cercare un compromesso, o sopprimere lo scisma con il fuoco e l'acciaio."
  crisis_of_faith.1.a: "Veniamo incontro ai riformatori."
  crisis_of_faith.1.b: "Reprimiamo gli scismatici!"
  crisis_of_faith.1.tt: "Le province più turbolente si solleveranno a sostegno della fazione [ShowDisasterName('crisis_of_faith')]"
  crisis_of_faith.1.a.tt: "Il clero di alcune delle province più turbolente si unirà comunque alla fazione [ShowDisasterName('crisis_of_faith')]"

  crisis_of_faith.2.title: "L'Eresia si Diffonde"
  crisis_of_faith.2.desc: "Giungono notizie di intere congregazioni che si volgono alla dottrina scismatica. Possiamo inviare chierici leali a estirpare gli eretici prima che il contagio si diffonda ulteriormente, oppure lasciare che faccia il suo corso nella speranza che il fervore si esaurisca da sé."
  crisis_of_faith.2.a: "Estirpiamo gli eretici."
  crisis_of_faith.2.b: "Lasciamo che incancrenisca."

  crisis_of_faith.3.title: "I Fedeli si Raccolgono"
  crisis_of_faith.3.desc: "In sfida allo scisma, folle devote si radunano per riaffermare la fede costituita. Il loro zelo potrebbe riaccendere la devozione in tutto il reame, sebbene simili passioni possano facilmente sfociare in disordini se lasciate senza controllo."
  crisis_of_faith.3.a: "Abbracciamo il fervore."
  crisis_of_faith.3.b: "Manteniamo l'ordine."

  crisis_of_faith.4.title: "Il Clero Chiede una Riforma Dottrinale"
  crisis_of_faith.4.desc: "Una delegazione di chierici moderati ci supplica di emendare la dottrina della chiesa e sanare la frattura prima che si allarghi. Concedere le loro riforme placherebbe il clero e rallenterebbe lo scisma, ma piegare la dottrina sacra non è cosa da poco. Rifiutare manterrebbe la linea a prezzo della benevolenza del clero."
  crisis_of_faith.4.a: "Concediamo le loro riforme."
  crisis_of_faith.4.b: "Rifiutiamo di piegare la dottrina."

  crisis_of_faith.5.title: "Un'Occasione per l'Inquisizione"
  crisis_of_faith.5.desc: "I nostri chierici più zelanti chiedono licenza di avviare un'inquisizione contro gli scismatici. Un'epurazione ripristinerebbe la devozione e intimorirebbe gli eretici, ma la paura che ne deriverebbe si propagherebbe in tutto il reame. Possiamo anche scegliere la moderazione, risparmiando alla popolazione ulteriori sofferenze."
  crisis_of_faith.5.a: "Avviamo l'inquisizione."
  crisis_of_faith.5.b: "Mostriamo moderazione."

  crisis_of_faith.12.title: "Un Patrono per lo Scisma"
  crisis_of_faith.12.desc: "La causa scismatica ha trovato una borsa. [crisis_of_faith_heresiarch_scope.GetName] è stato accolto in una grande sala del nostro reame, e il nobile che ne ha aperto le porte ora finanzia la copiatura di sermoni che abbiamo proibito. Possiamo fare una discreta controfferta per quella lealtà, oppure accettare di non poter sorvegliare ogni sala del paese."
  crisis_of_faith.12.a: "Ricompriamo quella lealtà."
  crisis_of_faith.12.b: "Non possiamo sorvegliare ogni sala."

  crisis_of_faith.13.title: "Predicare allo Scoperto"
  crisis_of_faith.13.desc: "[crisis_of_faith_heresiarch_scope.GetName] non predica più nelle cantine. Una folla si è radunata nella piazza del mercato per ascoltare la dottrina scismatica proclamata ad alta voce, e nessuno si è mosso per impedirlo. Mettere a tacere il sermone mostrerebbe che la nostra chiesa detiene ancora autorità, sebbene trascinare un predicatore giù dal pulpito davanti a una folla sia uno scandalo a sé."
  crisis_of_faith.13.a: "Mettiamo a tacere il sermone."
  crisis_of_faith.13.b: "Lasciamo che i fedeli giudichino da sé."

  crisis_of_faith.100.title: "L'Eresia Schiacciata"
  crisis_of_faith.100.desc: "Lo scisma è stato sanato. I predicatori scismatici sono dispersi, i loro seguaci sono tornati all'ovile e il clero è di nuovo unito sotto un'unica dottrina. La nostra chiesa risorge rinnovata, la sua autorità e la nostra devozione ristabilite."
  crisis_of_faith.100.a: "La fede perdura."

  crisis_of_faith.101.title: "La Dottrina Scismatica si Radica"
  crisis_of_faith.101.desc: "Lo scisma ha prevalso. La dottrina riformata mette radici nelle nostre chiese e nelle nostre corti, e l'antica dottrina viene messa da parte. Per una generazione, il nostro reame convivrà con una fede divisa e con un clero che non risponde più interamente al nostro trono."
  crisis_of_faith.101.desc.heresiarch: "Lo scisma ha prevalso, e ha un volto. [crisis_of_faith_heresiarch_scope.GetName] ha predicato la dottrina riformata finché non è stato più possibile ridurla al silenzio, benché sia stato il clero in rivolta a infrangere la nostra autorità sul campo. Ora il clero vittorioso proclama la [crisis_of_faith_heresiarch_scope.GetHerHis] elevazione, e non resta nessuno nella nostra chiesa disposto a rifiutarsi. Ciò che difendevamo come sacro viene messo da parte in silenzio."
  crisis_of_faith.101.a: "Lo scisma prevale."
  crisis_of_faith.101.b: "Lasciamo che l'eresiarca prenda il trono."

  crisis_of_faith.102.title: "La Fede Abbandonata"
  crisis_of_faith.102.desc: "Non governiamo più come chiesa. Qualunque cosa abbiano predicato gli scismatici, non riceveranno risposta dal nostro clero, poiché il nostro clero non parla più a nome dello stato. La dottrina che abbiamo smesso di difendere rimane sulla bocca dei fedeli, e coloro che hanno mantenuto per noi la vecchia ortodossia ricordano chi li ha abbandonati."
  crisis_of_faith.102.a: "La chiesa non è più nostra da governare."

  crisis_of_faith.10.title: "Predicare il Rinnovamento"
  crisis_of_faith.10.desc: "Inviamo i nostri chierici più devoti tra il popolo, a predicare il rinnovamento e a richiamare i fedeli a casa. I loro sermoni riaccendono la devozione in tutto il reame e sottraggono seguito agli scismatici, sebbene lo sconvolgimento di un grande risveglio turbi l'ordine delle cose."
  crisis_of_faith.10.a: "Mandiamo i predicatori."
  crisis_of_faith.10.a.tt: "Ogni pop che attualmente sostiene la fazione [ShowDisasterName('crisis_of_faith')] otterrà un po' di soddisfazione"

  crisis_of_faith.11.title: "Convocare un Sinodo"
  crisis_of_faith.11.desc: "Convochiamo il clero a un grande concilio per risolvere una volta per tutte la dottrina contesa. I prelati riuniti serrano i ranghi attorno all'insegnamento ortodosso, isolando la fazione scismatica e ristabilendo una certa misura di unità nella chiesa."
  crisis_of_faith.11.a: "Convochiamo il concilio."
  crisis_of_faith.11.a.tt: "Ogni pop che attualmente sostiene la fazione [ShowDisasterName('crisis_of_faith')] otterrà un po' di soddisfazione"

  crisis_of_faith.6.title: "La Mano Dietro lo Scisma"
  crisis_of_faith.6.desc: "I nostri agenti hanno risalito i sermoni proibiti attraverso i copisti e i corrieri che li hanno trasportati, e ogni pista termina alla stessa porta. [crisis_of_faith_heresiarch_scope.GetName] è l'autore della dottrina scismatica e fino a ora [crisis_of_faith_heresiarch_scope.GetSheHe] l'ha predicata dall'interno della nostra stessa chiesa."
  crisis_of_faith.6.a: "Nominiamo l'eresiarca."
  crisis_of_faith.6.a.tt: "L'eresiarca è stato identificato, sbloccando l'azione Denunciare l'Eresiarca"

  crisis_of_faith.7.title: "Denunciare l'Eresiarca"
  crisis_of_faith.7.desc.ready: "La corona parla di nuovo con autorità, ed è giunto il momento di servirsene. Nomineremo [crisis_of_faith_heresiarch_scope.GetName] davanti ai fedeli riuniti, esporremo per intero i [crisis_of_faith_heresiarch_scope.GetHerHis] errori e priveremo [crisis_of_faith_heresiarch_scope.GetHerHim] della posizione che ha reso possibile lo scisma. Senza il suo autore, la dottrina riformata non è che una voce."
  crisis_of_faith.7.desc.not_ready: "Vorremmo nominare [crisis_of_faith_heresiarch_scope.GetName] davanti ai fedeli riuniti e farla finita con lo scisma, ma la corona non domina l'assemblea. Il clero che protegge [crisis_of_faith_heresiarch_scope.GetHerHim] è più forte del trono che vorrebbe condannare [crisis_of_faith_heresiarch_scope.GetHerHim], e una denuncia che fallisce verrà ricordata come una denuncia che è stata respinta."
  crisis_of_faith.7.a: "Condanniamo l'eresiarca davanti ai fedeli."
  crisis_of_faith.7.a.fail_tt: "La corona non ha l'autorità per muoversi contro l'eresiarca"

  crisis_of_faith.8.title: "Cedere agli Scismatici"
  crisis_of_faith.8.desc: "Lo scisma non può essere spezzato, perciò deve essere comprato. Concederemo ai riformatori la dottrina che pretendono e la posizione all'interno della nostra chiesa che ne deriva. La fazione si disperderà, e i suoi predicatori torneranno a congregazioni che ora sono loro di diritto. La nostra devozione non si riprenderà da tutto ciò, e la concessione non potrà essere ritirata."
  crisis_of_faith.8.a: "Lasciamo che abbiano la loro dottrina."
