l_english:
 twilight_of_the_tsardom.1.title: "Crepuscolo del $rank_empire_bulgarian$"
 twilight_of_the_tsardom.1.desc: "La forza che un tempo portava i nostri vessilli attraverso il [ShowRegionName('balkan_region')] ora si affievolisce con il passare di ogni anno. La nostra autorità si svuota e i nostri nemici ci circondano da ogni lato. Le cicatrici delle guerre passate e delle lotte intestine sono ben lontane dal guarire, e se non verrà intrapresa un'azione decisiva, [GetCountry('BUL').Custom('IT_ART_RANGO')][GetCountry('BUL').GetFlavorRank] potrebbe presto svanire in poco più che un ricordo. Dobbiamo fare tutto il possibile per prevenire il disastroso crollo che colpì il Primo Impero [GetCountry('BUL').GetAdjective]."
 twilight_of_the_tsardom.1.a: "[GetCountry('BUL').Custom('IT_ART_RANGO')|U][GetCountry('BUL').GetFlavorRank] non cadrà!"
 twilight_of_the_tsardom.1.a.tt: "Il completamento del [disaster|e] $twilight_of_the_tsardom$ senza possedere [ShowLocationName('constantinople')] comporterà quanto segue:"
 twilight_of_the_tsardom.1.a.tt2: "Il completamento del [disaster|e] $twilight_of_the_tsardom$ mentre possediamo anche [ShowLocationName('constantinople')] comporterà quanto segue:"
 twilight_of_the_tsardom.1.a.tt3: "Il completamento del [disaster|e] $twilight_of_the_tsardom$ mentre possediamo anche [ShowLocationName('constantinople')] e siamo una [great_power|e] comporterà quanto segue:"
 twilight_of_the_tsardom.1.historical_info: "Dopo la morte di Ivan Asen II nel 1241, la Bulgaria cadde in un lungo periodo di governo debole, lotte intestine tra nobili e incursioni mongole. I sovrani succedutisi non riuscirono a resistere all'invadenza straniera, il che portò a gravi perdite territoriali. L'instabilità interna raggiunse il culmine con la rivolta di Ivaylo e proseguì per decenni tra lotte civili e ingerenze straniere. Sebbene si sia verificata una breve ripresa all'inizio del XIV secolo, la sconfitta di Velbazhd nel 1330 e le rinnovate pressioni esterne lasciarono la Bulgaria indebolita e sempre più vulnerabile entro il 1337. La nazione indebolita non si sarebbe mai ripresa da questa lotta, e sarebbe infine caduta per mano degli Ottomani."
 
 twilight_of_the_tsardom.2.title: "Il $rank_empire_bulgarian$ resiste"
 twilight_of_the_tsardom.2.desc: "Contro ogni previsione, il $rank_empire_bulgarian$ ha resistito ad anni di caos, intrighi e declino. Sebbene le cicatrici rimangano e il regno non si sia ancora pienamente ripreso, siamo sopravvissuti là dove molti credevano che saremmo caduti. Il crepuscolo è passato, ma resta da vedere se ci attende una nuova alba."
 twilight_of_the_tsardom.2.a: "Ricostruiamo ciò che è andato perduto."
 twilight_of_the_tsardom_modifier_removal_tt: "Il [ShowModifier('bul_powerful_local_elites')] verrà rimosso da ogni località posseduta che lo possiede"
 
 twilight_of_the_tsardom.3.title: "[GetCountry('BUL').Custom('IT_La')|U][GetCountry('BUL').GetNameWithNoTooltip] in ascesa"
 twilight_of_the_tsardom.3.desc: "Dal profondo della crisi, [GetCountry('BUL').Custom('IT_La')][GetCountry('BUL').GetName] è risorto, tanto restaurato quanto rinvigorito. La conquista di [ShowLocationName('constantinople')] è un'impresa che pochi avrebbero potuto immaginare durante i giorni più bui del tumulto. Il $rank_empire_bulgarian$ ora si erge come forza dominante nel [ShowRegionName('balkan_region')], e tutti coloro che un tempo dubitavano della nostra forza devono ora fare i conti con la nostra rinascita."
 twilight_of_the_tsardom.3.a: "Che il mondo riconosca la nostra forza!"
 
 twilight_of_the_tsardom.4.title: "L'alba di un nuovo impero"
 twilight_of_the_tsardom.4.desc: "Il $rank_empire_bulgarian$ [GetCountry('BUL').GetAdjective], un tempo minacciato dal collasso, ora si erge tra i più grandi regni del mondo. Nella lotta per la sopravvivenza, abbiamo trovato forza e speranza che sono culminate nell'ascesa di una nuova potenza imperiale. Con [ShowLocationName('constantinople')] nelle nostre mani, siamo destinati a lasciare un segno nella storia. Che questo giorno sia ricordato come la fondazione del Terzo Impero [GetCountry('BUL').GetAdjectiveWithNoTooltip]!"
 twilight_of_the_tsardom.4.a: "Un'epoca d'oro inizia ora!"
 
 twilight_of_the_tsardom.5.title: "Le élite locali contestano la nostra autorità"
 twilight_of_the_tsardom.5.desc: "Le élite regionali di [target_location.GetName] hanno iniziato ad agire in modo indipendente, ignorando i nostri decreti e governando le proprie terre come se fossero sovrane. Incoraggiati dall'indebolita autorità centrale, altri potrebbero presto seguirne l'esempio. Se non intraprendiamo un'azione decisiva, ciò potrebbe favorire una frammentazione ancora maggiore."
 twilight_of_the_tsardom.5.a: "Abbiamo preoccupazioni più urgenti."
 twilight_of_the_tsardom.5.b: "Ristabiliamo il nostro controllo su [target_location.GetNameWithNoTooltip]."
 
 twilight_of_the_tsardom.6.title: "Un cortigiano accusato di tradimento"
 twilight_of_the_tsardom.6.desc: "Uno dei nostri consiglieri di fiducia, [target_character.GetName], è caduto sotto grave sospetto. [target_character.GetSheHe|U] è stato accusato di aver accettato denaro da una potenza straniera in cambio di informazioni sensibili sul nostro $rank_empire_bulgarian$. Sebbene non sia ancora stata scoperta alcuna prova certa, le sole accuse hanno seminato inquietudine all'interno [ROOT.GetCountry.GetGovernment.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetCourtTitle]. Se ignorassimo la questione, un traditore potrebbe agire indisturbato nella nostra cerchia; eppure agire con troppa fretta potrebbe portare a punire ingiustamente un servitore fedele."
 twilight_of_the_tsardom.6.a: "Congediamo subito [target_character.GetHerHim]!"
 twilight_of_the_tsardom.6.b: "Questa è sicuramente solo una diceria..."
 
 twilight_of_the_tsardom.7.title: "Ammutinati nell'esercito"
 twilight_of_the_tsardom.7.desc: "Il morale dei nostri eserciti vacilla mentre i soldati non pagati brontolano e gli ufficiali faticano a mantenere l'ordine. Con i salari in ritardo e la catena di comando che si indebolisce di giorno in giorno, rischiamo che i soldati un tempo pilastro della nostra forza diventino una minaccia contro di essa."
 twilight_of_the_tsardom.7.a: "Paghiamo loro quanto dovuto."
 twilight_of_the_tsardom.7.b: "Non possiamo permettercelo."
 twilight_of_the_tsardom.7.c: "Schiacciamo l'ammutinamento prima che si diffonda!"
 
 twilight_of_the_tsardom.8.title: "Uno stato cliente ribelle"
 twilight_of_the_tsardom.8.desc: "Voci sono giunte alla capitale secondo cui le élite [subject_target.Custom('IT_Di')][subject_target.GetName] starebbero diventando sempre più insubordinate, e si ritiene che stiano cospirando in segreto, mettendo alla prova i limiti della loro fedeltà. Sebbene non sia ancora stata dichiarata alcuna aperta ribellione, le nostre fonti fidate riferiscono che il loro [subject_target.GetGovernment.GetCourtTitle] è pieno di sussurri di indipendenza."
 twilight_of_the_tsardom.8.a: "Plachiamoli con delle concessioni."
 twilight_of_the_tsardom.8.b: "Al momento possiamo fare ben poco."
 
 twilight_of_the_tsardom.9.title: "Guarnigione non pagata"
 twilight_of_the_tsardom.9.desc: "I difensori della nostra guarnigione a [target_location.GetName] stanno diventando ribelli, accusando i governatori locali di trascurare le difese e di rifiutarsi di corrispondere alla guarnigione una paga adeguata. Questi soldati, incaricati di difendere una fortezza chiave che protegge l'intera [target_area.GetName], ora vedono ben poche ragioni per restare fedeli a una corona incapace di provvedere a loro."
 twilight_of_the_tsardom.9.a: "Paghiamo subito il loro stipendio!"
 twilight_of_the_tsardom.9.b: "Costringiamo le élite locali a pagarli."
 twilight_of_the_tsardom.9.c: "Non possiamo permetterci di spendere altro denaro."
 
 twilight_of_the_tsardom.10.title: "Ceti in lotta"
 twilight_of_the_tsardom.10.desc: "L'indebolimento dell'autorità centrale negli ultimi anni ha incoraggiato i ceti del $rank_empire_bulgarian$, ciascuno alla ricerca di maggiore influenza sull'indebolito [GetEstateName('crown_estate')]. Le rivalità latenti sono sfociate in aperta ostilità e la nostra neutralità è sempre più difficile da mantenere. Poiché rischiamo di rivoltare entrambe le fazioni contro di noi, forse possiamo ancora assicurarci la fedeltà di una di esse, al costo di un'ulteriore divisione all'interno del regno."
 twilight_of_the_tsardom.10.a: "Schieriamoci con il [first_estate.GetNameWithNoTooltip]."
 twilight_of_the_tsardom.10.b: "Proteggiamo gli interessi del [second_estate.GetNameWithNoTooltip]."
 twilight_of_the_tsardom.10.c: "Non schieriamoci in questo conflitto."
 
 bul_restore_the_realms_unity: "Ripristinare l'unità del regno"
 bul_restore_the_realms_unity_desc: "Territori che un tempo erano parte integrante [GetCountry('BUL').Custom('IT_DEL_RANGO')][GetCountry('BUL').GetFlavorRank] sono sfuggiti al nostro controllo e non sono più soggetti all'autorità del trono. Se vogliamo sopravvivere a questo crepuscolo, dobbiamo garantirne la riunificazione con la madrepatria. Con la forza, se necessario..."
 bul_reassert_our_authority: "Riaffermare la nostra autorità"
 bul_reassert_our_authority_desc: "La debolezza interna [GetCountry('BUL').Custom('IT_Di')][GetCountry('BUL').GetName] ha incoraggiato molte élite in tutto [GetCountry('BUL').Custom('IT_ART_RANGO')][GetCountry('BUL').GetFlavorRank], che ora sfidano la nostra autorità e governano le proprie terre come se non rispondessero a nessuno. Dobbiamo prevenire un'ulteriore frammentazione del regno riaffermando il controllo sui loro territori e costringendoli a piegare nuovamente il capo."
 bul_push_for_diplomatic_reintegration: "Spingere per la reintegrazione diplomatica"
 bul_push_for_diplomatic_reintegration_desc: "Per evitare lo scoppio di guerre civili, abbiamo ceduto parte delle nostre terre a signori che le governano in nostro nome. Sebbene questa soluzione possa funzionare nel breve termine, è nel nostro interesse lavorare per la riunificazione diplomatica del $rank_empire_bulgarian$, poiché un regno diviso non sopravvivrà a ciò che verrà."
 
 twilight_of_the_tsardom.11.title: "Circondati dagli avvoltoi"
 twilight_of_the_tsardom.11.desc: "Mentre restiamo consumati dalle lotte intestine, i nostri vicini opportunisti ci circondano come avvoltoi circondano una bestia morente. Fiutando la debolezza, osservano ogni nostra mossa e attendono pazientemente il momento per colpire e strappare via ciò che resta del nostro $rank_empire_bulgarian$. Di recente, è giunto alla nostra attenzione che [target_country.Custom('IT_La')][target_country.GetName] ha rivendicato [border_claim_province.GetName], con l'intento di impadronirsene qualora se ne presentasse l'occasione."
 twilight_of_the_tsardom.11.a: "Lasciamo che tentino la fortuna!"
 twilight_of_the_tsardom.11.b: "Corrompiamoli per far revocare la rivendicazione."
 
