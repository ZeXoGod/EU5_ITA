 #Loc macros
 bra_hre_hyperlink: "[GetUniqueInternationalOrganization('hre').GetName]"
 bra_hre_hyperlink_no_tt: "[GetUniqueInternationalOrganization('hre').GetNameWithNoTooltip]"
 bra_hre_emperor_hyperlink: "[GetUniqueInternationalOrganization('hre').GetLeaderTitle]"
 bra_hre_emperor_country_hyperlink: "[GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetName]"
 bra_wittelsbach_hyperlink: "[ShowDynastyName('wittelsbach_dynasty')]"
 bra_wittelsbach_hyperlink_no_tt: "[ShowDynastyNameWithNoTooltip('wittelsbach_dynasty')]"
 bra_askanier_hyperlink: "[ShowDynastyName('askanier_dynasty')]"
 bra_askanier_hyperlink_no_tt: "[ShowDynastyNameWithNoTooltip('askanier_dynasty')]"
 bra_variable_counter: "#Y [GetCountry('BRA').MakeScope.GetVariable('bra_wittelsbacher_investment_var').GetValue]#!"
 bra_neglect_variable_counter: "#Y [GetCountry('BRA').MakeScope.GetVariable('bra_wittelsbacher_neglect_var').GetValue]#!"
 bra_wittelsbacher_investment_var: "#Y Investimento Wittelsbacher#!"
 bra_wittelsbacher_neglect_var: "#Y Negligenza Wittelsbach#!"

 bra_change_investment_score_add: "Otteniamo $VALUE|G0$ $bra_wittelsbacher_investment_var$ (Attualmente $bra_variable_counter$)"
 bra_change_investment_score_subtract: "Perdiamo $VALUE|R0$ $bra_wittelsbacher_investment_var$ (Attualmente $bra_variable_counter$)"

 bra_change_neglect_score_add: "Otteniamo $VALUE|G0$ $bra_wittelsbacher_neglect_var$ (Attualmente $bra_neglect_variable_counter$)"
 bra_change_neglect_score_subtract: "Perdiamo $VALUE|R0$ $bra_wittelsbacher_neglect_var$ (Attualmente $bra_neglect_variable_counter$)"

 PRU_DEAL_WITH_ROBBER_BARONS_TOOLTIP_IN_PROGRESS: "Progresso: $PROGRESS$%\n$DAYS$, $DATE$"

 #Events
 turmoil_in_brandenburg.1.title: "I [root_dynasty.GetNameWithNoTooltip] di [ROOT.GetCountry.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1.desc.start: "Con la morte dell'ultimo membro degli $bra_askanier_hyperlink$ di [ROOT.GetCountry.GetName], [GetCharacter('bra_heinrich_ii_askanier').GetName], nel 1320, le terre [ROOT.GetCountry.Custom('IT_ADJ_FP')] sono cadute nelle mani di [GetCharacter('ubv_ludwig_iv_wittelsbach').GetName], l'Imperatore eletto del $bra_hre_hyperlink$. Al fine di mantenere il territorio della Germania settentrionale amministrato, [GetCharacter('ubv_ludwig_iv_wittelsbach').GetShortNameWithNoTooltip] ha assegnato la Marca [ROOT.GetCountry.Custom('IT_ADJ_FS')] a suo [GetCharacter('bra_ludwig_v_wittelsbach').GetDaughterSon], [GetCharacter('bra_ludwig_v_wittelsbach').GetName]."
 turmoil_in_brandenburg.1.desc: "$turmoil_in_brandenburg.1.desc.start$\n\nQuesto è l'inizio dell'era $bra_wittelsbach_hyperlink$ di [ROOT.GetCountry.GetNameWithNoTooltip]. È un'epoca di problemi, poiché [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] era stato posto come sovrano in giovane età, lasciando gran parte del governo nelle mani di [GetCharacter('hnb_berthold_iv_henneberg_schleusingen').GetName]. I baroni ladri, le questioni economiche e il malcontento generale della popolazione nei confronti del[ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_NULL_LA')] propri[ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_O_A')] [ROOT.GetCountry.GetGovernment.GetRulerTitle] affliggevano il governo di [GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip], e i $bra_wittelsbach_hyperlink_no_tt$ sembrano preoccuparsi poco dei loro possedimenti nel nord..."
 turmoil_in_brandenburg.1.desc.fallback: "$turmoil_in_brandenburg.1.desc.start$\n\nIl dominio di [GetCharacter('bra_ludwig_v_wittelsbach').GetShortNameWithNoTooltip], tuttavia, ebbe vita breve, e [root_ruler.Custom('IT_ART_TITOLO')][root_ruler.GetName] assunse il controllo [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetNameWithNoTooltip]. Tuttavia, le questioni economiche e i Baroni Ladri continuano a macchiare l'autorità del[ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_NULL_LA')] [ROOT.GetCountry.GetGovernment.GetRulerTitle], e gli $bra_wittelsbach_hyperlink$ mostrano scarso interesse nel cambiare l'attuale situazione della poco sviluppata marca..."
 turmoil_in_brandenburg.1.a: "[ROOT.GetCountry.Custom('IT_La')|U][ROOT.GetCountry.GetNameWithNoTooltip] prevarrà!"
 turmoil_in_brandenburg.1.a.at: "Il [control|e] sul nostro Paese declinerà!"
 turmoil_in_brandenburg.1.a.bt: "Per risolvere questo disastro, dobbiamo anche risolvere la crisi dinastica e il disordine causato dai rampanti Baroni Ladri."

 turmoil_in_brandenburg.2.title: "La Fine del Periodo $bra_wittelsbach_hyperlink_no_tt$"
 turmoil_in_brandenburg.2.desc: "Poiché nessun membro della dinastia $bra_wittelsbach_hyperlink$ detiene alcun potere monarchico[ROOT.GetCountry.Custom('IT_Sulla')][ROOT.GetCountry.GetName], l'era della stagnazione economica e del costante abbandono è finalmente giunta al termine. Ora spetta ai nuovi governanti portare prosperità al nostro popolo."
 turmoil_in_brandenburg.2.a: "Che questo possa essere l'inizio di un'età dell'oro."
 turmoil_in_brandenburg.2.a.tt: "$bra_wittelsbacher_investment_var$ e $bra_wittelsbacher_neglect_var$ saranno disabilitati."

 turmoil_in_brandenburg.3.title: "Il Falso $name_waldemar$"
 turmoil_in_brandenburg.3.entry: "$turmoil_in_brandenburg.3.title$"
 turmoil_in_brandenburg.3.desc: "All'inizio, la sua storia sembrava realistica, anche se un po' strana: un governante che aveva inscenato il proprio funerale per poter intraprendere un pellegrinaggio senza essere disturbato, per poi tornare. Ma mentre la sua nuova campagna per il trono continuava, la sua storia cominciò a mostrare delle crepe. Coloro che conoscevano [GetCharacter('bra_waldemar_askanier').GetName] prima del 1320 avevano notato i suoi inspiegabili cambiamenti di personalità...\n\nMa con grande sorpresa di tutti, è stato finalmente rivelato che [target_character.GetName] non è altro che un semplice impostore che si finge l'illustre Margravio!\n\nIn un istante, qualsiasi forma di sostegno di cui godeva il pretendente è svanita, e il dominio [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRuler.GetName] è ancora una volta indiscusso."
 turmoil_in_brandenburg.3.a: "Un impostore tra noi... chi avrebbe mai potuto immaginarlo?"
 false_waldemar_imposter_protection_tt: "Waldemar sta raccogliendo sostegno"

 turmoil_in_brandenburg.4.title: "La Tirannia dei Baroni Ladri"
 turmoil_in_brandenburg.4.desc: "Protetti dallo status giuridico del loro feudo, i Baroni Ladri [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] sono membri [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] che impongono pedaggi e tasse paralizzanti alla popolazione locale. Anche se le loro ragioni potrebbero essere dettate dalla disperazione, le loro azioni ostacoleranno lo sviluppo delle terre [ROOT.GetCountry.Custom('IT_ADJ_FP')] se lasciamo che questo continui ad accadere..."
 turmoil_in_brandenburg.4.a: "Combattere i Baroni Ladri."
 turmoil_in_brandenburg.4.b: "[ROOT.GetCountry.Custom('common_string_nothing_we_can_do')]"
 bra_peasants_revolt: "Rivolta Contadina"
 PRU_robber_barons_active_tt: "I baroni predoni sono attivi"

 turmoil_in_brandenburg.5.title: "Rivolta [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] Revolt"
 turmoil_in_brandenburg.5.desc: "La spirale economica discendente [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] ha lasciato molti membri [ROOT.GetCountry.Custom('IT_PEASANTS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('peasants_estate')] amareggiati e contrariati. Si rifiutano di lavorare nei campi a meno che non vengano soddisfatte le loro richieste di miglioramento della loro situazione sotto la tirannia degli egoisti cavalieri ladri..."
 turmoil_in_brandenburg.5.a: "Migliorate la loro situazione."
 turmoil_in_brandenburg.5.b: "Sono solo contadini. Non causeranno alcun problema."

 turmoil_in_brandenburg.6.title: "Controllo [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]"
 turmoil_in_brandenburg.6.desc: "Mentre l'autorità dei $bra_wittelsbach_hyperlink$ è presente sulla carta, l'autorità effettiva sul popolo è nelle mani di coloro che le masse scelgono di seguire. Negli insediamenti rurali, si tratta [ROOT.GetCountry.Custom('IT_CLERGY_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]. Se vogliamo mantenere l'autorità sul nostro territorio, dobbiamo revocare il potere dei chierici..."
 turmoil_in_brandenburg.6.a: "Revocate il loro potere."
 turmoil_in_brandenburg.6.b: "Non dovremmo interferire con [ROOT.GetCountry.Custom('IT_CLERGY_IL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]."

 turmoil_in_brandenburg.7.title: "Tasse Cittadine Rifiutate"
 turmoil_in_brandenburg.7.desc: "[ROOT.GetCountry.Custom('IT_La')|U][ROOT.GetCountry.GetName|U] è in cattive condizioni. Le sue terre sono scarsamente popolate e ancora meno sviluppate. La maggior parte dei miglioramenti apportati alle istituzioni [ROOT.GetCountry.Custom('IT_ADJ_FP')] sono pagati con le tasse riscosse dai borghi e dalle città. Tuttavia, i membri [ROOT.GetCountry.Custom('IT_BURGHERS_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] rifiutano di pagare la loro parte, poiché vedono pochi motivi per riconoscere i $bra_wittelsbach_hyperlink$ come loro sovrani..."
 turmoil_in_brandenburg.7.a: "Imponiamo il nostro volere [ROOT.GetCountry.Custom('IT_BURGHERS_AL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('burghers_estate')]."
 turmoil_in_brandenburg.7.b: "$common_string_leave_them_be$"

 turmoil_in_brandenburg.8.title: "Il Dominio Privato di [target_character.GetShortNameWithNoTooltip]"
 turmoil_in_brandenburg.8.desc: "Rapporti da [target_location.GetName] parlano di [target_character.GetName] che governa le sue proprietà come se fossero un regno a sé stante. Le mura del castello diventano più alte, i fossati più larghi e gli uomini d'arme rispondono solo a [target_character.GetHerHim]. Petizioni che dovrebbero essere ascoltate presso la [ROOT.GetCountry.GetGovernment.GetCourtTitle] vengono decise nella sua sala, e i tributi e le tasse una volta pagati [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_AL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] ora riempiono invece le sue casse. Per molti, la distinzione tra le terre [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] e il dominio privato di [target_character.GetShortNameWithNoTooltip] sta diventando preoccupantemente sfocata..."
 turmoil_in_brandenburg.8.a: "Per ora lo tollereremo."
 turmoil_in_brandenburg.8.b: "Nessun lord è al di sopra [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle]."

 tib_outcome_8_1_tt: "I nostri agenti faranno in modo che [target_character.GetShortNameWithNoTooltip] non ci dia più fastidio"
 tib_outcome_8_2_tt: "La [ShowEstateTypeName('nobles_estate')] di [target_location.GetName] si infurierà per il nostro intervento"
 tib_outcome_8_3_tt: "La nostra decisione peggiorerà i rapporti con la [ShowEstateTypeName('nobles_estate')] in tutto il regno"

 turmoil_in_brandenburg.9.title: "La Lega [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] di [target_province.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.9.desc: "Nella campagna di [target_province.GetName], numerose famiglie importanti si sono unite in una lega formale. Giurano difesa reciproca, tengono tribunali congiunti e concordano di resistere a qualsiasi ulteriore intrusione dei funzionari reali nei loro affari.\n\nPer molti abitanti del luogo, è chiaro che la vera autorità in [target_province.GetNameWithNoTooltip] ora spetta a questo gruppo [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] piuttosto che [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_AL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] a [ROOT.GetCountry.GetCapital.GetName]. Alcuni a [ROOT.GetCountry.GetGovernment.GetCourtTitle] sussurrano che tollerare tali unioni non farà altro che accelerare il declino del potere centrale."
 turmoil_in_brandenburg.9.a: "Riconoscete la lega e conquistate il loro favore."
 turmoil_in_brandenburg.9.b: "Spezzate questa cricca e ripristiniamo la nostra autorità."
 
 nobles_in_target_province_gain_pop_satisfaction_extreme_bonus_tt: "I [pops|e] sotto il nostro governo in [target_province.GetName], che appartengono alla [ShowEstateTypeName('nobles_estate')], saranno molto incoraggiati dal nostro riconoscimento della loro lega, ottenendo un [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 lower_class_pop_satisfaction_weak_penalty_tt: "La [lower_class|e] di [target_province.GetName] proveranno risentimento per il potere incontrollato dei loro signori, subendo così un [ShowNamedValue('pop_satisfaction_weak_penalty')|+=2%] di [pop_satisfaction|e]"
 nobles_in_target_province_may_agitate_locals_to_rebel_tt: "Gli umili [ShowEstateTypeName('nobles_estate')] di [target_province.GetName] potrebbero cercare di fomentare disordini tra i loro sottoposti in risposta alla nostra linea dura"

 turmoil_in_brandenburg.10.title: "Pedaggi Illegali in [target_location.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.10.desc: "I commercianti lamentano che le strade e i ponti nei dintorni di [target_location.GetName] sono ora intasate da nuovi posti di pedaggio, istituiti senza autorizzazione reale da membri intraprendenti [ROOT.GetCountry.Custom('IT_NOBLES_DEL')][ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. I carri vengono fermati, le merci vengono contate e viene richiesta una moneta in nome della #italic protezione locale#!.\n\nOgni carro che cede a queste imposte deruba [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] dei doveri e indebolisce il principio secondo cui la legge deriva dalla [ROOT.GetCountry.GetGovernment.GetCourtTitle], non dalla torre del castello più vicino."
 turmoil_in_brandenburg.10.a: "Chiudiamo un occhio sui loro pedaggi."
 turmoil_in_brandenburg.10.b: "Abbattiamo le barriere e rivendichiamo i nostri diritti."

 turmoil_in_brandenburg.11.title: "La Casa dei [target_dynasty_1.GetNameWithNoTooltip] Sfida i [target_dynasty_2.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.11.desc: "La tensione è esplosa tra i [target_dynasty_1.GetName] e la nostra casata dei [target_dynasty_2.GetName]. Durante le feste, le battute di caccia e ora anche nei concili, i loro rampolli più importanti mettono in discussione il giudizio e il lignaggio [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle], sottintendendo che il loro sangue non è meno adatto a governare [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName].\n\nQuello che era iniziato come un mormorio di disprezzo si è trasformato in una aperta contesa per il prestigio, i sudditi e l'influenza a corte. Se non prendiamo una posizione ferma, i signori minori potrebbero concludere che la nostra dinastia è solo una delle tante famiglie nobili."
 turmoil_in_brandenburg.11.a: "Sosteniamo con fermezza [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_IL_LA')] nostr[ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_O_A')] [ROOT.GetCountry.GetGovernment.GetRulerTitle]."
 turmoil_in_brandenburg.11.b: "Comprate la pace con concessioni ai [target_dynasty_1.GetNameWithNoTooltip]."

 target_character_2_will_challenge_the_power_nobles_tt: "[ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_ART_TITOLO')|U][target_character_2.GetName] affronterà direttamente la [ShowEstateTypeName('nobles_estate')] riguardo le loro rivendicazioni di potere."

 turmoil_in_brandenburg.12.title: "Investimento a [target_location.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.12.desc: "I consiglieri presentano un piano per convogliare fondi regi a [target_location.GetName] e nelle terre circostanti di [target_province.GetName]. Nuove strade, mercati e uffici porterebbero la presenza [ROOT.GetCountry.GetGovernment.GetRuler.Custom('IT_DEL_TITOLO')][ROOT.GetCountry.GetGovernment.GetRulerTitle] più in profondità nelle campagne, allentando la presa dei magnati locali sul commercio e sulla giustizia.\n\nEppure la [ShowEstateTypeName('nobles_estate')] sostiene che tali miglioramenti dovrebbero passare per le loro mani, non le nostre, avvertendo che un'ingerenza centrale nei loro domini non farà che provocare resistenza."
 turmoil_in_brandenburg.12.a: "Investiamo le risorse della corona e rafforziamo la nostra presa."
 turmoil_in_brandenburg.12.b: "In ogni caso, questa questione non ci riguarda."

 turmoil_in_brandenburg.13.title: "La Crescita di [target_location.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.13.desc: "Figure di spicco di [target_location.GetName] si sono fatti avanti per presentare una petizione alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] per un investimento. Sostengono che nuove strade, sale delle corporazioni e opere pubbliche legherebbero gli insediamenti di [target_province.GetName] più strettamente [ROOT.GetCountry.Custom('IT_Alla')][ROOT.GetCountry.GetName], placando il malcontento tra la popolazione locale.\n\nI nostri tesorieri avvertono tuttavia che tale larghezza graverebbe sulle casse e potrebbe essere vista come indulgenza da altre province ancora in attesa del proprio turno."
 turmoil_in_brandenburg.13.a: "Distribuite gli investimenti su tutta [target_province.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.13.b: "Concentrate i nostri sforzi su [target_location.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.13.c: "Non possiamo permetterci tale generosità."
 
 every_location_in_target_province_gains_center_of_urbanization_modifier_tt: "Ogni [location|e] in [target_province.GetName] riceverà il [modifier|e] [GetModifier('center_of_urbanization_modifier').GetNameWithTooltip] per [ShowNamedValue('modifier_duration_years_very_short')] anni"
 every_location_in_target_province_gains_flourishing_capital_modifier: "Ogni [location|e] in [target_province.GetName] riceverà il [modifier|e] [GetModifier('flourishing_capital_modifier').GetNameWithTooltip] per [ShowNamedValue('modifier_duration_years_very_short')] anni"
 every_location_in_target_province_gains_development_mild_bonus: "Ogni [location|e] in [target_province.GetName] otterrà [ShowNamedValue('development_weak_bonus')|+=] [development|e]"
 every_location_in_target_province_gains_prosperity_extreme_bonus: "Ogni [location|e] in [target_province.GetName] otterrà [ShowNamedValue('prosperity_severe_bonus')|+=2%] [prosperity|e]."


 turmoil_in_brandenburg.100.title: "I $bra_wittelsbach_hyperlink_no_tt$ Rivitalizzano [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.100.entry: "$turmoil_in_brandenburg.100.title$"
 turmoil_in_brandenburg.100.desc: "Dopo anni di povertà e devastazione, di possedimenti autonomi e tirannia dei Baroni Ladri, di sfide e pretendenti, la Casa $bra_wittelsbach_hyperlink$ ha infine prevalso, e [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetFlavorRank] [ROOT.GetCountry.Custom('IT_Di')][ROOT.GetCountry.GetName] è diventato un gioiello nella [ShowRegionName('north_german_region')]. Lunga vita al governo di [target_character.GetName]!"
 turmoil_in_brandenburg.100.a: "[ROOT.GetCountry.Custom('IT_La')|U][ROOT.GetCountry.GetNameWithNoTooltip] diventerà il vanto dei $bra_wittelsbach_hyperlink_no_tt$."

 turmoil_in_brandenburg.200.title: "Il Mistero di [target_character.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.200.desc: "La sua morte fu rapida e inaspettata, eppure la sua eredità tormenta ancora [ROOT.GetCountry.Custom('IT_La')][ROOT.GetCountry.GetName]. [target_character.GetName], il presunto $bra_askanier_hyperlink$ che governò [ROOT.GetCountry.Custom('IT_ART_NOSTRO_RANGO')]nostr[ROOT.GetCountry.Custom('IT_OA_RANGO')] [ROOT.GetCountry.GetFlavorRank] fino al 1320, si rivelò essere il più ingannatore degli impostori e dei cospiratori nella storia [ROOT.GetCountry.Custom('IT_ADJ_FS')]!\n\nAl suo funerale, la sua vecchia tomba fu riesumata affinché [target_character.GetHeShe] potesse riposare definitivamente. Tuttavia, la cerimonia giunse a una conclusione prematura quando lo scheletro di [GetCharacter('bra_waldemar_askanier').GetName] - il #italic $name_waldemar$#! - fu scoperto al suo interno!\n\nCiò portò naturalmente grande vergogna [ROOT.GetCountry.Custom('IT_Alla')][ROOT.GetCountry.GetNameWithNoTooltip], poiché un semplice individuo era riuscito a ingannare l'intero paese..."
 turmoil_in_brandenburg.200.a: "Com'è potuto accadere? Siamo più intelligenti di così..."

 turmoil_in_brandenburg.300.title: "Una Lunga Battaglia Giunge al Termine"
 turmoil_in_brandenburg.300.entry: "$turmoil_in_brandenburg.300.title$"
 turmoil_in_brandenburg.300.desc: "Dopo decenni, la nostra lotta per domare e soggiogare [ROOT.GetCountry.Custom('IT_ART_RANGO')][ROOT.GetCountry.GetLongName] è finalmente giunta al termine. Le dinastie rivali per il nostro trono sono state respinte e le ultime roccaforti dei Baroni Ladri sono state rase al suolo. La nostra azione decisa ci ha accordato l'opportunità di plasmare questo stato a nostro vantaggio, costruendo un'amministrazione in grado di resistere più facilmente a tali mali in futuro."
 turmoil_in_brandenburg.300.a: "Finalmente la pace."

 turmoil_in_brandenburg.1000.title: "Il Ritorno di [target_character.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1000.entry: "Il Ritorno del Pretendente"
 turmoil_in_brandenburg.1000.desc: "Poiché nessun imperatore del $bra_hre_hyperlink$ è più connesso ai regnante $bra_wittelsbach_hyperlink$, la legittimità [bra_ruler.Custom('IT_DEL_TITOLO')][bra_ruler.GetName] è nuovamente in discussione. Il popolo [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName] anela agli anni del governo $bra_askanier_hyperlink$.\n\nMa, come vuole il destino, il presunto defunto [target_character.GetName] ha compiuto una pubblica resurrezione! Affermando che il suo funerale era stato orchestrato per facilitare il suo pellegrinaggio in Terra Santa, [target_character.GetShortNameWithNoTooltip] è tornato a reclamare il trono [ROOT.GetCountry.GetAdjective] [bra_ruler.Custom('IT_DAL_TITOLO')][bra_ruler.GetShortNameWithNoTooltip]."
 turmoil_in_brandenburg.1000.desc.emperor_supports: "$turmoil_in_brandenburg.1000.desc$\n\nFortunamente, i rapporti tra [emperor_ruler.GetName] e [bra_ruler.GetShortNameWithNoTooltip] sono benevoli. Pertanto, il $bra_hre_emperor_hyperlink$ sostiene la casata $bra_wittelsbach_hyperlink_no_tt$ contro il pretendente."
 turmoil_in_brandenburg.1000.desc.emperor_rejects: "$turmoil_in_brandenburg.1000.desc$\n\nSfortunatamente, il $bra_hre_emperor_hyperlink$ favorisce la casata $bra_askanier_hyperlink_no_tt$ rispetto alla $bra_wittelsbach_hyperlink_no_tt$. Pertanto, [emperor_ruler.Custom('IT_ART_TITOLO')][emperor_ruler.GetName] ha concesso il diritto di governare [bra_country.Custom('IT_La')][bra_country.GetNameWithNoTooltip] a [target_character.GetShortNameWithNoTooltip]. Solo stringere un accordo con [emperor_ruler.Custom('IT_ART_TITOLO')][emperor_ruler.GetNameWithNoTooltip] potrebbe risolvere la minaccia di [target_character.GetShortNameWithNoTooltip]..."
 turmoil_in_brandenburg.1000.a: "Contattate il $bra_hre_emperor_hyperlink$!"
 turmoil_in_brandenburg.1000.a.at: "Ogni paese che ha un membro della dinastia $bra_wittelsbach_hyperlink$ come proprio governante guadagna [ShowBiasValue('opinion_support_our_dynasty_member')|+0] [opinion|e] nei confornti  [ROOT.GetCountry.Custom('IT_Della')][ROOT.GetCountry.GetName]"
 turmoil_in_brandenburg.1000.a.tt: "Ci rivolgeremo [ROOT.GetCountry.Custom('IT_Alla')][emperor_country.GetName] e chiederemo il loro aiuto per gestire il pretendente. Ciò richiederà #Y 2 anni#! per essere completato, e saremo costretti a rispettare le condizioni del $bra_hre_emperor_hyperlink$ a meno che la loro [opinion|e] nei nostri confronti non superi #Y 100#!"
 turmoil_in_brandenburg.1000.b: "Execute the pretender ourselves!"
 turmoil_in_brandenburg.1000.b.tt: "Cercheremo di giustiziare [target_character.GetName]. Se l'azione avrà successo, la legittimità di [bra_ruler.GetName] sarà ripristinata e riceveremo un bonus di #Y +5#! al nostro $bra_wittelsbacher_investment_var$ $bra_variable_counter$.\nSe fallisce, scoppierà una [civil_war|e]"
 turmoil_in_brandenburg.1000.c: "Abdichiamo in favore del vero sovrano di [ROOT.GetCountry.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1000.c.at: "Ogni paese che ha un membro della dinastia $bra_wittelsbach_hyperlink$ come sovrano ottiene [ShowBiasValue('opinion_ousted_our_dynasty_member')|+0] di [opinion|e] nei confronti di [ROOT.GetCountry.GetName]"
 turmoil_in_brandenburg.false_waldemar_rebel.tt: "I [ShowPopTypeName('nobles')] e i [ShowPopTypeName('peasants')] di un massimo di #Y 4#! tra le località possedute più popolose ottengono i seguenti effetti:\n- Perdono [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e]\n- Si uniscono a [false_waldemar_rebel.GetName]"

 turmoil_in_brandenburg.1001.title: "Rise of [target_character.GetShortNameWithNoTooltip] in [bra_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1001.desc.imposter_revealed: "Un ambasciatore di [bra_country.GetName] è giunto alla nostra grande corte per chiedere il nostro sostegno contro un pretendente emergente, rivale di [bra_ruler.GetName]. A quanto pare, questo sedicente '[target_character.GetName]' afferma di essere tornato da un pellegrinaggio in Terra Santa, e ora rivendica il trono [bra_country.GetAdjectiveWithNoTooltip].\n\nTuttavia, ci sono giunte notizie di un inganno: questo '$name_waldemar$' non è altro che un impostore!"
 turmoil_in_brandenburg.1001.desc: "Un ambasciatore di [bra_country.GetName] è giunto alla nostra corte per chiedere il nostro sostegno in un conflitto dinastico. L'ex sovrano di [bra_country.GetNameWithNoTooltip], [target_character.GetName], è tornato da un lungo pellegrinaggio in Terra Santa e rivendica nuovamente per sé il trono [bra_country.GetAdjective]. [bra_ruler.GetName] trova scarso sostegno tra i [bra_ruler.GetHisHer] sudditi, e ha espresso la [bra_ruler.GetHisHer] disponibilità a negoziare con noi in cambio del nostro appoggio contro il pretendente."
 turmoil_in_brandenburg.1001.help.tt: "[target_character.GetName] sarà bandito da [bra_country.GetName], e il [modifier|e] [ShowModifier('bra_waldemar_rallies_nobility')] gli sarà rimosso"
 turmoil_in_brandenburg.1001.a: "Sosterremo la loro causa in cambio dell'oro."
 turmoil_in_brandenburg.1001.a.tt: "Riceveremo [ROOT.GetVariable('bra_gold_tooltip_var').GetValue|+=2] di [gold|e] da [bra_country.GetName] entro #Y 1 anno#!"
 turmoil_in_brandenburg.1001.b: "Una mano lava l'altra. Aiutiamoli!"
 turmoil_in_brandenburg.1001.b.tt: "[bra_country.GetName] voterà per noi entro #Y 1 anno#!"
 turmoil_in_brandenburg.1001.c: "Aiuteremo i $bra_wittelsbach_hyperlink_no_tt$ in cambio del loro sostegno politico."
 turmoil_in_brandenburg.1001.c.tt: "Riceveremo [ShowBiasValue('opinion_supported_the_wittelsbacher')|+=0] di [opinion|e] con tutti i [countries|e] che hanno la [dynasty|e] $bra_wittelsbach_hyperlink$ al potere entro #Y 1 anno#!"
 turmoil_in_brandenburg.1001.d: "The $bra_wittelsbach_hyperlink_no_tt$ shall be supported."
 turmoil_in_brandenburg.1001.d.tt: "Non chiederemo nulla in cambio"
 turmoil_in_brandenburg.1001.e: "Non abbiamo nulla da guadagnare nell'aiutare i $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.1001.e.tt: "Rifiuteremo di sostenere i $bra_wittelsbach_hyperlink$, riducendo di [ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0] la [opinion|e] di tutti i [countries|e] che hanno i $bra_wittelsbach_hyperlink_no_tt$ come [dynasty|e] regnante, ma migliorando l'opinione di tutti i paesi con la dinastia $bra_askanier_hyperlink$ di [ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0] entro #Y 1 anno#!"
 turmoil_in_brandenburg.1001.zzz: "[bra_ruler.GetShortNameWithNoTooltip] shall be allowed to exercise justice as [bra_ruler.GetHeShe] sees fit."
 turmoil_in_brandenburg.1001.zzz.tt: "[bra_country.GetName] potrà occuparsi di [target_character.GetName] come meglio crede"

 turmoil_in_brandenburg.1002.title: "Il Sostegno del $bra_hre_emperor_hyperlink$"
 turmoil_in_brandenburg.1002.desc: "Eccezionali notizie sono giunte alla nostra corte! Il $bra_hre_emperor_hyperlink$, [emperor_ruler.GetName] di [emperor_country.GetName], ha espresso il proprio sincero sostegno a [bra_ruler.GetName] nella lotta contro il pretendente [target_character.GetName]!"
 turmoil_in_brandenburg.1002.desc.gold: "$turmoil_in_brandenburg.1002.desc$\n\nNaturalmente, un simile sostegno non è gratuito. [emperor_ruler.GetShortNameWithNoTooltip] ha evidenziato il peso finanziario che il [emperor_ruler.GetHisHer] appoggio imporrebbe sulle [emperor_ruler.GetHisHer] casse. Per questo, [emperor_ruler.GetHeShe] chiede in cambio un tributo di [ROOT.GetVariable('bra_owes_gold').GetValue|V2] oro."
 turmoil_in_brandenburg.1002.desc.loyalty: "$turmoil_in_brandenburg.1002.desc$\n\nNaturalmente, un simile sostegno non è gratuito. [emperor_ruler.GetShortNameWithNoTooltip] è preoccupato per la [emperor_ruler.GetHisHer] successione nel $bra_hre_hyperlink$, e richiede la nostra piena lealtà alla causa della [emperor_ruler.GetHisHer] famiglia per assicurare il Trono Imperiale."
 turmoil_in_brandenburg.1002.desc.relations: "$turmoil_in_brandenburg.1002.desc$\n\nNaturalmente, un simile sostegno non è gratuito. [emperor_ruler.GetShortNameWithNoTooltip] desidera che agiamo come suo araldo all'interno dei $bra_wittelsbach_hyperlink$, mostrando la gloria di [emperor_country.GetNameWithNoTooltip] a ogni membro della dinastia."
 turmoil_in_brandenburg.1002.desc.free: "$turmoil_in_brandenburg.1002.desc$\n\nCon nostra sorpresa, il $bra_hre_emperor_hyperlink$ non ha chiesto nulla in cambio. Il loro aiuto nasce dalla buona fede, senza alcuna condizione."
 turmoil_in_brandenburg.1002.a: "Finalmente, l'autorità dei $bra_wittelsbach_hyperlink_no_tt$ è ripristinata!"
 turmoil_in_brandenburg.1002.a.tt: "Ogni [country|e] con i $bra_wittelsbach_hyperlink$ come [dynasty|e] regnante ottiene [ShowBiasValue('opinion_supported_the_wittelsbacher')|0] di [opinion|e] nei confronti di [emperor_country.GetName]"

 turmoil_in_brandenburg.1003.title: "Emperor Refuses to Give Support"
 turmoil_in_brandenburg.1003.desc.dead: "Ci sono giunte notizie dal $bra_hre_emperor_hyperlink$. Sebbene [emperor_ruler.GetName] abbia assunto un atteggiamento ostile verso i nostri interessi durante la [emperor_ruler.GetHisHer] vita, le sue ragioni restano note soltanto a [emperor_ruler.GetHerselfHimself]. Pertanto, [target_character.GetName] resta senza rivali..."
 turmoil_in_brandenburg.1003.desc.wittelsbach: "Terribili notizie sono giunte alla nostra corte! Mentre il caos causato da [target_character.GetName] cresce d'intensità, il $bra_hre_emperor_hyperlink$ ha finalmente rivelato la posizione [emperor_country.GetAdjective] sulla questione. Nonostante il legame di sangue, [emperor_ruler.GetName] rifiuta di sostenere [bra_ruler.GetName], e si oppone apertamente alla propria stessa dinastia!"
 turmoil_in_brandenburg.1003.desc: "Terribili notizie sono giunte alla nostra corte! Mentre il caos causato da [target_character.GetName] cresce d'intensità, il $bra_hre_emperor_hyperlink$ ha finalmente rivelato la posizione [emperor_country.GetAdjective] sulla questione: [emperor_ruler.GetName] rifiuta di sostenere [bra_ruler.GetName], e si oppone apertamente ai $bra_wittelsbach_hyperlink_no_tt$!"
 turmoil_in_brandenburg.1003.a: "Che giornata orribile per essere il [ROOT.GetCountry.GetGovernment.GetRulerTitle]..."
 turmoil_in_brandenburg.1003.a.tt: "Ogni [country|e] con i $bra_wittelsbach_hyperlink$ come [dynasty|e] regnante perde [ShowBiasValue('opinion_rejected_helping_wittelsbacher')|+=0] di [opinion|e] nei confronti di [emperor_country.GetName], mentre ogni paese con la dinastia $bra_askanier_hyperlink$ regnante ottiene [ShowBiasValue('opinion_rejected_helping_wittelsbacher_askanier')|+=0] di opinione nei loro confronti"

 turmoil_in_brandenburg.1004.title: "Il Sostegno Incondizionato del $bra_hre_emperor_hyperlink$"
 turmoil_in_brandenburg.1004.desc: "Ci sono giunte notizie dal $bra_hre_emperor_country_hyperlink$. A causa delle azioni disonorevoli di [target_character.GetName], il $bra_hre_emperor_hyperlink$ ci ha concesso il diritto incondizionato di occuparci dell'impostore come meglio crediamo."
 turmoil_in_brandenburg.1004.a: "Banish [target_character.GetHimHer]."
 turmoil_in_brandenburg.1004.b: "Execute [target_character.GetHimHer]."
 turmoil_in_brandenburg.1004.c: "[target_character.GetHisHer|U] abilities might actually come in handy for us..."
 turmoil_in_brandenburg.1004.c.tt: "[target_character.GetName] riceve un'altra possibilità e diventerà disponibile per il nostro gabinetto"

 turmoil_in_brandenburg.1005.title: "Questionable Authenticity"
 turmoil_in_brandenburg.1005.desc: "Il dominio dei $bra_wittelsbach_hyperlink$ è giunto al termine, e i gloriosi $bra_askanier_hyperlink$ sono finalmente tornati a [bra_country.GetName]. Eppure, il sospetto grava sul neo-incoronato [ROOT.GetCountry.GetGovernment.GetRulerTitle]. [target_character.GetName] non ricorda i successi del proprio passato prima del proprio presunto funerale inscenato, i membri dei $bra_askanier_hyperlink_no_tt$ notano inspiegabili cambiamenti nell'aspetto del loro amato congiunto, e persino il suo modo di governare è notoriamente diverso da come lo si ricordava. [target_character.GetShortNameWithNoTooltip] attribuisce queste incongruenze alle esperienze vissute durante il [target_character.GetHisHer] pellegrinaggio in Terra Santa..."
 turmoil_in_brandenburg.1005.a: "Start an investigation into [target_character.GetHisHer] story."
 turmoil_in_brandenburg.1005.a.tt: "Ha inizio un'indagine sulla storia di [target_character.GetName], che rivelerà il suo vero legame con i $bra_askanier_hyperlink$..."
 turmoil_in_brandenburg.1005.b: "Sono solo voci non confermate..."

 turmoil_in_brandenburg.1006.title: "Investigations Against [target_character.GetShortNameWithNoTooltip]"
 turmoil_in_brandenburg.1006.desc: "Dopo due anni di ricerche, indagini e confronti tra documenti, il caso sull'autenticità di [target_character.GetName], attuale [ROOT.GetCountry.GetGovernment.GetRulerTitle], è finalmente giunto a una conclusione."
 turmoil_in_brandenburg.1006.desc.true_askanier: "$turmoil_in_brandenburg.1006.desc$\n\nSecondo le indagini, [target_character.GetName] è davvero un membro dei $bra_askanier_hyperlink$, anche se non è il vero [GetCharacter('bra_waldemar_askanier').GetName] che affermava di essere. [target_character.GetHeShe] condivide lo stesso nome del nostro defunto Margravio, ma è emerso che è stato scambiato per errore con lo $name_waldemar$ sbagliato."
 turmoil_in_brandenburg.1006.desc.false_askanier: "$turmoil_in_brandenburg.1006.desc$\n\nNonostante tutti i suoi sforzi per mantenere la finzione, la messinscena è infine crollata quando [target_character.GetHeShe] è stato messo di fronte ai fatti. [target_character.GetShortNameWithNoTooltip] non è altro che un impostore, avendo ingannato chiunque a corte e persino i membri dei $bra_askanier_hyperlink$, facendo loro credere che [GetCharacter('bra_waldemar_askanier').GetName] fosse vivo e vegeto. Per questo, lo sdegno nella corte [bra_country.GetAdjectiveWithNoTooltip] è piuttosto forte, e molte fazioni del governo chiedono una risoluzione."
 turmoil_in_brandenburg.1006.a: "Le somiglianze erano semplicemente così sorprendenti!"
 turmoil_in_brandenburg.1006.a.tt: "[target_character.GetName] e ogni discendente cambieranno la propria [dynasty|e] in $bra_askanier_hyperlink$"
 turmoil_in_brandenburg.1006.b: "Almeno [target_character.GetHeShe] non è un $bra_wittelsbach_hyperlink_no_tt$..."
 turmoil_in_brandenburg.1006.b.tt: "[target_character.GetName] e ogni discendente cambieranno la propria [dynasty|e] in [target_dynasty.GetName]"
 turmoil_in_brandenburg.1006.c: "Remove the imposter!"

 turmoil_in_brandenburg.1007.title: "Esecuzione del Falso [target_character.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1007.desc.successful_execution: "[target_character.GetName] è stato catturato con successo e imprigionato da coloro che sono leali a [bra_ruler.GetName]. Inoltre, [emperor_ruler.GetName] ha dato retroattivamente il consenso di [emperor_ruler.GetHisHer] alle nostre azioni, risparmiandoci conseguenze più gravi. A quanto pare, [target_character.GetShortNameWithNoTooltip] non è affatto un $bra_askanier_hyperlink$, nemmeno un membro del nostro prestigioso [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]! [target_character.GetSheHe|U] è stato accusato di impostura, tradimento e minaccia alla stabilità [bra_country.Custom('IT_Di')][bra_country.GetName], ed è stato giudicato colpevole..."
 turmoil_in_brandenburg.1007.desc.failed_execution: "Nel cuore della notte, [target_character.GetName] è stato catturato e imprigionato a [bra_country.GetCapital.GetName] in attesa della presunta esecuzione di [target_character.GetHisHer] alle prime luci dell'alba. Tuttavia, [target_character.GetShortNameWithNoTooltip] ha dimostrato [target_character.GetHerselfHimself] più astuto, avendo previsto ogni nostra mossa. Dopo il rapimento, un grande gruppo di nobili, membri del nostro [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], ha assaltato le prigioni del palazzo e liberato il pretendente.\n\nOra [bra_country.Custom('IT_La')][bra_country.GetName] affronta una guerra civile dalle dimensioni imprevedibili. Come lieve beneficio nella nostra disastrosa situazione, [emperor_ruler.GetName] ha deciso di sostenere passivamente la nostra decisione di procedere con l'esecuzione."
 turmoil_in_brandenburg.1007.a: "Another crisis well averted."
 turmoil_in_brandenburg.1007.b: "To arms!"
 bra_true_waldemar_identity_reveal_tt: "#italic La vera identità di [target_character.GetName] sarà rivelata...#!"
 turmoil_in_brandenburg.false_waldemar_big_rebel.tt: "I [ShowPopTypeName('nobles')] e i [ShowPopTypeName('peasants')] di un massimo di #Y 16#! tra le località possedute più popolose ottengono i seguenti effetti:\n- Perdono [ShowNamedValue('pop_satisfaction_ultimate_penalty')|+=2%] di [pop_satisfaction|e]\n- Si uniscono a [false_waldemar_rebel.GetName]"
 false_waldemar_rebel: "Supporters of $name_waldemar$"

 turmoil_in_brandenburg.1100.title: "L'Incuria di [root_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1100.entry: "L'Incuria del Regno"
 turmoil_in_brandenburg.1100.desc: "Le terre di [root_country.GetName] sono sempre state piuttosto sottosviluppate. Eppure, nemmeno nei momenti peggiori, [root_country.GetNameWithNoTooltip] è mai stata così allo sbando come sotto le mani dei $bra_wittelsbach_hyperlink$.\n\nNotizie di questa grave situazione sono giunte al $bra_hre_emperor_hyperlink$. Il destino di [root_ruler.GetName] e del suo dominio su queste terre è in bilico..."
 turmoil_in_brandenburg.1100.a: "Di certo, il $bra_hre_emperor_hyperlink$ comprenderà la nostra situazione."
 turmoil_in_brandenburg.1100.a.tt: "Il $bra_hre_emperor_hyperlink$ deciderà il nostro destino. Il $bra_hre_emperor_hyperlink$ potrebbe decidere di nominare per noi un nuovo sovrano proveniente da un'altra dinastia."
 turmoil_in_brandenburg.1101.title: "I $bra_wittelsbach_hyperlink_no_tt$ Falliscono il $bra_hre_hyperlink_no_tt$"
 turmoil_in_brandenburg.1101.desc: "La situazione in uno dei nostri elettori, il [root_country.GetFlavorRank] di [root_country.GetName], si è rivelata piuttosto cupa. La tirannia dei Baroni Ladri locali, un'economia in completo collasso e un [root_country.GetGovernment.GetRulerTitle] negligente, [root_ruler.GetName], affliggono queste terre, rendendole una vergogna all'interno del $bra_hre_hyperlink$. È nostro dovere, in quanto $bra_hre_emperor_hyperlink$ del $bra_hre_hyperlink_no_tt$, non permettere che una simile grave cattiva amministrazione continui."
 turmoil_in_brandenburg.1101.a: "Assumiamo il controllo diretto del [root_country.GetFlavorRank]."
 turmoil_in_brandenburg.1101.a.tt: "Porremo [emperor_ruler.GetName] come nuovo [ruler|e] di [root_country.GetName], formando una [union|e] con loro"
 turmoil_in_brandenburg.1101.b: "Let [dynasty_character.GetNameWithNoTooltip] rule over [root_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1101.b.tt: "Porremo [dynasty_character.GetName] come nuovo [ruler|e] di [root_country.GetName]"
 turmoil_in_brandenburg.1101.c: "[cabinet_character.GetNameWithNoTooltip] governerà su di esso in nostro nome."
 turmoil_in_brandenburg.1101.c.tt: "Porremo [cabinet_character.GetName] come nuovo [ruler|e] di [root_country.GetName], rendendolo nostro [ShowSubjectTypeName('vassal')], ma causando [ShowBiasValue('subjugated_elector_antagonism')|-=0] di [antagonism|e] con ogni membro del [GetUniqueInternationalOrganization('hre').GetName]"
 subjugated_elector_antagonism: "Subjugated Elector"
 turmoil_in_brandenburg.1101.d: "Uno dei nostri consiglieri di corte risolverà la situazione [root_country.GetAdjectiveWithNoTooltip]."
 turmoil_in_brandenburg.1101.d.tt: "Porremo un consigliere locale della nostra corte come nuovo [ruler|e] di [root_country.GetName]"
 turmoil_in_brandenburg.1101.e: "Lasciamo stare i $bra_wittelsbach_hyperlink_no_tt$, sapranno rimediare da soli."
 turmoil_in_brandenburg.1101.e.tt: "Lasceremo in pace i $bra_wittelsbach_hyperlink$, permettendo loro di continuare a governare su [root_country.GetName]"

 turmoil_in_brandenburg.1102.title: "The $bra_hre_emperor_hyperlink$'s Reply"
 turmoil_in_brandenburg.1102.desc.wittelsbach: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che le terre di [root_country.GetName] saranno unite a quelle di [emperor_country.GetNameWithNoTooltip], con [emperor_ruler.GetName] come sovrano comune."
 turmoil_in_brandenburg.1102.desc: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che da oggi in poi i $bra_wittelsbach_hyperlink$ non sono più al potere. Le terre di [root_country.GetName] cadono direttamente nelle mani di [emperor_ruler.GetName], costringendoci in un'unione personale con [emperor_country.GetNameWithNoTooltip]."
 turmoil_in_brandenburg.1102.a: "Long live the $bra_hre_emperor_hyperlink$!"
 turmoil_in_brandenburg.1102.b: "Si spera che questa volta [root_country.GetLongNameWithNoTooltip] riesca a tenere tutto insieme."

 turmoil_in_brandenburg.1103.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1103.desc.wittelsbach: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che le terre di [root_country.GetName] saranno governate da [dynasty_character.GetName]."
 turmoil_in_brandenburg.1103.desc: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che da oggi in poi i $bra_wittelsbach_hyperlink$ non sono più al potere. Le terre di [root_country.GetName] cadono direttamente nelle mani di [dynasty_character.GetName]."
 turmoil_in_brandenburg.1103.a: "May [dynasty_character.GetShortNameWithNoTooltip] rule with strength."
 turmoil_in_brandenburg.1103.b: "Una nuova opportunità per [root_country.GetLongNameWithNoTooltip], a quanto pare."

 turmoil_in_brandenburg.1104.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1104.desc.wittelsbach: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che le terre saranno governate da un nuovo membro della dinastia $bra_wittelsbach_hyperlink$ - qualcuno che ha già dimostrato in passato di essere affidabile. [root_country.GetName] è ora sotto la cura di [cabinet_character.GetName], il più leale tra i vassalli [emperor_country.GetAdjectiveWithNoTooltip]."
 turmoil_in_brandenburg.1104.desc: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che da oggi in poi i $bra_wittelsbach_hyperlink$ non sono più al potere. Le terre di [root_country.GetName] cadono direttamente nelle mani di [cabinet_character.GetName], il più leale tra i vassalli [emperor_country.GetAdjectiveWithNoTooltip]."
 turmoil_in_brandenburg.1104.a: "Almeno non è un $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.1104.b: "Oh, fantastico... i $bra_wittelsbach_hyperlink_no_tt$ sono tornati..."
 turmoil_in_brandenburg.1104.c: "Non piegheremo il ginocchio davanti a [emperor_country.GetNameWithNoTooltip]!"

 turmoil_in_brandenburg.1105.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1105.desc: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che da oggi in poi i $bra_wittelsbach_hyperlink$ non sono più al potere. Le terre di [root_country.GetName] cadono direttamente nelle mani di [hohenzollern_character.GetName], un fidato consigliere dei $bra_wittelsbach_hyperlink_no_tt$."
 turmoil_in_brandenburg.1105.a: "May [hohenzollern_character.GetHeShe] rule with wisdom."

 turmoil_in_brandenburg.1106.title: "$turmoil_in_brandenburg.1102.title$"
 turmoil_in_brandenburg.1106.desc: "Un ambasciatore di [emperor_country.GetName] è giunto alla nostra corte. Egli proclama che i sovrani $bra_wittelsbach_hyperlink$ riceveranno un ammonimento imperiale, ma potranno conservare il [root_country.GetFlavorRank]."
 turmoil_in_brandenburg.1106.a: "[root_country.GetNameWithNoTooltip] rimarrà per sempre proprietà dei $bra_wittelsbach_hyperlink_no_tt$..."

 turmoil_in_brandenburg.1107.title: "La Resistenza di [root_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1107.desc: "Questo stato ostinato e fallimentare, [root_country.GetName], si rifiuta di inchinarsi davanti a noi e al nostro dominio. È più che evidente che la loro guida incompetente manca di visione, e abbiamo quindi più che sufficienti ragioni per sottometterli con la forza."
 turmoil_in_brandenburg.1107.a: "Non abbiamo tolleranza per i traditori!"

 turmoil_in_brandenburg.1200.title: "The [bra_country.GetAdjectiveWithNoTooltip] Burden"
 turmoil_in_brandenburg.1200.desc: "Dopo anni di cattiva amministrazione da parte dei $bra_wittelsbach_hyperlink$, la casata di [emperor_dynasty.GetName] ha assunto il controllo dell'amministrazione di [bra_country.GetName]. Sebbene le nostre intenzioni per il [bra_country.GetFlavorRank] siano genuine e nel loro miglior interesse, è evidente che i nostri sforzi non bastano a rimediare ai danni causati dall'incuria dei $bra_wittelsbach_hyperlink_no_tt$.\n\nUno dei nostri consiglieri di corte, [hohenzollern_character.GetName], ha dimostrato grande competenza in materia di amministrazione e diplomazia. Affidare a [hohenzollern_character.GetHimHer] la guida di [bra_country.GetNameWithNoTooltip] e concedergli l'autonomia necessaria potrebbe aiutare [bra_country.GetNameWithNoTooltip] a riprendersi."
 turmoil_in_brandenburg.1200.a: "Affideremo il [bra_country.GetFlavorRank] a [hohenzollern_character.GetShortNameWithNoTooltip]."
 turmoil_in_brandenburg.1200.a.tt: "Il [ruler|e] di [bra_country.GetName] sarà sostituito con [hohenzollern_character.GetName]"
 turmoil_in_brandenburg.1200.b: "Sciocchezze. Possiamo ancora guidare [bra_country.GetNameWithNoTooltip] da soli."

 turmoil_in_brandenburg.1201.title: "[hohenzollern_character.GetNameWithNoTooltip] - Il Nuovo Sovrano di [bra_country.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1201.desc: "Dopo anni di cattiva amministrazione da parte dei $bra_wittelsbach_hyperlink$, i signori di [emperor_country.GetName] hanno preso il controllo di [bra_country.GetName]. Sebbene le loro intenzioni siano nel nostro miglior interesse, i loro doveri verso il $bra_hre_hyperlink$ hanno reso loro impossibile governare le nostre terre con un impegno maggiore di quello del più entusiasta membro della dinastia $bra_wittelsbach_hyperlink_no_tt$.\n\nFortunatamente per noi, [emperor_ruler.GetName] è consapevole della situazione e ha inviato il proprio consigliere più talentuoso, [hohenzollern_character.GetName], per amministrare [bra_country.GetNameWithNoTooltip] in autonomia."
 turmoil_in_brandenburg.1201.a: "Che [hohenzollern_character.GetHeShe] possa governare con saggezza e forza."

 turmoil_in_brandenburg.1300.title: "Rise of Robber Barons"
 turmoil_in_brandenburg.1300.entry: "$turmoil_in_brandenburg.1300.title$"
 turmoil_in_brandenburg.1300.desc: "Un controllo debole da parte del [ROOT.GetCountry.GetGovernment.GetRulerTitle] e una diffusa illegalità hanno portato all'ascesa dei Baroni Ladri - nobili che vivono di illegalità e conducono una vita di crimine. La loro presenza serve solo a indebolire il nostro controllo e a minare l'autorità di [target_ruler.GetName]. Attualmente, la loro presa è più forte a [robber_baron_province.GetName]."
 turmoil_in_brandenburg.1300.a: "Ce ne occuperemo a tempo debito."
