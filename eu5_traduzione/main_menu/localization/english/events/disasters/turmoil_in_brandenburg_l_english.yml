 turmoil_in_brandenburg.1301.title: "Robber Barons in [robber_baron_province.GetNameWithNoTooltip]"
 turmoil_in_brandenburg.1301.entry: "Baroni Predoni nella Provincia dei Baroni Predoni"
 turmoil_in_brandenburg.1301.desc: "La piaga dei Baroni Ladri si è diffusa nella provincia di [robber_baron_province.GetName]. Le loro dimostrazioni di criminalità e arroganza equivalgono a uno sputo in faccia. È tempo di dare loro una lezione — e di ripristinare l'autorità centrale nel paese."
 turmoil_in_brandenburg.1301.a: "Ce ne occuperemo a tempo debito."

 turmoil_in_brandenburg.1302.title: "The von Quitzow"
 turmoil_in_brandenburg.1302.entry: "$turmoil_in_brandenburg.1302.title$"
 turmoil_in_brandenburg.1302.desc: "Tra tutti i Baroni Ladri, pochi hanno un'influenza paragonabile a quella della famiglia von Quitzow. I loro possedimenti sono numerosi in tutta l'area di [ShowProvinceDefinitionName('mittelmark_province')], e detengono vasti feudi. Eppure, nonostante tutta questa ricchezza, si sono comunque votati a una vita di crimine. Li schiacceremo, e distruggeremo i loro possedimenti prima che causino il caos totale."
 turmoil_in_brandenburg.1302.a: "Dobbiamo occuparcene!"
 turmoil_in_brandenburg.1302.b: "We had better take a careful approach."
 turmoil_in_brandenburg.1302.historical_info: "La famiglia von Quitzow fu la casata nobiliare più influente nel Brandeburgo dell'inizio del XV secolo. Durante la centralizzazione della Marca attuata da Federico I von Hohenzollern tra il 1411 e il 1415, i celebri fratelli Baroni Ladri Hans e Dietrich furono presi di mira dal nuovo elettore, che conquistò i loro castelli e pose fine all'epoca del predominio dei von Quitzow nel Brandeburgo."
 STATIC_MODIFIER_NAME_PRU_quitzow_modifier: "Influence of von Quitzow"
 STATIC_MODIFIER_NAME_PRU_quitzow_repressed_modifier: "Repressing the von Quitzow"
 bra_quitzow_revolt: "Quitzow Revolt"

 turmoil_in_brandenburg.1303.title: "Ending Robber Baron Rule"
 turmoil_in_brandenburg.1303.entry: "$turmoil_in_brandenburg.1303.title$"
 turmoil_in_brandenburg.1303.desc: "Sebbene siano occorsi molti anni e numerose campagne, siamo finalmente riusciti a tenere a freno la presuntuosa [ShowEstateTypeName('nobles_estate')]. D'ora in poi, tutte le rotte commerciali del paese sono al sicuro dai briganti di origine nobile, e nessun uomo comune ha più nulla da temere. Inoltre, la maggior parte dei contadini non sarà più costretta a pagare il pizzo al [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')]."
 turmoil_in_brandenburg.1303.a: "Il [ROOT.GetCountry.GetFlavorRank] è di nuovo intero."
 STATIC_MODIFIER_NAME_PRU_end_of_robber_barons: "Fine dell'Era dei Baroni Ladri"
 robber_barons_aftermath_tt: "I baroni predoni sono stati neutralizzati"
 
 turmoil_in_brandenburg.1304.title: "Punishing the Robber Barons"
 turmoil_in_brandenburg.1304.entry: "$turmoil_in_brandenburg.1304.title$"
 turmoil_in_brandenburg.1304.desc: "Sebbene siamo riusciti a prevalere nella nostra lotta contro la ribelle [ShowEstateTypeName('nobles_estate')], molti alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] ritengono che sconfiggerli semplicemente non serva a nulla, e che il [ROOT.GetCountry.GetGovernment.GetRulerTitle] debba farli pagare per il loro tradimento. Mentre molti sostengono questa proposta, altri ritengono che un ulteriore inasprimento non sia necessario, specialmente dato che abbiamo già riaffermato il nostro controllo."
 turmoil_in_brandenburg.1304.a: "Pagheranno per il loro tradimento!"
 turmoil_in_brandenburg.1304.b: "Punish them mildly."
 turmoil_in_brandenburg.1304.c: "Non c'è bisogno di ulteriori punizioni."

