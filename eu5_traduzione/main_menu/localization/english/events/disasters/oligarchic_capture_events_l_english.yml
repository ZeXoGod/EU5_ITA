l_english:

  oligarchic_capture.1.title: "La Fazione si Leva"
  oligarchic_capture.1.desc: "Anni di decadenza hanno svuotato le nostre istituzioni repubblicane. Un ceto dominante, avvertendo la debolezza, si è mosso per impadronirsi per sé dell'apparato legislativo, escludendo i rivali e piegando la legge al proprio volere. Dobbiamo decidere come affrontare questa sfida: piegarci alla fazione e preservare una fragile pace, oppure resisterle e rischiare una rivolta aperta."
  oligarchic_capture.1.a: "Pieghiamoci alle richieste della fazione."
  oligarchic_capture.1.b: "Resistiamo, qualunque sia il costo!"
  oligarchic_capture.1.tt: "Le province più scontente si solleveranno a sostegno della fazione [ShowDisasterName('oligarchic_capture')]"

  oligarchic_capture.2.title: "Gli Oligarchi Esigono un Tributo"
  oligarchic_capture.2.desc: "I capi della fazione ci presentano una richiesta di denaro appena velata, spacciata per contributo al bene pubblico. Se paghiamo, la loro agitazione si calmerà per un po'. Se rifiutiamo, useranno la nostra sfida per raccogliere ancora più sostegno alla loro causa."
  oligarchic_capture.2.a: "Paghiamoli."
  oligarchic_capture.2.b: "Non ci faremo estorcere."

  oligarchic_capture.3.title: "I Cittadini si Mobilitano per la Riforma"
  oligarchic_capture.3.desc: "Folle si radunano nelle piazze pubbliche, chiedendo il ripristino di un governo onesto e la fine del dominio delle fazioni. Il loro fervore è un'occasione per riconquistare lo spirito repubblicano, sebbene assecondare la plebaglia rischi di generare disordini."
  oligarchic_capture.3.a: "Facciamoci paladini della loro causa."
  oligarchic_capture.3.b: "Manteniamo l'ordine nelle strade."

  oligarchic_capture.4.title: "Epurata una Fazione del Senato"
  oligarchic_capture.4.desc: "Gli oligarchi si muovono per espellere un blocco di senatori che ritengono sleali. Consentire l'epurazione stabilizzerebbe il reame nel breve termine, ma darebbe alla fazione un'ulteriore vittoria. Proteggere gli accusati difenderebbe le nostre istituzioni al prezzo di ulteriori turbolenze."
  oligarchic_capture.4.a: "Lasciamo che l'epurazione proceda."
  oligarchic_capture.4.b: "Proteggiamo gli accusati."

  oligarchic_capture.5.title: "Disordini nelle Strade"
  oligarchic_capture.5.desc: "Risse tra i partigiani della fazione e i loro avversari dilagano nei mercati e sulle banchine. Possiamo lasciare che gli animi si raffreddino da soli, oppure inviare le nostre guardie a ristabilire l'ordine con mano ferma."
  oligarchic_capture.5.a: "Lasciamo che gli animi si calmino."
  oligarchic_capture.5.b: "Reprimiamo con durezza."

  oligarchic_capture.100.title: "La Repubblica Restaurata"
  oligarchic_capture.100.desc: "La morsa della fazione è stata spezzata. I nostri tribunali, consigli e assemblee rispondono di nuovo ai cittadini anziché a una cricca di grandi. La repubblica ha superato la tempesta, e le sue istituzioni ne escono temprate dalla prova."
  oligarchic_capture.100.a: "Le nostre istituzioni perdurano."

  oligarchic_capture.101.title: "La Costituzione Oligarchica si Radica"
  oligarchic_capture.101.desc: "La fazione ha vinto. Una nuova costituzione, scritta per servire gli oligarchi, incide il loro dominio nelle fondamenta stesse dello stato. Per una generazione, la nostra repubblica lo sarà solo di nome, con le sue cariche scambiate in una ristretta cerchia di potenti."
  oligarchic_capture.101.desc.ringleader: "La fazione ha vinto, e il suo capo, [oligarchic_ringleader_scope.GetName], esce dalle retrovie del senato per reclamare apertamente la corona. Per una generazione, la nostra repubblica lo sarà solo di nome, con le sue cariche scambiate in una ristretta cerchia di potenti."
  oligarchic_capture.101.a: "La fazione ha vinto."
  oligarchic_capture.101.b: "[oligarchic_ringleader_scope.GetName] prende la corona."

  oligarchic_capture.6.title: "Smascherare il Capo"
  oligarchic_capture.6.desc: "I nostri agenti hanno trascorso settimane a seguire il denaro, i favori e le istruzioni sussurrate attraverso i ranghi della fazione. Alla fine emerge un solo nome come colui che ne dirige davvero il corso: [oligarchic_ringleader_scope.GetName]."
  oligarchic_capture.6.a: "Ora sappiamo con chi fare i conti."

  oligarchic_capture.7.title: "Affrontare il Capo"
  oligarchic_capture.7.desc.ready: "Con [oligarchic_ringleader_scope.GetName] smascherato, possiamo muoverci direttamente contro di lui. L'autorità della corona si è ripresa abbastanza da permettere di spezzare rapidamente la fazione."
  oligarchic_capture.7.desc.not_ready: "Con [oligarchic_ringleader_scope.GetName] smascherato, potremmo muoverci direttamente contro di lui, ma l'autorità della corona non si è ancora ripresa abbastanza. Colpire troppo presto potrebbe solo compattare ulteriormente la fazione."
  oligarchic_capture.7.a: "Muoviamoci contro di lui."
  oligarchic_capture.7.a.success_tt: "Il nostro [crown_power|e] ha raggiunto almeno il 30%, perciò il tentativo riesce"
  oligarchic_capture.7.a.fail_tt: "Il nostro [crown_power|e] non ha ancora raggiunto il 30%, perciò il tentativo fallisce e il contraccolpo ci costa caro in stabilità"

  oligarchic_capture.8.title: "Negoziare Concessioni ai Ceti"
  oligarchic_capture.8.desc: "Anziché affrontare apertamente la fazione, apriamo un discreto canale di negoziazione, offrendo oro e piccole concessioni per placare le sue lagnanze e rallentarne la crescita."
  oligarchic_capture.8.a: "Apriamo i negoziati."

  oligarchic_capture.12.title: "Il Capo Corteggia un Cortigiano"
  oligarchic_capture.12.desc: "Ci giunge voce che il capo della fazione stia discretamente corteggiando un membro della nostra stessa corte, offrendo favori e promesse in cambio di sostegno. Possiamo chiudere un occhio, oppure muoverci per rafforzare la lealtà del cortigiano."
  oligarchic_capture.12.a: "Lasciamo stare; non vale la pena."
  oligarchic_capture.12.b: "Riaffermiamo la lealtà del cortigiano verso la corona."

  oligarchic_capture.13.title: "Il Capo Mette alla Prova il Ceto della Corona"
  oligarchic_capture.13.desc: "Il capo della fazione mette pubblicamente alla prova fin dove arrivi ancora l'autorità del ceto della corona, saggiandone la debolezza davanti al pubblico della corte. Possiamo lasciare che la sfida passi senza risposta, oppure replicare con fermezza."
  oligarchic_capture.13.a: "Lasciamo passare la sfida."
  oligarchic_capture.13.b: "Rispondiamo con fermezza."

  oligarchic_capture.10.title: "Mobilitare la Cittadinanza"
  oligarchic_capture.10.desc: "Gli araldi portano il nostro appello in ogni quartiere e in ogni mercato: la repubblica appartiene ai suoi cittadini, non a una cricca di grandi. Le piazze si riempiono di coloro che sono pronti a riaffermare il vecchio ordine, sebbene simili assembramenti non siano mai privi di rischio di disordini."
  oligarchic_capture.10.a: "Alle piazze!"

  oligarchic_capture.11.title: "Epurare gli Oligarchi"
  oligarchic_capture.11.desc: "Decidiamo di colpire direttamente i vertici della fazione. Vengono eseguiti arresti, le loro reti sono smantellate e la loro presa sulle nostre istituzioni si allenta. La nobiltà si irrita per la mano pesante e il reame trema, ma gli oligarchi sono respinti."
  oligarchic_capture.11.a: "Colpiamo i loro capi."
