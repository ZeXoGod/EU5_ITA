l_english:
 expedition_category_exploration: "Esplorazione"
 expedition_category_commercial: "Commerciale"
 expedition_category_military: "Militare"
 expedition_category_religious: "Religiosa"
 expedition_category_diplomatic: "Diplomatica"

 EXPEDITION_VARIABLE_MONTHLY_CHANGE_TITLE: "Variazione mensile di [MonthlySavedVariable.GetMonthlyChangeValue(Expedition.GetBaseClass)|+=2] dovuta a:"
 EXPEDITION_VARIABLES_TT_TITLE: "Variabili della Spedizione"

 pilgrimage_expedition: "Il Grande Pellegrinaggio"
 pilgrimage_expedition_desc: "Il nostro sovrano intraprenderà un santo pellegrinaggio verso i luoghi sacri della fede [ShowReligionAdjective('catholic')]."
 pilgrimage_expedition_historical_info: "Gerusalemme attira i pellegrini cristiani fin dal IV secolo, quando l'imperatore Costantino fece costruire la Chiesa del Santo Sepolcro nel luogo della sepoltura e della resurrezione di Cristo. La città passò più volte di mano durante le Crociate: conquistata dalla Prima Crociata nel 1099, perduta a favore di Saladino nel 1187 e brevemente recuperata per via diplomatica sotto Federico II nel 1229, prima di cadere definitivamente in mano ai Mamelucchi. Nonostante la perdita del dominio cristiano, i luoghi santi rimasero accessibili ai pellegrini grazie ad accordi diplomatici, e Gerusalemme restò la meta suprema della devozione cattolica in tutto il mondo medievale."
 pilgrimage_expedition_outcome_overview: "$BULLET$Ogni [holy_site|e] raggiunto dal nostro [ruler|e] offre una ricompensa propria all'arrivo, che si tratti di ulteriore [legitimacy|e], di [prestige|e] o della gratitudine del [ShowEstateTypeName('clergy_estate')].\n$BULLET$Completare il pellegrinaggio concede poi, in proporzione alla devozione con cui è stato condotto:\n$BULLET_WITH_TAB$Fino a #G +20#! di [legitimacy].\n$BULLET_WITH_TAB$[estate_satisfaction|e] del [ShowEstateTypeName('clergy_estate')].\n$BULLET_WITH_TAB$[opinion|e] migliorata presso [GetCountry('PAP').Custom('IT_Dalla')][GetCountry('PAP').GetName]."

 piety: "Pietà"
 piety_desc: "Quanto devotamente viene condotto il pellegrinaggio. Cala gradualmente durante il viaggio e viene consumata dalle scelte mondane compiute lungo la strada. Se si esaurisce del tutto, il pellegrinaggio si risolve in un'ignominia; se mantenuta alta, amplifica le ricompense finali del pellegrinaggio."
 retinue: "Seguito"
 retinue_desc: "La scorta del sovrano pellegrino. Non si logora da sé, ma solo per le sventure incontrate lungo la strada. Se va perduto del tutto, il sovrano resta pericolosamente esposto e il pellegrinaggio fallisce."
 pilgrimage_expedition_cooldown: "Il Grande Pellegrinaggio"
 pilgrimage_expedition_ruler_owner_tt: "[pilgrimage_ruler.GetName] risiede [pilgrimage_ruler.GetCourtCountry.Custom('IT_In')][pilgrimage_ruler.GetCourtCountry.GetName]"

 holy_site_pilgrimage_expedition: "Pellegrinaggio a un Luogo Sacro"
 holy_site_pilgrimage_expedition_desc: "Il nostro sovrano parte alla volta di un singolo luogo sacro prescelto, per pregare, per farsi vedere pregare e per tornare con il prestigio e la valuta religiosa che derivano dal viaggio. Si avvia dall'azione di pellegrinaggio, non dal pannello delle spedizioni."
 holy_site_pilgrimage_expedition_outcome_overview: "$BULLET$Giungere al [holy_site|e] scelto concede una ricompensa che dipende dalla nostra [religion|e]:\n$BULLET_WITH_TAB$#G +10#! di [religious_influence|e], [purity|e] o [karma|e], in proporzione alla distanza dalla nostra capitale, fino a #G +100#!.\n$BULLET_WITH_TAB$Le religioni [ShowReligionGroupAdjective('folk_peruvian_group')] spostano invece lo [yanantin|e] di #Y 20#! verso la natura del [god|e] del [holy_site].\n$BULLET_WITH_TAB$Le scuole [ShowReligionGroupAdjective('muslim')] idonee si spostano di ulteriori #Y 10#! verso [ShowSocietyDirectionName('mysticism')] o [ShowSocietyDirectionName('jurisprudence')]."
 holy_site_pilgrimage_expedition_order_zeal_tt: "Per gli anni a venire, la devozione dei pellegrini in questo possedimento infiammerà lo zelo dell'ordine che lo custodisce"
 holy_site_pilgrimage_cooldown: "Pellegrinaggio a un Luogo Sacro"

 treasure_fleet_expedition: "La Flotta del Tesoro"
 treasure_fleet_expedition_desc: "Invia la flotta imperiale del tesoro in un viaggio di stato verso una regione prescelta. La flotta naviga lungo le rotte marittime costiere verso la sua destinazione e ritorno, facendo scalo nei porti stranieri. Il viaggio estende la portata diplomatica della corte, distribuisce doni e [ShowGoodsName('silk')] ai sovrani dei mari meridionali, raccoglie tributi e torna con merci rare, ambasciatori e i nomi dei re che hanno imparato il suono di una vela cinese."
 treasure_fleet_expedition_outcome_overview: "$BULLET$La flotta salpa con un carico di doni pagati dal nostro tesoro.\n$BULLET$Al ritorno in sicurezza, ciò che resta non speso diventa [gold|e], più #G +10#! di [prestige|e].\n$BULLET$Ogni corte straniera risponde inoltre in modo diverso:\n$BULLET_WITH_TAB$Una corte che ci accoglie bene concede ulteriori #G +5#! di [prestige], può unirsi a [GetUniqueInternationalOrganization('middle_kingdom').GetName] come nostro tributario e invia tributi e doni rari che arricchiscono il nostro [market|e].\n$BULLET_WITH_TAB$Una corte che rifiuta lo status di tributario costa invece #R -50#! di [opinion|e] tra noi e ottiene [ShowModifier('chi_resisting_subjugation')]."
 treasure_fleet_cooldown: "La Flotta del Tesoro"

 western_ocean_voyage_expedition: "Viaggio nell'Oceano Occidentale"
 western_ocean_voyage_expedition_desc: "Invia una flotta verso occidente attraverso l'Atlantico aperto, alla ricerca di una rotta marittima per le Indie. Nessuna carta ci prepara a ciò che si trova oltre [ShowAreaName('canary_islands_area')]: solo vento, acqua e la speranza che l'oceano sia più stretto di quanto credano i dotti."
 western_ocean_voyage_expedition_historical_info: "L'idea di raggiungere l'Asia navigando verso occidente era dibattuta dagli studiosi europei da decenni prima che si tentasse il primo viaggio di questo tipo. L'ostacolo principale non era la forma della Terra, che le persone istruite sapevano essere sferica, ma le sue dimensioni. La maggior parte degli studiosi stimava correttamente che l'oceano fosse troppo vasto per essere attraversato. Le spedizioni che li smentirono non lo fecero confutando quella stima, ma trovando qualcosa di inatteso lungo la strada."
 western_ocean_voyage_expedition_outcome_overview: "$BULLET$Il viaggio traccia la carta dell'oceano aperto mentre naviga, rivelando le coste che raggiunge.\n$BULLET$Approdare concede poi:\n$BULLET_WITH_TAB$#G +10#! di [prestige|e].\n$BULLET_WITH_TAB$#G +10#! di [legitimacy|e].\n$BULLET_WITH_TAB$Ulteriori #G +20#! di [prestige] per la scoperta delle Americhe, che apre il Nuovo Mondo alla colonizzazione futura."
 western_ocean_voyage_cooldown: "Viaggio nell'Oceano Occidentale"

 hajj_caravan_expedition: "L'Ḥajj Reale"
 hajj_caravan_expedition_desc: "Invia il nostro sovrano in pellegrinaggio a [ShowLocationName('mecca')], adempiendo uno dei Cinque Pilastri dell'Islam. La strada è lunga e il viaggio costoso, ma un sovrano che torna dalla città santa porta con sé un'autorità che nessun esercito può conferire."
 hajj_caravan_expedition_historical_info: "Il califfo abbaside Hārūn ar-Rašīd compì il pellegrinaggio da Baghdad nove volte nel corso del suo regno (786–809), percorrendo persino parte del tragitto a piedi come atto di pietà, e la sua devozione divenne un modello che i sovrani pii si sforzarono di emulare per secoli."
 hajj_caravan_expedition_religious_influence_bullet: "$BULLET_WITH_TAB$#G +20#! di [religious_influence|e].\n"
 hajj_caravan_expedition_outcome_overview: "$BULLET$Raggiungere [ShowLocationNameWithNoTooltip('mecca')] premia lo splendore della carovana in quel luogo, fino a:\n$BULLET_WITH_TAB$#G +20#! di [prestige|e].\n[SelectLocalization(RELIGION.HasReligiousInfluence, 'hajj_caravan_expedition_religious_influence_bullet', '')]$BULLET$Tornare in patria concede poi:\n$BULLET_WITH_TAB$#G +10#! di [legitimacy|e].\n$BULLET_WITH_TAB$Il [modifier|e] quinquennale [ShowModifier('hajj_pious_return')].\n$BULLET_WITH_TAB$L'onore permanente [ShowModifier('hajji_pilgrim')], per il primo Ḥajj di un [ruler|e].\n$BULLET$La carovana deve raggiungere [ShowLocationNameWithNoTooltip('mecca')] nello stesso anno della partenza, altrimenti il pellegrinaggio è perduto del tutto."

 guards: "Scorta Armata"
 guards_desc: "La scorta armata della carovana. Si rafforza assoldando guardie o portando il #italic maḥmal#! lungo la strada, e si logora per via di razzie e difficoltà. Una carovana ben sorvegliata ha maggiori probabilità di sopravvivere a un attacco."
 splendor: "Splendore"
 splendor_desc: "Quanto lussuosamente la carovana è approvvigionata e adorna. Aumenta con le spese sontuose e le ostentazioni di ricchezza, e diminuisce per via di tempeste e difficoltà lungo la strada. Determina la ricompensa della carovana all'arrivo a [ShowLocationNameWithNoTooltip('mecca')]."
 hajj_caravan_cooldown: "L'Ḥajj Reale"

 circumnavigation_expedition: "Circumnavigazione del Globo"
 circumnavigation_expedition_desc: "Invia una flotta verso occidente a circumnavigare l'intero mondo: a sud oltre [ShowRegionName('la_plata_region')], attraverso il passaggio in fondo alla terra, attraverso un oceano senza nome, fino alle Isole delle Spezie e di nuovo a casa passando per [ShowLocationName('good_hope_cape')]. Nessuna flotta l'ha mai fatto. Non è certo che si possa fare."
 circumnavigation_expedition_historical_info: "Nel settembre del 1519, Ferdinando Magellano partì da Sanlúcar de Barrameda su incarico della Corona spagnola per trovare una rotta occidentale verso le Isole delle Spezie. La spedizione era composta da cinque navi: la #italic Trinidad#!, la #italic San Antonio#!, la #italic Concepción#!, la #italic Victoria#! e la #italic Santiago#!. Magellano era un navigatore portoghese che aveva viaggiato verso l'India e le Molucche al servizio del Portogallo, prima di trasferire la propria fedeltà alla Corona spagnola dopo che re Manuele I si era rifiutato di aumentargli lo stipendio. Il viaggio sarebbe diventato la prima circumnavigazione della Terra, anche se Magellano stesso non sarebbe vissuto abbastanza per vederne il compimento."
 circumnavigation_expedition_outcome_overview: "$BULLET$Essere il primo paese al mondo a circumnavigare il globo concede:\n$BULLET_WITH_TAB$#G +100#! di [prestige|e].\n$BULLET_WITH_TAB$#G +10#! di [legitimacy|e].\n$BULLET_WITH_TAB$Il [modifier|e] [ShowModifier('first_circumnavigation')].\n$BULLET$Qualsiasi completamento concede inoltre:\n$BULLET_WITH_TAB$#G +10#! di [prestige].\n$BULLET_WITH_TAB$Ulteriori #G +10#! per aver riportato a casa almeno tre navi.\n$BULLET_WITH_TAB$#G +5#! per un equipaggio con il morale alto.\n$BULLET_WITH_TAB$I [ShowGoodsName('cloves')] raccolti in [ShowAreaName('moluccas_area')], venduti a prezzo di mercato in cambio di [gold|e]."
 circumnavigation_expedition_low_morale_prestige_tt: "Il morale basso dell'equipaggio riduce il Prestigio ottenuto"
 circumnavigation_expedition_high_morale_prestige_tt: "Il morale alto dell'equipaggio aumenta il Prestigio ottenuto"

 morale: "Morale dell'Equipaggio"
 morale_desc: "Lo spirito dell'equipaggio. Un morale basso rischia di sfociare in un ammutinamento."
 provisions: "Provviste"
 provisions_desc: "Cibo e acqua per il viaggio. Si consumano costantemente durante gli spostamenti, e il loro esaurimento mette in pericolo la compagnia."
 num_ships: "Navi"
 num_ships_desc: "Imbarcazioni ancora con la flotta. Se non ne resta nessuna, la spedizione è perduta."
 cargo: "Carico"
 cargo_desc: "Beni di valore caricati durante il viaggio, venduti al mercato al ritorno della flotta."

 cape_route_to_india_expedition: "La Rotta del Capo verso l'India"
 cape_route_to_india_expedition_desc: "Invia una flotta verso sud lungo la costa africana e attorno al grande Capo meridionale, aprendo una via marittima verso le Isole delle Spezie che aggira ogni pedaggio ottomano e ogni intermediario veneziano. La rotta è brutale: due anni di oceano aperto, coste sconosciute e tempeste che disperdono le navi; ma la prima nazione ad aprirla controllerà il commercio delle spezie del mondo."
 cape_route_to_india_expedition_historical_info: "La spedizione portoghese per trovare una rotta marittima verso $india$ fu il culmine di quasi un secolo di esplorazioni graduali verso sud lungo la costa africana. Bartolomeo Dias aveva doppiato il Capo di Buona Speranza nel 1488, dimostrando che la rotta era possibile. Il viaggio di Vasco da Gama del 1497-99 portò a termine l'impresa, tornando con pepe e spezie a sufficienza per ripagare sessanta volte il costo della spedizione. Il viaggio cambiò radicalmente il commercio mondiale delle spezie, spezzando il monopolio veneziano e ottomano sulle vie di terra."
 cape_route_to_india_expedition_outcome_overview: "$BULLET$Ogni tappa lungo la costa africana può fondare una [ShowBuildingTypeName('por_feitoria')] oppure, in un porto non rivendicato, un [ShowBuildingTypeName('por_trading_post')] e il pieno possesso della [location|e], ciascuno con un proprio [modifier|e] commerciale duraturo.\n$BULLET$Raggiungere [ShowLocationName('kozhikode')] concede [ShowModifier('calicut_trade_rights')] e un carico di [ShowGoodsName('pepper')] venduto a prezzo di mercato in cambio di [gold|e].\n$BULLET$Completare la rotta concede poi:\n$BULLET_WITH_TAB$#G +20#! di [prestige|e].\n$BULLET_WITH_TAB$#G +10#! di [legitimacy|e].\n$BULLET_WITH_TAB$Il [modifier] permanente [ShowModifier('cape_route_pioneer')], oppure [ShowModifier('portuguese_african_network')] o [ShowModifier('east_africa_trade_dominance')], con tre o cinque feitorias stabilite."
 cape_route_to_india_expedition_low_morale_prestige_tt: "Il morale basso dell'equipaggio riduce il Prestigio ottenuto"
 cape_route_to_india_expedition_high_morale_prestige_tt: "Il morale alto dell'equipaggio aumenta il Prestigio ottenuto"

 grand_tour_expedition: "Il Grand Tour"
 grand_tour_expedition_desc: "Il nostro erede partirà per un lungo viaggio attraverso le grandi città di [ShowRegionName('italy_region')] — [ShowLocationName('florence')], [ShowLocationName('rome')], [ShowLocationName('venice')] e [ShowLocationName('naples')] — per studiare ai piedi del [ShowInstitutionName('renaissance')]. L'erede che tornerà non sarà la stessa persona che è partita. Tutto ciò che avrà appreso, e da chi, plasmerà il carattere che porterà con sé sul trono."
 grand_tour_expedition_historical_info: "Il Grand Tour, la pratica di mandare giovani aristocratici europei in un lungo viaggio di istruzione attraverso l'Italia, nacque gradualmente nel XV e XVI secolo e divenne un'istituzione formale tra la nobiltà dell'Europa settentrionale nel XVII. Firenze, Roma, Venezia e Napoli formavano il circuito canonico, e ciascuna offriva qualcosa che alle corti del nord mancava: la cultura umanistica, l'antichità classica, l'arte del mecenatismo rinascimentale e il cerimoniale delle più antiche corti reali d'Europa. Ai partecipanti si chiedeva di tornare trasformati, adatti all'arte di governo e alla diplomazia in un modo che i precettori domestici non potevano garantire."
 grand_tour_expedition_outcome_overview: "$BULLET$Ogni città visitata accumula conoscenze, relazioni o esperienza a seconda della scelta compiuta, e concede [research_progress|e] per il tempo dedicato allo studio o [legitimacy|e] per il tempo trascorso a corte.\n$BULLET$Raggiungere almeno tre delle grandi città di [ShowRegionNameWithNoTooltip('italy_region')] concede poi:\n$BULLET_WITH_TAB$Uno tra [ShowTraitName('free_thinker')], [ShowTraitName('well_connected')] o [ShowTraitName('worldly')], a seconda di quale sia risultato il più alto.\n$BULLET_WITH_TAB$Il [modifier|e] permanente [ShowModifier('returned_from_grand_tour')].\n$BULLET_WITH_TAB$#G +10#! di [prestige|e].\n$BULLET$Un viaggio più breve frutta soltanto #G +5#! di [prestige] e nessun [trait|e]."
 grand_tour_expedition_heir_completed_tt: "L'erede non ha già completato il Grand Tour"
 grand_tour_expedition_stalled_status: "In Residenza"

 gt_diligence: "Diligenza"
 gt_diligence_desc: "L'attitudine dell'erede a imparare dal viaggio, stabilita in base alle sue [ability|e] alla partenza. Un erede più diligente trae maggior profitto da ciò che il viaggio ha da insegnare."
 knowledge: "Conoscenza"
 knowledge_desc: "L'apprendimento ricavato dallo studio teorico lungo il viaggio: biblioteche, lezioni e compagnia di dotti. Un erede che termina il viaggio con più conoscenza di qualsiasi altra cosa torna [ShowTraitName('free_thinker')]."
 connections: "Relazioni"
 connections_desc: "I rapporti costruiti presso le corti visitate lungo il viaggio. Un erede che termina il viaggio con più relazioni di qualsiasi altra cosa torna [ShowTraitName('well_connected')]."
 experience: "Esperienza"
 experience_desc: "L'esposizione pratica e diretta acquisita lungo il viaggio: botteghe, porti e uffici contabili. Un erede che termina il viaggio con più esperienza di qualsiasi altra cosa torna [ShowTraitName('worldly')]."
 grand_tour_cooldown: "Il Grand Tour"

 grand_embassy_expedition: "La Grande Ambasciata"
 grand_embassy_expedition_desc: "Invia il sovrano attraverso le corti dell'Europa occidentale sotto falso nome, per studiare le istituzioni, l'esercito e la marina degli stati che si sono già modernizzati. Una delegazione annunciata come regale ottiene banchetti e vuote cortesie; una che tiene un profilo basso riesce a entrare nei veri cantieri navali e nelle sale di progettazione. La voce però si diffonde, e un sovrano riconosciuto troppo presto trova le porte già chiuse."
 grand_embassy_expedition_outcome_overview: "$BULLET$La discrezione con cui viaggia la delegazione determina per quanto tempo il suo vero scopo resta nascosto a ciascun ospite, e come reagisce la corte una volta scoperto.\n$BULLET$Ogni corte visitata concede un certo numero di Opportunità per imparare da essa, e gli incontri casuali lungo il cammino possono accrescere le capacità del sovrano, approfondire la Modernizzazione o erodere la Discrezione.\n$BULLET$Al termine dell'ambasciata, la Modernizzazione accumulata incrementa il progresso delle [institutions|e] in ogni località che possediamo, più nella capitale che altrove, la [army_tradition|e] e, se è mai stato visitato un porto, la [navy_tradition|e].\n$BULLET$Una corte che respinge la delegazione costa [prestige|e]; una che concede l'accesso, o a cui se ne implora ancora, ricompensa con [prestige|e] e ulteriori Opportunità."
 grand_embassy_expedition_institution_spread_tt: "Fa avanzare l'istituzione scelta di [GetVariable('grand_embassy_institution_progress_amount')|V0] di progresso in ogni località posseduta che ne è priva, e di [GetVariable('grand_embassy_institution_progress_capital_amount')|V0] nella capitale"
 grand_embassy_expedition_stalled_status: "Apprendimento"
 discretion: "Discrezione"
 discretion_desc: "Quanto bene il vero scopo della delegazione, e l'identità del sovrano, vengono tenuti lontani da occhi indiscreti. Sopra 90, la corte scambia la delegazione per normali inviati e nessuno sospetta nulla. A 90 o meno, l'ospite ha capito chi viaggia davvero tra loro, per semplice sospetto o grazie a una propria rete di spie."
 modernization: "Modernizzazione"
 modernization_desc: "Il progresso accumulato dalla delegazione nell'assimilare i metodi occidentali. Ogni lezione appresa vi contribuisce, e più ne porta a casa il sovrano, maggiore sarà la ricompensa al termine dell'ambasciata."
 opportunities: "Opportunità"
 opportunities_desc: "Quanto accesso è stato concesso alla delegazione per imparare da questa specifica corte. Stabilita di nuovo a ogni tappa, a seconda di quanto apertamente il sovrano ha scelto di presentarsi."

 pacific_crossing_expedition: "Alla Ricerca del Tornaviaje"
 pacific_crossing_expedition_desc: "Invia una flotta dalla nostra costa pacifica nelle Americhe per trovare il #italic tornaviaje#!, una rotta di ritorno affidabile attraverso il più grande oceano del mondo. Gli alisei portano una nave verso occidente fino in Asia con una certa facilità; tornare a casa controvento ha sconfitto ogni tentativo, e finché non verrà tracciato un passaggio di ritorno, le nostre colonie e le ricchezze delle Isole delle Spezie restano fuori portata. La prima nazione a trovare la via del ritorno legherà le Americhe all'Asia e aprirà il commercio dei galeoni attraverso il Pacifico."
 pacific_crossing_expedition_historical_info: "Il ritorno verso est, il #italic tornaviaje#!, fu il grande problema irrisolto dei primi tempi del Pacifico. Álvaro de Saavedra, partito dalla Nuova Spagna, fu respinto due volte dagli alisei nel 1528 e nel 1529 e morì nel tentativo; anche la spedizione di Ruy López de Villalobos del 1542 raggiunse l'Asia ma non trovò alcuna via di ritorno. Solo nel 1565 fu scoperta una rotta di ritorno affidabile, e fino ad allora una flotta poteva raggiungere l'Asia ma mai riportarne il carico."
 pacific_crossing_expedition_outcome_overview: "$BULLET$Tracciare la rotta di ritorno attraverso il [ShowContinentName('pacific_ocean_continent')] concede:\n$BULLET_WITH_TAB$#G +100#! di [prestige|e].\n$BULLET_WITH_TAB$#G +15#! di [legitimacy|e].\n$BULLET_WITH_TAB$Un [modifier|e] di rotta commerciale duraturo.\n$BULLET_WITH_TAB$I [ShowGoodsName('cloves')] raccolti in [ShowAreaName('moluccas_area')], venduti a prezzo di mercato in cambio di [gold|e].\n$BULLET_WITH_TAB$Accesso permanente alla [decision|e] [ShowDecisionName('charter_manila_galleon')], che può essere ripresa ogni cinque anni per un considerevole ritorno di [gold].\n$BULLET$Una flotta che non trova mai la via del ritorno non ottiene assolutamente nulla."
 pacific_crossing_expedition_low_morale_prestige_tt: "Il morale basso dell'equipaggio riduce il Prestigio ottenuto"
 pacific_crossing_expedition_high_morale_prestige_tt: "Il morale alto dell'equipaggio aumenta il Prestigio ottenuto"

 cartographic_survey_expedition: "Rilevamento Costiero"
 cartographic_survey_expedition_desc: "Invia una nave da rilevamento lungo la nostra stessa costa per cartografarne i porti, scandagliarne i bassifondi e segnalarne i pericoli. Il lavoro è privo di gloria, ma le carte che ne risulteranno resteranno valide per una generazione, e ogni futura spedizione sarà più economica e rapida da allestire grazie ad esse."
 cartographic_survey_expedition_historical_info: "Il rilevamento sistematico delle coste iniziò seriamente nel XVI secolo, quando il crescente volume dei traffici marittimi rese le carte accurate una questione di interesse statale. La #italic Casa de Contratación#! di Siviglia e l'#italic Armazém da Guiné e Índia#! portoghese mantenevano entrambe cartografi ufficiali il cui compito era produrre e aggiornare le carte nautiche, e gli ammiragliati olandesi seguirono l'esempio nel XVII secolo."
 cartographic_survey_expedition_outcome_overview: "$BULLET$Ogni [port|e] rilevato può lasciare un [location_modifier|e] duraturo per un periodo da 10 a 20 anni, aumentando la produzione di uno tra diversi beni, come [ShowGoodsName('fish')], [ShowGoodsName('pearls')] o [ShowGoodsName('amber')], oppure migliorando il porto stesso, e frutta inoltre [prestige|e].\n$BULLET$Rilevare tre o più porti concede anche:\n$BULLET_WITH_TAB$Il [modifier|e] quindicennale [ShowModifier('accurate_charts')].\n$BULLET_WITH_TAB$#G +10#! di [prestige].\n$BULLET$Rilevarne meno frutta soltanto #G +5#! di [prestige]."
 cartographic_survey_cooldown: "Rilevamento Costiero"

 mining_survey_expedition: "Prospezione delle Alture"
 mining_survey_expedition_desc: "Invia una squadra di prospettori e saggiatori nelle nostre zone montuose per percorrere i letti dei torrenti, martellare gli affioramenti e analizzare le rocce alla ricerca di metalli preziosi. Le colline hanno già ceduto le loro ricchezze in passato, e la sapienza faticosamente conquistata di un vecchio minatore vale un anno di congetture di corte."
 mining_survey_expedition_historical_info: "La prospezione sistematica era praticata in tutta l'Europa medievale e della prima età moderna, più celebre nei monti Metalliferi di Sassonia e Boemia, dove la scoperta di filoni d'argento nel XII secolo diede vita alle città minerarie di Freiberg, Jáchymov e Schneeberg. Il #italic De re metallica#! (1556) di Georgius Agricola divenne il manuale di riferimento del mestiere, descrivendo nel dettaglio l'uso della bacchetta da rabdomante, il saggio dei campioni di minerale in piccoli crogioli e le consuetudini legali che regolavano la delimitazione dei diritti minerari."
 mining_survey_expedition_outcome_overview: "$BULLET$Ogni rilevamento lascia il [modifier|e] ventennale [ShowModifier('thorough_survey')], che aumenta la produzione di materie prime in tutto il paese.\n$BULLET$Ogni scoperta effettuata lascia inoltre un ricco giacimento, come [ShowModifier('rich_silver_vein')] o [ShowModifier('rich_gold_strike')], e può essere sfruttato apertamente per [prestige|e] o discretamente per [gold|e].\n$BULLET$Concede inoltre:\n$BULLET_WITH_TAB$#G +10#! di [prestige] per due o più scoperte.\n$BULLET_WITH_TAB$#G +5#! per ogni altura rilevata."
 mining_survey_cooldown: "Prospezione delle Alture"

 relic_expedition: "La Caccia alle Reliquie"
 relic_expedition_desc: "Invia una spedizione a [ShowLocationName('jerusalem')], e da lì oltre, attraverso la Terra Santa e l'intera [ShowRegionName('crescent_region')], inseguendo le voci di una reliquia che potrebbe essere recuperata da chiunque sia abbastanza paziente e fortunato da trovarla."
 relic_expedition_historical_info: "Il commercio delle reliquie nel Medioevo e nella prima età moderna era un'attività considerevole. Le comunità cattoliche e ortodosse si contendevano gli oggetti più prestigiosi, e vendite, scambi e veri e propri furti spostarono reliquie attraverso la cristianità per secoli. Le reliquie degli stati crociati erano particolarmente esposte a questo commercio: la Vera Croce catturata a Hattin nel 1187 non fu mai recuperata, e la Santa Lancia scoperta ad Antiochia nel 1098 scompare dalle fonti storiche poco dopo la Prima Crociata. Entrambe le perdite alimentarono per secoli le voci su dove tali oggetti potessero ancora trovarsi."
 relic_expedition_outcome_overview: "$BULLET$La reliquia effettivamente trovata dipende dal caso e da come si svolge la ricerca: potrebbe essere la leggendaria Vera Croce o la Santa Lancia in persona, oppure una reliquia più modesta come un chiodo, un osso o un frammento.\n$BULLET$Qualunque cosa venga trovata diventa una [work_of_art|e] fisica portata in patria, nella nostra capitale."
 clues: "Indizi"
 clues_desc: "Quanto la spedizione è vicina a trovare con certezza le tracce di una reliquia. Parte da una singola voce, e cresce o cala a ogni pista seguita. Se si esaurisce del tutto, la ricerca potrebbe essere sospesa."
 hunt_retinue: "Seguito"
 hunt_retinue_desc: "Le guardie, l'interprete e l'attaché erudito della spedizione. Non si logora da sé, ma se si esaurisce del tutto, la spedizione si disperde e la caccia fallisce."
 relic_expedition_cooldown: "La Caccia alle Reliquie"
