 establish_standing_regiments: "Istituisci reggimenti permanenti" 
 establish_standing_regiments_desc: "L'epoca di radunare seguiti al bisogno è passata. Le nostre casate nobiliari dovrebbero invece fornire ufficiali addestrati per comandare reggimenti mantenuti permanentemente al servizio regio, una forza combattente che deve la propria disciplina alla corona piuttosto che al proprio signore." 
 mandate_wartime_conscription: "Imponi coscrizione in tempo di guerra" 
 mandate_wartime_conscription_desc: "I nostri nemici schierano eserciti di uomini coscritti, e dobbiamo fare lo stesso. Traendo riserve e reclute dai registri parrocchiali, accresceremo le nostre forze in quest'ora di bisogno." 
 promote_industrial_workshops: "Promuovi officine industriali" 
 promote_industrial_workshops_desc: "Le confraternite artigiane che un tempo sostenevano le nostre città non possono più eguagliare la produzione richiesta dalla nostra epoca. Dovremmo investire nelle nuove manifatture e officine meccanizzate che producono molto di più, molto più in fretta, e permettere alle nostre arti di stare al passo coi tempi." 
 wartime_officer_corps: "Rafforza il corpo ufficiali" 
 wartime_officer_corps_desc: "L'urto della cavalleria non decide più la giornata. Ciò che ora sostiene una battaglia è l'abilità di chi comanda, e il parlamento dovrebbe dare all'esercito il meglio dei nostri uomini, addestrati e assegnati prima dell'apertura della campagna." 
 pa_accept_estate_culture: "Accetta la cultura del ceto" 
 pa_accept_estate_culture_simple: "Corrompi il ceto" 
 pa_accept_estate_culture_desc: "Il [estate|e] richiede che la [culture|e] dominante del suo popolo riceva accettazione ufficiale." 
 pa_convert_to_estate_religion: "Convertiti alla religione del ceto" 
 pa_convert_to_estate_religion_simple: "Corrompi il ceto" 
 pa_convert_to_estate_religion_desc: "Il [estate|e] richiede che il paese si converta alla [religion|e] del suo popolo." 
 pa_change_court_language_to_estate_language: "Cambia lingua di corte" 
 pa_change_court_language_to_estate_language_simple: "Corrompi il ceto" 
 pa_change_court_language_to_estate_language_desc: "Il [estate|e] richiede che la [court_language|e] sia cambiata in una che rifletta meglio la sua identità." 
 iw_militarize_country: "Militarizza la nazione" 
 iw_militarize_country_desc: "Invita il [parliament|e] a sostenere un rafforzamento militare d'emergenza, concedendo [army_tradition|e] e temprando il nostro [army|e] più esperto." 
