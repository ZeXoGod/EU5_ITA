 pa_rethink_army_academy_simple: "$pa_rethink_army_academy$"
 pa_rethink_army_academy_desc: "Questo [estate|e] è insoddisfatto degli attuali principi della nostra accademia militare e desidera che rivalutiamo i suoi insegnamenti."
 pa_rethink_navy_academy: "Riformare l'Accademia Navale"
 pa_rethink_navy_academy_simple: "$pa_rethink_navy_academy$"
 pa_rethink_navy_academy_desc: "$pa_rethink_army_academy_desc$"
 pa_reduce_land_recruitment: "Ridurre il Reclutamento dell'Esercito"
 pa_reduce_land_recruitment_simple: "$pa_reduce_land_recruitment$"
 pa_reduce_land_recruitment_desc: "I membri di questo [estate|e] sono preoccupati per il nostro intenso reclutamento nell'esercito e vogliono ridurre il numero di persone costrette ad arruolarsi."
 pa_reduce_naval_recruitment: "Ridurre il Reclutamento della Marina"
 pa_reduce_naval_recruitment_simple: "$pa_reduce_naval_recruitment$"
 pa_reduce_naval_recruitment_desc: "I membri di questo [estate|e] sono preoccupati per il nostro intenso reclutamento nella marina e vogliono ridurre il numero di persone costrette ad arruolarsi."
 pa_increase_entrenchment: "Aumenta il Radicamento Burocratico" 
 pa_increase_entrenchment_simple: "$pa_increase_entrenchment$" 
 pa_increase_entrenchment_desc: "I membri di questo [estate|e] sembrano spingere per il radicamento della burocrazia attuale, probabilmente nel tentativo di consolidare qualunque influenza istituzionale possiedano." 
 pa_decrease_entrenchment: "Riduci il Radicamento Burocratico" 
 pa_decrease_entrenchment_simple: "$pa_decrease_entrenchment$" 
 pa_decrease_entrenchment_desc: "I membri di questo [estate|e] sembrano spingere per la riduzione del radicamento della burocrazia attuale, probabilmente nel tentativo di limitare l'influenza istituzionale." 

 #$mamluk$ Actions
 promote_mamluks: "Promuovere un $mamluk$"
 promote_mamluks_desc: "Soldati d'élite in grado di ricoprire posizioni di primo piano nella nostra amministrazione, i soldati $mamluk$ e i titolari della carica sono la spina dorsale della nostra amministrazione stratocratica ed esercitano un'enorme influenza."
 new_mamluk_appears_tt: "#Y Un nuovo $mamluk$ sarà promosso#!"
 promote_mamluks_tt: "Nuovi candidati $mamluk$ appariranno tramite un [event|e]"

 ### IO Parliament Agendas ###
 #HRE
 pa_hre_lessen_tax_burden: "Ridurre il Carico Fiscale"
 pa_hre_lessen_tax_burden_simple: "$pa_hre_lessen_tax_burden$"
 pa_hre_lessen_tax_burden_desc: "Ci impegniamo a ridurre gli obblighi del [ShowPaymentName('imperial_contribution')] a loro carico in cambio del loro sostegno."
 pa_hre_elevate_prussia_to_kingdom: "Elevare la [GetCountry('PRU').GetNameWithNoTooltip] a [ShowCountryRankNameWithNoTooltip('rank_kingdom')]"
 pa_hre_elevate_prussia_to_kingdom_simple: "Elevare la [GetCountry('PRU').GetNameWithNoTooltip]"
 pa_hre_elevate_prussia_to_kingdom_desc: "I monarchi della [GetCountry('PRU').GetName] sono sempre stati ambiziosi nella loro lotta per il potere e la gloria. Hanno persino richiesto formalmente il titolo di Re, anche se alla fine devono vivere come 'Re in [GetCountry('PRU').GetNameWithNoTooltip]'. Elevare questo paese a un vero e proprio [ShowCountryRankName('rank_kingdom')] potrebbe farci guadagnare un ultimo favore, però..."
 pa_hre_elevate_prussia_to_kingdom_tt: "La [GetCountry('PRU').GetName] riceve un [event|e] riguardo alla nostra decisione."
 pa_hre_grant_imperial_titles: "Concedere Titoli Imperiali"
 pa_hre_grant_imperial_titles_simple: "$pa_hre_grant_imperial_titles$"
 pa_hre_grant_imperial_titles_desc: "Gli $elector_plural$ apprezzerebbero molto ulteriori titoli e prestigio provenienti dalla corona."
 pa_hre_affirmation_of_free_city_rights: "Affermazione dei Diritti della $free_city$"
 pa_hre_affirmation_of_free_city_rights_desc: "Rinnoviamo i diritti e le garanzie delle $free_city_plural$, garantendo la loro stabilità e prosperità all'interno dell'Impero."
 opinion_hre_pa_supports_free_cities: "Sostenere le [ShowSpecialStatusNamePluralWithNoTooltip('free_city')]"
 pa_hre_affirmation_of_free_city_rights_tt: "Ogni [ShowSpecialStatusName('free_city')] indipendente ottiene [ShowNamedValue('stability_mild_bonus')|+=2] [stability|e] mentre ogni paese che attualmente conduce una guerra contro di loro perde [ShowBiasValue('opinion_hre_pa_supports_free_cities')|+] opinione nei confronti dell'[GetUniqueInternationalOrganization('hre').GetLeaderTitle] del [GetUniqueInternationalOrganization('hre').GetName]." 
 royal_monopoly_on_trade: "Monopolio regio sul commercio" 
 royal_monopoly_on_trade_desc: "I mercanti del nostro regno si sono arricchiti abbastanza con i profitti del commercio. Affermando un monopolio regio sui beni chiave, portiamo quelle entrate nelle mani della corona, dove potranno servire l'intero regno." 
 charter_subject_governors: "Concedi carte ai governatori degli stati clienti" 
 charter_subject_governors_desc: "I nostri stati clienti lontani richiedono un'attenzione che la corona può a malapena permettersi. Concedendo carte formali a governatori dotati di autorità regia, rafforziamo la presa su queste terre e garantiamo che le loro entrate fluiscano correttamente nelle nostre casse." 
 establish_colonial_administration: "Istituisci amministrazione coloniale" 
 establish_colonial_administration_desc: "Le colonie che abbiamo fondato all'estero devono essere governate come vere estensioni del nostro regno, non lasciate ai capricci di cercatori di fortuna. Dobbiamo istituire strutture amministrative adeguate perché ciò avvenga." 
 reform_the_royal_treasury: "Riforma il Tesoro regio" 
 reform_the_royal_treasury_desc: "L'espansione incontrollata della coniazione ha spinto i prezzi verso l'alto e indebolito il valore della nostra moneta. Un'accurata revisione delle finanze della corona e una riforma delle pratiche del tesoro restituirebbero solidità monetaria al regno." 
 issue_royal_censure: "Emetti censura regia" 
 issue_royal_censure_desc: "I nostri rivali hanno compiuto azioni che non possono restare senza formale rimprovero. Una censura regia, sostenuta dall'autorità di questo parlamento, renderebbe chiaro a tutti che non tollereremo simili condotte senza risposta." 
 mandate_emergency_levies: "Imponi leve d'emergenza" 
 mandate_emergency_levies_desc: "Il nostro sforzo bellico ha bisogno di maggiore sostegno da ogni angolo del regno. La corona deve chiamare tutti i ceti e i sudditi a contribuire con quanto possono per superare questa prova." 
 fund_royal_art_patronage: "Finanzia il mecenatismo artistico regio" 
 fund_royal_art_patronage_desc: "La grandezza di un regno non si misura solo in eserciti e oro, ma anche nelle opere d'arte e cultura che produce. Dovremmo investire nel patrocinio di artisti e artigiani che immortaleranno la gloria della nostra dinastia." 
 institute_feudal_levies: "Istituisci leve feudali" 
 institute_feudal_levies_desc: "La spina dorsale di ogni grande esercito è la nobiltà a cavallo. Formalizzando gli obblighi militari delle nostre casate nobiliari, in particolare quello di fornire cavalleria pesante, rafforziamo le nostre forze sul campo." 
 establish_military_exercises: "Istituisci esercitazioni militari" 
 establish_military_exercises_desc: "I nostri seguiti nobiliari si infiacchiscono in tempo di pace. Imponendo esercitazioni da campo e tornei regolari, garantiamo che i nostri guerrieri restino pronti e i nostri eserciti siano preparati quando giungerà la chiamata alla battaglia." 
 establish_heralds_college: "Istituisci un Collegio degli Araldi" 
 establish_heralds_college_desc: "La precedenza dei titoli, i diritti sugli stemmi e l'ordine del rango nobiliare sono questioni di grande importanza. Un collegio degli araldi porterebbe ordine in questi affari e darebbe maggiore prestigio al nostro regno all'estero." 
 promote_chivalric_orders: "Promuovi ordini cavallereschi" 
 promote_chivalric_orders_desc: "I nostri ordini cavallereschi sono l'incarnazione della virtù marziale nobiliare. Concedendo loro riconoscimento e finanziamenti regi, rafforziamo i legami tra la corona e i suoi migliori guerrieri." 
 license_noble_privateers: "Autorizza corsari nobili" 
 license_noble_privateers_desc: "I mari offrono ricchezze agli audaci, e le casate nobiliari sono ben posizionate per armare navi da guerra a scopo di profitto. Concedendo lettere di corsa, diamo forma e legittimità alle loro imprese mentre la corona trae beneficio dalla conseguente perturbazione del commercio." 
 monopolize_land_trade_routes: "Monopolizza le rotte commerciali terrestri" 
 monopolize_land_trade_routes_desc: "La nostra nobiltà controlla le strade, i passi e i ponti attraverso cui deve fluire tutto il commercio terrestre. Concedendo loro diritti formali di pedaggio sui mercanti via terra, convogliamo quei profitti nelle mani dei nostri sudditi più leali." 
 fund_noble_colonization: "Finanzia la colonizzazione nobiliare" 
 fund_noble_colonization_desc: "Le grandi casate nobiliari del nostro regno hanno le risorse e l'ambizione per finanziare spedizioni coloniali. Dovremmo autorizzare e incoraggiare queste imprese per estendere la nostra portata oltre l'orizzonte." 
 grant_exclusive_hunting_rights: "Concedi diritti esclusivi di caccia" 
 grant_exclusive_hunting_rights_desc: "Le foreste e la selvaggina del regno sono il dominio naturale della nobiltà. Concedendo loro diritti esclusivi di caccia e gestione di queste terre, rafforziamo il loro legame con i possedimenti e la loro lealtà alla corona." 
 establish_noble_garrison_law: "Istituisci la legge sulle guarnigioni nobiliari" 
 establish_noble_garrison_law_desc: "Il disordine minaccia il nostro regno, e non possiamo reprimerlo senza forti guarnigioni locali. Che le casate nobiliari siano obbligate per legge a mantenere posizioni fortificate nei propri domini, pronte a difendere corona e paese." 
 establish_clergy_charity: "Istituisci carità del clero" 
 establish_clergy_charity_desc: "Il nostro popolo soffre la fame mentre i granai dei grandi signori restano pieni. È dovere della Chiesa organizzare il soccorso dei poveri e degli affamati, un dovere che ora dobbiamo formalizzare e finanziare." 
 launch_religious_missions: "Avvia missioni religiose" 
 launch_religious_missions_desc: "Gran parte del nostro regno giace ancora fuori dalla luce della vera fede. La Chiesa deve organizzare e inviare missionari per ricondurre quelle anime perdute nell'ovile, e noi daremo loro il sostegno necessario per riuscirci." 
 institute_canonical_law: "Istituisci diritto canonico" 
 institute_canonical_law_desc: "Un regno diviso nella fede è un regno diviso nello spirito. Codificando il diritto ecclesiastico e imponendone l'applicazione uniforme in tutte le nostre province, rafforziamo i legami di fede che tengono insieme il nostro popolo." 
 establish_inquisition_courts: "Istituisci tribunali dell'Inquisizione" 
 establish_inquisition_courts_desc: "I semi dell'eresia hanno messo radici, e solo uno sforzo sistematico dei tribunali ecclesiastici può estirparli. Dobbiamo agire rapidamente prima che il contagio si diffonda ulteriormente." 
 promote_religious_tolerance: "Promuovi tolleranza religiosa" 
 promote_religious_tolerance_desc: "Il nostro regno ospita molti che non condividono la nostra fede, e il loro malcontento genera disordini. È saggezza della Chiesa riconoscere che la pace è favorita più dalla tolleranza che dal conflitto perpetuo." 
 fund_monastery_network: "Finanzia una rete monastica" 
 fund_monastery_network_desc: "I monasteri del nostro regno sono centri di apprendimento, carità e ordine. Dovremmo espandere la loro rete e dotarli adeguatamente, così che le loro buone opere possano raggiungere ogni angolo del regno." 
 establish_pilgrimage_routes: "Istituisci rotte di pellegrinaggio" 
 establish_pilgrimage_routes_desc: "I luoghi sacri della nostra fede attirano fedeli da vicino e da lontano. Proteggendo e mantenendo formalmente le rotte verso questi luoghi santi, mostriamo la nostra pietà e portiamo distinzione e prestigio al nostro regno." 
 regulate_tithe_collection: "Regola la riscossione della decima" 
 regulate_tithe_collection_desc: "La riscossione delle decime è diventata irregolare e controversa. Standardizzando la quota di reddito spettante alla Chiesa in tutto il regno, garantiamo entrate eque e affidabili al clero, sollevando al contempo il nostro popolo dal peso dell'incertezza." 
 sponsor_theological_seminaries: "Sostieni seminari teologici" 
 sponsor_theological_seminaries_desc: "Un clero istruito è il fondamento di un regno spiritualmente sano. Dobbiamo finanziare la fondazione e l'espansione di seminari per formare una nuova generazione di ecclesiastici dotti." 
 promote_export_trade: "Promuovi il commercio d'esportazione" 
 promote_export_trade_desc: "I nostri mercanti sono pronti a portare le nostre merci negli angoli più lontani del mondo, ma hanno bisogno del sostegno di questo parlamento per espandere le loro reti. Un impegno verso il commercio d'esportazione arricchirà il regno e rafforzerà la nostra posizione all'estero." 
 establish_import_controls: "Istituisci controlli sulle importazioni" 
 establish_import_controls_desc: "Non dobbiamo permettere che il flusso di merci straniere indebolisca i nostri produttori. Istituendo controlli formali su ciò che entra nei nostri mercati, proteggiamo le nostre industrie e garantiamo che i nostri mercanti restino competitivi." 
 fund_trade_expeditions: "Finanzia spedizioni commerciali" 
 fund_trade_expeditions_desc: "Le gilde mercantili sono pronte a unire i propri capitali per viaggi commerciali a lunga distanza, ma tali imprese richiedono il sostegno della legge e la fiducia che deriva dall'appoggio parlamentare." 
 establish_commodity_exchange: "Istituisci una borsa merci" 
 establish_commodity_exchange_desc: "I nostri centri di mercato pullulano di attività, ma mancano di una borsa formale dove le merci all'ingrosso possano essere scambiate in modo ordinato. Una borsa merci adeguatamente istituita renderebbe i nostri mercati l'invidia dei vicini." 
 promote_maritime_trade: "Promuovi il commercio marittimo" 
 promote_maritime_trade_desc: "Le rotte marittime sono vie di ricchezza per chi è abbastanza audace da usarle. Dovremmo investire nelle infrastrutture e nelle istituzioni che sostengono il commercio marittimo, e garantire che i nostri mercanti dominino le acque." 
 license_trading_companies: "Autorizza compagnie commerciali" 
 license_trading_companies_desc: "I rischi e le ricompense del commercio a lunga distanza sono troppo grandi perché un singolo mercante li sopporti da solo. Dovremmo autorizzare compagnie commerciali formali per mettere in comune risorse e condividere quei rischi, a beneficio del regno nel suo complesso." 
 establish_customs_houses: "Istituisci dogane" 
 establish_customs_houses_desc: "I nostri confini sono porosi, e i mercanti stranieri traggono profitto da beni che entrano nel nostro regno senza adeguata contabilità. Costruendo dogane, imponiamo ordine sulle nostre importazioni e garantiamo che la corona e i nostri mercanti ricevano la loro giusta parte." 
 fund_artisan_guilds: "Finanzia gilde artigiane" 
 fund_artisan_guilds_desc: "Gli artigiani qualificati del nostro regno producono beni di qualità straordinaria, ma mancano dell'organizzazione e del sostegno necessari per raggiungere il loro pieno potenziale. Dovremmo finanziare e proteggere le gilde che li rappresentano." 
 establish_trade_insurance: "Istituisci assicurazione commerciale" 
 establish_trade_insurance_desc: "I rischi del commercio, naufragi, banditismo e guerra, scoraggiano molti mercanti dalle imprese che arricchirebbero il regno. Creando sistemi assicurativi formali, permettiamo ai nostri mercanti di commerciare con maggiore fiducia." 
 expand_postal_relay_network: "Espandi la rete di stazioni postali" 
 expand_postal_relay_network_desc: "Comunicazioni affidabili sono la linfa vitale del commercio. Le nostre case mercantili sono disposte a finanziare una rete di stazioni di cambio che trasporterebbe messaggi e merci più rapidamente che mai, un investimento che si ripagherebbe molte volte." 
 establish_common_food_stores: "Istituisci riserve alimentari comuni" 
 establish_common_food_stores_desc: "Il nostro popolo è vulnerabile ai crudeli capricci dei cattivi raccolti, e la fame genera disperazione. Istituendo granai comunitari, garantiamo che nessuna carestia, per quanto dura, possa lasciare il nostro popolo senza risorse." 
 promote_farming_innovation: "Promuovi innovazione agricola" 
 promote_farming_innovation_desc: "Nuovi metodi di rotazione delle colture e coltivazione hanno dato risultati notevoli in altre terre. Dovremmo sostenerne l'adozione in tutto il nostro regno, affinché i nostri campi producano più abbondantemente e il nostro popolo soffra meno la penuria." 
 sponsor_irrigation_projects: "Sostieni progetti di irrigazione" 
 sponsor_irrigation_projects_desc: "Gran parte delle terre del nostro regno potrebbe dare raccolti molto più ricchi se solo vi fosse portata acqua. Dovremmo finanziare la costruzione di canali e opere d'irrigazione che trasformeranno terre aride in campi produttivi." 
 reduce_serfdom: "Riduci la servitù della gleba" 
 reduce_serfdom_desc: "I vincoli della servitù della gleba pesano gravemente sulla gente comune, legandola alla terra e soffocando proprio il lavoro che sostiene tutti noi. Alleggerendo questi pesi e concedendo maggiore libertà di movimento, rafforziamo la lealtà e la produttività del nostro popolo." 
 establish_village_councils: "Istituisci consigli di villaggio" 
 establish_village_councils_desc: "Le nostre comunità rurali sono governate da signori lontani che non conoscono né curano i bisogni locali. Istituendo consigli di villaggio con l'autorità di gestire gli affari locali, diamo voce al nostro popolo e portiamo l'ordine più vicino a casa." 
 charter_artisan_guilds: "Concedi carte alle gilde artigiane" 
 charter_artisan_guilds_desc: "I maestri e i garzoni delle nostre botteghe faticano senza un riconoscimento formale da parte della corona. Concedendo carte di corporazione alle confraternite artigiane del regno, portiamo i loro mestieri sotto un ordine legale e guadagniamo la benevolenza di coloro le cui mani sostengono la nostra prosperità." 
 subsidize_grain_imports: "Sovvenziona importazioni di grano" 
 subsidize_grain_imports_desc: "I nostri mercati hanno i mezzi per nutrire il nostro popolo, ma solo se il prezzo del grano resta alla portata della gente comune. Sovvenzionando le importazioni di grano, garantiamo che scarsità e bisogno non spingano il nostro popolo alla disperazione." 
 rural_crafts_charter: "Carta dell'artigianato rurale" 
 rural_crafts_charter_desc: "I monopoli delle gilde nelle nostre città soffocano le attività domestiche che sostengono le famiglie rurali nelle stagioni difficili. Dovremmo autorizzare e proteggere gli artigiani rurali da tali interferenze, dando alla gente comune la libertà economica che merita." 
 prevent_noble_enclosure: "Previeni le recinzioni nobiliari" 
 prevent_noble_enclosure_desc: "I grandi signori del regno hanno sequestrato per troppo tempo le terre comuni da cui dipendono i nostri contadini per sopravvivere. Dobbiamo agire per proteggere quel poco che resta loro, prima che il malcontento diventi qualcosa di molto più pericoloso." 
 declare_war_taxes: "Dichiara tasse di guerra" 
 declare_war_taxes_desc: "Il nostro sforzo bellico richiede risorse superiori a quelle fornite dalle entrate ordinarie. Il parlamento deve autorizzare leve fiscali d'emergenza su tutti i ceti, un peso condiviso da tutti per la sopravvivenza e la gloria del regno." 
 wartime_cavalry_reserve: "Riserva di cavalleria in tempo di guerra" 
 wartime_cavalry_reserve_desc: "Lo scontro decisivo può arrivare in qualsiasi momento, e dobbiamo garantire che la nostra cavalleria pesante sia in piena prontezza. Che le casate nobiliari impegnino i loro migliori guerrieri montati in uno stato di allerta costante finché la guerra non sarà vinta." 
 fortify_frontier_passes: "Fortifica i passi di frontiera" 
 fortify_frontier_passes_desc: "I nostri confini sono forti solo quanto i passi che i nemici devono attraversare per raggiungerci. Dovremmo finanziare il rafforzamento di ogni passaggio vulnerabile, trasformando le difese naturali del territorio in trappole mortali per chiunque osi invadere." 
 military_chaplaincy: "Cappellania militare" 
 military_chaplaincy_desc: "I nostri eserciti combattono non solo per corona e paese, ma per fede e dovere. Inserendo il clero come cappellani nelle nostre forze, sosteniamo lo spirito dei soldati nelle dure prove della campagna." 
 establish_field_hospitals: "Istituisci ospedali da campo" 
 establish_field_hospitals_desc: "Troppi dei nostri soldati muoiono non per le lame nemiche, ma per ferite che potrebbero essere curate e malattie che potrebbero essere prevenute. Che la Chiesa organizzi ospedali mobili per seguire i nostri eserciti e salvare le vite di coloro che combattono per noi." 
 naval_supply_contracts: "Contratti di rifornimento navale" 
 naval_supply_contracts_desc: "La nostra flotta non può restare in mare senza rifornimenti affidabili, e le gilde mercantili hanno le reti per fornirli. Stipulando con loro contratti formali per mantenere la flotta rifornita, garantiamo che le nostre navi possano combattere senza timore di restare a corto." 
 fund_siege_engineers: "Finanzia ingegneri d'assedio" 
 fund_siege_engineers_desc: "Le mura dei nostri nemici non cadranno senza le competenze necessarie ad abbatterle. Le nostre gilde borghesi possono finanziare ingegneri specializzati e l'equipaggiamento d'assedio necessario per ridurre anche le fortificazioni più solide." 
 wartime_harvest_pooling: "Messa in comune dei raccolti in guerra" 
 wartime_harvest_pooling_desc: "I nostri eserciti marciano sul loro stomaco, e un esercito affamato non combatte bene. Organizzando la messa in comune delle eccedenze dei raccolti in magazzini regionali, il nostro popolo può sostenere direttamente le forze che lo difendono." 
 supply_line_labor_draft: "Leva di lavoro per le linee di rifornimento" 
 supply_line_labor_draft_desc: "Le strade che portano i nostri rifornimenti al fronte devono essere mantenute, e il nostro materiale deve essere spostato senza sosta. Il nostro popolo può servire lo sforzo bellico con il lavoro sulle linee di rifornimento, un contributo vitale quanto qualsiasi braccio armato." 
 royal_road_commission: "Commissione delle strade regie" 
 royal_road_commission_desc: "Le strade che collegano il nostro regno sono le arterie attraverso cui scorrono autorità e commercio. Commissionando una vera rete di strade regie mantenute, garantiamo che il nostro controllo raggiunga rapidamente ogni angolo delle nostre terre." 
 mountain_pass_charters: "Carte dei passi montani" 
 mountain_pass_charters_desc: "Le nostre casate nobiliari dominano i passi montani che dividono il regno. Concedendo loro carte per mantenere e presidiare questi attraversamenti, garantiamo che distanza e terreno non isolino più le nostre province dalla corona." 
 establish_parish_waypoints: "Istituisci stazioni parrocchiali" 
 establish_parish_waypoints_desc: "Le strade del nostro regno sono lunghe e le distanze faticose per corrieri e viaggiatori. Istituendo stazioni parrocchiali lungo le rotte chiave, la Chiesa può fornire riposo, guida e sostegno a tutti coloro che attraversano le nostre terre." 
 coastal_trading_post_network: "Rete costiera di empori commerciali" 
 coastal_trading_post_network_desc: "Le nostre coste offrono porti naturali e punti di sosta che restano inutilizzati per mancanza di strutture adeguate. Una rete di empori commerciali costieri finanziata dai mercanti ridurrebbe costi e rischi del commercio marittimo e avvicinerebbe le province lontane alla capitale." 
 rural_road_upkeep_corvee: "Corvée per la manutenzione delle strade rurali" 
 rural_road_upkeep_corvee_desc: "Le nostre strade rurali cadono in rovina per mancanza di manutenzione organizzata. Richiedendo una modesta corvée di lavoro alle famiglie contadine per mantenere percorribili le strade locali, garantiamo che nessuna parte del regno sia tagliata fuori dal centro." 
 STATIC_MODIFIER_NAME_parl_royal_monopoly_mod: "Monopolio regio del commercio" 
 STATIC_MODIFIER_NAME_parl_charter_governors_mod: "Governatori di stati clienti con carta" 
 STATIC_MODIFIER_NAME_parl_colonial_admin_mod: "Amministrazione coloniale" 
