 steppe_group: "Gruppo delle Steppe" 
 steppe_group_desc: "Il $steppe_group$ è formato da varie culture appartenenti al $mongolian_group$ e al $tatar_group$ che vivono nelle steppe dell'Eurasia." 
 rhaetian_group: "Retico" 
 rhaetian_group_desc: "I popoli $rhaetian_group$ sono un gruppo etnolinguistico composto da tre principali comunità alpine: romanci, ladini e friulani. Pur non condividendo una singola entità politica, sono uniti dalla discendenza da un comune sostrato latino volgare mescolato a influenze retiche e celtiche antiche." 
 hmong_mien_group: "Hmong-Mien" 
 hmong_mien_group_desc: "I popoli Hmong-Mien abitano gli altopiani della Cina meridionale e del Sud-est asiatico, parlando lingue della famiglia indipendente Hmong-Mien, non imparentata con quelle dei loro vicini. Noti per le loro vivaci tradizioni tessili e la loro fiera indipendenza, hanno storicamente resistito all'assimilazione negli imperi di pianura che li circondavano." 
 papuan_group: "Papuano" 
 papuan_group_desc: "I popoli papuani sono gli abitanti indigeni della Nuova Guinea e delle isole vicine, e parlano centinaia di lingue appartenenti a famiglie linguistiche diverse e in gran parte non correlate, note collettivamente come papuane. La loro straordinaria diversità linguistica e culturale riflette migliaia di anni di sviluppo isolato attraverso il terreno accidentato dell'isola." 
 atlantic_group: "Atlantico" 
 atlantic_group_desc: "I popoli atlantici dell'Africa occidentale abitano le coste e le savane dalla Senegambia alla Sierra Leone, parlando lingue del ramo atlantico della famiglia Niger-Congo. Comprendono i grandi cavalieri e mercanti della costa senegambiana, nonché i popoli Mel che vivono nelle foreste dell'entroterra della Sierra Leone." 
 kru_group: "Kru" 
 kru_group_desc: "I popoli Kru delle coste liberiane e ivoriane parlano lingue del ramo Kru del Niger-Congo e sono rinomati per la loro abilità marittima e la fiera resistenza alla schiavitù. Le loro tradizioni marinare li resero per secoli marinai apprezzati lungo la costa dell'Africa occidentale." 
 kwa_group: "Kwa" 
 kwa_group_desc: "I popoli Kwa della Costa d'Oro e del Golfo del Benin parlano lingue del ramo Kwa del Niger-Congo, comprendendo gli stati Akan dell'interno e i regni costieri Ewe e Fon. Le loro società sono caratterizzate dall'eredità matrilineare tra gli Akan e dalla potente tradizione religiosa Vodun tra i Fon e gli Ewe." 
 volta_niger_group: "Volta-Niger" 
 volta_niger_group_desc: "I popoli Volta-Niger della regione nigeriana parlano lingue del ramo Volta-Niger del Niger-Congo e includono alcune delle società più popolose e politicamente sofisticate dell'Africa occidentale. Le città-stato yoruba, le repubbliche di villaggio igbo e il Regno del Benin sono tra le entità politiche più compiute del continente." 
 bantu_group: "Bantu" 
 bantu_group_desc: "I popoli bantu formano il più grande raggruppamento linguistico dell'Africa subsahariana; la loro espansione da una terra d'origine presso il confine tra Camerun e Nigeria portò lingue bantu e pratiche agricole attraverso l'Africa centrale, orientale e meridionale nel corso di tre millenni. Oggi i popoli di lingua bantu abitano quasi l'intera metà meridionale del continente." 
 central_african_group: "Centrafricano" 
 central_african_group_desc: "I popoli dell'Africa centrale abitano il vasto bacino del Congo e gli altopiani circostanti, parlando lingue delle famiglie Adamawa, Ubangi e affini. Le loro culture sono diverse quanto le foreste pluviali, le savane e i fiumi che chiamano casa, dai Baka che vivono nelle foreste ai mercanti fluviali dei grandi affluenti del Congo." 
 nilotic_group: "Nilotico" 
 nilotic_group_desc: "I popoli nilotici sono comunità pastorali e semipastorali della valle del Nilo e delle pianure dell'Africa orientale, e parlano lingue del ramo nilotico del nilo-sahariano. Dai Maasai allevatori di bestiame della Rift Valley ai pescatori del Sudd, sono uniti da strutture sociali per classi d'età e da una profonda dipendenza dal bestiame." 
 nilosahelian_group: "Nilo-Sahariano" 
 nilosahelian_group_desc: "I popoli nilo-sahariani abitano un'ampia fascia che si estende dal Sahara agli altopiani etiopi, parlando lingue della variegata famiglia nilo-sahariana. Comprendono gli agricoltori dei Monti Nuba, i mercanti dei sultanati del Darfur e i nomadi della fascia sahariana." 
 cushitic_group: "Cuscitico" 
 cushitic_group_desc: "I popoli cuscitici del Corno d'Africa e della valle del Nilo parlano lingue del ramo cuscitico della famiglia afroasiatica. Comprendono i nomadi cammellieri della Somalia e dell'Ogaden, gli agricoltori degli altopiani della Rift Valley etiope e gli antichi Beja della costa del Mar Rosso." 
 khoisan_group: "Khoisan" 
 khoisan_group_desc: "I popoli khoisan dell'Africa meridionale e orientale sono tra le popolazioni più antiche ancora esistenti sulla Terra, e parlano lingue contraddistinte dalle loro notevoli consonanti clic. Comprendono i cacciatori-raccoglitori San del Kalahari e i pastori Khoikhoi del Capo, popoli che abitavano l'Africa meridionale molto prima dell'espansione bantu." 
 permic_group: "Permico" 
 permic_group_desc: "I popoli permici della regione dei Monti Urali parlano lingue del ramo permico della famiglia uralica, strettamente imparentate con il finlandese e l'estone. I Komi e gli Udmurti abitano da lungo tempo le foreste tra il Volga e gli Urali, commerciando pellicce con i loro vicini slavi e tatari." 
 mordvinic_group: "Mordvinico" 
 mordvinic_group_desc: "I popoli mordvinici della regione del medio Volga parlano lingue del ramo mordvinico della famiglia uralica, formando uno dei più grandi gruppi indigeni della Russia europea. Moksha ed Erzya sono strettamente imparentati, ma parlano lingue distinte e mantengono identità culturali separate." 
 pama_nyungan_group: "Pama-Nyungan" 
 pama_nyungan_group_desc: "I popoli Pama-Nyungan abitano la grande maggioranza del continente australiano, parlando lingue della famiglia Pama-Nyungan, che copre circa l'ottanta per cento della superficie terrestre dell'Australia. Nonostante l'enorme diversità interna a questa famiglia, questi popoli condividono ampi modelli culturali, tra cui complessi sistemi di parentela, la cosmologia del Dreaming e la sussistenza da cacciatori-raccoglitori." 
 australian_group: "Aborigeno Australiano" 
 australian_group_desc: "I popoli aborigeni d'Australia sono tra le culture continue più antiche della Terra, avendo abitato il continente per almeno sessantacinquemila anni. Il loro profondo legame con la terra, espresso attraverso il concetto del Dreaming, e la loro sofisticata conoscenza ecologica li rendono unici tra i popoli del mondo." 
 east_african_coast_group: "Costa Swahili" 
 east_african_coast_group_desc: "I popoli della Costa Swahili hanno sviluppato una peculiare civiltà marittima lungo la riva dell'Oceano Indiano dell'Africa orientale, fondendo tradizioni agricole bantu con la cultura mercantile dei commercianti arabi e persiani. Le loro città-stato in pietra corallina, da Mogadiscio a Kilwa, costituivano il terminale africano della grande rete commerciale dell'Oceano Indiano." 
 great_lakes_kingdoms_group: "Regni dei Grandi Laghi" 
 great_lakes_kingdoms_group_desc: "I popoli della regione africana dei Grandi Laghi hanno sviluppato alcune delle strutture statali più sofisticate dell'Africa subsahariana, con regni gerarchici incentrati sulla ricchezza bovina e sulla regalità ereditaria. Dal regno di Buganda sulla riva settentrionale del Lago Vittoria alle colline terrazzate del Ruanda, queste società interlacustri condividono una cultura politica comune fatta di tributi, corti reali e organizzazione clanica." 
 east_african_nomad_group: "Pastori dell'Africa Orientale" 
 east_african_nomad_group_desc: "I popoli pastorali dell'Africa orientale si muovono attraverso le grandi savane e le pianure semiaride dagli altopiani etiopi alla steppa tanzaniana, allevando bovini, cammelli e capre tra pascoli stagionali. Organizzati tramite sistemi guerrieri per classi d'età e privi di stati territoriali permanenti, formano un mondo culturale translinguistico che abbraccia famiglie linguistiche nilotiche, cuscitiche e altre." 
 nguni_group: "Nguni" 
 nguni_group_desc: "I popoli nguni dell'Africa sudorientale parlano un gruppo di lingue bantu strettamente imparentate, contraddistinte dal loro ricco sistema di consonanti clic preso in prestito dai vicini popoli khoisan. Organizzati intorno alla ricchezza bovina, ai sistemi per classi d'età e a potenti capitanati, gli Nguni diedero origine alle grandi nazioni zulu e xhosa che dominarono la costa orientale dell'Africa meridionale." 
 sotho_tswana_group: "Sotho-Tswana" 
 sotho_tswana_group_desc: "I popoli sotho-tswana dell'altopiano meridionale africano parlano le lingue strettamente imparentate sotho e tswana e condividono un'eredità comune di vita in villaggi nucleati, ricchezza basata sul bestiame e sofisticate tradizioni di lavorazione del ferro. Le loro grandi città sull'arido altopiano interno furono tra gli insediamenti più popolosi dell'Africa meridionale precoloniale." 
 shona_group: "Shona" 
 shona_group_desc: "I popoli di lingua shona dell'altopiano dello Zimbabwe e della valle del Limpopo costruirono una delle civiltà precoloniali più straordinarie dell'Africa, incentrata sui grandi recinti in pietra del Grande Zimbabwe e dei suoi stati successori. Il loro controllo delle rotte del commercio dell'oro verso la costa dell'Oceano Indiano li rese una potenza commerciale la cui ricchezza giunse fino alla Cina e alla Persia." 
 kongo_group: "Kongo" 
 kongo_group_desc: "I popoli kongo del basso bacino del fiume Congo e della costa atlantica svilupparono uno degli stati più centralizzati dell'Africa subsahariana, il Regno del Kongo, con una burocrazia sofisticata, governatori provinciali e un ampio sistema monetario basato sulle conchiglie nzimbu. Il loro primo incontro con i mercanti portoghesi alla fine del XV secolo rese il Regno del Kongo una delle prime entità politiche africane a intrattenere relazioni diplomatiche con le potenze europee da pari." 
 luba_group: "Luba" 
 luba_group_desc: "I popoli luba e lunda dell'altopiano del Katanga e del bacino del Kasai costruirono una rete interconnessa di imperi tributari che dominò per secoli il cuore dell'Africa centrale. L'Impero Luba fu pioniere del modello nilotico di regalità divina in Africa centrale, e l'espansione lunda diffuse il loro sistema politico di governatori nominati su una vasta fascia del continente, dall'Angola allo Zambia." 
 chokwe_group: "Chokwe" 
 chokwe_group_desc: "I popoli chokwe dell'altopiano angolano sono rinomati per le loro eccezionali tradizioni artistiche, in particolare le maschere e le sculture lignee, e per il loro ruolo nelle reti commerciali a lunga distanza che collegavano la costa atlantica all'interno dell'Africa centrale. Originariamente sudditi dell'Impero Lunda, si espansero drasticamente nel XIX secolo fino a diventare uno dei popoli dominanti della regione." 
