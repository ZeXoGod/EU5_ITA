 #Personality Modifier Descriptions - Note: don't refer directly to the sex or title of the monarch.
 desc_conqueror: "Il Personaggio è un conquistatore. Sotto questo regime potremo annettere nuovi territori al nostro dominio con maggiore efficacia."
 desc_tolerant: "Il Personaggio è tollerante. Le minoranze religiose prospereranno durante il nostro regime."
 desc_just: "Il Personaggio è giusto. Grazie a una profonda conoscenza delle leggi e delle tradizioni del regno, i sudditi ci considerano legittimi e imparziali."
 desc_righteous: "Il Personaggio è retto. Il popolo difficilmente metterà in dubbio la nostra autorità, sapendo che chi è retto agisce sempre per il bene comune."
 desc_kind_hearted: "Il Personaggio è magnanimo. Un sincero interesse per la gente comune ha reso chi ci guida molto amato e la nazione più resiliente alle difficoltà, specialmente in tempo di guerra."
 desc_free_thinker: "Il Personaggio è un libero pensatore. Non vincolato da dottrine rigide, incoraggia tutti a sperimentare e ragionare liberamente sul futuro della nostra grande nazione."
 desc_well_connected: "Il Personaggio è ben introdotto. La corte e il gabinetto beneficiano dell'ampia rete di contatti tra le menti più brillanti di quest'epoca."
 desc_calm: "Il Personaggio è calmo. Non perdendo mai la pazienza né la dignità, ispira con l'esempio e prende decisioni ponderate, permettendoci di superare più rapidamente qualsiasi crisi."
 desc_careful: "Il Personaggio è cauto. Navigando con attenzione tra le regole non scritte delle relazioni internazionali, riesce ad attenuare l'impatto delle nostre trasgressioni."
 desc_secretive: "Il Personaggio è riservato. Un istinto naturale a mantenere porte chiuse e lettere cifrate che si riflette su tutto il governo, rendendo più arduo per gli agenti nemici infiltrarsi nelle nostre istituzioni"
 desc_intricate_web_weaver: "Il Personaggio è un tessitore di intrighi. Ordendo continuamente nuove trame, si assume personalmente gran parte della responsabilità dello spionaggio estero."
 desc_well_advised: "Il Personaggio è ben consigliato. Sempre pronto ad ascoltare il saggio consiglio altrui, attira un maggior numero di persone alla corte e nel gabinetto."
 desc_benevolent: "Il Personaggio è benevolo. Essere percepiti come animati da buone intenzioni è un grande vantaggio per mantenere la tranquillità dei sudditi."
 desc_zealot: "Il Personaggio è uno zelota. La devozione fanatica alla vera fede permette di ispirare più persone a convertirsi e aderire alla religione di Stato."
 desc_pious: "Il Personaggio è devoto. Profondamente spirituale e religioso, assicura che lo Stato non smarrisca la rotta e infonde fiducia nella nostra fede."
 desc_lawgiver: "Il Personaggio è un legislatore. Le leggi costruiscono e uniscono un regno. L'obiettivo è ridurre le centinaia di leggi e consuetudini delle varie parti del regno per creare un corpus giuridico più centralizzato e giusto."
 desc_midas_touched: "Il Personaggio ha il tocco di Mida. Il talento di rendere profittevole ogni progetto è un'immensa risorsa. Le casse dello Stato non mancheranno mai di denaro finché resterà al potere."
 desc_incorruptible: "Il Personaggio è incorruttibile. Costruire uno Stato moderno significa combattere costantemente la corruzione. I funzionari sono sempre tentati di accettare tangenti, e prendersi cura di amici e parenti è un istinto umano naturale. Respingendo con fermezza ogni simile tentazione e combattendola con sdegno, dà l'esempio all'intera nazione."
 desc_architectural_visionary: "Il Personaggio è un visionario dell'architettura. Migliorare le infrastrutture è una necessità per qualsiasi Stato della nostra epoca, e questo è chi può farlo. Grandi visioni unite a un'eccezionale capacità di contenere i costi rendono chi governa una risorsa preziosa."
 desc_scholar: "Il Personaggio è un erudito. L'ambizione di comprendere il mondo e i principi che regolano uomini e natura permette di capire e implementare nuove tecnologie con un'efficienza altrimenti impossibile."
 desc_entrepreneur: "Il Personaggio è intraprendente. Vedendo il potenziale per nuovi progetti in ogni ostacolo od opportunità, contribuisce a un numero sempre crescente di iniziative per rafforzare la nostra economia."
 desc_industrious: "Il Personaggio è laborioso. Mai pago di riposare e attraverso giornate lavorative sempre più lunghe, gestisce costantemente i dettagli di ogni provincia del regno per massimizzare la produzione e le entrate di tutte le risorse sotto controllo statale."
 desc_expansionist: "Il Personaggio è un espansionista. Personalmente investito nella rivendicazione e colonizzazione di nuove terre, è determinato ad assicurare che l'espansione coloniale resti una priorità assoluta per il nostro Stato."
 desc_charismatic_negotiator: "Il Personaggio è un negoziatore carismatico. Attraverso il coinvolgimento personale nella diplomazia e nelle trattative statali, riesce a far vedere le cose dal nostro punto di vista più spesso di quanto sarebbe altrimenti possibile."
 desc_silver_tongue: "Il Personaggio ha una lingua d'argento. Nelle comunicazioni con gli altri Stati, riesce a presentare le nostre azioni passate sotto una luce molto più favorevole. Una volta che i vicini comprendono le ragioni delle nostre azioni, sono molto più inclini a perdonarci eventuali trasgressioni."
 desc_tactical_genius: "Il Personaggio è un genio tattico. Un grande interesse personale nelle manovre e nelle finte sul campo di battaglia si traduce in una maggiore competenza ed esperienza in queste materie per tutti i nostri generali."
 desc_bold_fighter: "Il Personaggio è un combattente audace. Credendo che l'urto sia di grande importanza sul campo di battaglia, non teme mai le conseguenze e incoraggia tutti a guidare le proprie truppe nel cuore della mischia nemica quando la situazione lo richiede."
 desc_fierce_negotiator: "Il personaggio è un negoziatore implacabile. In qualsiasi trattato o negoziazione, il nostro sovrano non cederà facilmente terreno, ma continuerà invece a lottare per difendere i nostri interessi." 
 desc_strict: "Il Personaggio è severo. Interessandosi molto al comportamento delle truppe, è in grado di instillare un rigido senso di disciplina in tutti i ranghi, dal più basso al più alto."
 desc_inspiring_leader: "Il Personaggio è un leader ispiratore. Una grande leadership personale può far trovare coraggio anche agli uomini più codardi."
 desc_martial_educator: "Il Personaggio è un istruttore militare. Sotto il regime attuale, l'addestramento del nostro corpo ufficiali è una delle nostre massime priorità."
 desc_babbling_buffoon: "Il Personaggio è considerato un buffone chiacchierone. Sebbene animato da buone intenzioni nell'impegnarsi personalmente nella diplomazia con i vicini, manca del talento necessario per condurre trattative. Chiunque fa più fatica a cogliere i nostri argomenti e molte delle nostre negoziazioni sono ostacolate dall'inettitudine di chi ci guida."
 desc_embezzler: "Il Personaggio è corrotto. Una delle motivazioni principali è la volontà e il talento di usare le entrate statali per aumentare la ricchezza personale."
 desc_drunkard: "Il Personaggio è dissoluto. Cercando sempre sollievo dall'apatia generale, si abbandona a grandi quantità di sostanze stimolanti sotto forma di alcol. Avere un sovrano dissoluto getta una cattiva luce sull'intera nazione."
 desc_sinner: "Il Personaggio è un peccatore. Le mancanze personali nella guida del paese hanno rivoltato contro di noi l'establishment religioso."
 desc_greedy: "Il Personaggio è avido. La riscossione delle entrate statali diventa sempre più spietata e miope sotto chi non si ferma davanti a nulla pur di aumentare le entrate. Danneggiando o distruggendo ogni fonte di reddito, gli effetti a lungo termine di questo comportamento miope sono una drastica riduzione del gettito fiscale."
 desc_cruel: "Il Personaggio è considerato crudele. Storie diffuse di azioni arbitrarie e crudeli hanno profondamente turbato molti dei nostri sudditi. Questo potrebbe non bastare di per sé a scatenare una ribellione, ma qualsiasi crisi colpirà più duramente l'opinione pubblica poiché a nessuno mancano motivi per ribellarsi."
 desc_naive: "Questo sovrano è un Entusiasta Ingenuo. Fidandosi ciecamente degli altri e sottovalutando costantemente le conseguenze, l'ingenuità del nostro sovrano farà sì che i nostri vicini approfittino di ogni debolezza." 
 desc_craven: "Il Personaggio è vigliacco. Disperatamente terrorizzato dal combattimento fisico, sta il più lontano possibile dai campi di battaglia. Le nostre truppe non possono fare a meno di notare che sono da sole."
 desc_loose_lips: "Spesso personalmente responsabile di fughe di notizie e violazioni della sicurezza, chi governa è generalmente troppo fiducioso e facilmente ingannabile. Sfortunatamente, la somma di tutto ciò è che arreca più danno che beneficio ai nostri sforzi di controspionaggio."
 desc_obsessive_perfectionist: "Il Personaggio è un perfezionista ossessivo. Un vivo interesse per i dettagli e le minuzie non è sempre accompagnato da un pari talento in tali questioni. Causando costantemente interruzioni e ritardi, arreca molto più danno che beneficio quando si tratta di sviluppare le nostre infrastrutture interne."
 desc_malevolent: "Il Personaggio è considerato malevolo. Le azioni sono spesso percepite come motivate da malizia o intento ostile. Di conseguenza, qualsiasi paese soggetto sotto il nostro controllo è pronto a irritarsi e teme qualsiasi nostra azione."
 #Leaders (Generals and Admirals)
 glory_seeker: "Cacciatore di Gloria"
 desc_glory_seeker: "Questo Generale è avido di fama: le truppe al suo comando ottengono più Prestigio e Tradizione dell'Esercito, perché vengono sempre schierate dove l'impatto è più evidente."
 born_to_the_saddle: "Nato in Sella"
 desc_born_to_the_saddle: "Questo Generale è nato in sella: la Cavalleria al suo comando sfrutta meglio il vantaggio di fiancheggiamento."
 offensive_planner: "Pianificatore Offensivo" 
 desc_offensive_planner: "Questo generale è un pianificatore offensivo. Le truppe comandate da questo leader otterranno un bonus in combattimento." 
 defensive_planner: "Pianificatore Difensivo"
 desc_defensive_planner: "Questo Generale è un pianificatore difensivo: le truppe al suo comando resistono meglio alle cariche."
 battlefield_medic: "Medico da Campo"
 desc_battlefield_medic: "Conosciuto come Medico da Campo: più soldati del normale rientrano dopo la battaglia, rinforzando le unità fino alla piena forza."
 ruthless: "Spietato"
 desc_ruthless: "Questo Generale è spietato: le truppe sotto il suo comando infliggono danni da fuoco più elevati."
 inspirational_leader_general: "Condottiero Ispiratore"
 desc_inspirational_leader_general: "È un condottiero ispiratore: i suoi uomini recuperano il Morale più in fretta anche dopo le sconfitte."
 master_of_arms: "Maestro d'Armi"
 desc_master_of_arms: "È un maestro d'armi: la Fanteria che guida è più efficiente e infligge più danni."
 goal_oriented: "Focalizzato sull'Obiettivo"
 desc_goal_oriented: "È focalizzato sull'obiettivo: le truppe da lui guidate marciano più rapidamente verso la meta."
 hardy_warrior: "Guerriero Tenace"
 desc_hardy_warrior: "È noto come un guerriero tenace: le truppe al suo comando sopportano meglio le condizioni avverse e subiscono meno [attrition|e]."
 siege_specialist: "Specialista d'Assedio"
 desc_siege_specialist: "È uno specialista d'assedio: gli assedi che dirige sono più efficienti e si concludono più rapidamente."
 cannoneer: "Cannoniere"
 desc_cannoneer: "È un cannoniere: affascinato da polvere da sparo e cannoni, rende l'Artiglieria al suo comando più efficiente."
 aggressive_commander: "Comandante Aggressivo" 
 desc_aggressive_commander: "Questo ammiraglio è un comandante aggressivo. Le navi guidate da questo comandante otterranno un bonus in combattimento." 
 extortioner: "Taglieggiatore"
 desc_extortioner: "Questo Ammiraglio è un taglieggiatore: sa sfruttare la superiorità di forza, così le [ships|e] al suo comando esercitano più Potere Commerciale dei concorrenti."
 ruthless_blockader: "Bloccatore Spietato"
 desc_ruthless_blockader: "Questo Ammiraglio è spietato nel blocco: le [ships|e] al suo comando mantengono il [blockade|e] con molta più efficienza."
 buccaneer: "Bucaniere"
 desc_buccaneer: "Questo Ammiraglio è un bucaniere: i corsari al suo comando sono più efficienti."
 prize_hunter: "Cacciatore di Prede"
 desc_prize_hunter: "Questo Ammiraglio è un cacciatore di prede: sprona i capitani a catturare più bottini e a impadronirsi di più [ships|e] del normale."
 ironside: "Ironside"
 desc_ironside: "Questo Ammiraglio è un “Ironside”: le [ships|e] al suo comando subiscono meno danni di quelle guidate da altri capitani."
 naval_engineer: "Ingegnere Navale"
 desc_naval_engineer: "Questo Ammiraglio è un ingegnere navale: le [ships|e] al suo comando riparano più in fretta i danni subiti in mare o in battaglia."
 naval_showman: "Showman Navale"
 desc_naval_showman: "Questo Ammiraglio è uno showman navale: le [ships|e] al suo comando ottengono più Prestigio e Tradizione Navale dalle battaglie."
 ram_raider: "Speronatore"
 desc_ram_raider: "Questo Ammiraglio è uno speronatore: le Galee al suo comando sono più efficienti e infliggono più danni negli scontri navali."
 naval_gunner: "Artigliere Navale"
 desc_naval_gunner: "Questo Ammiraglio è un artigliere navale: l'addestramento costante fa sì che le [ships|e] pesanti infliggano più danni."
 accomplished_sailor: "Marinaio Provetto"
 desc_accomplished_sailor: "Questo Ammiraglio è un marinaio provetto: la perizia personale eleva le doti di tutti i capitani; le [ships|e] al suo comando raggiungono la meta più rapidamente."
 level_headed: "Sangue Freddo"
 desc_level_headed: "Questo Ammiraglio è di sangue freddo: con addestramento accurato e mente lucida, gli equipaggi al suo comando subiscono meno danni al Morale dai colpi ricevuti in combattimento navale."
 military_theorist: "Teorico Militare"
 desc_military_theorist: "Questo Generale è tra i massimi teorici militari di sempre, capace di tradurre in pratica le proprie dottrine."
 strategist: "Stratega"
 desc_strategist: "Questo Generale è uno stratega senza pari, un genio militare: ogni mossa sul campo è di brutale efficacia e nessuna fortezza resiste alla sua astuzia."
 mamluk: "Mamlūk"
 mamluks: "Mamālīk"
 desc_mamluk: "Questo Generale è uno dei selezionati $mamluks$: in origine schiavi comprati e venduti, ma con tale attitudine alla guerra da essere addestrati come forza di guerrieri professionisti."
 eunuch: "Eunuco"
 desc_eunuch: "Questo personaggio è stato castrato prima della pubertà o è semplicemente nato così. Nelle corti delle società poliginiche, gli eunuchi svolgono spesso specifiche funzioni sociali riservate a coloro che non possono generare eredi." 
 eunuch_die_desc: "Sapeva tessere intrighi come pochi; tra i suoi avversari e alleati, ci mancherà moltissimo."
 eunuch_born_with: "è purtroppo nato $TRAIT$, una malformazione del corpo che gli impedisce per sempre di generare figli propri." 
 raised_by_eunuchs: "Cresciuto tra gli Eunuchi"
 desc_raised_by_eunuchs: "Questo personaggio è cresciuto circondato da eunuchi sin dalla tenera età e nutre grande simpatia per loro."
 raised_by_eunuchs_die_desc: "Visse un'intera, misera esistenza come pupazzo della potente fazione degli Eunuchi."
 dragon_tiger: "Generale Drago-Tigre"
 desc_dragon_tiger: "La fama di questo comandante corre per tutta l'[ShowContinentNameWithNoTooltip('asia')] orientale, da cui l'epiteto di $dragon_tiger$."
 dragon_tiger_die_desc: "Era considerat[CHARACTER.Custom('IT_ART_O_A')] un Drago-Tigre. Qualcuno è mai riuscito a batterl[CHARACTER.Custom('IT_ART_O_A')] sul campo di battaglia?"
 hussar_commander: "Comandante degli Ussari"
 desc_hussar_commander: "Questo Generale è un vero Comandante degli Ussari: le cariche di Cavalleria da lui guidate sono più efficaci."
 hussar_commander_die_desc: "Fu un temibile capo ussaro e vincitore di molte battaglie. Senza di [CHARACTER.GetHerHim], la nostra cavalleria potrebbe non toccare più simili vette di gloria."
 triumphant: "Trionfante" 
 desc_triumphant: "Un generale dotato di questa caratteristica è stato insignito dal Senato del proprio Paese, al ritorno da una campagna militare coronata dal successo, della più alta onorificenza che un ufficiale possa ricevere, guadagnandosi così il rispetto e l'ammirazione di tutti." 
 triumphant_die_desc: "[CHARACTER.GetSheHe|U] era uno dei generali più rispettati e onorati che la nostra nazione abbia mai avuto. Non c'è dubbio che sia il governo che il popolo sentiranno la mancanza delle sue capacità e della sua leadership" 
 #
 # Artists
 #
 gold_loving: "Amante dell'Oro"
 desc_gold_loving: "Gli artisti con questo tratto pretendono compensi molto più alti, attratti da tutto ciò che luccica. Per loro il denaro muove il mondo, e chi è di questo avviso esigerà sempre il compenso più lauto."
 humble: "Umile"
 desc_humble: "Malgrado l'abilità comprovata, gli artisti con questo tratto chiedono compensi modesti. Per loro l'umiltà è la radice di ogni virtù e il cardine della propria indole."
 workaholic: "Infaticabile"
 desc_workaholic: "Si dice che i maestri d'arte dimentichino perfino di nutrirsi o dormire, tanta è la dedizione al mestiere. Non si concedono tregua finché non hanno terminato la prossima opera."
 lazy: "Pigro"
 desc_lazy: "Perché finire oggi ciò che puoi rimandare a domani? Con questo spirito, tali artisti rallentano i tempi della creazione per godersi i piaceri della vita."
 prominent: "Di Spicco"
 desc_prominent: "Per immortalare la nostra gloria, nulla è meglio di un artista di spicco. Le sue creazioni amplificano la nostra Influenza Culturale e accrescono il Prestigio del regno agli occhi di sudditi e rivali."
 inconspicious: "Defilato"
 desc_inconspicious: "Le opere di questi artisti lasciano un segno più discreto nel panorama culturale. Per loro, la vera maestria rifugge l'ostentazione, anche se ciò dovesse costarci in termini di Prestigio e Influenza Culturale."
 meticulous: "Meticoloso"
 desc_meticulous: "Dominare l'arte non è da tutti. Questi artisti possiedono un rigore impeccabile e una padronanza assoluta della tecnica, dando vita a opere di qualità superiore che garantiscono bonus più consistenti."
 careless: "Sciatto"
 desc_careless: "Quella macchia rossastra sul volto del sovrano è una svista dell'artista o un simbolo della sua collera per le beghe di corte? In ogni caso, simili artigiani producono spesso opere di qualità inferiore."
 adept: "Abile"
 desc_adept: "È la perizia a distinguere il maestro dall'allievo. Un artista con questo tratto affina il proprio talento a vista d'occhio, padroneggiando la sua arte molto più rapidamente del normale."
 amateur: "Dilettante"
 desc_amateur: "Tutti iniziano da qualche parte. Gli artisti con questo tratto imparano lentamente, impiegando più tempo a migliorare e a farsi la mano."
 prescient: "Ispirato"
 desc_prescient: "L'ispirazione è la scintilla dei più grandi capolavori. Questi artisti godono di un costante slancio creativo, che li porta ad avviare nuove opere con maggior frequenza."
 idler: "Indolente"
 desc_idler: "Creare arte non è per i deboli di cuore: richiede doti rare, sostenute da ispirazione e fiducia. Chi ha questo tratto ne difetta, e per questo avvia nuove opere più di rado."
 blind: "Cieco" 
 desc_blind: "Questa persona ha perso la vista." 
 blind_die_desc: "La sua cecità era una tragica afflizione, ma [CHARACTER.GetSheHe] l'affrontò con coraggio e dignità." 
 blind_born_with: "è tragicamente nato $TRAIT$, privo del dono della vista fin dal suo primo respiro." 
 one_eyed: "Con un Occhio Solo" 
 desc_one_eyed: "Questa persona ha perso la vista da un occhio." 
 one_eyed_die_desc: "Non ci vedeva da un occhio, ma questo non ha scalfito la sua determinazione" 
 one_eyed_born_with: "è nato $TRAIT$ e vede il mondo con un solo occhio." 
 maimed: "Mutilato" 
 desc_maimed: "Questo individuo ha subito lesioni traumatiche che hanno comportato la perdita di un arto." 
 maimed_die_desc: "In seguito a un incidente traumatico, trascorse il resto dei suoi giorni come un invalido mutilato." 
 maimed_born_with: "è tragicamente nato $TRAIT$, con un arto malformato che lo ostacolerà per tutta la vita." 
 scarred: "Sfregiato" 
 desc_scarred: "Questa persona è sopravvissuta a una lieve ferita al viso, che le ha lasciato una bella cicatrice." 
 scarred_die_desc: "Era famoso per quella cicatrice imponente che ne esaltava il volto" 
 disfigured: "Sfigurato" 
 desc_disfigured: "Questa persona è sopravvissuta a malapena a un grave trauma facciale che le ha causato una terribile deturpazione." 
 disfigured_die_desc: "Era famoso per una terribile deturpazione che dominava ciò che restava del suo volto" 
 castrated: "Castrato" 
 desc_castrated: "Questo individuo è stato castrato, il che significa che non può più generare figli." 
 castrated_die_desc: "In seguito a una brutale castrazione, si ritrovò incapace di soddisfare se stesso o gli altri" 
 sickly: "Cagionevole" 
 desc_sickly: "Questa persona ha problemi di salute e spesso non si sente bene." 
 sickly_die_desc: "ha lottato contro la malattia per tutta la sua triste vita" 
 sickly_born_with: "è nato $TRAIT$, fragile e incline ad accessi di tosse, e chiunque si prenda cura del neonato teme il peggio." 
 healthy: "Sano" 
 desc_healthy: "Questa persona gode di buona salute ed è spesso di ottimo umore." 
 healthy_die_desc: "Ha vissuto una vita sana e appagante, circondato dai suoi cari." 
 healthy_born_with: "è nato $TRAIT$, con guance rosee e polmoni forti che promettono una vita lunga e vigorosa!" 
 hunchback: "Gobbo" 
 desc_hunchback: "Questa persona è nata con una deformità alla colonna vertebrale che ne compromette la postura e l'aspetto fisico." 
 hunchback_die_desc: "Viveva con una gobba e sarà ricordato per la sua andatura barcollante e la sua sagoma caratteristica." 
 hunchback_born_with: "è nato $TRAIT$, con una colonna vertebrale deformata che lo segnerà per tutta la vita." 
 smallpox_trait: "Vaiolo" 
 desc_smallpox_trait: "Questa persona ha contratto il vaiolo. Febbre, vomito e vesciche che trasudano liquido le ricoprono il corpo: una malattia lenta e straziante." 
 smallpox_trait_die_desc: "Alla fine il vaiolo ebbe la meglio sulla sua vita, con la febbre e le vesciche che lo consumarono definitivamente." 
 pockmarked_trait: "Butterato" 
 desc_pockmarked_trait: "Il vaiolo ha lasciato il segno su questa persona, con profonde cicatrici e segni butterati che le ricoprono il viso: un ricordo indelebile del suo incontro con il vaiolo." 
 pockmarked_trait_die_desc: "Si è portato le cicatrici del vaiolo nella tomba, segno indelebile del suo incontro con la malattia." 
 bubonic_plague_trait: "Peste Bubbonica" 
 desc_bubonic_plague_trait: "Questa persona ha contratto la peste nera. La terribile malattia le sta devastando il corpo: gonfiori neri, febbre altissima e una morte lenta e straziante." 
 bubonic_plague_trait_die_desc: "La Morte Nera si è presa la sua vita, così come si è presa quella di tanti altri." 
 #
 just_die_desc: "Il nostro Paese sentirà la mancanza dei suoi giudizi equi e imparziali."
 righteous_die_desc: "Il nostro popolo piange la scomparsa del sovrano più virtuoso della nostra epoca."
 kind_hearted_die_desc: "Il nostro popolo l[CHARACTER.Custom('IT_ART_O_A')] ricorderà come un sovrano dal cuore gentile e affettuoso."
 free_thinker_die_desc: "Non ha mai temuto d'infrangere le vecchie tradizioni pur di far avanzare i nostri obiettivi."
 well_connected_die_desc: "Senza dubbio sta già intessendo preziosi contatti nell'aldilà."
 calm_die_desc: "Portò pace e ordine al nostro Paese."
 secretive_die_desc: "Senza dubbio ha portato nella tomba molti dei suoi segreti."
 intricate_web_weaver_die_desc: "È compiant[CHARACTER.Custom('IT_ART_O_A')] da un esercito di informatori."
 well_advised_die_desc: "I suoi consiglieri ci assicurano che è stato meglio così."
 benevolent_die_desc: "I nostri sudditi piangono la scomparsa di un signore tanto benevolo."
 zealot_die_desc: "La sua energia e convinzione hanno ricondotto molti infedeli all'ovile."
 pious_die_desc: "Forse non conosceremo mai più un sovrano di tale virtù e statura spirituale."
 careful_die_desc: "Le sue decisioni ponderate hanno rafforzato la nostra posizione nel mondo."
 lawgiver_die_desc: "Alla fine, tutti saremo giudicati."
 midas_touched_die_desc: "Il suo talento nel trovare denaro ovunque ci ha resi un Paese più ricco."
 incorruptible_die_desc: "Il suo carattere integro ha reso il nostro Paese un luogo più onesto."
 architectural_visionary_die_desc: "La sua memoria vivrà per sempre nei molti edifici che ci ha lasciato."
 scholar_die_desc: "Le sue ricerche erudite hanno portato innovazione e fama al nostro Paese."
 entrepreneur_die_desc: "Plasmò la vita economica della sua epoca."
 industrious_die_desc: "Mancheranno le sue instancabili fatiche per migliorare la nostra economia."
 expansionist_die_desc: "I nostri coloni piangeranno la perdita del loro grande benefattore."
 charismatic_negotiator_die_desc: "Le trattative con sovrani stranieri sembreranno spente senza di [CHARACTER.GetHerHim]."
 silver_tongue_die_desc: "Le sue parole suadenti hanno tenuto il mondo a distanza. Chi ci proteggerà ora?"
 tactical_genius_die_desc: "Le sue manovre raffinate hanno lasciato i nemici frastornati e confusi."
 bold_fighter_die_desc: "Le sue cariche ardite tra le file nemiche hanno segnato per sempre ogni soldato della sua generazione."
 fierce_negotiator_die_desc: "La perdita della sua durezza negoziale indebolisce chiaramente le nostre capacità diplomatiche." 
 strict_die_desc: "La sua vigilanza costante ci ha tenuti sempre all'erta."
 inspiring_leader_die_desc: "Ispirò una generazione a prendere le armi contro i nostri nemici."
 martial_educator_die_desc: "Il programma di studi che creò per i nostri ufficiali verrà usato per generazioni."
 babbling_buffoon_die_desc: "I nostri amici serberanno caro questo giorno."
 embezzler_die_desc: "Ai nostri contabili non mancherà, ma ai suoi nipoti di certo sì."
 drunkard_die_desc: "Le sue sbornie e i gusti costosi hanno lasciato il Paese più povero e peggio governato di quando fu incoronat[CHARACTER.Custom('IT_ART_O_A')]."
 sinner_die_desc: "La sua vita di peccato non ha portato che vergogna al nostro Paese."
 greedy_die_desc: "La sua smodata brama di denaro e ricchezze non mancherà a nessuno."
 tolerant_die_desc: "Le nostre minoranze religiose piangeranno la scomparsa di chi mostrava tanta tolleranza."
 cruel_die_desc: "Le sue malefatte saranno ricordate per generazioni."
 naive_die_desc: "Le sue ingenue ingerenze negli affari esteri ci hanno lasciato solo fraintendimenti e nuovi nemici."
 craven_die_desc: "La sua codardia sul campo sarà per sempre la sua eredità."
 loose_lips_die_desc: "La sua leggerezza nel maneggiare le informazioni riservate ha reso di dominio pubblico i nostri segreti."
 obsessive_perfectionist_die_desc: "La sua ingerenza costante in ogni opera d'infrastruttura ci ha lasciato un lungo elenco di spese di cui non sentiremo la mancanza."
 malevolent_die_desc: "I nostri sudditi dormiranno più tranquilli sapendo che il suo regno di terrore malevolo è finito."
 conqueror_die_desc: "I nostri nemici tireranno certo un sospiro di sollievo per la sua scomparsa."
 #Obituaries for Generals/Admirals:
 military_theorist_die_desc: "È mort[CHARACTER.Custom('IT_ART_O_A')], ma le sue teorie vivranno per sempre!"
 strategist_die_desc: "La sua nazione piange questa grave perdita."
 mamluk_die_desc: "I suoi fratelli d'arme l[CHARACTER.Custom('IT_ART_O_A')] ricorderanno."
 no_die_desc: "È mort[CHARACTER.Custom('IT_ART_O_A')] troppo presto, senza riuscire a lasciare il segno."
 glory_seeker_die_desc: "Alle nostre truppe mancheranno le sue cariche valorose."
 born_to_the_saddle_die_desc: "I suoi cavalieri l[CHARACTER.Custom('IT_ART_O_A')] piangono come uno dei loro."
 defensive_planner_die_desc: "Le nostre truppe sentiranno molto la sua cura per la loro sicurezza."
 battlefield_medic_die_desc: "Le nostre truppe sentiranno molto la sua cura per la loro salute."
 ruthless_die_desc: "Le sue tattiche spietate incutevano grande timore ai nostri nemici."
 inspirational_leader_general_die_desc: "I suoi discorsi ispiratori saranno ricordati da generazioni di soldati."
 master_of_arms_die_desc: "I suoi fanti l[CHARACTER.Custom('IT_ART_O_A')] piangono come uno dei loro."
 goal_oriented_die_desc: "I suoi arrivi tempestivi salvarono più di una battaglia."
 hardy_warrior_die_desc: "La sua sola presenza sembrava alleviare le peggiori privazioni."
 siege_specialist_die_desc: "La sua cura per le tecniche d'assedio faceva fruttare ogni investimento."
 cannoneer_die_desc: "Il corpo d'Artiglieria piange la sua scomparsa come se [CHARACTER.GetSheHe] fosse uno dei suoi."
 extortioner_die_desc: "La sua scomparsa rallegrerà i mercanti di ogni nazione, tranne la nostra."
 ruthless_blockader_die_desc: "I cittadini dei porti lungo tutta la costa possono tirare un sospiro di sollievo."
 buccaneer_die_desc: "Senza di [CHARACTER.GetHerHim], i nostri nemici si sentiranno di nuovo più al sicuro lungo le rotte di navigazione."
 prize_hunter_die_desc: "Le sue gesta di coraggio ci hanno fruttato molte nuove [ships|e] come prede."
 ironside_die_desc: "La sua fede nelle tattiche difensive ha lasciato un segno indelebile in tutti coloro che sono stati sotto il suo comando."
 naval_engineer_die_desc: "La sua cura per le [ships|e] al suo comando ha accresciuto la robustezza della nostra [navy|e] mentre [CHARACTER.GetSheHe] era in servizio."
 naval_showman_die_desc: "Le sue manovre ardite portarono gloria ed esperienza ai nostri equipaggi."
 ram_raider_die_desc: "Le sue manovre ardite portarono gloria ed esperienza ai nostri equipaggi."
 naval_gunner_die_desc: "Il suo addestramento costante delle nostre squadre di artiglieria di bordo accrebbe la nostra potenza sul mare durante la sua vita."
 accomplished_sailor_die_desc: "La sua grande perizia nell'arte della vela era venerata dai suoi uomini."
 level_headed_die_desc: "Mancherà molto la sua capacità di restare lucido anche di fronte al grave pericolo."
 offensive_planner_die_desc: "È morto facendo ciò per cui era più famoso: escogitare piani per annientare i suoi nemici" 
 aggressive_commander_die_desc: "Guidare un esercito e lanciarsi in prima linea gli è costato la vita. Ne è valsa la pena per tutta la fama ottenuta?" 
 # Artists
 gold_loving_die_desc: "La sua passione per l'oro ha messo sotto pressione la nostra tesoreria, e ai nostri contabili non mancherà."
 humble_die_desc: "La sua umiltà ha reso le sue imprese ancor più celebrate da tutti."
 workaholic_die_desc: "Il suo infaticabile lavoro l[CHARACTER.Custom('IT_ART_O_A')] ha condott[CHARACTER.Custom('IT_ART_O_A')] alla tomba prima del tempo, ma le sue imprese saranno ricordate a lungo."
 lazy_die_desc: "L'odio per il lavoro fu l'unico sforzo che compì mai."
 prominent_die_desc: "La sua fama sarà ricordata in eterno: fece molto per il nostro Paese."
 inconspicious_die_desc: "Il suo operato fu tanto irrilevante che nessuno si accorse quando morì."
 meticulous_die_desc: "Il suo piglio meticoloso si rivelò inutile al di fuori della sua arte."
 careless_die_desc: "La sua noncuranza ha affrettato l'inevitabile."
 adept_die_desc: "Le sua grandi doti saranno ricordate per molti anni."
 amateur_die_desc: "La sua inettitudine farà sì che la sua arte venga presto dimenticata."
 prescient_die_desc: "La sua lungimiranza non poté scongiurare il suo destino."
 idler_die_desc: "La sua proverbiale indolenza non portò che sdegno tra i suoi mecenati."
 # Explorers
 
 curious_adventurer: "Anima Curiosa"
 desc_curious_adventurer: "Quest'anima inquieta non si fermerà finché ogni isola e ogni costa non saranno state mappate per svelare i segreti del nuovo mondo. A differenza di altri, la sua unica ricompensa è la scoperta stessa."
 curious_adventurer_die_desc: "Chissà se la sua curiosità è stata infine placata."
 navigator: "Navigatore"
 desc_navigator: "Anni di esperienza in mare hanno reso questo esploratore un maestro nel governare la propria [ship|e], anche nelle acque più insidiose."
 navigator_die_desc: "Che possa ora navigare in mari più placidi."
 treasure_hunter: "Cacciatore di Tesori"
 desc_treasure_hunter: "L'unica cosa che guida questo esploratore è l'avidità. Non si fermerà davanti a nulla pur di mettere le mani sui tesori più rari del nuovo mondo, anche a costo della vita dei nativi."
 treasure_hunter_die_desc: "Peccato che non abbia potuto portare con sé nessuna delle sue ricchezze."
 cartographer: "Cartografo"
 desc_cartographer: "Questo esploratore è prima di tutto un cultore di mappe, la cui più grande passione è scoprire terre inesplorate. Sebbene le sue spedizioni richiedano più tempo, la documentazione che produce è di un dettaglio senza pari. L'amore per la propria arte, inoltre, è tale da fargli accettare un compenso inferiore."
 cartographer_die_desc: "Ora potrà tracciare le mappe di lidi ancora più remoti."
 scientist_on_sea: "Naturalista d'Oltremare"
 desc_scientist_on_sea: "Per questo esploratore la scienza viene prima di tutto. La mappatura del territorio passa in secondo piano rispetto allo studio della flora e della fauna del nuovo mondo."
 scientist_on_sea_die_desc: "Il suo nome riecheggerà per sempre in quello delle innumerevoli specie di piante e animali che ha scoperto."
 # Children
 child_prodigy: "Bambino Prodigio"
 child_prodigy_die_desc: "La scomparsa di [CHARACTER.GetName] lascia un vuoto profondo e doloroso, come quello di un destino glorioso rimasto incompiuto."
 desc_child_prodigy: "L'avvenire di questo bambino è radioso: il suo nome è già scritto sui libri di storia."
 child_gifted: "Bambino Talentuoso"
 child_gifted_die_desc: "La morte di [CHARACTER.GetName] è una perdita dolorosa, la fine di un futuro promettente stroncato sul nascere."
 desc_child_gifted: "Questo bambino stupisce gli adulti con il suo talento e il suo incredibile potenziale."
 child_slow: "Tardo nell'Apprendimento"
 child_slow_die_desc: "La scomparsa di [CHARACTER.GetName] è accolta con compassione per un bambino la cui vita non è stata delle più semplici."
 desc_child_slow: "Questo bambino non è la mente più brillante della sua generazione e deve sforzarsi più degli altri per tenere il passo."
 child_idiot: "Mentecatto"
 child_idiot_die_desc: "La morte di [CHARACTER.GetName] è accolta con tristezza, ma anche con un velo di sollievo, poiché non avrebbe potuto aspirare al migliore dei futuri."
 desc_child_idiot: "Questo bambino è un perfetto mentecatto, e ben poco si può fare per assicurargli un avvenire dignitoso."
 child_intelligent: "Intelligente"
 child_intelligent_die_desc: "La morte di [CHARACTER.GetName] è pianta da tutti come la perdita di una persona di grande valore."
 desc_child_intelligent: "Questo bambino dimostra di possedere un'intelligenza innata, tutta da coltivare."
 child_gregarious: "Socievole"
 child_gregarious_die_desc: "La scomparsa di [CHARACTER.GetName] sarà sentita da tutti coloro che hanno incrociato il suo cammino nella sua sfortunatamente breve vita."
 desc_child_gregarious: "Adora essere costantemente circondato da altre persone e trae grande gioia dall'interagire con loro."
 child_rowdy: "Turbolento"
 child_rowdy_die_desc: "Finalmente [CHARACTER.GetName] riposa. Fa uno strano effetto vederl[CHARACTER.Custom('IT_ART_O_A')] così in silenzio."
 desc_child_rowdy: "Questo bambino è tutt'altro che calmo e tranquillo. Fa sempre notare la sua presenza, e non nel più pacifico dei modi."
 child_ambitious: "Ambizioso"
 child_ambitious_die_desc: "I suoi sogni ambiziosi, sfortunatamente, rimarranno insoddisfatti."
 desc_child_ambitious: "Questo bambino sa ciò che vuole, e non è esattamente qualcosa di insignificante. Se potesse, si prenderebbe il mondo intero."
 child_gallant: "Cavaliere Nato"
 child_gallant_die_desc: "Tutti piangono la scomparsa di [CHARACTER.GetName]. Sembra quasi che fosse troppo perfetto per rimanere a lungo in questo mondo. Non vedremo mai più nessuno come [CHARACTER.GetHimHer]."
 desc_child_gallant: "Nonostante l'età, questo bambino è l'epitome della cavalleria. Coraggioso, elegante, educato e premuroso, un giorno ispirerà certamente poemi e leggende."
 child_shrewd: "Astuto"
 child_shrewd_die_desc: "Neanche i suoi intrighi e le sue strategie hanno potuto salvare [CHARACTER.GetName] dalla Morte. [CHARACTER.GetHeShe|U] ha finalmente trovato un avversario capace di batterl[CHARACTER.Custom('IT_ART_O_A')] in astuzia."
 desc_child_shrewd: "Ovunque si trovi e qualunque cosa stia facendo, la sua mente è sempre affilata come una lama. Nessuno può tenergli testa in una gara d'ingegno."
 #
 unsuited_for_army_command: "Inetto al Comando"
 unsuited_for_army_command_die_desc: "Le strategie sconsiderate di [CHARACTER.GetName], per fortuna, non sono più un nostro problema. In molti esultano per la sua dipartita, e gli uomini ai suoi ordini non dovranno più patire le sue folli decisioni."
 desc_unsuited_for_army_command: "Una scarsa comprensione della strategia e della tattica militare trasforma ogni sua impresa in un disastro annunciato. I suoi ufficiali possono solo sperare che questo generale se ne stia fermo come uno spaventapasseri gallonato, senza impartire i suoi ordini insensati."
 unsuited_for_naval_command: "Negato per il Comando Navale"
 unsuited_for_naval_command_die_desc: "La cronica incapacità di [CHARACTER.GetName] di trattenere il cibo una volta in mare aperto si è sempre rivelata disastrosa. I marinai di tutto il paese tirano un sospiro di sollievo, perché non dovrà più insozzare i loro ponti."
 desc_unsuited_for_naval_command: "Per guidare una flotta servono nervi saldi e un ottimo senso dell'orientamento. Chi non sopporta il rollio delle onde è inutile al comando quanto un'ancora: un peso morto sulla coperta."
 unsuited_for_country_ruling: "Inadatto a Governare"
 unsuited_for_country_ruling_die_desc: "Finalmente [CHARACTER.GetName] è passato a miglior vita, e le sue scellerate politiche sono solo un lontano ricordo."
 desc_unsuited_for_country_ruling: "Governare una nazione non è un compito per tutti. E sebbene la storia abbia visto la sua parte di sovrani incompetenti, questa persona è semplicemente incapace, o priva della volontà, di guidare un qualsiasi stato che si rispetti."
 #RELIGIOUS_FIGURES
 efficient_administrator: "Amministratore Efficiente"
 desc_efficient_administrator: "Le Scritture non offrono solo conforto spirituale, ma anche precetti per governare la vita terrena. Questo individuo eccelle in tale sapienza, al punto da influenzare il comportamento altrui e dirigere le procedure burocratiche con la massima efficienza."
 efficient_administrator_die_desc: "[CHARACTER.GetName] ha lasciato questo mondo e, senza di [CHARACTER.GetHerHim], gli ingranaggi dello stato girano più lenti. Editti e scartoffie non fluiranno più così speditamente senza la sua guida illuminata."
 
 proselytizer: "Proselitista"
 desc_proselytizer: "Molti sono i credi nel mondo, ma una sola è la vera Fede. Il fervore nel ricondurre le anime perdute sul retto sentiero non solo rafforza la comunità, ma garantisce che tutti procedano sulla via della salvezza."
 proselytizer_die_desc: "[CHARACTER.GetName] si è spento, e le innumerevoli anime che [CHARACTER.GetSheHe] ha salvato mostrandogli la vera Fede piangono la sua dipartita. La sua figura di faro nella Fede mancherà a tutti, e altre anime si smarriranno senza la sua guida."
 
 reverend_teacher: "Maestro Venerabile"
 desc_reverend_teacher: "Pochi sono i pozzi di sapienza a cui l'umanità può attingere, ma sono sempre ricercati per i loro insegnamenti. Formando schiere di discepoli devoti, questi grandi maestri sono tenuti in sommo rispetto e riverenza."
 reverend_teacher_die_desc: "Nemmeno l'immensa sapienza di [CHARACTER.GetName] ha potuto salvarl[CHARACTER.Custom('IT_ART_O_A')] dalla morte. Mentre esalava il suo ultimo respiro, i suoi numerosi discepoli ne hanno pianto la scomparsa. Oggi il mondo è un po' meno saggio."
 
 ascetic: "Asceta"
 desc_ascetic: "La vita religiosa consiste nel dedicarsi alla Fede, non nell'indulgere nei piaceri mondani. Questo individuo ha fatto suoi tali precetti e rifiuta ogni diletto, preferendo vivere con il minimo sostentamento materiale."
 ascetic_die_desc: "La morte di [CHARACTER.GetName] è giunta improvvisa, ma non inaspettata. La sua astinenza da ogni bene materiale, cibo compreso, deve aver avuto le sue conseguenze. Eppure, molti dei suoi seguaci ne ammiravano le pratiche, e la sua assenza peserà come un macigno."
 
 mystic_seer: "Veggente Mistico"
 desc_mystic_seer: "Districare i fili del destino e squarciare il velo del futuro non è certo un'impresa da poco. Molti di coloro che ci provano, se mai riescono a vedere qualcosa, finiscono consumati dalla follia. Per chi invece domina la chiaroveggenza, l'avvenire non ha segreti."
 mystic_seer_die_desc: "Neppure la sua celebre preveggenza ha potuto salvare [CHARACTER.GetName] dalla morte. Non è chiaro se nelle sue visioni avesse scorto la sua fine ma, se anche fosse, non ha potuto sottrarvisi."
 
 literalist: "Custode della Parola"
 desc_literalist: "I testi sacri e le antiche scritture sono il fondamento della religione. Questo individuo, tuttavia, spinge tale concetto all'estremo, considerandoli l'unica base possibile. Non solo, ma anche i testi stessi sono visti come immutabili e infallibili, dove persino l'ordine delle parole ha uno scopo preciso."
 literalist_die_desc: "[CHARACTER.GetName] è morto e con [CHARACTER.GetHerHim] se ne va la sua stretta aderenza alle Scritture. Molti dei suoi passi preferiti sono stati recitati al suo funerale dai suoi seguaci, affinché le vere parole della Fede possano accompagnarl[CHARACTER.Custom('IT_ART_O_A')] anche nell'aldilà."
 
 unorthodox: "Eterodosso"
 desc_unorthodox: "Benché possano esistere diverse interpretazioni della nostra Fede, alcune posizioni sono più accettate di altre. Questo individuo ne sposa di meno comuni, guadagnandosi nel migliore dei casi il biasimo della comunità religiosa, nel peggiore l'emarginazione. Ciononostante, molti condividono le sue idee, o ne sono abbastanza incuriositi da prestargli ascolto."
 unorthodox_die_desc: "[CHARACTER.GetName] è trapassato, e i più tradizionalisti tra i nostri fedeli tirano un sospiro di sollievo, vedendo la fine della sua 'eccentricità'. Tuttavia, molti altri ne piangono la perdita, lamentando di dover dire addio alla sua ampiezza di vedute."
 
 hermit: "Eremita"
 desc_hermit: "È chiaro che la costante interazione sociale non sia per tutti, specialmente per chi desidera dedicare la propria vita alla religione. Questo individuo è tra quelli che preferiscono l'isolamento e la reclusione alla folla, per poter meglio comunicare con il divino e disinteressarsi delle faccende altrui."
 hermit_die_desc: "Ci sono voluti un paio di giorni per accorgersi della morte di [CHARACTER.GetName], a causa del suo isolamento. Persino i suoi seguaci vivono senza troppi contatti tra loro o con [CHARACTER.GetHerHim]. Ora che [CHARACTER.GetSheHe|U] non c'è più, ogni legame è reciso."
 
 alms_giver: "Grande Elemosiniere"
 desc_alms_giver: "Beati coloro che condividono i propri averi con i meno fortunati. Questo individuo considera tale insegnamento il più importante di tutti, donando elemosine ai poveri e spartendo con loro cibo e monete. Un gruppo di discepoli ne emula l'esempio, sovvenendo così ai bisogni degli umili."
 alms_giver_die_desc: "La morte di [CHARACTER.GetName] ha suscitato grande cordoglio, specialmente tra i più diseredati. Erano loro a beneficiare maggiormente delle sue costanti elemosine, e saranno loro a sentirne di più la mancanza."
 
 stargazer: "Contemplatore delle Stelle"
 desc_stargazer: "Le stelle affascinano l'umanità fin dalle sue origini, e molti vi cercano una presenza divina. Questo individuo è tra costoro, con lo sguardo sempre rivolto al cielo in cerca di conoscenza e risposte. E molto si può apprendere dagli astri, se si ha la volontà di osservare."
 stargazer_die_desc: "La stella che era la vita di [CHARACTER.GetName] si è spenta, e molti si lamentano di quanto oscuro sia diventato il mondo senza di essa. La conoscenza del firmamento non sarà più tramandata dalla sua voce, e molti sguardi un tempo rivolti al cielo, ora si chineranno a terra." 
 
 
 administrator: "Amministratore" 
 administrator_die_desc: "Il compito svolto da [CHARACTER.GetName] è giunto al termine, e con esso la nostra amministrazione ha perso uno dei suoi maggiori collaboratori. Senza le azioni e la supervisione meticolose e ben calcolate di [CHARACTER.GetHerHis], gli ingranaggi del nostro governo gireranno ora più lentamente." 
 desc_administrator: "Pianificazione, logistica, organizzazione... Sono tutte qualità possedute da questo individuo, che permettono il buon funzionamento del nostro governo e del nostro Paese nel suo complesso. Ogni esigenza e ogni azione della nostra amministrazione viene tenuta in conto, riducendo il peso burocratico." 
 tax_optimizer: "Ottimizzatore Fiscale" 
 tax_optimizer_die_desc: "Per quanta ricchezza [CHARACTER.GetSheHe] abbia sequestrato o accumulato, ciò non ha salvato [CHARACTER.GetName] dalla morte. Nel luogo in cui [CHARACTER.GetSheHe] va ora, nessuna delle tasse che [CHARACTER.GetSheHe] ha contribuito a riscuotere sarà di qualche utilità per [CHARACTER.GetHerHim]." 
 desc_tax_optimizer: "Questo individuo vive tra mucchi di monete e abachi, sempre intento a contare e annotare un resoconto preciso di tutte le tasse e le entrate. Grazie a calcoli accurati, confronti e bilanci, queste azioni permettono di portare le tasse al livello più alto possibile rispetto a ciò che la terra stessa offre." 
 green_thumb: "Pollice Verde" 
 green_thumb_die_desc: "[CHARACTER.GetName] aveva radici salde tra noi, e il nostro Paese ha visto [CHARACTER.GetHerHim] crescere e fiorire. Ora [CHARACTER.GetSheHe] ci è stato strappato, e le foglie che cadono al vento sono la terra stessa che piange la scomparsa di [CHARACTER.GetHerHis]." 
 desc_green_thumb: "Questo individuo è affascinato da tutto ciò che vive e cresce, ed è costantemente immerso in attività orticole. Dal tenere una fioriera accanto alla scrivania, al lavorare in un giardino personale, fino a supervisionare intere attività agricole per puro svago, sembra che nemmeno un singolo filo d'erba del Paese sfugga a tanta premurosa attenzione." 
 fiscal_hawk: "Falco Fiscale" 
 fiscal_hawk_die_desc: "Nessuna manovra astuta è riuscita a salvare [CHARACTER.GetName] dalla morte, dimostrando che le nostre vite sono solo in prestito: un prestito che prima o poi deve essere ripagato." 
 desc_fiscal_hawk: "Il denaro genera denaro, e questo individuo lo sa molto bene. Attraverso tattiche e negoziati astuti, la nostra ricchezza diventa maggiore di quanto altrimenti sembrerebbe, e ciò a sua volta ci porterà altra ricchezza." 
 patron_of_arts_die_desc: "[CHARACTER.GetName] è morto, e con [CHARACTER.GetHerHim] si spegne un faro di cultura. Le numerose opere d'arte che [CHARACTER.GetSheHe] ha raccolto in vita serviranno ora da testimonianza e ricordo dopo [CHARACTER.GetHerHis] morte." 
 desc_patron_of_arts: "Questo individuo è un appassionato delle arti in tutte le loro forme. Dalla pittura alla scultura, dall'architettura alla poesia, nessuna forma d'arte è indegna di ammirazione e promozione." 
 army_reformer: "Riformatore dell'Esercito" 
 army_reformer_die_desc: "La morte di [CHARACTER.GetName] ha sconvolto il nostro esercito, poiché [CHARACTER.GetName] è stato determinante per molti dei suoi cambiamenti. I soldati onoreranno la memoria di [CHARACTER.GetHerHis], ma la mancanza delle politiche e della guida di [CHARACTER.GetHerHis] si farà sentire molto." 
 desc_army_reformer: "Un esercito che non cambia né si adatta è un esercito destinato ad arrugginire finché non cade a pezzi. Questo individuo lo sa molto bene ed è un grande sostenitore del mantenere l'esercito costantemente aggiornato e adattato alle nuove forme di guerra." 
 charismatic_orator: "Oratore Carismatico" 
 charismatic_orator_die_desc: "Nessuna parola melliflua o discorso preparato è riuscito a persuadere la Morte a risparmiare [CHARACTER.GetName]. [CHARACTER.GetSheHe|U] ci è stato portato via, e le sale e le strade di tutto il nostro Paese sembrano più silenziose per la perdita di [CHARACTER.GetHerHis]." 
 desc_charismatic_orator: "Non tutti hanno l'abilità di parlare adeguatamente in pubblico, e ancora meno sono coloro che sanno catturare l'attenzione dell'ascoltatore come questo individuo, capace non solo di cambiare le opinioni altrui, ma anche di convincerli che fossero sempre state le loro." 
 honest: "Onesto" 
 honest_die_desc: "[CHARACTER.GetName] è morto, e con [CHARACTER.GetHerHim] se ne va una delle parti migliori del nostro Paese. L'onestà e la franchezza di [CHARACTER.GetHerHis] mancheranno certamente." 
 desc_honest: "Questo individuo non ha un briciolo di malizia nell'anima, e ci si può sempre fidare di lui e prenderlo in parola. Ciò permette a un'amministrazione sotto tale guida di lavorare in armonia, senza che le persone debbano preoccuparsi costantemente di secondi fini, tradimenti o sotterfugi." 
 stubborn: "Testardo" 
 stubborn_die_desc: "Alcuni avrebbero detto che [CHARACTER.GetName] fosse troppo testardo per morire, ma nemmeno la cocciutaggine di [CHARACTER.GetHerHis] ha potuto salvare [CHARACTER.GetHerHim] dal più grande cambiamento di tutti." 
 desc_stubborn: "Per questo individuo nessun cambiamento è tanto piccolo da passare inosservato: tutti saranno accolti con riluttanza. Ancorato alle consuetudini, non ammetterà facilmente che opinioni o comportamenti siano errati o migliorabili, e nulla cambierà senza difficoltà." 
 architect: "Architetto" 
 architect_die_desc: "L'ultima pietra è stata posata sulla vita di [CHARACTER.GetName]. Pilastro del nostro Paese, lo ha sostenuto con il lavoro di [CHARACTER.GetHerHis]; possa ciò che [CHARACTER.GetSheHe] ha eretto rimanere come testimonianza delle azioni di [CHARACTER.GetHerHis]." 
 desc_architect: "Dalla capanna più piccola alle sale più alte, nessun edificio è troppo insignificante per suscitare la curiosità architettonica di questo individuo. Così come un architetto progetta e supervisiona la costruzione di un edificio, questo personaggio progetta e supervisiona la costruzione del nostro Paese." 
 theologian: "Teologo" 
 theologian_die_desc: "[CHARACTER.GetName] è morto. Speriamo che tutti gli studi di [CHARACTER.GetHerHis] abbiano preparato [CHARACTER.GetHerHim] a qualunque cosa [CHARACTER.GetSheHe] incontrerà ora." 
 desc_theologian: "Le discussioni sulla fede, sulla divinità e sull'Aldilà sono all'ordine del giorno intorno a questo individuo, poiché non c'è nessuno più devoto; né vi è studioso più zelante della fede e dei suoi misteri." 
 bureaucrat: "Burocrate" 
 bureaucrat_die_desc: "[CHARACTER.GetName] è morto. Alcuni dei rivali di [CHARACTER.GetHerHis] ora si prendono gioco di [CHARACTER.GetHerHim] chiedendo se [CHARACTER.GetSheHe] avesse già compilato i moduli corretti per morire, mentre altri sospirano di sollievo perché non dovranno più compilare altri moduli." 
 desc_bureaucrat: "Per la stragrande maggioranza delle persone, la burocrazia è oscura, criptica e incomprensibile. Per altri, come questo individuo, è naturale come respirare, e riescono a districarne i misteri con facilità." 
 oracle: "Oracolo" 
 oracle_die_desc: "La morte di [CHARACTER.GetName] rattrista il nostro Paese, che ora si ritrova privato del legame che lo univa direttamente al Divino." 
 desc_oracle: "I misteri del Divino sono indecifrabili, tranne che per coloro che ne sono benedetti. Questo è uno di tali individui, capace di comunicare direttamente con il Divino e di trasferire volontà e suppliche tra questo mondo e quello divino." 
 deceitful: "Ingannevole" 
 deceitful_die_desc: "[CHARACTER.GetName] è morto, anche se alcuni non ci credono ancora del tutto, tanto sono abituati alle continue menzogne e macchinazioni di [CHARACTER.GetHerHis]. Molti quasi si aspettano che la morte di [CHARACTER.GetHerHis] sia un'altra di queste invenzioni." 
 desc_deceitful: "Quasi nulla di ciò che dice questo individuo può essere considerato affidabile, e chi gli sta intorno dubita sempre delle sue intenzioni e si guarda le spalle. Sfiducia e paranoia lo seguono ovunque vada." 
 fickle: "Volubile" 
 fickle_die_desc: "Sembra che [CHARACTER.GetName] abbia finalmente compiuto un'azione ferma e immutabile: la morte di [CHARACTER.GetHerHis]. Molti pregano ancora che [CHARACTER.GetSheHe] non cambi ora la decisione di [CHARACTER.GetHerHis] e ritorni in vita." 
 desc_fickle: "Questo individuo non riesce a formarsi un'opinione, oppure ne forma continuamente troppe e passa dall'una all'altra. In ogni caso, da qualcuno del genere non ci si può aspettare né fermezza né lealtà a una causa." 
 schemer: "Cospiratore" 
 schemer_die_desc: "[CHARACTER.GetName] è morto, e alcuni dicono che potrebbe trattarsi di una conseguenza inattesa di uno dei continui intrighi di [CHARACTER.GetHerHis]." 
 desc_schemer: "È difficile sapere cosa stia pensando questo individuo in un dato momento, poiché intrighi, complotti e sotterfugi sono sempre in corso. La gente deve dormire con un occhio aperto e guardarsi sempre le spalle." 
 corrupt: "Corrotto" 
 corrupt_die_desc: "La morte di [CHARACTER.GetName] ha finalmente liberato la nostra nazione e le sue ricchezze dalle mani avide e dalla cupidigia sfrenata di [CHARACTER.GetHerHis]." 
 desc_corrupt: "Ogni volta che una somma di denaro passa tra le mani di questo individuo, misteriosamente si riduce. Forse alcuni di questi costi di gestione dovrebbero essere esaminati..." 
 influential: "Influente" 
 influential_die_desc: "Nessuna quantità di potere o ascendente può salvare dalla morte, e [CHARACTER.GetName] non ha potuto salvare [CHARACTER.GetHerselfHimself]. Ora il Paese è libero dagli artigli e dall'influenza di [CHARACTER.GetHerHis]." 
 desc_influential: "Le persone non nascono uguali, e alcune hanno più potere e influenza di altre. Questo individuo possiede un simile potere: le sue parole hanno la forza delle leggi, e i suoi obiettivi finiscono per diventare gli obiettivi del Paese." 
 unmotivated: "Demotivato" 
 unmotivated_die_desc: "Fortunatamente morire è qualcosa che non richiede alcun tipo di partecipazione attiva, altrimenti [CHARACTER.GetName] non avrebbe mai trovato la motivazione per farlo." 
 desc_unmotivated: "Tutti hanno giorni in cui è difficile portare a termine il lavoro, ma questo individuo porta la cosa all'estremo. Con una costante mancanza di qualsiasi motivazione o slancio, ogni lavoro richiede molto più tempo per essere completato, se mai viene completato davvero." 
 abrasive: "Abrasivo" 
 abrasive_die_desc: "[CHARACTER.GetName] è morto, e la gente respira libera sapendo che non dovrà mai più avere a che fare con una persona simile e subire le parole offensive di [CHARACTER.GetHerHis]." 
 desc_abrasive: "Parlare con questo individuo sembra come essere costantemente schiaffeggiati in volto o pugnalati al cuore. Commenti offensivi, parole mordaci e altri simili attacchi verbali costituiscono quasi l'intera sostanza di una conversazione del genere." 
 arrogant_die_desc: "Le arie e la superbia di [CHARACTER.GetName] sono terminate con [CHARACTER.GetHerHis] morte. Ora [CHARACTER.GetSheHe] è allo stesso livello degli altri, che [CHARACTER.GetSheHe] lo voglia o no." 
 desc_arrogant: "Questo individuo si sente superiore a tutti, come se vivesse in uno strato diverso per benedizione divina. Una personalità simile è difficile da soddisfare, poiché qualunque cosa facciamo non è mai abbastanza." 
