 # Diplomatic status panel keys
 diplomatic_status_giving_inheritance_contract_name: "Contratto di Successione Concesso"
 diplomatic_status_giving_inheritance_contract_tooltip: "#T Contratto di Successione Concesso#!\nQuesto paese ha concesso diritti di successione tramite un [inheritance_contract|e] ai seguenti [countries|e]."
 diplomatic_status_receiving_inheritance_contract_name: "Contratto di Successione"
 diplomatic_status_receiving_inheritance_contract_tooltip: "#T Contratto di Successione#!\nQuesto paese detiene un [inheritance_contract|e] con i seguenti [countries|e], assicurandosi il diritto di ereditarli nel caso in cui il loro sovrano muoia senza eredi."

 # AI wants_to_give reason descs
 inheritance_contract_same_culture_group: "Un'eredità culturale condivisa rafforza la fiducia in questo accordo."
 inheritance_contract_hre_members: "Entrambe le parti sono membri del [holy_roman_empire|e], dove gli [inheritance_contracts|e] sono una tradizione legale consolidata."

 # Event strings
 inheritance_contract.1.title: "Contratto di Successione Assicurato"
 inheritance_contract.1.desc: "Abbiamo pagato [SCOPE.sCountry('contract_partner').GetName] per il diritto di ereditare il suo regno nel caso in cui [SCOPE.sCountry('contract_partner').GetGovernment.GetRuler.GetName] muoia senza eredi. Si tratta di un investimento significativo, ma i potenziali guadagni sono considerevoli."
 inheritance_contract.1.a: "Un investimento degno."

 inheritance_contract.3.title: "Contratto di Successione Invocato"
 inheritance_contract.3.desc: "Il sovrano di [SCOPE.sCountry('dead_ruler_country').GetName] è morto senza lasciare eredi. Il nostro [inheritance_contract|e] è entrato in vigore, e il suo regno cade ora sotto la nostra corona."
 inheritance_contract.3.a: "La nostra pazienza è stata ricompensata."

 inheritance_contract.4.title: "Contratto di Successione Decaduto"
 inheritance_contract.4.desc: "Il nostro sovrano è morto, e con lui è decaduto il [inheritance_contract|e] che avevamo con [SCOPE.sCountry('dead_paying_country').GetName]. L'investimento che abbiamo fatto per assicurarci quel diritto di successione è ora perso."
 inheritance_contract.4.a: "Una disgrazia costosa."
