 offer_inheritance_contract_desc_to_unknown: "Concedi a un [country|e] il diritto di ereditare il nostro regno nel caso in cui il nostro sovrano muoia senza eredi."
 offer_inheritance_contract_happened_title: "Contratto di Successione Offerto"
 offer_inheritance_contract_happened_desc: "[COUNTRY.GetName] ha offerto un [inheritance_contract|e] a [TARGET_COUNTRY.GetName], concedendo il diritto di ereditare il proprio regno nel caso in cui il suo sovrano muoia senza eredi."
