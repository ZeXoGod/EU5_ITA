l_english:

 contact_patriarch_of_constantinople: "Contatta il Patriarca di Costantinopoli"
 contact_patriarch_of_constantinople_desc: "Invia Melanchthon a Costantinopoli con la nostra Confessione di Fede, aprendo un canale di dialogo con il Patriarcato [ShowReligionAdjective('orthodox')]."

 reformation.17.title: "La Lettera di [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] a Costantinopoli"
 reformation.17.desc: "[melanchthon.GetName], il principale teologo del nostro regno, ha proposto una linea audace: inviare un emissario al Patriarca di Costantinopoli con la nostra Confessione di Fede. Sebbene le fedi [ShowReligionAdjective('orthodox')] e [ShowReligionAdjective('lutheran')] restino divise su molte questioni, condividono un comune rifiuto della supremazia papale. Forse il Patriarca accoglierebbe un'apertura da parte di altri avversari di Roma."
 reformation.17.a: "Inviamo [GetCharacter('reformer_philip_melanchton').GetLastNameWithNoTooltip] con la nostra Confessione di Fede."
 reformation.17.b: "Questo non è il momento per simili aperture."
 reformation.17.historical_info: "Philipp Melanchthon (1497-1560), il più stretto collaboratore di Lutero e autore della Confessione di Augusta (1530), nutriva un profondo interesse per la Chiesa Orientale come potenziale alleata contro Roma. La sua corrispondenza con studiosi greci pose le basi per successive aperture luterane verso Costantinopoli. Nel 1573, teologi di Tübingen inviarono una traduzione greca della Confessione di Augusta al Patriarca Jeremias II, dando inizio a uno degli scambi teologici più duraturi tra Luteranesimo e Ortodossia nell'epoca della Riforma."

 reformation.18.title: "Una Lettera dai Riformatori Luterani"
 reformation.18.desc: "Una delegazione da [lutheran_country.GetLongName] è arrivata a Costantinopoli recando un trattato teologico, la Confessione della loro fede. I riformatori [ShowReligionAdjective('lutheran')] sembrano cercare dialogo con il nostro Patriarcato, citando la nostra comune opposizione al Vescovo di Roma. Resta da vedere se le loro intenzioni siano sincere o interessate."
 reformation.18.a: "Coinvolgiamo questi riformatori in un cauto dialogo teologico."
 reformation.18.b: "Sono eretici. Mandiamoli via."
 reformation.18.historical_info: "Il Patriarcato Ecumenico di Costantinopoli continuò a esercitare autorità spirituale sui Cristiani Ortodossi anche dopo la conquista ottomana del 1453. Il Patriarca Jeremias II (r. 1572-1595) era noto per la sua dottrina teologica e si confrontò seriamente con le lettere dei teologi di Tübingen, producendo tre risposte dettagliate tra il 1576 e il 1581. Respinse la dottrina luterana sulla giustificazione, il libero arbitrio e il filioque, pur riconoscendo la sincerità dell'interrogazione, una posizione che distinse le sue risposte da un semplice rigetto."

 reformation.19.title: "Il Patriarca Risponde con Interesse"
 reformation.19.desc: "Il Patriarca ha risposto con misurata curiosità alla visita del nostro emissario. Sebbene non sia stato raggiunto alcun accordo dottrinale, lo scambio ha aperto un canale tra Costantinopoli e la nostra Chiesa di Stato, un passo piccolo ma significativo verso la comprensione tra la cristianità [ShowReligionAdjective('lutheran')] e quella [ShowReligionAdjective('orthodox')]."
 reformation.19.a: "Un ponte, per quanto stretto, è meglio di nessun ponte."
 reformation.19.historical_info: "La corrispondenza di Tübingen è considerata una pietra miliare del primo dialogo ecumenico. Le tre risposte del Patriarca Jeremias II (1576, 1579, 1581) si confrontarono seriamente con la teologia luterana pur respingendone le tesi centrali. Egli affrontò i punti su sola fide, libero arbitrio e filioque con dettagliate argomentazioni patristiche, un livello di coinvolgimento che dimostrò la vitalità intellettuale del Patriarcato sotto il dominio ottomano. Entrambe le parti conservarono con cura la corrispondenza."

 reformation.20.title: "Il Patriarca Congeda la Delegazione"
 reformation.20.desc: "La nostra delegazione è stata ricevuta freddamente a Costantinopoli. Il Patriarca ha respinto la nostra Confessione come un'altra forma di eresia, e il nostro emissario è stato rimandato indietro senza cerimonie. È un promemoria del fatto che [ShowReligionName('lutheran')] resta separato, da Roma come da Costantinopoli."
 reformation.20.a: "La nostra fede non ha bisogno dell'approvazione di alcun patriarcato."
 reformation.20.historical_info: "La corrispondenza di Tübingen alla fine non riuscì a produrre un accordo dottrinale: le tre risposte del Patriarca Jeremias II (1576, 1579, 1581) respinsero le posizioni luterane su sola fide, sola scriptura e filioque, insistendo sul fatto che l'Ortodossia non poteva accettare ciò che considerava innovazioni. I Luterani alla fine conclusero che ulteriore corrispondenza sarebbe stata infruttuosa e posero fine allo scambio nel 1581."

 reformation.21.title: "Arriva uno Studioso Ortodosso"
 reformation.21.desc: "La notizia della nostra corrispondenza con Costantinopoli ha dato frutti inattesi. Uno studioso [ShowReligionAdjective('orthodox')], [orthodox_scholar.GetName], è arrivato alla nostra corte cercando di proseguire lo scambio teologico avviato dal nostro emissario. La visita è delicata; un'accoglienza troppo calorosa potrebbe irritare il nostro stesso clero, mentre un rifiuto potrebbe annullare la benevolenza guadagnata a Costantinopoli."
 reformation.21.a: "Organizziamo uno scambio accademico prolungato."
 reformation.21.b: "Ringraziamoli cortesemente, ma rifiutiamo ulteriori scambi."
 reformation.21.historical_info: "Nonostante il fallimento della corrispondenza di Tübingen nel raggiungere l'unione dottrinale, essa generò un notevole interesse accademico da entrambe le parti. Gli intellettuali Greco-Ortodossi conobbero meglio la teologia luterana, mentre gli studiosi luterani acquisirono una conoscenza più profonda dei Padri della Chiesa e della tradizione cristiana orientale. Questo scambio interconfessionale contribuì a un più ampio umanesimo europeo che si avvicinava all'antico Cristianesimo greco come a una risorsa indipendente da Roma."
