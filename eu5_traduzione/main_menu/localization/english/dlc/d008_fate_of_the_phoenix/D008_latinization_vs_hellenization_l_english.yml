l_english:

 latinization_vs_hellenization.1.title: "Echi della Sapienza [ShowCultureGroupNameWithNoTooltip('greek_group')]"
 latinization_vs_hellenization.1.desc: "Nei monasteri e nelle aule di [target_location.GetName], raccolte di scritti teologici e opere dei Padri della Chiesa circolano tra fedeli e dotti allo stesso modo. Sermoni e commentari attingono ai profondi pozzi del sapere ortodosso, e copie di questi testi iniziano a finire nelle mani di notabili non greci, aumentando il disagio di coloro a corte che vedono il futuro in legami più stretti con l'Occidente latino."
 latinization_vs_hellenization.1.a: "Lasciamo che le loro intuizioni arricchiscano la nostra terra."
 latinization_vs_hellenization.1.b: "Poniamo fine a questa fascinazione per vecchi rotoli."
 target_character_disappears_tt: "[target_character.GetName] scomparirà"

 latinization_vs_hellenization.2.title: "Favore Crescente per [ShowLanguageNameWithNoTooltip('latin_language')]"
 latinization_vs_hellenization.2.desc: "Nei salotti e nelle tenute di [ROOT.GetCountry.GetName], una corrente sottile ma crescente favorisce usanze, legge e cerimonie [ShowLanguageName('latin_language')]. Giovani nobili infiorano il proprio parlare con frasi straniere, corrispondono con corti [ShowLanguageNameWithNoTooltip('latin_language')] e chiedono riforme che avvicinerebbero il nostro [ROOT.GetCountry.GetFlavorRank] alle mode dell'Occidente, mentre altri si inquietano vedendo quanto in fretta svaniscano le vecchie certezze."
 latinization_vs_hellenization.2.a: "Non ne verrà alcun male."
 latinization_vs_hellenization.2.b: "Invertiamo la rotta, ora!"
 stability_scales_with_current_latinization_hellenization: "Il cambiamento di [stability|e] dipenderà dal nostro valore attuale di [ShowSocietyDirectionName('latinization')] o [ShowSocietyDirectionName('hellenization')]"
 while_this_modifier_active_reduced_latinization_gain_from_events_tt: "Mentre questo [country_modifier|e] è attivo, gli [events|e] successivi che rafforzano [ShowSocietyDirectionName('latinization')] sono significativamente indeboliti, riducendo i loro bonus"
 bonus_weakened_because_of_suppressing_latinization_modifier: "I benefici di questa scelta sono ridotti a causa di [ShowModifier('suppressing_latinization_modifier')]"

 latinization_vs_hellenization.3.title: "[ShowSocietyDirectionNameWithNoTooltip('latinization')] Fiorisce"
 latinization_vs_hellenization.3.desc: "Mercanti, giuristi e studiosi riferiscono che la recente svolta verso forme [ShowLanguageName('latin_language')] inizia a dare frutti. I contratti sono redatti con maggiore chiarezza, i partner stranieri trovano familiari le nostre pratiche e l'energia della riforma sembra accelerare la vita di [ROOT.GetCountry.GetName], sebbene alcuni sussurrino che questi guadagni poggino su fondamenta che potrebbero ancora tremare."
 latinization_vs_hellenization.3.a: "Raccogliamo i benefici delle nostre buone politiche."
 latinization_vs_hellenization.3.b: "Correggiamo gli errori del passato!"

 latinization_vs_hellenization.4.title: "Gloria al [target_unit.GetNameWithNoTooltip]"
 latinization_vs_hellenization.4.desc: "Alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] sono giunti rapporti sulla disciplina e sul coraggio esemplari mostrati dal [target_unit.GetName] nelle campagne recenti. I loro ranghi tengono saldo sia in marcia sia in addestramento, e racconti della loro condotta hanno iniziato a circolare tra i soldati comuni e i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')], che guardano a loro come modello per le legioni di [ROOT.GetCountry.GetName]."
 latinization_vs_hellenization.4.a: "Teniamo caro il loro servizio."
 target_character_will_receive_a_nickname_tt: "[target_character.GetName] sarà onorato con un soprannome adatto a segnare il servizio esemplare di [target_character.GetHerHis]"


 latinization_vs_hellenization.5.title: "Scontro sul Curriculum a [target_location.GetNameWithNoTooltip]"
 latinization_vs_hellenization.5.desc: "Alla [ShowBuildingTypeName('university')] di [target_location.GetName], gli studiosi litigano sulla lingua più adatta all'alta cultura. Alcuni insistono che solo [ShowLanguageName('latin_language')] possa collocare il nostro [ROOT.GetCountry.GetFlavorRank] tra le grandi potenze, mentre altri insistono che la cultura nella tradizione di Constantinople e della Chiesa debba essere preservata."
 latinization_vs_hellenization.5.a: "Che l'università insegni in [ShowLanguageNameWithNoTooltip('latin_language')]."
 latinization_vs_hellenization.5.b: "Non consegniamo la tradizione della nostra Chiesa e del nostro Impero."
 pops_in_target_province_mild_bonus_satisfaction: "I nostri [pops|e] in [target_province.GetName] otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"
 pops_in_target_province_mild_penalty_satisfaction: "I nostri [pops|e] in [target_province.GetName] subiranno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 latinization_vs_hellenization.6.title: "Un Monito dai [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')]"
 latinization_vs_hellenization.6.desc: "Un membro stimato dei [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')], [target_character.GetName], si è presentato davanti alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] con gravi preoccupazioni. [target_character.GetSheHe|U] avverte che le mode [ShowLanguageName('latin_language')] in dottrina e costume stanno erodendo le fondamenta della nostra fede e un giorno metteranno in pericolo sia l'altare sia il trono."
 latinization_vs_hellenization.6.a: "Saremmo saggi ad ascoltare il consiglio di [target_character.GetHerHis]."
 latinization_vs_hellenization.6.b: "Non lasciamo che anime timorose governino le nostre politiche."

 latinization_vs_hellenization.7.title: "[ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] Assaggiano Costumi Stranieri"
 latinization_vs_hellenization.7.desc: "Dalle sale di [target_location.GetName] alle tenute lontane, i nostri [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] imitano con entusiasmo i modi, le mode e la lingua di [target_culture.GetName]. Alcuni lo celebrano come raffinatezza, mentre altri sussurrano che la nostra aristocrazia stia dimenticando cosa significhi essere [ROOT.GetCountry.GetAdjective]."
 latinization_vs_hellenization.7.a: "Prendano ciò che è utile dai modi della cultura [target_culture.GetNameWithNoTooltip]."
 latinization_vs_hellenization.7.b: "Poniamo fine a questa infatuazione straniera."
 destabilize_our_realm: "La nostra posizione difensiva verso queste tendenze destabilizza il nostro [ROOT.GetCountry.GetFlavorRank]"
 perceived_as_weakness: "Vietare l'assaggio di costumi stranieri è visto come debolezza"

 latinization_vs_hellenization.8.title: "Riordino delle Province"
 latinization_vs_hellenization.8.desc: "Funzionari di [ROOT.GetCountry.GetCapital.GetName] si sono fatti avanti per proporre una riorganizzazione completa di province come [target_province.GetName], allineando giurisdizioni e amministrazione più strettamente al nostro centro culturale e politico. Il piano promette maggiore controllo, ma rischia di disturbare equilibri locali consolidati da tempo."
 latinization_vs_hellenization.8.a: "Imponiamo il nuovo ordine, qualunque sia il costo."
 latinization_vs_hellenization.8.b: "Rispettiamo gli ordinamenti locali e alleviamo le loro preoccupazioni."
 pops_in_selected_provinces_will_gain_mild_bonus_satisfaction_tt: "I nostri [pops|e] nelle [provinces|e] interessate otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%]"

 latinization_vs_hellenization.9.title: "L'Educazione di [target_character.GetShortNameWithNoTooltip]"
 latinization_vs_hellenization.9.desc: "Mentre [target_character.GetName] raggiunge la maggiore età, tutori e cortigiani si scontrano sul corso appropriato degli studi di [target_character.GetHerHis]. Ogni scelta di lingua, testo e mentore minaccia di diventare una battaglia per procura sull'anima futura di [ROOT.GetCountry.GetName]."
 latinization_vs_hellenization.9.a: "Che l'educazione di [target_character.GetHerHis|U] segua un percorso chiaro e deliberato."
 latinization_vs_hellenization.9.b: "Non politicizziamo l'educazione di [target_character.GetShortNameWithNoTooltip]."
 refusal_to_politicize_tt: "Il nostro rifiuto di intrometterci apertamente nell'educazione di [target_character.GetName] può essere visto come debolezza da alcuni alla [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 court_does_not_react: "La [ROOT.GetCountry.GetGovernment.GetCourtTitle] non reagisce"

 latinization_vs_hellenization.10.title: "Restauro della Grandezza [ShowCultureNameWithNoTooltip('roman_culture')]"
 latinization_vs_hellenization.10.desc: "Architetti familiari con i nuovi metodi fiorenti nelle città d'Italia propongono di rimodellare [target_province.GetName] alla maniera rinascimentale: ampi viali, griglie ordinate e opere pubbliche che riecheggiano la grandezza di Rome come reimmaginata dai maestri dell'Occidente latino. Coloro che ammirano piani tanto elevati vi vedono una rinascita della dignità. Forse questo è il tipo di rinnovamento che solo l'apertura all'Occidente può portare."
 latinization_vs_hellenization.10.a: "Lasciamo che [target_province.GetNameWithNoTooltip] sorga di nuovo."
 latinization_vs_hellenization.10.b: "Lasciamo prosperare naturalmente gli insediamenti."
 target_character_artist_skill: "[artistic_skill|e] di [target_character.GetName]"

 latinization_vs_hellenization.11.title: "Costruire nella Tradizione Imperiale per [target_province.GetNameWithNoTooltip]"
 latinization_vs_hellenization.11.desc: "Mecenati delle arti e gilde locali fanno pressione per una ristrutturazione di [target_province.GetName] ispirata alla grande tradizione delle nostre città imperiali: le strade porticate, i fori aperti e le opere in pietra che hanno distinto Constantinople e le città durature dell'Oriente romano. Molti dei nostri consiglieri credono che restaurare tali forme parli con forza della dignità della nostra ininterrotta eredità romana."
 latinization_vs_hellenization.11.a: "Una tale grazia si addice bene al nostro [ROOT.GetCountry.GetFlavorRank]."
 latinization_vs_hellenization.11.b: "$latinization_vs_hellenization.10.b$"

 latinization_vs_hellenization.12.title: "Dibattito sul Nuovo Sistema Fiscale"
 latinization_vs_hellenization.12.desc: "Funzionari finanziari hanno presentato una profonda revisione dei nostri codici fiscali, prendendo a prestito modelli stranieri per rendere più rigorosi accertamento e riscossione. Questa proposta radicale promette maggiore ordine e entrate, ma minaccia anche di turbare interessi radicati in tutto il [ROOT.GetCountry.GetFlavorRank]."
 latinization_vs_hellenization.12.a: "Applichiamo il nuovo sistema."
 latinization_vs_hellenization.12.b: "Abbandoniamo queste idee per ora."
 proposed_taxation_upsets_estates_tt: "Il sistema fiscale proposto disturberà i privilegi consolidati di diversi [estates|e]"
 new_tax_code_will_destabilize_the_realm: "Il sistema fiscale riformato destabilizzerà il nostro [ROOT.GetCountry.GetFlavorRank]"

 latinization_vs_hellenization.13.title: "[target_location.GetNameWithNoTooltip] Pretende un Proprio Consiglio"
 latinization_vs_hellenization.13.desc: "I notabili di [target_location.GetName] si sono fatti avanti con una petizione alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] per ottenere un consiglio municipale autonomo, citando l'esempio dei comuni autogovernati delle città italiane come prova che il governo locale porta prosperità. Concedere il loro desiderio indebolirebbe il controllo centrale e spingerebbe il [ROOT.GetCountry.GetFlavorRank] verso modelli latini di governo, ma rifiutare potrebbe amareggiare élite influenti che guardano a occidente per ispirazione."
 latinization_vs_hellenization.13.a: "Concediamo loro il consiglio."
 latinization_vs_hellenization.13.b: "Rimangano sotto il nostro sguardo diretto."
 upper_class_pops_in_these_cities_angry: "I nostri [pops|e] [upper_class|e] nelle [locations|e] interessate diventeranno scontenti del nostro rifiuto e subiranno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 latinization_vs_hellenization.14.title: "Grande Festival a [target_province.GetNameWithNoTooltip]"
 latinization_vs_hellenization.14.desc: "I capi locali di [target_province.GetName] desiderano tenere un grande festival, un ringraziamento ai costumi e all'abbondanza della terra. Sebbene tali festeggiamenti possano alleviare le tensioni e rafforzare un'identità condivisa, richiederebbero un investimento sia dalla provincia sia dal nostro tesoro, con sgomento dei nostri consiglieri finanziari."
 latinization_vs_hellenization.14.a: "Celebriamo solo [target_province.GetNameWithNoTooltip]."
 latinization_vs_hellenization.14.b: "Lasciamo che le province vicine partecipino ai festeggiamenti!"
 latinization_vs_hellenization.14.c: "Se hanno tempo per oziare, hanno tempo per lavorare."
 pops_are_happier_tt: "I nostri [pops|e] che NON sono considerati parte della [upper_class|e] in questa [province|e] otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e] grazie ai festival in corso"

 latinization_vs_hellenization.15.title: "Un Manuale del Metodo Latino"
 latinization_vs_hellenization.15.desc: "Un manuale meticoloso di esercitazioni e manovre sul campo di battaglia, tratto dai metodi dei capitani mercenari e degli ordini militari dell'Occidente latino, ha iniziato a circolare tra i nostri ufficiali. I suoi diagrammi e comandi promettono di portare ordine e uniformità nei nostri ranghi, se saremo disposti ad adottarlo come dottrina ufficiale."
 latinization_vs_hellenization.15.a: "Distribuiamolo!"
 latinization_vs_hellenization.15.b: "Non abbiamo bisogno di simili influenze."

 latinization_vs_hellenization.16.title: "[target_character.GetShortNameWithNoTooltip] Si Scontra con i [target_estate.GetNameWithNoTooltip]"
 latinization_vs_hellenization.16.desc: "Ahimè! È scoppiata un'aspra lite tra [target_character.GetName] e figure di spicco dei [target_estate.GetName], con ciascuna parte che accusa l'altra di oltrepassare i propri limiti. La disputa minaccia di inasprire le relazioni tra il corpo degli ufficiali e i maggiori interessi del nostro [ROOT.GetCountry.GetFlavorRank]."
 latinization_vs_hellenization.16.a: "Hanno ragione a rimproverare [target_character.GetHerHim]."
 latinization_vs_hellenization.16.b: "I [target_estate.GetNameWithNoTooltip] non dettano le questioni militari!"
 court_faction_increases_influence: "Una fazione opposta della [ROOT.GetCountry.GetGovernment.GetCourtTitle] aumenterà la propria influenza"
 our_authority_will_suffer_penalty: "La nostra autorità ne soffrirà"

 latinization_vs_hellenization.17.title: "[target_character.GetShortNameWithNoTooltip] Si Offre di Servire"
 latinization_vs_hellenization.17.desc: "Attraverso i nostri legami con [target_country.GetName], un guerriero esperto di stirpe [target_culture.GetName] ha espresso il desiderio di servire sotto il nostro vessillo, attratto dai crescenti legami tra le nostre corti. [target_character.GetSheHe|U] porta con [target_character.GetHerHim] la conoscenza militare dell'Occidente latino e offre l'esperienza di [target_character.GetHerHis] alla nostra causa."
 latinization_vs_hellenization.17.a: "Accogliamo ogni comandante [target_culture.GetNameWithNoTooltip]!"

 latinization_vs_hellenization.18.title: "Dissenso tra Comandanti"
 latinization_vs_hellenization.18.desc: "Due dei nostri comandanti, [target_character_1.GetName] e [target_character_2.GetName], sono caduti in aperto disaccordo su tattiche e addestramento. La loro rivalità rischia di dividere il corpo degli ufficiali e confondere i soldati in campagna. Questa frattura è solo l'ultimo sintomo di un esercito diviso? Qualunque sia il caso, faremmo meglio a porre fine a questi litigi nell'interesse della nostra sicurezza nazionale."
 latinization_vs_hellenization.18.a: "Ascoltiamo il consiglio di [target_character_1.GetShortNameWithNoTooltip]."
 latinization_vs_hellenization.18.b: "[target_character_2.GetNameWithNoTooltip] ha ragione!"

 latinization_vs_hellenization.19.title: "[target_province_destination.GetNameWithNoTooltip] Attira Migranti"
 latinization_vs_hellenization.19.desc: "Lo splendore e il buon nome di [target_province_destination.GetName] hanno spinto persone da [target_province_origin.GetName] a intraprendere un viaggio verso le nostre terre. Se vengono dall'Occidente latino, il loro insediamento approfondirà i nostri legami con quelle terre; se sono vicini ortodossi, il loro arrivo rafforzerà il carattere antico della provincia."
 latinization_vs_hellenization.19.a: "Arricchiranno la nostra società!"
 latinization_vs_hellenization.19.b: "Non sono benvenuti."

 latinization_vs_hellenization.20.title: "La Lealtà di [target_character.GetNameWithNoTooltip]"
 latinization_vs_hellenization.20.desc: "Circolano voci secondo cui [target_character.GetName] avrebbe incontrato emissari e agenti le cui lealtà giacciono altrove. Che nascano da malizia o da fraintendimento, tali sussurri rodono la fiducia nel nostro comando. Sebbene le nostre spie riferiscano diffidenza, sarebbe saggio valutare attentamente la situazione."
 latinization_vs_hellenization.20.a: "[target_character.GetSheHe|U] si è guadagnato [target_character.GetHerselfHimself] un po' di vacanza..."
 latinization_vs_hellenization.20.b: "Non ascoltiamo queste chiacchiere oziose!"
 target_character_spills_the_beans: "[target_character.GetShortName] divulga i nostri segreti ai nostri [rivals|e] e [rival_enemies|e]"
 target_character_lips_shut: "Le labbra di [target_character.GetHerHis|U] restano chiuse"

 latinization_vs_hellenization.21.title: "Politiche Inflazionistiche"
 latinization_vs_hellenization.21.desc: "Un afflusso di monete svilite e contraffatte ha iniziato a distorcere i prezzi in tutta [ROOT.GetCountry.GetName]. Alcuni dei nostri consiglieri alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] sollecitano un intervento immediato, mentre altri sostengono che la cura potrebbe rivelarsi dolorosa quanto il male."
 latinization_vs_hellenization.21.a: "Rafforziamo il nostro controllo sulla moneta."
 latinization_vs_hellenization.21.b: "Lasciamo che il mercato si sistemi da sé."
 inflation_creeping_in_tt: "Se lasciata senza controllo, l'[inflation|e] può causare gravi problemi in futuro"
 burghers_pleased: "I [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono compiaciuti della nostra moderazione"
 burghers_upset: "La nostra inerzia turba i [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')]"
 inflation_causes_instability: "L'[inflation|e] dilagante incide negativamente sulla nostra [stability|e]"

 latinization_vs_hellenization.22.title: "Il Tutore-Amico di [target_character_1.GetShortNameWithNoTooltip]"
 latinization_vs_hellenization.22.desc: "[target_character_1.GetName] si è avvicinato in modo particolare a [target_character_2.GetName], le cui lezioni ora vanno oltre semplici lettere e somme. Alcuni dicono che questa amicizia allarghi gli orizzonti di [target_character_1.GetHerHis], mentre altri temono un'influenza indebita sul futuro del nostro [ROOT.GetCountry.GetFlavorRank]."
 latinization_vs_hellenization.22.a: "Solo il meglio per il nostro piccolo [target_character_1.GetShortNameWithNoTooltip]!"
 latinization_vs_hellenization.22.b: "[target_character_1.GetSheHe|U] è nato per guidare, non per leggere!"
 heir_will_receive_more_tutoring_tt: "Il nostro amato [target_character_1.GetShortName] riceverà un tutoraggio supplementare, migliorando potenzialmente le [abilities|e] di [target_character_1.GetHerHis]. Questo può influenzare il processo decisionale di [target_character_1.GetHerHis] se [target_character_1.GetSheHe] salirà al trono."

 latinization_vs_hellenization.23.title: "Un [target_character.GetWomanMan|U] di Lettere"
 latinization_vs_hellenization.23.desc: "Uno studioso errante [target_culture.GetName], formato nelle tradizioni umaniste delle città italiane, è arrivato alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], portando manoscritti latini, commentari filosofici e idee tratte dal fiorente sapere dell'Occidente. Una figura simile potrebbe essere un prezioso tramite con le correnti intellettuali del mondo latino. Tuttavia, dovremmo diffidare delle simpatie straniere che [target_character.GetSheHe] potrebbe portare con [target_character.GetHerHim]."
 latinization_vs_hellenization.23.a: "Resta con noi per un po', viaggiatore stanco."
 latinization_vs_hellenization.23.b: "Non ci curiamo delle riflessioni dei mendicanti erranti."

 latinization_vs_hellenization.24.title: "Un Viaggiatore Sapiente"
 latinization_vs_hellenization.24.desc: "Un dotto [target_character.GetWomanMan] versato negli scritti dei Padri della Chiesa e nei commentari dei grandi teologi ortodossi ha chiesto il diritto di risiedere alla nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle], offrendo di condividere manoscritti raccolti nei monasteri d'Oriente e una profonda conoscenza del diritto imperiale e della dottrina ortodossa. Sta a noi decidere se questa saggezza rafforzi le nostre tradizioni o aggiunga soltanto un'altra voce a una corte affollata."
 latinization_vs_hellenization.24.a: "Molto bene, [target_character.GetShortNameWithNoTooltip] può restare."
 latinization_vs_hellenization.24.b: "Niente di speciale, [target_character.GetSheHe] è solo un altro mattone nel muro."

 latinization_vs_hellenization.25.title: "Decadenza Culturale"
 latinization_vs_hellenization.25.desc: "I cronisti lamentano che il vigore culturale di [ROOT.GetCountry.GetName] stia rifluendo. Il mecenatismo vacilla, le tradizioni sono trascurate e le opere che un tempo ispiravano il nostro popolo ora raccolgono polvere in biblioteche e caveau. Siamo forse, come araldi di una grande cultura, fuori dal tempo?"
 latinization_vs_hellenization.25.a: "Accettiamo che la nostra eredità si sia affievolita."
 latinization_vs_hellenization.25.b: "No, sono tutti gli altri a sbagliarsi!"

 latinization_vs_hellenization.26.title: "Mode Orientali alla [ROOT.GetCountry.GetGovernment.GetCourtTitle]"
 latinization_vs_hellenization.26.desc: "Sete, profumi e usanze portate da mercanti e inviati dalle corti d'Oriente hanno catturato l'immaginazione dei nostri [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')]. Alcuni lo considerano naturale per un impero che da tempo si erge tra Oriente e Occidente, mentre altri sostengono che il nostro futuro stia con le potenze latine e che una corte rivolta a oriente non farà che allontanare i nostri alleati occidentali."
 latinization_vs_hellenization.26.a: "L'Oriente ha sempre fatto parte del nostro mondo."
 latinization_vs_hellenization.26.b: "Guardiamo a Occidente, non a Oriente."

 latinization_vs_hellenization.27.title: "Le Politiche di [ShowSocietyDirectionNameWithNoTooltip('hellenization')] Danno Frutti"
 latinization_vs_hellenization.27.desc: "Le politiche culturali che abbiamo abbracciato stanno finalmente dando frutti. Gli studiosi lodano una chiarezza rinnovata, gli ammiragli parlano di fiducia restaurata e il popolo percepisce che il nostro cammino, per quanto contestato, conduce verso uno scopo."
 latinization_vs_hellenization.27.a: "Sorridiamo, rendiamo orgogliosi i nostri antenati."
 strength_of_hellenization_desc: "Forza del nostro [country_modifier|e] [ShowModifierTypeName('monthly_towards_hellenization')]"

 latinization_vs_hellenization.28.title: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('nobles_estate')] Resistono alle Tendenze Attuali"
 latinization_vs_hellenization.28.desc: "Le famiglie principali tra i [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] si lamentano che il [ROOT.GetCountry.GetFlavorRank] stia deviando troppo e troppo in fretta nelle sue politiche culturali. Insistono che solo la loro mano ferma possa impedire a [ROOT.GetCountry.GetName] di perdere del tutto il proprio carattere."
 latinization_vs_hellenization.28.a: "Concediamo loro ciò che chiedono."
 latinization_vs_hellenization.28.b: "Non cambieremo rotta."

 latinization_vs_hellenization.29.title: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('clergy_estate')] Resistono alle Tendenze Attuali"
 latinization_vs_hellenization.29.desc: "Con nostro sgomento, i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] hanno di recente iniziato a parlare con inquietudine della nostra direzione culturale. Alcuni vedono queste derive come corruttrici o persino pericolose, ma tutti concordano che la fede debba essere salvaguardata da tali tendenze maligne."
 latinization_vs_hellenization.29.a: "Prestiamo ascolto ai loro avvertimenti."
 latinization_vs_hellenization.29.b: "La dottrina non deve governare la politica."
 refusal_leads_instability: "Il nostro rifiuto di conformarci porta instabilità"
 situation_dissipates: "Lo scambio acceso non degenera"

 latinization_vs_hellenization.30.title: "I [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')] Resistono alle Tendenze Attuali"
 latinization_vs_hellenization.30.desc: "Tra i campi e i villaggi di [ROOT.GetCountry.GetName], molti membri della classe inferiore brontolano che lontani dibattiti sull'inseguire grandezza e costume portino loro solo nuovi obblighi e funzionari strani. La loro quieta resistenza potrebbe farsi più forte se lasciata senza risposta."
 latinization_vs_hellenization.30.a: "Placiamo i [ROOT.GetCountry.GetGovernment.GetEstateNameWithNoTooltip('peasants_estate')]."
 latinization_vs_hellenization.30.b: "Imponiamo la conformità alla tendenza attuale."
