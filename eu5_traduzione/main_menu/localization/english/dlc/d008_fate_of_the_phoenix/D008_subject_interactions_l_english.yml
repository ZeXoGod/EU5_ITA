#Fate of the Phoenix DLC
 pronoia: "Prónoia"
 pronoia_desc: "Componente cruciale dell'organizzazione amministrativa di [GetCountry('BYZ').GetName], le Prónoiai erano originariamente esattori fiscali nominati temporaneamente. Tuttavia, il mutare dei tempi li costrinse a cambiare anche i loro obblighi. Trasformate ora in incarichi ereditari che forniscono assistenza militare oltre a estrarre denaro dal territorio, continuano a servire come estensione della volontà dell'Imperatore."
