l_english:

 d008_flavor_byz.1.title: "Promesse Alchemiche"
 d008_flavor_byz.1.entry: "$d008_flavor_byz.1.title$"
 d008_flavor_byz.1.desc: "In passato, il Fuoco Greco era conosciuto in tutto il Mediterraneo e anche oltre, ed era temuto da tutte le flotte dei nostri nemici al punto da diventare leggendario. Il suo potenziale di bruciare più caldo di qualunque fiamma persino sull'acqua, e l'impossibilità di estinguerlo con mezzi normali, significavano che poteva ridurre qualsiasi nave in cenere quasi in un istante. La sua produzione era sempre stata un segreto gelosamente custodito nel nostro paese, ma ahimè il tempo ha fatto perdere anche a noi questa conoscenza, e non siamo più in grado di produrlo come un tempo.\n\nOra, uno dei nostri alchimisti più eminenti, [target_artist.GetName], ci assicura che [target_artist.GetSheHe] è capace di recuperare la formula perduta e replicarla. Se ciò fosse davvero vero, potremmo armare ancora una volta le nostre flotte con il fuoco letale. Sia i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('nobles_estate')] sia i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('burghers_estate')] sono entusiasti di questa notizia, anche se, per svilupparlo davvero, [target_artist.GetNameWithNoTooltip] richiede da noi del denaro per gli esperimenti di [target_artist.GetHerHis]."
 d008_flavor_byz.1.a: "[target_artist.GetSheHe|U] avrà tutto ciò di cui [target_artist.GetSheHe] ha bisogno!"
 d008_flavor_byz.1.b: "La nostra flotta è già abbastanza forte senza bisogno di fantasie del passato."
 d008_flavor_byz.1.a.tt: "[target_artist.GetName] condurrà esperimenti alla ricerca della formula del Fuoco Greco"

 d008_flavor_byz.2.title: "La Ricerca del Fuoco"
 d008_flavor_byz.2.desc: "È passato un po' di tempo da quando [target_artist.GetName] ha isolato [target_artist.GetHerselfHimself] nel laboratorio di [target_artist.GetHerHis] alla ricerca della formula del Fuoco Greco, ma finora gli unici risultati che [target_artist.GetSheHe] è riuscito a produrre sono una serie di esplosioni notturne e un paio di sopracciglia bruciate. L'apparente inettitudine di [target_artist.GetHerHis|U] sta già facendo dubitare molti che [target_artist.GetSheHe] possa davvero riuscire nell'impresa di [target_artist.GetHerHis], mentre [target_artist.GetSheHe] ci assicura che [target_artist.GetSheHe] è sul punto di una svolta e che servono solo un po' più di tempo e denaro."
 d008_flavor_byz.2.a: "Molto bene, forniamo [target_artist.GetHerHim] fondi extra."
 d008_flavor_byz.2.b: "Ne abbiamo abbastanza di queste fantasie."
 d008_flavor_byz.2.a.tt: "[target_artist.GetName] continuerà la ricerca di [target_artist.GetHerHis] della formula del Fuoco Greco"

 d008_flavor_byz.3.title: "Fuoco Greco"
 d008_flavor_byz.3.desc: "Per molte notti la gente di [ROOT.GetCountry.GetCapital.GetName] è stata disturbata nel sonno dalle esplosioni causate dagli esperimenti di [target_artist.GetName]. Molte volte [target_artist.GetHerselfHimself] si è bruciato durante tali prove, ma tutte quelle fatiche hanno dato frutto. Dopo molti tentativi ed errori, [target_artist.GetSheHe] è riuscito a replicare in modo affidabile il Fuoco Greco come descritto nei documenti storici. Ora possiamo espanderne la produzione ed equipaggiarne le nostre navi. Sebbene continueremo a mantenere segrete la sua formula esatta e la sua fabbricazione, dovremo assicurarci di non dimenticare di nuovo come produrlo."
 d008_flavor_byz.3.a: "Ancora una volta, la flotta [ROOT.GetCountry.GetAdjectiveWithNoTooltip] incendierà il mare!"
 unlocked_greek_fire_tt: "Otteniamo accesso ai [unit_types|e] [ShowUnitDefinitionName('n_greek_fire_galley_renaissance')], [ShowUnitDefinitionName('n_greek_fire_galley_discovery')], [ShowUnitDefinitionName('a_greek_fire_renaissance_infantry')] e [ShowUnitDefinitionName('a_greek_fire_discovery_infantry')]"
 
 d008_flavor_byz.4.title: "La Ricerca di [target.GetNameWithNoTooltip] Giunge al Termine"
 d008_flavor_byz.4.desc: "La morte prematura di [target.GetName] ha purtroppo lasciato incompiuta la ricerca di [target.GetHerHis] sul Fuoco Greco. I discepoli di [target.GetHerHis|U] e altri eminenti alchimisti hanno esaminato gli appunti di [target.GetHerHis] per capire se la ricerca di [target.GetHerHis] potesse essere salvata e proseguita, ma ahimè gli esperimenti di [target.GetHerHis] sembrano aver girato a vuoto senza nulla di concreto a cui aggrapparsi. Il Fuoco Greco resterà dunque per sempre un mistero sigillato nella storia."
 d008_flavor_byz.4.a: "Oh... beh, comunque..."