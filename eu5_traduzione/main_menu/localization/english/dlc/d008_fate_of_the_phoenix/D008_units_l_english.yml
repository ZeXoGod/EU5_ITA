l_english:

 a_legionaries_1: "Primi Legionari"
 a_legionaries_1_desc: "I $a_legionaries_1$ mantengono le più antiche tradizioni di addestramento e disciplina. Lance, ampi scudi e salda coesione permettono loro di resistere anche quando la battaglia si contorce attorno a loro."
 a_legionaries_2: "Legionari"
 a_legionaries_2_desc: "Legionari addestrati nelle arti raffinate del combattimento ravvicinato, armati di lance da lancio e spade corte. La loro forza risiede in formazioni stabili e in una cultura militare di pratica incessante."
 a_legionaries_3: "Legionari Riformati"
 a_legionaries_3_desc: "I $a_legionaries_3$ sono fanti temprati, equipaggiati con le migliori armature e armi, che formano il nucleo dei nostri eserciti."
 a_legionaries_4: "Legionari Pesanti"
 a_legionaries_4_desc: "I $a_legionaries_4$ sono fanti d'élite, equipaggiati con le armature e le armi più pregiate. Come le legioni pesantemente corazzate dell'antica Roma, queste truppe saranno il martello con cui colpiremo i nostri nemici."
 a_legionaries_5: "Legionari della Guardia"
 a_legionaries_5_desc: "I $a_legionaries_5$ incarnano il più alto standard di mestiere militare all'interno delle legioni. Selezionati dalle migliori coorti, sono incaricati delle missioni cruciali e della protezione delle più alte istituzioni dello stato."
 a_legionaries_6: "Legionari Imperiali"
 a_legionaries_6_desc: "Questi $a_legionaries_6$ si trovano all'apice di secoli di evoluzione militare. Maestri di equipaggiamento e dottrina, servono come guardia personale la cui sola presenza può stabilizzare linee vacillanti."

 a_byzantine_cataphracts_2: "Catafratti Tardo Medievali"
 a_byzantine_cataphracts_2_desc: "I $a_byzantine_cataphracts_2$ sono cavalieri e cavalli rivestiti di maglia, che irrompono in battaglia dietro lunghe lance e fitti scudi. Le loro cariche d'urto e la disciplina ferrea sono una vista spaventosa per i nostri nemici."
 a_byzantine_cataphracts_3: "Catafratti Riformati"
 a_byzantine_cataphracts_3_desc: "Questi $a_byzantine_cataphracts_3$ fondono i vecchi addestramenti Imperiali con tattiche più nuove, combinando lance con archi e armi laterali. Combattono come un corpo di cavalleria pesante flessibile, capace di molestare a distanza e poi finire i nemici nel combattimento ravvicinato."
 a_byzantine_cataphracts_4: "Catafratti Pesanti"
 a_byzantine_cataphracts_4_desc: "I $a_byzantine_cataphracts_4$ cavalcano in armature stratificate che deviano la maggior parte dei proiettili e delle lame. Organizzati in cunei di combattenti d'élite, spezzano le linee nemiche con cariche ripetute che poche formazioni possono sopportare."
 a_byzantine_cataphracts_5: "Catafratti della Guardia"
 a_byzantine_cataphracts_5_desc: "Scelti tra i migliori lancieri, i $a_byzantine_cataphracts_5$ servono come guardia montata del trono e della nostra capitale. La loro presenza in ogni battaglia è sia un'arma sia un simbolo, raduna le nostre truppe e terrorizza i nostri nemici."
 a_byzantine_cataphracts_6: "Catafratti Imperiali"
 a_byzantine_cataphracts_6_desc: "I $a_byzantine_cataphracts_6$ sono il culmine di secoli di tradizione cavalleresca: veterani corazzati, splendidamente montati e addestrati alla perfezione. Servono come guardia personale dell'Imperatore, capaci di decidere campagne con una singola carica al momento giusto."

 n_greek_fire_galley_renaissance: "Siphōnes"
 n_greek_fire_galley_renaissance_desc: "Equipaggiate con tubi speciali per dispiegare il Fuoco Greco, queste navi riversano un inferno di fiamme sulle navi nemiche, riducendole in cenere in pochissimo tempo. A distanza ravvicinata, annunciano soltanto distruzione."
 n_greek_fire_galley_discovery: "Siphōnes Avanzati"
 n_greek_fire_galley_discovery_desc: "L'adattamento del sistema di dispiegamento del Fuoco Greco ai tipi di nave più nuovi gli permette di continuare a ridurre in cenere le imbarcazioni nemiche, e resta un simbolo della nostra flotta nel suo insieme."
 a_greek_fire_renaissance_infantry: "Cheirosiphōnes"
 a_greek_fire_renaissance_infantry_desc: "Non solo le navi possono beneficiare del Fuoco Greco, ma anche le nostre truppe terrestri possono essere equipaggiate con dispositivi portatili per sputare la sostanza infiammata sui nostri nemici. Fuoco e distruzione squarceranno i ranghi nemici e apriranno la strada alla nostra avanzata."
 a_greek_fire_discovery_infantry: "Cheirosiphōnes Avanzati"
 a_greek_fire_discovery_infantry_desc: "Eserciti e truppe cambiano, ma coprire i nemici di fiamme e incendiarli continua a essere un metodo di combattimento efficace. Per questo, il Fuoco Greco conserva la sua presenza tra i nostri eserciti e continua a essere temuto dai nostri avversari."