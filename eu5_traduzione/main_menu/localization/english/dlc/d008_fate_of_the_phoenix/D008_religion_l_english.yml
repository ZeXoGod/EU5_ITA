l_english:

 # Hellenism

 #Religious Aspects
 civic_religion_aspect: "Religione Civica"
 civic_religion_aspect_desc: "Onorare gli dei equivale a mantenere il benessere dello stato. Pertanto, pratiche e cerimonie religiose sono un dovere civico che dobbiamo sostenere per garantire la prosperità della nostra polis."

 hero_cult_aspect: "Culti Eroici"
 hero_cult_aspect_desc: "La nostra storia è piena di figure potenti che hanno plasmato la nostra società e il nostro carattere. Erano i figli mortali degli dei, umani con abilità straordinarie che spesso incontrarono destini tragici, e che protessero e guidarono i nostri antenati nella fondazione della grande nazione che siamo oggi. Ora è nostro dovere venerarli e imparare le loro lezioni."

 dionysian_mysteries_aspect: "Misteri Dionisiaci"
 dionysian_mysteries_aspect_desc: "I rituali, la danza e la musica di coloro che sono iniziati ai misteri di Dionysus offrono liberazione e sollievo ai loro membri, senza distinzione di classi sociali. La morte e rinascita del dio sono rispecchiate dal ciclo della vite, che cresce dalla terra, diventa vino e infine viene bevuta dagli accoliti in gloria di Dionysus."

 eleusinian_mysteries_aspect: "Misteri Eleusini"
 eleusinian_mysteries_aspect_desc: "Gli accoliti dei misteri eleusini seguono il mito del rapimento di Persephone dalla madre, Demeter, da parte del re degli inferi, Hades, e della sua successiva liberazione e inganno. Per gli iniziati, questo mito rappresenta il ciclo di crescita e rinascita di tutta la vita vegetale e l'eternità della vita mentre scorre da una generazione alla successiva."

 samothracian_mysteries_aspect: "Misteri Samotraci"
 samothracian_mysteries_aspect_desc: "Sull'isola di Samothrace, un culto misterico prosperò durante l'apice dell'Hellenism; accettava notoriamente chiunque volesse unirsi, indipendentemente dalla classe sociale. Si dice che molti eroi mitologici, come Heracles, Jason e Orpheus, furono iniziati a Samothrace. Possiamo raccogliere e ricostruire questi misteri da resti e rovine, e riportare questo culto alla sua antica gloria."

 olympiad_aspect: "Giochi Olimpici"
 olympiad_aspect_desc: "I Giochi Olimpici sono una celebrazione degli dei e una dimostrazione della forza e dell'unità del nostro paese. La partecipazione ai giochi è un dovere civico che porta onore ai nostri atleti."

 mithraic_mysteries_aspect: "Misteri Mitraici"
 mithraic_mysteries_aspect_desc: "Gli iniziati ai misteri mitraici, che si chiamavano Syndexioi, godettero di grande popolarità a Rome e nell'Impero Romano d'Occidente durante l'apice dell'Impero. I loro rituali, raduni e banchetti si svolgevano in templi sotterranei segreti, ma possiamo riportarli alla luce e ravvivare le loro tradizioni a beneficio del nostro popolo."
 
 imperial_cult_aspect: "Culto Imperiale"
 imperial_cult_aspect_desc: "Come gli antichi imperatori di Rome erano un tempo considerati divini dal popolo e dal Senato, anche il nostro sovrano e la sua dinastia devono essere considerati tali. La loro grandezza, maestà e autorità li contrassegnano chiaramente non solo come divinamente sanciti, ma come dei essi stessi."

 dii_familiares_aspect: "Dii Familiares"
 dii_familiares_aspect_desc: "Gli dei domestici e familiari svolgono un ruolo molto importante per il popolo del nostro paese. Proteggono e influenzano tutto ciò che accade nel dominio di una persona, che comunemente comprende una casa, ma potrebbe includere anche strade, quartieri o persino intere città."

 mos_maiorum_aspect: "Mos Maiorum"
 mos_maiorum_aspect_desc: "Il codice non scritto che governò la vita dei Romani dall'antichità all'apice dell'Impero, la 'Via degli Antenati.' Questo insieme di tradizioni e pratiche ha definito cosa significhi essere un Romano e come comportarsi sia all'interno della casa sia in pubblico."

 monism_aspect: "Monismo"
 monism_aspect_desc: "I filosofi della nostra rinascita sostengono che tutta l'esistenza fluisca da L'Uno — un singolo principio trascendente da cui emanano tutti gli dei e tutte le cose. Il pantheon tradizionale diventa allegoria; gli dei sono aspetti di L'Uno. I presagi perdono la loro forza particolare, ma la fede in L'Uno permea ogni atto di governo."

#Omens

 #Zeus
 the_thunderer_omen: "Il Tonante"
 the_thunderer_omen_desc: "I cieli si levano irati con lampi e tuoni, e chiunque si opponga a noi tremerà di paura."
 supreme_of_gods_omen: "Supremo tra gli Dei"
 supreme_of_gods_omen_desc: "Il sole ardente segnala che abbiamo il favore del più potente di tutti gli dei. Nessuno dubiterà della nostra gloria!"
 monarch_of_the_sky_omen: "Monarca del Cielo"
 monarch_of_the_sky_omen_desc: "Uno stormo di uccelli prende il volo, rispondendo a [ShowGodName('zeus_god')] e portando la sua volontà."
 omnipotence_of_heaven_omen: "Onnipotenza del Cielo"
 omnipotence_of_heaven_omen_desc: "Siamo davvero alla presenza di [ShowGodName('zeus_god')], si può sentire il suo potere e come nulla sia impossibile per lui."
 the_liberator_omen: "Il Liberatore"
 the_liberator_omen_desc: "Il potere di [ShowGodName('zeus_god')] aiutò i nostri antenati contro l'oppressione della Persia; egli ci libererà dalle nostre catene."
 the_bountiful_one_omen: "Il Munifico"
 the_bountiful_one_omen_desc: "Tutti coloro che alzano lo sguardo verso [ShowGodName('zeus_god')] condivideranno il suo potere e riceveranno a loro volta dalla sua abbondanza."
 the_holy_omen: "Il Santo"
 the_holy_omen_desc: "Non c'è nulla di più sacro che essere alla presenza del più alto dei divini e avere il suo favore."
 king_of_all_omen: "Re di Tutto"
 king_of_all_omen_desc: "[ShowGodName('zeus_god')] è la più alta autorità tra i divini, come il nostro sovrano è al di sopra del nostro popolo."
 immortal_omen: "Immortale"
 immortal_omen_desc: "Come può essere ucciso un dio? Con la protezione di [ShowGodName('zeus_god')], come possono fallire le nostre truppe?"
 splendor_omen: "Lo Splendore"
 splendor_omen_desc: "Il cielo sereno dimostra quanto sia indiscutibile la gloria di [ShowGodName('zeus_god')]. Il favore che ci mostra sarà visto in tutto il mondo."

 #Aphrodite
 mother_of_love_omen: "Madre dell'Amore"
 mother_of_love_omen_desc: "L'amore trabocca da [ShowGodName('aphrodite_god')], e la nostra popolazione si crogiolerà in quello stesso amore."
 the_foam_born_omen: "Nata dalla Schiuma"
 the_foam_born_omen_desc: "La schiuma del mare da cui nacque [ShowGodName('aphrodite_god')] lambisce le nostre coste, e lei è sempre lì per condurre amorevolmente le nostre navi attraverso di essa."
 the_seductress_omen: "La Seduttrice"
 the_seductress_omen_desc: "Amore e seduzione sono i domini di [ShowGodName('aphrodite_god')], e le sue arti e il suo favore volgeranno molti verso di noi."
 giver_of_joy_omen: "Dispensatrice di Gioia"
 giver_of_joy_omen_desc: "Nulla può essere più beato che essere alla presenza della dea della bellezza e avere il suo favore."
 nurturer_of_children_omen: "Nutrice dei Bambini"
 nurturer_of_children_omen_desc: "Non c'è espressione ulteriore dell'amore della dea che quello verso i bambini, e il suo amore materno si estende a tutti noi."
 the_beautiful_omen: "La Bella"
 the_beautiful_omen_desc: "In quanto dea più bella, [ShowGodName('aphrodite_god')] raccoglie molti simpatizzanti, e così faremo anche noi con il suo favore."
 the_secretive_omen: "La Segreta"
 the_secretive_omen_desc: "Non tutto l'amore deve essere pubblico. Discrezione e segretezza sono anch'esse strumenti della dea."
 the_harmonizer_omen: "L'Armonizzatrice"
 the_harmonizer_omen_desc: "L'amore di [ShowGodName('aphrodite_god')] è condiviso equamente con tutti, e così sarà il nostro amore per il nostro popolo."
 the_lover_of_laughter_omen: "L'Amante del Riso"
 the_lover_of_laughter_omen_desc: "Il volto di [ShowGodName('aphrodite_god')] sorride sempre; così sarà anche il nostro."
 the_desired_omen: "La Desiderata"
 the_desired_omen_desc: "Essendo la dea più bella, [ShowGodName('aphrodite_god')] accende il desiderio in tutti. Avere il suo favore attirerà quindi gli altri."

 #Poseidon
 tempest_omen: "La Tempesta"
 tempest_omen_desc: "La furia divina agita le acque, scatenando tempeste che sfidano persino i marinai più coraggiosi."
 lord_of_the_sea_omen: "Signore del Mare"
 lord_of_the_sea_omen_desc: "Dominare i mari significa dominare il mondo."
 protector_of_horses_omen: "Protettore dei Cavalli"
 protector_of_horses_omen_desc: "Con il favore del padre divino di tutti i cavalli, le nostre cavalcature prospereranno e cresceranno forti."
 wielder_of_the_trident_omen: "Portatore del Tridente"
 wielder_of_the_trident_omen_desc: "Non c'è arma più iconica di quella del dio del mare; essa dimostra che un attacco a più punte è l'opzione migliore."
 earth_shaker_omen: "Scuotitore della Terra"
 earth_shaker_omen_desc: "Come egli colpì la terra per creare una sorgente, così saranno colpiti i nemici che calpestano il nostro suolo."
 leader_of_the_nymphs_omen: "Guida delle Ninfe"
 leader_of_the_nymphs_omen_desc: "Il favore di [ShowGodName('poseidon_god')] porta con sé anche il favore delle sue ninfe, che benediranno tutte le nostre acque e sorgenti."
 the_watcher_omen: "L'Osservatore"
 the_watcher_omen_desc: "Lo sguardo di [ShowGodName('poseidon_god')] è ovunque, su tutti i mari e le acque, e nulla sfugge al suo sguardo."
 the_graceful_omen: "Il Grazioso"
 the_graceful_omen_desc: "C'è bellezza nel mare e nelle onde, e contemplarle nel modo giusto dona bellezza al cuore."
 master_of_the_waves_omen: "Maestro delle Onde"
 master_of_the_waves_omen_desc: "Nessuno solchi il mare senza il permesso di [ShowGodName('poseidon_god')]."
 dark_blue_haired_omen: "Dai Capelli Blu Scuro"
 dark_blue_haired_omen_desc: "Le onde sono i capelli blu del dio stesso, e le nostre navi le solcheranno rapidamente con il suo favore."
 #Hermes
 messenger_omen: "Il Messaggero"
 messenger_omen_desc: "I talloni alati consegnano sempre ogni messaggio in modo rapido e sicuro."
 golden_wand_omen: "Della Verga Dorata"
 golden_wand_omen_desc: "Il Caduceo fu usato per separare due serpenti, ma ciò che separa collega anche."
 god_of_travelers_omen: "Dio dei Viaggiatori"
 god_of_travelers_omen_desc: "Tutti i viaggiatori e i mercanti erranti si rivolgono a [ShowGodName('hermes_god')] per sicurezza e protezione."
 protector_of_merchants_omen: "Protettore dei Mercanti"
 protector_of_merchants_omen_desc: "Sotto lo sguardo attento di [ShowGodName('hermes_god')], i mercanti viaggeranno sicuri e prosperi attraverso la nostra terra."
 wing_footed_omen: "Dai Piedi Alati"
 wing_footed_omen_desc: "Il favore di [ShowGodName('hermes_god')] permetterà alle nostre truppe di muoversi rapide come il dio stesso."
 trickster_omen: "L'Ingannatore"
 trickster_omen_desc: "Il mutare dei venti mostra come anche [ShowGodName('hermes_god')] abbia una natura volubile, e come tutte le cose siano soggette a cambiamento e inganno."
 patron_of_thieves_omen: "Patrono dei Ladri"
 patron_of_thieves_omen_desc: "La rapidità può essere usata per fare il bene o il male, ma in ogni caso è una buona qualità da avere."
 president_of_games_omen: "Presidente dei Giochi"
 president_of_games_omen_desc: "Il favore di [ShowGodName('hermes_god')] cade sui giochi atletici, che ci offrono sia intrattenimento sia un'attività salutare."
 guardian_of_the_gates_omen: "Guardiano delle Porte"
 guardian_of_the_gates_omen_desc: "Tutte le strade e i viaggiatori prima o poi passeranno per una porta, che consentirà il loro passaggio oppure lo bloccherà."
 giver_of_wealth_omen: "Dispensatore di Ricchezza"
 giver_of_wealth_omen_desc: "Sotto gli auspici di [ShowGodName('hermes_god')], il commercio non serve solo al movimento delle merci, ma anche a quello della ricchezza."
 #Ares
 throng_of_battle_omen: "La Mischia della Battaglia"
 throng_of_battle_omen_desc: "In ogni conflitto, in ogni contesa, dimora [ShowGodName('ares_god')], ed è la sua volontà a determinarne l'esito."
 insatiable_at_war_omen: "Insaziabile in Guerra"
 insatiable_at_war_omen_desc: "[ShowGodName('ares_god')] gioisce della battaglia, e più è lunga e sanguinosa, meglio è per ottenere il suo favore."
 slayer_of_men_omen: "Uccisore di Uomini"
 slayer_of_men_omen_desc: "La furia di [ShowGodName('ares_god')] accompagnerà i nostri uomini in battaglia, e la sua forza sarà nelle loro braccia."
 plague_of_mankind_omen: "Piaga dell'Umanità"
 plague_of_mankind_omen_desc: "Nessuno può osare affrontare il dio della guerra e sognare di vivere un altro giorno."
 warrior_omen: "Il Guerriero"
 warrior_omen_desc: "Un semplice massacro non basterà a soddisfare il dio guerriero, solo un combattimento glorioso."
 audacious_omen: "L'Audace"
 audacious_omen_desc: "Lanciarsi in combattimento per infliggere danno ai nostri nemici assicurerà il favore di [ShowGodName('ares_god')] e conquisterà la sua grazia."
 blood_soaked_omen: "Intriso di Sangue"
 blood_soaked_omen_desc: "Il sangue dei nostri nemici sarà versato e offerto al dio che lo reclama." #Blood for the Blood God!
 malignant_omen: "Maligno"
 malignant_omen_desc: "Nessuna strategia è troppo subdola se serve ad assicurare la distruzione dei nostri nemici."
 indestructible_omen: "L'Indistruttibile"
 indestructible_omen_desc: "[ShowGodName('ares_god')] impugna non solo una lancia per attaccare il nemico, ma anche uno scudo per proteggersi."
 fickle_lord_of_war_omen: "Il Volubile Signore della Guerra"
 fickle_lord_of_war_omen_desc: "Guerra e battaglie possono cambiare direzione in qualsiasi momento, ma il favore di [ShowGodName('ares_god')] farà sì che cambino a nostro vantaggio."
 #Athena
 unseen_hand_omen: "Mano Invisibile"
 unseen_hand_omen_desc: "Nessun piano fallisce solo per caso; i cieli ispirano i comandanti invasori verso decisioni sbagliate. Le pattuglie vengono condotte in imboscate, le linee di rifornimento interrotte e i capitani gravemente fuorviati."
 unwavering_omen: "L'Incrollabile"
 unwavering_omen_desc: "Come [ShowGodName('athena_god')] sta fiera e immobile, così noi non saremo scossi da alcuna stanchezza."
 she_who_fights_in_front_omen: "Colei Che Combatte Davanti"
 she_who_fights_in_front_omen_desc: "Andare rapidamente all'incontro con il nemico e affrontarlo è il modo più rapido per sbarazzarsene."
 the_industrious_omen: "L'Operosa"
 the_industrious_omen_desc: "Diligenza e applicazione al proprio lavoro sono il modo migliore per ottenere profitto e risultati positivi."
 the_judge_omen: "La Giudice"
 the_judge_omen_desc: "Sotto lo sguardo attento e la saggezza di [ShowGodName('athena_god')], nessun crimine resterà impunito e nessun innocente sarà danneggiato ingiustamente."
 the_chieftain_of_war_omen: "La Condottiera di Guerra"
 the_chieftain_of_war_omen_desc: "Come le formiche vagano senza meta senza una linea da seguire, così gli eserciti si disperderanno senza una guida e una direzione adeguate."
 teacher_of_the_waves_omen: "Maestra delle Onde"
 teacher_of_the_waves_omen_desc: "[ShowGodName('poseidon_god')] può governare le onde, ma [ShowGodName('athena_god')] le domò con le navi."
 protector_of_the_anchorage_omen: "Protettrice dell'Ancoraggio"
 protector_of_the_anchorage_omen_desc: "Come maestra della costruzione navale, come potrebbero le nostre navi non essere al sicuro sotto il favore di [ShowGodName('athena_god')]?"
 the_bright_eyed_omen: "Dagli Occhi Lucenti"
 the_bright_eyed_omen_desc: "Essendo sotto il simbolo della civetta, siamo davvero destinatari del favore e della saggezza di [ShowGodName('athena_god')]."
 the_armed_one_omen: "L'Armata"
 the_armed_one_omen_desc: "Armata sin dalla nascita, [ShowGodName('athena_god')] ci mostra che essere sempre pronti alla battaglia è la migliore strategia."
 
 hellenism_religion.1.title: "[target_god.GetNameWithNoTooltip] Ci Sorride"
 hellenism_religion.1.desc: "In questi giorni tranquilli, gli dei non hanno distolto lo sguardo da noi. Segni appaiono in strane coincidenze, in improvvisi colpi di fortuna e nella routine che si diffonde attraverso la [ROOT.GetCountry.GetGovernment.GetCourtTitle].\n\nI sacerdoti proclamano che [target_god.GetName] sorride al nostro [ROOT.GetCountry.GetFlavorRank] e al nostro amato [target_character.GetNameWithNoTooltip]. In effetti, sembra che la nostra fortuna stia cambiando e che i sacrifici che abbiamo dedicato abbiano finalmente inciso sulla nostra sorte!"
 hellenism_religion.1.a: "Accettiamo la benedizione."
 fertile_ruler_and_family_tt: "[target_character.GetName] e il [consort|e] avranno la loro [fertility|e] aumentata"

 hellenism_religion.2.title: "L'Aquila di [target_character.GetNameWithNoTooltip]"
 hellenism_religion.2.desc: "Cosa si può dire di [target_character.GetName], la cui abilità tattica è un esempio splendente delle tradizioni militari sposate dagli antenati del nostro [ROOT.GetCountry.GetFlavorRank]? Pochi possono stare accanto a figure come Odysseus, Jason o Ajax in termini di astuzia, tenacia e coraggio.\n\nTuttavia, [target_character.GetShortNameWithNoTooltip] è un orgoglioso prodotto della nostra devozione alle radici [ShowReligionAdjective('hellenism_religion')], una vera aquila del campo di battaglia!"
 hellenism_religion.2.a: "[target_character.GetSheHe] combatterà all'ombra?"
 hellenism_religion.2.b: "Mandiamo [target_character.GetHerHim] a insegnare all'accademia!"

 hellenism_religion.3.title: "L'Ala Filosofica di [target_location.GetNameWithNoTooltip]"
 hellenism_religion.3.desc: "Da dove venne l'anima umana? Cosa ci attende dopo la morte? La vita sarebbe migliore come bipede implume? Tali domande brucianti occupano le menti sovraccariche degli intellettuali e dei filosofi della [ShowBuildingTypeName('university')] di [target_location.GetName].\n\nDi recente, la facoltà è passata sotto l'ala di un ricco benefattore locale, che ora presenta una petizione per maggiori finanziamenti, sostenendo che i locali possono davvero contribuire a diffondere idee innovative e all'avanguardia."
 hellenism_religion.3.a: "Purché non insegnino alcun Diogenes..."
 hellenism_religion.3.b: "Non possono semplicemente immaginare di avere i fondi?"

 hellenism_religion.4.title: "Un Talismano per [target_character_2.GetNameWithNoTooltip]"
 hellenism_religion.4.desc: "Avversari e nemici tramano giorno e notte per provocare la nostra rovina. Tuttavia, la successione è al sicuro finché [target_character_2.GetName] vive. Il bambino tiene il futuro del nostro intero [ROOT.GetCountry.GetFlavorRank] nelle delicate mani di [target_character_2.GetHerHis].\n\nImbevuto del bagliore degli dei dell'Olympus, [target_character_2.GetShortNameWithNoTooltip] è destinato alla grandezza, di questo siamo certi. Uno dei nostri cortigiani, un mistico [target_character_3.GetWomanMan] di nome [target_character_3.GetName], si è offerto di separarsi da un talismano protettivo. Si dice che contenga una singola goccia di essenza divina, capace di respingere i mali finché il piccolo [target_character_2.GetShortNameWithNoTooltip] non raggiungerà l'età adulta."
 hellenism_religion.4.a: "Ringraziamo [target_character_3.GetShortNameWithNoTooltip] per conto di [target_character_2.GetShortNameWithNoTooltip]."
 hellenism_religion.4.b: "Non ci curiamo di simili superstizioni!"
 talisman_tt: "Il talismano dato al piccolo [target_character_2.GetName] #italic può#! proteggere [target_character_2.GetHerHim] da [events|e] legati a malattie e incidenti di caccia"
 target_character_3_is_declined_tt: "L'offerta di [target_character_3.GetName] viene gentilmente rifiutata"

 hellenism_religion.5.title: "[target_province.GetNameWithNoTooltip] Celebra [target_god.GetNameWithNoTooltip]"
 hellenism_religion.5.desc: "Notizie gioiose giungono da [target_province.GetName], dove il popolo è sceso in strada per celebrare [target_god.GetName]. Con una mossa pia senza precedenti, i locali hanno organizzato i propri festival, desiderosi di lodare la loro più recente buona fortuna.\n\nPer un giorno, persino i pesi del governo sembrano più leggeri. Gli dei sono onorati, le folle sono rumorose e la devozione si diffonde nella provincia come ambrosia sul Mount Olympus."
 hellenism_religion.5.a: "Lasciamo che la provincia celebri."
 every_pop_in_target_province_gains_10_satisfaction_tt: "I nostri [pops|e] in [target_province.GetName] otterranno [ShowNamedValue('pop_satisfaction_mild_bonus')|+=2%] di [pop_satisfaction|e]"

 hellenism_religion.6.title: "Nel Giorno Più Luminoso"
 hellenism_religion.6.desc: "Il governo di [target_character.GetName] ha raggiunto altezze senza precedenti sotto la pia guida degli dei olimpici. Buone politiche, condivisione della ricchezza e un periodo generalmente stabile e pacifico sono solo alcuni dei doni concessi dagli dei. In verità, questa è un'età dell'oro goduta dal nostro popolo mentre canta il nome di [target_character.GetShortNameWithNoTooltip], immortalando [target_character.GetHerHim] accanto ad altre figure leggendarie come Heracles e Pericles."
 hellenism_religion.6.a: "Concentriamo la nostra prosperità sull'amministrazione!"
 hellenism_religion.6.b: "Lasciamo che la nostra gravitas diplomatica domini il mondo."
 hellenism_religion.6.c: "I nostri nemici saranno schiacciati!"

 hellenism_religion.7.title: "L'Avatar di [ShowGodNameWithNoTooltip('ares_god')]"
 hellenism_religion.7.desc: "Fuoco, zolfo e il suono minaccioso di grida insanguinate seguono [target_character.GetName] sul cammino di [target_character.GetHerHis]. Noto fin dall'infanzia come un guerriero capace, questo [target_character.GetWomanMan] ha mostrato più volte un'attitudine a porre fine alla vita dei nemici di [target_character.GetHerHis].\n\nOra, marchiato dalle truppe come avatar di [ShowGodName('ares_god')], [target_character.GetSheHe] è destinato a vagare per la terra, seminando devastazione in nome del nostro [ROOT.GetCountry.GetFlavorRank]."
 hellenism_religion.7.a: "[target_character.GetSheHe|U] sa che i vincitori sono coloro che sacrificano tutto."
 hellenism_religion.7.b: "Non possiamo rischiare di scatenare una forza così catastrofica..."

 hellenism_religion.8.title: "Epopee della Storia [ShowCultureNameWithNoTooltip('greek_culture')]"
 hellenism_religion.8.desc: "Le epopee di Homer sono state a lungo principi guida per la crescita della cultura e dell'alfabetizzazione, servendo da gemme preservate della nostra tradizione.\n\nIn onore di tale eredità, [target_character.GetName] si è fatto avanti proponendo una sponsorizzazione per pubblicare studi e opere sull'Iliad e sull'Odyssey. [target_character.GetSheHe|U] desidera onorare il nostro glorioso passato in cambio del permesso di osservare più da vicino le pagine leggendarie."
 hellenism_religion.8.a: "[ROOT.GetCountry.Custom('common_string_ok')]"
 hellenism_religion.8.b: "$jurchen_confederation_events.3.b$"

 hellenism_religion.9.title: "[target_province.GetNameWithNoTooltip] dell'Abbondanza"
 hellenism_religion.9.desc: "È abbondantemente chiaro che [target_province.GetName] gode del favore degli dei, come risulta evidente dalla prosperità crescente in tutta la provincia. Di recente, cercatori e sviluppatori locali ci hanno avvicinato con piani per concentrare quella ricchezza nei centri urbani della provincia, a spese dei villaggi circostanti. Un simile gesto darebbe impulso agli sforzi di urbanizzazione, ma priverebbe i locali dei benefici eccedenti."
 hellenism_religion.9.a: "Ricchezza per il popolo!"
 hellenism_religion.9.b: "Concentriamo i nostri sforzi."
 pops_in_aforementioned_provinces_weak_satisfaction_tt: "I nostri [pops|e] nelle [provinces|e] summenzionate otterranno [ShowNamedValue('pop_satisfaction_weak_bonus')|+=2%] di [pop_satisfaction|e]"

 hellenism_religion.10.title: "La Benedizione di [ROOT.GetCountry.Custom('GetDemeterMomName')]"
 hellenism_religion.10.desc: "Da parecchio tempo, i depositi di grano in tutto il [target_market.GetName] godono di abbondanza. Questo è sicuramente un segno che [ROOT.GetCountry.Custom('GetDemeterMomName')], la dea del raccolto, ci sorride. La nostra nuova prosperità è l'ultima indicazione del favore divino. I locali hanno iniziato a chiedere la distribuzione del sostentamento in eccesso, mentre i sacerdoti suggeriscono che un tributo aggiuntivo sia appropriato."
 hellenism_religion.10.a: "Diamo tutto al popolo."
 hellenism_religion.10.b: "Che gli dei lo ricevano."
 Demeter_latin_name: "Ceres"
 Demeter_base_name: "Demeter"

 hellenism_religion.11.title: "[target_god.GetNameWithNoTooltip] è Scontento"
 hellenism_religion.11.desc: "Per lo sguardo impietoso del divino, sembra che [target_god.GetName] sia gravemente scontento di noi! Oscuri presagi notturni, ombre persistenti e un sentimento di rovina sempre crescente si diffondono tra il nostro popolo. Non sappiamo cosa abbiamo fatto per turbare una divinità tanto potente, e l'unico cammino per riguadagnare il suo pio favore è chinare umilmente il capo in riverenza al divino."
 hellenism_religion.11.a: "Così è la vita."
 hellenism_religion.11.b: "Organizziamo immediatamente un ampio tributo."

 hellenism_religion.12.title: "Nascita Mostruosa"
 hellenism_religion.12.desc: "Un silenzio è calato sulla [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Nelle nursery entro le mura della residenza [ROOT.GetCountry.GetGovernment.GetAdjective], un figlio di [target_character_1.GetName] è nato tra preghiere in preda al panico e notti insonni, un bambino che porta con [target_character_2.GetHerHim] la sventura stessa.\n\nI [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] lo chiamano un presagio. I servi lo chiamano una maledizione. I nostri rivali lo chiameranno debolezza. Eppure [target_character_2.GetShortName] respira ancora, e il destino di una simile creatura potrebbe ancora determinare la nostra stirpe..."
 hellenism_religion.12.a: "Sciocchi! [target_character_2.GetShortNameWithNoTooltip] è solo un bambino!"
 hellenism_religion.12.b: "Non possiamo rischiare l'ira divina."

 hellenism_religion.13.title: "Sacerdote Corrotto"
 hellenism_religion.13.desc: "Gli dei possono essere eterni, ma i loro servitori sono fatti di carne. Ci sono giunti rapporti secondo cui [target_character.GetName] ha usato il sacro ufficio di [target_character.GetHerHis] come borsa privata, raccogliendo favori e monete dove dovrebbero passare solo offerte.\n\nSe interveniamo, i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] ululeranno di insulto e umiliazione. Se distogliamo lo sguardo, insegniamo a ogni intrigante nel nostro [ROOT.GetCountry.GetFlavorRank] che la pietà è soltanto un altro commercio, rischiando di insultare persino gli dei stessi."
 hellenism_religion.13.a: "L'avidità di [target_character.GetHerHis|U] ci condannerà tutti!"
 hellenism_religion.13.b: "Distogliamo lo sguardo."

 hellenism_religion.14.title: "[target_province.GetNameWithNoTooltip] Trascura [target_god.GetNameWithNoTooltip]"
 hellenism_religion.14.desc: "Le notizie da [target_province.GetName] sono preoccupanti. I riti di [target_god.GetNameWithNoTooltip] vengono trascurati, le offerte sono rinviate e i fedeli brontolano che le porte del tempio non si aprono più come dovrebbero.\n\nChe si tratti di pigrizia, povertà o quieta sfida importa poco. Quando si dice che un dio venga ignorato, ogni disgrazia trova presto un colpevole divino. I sacerdoti chiedono azione, e [target_province.GetNameWithNoTooltip] attende il nostro giudizio."
 hellenism_religion.14.a: "Raccogliamo la loro devozione con la forza."
 hellenism_religion.14.b: "Non governeremo con la frusta."
 pops_in_target_province_mild_pop_satisfaction_malus_tt: "I nostri [pops|e] in [target_province.GetName] otterranno [ShowNamedValue('pop_satisfaction_mild_penalty')|+=2%] di [pop_satisfaction|e]"

 riots_destroy_temple_desc: "La folla diventa violenta e il tempio diventa un bersaglio. All'alba, restano solo pietre carbonizzate."
 riots_cause_minimal_damage_desc: "Ci sono disordini e grida nelle strade, ma il peggio viene evitato."

 hellenism_religion.15.title: "Augurio Contestato"
 hellenism_religion.15.desc: "Per la possente barba di [ShowGodName('zeus_god')], gli auguri sono l'uno alla gola dell'altro! Due letture degli stessi segni, due avvertimenti selvaggiamente diversi, ed entrambi pronunciati con la stessa certezza.\n\nLa [ROOT.GetCountry.GetGovernment.GetCourtTitle] si ritrova davanti a un dilemma. Cosa deve pensare il popolo, se i nostri [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] sono così nettamente divisi? Abbiamo perso la nostra via? Qualunque sia l'interpretazione di questi segni, è certo che subiremo i loro esiti..."
 hellenism_religion.15.a: "Siamo stanchi dei brontolii dei vecchi!"

 hellenism_religion.16.title: "Ira degli Dei"
 hellenism_religion.16.desc: "Una lite è esplosa nelle nostre sale, e i sacerdoti insistono che gli dei osservano. Indicano le nostre terre sparse, la nostra presa sottile su luoghi lontani, e mormorano che l'orgoglio invita la correzione divina.\n\nSe gli dei intendono ricordarci la nostra fragilità, non invieranno una lettera cortese. Manderanno tempo avverso, fuoco e terrore, e sceglieranno dove fa più male."
 hellenism_religion.16.a: "Che la tempesta passi presto."

 hellenism_religion.17.title: "Vaso di Pandora"
 hellenism_religion.17.desc: "Una strana curiosità ha raggiunto [target_province.GetName], passando di mano in mano tra sorrisi complici e sfide sciocche. Alcuni giurano che sia innocua. Altri insistono che porti sventura, una cosa che tenta gli incauti e punisce i superbi.\n\nChe sia davvero maledetta o soltanto una scintilla per il panico, la disgrazia ha il modo di diventare reale quando abbastanza persone ci credono. Alcuni sacerdoti locali hanno persino riferito che il vaso porta uno strano volto sofferente, in terribile dolore e coperto di rosso sangue."
 hellenism_religion.17.a: "Non ci curiamo delle superstizioni."
 hellenism_religion.17.b: "Paghiamo per farlo sigillare."
 locations_and_pops_in_target_province_suffer_minimal_damage_tt: "[target_province.GetName] e i locali saranno risparmiati dalla punizione divina"

 hellenism_religion.18.title: "Nella Notte Più Oscura"
 hellenism_religion.18.desc: "La notte sembra più lunga di quanto dovrebbe. In ogni angolo del nostro [ROOT.GetCountry.GetFlavorRank], la gente parla di rovina, fame, sconfitta e degli dei che distolgono il volto. È evidente che siamo in un periodo turbolento, sia per le nostre mancanze sia per aver fatto adirare gli dei dell'Olympus.\n\n[ROOT.GetCountry.GetGovernment.GetRulerOrRegent.GetName] non può sfuggire a questi sussurri. Quando le nostre fondamenta sono scosse, persino la corona più forte sembra pesante."
 hellenism_religion.18.a: "Siamo perduti nella disperazione."
 hellenism_religion.18.b: "Un sacrificio, allora. Che gli dei ascoltino."

 hellenism_religion.19.title: "Paura e Fame"
 hellenism_religion.19.desc: "Il panico si diffonde più rapidamente di qualunque pestilenza. Un cattivo raccolto qui, una disgrazia bizzarra là, e all'improvviso ogni vicino è un augure con una cupa storia da raccontare. Nonostante i nostri migliori sforzi per calmare i locali, sembra che un insieme di presunti cattivi segni basti a gettare intere comunità nel panico.\n\nI sacerdoti sostengono che la paura debba essere guidata, affinché non cresca in sfida. Il popolo di [target_province.GetName] guarda a noi in cerca di certezza, anche se la certezza deve essere comprata."
 hellenism_religion.19.a: "Lasciamo che la terra sopporti il peso."
 hellenism_religion.19.b: "Offriamo placazione e attenuiamo il colpo."

 sacrifice_to_the_gods: "Placazione degli Dei"

 hellenism_religion.20.title: "Gli Dei Disapprovano la Guerra"
 hellenism_religion.20.desc: "Non tutti gli dei gioiscono dello spargimento di sangue. Mentre [target_war.GetName] si trascina, i sacerdoti avvertono che i cieli si raffreddano verso la nostra causa. A differenza di [ShowGodName('ares_god')], gli altri dei non condonano ogni conflitto, a prescindere dalla giustificazione.\n\nI soldati possono acclamare i nostri stendardi, ma il popolo è stanco, e ogni privazione viene ora attribuita al malcontento divino. In tempi simili, persino la vittoria può sembrare una punizione, una destinazione lunga e incerta..."
 hellenism_religion.20.a: "Sopporteremo il loro sfavore."

 hellenism_religion.21.title: "[target_location.GetNameWithNoTooltip] Trascura i Riti"
 hellenism_religion.21.desc: "È comprensibile che le persone dimentichino le proprie responsabilità verso gli dei, specialmente durante periodi di tranquillità o prosperità. A [target_location.GetName], i riti diventano esili e svogliati. Le processioni sono più piccole, le offerte più scarse e gli antichi canti vengono intonati senza convinzione.\n\nI sacerdoti pretendono che facciamo di qualcuno un esempio. Se la città non onorerà gli dei volontariamente, allora forse la paura insegnerà la devozione. In un modo o nell'altro, non possiamo permettere che la nostra fede si atrofizzi."
 hellenism_religion.21.a: "Facciamo ricordare la gente comune."
 hellenism_religion.21.b: "L'élite è diventata troppo comoda."
 hellenism_religion.21.c: "Lasciamoli stare e accettiamo il rischio."
 pops_go_unpunished_gods_angry_tt: "La mancanza di punizione farà sicuramente adirare gli dei"

 hellenism_religion.22.title: "Pratiche Ornitomantiche nella Capitale"
 hellenism_religion.22.desc: "[target_character.GetName] è diventato l'argomento della capitale. Nonostante l'abito eccentrico di [target_character.GetHerHis], [target_character.GetSheHe] vanta una profonda capacità di leggere il futuro. In effetti, con uccelli, ossa e certezza ansimante, [target_character.GetSheHe] afferma di leggere la volontà degli dei, nel bene o nel male.\n\nAlcuni alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] ridono. Altri pagano, in silenzio, sperando che persino un presagio sciocco possa ancora essere utile, una curiosità nuova e profondamente interessante."
 hellenism_religion.22.a: "Strilla pure, [target_character.GetShortNameWithNoTooltip]!"
 hellenism_religion.22.b: "Questo è un imbarazzo."

 birds_divinations_come_true_desc: "I segni si allineano e la fortuna segue. La [ROOT.GetCountry.GetGovernment.GetCourtTitle] lo chiama prova."
 the_divinations_lie_desc: "Non ne viene nulla. Gli uccelli restano uccelli, e la [ROOT.GetCountry.GetGovernment.GetCourtTitle] resta irritata."

 hellenism_religion.23.title: "Espansione dei Terreni Religiosi"
 hellenism_religion.23.desc: "I sacerdoti si sono fatti avanti con una proposta ambiziosa, una che rimodellerebbe il terreno sacro stesso. Templi, come quello a [target_location.GetName], devono essere ampliati, con sale allargate e cortili ornati, affinché i fedeli possano di nuovo sentire la grandezza degli dei sulle proprie spalle.\n\nEppure la pietra non si muove da sola e gli artigiani non lavorano solo per preghiere. Che finanziamo questa espansione con monete o costringiamo il popolo a provvedere, il costo si farà sentire, e gli dei noteranno sicuramente il modo in cui lo paghiamo."
 hellenism_religion.23.a: "Finanziamo l'espansione come si deve."
 hellenism_religion.23.b: "Lasciamo che il popolo sopporti il peso."

 hellenism_religion.24.title: "Deisidaimonia"
 hellenism_religion.24.desc: "Una crescente inquietudine si è posata nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], e si aggrappa soprattutto a [target_character.GetName]. Piccoli presagi diventano grandi, i sogni diventano avvertimenti e persino coincidenze innocue sono trattate come messaggi dall'alto.\n\nUna tale paura può essere utile quando genera cautela, ma può anche far marcire la volontà di agire. Se [target_character.GetShortNameWithNoTooltip] non riesce a liberarsi di questi pensieri, il nostro governo potrebbe presto essere guidato più dalla superstizione che dalla ragione."
 hellenism_religion.24.a: "Meglio cauti che imprudenti."
 hellenism_religion.24.b: "Dobbiamo pensare oltre la superstizione."

 hellenism_religion.25.title: "Sacrifici per la Guerra"
 hellenism_religion.25.desc: "La guerra ha il modo di consumare tutto, e persino i soldati più temprati iniziano a guardare ai cieli quando il destino diventa incerto. I sacerdoti insistono che la nostra lotta in [target_war.GetName] non sarà decisa dal solo acciaio, e che gli dei devono essere onorati se vogliamo resistere a ciò che ci attende.\n\nViene proposto un sacrificio costoso, pensato per impressionare il divino e rafforzare lo spirito del nostro popolo. Se rifiutiamo, potremmo risparmiare le nostre monete, ma rischiamo di lasciar marcire il dubbio nei ranghi e di far sentire agli dei solo il nostro silenzio."
 hellenism_religion.25.a: "Non badiamo a spese."
 hellenism_religion.25.b: "Vinceremo senza le loro teatralità."
 we_will_win_the_ongoing_conflict_without_gods_tt: "Non faremo affidamento sulla superstizione divina per vincere il conflitto in corso"

 hellenism_religion.26.title: "[target_god.GetNameWithNoTooltip] Ascolta la Nostra Supplica"
 hellenism_religion.26.desc: "L'incenso è stato denso, gli inni alti e gli altari non sono mancati di offerte. I sacerdoti affermano che la nostra devozione ha raggiunto le orecchie dell'Olympus, e che gli dei ora indugiano abbastanza vicini da rispondere, grazie a questi sforzi.\n\nEppure la divinità non è mai generosa senza condizioni. Se ora chiediamo una benedizione, dobbiamo accettare che [target_god.GetName] possa pretendere un prezzo, e che una risposta possa cambiare il corso del nostro [ROOT.GetCountry.GetFlavorRank] in modi che non possiamo prevedere."
 hellenism_religion.26.a: "Lasciamo che [target_god.GetNameWithNoTooltip] risponda."
 hellenism_religion.26.b: "Non inviteremo il loro giudizio."
 gods_reward_our_piety_tt: "[target_god.GetName] ricompensa la nostra pietà con [gold|e]"
 gods_imbue_stability_tt: "I favori di [target_god.GetName] aumentano la nostra [stability|e]"
 gods_sent_capable_character_tt: "Attraverso [target_character_2.GetName], [target_god.GetName] si manifesterà"

 hellenism_religion.27.title: "Il Paradosso di un Filosofo"
 hellenism_religion.27.desc: "Un filosofo dalla lingua tagliente di nome [target_character.GetName] ha iniziato a parlare nella [ROOT.GetCountry.GetGovernment.GetCourtTitle], trasformando la certezza in dubbio a ogni frase. I cortigiani si radunano ad ascoltare, metà divertiti e metà turbati, mentre persino le verità semplici vengono disfatte come fili strappati da una veste.\n\nLa saggezza può essere un dono, ma può anche essere un fastidio quando rifiuta di inchinarsi. Se indulgiamo questo pensatore, la [ROOT.GetCountry.GetGovernment.GetCourtTitle] potrebbe diventare più saggia, o potrebbe diventare inquieta, perché le idee hanno l'abitudine di diffondersi oltre le sale che per prime le contengono."
 hellenism_religion.27.a: "Lasciamo continuare il discorso."
 hellenism_religion.27.b: "Basta enigmi. Mandiamo via [target_character.GetHerHim]."

 hellenism_religion.28.title: "La Saggezza di [ShowGodNameWithNoTooltip('athena_god')]"
 hellenism_religion.28.desc: "In tempi di pace, l'ambizione si placa e la prudenza cresce, e i sacerdoti parlano spesso di [ShowGodName('athena_god')]. Insistono che la saggezza non sia solo una virtù, ma un'arma, meglio forgiata quando il [ROOT.GetCountry.GetFlavorRank] non è distratto dalla guerra.\n\nUna proposta è posta davanti a noi, costosa ma sensata, e promette ordine dove c'è spreco e chiarezza dove c'è dubbio. Se rifiutiamo, potremo tenere le nostre monete, ma i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] non dimenticheranno che abbiamo voltato le spalle al consiglio di una dea."
 hellenism_religion.28.a: "Paghiamo il costo della saggezza."
 hellenism_religion.28.b: "Non abbiamo bisogno di alcuna dea che pensi per noi."
 because_athena_omen_active_desc: "A causa di un [omen|e] di [ShowGodName('athena_god')] attualmente attivo, scalato con la nostra [religious_unity|e]"
 if_athena_omen_was_active_tt: "Se un [omen|e] di [ShowGodName('athena_god')] fosse attualmente attivo, il bonus di questa [event_option|e] sarebbe più forte"
 our_denial_angers_the_clergy_tt: "Il nostro rifiuto farà sicuramente adirare i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')]"

 hellenism_religion.29.title: "[target_god.GetNameWithNoTooltip] Pretende un Sacrificio"
 hellenism_religion.29.desc: "I sacerdoti arrivano con volti gravi e voci urgenti, insistendo che il malcontento divino penda sul nostro [ROOT.GetCountry.GetFlavorRank]. Affermano che i segni sono chiari, e che solo sacrifici a [target_god.GetName] possono restaurare il favore prima che la sventura diventi disastro.\n\nL'oro è l'offerta più semplice, e può essere dato senza esitazione, ma l'Olympus raramente si accontenta di sole monete. Se scegliamo un sacrificio più costoso, potremmo ottenere un favore maggiore, ma lasceremo anche cicatrici sulla terra, e il popolo ricorderà chi lo ordinò."
 hellenism_religion.29.a: "Offriamo oro sull'altare."
 hellenism_religion.29.b: "Lasciamo che la terra stessa sopporti il peso."
 hellenism_religion.29.c: "Rifiutiamo questa richiesta."

 hellenism_religion.30.title: "Il Culto di un Mercenario"
 hellenism_religion.30.desc: "Strani sussurri si levano da [target_province.GetName], portati dai viaggiatori e ripetuti da locali nervosi. Un culto si è formato nelle ombre, devoto a un ideale mercenario, lodando la forza sopra ogni cosa e raccogliendo seguaci tramite riti segreti e promesse di protezione. Una delle sue figure principali, [target_character.GetName], si è fatta avanti, desiderosa di entrare nella scena politica del nostro [ROOT.GetCountry.GetFlavorRank] e parlare a suo nome come ex mysthios, sostenendo che la loro devozione può essere trasformata a nostro vantaggio.\n\nTuttavia, i sussurri nell'ombra tradiscono il programma segreto del culto di dominio, una fame insaziabile di potere. Se li accogliamo, potremmo ottenere influenza dove la fede è debole, ma potremmo anche invitare un marciume nascosto nel cuore della nostra [ROOT.GetCountry.GetGovernment.GetCourtTitle]."
 hellenism_religion.30.a: "Lasciamoli entrare e osserviamoli da vicino."
 hellenism_religion.30.b: "Ricacciamoli nelle ombre."
 cult_operates_shadows_tt: "Il culto continuerà a operare dalle ombre..."
 hellenism_religion.empty: ""

 # Neoplatonism Events

 hellenism_religion.32.title: "La Fonte di Tutto l'Essere"
 hellenism_religion.32.desc: "Un filosofo alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] ha completato un'opera di singolare ambizione. In prosa misurata e implacabile, [target_character.GetSheHe] sostiene che il primo principio — la fonte da cui tutti gli dei e tutta la creazione fluiscono verso l'esterno, come luce da un sole inesauribile — non sia un dio tra gli dei, ma il fondamento stesso della divinità. Il pantheon tradizionale resta reale, insiste [target_character.GetSheHe], ma ogni dio è un aspetto, un'emanazione di quella singola fonte ineffabile: ordine che fluisce in intelligenza, intelligenza in anima, anima in materia.\n\nIl trattato viene già copiato in tutta la [ROOT.GetCountry.GetGovernment.GetCourtTitle]. Le sue idee sono vive e si diffonderanno che agiamo o meno."
 hellenism_religion.32.a: "Commissioniamo copie e distribuiamole ampiamente."
 hellenism_religion.32.b: "Lasciamo che l'idea si regga sui propri meriti."

 hellenism_religion.33.title: "La Questione Cristiana"
 hellenism_religion.33.desc: "Un vescovo di notevole dottrina arriva a [ROOT.GetCountry.GetGovernment.GetCourtTitle], senza portare né spada né rimostranze, ma solo domande. [target_character.GetName] ha dedicato [target_character.GetHerHis] vita alla filosofia platonica e sostiene con quieta convinzione che il Dio dei cristiani e il primo principio dei filosofi siano una cosa sola. La Trinità, afferma [target_character.GetSheHe], è semplicemente la triade dell'Uno, del Nous e dell'Anima, rivestita di parole diverse.\n\nL'argomento non è privo di forza, e [target_character.GetSheHe] parla con la calma attenta di chi ha già ascoltato ogni controargomentazione. Che accettiamo il confronto o lo rifiutiamo, la [target_character.GetHerHis] visita non passerà inosservata, a [ROOT.GetCountry.GetCapital.GetName] o altrove." 
 hellenism_religion.33.a: "Accogliamo il dialogo. Le idee non sono contagio."
 hellenism_religion.33.b: "Rifiutiamo l'equazione. Il primo principio non è il loro Dio."

 hellenism_religion.34.title: "L'Anima del Mondo"
 hellenism_religion.34.desc: "I filosofi della [ROOT.GetCountry.GetGovernment.GetCourtTitle] hanno parlato dell'Anima del Mondo — quell'emanazione del primo principio che scorre attraverso tutta la creazione vivente, animando campo e fiume, corpo e respiro. Due dei grandi dei, sostengono, sono meglio compresi non come sovrani del mare e del cielo, ma come aspetti appaiati di quest'Anima: la forza che si muove attraverso tutte le cose e ritorna, sempre, alla sua fonte.\n\nA [target_province.GetName], dove le stagioni sono state benevole, il popolo sembra sentire questo argomento nelle ossa. La terra è generosa, e i filosofi dicono che questa è la Provvidenza resa visibile — l'Anima del Mondo in armonia con L'Uno."
 hellenism_religion.34.a: "Commissioniamo opere di custodia. Curare la terra è curare l'Anima."
 hellenism_religion.34.b: "Pubblichiamo una dichiarazione teologica. Che la dottrina sia messa per iscritto."
 hellenism_religion_34_work_of_art: "Psyche Kosmou"
 hellenism_religion_34_work_of_art_desc: "Uno studio teologico sulla filosofia platonica, che sostiene che l'Anima del Mondo sia la forza animatrice di tutti gli esseri viventi, che scorre attraverso la natura e ritorna alla sua fonte in L'Uno."

 hellenism_religion.35.title: "L'Anima Ascendente"
 hellenism_religion.35.desc: "Giunge voce alla [ROOT.GetCountry.GetGovernment.GetCourtTitle] che [target_character.GetName], il filosofo la cui opera ha plasmato in silenzio il pensiero di una generazione, sta morendo. Nelle ultime settimane, [target_character.GetSheHe] ha insegnato senza sosta — non dai libri, ma dalla contemplazione diretta, descrivendo con linguaggio attento i tre stadi dell'ascesa: prima il volgersi dell'anima dalla materia, poi l'allineamento della facoltà razionale con Nous, e infine — e qui la voce di [target_character.GetHerHis] scende quasi al silenzio — il momento dell'unione con L'Uno stesso, oltre ogni pensiero, oltre ogni essere.\n\nIl sovrano è stato invitato ad assistere. [target_character.GetName] ha chiesto solo che l'insegnamento non vada perduto."
 hellenism_religion.35.a: "Registriamo e distribuiamo le ultime parole di [target_character.GetHerHis]."
 hellenism_religion.35.b: "Fondiamo una scuola in nome di [target_character.GetHerHis]."
 target_character_ascends_to_the_one_tt: "[target_character.GetName] muore serenamente, avendo detto tutto ciò che poteva essere detto."

 hellenism_religion.36.title: "I Restaurazionisti Olimpici"
 hellenism_religion.36.desc: "Non tutti nel [ROOT.GetCountry.GetFlavorRank] hanno fatto pace con la nuova teologia. Una fazione tra i [ROOT.GetCountry.GetGovernment.GetEstateName('clergy_estate')] — guidata in pubblico da [target_character.GetName] — sta alzando la voce nelle sue obiezioni. Il loro argomento è semplice e sentito nelle viscere più che nella mente: il popolo ha bisogno di Zeus, Athena, Ares e Poseidon. Non simboli. Non emanazioni. Non aspetti di un principio ineffabile che non può essere nominato, supplicato o compiaciuto. Ha bisogno degli dei dell'Olympus, con i loro volti, i loro templi, la loro fame di sacrificio.\n\nL'Uno astratto, dichiara [target_character.GetSheHe], non può ascoltarci. I vecchi dei potevano. [target_character.GetName] presenta apertamente una petizione per la rimozione della dottrina monista e il ritorno al culto tradizionale."
 hellenism_religion.36.a: "Difendiamo la dottrina. Mettiamo a tacere la fazione."
 hellenism_religion.36.b: "Consentiamo una disputa formale. Lasciamo parlare entrambe le parti."
 hellenism_religion.36.c: "Rimuoviamo la dottrina monista. Torniamo alla fede olimpica."
