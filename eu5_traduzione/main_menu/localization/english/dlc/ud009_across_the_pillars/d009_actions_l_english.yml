l_english:
 proclaim_pase_foral: "Proclama il Pase Foral"
 proclaim_pase_foral_desc: "Invochiamo il diritto Basco del #italic pase foral#!, un'antica prerogativa in virtù della quale le signorie Basche possono riesaminare e sospendere i decreti regi ritenuti contrari ai loro fueros. Questa proclamazione risponde alle #Y aspettative della nobiltà#! e rafforza la #Y stabilità#!, #Y limitando temporaneamente il campo d'azione della Corona#!."
 summon_santa_hermandad: "Convoca la Santa Hermandad"
 summon_santa_hermandad_desc: "Mobilitiamo la Santa Hermandad, una confraternita finanziata dalla Corona, composta da guardie rurali e miliziani, che la Castiglia schierava per reprimere il banditismo e far rispettare l'ordine regio in tutto il regno. La sua mobilitazione rafforza le nostre #Y riserve militari#!, spezza lo #Y slancio dei ribelli#! e rende il mantenimento della stabilità #Y meno costoso#!."
 proclaim_pase_foral_action: "$proclaim_pase_foral$"
 proclaim_pase_foral_active: "Proclamazione del Pase Foral"
 proclaim_pase_foral_action_progress: "$proclaim_pase_foral$ in vigore"
 proclaim_pase_foral_action_progress_wordier: "$proclaim_pase_foral_action_progress$"
 proclaim_pase_foral_action_progress_tooltip: "$proclaim_pase_foral_action_progress$"
 summon_santa_hermandad_action: "$summon_santa_hermandad$"
 summon_santa_hermandad_active: "Convocazione della Santa Hermandad"
 summon_santa_hermandad_action_progress: "$summon_santa_hermandad$ in vigore"
 summon_santa_hermandad_action_progress_wordier: "$summon_santa_hermandad_action_progress$"
 summon_santa_hermandad_action_progress_tooltip: "$summon_santa_hermandad_action_progress$"
