l_english:
 holy_war.11.title: "Predoni alla Frontiera"
 holy_war.11.desc: "Una #italic cabalgada#! proveniente [cabalgada_raider.Custom('IT_Dalla')][cabalgada_raider.GetName] si è riversata sulle nostre terre di confine, incendiando villaggi e portando via tutto ciò che poteva prima di ripassare la frontiera. Le nostre terre indifese sono state devastate. Mobilitiamo le leve per presidiare le marche, o lasciamo passare l'affronto?"
 holy_war.11.a: "Mandiamo le nostre leve verso la frontiera!"
 holy_war.11.b: "Non c'è nulla che possiamo fare."

 holy_war.12.title: "Richiesta di Tributo"
 holy_war.12.desc: "Emissari [parias_demander.Custom('IT_Della')][parias_demander.GetName] giungono alla nostra corte con un messaggio inequivocabile: una [crusade|e] sta per essere bandita contro di noi e, a meno che non paghiamo un tributo, i suoi eserciti marceranno sulle nostre terre. I nostri consiglieri ci avvertono che il nostro oro non farà che guadagnare tempo, placando la loro sete di sangue senza mai estinguerla. Paghiamo per rimandare la resa dei conti, o li sfidiamo e ci prepariamo alla tempesta?"
 holy_war.12.a: "Paghiamo il tributo per guadagnare tempo."
 holy_war.12.a.tt: "Ritarda la [crusade|e], riducendone la preparazione di #G 30#! e abbassandone lo zelo religioso di #G 10#!"
 holy_war.12.b: "Non ci lasceremo intimidire. Che vengano."
 holy_war.12.b.tt: "Aumenta lo zelo religioso della [crusade|e] di #R 10#!"

 holy_war.15.title: "Predoni dal Sud"
 holy_war.15.desc: "Un #italic ḡazw#! proveniente [ghazw_raider.Custom('IT_Dalla')][ghazw_raider.GetName] ha spazzato le nostre regioni di confine, incendiando villaggi e portando via tutto ciò che poteva prima di ripassare la frontiera. Le nostre terre indifese giacciono saccheggiate. Chiamiamo alle armi le nostre truppe per proteggere le marche, o lasciamo passare l'affronto?"
 holy_war.15.a: "Mandiamo le nostre leve verso la frontiera!"
 holy_war.15.b: "Non c'è nulla che possiamo fare."

 holy_war.16.title: "Predoni dal Mare"
 holy_war.16.desc: "Corsari [shore_raider.Custom('IT_Della')][shore_raider.GetName] hanno attaccato la nostra costa, saccheggiando i porti e portando via la nostra gente in catene prima che le loro vele scomparissero all'orizzonte. Le nostre coste indifese giacciono devastate. Chiamiamo alle armi le nostre truppe per proteggere il litorale, o lasciamo passare l'affronto?"
 holy_war.16.a: "Mandiamo le nostre leve verso la costa!"
 holy_war.16.b: "Non c'è nulla che possiamo fare."
