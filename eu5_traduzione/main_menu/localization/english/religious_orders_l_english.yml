 # Iberian military orders
 order_of_calatrava_religious_order: "Ordine di Calatrava"
 order_of_calatrava_religious_order_desc: "Fondato nel 1158 dall'abate cistercense Raimondo di Fitero per tenere la fortezza di Calatrava dopo che i Templari l'avevano abbandonata. Fu il primo ordine militare nativo di Castiglia."
 order_of_santiago_religious_order: "Ordine di Santiago"
 order_of_santiago_religious_order_desc: "Istituito verso il 1170 per proteggere i pellegrini sulla via per Santiago de Compostela e per condurre la guerra santa contro i Mori."
 order_of_alcantara_religious_order: "Ordine di Alcántara"
 order_of_alcantara_religious_order_desc: "Nato come Ordine di San Julián del Pereiro verso il 1166, assunse il nome di Alcántara dopo che quella città gli fu concessa nel 1218."
 order_of_christ_religious_order: "Ordine di Cristo"
 order_of_christ_religious_order_desc: "Istituito nel 1319 dal re Dinis del Portogallo come erede dei soppressi Templari, ereditandone le proprietà portoghesi e stabilendo il suo convento a Tomar."
 order_of_avis_religious_order: "Ordine di Avis"
 order_of_avis_religious_order_desc: "Un ordine portoghese sotto la regola benedettina, intitolato alla città di Avis a esso concessa verso il 1211."
 order_of_montesa_religious_order: "Ordine di Montesa"
 order_of_montesa_religious_order_desc: "Creato nel 1317 dal re Giacomo II d'Aragona per rilevare i possedimenti dissolti dei Templari e degli Ospitalieri nella Corona d'Aragona, con sede al Castello di Montesa a Valencia."

 benedictine_order_religious_order: "Ordine Benedettino"
 benedictine_order_religious_order_desc: "I monaci neri che seguono la Regola scritta da Benedetto da Norcia nel sesto secolo, fondamento del monachesimo occidentale. I loro abati sono tra i grandi signori della Chiesa."
 cistercian_order_religious_order: "Ordine Cistercense"
 cistercian_order_religious_order_desc: "L'austera riforma di Cîteaux, fondata nel 1098 per tornare a una lettura rigorosa della regola benedettina. I suoi monaci bianchi e fratelli laici sono rinomati per dissodare la terra e lavorarla tramite le loro cascine."
 augustine_order_religious_order: "Ordine Agostiniano"
 augustine_order_religious_order_desc: "Comunità di sacerdoti che vivono in comune sotto la Regola di Sant'Agostino, né del tutto monaci né clero secolare. Le loro case servono le cattedrali, gestiscono scuole e ospedali e guidano le parrocchie."
 dominican_order_religious_order: "Ordine Dominicano"
 dominican_order_religious_order_desc: "L'Ordine dei Predicatori, fondato da Domenico di Guzmán per combattere l'eresia con la dottrina e la parola. I suoi frati occupano le cattedre delle università e discutono di dottrina dai grandi pulpiti della Cristianità."
 franciscan_order_religious_order: "Ordine Franciscano"
 franciscan_order_religious_order_desc: "I frati minori di Francesco d'Assisi, votati alla povertà assoluta a imitazione di Cristo. Camminano tra i poveri delle città, chiedendo l'elemosina e predicando con l'esempio."

