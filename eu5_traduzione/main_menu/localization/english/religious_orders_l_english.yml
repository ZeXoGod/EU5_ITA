 crusaders_calling: "Crociati"
 crusaders_calling_desc: "Un ordine militante incaricato di combattere i pagani su una frontiera di crociata attiva."
 wardens_calling: "Guardiani"
 wardens_calling_desc: "Un ordine di frontiera incaricato di presidiare un confine di lunga data."
 confidants_calling: "Confidenti"
 confidants_calling_desc: "Una confraternita legata alla corona al servizio della dinastia regnante e della sua amministrazione."
 mariners_calling: "Marinai"
 mariners_calling_desc: "Un ordine crociato marittimo incaricato di combattere per mare e di esplorare oltre la Cristianità."
 contemplatives_calling: "Contemplativi"
 contemplatives_calling_desc: "Un ordine claustrale dedicato alla preghiera, alla liturgia e al ritiro ascetico dal mondo."
 scholars_calling: "Studiosi"
 scholars_calling_desc: "Un ordine didattico che copia manoscritti, istruisce il clero e promuove le arti e le scienze."
 cultivators_calling: "Coltivatori"
 cultivators_calling_desc: "Un ordine riformatore di monaci e fratelli laici che dissodano terre incolte e le lavorano tramite le loro cascine."
 preachers_calling: "Predicatori"
 preachers_calling_desc: "Un ordine di frati devoti alla predicazione, alla conversione dei non credenti e alla difesa della dottrina."
 almoners_calling: "Elemosinieri"
 almoners_calling_desc: "Frati votati alla povertà che chiedono l'elemosina e la distribuiscono, assistendo i poveri e i malati."
 confessors_calling: "Confessori"
 confessors_calling_desc: "Un ordine di frati che vivono in comunità, ascoltano le confessioni e guidano le anime con mano gentile."

