 # Types
 iberian_military_order_type: "Ordine Militare Iberico"
 iberian_military_order_type_desc: "Nati dalla Reconquista, queste confraternite legano la spada del cavaliere al voto del monaco. I loro [holdings|E] tengono le marche contro il Moro, levando truppe dalle loro proprietà e presidiando dove il potere della corona si affievolisce."

 RELIGIOUS_ORDER_TYPE_ACTIVE_ORDERS_TITLE: "Ordini Attivi"
 RELIGIOUS_ORDER_TYPE_CALLINGS_TITLE: "[callings|E] Disponibili"
 monastic_order_type: "Ordine Monastico"
 monastic_order_type_desc: "Una confraternita cattolica contemplativa di monaci i cui [holdings|E] sono dedicati alla preghiera, allo studio e alla lavorazione della terra."
 mendicant_order_type: "Ordine Mendicante"
 mendicant_order_type_desc: "Frati cattolici votati alla povertà che chiedono l'elemosina invece di possedere terre, predicando, insegnando e prendendosi cura dei poveri nelle nostre città e villaggi."

