 hre_circle_levy_request_desc: "Richiedi che i Circoli Imperiali raccolgano leve per l'Impero. I capi dei Circoli saranno ricompensati per la loro cooperazione."
 hre_enforce_circle_landfriede: "Imponi la Landfriede del Circolo"
