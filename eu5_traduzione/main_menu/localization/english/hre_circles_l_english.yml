 bribe_imperial_circle: "Corrompi il Circolo Imperiale"
 bribe_imperial_circle_desc: "Paga il Capo di un Circolo Imperiale e ogni membro del suo circolo affinché votino per la nostra proposta alla Dieta Imperiale. Il Capo del Circolo riceve l'intera tangente di base, mentre ogni altro membro riceve il 25% di tale importo. Il voto di ogni membro è vincolato alla scelta dell'Imperatore fino alla chiusura della risoluzione."
 bribe_imperial_circle_act: "Corrompi [SCOPE.sCountry('target').GetName] affinché sostenga la nostra proposta alla Dieta."
 bribe_imperial_circle_effect_text: "[SCOPE.sCountry('actor').GetName] corrompe il circolo [SCOPE.sCountry('target').Custom('IT_Di')][SCOPE.sCountry('target').GetName] affinché sostenga la proposta imperiale."
 bribe_imperial_circle_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha corrotto il circolo [SCOPE.sCountry('target').Custom('IT_Di')][SCOPE.sCountry('target').GetName] affinché sostenesse la proposta imperiale."
 bribe_imperial_circle_members_tt: "Ogni altro membro del circolo [SCOPE.sCountry('target').Custom('IT_Di')][SCOPE.sCountry('target').GetName] riceve [SCOPE.GetValue('bribe_member_share')|0V]@gold! e il suo [Concept('vote', 'voto')|e] nella proposta attiva della Dieta Imperiale viene vincolato alla scelta dell'Imperatore."
 BRIBE_IMPERIAL_CIRCLE_CTRL_HINT: "Corrompi l'intero [imperial_circle|E]"

 approve_imperial_circle_proposal: "Approva la proposta"
 approve_imperial_circle_proposal_desc: "In qualità di Capo del Circolo, vincola ogni membro di questo circolo, noi compresi, a votare a favore della proposta attualmente davanti alla Dieta Imperiale. Non è richiesto alcun pagamento, ma il vincolo resta in vigore fino alla chiusura della risoluzione."
 approve_imperial_circle_proposal_act: "Sollecita [SCOPE.sImperialCircle('target').GetName] a votare a favore della proposta."
 approve_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] sollecita [SCOPE.sImperialCircle('target').GetName] a votare a favore della proposta imperiale."
 approve_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha sollecitato [SCOPE.sImperialCircle('target').GetName] a votare a favore della proposta imperiale."
 approve_imperial_circle_proposal_members_tt: "Ogni membro di [SCOPE.sImperialCircle('target').GetName] ha il proprio [Concept('vote', 'voto')|e] nella proposta attiva della Dieta Imperiale vincolato alla linea proposta."

 oppose_imperial_circle_proposal: "Opponiti alla proposta"
 oppose_imperial_circle_proposal_desc: "In qualità di Capo del Circolo, vincola ogni membro di questo circolo, noi compresi, a votare contro la proposta attualmente davanti alla Dieta Imperiale. I voti sono vincolati alla linea attuale se ne esiste una registrata, altrimenti il circolo si astiene."
 oppose_imperial_circle_proposal_act: "Sollecita [SCOPE.sImperialCircle('target').GetName] a votare contro la proposta."
 oppose_imperial_circle_proposal_effect_text: "[SCOPE.sCountry('actor').GetName] sollecita [SCOPE.sImperialCircle('target').GetName] a votare contro la proposta imperiale."
 oppose_imperial_circle_proposal_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha sollecitato [SCOPE.sImperialCircle('target').GetName] a votare contro la proposta imperiale."
 oppose_imperial_circle_proposal_members_tt: "Ogni membro di [SCOPE.sImperialCircle('target').GetName] ha il proprio [Concept('vote', 'voto')|e] nella proposta attiva della Dieta Imperiale vincolato alla linea attuale, o all'astensione se non esiste alcuna linea registrata."

 call_imperial_circle_to_war: "Chiama il Circolo in guerra"
 call_imperial_circle_to_war_desc: "Invoca un Capo del Circolo affinché porti il sostegno militare del suo circolo nella tua guerra attuale."
 call_imperial_circle_to_war_act: "Chiama il circolo [SCOPE.sCountry('recipient').Custom('IT_Di')][SCOPE.sCountry('recipient').GetName] a unirsi alla guerra."
