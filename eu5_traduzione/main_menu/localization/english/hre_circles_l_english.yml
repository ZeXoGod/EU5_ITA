 appeal_to_emperor_reject_effect_text: "[SCOPE.sCountry('recipient').GetName] respinge l'appello [SCOPE.sCountry('actor').Custom('IT_Di')][SCOPE.sCountry('actor').GetName]."
 appeal_to_emperor_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] ha respinto l'appello [SCOPE.sCountry('actor').Custom('IT_Di')][SCOPE.sCountry('actor').GetName]."
 INCOMING_OFFER_appeal_to_emperor: "[SCOPE.sCountry('actor').GetName] si appella a noi perché interveniamo nella disputa per la guida del suo Circolo Imperiale. Accettare ridurrà di 8 la soddisfazione del suo circolo, penalizzerà il prestigio del capo del circolo e ci conferirà prestigio e Autorità Imperiale.\n\n$INFO$"
