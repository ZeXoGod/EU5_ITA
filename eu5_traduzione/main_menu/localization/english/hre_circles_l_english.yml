 appeal_to_circle_diet_reject_effect_text_past: "[SCOPE.sCountry('recipient').GetName] ha respinto la richiesta [SCOPE.sCountry('actor').Custom('IT_Di')][SCOPE.sCountry('actor').GetName]."
 INCOMING_OFFER_appeal_to_circle_diet: "[SCOPE.sCountry('actor').GetName] richiede che gli sia concessa assistenza finanziaria. Accettare gli conferirà un quinto del nostro reddito annuo e lo farà apparire più legittimo. Respingere questa proposta ridurrà la soddisfazione del nostro circolo.\n\n$INFO$"
