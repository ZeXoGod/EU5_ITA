 INCOMING_OFFER_request_circle_infrastructure_expansion: "[SCOPE.sCountry('actor').GetName] richiede l'espansione della propria infrastruttura militare. Accettare gli consente di concentrarsi sul rafforzamento dei collegamenti stradali e sulla costruzione di edifici, riducendo però le sue capacità militari per i prossimi 10 anni.\n\n$INFO$"
