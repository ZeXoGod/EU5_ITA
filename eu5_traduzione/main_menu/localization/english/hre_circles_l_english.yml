 imperial_circles.1.title: "I Circoli Imperiali vengono istituiti"
 imperial_circles.1.desc: "Il periodo di formazione si è concluso. I Circoli Imperiali sono stati fissati e i loro capi governeranno gli affari dell'Impero. Inizia un nuovo capitolo per il Sacro Romano Impero."
 imperial_circles.1.a: "Per la gloria dell'Impero!"

 imperial_circles.2.title: "Fondi mancanti"
 imperial_circles.2.desc: "Nella recente Dieta Imperiale, il nostro Circolo ha sostenuto la riforma proposta della Costituzione Imperiale. Questo sostegno è stato dato con l'intesa comune, tra i membri del nostro circolo, che noi, in qualità di Capo del Circolo, avremmo distribuito fondi tra loro. Giustificata o meno, la nostra mancata risposta a queste aspettative ha portato a diverse lamentele per il nostro abuso di potere, trattenendo fondi destinati ai membri del circolo. Se non agiamo in merito a queste lamentele, ciò potrebbe danneggiare seriamente la nostra guida in futuro."
 imperial_circles.2.a: "Hanno ragione, dovremmo distribuirli ora."
 imperial_circles.2.b: "Si sbagliano, non c'è stata alcuna corruzione."
 imperial_circles.2.c: "Appelliamoci ai nostri amici [GetUniqueInternationalOrganization('hre').GetLeaderCountry.Custom('IT_In')][GetUniqueInternationalOrganization('hre').GetLeaderCountry.GetNameWithNoTooltip]."

 imperial_circles.11.title: "Malcontento nel Circolo"
 imperial_circles.11.desc: "I membri del nostro circolo stanno diventando irrequieti. Se non agiamo presto, la nostra autorità come Capo del Circolo potrebbe essere sfidata apertamente."
 imperial_circles.11.a: "Distribuiamo fondi d'emergenza per allentare le tensioni."
 imperial_circles.11.b: "Lasciamoli lamentare - abbiamo preoccupazioni più grandi."

 imperial_circles.12.title: "I Principi chiedono un cambiamento"
 imperial_circles.12.desc: "La frustrazione all'interno del circolo ha raggiunto un punto di rottura. I nostri membri mettono apertamente in discussione la nostra guida. Un'elezione potrebbe essere imminente."
 imperial_circles.12.a: "Dobbiamo agire prima che sia troppo tardi."

 imperial_circles.20.title: "Il nostro voto è stato comprato"
 imperial_circles.20.desc: "[SCOPE.sCountry('actor').GetName] ha pagato il capo del nostro Circolo Imperiale, [SCOPE.sCountry('target').GetName], affinché sostenga la proposta attualmente davanti alla Dieta Imperiale. Abbiamo ricevuto [SCOPE.GetValue('received_bribe')|0V]@gold! come nostra quota, e il nostro [Concept('vote', 'voto')|e] nella risoluzione attiva è ora vincolato alla scelta dell'Imperatore fino alla sua chiusura."
 imperial_circles.20.a: "L'oro non si rifiuta."

 imperial_circles.50.title: "Sfida per la guida del Circolo"
 imperial_circles.50.desc: "Ci siamo fatti avanti per sfidare [recipient.GetName] per la guida del nostro Circolo Imperiale.\n\nLa sua debolezza e la sua negligenza non possono più essere tollerate, e molti sicuramente si schiererebbero al nostro fianco nelle nostre lamentele. Se riusciremo a presentarci come un capo chiaramente migliore e più forte, cederà alle nostre richieste, ma non riuscirci danneggerà senza dubbio il modo in cui siamo percepiti non solo dai paesi stranieri, ma anche dal nostro popolo."
 imperial_circles.50.a: "Portiamo avanti la sfida."
 imperial_circles.50.b: "Ritiriamoci dalla sfida."
 imperial_circles.53.title: "Sfida respinta"
 imperial_circles.53.desc: "La nostra sfida contro [recipient.GetName] per la guida del nostro Circolo Imperiale è fallita. Il nostro prestigio non è stato all'altezza del suo, e la nostra posizione ha sofferto per il tentativo. Dobbiamo attendere prima di insistere di nuovo sulla questione."
 imperial_circles.53.a: "Attenderemo il nostro momento."

 imperial_circles.51.title: "Destituiti come Capo del Circolo"
 imperial_circles.51.desc: "Un rivale ha sfidato con successo la nostra guida. Siamo stati privati del titolo di Capo del Circolo e dobbiamo ricostruire la nostra posizione all'interno del circolo."
 imperial_circles.51.a: "Questa umiliazione non sarà dimenticata."

 imperial_circles.52.title: "Guida del Circolo confermata"
 imperial_circles.52.desc: "Uno sfidante ha tentato di destituirci, ma il suo prestigio si è rivelato insufficiente. La nostra posizione di Capo del Circolo resta sicura."
 imperial_circles.52.a: "La nostra autorità non si spezza così facilmente."

 imperial_circles.70.title: "Eletti Capo del Circolo"
 imperial_circles.70.desc: "Con il capo precedente non più tra i nostri ranghi, il circolo ha guardato a noi perché assumessimo la guida. Ora siamo il Capo del Circolo."
 imperial_circles.70.a: "Guideremo il circolo con distinzione."

 imperial_circles.71.title: "Il Circolo è senza capo"
 imperial_circles.71.desc: "Uno dei Circoli Imperiali è rimasto senza un candidato qualificato che ne assuma la guida. L'autorità dell'Imperatore viene minata quando i circoli restano senza governo."
 imperial_circles.71.a: "Dobbiamo nominare qualcuno noi stessi."

 imperial_circles.80.title: "La Corona Imperiale cambia tutto"
 imperial_circles.80.desc: "Ora indossiamo la Corona Imperiale. In qualità di Imperatore, non possiamo ricoprire contemporaneamente il ruolo di Capo del Circolo - i due uffici esigono lealtà indivisa. Rinunciamo alla guida del nostro circolo affinché un altro possa farsi avanti."
 imperial_circles.80.a: "L'Impero deve venire prima di tutto."
