 distribute_imperial_grant: "Distribuisci una sovvenzione imperiale"
 distribute_imperial_grant_desc: "Distribuisci oro dal tuo tesoro ai membri del tuo circolo, migliorando le relazioni e la soddisfazione del circolo."
 distribute_imperial_grant_act: "Distribuisci oro ai membri del tuo circolo."
 distribute_imperial_grant_tt: "Spendiamo [SCOPE.GetValue('total_grant')|2V]@gold! (il 20% della nostra [economical_base|e]), distribuito equamente tra i membri non capi del nostro [imperial_circle|e]. Ogni destinatario ottiene [ShowModifier('received_imperial_circle_grant')] per 2 anni e [ShowBiasValue('opinion_received_imperial_grant')|+=2] [opinion|e] nei nostri confronti."
 distribute_imperial_grant_effect_text: "[SCOPE.sCountry('actor').GetName] distribuisce una Sovvenzione Imperiale al proprio circolo."
 distribute_imperial_grant_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha distribuito una Sovvenzione Imperiale al proprio circolo."

 demand_circle_loyalty: "Pretendi fedeltà dal Circolo"
 demand_circle_loyalty_desc: "Affermiamo la nostra autorità sui membri del nostro circolo. Otteniamo prestigio e reputazione diplomatica per 3 anni, ma i membri risentono dell'imposizione e la soddisfazione del circolo cala."
 demand_circle_loyalty_act: "Afferma la tua autorità sui membri del tuo circolo."
 demand_circle_loyalty_tt: "Otteniamo [ShowModifier('imposed_circle_authority')] per 3 anni. Ogni membro non capo del nostro [imperial_circle|e] ottiene [ShowModifier('pressured_circle_loyalty')] per 3 anni e [ShowBiasValue('opinion_demanded_loyalty')|+=2] [opinion|e] nei nostri confronti. La soddisfazione del Circolo cala di 5."
 demand_circle_loyalty_effect_text: "[SCOPE.sCountry('actor').GetName] pretende fedeltà dal proprio circolo."
 demand_circle_loyalty_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha preteso fedeltà dal proprio circolo."

 reform_coinage_in_circle: "Riforma la monetazione del Circolo"
 reform_coinage_in_circle_desc: "L'Impero ha posto nelle nostre mani l'autorità sulla monetazione regionale. Attuare una riforma della nostra moneta e del suo uso aiuterebbe il flusso economico di ogni membro del nostro circolo, aumentando al contempo la nostra posizione all'interno del Circolo. Purtroppo ciò avverrebbe a scapito della capacità delle nostre zecche."
 reform_coinage_in_circle_act: "Riforma la monetazione all'interno del nostro Circolo."
 reform_coinage_in_circle_tt: "Otterremo [ShowModifier('reformed_circle_coinage_leader')], mentre ogni membro del nostro circolo otterrà [ShowModifier('reformed_circle_coinage_member')] per 5 anni. Ogni membro del circolo otterrà [ShowBiasValue('opinion_reformed_circle_coinage')|+=2] [opinion|e] nei nostri confronti, e aumenteremo la Soddisfazione del Circolo di 5."
 reform_coinage_in_circle_effect_text: "[SCOPE.sCountry('actor').GetName] riforma la monetazione del proprio Circolo."
 reform_coinage_in_circle_text_past: "[SCOPE.sCountry('actor').GetName] ha riformato la monetazione del proprio Circolo."

 reduction_of_circle_titles: "Riduzione dei titoli del Circolo"
 reduction_of_circle_titles_desc: "Il nostro circolo è diventato inefficiente e invischiato in titoli e cariche amministrative capaci di ostacolarsi a vicenda. Eseguire una riduzione dei titoli non solo garantirebbe l'efficienza del nostro circolo, ma consoliderebbe anche la nostra posizione di capo. Una tale centralizzazione dei titoli non sarebbe ben accolta dai membri del nostro circolo e ridurrebbe la loro soddisfazione."
 reduction_of_circle_titles_act: "Esegui una riduzione dei titoli del Circolo"
 reduction_of_circle_titles_tt: "Otterremo [ShowModifier('reduction_of_circle_titles')], mentre ogni membro del circolo otterrà [ShowBiasValue('opinion_reduction_of_circle_titles')|+=2] [opinion|e] nei nostri confronti. La Soddisfazione del Circolo sarà ridotta di 5."
 reduction_of_circle_titles_effect_text: "[SCOPE.sCountry('actor').GetName] esegue una riduzione dei titoli del circolo"
 reduction_of_circle_titles_text_past: "[SCOPE.sCountry('actor').GetName] ha eseguito una riduzione dei titoli del circolo"

 challenge_circle_leadership: "Sfida la guida del Circolo"
 challenge_circle_leadership_desc: "Gli attuali capi del nostro Circolo si sono dimostrati indegni della posizione e della responsabilità. Abbiamo l'opportunità di mettere in discussione il loro potere e minare la loro autorità, il che può portare a un ulteriore indebolimento della loro presa o a un'opposizione aperta."
 challenge_circle_leadership_act: "Sfida l'autorità dell'attuale Capo del Circolo."
 challenge_circle_leadership_effect_text: "[SCOPE.sCountry('actor').GetName] sfida la guida del Circolo."
 challenge_circle_leadership_effect_text_past: "[SCOPE.sCountry('actor').GetName] ha sfidato la guida del Circolo."
 challenge_circle_leadership_tt: "Vinciamo la sfida in uno dei seguenti casi:\n  • La soddisfazione del nostro circolo è inferiore a 15 - rivolta aperta\n  • La soddisfazione del nostro circolo è inferiore a 30 e il nostro prestigio è almeno pari al loro\n  • Il nostro prestigio supera il loro di 25 o più\n\nPerdere o ritirarsi costa prestigio. Un capo appena insediato è immune alle sfide per 2 anni."

 appeal_to_emperor: "Appellati all'Imperatore"
 appeal_to_emperor_desc: "Appellati all'Imperatore perché intervenga nella disputa per la guida del tuo circolo."
 appeal_to_emperor_act: "Appellati all'Imperatore perché intervenga nella disputa per la guida del tuo circolo."
